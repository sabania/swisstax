  aufgabe: mandat-start
- text: "Umsatzerlöse durchprüfen – Prüffeld betrieblicher Ertrag."
  aufgabe: prueffeld
  param: SCH1
- text: "Stell die Grundlagen für den Fortführungsentscheid bereit: Unabhängigkeit, Revisionsart, Auftragsbestätigung."
  aufgabe: auftrag
- text: "sch3-301 bitte machen"
