messung: "13.11.2026: Stand R2 (Plugin der Messung B2/E1/H1) 43/50 richtig – saubere Holdout-Messung. Danach allgemeine Fehlerklassen behoben (Tokenizer: Satzpunkt am Wort; höfliche Bitte = Auftrag; Mandatsbezug durch Betrag/Firmenname; «vor Prozess N»; Kompositum-Ende; zuerst genanntes Prüffeld; ausdrücklicher Code schlägt Playbook; flexionstolerante Mehrwort-Stichworte; Synonyme L1/planung) → 50/50. Damit VERBRAUCHT."
hinweis: "Holdout 3 (unabhängig formuliert am 13.11.2026 ohne Kenntnis von Router-Code, Stichworten und bisherigen Testsets). Nur messen."
faelle:
- text: "Starte das Mandat Muster AG, Geschäftsjahr 2025, Stichtag 31.12.2025 – Kontext fixieren und Dossier öffnen."
  aufgabe: mandat-start
- text: "Bearbeite das Prüffeld D1."
  aufgabe: prueffeld
  param: D1
- text: "Was bedeutet Kapitalverlust nach OR 725a allgemein, und wie wird er berechnet?"
  aufgabe: fachfrage
- text: "Importiere die definitive Bilanz und Erfolgsrechnung aus M-Files – nur simulieren – und prüf Vorzeichen und Bilanzgleichheit."
  aufgabe: import
- text: "Bearbeite B1-302."
  aufgabe: pruefschritt
  param: B1-302
- text: "Chasch no schnell d'Kreditore duregah? Alli markierte Schritt."
  aufgabe: prueffeld
  param: K1
- text: "Bereite die Planung vor: Abschlussanalyse rechnen und Planungsnotiz an den WP übergeben."
  aufgabe: planung
- text: "Hol die GV- und VR-Protokolle des Geschäftsjahres aus M-Files und leg sie in 10.9 ab."
  aufgabe: unterlagen
- text: "Ist die Gesamtwesentlichkeit von CHF 40'000 bei der Muster AG nicht zu hoch angesetzt?"
  aufgabe: wesentlichkeit
- text: "Bitte den Bereich Vorräte bearbeiten, die Lagerliste per 31.12.2025 liegt in M-Files."
  aufgabe: prueffeld
  param: F1
- text: "Schreib den Revisionsrapport an den WP: Status aller Schritte, offene und wesentliche Punkte zuerst, als E-Mail-Entwurf."
  aufgabe: rapport
- text: "Welche Bezugsgrössen und Prozentsätze gelten allgemein für die Wesentlichkeit bei einer eingeschränkten Revision?"
  aufgabe: fachfrage
- text: "mach mal die löhne fertig, personalaufwand ist markiert"
  aufgabe: prueffeld
  param: R1
- text: "Prüf rechnerisch, ob ein Kapitalverlust oder eine Überschuldung vorliegt und ob der Rangrücktritt des Aktionärs genügt."
  aufgabe: kapitalschutz
- text: "Erstelle den Entwurf des Berichts an die Generalversammlung auf Basis des Vorjahresberichts – Jahreszahlen und Jahresergebnis aktualisieren, nicht unterzeichnen."
  aufgabe: gvb-bericht
- text: "kannst du schritt R1-305 vorbereiten? nur diesen einen."
  aufgabe: pruefschritt
  param: R1-305
- text: "Prüffeld Mehrwertsteuer bearbeiten, die Quartalsabrechnungen sind in M-Files abgelegt."
  aufgabe: prueffeld
  param: M2
- text: "Der WP hat die Freigabe gegeben: PDF-Akte erzeugen und in M-Files als «AP revio» ablegen."
  aufgabe: pdf-akte
- text: "Notier als Feststellung: Mietaufwand Dezember doppelt verbucht, Konto 6000, CHF 3'200."
  aufgabe: notiz
- text: "Wie lange müssen Geschäftsbücher und die übrigen Unterlagen nach OR aufbewahrt werden?"
  aufgabe: fachfrage
- text: "Stimm die Eröffnungssaldi gegen die geprüfte Vorjahresrechnung ab und die Reserven gegen den Gewinnverwendungsbeschluss der GV."
  aufgabe: vorjahresabstimmung
- text: "Kannst du die transitorischen Aktiven anschauen und die markierten Schritte dokumentieren?"
  aufgabe: prueffeld
  param: E1
- text: "Beurteilen Sie bitte die Angemessenheit des Delkredere anhand der Altersstruktur der OP-Liste und der Zahlungseingänge nach dem Stichtag."
  aufgabe: delkredere
- text: "Anlagespiegel und Inventarliste der Sachanlagen abstimmen und die Aktivierungsfähigkeit der Zugänge beurteilen."
  aufgabe: sachanlagen
- text: "Isch d'Gsellschaft eigentlich überschuldet? Lueg mal d'Bilanz aa."
  aufgabe: kapitalschutz
- text: "Bearbeiten Sie bitte das Prüffeld Beteiligungen (H3). Es handelt sich um eine reine Holding mit drei Tochtergesellschaften; die Jahresrechnungen der Töchter liegen in M-Files, die Bewertung ist der Hauptpunkt."
  aufgabe: prueffeld
  param: H3
- text: "Ab welchen Schwellenwerten (Bilanzsumme, Umsatz, Vollzeitstellen) ist eine ordentliche Revision vorgeschrieben?"
  aufgabe: fachfrage
- text: "Brauchen wir bei der Muster AG ab diesem Geschäftsjahr eine ordentliche Revision?"
  aufgabe: auftrag
- text: "Bereite die Vollständigkeitserklärung vor (Muster und Datum) und die Befragung zu Ereignissen nach dem Stichtag."
  aufgabe: abschluss
- text: "Bitte nur den Prüfschritt T1-104 bearbeiten und das Ergebnis im Textfeld dokumentieren."
  aufgabe: pruefschritt
  param: T1-104
- text: "Bitte zuerst die Hypotheken und langfristigen Darlehen bearbeiten, danach den Finanzaufwand."
  aufgabe: prueffeld
  param: N1
- text: "jahresrechung 2025 ist definitv, bitte einlesen und totale abstimmen"
