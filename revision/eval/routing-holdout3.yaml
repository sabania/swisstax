- text: "was versteht man unter opting-out?"
  aufgabe: fachfrage
- text: "Erfass bitte einen Buchungsvorschlag – Ferienguthaben per Stichtag nicht abgegrenzt, ca. CHF 12'000."
  aufgabe: notiz
- text: "Reicht die Wertberichtigung auf den Kundenforderungen bei diesem Mandat aus?"
  aufgabe: delkredere
- text: "Bitte I1 und H1 bearbeiten (immaterielle Anlagen, Finanzanlagen)."
  aufgabe: prueffeld
  param: I1
