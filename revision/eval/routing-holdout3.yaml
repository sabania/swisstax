  aufgabe: fachfrage
- text: "update bitte das verständnis von unternehmen und umfeld und prüf, ob das tor vor agent-prozess 2 offen ist"
  aufgabe: planung
- text: "Bitte die kurzfristigen Bankschulden bearbeiten (Kontokorrentkredit, Festvorschuss)."
  aufgabe: prueffeld
  param: L1
- text: "Stell die Liste der nicht korrigierten Fehler und die Punkte für die Schlussbesprechung zusammen."
  aufgabe: abschluss
- text: "Bearbeite S1 Steuern und danach O1 Rückstellungen."
  aufgabe: prueffeld
  param: S1
- text: "Was bedeutet ein Prüfungsurteil in negativer Formulierung bei der eingeschränkten Revision?"
  aufgabe: fachfrage
