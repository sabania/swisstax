hinweis: 'Entwicklungsset (selbst formuliert). Holdout-Sets unabhängig erstellen und getrennt messen. Ergänzt 2026-11-13: vier Fälle aus routing-holdout.yaml
  (Bankkonten, überschuldet, ordentliche Revision, Lohnabstimmung AHV), mit denen die Stichworte nachgebessert wurden – das Holdout-Set ist damit verbraucht;
  für die nächste Messung ein neues, unabhängiges Holdout erstellen. Dazu Regressionsfälle Notiz mit Prüffeld und Präfixregel; die drei Notiz-Fälle
  setzen die Code-Korrektur in _aufgabe_finden (notiz trotz Prüffeld-Synonym) voraus.'
