hinweis: 'Regressionstest für `thema` (Matching und Ausgabe), analog routing-test.yaml. Erwartungen aus den Reviews th-1, th-2, th-4, th-7,
  th-9, th-10, th-11 (Code-Vorschläge 2026-11-13), nur soweit sie mit den aktuellen Daten fachlich stimmen. `thema` ist ein Id oder eine Liste
  gleichwertiger Ids (mehrdeutige Begriffe; Hauptsache nicht falsch, z.B. Forderungsverzicht nie delkredere-forderungen). Nicht aufgenommen:
  Art. 727 OR / Art. 727c OR (Stichworte fehlen noch in eingeschraenkte-revision-grundlagen), Art. 729b OR (Revisionsbericht – grundlagen,
  gesetzesverstoesse und hinweispflichten gleich stark), Solidarbürgschaft (Stichwort in fünf Themen), Fremdwährungsdarlehen (fachlich offen).'
