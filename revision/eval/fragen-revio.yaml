- id: r01
  kategorie: Akte/Rollen
  schwierigkeit: leicht
  frage: In welchen Bereichen der revio-4.0-Revisionsakte darf der KI-Revisionsagent selbst etwas erfassen, und was gilt für die übrigen Bereiche wie 3 Planung oder 9 Qualitätssicherung?
  soll:
    antwort: 'Schreibend arbeitet der Agent nur in Bereich 4 (Abschlussprüfung, 29 Prüffelder A1–T1; Kernarbeit Prozess 2: Textfeld, Belege, Notizen) und in Bereich 10 (Unterlagen zum
      Abschluss: Protokoll Vorjahr in 10.9, Vorschläge für die PBC-Liste 10.10, Auswertung der Antworten aus 10.11). Laut Prozesstabelle gibt es eine Ausnahme: Bereich 1 (1.1 Jahresrechnung)
      wird über den Import der Jahresrechnung befüllt (Prozess 1: PDF-Import, Vorzeichen, Kontenzuordnung, Abstimmung). Unklare Zuordnungen erfasst er als Pendenz, und in der Testphase
      hält er nach dem Import zur Kontrolle durch den Menschen an. Die Kennzahlen aus 1.2 nutzt er nur lesend für die Analytik. Alle übrigen Bereiche liest er höchstens, um risikoorientiert
      und kritisch zu arbeiten: 2 Vorbereitung (nur lesen, Empfehlung), 3 Planung (nur lesen; die Wesentlichkeit in 3.3 liest und wendet er an, ändert sie aber nie), 6 Beendigung (nur
      lesen; 6.2 als Leitfaden für die Plausibilisierung), 7 Berichterstattung (nur lesen; Vorgabe für den GVB-Entwurf). Welche dieser Teilbereiche er tatsächlich lesen darf (zusätzlich
      2.1, 2.4, 3.1, 3.4, 3.5, 6.2), ist noch zu entscheiden. In Bereich 9 Qualitätssicherung (9.0 Abschliessende Beurteilung, Archivierungsreife, Schlussvermerk) hat er keine Rolle.
      Auch in den Bereichen 4 und 10 bleiben beim Menschen: das Visum pro Schritt, das ✓ pro Prüffeld, «Abgeschlossen» und «Review» in der Fusszeile sowie der Status in Bereich 10.'
    kernpunkte:
    - Schreibend nur Bereich 4 (Prüffelder) und Bereich 10 (Unterlagen zum Abschluss); Bereich 1.1 nur über den Import der Jahresrechnung (Prozess 1)
    - Alle übrigen Bereiche höchstens lesen (z.B. 3 Planung; Wesentlichkeit 3.3 lesen, nie ändern)
    - 'Bereich 9 Qualitätssicherung: keine Rolle des Agenten'
    - Visum, ✓, «Abgeschlossen»/«Review» und Status in Bereich 10 bleiben beim Menschen
    fehler:
    - Agent dürfe in 3.3 die Wesentlichkeit festlegen oder anpassen
    - Agent bearbeite 6 Beendigung oder 7 Berichterstattung schreibend
    - Agent erstelle in 9.0 die Abschliessende Beurteilung bzw. Archivierungsreife
    - Agent setze in Bereich 10 den Status auf erledigt
