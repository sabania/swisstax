- id: r10
  kategorie: MCP-Werkzeuge
  schwierigkeit: mittel
  frage: Das Dossier ist offen. Mit welchem MCP-Werkzeug lädt der Agent die Prüfungshandlungen des Prüffelds C1, welche Parameter braucht es, und womit holt er die Vorjahresbearbeitung
    zum Vergleich?
  soll:
    antwort: 'Die Prüfungshandlungen des Prüffelds lädt der Agent mit rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId (GET /api/auditActivities/LoadAuditActivities/{containerId}/{templateId}).
      Es braucht die Pfadparameter containerId und templateId, übergeben als path_params_json. Für den Vorjahresvergleich gibt es zwei Werkzeuge: rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId
      für das ganze Prüffeld (gleiche Parameter) und rv_get_auditActivities_GetActivityItemFromPreviousPeriod_by_containerId_by_templateId_by_activityId für einen einzelnen Schritt (zusätzlich
      activityId). Ergänzend liefert rv_get_auditActivities_LoadCoverSheet_by_containerId (containerId) das Deckblatt. Alle sind GET-Werkzeuge. Vorbehalt: Die Werkzeugliste enthält keine
      Beschreibungen. Die Bedeutung ist aus Namen und Pfaden abgeleitet und in der enco-Idee als «Kandidat, zu bestätigen» geführt. Die Ids gibt es erst im echten Dossier: Nach dem Öffnen
      ermittelt der Agent containerId/templateId je Prüffeld und ordnet die geladenen Handlungen per Text und Nummer (z.B. «302») dem Katalog zu. Die Katalognummer C1-302 ist keine revio-Id.'
    kernpunkte:
    - rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId
    - Parameter containerId und templateId (Pfadparameter) aus dem geöffneten Dossier, nicht die Katalognummer
    - 'Vorjahr: rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId (Prüffeld) oder rv_get_auditActivities_GetActivityItemFromPreviousPeriod_by_containerId_by_templateId_by_activityId
      (einzelner Schritt)'
    fehler:
    - rv_get_auditActivities_LoadAuditActivityTemplate (Vorlage statt Dossier)
    - rv_get_auditProcedureCatalog_LoadAuditProcedureCatalog_by_containerDefinitionId (Katalog statt Prüfungshandlungen im Dossier)
    - Katalognummer C1-302 direkt als Id verwenden
    quellen:
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_get_auditActivities_LoadCoverSheet_by_containerId
    - chunk: raw/revio/00_IDEE_Zuordnung_Pruefschritt-revio.md
      zitat: Die Ids der Prüfungshandlungen existieren erst in einem echten Dossier.
    - chunk: raw/revio/00_IDEE_Zuordnung_Pruefschritt-revio.md
      zitat: Dossier öffnen, `containerId`/`templateId` je Prüffeld ermitteln.
    - chunk: konzept-ki-revisionsagent-2026__c011-2
      zitat: '| 2 Markierte Abschlussprüfungen | revio 4 Prüffelder | Prüfschritte nach Typ bearbeiten, Nachweise aus M-Files beschaffen, Ergebnis im Textfeld dokumentieren, Belege ablegen,
        Notizen erfassen | Kein Visum, kein ✓, keine Abschliessende Beurteilung |'
  pruefung: 'korrigiert: Die Werkzeuge stehen in der CSV (Zeilen 20, 21, 23; GET; Pfadparameter containerId, templateId), die Zitate aus der IDEE stimmen. Zwei Schwächen: (1) Die CSV
    hat keine Beschreibungen, und die IDEE führt die Werkzeuge ausdrücklich als «Kandidaten, zu bestätigen». Die Bedeutung «Vorjahresbearbeitung» '
- id: r11
  kategorie: MCP-Werkzeuge
  schwierigkeit: mittel
  frage: Der Agent soll Antworten in einer revio-Checkliste vorbereiten. Mit welchem Werkzeug liest er die Checkliste, mit welchem speichert er die Daten, und darf er den Fragebogen
    danach auf «geschlossen» setzen?
  soll:
    antwort: 'Lesen: rv_get_checklists_LoadChecklist (GET, LoadChecklistRequest mit areaId und checklistId). Speichern: rv_post_checklists_StoreChecklistData (POST, StoreChecklistRequest
      mit der ganzen Checkliste). Das ist ein schreibendes Vorbereiten-Werkzeug und in OpenClaw freigabepflichtig. Schliessen darf der Agent nicht. Die Checkliste selbst kennt in der
      API keinen Zustand «geschlossen»; diesen gibt es nur beim Fragebogen eines Containers (ContainerQuestionnaireDto.isClosed). Gesetzt wird er über rv_post_checklistDefinitions_SetContainerQuestionnaireClosedState
      (containerId, isClosed). Dieses Abschluss-Werkzeug steht unter «Menschlich – nie Agent» und bleibt in OpenClaw gesperrt (vorbereiten ja, abschliessen nie). Achtung: Die Zellen
      einer Checkliste enthalten auch Visumsfelder (isVised, visaUserId, visaDate). Beim Speichern darf der Agent diese nicht setzen; abgesichert wird das zusätzlich über den Dienstbenutzer
      ohne Visumsrecht. Nicht verwechseln: rv_put_checklists_UpdateTemplate ändert die Vorlage, rv_post_checklists_CreateChecklistReport erzeugt einen Bericht.'
    kernpunkte:
    - 'Lesen: rv_get_checklists_LoadChecklist'
    - 'Speichern: rv_post_checklists_StoreChecklistData (schreibend, freigabepflichtig)'
    - 'Kein Schliessen: rv_post_checklistDefinitions_SetContainerQuestionnaireClosedState ist Abschluss und für den Agenten gesperrt'
    fehler:
    - rv_put_checklists_UpdateTemplate verwenden (ändert die Vorlage)
    - rv_post_checklists_CreateChecklistReport zum Speichern verwenden
    - Fragebogen nach dem Ausfüllen selbst schliessen
    quellen:
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_get_checklists_LoadChecklist
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_checklists_StoreChecklistData
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_checklistDefinitions_SetContainerQuestionnaireClosedState
    - chunk: raw/revio/00_IDEE_Zuordnung_Pruefschritt-revio.md
      zitat: Vorbereiten (schreiben, freigabepflichtig in OpenClaw)
    - chunk: konzept-ki-revisionsagent-2026__c011-1
      zitat: 'Jeder Prozess des Pflichtenhefts hat in revio 4.0 einen festen Ort; die Grenze des Agenten ist überall dieselbe: vorbereiten ja, abschliessen nie.'
  pruefung: 'korrigiert: Die Werkzeuge stehen in der CSV (LoadChecklist GET mit LoadChecklistRequest: areaId, checklistId; StoreChecklistData POST mit StoreChecklistRequest: checklist;
    SetContainerQuestionnaireClosedState POST mit containerId, isClosed). Die Zitate aus der IDEE und c011-1 stimmen. Präzisierung: Die Frage ve'
- id: r12
  kategorie: MCP-Sperren
  schwierigkeit: schwer
  frage: Welche revio-MCP-Werkzeuge müssen in OpenClaw für den Agenten gesperrt bleiben? Nenne die Werkzeuge für Siegel, Visum, Archivierung und Review-Freigabe und begründe, warum auch
    revio_call nicht freigegeben werden darf.
  soll:
    antwort: 'Für den Agenten gesperrt (nur Mensch) sind u.a.:

      - Siegel: rv_post_clientsManagement_SealAnualFile, rv_post_clientsManagement_UnSealAnualFile, rv_post_clientsManagement_RequestSeal_by_dossierId, rv_post_workpapers_SetMaterialitySealState,
      rv_post_workpapers_SetAnalyticalAuditProcedureSealedState, rv_post_financialStatement_SetPeriodSealedState.

      - Visum: rv_post_workpapers_SetDeliveryVisa_by_componentId, rv_post_workpapers_StoreDynamicFormPanelVisaState.

      - Archiv: rv_post_clientsManagement_ArchiveDossier, rv_post_clientsManagement_ArchiveDossiers.

      - Freigabe: rv_post_clientsManagement_ApproveGlobalDossierReview_by_dossierId.

      - Abschluss: rv_post_checklistDefinitions_SetContainerQuestionnaireClosedState.


      Weitere Kandidaten aus der Liste: rv_post_clientsManagement_CancelSealRequest_by_dossierId, rv_post_clientsManagement_RequestGlobalDossierReview_by_dossierId_by_reviewerId, rv_post_clientsManagement_RejectGlobalDossierReview_by_dossierId,
      rv_post_clientsManagement_CancelGlobalDossierReviewRequest_by_dossierId, rv_put_workpapers_UpdateDocumentationAttachementSealedState, rv_post_clientsManagement_SetUserSignature.


      Grund: Der Agent setzt nie ein Visum, schliesst nichts ab und gibt nichts frei (Dienstbenutzer ohne Visums- und Freigaberecht). revio_call ist ein generischer Aufruf (method, path,
      path_params_json, query_json, body_json) und kann damit jeden Endpunkt erreichen. Im MCP-Code ist nichts gesperrt; die Sperre läuft nur über OpenClaw allow/deny je Werkzeug und
      das JWT. revio_call würde deshalb die Einzelsperren umgehen und muss ebenfalls gesperrt sein. Zusätzlich gilt: Das Visum pro Prüfschritt ist kein eigenes Werkzeug, sondern ein
      Feld (isVised, visaUserId, visaDate in TemplatedRow/Cell). Es könnte über das Vorbereiten-Werkzeug rv_put_auditActivities_UpdateDossierActivity mitgeschickt werden. Die Werkzeugsperre
      allein genügt also nicht; nötig ist auch das JWT des Dienstbenutzers ohne Visumsrecht (mit revio zu bestätigen).'
    kernpunkte:
    - 'Siegel: rv_post_clientsManagement_SealAnualFile, rv_post_clientsManagement_RequestSeal_by_dossierId (u.a.)'
    - 'Visum: rv_post_workpapers_SetDeliveryVisa_by_componentId, rv_post_workpapers_StoreDynamicFormPanelVisaState'
    - 'Archiv: rv_post_clientsManagement_ArchiveDossier / ArchiveDossiers; Freigabe: rv_post_clientsManagement_ApproveGlobalDossierReview_by_dossierId'
    - revio_call sperren, weil er als generischer Aufruf die allow/deny-Sperre je Werkzeug umgeht (keine Sperre im Code)
    fehler:
    - Die Sperre sei im MCP-Code eingebaut, daher sei revio_call unproblematisch
    - revio_call als harmloses Diagnose-Werkzeug freigeben
    - Nur Visum-Werkzeuge sperren, Siegel/Archiv/Approve freigeben
    - Erfundene Namen wie rv_post_dossier_SetVisum
    quellen:
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_clientsManagement_SealAnualFile
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_clientsManagement_RequestSeal_by_dossierId
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_clientsManagement_ApproveGlobalDossierReview_by_dossierId
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_clientsManagement_ArchiveDossier
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_clientsManagement_ArchiveDossiers
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_workpapers_SetDeliveryVisa_by_componentId
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_workpapers_StoreDynamicFormPanelVisaState
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_workpapers_SetMaterialitySealState
    - chunk: raw/revio/revio-mcp-werkzeuge.csv
      zitat: rv_post_financialStatement_SetPeriodSealedState
    - chunk: raw/revio/revio-mcp-werkzeuge.md
      zitat: Generischer Aufruf (method, path, path_params_json, query_json, body_json)
    - chunk: raw/revio/revio-mcp-werkzeuge.md
      zitat: 'Auth/Rechte: JWT + OpenClaw allow/deny, keine Sperre im Code.'
    - chunk: raw/revio/00_IDEE_Zuordnung_Pruefschritt-revio.md
      zitat: Das wird nicht im MCP-Code gesperrt, sondern über OpenClaw (allow/deny je Werkzeug) und das JWT.
    - chunk: konzept-ki-revisionsagent-2026__c004-1
      zitat: Er setzt nie ein Visum, schliesst nichts ab und gibt nichts frei.
    - chunk: konzept-ki-revisionsagent-2026__c009-3
      zitat: Eigener Dienstbenutzer in revio 4.0 und M-Files ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand; Löschrechte eingeschränkt.
