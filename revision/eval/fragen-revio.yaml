      zitat: 'Visum (Kürzel und Datum) pro Schritt, ✓ pro Prüffeld, «Abgeschlossen» und «Review» in der Fusszeile, Status in Bereich 10: alles bleibt beim Menschen.'
  pruefung: 'korrigiert: Alle 5 Zitate stimmen (pruefe-zitat OK). Fachlich im Kern richtig, aber die Quelle widerspricht sich selbst. c006-1 sagt «schreibend nur Bereich 4 und 10». Nach
