  id: B1-R13
  titel: 'Anhang: verpfändete/zedierte Aktiven (Globalzession Debitoren, Garantiedepot, Mietkaution) nicht offengelegt'
  sachverhalt: 'Die Fiktiva-Bestätigung per 31.12.2025 nennt unter «C. Sicherheiten zu unseren Gunsten»: «Globalzession sämtlicher Debitorenforderungen gemäss Zessionsvertrag vom 12.05.2023
    (stille Zession). Verpfändung Garantiedepot.» Abschnitt A vermerkt beim Garantiedepot (1052, CHF 200.00) «verpfändet».

    Betroffen sind HB 1100 mit CHF 1''150''000.00 (darin das Aktionärsdarlehen von 150''000, das keine L+L-Forderung ist; Debitoren-OP ohne Darlehen 998''750) und 1052 mit CHF 200.00,
    zusammen CHF 1''150''200.00. Zudem ist bei der Testbank das Mietkautionskonto über CHF 200''000 zugunsten der Vermieterin gesperrt.

    Der Anhang 2025 (Ziff. 1–7) enthält dazu keine Angabe. Der Vorjahresanhang (Ziff. 6) legte die Globalzession offen (Buchwert 830''000). Die Prüfakte 2024 hält als Hinweis Folgejahr
    Nr. 7 fest: «Garantien, Globalzession und Bankdarlehen wie 2024 offenlegen.»'
