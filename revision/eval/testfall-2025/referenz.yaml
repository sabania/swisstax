  soll: 'Bestätigen lassen, dass die Bewertungsmethode gegenüber dem Vorjahr unverändert ist (F1-105). Dem VR eine Ergänzung von Anhang Ziff. 4 b) vorschlagen, etwa: «Vorräte werden
    zu Einstandspreisen (gleitender Durchschnitt) bzw. zum tieferen Veräusserungswert bewertet; für schwer verkäufliche Bestände bestehen Wertberichtigungen.» Wurde die Methode geändert,
    ist die Abweichung von der Stetigkeit (Art. 958c Abs. 1 Ziff. 6 OR) im Anhang zu erläutern (T1-306).'
