  titel: 'Darlehen Aktionär A: Zins 1.0 % unter den eigenen Finanzierungskosten, steuerliches Risiko einer geldwerten Leistung (VSt)'
  sachverhalt: 'Die Gesellschaft hat kein freies Eigenkapital und ist fremdfinanziert: 2.0 % auf die Aktionärsdarlehen A/B/D/E, 2.40 % auf DL-2021-044, 2.85 % auf FV-2023-118. An A verleiht
    sie zu 1.0 %, wobei der Zins erst mit der Rückzahlung fällig wird. Das ESTV-Rundschreiben «Steuerlich anerkannte Zinssätze 2026» vom 29.01.2026 verlangt für aus Fremdkapital finanzierte
    Vorschüsse an Beteiligte mindestens «Selbstkosten zuzügl. ¼ – ½ %», mindestens ¾ %. Ungenügend verzinste Darlehen gelten als geldwerte Leistung, die der VSt von 35 % unterliegt (Formular
    102). Das Rundschreiben 2025 liegt nicht im Quellenbestand; der Mindestsatz 2025 ist deshalb nicht bestätigt. Für die Laufzeit 2026 liegt 1.0 % klar unter den Selbstkosten (≥ 2.0
    %).'
