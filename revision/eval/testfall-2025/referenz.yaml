  titel: 'Steuerlich verdecktes Eigenkapital (KS ESTV 6a): Aktionärszinsen nicht abziehbar, geldwerte Leistung mit Verrechnungssteuer 35 %'
  sachverhalt: 'Das zulässige Fremdkapital nach KS 6a, auf Buchwerten berechnet (höhere Verkehrswerte nicht nachgewiesen), beträgt 5''050''864.10: flüssige Mittel 278''007.32 × 100 %,
    Forderungen L+L 1''150''000 × 85 %, übrige kurzfristige Forderungen 260''010 × 85 %, Vorräte und nicht fakturierte DL 4''098''000 × 85 %, ARA 20''000 × 85 %, mobile Sachanlagen 120''159.13
    × 50 %, immaterielle 19''955.31 × 70 %. Bei einem Fremdkapital von 9''124''515.32 ergibt sich ein Überhang von 4''073''651.22. Auch bei Verrechnung der Anzahlungen mit den angefangenen
    Arbeiten (3''900''000) bleiben 3''488''651.22, mehr als die Aktionärsforderungen von 2''750''000. Damit gelten die Darlehen A/B/D/E und die Zinsen steuerlich als verdecktes Eigenkapital.
    Die Zinsen darauf sind gewinnsteuerlich aufzurechnen (KS 6a Ziff. 3.1) und unterliegen als geldwerte Leistung der VSt (Ziff. 3.2). Auf den Vertragszinsen von 48''083.33 ergibt das
    16''829.17, ins Hundert gerechnet 25''891.03; auf den gebuchten 130''000 wären es 45''500. Wann gestundete Zinsen (RR) für die VSt fällig werden, ist offen.'
