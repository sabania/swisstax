  id: M1-a
  titel: 'AHV-Konto 2270: Ausbuchung AB-39 von CHF 85''000 zugunsten Aufwand 5700 ohne Abstimmungsnachweis; vor der Schlussabrechnung gebucht; Schlussabrechnung (Kopie) nicht plausibel'
  sachverhalt: 'Im Kontoblatt 2270 ist am 31.12.2025 die Buchung AB-39 «Ausbuchung Saldo AHV gemäss Abstimmung Schlussabrechnung» erfasst: Soll 2270 / Haben 5700, CHF 85''000.00. Saldo
    vor AB-39: −40''522.75. Ohne AB-39 läge der Schlusssaldo bei 105''000.00 (−40''522.75 + 169''642.22 − 24''119.47); mit AB-39 ergibt sich genau der Saldo der Schlussabrechnung von
    20''000.00. Die genannte Abstimmung fehlt im Dossier.


    (1) Zeitlicher Widerspruch: Die Saldoliste wurde am 14.02.2026 exportiert und weist 2270 bereits mit 20''000 aus. Die Schlussabrechnung liegt nur als «Kopie» vor und datiert vom
    26.02.2026.


    (2) Die Kontoblätter sind nicht deckungsgleich. Kontoblatt 1010 bucht BA-1202 vom 03.12.2025, «Zahlung Ausgleichskasse Akonto 12/2025», 60''078.00 gegen 2270; der Bankauszug 1010
    bestätigt die Zahlung. Im Kontoblatt 2270 betragen die Dezember-Belastungen ohne AB-39 jedoch nur 24''119.47 (SB-12). Die Zahlung kann darin nicht enthalten sein.


    (3) Plausibilität der Schlussabrechnung: Die Beiträge von 376''472.40 entsprechen 12.94 % der gemeldeten Lohnsumme von 2''910''000. Nach den BSV-Sätzen 2025 ergeben sich mindestens
    395''434.40 ohne Verwaltungskosten: AHV/IV/EO 10.6 % = 308''460.00, ALV 2.2 % auf 2''895''200 (Plafond 148''200 je Person) = 63''694.40, FAK AG mindestens 0.8 % = 23''280.00. Das
    sind 18''962.00 mehr als abgerechnet.


    (4) Analytik 5700: Nach AB-39 beträgt der Aufwand 200''000, das sind 6.60 % der AHV-pflichtigen Lohnsumme von 3''030''000 (VJ 400''000 / 5''404''000 = 7.40 %). Der gesetzliche Mindest-AG-Anteil
