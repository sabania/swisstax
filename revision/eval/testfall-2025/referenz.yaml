  - G_Anlagevermoegen/Rechnung_ITF-25-0512_Server_Notebooks.md Z. 6–11 (Adressat), Z. 18–24 (Positionen), Z. 26 (Vermerk «Konto 1520, bezahlt 30.05.2025»)
