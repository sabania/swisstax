- bereich: vorraete
  id: F1-g
  titel: 'Zähllisten 1–3, 5 und 6 fehlen; Pauschalposition V-DIV und runde Totale nur dank Fehlern: Mengennachweis unvollständig'
  sachverhalt: 'Laut Inventurprotokoll gibt es die «Zähllisten 1–6, unterzeichnet». Im Dossier liegt nur der Scan der Nr. 4 (laut Belegverzeichnis, Register D), und gerade diese zeigt
    bereits eine Übertragungsdifferenz (F1-a). Die Kontentotale sind auffällig rund. 1202 ergibt 40''000 nur wegen des Übertragungsfehlers (korrekt 35''750). 1205 ergibt 28''000 nur
    wegen der ungezählten Pauschalposition V-DIV «Kleinmaterial diverses (Schätzung)», 1 pausch. × 10 = 10; die gezählten Positionen ergeben 27''990. 1201 ist mit 150''000 um 2''000
    zu hoch (F1-b). Beide Fehler wirken in dieselbe Richtung, nämlich höher. Im Vorjahr fanden sich ähnliche Ausgleichsgrössen (M-DIV pauschal 60 bei Marktpreis 0, W-HB6 Einstand 1''169.0909).
    Weil AB-33 die Buchsaldi «gem. Inventar» anpasst, beweist die Übereinstimmung Inventar = Hauptbuch selbst keine Angleichung. Die Muster sind aber ein Prüfrisiko. Das Inventurprotokoll
    ist «Wil, 31.12.2025» datiert, nennt aber bereits den Übertrag vom 12.01.2026; es wurde also nachträglich ergänzt oder erstellt. Belege zu den Einstandspreisen (Lieferantenrechnungen)
    fehlen. Die Revisionsstelle hat 2025 keine Kontrollzählung vorgenommen (VJ: ja); das ist zulässig, verstärkt aber die Bedeutung der Zähllisten.'
  nachweis:
  - D_Vorraete/Inventurprotokoll_31.12.2025.md Z. 13 (Zähllisten 1–6, unterzeichnet; Übertrag 12.01.2026) und Z. 16 (Wil, 31.12.2025)
  - '00_Allgemein/Belegverzeichnis.md Z. 38–40 (Register D: nur Zählliste Nr. 4)'
  - D_Vorraete/Inventarliste_31.12.2025.md Z. 19–23 (1205-Positionen inkl. V-DIV 1 pausch. × 10) und Z. 24–28 (Totale 150000/40000/28000/−20000/198000)
  - VJ fiktive-zahlen-ag-2024/text/F_Vorraete_Angefangene_Arbeiten/F-01_Inventarliste_31.12.2024.md Z. 15 (M-DIV 60, Marktpreis 0) und Z. 18 (W-HB6 1169.0909)
  - VJ fiktive-zahlen-ag-2024/text/F_Vorraete_Angefangene_Arbeiten/F-03_Inventurprotokoll_31.12.2024.md Z. 9 (Kontrollzählung durch Revisionsstelle)
  soll: 'Pendenz (PBC): Die unterzeichneten Zähllisten 1–3, 5 und 6 einverlangen und sämtliche Mengen mit der Inventarliste abgleichen; nach dem Fehler in Nr. 4 ist die Stichprobe auszuweiten.
    Die Position V-DIV herleiten lassen oder streichen. Die Buchhaltung (S. Beispielwalder) zu Ablauf von Übertrag und Abstimmung befragen, insbesondere ob nach der Zählung Werte angepasst
    wurden. Klären, wann das Inventurprotokoll erstellt bzw. ergänzt wurde. Der WP prüft stichprobenweise Einstandspreise mit Lieferantenrechnungen (F1-302). Weitere Differenzen sind
    in die Fehlerzusammenstellung aufzunehmen.'
