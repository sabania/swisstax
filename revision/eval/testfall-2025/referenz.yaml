    Bewegungen brutto nachbuchen, mit den Gegenkonten gemäss Auszug. Per 31.12.2025 mindestens: 1015 an [Gegenkonto gemäss Auszügen] CHF 4''812.55. Die flüssigen Mittel betragen neu
    CHF 282''819.87 vor den übrigen Korrekturen, nach B1-R02 und B1-R04 CHF 281''965.71. Die Befragung von GF und Leiterin Finanzen (wer hat das Konto eröffnet und wofür; Herkunft der
    15''000 Musterpay und der 20''000 SolarTech) schriftlich festhalten. In die Vollständigkeitserklärung eine Liste aller Bank- und Online-Konten aufnehmen. Ob der Befund wesentlich
    ist, entscheidet der WP erst nach Vorliegen der Auszüge.'
