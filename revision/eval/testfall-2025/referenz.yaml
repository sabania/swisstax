    im Konto 2010 oder in der Liste 2300 (nur Strom, Telefon und Treuhand, total 15''000). Es fehlen also Verbindlichkeiten von CHF 70''950. Im Vorjahr enthielt 2300 vergleichbar «Montageleistungen
    Dezember (Rapporte)» über CHF 64''000; der Fehlertyp entspricht der Vorjahreskorrektur U1. GM-25-0455 fehlt zudem im Kreditorenjournal Januar 2026 (Total 186''172.50, nachgerechnet),
