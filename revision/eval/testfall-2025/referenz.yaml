  soll: 'Als Pendenz nachzuweisen ist, dass Server und Notebooks der Gesellschaft gehören und im Betrieb genutzt werden: Lieferschein bzw. Lieferadresse, Serien- und Inventarnummern,
    Zahlungsbeleg vom 30.05.2025 ab Gesellschaftskonto sowie eine Bestätigung bzw. Rechnungskopie des Lieferanten. Eine Sichtprüfung erfolgt nur nach WP-Freigabe (G1-306). Abzugleichen
    ist mit ITF-24-0512, um eine Doppelaktivierung auszuschliessen. Einzuholen ist eine auf die Gesellschaft lautende Rechnung; sie ist auch Voraussetzung für den Vorsteuerabzug, vgl.
