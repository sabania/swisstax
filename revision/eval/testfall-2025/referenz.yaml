    → −770''309.91 (bis −874''459.91); Eigenkapital −3''178''383.56 → −3''321''923.30 (bis −3''426''073.30). Vorjahres-Wesentlichkeit 80''000, Toleranz 60''000, Nichtaufgriffsgrenze
