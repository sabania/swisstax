  id: K-02
  titel: Kulanzgutschrift an Kunstrasen Fiktiv AG über CHF 33'200 (12.02.2026, Mängelrüge) ist wertaufhellend und im Abschluss 2025 nicht berücksichtigt
  sachverhalt: Die Rechnung RE-2025-0499 vom 23.12.2025 an die Kunstrasen Fiktiv AG über CHF 33'200 wurde gegen 3200 gebucht. Sie wurde also erst nach der Klageankündigung (27.11.2025)
    und nach der Aktennotiz (18.12.2025) gestellt. Per 31.12.2025 steht sie ohne Bemerkung in der Debitoren-OP (D-1061). Am 12.02.2026 wurde sie mit GS-2026-003 «Gutschrift Kunstrasen
    Fiktiv AG RE-2025-0499 (Kulanz Mängelrüge)» vollständig gutgeschrieben (Haben 1100 / Soll 3200, Jahr 2026). Ursache ist die Mängelrüge, die am Bilanzstichtag schon bestand. Im Abschluss
    2025 fehlen deshalb Wertberichtigung bzw. Erlösminderung, und die Aktennotiz zur Rückstellung 2330 erwähnt die Faktura nicht. Offen ist, ob die Gutschrift Teil des erwarteten Vergleichs
    von rund CHF 75'000 ist oder zusätzlich dazukommt.
