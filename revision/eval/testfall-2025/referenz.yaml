    Nebenleistungspflichten). (4) Ein VR-Beschluss zum Erwerb: Für 2025 liegen nur die Protokolle der ao GV vom 20.01.2025 und der oGV vom 20.06.2025 vor, beide ohne Erwähnung. Auch
    der im Darlehensvertrag A genannte VR-Beschluss vom 10.10.2025 fehlt. (5) Die unterzeichnete JR 2025 der Tochter sowie die Angabe, ob sie revidiert ist oder ein Opting-out besteht.
    Für die Käuferin haben L. Testmüller (GF) und P. Testmann (VR-Präsident) unterzeichnet. Die Bankbestätigung der Testbank («Kollektiv zu zweien») belegt nur die Bankvollmacht, nicht
