  id: G1-c
  titel: Anlagezugang ITF-25-0512 (24'000, aktiviert auf 1520) beruht auf einer Rechnung an den Geschäftsführer persönlich – Verfügungsmacht und betriebliche Nutzung nicht belegt
  sachverhalt: 'Die Rechnung ITF-25-0512 der IT-Service Fiktiv GmbH vom 12.05.2025 (Server Rack 2HE inkl. Installation 13''980; 6 Notebooks 14" inkl. Docking 8''221; Total 24''000) ist
    adressiert an «Herr Lukas Testmüller, Rosenweg 14, 9999 Testhausen», nicht an die Gesellschaft (Fiktivstrasse 10, 9500 Wil SG). Trotzdem ist sie mit KR-0515 vom 15.05.2025 als Zugang
    1520 an 2000 24''000 aktiviert und im Anlagenverzeichnis als «Server und Notebooks neu (ITF-25-0512)» geführt. L. Testmüller ist Geschäftsführer, gemäss Aktienbuch aber kein Aktionär.
    Weitere Indizien: Die Rechnungsnummer und der Inhalt («6 Notebooks») gleichen dem VJ-Zugang ITF-24-0512 («6 Notebooks und Firewall», 21''000). Das Rechnungstotal ist rund, die MWST
    rechnerisch falsch (G1-d). In der Akte fehlen Lieferschein, Inventar- oder Seriennummern und Standortnachweis. Offen ist auch, welcher Server ersetzt wurde: Der Server von 2022 (33''448.58)
    steht weiterhin im Anlagenverzeichnis.'
