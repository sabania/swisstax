  soll: 'Die Überschuldung ist nicht im Ausmass der Überschuldung durch Rangrücktritte samt Stundung gedeckt (Art. 725b Abs. 4 Ziff. 1 OR). Der VR muss unverzüglich geprüfte Zwischenabschlüsse
    erstellen (A1-03) und das Gericht benachrichtigen, sofern nicht sofort zusätzliche Rangrücktritte samt Stundung über mindestens den (nach Korrekturen neu berechneten) Fehlbetrag
    inkl. Zinsen beigebracht werden oder begründete Aussicht auf Behebung innert 90 Tagen nach Vorliegen der geprüften Zwischenabschlüsse besteht (Abs. 4 Ziff. 2). Anhang Ziff. 6 korrigieren
    (Überschuldung, Kapitalverlust, tatsächliche RR-Deckung). Revisionsstelle: VR schriftlich auf seine Pflichten hinweisen; bei Untätigkeit und offensichtlicher Überschuldung Anzeige
    nach Art. 729c OR; Zusatz/Hinweis Überschuldung im Bericht; Konsultation (alles Entscheid WP).'
