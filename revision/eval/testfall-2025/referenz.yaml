  soll: 'Pendenz: Urkunden, Statuten, HR-Auszug und SHAB, Zeichnungsscheine, Prüfungsbestätigung nach Art. 652f OR und Kapitaleinzahlungsbestätigung einholen und den massgebenden Ausgabebetrag
    feststellen.

    Ist der GV-Beschluss mit 3''213''333 massgebend, ist 2962 um 100''000 zu hoch. Dann den Rechtsgrund der Mehreinzahlung klären:

    - Rückforderung: Fremdkapital, Buchung z.B. 2962 an Verbindlichkeit ggü. Aktionär 100''000;

    - Zuschuss: gesetzliche Kapitalreserve nach Art. 671 Abs. 1 Ziff. 3 OR, gesondert.

    Trifft der Bericht zu, muss das Protokoll bzw. die Urkunde berichtigt werden. Die Formmängel (Art. 650 Abs. 2 Ziff. 5, 634a Abs. 3, 633 Abs. 2 OR) beurteilt der WP. Unterlagen in
    die Dauerakte.'
