  sachverhalt: Die Zählliste Nr. 4 (Lagerplatz Regal C / Wechselrichter + Speicher, 31.12.25 10:40, gezählt von S. Teststätter / L. Testinger, Vermerk «nachgezählt ✓») weist für W-IV5K
