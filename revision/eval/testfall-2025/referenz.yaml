- bereich: darlehen
  id: N1-c
  titel: Rangrücktritt B (Muster Holding AG) am 30.11.2025 trotz fortbestehender Überschuldung von CHF 800'000 auf CHF 500'000 reduziert
  sachverhalt: 'Die RR-Erklärung B vom 30.11.2025 (Konto 2452) «ersetzt die Rangrücktrittserklärung vom 28.02.2025 (CHF 800''000). Der Rangrücktritt wird im Einvernehmen mit dem Verwaltungsrat
    auf CHF 500''000 reduziert, da der Gläubiger einen Teilbetrag für eigene Investitionen benötigt.» Die ersetzte Erklärung (VJ L-04) war «unwiderruflich und gilt bis zur Beseitigung
    der Überschuldung gemäss geprüfter Bilanz». Die Ausnahmebedingungen nach HWP ER Rz 425 fehlen alle: kein geprüfter Zwischenabschluss mit entsprechend kleinerer Überschuldung (die
    Überschuldung besteht weiter, Jahresverlust 2025 -626''770.17), keine schriftliche, begründete VR-Erklärung zu fehlenden Verlusten in den nächsten 12 Monaten, und die übrigen RR-Gläubiger
    werden benachteiligt. Ein VR-Protokoll zur Zustimmung liegt nicht in der Akte. Das Darlehen 2452 steht unverändert bei 800''000; 300''000 plus anteiliger Zins von 5''500.00 (300/800
    × 14''666.67) sind damit nicht mehr nachrangig. Laut Vertrag Ziff. 4 ist das Darlehen mit 6 Monaten kündbar, und der Text deutet einen Rückzahlungswunsch an. 2025 ist keine Rückzahlung
    gebucht; Kontoblätter 2452 und Fiktiva-Auszüge 2026 fehlen.'
