    stimmt). Stempel «EINGANG 08. JAN. 2026», Vermerk «Kto 4401 / P-2025-12 ok LT». Die Textfassung des Scans enthält keine Transkription, deshalb am Original-JPG geprüft. Erfasst wurde
    die Rechnung am 08.01.2026 in neuer Rechnung (Kreditorenjournal Januar 2026, Konto 4401; Kontoblatt 2000/2026 Haben 48''600). Bezahlt am 28.01.2026 ab 1011. Sie fehlt in der Kreditoren-OP-Liste
    31.12.2025 (Total 1''160''000, kein Posten K-2045, gedruckt 09.01.2026), in der Liste 2300 (15''000: Strom 3''200, Telefon 1''800, Treuhand 10''000) und in 2010 (8''000, nur Sammelbuchungen).
    Die Rechnung war vor dem Saldolisten-Export vom 14.02.2026 bekannt. Folge: Aufwand 2025 um netto 44''958.37 zu tief, Verbindlichkeiten um 48''600 zu tief. Gemäss Anhang Ziff. 4a
    werden die Herstellkosten der Projekte aus den IST-Einzelkosten gemäss Buchhaltung ermittelt; damit fehlt der Betrag voraussichtlich auch in den Einzelkosten von P-2025-12 (Bilanzwert
    zu Herstellkosten, 18 % GK-Zuschlag). Der gleiche Fehlertyp trat im Vorjahr auf (EF-2024-701, 28''400, Umbuchung U1).'
