    die VJ-Gesamtwesentlichkeit von 80''000. Nicht belegt ist ein allfälliger Zins auf dem Darlehen Muster Holding (2450, 1.5 %, VJ L-01) für den 01.–20.01.2025 bis zur Verrechnungsliberierung:
    rund 1''916.67 (30/360), weder gebucht noch erwähnt. Ist er geschuldet, beträgt die Überabgrenzung netto 80''000.00. In 2170 steckt weiter die VJ-Rundungsdifferenz von 1''291.67
    (gebucht 20''000, berechnet 18''708.33, VJ L-03, damals unter NAG). Eine Zinsberechnung 2025 fehlt in der Akte. Der gebuchte Satz von 5 % läge zudem über dem Safe-Haven 2026 für
