  id: P1-02
  titel: Rangrücktritt Aktionär B während laufender Überschuldung von CHF 800'000 auf CHF 500'000 reduziert
  sachverhalt: 'Die RR-Erklärung B (Muster Holding AG) vom 30.11.2025 ersetzt die Erklärung vom 28.02.2025 über 800''000. Sie reduziert den Rangrücktritt «im Einvernehmen mit dem Verwaltungsrat»
