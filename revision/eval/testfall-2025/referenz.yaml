  - 'VJ 2024 text/01_Kommunikation_Bericht/1-01_Pruefakte_2024_Revio_ausgefuellt.md: 5.8 Nr. 2 «Änderungen kritisch prüfen»'
  soll: Reduktion nicht anerkennen. Für die Beurteilung nach Art. 725b OR zählt nur, was rechtsgültig nachrangig ist; bis zur Klärung nur 500'000 anrechnen. Vom VR verlangen, dass der
