  sachverhalt: In der Bilanz der Jahresrechnung 2025 (PDF, Seite 2, im Originalbild geprüft) steht unter «Langfristige verzinsliche Verbindlichkeiten» nur 2450 mit 0.00 (VJ 2'300'000.00).
    Das «Total Langfristige verzinsliche Verbindlichkeiten» lautet 0.00 (VJ 2'300'000.00). «Total Langfristiges Fremdkapital» weist dagegen 3'079'915.32 (VJ 3'079'915.32) aus. Die gezeigten
    Zwischentotale ergeben 0 + 2'750'000 + 40'000 = 2'790'000; Differenz 289'915.32 = Konto 2400. Im Vorjahr sind es 2'550'000, Differenz 529'915.32. Das von der Bank bestätigte Darlehen
    ist in der Bilanz nicht ersichtlich. Die Vorjahreszahl des Zwischentotals weicht von der unterzeichneten Jahresrechnung 2024 ab (dort 2'829'915.32 inkl. «2400 Langfristiges Bankdarlehen
    529'915.32»). Die Saldoliste führt 2400 korrekt in der Gruppe.
