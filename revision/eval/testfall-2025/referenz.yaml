    In der Bilanz 2025 enthält dieser Abschnitt nur 2450 (0.00 / 2''300''000.00), das Total lautet 0.00 / 2''300''000.00. Das Total Langfristiges Fremdkapital von 3''079''915.32 (2025:
    0 + 2''750''000 + 40''000 + 289''915.32; VJ: 2''300''000 + 250''000 + 529''915.32) enthält 2400 rechnerisch; nur Zeile und Zwischentotal fehlen. Die VJ-Spalte weicht von der unterzeichneten
