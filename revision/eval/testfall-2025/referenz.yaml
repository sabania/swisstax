  - H_Kreditoren/Kreditorenjournal_Januar_2026.md Z. 7–8, Z. 10–18
  - 00_Allgemein/Kontoblaetter_Folgejahr_Jan_Feb_2026.md Z. 32 (Auszug Januar), Z. 35–39 (GM-25-0455, HMV-114611 15.01.2026, ZA-01 761'850)
  - A_Fluessige_Mittel/Kontoauszug_Testbank_1011_CHF_Januar_2026.md Z. 36–44, 49–52, 63, 65, 95
  - 00_Allgemein/Belegverzeichnis.md Z. 13, Z. 22 (nur 1011 Januar 2026)
  - H_Kreditoren/Kreditoren_OP_Liste_31.12.2025.md Z. 11–23
  soll: 'Folgende Unterlagen einfordern: vollständigen Systemauszug des Kreditorenjournals und des Kontoblatts 2000 von Januar bis zum Prüfungsdatum (mindestens Februar 2026), Kontoauszug
    1010 Januar 2026, aktuelle OP-Liste (K1-407). Die Zusammensetzung von ZA-01 (Differenz 36''800) und die Verbuchung der Zahlung ST-25-10012 ohne erfasste Rechnung klären (möglicher
    Sollsaldo K-2004). Die Ursache des unvollständigen Journals erfragen. Die Durchsicht der neuen Rechnung auf weitere Leistungen 2025 ausdehnen. Die Zahlung der übrigen OP von 497''550
    nachweisen.'
