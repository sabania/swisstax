- bereich: liquiditaet
  id: B1-R01
  titel: Testbank-Konto «Kontokorrent Projekte» (CHF 4'812.55) nicht erfasst
  sachverhalt: 'Die Bankbestätigung der Testbank Ostschweiz per 31.12.2025 umfasst laut eigenem Text «sämtliche bei uns auf den Kunden lautenden Konten und Verträge». Sie führt das Konto
    CH00 9990 1000 0010 1500 0 «Kontokorrent Projekte» (eröffnet 02.09.2025) mit CHF 4''812.55 auf. In Saldoliste, Hauptbuch (Inhalt: nur 1010–1014, 1030–1032, 1052) und Bilanz gibt
    es kein solches Geldkonto, und in Register A liegt kein Auszug dazu. Im Vorjahr bestätigte die Testbank: «Weitere Konten, Kredite, Garantien oder Sicherheiten bestehen nicht.» Das
    Konto ist also 2025 neu und nie erfasst worden. Die Bewegungen vom 02.09. bis 31.12.2025 sind unbekannt.

    Zwei Zahlungen lassen sich keinem erfassten Konto zuordnen und deuten auf dieses Konto hin:

    - Musterpay-Screenshot, 18.12.: «Übertrag Testbank + CHF 15''000.00». Weder die vollständigen Dezember-Auszüge 1011 und 1012 noch das HB 1013 zeigen eine Belastung (vgl. B1-R06).

    - Anzahlung SolarTech AZ-25-0388 über CHF 20''000, laut Lieferant am 08.12.2025 bezahlt, erscheint weder im Auszug 1011 noch im Auszug 1010 (vgl. B1-R11).

    Die flüssigen Mittel sind um mindestens CHF 4''812.55 zu tief. Die Vollständigkeit der Erträge, Aufwände und Zahlungen von September bis Dezember 2025 lässt sich nicht beurteilen.'
