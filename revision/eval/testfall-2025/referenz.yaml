  id: P1-15
  titel: Agio als «Kapitalrücklagen» statt «gesetzliche Kapitalreserve» ausgewiesen; KER nicht nachgewiesen
  sachverhalt: 'Das Agio von 3''233''333 steht als «2962 Kapitalrücklagen» in der Bilanz (JR Z. 234). Die Mindestgliederung verlangt die Bezeichnung «gesetzliche Kapitalreserve» (Art.
    959a Abs. 2 Ziff. 3 lit. b OR). Die Kontonummer 2962 liegt zwischen 2950 gesetzliche Gewinnreserve und 2970 Vortrag.

    Der VJ-Hinweis 5.8 Nr. 6 verlangte ausdrücklich den Ausweis als gesetzliche Kapitalreserve (nicht freiwillige Gewinnreserve).

    Der Antrag VR bezeichnet die Ausschüttung als verrechnungssteuerfrei (KER). Eine Meldung oder Bestätigung der KER durch die ESTV liegt nicht vor; eine Untergliederung in KER und
    übrige Kapitalreserven fehlt.

    Die Kosten der Kapitalerhöhung (Notar, HR, ggf. Emissionsabgabe) sind weder im Agio noch gesondert ersichtlich.'
  nachweis:
  - 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md Z. 234
