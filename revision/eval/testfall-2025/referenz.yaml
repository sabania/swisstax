  id: B1-R07
  titel: 'Sparkonto Reserve 1013: kein Stichtagsauszug, HB-Sammelbuchungen ohne Bankbeleg, Zins und VSt nicht belegt'
  sachverhalt: 'Für 1013 liegt nur der Auszug Juni 2025 vor (01.–30.06.2025, Saldo 19''981.43, keine Bewegungen). Das HB bucht von Januar bis November monatliche Zu- und Abgänge gegen
    1011 (total 40''350.54 bzw. 40''369.11, netto −18.57), im Juni 5''494.34 bzw. 5''485.04. Der Juni-Auszug zeigt diese Bewegungen nicht. Abweichungen HB/Bank:

    - 31.05.: HB 19''982.74, Bank 19''981.43 (Differenz 1.31)

    - 30.06.: HB 19''992.04, Bank 19''981.43 (Differenz 10.61)

    Der Saldo per 31.12.2025 von CHF 30''000.00 ist durch die Bankbestätigung belegt (Zins 0.15 %) und rechnerisch erklärbar: 19''981.43 + 10''000 + 28.57 − 10.00. Ein Zinsausweis fehlt,
    also sind der Bruttozins von 28.57 (auf 6970) und die VSt von 10.00 (auf 1176) unbelegt. Ob überhaupt VSt abgezogen wurde, ist offen: Für kleine Zinsbeträge sieht das VStG eine Ausnahme
    vor (im Wiki keine Fundstelle, durch die Fachperson zu bestätigen). Die Belegnummern weichen ab (1176 BA-1213, 1013 BA-1203). ER und Saldoliste weisen 6970 Zinsertrag mit 0.00 aus
    (vgl. B1-R19).'
