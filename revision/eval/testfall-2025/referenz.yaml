- bereich: vorraete
  id: F1-d
  titel: Bestandesänderungen 4207–4209 «(interim)» in der ER nicht mit AB-33 und der Bilanzveränderung abstimmbar (Differenz 114'000)
  sachverhalt: 'Mit AB-33 vom 31.12.2025 wurde gebucht: 1201 Haben 50''000 an 4207, 1290 Soll 20''000 an 4207, 1202 Haben 40''000 an 4208, 1203 Haben 30''000 an 4209 und 1205 Haben 52''000
    an 4300. In ER-Vorzeichenlogik ergäben sich allein daraus 4207 −30''000, 4208 −40''000 und 4209 −30''000, zusammen −100''000. Saldoliste und Jahresrechnung zeigen dagegen 4207 +6''000,
    4208 +8''000 und 4209 0, zusammen +14''000. Die Differenzen betragen 36''000, 48''000 und 30''000, zusammen 114''000. Die ER weist damit eine Bestandeszunahme aus, obwohl die Vorräte
    netto um 152''000 abnahmen (350''000 auf 198''000). Die Summe aller ER-Konten (−626''770.17) stimmt mit dem Bilanzergebnis überein. Die Differenz muss also aus weiteren, nicht dokumentierten
    Buchungen in diesen Interimskonten stammen; Kontoblätter der ER-Konten fehlen im Dossier (Hauptbuch: nur Bilanzkonten und 8510). Die Abnahme von 1205 ist über 4300 statt über ein
    Bestandesänderungskonto gebucht. Auch im Vorjahr stimmten die Konten nicht: 4207 −40''000 bei Δ1201 −60''000, 4208 0 bei Δ1202 −15''000. Ein separater Ausweis der Bestandesänderung
    Handelswaren ist nicht vorgeschrieben (HWP BuR Rz 232). Es geht also um Nachvollziehbarkeit und Klarheit, nicht um einen belegten Ergebnisfehler.'
  nachweis:
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Z. 598, 609, 620, 631, 642 (AB-33)
  - 00_Allgemein/Saldoliste_2025.md Z. 97–99 (4207 6000, 4208 8000, 4209 0) und Z. 104 (4300 −1000000)
  - 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md Z. 260–262 (Bestandesänd. … (interim))
  - VJ fiktive-zahlen-ag-2024/text/07_Unterlagen_zum_Abschluss/7-03_Saldobilanz_2024_HBI_HBII.md Z. 21–25 und 79–80
  soll: 'Pendenz: Kontoblätter 4201–4209 und 4300 für 2025 einverlangen, die übrigen Buchungen in den Interimskonten erklären lassen und die Bestandesänderung mit der Bilanzveränderung
    abstimmen. Diese beträgt −152''000 inkl. WB-Auflösung 1290 +20''000, nach den Korrekturen F1-a/F1-b −158''250. Interimskonten bereinigen. Die Bestandesänderung Handelswaren entweder
    einheitlich über 4207–4209 zeigen oder im Materialaufwand zusammenfassen; die Bezeichnung «(interim)» gehört nicht in die publizierte Jahresrechnung. Die Bereinigung ist voraussichtlich
    ergebnisneutral (Querbezug SCH2).'
