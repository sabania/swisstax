  soll: 'Die WP führt den Werthaltigkeitstest durch (H3-302, nur Mensch). Die Anzeichen nach HWP BuR Rz 290 sind erfüllt. Massgebend ist der erzielbare Wert (Rz 291); vereinfacht genügt
    eine Substanzwertbetrachtung oder eine einfache Ertragswertrechnung (Rz 292). Stützt keine belastbare Ertrags- oder Planungsrechnung einen höheren Wert, ist mindestens auf den Substanzwert
    von 12''000 wertzuberichtigen (Art. 960 Abs. 3 und Art. 960a Abs. 3 OR). Buchung: Finanzaufwand bzw. Wertberichtigungen auf Positionen des Anlagevermögens an Wertberichtigung Beteiligung
    (z. B. 1489) CHF 18''000. Folgen: Jahresverlust −626''770.17 → −644''770.17; Eigenkapital −3''178''383.56 → −3''196''383.56; Bilanzsumme 5''946''131.76 → 5''928''131.76. Quantitativ
    liegt der Betrag über der NAG von 8''000 und unter der Toleranzwesentlichkeit von 60''000 (VJ-Werte). Qualitativ gilt laut VJ-Planung jede Abweichung als wesentlich, welche die Deckung
