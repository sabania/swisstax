- bereich: eigenkapital
  id: P1-11
  titel: Emissionsabgabe auf der Kapitalerhöhung ungeklärt – Antrag ohne Verlustverrechnung gefährdet den Sanierungsfreibetrag
  sachverhalt: 'Der gebuchte Zufluss aus der Kapitalerhöhung 2025 beträgt 3''313''333 (GV-Protokoll: 3''213''333). Es liegen weder eine Abgabedeklaration noch ein Nachweis der Befreiung
    noch eine Rückstellung vor (2340 = 0; 2330 von 45''000 betrifft laut Register K den Rechtsfall). VJ P1-309 und VJ-Hinweis 5.8 Nr. 6 sind unerledigt.

    Der einmalige Freibetrag beträgt 1 Mio. (Art. 6 Abs. 1 lit. h StG). Ohne Sanierungsfreibetrag ergibt sich eine Abgabe von 1 % × (3''313''333 − 1''000''000) = 23''133.33; auf Basis
    GV 22''133.33. Der Betrag ist höher, falls der Freibetrag bei der Gründung bereits teilweise beansprucht wurde.

    Der Sanierungsfreibetrag (Art. 6 Abs. 1 lit. k StG) setzt voraus, dass die Sanierungsleistungen zwingend mit den bestehenden Verlusten verrechnet werden. Die Verrechnung muss spätestens
    an der oGV beschlossen werden, welche die JR der Sanierungsperiode 2025 genehmigt (KS ESTV 32a Ziff. 3.3.2).

    Der Antrag VR sieht einen Vortrag ohne Verrechnung und eine Ausschüttung aus dem Agio vor (P1-04); die Voraussetzung wäre damit nicht erfüllt. Laut Q&A Rechnungslegungsrecht ist
    ohne Verrechnung die Emissionsabgabe geschuldet.'
