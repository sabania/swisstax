  titel: Lieferantenrabatte und -gutschriften CHF 28'614 als ausserordentlicher Ertrag (8510) statt als Einkaufspreisminderung ausgewiesen
  sachverhalt: 'Konto 8510 A.o. Ertrag enthält zwei Buchungen mit Gegenkonto 2000. KR-0630 vom 30.06.2025 «Rabatt Lieferanten (nachträglich)» 17''763 und KR-0831 vom 31.08.2025 «Rückerstattungen
    / Gutschriften aus Lieferungen & Leistungen» 10''851, zusammen 28''614. Im Anhang Ziff. 3 sind beide als ausserordentlicher Ertrag erläutert. Es handelt sich um Einkaufspreisminderungen
    aus der ordentlichen Geschäftstätigkeit, die nach HWP in den Material- bzw. Warenaufwand gehören; die Begriffe ausserordentlich, einmalig und periodenfremd sind eng auszulegen (^[hwp-bur-2023__rz-0800-s330-t2]).
    Im Kontoblatt 2000 sind die Gegenbuchungen nicht einzeln ersichtlich (nur monatliche Sammelbuchungen). Querverweis T1: Anhang Ziff. 3 stimmt nicht mit der ER überein. A.o. Aufwand:
    Anhang −28''892, Teilbeträge −20''499 und −7''874 = −28''373 (Differenz 519), ER/Saldoliste 8500 jedoch +3''000. A.o. Ertrag: Anhang 49''959, ER 50''000 (Differenz 41); die drei
    Teilbeträge ergeben nur 39''298.'
