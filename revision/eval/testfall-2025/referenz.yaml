  id: P1-21
  titel: 'Steuerlich verdecktes Eigenkapital: Aktionärsdarlehen voraussichtlich vollständig betroffen, Zinsen VSt-pflichtig'
  sachverhalt: 'Höchstzulässiges Fremdkapital nach KS ESTV 6a, mit Buchwerten anstelle der Verkehrswerte gerechnet:

    - flüssige Mittel 278''007.32 × 100 %;

    - 85 % auf Forderungen L+L 1''150''000, übrige Forderungen 260''010, Vorräte und nicht fakturierte Dienstleistungen 4''098''000 sowie ARA 20''000;

    - 50 % auf Sachanlagen 120''159.13;

    - 70 % auf immaterielle Werte 19''955.31.

    Ergebnis: 5''050''864.10. Das Fremdkapital von 9''124''515.32 übersteigt diesen Wert um 4''073''651.22, also um mehr als das Aktionärs-FK von 2''750''000 (2451–2455 und 2170). Damit
    gelten die Aktionärsdarlehen voraussichtlich vollständig als verdecktes Eigenkapital.

    Die Zinsen darauf (2025 korrekt 50''000, gebucht 130''000) wären steuerlich nicht abziehbar und als geldwerte Leistung VSt-pflichtig: 35 % ergeben 17''500 auf 50''000 bzw. 45''500
    auf 130''000; ins Hundert gerechnet 26''923.08 auf 50''000. Eine VSt-Deklaration oder Rückstellung ist nicht ersichtlich.'
