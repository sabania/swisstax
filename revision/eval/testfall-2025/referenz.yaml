    Aktionär A und VR-Präsident, Zweck «Privater Liegenschaftskauf». Es handelt sich also um eine Finanzforderung und nicht um eine Forderung aus Lieferung und Leistung. Bilanz: 1100
    Debitoren 1''150''000 = «Total Forderungen aus L+L». Anhang Ziff. 2 «Forderungen und Verbindlichkeiten gegenüber nahestehenden Parteien» nennt nur Verbindlichkeiten. Im VJ hielt
