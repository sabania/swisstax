  titel: Anhang 2025 ohne Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven (Mietkaution 200'000, ZAZ-Bardepot 10'000; dazu Garantiedepot und Globalzession)
  sachverhalt: 'Die Mietkaution von 200''000 ist zugunsten der Vermieterin gesperrt und sichert die eigenen Mietverbindlichkeiten. Das ZAZ-Bardepot von 10''000 ist laut Abstimmung eine
    «Sicherheitsleistung (Bardepot) gemäss Bewilligung 2022» für das zentralisierte Abrechnungsverfahren Zoll. Zusammen sind das 210''000 (nachgerechnet). Ausserhalb dieses Bereichs
    kommen hinzu: das Garantiedepot Fiktiva von 200 («verpfändet») und die Globalzession sämtlicher Debitorenforderungen (Bankbestätigung Fiktiva, Abschnitt C). Der Anhang 2025 (Ziff.
    1–7) enthält keine Ziffer zu verpfändeten oder gesperrten Aktiven. Die JR 2024 hatte dafür Ziff. 6 «Zur Sicherung eigener Verbindlichkeiten verwendete Aktiven». Der VJ-Hinweis Nr.
    7 «Garantien, Globalzession und Bankdarlehen wie 2024 offenlegen» wurde nicht umgesetzt. Die Aussage im VJ-revio D1-101 «Keine Verpfändung» trifft 2025 nicht mehr zu.'
