  - 'VJ 2024 text/01_Kommunikation_Bericht/1-01_Pruefakte_2024_Revio_ausgefuellt.md: 5.8 Hinweise Folgejahr Nr. 1 und 2'
  soll: 'Der VR erstellt unverzüglich Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten und lässt sie durch die Revisionsstelle prüfen (Art. 725b Abs. 1/2 OR). Er beschafft
    zusätzliche gültige Rangrücktritte samt Zinsen mindestens im Umfang der Unterdeckung (rund CHF 1.57 Mio. zu Fortführungswerten, plus Marge für Verluste 2026; zu Veräusserungswerten
    mehr) oder trifft bilanzwirksame Sanierungsmassnahmen. Sonst muss er das Gericht benachrichtigen (Art. 725b Abs. 3 OR). Die Revisionsstelle mahnt den VR schriftlich mit Fristansetzung
    und Hinweis auf ihre subsidiäre Anzeigepflicht. Bleibt er bei offensichtlicher Überschuldung untätig, benachrichtigt sie das Gericht selbst (Art. 729c OR; HWP ER Rz 433/434; SER
    Anhang H). Anhang Ziff. 6 berichtigen: tatsächliche Deckung, Unterdeckung, Massnahmen, wesentliche Unsicherheit zur Fortführung. Im Bericht ist ein Zusatz «Rangrücktritt im Ausmass
    der Unterdeckung» nicht möglich; Berichterstattung nach SER Anhang F/H. Querverweis: Ausschüttungsantrag (P1-a).'
