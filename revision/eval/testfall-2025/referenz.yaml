- bereich: vorraete
  id: F1-f
  titel: 'Anhang: Bewertungsgrundsatz Vorräte unvollständig und gegenüber dem Vorjahr abweichend formuliert'
  sachverhalt: 'Anhang 2025, Ziff. 4 b): «Die Bewertung der Warenvorräte erfolgt zu Einstandspreisen.» Im VJ-Anhang 2024, Ziff. 2, hiess es: «Vorräte werden zu Einstandspreisen (gleitender
    Durchschnitt) oder zum tieferen Marktwert bewertet.» 2025 bestehen eine WB 1290 von −20''000 für Altbestand/Ladenhüter, und die Inventarliste führt Marktpreise. Trotzdem fehlen im
    Anhang die Methode (gleitender Durchschnitt) und der Hinweis auf WB bzw. tieferen Wert. Auch im Kopf der Inventarliste 2025 fehlt der VJ-Zusatz «gleitender Durchschnitt». Ob die
    Methode stetig angewandt wurde, ist nicht dokumentiert.'
