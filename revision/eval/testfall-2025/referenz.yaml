- bereich: uebrige-ford
  id: C-10
  titel: 'Darlehen an Aktionär A ohne freies Eigenkapital: verbotene Einlagenrückgewähr (Art. 680 Abs. 2 OR) zu beurteilen, Drittvergleich spricht dagegen'
  sachverhalt: 'Das Eigenkapital per 31.12.2025 beträgt −3''178''383.56. Freies EK = EK − einbezahltes AK 100''000 = −3''278''383.56. Die Forderung von 150''000 gegenüber A übersteigt
    das freie EK also vollständig. Stille Reserven sind nicht dokumentiert. Damit entscheidet der Drittvergleich, und dagegen sprechen vier Punkte: keine Sicherheit, ein Zins von 1.0
    % unter den eigenen Finanzierungskosten (Aktionärsdarlehen 2.0 %, Bankdarlehen 2.40 %, Festvorschuss 2.85 %), ein privater Verwendungszweck sowie die Überschuldung der Gesellschaft
    bei angespannter Liquidität (Anhang Ziff. 6). Zudem hat A der Gesellschaft am 01.02.2025 selbst 200''000 zu 2.0 % geliehen (Konto 2451) und am 28.02.2025 dafür einen Rangrücktritt
