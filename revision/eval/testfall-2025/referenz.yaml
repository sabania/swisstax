  id: K-03
  titel: Abgrenzung Ferien/Überzeit (2370) pauschal mit CHF 10'000 statt nach Saldoliste mit CHF 101'374.77 bzw. CHF 113'539.74 inkl. 12 % AG-Beiträge; Fehler wie im Vorjahr
  sachverhalt: 'Das Konto 2370 enthält per 31.12.2025 nur AB-34 «Rückstellung Ferien/Überzeit 31.12.2025 (pauschal)» über CHF 10''000 (Gegenkonto 5200); im Rückstellungsspiegel steht
    «pauschal geschätzt GF». Die Saldoliste der Zeiterfassung (Stand 05.01.2026, lag also vor dem Abschluss vor) ergibt Ferien 63''537.50 + Überzeit 37''837.27 = CHF 101''374.77. Mit
    Python nachgerechnet: 52 Personen = Personalliste, Tageslohn = Jahreslohn/260, Stundenlohn = Tageslohn/8.4, negative Feriensaldi von P105, P112 und P131 (zusammen −940.38) mit 0
    bewertet. Arbeitgeberbeiträge sind in der Liste nicht enthalten. Das Vorjahr (R-03) wurde inkl. 12 % AG-Beiträge bewertet; der effektive Satz 2025 von (5700 + 5720 + 5730 + 5740)
    / AHV-pflichtigem Lohn = 366''000 / 3''030''000 = 12.08 % bestätigt das. Gleich wie im Vorjahr bewertet ergibt sich 101''374.77 × 1.12 = CHF 113''539.74. Unterbewertung: CHF 103''539.74
    (ohne AG-Beiträge mindestens CHF 91''374.77). Der Fehler wiederholt sich: Im Vorjahr wurde die Abgrenzung erst mit der Revisionsumbuchung U2 um 15''000 erhöht, und der Hinweis Folgejahr
    Nr. 9 verlangte «Saldoliste per Stichtag bewerten». Der Wechsel zur Pauschale verletzt die Stetigkeit. Weitere Punkte: (a) Die Überzeit ist zum Normallohn ohne Zuschlag bewertet;
    wird sie nicht durch Freizeit ausgeglichen und ist nichts anderes schriftlich vereinbart, schuldet der Arbeitgeber einen Zuschlag von 25 % (+9''459.32, mit AG-Beiträgen +10''594.44).
    (b) Bei den Eintritten 2025 (P140 ab 01.03.2025, P141 ab 01.04.2025) ist der Tageslohn aus dem unterjährigen Lohn berechnet; auf das Jahr hochgerechnet zusammen rund +932.80, unwesentlich.
    (c) Querbezug R1: 5200 entspricht mit 3''000''000 genau dem Bruttolohn laut Personalliste, obwohl 5200 die Nettoauflösung von 50''000 aus AB-01 (60''000) und AB-34 (10''000) enthält;
    die Abstimmung von 5200 mit dem Lohnjournal ist damit offen.'
