  soll: 'Rechnung ST-25-10012 und Lieferschein bzw. Wareneingang einholen und klären, ob die Schienen ins Lager gingen und gezählt wurden oder direkt auf eine Baustelle (dann Projektkosten,
    Querbezug F2). Klären, gegen welches Konto die Zahlung vom 21.01.2026 gebucht wurde. Buchungsvorschlag per 31.12.2025: 4300 Aufwand Material/Waren und 1170 Vorsteuer an 2000 Kreditoren,
    CHF 14''000. Wenn darin 8.1 % MWST enthalten sind (Annahme, bis die Rechnung vorliegt): netto 12''950.97, Vorsteuer 1''049.03. Waren die Schienen nicht im Inventar, ist zusätzlich
    1205 an 4300 zum Einstandswert zu buchen. Sind sie im Inventar, erhöht sich der Jahresverlust um 12''950.97 (ohne Vorsteuerabzug um 14''000). Zusammen mit F1-a/F1-b beträgt er dann
    −645''971.14 bzw. −647''020.17. Der Befund betrifft in erster Linie K1 (Vollständigkeit der Kreditoren) und ist in der Fehlerzusammenstellung nur einmal zu erfassen. Querbezug A2/P1
    (Überschuldung).'
