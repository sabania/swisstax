  sachverhalt: 'Die deklarierte Vorsteuer von 603''650 entspricht bei 8.1 % einer Bemessungsgrundlage von 7''452''469.


    Der gesamte Sach- und Dienstleistungsaufwand gemäss ER beträgt nur 6''712''740:

