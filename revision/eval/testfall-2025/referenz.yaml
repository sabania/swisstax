    29.12.2025 lag also vor der Sperre. Ein Indiz, nicht belegt: 14''000 / 1.081 = 12''950.97, das entspricht rund 700 Stk à 18.50 (= 12''950). Die Inventarliste 1205 führt V-SCH42 Montageschiene
    Alu 4.2 m mit 640 Stk à 18.50 = 11''840. Die Ware dürfte also weitgehend im gezählten Vorrat enthalten sein, ohne dass die Verbindlichkeit erfasst ist. Ein Lieferschein bzw. Wareneingangsbeleg
