  id: K1-e
  titel: 'Kontoblatt 2000 Dezember nicht mit Bankkonten abstimmbar: Sammelbuchung ZA-12 (342''837.29) gleicht auf OP-Total aus, Differenz CHF 145''237.65'
  sachverhalt: 'Kontoblatt 2000: Saldo 30.11.2025 501''237.29, plus 11 Dezember-Rechnungen 1''001''600.00 = 1''502''837.29. Darauf folgt ZA-12 «Zahlungen Dezember (Sammel)», Gegenkonto
    1011/1010, Soll 342''837.29, Endsaldo genau 1''160''000 = OP-Total. ZA-12 entspricht exakt 501''237.29 − 158''400 (ST-25-9921, am Stichtag offen) und wirkt damit als Ausgleichsbuchung.
    Die Bankkontoblätter, durch die Kontoauszüge Dezember bestätigt, zeigen Einzelzahlungen mit Gegenkonto 2000. 1011 = 238''268.58: ITF-25-1109 27''599.06, KT-88102 30''310.06, MP-25-331
    38''494.92, EF-2025-701 55''791.17, HMV-11393 12''831.95, TM-251177 47''302.42, GM-25-0377 9''456.87, KV-25-0870 16''482.13. 1010 = 236''226.14: ITF-25-1109 29''087.59, KT-88102
    44''850.93, HMV-11393 57''407.30, TM-251177 42''600.70, GM-25-0377 62''279.62. 1012 = 13''580.22: Spedition EuroTest 7''732.51, Probe Solar 25-3341 5''847.71. Total 488''074.94 gegenüber
    ZA-12 342''837.29 ergibt eine Differenz von 145''237.65 (nur 1010/1011: 131''657.43). Keine dieser Rechnungen ist eine Dezember-Rechnung; alle hätten im Novembersaldo enthalten sein
    müssen. Dieser reicht dafür nicht aus: 158''400 + 488''074.94 = 646''474.94 > 501''237.29. Haupt- und Nebenbuch bzw. die Kontoblätter untereinander sind somit nicht konsistent. Fünf
    Rechnungsnummern (ITF-25-1109, KT-88102, HMV-11393, TM-251177, GM-25-0377) wurden ab beiden Banken mit verschiedenen Beträgen bezahlt. Die Ursache ist nicht feststellbar: Teil-,
    Doppel- oder Fehlzahlungen bzw. falsche Referenzen. Das gleiche Muster zeigt sich bei den Debitoren (ZE-12 Sammel 777''916.52 gegenüber Bankeingängen mit Gegenkonto 1100; gleiche
    RE-Nummern auf 1010 und 1011). Ebenso bucht 1192 am 08.12.2025 die Anzahlung AZ-25-0388 von 20''000 gegen 1011, doch weder Kontoblatt noch Auszug 1011 enthalten diese Belastung (Schnittstelle
    A1/C1/D1).'
  nachweis:
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Z. 826 (SB-11, Saldo 501'237.29), Z. 827–837 (Dezember-Rechnungen 1'001'600), Z. 838 (ZA-12 342'837.29 → 1'160'000)
