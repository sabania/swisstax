- bereich: jahresrechnung
  id: A1-04
  titel: 'Fortführungsfähigkeit: Nachweise fehlen, wesentliche Unsicherheit im Anhang nicht ausdrücklich offengelegt, Limitenüberschreitung Januar 2026'
  sachverhalt: 'Indikatoren: EK −3''178''383.56 (EK-Quote −53.45 %), Jahresverlust −626''770.17, flüssige Mittel 278''007.32 (VJ 661''969.04; davon 200 verpfändetes Garantiedepot), kurzfristiges
    FK 6''044''600 (Liquiditätsgrad 2: 27.93 %). Festvorschuss Fiktiva 200''000 fällig 31.03.2026; Kontokorrentlimite Testbank nur 100''000 – gemäss Kontoauszug 1011 Januar 2026 Saldo
    am 25.01.2026 −175''320.80 (Limite um 75''320.80 überschritten). VR-Protokoll 10.03.2025: Liquidität nur «bis 03/2026 gemäss Plan gesichert». Zusätzliche drohende Mittelabflüsse:
    beantragte Ausschüttung 400''000 «aus den laufenden Mitteln» (A1-05) und mögliche Rückzahlung 300''000 an B (A1-02). Budget/Liquiditätsplanung 2026 und Finanzierungszusagen fehlen
    im Dossier. VJ-Anhang Ziff. 10 legte eine «wesentliche Unsicherheit, die erhebliche Zweifel an der Fähigkeit zur Fortführung aufwerfen kann» offen; Anhang 2025 Ziff. 6 nennt nur
    das «Risiko einer Überschuldung und knapper Liquidität» und stützt die Fortführung u.a. auf die (ungenügenden) Rangrücktritte.'
