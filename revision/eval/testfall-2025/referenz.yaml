  soll: 'Ziff. 6 neu fassen:

    - Überschuldung und ungedeckter Betrag;

    - Stand der RR je Gläubiger;

    - Massnahmen des VR nach Art. 725a/725b OR;

    - wesentliche Unsicherheit zur Fortführung mit Begründung (T1-318).

    Echte Ereignisse nach dem Bilanzstichtag gesondert angeben (Art. 959c Abs. 2 Ziff. 13 OR). Im Bericht ist ein Zusatz zu Überschuldung und Fortführung zu prüfen (Entscheid WP).'
