  titel: Kumulierte nicht erfasste Kreditoren CHF 84'950 (netto 78'584.64) – Wesentlichkeit, Wiederholungsfehler, Wirkung auf Überschuldung
  sachverhalt: 'Aus K1-a bis K1-c fehlen Verbindlichkeiten 2025 von brutto 48''600 + 22''350 + 14''000 = 84''950. Netto (bei 8.1 % MWST) sind es 44''958.37 + 20''675.30 + 12''950.97
    = 78''584.64, die Vorsteuer beträgt 6''365.36 (mit Python nachgerechnet). Ergebniswirkung vor Folgewirkungen auf 1301/Vorräte: Jahresverlust −626''770.17 → −705''354.81, Eigenkapital
    −3''178''383.56 → −3''256''968.20. Alle drei Posten waren vor dem Saldolisten-Export vom 14.02.2026 bekannt (gebucht 08.01./15.01.2026, Saldobestätigung 16.01.2026, bezahlt 21.01./28.01.2026).
    Für 2025 ist in der Akte keine Wesentlichkeit festgelegt. Die Vorjahreswerte (Wesentlichkeit 80''000, Toleranz 60''000, NAG 8''000) dienen nur als Anhaltspunkt: brutto liegt die
    Summe darüber, netto knapp darunter. Im VJ galt zudem das qualitative Kriterium, dass jede Abweichung wesentlich ist, welche die Deckung der Überschuldung verändert. Es handelt sich
    um einen Wiederholungsfehler: VJ EF-2024-701, 28''400 (U1, als wesentliche Feststellung geführt). Im Anhang 2025 Ziff. 3 erscheinen zudem «nachträgliche Buchungen für 2024 (Lieferung
    & Leistung)» −7''874. Die im VJ erfragte Kontrolle «Abgrenzung durch Projektleiter» hat damit nicht gegriffen.'
  nachweis:
  - siehe Nachweise K1-a, K1-b, K1-c
  - 00_Allgemein/Saldoliste_2025.md Z. 8 (Export 14.02.2026)
  - 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md Z. 236–237 (Jahresverlust −626'770.17, EK −3'178'383.56), Z. 611–616 (nachträgliche Buchungen 2024 −7'874)
  - 'VJ: ../../fiktive-zahlen-ag-2024/text/01_Kommunikation_Bericht/1-01_Pruefakte_2024_Revio_ausgefuellt.md Z. 13 (80''000/60''000/8''000), Z. 152 (qualitatives Kriterium Überschuldung),
    Z. 193 (U1 als wesentliche Feststellung), Z. 803 (Abgrenzung durch Projektleiter), Z. 810 (EF-2024-701)'
  soll: 'Die Korrekturbuchungen K1-a bis K1-c als Umbuchungsliste verlangen: Kreditoren 2000 (bzw. 2300 für GM-25-0455) +84''950, Aufwand +78''584.64, Vorsteuer +6''365.36. Die Folgewirkung
    auf 1301/1205 mit F2/E1 klären. Die Wesentlichkeit 2025 legt der WP fest. Bei Nichtkorrektur die Posten in der Zusammenstellung der nicht korrigierten Fehlaussagen kumulieren und
    ihre Wirkung auf die Prüfungsaussage beurteilen (SER 5.3). Die Überschuldungsbeurteilung (OR 725b, P1) mit den korrigierten Zahlen neu rechnen. In der Schlussbesprechung bzw. im
    Management Letter den Abgrenzungsprozess ansprechen: Durchsicht der Eingangsrechnungen Januar, Rapporte und Lieferscheine Dezember, Liste der Leistungen ohne Rechnung. Vollständigkeitserklärung
    zu den Verbindlichkeiten einholen.'
