  titel: 'Rechenfehler in der Inventarliste: M-ST410 mit 22''700 statt 20''700 (Überbewertung CHF 2''000)'
  sachverhalt: Die Inventarliste per 31.12.2025 führt M-ST410 SunTest ST-410 Full Black mit 120 Stk × 172.50 = 22'700. Richtig ist 120 × 172.50 = 20'700, die Position ist also um CHF
    2'000 zu hoch. In der XLSX ist der Positionswert ein fest erfasster Wert ohne Formel (G9 = 22700). Nur die Kontentotale G21–G23 und das Gesamttotal G25 sind Formeln (SUMIF/SUM);
    die WB G24 (−20'000) ist ebenfalls ein fester Wert. Das korrekte Total von Konto 1201 beträgt 35'640 + 33'930 + 20'700 + 29'450 + 28'280 = 148'000; gebucht und bilanziert sind 150'000.
    Die übrigen 12 von 13 Multiplikationen sind korrekt (mit Python nachgerechnet). Zusammen mit F1-a betragen die Vorräte netto 191'750 statt 198'000 (−6'250).
  nachweis:
  - D_Vorraete/Inventarliste_31.12.2025.md Z. 13 (M-ST410 | 120 | Stk | 172.5 | 22700) und Z. 24 (Total 1201 Solarmodule 150000)
  - '../original/D_Vorraete/Inventarliste_31.12.2025.xlsx: G9 = 22700 (fester Wert), G21 = SUMIF(A7:A19,"1201",G7:G19)'
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Blatt 1201, Z. 598 (AB-33, Haben 50000 an 4207, Saldo 150000)
  - '00_Allgemein/Saldoliste_2025.md Z. 28 (1201: 150000)'
  soll: 'Die Inventarliste ist zu berichtigen (M-ST410 = 20''700; Total 1201 = 148''000). Buchungsvorschlag per 31.12.2025: 4207 Bestandesänderung Solarmodule an 1201 Vorräte Solarmodule,
    CHF 2''000. Die Gesamtwirkung von F1-a und F1-b beträgt −6''250 auf Vorräte und Ergebnis. Die Korrektur ist der Unternehmensleitung vorzuschlagen. Empfehlung: Positionswerte in der
    Inventarliste künftig als Formel Menge × Preis erfassen.'
