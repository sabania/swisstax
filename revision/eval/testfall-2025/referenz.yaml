  id: A1-01
  titel: Überschuldung 31.12.2025 nicht durch Rangrücktritte gedeckt – Anhangsaussage Ziff. 6 falsch, Pflichten Art. 725b/729c OR
  sachverhalt: 'Bilanz/Saldoliste 31.12.2025: Aktiven 5''946''131.76, Fremdkapital 9''124''515.32, Eigenkapital −3''178''383.56 (AK 100''000 + 2950 10''000 + 2962 3''233''333 − 2970
    5''894''946.39 − 2979 626''770.17); damit Überschuldung zu Buchwerten 3''178''383.56 und Kapitalverlust (Art. 725a OR). Im Dossier 2025 belegte Rangrücktritte: A 200''000 (28.02.2025),
    B 500''000 (30.11.2025, ersetzt 800''000), D 800''000 = 1''500''000 samt Zinsen. Ungedeckt (Python): 1''678''383.56; bei Anrechnung sämtlicher Zinsen 2170 (150''000) 1''528''383.56;
    mit RR E 800''000 (nur Kopie VJ-Akte L-04) 728''383.56; selbst mit den ursprünglichen RR 2''600''000 + Zinsen 150''000 noch 428''383.56. Die VJ-Sanierungsrechnung (P-02) wies nur
    eine Deckungsreserve von 68''386.61 aus (VJ-Hinweis 5.8 Nr. 1: jeder Verlust 2025 führt zu Unterdeckung); Jahresverlust 2025 −626''770.17. Anhang Ziff. 6 behauptet dennoch, die Überschuldung
    sei «durch die weiterhin bestehenden Rangrücktritte der Gesellschafter ... gedeckt, weshalb eine Benachrichtigung des Gerichts nicht erforderlich ist». Die nicht gebuchten Korrekturen
    (A1-17, vorläufig netto −559''171.43) erhöhen den Fehlbetrag weiter; zudem Darlehen 150''000 an RR-Gläubiger A (A1-10).'
  nachweis:
  - '00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md (Bilanz S. 2: Total Eigenkapital −3''178''383.56; Anhang Ziff. 6 S. 6)'
