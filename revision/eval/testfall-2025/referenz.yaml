- bereich: liquiditaet
  id: B1-R18
  titel: Geldabfluss CHF 150'000 als Darlehen an Aktionär A/VR-Präsident, in den Debitoren verbucht; nicht gesondert ausgewiesen, Einlagenrückgewähr zu prüfen
  sachverhalt: 'HB 1100 Debitoren bucht am 15.10.2025 DL-2025-01 «Darlehen an Peter Testmann (Aktionär A)» im Soll mit CHF 150''000 und Gegenkonto 1010. Der Oktober-Auszug 1010 liegt
    nicht vor; die Auszahlung ist nicht bankseitig belegt.

    Vertrag: Darlehensnehmer ist Aktionär A und VR-Präsident, Zweck «Privater Liegenschaftskauf», Zins 1.0 % zahlbar mit Rückzahlung bis 31.12.2026, keine Sicherheit, VR-Beschluss vom
    10.10.2025.

    Die Forderung steckt in den Forderungen aus L+L (OP: «Darlehen gem. VR-Beschluss») und ist weder in der Bilanz noch im Anhang gesondert ausgewiesen; Anhang Ziff. 2 nennt nur Verbindlichkeiten.
    Das Eigenkapital per 31.12.2025 beträgt −3''178''383.56, das freie Eigenkapital ist negativ. Die Forderungen gegenüber Aktionären übersteigen es, deshalb ist ein Drittvergleich nötig.

    Indizien gegen Drittvergleich:

    - ungesichert, privater Zweck

    - 1.0 % Zins, während die Gesellschaft der Bank 2.40–2.85 % und A selbst vertraglich 2.0 % auf dessen Darlehen von 200''000 bezahlt

    - Gesellschaft überschuldet

    A hat am 28.02.2025 für seine Forderung von 200''000 einen Rangrücktritt mit Verzicht auf Rückzahlungen erklärt. Der Abfluss an ihn wirkt wirtschaftlich wie eine Teilrückführung
    (WP-Beurteilung). Die Zinsabgrenzung 15.10.–31.12.2025 (CHF 316.44, act/365, 77 Tage) fehlt in der 1300-Liste.'
