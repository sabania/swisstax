  id: P1-08
  titel: 'Anhang Ziff. 6 unzutreffend: Deckung der Überschuldung durch RR behauptet, Sanierung 2025 als Ereignis nach dem Bilanzstichtag'
  sachverhalt: 'Ziff. 6 «Wesentliche Ereignisse nach dem Bilanzstichtag» beschreibt die Sanierung vom Januar 2025 (Text aus dem VJ übernommen). Diese fällt ins Geschäftsjahr 2025 und
    ist kein Ereignis nach dem 31.12.2025. Die RR sind zudem vom 28.02.2025 bzw. 30.11.2025 und nicht vom Januar.

    Ziff. 6 erklärt, die Überschuldung per 31.12.2025 sei «durch die weiterhin bestehenden Rangrücktritte … gedeckt» und eine Benachrichtigung des Gerichts nicht erforderlich. Das ist
    unzutreffend (P1-01 bis P1-03).

    Die Fortführung wird nur als «Risiko» umschrieben, ohne Offenlegung einer wesentlichen Unsicherheit wie im VJ (Anhang 2024 Ziff. 10). Der Satz «Die Liquiditätssituation bleibt angespannt»
    steht im Widerspruch zur beantragten Ausschüttung von 400''000.

    Nicht erwähnt sind die Reduktion des RR B, der fehlende RR E, das Darlehen an A und die fehlenden Zwischenabschlüsse.'
  nachweis:
  - 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md Z. 646–651 (Sanierung Januar 2025), Z. 652–661 (Fortführung, Deckung durch RR)
