- bereich: jahresrechnung
  id: A1-05
  titel: 'Antrag VR: Ausschüttung 400''000 aus der gesetzlichen Kapitalreserve ist gesetzeswidrig'
  sachverhalt: 'Antrag VR vom 15.05.2026: Bilanzverlust −6''521''716.56 (= −5''894''946.39 − 626''770.17, rechnerisch richtig), «Ausschüttung aus Kapitalreserven an die Aktionäre (CHF
    400 je Aktie)» −400''000, Auszahlung «nach der GV 2026 aus den laufenden Mitteln»; Begründung: «die Ausschüttung aus Kapitaleinlagereserven ist verrechnungssteuerfrei». Gesetzliche
    Kapital- und Gewinnreserven abzüglich Verluste: 3''233''333 + 10''000 − 6''521''716.56 = −3''278''383.56, weit unter der Hälfte des AK (50''000). Die Gesellschaft ist überschuldet
    und illiquid (A1-01, A1-04). Aktienbuch weist nur 950 Aktien aus (400 × 1''000 Aktien = 400''000). Nachweis der KER-Bestätigung durch die ESTV fehlt.'
  nachweis:
  - M_Eigenkapital/Antrag_VR_Verwendung_Bilanzergebnis_2025.md
  - 00_Allgemein/Saldoliste_2025.md (2962 3'233'333; 2950 10'000; 2970/2979)
  - M_Eigenkapital/Aktienbuch_31.12.2025.md (Total 950 Aktien)
  soll: Rückzahlung der gesetzlichen Kapitalreserve ist nach Art. 671 Abs. 2 OR unzulässig; Antrag auf «Vortrag des Bilanzverlusts auf neue Rechnung, keine Ausschüttung» ändern lassen.
    Bleibt der Antrag, im Revisionsbericht festhalten, dass der Antrag über die Verwendung des Bilanzergebnisses nicht dem Gesetz entspricht (Art. 729a Abs. 1 Ziff. 2 OR; Entscheid WP).
    Eine erfolgte Auszahlung wäre rückforderbar (Art. 678 OR). VSt-Freiheit (KER-Bestätigung ESTV) separat belegen lassen.
  betrag_chf: 400000
  prueffeld: A1 Allgemeine Prüfungshandlungen (Antrag Bilanzergebnis)
