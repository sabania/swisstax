    und 1177 Einfuhr-MWST ist 2025 ausgeglichen. Ob die ZAZ-Bewilligung fortbesteht, ist daher offen. Davon hängt ab, ob das Depot dauernd gebunden ist (dann mehr als 12 Monate) oder
    zurückgefordert werden kann.'
