  id: N1-b
  titel: Überschuldung per 31.12.2025 durch die vorliegenden Rangrücktritte nicht gedeckt (Unterdeckung rund CHF 1.57 Mio.) – Aussage im Anhang Ziff. 6 falsch, Art. 725b OR
  sachverhalt: 'Eigenkapital per 31.12.2025 -3''178''383.56 (100''000 + 10''000 + 3''233''333 - 5''894''946.39 - 626''770.17, nachgerechnet; EK-Quote -53.45 %), also Überschuldung zu
    Fortführungswerten. Rangrücktritte in der Akte 2025: A 200''000 (28.02.2025), B 500''000 (30.11.2025, reduziert, vgl. N1-c), D 800''000 (28.02.2025), zusammen 1''500''000 samt Zinsen.
    Für E fehlt der RR (N1-d). Nachrangig samt Vertragszinsen: 1''500''000 + A 3''666.67 + B anteilig 9''166.67 + D 15''083.33 + D-Zins 2024 1''458.33 = 1''529''375.00. Ungedeckt nach
    Zinskorrektur N1-a (EK -3''096''466.89): 1''567''091.89. Wie gebucht 1''649''008.56, nur Kapitalbeträge 1''678''383.56. Untergrenze (selbst wenn der ganze Zinssaldo 2170 nachrangig
    wäre): 1''528''383.56. Selbst mit fortbestehendem RR E und RR B wieder bei 800''000 blieben 446''925.22 ungedeckt, mit allen Aktionärsforderungen wie gebucht (2''750''000) 428''383.56.
    Zwischenabschlüsse 2025 zu Fortführungs- und Veräusserungswerten fehlen. Zu Veräusserungswerten war die Überschuldung im VJ um 2''516''999.89 grösser (P-02). Die VJ-Hinweise Nr.
    1/2 («Zwischenbilanz 30.06.2025 einfordern; Rangrücktritte erhöhen lassen», Reserve nur 68''387) wurden nicht umgesetzt; stattdessen wurde der RR B reduziert. Anhang Ziff. 6 behauptet,
    die Überschuldung sei «durch die weiterhin bestehenden Rangrücktritte … gedeckt, weshalb eine Benachrichtigung des Gerichts nicht erforderlich ist». Er nennt «im Januar 2025» gewährte
    ausreichende Rangrücktritte, die Erklärungen datieren aber vom 28.02.2025. Zudem führt er Vorgänge 2024/Anfang 2025 als «Ereignisse nach dem Bilanzstichtag» auf.'
