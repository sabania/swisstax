  - A_Fluessige_Mittel/Kontoauszug_Testbank_1011_CHF_Dezember_2025.md Z. 29–87
  - A_Fluessige_Mittel/Kontoauszug_Fiktiva_1010_CHF_Dezember_2025.md Z. 28–62
  - A_Fluessige_Mittel/Kontoauszug_Testbank_1012_EUR_Dezember_2025.md Z. 23–24
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Z. 451 (1100 ZE-12 777'916.52), Z. 585 (1192 AZ-25-0388 gegen 1011)
  soll: 'Für Dezember (bzw. das ganze Jahr) die Abstimmung Kreditorennebenbuch – Hauptbuch 2000 – Bankkonten einfordern, mit Zahlungsjournal Dezember und Einzelposten inkl. 1012 EUR.
    Die Differenz von 145''237.65 aufklären und belegen; eine Ausgleichsbuchung ohne Beleg ist nicht zulässig. Für die fünf doppelt referenzierten Rechnungen Lieferantenrechnungen und
    Lieferantenkontoauszüge einsehen. Allfällige Doppel- oder Überzahlungen als Forderung ausgliedern (übrige kurzfristige Forderungen, nicht mit Kreditoren verrechnen) und zurückfordern.
    Solange die Differenz ungeklärt ist, gelten Bestand und Vollständigkeit von 2000 (1''160''000) als nicht verlässlich nachgewiesen. Bleibt sie ungeklärt: Schlussbesprechung und Wirkung
    auf die Prüfungsaussage beurteilen. Schnittstellen A1 (Banken), C1 (1100), D1 (1192).'
