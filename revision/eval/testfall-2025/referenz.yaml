  sachverhalt: 'Rechnung Nr. 2025-1187 der Montagebau Teststein GmbH (K-2045) vom 22.12.2025, Projekt P-2025-12 Fassadenanlage Testwerk. Pos. 1: Montage Unterkonstruktion, Leistungszeitraum
