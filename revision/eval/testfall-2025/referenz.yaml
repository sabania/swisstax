  soll: 'Den VR schriftlich an seine Pflichten erinnern (SER Ziff. 9). Der VR muss unverzüglich Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten erstellen und durch die Revisionsstelle
    prüfen lassen (Art. 725b Abs. 1–2 OR).

    Zeigen beide eine Überschuldung, muss der VR das Gericht benachrichtigen (Abs. 3). Ausnahmen (Abs. 4):

    - zusätzliche qualifizierte Rangrücktritte samt Zinsen und Stundung im Umfang der Unterdeckung, mindestens 1''678''383.56 zu Fortführungswerten ohne Zinsanrechnung; RR E nur mit
    Original oder Bestätigung anrechenbar;

    - begründete Aussicht, die Überschuldung innert 90 Tagen nach Vorliegen der geprüften Zwischenabschlüsse zu beheben.

    Zudem Massnahmen zur Beseitigung des Kapitalverlusts (Art. 725a Abs. 1 OR).

    Bleibt der VR untätig: im Bericht Zusatz zur buchmässigen Überschuldung und Hinweis auf die unterlassene Zwischenbilanz (SER Anhang F Bsp. 13). Bei offensichtlicher Überschuldung
