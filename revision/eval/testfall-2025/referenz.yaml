    Auch ein Kapitalverlust nach Art. 725a OR liegt vor. Die Schwelle beträgt nach HWP BuR Rz 889 die Hälfte des geschützten Kapitals: AK 100''000 + gesetzliche Reserven, anrechenbar
    höchstens 50''000, ergibt 150''000, die Hälfte davon 75''000 (revision.py kapitalverlust bestätigt).

    In der Akte 2025 belegte Rangrücktritte: A 200''000 (28.02.2025), B 500''000 (30.11.2025, reduziert, siehe P1-02) und D 800''000 (28.02.2025), zusammen 1''500''000. Ungedeckt bleiben
    damit 1''678''383.56. Werden alle Zinsen 2170 (150''000) angerechnet, sind es 1''528''383.56.

    Selbst im günstigsten Fall bleibt eine Lücke. Mit RR E 800''000 (nur in der VJ-Akte), RR B ungekürzt und allen Zinsen ergeben sich 2''750''000; ungedeckt bleiben 428''383.56.

    Nach der Korrektur der Zinsabgrenzung (P1-06) beträgt das EK −3''098''383.56; ungedeckt bleiben ohne Zinsanrechnung 1''598''383.56.

    Die Reserve nach der Sanierungsrechnung des VJ betrug 68''386.61 (VJ P-02). Sie ist durch den Jahresverlust 2025 von 626''770.17 aufgezehrt.

    In der Akte fehlen Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten, die Zwischenbilanz 30.06.2025 (VJ-Hinweis 5.8 Nr. 1) und ein Sanierungsplan. Die VJ-Hinweise 5.8 Nr.
    1 und 2 sind unerledigt. Anhang Ziff. 6 behauptet trotzdem eine Deckung durch die RR (siehe P1-08).'
