    I nur A, B, D; Darlehensvertrag E Ziff. 6: «bei Bedarf eine separate Rangrücktrittserklärung»); nur VJ-Kopie L-04 vom 28.02.2025. Ein VR-Beschluss zur Reduktion liegt nicht vor.
