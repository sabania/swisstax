  titel: 'Verkauf Lieferwagen «ohne MWST (Verkauf wie unter Privaten)»: Umsatzsteuer nicht abgerechnet, Erlös als a.o. Ertrag gebucht'
  sachverhalt: 'Gemäss Kaufvertrag vom 14.10.2025 wurde der Lieferwagen Transit-Test (Jg. 2019) an die Garage Musterli AG verkauft, zum Preis von «CHF 6''500.00 netto, ohne MWST (Verkauf
    wie unter Privaten)». Der Erlös ist auf 8510 a.o. Ertrag gebucht (BA-1014), ohne Umsatzsteuer.


    Die Gesellschaft ist MWST-pflichtig (effektive Methode). Der Verkauf eines betrieblich genutzten Fahrzeugs ist eine Lieferung gegen Entgelt; eine Ausnahme ist nicht ersichtlich.
    Da der Preis fix vereinbart ist, ist die Steuer herauszurechnen: 6''500 × 8.1/108.1 = 487.05.


    Zudem ist der Anlagenabgang nicht gebucht: 1530/1539 sind unverändert, und das Fahrzeug steht weiterhin im Anlagenverzeichnis.'
