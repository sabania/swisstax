  soll: '1. Schlussabrechnungen bzw. Kontoauszüge 2025 der Versicherer (UVG, UVGZ, KTG) und der Vorsorgeeinrichtung einholen und je Konto abstimmen (analog VJ M-02).

    2. Die Taggeldabrechnungen zu 5650 belegen.

    3. Erstattung oder Verrechnung des VJ-Guthabens von 22''000 nachweisen.

