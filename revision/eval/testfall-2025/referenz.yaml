    «Selbstkosten zuzügl. ¼ – ½ %» (bis 10 Mio. ½ %), also mindestens 2.0 % + 0.5 % = 2.5 %. Vereinbart sind 1.0 %. Zinsdifferenz 2026 (Laufzeit bis 31.12.2026): mindestens 150''000
