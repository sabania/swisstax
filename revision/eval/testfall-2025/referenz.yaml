  sachverhalt: 'In der Akte fehlen fünf Nachweise. (1) Die Bilanz 30.06.2025 der GmbH, auf die sich der Kaufpreis stützt. (2) Der Zahlungsnachweis für 30''000 vom 30.09.2025: 1010 ist
