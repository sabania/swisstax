- bereich: vorraete
  id: F1-e
  titel: 'Wertberichtigung 1290 von 40''000 auf 20''000 aufgelöst: Nettoauflösung stiller Reserven von mindestens 15''980 ohne Nachweis 2025'
  sachverhalt: 'Laut VJ-Nachweis 7-05 (unterzeichnet 09.05.2025) betrug die WB 40''000, betriebswirtschaftlich nötig waren 15''000 (420 × 21 = 8''820 plus Risikozuschlag 6''180), die
    stille Reserve also 25''000; dies bestätigt auch die VE 2024. Per 31.12.2025 ist die WB auf 20''000 reduziert. Die Auflösung von 20''000 wurde mit AB-33 über 4207 als «Bestandesänderung»
    gebucht und ist in der ER damit nicht erkennbar. Der Niederstwertbedarf gemäss Inventarliste (Marktpreis 12/2025 unter Einstand) beträgt: ST-380 310 × (95 − 61) = 10''540, ST-410
    120 × 2.50 = 300 und HB-6 7 × 20 = 140, zusammen 10''980. Die WB deckt den Bedarf (Art. 960c OR) und enthält eine stille Reserve von 9''020. Die Nettoauflösung beträgt damit 25''000
    − 9''020 = 15''980 (ohne Risikozuschlag). Mit einem Risikozuschlag wie im Vorjahr (6''180) ergäbe sich ein Bedarf von 17''160, eine stille Reserve von 2''840 und eine Auflösung von
    22''160. Die Korrekturen F1-a/F1-b ändern den WB-Bedarf nicht, weil sie über 1201/1202 gebucht werden. Beim Ladenhüter ST-380 ist der Bedarf gegenüber dem Vorjahr sogar gestiegen
    (VJ 8''820). Im Dossier 2025 fehlen eine Aufstellung der stillen Reserven, eine Herleitung der WB (G24 in der XLSX ist ein fester Wert) und Belege für die Marktpreise (Veräusserungswert
    oder Beschaffungspreis?). Der Anhang 2025 enthält keine Angabe zu einer Nettoauflösung.'
  nachweis:
  - D_Vorraete/Inventarliste_31.12.2025.md Z. 13–14, 18 (Einstand/Marktpreis 172.5/170, 95/61, 1120/1100) und Z. 27 (1290 −20000)
  - D_Vorraete/Inventurprotokoll_31.12.2025.md Z. 14 (ST-380, 310 Stk, schwer verkäuflich – Wertberichtigung durch Buchhaltung)
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Blatt 1290, Z. 642 (AB-33, Soll 20000 an 4207, Saldo −20000)
  - VJ fiktive-zahlen-ag-2024/text/07_Unterlagen_zum_Abschluss/7-05_Stille_Reserven_2024_unterzeichnet.md Z. 11 (40000 / 15000 / 25000)
  - VJ fiktive-zahlen-ag-2024/text/07_Unterlagen_zum_Abschluss/7-01_Vollstaendigkeitserklaerung_2024.md Z. 11
  - 'VJ fiktive-zahlen-ag-2024/text/01_Kommunikation_Bericht/1-01_Pruefakte_2024_Revio_Tabelle.md Z. 191 (F1-304: 420 × 21 = 8''820 + Risiko) und Z. 656–659 (Wesentlichkeit 80''000 /
    Toleranz 60''000 / NAG 8''000)'
  - 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md Z. 588–641 (Anhang ohne Angabe zur Nettoauflösung)
  soll: 'Pendenz: Eine unterzeichnete Aufstellung der stillen Reserven 2025 einverlangen (wie 7-05), mit Herleitung der betriebswirtschaftlich nötigen WB und mit Belegen zu den Marktpreisen
    12/2025 (Veräusserungswert abzüglich noch anfallender Kosten). Die Nettoauflösung über alle Positionen aggregieren (A1-207/A1-308, T1-305). Der WP entscheidet, ob das Ergebnis dadurch
    wesentlich günstiger dargestellt wird; dann ist sie im Anhang nach Art. 959c Abs. 1 Ziff. 3 OR anzugeben. Der Betrag von rund 15''980–22''160 liegt unter der VJ-Wesentlichkeit von
    80''000; für 2025 ist keine Wesentlichkeit dokumentiert. Eine WB über dem Bedarf ist zulässig (Art. 960a Abs. 4 OR). Bildung, Auflösung und Bestand der stillen Reserven in der Vollständigkeitserklärung
    2025 bestätigen lassen.'
