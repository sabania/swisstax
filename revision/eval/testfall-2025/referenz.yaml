  - I_Bank_und_Aktionaersdarlehen/Rangruecktritt_Aktionaer_A.md, Rangruecktritt_Aktionaer_B.md (30.11.2025, 500'000), Rangruecktritt_Aktionaer_D.md
  - '00_Allgemein/Belegverzeichnis.md (Register I: nur RR A, B, D)'
