  id: M1-d
  titel: 'Schlussabrechnungen UVG/UVGZ/KTG/BVG 2025 fehlen: Guthaben 73''400 nicht belegt, Sozialversicherungsaufwand auffällig tief'
  sachverhalt: 'Ordner J enthält nur die AHV-Schlussabrechnung. Es fehlen Schlussabrechnungen bzw. Kontoauszüge 2025 für UVG, UVGZ, KTG und BVG sowie eine Abstimmung der Sozialversicherungskonten
    (im VJ als M-02 vorhanden).


    Das UVG/UVGZ-Guthaben 2024 von 22''000 («Akonto zu hoch») wurde 2025 weder erstattet noch verrechnet; es ist auf 43''000 angewachsen. KTG weist neu −30''000 aus. Die Belastungen
    2025 übersteigen die Gutschriften auf 2271 um 20''000 (61''333.01 gegenüber 41''333.01) und auf 2273 um 30''000 (48''890.98 gegenüber 18''890.98).


    Gleichzeitig ist der Aufwand tief. 5730 UVG beträgt 4''000 (VJ 10''000), das sind 0.13 % der Lohnsumme von 3''030''000; der BSV-Durchschnitt für die BUV (Arbeitgeber) liegt bei 0.58
    %. 5740 KTG beträgt 12''000 (VJ 21''000). 5650 Leistungen von Sozialversicherungen steigt auf +100''000 (VJ 30''000), ohne Nachweis.


    Es besteht das Risiko, dass bezahlte Prämien als Guthaben aktiviert statt als Aufwand erfasst wurden bzw. dass Taggeldansprüche nicht belegt sind.'
