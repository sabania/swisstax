  titel: 'Vorjahr: Anlagenverkäufe 2024 mit Erfolg (8530 +4''400, 8520 −500) gebucht, im Anlagespiegel 2024 aber kein Abgang – VJ-Beurteilung «korrekt erfasst» nicht nachvollziehbar,
    Eröffnungswerte 2025 fraglich'
  sachverhalt: 'Die VJ-Prüfakte G1-104 hält fest: «Abgänge zwei Altgeräte (Gewinn 4''400, Verlust 500) korrekt erfasst». Die Saldobilanz 2024 weist 8520 −500 und 8530 +4''400 aus. Der
    Anlagespiegel 2024 hat jedoch keine Abgänge: AW 384''107.87 + Zugänge 21''000 = 405''107.87; WB 87''107.98 + 131''000 = 218''107.98, auch je Kategorie ohne Abgang. Ein Verlust von
    500 setzt einen Restbuchwert voraus. Die verkauften Objekte wurden somit wahrscheinlich nicht ausgebucht, es ist dasselbe Muster wie 2025 beim Lieferwagen (G1-b). Die Eröffnungswerte
    2025 (AW 405''107.87) können Objekte enthalten, die nicht mehr vorhanden sind. Ein Zusammenhang mit der Entsorgung 2025 (AN-07, 27''355.36) ist möglich, aber nicht belegt.'
