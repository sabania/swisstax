    4'250 überbewertet. Die beiden übrigen gezählten Positionen stimmen überein (W-IV10K 12 Stk, W-HB6 7 Stk). Das korrekte Total von Konto 1202 beträgt 16'150 + 11'760 + 7'840 = 35'750.
    Gebucht und bilanziert sind 40'000 (Hauptbuch 1202 AB-33, Saldoliste, Bilanz). Den Übertrag in die Inventarliste hat laut Inventurprotokoll die Buchhaltung am 12.01.2026 vorgenommen.
