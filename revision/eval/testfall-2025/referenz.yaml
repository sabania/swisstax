  titel: 'AHV-Jahreslohnmeldung 2025 unvollständig: P140 und P141 (CHF 120''000) nicht gemeldet; Beitragsnachzahlung nicht abgegrenzt'
  sachverhalt: 'Die Jahreslohnmeldung (eingereicht 20.01.2026) umfasst 50 Personen mit 2''910''000. Personalliste und Lohnjournal 2025 umfassen 52 Personen mit einem AHV-pflichtigen
    Lohn von 3''030''000; das entspricht Hauptbuch 5200 3''000''000 + 5202 30''000. Es fehlen P140 Testinger Noah (Eintritt 01.03.2025, 66''000) und P141 Beispielacker Selina (Eintritt
    01.04.2025, 54''000), zusammen 120''000. Die übrigen 50 Löhne stimmen betragsgenau überein.


    Die Schlussabrechnung vom 26.02.2026 beruht auf 2''910''000. Auf den fehlenden Löhnen ergibt sich eine Nachzahlung von 15''524.64 zum Satz der Schlussabrechnung (12.937 %) bzw. von
    16''320.00 zu den BSV-Mindestsätzen (10.6 % + 2.2 % + FAK 0.8 %), jeweils zzgl. Verwaltungskosten und allfälliger Verzugszinsen. Die Nachzahlung ist nicht abgegrenzt. Im Vorjahr
    war die Lohnabstimmung AHV ohne Differenz (R-02).


    Zusätzlicher Prüfhinweis: P140 ist mit Pensum 0.4 erfasst und bezieht für 10 Monate 66''000. Hochgerechnet auf 12 Monate und 100 % sind das 198''000, mehr als der Bruttolohn des
    GF von 148''000 bei 100 %. Da beide Neueintritte bei der AK fehlen, ist auch der Bestand der Arbeitsverhältnisse zu verifizieren.'
