  soll: '1. Original-Monatsabrechnungen QST 2025 des kantonalen Steueramts (mit Tarifcodes) und die Zahlungsbelege einholen.

    2. Die Abzüge je Person nachrechnen und 2279 je Monat abstimmen.

    3. Zu viel abgezogene Quellensteuer ist den Mitarbeitenden geschuldet und kein Ertrag; sie ist umzubuchen bzw. zurückzuerstatten. Offene Vorperioden bezahlen.

    4. Die Bezugsprovision mit den Abrechnungen belegen und einen nicht belegten Teil stornieren (5790 an 2279).


