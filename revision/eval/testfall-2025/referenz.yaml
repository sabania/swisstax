  id: K-01
  titel: 'Rückstellung Rechtsfall Kunstrasen Fiktiv AG nach Verhandlungsziel statt bestmöglicher Schätzung bemessen: 45''000 statt mindestens 85''000'
  sachverhalt: 'Konto 2330 «Sonstige kurzfristige Rückstellungen»: CHF 45''000, gebildet mit AB-36 am 31.12.2025 (Gegenkonto 8500). Gleicher Betrag im Rückstellungsspiegel, in der Saldoliste
    und in der JR. Laut Aktennotiz vom 18.12.2025 fordert die Kunstrasen Fiktiv AG CHF 118''000 für Mängel an der 2024 erstellten PV-Anlage; die Klage beim Handelsgericht wurde am 27.11.2025
    angekündigt. RA Dr. T. Probstli hält einen Teil der Mängel für ausgewiesen. Er schätzt das Prozessrisiko auf CHF 60''000–90''000. Am wahrscheinlichsten sei ein Vergleich von rund
    CHF 75''000, dazu kommen Anwalts- und Gerichtskosten von rund CHF 10''000. Die bestmögliche Schätzung beträgt damit 75''000 + 10''000 = CHF 85''000. Die GF bildet trotzdem nur CHF
    45''000 mit der Begründung «Ziel ist ein Vergleich unter CHF 50''000». Dieser Betrag liegt CHF 15''000 unter dem unteren Ende der Bandbreite, und die Prozesskosten fehlen ganz. Unterdeckung
    zur wahrscheinlichsten Schätzung: CHF 40''000. Am oberen Ende der Bandbreite (90''000 + 10''000 = 100''000) wären es CHF 55''000 (mit Python nachgerechnet). Im Dossier liegen nur
    die Aktennotiz der GF, aber weder Forderungsschreiben, Klageankündigung noch eine schriftliche Stellungnahme des RA. Im Vorjahr wurde bei O1-101 «keine Rechtsfälle» festgehalten;
    das Risiko ist also neu.'
  nachweis:
