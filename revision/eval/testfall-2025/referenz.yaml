  titel: 'Bilanz: Position 2400 Bankdarlehen (CHF 289''915.32) fehlt, Zwischentotal «Langfristige verzinsliche Verbindlichkeiten» falsch (0.00 / VJ 2''300''000), verzinsliche Aktionärsdarlehen
