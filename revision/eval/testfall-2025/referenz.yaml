- bereich: anlagen
  id: G1-f
  titel: Abgang 1520 «Entsorgung, vollständig abgeschrieben» (AN-07, 27'355.36) ohne Beleg; Abschreibung 1520 von 45'599.69 übersteigt die lineare Jahresabschreibung um 13'832.34 bis
    16'082.34
  sachverhalt: 'Mit AN-07 vom 30.06.2025 werden AW 27''355.36 gegen WB 27''355.36 ausgebucht («Server/Notebooks alt (Entsorgung, vollständig abgeschrieben)»), ohne Erfolg aus Abgang.
    Die Akte enthält keine Objektliste und keinen Entsorgungsnachweis; Register G des Belegverzeichnisses nennt nur Anlagespiegel, Kaufvertrag Lieferwagen und ITF-25-0512. Weil das Anlagenverzeichnis
    keine WB je Objekt führt, ist «vollständig abgeschrieben» nicht prüfbar. Die Abschreibung 1520 für 2025 beträgt 45''599.69 (VJ 31''000; ER nur 20''000, vgl. G1-a). Die maximale lineare
    Jahresabschreibung gemäss Verzeichnis beträgt 31''767.35: Notebooks 60''310.55/4 = 15''077.64, Server 33''448.58/5 = 6''689.72, Drohne 16''000/4 = 4''000, Zugang 24''000/4 = 6''000
    für ein volles Jahr. Der Überschuss beträgt damit 13''832.34; bei pro rata 7.5 Monaten für den Zugang 16''082.34. Kumuliert liegt die WB 1529 per 31.12.2025 (93''948.16) nicht über
    dem theoretischen linearen Höchstwert (höchstens 100''063.66, wenn alle Notebooks voll abgeschrieben sind). Der Überschuss kann deshalb eine Nachholabschreibung, eine zusätzliche
    Abschreibung (stille Reserve) oder ein als Abschreibung erfasster Restbuchwert der entsorgten Geräte sein.'
  nachweis:
