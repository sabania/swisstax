  sachverhalt: 'Konto 1050 ZAZ-Depot weist CHF 10''000 aus. Das Hauptbuch 2025 zeigt nur den Eröffnungssaldo, keine Bewegung. Die interne «Abstimmung» stellt lediglich den Buchsaldo
    von 10''000 der «Sicherheitsleistung (Bardepot) gemäss Bewilligung 2022 10000» gegenüber und vermerkt: «Kopie Kontoauszug ZAZ Dezember 2025 liegt im Ordner Zoll (nicht beigelegt)».
