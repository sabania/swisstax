  id: P1-09
  titel: Anhang Ziff. 2 (Beteiligte/Organe) falsch und unvollständig
  sachverhalt: 'Mängel im Anhang Ziff. 2:

    (1) Die Zeile «Darlehen ggü. Aktionären» zeigt für 2025 250''000, obwohl 2450 = 0 ist. Die 250''000 sind Teil des Darlehens D von 800''000 und damit doppelt gezählt.

    (2) In der Zeile «A / B / D / E und Zinsen 150''000 / 200''000 / 800''000 / 800''000 / 800''000» sind die Beträge gegenüber den Bezeichnungen verschoben (150''000 = Zinsen). Das
    Subtotal 2''750''000 steht ohne VJ-Wert.

    (3) «Zinsverbindlichkeiten ggü. nahestehenden Parteien 0», obwohl 2170 150''000 ausweist.

    (4) Die VJ-Spalte nennt nur 2''300''000; das Darlehen D über 250''000 fehlt (geprüfte JR 2024 Ziff. 4: 2''300''000 + 250''000, Zinsen 20''000).

    (5) Die Forderung gegenüber Aktionär und VR-Präsident A über 150''000 fehlt.

    (6) Die Pauschalaussage zum Rangrücktritt trifft nicht zu: belegt sind 1''500''000 von 2''600''000.

    (7) Die Rubrik lautet «Langfristige verzinsliche Verbindlichkeiten», die Bilanz zeigt die Darlehen unter «Übrige langfristige Verbindlichkeiten».'
