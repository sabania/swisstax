  id: F1-c
  titel: 'Cut-off: Lieferung Montageschienen SolarTech ST-25-10012 vom 29.12.2025 (CHF 14''000) nicht als Verbindlichkeit erfasst'
  sachverhalt: Die Saldobestätigung von SolarTech Import GmbH (datiert 16.01.2026) weist per 31.12.2025 offene Posten von total 312'400 aus. Darin enthalten ist ST-25-10012 vom 29.12.2025,
    «Lieferung Montageschienen 29.12.2025», über CHF 14'000. In der Kreditoren-OP-Liste per 31.12.2025 stehen für K-2004 nur ST-25-9921 (158'400) und ST-25-9987 (140'000), zusammen 298'400;
    die Differenz von 14'000 entspricht genau dieser Rechnung. Die OP-Liste (Total 1'160'000) stimmt mit dem Hauptbuch 2000 überein; im Kontoblatt 2000 sind die Dezember-Rechnungen einzeln
    gebucht, ST-25-10012 fehlt. Die Rechnung fehlt auch im Kreditorenjournal Januar 2026 und im Kontoblatt 2000 Januar 2026. Bezahlt wurde sie am 21.01.2026 ab Konto 1011 («Zahlung SolarTech
    Import GmbH ST-25-10012», 14'000.00). Die Ware wurde vor der Lagersperre geliefert (Sperre ab 30.12.2025, 16:00). Ging sie ins Lager, wurde sie gezählt; die Montageschienen sind
    im Inventar mit V-SCH42 640 Stk = 11'840 enthalten. Dann fehlt nur der Aufwand, und das Ergebnis ist zu günstig ausgewiesen. Konto 2010 «zu erhalt. EK-RG» (Saldo 8'000, nur Sammelbuchungen
    gegen 4300) kann die Rechnung höchstens teilweise enthalten; einen Detailnachweis dazu gibt es nicht.
  nachweis:
  - H_Kreditoren/Saldobestaetigung_Lieferant_SolarTech_31.12.2025.md Z. 24 (ST-25-10012, 29.12.2025, 14'000.00) und Z. 26 (Total 312'400.00)
  - 'H_Kreditoren/Kreditoren_OP_Liste_31.12.2025.md Z. 11–12 (K-2004: 158400 und 140000), Z. 23 (Total 1160000)'
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Blatt 2000, Z. 827–838 (Dezember-Rechnungen ohne ST-25-10012, Saldo 1160000)
  - H_Kreditoren/Kreditorenjournal_Januar_2026.md Z. 11–18 (nicht enthalten); 00_Allgemein/Kontoblaetter_Folgejahr_Jan_Feb_2026.md Z. 35–39 (Blatt 2000, nicht enthalten)
  - A_Fluessige_Mittel/Kontoauszug_Testbank_1011_CHF_Januar_2026.md Z. 65 (21.01.2026 Zahlung ST-25-10012, 14'000.00)
  - D_Vorraete/Inventurprotokoll_31.12.2025.md Z. 10 (Lager ab 30.12.2025, 16:00 gesperrt) und Z. 11 (Material auf Baustellen nicht gezählt)
