  sachverhalt: 'HB 1100 am 15.10.2025, Beleg DL-2025-01 «Darlehen an Peter Testmann (Aktionär A)», Soll 150''000, Gegenkonto 1010. Die OP-Liste führt den Posten als D-0001 mit Fälligkeit
