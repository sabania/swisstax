  titel: 'Quellensteuer 2279: Dezember-Abrechnung offensichtlich unplausibel (Ø 53.61 %); 12''411.84 des Saldos nicht erklärt; Bezugsprovision 5790 unplausibel'
  sachverhalt: 'Der Saldo 2279 von 20''000 entspricht genau dem Total der «Quellensteuer-Abrechnung Dezember 2025» (8 Personen). Diese Abrechnung ist nicht glaubwürdig: Die Quellensteuer
    von 20''000 auf Dezember-Bruttolöhnen von 37''308.34 ergibt 53.61 %. Je Person liegen die Sätze zwischen 40.26 % (P144) und 70.20 % (P135: 2''655.90 auf 3''783.33; P105: 3''120.40
    auf 4''491.67 = 69.47 %).


    Gemäss Kontoblatt 2279 betragen die QST-Abzüge im Dezember (SB-12 Haben) nur 7''588.16, also 20.34 % der Dezember-Bruttolöhne. Im ganzen Jahr sind es 82''257.31, das sind 18.37 %
    der Jahreslöhne der 8 QST-Pflichtigen (447''700). Der Saldo setzt sich zusammen aus EB 10''000 (QST Dez. 2024) + Abzüge 82''257.31 − Belastungen 72''257.31. Damit sind 12''411.84
    nicht durch die Dezember-Abzüge erklärt.


    Die Bezugsprovision 5790 (Ertrag) von 10''000 (VJ 2''800) entspricht 12.16 % der QST-Abzüge 2025 und ist unplausibel hoch. Die Monatsabrechnungen 2025 fehlen.'
