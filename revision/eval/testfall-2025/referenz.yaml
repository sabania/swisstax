  id: C-08
  titel: 'Konto 1192: Einzelnachweis fehlt; Anzahlung SolarTech 20''000 (08.12.2025) und Dezember-Sammelbuchungen mit Gegenkonto 1011 weder im Kontoblatt 1011 noch auf den Bankauszügen'
  sachverhalt: 'Für 1192 liegt per 31.12.2025 keine Detailliste vor (VJ: D-01). Die Zusammensetzung 30''000 + 20''000 ist nur rechnerisch hergeleitet (C-01). HB 1192 bucht am 08.12.2025
    «AZ-25-0388 Anzahlung SolarTech Import GmbH», Gegenkonto 1011, 20''000. Dazu kommen SB-12 mit Zugängen von 23''849.81 und Abgängen von 67''827.54, ebenfalls gegen 1011, obwohl das
    Hauptbuch den Dezember «im Detail» führen soll. Keine dieser Buchungen erscheint im detaillierten Kontoblatt 1011 (BA-1201 bis BA-1219) oder im Testbank-Auszug 1011 für Dezember.
    Auch der Fiktiva-Auszug 1010 für Dezember zeigt keine Zahlung von 20''000. Extern bestätigt SolarTech am 16.01.2026: «AZ-25-0388 03.12.2025 Anzahlung (bezahlt 08.12.2025) 0.00».
    Die Anzahlung besteht also (8 % × 250''000 = 20''000), der Zahlungsweg ist aber offen. Unterjährig wies 1192 Habensaldi aus (31.01. −15''725.83, 28.02. −4''113.67, 31.03. −8''924.57),
    am Stichtag keine. Die Testbank bestätigt zusätzlich ein «Kontokorrent Projekte» von CHF 4''812.55 (eröffnet 02.09.2025), das nicht gebucht ist. Ein Zusammenhang ist nicht belegt.
    Kontoblätter des Folgejahres liegen nur für 1100, 3200 und 2000 vor, nicht für 1192.'
