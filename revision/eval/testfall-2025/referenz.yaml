  zitat: Die gesetzliche Kapitalreserve darf an die Aktionäre zurückbezahlt werden, wenn die gesetzlichen Kapital- und Gewinnreserven, abzüglich des Betrags allfälliger Verluste, die
    Hälfte des im Handelsregister eingetragenen Aktienkapitals übersteigen.
