  - 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md Z.596–602 (Anhang Ziff. 2) und Z.237–242 (Total Eigenkapital −3'178'383.56)
  soll: 'Aus 1100 in die übrigen kurzfristigen Forderungen gegenüber Aktionären umgliedern und in Bilanz oder Anhang gesondert ausweisen. Zins 2025 abgrenzen (Aktive Rechnungsabgrenzung
    an Zinsertrag ca. CHF 316.44). Drittvergleich bzw. Einlagenrückgewähr (Art. 680 Abs. 2 OR; HWP ER Rz 168, hwp-er-2026__rz-0168-s215: «Das Total der Forderungen gegenüber Aktionären
    übersteigt das freie Eigenkapital.») und Werthaltigkeit durch den WP beurteilen lassen. Den Zinssatz gegen die ESTV-Sätze prüfen (Rundschreiben 2025 nicht in den Quellen; für 2026
