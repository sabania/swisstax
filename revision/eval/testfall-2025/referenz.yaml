- bereich: abgrenzungen
  id: K-05
  titel: Rückstellung Rechtsfall als ausserordentlicher Aufwand (8500) gebucht; ER 8500/4404, Anhang Ziff. 3 und Abschlussbuchungen nicht abstimmbar
  sachverhalt: 'AB-36 (CHF 45''000) ist zulasten 8500 «A.o. Aufwand» gebucht. Die Mängelrüge betrifft eine 2024 erstellte PV-Anlage, also Gewährleistung aus dem Kerngeschäft. Das ist
    kein ungewöhnlicher, einmaliger Vorgang. Die Zahlen lassen sich zudem nicht abstimmen: (1) Die ER zeigt für 8500 einen Habensaldo von +3''000 («Total Ausserordentlicher Aufwand 3''000.00»).
    Trotz der Belastung von 45''000 müssten die übrigen Buchungen auf 8500 also netto +48''000 im Haben ergeben. (2) Anhang Ziff. 3 nennt einen a.o. Aufwand von −28''892. Die Positionen
    −20''499 und −7''874 ergeben aber nur −28''373 (Differenz 519), und der Rechtsfall ist nicht erwähnt. (3) Analog ist AB-37 (Garantierückstellung 40''000) gegen 4404 gebucht, in der
    ER steht 4404 aber nur mit −30''000. Die übrigen Buchungen auf 4404 ergäben damit netto +10''000 im Haben, was nicht plausibel ist (VJ −20''000). Die Kontoblätter 8500 und 4404 fehlen
    im Dossier (Hauptbuch nur mit Bilanzkonten und 8510). Querbezug ER/Anhang: Der a.o. Ertrag laut Anhang (49''959) stimmt nicht mit 8510 (50''000) überein; die drei erläuterten Posten
    ergeben 39''298.'
