  sachverhalt: 'Zwei Lieferantenrechnungen für Leistungen von 2025 wurden erst im Jahr 2026 gebucht. (1) Montagebau Teststein GmbH, Rechnung 2025-1187 vom 22.12.2025, «Montagearbeiten
