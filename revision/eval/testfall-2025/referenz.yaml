  id: N1-h
  titel: 'Anhang Ziff. 2 (nahestehende Parteien): falsche, widersprüchliche Beträge, fehlende Forderung ggü. A, unzutreffende Aussage zum Rangrücktritt'
  sachverhalt: 'Anhang Ziff. 2 hat folgende Mängel: (1) «Darlehen ggü. Aktionären 250''000 / 2''300''000», obwohl 2450 per 31.12.2025 0 ist; die 250''000 von D sind bereits in 2454 (800''000)
    enthalten. Die VJ-Spalte ist unvollständig, richtig nach Anhang 2024 Ziff. 4 wären 2''300''000 + 250''000 = 2''550''000 plus Zinsen 20''000. (2) «Aktionärsdarlehen Gesellschafter
    A / B / D / E und Zinsen 150''000 / 200''000 / 800''000 / 800''000 / 800''000»: fünf Beträge ohne eindeutige Zuordnung, die Reihenfolge passt nicht, es fehlen VJ-Werte. (3) 250''000
    + Subtotal 2''750''000 ergäben 3''000''000; die Bilanz zeigt 2''750''000. (4) «Zinsverbindlichkeiten ggü. nahestehenden Parteien 2025: 0», laut 2170 aber 150''000. (5) «Für die Darlehen
    gegenüber nahestehenden Personen (Parteien) wurde ein Rangrücktritt vereinbart»: unzutreffend für E (kein RR in der Akte) und für B im Umfang von 300''000; Beträge, Daten und Umfang
    der RR fehlen. (6) Die Forderung ggü. Aktionär A (150''000) fehlt trotz der Überschrift «Forderungen und …».'
