  id: R1-04
  titel: Quellensteuer 2279 CHF 20'000 nicht nachgewiesen – Dezember-Liste offensichtlich auf den Kontosaldo ausgerichtet
  sachverhalt: 'Zusammengeführt aus L-05 und M1-a. Konto 2279 per 31.12.2025 CHF 20''000 (VJ 10''000 = Abrechnung Dez. 2024). Die «Quellensteuer-Abrechnung Dezember 2025» (Kopie Lohnbuchhaltung)
    ergibt exakt 20''000.00 auf Bruttolöhnen von 37''308.34, also 53.61 %. Die Einzelsätze liegen bei 40.26 % (P144) bis 70.20 % (P135); P105 hat 3''120.40 auf 4''491.67 (69.47 %). Das
    ist unplausibel. Personenkreis (8 × QST = J) und Bruttolohn Dez. (= Jahreslohn/12) stimmen dagegen. Gemäss Kontoblatt wurden im Dezember nur 7''588.16 QST abgezogen (SB-12). Abzüge
    im ganzen Jahr 82''257.31 (18.37 % der Jahreslöhne der QST-Pflichtigen von 447''700), Abnahmen 72''257.31. In den detaillierten Dezember-Bankbuchungen 1010/1011 ist keine Zahlung
    an das Steueramt ersichtlich. Die Differenz von 12''411.84 ist ungeklärt: Entweder ist die Verbindlichkeit überhöht, oder QST früherer Monate wurden nicht abgeliefert (Haftung des
    Arbeitgebers, Art. 88 Abs. 3 DBG; Steuer-Wiki bund-dbg-2025__art-88).'
