  id: P1-04
  titel: 'Antrag VR: Ausschüttung CHF 400''000 aus der gesetzlichen Kapitalreserve gesetzwidrig und mit der Liquidität unvereinbar'
  sachverhalt: 'Antrag VR vom 15.05.2026: Der Bilanzverlust von −6''521''716.56 (−5''894''946.39 − 626''770.17, rechnerisch korrekt) wird vorgetragen. Gleichzeitig sollen 400''000 (CHF
    400 je Aktie) aus «Kapitalreserven (Agio Kapitalerhöhung 2025)» ausgeschüttet werden, «verrechnungssteuerfrei» und ausbezahlt «aus den laufenden Mitteln».

    Prüfung nach Art. 671 Abs. 2 OR: 3''233''333 + 10''000 − 6''521''716.56 = −3''278''383.56. Die Hälfte des AK beträgt 50''000; sie wird um 3''328''383.56 unterschritten. Eine Rückzahlung
    ist unzulässig.

    Weitere Mängel:

    - Es bestehen Kapitalverlust und Überschuldung (P1-01). Art. 725a OR verlangt Massnahmen zur Beseitigung, keine Ausschüttung.

    - Die Empfänger A, B und D sind zugleich RR-Gläubiger und haben auf Zahlungen verzichtet.

    - Flüssige Mittel per 31.12.2025 betragen 278''007.32, also 121''992.68 weniger als die Ausschüttung. Der Festvorschuss von 200''000 ist am 31.03.2026 fällig. Anhang Ziff. 6: «Die
    Liquiditätssituation bleibt angespannt».

    - 400 × 1''000 Aktien = 400''000; laut Aktienbuch (950 Aktien) wären es 380''000.

    - Der Antrag stützt sich auf ein Agio von 3''233''333, das GV-Protokoll nennt 3''133''333 (P1-10).

    - Eine Bestätigung der KER durch die ESTV fehlt.

    - Der Vortrag ohne Verrechnung verhindert den Sanierungsfreibetrag bei der Emissionsabgabe (P1-11).

    - Ein separater Antrag über die Rückzahlung aus der gesetzlichen Kapitalreserve (Art. 698 Abs. 2 Ziff. 6 OR) fehlt.'
