- bereich: debitoren
  id: H2-2
  titel: 'Darlehen an Aktionär A ohne freies Eigenkapital und ohne Drittvergleich: verbotene Einlagenrückgewähr (Art. 680 Abs. 2 OR) wahrscheinlich, wirtschaftliche Teilrückführung an
    einen Rangrücktrittsgläubiger'
  sachverhalt: 'Eigenkapital 31.12.2025: −3''178''383.56 (Bilanz). Abzüglich Aktienkapital 100''000 ergibt sich ein freies Eigenkapital von −3''278''383.56 (nachgerechnet). Die Forderung
    gegenüber dem Aktionär von 150''000 übersteigt das freie Eigenkapital, ein Drittvergleich ist daher zwingend. Die Konditionen sprechen dagegen: Zins 1.0 %, «zahlbar mit Rückzahlung»;
    keine Amortisation; Sicherheit «keine»; Zweck privat. Die Gesellschaft selbst zahlt 2.0 % auf das Darlehen von A (Vertrag Ziff. 3) und 2.85 % bzw. 2.40 % an die Bank (FV-2023-118,
    DL-2021-044). Laut Anhang Ziff. 6 bleibt die Liquidität «angespannt». A ist zugleich Gläubiger von 200''000 (Konto 2451) mit Rangrücktritt vom 28.02.2025: Verzicht auf Zins- und
    Rückzahlungen, solange die Überschuldung nicht beseitigt ist. Eine Verrechnung beider Positionen ist damit ausgeschlossen, eine Nettobetrachtung also nicht zulässig (HWP ER Rz 167/415).
