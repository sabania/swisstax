  titel: 'Dezember: Sammel-Gegenbuchungen gegen Geldkonten ohne Bewegung auf den Geldkonten (1100, 2000, 2100, 1192, 8510)'
  sachverhalt: 'Die Dezember-Detailbuchungen auf 1010, 1011 und 1012 stimmen 1:1 mit den Auszügen überein. Die Gegenkonten passen nicht dazu:

    - 1100 ZE-12 «Zahlungseingänge Dezember (Sammel)», Gegenkonto 1011/1010, Haben 777''916.52. Debitorenzahlungen laut 1011 (226''980.64) und 1010 (232''445.50): total 459''426.14.
    Differenz 318''490.38, unter Einbezug der 1012-Buchung von 6''323.22 noch 312''167.16. ZE-12 führt 1100 exakt auf 1''150''000.00.

    - 2000 ZA-12 «Zahlungen Dezember (Sammel)», Gegenkonto 1011/1010, Soll 342''837.29. Lieferantenzahlungen laut 1011 (238''268.58) und 1010 (236''226.14): total 474''494.72, also 131''657.43
    mehr; inklusive 1012 (13''580.22) 145''237.65 mehr. ZA-12 führt 2000 exakt auf 1''160''000.00.

    - 2100 SB-12, Gegenkonto 1010: Haben 125''757.22, Soll 346''871.76. Diese Bewegungen fehlen auf Blatt 1010 und im Fiktiva-Auszug Dezember; 2100 endet exakt auf 200''000.

    - 1192 SB-12 (Zugänge 23''849.81, Abgänge 67''827.54) und AZ-25-0388 (20''000, 08.12.), Gegenkonto 1011: weder auf Blatt 1011 noch im Auszug.

    - 8510 AB-38 «Diverse Gutschriften» 4''202.00 vom 31.12., Gegenkonto 1010: keine entsprechende Gutschrift im Fiktiva-Auszug; die Buchung führt 8510 exakt auf 50''000.

    - 1010 BA-1209 «Übertrag an Testbank» ist mit Gegenkonto 1010 statt 1011 kontiert.

    Das Hauptbuch ist damit in sich nicht abgestimmt. Die Sammelbuchungen setzen Konten auf runde Zielsalden.'
