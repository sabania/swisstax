    Abzuklären ist, welcher «Server alt» entsorgt wurde, da der Server 2022 weiterhin im Verzeichnis steht. Ein allfälliger Restbuchwert ist als Verlust aus Anlagenabgang (8520) zu zeigen,
    nicht als Abschreibung 6830. Die Abschreibung 1520 ist objektbezogen herzuleiten. Ein Mehrbetrag über dem Plan ist als zusätzliche Abschreibung in den Stille-Reserven-Nachweis aufzunehmen
