  titel: Darlehen CHF 150'000 an Aktionär/VR-Präsident A ohne freies Eigenkapital und ohne bestandenen Drittvergleich – verbotene Einlagenrückgewähr (Art. 680 Abs. 2 OR)
  sachverhalt: 'Vertrag DL-2025-01 vom 10.10.2025: CHF 150''000 an Peter Testmann (Aktionär A, VR-Präsident), ausbezahlt am 15.10.2025 aus 1010 (Blatt 1100). Zweck «Privater Liegenschaftskauf»,
    Zins 1.0 % «zahlbar mit Rückzahlung», Rückzahlung bis 31.12.2026, keine Sicherheit. Freies Eigenkapital (EK abzüglich AK) -3''178''383.56 - 100''000 = -3''278''383.56: Die Forderung
    ist durch kein freies EK gedeckt. Gegen den Drittvergleich sprechen: keine Sicherheit, privater Zweck, Zins unter den eigenen Finanzierungskosten (Aktionärsdarlehen 2 %, FV 2.85
    %, DL 2.40 %; gewichtet rund 2.09 %), Darlehensgeberin überschuldet und knapp liquide. A ist zugleich RR-Gläubiger über 200''000 (2451) und hat auf Rückzahlungen verzichtet; wirtschaftlich
    fliessen ihm 75 % davon zurück. Genehmigt wurde das Darlehen laut Vertrag durch VR-Beschluss vom 10.10.2025 (Darlehensnehmer im Ausstand). Der VR besteht aus P. Testmann und C. Beispiel,
    also entschied und unterzeichnete C. Beispiel allein, selbst Aktionärin D und RR-Gläubigerin. Das Protokoll liegt nicht in der Akte. Steuerlich gilt eine ungenügende Verzinsung als
    geldwerte Leistung; nach ESTV-Rundschreiben 2026 beträgt der Mindestzins bei Finanzierung aus Fremdkapital «Selbstkosten zuzügl. ¼–½ %». Das Rundschreiben 2025 ist nicht in den Quellen.'
