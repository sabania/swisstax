  id: G1-e
  titel: Fahrzeugverkauf «ohne MWST (Verkauf wie unter Privaten)» – Umsatzsteuer von rund 487.05 nicht abgerechnet
  sachverhalt: Der Kaufvertrag lautet auf «CHF 6'500.00 netto, ohne MWST (Verkauf wie unter Privaten)». Die Gesellschaft ist nach der effektiven Methode mehrwertsteuerpflichtig (8.1
    %). Der Lieferwagen diente der steuerbaren Tätigkeit (Bau und Unterhalt von PV-Anlagen). Die Ausnahme für gebrauchte bewegliche Gegenstände greift nur, wenn diese ausschliesslich
    für von der Steuer ausgenommene Leistungen verwendet wurden; das trifft hier nicht zu. Der Erlös ist vollständig auf 8510 gebucht, ohne Umsatzsteuer. Aus dem Zusammenzug ist nicht
    ersichtlich, ob der Erlös in Ziff. 200 Q4 (2'100'000) deklariert wurde.
