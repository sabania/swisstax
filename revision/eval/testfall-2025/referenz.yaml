  sachverhalt: 'Projektliste 31.12.2025 (Z. 13), P-2025-07: Kosten total CHF 420''000 (Einzelkosten 355''932.20 + GK 64''067.80), Bilanzwert CHF 520''000, Bewertungsmethode «anteiliger
    Auftragswert (FG 50 % × Auftragswert)» = 50 % × 1''040''000. Der in derselben Liste berechnete Fertigstellungsgrad beträgt 420''000 / (420''000 + 470''000) = 0.4719, nicht 50 %.
    Die übrigen 7 Projekte sind zu Herstellkosten ohne Gewinnanteil bewertet; der Listenkopf (Z. 8) lautet «Bewertung zu Herstellkosten». Total Bilanzwert CHF 3''900''000 − Total Kosten
    CHF 3''800''000 = CHF 100''000 = aktivierter Gewinnanteil. Vorjahr: «Herstellkosten ohne Gewinnanteil (Bilanzwert = Kosten total)» (VJ F2-203). Selbst nach POC mit dem eigenen Fertigstellungsgrad
    wäre der Wert 1''040''000 × 0.4719 = CHF 490''786.52, also CHF 29''213.48 tiefer.'
