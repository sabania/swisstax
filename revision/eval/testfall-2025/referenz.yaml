  soll: 'Der Verkauf ist als steuerbare Lieferung zu behandeln. Weil keine MWST überwälzt wurde, ist die Steuer aus dem Entgelt herauszurechnen: 6''500 × 8.1/108.1 = 487.05 (Nettoerlös
    6''012.95). Buchung zulasten des Abgangserfolgs (8530 bzw. 8510)/2200 487.05; die Deklaration ist in Q4 bzw. in der Finalisierung 2025 zu prüfen und zu korrigieren. Eine nachträgliche
    Fakturierung von 526.50 an den Käufer ist nur möglich, wenn sie vertraglich durchsetzbar ist. Der Betrag liegt unter der NAG; Beurteilung und Umsatzabstimmung im Prüffeld M2.'
