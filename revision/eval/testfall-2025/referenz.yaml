  titel: 'Querverweis Kapitalschutz: Die Überschuldung ist durch Rangrücktritte nicht gedeckt, die Korrekturen M1/M2 vergrössern sie; Anhang Ziff. 6 nicht haltbar'
  sachverhalt: 'Das Eigenkapital per 31.12.2025 beträgt −3''178''383.56 (100''000 + 10''000 + 3''233''333 − 5''894''946.39 − 626''770.17).


    Rangrücktritte «samt Zinsen» bestehen nur für A (200''000), B (500''000; am 30.11.2025 von 800''000 reduziert, Darlehen 2452 weiterhin 800''000) und D (800''000), zusammen 1''500''000.
