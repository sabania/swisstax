  id: R1-03
  titel: Ausbuchung AB-39 CHF 85'000 auf AHV-Konto 2270 zugunsten 5700 ohne Abstimmung – vor dem Datum der Schlussabrechnung gebucht
  sachverhalt: 'Zusammengeführt aus L-08 und R1-c. AB-39 vom 31.12.2025 «Ausbuchung Saldo AHV gemäss Abstimmung Schlussabrechnung»: Soll 2270 85''000, Gegenkonto 5700 (Aufwandminderung).
    Ohne AB-39 betrüge 2270 CHF 105''000 statt 20''000 und 5700 CHF 285''000 statt 200''000. Die Saldoliste mit 2270 = 20''000 wurde am 14.02.2026 exportiert, die Schlussabrechnung der
    AK datiert aber vom 26.02.2026. Die Buchung kann sich also nicht auf diese Schlussabrechnung gestützt haben. Die Bewegungen 2025 auf 2270 lassen sich nicht abstimmen: Haben 1''039''260.34
    und Soll ohne AB-39 934''260.34, gegenüber Beiträgen von 376''472.40 und Akonti von 356''472.40 gemäss AK. Die Bankzahlung «Akonto 12/2025» von 60''078.00 (1010, BA-1202, 03.12.2025,
    Gegenkonto 2270) ist im Kontoblatt 2270 nicht ersichtlich: Dort stehen im Dezember nur Belastungen von 24''119.47 (SB-12) und AB-39. Eine Abstimmung des AHV-Kontokorrents liegt nicht
    vor (VJ: M-02). Die Ausbuchung kompensiert unter anderem die fehlenden Beiträge auf P140/P141 (R1-02).'
