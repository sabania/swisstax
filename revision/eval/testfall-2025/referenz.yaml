- bereich: anlagen
  id: G1-d
  titel: Zugang ITF-25-0512 brutto inkl. MWST 1'799 aktiviert (effektive Methode); MWST auf der Rechnung falsch berechnet
  sachverhalt: 'KR-0515 aktiviert den Bruttobetrag von 24''000.00 auf 1520 (Gegenkonto 2000), darin MWST von 1''799.00. Eine Vorsteuer auf 1171 ist nicht ausgeschieden. Die Gesellschaft
    rechnet effektiv ab (vereinbartes Entgelt, 8.1 %). Die Rechnung ist rechnerisch falsch: 8.1 % von 22''201.00 = 1''798.28 (auf 5 Rp. gerundet 1''798.30), nicht 1''799.00; richtig
    wäre ein Total von 23''999.30. Der runde Bruttobetrag deutet auf eine Rückrechnung hin (24''000/1.081 = 22''201.67). Weil die Rechnung nicht auf die Gesellschaft lautet (G1-c), fehlt
    zudem die Angabe des Leistungsempfängers, wie sie für den Vorsteuerabzug verlangt ist.'
  nachweis:
  - G_Anlagevermoegen/Rechnung_ITF-25-0512_Server_Notebooks.md Z. 20–24
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Z. 718
  - J_Uebrige_kurzfristige_Verbindlichkeiten/MWST_Abrechnungen_2025_Zusammenzug.md Z. 8 (effektive Methode, 8.1 %)
  soll: 'Ist die Investition geschäftlich, sind die Anschaffungskosten netto zu aktivieren (22''201.00). Die Vorsteuer ist gestützt auf eine korrigierte, auf die Gesellschaft lautende
    Rechnung auf 1171 zu erfassen: Umbuchung 1171/1520 1''799.00, bzw. 1''798.30 gemäss korrigierter Rechnung, Rest 0.70 klären. Die Abschreibung 2025 ist anzupassen (indikativ pro rata
