  id: B1-R02
  titel: Fremdwährungsguthaben 1012/1014/1031 zu 0.9350 statt Stichtagskurs 0.9295 bewertet (CHF 224.16 zu hoch)
  sachverhalt: 'HB 1012 und HB 1014 buchen am 31.12.2025 je «KB-12 Kursbewertung 31.12.2025 (Kurs 0.9350)». Bei 1031 Musterpay EUR entspricht der Buchwert von 18''007.32 genau EUR 19''259.17
    × 0.9350. Der Kurs 0.9350 ergibt exakt die runden Buchsalden 20''000.00 (1012) und 100.00 (1014). Massgebend ist der Stichtagskurs EUR/CHF 0.9295: Er steht in den Auszügen 1012 und
    1014 («Devisenkurs EUR/CHF per 31.12.2025: 0.9295») und in der Testbank-Bestätigung («Gegenwert Konto EUR: CHF 19''882.35»).

    Nachgerechnet:

    - 1012: EUR 21''390.37 × 0.9295 = 19''882.35, gebucht 20''000.00, Differenz 117.65

    - 1014: EUR 106.95 × 0.9295 = 99.41, gebucht 100.00, Differenz 0.59

    - 1031: EUR 19''259.17 × 0.9295 = 17''901.40, gebucht 18''007.32, Differenz 105.92

    Die Überbewertung beträgt total CHF 224.16, der Kursverlust ist um diesen Betrag zu tief. Im Vorjahr entsprach der verwendete Kurs 0.9400 dem Stichtagskurs der Bank (Prüfakte 2024
    B1-302).'
