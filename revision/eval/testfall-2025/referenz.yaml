    Die ersetzte Erklärung war «unwiderruflich» und galt «bis zur Beseitigung der Überschuldung gemäss geprüfter Bilanz» (VJ L-04 B). Das Darlehen 2452 steht per 31.12.2025 unverändert
    auf 800''000; 300''000 sind damit nicht mehr nachrangig.

    Die Überschuldung bestand am 30.11.2025 fort und ist durch den Verlust 2025 gewachsen.

    Keine der Voraussetzungen nach HWP ER Rz 425 ist belegt: kein geprüfter (Zwischen-)Abschluss mit entsprechend reduzierter Überschuldung, keine schriftlich begründete VR-Erklärung,
    keine Zustimmung der übrigen RR-Gläubiger. Ein VR-Protokoll fehlt.

    Das Darlehen ist mit 6 Monaten Frist auf jedes Monatsende kündbar (Vertrag B Ziff. 4); der angegebene Mittelbedarf des Gläubigers deutet auf eine Kündigung hin.

    Kontoblätter 2452 für 2026 liegen nicht vor (Folgejahr nur 1100/3200/2000). Der Anhang erwähnt die Reduktion nicht.'
