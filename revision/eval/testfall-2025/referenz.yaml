    (bis CHF 100''000, Erhöhung 55''000; hwp-bur-2023__rz-0515-s261). Der Zielwert der GF ist keine Schätzgrundlage. Pendenzen: Forderungsschreiben bzw. Klage einsehen (ser-2022__anh-d-s088-1).
    Die Gesellschaft soll eine schriftliche Stellungnahme des RA einholen (hwp-bur-2023__rz-0526-s263); eine Anwaltsbestätigung durch die Revisionsstelle gehört nicht zur eingeschränkten
    Revision. Weiter abklären: Stand des Verfahrens bzw. Vergleichs bis zum Datum der JR (03.07.2026), allfällige Versicherungsdeckung (Betriebshaftpflicht 6310) und die Wechselwirkung
    mit der Gutschrift GS-2026-003 (K-02). Der Rechtsfall gehört in die Vollständigkeitserklärung 2025.'
