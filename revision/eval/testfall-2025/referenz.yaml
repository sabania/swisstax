  titel: Abschreibungen in der ER (87'200.00) stimmen nicht mit Hauptbuch/Anlagespiegel (70'885.45) überein – Differenz netto CHF 16'314.55
  sachverhalt: 'Die Abschreibungsbuchungen AB-40 vom 31.12.2025 auf den WB-Konten 1509/1519/1529/1539/1549/1709 und der Anlagespiegel 2025 (Spalte «Abschreibung 2025») ergeben CHF 70''885.45:
    6810 1''043.68, 6820 12''224.63, 6830 45''599.69, 6840 4''769.13, 6850 1''546.80, 6880 5''701.52. Saldoliste ER und Jahresrechnung zeigen dagegen 87''200.00: 6810 1''000, 6820 10''000,
    6830 20''000, 6840 4''700, 6850 1''500, 6880 50''000. Die ER ist netto um 16''314.55 höher. Je Konto (ER minus Hauptbuch): 6880 +44''298.48, 6830 −25''599.69, 6820 −2''224.63, 6840
    −69.13, 6850 −46.80, 6810 −43.68 (Summe der Beträge 72''282.41). 6880 mit 50''000 übersteigt sogar den Buchwert der immateriellen Werte per 01.01.2025 (25''656.83) und ist mit der
    Bilanz unvereinbar. Nachgerechnet: Die Saldoliste ER ergibt −626''770.17 und stimmt mit dem Jahresergebnis der Bilanz (2979) überein; die Bilanz ist ausgeglichen (5''946''131.76).
    Die Gegendifferenz von 16''314.55 muss also in anderen ER-Konten liegen. ER-Kontoblätter fehlen in der Akte (Hauptbuch-Export nur Bilanzkonten und 8510). Im VJ stimmten Anlagespiegel
    und ER überein (131''000).'
