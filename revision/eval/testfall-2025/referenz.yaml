- bereich: anlagen
  id: I1-a
  titel: 'Immaterielle Werte: Abschreibung 2025 von 5''701.52 nicht nach Plan (linear 17''049.20, VJ 50''000) – Buchwert entspricht einem bereits im VJ-Stille-Reserven-Nachweis genannten
    Zielwert; Werthaltigkeit nicht dokumentiert'
  sachverhalt: Konto 1709 zeigt AB-40 von 5'701.52; in der ER steht 6880 mit 50'000 (vgl. G1-a). Laut Anlagenverzeichnis gelten Software-Eigenentwicklung 61'246 (2021–2022, 5 J.) und
    Lizenz Planungssoftware (unbefristet) 24'000 (15.01.2022, 5 J.). Linear wären 17'049.20 pro Jahr; gebucht ist 11'347.68 weniger. In den Vorjahren waren es 2023 40'000 und 2024 50'000.
    5'701.52 entspricht genau dem Buchwert 01.01. (25'656.83) × 2/9. Der Buchwert per 31.12.2025 von 19'955.31 erscheint bereits im Stille-Reserven-Nachweis 2024 (unterzeichnet 09.05.2025)
    als Bilanzwert und als «betriebswirtschaftlich nötig» für Patente/Software, obwohl der Buchwert per 31.12.2024 25'656.83 betrug. Der VJ-Nachweis ist damit fehlerhaft; die Abschreibung
    2025 ist offenbar auf diesen Zielwert gerechnet. Liegt der Wert von 19'955.31 schon per 31.12.2024 zugrunde, war das VJ um 5'701.52 überbewertet (periodenfremd). Zusätzlich deutet
    die Aktive Rechnungsabgrenzung «Softwarelizenz Planungssoftware 2026» (Softplan Test GmbH, 11'600; VJ nur «Softwarewartung 2025» 3'800) auf einen Wechsel zu einer Jahreslizenz hin,
    also auf eine mögliche Nichtnutzung der aktivierten unbefristeten Lizenz. Die Werthaltigkeit der Eigenentwicklung bei Jahresverlust und negativem Eigenkapital ist nicht dokumentiert.
    Kumuliert liegt der Buchwert je nach Nutzungsbeginn der Eigenentwicklung innerhalb des linearen Rahmens; eine Überbewertung ist daher nicht belegt.
  nachweis:
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Z. 794 (AB-40 6880 5701.52)
  - G_Anlagevermoegen/Anlagespiegel_2025.md Z. 16 und Z. 36–37
  - 'VJ: fiktive-zahlen-ag-2024/text/07_Unterlagen_zum_Abschluss/7-05_Stille_Reserven_2024_unterzeichnet.md Z. 12 (Patente/Software 19955.31)'
  - 'VJ: fiktive-zahlen-ag-2024/text/G_I_Sachanlagen_Immaterielle/G-01_Anlagespiegel_2024.md Z. 16 (BW 31.12.2024 25656.83)'
  - F_Aktive_Rechnungsabgrenzung/Aktive_Rechnungsabgrenzungen_31.12.2025.md Z. 11 (SPT-25-1190, 11600)
  - 'VJ: fiktive-zahlen-ag-2024/text/E_Aktive_Rechnungsabgrenzungen/E-01_Aktive_Rechnungsabgrenzungen_31.12.2024.md Z. 11 (Softwarewartung 2025, 3800)'
  soll: 'Einzufordern ist ein Abschreibungsplan je Objekt (Nutzungsbeginn der Eigenentwicklung, Laufzeit der Lizenz). Die Abweichung zur linearen Abschreibung (11''347.68) und zum VJ
    ist zu begründen oder zu korrigieren; ein Verzicht auf planmässige Abschreibungen ist nur in Kompensation früherer Mehrabschreibungen zulässig. Per Befragung bzw. Pendenz sind Nutzung
    und Werthaltigkeit zu klären: Ertragsprognose-Software in Gebrauch? Planungssoftware noch als unbefristete Lizenz genutzt oder durch ein Abo ersetzt? Allenfalls ist eine ausserplanmässige
    Wertberichtigung nötig (I1-104, I1-406). Der Stille-Reserven-Nachweis ist per 31.12.2025 mit korrektem Bilanzwert neu zu erstellen, die VJ-Abweichung ist der Mandatsleitung zu melden.
    In der ER ist 6880 mit dem gebuchten bzw. korrigierten Wert auszuweisen.'
