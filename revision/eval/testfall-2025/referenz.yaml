- bereich: abgrenzungen
  id: K-06
  titel: 'Garantierückstellung 2630: erstmals gebildet, 4''500 unter eigener Berechnung, Satz nicht belegt, ganz als langfristig ausgewiesen'
  sachverhalt: 'Konto 2630 wurde erstmals mit CHF 40''000 gebildet (AB-37 vom 31.12.2025, Gegenkonto 4404). Grundlage ist eine «interne Richtlinie» von 0.5 % des Umsatzes Kraftwerke:
    8''900''000 × 0.5 % = CHF 44''500, gebucht «(gerundet)» CHF 40''000. Die Differenz von CHF 4''500 (10.1 %) ist keine Rundung. Die Richtlinie liegt nicht im Dossier. Im Vorjahr (O1-102)
    hiess es: «keine Garantierückstellung nötig (Erfahrung < 0.3 % Umsatz)»; 4404 betrug 2024 20''000, also 0.26 % von 7.6 Mio. Mit 0.3 % ergäben sich CHF 26''700, und die gebuchten
    40''000 enthielten rund CHF 13''300 über dem Erfahrungswert. Der effektive Garantieaufwand 2025 lässt sich nicht ermitteln, weil 4404 (−30''000) die Bildung von 40''000 bereits enthält
    (vgl. K-05). Ausweis: Die ganze Rückstellung steht im langfristigen Fremdkapital. Die Garantiefrist beträgt laut Kontobezeichnung 4404 aber «<2 Jahre nach IBN», und Fristen beginnen
    laufend (z.B. P-2025-03, Garantiebeginn 17.12.2025). Ein Teil wird deshalb voraussichtlich innert 12 Monaten beansprucht.'
  nachweis:
  - K_Passive_Abgrenzungen_Rueckstellungen/Passive_Abgrenzungen_und_Rueckstellungen_31.12.2025.md Blatt «Berechnung Garantie» Z. 40–45 (0.005 × 8'900'000 = 44'500; gebucht 40'000) und
