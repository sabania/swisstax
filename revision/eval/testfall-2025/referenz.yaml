  id: P1-10
  titel: 'Kapitalerhöhung 20.01.2025: Ausgabebetrag laut GV-Protokoll CHF 100''000 tiefer als gebucht; Formangaben und Belege fehlen'
  sachverhalt: 'Protokoll der ao GV vom 20.01.2025, Trakt. 2: Ausgabebetrag 3''213''333 (nominal 80''000 + Agio 3''133''333). Liberierung durch Verrechnung 2''300''000 (Konto 2450) und
    Bareinzahlung des Rests (913''333).

    Gebucht ist GV-01: 2800 +80''000 und 2962 +3''233''333 (= 3''313''333) gegen 2450 2''300''000 und 1010, also bar 1''013''333. Dies stimmt mit dem Kapitalerhöhungsbericht VR (VJ P-03),
    dem VJ-Anhang Ziff. 10 und der Bankgutschrift vom 29.01.2025 über 1''013''333 (VJ C-03) überein. Die Differenz zum GV-Protokoll beträgt 100''000.

    Weitere Mängel:

    - Das GV-Protokoll nennt weder den Gläubiger der Verrechnungsforderung noch die ihm zukommenden Aktien (Art. 650 Abs. 2 Ziff. 5 OR).

    - Statuten Art. 3 neu nennt nur das Kapital; die Angaben nach Art. 634a Abs. 3 OR sind nicht ersichtlich.

    - Der Kapitalerhöhungsbericht ist auf den 20.01.2025 datiert, nennt aber die Freigabe vom 29.01.2025.

    - Die Freigabe erfolgte vor der SHAB-Publikation vom 05.02.2025; das Datum des HR-Eintrags ist nicht belegt (Art. 633 Abs. 2 i.V.m. Art. 652c OR).

    In der Akte 2025 fehlen die öffentlichen Urkunden (GV-Beschluss, Feststellungsbeschluss VR nach Art. 652g OR), Statuten, HR-Auszug, Zeichnungsscheine, Prüfungsbestätigung nach Art.
    652f OR und Kapitaleinzahlungsbestätigung.'
  nachweis:
  - M_Eigenkapital/Protokoll_ao_GV_20.01.2025_Kapitalerhoehung.md Z. 13–20
  - 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md Z. 1315 (2450 GV-01), Z. 1407 (2800 GV-01 80'000), Z. 1428 (2962 GV-01 3'233'333)
