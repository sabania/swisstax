  id: C-02
  titel: 'Beteiligung überbewertet: Wertberichtigung von mindestens CHF 18''000 auf das anteilige Eigenkapital nicht gebucht, Werthaltigkeitstest fehlt'
  sachverhalt: 'Der Buchwert entspricht dem Kaufpreis von CHF 30''000. Die JR 2025 der Solarservice Probe GmbH (ohne Unterschrift, Revisionsstatus unbekannt) zeigt ein Total Eigenkapital
    von 12''000 (VJ 17''000): Stammkapital 20''000, Verlustvortrag −3''000, Jahresverlust −5''000. Die Verluste wiederholen sich (2024 −3''000, 2025 −5''000), der Umsatz ging von 205''000
    auf 180''000 zurück. Ausblick: «Wartungsverträge rückläufig, für 2026 wird erneut ein Verlust erwartet. Keine Dividende.» Nachgerechnet: Aktiven 6''000 + 22''000 + 20''000 = 48''000;
    EK 48''000 − 36''000 = 12''000; Buchwert − anteiliges EK (100 %) = 30''000 − 12''000 = 18''000. Schon beim Kauf lag der Preis 13''000 über dem EK per 31.12.2024. Der Kaufpreis stützt
    sich laut Vertrag auf die «Bilanz 30.06.2025; keine Gewährleistung für künftige Ertragslage»; diese Bilanz fehlt in der Akte. Eine Wertberichtigung ist nicht gebucht (kein entsprechendes
    Konto in der Saldoliste). Ein Werthaltigkeitstest oder eine Planungsrechnung ist nicht dokumentiert.'
