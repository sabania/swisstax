- bereich: anlagen
  id: G1-h
  titel: Restbuchwerte 1500/1510/1540 über dem deklarierten linearen Plan (indikativ rund CHF 34'400–34'500); Anlagenverzeichnis ohne Einzel-WB, Abschreibungen nicht stetig
  sachverhalt: 'Die deklarierte Methode laut VJ-Prüfakte (G1-101, I1-101) lautet: «Lineare Abschreibung über Nutzungsdauer (Mobiliar 8, EDV 4–5, Fahrzeuge 6, Software 5 Jahre)». Das
    Anlagenverzeichnis 2025 enthält nur AW, Anschaffungsdatum und ND, aber keine kumulierte WB und keinen Buchwert je Objekt. Es führt Sammelposten wie «Notebooks (22 Stk) 2021–2024»
    und «Software-Eigenentwicklung 2021–2022». Nachrechnung linear, monatsgenau ab Anschaffungsmonat, per 31.12.2025 (gebucht gegenüber linear): 1500 Bohr-/Crimpstation (15.03.2021,
    5 J.): RBW 4''460.18 statt 330.31, Differenz 4''129.87; Abschreibung 2025 1''043.68 statt 1''981.86. 1510 Büromöbel (01.06.2019, 8 J.) und Regale (01.09.2020, 10 J.): RBW 64''579.70
    statt 36''610.71, Differenz 27''968.99; Abschreibung 2025 12''224.63 statt 16''247.60 (VJ 40''000). 1540 Messgeräte (10.10.2022, 6 J.): RBW 6''651.37 statt 4''253.73, Differenz 2''397.64;
    die Jahresabschreibung 1''546.80 ist linear, die kumulierte WB aber zu tief. Zusammen ergeben sich 34''496.50; tagesgenau 34''445.91, ab Anschaffungstag 1500 34''413.93. Bei 1520
    und 1530 liegen die Abschreibungen 2025 dagegen über dem Plan (1530: 4''769.13 statt 4''201.89), die Sätze sind also uneinheitlich. Die WB-Historie ist zudem nicht schlüssig: Die
    WB 31.12.2023 ist kleiner als die Abschreibung 2023 gemäss VJ-ER, bei 1549 82.70 gegenüber 1''000 (Einzelobjekt seit 10.10.2022), bei 1519 21''541.54 gegenüber 35''000. Ohne Abgänge
    ist das rechnerisch nicht möglich und deutet darauf hin, dass schon 2023 nicht alle ER-Abschreibungen auf den WB-Konten gebucht wurden. Ein Stille-Reserven-Nachweis 2025 fehlt in
    der Akte.'
