  titel: Mietkaution 200'000 (gesperrt bis Mietende, fest bis 31.12.2033) im Umlaufvermögen statt als Finanzanlage – VJ-Hinweis nicht umgesetzt
  sachverhalt: Konto 1193 Mietzinsdepot 200'000 steht in Saldoliste und Jahresrechnung unter «Übrige kurzfristige Forderungen». Gemäss Mietvertrag ist das Mietverhältnis fest bis 31.12.2033
    abgeschlossen, die Freigabe erfolgt frühestens nach Ende des Mietverhältnisses. Die Testbank bestätigt per 31.12.2025 ein gesperrtes Kautionskonto über 200'000 (Einzahlung 06.01.2025).
