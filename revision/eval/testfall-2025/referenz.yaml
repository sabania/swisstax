  sachverhalt: 'Hauptbuch Blatt «2170» (unter RR): 31.12.2025 AB-50 «Zinsen Aktionärsdarlehen 2025» Haben 130''000, Gegenkonto 6930; Saldo 150''000 (inkl. UB-01 20''000 VJ-Zinsen). 130''000
