  titel: MWST-Umsatzabstimmung 2025 fehlt; Erlöse gemäss ER CHF 180'000 höher als deklariert, weitere Erträge nicht übergeleitet
  sachverhalt: 'Ordner J enthält nur den Zusammenzug Q1–Q4 (Ziff. 200 total 9''150''000). Eine Umsatzabstimmung 2025 fehlt; im VJ lag sie mit M-01 vor (Differenz 0).


    Überleitung nach der VJ-Methodik: 3200 8''900''000 + 3201 100''000 + 3400 300''000 + 3205 30''000 = 9''330''000, also 180''000 mehr als deklariert.


    Nicht übergeleitet sind ausserdem:

    - 8100 Betriebsfremder Ertrag 460''000 (VJ 60''000; in M-01 als steuerbarer Umsatz «Verkauf Restmaterial» enthalten)

    - 6951 Weiterverrechnung Bankgarantie 20''000

    - Erlös Lieferwagen 6''500 auf 8510 (siehe M2-d)

    - Zunahme der erhaltenen Anzahlungen 2030 um 600''000 (bei Vorauszahlungen entsteht die Steuer mit der Vereinnahmung)


    Potenzielle MWST zu 8.1 %: 14''580 (auf 180''000) bis 51''840 (auf 640''000), zzgl. Verzugszins.'
  nachweis:
  - J_Uebrige_kurzfristige_Verbindlichkeiten/MWST_Abrechnungen_2025_Zusammenzug.md Z. 15 (Total Ziff. 200 9'150'000)
  - 00_Allgemein/Saldoliste_2025.md Blatt Erfolgsrechnung (3200, 3201, 3400, Z. 92 3205 30'000, Z. 195 6951 20'000, Z. 198 8100 460'000 / VJ 60'000)
