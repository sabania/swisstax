  soll: '1. Umsatzabstimmung 2025 mit begründeten Differenzen einfordern. Mängel sind spätestens in der Abrechnung der Periode zu korrigieren, in die der 180. Tag nach Geschäftsjahresende
    fällt (Art. 72 MWSTG).

    2. Inhalt von 8100 (+400''000), 3205 und 6951 klären.

    3. Nicht deklarierte steuerbare Umsätze per Korrekturabrechnung nachdeklarieren und die MWST-Schuld per 31.12.2025 passivieren (Ertragsminderung an 1175p bzw. 2300).

    4. MWST-Zusatz in die Vollständigkeitserklärung aufnehmen.

    5. Die Wirkung auf die Überschuldung einbeziehen.'
