  sachverhalt: 'Die Gesellschaft hat negatives Eigenkapital; das Darlehen an A ist zwangsläufig fremdfinanziert. Ihre Fremdkapitalkosten: Aktionärsdarlehen 2''600''000 zu 2.0 %, Bankdarlehen
