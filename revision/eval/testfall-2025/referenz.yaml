  id: K1-f
  titel: Unterlagen Folgeperiode unvollständig und widersprüchlich (Kreditorenjournal, Kontoblatt 2000/2026, Zahlungen Januar)
  sachverhalt: '(1) GM-25-0455 (22''350) ist im Kontoblatt 2000/2026 am 15.01.2026 gebucht, fehlt aber im Kreditorenjournal Januar 2026 «erfasste Eingangsrechnungen, Buchungsperiode
    01.–31.01.2026» (7 Rechnungen, Total 186''172.50 nachgerechnet). Das Journal ist damit als Vollständigkeitsnachweis nicht verlässlich. (2) ST-25-10012 (14''000) wurde am 21.01.2026
    bezahlt, ist aber weder im Journal noch im Kontoblatt erfasst. (3) HMV-114611 ist laut Journal am 05.01.2026 erfasst, laut Kontoblatt 2000/2026 am 15.01.2026. (4) ZA-01 «Zahlungen
    Januar (Sammel)», Gegenkonto 1011, Soll 761''850. Die Kreditorenzahlungen gemäss Auszug 1011 Januar 2026 betragen 245''000 + 72''150 + 186''900 + 158''400 + 14''000 + 48''600 = 725''050;
    die Differenz von 36''800 ist ungeklärt. (5) Das Belegverzeichnis nennt die Kontoblätter 2000 Januar/Februar 2026; vorgelegt ist nur ein Auszug Januar 2026. (6) Zahlungen nach dem
    Stichtag sind nur für 662''450 (57.1 %) der OP 31.12.2025 belegt (HMV-114502, KT-88231, TB-2025-121, ST-25-9921). Für 497''550 fehlt ein Nachweis: ST-25-9987 140''000 (durch Saldobestätigung
    gedeckt), EF-2025-778 96''300, GM-25-0412 48''750, MP-25-366 118''400, ITF-25-1204 8''650, TM-251289 14''380, KV-25-0921 21''900, PB-25-077 49''170, fällig 11.–28.01.2026. Der Kontoauszug
    1010 Januar 2026 fehlt. Eine aktuelle OP-Liste zum Prüfungszeitpunkt liegt nicht vor.'
