  sachverhalt: 'Mit Kaufvertrag vom 25.09.2025 wurden 20 Stammanteile zu CHF 1''000 erworben, also 100 % des Stammkapitals der Solarservice Probe GmbH, Wil SG. Der Kaufpreis beträgt
    CHF 30''000.00, zahlbar 30.09.2025. Gebucht ist der Kauf auf 1192 «Geleistete Anzahlungen (an Lieferanten)»: 30.09.2025 KV-0930 «Kauf 100 % Stammanteile Solarservice Probe GmbH»,
    Gegenkonto 1010, Soll 30''000. Saldo 1192 per 31.12.2025: CHF 50''000. Nachgerechnet: Eröffnung 25''000 + Sammelbuchungen-Zugänge 348''215.12 − Sammelbuchungen-Abgänge 373''215.12
    = 0.00. Der Rest von 50''000 besteht also aus KV-0930 30''000 und AZ-25-0388 20''000. Die JR 2025 zeigt den Betrag unter «Übrige kurzfristige Forderungen» (Total 260''010); die Bilanz
    hat weder «Finanzanlagen» noch «Beteiligungen». Die JR der Tochter hält fest: «Tochtergesellschaft der Fiktive Zahlen AG seit 30.09.2025». Das Belegverzeichnis nennt den Vertrag
    «Kaufvertrag Stammanteile (Konto 1192)»; die Kontierung war demnach bewusst gewählt. In der VJ-Akte steht H3 auf «Nicht anwendbar: Keine Beteiligungen». Das Prüffeld ist 2025 erstmals
