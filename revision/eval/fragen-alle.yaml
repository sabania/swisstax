# fragen-fach + fragen-revio (generiert)
fragen:
- id: f01
  frage: Eine nicht kotierte AG ohne Pflicht zur Konzernrechnung hatte im GJ 2024 eine Bilanzsumme von CHF 21 Mio., einen Umsatz von CHF 43 Mio. und 120 Vollzeitstellen, im GJ 2025 eine
    Bilanzsumme von CHF 22 Mio., einen Umsatz von CHF 38 Mio. und 260 Vollzeitstellen. Reicht für die Jahresrechnung 2025 noch eine eingeschränkte Revision?
  soll: 'Nein. Ordentlich prüfen lassen muss eine Gesellschaft, die in zwei aufeinander folgenden Geschäftsjahren zwei der drei Grössen überschreitet: Bilanzsumme CHF 20 Mio., Umsatzerlös
    CHF 40 Mio., 250 Vollzeitstellen im Jahresdurchschnitt (Art. 727 Abs. 1 Ziff. 2 OR). Im Jahr 2024 sind Bilanzsumme und Umsatz überschritten, im Jahr 2025 Bilanzsumme und Vollzeitstellen.
    Es müssen nicht in beiden Jahren dieselben zwei Grössen sein (HWP ER Rz 309). Damit ist die Jahresrechnung 2025, also die des zweiten Jahres, ordentlich zu revidieren (HWP ER Rz
    310). Der Abschlussprüfer prüft das vor der Mandatsannahme bzw. vor Prüfungsbeginn und lehnt eine eingeschränkte Revision ab (SER 1.4.1). Unabhängig von den Schwellenwerten müsste
    ordentlich geprüft werden, wenn Aktionäre mit zusammen mindestens 10 % des Aktienkapitals dies verlangen (Art. 727 Abs. 2 OR).'
- id: f02
  frage: Eine KMU-AG mit 8 Vollzeitstellen will ab dem Geschäftsjahr 2027 (Kalenderjahr) auf die eingeschränkte Revision verzichten. Welche Voraussetzungen und Formalitäten gelten, und
    kann ein Aktionär später trotzdem eine Revision verlangen?
  soll: 'Für das Opting-out (Art. 727a Abs. 2–5 OR) gilt:

    (1) Die Gesellschaft hat nicht mehr als 10 Vollzeitstellen im Jahresdurchschnitt. Massgebend sind die Verhältnisse im betreffenden Geschäftsjahr, nicht der Durchschnitt aus zwei
    Jahren (HWP ER Rz 313).

    (2) Sämtliche Aktionäre stimmen zu. Der VR kann sie schriftlich um Zustimmung ersuchen, eine Frist von mindestens 20 Tagen ansetzen und festhalten, dass Schweigen als Zustimmung
    gilt (Abs. 3).

    (3) Der Verzicht gilt nur für künftige Geschäftsjahre. Er muss vor Beginn des Geschäftsjahres, hier also vor dem 1.1.2027, beim Handelsregisteramt angemeldet werden. Der Anmeldung
    ist die Jahresrechnung des zuletzt abgelaufenen Geschäftsjahres beizulegen (Abs. 2 und 2bis).

    (4) Soweit erforderlich passt der VR die Statuten an und meldet dem Handelsregister die Löschung der Revisionsstelle an (Abs. 5). Der bisherigen Revisionsstelle wird empfohlen, sich
    umgehend selbst löschen zu lassen (HWP ER Rz 63).


    Der Verzicht gilt auch für die Folgejahre. Jeder Aktionär kann aber spätestens 10 Tage vor der GV eine eingeschränkte Revision verlangen (Opting-in). Die GV muss dann eine Revisionsstelle
    wählen; vor dem Revisionsbericht darf die Jahresrechnung nicht genehmigt werden (Abs. 4; HWP ER Rz 69). Bei einem Kapitalverlust (oder einer Überschuldung) muss die letzte Jahresrechnung
    trotz Opting-out von einem zugelassenen Revisor eingeschränkt geprüft werden (Art. 725a Abs. 2 OR; HWP ER Rz 38).'
- id: f03
  frage: Unser Treuhandteam führt für eine KMU-AG die Buchhaltung. Dürfen wir bei derselben Gesellschaft auch die eingeschränkte Revision machen, und was müssen wir dabei beachten?
  soll: 'Ja. Bei der eingeschränkten Revision ist das Mitwirken bei der Buchführung zulässig (Art. 729 Abs. 2 OR). Weil ein Selbstprüfungsrisiko besteht, braucht es geeignete organisatorische
    und personelle Massnahmen. Diese sind erfüllt, wenn nicht dieselbe Person oder Personengruppe beim gleichen Kunden bucht und prüft (SER 1.3.1, Anhang B).


    Kumulativ muss gelten:

    - Die Verantwortung für die Jahresrechnung bleibt beim Kunden.

    - Die Revisionsstelle übernimmt keine Aufgaben, die nach Managementverantwortung aussehen.

    - Die Risiken sind dem Kunden kommuniziert.

    - Die verlässliche Prüfung ist personell und organisatorisch sichergestellt.


    Die Mitwirkung ist im Revisionsbericht offenzulegen (Art. 729b Abs. 1 Ziff. 3 OR), z.B.: «Ein Mitarbeitender unserer Gesellschaft hat im Berichtsjahr bei der Buchführung mitgewirkt.
    An der eingeschränkten Revision war er nicht beteiligt.» Empfohlen ist eine separate schriftliche Auftragsbestätigung für die Buchführungsarbeiten (SER 1.7).'
- id: f04
  frage: Muss ich bei einer eingeschränkten Revision Saldobestätigungen bei Debitoren einholen, an der Inventur teilnehmen oder das interne Kontrollsystem testen? Welche Prüfungshandlungen
    sind überhaupt vorgesehen?
  soll: 'Nein. Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen (Art. 729a Abs. 2 OR). Grundsätzlich werden nur beim Unternehmen
    intern verfügbare Informationen verwendet.


    Nicht durchgeführt werden (SER 1.5):

    - Prüfung des IKS und der IT-Systeme

    - Inventurbeobachtung und Drittbestätigungsanfragen

    - Prüfungen zur Aufdeckung deliktischer Handlungen und weiterer Gesetzesverstösse (ausser zu Rechnungslegung und Gewinnverwendung)


    Die Detailprüfungen betreffen namentlich Bestand und Bewertung. Auf repräsentative Stichproben ist zu verzichten (SER 6.1.3). Bei wesentlichen Posten darf man sich nicht ausschliesslich
    auf Befragungen stützen; diese sind mit analytischen Prüfungshandlungen und/oder Detailprüfungen zu ergänzen (SER 6.1.1). Die Geschäftsführung des VR ist nicht Prüfungsgegenstand
    (Art. 729a Abs. 3 OR).'
- id: f05
  frage: Was muss der Bericht der Revisionsstelle zur eingeschränkten Revision zwingend enthalten, wer unterschreibt ihn und welches Datum trägt er?
  soll: 'Inhalt nach Art. 729b OR und SER 8.1:

    (1) Hinweis auf die eingeschränkte Natur der Revision: keine ordentliche Revision und kein Prüfungsurteil im Sinne einer ordentlichen Revision.

    (2) Stellungnahme zum Prüfungsergebnis als negative Zusicherung zur Jahresrechnung und zum Antrag über die Verwendung des Bilanzgewinns.

    (3) Angaben zur Unabhängigkeit und gegebenenfalls zur Mitwirkung bei der Buchführung oder zu anderen Dienstleistungen mit Selbstprüfungsrisiko.

    (4) Angaben zur Person, welche die Revision geleitet hat, und zu ihrer Zulassung (Name, Vorname, Art der Zulassung).

    (5) Unterschrift dieser leitenden Person.

    (6) Berichtsdatum.


    Das Datum ist der Tag, an dem die Revision beendet wurde, frühestens aber der Tag, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen hat (SER 8.6).
    Liegt zwischen Beendigung und Berichtsabgabe ein zeitlicher Abstand, trägt der Bericht das Datum der Abgabe; eine Rückdatierung ist nicht zulässig (HWP ER Rz 322). Der Bericht enthält
    keine Empfehlung, die Jahresrechnung zu genehmigen oder zurückzuweisen (SER 1.2).'
- id: f06
  frage: Der Kunde weigert sich, eine wesentliche Wertberichtigung auf einer gefährdeten Debitorenforderung zu buchen. Das Gesamtbild der Jahresrechnung wird dadurch aber nicht grundlegend
    verändert. Welche Prüfungsaussage gebe ich ab? Was gälte, wenn das Gesamtbild grundlegend verändert würde, und wann gibt man gar keine Prüfungsaussage ab?
  soll: 'Es handelt sich um einen festgestellten Sachverhalt, den der Kunde nicht korrigiert (Meinungsverschiedenheit). Der Sachverhalt ist im Bericht darzulegen, die Auswirkung ist,
    sofern praktikabel, zu quantifizieren, und es ist eine eingeschränkte Prüfungsaussage abzugeben: «… mit Ausnahme der im vorstehenden Absatz dargelegten Einschränkung …» (SER 8.3.1
    (b)(i), Anhang F Beispiel 2).


    Verändert der festgestellte Sachverhalt das Gesamtbild grundlegend, ist eine verneinende Prüfungsaussage abzugeben: Die Jahresrechnung entspricht nicht Gesetz und Statuten (SER 8.3.1
    (b)(ii)).


    Gar keine Prüfungsaussage (Unmöglichkeit) kommt nur bei einem angenommenen Sachverhalt oder bei einer Beschränkung des Prüfungsumfangs in Frage, und zwar nur, wenn deren mögliche
    Auswirkung das Gesamtbild grundlegend verändert (SER 8.3.1 (b)(iii) und (c)(ii)). Ist die mögliche Auswirkung nicht grundlegend, ist auch dort die Prüfungsaussage einzuschränken.'
- id: f07
  frage: Bei der eingeschränkten Revision stellen wir fest, dass die Gesellschaft offensichtlich überschuldet ist. Es gibt keinen Rangrücktritt, und der Verwaltungsrat unternimmt nichts.
    Was muss die Revisionsstelle tun, und hat sie bei der eingeschränkten Revision noch weitere Anzeigepflichten?
  soll: 'Die Revisionsstelle geht schrittweise vor:

    1. Sie erinnert den VR an seine Pflichten, namentlich Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten zu erstellen und prüfen zu lassen (SER 9).

    2. Bleibt der VR untätig, mahnt sie ihn unter Ansetzung einer Frist und weist auf ihre eigene, subsidiäre Anzeigepflicht hin (HWP ER Rz 433).

    3. Unterlässt der VR die Anzeige trotz offensichtlicher Überschuldung, benachrichtigt die Revisionsstelle das Gericht (Art. 729c OR).


    Im Revisionsbericht ist ein Hinweis auf die Untätigkeit des VR bei Überschuldung in jedem Fall anzubringen (SER 8.3.2.1). Durch Niederlegung des Mandats kann sich die Revisionsstelle
    dieser Pflicht nicht entziehen (HWP ER Rz 445).


    Das ist die einzige direkte gesetzliche Anzeigepflicht bei der eingeschränkten Revision. Weitere Anzeigepflichten bei Verstössen gegen Gesetz, Statuten oder Organisationsreglement
    bestehen nicht (HWP ER Rz 351, 422).'
- id: f08
  frage: Ich plane die eingeschränkte Revision einer gewinnorientierten Handels-GmbH, die dieses Jahr einen Verlust schreibt; das Eigenkapital beträgt CHF 1,2 Mio. Welche Bezugsgrösse
    und welchen Prozentsatz nehme ich für die Gesamtwesentlichkeit? Und welcher Richtwert gilt bei einem stabil profitablen Unternehmen?
  soll: 'Bei einem gewinnorientierten Unternehmen in einer Verlustsituation ist die Bezugsgrösse das Eigenkapital, mit einem Richtwert von 3 % bis 5 %. Das ergibt hier CHF 36''000 bis
    CHF 60''000 (HWP ER Rz 42, Abb. 20).


    Bei einem stabil profitablen Unternehmen gelten 3 % bis 10 % des bereinigten Jahresgewinns vor Steuern, also nach Berücksichtigung stiller Reserven; Durchschnittswerte sind möglich.
    Ist das Ergebnis gesteuert, geht man vom effektiven Ergebnis aus (SER 5.2).


    Weitere Richtwerte:

    - anlageintensive Unternehmen bzw. Holdings: 1 % bis 3 % der Bilanzsumme

    - volatile Ergebnisse: 1 % bis 3 % der Nettoerlöse

    - nicht gewinnorientierte Unternehmen: 1 % bis 3 % der Gesamtaufwendungen

    - Start-ups: 2 % bis 5 % der operativen Aufwendungen


    Es sind Richtwerte zur Unterstützung des professionellen Ermessens (Rz 43). Bei drohender Illiquidität oder Überschuldung kann eine tiefere Wesentlichkeit angezeigt sein (SER 5.2).'
- id: f09
  frage: Ich habe die Gesamtwesentlichkeit auf CHF 80'000 festgelegt. In welcher Bandbreite liegt die Toleranzwesentlichkeit, wie hoch darf die Nichtaufgriffsgrenze sein, und wozu dienen
    die beiden Grössen?
  soll: 'Die Toleranzwesentlichkeit beträgt in der Regel 50 % bis 75 % der Gesamtwesentlichkeit, hier also CHF 40''000 bis 60''000 (HWP ER Rz 50). Sie liegt unter der Gesamtwesentlichkeit,
    um dem Aggregationsrisiko Rechnung zu tragen: Einzeln unwesentliche Fehlaussagen können kumuliert wesentlich sein (SER 5.2, HWP ER Rz 49). Sie dient dazu, die Risiken auf Aussagenebene
    zu beurteilen und Art, Zeitpunkt und Umfang der Prüfungshandlungen festzulegen.


    Die Nichtaufgriffsgrenze kann bis zu 5 % der Gesamtwesentlichkeit betragen, hier also höchstens CHF 4''000 (Rz 51). Fehlaussagen darunter müssen nicht in die Zusammenstellung der
    Fehlaussagen aufgenommen werden. Fehlaussagen über der Grenze werden erfasst, kumuliert und laufend auf Wesentlichkeit beurteilt (Rz 53, SER 5.3).


    Im HWP-Beispiel (in TCHF): Gesamtwesentlichkeit 67, Toleranzwesentlichkeit 60 % = 40, Nichtaufgriffsgrenze 5 % = 3.'
- id: f10
  frage: Wer muss die Vollständigkeitserklärung unterzeichnen, welches Datum trägt sie, und was passiert, wenn der Verwaltungsrat sich weigert, sie abzugeben?
  soll: 'Mit der Vollständigkeitserklärung bestätigt die Unternehmensleitung schriftlich, dass die Jahresrechnung vollständig ist und die erteilten Auskünfte und Unterlagen richtig und
    vollständig sind (SER 6.2.5).


    Unterzeichnet wird sie in der Regel von denselben Personen wie die Jahresrechnung: vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und von der für die Rechnungslegung
    zuständigen Person (Art. 958 Abs. 3 OR; HWP ER Rz 339).


    Ihr Datum entspricht im Regelfall dem Datum des Revisionsberichts. Sie ist auf dieses Datum hin zusammen mit der Jahresrechnung rechtsgültig zu unterzeichnen und sollte vor Abgabe
    des Berichts bei der Revisionsstelle sein. Sie ist für jede Abschlussprüfung einzufordern (Rz 340, 448).


    Eine Weigerung ist eine Beschränkung des Prüfungsumfangs. Die Prüfungsaussage ist dann einzuschränken, sofern überhaupt eine abgegeben werden kann (Rz 341). Je eine unterzeichnete
    Jahresrechnung und Vollständigkeitserklärung gehören in die Jahresakten (SER 7.2).'
- id: f11
  frage: Der Bilanzstichtag ist der 31.12.2025, unser Bericht soll im März 2026 datiert werden. Im Februar 2026 ging ein Grosskunde in Konkurs, der schon per 31.12.2025 zahlungsunfähig
    war. Im März 2026 ist zudem ein Lager abgebrannt. Wie behandle ich solche Ereignisse bei der eingeschränkten Revision, und was gilt, wenn ich erst nach dem Berichtsdatum von etwas
    erfahre?
  soll: 'Man unterscheidet zwei Arten von Ereignissen (HWP ER Rz 317):

    - Ereignisse, die Nachweise für Umstände liefern, die schon am Bilanzstichtag vorlagen, sind berücksichtigungspflichtig. Hier die Zahlungsunfähigkeit des Kunden per 31.12.: Sie ist
    im Abschluss 2025 zu berücksichtigen, z.B. bei der Bewertung der Forderung.

    - Ereignisse zu Umständen, die erst nach dem Stichtag entstanden sind, werden nicht in den Abschlusswerten berücksichtigt. Hier der Brand im März. Ist ein solches Ereignis wesentlich,
    ist es im Anhang anzugeben (Art. 959c Abs. 2 Ziff. 13 OR).

    Verantwortlich für die Berücksichtigung ist die Unternehmensleitung.


    Prüfungshandlungen bei der eingeschränkten Revision: Befragung der Unternehmensleitung, beschränkt auf bedeutende schwebende Geschäfte und Sachverhalte mit Verlustrisiko, möglichst
    nahe am Berichtsdatum (Rz 318, 321). In der Vollständigkeitserklärung bestätigt die Unternehmensleitung, dass sie alle relevanten Ereignisse nach dem Bilanzstichtag mitgeteilt hat
    (Rz 323).


    Nach dem Berichtsdatum muss die Revisionsstelle keine weiteren Prüfungshandlungen vornehmen. Wird ihr vor Herausgabe des Abschlusses eine relevante Tatsache bekannt, erörtert sie
    diese mit der Unternehmensleitung und legt fest, ob der Abschluss zu ändern ist. Bei einer Änderung erstellt sie einen neuen Bericht, der nicht vor der Genehmigung des geänderten
    Abschlusses datiert ist. Ändert die Unternehmensleitung den Abschluss nicht, modifiziert die Revisionsstelle die Prüfungsaussage, sofern der Bericht noch nicht zugestellt ist (Rz
    324–326).'
- id: f12
  frage: 'Die geprüfte Jahresrechnung einer AG ist korrekt, zeigt aber einen hälftigen Kapitalverlust nach Art. 725a OR. Der Verwaltungsrat hatte genug Zeit, hat aber keine Massnahmen
    ergriffen. Wie berichte ich darüber im Bericht zur eingeschränkten Revision: mit einem Zusatz, einem Hinweis oder einer Einschränkung?'
  soll: 'Die Prüfungsaussage bleibt nicht modifiziert, weil die Jahresrechnung korrekt ist. Es braucht zwei Elemente:

    - Zusatz zum Kapitalverlust selbst: «Wir machen darauf aufmerksam, dass die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve
    und gesetzlicher Gewinnreserve nicht mehr gedeckt ist (Art. 725a Abs. 1 OR).» Der Kapitalverlust als Zustand ist kein Gesetzesverstoss, aber eine wichtige Information für den Bilanzleser
    und daher als Zusatz aufzunehmen (HWP ER Rz 447; SER 8.3.2.2; ebenso Camponovo).

    - Hinweis zur Untätigkeit des VR: Sie ist ein Gesetzesverstoss ausserhalb des Prüfungsgegenstands, und der Hinweis ist in jedem Fall anzubringen (SER 8.3.2.1; HWP ER Rz 423, Abb.
    49: zwingend): «Ferner weisen wir darauf hin, dass es der Verwaltungsrat unterlassen hat, Massnahmen zur Beseitigung des Kapitalverlusts zu ergreifen …» (Muster HWP ER, das ebenfalls
    voraussetzt, dass der VR zeitlich bereits Gelegenheit zum Handeln hatte).


    Zusätze und Hinweise beeinflussen die Prüfungsaussage nicht. Die Reihenfolge ist: Prüfungsaussage, dann Zusatz, dann Hinweis (SER 8.3.2).


    Andere Gesetzesverstösse (z.B. Art. 659, 678, 680, 699 OR) sind nur hinweispflichtig, wenn sie wesentlich sind, einen direkten Bezug zur Jahresrechnung haben und aufgrund der durchgeführten
    Prüfungshandlungen festgestellt wurden. Für Verstösse gegen das Organisationsreglement besteht keine Hinweispflicht.'
- id: f13
  frage: Wie lange müssen wir die Arbeitspapiere einer eingeschränkten Revision aufbewahren, ab wann läuft die Frist, dürfen wir sie nur elektronisch aufbewahren, und was muss in den
    Jahresakten mindestens dokumentiert sein?
  soll: 'Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und die Revisionsberichte sowie alle wesentlichen Unterlagen mindestens 10 Jahre aufbewahren (Art.
    730c Abs. 1 OR). Die Frist läuft regelmässig ab dem Berichtsdatum (HWP ER Rz 288). Elektronische Aufbewahrung ist zulässig, wenn die Daten während der ganzen Frist wieder lesbar
    gemacht und nachträgliche Änderungen festgestellt werden können. Die Pflicht gilt auch nach Ende des Mandats (Rz 186). Die Unterlagen müssen eine effiziente Prüfung erlauben, ob
    die gesetzlichen Vorschriften eingehalten wurden (Art. 730c Abs. 2 OR).


    In die Jahresakten gehören (SER 7.2):

    - Überlegungen zur Unabhängigkeit

    - Verständnis des Unternehmens

    - Wesentlichkeitsüberlegungen

    - Ergebnisse der analytischen Prüfungshandlungen aus der Planung

    - inhärentes Risiko und Prüfungsplan

    - Prüfungsprogramm

    - Fehlaussagen und ihre Behandlung

    - Prüfungsnachweise und ihre Beurteilung

    - je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung


    Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors bzw. des Mandatsleiters zu versehen (SER 7.1).'
- id: f14
  frage: Der Verwaltungsrat einer AG, deren gesetzliche Reserven die Schwelle von Art. 672 Abs. 2 OR noch nicht erreicht haben, beantragt bei einem Gewinnvortrag von CHF 32'000 und einem
    Jahresgewinn von CHF 7'000 eine Dividende von CHF 17'000. Wie viel muss mindestens der gesetzlichen Gewinnreserve zugewiesen werden, was prüft die Revisionsstelle beim Antrag, und
    wie wird darüber berichtet?
  soll: 'Zuzuweisen sind 5 % des Jahresgewinns, also CHF 350 (Art. 672 Abs. 1 OR). Das gilt, bis die gesetzliche Gewinnreserve zusammen mit der gesetzlichen Kapitalreserve die Hälfte
    des Aktienkapitals erreicht (bei Holdings 20 %). Ein allfälliger Verlustvortrag wäre vor der Zuweisung zu beseitigen. Dividenden dürfen nur aus dem Bilanzgewinn oder aus hierfür
    gebildeten Reserven ausgerichtet werden, und erst nach den Reservezuweisungen (Art. 675 OR).


    Rechnung: verfügbarer Bilanzgewinn CHF 39''000 − 350 − 17''000 = Vortrag CHF 21''650 (HWP ER Rz 215).


    Die Revisionsstelle prüft, ob der Antrag Gesetz und Statuten entspricht (Art. 729a Abs. 1 Ziff. 2 OR), insbesondere:

    - ob die Reservezuweisung richtig ist

    - ob genügend flüssige Mittel für die Dividende vorhanden sind

    - ob keine Statutenbestimmungen entgegenstehen

    - ob kein Verstoss gegen Kapitalschutzvorschriften vorliegt, z.B. Art. 680 Abs. 2 OR (Rz 216, 439)


    Bericht: Die Stellungnahme zum Antrag erfolgt zusammen mit der Prüfungsaussage, z.B. «… dass die Jahresrechnung sowie der Antrag über die Verwendung des Bilanzgewinns nicht dem schweizerischen
    Gesetz und den Statuten entsprechen». Weitere Fälle:

    - Ist die Dividende wegen der Liquiditätslage nicht vertretbar: Hinweis auf einen Verstoss gegen die Sorgfaltspflicht (Art. 717 Abs. 1 OR) gemäss Muster.

    - Entspricht der Antrag in wesentlichem Ausmass nicht Gesetz oder Statuten: verneinende Prüfungsaussage (SER 8.3.1).

    - Liegt kein Bilanzgewinn vor und werden keine Ausschüttungen aus anderen Reserven beantragt: Die Bestätigung zum Antrag entfällt.'
- id: f15
  frage: 'Opting-out-AG (keine Holding), Jahresrechnung 2025: Aktienkapital 100''000, gesetzliche Kapitalreserve (Agio) 120''000, gesetzliche Gewinnreserve 10''000, eigene Aktien −20''000,
    Verlustvortrag −30''000, Jahresverlust 2025 −100''000. Haben wir einen Kapitalverlust nach Art. 725a OR? Und wie sieht es aus, wenn der Jahresverlust 110''000 beträgt? Was muss der
    VR dann tun?'
  soll: 'Bilanzielles EK = 100''000 + 120''000 + 10''000 − 20''000 − 30''000 − 100''000 = 80''000. Geschütztes Kapital = AK 100''000 + gesetzliche Kapital- und Gewinnreserve zusammen
    höchstens 50 % des AK (130''000 → begrenzt auf 50''000) = 150''000; Bezugsgrösse (Hälfte) = 75''000. 80''000 ≥ 75''000 → kein Kapitalverlust. Eigene Aktien vermindern nur das (frei
    verfügbare) Eigenkapital, die Bezugsgrösse bleibt unverändert. Variante Jahresverlust 110''000: EK 70''000 < 75''000 → Kapitalverlust (Unterdeckung 5''000), aber keine Überschuldung
    (EK positiv). Folgen: VR ergreift Massnahmen zur Beseitigung des Kapitalverlusts bzw. Sanierung (oder beantragt sie der GV); da keine Revisionsstelle besteht, muss die Jahresrechnung
    2025 vor der Genehmigung durch die GV einer eingeschränkten Revision durch einen vom VR ernannten zugelassenen Revisor unterzogen werden (entfällt nur bei Gesuch um Nachlassstundung).
    Ohne diese Prüfung sind die GV-Beschlüsse zur Genehmigung der JR und zur Verlustverrechnung nichtig.'
- id: f16
  frage: 'AG ohne Revisionsstelle, begründete Besorgnis einer Überschuldung, Fortführung ist gegeben. Zwischenabschluss per 30.06.2026: zu Fortführungswerten Aktiven 900''000 / Verbindlichkeiten
    1''050''000, zu Veräusserungswerten Aktiven 720''000 / Verbindlichkeiten 1''050''000. Wer prüft die Zwischenabschlüsse, muss der VR ans Gericht, und wie hoch muss ein Rangrücktritt
    mindestens sein? Ist mit dem Rangrücktritt auch die Prüfung der Jahresrechnung vom Tisch?'
  soll: 'Überschuldung zu Fortführungswerten 150''000 (900''000 − 1''050''000), zu Veräusserungswerten 330''000 (720''000 − 1''050''000) → gemäss beiden Zwischenabschlüssen überschuldet.
    Mangels Revisionsstelle lässt der VR die Zwischenabschlüsse durch einen von ihm ernannten zugelassenen Revisor prüfen (Art. 725b Abs. 2 OR). Diese Prüfung ist weder eine eingeschränkte
    noch eine ordentliche Revision; massgebend ist PS-CH 290 (SER Kap. 9). Grundsätzlich muss der VR das Gericht benachrichtigen (Abs. 3). Das kann unterbleiben, wenn Gläubiger im Ausmass
    der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden, sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während
    der Dauer der Überschuldung umfasst, oder solange begründete Aussicht besteht, die Überschuldung innert angemessener Frist, spätestens 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse,
    zu beheben, ohne die Gläubigerforderungen zusätzlich zu gefährden (Abs. 4). Mindesthöhe: im Ausmass der Überschuldung. Bei gegebener Fortführung genügt nach HWP (BuR Rz 719, ER Rz
    420) die Deckungslücke zu Fortführungswerten → mindestens 150''000, wobei der Rangrücktritt auch die Zinsforderungen während der Dauer der Überschuldung umfassen muss. Sind weitere
    Verluste absehbar, ist nach HWP ER Rz 421 ein angemessenes Sicherheitspolster für die in den nächsten 12 Monaten, mindestens bis zum nächsten Prüfungszeitpunkt, erwarteten Verluste
    einzurechnen. Wäre die Fortführung konkret gefährdet, müsste der Rangrücktritt die Deckungslücke zu Liquidationswerten (330''000) abdecken. Der Rangrücktritt beseitigt weder Überschuldung
    noch Kapitalverlust und ist keine Sanierungsmassnahme. Er befreit nur von der Benachrichtigung des Gerichts. Die übrigen Pflichten des VR (Sanierungsmassnahmen) bleiben bestehen,
    und die Jahresrechnung muss weiterhin durch einen zugelassenen Revisor (eingeschränkte Revision, Art. 725a Abs. 2 OR) geprüft werden. Passivdarlehen mit Rangrücktritt sind in der
    JR oder im Anhang gesondert auszuweisen. Dem zugelassenen Revisor obliegen die Anzeigepflichten der eingeschränkt prüfenden Revisionsstelle (Art. 725b Abs. 5 OR).'
- id: f17
  frage: 'AG (keine Holding) per 31.12.2025: Aktienkapital 300''000, keine gesetzlichen Reserven, bilanzielles Eigenkapital 100''000. Sie hat ein unbebautes Grundstück, bilanziert zu
    Anschaffungskosten 400''000; ein externes Gutachten ergibt einen Netto-Marktwert von 750''000. Um wie viel darf das Grundstück zur Behebung des Kapitalverlusts höchstens aufgewertet
    werden, und wie wird das gebucht?'
  soll: 'Kapitalverlust: Hälfte des geschützten Kapitals 150''000 > EK 100''000 (Fehlbetrag 50''000). Maximal aktivseitig: erzielbarer Wert − Buchwert = 750''000 − 400''000 = 350''000
    (beim Grundstück ist für den Netto-Marktwert ein externes Gutachten unerlässlich). Maximal passivseitig: (0,5 × 300''000 − 100''000) × 2 = 100''000, also der doppelte Kapitalverlust,
    weil die Aufwertungsreserve selbst zum geschützten Kapital zählt. Zulässig ist der tiefere Wert: 100''000. Kontrolle: EK 200''000 = Hälfte von (300''000 + 100''000) → gedeckt. Buchung
    erfolgsneutral: Grundstück an Aufwertungsreserve 100''000. Die Reserve wird gleichzeitig mit der Aufwertung im Abschluss gebildet, nicht erst im Rahmen der Gewinnverwendung durch
    die GV. Ausweis gesondert als Aufwertungsreserve unter der gesetzlichen Gewinnreserve. Voraussetzung: Die Revisionsstelle bzw. (falls keine) ein zugelassener Revisor bestätigt schriftlich,
    dass die gesetzlichen Bestimmungen eingehalten sind; der Prüfungsbericht muss spätestens bei der Verabschiedung der JR durch den VR vorliegen. Anhang (HWP): aufgewertete Position
    inkl. Bilanzposition, Höhe der Aufwertungsreserve und spätere Veränderungen, Datum des Prüfungsberichts. Auflösung nur durch Umwandlung in Aktien-/PS-Kapital, Wertberichtigung oder
    Veräusserung. HWP empfiehlt, vorher stille Reserven so weit wie möglich aufzulösen. Steuerfolgen sind zu berücksichtigen und abzugrenzen. Bund: Die erfolgsneutrale Aufwertung wird
    dem steuerbaren Gewinn hinzugerechnet (Art. 58 Abs. 1 lit. c DBG), allenfalls verrechenbar mit Verlustvorträgen (Art. 62 Abs. 3 DBG für spätere Abschreibungen beachten). Kanton:
    Im monistischen System ist der Betrag über den Anschaffungskosten nicht steuerbar, im dualistischen gilt die Besteuerung analog DBG.'
- id: f18
  frage: 'AG mit Aktienkapital 100''000, gesetzlicher Kapitalreserve 10''000 und gesetzlicher Gewinnreserve 25''000. Jahresgewinn 2025: 80''000, Verlustvortrag aus dem Vorjahr: 20''000.
    Wie viel muss der gesetzlichen Gewinnreserve zugewiesen werden? Und wie wäre es, wenn es eine Holdinggesellschaft wäre?'
  soll: 'Zuerst ist der Verlustvortrag zu beseitigen bzw. vom Jahresgewinn abzuziehen: 5 % × (80''000 − 20''000) = 3''000 Pflichtzuweisung. Die Äufnungsgrenze (gesetzliche Gewinn- +
    Kapitalreserve = 50 % des AK = 50''000) ist mit 35''000 noch nicht erreicht → 3''000 zuweisen (Mindestzuweisung; zusätzliche Zuweisungen bis zur Grenze sind erlaubt). Holding: Grenze
    20 % des AK = 20''000, mit 35''000 bereits überschritten → keine Pflichtzuweisung. Dividenden dürfen erst nach den Zuweisungen an die gesetzliche und die freiwilligen Gewinnreserven
    festgesetzt werden.'
- id: f19
  frage: 'Forderungen aus L+L per 31.12.2025: Inland 400''000, davon 30''000 gegenüber einem Kunden im Konkurs (keine Dividende zu erwarten) und 50''000 gegenüber Gemeinden; Ausland
    100''000, nicht kreditversichert. Wie hoch darf das Delkredere sein, wenn wir die steuerlich akzeptierten Pauschalsätze der ESTV anwenden, und wo zeige ich es in der Bilanz?'
  soll: 'Zuerst Einzelwertberichtigung des gefährdeten Postens: 30''000 (Konkurs). Danach pauschal auf den restlichen Guthaben: Inland ohne Forderungen gegen öffentlich-rechtliche Körperschaften:
    400''000 − 30''000 − 50''000 = 320''000 × 5 % = 16''000; Ausland 100''000 × 10 % = 10''000. Delkredere total 56''000 (davon pauschal 26''000). Ausweis als Wertberichtigung (Minusposten)
    bei den Forderungen auf der Aktivseite, nicht als Rückstellung unter den Passiven. Hinweise: Kantone lassen teils abweichende Pauschalen zu (HWP-Beispiel ZH 10 %/20 %); handelsrechtlich
    ist die Pauschale aus Erfahrungswerten und erwarteter Entwicklung zu bemessen; bei Kreditversicherung deckt das Delkredere nur den unversicherten Teil.'
- id: f20
  frage: Handelsware mit Anschaffungskosten 120'000 per 31.12.2025. Erwarteter Verkaufserlös 130'000, Erlösminderungen (Rabatte/Skonti) 5'000, noch anfallende Vertriebs- und Verwaltungskosten
    15'000. Zu welchem Wert darf die Ware höchstens bilanziert werden, und wie tief darf man mit dem steuerlich akzeptierten Warendrittel gehen?
  soll: 'Netto-Veräusserungswert (Rückrechnung) = 130''000 − 5''000 − 15''000 = 110''000 < AK 120''000 → Niederstwert: höchstens 110''000, Wertberichtigung 10''000 ist zwingend (verlustfreie
    Bewertung, Art. 960c Abs. 1 OR). Der steuerlich zugelassene Bewertungsabzug von einem Drittel bemisst sich vom gesetzlichen Höchstwert 110''000: 36''667 → tiefster Wert rund 73''333.
    Der Drittelabzug hat (nach den handelsrechtlich nötigen Wertkorrekturen) Reservecharakter; nimmt er bei Lagerabbau ab, werden stille Reserven aufgelöst, was in die Nettoauflösung
    nach Art. 959c Abs. 1 Ziff. 3 OR einfliesst.'
- id: f21
  frage: Gegen unseren Kunden läuft eine Schadenersatzklage wegen eines 2025 gelieferten mangelhaften Produkts. Der Anwalt schätzt die Wahrscheinlichkeit, zu verlieren, auf 40 %, die
    mögliche Zahlung auf 50'000 bis 150'000. Der Kunde will keine Rückstellung bilden, sondern nur eine Eventualverbindlichkeit im Anhang zeigen, weil das Risiko unter 50 % liege und
    die Bandbreite zu gross sei. Geht das?
  soll: Grundsätzlich nein. Eine Rückstellung ist zu bilden, wenn ein vergangenes Ereignis (Lieferung 2025) einen Mittelabfluss in künftigen Geschäftsjahren erwarten lässt und die Höhe
    verlässlich geschätzt werden kann (Art. 960e Abs. 2 OR). Eine Eintretenswahrscheinlichkeit unter 50 % darf nicht einfach als unwahrscheinlich qualifiziert werden; mindestens eine
    anteilige Rückstellung ist zu prüfen (z.B. Erwartungswert), aus Vorsicht eher am oberen Ende der Bandbreite. Eine grosse Bandbreite genügt als verlässliche Schätzung und ist kein
    Grund, nur eine Eventualverbindlichkeit auszuweisen. Eine Eventualverbindlichkeit im Anhang (Art. 959c Abs. 2 Ziff. 10 OR) kommt nur in Frage, wenn der Mittelabfluss unwahrscheinlich
    ist oder die Höhe ausnahmsweise nicht verlässlich geschätzt werden kann. Fällt das Risiko später weg, muss die Rückstellung nicht aufgelöst werden (Art. 960e Abs. 4 OR).
- id: f22
  frage: Jahresgewinn 2025 laut Erfolgsrechnung 60'000. Im Abschluss wurde eine nicht mehr benötigte Rückstellung (stille Reserve) von 50'000 aufgelöst, das Warendrittel ist wegen Lagerabbau
    um 20'000 gesunken, und es wurden zusätzliche, betriebswirtschaftlich nicht nötige Abschreibungen auf Mobilien von 15'000 gebucht. Muss im Anhang etwas offengelegt werden, und welcher
    Betrag?
  soll: 'Nettoauflösung stiller Reserven = 50''000 + 20''000 − 15''000 = 55''000. Ohne diese Nettoauflösung betrüge der Gewinn nur 5''000; das Ergebnis wird also wesentlich günstiger
    dargestellt → Offenlegungspflicht im Anhang nach Art. 959c Abs. 1 Ziff. 3 OR: Gesamtbetrag der Nettoauflösung 55''000. Offenzulegen ist nur der Nettobetrag als Gesamtbetrag (keine
    Aufteilung nach Bilanzpositionen nötig), nach verbreiteter Praxis vor latenten Steuern. Die Abnahme des Warendrittels zählt mit; Zwangsreserven und Schwankungsreserven fallen nicht
    unter diese Ausweispflicht.'
- id: f23
  frage: 'KMU-AG, Abschluss 31.12.2025, im Jahresdurchschnitt 8 Vollzeitstellen. Sachverhalte: Leasing für einen Lieferwagen, Restverpflichtung 36''000, nicht kündbar, läuft bis 30.06.2027;
    Liegenschaft (Buchwert 900''000) ist für die Hypothek verpfändet; Solidarbürgschaft 200''000 für den Bankkredit der 100%-Tochter XY GmbH mit Sitz in St. Gallen; Darlehen vom Aktionär
    150''000. Was muss in den Anhang?'
  soll: 'Pflichtangaben (soweit nicht schon aus Bilanz/ER ersichtlich): Firma, Rechtsform und Sitz der AG; Erklärung, dass die Vollzeitstellen im Jahresdurchschnitt nicht über 10 liegen;
    Beteiligung XY GmbH mit Firma, Rechtsform, Sitz sowie Kapital- und Stimmenanteil (100 %); Restbetrag der Leasingverbindlichkeit 36''000 (läuft nicht innert 12 Monaten ab Bilanzstichtag
    aus und ist nicht kündbar); Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten 200''000 (Bürgschaft für die Tochter); Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten
    verwendeten Aktiven 900''000 (verpfändete Liegenschaft); das Aktionärsdarlehen ist gesondert in der Bilanz oder im Anhang auszuweisen. Dazu Angaben über die angewandten Grundsätze,
    soweit nicht gesetzlich vorgeschrieben.'
- id: f24
  frage: Die AG hat ihrem Aktionär am 1.1.2026 ein Darlehen von CHF 250'000 gewährt, zinslos. Welchen Zins müsste sie 2026 mindestens verrechnen, a) wenn das Darlehen aus Eigenkapital
    finanziert ist und die AG kein verzinsliches Fremdkapital hat, b) wenn sie es über einen Bankkredit mit Selbstkosten von 2 % finanziert? Was passiert, wenn kein Zins verrechnet wird?
  soll: 'ESTV-Rundschreiben Zinssätze 2026 (ab 1.1.2026, CHF): a) aus Eigenkapital finanziert, kein verzinsliches Fremdkapital: mindestens ¾ % → 1''875 pro Jahr. b) aus Fremdkapital
    finanziert: Selbstkosten zuzüglich ½ % (Zuschlag bei Darlehen bis und mit CHF 10 Mio.), mindestens ¾ % → 2,5 % → 6''250 pro Jahr. Ein zinsloses oder ungenügend verzinstes Darlehen
    an Beteiligte ist eine geldwerte Leistung: Verrechnungssteuer 35 %, unaufgefordert mit Formular 102 innert 30 Tagen nach Fälligkeit deklarieren und entrichten; bei der direkten Bundessteuer
    wird die geldwerte Leistung beim Gewinn erfasst (Art. 58 Abs. 1 Bst. b DBG). Die Sätze sind «safe haven».'
- id: f25
  frage: Bei einer Handels-AG haben der Aktionär (500'000) und seine Ehefrau (300'000) Betriebskredite in CHF gewährt. Die AG zahlt 2026 darauf 4 % Zins, total 32'000. Ist das steuerlich
    in Ordnung?
  soll: 'Für die Limite sind die Kredite aller Beteiligten und nahestehenden Personen zusammenzuzählen: 800''000 → Betriebskredit bis CHF 1 Mio. bei einem Handels- und Fabrikationsunternehmen:
    Höchstzinssatz 2026 3½ % → maximal 28''000. Übersetzt sind 4''000 (0,5 % × 800''000): geldwerte Leistung mit Verrechnungssteuer 35 % (Formular 102, 30 Tage) und Aufrechnung beim
    Gewinn. Vorbehalten bleibt der Nachweis höherer Sätze im Drittvergleich; zusätzlich ist ein allfälliges verdecktes Eigenkapital (KS 6a) zu beachten. (Bei einer Holding-/Vermögensverwaltungsgesellschaft
    läge die Limite bis 1 Mio. bei 3 % → 24''000.) Hinweis: im Chunk sind Sätze und Zeilen layoutbedingt getrennt, Zuordnung gemäss Original raw/estv-zinsen-2026.pdf S. 2.'
- id: f26
  frage: 'Handels-AG per 31.12.2026, keine höheren Verkehrswerte nachgewiesen: Flüssige Mittel 100''000, Forderungen L+L 400''000, Vorräte 300''000, mobile Sachanlagen 200''000. Passiven:
    Lieferanten 300''000, Bankkredit (ohne Sicherheit des Aktionärs) 200''000, Aktionärsdarlehen 400''000 zu 3½ %, Eigenkapital 100''000. Haben wir verdecktes Eigenkapital, und wie viel
    Zins wird aufgerechnet?'
  soll: 'Massgebend sind die Verkehrswerte am Ende der Steuerperiode, mangels Nachweis die Buchwerte. Zulässiges Fremdkapital nach KS 6a: 100''000 × 100 % + 400''000 × 85 % + 300''000
    × 85 % + 200''000 × 50 % = 100''000 + 340''000 + 255''000 + 100''000 = 795''000. Ausgewiesenes FK 900''000 − 795''000 = 105''000 verdecktes Eigenkapital; es stammt vollständig aus
    dem Aktionärsdarlehen (nur von Anteilsinhabern/Nahestehenden stammendes FK gilt als verdeckt, der ungesicherte Bankkredit nicht). Zins Aktionärsdarlehen 400''000 × 3½ % = 14''000;
    davon entfallen 105''000 × 3½ % = 3''675 auf das verdeckte EK → Aufrechnung zum Reingewinn (Art. 65 DBG) und geldwerte Leistung mit Verrechnungssteuer; abzugsfähig bleiben 10''325.
    Eine spätere Rückzahlung des verdeckten EK ist keine geldwerte Leistung. Hinweis: Belehnungssätze im Chunk layoutbedingt als getrennte Spalte, Zuordnung gemäss raw/estv-ks-6a-2024.pdf
    S. 2.'
- id: f27
  frage: Eine AG hat steuerliche Verlustvorträge von 1,2 Mio. und steht kurz vor einem Kapitalverlust. Der VR möchte im OR-Einzelabschluss ein latentes Steuerguthaben von 240'000 aktivieren,
    weil das Budget wieder Gewinne zeigt. Dürfen wir das akzeptieren?
  soll: 'Nein. Im OR-Einzelabschluss können latente Steuerguthaben auf steuerlichen Verlustvorträgen nicht aktiviert werden: Es gibt keine Anschaffungs- oder Herstellungskosten, der
    Höchstwert für die Ersterfassung ist null (Art. 960a OR); die allgemeinen Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR) sind bei Verlustvorträgen regelmässig nicht erfüllt (deutlich
    überwiegende Wahrscheinlichkeit nötig, 50,1 % genügt nicht), und selbst wenn sie erfüllt wären, scheitert die Aktivierung an den Bewertungsvorschriften. Eine Umgehung der Kapitalschutzbestimmungen
    über ein solches Aktivum ist ausdrücklich unzulässig. Zulässig ist nur, Verlustvorträge bei der Abgrenzung der laufenden Steuern mit dem Gewinn der laufenden Periode zu verrechnen.
    Die Erfassung latenter Steuern auf temporären Differenzen ist im OR-Abschluss ein Wahlrecht (stetig, für alle Differenzen gleich). In der OR-Konzernrechnung wäre eine Aktivierung
    grundsätzlich möglich.'
- id: f28
  frage: Wir prüfen die Jahresrechnung 2025 einer MWST-pflichtigen AG. Welche allgemeinen Prüfungshandlungen zur MWST sind sinnvoll, und für welche Perioden muss ich MWST-Risiken bei
    der Wesentlichkeit berücksichtigen?
  soll: 'Vorab die Revisionsart klären. Eingeschränkte Revision: Massgebend sind die Beispiele in SER Anhang D n) (den Umständen anzupassen). Empfohlen sind die Abstimmung der MWST-Forderungen
    und -Verbindlichkeiten mit den Abrechnungen und die Prüfung, ob eine MWST-Umsatzabstimmung vorhanden ist. Bei erhöhtem Risiko geht man weiter: Nachvollzug der Umsatzabstimmung, Abstimmung
    der MWST-Abrechnungen mit den Konti bzw. der Umsatzabstimmung, Befragung zu Steuerrevisionen, Rückfragen der Behörden oder hängigen Einsprachen und Einsicht in die Korrespondenz
    (Rückstellungsbedarf). Eine eingeschränkte Revision umfasst keine Prüfungen zur Aufdeckung von MWST-Gesetzesverstössen. PH 20 (EXPERTsuisse 2016) richtet sich an die Abschlussprüfung
    mit hinreichender Sicherheit; seine Arbeitshilfe in Anhang 2 ist nicht verpflichtend, kann aber ergänzend dienen. Ihre allgemeinen Prüfungshandlungen (Teil B) sind: B1 Umsatzabstimmung
    für das Vorjahr gemäss Art. 128 Abs. 2 MWSTV; das Unternehmen muss sie innert 180 Tagen erstellen und Abweichungen begründen. B2 Analytische Prüfung der in- und ausländischen MWST-Deklarationen
    (Vorjahresvergleich, Umsatzaufteilung steuerbar/steuerbefreit/ausgenommen/Nichtentgelte/Steuersätze, Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen). B3 Korrekter und
    vollständiger Ausweis in der JR (Steuerforderungen/-verbindlichkeiten, Rückstellungen für MWST-Risiken, Offenlegung einer aktuellen oder früheren MWST-Gruppenzugehörigkeit im Anhang).
    Wesentlichkeit (PH 20 Tz. 28): Einzubeziehen sind die noch nicht rechtskräftig festgesetzten Steuerforderungen/-verbindlichkeiten der abgeschlossenen Steuerperioden, nicht nur des
    geprüften Jahres (Schweiz: Festsetzungsverjährung fünf Jahre; für ausländische MWST gelten ggf. andere Fristen). Ergänzend nennt PH 20 die Organisationsfragen (Teil A), eine MWST-Ergänzung
    der Vollständigkeitserklärung und bei komplexen Verhältnissen ein Gutachten eines Sachverständigen. Wegen der Selbstveranlagung endet die Finalisierungsfrist mit der ordentlichen
    Deklarationsfrist der Abrechnungsperiode, in die der 180. Tag nach dem Geschäftsabschluss fällt. Das Prüfungsurteil gibt keine Zusicherung der korrekten MWST-Handhabung.'
- id: r01
  frage: In welchen Bereichen der revio-4.0-Revisionsakte darf der KI-Revisionsagent selbst etwas erfassen, und was gilt für die übrigen Bereiche wie 3 Planung oder 9 Qualitätssicherung?
  soll: 'Schreibend arbeitet der Agent nur in Bereich 4 (Abschlussprüfung, 29 Prüffelder A1–T1; Kernarbeit Prozess 2: Textfeld, Belege, Notizen) und in Bereich 10 (Unterlagen zum Abschluss:
    Protokoll Vorjahr in 10.9, Vorschläge für die PBC-Liste 10.10, Auswertung der Antworten aus 10.11). Laut Prozesstabelle gibt es eine Ausnahme: Bereich 1 (1.1 Jahresrechnung) wird
    über den Import der Jahresrechnung befüllt (Prozess 1: PDF-Import, Vorzeichen, Kontenzuordnung, Abstimmung). Unklare Zuordnungen erfasst er als Pendenz, und in der Testphase hält
    er nach dem Import zur Kontrolle durch den Menschen an. Die Kennzahlen aus 1.2 nutzt er nur lesend für die Analytik. Alle übrigen Bereiche liest er höchstens, um risikoorientiert
    und kritisch zu arbeiten: 2 Vorbereitung (nur lesen, Empfehlung), 3 Planung (nur lesen; die Wesentlichkeit in 3.3 liest und wendet er an, ändert sie aber nie), 6 Beendigung (nur
    lesen; 6.2 als Leitfaden für die Plausibilisierung), 7 Berichterstattung (nur lesen; Vorgabe für den GVB-Entwurf). Welche dieser Teilbereiche er tatsächlich lesen darf (zusätzlich
    2.1, 2.4, 3.1, 3.4, 3.5, 6.2), ist noch zu entscheiden. In Bereich 9 Qualitätssicherung (9.0 Abschliessende Beurteilung, Archivierungsreife, Schlussvermerk) hat er keine Rolle. Auch
    in den Bereichen 4 und 10 bleiben beim Menschen: das Visum pro Schritt, das ✓ pro Prüffeld, «Abgeschlossen» und «Review» in der Fusszeile sowie der Status in Bereich 10.'
- id: r02
  frage: Im Prüffeld C1 findet der Agent für eine Debitorenposition keinen Beleg, und bei einer anderen Rechnung vermutet er einen Abgrenzungsfehler, für den er eine Korrekturbuchung
    vorschlagen würde. In welche Notizkategorien in revio gehört was – und darf er die Korrektur selbst verbuchen?
  soll: 'Der fehlende Beleg gehört in eine Notiz der Kategorie «Pendenz» (fehlende Unterlagen, ungeklärte Sachverhalte, nicht verfügbare Belege – mit Konto, Datum und Betrag). Der mögliche
    Fehler mit begründetem Buchungsvorschlag gehört in «Wesentliche Feststellungen». Verbuchen darf der Agent nicht: Buchungsvorschläge sind nur als Notiz zulässig, ohne Verbuchung (Pflichtenheft:
    keine Buchung). Verwendete Nachweise kann er als Beilage an die Notiz hängen, wenn sie nicht direkt beim Prüfschritt liegen. (Differenzen unter der Nichtaufgriffsgrenze werden nur
    protokolliert.)'
- id: r03
  frage: Welche Notizkategorie verwendet der Agent für Punkte, die der Wirtschaftsprüfer mit dem Kunden besprechen sollte? Darf er auch Review-Notizen erfassen oder eine Pendenz löschen
    bzw. als erledigt markieren, wenn der Beleg inzwischen nachgereicht wurde?
  soll: 'Punkte für das Gespräch mit dem Kunden gehören in die Kategorie «Schlussbesprechung». revio 4.0 kennt vier Notizkategorien: Pendenz, Wesentliche Feststellungen, Schlussbesprechung
    und Review. In «Review» erfasst der Agent nichts – diese Kategorie ist für die Rückmeldungen des Wirtschaftsprüfers. Notizen löscht oder erledigt der Agent nie. Das gilt auch für
    eine Pendenz, deren Beleg inzwischen nachgereicht wurde: Das Erledigen bleibt beim Menschen. Dass der Agent den Eingang festhält (z.B. im Textfeld des Prüfschritts bzw. im Rapport),
    ist naheliegend, im Konzept aber nicht ausdrücklich geregelt. Technisch heisst das: kein rv_delete_workpapers_DeleteNote_by_noteId, und das Feld isClosed einer Notiz (NoteDto/NoteChangedRequest,
    z.B. über rv_put_workpapers_UpdateNote oder rv_post_workpapers_NoteChanged) setzt er nie auf true. Abgesichert wird das zusätzlich über den Dienstbenutzer mit eingeschränkten Löschrechten.'
- id: r04
  frage: Wie bearbeitet der Agent einen Befragungsschritt wie C1-101 (Durchsicht der Debitoren-OP-Liste und Befragung über Gründe für alte Ausstände), und welchen Bearbeitungsstatus
    kann er dabei höchstens erreichen?
  soll: 'C1-101 ist ein Befragungsschritt (1xx), gekennzeichnet EP, mit den Prüfzielen EX VO BE. Er gehört zum Pflichtenheft-Beispiel C1 Delkredere (101 OP-Liste). Der Schritt hat zwei
    Teile. (1) Die Durchsicht der Debitoren-OP-Liste kann der Agent vorbereiten: OP-Liste per Stichtag aus M-Files beschaffen, alte, ungewöhnlich hohe Ausstände und Haben-Salden herausfiltern
    (Altersstruktur im Rechenmodul, nicht im Sprachmodell) und das Ergebnis im Textfeld mit Fundstelle, Umfang und den abgedeckten Prüfzielen dokumentieren. Ab welchem Alter eine Forderung
    als «alt» gilt, ist noch ein offener Entscheid (consis, Thema Delkredere C1). (2) Die Befragung kann er nicht selbst durchführen und kontaktiert den Kunden nicht. Er wertet vorhandene
    schriftliche Antworten aus (z.B. 10.11 Kundenbefragung); fehlt eine Antwort, erfasst er die Frage als Pendenz. Der Schritt erreicht höchstens den Status «teilweise bearbeitet». Ab
    wann ein Schritt – gerade eine Befragung – als «vorbereitet» gilt, ist ebenfalls offen (consis). Das Visum bleibt offen. (Typ 1xx: 106 Schritte, davon 80 EP und 12 WP.)'
- id: r05
  frage: Darf der Agent Prüfschritte mit der Kennzeichnung WP – zum Beispiel G1-305 (Durchsicht von Einkaufsfakturen) – vorbereiten, oder nur EP-Schritte?
  soll: 'Das ist noch nicht entschieden: Ob der Agent WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid; zuständig ist consis (G1-305 ist
    ausdrücklich WP gekennzeichnet). Kern der Agentenarbeit sind die EP-Schritte (Einzelfallprüfung): von 538 Schritten sind 180 EP und 87 WP. Bis zum Entscheid wird nicht geraten: In
    der geplanten revio-Zuordnung werden WP-Schritte in der Spalte «art» als nur_mensch geführt, die Rolle ist als offene Fachfrage gesammelt. In jedem Fall bleiben Visum und Abschluss
    beim Menschen.'
- id: r06
  frage: In 3.3 ist eine Gesamtwesentlichkeit von CHF 80'000 festgelegt. Mit welchen Grenzen arbeitet der Agent für Prüfumfang/Stichprobe und für die Behandlung von Differenzen – und
    darf er die Werte in 3.3 anpassen, wenn sie ihm unplausibel erscheinen?
  soll: 'Toleranzwesentlichkeit 75 % der Gesamtwesentlichkeit = CHF 60''000: steuert Prüfumfang und Stichprobe. Nichtaufgriffsgrenze 5 % = CHF 4''000: Differenzen darunter werden nur
    protokolliert. Gesamtwesentlichkeit CHF 80''000: Massstab für Wesentliche Feststellungen; die Summe der nicht korrigierten Fehler beurteilt der Mensch in 6.1. Der Agent liest die
    Wesentlichkeit aus 3.3 und ändert sie nie; passen Bezugsgrösse, Prozentsatz und Begründung nicht zusammen, erfasst er eine Pendenz. (Bezug der Prozentsätze auf die Gesamtwesentlichkeit
    vgl. HWP ER Rz 50–51.)'
- id: r07
  frage: Wo legt der Agent das Protokoll der Generalversammlung des Vorjahres in revio ab, woher holt er es und was prüft er vor der Ablage?
  soll: 'Das ist Prozess 3 «Unterlagen zum Abschluss»: Der Agent beschafft das Protokoll Vorjahr aus M-Files, prüft die Zugehörigkeit (gegen den zu Beginn fixierten Mandatskontext: Kunde,
    revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag – bei Abweichung Abbruch und Pendenz) und legt es in revio unter 10.9 «Protokolle» ab. Der Status bleibt offen; er wird vom Menschen
    gesetzt.'
- id: r08
  frage: Was macht der Agent, wenn für den Abschluss eine Unterlage fehlt, z.B. ein Bankauszug per Stichtag ist nicht in M-Files? Darf er den Kunden direkt anschreiben?
  soll: 'Fehlende Unterlagen meldet er als Vorschlag für die PBC-Liste (10.10) und erfasst sie als Pendenz (fehlende Unterlage mit Konto, Datum und Betrag); im Revisionsrapport meldet
    er alles, was er nicht klären kann. Der Status bleibt offen, und die Anforderung beim Kunden macht der Mensch. Den Kunden schreibt er nicht an: E-Mails in der Testphase nur als Entwurf
    oder an die fixe WP-Adresse, nie an Kunden. Fehlende Daten werden nicht erfunden.'
- id: r09
  frage: Mit welchen revio-MCP-Werkzeugen findet der Agent den Kunden, dessen Jahresakte und öffnet das Dossier – und was hält er unmittelbar danach fest?
  soll: revio_find_clients (alle Kunden/Mandate) → revio_list_dossiers (Jahresakten eines Kunden, Parameter client_id) → revio_open_dossier (Dossier öffnen/Mandatskontext, Parameter
    client_id und dossier_id). Danach fixiert er den Mandatskontext (Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag) und prüft jeden weiteren Zugriff dagegen. revio_create_client
    (legt Kunden an) braucht er dafür nicht.
- id: r10
  frage: Das Dossier ist offen. Mit welchem MCP-Werkzeug lädt der Agent die Prüfungshandlungen des Prüffelds C1, welche Parameter braucht es, und womit holt er die Vorjahresbearbeitung
    zum Vergleich?
  soll: 'Die Prüfungshandlungen des Prüffelds lädt der Agent mit rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId (GET /api/auditActivities/LoadAuditActivities/{containerId}/{templateId}).
    Es braucht die Pfadparameter containerId und templateId, übergeben als path_params_json. Für den Vorjahresvergleich gibt es zwei Werkzeuge: rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId
    für das ganze Prüffeld (gleiche Parameter) und rv_get_auditActivities_GetActivityItemFromPreviousPeriod_by_containerId_by_templateId_by_activityId für einen einzelnen Schritt (zusätzlich
    activityId). Ergänzend liefert rv_get_auditActivities_LoadCoverSheet_by_containerId (containerId) das Deckblatt. Alle sind GET-Werkzeuge. Vorbehalt: Die Werkzeugliste enthält keine
    Beschreibungen. Die Bedeutung ist aus Namen und Pfaden abgeleitet und in der enco-Idee als «Kandidat, zu bestätigen» geführt. Die Ids gibt es erst im echten Dossier: Nach dem Öffnen
    ermittelt der Agent containerId/templateId je Prüffeld und ordnet die geladenen Handlungen per Text und Nummer (z.B. «302») dem Katalog zu. Die Katalognummer C1-302 ist keine revio-Id.'
- id: r11
  frage: Der Agent soll Antworten in einer revio-Checkliste vorbereiten. Mit welchem Werkzeug liest er die Checkliste, mit welchem speichert er die Daten, und darf er den Fragebogen
    danach auf «geschlossen» setzen?
  soll: 'Lesen: rv_get_checklists_LoadChecklist (GET, LoadChecklistRequest mit areaId und checklistId). Speichern: rv_post_checklists_StoreChecklistData (POST, StoreChecklistRequest
    mit der ganzen Checkliste). Das ist ein schreibendes Vorbereiten-Werkzeug und in OpenClaw freigabepflichtig. Schliessen darf der Agent nicht. Die Checkliste selbst kennt in der API
    keinen Zustand «geschlossen»; diesen gibt es nur beim Fragebogen eines Containers (ContainerQuestionnaireDto.isClosed). Gesetzt wird er über rv_post_checklistDefinitions_SetContainerQuestionnaireClosedState
    (containerId, isClosed). Dieses Abschluss-Werkzeug steht unter «Menschlich – nie Agent» und bleibt in OpenClaw gesperrt (vorbereiten ja, abschliessen nie). Achtung: Die Zellen einer
    Checkliste enthalten auch Visumsfelder (isVised, visaUserId, visaDate). Beim Speichern darf der Agent diese nicht setzen; abgesichert wird das zusätzlich über den Dienstbenutzer
    ohne Visumsrecht. Nicht verwechseln: rv_put_checklists_UpdateTemplate ändert die Vorlage, rv_post_checklists_CreateChecklistReport erzeugt einen Bericht.'
- id: r12
  frage: Welche revio-MCP-Werkzeuge müssen in OpenClaw für den Agenten gesperrt bleiben? Nenne die Werkzeuge für Siegel, Visum, Archivierung und Review-Freigabe und begründe, warum auch
    revio_call nicht freigegeben werden darf.
  soll: 'Für den Agenten gesperrt (nur Mensch) sind u.a.:

    - Siegel: rv_post_clientsManagement_SealAnualFile, rv_post_clientsManagement_UnSealAnualFile, rv_post_clientsManagement_RequestSeal_by_dossierId, rv_post_workpapers_SetMaterialitySealState,
    rv_post_workpapers_SetAnalyticalAuditProcedureSealedState, rv_post_financialStatement_SetPeriodSealedState.

    - Visum: rv_post_workpapers_SetDeliveryVisa_by_componentId, rv_post_workpapers_StoreDynamicFormPanelVisaState.

    - Archiv: rv_post_clientsManagement_ArchiveDossier, rv_post_clientsManagement_ArchiveDossiers.

    - Freigabe: rv_post_clientsManagement_ApproveGlobalDossierReview_by_dossierId.

    - Abschluss: rv_post_checklistDefinitions_SetContainerQuestionnaireClosedState.


    Weitere Kandidaten aus der Liste: rv_post_clientsManagement_CancelSealRequest_by_dossierId, rv_post_clientsManagement_RequestGlobalDossierReview_by_dossierId_by_reviewerId, rv_post_clientsManagement_RejectGlobalDossierReview_by_dossierId,
    rv_post_clientsManagement_CancelGlobalDossierReviewRequest_by_dossierId, rv_put_workpapers_UpdateDocumentationAttachementSealedState, rv_post_clientsManagement_SetUserSignature.


    Grund: Der Agent setzt nie ein Visum, schliesst nichts ab und gibt nichts frei (Dienstbenutzer ohne Visums- und Freigaberecht). revio_call ist ein generischer Aufruf (method, path,
    path_params_json, query_json, body_json) und kann damit jeden Endpunkt erreichen. Im MCP-Code ist nichts gesperrt; die Sperre läuft nur über OpenClaw allow/deny je Werkzeug und das
    JWT. revio_call würde deshalb die Einzelsperren umgehen und muss ebenfalls gesperrt sein. Zusätzlich gilt: Das Visum pro Prüfschritt ist kein eigenes Werkzeug, sondern ein Feld (isVised,
    visaUserId, visaDate in TemplatedRow/Cell). Es könnte über das Vorbereiten-Werkzeug rv_put_auditActivities_UpdateDossierActivity mitgeschickt werden. Die Werkzeugsperre allein genügt
    also nicht; nötig ist auch das JWT des Dienstbenutzers ohne Visumsrecht (mit revio zu bestätigen).'
