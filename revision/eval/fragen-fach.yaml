- id: f17
  kategorie: Kapitalschutz / Aufwertung Art. 725c OR
  schwierigkeit: schwer
  frage: 'AG (keine Holding) per 31.12.2025: Aktienkapital 300''000, keine gesetzlichen Reserven, bilanzielles Eigenkapital 100''000. Sie hat ein unbebautes Grundstück, bilanziert zu
    Anschaffungskosten 400''000; ein externes Gutachten ergibt einen Netto-Marktwert von 750''000. Um wie viel darf das Grundstück zur Behebung des Kapitalverlusts höchstens aufgewertet
    werden, und wie wird das gebucht?'
  soll:
    antwort: 'Kapitalverlust: Hälfte des geschützten Kapitals 150''000 > EK 100''000 (Fehlbetrag 50''000). Maximal aktivseitig: erzielbarer Wert − Buchwert = 750''000 − 400''000 = 350''000
      (beim Grundstück ist für den Netto-Marktwert ein externes Gutachten unerlässlich). Maximal passivseitig: (0,5 × 300''000 − 100''000) × 2 = 100''000, also der doppelte Kapitalverlust,
      weil die Aufwertungsreserve selbst zum geschützten Kapital zählt. Zulässig ist der tiefere Wert: 100''000. Kontrolle: EK 200''000 = Hälfte von (300''000 + 100''000) → gedeckt.
      Buchung erfolgsneutral: Grundstück an Aufwertungsreserve 100''000. Die Reserve wird gleichzeitig mit der Aufwertung im Abschluss gebildet, nicht erst im Rahmen der Gewinnverwendung
      durch die GV. Ausweis gesondert als Aufwertungsreserve unter der gesetzlichen Gewinnreserve. Voraussetzung: Die Revisionsstelle bzw. (falls keine) ein zugelassener Revisor bestätigt
      schriftlich, dass die gesetzlichen Bestimmungen eingehalten sind; der Prüfungsbericht muss spätestens bei der Verabschiedung der JR durch den VR vorliegen. Anhang (HWP): aufgewertete
      Position inkl. Bilanzposition, Höhe der Aufwertungsreserve und spätere Veränderungen, Datum des Prüfungsberichts. Auflösung nur durch Umwandlung in Aktien-/PS-Kapital, Wertberichtigung
      oder Veräusserung. HWP empfiehlt, vorher stille Reserven so weit wie möglich aufzulösen. Steuerfolgen sind zu berücksichtigen und abzugrenzen. Bund: Die erfolgsneutrale Aufwertung
      wird dem steuerbaren Gewinn hinzugerechnet (Art. 58 Abs. 1 lit. c DBG), allenfalls verrechenbar mit Verlustvorträgen (Art. 62 Abs. 3 DBG für spätere Abschreibungen beachten). Kanton:
      Im monistischen System ist der Betrag über den Anschaffungskosten nicht steuerbar, im dualistischen gilt die Besteuerung analog DBG.'
    kernpunkte:
    - 'Kapitalverlust: Hälfte geschütztes Kapital 150''000 > EK 100''000'
    - Aktivseitig max. 350'000 (750'000 − 400'000)
    - Passivseitig max. (0,5 × 300'000 − 100'000) × 2 = 100'000 → zulässige Aufwertung 100'000 (tieferer Wert)
    - Erfolgsneutrale Buchung Grundstück an Aufwertungsreserve, gesondert unter der gesetzlichen Gewinnreserve, gleichzeitig mit der Aufwertung gebildet
    - Schriftliche Bestätigung durch Revisionsstelle bzw. zugelassenen Revisor; Anhangangaben (Position, Reserve, Datum Prüfungsbericht)
    - Auflösung nur durch Umwandlung in AK/PS, Wertberichtigung oder Veräusserung
    - 'Steuerfolgen berücksichtigen/abgrenzen (Bund: Art. 58 Abs. 1 lit. c DBG; Kanton je nach monistischem/dualistischem System)'
    fehler:
    - Aufwertung um die volle Differenz 350'000
    - Aufwertung nur um den einfachen Fehlbetrag 50'000 (Aufwertungsreserve erhöht das geschützte Kapital)
    - Aufwertung über die Erfolgsrechnung als Ertrag
    - Ausweis als freiwillige Gewinnreserve oder Aufwertung ohne Prüfbestätigung
    quellen:
    - chunk: or__art-725c
      zitat: Zur Behebung eines Kapitalverlusts nach Artikel 725a oder einer Überschuldung nach Artikel 725b dürfen Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs-
        oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden.
    - chunk: or__art-725c
      zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
    - chunk: or__art-725c
      zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt, dass die gesetzlichen Bestimmungen
        eingehalten sind.
    - chunk: or__art-725c
      zitat: Die Aufwertungsreserve kann nur durch Umwandlung in Aktien- oder Partizipationskapital sowie durch Wertberichtigung oder Veräusserung der aufgewerteten Aktiven aufgelöst
        werden.
    - chunk: hwp-bur-2023__rz-0894-s361-t1
      zitat: Maximaler passivseitiger Aufwertungsbetrag = [0,5 × geschütztes Kapital vor Aufwertung . /. bilanzielles Eigenkapital vor Aufwertung] × 2.
    - chunk: hwp-bur-2023__rz-0893-s360-t2
      zitat: Der maximale aktivseitige Aufwertungsbetrag entspricht der Differenz zwischen dem erzielbaren Wert und dem Buchwert in der Bilanz.
    - chunk: hwp-bur-2023__rz-0891-s359-t1
      zitat: Der maximale Aufwertungsbetrag entspricht hierbei dem tieferen Wert aus dem maximalen aktivseitigen Aufwertungsbetrag und dem maximalen passivseitigen Aufwertungsbetrag
    - chunk: hwp-bur-2023__rz-0898-s363
      zitat: Die Bildung der Aufwertungsreserve erfolgt ohne Berührung der Erfolgsrechnung direkt innerhalb der Bilanz
  pruefung: 'korrigiert: Alle 8 Zitate wörtlich belegt, die Rechnung stimmt: Kapitalverlust 150''000 > 100''000; aktivseitig 350''000; passivseitig (150''000 − 100''000) × 2 = 100''000;
    Kontrolle EK 200''000 = ½ × 400''000. Unvollständig sind zwei prüfungsrelevante Punkte aus derselben HWP-Passage. (1) Nach HWP BuR Rz 906 gehören A'
- id: f18
  kategorie: Eigenkapital / gesetzliche Reserven
  schwierigkeit: mittel
  frage: 'AG mit Aktienkapital 100''000, gesetzlicher Kapitalreserve 10''000 und gesetzlicher Gewinnreserve 25''000. Jahresgewinn 2025: 80''000, Verlustvortrag aus dem Vorjahr: 20''000.
    Wie viel muss der gesetzlichen Gewinnreserve zugewiesen werden? Und wie wäre es, wenn es eine Holdinggesellschaft wäre?'
  soll:
    antwort: 'Zuerst ist der Verlustvortrag zu beseitigen bzw. vom Jahresgewinn abzuziehen: 5 % × (80''000 − 20''000) = 3''000 Pflichtzuweisung. Die Äufnungsgrenze (gesetzliche Gewinn-
      + Kapitalreserve = 50 % des AK = 50''000) ist mit 35''000 noch nicht erreicht → 3''000 zuweisen (Mindestzuweisung; zusätzliche Zuweisungen bis zur Grenze sind erlaubt). Holding:
      Grenze 20 % des AK = 20''000, mit 35''000 bereits überschritten → keine Pflichtzuweisung. Dividenden dürfen erst nach den Zuweisungen an die gesetzliche und die freiwilligen Gewinnreserven
      festgesetzt werden.'
    kernpunkte:
    - Verlustvortrag vor Zuweisung abziehen → Basis 60'000
    - Zuweisung 5 % = 3'000
    - 'Grenze: gesetzliche Gewinn- und Kapitalreserve zusammen 50 % des AK (50''000) – noch nicht erreicht'
    - 'Holding: Grenze 20 % (20''000) bereits erreicht → keine Pflichtzuweisung'
    fehler:
    - 5 % von 80'000 = 4'000 (Verlustvortrag nicht abgezogen)
    - Grenze nur auf die gesetzliche Gewinnreserve allein bezogen (ohne Kapitalreserve)
    - 20 %-Grenze auch für Nicht-Holding angewendet
    - Altrechtliche Zusatzzuweisung (10 % der Dividende) verlangt
    quellen:
    - chunk: or__art-672
      zitat: Der gesetzlichen Gewinnreserve sind 5 Prozent des Jahresgewinns zuzuweisen. Liegt ein Verlustvortrag vor, so ist dieser vor der Zuweisung an die Reserve zu beseitigen.
    - chunk: or__art-672
      zitat: Die gesetzliche Gewinnreserve ist zu äufnen, bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte des im Handelsregister eingetragenen Aktienkapitals erreicht.
        Holdinggesellschaften müssen die gesetzliche Gewinnreserve äufnen, bis diese zusammen mit der gesetzlichen Kapitalreserve 20 Prozent des im Handelsregister eingetragenen Aktienkapitals
        erreicht.
    - chunk: hwp-bur-2023__rz-0585-s280
      zitat: Hingegen ist der Verlustvortrag vom Jahresgewinn abzuziehen.
    - chunk: hwp-bur-2023__rz-0585-s280
      zitat: Bei der obligatorischen Zuweisung geht es um eine Mindestzuweisung.
    - chunk: or__art-675
      zitat: Dividenden dürfen erst festgesetzt werden, nachdem die Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven erfolgt sind.
- id: f19
  kategorie: Bewertung / Forderungen und Delkredere
  schwierigkeit: mittel
  frage: 'Forderungen aus L+L per 31.12.2025: Inland 400''000, davon 30''000 gegenüber einem Kunden im Konkurs (keine Dividende zu erwarten) und 50''000 gegenüber Gemeinden; Ausland
    100''000, nicht kreditversichert. Wie hoch darf das Delkredere sein, wenn wir die steuerlich akzeptierten Pauschalsätze der ESTV anwenden, und wo zeige ich es in der Bilanz?'
  soll:
    antwort: 'Zuerst Einzelwertberichtigung des gefährdeten Postens: 30''000 (Konkurs). Danach pauschal auf den restlichen Guthaben: Inland ohne Forderungen gegen öffentlich-rechtliche
      Körperschaften: 400''000 − 30''000 − 50''000 = 320''000 × 5 % = 16''000; Ausland 100''000 × 10 % = 10''000. Delkredere total 56''000 (davon pauschal 26''000). Ausweis als Wertberichtigung
      (Minusposten) bei den Forderungen auf der Aktivseite, nicht als Rückstellung unter den Passiven. Hinweise: Kantone lassen teils abweichende Pauschalen zu (HWP-Beispiel ZH 10 %/20
      %); handelsrechtlich ist die Pauschale aus Erfahrungswerten und erwarteter Entwicklung zu bemessen; bei Kreditversicherung deckt das Delkredere nur den unversicherten Teil.'
    kernpunkte:
    - Zuerst Einzelwertberichtigung 30'000, dann Pauschale auf dem Rest
    - Inland 5 % auf 320'000 (ohne öffentlich-rechtliche Körperschaften) = 16'000
    - Ausland 10 % auf 100'000 = 10'000 → total 56'000
    - Ausweis als Wertberichtigung auf der Aktivseite, nicht als Rückstellung
    fehler:
    - 5 % auf 400'000 bzw. auf allen Inlandforderungen inkl. Gemeinden
    - Pauschale zusätzlich auf der bereits einzeln wertberichtigten Konkursforderung
    - Delkredere als Rückstellung im Fremdkapital ausweisen
    - Kantonale Sätze (z.B. ZH) als ESTV-Sätze ausgeben
    quellen:
    - chunk: hwp-bur-2023__rz-0437-s248
      zitat: lässt die Eidg. Steuerverwaltung auf inländischen Guthaben (ausgenommen Forderungen gegen öffentlich-rechtliche Körperschaften und Forderungen mit voller Deckung) eine pauschale
        Wertberichtigung von 5 % und auf ausländischen von 10 % zu
    - chunk: hwp-bur-2023__rz-0437-s248
      zitat: Die Kantone lassen zum Teil abweichende Pauschalwertberichtigungen zu (beispielsweise Kanton Zürich 10 % auf inländischen und 20 % auf ausländischen Guthaben).
    - chunk: hwp-bur-2023__rz-0120-s186
      zitat: Die Wertberichtigungen für gefährdete Forderungen sind zunächst einzeln zu ermitteln; danach sind Pauschalwertberichtigungen auf den restlichen Guthaben zu bilden.
    - chunk: hwp-bur-2023__rz-0113-s185
      zitat: Das Delkredere ist eine Wertberichtigung für Forderungen. Deshalb stellt es keine Rückstellung dar, sondern einen Korrekturposten auf der Aktivseite der Bilanz.
    - chunk: or__art-960a
      zitat: Sie sind direkt oder indirekt bei den betreffenden Aktiven zulasten der Erfolgsrechnung abzusetzen und dürfen nicht unter den Passiven ausgewiesen werden.
    - chunk: hwp-bur-2023__rz-0438-s248
      zitat: Sofern eine Exportrisikoversicherung oder eine Kreditversicherung besteht, hat das Delkredere nur den unversicherten Teilbetrag zu decken.
- id: f20
  kategorie: Bewertung / Vorräte
  schwierigkeit: mittel
  frage: Handelsware mit Anschaffungskosten 120'000 per 31.12.2025. Erwarteter Verkaufserlös 130'000, Erlösminderungen (Rabatte/Skonti) 5'000, noch anfallende Vertriebs- und Verwaltungskosten
    15'000. Zu welchem Wert darf die Ware höchstens bilanziert werden, und wie tief darf man mit dem steuerlich akzeptierten Warendrittel gehen?
  soll:
    antwort: 'Netto-Veräusserungswert (Rückrechnung) = 130''000 − 5''000 − 15''000 = 110''000 < AK 120''000 → Niederstwert: höchstens 110''000, Wertberichtigung 10''000 ist zwingend
      (verlustfreie Bewertung, Art. 960c Abs. 1 OR). Der steuerlich zugelassene Bewertungsabzug von einem Drittel bemisst sich vom gesetzlichen Höchstwert 110''000: 36''667 → tiefster
      Wert rund 73''333. Der Drittelabzug hat (nach den handelsrechtlich nötigen Wertkorrekturen) Reservecharakter; nimmt er bei Lagerabbau ab, werden stille Reserven aufgelöst, was
      in die Nettoauflösung nach Art. 959c Abs. 1 Ziff. 3 OR einfliesst.'
    kernpunkte:
    - Netto-Veräusserungswert 110'000 (Erlösminderungen und noch anfallende Kosten abziehen)
    - Höchstwert 110'000, Wertberichtigung 10'000 zwingend
    - Warendrittel vom Höchstwert 110'000 → rund 36'667, Mindestwert rund 73'333
    - Drittel = stille Reserve; Abbau ist Reservenauflösung
    fehler:
    - Bilanzierung zu AK 120'000 (Niederstwert übersehen)
    - Drittel von den AK berechnet (40'000 → 80'000)
    - Erlösminderungen/Vertriebskosten nicht abgezogen → keine Wertberichtigung
    - Warendrittel als handelsrechtliche Pflicht-Wertberichtigung bezeichnet
    quellen:
    - chunk: or__art-960c
      zitat: Liegt in der Folgebewertung von Vorräten und nicht fakturierten Dienstleistungen der Veräusserungswert unter Berücksichtigung noch anfallender Kosten am Bilanzstichtag unter
        den Anschaffungs- oder Herstellungskosten, so muss dieser Wert eingesetzt werden.
    - chunk: hwp-bur-2023__rz-0245-s212
      zitat: Dabei sind, ausgehend vom voraussichtlichen Verkaufserlös, die mutmasslichen Erlösschmälerungen und die noch anfallenden Kosten in Abzug zu bringen.
    - chunk: hwp-bur-2023__rz-0246-s212
      zitat: Sind die Anschaffungs- oder Herstellungskosten höher als dieser Vergleichswert, ist eine entsprechende Wertberichtigung vorzunehmen (verlustfreie Bewertung).
    - chunk: hwp-bur-2023__rz-0253-s214
      zitat: lassen die Steuerbehörden einen Bewertungsabzug von einem Drittel zu
    - chunk: hwp-bur-2023__rz-0253-s214
      zitat: hat der auf dem Restwert gebildete steuerliche Bewertungsabzug nicht mehr Wertberichtigungs-, sondern Reservecharakter
    - chunk: hwp-bur-2023__rz-0253-s214
      zitat: der Auflösungsbetrag hat in die Berechnung des Gesamtbetrags der Reserveveränderung einzufliessen
- id: f21
  kategorie: Bewertung / Rückstellungen
  schwierigkeit: mittel
  frage: Gegen unseren Kunden läuft eine Schadenersatzklage wegen eines 2025 gelieferten mangelhaften Produkts. Der Anwalt schätzt die Wahrscheinlichkeit, zu verlieren, auf 40 %, die
    mögliche Zahlung auf 50'000 bis 150'000. Der Kunde will keine Rückstellung bilden, sondern nur eine Eventualverbindlichkeit im Anhang zeigen, weil das Risiko unter 50 % liege und
    die Bandbreite zu gross sei. Geht das?
  soll:
    antwort: Grundsätzlich nein. Eine Rückstellung ist zu bilden, wenn ein vergangenes Ereignis (Lieferung 2025) einen Mittelabfluss in künftigen Geschäftsjahren erwarten lässt und die
      Höhe verlässlich geschätzt werden kann (Art. 960e Abs. 2 OR). Eine Eintretenswahrscheinlichkeit unter 50 % darf nicht einfach als unwahrscheinlich qualifiziert werden; mindestens
      eine anteilige Rückstellung ist zu prüfen (z.B. Erwartungswert), aus Vorsicht eher am oberen Ende der Bandbreite. Eine grosse Bandbreite genügt als verlässliche Schätzung und ist
      kein Grund, nur eine Eventualverbindlichkeit auszuweisen. Eine Eventualverbindlichkeit im Anhang (Art. 959c Abs. 2 Ziff. 10 OR) kommt nur in Frage, wenn der Mittelabfluss unwahrscheinlich
      ist oder die Höhe ausnahmsweise nicht verlässlich geschätzt werden kann. Fällt das Risiko später weg, muss die Rückstellung nicht aufgelöst werden (Art. 960e Abs. 4 OR).
    kernpunkte:
    - 'Voraussetzungen: vergangenes Ereignis, erwarteter Mittelabfluss, verlässliche Schätzung'
    - < 50 % heisst nicht automatisch unwahrscheinlich → mind. anteilige Rückstellung prüfen, eher oberes Ende der Bandbreite
    - Grosse Bandbreite ist kein Grund für blosse Eventualverbindlichkeit
    - Eventualverbindlichkeit nur bei unwahrscheinlichem Abfluss oder ausnahmsweise nicht schätzbarer Höhe
    fehler:
    - Unter 50 % → keine Rückstellung, nur Anhangangabe zulässig
    - Rückstellung zwingend über 150'000 ohne Abwägung (Vollbetrag als einzige Lösung)
    - Anwendung der IFRS-«more likely than not»-Schwelle als OR-Regel
    - Rückstellung müsse bei Wegfall zwingend aufgelöst werden
    quellen:
    - chunk: or__art-960e
      zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
        gebildet werden.
    - chunk: hwp-bur-2023__rz-0515-s261
      zitat: dass ein Ereignis bei Eintretenswahrscheinlichkeit von unter 50 % nicht einfach als unwahrscheinlich qualifiziert und auf die Bildung einer Rückstellung verzichtet werden
        kann
    - chunk: hwp-bur-2023__rz-0515-s261
      zitat: In einem solchen Fall ist die Bildung zumindest einer anteiligen Rückstellung zu prüfen, wenn die übrigen Voraussetzungen erfüllt sind.
    - chunk: hwp-bur-2023__rz-0515-s261
      zitat: Das Vorsichtsprinzip impliziert, dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist.
    - chunk: hwp-bur-2023__rz-0516-s261
      zitat: Eine grosse Bandbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten und stattdessen nur eine Eventualverbindlichkeit im Anhang
        der Jahresrechnung auszuweisen.
    - chunk: or__art-959c-t2
      zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
        (Eventualverbindlichkeit)
    - chunk: or__art-960e
      zitat: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden.
- id: f22
  kategorie: Anhang / stille Reserven
  schwierigkeit: mittel
  frage: Jahresgewinn 2025 laut Erfolgsrechnung 60'000. Im Abschluss wurde eine nicht mehr benötigte Rückstellung (stille Reserve) von 50'000 aufgelöst, das Warendrittel ist wegen Lagerabbau
    um 20'000 gesunken, und es wurden zusätzliche, betriebswirtschaftlich nicht nötige Abschreibungen auf Mobilien von 15'000 gebucht. Muss im Anhang etwas offengelegt werden, und welcher
    Betrag?
  soll:
    antwort: 'Nettoauflösung stiller Reserven = 50''000 + 20''000 − 15''000 = 55''000. Ohne diese Nettoauflösung betrüge der Gewinn nur 5''000; das Ergebnis wird also wesentlich günstiger
      dargestellt → Offenlegungspflicht im Anhang nach Art. 959c Abs. 1 Ziff. 3 OR: Gesamtbetrag der Nettoauflösung 55''000. Offenzulegen ist nur der Nettobetrag als Gesamtbetrag (keine
      Aufteilung nach Bilanzpositionen nötig), nach verbreiteter Praxis vor latenten Steuern. Die Abnahme des Warendrittels zählt mit; Zwangsreserven und Schwankungsreserven fallen nicht
      unter diese Ausweispflicht.'
    kernpunkte:
    - Nettoauflösung 55'000 (Auflösungen 70'000 − Neubildung 15'000)
    - Ergebnis wesentlich günstiger (5'000 statt 60'000) → Offenlegung im Anhang (Art. 959c Abs. 1 Ziff. 3 OR)
    - Nur Nettobetrag als Gesamtbetrag, ohne Aufteilung, vor latenten Steuern
    - Reduktion Warendrittel fliesst ein; Zwangs- und Schwankungsreserven nicht
    fehler:
    - Bruttobetrag 70'000 oder nur 50'000 offenlegen
    - Abnahme des Warendrittels nicht berücksichtigen
    - Betrag nach Abzug latenter Steuern offenlegen
    - Keine Offenlegung, weil die Reserven steuerlich akzeptiert waren
    quellen:
    - chunk: or__art-959c-t1
      zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen
        Reserven übersteigt, wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
    - chunk: hwp-bur-2023__rz-0817-s341-t1
      zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
    - chunk: hwp-bur-2023__rz-0817-s341-t1
      zitat: Der Ausweis kann in Form eines Gesamtbetrags erfolgen.
    - chunk: hwp-bur-2023__rz-0817-s341-t2
      zitat: Die sog. Zwangsreserven unterliegen bei ihrer Auflösung nicht dieser Ausweispflicht, so auch nicht die Schwankungsreserven
    - chunk: hwp-bur-2023__rz-0817-s341-t2
