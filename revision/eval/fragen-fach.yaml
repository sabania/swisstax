- id: f24
  kategorie: Steuern / ESTV-Zinssätze 2026 (Darlehen an Aktionär)
  schwierigkeit: leicht
  frage: Die AG hat ihrem Aktionär am 1.1.2026 ein Darlehen von CHF 250'000 gewährt, zinslos. Welchen Zins müsste sie 2026 mindestens verrechnen, a) wenn das Darlehen aus Eigenkapital
    finanziert ist und die AG kein verzinsliches Fremdkapital hat, b) wenn sie es über einen Bankkredit mit Selbstkosten von 2 % finanziert? Was passiert, wenn kein Zins verrechnet wird?
  soll:
    antwort: 'ESTV-Rundschreiben Zinssätze 2026 (ab 1.1.2026, CHF): a) aus Eigenkapital finanziert, kein verzinsliches Fremdkapital: mindestens ¾ % → 1''875 pro Jahr. b) aus Fremdkapital
      finanziert: Selbstkosten zuzüglich ½ % (Zuschlag bei Darlehen bis und mit CHF 10 Mio.), mindestens ¾ % → 2,5 % → 6''250 pro Jahr. Ein zinsloses oder ungenügend verzinstes Darlehen
      an Beteiligte ist eine geldwerte Leistung: Verrechnungssteuer 35 %, unaufgefordert mit Formular 102 innert 30 Tagen nach Fälligkeit deklarieren und entrichten; bei der direkten
      Bundessteuer wird die geldwerte Leistung beim Gewinn erfasst (Art. 58 Abs. 1 Bst. b DBG). Die Sätze sind «safe haven».'
    kernpunkte:
    - 'Variante a: mindestens ¾ % = 1''875'
    - 'Variante b: Selbstkosten + ½ % (bis 10 Mio.) = 2,5 % = 6''250, mindestens ¾ %'
    - Nicht verrechneter Zins = geldwerte Leistung, VSt 35 %, Formular 102 innert 30 Tagen
    - Sätze 2026 (ab 1.1.2026) verwenden
    fehler:
    - Zinssätze des Vorjahres oder Höchstsätze für Darlehen vom Aktionär verwenden
    - Zuschlag ¼ % statt ½ % bei Darlehen unter 10 Mio.
    - Keine VSt-Folge, weil nur Darlehen und keine Ausschüttung
    - Mindestsatz auch bei Fremdfinanzierung nur ¾ %
    quellen:
    - chunk: estv-zinsen-2026__s001-2
      zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
    - chunk: estv-zinsen-2026__s002-1
      zitat: 1.1 aus Eigenkapital finanziert und wenn kein Fremdkapital verzinst werden muss ¾%
    - chunk: estv-zinsen-2026__s002-1
      zitat: Selbstkosten zuzügl. ¼ – ½ %
    - chunk: estv-zinsen-2026__s002-2
      zitat: bis und mit CHF 10 Mio. ½ %
    - chunk: estv-zinsen-2026__s001-1
      zitat: Die Gewährung unverzinslicher oder ungenügend verzinster Vorschüsse oder Darlehen an Beteiligte oder an ihnen nahestehende Dritte stellt eine geldwerte Leistung dar.
    - chunk: estv-zinsen-2026__s001-1
      zitat: Die geldwerten Leistungen sind mittels Formular 102 unaufgefordert innert 30 Tagen nach ihrer Fälligkeit zu deklarieren.
    - chunk: estv-zinsen-2026__s001-1
      zitat: der Verrechnungssteuer von 35 %
- id: f25
  kategorie: Steuern / ESTV-Zinssätze 2026 (Darlehen vom Aktionär)
  schwierigkeit: mittel
  frage: Bei einer Handels-AG haben der Aktionär (500'000) und seine Ehefrau (300'000) Betriebskredite in CHF gewährt. Die AG zahlt 2026 darauf 4 % Zins, total 32'000. Ist das steuerlich
    in Ordnung?
  soll:
    antwort: 'Für die Limite sind die Kredite aller Beteiligten und nahestehenden Personen zusammenzuzählen: 800''000 → Betriebskredit bis CHF 1 Mio. bei einem Handels- und Fabrikationsunternehmen:
      Höchstzinssatz 2026 3½ % → maximal 28''000. Übersetzt sind 4''000 (0,5 % × 800''000): geldwerte Leistung mit Verrechnungssteuer 35 % (Formular 102, 30 Tage) und Aufrechnung beim
      Gewinn. Vorbehalten bleibt der Nachweis höherer Sätze im Drittvergleich; zusätzlich ist ein allfälliges verdecktes Eigenkapital (KS 6a) zu beachten. (Bei einer Holding-/Vermögensverwaltungsgesellschaft
      läge die Limite bis 1 Mio. bei 3 % → 24''000.) Hinweis: im Chunk sind Sätze und Zeilen layoutbedingt getrennt, Zuordnung gemäss Original raw/estv-zinsen-2026.pdf S. 2.'
    kernpunkte:
    - 'Kredite von Aktionär und Ehefrau zusammenzählen: 800''000 → Kategorie bis CHF 1 Mio.'
    - Höchstsatz Handels-/Fabrikationsunternehmen 3½ % → max. 28'000
    - Übersetzter Zins 4'000 = geldwerte Leistung (VSt 35 %, Gewinnaufrechnung)
    - Drittvergleich vorbehalten, verdecktes EK zusätzlich prüfen
    fehler:
    - Kredite einzeln beurteilen
    - Satz für Kredite ab 1 Mio. (1½ %) oder Liegenschaftskredit-Sätze anwenden
    - Holding-Satz 3 % für Handelsgesellschaft
    - Übersetzten Zins als zulässig betrachten, weil marktüblich ohne Nachweis
    quellen:
    - chunk: estv-zinsen-2026__s002-1
      zitat: Für die Berechnung der Limiten sind die Kredite sämtlicher Beteiligten und nahestehender Personen zusammen zu zählen.
    - chunk: estv-zinsen-2026__s002-1
      zitat: a) bis CHF 1 Mio.
    - chunk: estv-zinsen-2026__s002-1
      zitat: bei Handels- und Fabrikationsunternehmen
    - chunk: estv-zinsen-2026__s002-1
      zitat: 3½ %2
    - chunk: estv-zinsen-2026__s002-1
      zitat: Der Nachweis höherer Zinssätze im Drittvergleich bleibt vorbehalten.
    - chunk: estv-zinsen-2026__s001-1
      zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
    - chunk: estv-zinsen-2026__s002-2
      zitat: Bei der Berechnung der steuerlich höchstzulässigen Zinsen ist auch ein allfällig bestehendes verdecktes Eigenkapital zu beachten.
- id: f26
  kategorie: Steuern / verdecktes Eigenkapital (KS 6a)
  schwierigkeit: schwer
  frage: 'Handels-AG per 31.12.2026, keine höheren Verkehrswerte nachgewiesen: Flüssige Mittel 100''000, Forderungen L+L 400''000, Vorräte 300''000, mobile Sachanlagen 200''000. Passiven:
    Lieferanten 300''000, Bankkredit (ohne Sicherheit des Aktionärs) 200''000, Aktionärsdarlehen 400''000 zu 3½ %, Eigenkapital 100''000. Haben wir verdecktes Eigenkapital, und wie viel
    Zins wird aufgerechnet?'
  soll:
    antwort: 'Massgebend sind die Verkehrswerte am Ende der Steuerperiode, mangels Nachweis die Buchwerte. Zulässiges Fremdkapital nach KS 6a: 100''000 × 100 % + 400''000 × 85 % + 300''000
      × 85 % + 200''000 × 50 % = 100''000 + 340''000 + 255''000 + 100''000 = 795''000. Ausgewiesenes FK 900''000 − 795''000 = 105''000 verdecktes Eigenkapital; es stammt vollständig
      aus dem Aktionärsdarlehen (nur von Anteilsinhabern/Nahestehenden stammendes FK gilt als verdeckt, der ungesicherte Bankkredit nicht). Zins Aktionärsdarlehen 400''000 × 3½ % = 14''000;
      davon entfallen 105''000 × 3½ % = 3''675 auf das verdeckte EK → Aufrechnung zum Reingewinn (Art. 65 DBG) und geldwerte Leistung mit Verrechnungssteuer; abzugsfähig bleiben 10''325.
      Eine spätere Rückzahlung des verdeckten EK ist keine geldwerte Leistung. Hinweis: Belehnungssätze im Chunk layoutbedingt als getrennte Spalte, Zuordnung gemäss raw/estv-ks-6a-2024.pdf
      S. 2.'
    kernpunkte:
    - 'Belehnung: Flüssige Mittel 100 %, Forderungen 85 %, Vorräte 85 %, mobile Sachanlagen 50 % → zulässiges FK 795''000'
    - Verdecktes EK 105'000, nur soweit vom Aktionär stammend
    - Aufrechnung 105'000 × 3½ % = 3'675 (abzugsfähig 10'325)
    - Aufgerechneter Zins unterliegt als geldwerte Leistung der VSt
    fehler:
    - Bankkredit ohne Aktionärssicherheit als verdecktes EK mitzählen
    - Verdecktes EK auf das ganze Aktionärsdarlehen (400'000) anwenden
    - Falsche Sätze (z.B. Vorräte 50 %, mobile Sachanlagen 70 %)
    - Ganzen Darlehenszins 14'000 aufrechnen
    quellen:
    - chunk: estv-ks-6a-2024__einleitung-t2
      zitat: Massgebend sind die Verkehrswerte am Ende der Steuerperiode.
    - chunk: estv-ks-6a-2024__einleitung-t2
      zitat: Sofern keine höheren Verkehrswerte nachgewiesen sind, geht die Veranlagungsbehörde von den Buchwerten, bzw. Gewinnsteuerwerten aus.
    - chunk: estv-ks-6a-2024__einleitung-t3
      zitat: Vom Verkehrswert sind in der Regel die folgenden Ansätze als Höchstbetrag der von der Gesellschaft aus eigener Kraft erhältlichen fremden Mittel zu betrachten
    - chunk: estv-ks-6a-2024__einleitung-t3
      zitat: Mobile Sachanlagen
    - chunk: estv-ks-6a-2024__einleitung-t3
      zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
    - chunk: estv-ks-6a-2024__einleitung-t3
      zitat: Wird das Fremdkapital von unabhängigen Dritten – ohne Sicherstellung durch den Anteilsinhaber oder diesem nahestehenden Personen – zur Verfügung gestellt, liegt kein verdecktes
        Eigenkapital vor.
    - chunk: estv-ks-6a-2024__3-1
      zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
    - chunk: estv-ks-6a-2024__3-2
      zitat: unterliegen als geldwerte Leistung
    - chunk: estv-ks-6a-2024__3-3
      zitat: unterliegt daher weder der Verrechnungssteuer noch der Einkommenssteuer (Privatvermögen)
- id: f27
  kategorie: Rechnungslegung / latente Steuern
  schwierigkeit: mittel
  frage: Eine AG hat steuerliche Verlustvorträge von 1,2 Mio. und steht kurz vor einem Kapitalverlust. Der VR möchte im OR-Einzelabschluss ein latentes Steuerguthaben von 240'000 aktivieren,
    weil das Budget wieder Gewinne zeigt. Dürfen wir das akzeptieren?
  soll:
    antwort: 'Nein. Im OR-Einzelabschluss können latente Steuerguthaben auf steuerlichen Verlustvorträgen nicht aktiviert werden: Es gibt keine Anschaffungs- oder Herstellungskosten,
      der Höchstwert für die Ersterfassung ist null (Art. 960a OR); die allgemeinen Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR) sind bei Verlustvorträgen regelmässig nicht erfüllt
      (deutlich überwiegende Wahrscheinlichkeit nötig, 50,1 % genügt nicht), und selbst wenn sie erfüllt wären, scheitert die Aktivierung an den Bewertungsvorschriften. Eine Umgehung
      der Kapitalschutzbestimmungen über ein solches Aktivum ist ausdrücklich unzulässig. Zulässig ist nur, Verlustvorträge bei der Abgrenzung der laufenden Steuern mit dem Gewinn der
      laufenden Periode zu verrechnen. Die Erfassung latenter Steuern auf temporären Differenzen ist im OR-Abschluss ein Wahlrecht (stetig, für alle Differenzen gleich). In der OR-Konzernrechnung
      wäre eine Aktivierung grundsätzlich möglich.'
    kernpunkte:
    - Keine Aktivierung im OR-Einzelabschluss (keine AK/HK → Höchstwert null)
    - Allgemeine Voraussetzungen meist nicht erfüllt; 50,1 % genügt nicht
    - Umgehung der Kapitalschutzbestimmungen unzulässig
    - Verlustvorträge nur bei der laufenden Steuerabgrenzung berücksichtigen; in der Konzernrechnung grundsätzlich möglich
    fehler:
    - Aktivierung zulässig, wenn Budget Gewinne zeigt
    - Aktivierung als transitorisches Aktivum
    - Gleichsetzung mit Swiss GAAP FER/IFRS im Einzelabschluss
    - Latente Steuern im OR-Abschluss als Pflicht statt Wahlrecht
    quellen:
    - chunk: ef-2020-10-latente-steuern__s003-1
      zitat: Weil für steuerliche Verlustvorträge weder AK noch HK bestehen, ist der Höchstwert für die Ersterfassung Null.
    - chunk: ef-2020-10-latente-steuern__s001-3
      zitat: Dabei ist in einem OR-Umfeld aufgrund des Vorsichtsprinzips von einer deutlich überwiegenden Wahrscheinlichkeit auszugehen, eine Wahrscheinlichkeit von 50,1 % genügt nicht
    - chunk: ef-2020-10-latente-steuern__s003-5
      zitat: Entsprechend können diese im OR-Einzelabschluss auch dann nicht aktiviert werden, wenn die allgemeinen Aktivierungsvoraussetzungen nach Art. 959 Abs. 2 OR erfüllt sind
    - chunk: ef-2020-10-latente-steuern__s003-6
      zitat: Nicht zulässig wäre es insbesondere, wenn Kapitalschutzmassnahmen gemäss Art. 725 Abs. 1 oder 2 OR via Aktivierung latenter Steuerguthaben auf steuerlichen Verlustvorträgen
        umgangen würden.
    - chunk: hwp-bur-2023__rz-0551-s270
      zitat: Das Erfassen von latenten Steuern auf solchen temporären Differenzen stellt im handelsrechtlichen Abschluss nach Obligationenrecht aus Vorsichtsüberlegungen de facto ein
        Wahlrecht dar, das stetig und für alle temporären Differenzen gleich anzuwenden ist.
    - chunk: hwp-bur-2023__rz-0551-s270
      zitat: Hingegen ist für die Ermittlung der Abgrenzung der laufenden Steuern eine Verrechnung von Verlustvorträgen mit dem Gewinn der laufenden Steuerperiode zulässig.
    - chunk: hwp-bur-2023__rz-0233-s485
      zitat: ist eine Aktivierung latenter Steuerguthaben auf steuerlichen Verlustvorträgen auf Stufe OR-Konzernrechnung grundsätzlich möglich
- id: f28
  kategorie: MWST / Prüfung
  schwierigkeit: mittel
  frage: Wir prüfen die Jahresrechnung 2025 einer MWST-pflichtigen AG. Welche allgemeinen Prüfungshandlungen zur MWST sind sinnvoll, und für welche Perioden muss ich MWST-Risiken bei
    der Wesentlichkeit berücksichtigen?
  soll:
    antwort: 'Vorab die Revisionsart klären. Eingeschränkte Revision: Massgebend sind die Beispiele in SER Anhang D n) (den Umständen anzupassen). Empfohlen sind die Abstimmung der MWST-Forderungen
      und -Verbindlichkeiten mit den Abrechnungen und die Prüfung, ob eine MWST-Umsatzabstimmung vorhanden ist. Bei erhöhtem Risiko geht man weiter: Nachvollzug der Umsatzabstimmung,
      Abstimmung der MWST-Abrechnungen mit den Konti bzw. der Umsatzabstimmung, Befragung zu Steuerrevisionen, Rückfragen der Behörden oder hängigen Einsprachen und Einsicht in die Korrespondenz
      (Rückstellungsbedarf). Eine eingeschränkte Revision umfasst keine Prüfungen zur Aufdeckung von MWST-Gesetzesverstössen. PH 20 (EXPERTsuisse 2016) richtet sich an die Abschlussprüfung
      mit hinreichender Sicherheit; seine Arbeitshilfe in Anhang 2 ist nicht verpflichtend, kann aber ergänzend dienen. Ihre allgemeinen Prüfungshandlungen (Teil B) sind: B1 Umsatzabstimmung
      für das Vorjahr gemäss Art. 128 Abs. 2 MWSTV; das Unternehmen muss sie innert 180 Tagen erstellen und Abweichungen begründen. B2 Analytische Prüfung der in- und ausländischen MWST-Deklarationen
      (Vorjahresvergleich, Umsatzaufteilung steuerbar/steuerbefreit/ausgenommen/Nichtentgelte/Steuersätze, Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen). B3 Korrekter und
      vollständiger Ausweis in der JR (Steuerforderungen/-verbindlichkeiten, Rückstellungen für MWST-Risiken, Offenlegung einer aktuellen oder früheren MWST-Gruppenzugehörigkeit im Anhang).
      Wesentlichkeit (PH 20 Tz. 28): Einzubeziehen sind die noch nicht rechtskräftig festgesetzten Steuerforderungen/-verbindlichkeiten der abgeschlossenen Steuerperioden, nicht nur
      des geprüften Jahres (Schweiz: Festsetzungsverjährung fünf Jahre; für ausländische MWST gelten ggf. andere Fristen). Ergänzend nennt PH 20 die Organisationsfragen (Teil A), eine
      MWST-Ergänzung der Vollständigkeitserklärung und bei komplexen Verhältnissen ein Gutachten eines Sachverständigen. Wegen der Selbstveranlagung endet die Finalisierungsfrist mit
      der ordentlichen Deklarationsfrist der Abrechnungsperiode, in die der 180. Tag nach dem Geschäftsabschluss fällt. Das Prüfungsurteil gibt keine Zusicherung der korrekten MWST-Handhabung.'
    kernpunkte:
    - 'Revisionsart klären: eingeschränkte Revision → SER Anhang D n) (Abstimmung MWST-Forderungen/-Verbindlichkeiten mit Abrechnungen, Vorhandensein der Umsatzabstimmung; weitergehend
      Nachvollzug der Umsatzabstimmung, Befragung zu Steuerrevisionen)'
    - 'PH 20 (Abschlussprüfung, Arbeitshilfe nicht verpflichtend): B1 Umsatzabstimmung Vorjahr (Art. 128 Abs. 2 MWSTV) innert 180 Tagen, Abweichungen begründet'
    - B2 analytische Prüfung der Deklarationen (Vorjahresvergleich, Umsatzaufteilung, Vorsteuerkorrektur); B3 Ausweis (Forderungen/Verbindlichkeiten, Rückstellungen MWST-Risiken, MWST-Gruppe
      im Anhang)
    - 'Wesentlichkeit: alle noch nicht rechtskräftig festgesetzten abgeschlossenen Perioden (CH Festsetzungsverjährung 5 Jahre gemäss PH 20)'
    - Keine Zusicherung der korrekten MWST-Handhabung; eingeschränkte Revision prüft nicht auf MWST-Gesetzesverstösse
    fehler:
    - Nur das geprüfte Geschäftsjahr für MWST-Risiken berücksichtigen
    - Prüfungsurteil als Zusicherung der korrekten MWST-Abrechnung verstehen
    - Festsetzungsverjährung 10 Jahre (Verwechslung mit Aufbewahrungsfrist)
    - Arbeitshilfe als verpflichtende Checkliste darstellen
    quellen:
    - chunk: ph-20-mwst-2016__c011-5
      zitat: Hat das Unternehmen für das der Prüfungsperiode vorangegangene Geschäftsjahr eine plausible und nachvollziehbare Umsatzabstimmung entsprechend den Anforderungen von Art.
        128 Abs. 2 MWSTV erstellt?
    - chunk: ph-20-mwst-2016__c011-5
      zitat: Die Umsatzabstimmung ist vom Unternehmen innert 180 Tagen zu erstellen, und allfällige Abweichungen sind zu begründen.
    - chunk: ph-20-mwst-2016__c011-5
      zitat: 'Mögliche analytische Prüfungshandlungen: / Vorjahresvergleich / Umsatzaufteilung (steuerbar / steuerbefreit / ausgenommen / Nichtentgelte / Steuersätze) / Vorsteuerkorrektur
        bei wesentlichen ausgenommenen Umsätzen'
    - chunk: ph-20-mwst-2016__c011-5
      zitat: Rückstellungen für MWST-Risiken / Offenlegung allfällige aktuelle oder frühere Zugehörigkeit / zu einer MWST-Gruppe im Anhang.
    - chunk: ph-20-mwst-2016__c006-2
      zitat: Bei der Beurteilung der Wesentlichkeit sind die noch nicht rechtskräftig festgesetzten Steuerforderungen und/oder -verbindlichkeiten der abgeschlossenen Steuerperioden heranzuziehen
        (z.B. in der Schweiz beträgt die Festsetzungsverjährung fünf Jahre, für ausländische MWST können abweichende Fristen gelten).
    - chunk: ph-20-mwst-2016__c011-1
      zitat: Die darin aufgeführten Prüfungshandlungen sind somit nicht verpflichtend.
