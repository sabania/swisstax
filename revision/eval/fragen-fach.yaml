- id: f23
  kategorie: Anhang / Angaben nach Art. 959c OR
  schwierigkeit: mittel
  frage: 'KMU-AG, Abschluss 31.12.2025, im Jahresdurchschnitt 8 Vollzeitstellen. Sachverhalte: Leasing für einen Lieferwagen, Restverpflichtung 36''000, nicht kündbar, läuft bis 30.06.2027;
    Liegenschaft (Buchwert 900''000) ist für die Hypothek verpfändet; Solidarbürgschaft 200''000 für den Bankkredit der 100%-Tochter XY GmbH mit Sitz in St. Gallen; Darlehen vom Aktionär
    150''000. Was muss in den Anhang?'
  soll:
    antwort: 'Pflichtangaben (soweit nicht schon aus Bilanz/ER ersichtlich): Firma, Rechtsform und Sitz der AG; Erklärung, dass die Vollzeitstellen im Jahresdurchschnitt nicht über 10
      liegen; Beteiligung XY GmbH mit Firma, Rechtsform, Sitz sowie Kapital- und Stimmenanteil (100 %); Restbetrag der Leasingverbindlichkeit 36''000 (läuft nicht innert 12 Monaten ab
      Bilanzstichtag aus und ist nicht kündbar); Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten 200''000 (Bürgschaft für die Tochter); Gesamtbetrag der zur Sicherung
      eigener Verbindlichkeiten verwendeten Aktiven 900''000 (verpfändete Liegenschaft); das Aktionärsdarlehen ist gesondert in der Bilanz oder im Anhang auszuweisen. Dazu Angaben über
      die angewandten Grundsätze, soweit nicht gesetzlich vorgeschrieben.'
    kernpunkte:
    - Firma/Rechtsform/Sitz und Erklärung Vollzeitstellen «nicht über 10»
    - 'Beteiligung: Firma, Rechtsform, Sitz, Kapital- und Stimmenanteil'
    - Leasing-Restbetrag 36'000, da nicht innert 12 Monaten auslaufend/kündbar
    - Sicherheiten für Dritte 200'000 und verpfändete Aktiven 900'000 je als Gesamtbetrag
    - Aktionärsdarlehen gesondert in Bilanz oder Anhang
    fehler:
    - Bürgschaft als Rückstellung statt Anhangangabe
    - Leasing nicht angeben, weil es kein Finanzierungsleasing sei
    - Statt Buchwert der verpfändeten Aktiven nur die Hypothekarschuld nennen
    - Genaue Anzahl Vollzeitstellen statt Schwellenerklärung verlangen
    quellen:
    - chunk: or__art-959c-t1
      zitat: Firma oder Name sowie Rechtsform und Sitz des Unternehmens
    - chunk: or__art-959c-t1
      zitat: eine Erklärung darüber, ob die Anzahl Vollzeitstellen im Jahresdurchschnitt nicht über 10, über 50 beziehungsweise über 250 liegt
    - chunk: or__art-959c-t1
      zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
    - chunk: or__art-959c-t2
      zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen, sofern diese nicht innert zwölf Monaten ab Bilanzstichtag
        auslaufen oder gekündigt werden können
    - chunk: or__art-959c-t2
      zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
    - chunk: or__art-959c-t2
      zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
    - chunk: or__art-959a-t2
      zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht,
