# Unabhängig erstellte Testfragen (Workflow revision-evalfragen: erstellt aus Primärquellen, skeptisch nachgeprüft). Nicht ins Wiki übernehmen.
fragen:
- id: f01
  kategorie: Revisionspflicht (OR 727)
  schwierigkeit: mittel
  frage: Eine nicht kotierte AG ohne Pflicht zur Konzernrechnung hatte im GJ 2024 eine Bilanzsumme von CHF 21 Mio., einen Umsatz von CHF 43 Mio. und 120 Vollzeitstellen, im GJ 2025 eine
    Bilanzsumme von CHF 22 Mio., einen Umsatz von CHF 38 Mio. und 260 Vollzeitstellen. Reicht für die Jahresrechnung 2025 noch eine eingeschränkte Revision?
  soll:
    antwort: 'Nein. Ordentlich prüfen lassen muss eine Gesellschaft, die in zwei aufeinander folgenden Geschäftsjahren zwei der drei Grössen überschreitet: Bilanzsumme CHF 20 Mio., Umsatzerlös
      CHF 40 Mio., 250 Vollzeitstellen im Jahresdurchschnitt (Art. 727 Abs. 1 Ziff. 2 OR). Im Jahr 2024 sind Bilanzsumme und Umsatz überschritten, im Jahr 2025 Bilanzsumme und Vollzeitstellen.
      Es müssen nicht in beiden Jahren dieselben zwei Grössen sein (HWP ER Rz 309). Damit ist die Jahresrechnung 2025, also die des zweiten Jahres, ordentlich zu revidieren (HWP ER Rz
      310). Der Abschlussprüfer prüft das vor der Mandatsannahme bzw. vor Prüfungsbeginn und lehnt eine eingeschränkte Revision ab (SER 1.4.1). Unabhängig von den Schwellenwerten müsste
      ordentlich geprüft werden, wenn Aktionäre mit zusammen mindestens 10 % des Aktienkapitals dies verlangen (Art. 727 Abs. 2 OR).'
    kernpunkte:
    - 'Schwellenwerte CHF 20 Mio. Bilanzsumme, CHF 40 Mio. Umsatz, 250 Vollzeitstellen: zwei von drei in zwei aufeinander folgenden Geschäftsjahren'
    - 2024 und 2025 sind je zwei Grössen überschritten; eine unterschiedliche Kombination genügt
    - 'Ergebnis: ordentliche Revision der Jahresrechnung 2025, eine eingeschränkte Revision ist nicht zulässig'
    fehler:
    - Eingeschränkte Revision genügt, weil nicht in beiden Jahren dieselben zwei Grössen überschritten sind
    - Ordentliche Revision erst ab GJ 2026 (ein weiteres Jahr Aufschub)
    - Weil der Umsatz 2025 unter CHF 40 Mio. liegt, bleibt es bei der eingeschränkten Revision
    quellen:
    - chunk: or__art-727
      zitat: Gesellschaften, die zwei der nachstehenden Grössen in zwei aufeinander folgenden Geschäftsjahren überschreiten
    - chunk: or__art-727
      zitat: Bilanzsumme von 20 Millionen Franken
    - chunk: or__art-727
      zitat: Umsatzerlös von 40 Millionen Franken
    - chunk: or__art-727
      zitat: 250 Vollzeitstellen im Jahresdurchschnitt
    - chunk: hwp-er-2026__rz-0309-s098
      zitat: ist es nicht erforderlich, dass im Berichts- und im Vorjahr die gleichen beiden Referenzgrössen die massgeblichen Schwellenwerte überschreiten
    - chunk: hwp-er-2026__rz-0310-s098
      zitat: Erst wenn die Schwellenwerte im darauf folgenden Geschäftsjahr erneut überschritten werden, muss die Jahresrechnung dieses zweiten Geschäftsjahrs ordentlich revidiert werden.
    - chunk: ser-2022__1-4-1
      zitat: Der Abschlussprüfer vergewissert sich bei Mandatsannahme bzw. vor Prüfungsbeginn, dass die zu prüfende Gesellschaft nicht die Voraussetzungen für eine ordentliche Revision
        erfüllt.
    - chunk: or__art-727
      zitat: Eine ordentliche Revision muss auch dann vorgenommen werden, wenn Aktionäre, die zusammen mindestens 10 Prozent des Aktienkapitals vertreten, dies verlangen.
- id: f02
  kategorie: Opting-out (OR 727a)
  schwierigkeit: leicht
  frage: Eine KMU-AG mit 8 Vollzeitstellen will ab dem Geschäftsjahr 2027 (Kalenderjahr) auf die eingeschränkte Revision verzichten. Welche Voraussetzungen und Formalitäten gelten, und
    kann ein Aktionär später trotzdem eine Revision verlangen?
  soll:
    antwort: 'Für das Opting-out (Art. 727a Abs. 2–5 OR) gilt:

      (1) Die Gesellschaft hat nicht mehr als 10 Vollzeitstellen im Jahresdurchschnitt. Massgebend sind die Verhältnisse im betreffenden Geschäftsjahr, nicht der Durchschnitt aus zwei
      Jahren (HWP ER Rz 313).

      (2) Sämtliche Aktionäre stimmen zu. Der VR kann sie schriftlich um Zustimmung ersuchen, eine Frist von mindestens 20 Tagen ansetzen und festhalten, dass Schweigen als Zustimmung
      gilt (Abs. 3).

      (3) Der Verzicht gilt nur für künftige Geschäftsjahre. Er muss vor Beginn des Geschäftsjahres, hier also vor dem 1.1.2027, beim Handelsregisteramt angemeldet werden. Der Anmeldung
      ist die Jahresrechnung des zuletzt abgelaufenen Geschäftsjahres beizulegen (Abs. 2 und 2bis).

      (4) Soweit erforderlich passt der VR die Statuten an und meldet dem Handelsregister die Löschung der Revisionsstelle an (Abs. 5). Der bisherigen Revisionsstelle wird empfohlen,
      sich umgehend selbst löschen zu lassen (HWP ER Rz 63).


      Der Verzicht gilt auch für die Folgejahre. Jeder Aktionär kann aber spätestens 10 Tage vor der GV eine eingeschränkte Revision verlangen (Opting-in). Die GV muss dann eine Revisionsstelle
      wählen; vor dem Revisionsbericht darf die Jahresrechnung nicht genehmigt werden (Abs. 4; HWP ER Rz 69). Bei einem Kapitalverlust (oder einer Überschuldung) muss die letzte Jahresrechnung
      trotz Opting-out von einem zugelassenen Revisor eingeschränkt geprüft werden (Art. 725a Abs. 2 OR; HWP ER Rz 38).'
    kernpunkte:
    - höchstens 10 Vollzeitstellen im Jahresdurchschnitt und Zustimmung sämtlicher Aktionäre (Frist mindestens 20 Tage, Schweigen kann als Zustimmung gelten)
    - nur für künftige Geschäftsjahre; Anmeldung beim Handelsregister vor Beginn des Geschäftsjahres mit der letzten Jahresrechnung als Beilage
    - 'Opting-in: jeder Aktionär spätestens 10 Tage vor der GV; die GV muss dann eine Revisionsstelle wählen'
    fehler:
    - Ein Mehrheitsbeschluss der GV genügt
    - Verzicht rückwirkend für das laufende Geschäftsjahr möglich
    - Grenze von 50 oder 250 Vollzeitstellen statt 10
    - Massgebend ist der Durchschnitt der Vollzeitstellen über zwei Jahre
    quellen:
    - chunk: or__art-727a
      zitat: Mit der Zustimmung sämtlicher Aktionäre kann auf die eingeschränkte Revision verzichtet werden, wenn die Gesellschaft nicht mehr als zehn Vollzeitstellen im Jahresdurchschnitt
        hat.
    - chunk: or__art-727a
      zitat: Der Verzicht gilt nur für künftige Geschäftsjahre und muss vor Beginn des Geschäftsjahres beim Handelsregisteramt angemeldet werden.
    - chunk: or__art-727a
      zitat: Der Anmeldung des Verzichts im Handelsregister muss die Jahresrechnung des zuletzt abgelaufenen Geschäftsjahres beigelegt werden.
    - chunk: or__art-727a
      zitat: Er kann für die Beantwortung eine Frist von mindestens 20 Tagen ansetzen und darauf hinweisen, dass das Ausbleiben einer Antwort als Zustimmung gilt.
    - chunk: or__art-727a
      zitat: Jeder Aktionär hat jedoch das Recht, spätestens zehn Tage vor der Generalversammlung eine eingeschränkte Revision zu verlangen.
    - chunk: hwp-er-2026__rz-0313-s098
      zitat: Hingegen sind für die Bestimmung der zehn Vollzeitstellen, die für das Opting-out nicht überschritten werden dürfen, die Tatsachen im betreffenden Geschäftsjahr massgebend,
        nicht der Durchschnitt in zwei aufeinander folgenden Geschäftsjahren.
    - chunk: hwp-er-2026__rz-0069-s052
      zitat: Die Jahresrechnung darf vor Erstattung eines Revisionsberichts nicht genehmigt werden.
    - chunk: hwp-er-2026__rz-0038-s033
      zitat: eine Gesellschaft im Opting-out bei Vorliegen eines Kapitalverlusts (wie auch einer Überschuldung) ihre letzte Jahresrechnung durch einen zugelassenen Revisor im Rahmen
        einer eingeschränkten Revision prüfen lassen muss (Art. 725a Abs. 2 OR).
  pruefung: 'korrigiert: Alle Zitate sind bestätigt und fachlich richtig (Art. 727a Abs. 2, 2bis, 3, 4 OR; HWP ER Rz 313, 69, 38). Die Frage fragt aber ausdrücklich nach den «Formalitäten».
    Die Antwort beruft sich auf «Art. 727a Abs. 2–5 OR», lässt Abs. 5 aber inhaltlich weg: Der VR passt soweit nötig die Statuten an und me'
- id: f03
  kategorie: Unabhängigkeit / Mitwirkung (OR 729)
  schwierigkeit: mittel
  frage: Unser Treuhandteam führt für eine KMU-AG die Buchhaltung. Dürfen wir bei derselben Gesellschaft auch die eingeschränkte Revision machen, und was müssen wir dabei beachten?
  soll:
    antwort: 'Ja. Bei der eingeschränkten Revision ist das Mitwirken bei der Buchführung zulässig (Art. 729 Abs. 2 OR). Weil ein Selbstprüfungsrisiko besteht, braucht es geeignete organisatorische
      und personelle Massnahmen. Diese sind erfüllt, wenn nicht dieselbe Person oder Personengruppe beim gleichen Kunden bucht und prüft (SER 1.3.1, Anhang B).


      Kumulativ muss gelten:

      - Die Verantwortung für die Jahresrechnung bleibt beim Kunden.

      - Die Revisionsstelle übernimmt keine Aufgaben, die nach Managementverantwortung aussehen.

      - Die Risiken sind dem Kunden kommuniziert.

      - Die verlässliche Prüfung ist personell und organisatorisch sichergestellt.


      Die Mitwirkung ist im Revisionsbericht offenzulegen (Art. 729b Abs. 1 Ziff. 3 OR), z.B.: «Ein Mitarbeitender unserer Gesellschaft hat im Berichtsjahr bei der Buchführung mitgewirkt.
      An der eingeschränkten Revision war er nicht beteiligt.» Empfohlen ist eine separate schriftliche Auftragsbestätigung für die Buchführungsarbeiten (SER 1.7).'
    kernpunkte:
    - zulässig nach Art. 729 Abs. 2 OR
    - 'personelle Trennung: nicht dieselbe Person oder Personengruppe bucht und prüft'
    - Verantwortung für die Jahresrechnung bleibt beim Kunden, keine Managementfunktion, Risiken kommuniziert
    - Offenlegung der Mitwirkung im Revisionsbericht (Art. 729b Abs. 1 Ziff. 3 OR)
    fehler:
    - Unzulässig, das Mandat muss abgelehnt werden (Verwechslung mit ordentlicher Revision)
    - Zulässig, aber ohne Offenlegung im Revisionsbericht
    - Dieselbe Person darf prüfen, wenn sie nur einen Teil der Buchhaltung geführt hat
    quellen:
    - chunk: or__art-729
      zitat: Das Mitwirken bei der Buchführung und das Erbringen anderer Dienstleistungen für die zu prüfende Gesellschaft sind zulässig.
    - chunk: or__art-729
      zitat: Sofern das Risiko der Überprüfung eigener Arbeiten entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.
    - chunk: ser-2022__1-3-1
      zitat: Die Person oder Personengruppe, die bei der Buchführung oder anderen Dienstleistungen, bei denen die Gefahr der Selbstprüfung besteht, mitwirkt, darf nicht an der Revision
        beteiligt sein.
    - chunk: ser-2022__anh-b-s050-2
      zitat: Die gemäss Gesetz verlangten geeigneten organisatorischen und personellen Massnahmen sind erfüllt, wenn nicht dieselbe Person oder Personengruppe Arbeiten in der Buchführung
        und in der eingeschränkten Revision des gleichen Kunden durchführt.
    - chunk: ser-2022__anh-b-s050-1
      zitat: Die Verantwortung für die Jahresrechnung bleibt in jedem Fall beim Prüfungskunden.
    - chunk: ser-2022__anh-b-s050-2
      zitat: Die Revisionsstelle übernimmt keine Aufgaben, die den Anschein erwecken könnten, sie übernehme die Verantwortung des Managements beim Prüfungskunden.
    - chunk: ser-2022__anh-b-s050-2
      zitat: Die damit verbundenen Risiken sind dem Prüfungskunden kommuniziert worden.
    - chunk: ser-2022__anh-b-s050-1
      zitat: Das Mitwirken bei der Buchführung ist gemäss Art. 729b Abs. 1 Ziff. 3 OR im Revisionsbericht offenzulegen.
    - chunk: ser-2022__8-4
      zitat: Ein Mitarbeitender unserer Gesellschaft hat im Berichtsjahr bei der Buchführung mitgewirkt. An der eingeschränkten Revision war er nicht beteiligt.
    - chunk: ser-2022__1-7
      zitat: ist es zur Vermeidung von Missverständnissen sowie zur Abgrenzung der Verantwortlichkeiten empfehlenswert, die Art und den Umfang dieser Unterstützungsleistungen in einer
        separaten schriftlichen Auftragsbestätigung (vgl. Beispiel 2, Anhang C) festzuhalten.
- id: f04
  kategorie: Umfang / Prüfungshandlungen (OR 729a)
  schwierigkeit: leicht
  frage: Muss ich bei einer eingeschränkten Revision Saldobestätigungen bei Debitoren einholen, an der Inventur teilnehmen oder das interne Kontrollsystem testen? Welche Prüfungshandlungen
    sind überhaupt vorgesehen?
  soll:
    antwort: 'Nein. Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen (Art. 729a Abs. 2 OR). Grundsätzlich werden nur beim Unternehmen
      intern verfügbare Informationen verwendet.


      Nicht durchgeführt werden (SER 1.5):

      - Prüfung des IKS und der IT-Systeme

      - Inventurbeobachtung und Drittbestätigungsanfragen

      - Prüfungen zur Aufdeckung deliktischer Handlungen und weiterer Gesetzesverstösse (ausser zu Rechnungslegung und Gewinnverwendung)


      Die Detailprüfungen betreffen namentlich Bestand und Bewertung. Auf repräsentative Stichproben ist zu verzichten (SER 6.1.3). Bei wesentlichen Posten darf man sich nicht ausschliesslich
      auf Befragungen stützen; diese sind mit analytischen Prüfungshandlungen und/oder Detailprüfungen zu ergänzen (SER 6.1.1). Die Geschäftsführung des VR ist nicht Prüfungsgegenstand
      (Art. 729a Abs. 3 OR).'
    kernpunkte:
    - nur Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen (Art. 729a Abs. 2 OR)
    - keine IKS- oder IT-Prüfung, keine Inventurbeobachtung, keine Drittbestätigungen
    - Detailprüfungen vor allem zu Bestand und Bewertung, keine repräsentativen Stichproben
    - wesentliche Posten nicht ausschliesslich mit Befragungen prüfen
    fehler:
    - Saldobestätigungen und Inventurteilnahme sind wie bei der ordentlichen Revision Pflicht
    - Die Existenz des IKS muss bestätigt werden (gilt nur für die ordentliche Revision)
    - Es sind repräsentative Stichproben zu ziehen
    - Befragungen allein genügen auch für wesentliche Bilanzposten
    quellen:
    - chunk: or__art-729a
      zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
    - chunk: ser-2022__1-5
      zitat: keine Prüfung des internen Kontrollsystems und der verwendeten IT-Systeme durchgeführt
    - chunk: ser-2022__1-5
      zitat: keine Inventurbeobachtung und Drittbestätigungsanfragen durchgeführt
    - chunk: ser-2022__1-5
      zitat: die Prüfung beschränkt sich grundsätzlich auf beim geprüften Unternehmen intern verfügbare Informationen
    - chunk: ser-2022__1-5
      zitat: keine Prüfungen zur Aufdeckung von deliktischen Handlungen und keine Prüfungen zur Aufdeckung von weiteren Gesetzesverstössen (mit Ausnahme der Bestimmungen zur Rechnungslegung
        und zur Gewinnverwendung) durchgeführt.
    - chunk: ser-2022__6-1-3
      zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
    - chunk: ser-2022__6-1-1-t1
      zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
    - chunk: or__art-729a
      zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
    - chunk: muster-hwp-er-2026__c017-1
      zitat: Dagegen sind Prüfungen der betrieblichen Abläufe und des internen Kontrollsystems sowie Befragungen und weitere Prüfungshandlungen zur Aufdeckung deliktischer Handlungen
        oder anderer Gesetzesverstösse nicht Bestandteil dieser Revision.
- id: f05
  kategorie: Bericht (OR 729b)
  schwierigkeit: mittel
  frage: Was muss der Bericht der Revisionsstelle zur eingeschränkten Revision zwingend enthalten, wer unterschreibt ihn und welches Datum trägt er?
  soll:
    antwort: 'Inhalt nach Art. 729b OR und SER 8.1:

      (1) Hinweis auf die eingeschränkte Natur der Revision: keine ordentliche Revision und kein Prüfungsurteil im Sinne einer ordentlichen Revision.

      (2) Stellungnahme zum Prüfungsergebnis als negative Zusicherung zur Jahresrechnung und zum Antrag über die Verwendung des Bilanzgewinns.

      (3) Angaben zur Unabhängigkeit und gegebenenfalls zur Mitwirkung bei der Buchführung oder zu anderen Dienstleistungen mit Selbstprüfungsrisiko.

      (4) Angaben zur Person, welche die Revision geleitet hat, und zu ihrer Zulassung (Name, Vorname, Art der Zulassung).

      (5) Unterschrift dieser leitenden Person.

      (6) Berichtsdatum.


      Das Datum ist der Tag, an dem die Revision beendet wurde, frühestens aber der Tag, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen hat (SER
      8.6). Liegt zwischen Beendigung und Berichtsabgabe ein zeitlicher Abstand, trägt der Bericht das Datum der Abgabe; eine Rückdatierung ist nicht zulässig (HWP ER Rz 322). Der Bericht
      enthält keine Empfehlung, die Jahresrechnung zu genehmigen oder zurückzuweisen (SER 1.2).'
    kernpunkte:
    - Hinweis auf die eingeschränkte Natur und Stellungnahme als negative Zusicherung, inkl. Antrag zur Gewinnverwendung
    - Angaben zur Unabhängigkeit (ggf. Mitwirkung bei der Buchführung) und zur leitenden Person mit Zulassung
    - Unterschrift der Person, welche die Revision geleitet hat
    - Datum = Beendigung der Revision, frühestens Unterzeichnung bzw. Genehmigung der Jahresrechnung durch die Unternehmensleitung; keine Rückdatierung
    fehler:
    - Empfehlung an die GV, die Jahresrechnung zu genehmigen (gilt nur für die ordentliche Revision)
    - Positive Zusicherung bzw. Prüfungsurteil wie bei der ordentlichen Revision
    - Datum des Bilanzstichtags oder der GV
    - Zusätzlich ein umfassender Bericht an den VR erforderlich
    quellen:
    - chunk: or__art-729b
      zitat: einen Hinweis auf die eingeschränkte Natur der Revision;
    - chunk: or__art-729b
      zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung und zu anderen Dienstleistungen, die für die zu prüfende Gesellschaft erbracht wurden;
    - chunk: or__art-729b
      zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
    - chunk: ser-2022__8-1
      zitat: Angaben zur Person, welche die Revision geleitet hat, und zu ihrer Zulassung
    - chunk: ser-2022__8-2
      zitat: dass keine ordentliche Revision stattgefunden hat
    - chunk: ser-2022__8-3-1-t1
      zitat: Bei der eingeschränkten Revision macht der Abschlussprüfer diese Prüfungsaussage in Form einer negativen Zusicherung.
    - chunk: ser-2022__8-5
      zitat: Art der Zulassung des leitenden Revisors;
    - chunk: ser-2022__8-6
      zitat: Der Revisionsbericht trägt das Datum, an dem die eingeschränkte Revision beendet wurde.
    - chunk: ser-2022__8-6
      zitat: darf der Abschlussprüfer den Revisionsbericht frühestens auf den Zeitpunkt datieren, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen
        hat.
    - chunk: hwp-er-2026__rz-0322-s256
      zitat: Besteht zwischen Beendigung der eingeschränkten Revision und Berichtsabgabe ein gewisser zeitlicher Abstand, trägt der Bericht das Datum der Berichtsabgabe (keine Rückdatierung).
    - chunk: ser-2022__1-2-t1
      zitat: auch keine Empfehlung, ob die Jahresrechnung mit oder ohne Einschränkung zu genehmigen oder zurückzuweisen sei.
- id: f06
  kategorie: Bericht – Modifikationen der Prüfungsaussage
  schwierigkeit: schwer
  frage: Der Kunde weigert sich, eine wesentliche Wertberichtigung auf einer gefährdeten Debitorenforderung zu buchen. Das Gesamtbild der Jahresrechnung wird dadurch aber nicht grundlegend
    verändert. Welche Prüfungsaussage gebe ich ab? Was gälte, wenn das Gesamtbild grundlegend verändert würde, und wann gibt man gar keine Prüfungsaussage ab?
  soll:
    antwort: 'Es handelt sich um einen festgestellten Sachverhalt, den der Kunde nicht korrigiert (Meinungsverschiedenheit). Der Sachverhalt ist im Bericht darzulegen, die Auswirkung
      ist, sofern praktikabel, zu quantifizieren, und es ist eine eingeschränkte Prüfungsaussage abzugeben: «… mit Ausnahme der im vorstehenden Absatz dargelegten Einschränkung …» (SER
      8.3.1 (b)(i), Anhang F Beispiel 2).


      Verändert der festgestellte Sachverhalt das Gesamtbild grundlegend, ist eine verneinende Prüfungsaussage abzugeben: Die Jahresrechnung entspricht nicht Gesetz und Statuten (SER
      8.3.1 (b)(ii)).


      Gar keine Prüfungsaussage (Unmöglichkeit) kommt nur bei einem angenommenen Sachverhalt oder bei einer Beschränkung des Prüfungsumfangs in Frage, und zwar nur, wenn deren mögliche
      Auswirkung das Gesamtbild grundlegend verändert (SER 8.3.1 (b)(iii) und (c)(ii)). Ist die mögliche Auswirkung nicht grundlegend, ist auch dort die Prüfungsaussage einzuschränken.'
    kernpunkte:
    - 'festgestellter Sachverhalt, Gesamtbild nicht grundlegend verändert: eingeschränkte Prüfungsaussage, Sachverhalt darlegen und wenn möglich quantifizieren'
    - 'festgestellter Sachverhalt, Gesamtbild grundlegend verändert: verneinende Prüfungsaussage'
    - keine Prüfungsaussage nur bei angenommenem Sachverhalt oder Beschränkung des Prüfungsumfangs mit grundlegender möglicher Auswirkung
    fehler:
    - Eine verweigerte Korrektur führt immer zu einer verneinenden Prüfungsaussage
    - Bei einem festgestellten Sachverhalt wird keine Prüfungsaussage abgegeben
    - Es genügt ein Zusatz oder Hinweis ohne Modifikation
    - Empfehlung an die GV, die Jahresrechnung zurückzuweisen
    quellen:
    - chunk: ser-2022__5-3
      zitat: Wird diese Korrektur verweigert, so muss der Abschlussprüfer beurteilen, ob die Jahresrechnung dadurch eine wesentliche Fehlaussage vermittelt. Ist dies der Fall, wird der
        Abschlussprüfer seine Prüfungsaussage modifizieren.
    - chunk: ser-2022__8-3-1-t2
      zitat: so sind diese Sachverhalte im Revisionsbericht darzulegen, sofern der Prüfungskunde die Fehlaussagen nicht korrigiert. Dabei ist – sofern praktikabel – die (mögliche) Auswirkung
        auf die Jahresrechnung und/oder den Antrag über die Verwendung des Bilanzgewinns zu quantifizieren
    - chunk: ser-2022__8-3-1-t3
      zitat: Die Jahresrechnung als Ganzes sowie der Antrag über die Verwendung des Bilanzgewinns können trotz einer eingeschränkten Prüfungsaussage dem schweizerischen Gesetz und den
        Statuten entsprechen
    - chunk: ser-2022__8-3-1-t3
      zitat: Die verneinende Prüfungsaussage ist angebracht, wenn der festgestellte Sachverhalt das von der Jahresrechnung vermittelte Gesamtbild so grundlegend verändert, dass der Abschlussprüfer
        zum Schluss kommt, mit einer eingeschränkten Prüfungsaussage werde die irreführende oder unvollständige Natur der Jahresrechnung nicht angemessen offengelegt
    - chunk: ser-2022__8-3-1-t3
      zitat: gar keine Prüfungsaussage zu machen, falls die mögliche Auswirkung des angenommenen Sachverhalts das von der Jahresrechnung vermittelte Gesamtbild grundlegend verändert
    - chunk: ser-2022__8-3-1-t4
      zitat: Wenn eine wesentliche Beschränkung des Prüfungsumfangs der eingeschränkten Revision vorliegt, ist diese zu umschreiben
    - chunk: ser-2022__anh-f-s115-2
      zitat: Bei unserer Revision sind wir – mit Ausnahme der im vorstehenden Absatz dargelegten Einschränkung – nicht auf Sachverhalte gestossen
    - chunk: ser-2022__anh-f-s115-1
      zitat: Unmöglichkeit einer Prüfungsaussage
- id: f07
  kategorie: Anzeigepflicht (OR 729c)
  schwierigkeit: mittel
  frage: Bei der eingeschränkten Revision stellen wir fest, dass die Gesellschaft offensichtlich überschuldet ist. Es gibt keinen Rangrücktritt, und der Verwaltungsrat unternimmt nichts.
    Was muss die Revisionsstelle tun, und hat sie bei der eingeschränkten Revision noch weitere Anzeigepflichten?
  soll:
    antwort: 'Die Revisionsstelle geht schrittweise vor:

      1. Sie erinnert den VR an seine Pflichten, namentlich Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten zu erstellen und prüfen zu lassen (SER 9).

      2. Bleibt der VR untätig, mahnt sie ihn unter Ansetzung einer Frist und weist auf ihre eigene, subsidiäre Anzeigepflicht hin (HWP ER Rz 433).

      3. Unterlässt der VR die Anzeige trotz offensichtlicher Überschuldung, benachrichtigt die Revisionsstelle das Gericht (Art. 729c OR).


      Im Revisionsbericht ist ein Hinweis auf die Untätigkeit des VR bei Überschuldung in jedem Fall anzubringen (SER 8.3.2.1). Durch Niederlegung des Mandats kann sich die Revisionsstelle
      dieser Pflicht nicht entziehen (HWP ER Rz 445).


      Das ist die einzige direkte gesetzliche Anzeigepflicht bei der eingeschränkten Revision. Weitere Anzeigepflichten bei Verstössen gegen Gesetz, Statuten oder Organisationsreglement
      bestehen nicht (HWP ER Rz 351, 422).'
    kernpunkte:
    - VR an seine Pflichten erinnern (Zwischenabschlüsse) und unter Fristansetzung mit Hinweis auf die subsidiäre Anzeigepflicht mahnen
    - Gericht benachrichtigen, wenn die Gesellschaft offensichtlich überschuldet ist und der VR die Anzeige unterlässt (Art. 729c OR)
    - Mandatsniederlegung befreit nicht von der Anzeigepflicht
    - keine weiteren Anzeigepflichten bei der eingeschränkten Revision (Gesetz, Statuten, Organisationsreglement)
    fehler:
    - Mandat niederlegen statt Anzeige ans Gericht
    - Anzeigepflicht gegenüber VR und GV bei Gesetzes- oder Statutenverstössen wie bei der ordentlichen Revision (Art. 728c OR)
    - Schon bei einem hälftigen Kapitalverlust muss die Revisionsstelle das Gericht benachrichtigen
    - Die Revisionsstelle benachrichtigt das Gericht sofort, ohne den VR zuerst zu mahnen
    quellen:
    - chunk: or__art-729c
      zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
    - chunk: ser-2022__9-t3
      zitat: muss sie den Verwaltungsrat an seine Pflichten – namentlich die Erstellung und Vorlage zur Prüfung eines Zwischenabschlusses zu Fortführungs- und Veräusserungswerten – erinnern.
    - chunk: ser-2022__9-t3
      zitat: Die diesbezügliche Anzeigepflicht beschränkt sich auf die Benachrichtigung des Richters, wenn dies der Verwaltungsrat trotz offensichtlicher Überschuldung unterlässt.
    - chunk: hwp-er-2026__rz-0433-s127
      zitat: hat ihn die Revisionsstelle unter Ansetzung einer Frist und mit Hinweis auf ihre eigene, subsidiäre Anzeigepﬂicht an seine Aufgabe zu mahnen.
    - chunk: ser-2022__8-3-2-t1
      zitat: Bleibt der Verwaltungsrat untätig, beachtet die Revisionsstelle zusätzlich bei Vorliegen einer Überschuldung (Art. 725b OR) die Anzeigepflicht gemäss Art. 729c OR.
    - chunk: hwp-er-2026__rz-0445-s130
      zitat: Weder kann die Revisionsstelle, die den Gang zum Gericht scheut, der Anzeigepﬂicht durch Mandatsniederlegung entgehen
    - chunk: hwp-er-2026__rz-0351-s262
      zitat: Eine weitergehende Pflicht, Verstösse gegen Gesetz und Statuten anzuzeigen, sieht das Gesetz bei der eingeschränkten Revision nicht vor.
    - chunk: hwp-er-2026__rz-0422-s279-t1
      zitat: Weitere Anzeigepflichten, wie z.B. bei Verstössen gegen das Gesetz, die Statuten oder das Organisationsreglement, bestehen bei der eingeschränkten Revision nicht.
- id: f08
  kategorie: Wesentlichkeit – Bezugsgrössen
  schwierigkeit: mittel
  frage: Ich plane die eingeschränkte Revision einer gewinnorientierten Handels-GmbH, die dieses Jahr einen Verlust schreibt; das Eigenkapital beträgt CHF 1,2 Mio. Welche Bezugsgrösse
    und welchen Prozentsatz nehme ich für die Gesamtwesentlichkeit? Und welcher Richtwert gilt bei einem stabil profitablen Unternehmen?
  soll:
    antwort: 'Bei einem gewinnorientierten Unternehmen in einer Verlustsituation ist die Bezugsgrösse das Eigenkapital, mit einem Richtwert von 3 % bis 5 %. Das ergibt hier CHF 36''000
      bis CHF 60''000 (HWP ER Rz 42, Abb. 20).


      Bei einem stabil profitablen Unternehmen gelten 3 % bis 10 % des bereinigten Jahresgewinns vor Steuern, also nach Berücksichtigung stiller Reserven; Durchschnittswerte sind möglich.
      Ist das Ergebnis gesteuert, geht man vom effektiven Ergebnis aus (SER 5.2).


      Weitere Richtwerte:

      - anlageintensive Unternehmen bzw. Holdings: 1 % bis 3 % der Bilanzsumme

      - volatile Ergebnisse: 1 % bis 3 % der Nettoerlöse

      - nicht gewinnorientierte Unternehmen: 1 % bis 3 % der Gesamtaufwendungen

      - Start-ups: 2 % bis 5 % der operativen Aufwendungen


      Es sind Richtwerte zur Unterstützung des professionellen Ermessens (Rz 43). Bei drohender Illiquidität oder Überschuldung kann eine tiefere Wesentlichkeit angezeigt sein (SER 5.2).'
    kernpunkte:
    - 'Verlustsituation: Eigenkapital, 3 % bis 5 %, hier CHF 36''000 bis 60''000'
    - 'stabil profitabel: 3 % bis 10 % des bereinigten Jahresgewinns vor Steuern (stille Reserven berücksichtigen)'
    - Richtwerte für das Ermessen; tiefere Wesentlichkeit bei drohender Illiquidität oder Überschuldung
    fehler:
    - Auch bei Verlust einen Prozentsatz des (negativen) Ergebnisses verwenden
    - Standardmässig 1 % bis 3 % der Bilanzsumme für jedes KMU
    - Ausgewiesenes Ergebnis ohne Bereinigung um stille Reserven
    - Die Prozentsätze als verbindliche Vorgaben statt Richtwerte darstellen
    quellen:
    - chunk: hwp-er-2026__rz-0042-s185-t1
      zitat: Bestimmung der Gesamtwesentlichkeit aufgrund eines angemessenen Prozentsatzes des Eigenkapitals
    - chunk: hwp-er-2026__rz-0042-s185-t1
      zitat: 3 % – 5 % des Eigenkapitals
    - chunk: hwp-er-2026__rz-0042-s185-t1
      zitat: 3 % – 10 % des bereinigten Jahresgewinns vor Steuern
    - chunk: hwp-er-2026__rz-0042-s185-t1
      zitat: 1 % – 3 % der Bilanzsumme
    - chunk: hwp-er-2026__rz-0042-s185-t1
      zitat: 1 % – 3 % der Nettoerlöse aus Lieferungen und Leistungen (Umsätze)
    - chunk: hwp-er-2026__rz-0042-s185-t2
      zitat: 2 % – 5 % der operativen Aufwendungen
    - chunk: hwp-er-2026__rz-0043-s186
      zitat: Bei den angegebenen Prozentsätzen handelt es sich um Richtwerte.
    - chunk: ser-2022__5-2-t1
      zitat: Sind die Ergebnisse gesteuert – z. B. durch Bildung oder Auflösung von stillen Reserven – ist vom effektiven Ergebnis auszugehen.
    - chunk: ser-2022__5-2-t1
      zitat: So kann beispielsweise in Situationen drohender Illiquidität oder Überschuldung eine tiefere Wesentlichkeit angezeigt sein.
- id: f09
  kategorie: Wesentlichkeit – Toleranzwesentlichkeit und Nichtaufgriffsgrenze
  schwierigkeit: mittel
  frage: Ich habe die Gesamtwesentlichkeit auf CHF 80'000 festgelegt. In welcher Bandbreite liegt die Toleranzwesentlichkeit, wie hoch darf die Nichtaufgriffsgrenze sein, und wozu dienen
    die beiden Grössen?
  soll:
    antwort: 'Die Toleranzwesentlichkeit beträgt in der Regel 50 % bis 75 % der Gesamtwesentlichkeit, hier also CHF 40''000 bis 60''000 (HWP ER Rz 50). Sie liegt unter der Gesamtwesentlichkeit,
      um dem Aggregationsrisiko Rechnung zu tragen: Einzeln unwesentliche Fehlaussagen können kumuliert wesentlich sein (SER 5.2, HWP ER Rz 49). Sie dient dazu, die Risiken auf Aussagenebene
      zu beurteilen und Art, Zeitpunkt und Umfang der Prüfungshandlungen festzulegen.


      Die Nichtaufgriffsgrenze kann bis zu 5 % der Gesamtwesentlichkeit betragen, hier also höchstens CHF 4''000 (Rz 51). Fehlaussagen darunter müssen nicht in die Zusammenstellung der
      Fehlaussagen aufgenommen werden. Fehlaussagen über der Grenze werden erfasst, kumuliert und laufend auf Wesentlichkeit beurteilt (Rz 53, SER 5.3).


      Im HWP-Beispiel (in TCHF): Gesamtwesentlichkeit 67, Toleranzwesentlichkeit 60 % = 40, Nichtaufgriffsgrenze 5 % = 3.'
    kernpunkte:
    - Toleranzwesentlichkeit in der Regel 50 % bis 75 % der Gesamtwesentlichkeit, hier CHF 40'000 bis 60'000
    - Nichtaufgriffsgrenze bis 5 % der Gesamtwesentlichkeit, hier höchstens CHF 4'000
    - Toleranzwesentlichkeit wegen Aggregationsrisiko; Fehlaussagen über der Nichtaufgriffsgrenze werden erfasst und kumuliert beurteilt
    fehler:
    - Toleranzwesentlichkeit = 10 % der Gesamtwesentlichkeit
    - Nichtaufgriffsgrenze = 10 % der Gesamtwesentlichkeit oder 5 % des Gewinns
    - Toleranzwesentlichkeit über der Gesamtwesentlichkeit
    - Fehlaussagen unter der Toleranzwesentlichkeit müssen nicht erfasst werden
    quellen:
    - chunk: hwp-er-2026__rz-0050-s187
      zitat: beträgt die Toleranzwesentlichkeit in der Regel zwischen 50 % und 75 % der Gesamtwesentlichkeit.
    - chunk: hwp-er-2026__rz-0049-s187
      zitat: legt der Abschlussprüfer eine Toleranzwesentlichkeit fest, welche unterhalb der Gesamtwesentlichkeit zu liegen hat.
    - chunk: ser-2022__5-2-t2
      zitat: Um diesem sogenannten Aggregationsrisiko Rechnung zu tragen, legt der Abschlussprüfer eine entsprechend tiefere Toleranzwesentlichkeit fest.
    - chunk: hwp-er-2026__rz-0051-s187
      zitat: Dieser wird als Nichtaufgriffsgrenze (NAG) bezeichnet.
    - chunk: hwp-er-2026__rz-0051-s187
      zitat: Sie kann bis zu 5 % der Gesamtwesentlichkeit betragen.
    - chunk: hwp-er-2026__rz-0053-s189
      zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert und laufend dahingehend beurteilt, ob sie
        zu einer wesentlichen Fehlaussage führen.
    - chunk: hwp-er-2026__rz-0052-s188-t2
      zitat: Die Toleranzwesentlichkeit wird auf 60 % der Gesamtwesentlichkeit festgelegt.
    - chunk: ser-2022__5-3
      zitat: mit Ausnahme jener, die derart gering sind, dass auch ihre Summe voraussichtlich unwesentlich sein wird (Nichtaufgriffsgrenze).
- id: f10
  kategorie: Vollständigkeitserklärung
  schwierigkeit: mittel
  frage: Wer muss die Vollständigkeitserklärung unterzeichnen, welches Datum trägt sie, und was passiert, wenn der Verwaltungsrat sich weigert, sie abzugeben?
  soll:
    antwort: 'Mit der Vollständigkeitserklärung bestätigt die Unternehmensleitung schriftlich, dass die Jahresrechnung vollständig ist und die erteilten Auskünfte und Unterlagen richtig
      und vollständig sind (SER 6.2.5).


      Unterzeichnet wird sie in der Regel von denselben Personen wie die Jahresrechnung: vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und von der für die Rechnungslegung
      zuständigen Person (Art. 958 Abs. 3 OR; HWP ER Rz 339).


      Ihr Datum entspricht im Regelfall dem Datum des Revisionsberichts. Sie ist auf dieses Datum hin zusammen mit der Jahresrechnung rechtsgültig zu unterzeichnen und sollte vor Abgabe
      des Berichts bei der Revisionsstelle sein. Sie ist für jede Abschlussprüfung einzufordern (Rz 340, 448).


      Eine Weigerung ist eine Beschränkung des Prüfungsumfangs. Die Prüfungsaussage ist dann einzuschränken, sofern überhaupt eine abgegeben werden kann (Rz 341). Je eine unterzeichnete
      Jahresrechnung und Vollständigkeitserklärung gehören in die Jahresakten (SER 7.2).'
    kernpunkte:
    - Unterzeichnung in der Regel durch dieselben Personen wie die Jahresrechnung (Vorsitz VR und für Rechnungslegung zuständige Person)
    - Datum = Datum des Revisionsberichts; liegt vor Berichtsabgabe vor; für jede Prüfung einzufordern
    - 'Weigerung = Beschränkung des Prüfungsumfangs: eingeschränkte Prüfungsaussage oder gar keine Prüfungsaussage'
    fehler:
    - Die Vollständigkeitserklärung ist bei der eingeschränkten Revision freiwillig
    - Datum = Bilanzstichtag
    - Eine Weigerung führt zu einer verneinenden Prüfungsaussage
    - Die Revisionsstelle unterzeichnet die Vollständigkeitserklärung
    quellen:
    - chunk: ser-2022__6-2-5
      zitat: Die Unternehmensleitung bestätigt dem Abschlussprüfer die Vollständigkeit der Jahresrechnung sowie die Richtigkeit und Vollständigkeit der erteilten Auskünfte und der zur
        Verfügung gestellten Unterlagen schriftlich.
    - chunk: hwp-er-2026__rz-0339-s259
      zitat: vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person unterzeichnet werden muss.
    - chunk: hwp-er-2026__rz-0339-s259
      zitat: Die Jahresrechnung und die Vollständigkeitserklärung werden in der Regel von denselben Personen unterzeichnet.
    - chunk: hwp-er-2026__rz-0340-s259
      zitat: Das Datum der Vollständigkeitserklärung entspricht im Regelfall dem Datum der Unterzeichnung des Revisionsberichts.
    - chunk: hwp-er-2026__rz-0340-s259
      zitat: Die rechtsgültig unterzeichnete Vollständigkeitserklärung sollte sich zudem in der Regel vor Abgabe des Revisionsberichts in den Händen der Revisionsstelle befinden. Eine
        Vollständigkeitserklärung ist für jede Abschlussprüfung einzufordern.
    - chunk: hwp-er-2026__rz-0448-s287
      zitat: Auch die Vollständigkeitserklärung ist auf dieses Datum hin zusammen mit der Jahresrechnung rechtsgültig zu unterzeichnen.
    - chunk: hwp-er-2026__rz-0341-s260
      zitat: Eine Weigerung der Unternehmensleitung, eine nach Auffassung des Abschlussprüfers notwendige Erklärung abzugeben, führt zu einer Beschränkung des Prüfungsumfangs. Der Abschlussprüfer
        muss die Prüfungsaussage somit einschränken, sofern eine Prüfungsaussage überhaupt abgegeben werden kann.
    - chunk: ser-2022__7-2
      zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- id: f11
  kategorie: Ereignisse nach dem Bilanzstichtag
  schwierigkeit: mittel
  frage: Der Bilanzstichtag ist der 31.12.2025, unser Bericht soll im März 2026 datiert werden. Im Februar 2026 ging ein Grosskunde in Konkurs, der schon per 31.12.2025 zahlungsunfähig
    war. Im März 2026 ist zudem ein Lager abgebrannt. Wie behandle ich solche Ereignisse bei der eingeschränkten Revision, und was gilt, wenn ich erst nach dem Berichtsdatum von etwas
    erfahre?
  soll:
    antwort: 'Man unterscheidet zwei Arten von Ereignissen (HWP ER Rz 317):

      - Ereignisse, die Nachweise für Umstände liefern, die schon am Bilanzstichtag vorlagen, sind berücksichtigungspflichtig. Hier die Zahlungsunfähigkeit des Kunden per 31.12.: Sie
      ist im Abschluss 2025 zu berücksichtigen, z.B. bei der Bewertung der Forderung.

      - Ereignisse zu Umständen, die erst nach dem Stichtag entstanden sind, werden nicht in den Abschlusswerten berücksichtigt. Hier der Brand im März. Ist ein solches Ereignis wesentlich,
      ist es im Anhang anzugeben (Art. 959c Abs. 2 Ziff. 13 OR).

      Verantwortlich für die Berücksichtigung ist die Unternehmensleitung.


      Prüfungshandlungen bei der eingeschränkten Revision: Befragung der Unternehmensleitung, beschränkt auf bedeutende schwebende Geschäfte und Sachverhalte mit Verlustrisiko, möglichst
      nahe am Berichtsdatum (Rz 318, 321). In der Vollständigkeitserklärung bestätigt die Unternehmensleitung, dass sie alle relevanten Ereignisse nach dem Bilanzstichtag mitgeteilt
      hat (Rz 323).


      Nach dem Berichtsdatum muss die Revisionsstelle keine weiteren Prüfungshandlungen vornehmen. Wird ihr vor Herausgabe des Abschlusses eine relevante Tatsache bekannt, erörtert sie
      diese mit der Unternehmensleitung und legt fest, ob der Abschluss zu ändern ist. Bei einer Änderung erstellt sie einen neuen Bericht, der nicht vor der Genehmigung des geänderten
      Abschlusses datiert ist. Ändert die Unternehmensleitung den Abschluss nicht, modifiziert die Revisionsstelle die Prüfungsaussage, sofern der Bericht noch nicht zugestellt ist (Rz
      324–326).'
    kernpunkte:
    - berücksichtigungspflichtig sind Ereignisse zu Umständen, die schon am Bilanzstichtag bestanden (Konkurs-Fall); nicht zu berücksichtigen sind Ereignisse zu Umständen, die erst danach
      entstanden (Brand; ggf. Anhangangabe)
    - bei der eingeschränkten Revision Befragung der Unternehmensleitung möglichst nahe am Berichtsdatum, Bestätigung in der Vollständigkeitserklärung
    - nach dem Berichtsdatum keine Prüfpflicht; bei bekannt gewordenen Tatsachen erörtern, ggf. neuer Bericht ohne Rückdatierung bzw. Modifikation
    fehler:
    - Beide Ereignisse sind im Abschluss 2025 bilanziell zu erfassen
    - Ereignisse nach dem Bilanzstichtag sind bei der eingeschränkten Revision nicht zu beachten
    - Die Revisionsstelle muss bis zur GV laufend weitere Prüfungshandlungen vornehmen
    - Der korrigierte Bericht darf auf das ursprüngliche Berichtsdatum zurückdatiert werden
    quellen:
    - chunk: hwp-er-2026__rz-0317-s254
      zitat: Ereignisse, die Nachweise für Umstände bzw. Sachverhalte liefern, die bereits am Bilanzstichtag vorlagen (berücksichtigungspflichtige Ereignisse)
    - chunk: hwp-er-2026__rz-0317-s254
      zitat: Ereignisse, die Nachweise für Umstände liefern, die sich nach dem Bilanzstichtag ergeben haben (nicht zu berücksichtigende Ereignisse).
    - chunk: hwp-er-2026__rz-0317-s254
      zitat: Die Unternehmensleitung trägt dabei die Verantwortung, solche Ereignisse nach dem Bilanzstichtag im Abschluss entsprechend zu berücksichtigen.
    - chunk: or__art-959c-t2
      zitat: wesentliche Ereignisse nach dem Bilanzstichtag;
    - chunk: hwp-er-2026__rz-0318-s254
      zitat: Dabei wird sich der Abschlussprüfer bei der eingeschränkten Revision auf die Befragung zu bedeutenden schwebenden Geschäften und anderen Sachverhalten, die vor dem Bilanz
        stichtag liegen und ein Verlustrisiko beinhalten, beschränken.
    - chunk: hwp-er-2026__rz-0321-s255-t1
      zitat: Die Prüfungshandlungen mit Bezug auf Ereignisse nach dem Bilanzstichtag werden üblicherweise so nahe wie praktisch möglich am Datum des Revisionsberichts durch geführt.
    - chunk: hwp-er-2026__rz-0323-s256
      zitat: dass diese ihm alle relevanten Ereignisse, die nach dem Bilanzstichtag eingetreten sind und Auswirkungen auf den Abschluss haben oder haben könnten, mitteilt.
    - chunk: hwp-er-2026__rz-0324-s256
      zitat: Der Abschlussprüfer ist nicht verpflichtet, für den Zeitraum nach dem Datum der Be endigung der eingeschränkten Revision Prüfungshandlungen zur Identifikation von berücksichtigungspflichtigen
        Ereignissen vorzunehmen.
    - chunk: hwp-er-2026__rz-0325-s256
      zitat: Die Datierung des Revisionsberichts darf dabei nicht vor dem Datum der Genehmigung des geänderten Abschlusses liegen
    - chunk: hwp-er-2026__rz-0326-s256
      zitat: Ist der Abschlussprüfer indes überzeugt, dass der Abschluss geändert werden muss, und unterlässt dies die Unternehmensleitung, modifiziert der Abschlussprüfer seine Prüfungsaussage
        (sofern dem Unternehmen noch nicht zugestellt).
- id: f12
  kategorie: Gesetzesverstösse mit zwingendem Hinweis / Zusätze
  schwierigkeit: schwer
  frage: 'Die geprüfte Jahresrechnung einer AG ist korrekt, zeigt aber einen hälftigen Kapitalverlust nach Art. 725a OR. Der Verwaltungsrat hatte genug Zeit, hat aber keine Massnahmen
    ergriffen. Wie berichte ich darüber im Bericht zur eingeschränkten Revision: mit einem Zusatz, einem Hinweis oder einer Einschränkung?'
  soll:
    antwort: 'Die Prüfungsaussage bleibt nicht modifiziert, weil die Jahresrechnung korrekt ist. Es braucht zwei Elemente:

      - Zusatz zum Kapitalverlust selbst: «Wir machen darauf aufmerksam, dass die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve
      und gesetzlicher Gewinnreserve nicht mehr gedeckt ist (Art. 725a Abs. 1 OR).» Der Kapitalverlust als Zustand ist kein Gesetzesverstoss, aber eine wichtige Information für den Bilanzleser
      und daher als Zusatz aufzunehmen (HWP ER Rz 447; SER 8.3.2.2; ebenso Camponovo).

      - Hinweis zur Untätigkeit des VR: Sie ist ein Gesetzesverstoss ausserhalb des Prüfungsgegenstands, und der Hinweis ist in jedem Fall anzubringen (SER 8.3.2.1; HWP ER Rz 423, Abb.
      49: zwingend): «Ferner weisen wir darauf hin, dass es der Verwaltungsrat unterlassen hat, Massnahmen zur Beseitigung des Kapitalverlusts zu ergreifen …» (Muster HWP ER, das ebenfalls
      voraussetzt, dass der VR zeitlich bereits Gelegenheit zum Handeln hatte).


      Zusätze und Hinweise beeinflussen die Prüfungsaussage nicht. Die Reihenfolge ist: Prüfungsaussage, dann Zusatz, dann Hinweis (SER 8.3.2).


      Andere Gesetzesverstösse (z.B. Art. 659, 678, 680, 699 OR) sind nur hinweispflichtig, wenn sie wesentlich sind, einen direkten Bezug zur Jahresrechnung haben und aufgrund der durchgeführten
      Prüfungshandlungen festgestellt wurden. Für Verstösse gegen das Organisationsreglement besteht keine Hinweispflicht.'
    kernpunkte:
    - nicht modifizierte Prüfungsaussage, keine Einschränkung
    - Kapitalverlust als Zusatz (der Zustand selbst ist kein Gesetzesverstoss; Zusatz nach HWP ER Rz 447 aufzunehmen)
    - 'Untätigkeit des VR bei hälftigem Kapitalverlust: Hinweis in jedem Fall anzubringen (SER 8.3.2.1)'
    - 'Reihenfolge: Prüfungsaussage, Zusatz, Hinweis; beide ohne Einfluss auf die Prüfungsaussage'
    fehler:
    - Eingeschränkte Prüfungsaussage wegen des Kapitalverlusts
    - Hinweis nur, wenn wesentlich und mit direktem Bezug zur Jahresrechnung (Verwechslung mit den übrigen Gesetzesverstössen)
    - Anzeige ans Gericht nach Art. 729c OR (gilt nur bei offensichtlicher Überschuldung)
    - Kein Hinweis, weil die Geschäftsführung des VR nicht Prüfungsgegenstand ist
    quellen:
    - chunk: or__art-725a
      zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts.
    - chunk: ser-2022__8-3-2-t1
      zitat: Hinweise auf Gesetzesverstösse ausserhalb des Prüfungsgegenstands im Zusammenhang mit der Untätigkeit des Verwaltungsrates bei Vorliegen eines hälftigen Kapitalverlusts
        (Art. 725a OR) oder einer Überschuldung (Art. 725b OR) sind in jedem Fall im Revisionsbericht anzubringen.
    - chunk: ser-2022__8-3-2-t1
      zitat: Hinweise auf Gesetzesverstösse ausserhalb des Prüfungsgegenstands haben keinen Einfluss auf die Prüfungsaussage im Revisionsbericht; sie werden daher im Berichtstext nach
        der Prüfungsaussage und ggf. nach einem Zusatz mit weiteren Informationen angebracht.
    - chunk: ser-2022__8-3-2-t3
      zitat: das Vorliegen eines Kapitalverlusts oder einer Überschuldung;
    - chunk: ser-2022__8-3-2-t3
      zitat: Zusätze mit weiteren Informationen haben keinen Einfluss auf die Prüfungsaussage im Revisionsbericht; sie werden daher im Berichtstext nach der Prüfungsaussage und ggf.
        vor einem Hinweis auf Gesetzesverstösse ausserhalb des Prüfungsgegenstands angebracht.
    - chunk: muster-hwp-er-2026__c050-2
      zitat: Wir machen darauf aufmerksam, dass die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve
        nicht mehr gedeckt ist (Art. 725a Abs. 1 OR).
    - chunk: muster-hwp-er-2026__c050-2
      zitat: Ferner weisen wir darauf hin, dass es der Verwaltungsrat unterlassen hat, Massnahmen zur Beseitigung des Kapitalverlusts zu ergreifen
    - chunk: muster-hwp-er-2026__c050-2
      zitat: Annahme ist, dass der Verwaltungsrat vom Zeitablauf her bereits Gelegenheit hatte, seinen Pflichten nach Art. 725a Abs. 1 OR nachzukommen, und deshalb ein Gesetzesverstoss
        vorliegt
    - chunk: camponovo-2026-hinweispflichten__s117-1
      zitat: Zustand des hälftigen Kapitalverlustes ist (und war) kein Gesetzesverstoss
    - chunk: camponovo-2026-hinweispflichten__s117-1
      zitat: Will die Revisionsstelle 725a erwähnen, ist das ein Zusatz, kein Hinweis
    - chunk: ser-2022__8-3-2-t1
      zitat: sind in der eingeschränkten Revision im Revisionsbericht ggf. dann anzubringen, wenn sie wesentlich sind, einen direkten Bezug zur Jahresrechnung aufweisen und aufgrund
        der durchgeführten Prüfungshandlungen (z. B. aus der Befragung) festgestellt wurden.
    - chunk: ser-2022__8-3-2-t2
      zitat: Für Verstösse gegen die Statuten besteht eine Hinweispflicht nur dann, wenn diese im Zusammenhang mit dem Prüfungsgegenstand stehen. Für Verstösse gegen das Organisationsreglement
