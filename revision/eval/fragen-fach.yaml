- id: f13
  kategorie: Dokumentation / Aufbewahrung (OR 730c)
  schwierigkeit: leicht
  frage: Wie lange müssen wir die Arbeitspapiere einer eingeschränkten Revision aufbewahren, ab wann läuft die Frist, dürfen wir sie nur elektronisch aufbewahren, und was muss in den
    Jahresakten mindestens dokumentiert sein?
  soll:
    antwort: 'Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und die Revisionsberichte sowie alle wesentlichen Unterlagen mindestens 10 Jahre aufbewahren
      (Art. 730c Abs. 1 OR). Die Frist läuft regelmässig ab dem Berichtsdatum (HWP ER Rz 288). Elektronische Aufbewahrung ist zulässig, wenn die Daten während der ganzen Frist wieder
      lesbar gemacht und nachträgliche Änderungen festgestellt werden können. Die Pflicht gilt auch nach Ende des Mandats (Rz 186). Die Unterlagen müssen eine effiziente Prüfung erlauben,
      ob die gesetzlichen Vorschriften eingehalten wurden (Art. 730c Abs. 2 OR).


      In die Jahresakten gehören (SER 7.2):

      - Überlegungen zur Unabhängigkeit

      - Verständnis des Unternehmens

      - Wesentlichkeitsüberlegungen

      - Ergebnisse der analytischen Prüfungshandlungen aus der Planung

      - inhärentes Risiko und Prüfungsplan

      - Prüfungsprogramm

      - Fehlaussagen und ihre Behandlung

      - Prüfungsnachweise und ihre Beurteilung

      - je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung


      Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors bzw. des Mandatsleiters zu versehen (SER 7.1).'
    kernpunkte:
    - mindestens 10 Jahre (Art. 730c OR), gerechnet ab Berichtsdatum
    - elektronische Aufbewahrung zulässig, wenn Lesbarkeit und Feststellbarkeit von Änderungen gesichert sind; Pflicht gilt über das Mandatsende hinaus
    - Mindestinhalt der Jahresakten (Unabhängigkeit, Wesentlichkeit, Risiko und Prüfungsplan, Programm, Fehlaussagen, Nachweise) sowie unterzeichnete Jahresrechnung und Vollständigkeitserklärung
    fehler:
    - 7 Jahre Aufbewahrung
    - Nur der Revisionsbericht muss aufbewahrt werden
    - Elektronische Aufbewahrung ist unzulässig
    - Die Aufbewahrungspflicht endet mit dem Mandat
    quellen:
    - chunk: or__art-730c
      zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren.
        Elektronische Daten müssen während der gleichen Zeitperiode wieder lesbar gemacht werden können.
    - chunk: or__art-730c
      zitat: Die Unterlagen müssen es ermöglichen, die Einhaltung der gesetzlichen Vorschriften in effizienter Weise zu prüfen.
    - chunk: hwp-er-2026__rz-0288-s248
      zitat: Die Arbeitspapiere sind während mindestens zehn Jahren, regelmässig gerechnet ab Berichtsdatum, aufzubewahren.
    - chunk: hwp-er-2026__rz-0288-s248
      zitat: Dabei muss jedoch sichergestellt werden, dass für die Dauer der gesetzlichen Aufbewahrungspflicht nachträgliche Änderungen festgestellt und die Daten wieder lesbar gemacht
        werden können
    - chunk: hwp-er-2026__rz-0186-s072
      zitat: Die Pflicht zur Aufbewahrung gilt auch über eine allfällige Beendigung des Mandats hinaus.
    - chunk: ser-2022__7-1
      zitat: Zu dokumentieren sind insbesondere die Planung und die Durchführung der Prüfungsarbeiten. Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors oder
        derjenigen Person zu versehen, die das Revisionsmandat leitet.
    - chunk: ser-2022__7-2
      zitat: Überlegungen zur Unabhängigkeit;
    - chunk: ser-2022__7-2
      zitat: Wesentlichkeitsüberlegungen;
    - chunk: ser-2022__7-2
      zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- id: f14
  kategorie: Gewinnverwendungsantrag
  schwierigkeit: mittel
  frage: Der Verwaltungsrat einer AG, deren gesetzliche Reserven die Schwelle von Art. 672 Abs. 2 OR noch nicht erreicht haben, beantragt bei einem Gewinnvortrag von CHF 32'000 und einem
    Jahresgewinn von CHF 7'000 eine Dividende von CHF 17'000. Wie viel muss mindestens der gesetzlichen Gewinnreserve zugewiesen werden, was prüft die Revisionsstelle beim Antrag, und
    wie wird darüber berichtet?
  soll:
    antwort: 'Zuzuweisen sind 5 % des Jahresgewinns, also CHF 350 (Art. 672 Abs. 1 OR). Das gilt, bis die gesetzliche Gewinnreserve zusammen mit der gesetzlichen Kapitalreserve die Hälfte
      des Aktienkapitals erreicht (bei Holdings 20 %). Ein allfälliger Verlustvortrag wäre vor der Zuweisung zu beseitigen. Dividenden dürfen nur aus dem Bilanzgewinn oder aus hierfür
      gebildeten Reserven ausgerichtet werden, und erst nach den Reservezuweisungen (Art. 675 OR).


      Rechnung: verfügbarer Bilanzgewinn CHF 39''000 − 350 − 17''000 = Vortrag CHF 21''650 (HWP ER Rz 215).


      Die Revisionsstelle prüft, ob der Antrag Gesetz und Statuten entspricht (Art. 729a Abs. 1 Ziff. 2 OR), insbesondere:

      - ob die Reservezuweisung richtig ist

      - ob genügend flüssige Mittel für die Dividende vorhanden sind

      - ob keine Statutenbestimmungen entgegenstehen

      - ob kein Verstoss gegen Kapitalschutzvorschriften vorliegt, z.B. Art. 680 Abs. 2 OR (Rz 216, 439)


      Bericht: Die Stellungnahme zum Antrag erfolgt zusammen mit der Prüfungsaussage, z.B. «… dass die Jahresrechnung sowie der Antrag über die Verwendung des Bilanzgewinns nicht dem
      schweizerischen Gesetz und den Statuten entsprechen». Weitere Fälle:

      - Ist die Dividende wegen der Liquiditätslage nicht vertretbar: Hinweis auf einen Verstoss gegen die Sorgfaltspflicht (Art. 717 Abs. 1 OR) gemäss Muster.

      - Entspricht der Antrag in wesentlichem Ausmass nicht Gesetz oder Statuten: verneinende Prüfungsaussage (SER 8.3.1).

      - Liegt kein Bilanzgewinn vor und werden keine Ausschüttungen aus anderen Reserven beantragt: Die Bestätigung zum Antrag entfällt.'
    kernpunkte:
    - Zuweisung 5 % des Jahresgewinns = CHF 350, bis die Reserven 50 % des Aktienkapitals erreichen (Holding 20 %)
    - Dividende erst nach der Reservezuweisung und nur aus Bilanzgewinn bzw. Reserven; Vortrag CHF 21'650
    - Revisionsstelle prüft Gesetzes- und Statutenkonformität des Antrags inkl. Reservezuweisung, Liquidität und Kapitalschutz (Art. 729a Abs. 1 Ziff. 2 OR)
    - Stellungnahme zum Antrag im Revisionsbericht zusammen mit der Prüfungsaussage
    fehler:
    - 5 % des verfügbaren Bilanzgewinns (CHF 1'950) statt des Jahresgewinns
    - Zusätzliche Zuweisung von 10 % der Dividende (aufgehobenes Recht)
    - Der Gewinnverwendungsantrag ist bei der eingeschränkten Revision nicht Prüfungsgegenstand
    - Die Reservezuweisung kann nach der Dividende erfolgen
    quellen:
    - chunk: or__art-672
      zitat: Der gesetzlichen Gewinnreserve sind 5 Prozent des Jahresgewinns zuzuweisen. Liegt ein Verlustvortrag vor, so ist dieser vor der Zuweisung an die Reserve zu beseitigen.
    - chunk: or__art-672
      zitat: Die gesetzliche Gewinnreserve ist zu äufnen, bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte des im Handelsregister eingetragenen Aktienkapitals erreicht.
    - chunk: or__art-675
      zitat: Dividenden dürfen nur aus dem Bilanzgewinn und aus hierfür gebildeten Reserven ausgerichtet werden.
    - chunk: or__art-675
      zitat: Dividenden dürfen erst festgesetzt werden, nachdem die Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven erfolgt sind.
    - chunk: hwp-er-2026__rz-0215-s233
      zitat: Bilanzgewinn zum Vortrag auf neue Rechnung
    - chunk: hwp-er-2026__rz-0216-s233
      zitat: es hat eine Zuweisung zur gesetzlichen Gewinnreserve bis zur definierten Schwelle von 50 % (bei Holdinggesellschaften 20 %) des im Handelsregister eingetragenen Aktienkapitals
        zu erfolgen.
    - chunk: hwp-er-2026__rz-0216-s233
      zitat: Es liegt kein Verstoss gegen Kapitalschutzvorschriften, z.B. Art. 680 Abs. 2 OR (Verbot der Einlagenrückgewähr) vor.
    - chunk: or__art-729a
      zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht.
    - chunk: hwp-er-2026__rz-0439-s284
      zitat: Insbesondere ist zu prüfen, ob die Zuweisungen an die gesetzliche Gewinnreserve richtig erfolgen
    - chunk: hwp-er-2026__rz-0440-s284
      zitat: Die entsprechende Berichterstattung erfolgt im vierten Abschnitt des Berichts zusammen mit der Prüfungsaussage.
    - chunk: muster-hwp-er-2026__c017-2
      zitat: Bei unserer Revision sind wir nicht auf Sachverhalte gestossen, aus denen wir schliessen müssten, dass die Jahresrechnung sowie der Antrag über die Verwendung des Bilanzgewinns
        nicht dem schweizerischen Gesetz und den Statuten entsprechen.
    - chunk: muster-hwp-er-2026__c053-2
      zitat: Diese Ausschüttung ist aufgrund der aktuellen Liquiditätslage der … AG nicht vertretbar. Der Antrag verstösst deshalb gegen die Sorgfaltspflicht (Art. 717 Abs. 1 OR).
    - chunk: ser-2022__8-3-1-t3
      zitat: oder der Antrag über die Verwendung des Bilanzgewinns entspricht in einem wesentlichen Ausmass nicht den gesetzlichen und/oder statutarischen Bestimmungen zur Verwendung
        des Bilanzgewinns (vgl. Beispiel 8, Anhang F)
    - chunk: muster-hwp-er-2026__c001-3
      zitat: Die Bestätigung zum Antrag über die Verwendung des Bilanzgewinns entfällt, wenn kein Bilanzgewinn vorliegt
- id: f15
  kategorie: Kapitalschutz / Kapitalverlust
  schwierigkeit: schwer
  frage: 'Opting-out-AG (keine Holding), Jahresrechnung 2025: Aktienkapital 100''000, gesetzliche Kapitalreserve (Agio) 120''000, gesetzliche Gewinnreserve 10''000, eigene Aktien −20''000,
    Verlustvortrag −30''000, Jahresverlust 2025 −100''000. Haben wir einen Kapitalverlust nach Art. 725a OR? Und wie sieht es aus, wenn der Jahresverlust 110''000 beträgt? Was muss der
    VR dann tun?'
  soll:
    antwort: 'Bilanzielles EK = 100''000 + 120''000 + 10''000 − 20''000 − 30''000 − 100''000 = 80''000. Geschütztes Kapital = AK 100''000 + gesetzliche Kapital- und Gewinnreserve zusammen
      höchstens 50 % des AK (130''000 → begrenzt auf 50''000) = 150''000; Bezugsgrösse (Hälfte) = 75''000. 80''000 ≥ 75''000 → kein Kapitalverlust. Eigene Aktien vermindern nur das (frei
      verfügbare) Eigenkapital, die Bezugsgrösse bleibt unverändert. Variante Jahresverlust 110''000: EK 70''000 < 75''000 → Kapitalverlust (Unterdeckung 5''000), aber keine Überschuldung
      (EK positiv). Folgen: VR ergreift Massnahmen zur Beseitigung des Kapitalverlusts bzw. Sanierung (oder beantragt sie der GV); da keine Revisionsstelle besteht, muss die Jahresrechnung
      2025 vor der Genehmigung durch die GV einer eingeschränkten Revision durch einen vom VR ernannten zugelassenen Revisor unterzogen werden (entfällt nur bei Gesuch um Nachlassstundung).
      Ohne diese Prüfung sind die GV-Beschlüsse zur Genehmigung der JR und zur Verlustverrechnung nichtig.'
    kernpunkte:
    - Bilanzielles EK 80'000 (eigene Aktien als Minusposten enthalten)
    - Geschütztes Kapital 150'000, weil gesetzliche Reserven nur bis 50 % des AK (50'000) zählen → Bezugsgrösse 75'000 → kein Kapitalverlust
    - 'Variante 110''000 Verlust: EK 70''000 < 75''000 → Kapitalverlust, keine Überschuldung'
    - Eigene Aktien ändern die Bezugsgrösse nicht
    - 'Opting-out: eingeschränkte Revision der JR durch vom VR ernannten zugelassenen Revisor vor GV-Genehmigung (Ausnahme Nachlassstundung)'
    fehler:
    - 'Agio voll einrechnen: geschütztes Kapital 230''000, Hälfte 115''000 → fälschlich Kapitalverlust'
    - Eigene Aktien zusätzlich von der Bezugsgrösse abziehen
    - Ordentliche Revision bzw. Wahl einer Revisionsstelle durch die GV statt eingeschränkter Revision durch vom VR ernannten zugelassenen Revisor
    - Kapitalverlust mit Überschuldung verwechseln und Zwischenabschlüsse/Gerichtsbenachrichtigung verlangen
    quellen:
    - chunk: or__art-725a
      zitat: Zeigt die letzte Jahresrechnung, dass die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher
        Kapitalreserve und gesetzlicher Gewinnreserve nicht mehr decken
    - chunk: or__art-725a
      zitat: Hat die Gesellschaft keine Revisionsstelle, so muss die letzte Jahresrechnung vor ihrer Genehmigung durch die Generalversammlung überdies einer eingeschränkten Revision
        durch einen zugelassenen Revisor unterzogen werden. Der Verwaltungsrat ernennt den zugelassenen Revisor.
    - chunk: or__art-725a
      zitat: Die Revisionspflicht nach Absatz 2 entfällt, wenn der Verwaltungsrat ein Gesuch um Nachlassstundung einreicht.
    - chunk: hwp-bur-2023__rz-0889-s359
      zitat: die gesetzliche Kapitalreserve (Art. 671 Abs. 1 OR) und die gesetzliche Gewinnreserve im engeren Sinn (Art. 672 Abs. 1 OR) im Betrag von zusammen maximal 50 % – resp. bei
        Holdinggesellschaften 20 % – des Grundkapitals
    - chunk: hwp-bur-2023__rz-0889-s359
      zitat: Ein Kapitalverlust liegt also vor, wenn das bilanzielle Eigenkapital kleiner ist als die Hälfte des geschützten Kapitals.
    - chunk: qa-kapitalverlust-2023__1-1-t1
      zitat: Eigene Kapitalanteile vermindern das frei verfügbare Eigenkapital. Das geschützte Eigenkapital und damit die Bezugsgrösse nach Art. 725a OR resp. PS-CH 290 bleiben unverändert.
    - chunk: qa-kapitalverlust-2023__1-2-t2
      zitat: Bei Missachtung der Prüfpflicht nach Art. 725a Abs. 2 OR sind die Beschlüsse der Generalversammlung zur Genehmigung der Jahresrechnung sowie zur Verrechnung des Bilanzverlusts
        oder anderweitiger Verwendung von Reserven jedoch nichtig (Art. 731 Abs. 3 OR).
- id: f16
  kategorie: Kapitalschutz / Überschuldung und Rangrücktritt
  schwierigkeit: schwer
  frage: 'AG ohne Revisionsstelle, begründete Besorgnis einer Überschuldung, Fortführung ist gegeben. Zwischenabschluss per 30.06.2026: zu Fortführungswerten Aktiven 900''000 / Verbindlichkeiten
    1''050''000, zu Veräusserungswerten Aktiven 720''000 / Verbindlichkeiten 1''050''000. Wer prüft die Zwischenabschlüsse, muss der VR ans Gericht, und wie hoch muss ein Rangrücktritt
    mindestens sein? Ist mit dem Rangrücktritt auch die Prüfung der Jahresrechnung vom Tisch?'
  soll:
    antwort: 'Überschuldung zu Fortführungswerten 150''000 (900''000 − 1''050''000), zu Veräusserungswerten 330''000 (720''000 − 1''050''000) → gemäss beiden Zwischenabschlüssen überschuldet.
      Mangels Revisionsstelle lässt der VR die Zwischenabschlüsse durch einen von ihm ernannten zugelassenen Revisor prüfen (Art. 725b Abs. 2 OR). Diese Prüfung ist weder eine eingeschränkte
      noch eine ordentliche Revision; massgebend ist PS-CH 290 (SER Kap. 9). Grundsätzlich muss der VR das Gericht benachrichtigen (Abs. 3). Das kann unterbleiben, wenn Gläubiger im
      Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden, sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen
      während der Dauer der Überschuldung umfasst, oder solange begründete Aussicht besteht, die Überschuldung innert angemessener Frist, spätestens 90 Tage nach Vorliegen der geprüften
      Zwischenabschlüsse, zu beheben, ohne die Gläubigerforderungen zusätzlich zu gefährden (Abs. 4). Mindesthöhe: im Ausmass der Überschuldung. Bei gegebener Fortführung genügt nach
      HWP (BuR Rz 719, ER Rz 420) die Deckungslücke zu Fortführungswerten → mindestens 150''000, wobei der Rangrücktritt auch die Zinsforderungen während der Dauer der Überschuldung
      umfassen muss. Sind weitere Verluste absehbar, ist nach HWP ER Rz 421 ein angemessenes Sicherheitspolster für die in den nächsten 12 Monaten, mindestens bis zum nächsten Prüfungszeitpunkt,
      erwarteten Verluste einzurechnen. Wäre die Fortführung konkret gefährdet, müsste der Rangrücktritt die Deckungslücke zu Liquidationswerten (330''000) abdecken. Der Rangrücktritt
      beseitigt weder Überschuldung noch Kapitalverlust und ist keine Sanierungsmassnahme. Er befreit nur von der Benachrichtigung des Gerichts. Die übrigen Pflichten des VR (Sanierungsmassnahmen)
      bleiben bestehen, und die Jahresrechnung muss weiterhin durch einen zugelassenen Revisor (eingeschränkte Revision, Art. 725a Abs. 2 OR) geprüft werden. Passivdarlehen mit Rangrücktritt
      sind in der JR oder im Anhang gesondert auszuweisen. Dem zugelassenen Revisor obliegen die Anzeigepflichten der eingeschränkt prüfenden Revisionsstelle (Art. 725b Abs. 5 OR).'
    kernpunkte:
    - Überschuldet nach beiden Zwischenabschlüssen (150'000 FW / 330'000 VW)
    - Prüfung der Zwischenabschlüsse durch vom VR ernannten zugelassenen Revisor; weder eingeschränkte noch ordentliche Revision (PS-CH 290)
    - Gericht benachrichtigen, ausser Rangrücktritt mit Stundung oder begründete Sanierungsaussicht innert max. 90 Tagen
    - Rangrücktritt mind. 150'000 (Deckungslücke zu Fortführungswerten bei gegebener Fortführung) inkl. Zinsforderungen während der Überschuldung; bei absehbaren Verlusten Sicherheitspolster
    - Rangrücktritt beseitigt Überschuldung/Kapitalverlust nicht → JR bleibt prüfungspflichtig (Art. 725a Abs. 2 OR), Sanierungspflichten bleiben
    - Gesonderter Ausweis der Darlehen mit Rangrücktritt
    fehler:
    - Rangrücktritt nur über 150'000 ohne Zinsforderungen
    - Rangrücktritt zwingend in Höhe der Überschuldung zu Veräusserungswerten (330'000) trotz gegebener Fortführung
    - Mit Rangrücktritt entfalle die Prüfung der Jahresrechnung bzw. die Erstellung/Prüfung von Zwischenabschlüssen
    - Ordentliche Revision statt Prüfung durch zugelassenen Revisor; 60 statt 90 Tage
    quellen:
    - chunk: or__art-725b-t1
      zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen; er ernennt den zugelassenen
        Revisor.
    - chunk: or__art-725b-t1
      zitat: Ist die Gesellschaft gemäss den beiden Zwischenabschlüssen überschuldet, so benachrichtigt der Verwaltungsrat das Gericht.
    - chunk: or__art-725b-t1
      zitat: wenn Gesellschaftsgläubiger im Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden, sofern der Rangrücktritt den geschuldeten
