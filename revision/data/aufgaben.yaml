  titel: Kapitalverlust, Überschuldung, Rangrücktritt prüfen
  stichworte: [kapitalverlust, ueberschuldung, ueberschuldet, unterbilanz, rangruecktritt, 725a, 725b, zwischenabschluss, sanierung, eigenkapital negativ, haelftiger, anzeige gericht, 729c, going concern, fortfuehrung]
