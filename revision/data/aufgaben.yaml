# Prozess-Aufgaben des Revisionsagenten – Einstieg für die Navigation (Tool `aufgabe`).
# Je Aufgabe ein Bündel: Ziel, Checkliste mit genauen Aufrufen, Regeln (Schlüssel aus regeln.yaml), revio-Ketten (ketten.yaml),
# Fertig-wenn, nächste Aufgabe. Ziel: der Agent hat nach EINEM Aufruf alles, was er für die Aufgabe braucht.
# Grundlage: Konzept KI-Revisionsagent (consis) – Fundstelle je Aufgabe. Status: agent-geprueft (Review offen).
# Synonyme je Prüffeld (für «Vorräte prüfen», «MWST», «Debitoren» …)
prueffeld_synonyme:
  A1: [allgemeine pruefungshandlungen, gesamtanalytik, jahresrechnung als ganzes]
  B1: [fluessige mittel, bank, banken, kasse, post, liquiditaet, bankkonto, wertschriften]
  C1: [debitoren, forderungen lul, forderungen aus lieferungen, kundenforderungen, op-liste debitoren]
  D1: [uebrige forderungen, uebrige kurzfristige forderungen, verrechnungssteuer guthaben, kautionen]
  E1: [aktive rechnungsabgrenzung, transitorische aktiven, ara]
  F1: [vorraete, lager, inventar, inventur, warenlager]
  F2: [angefangene arbeiten, nicht fakturierte leistungen, projekte, ware in arbeit]
  G1: [mobile sachanlagen, sachanlagen, anlagen, fahrzeuge, maschinen, mobiliar, it-anlagen]
  G2: [immobile sachanlagen, liegenschaften, immobilien, gebaeude, grundstuecke]
  H1: [finanzanlagen, wertschriften anlagevermoegen]
  H2: [aktivdarlehen, darlehen an aktionaer, darlehen an nahestehende, darlehensforderung]
  H3: [beteiligungen, tochtergesellschaft, beteiligung]
  I1: [immaterielle anlagen, immaterielle werte, goodwill, software, lizenzen]
  K1: [kreditoren, verbindlichkeiten lul, lieferantenschulden, verbindlichkeiten aus lieferungen]
  L1: [kurzfristige verzinsliche verbindlichkeiten, bankschulden kurzfristig, kontokorrent]
  M1: [uebrige kurzfristige verbindlichkeiten, sozialversicherungen, ahv, quellensteuer verbindlichkeit]
  M2: [mwst, mehrwertsteuer, vorsteuer, umsatzsteuer]
  M3: [passive rechnungsabgrenzung, transitorische passiven, pra, kurzfristige rueckstellungen]
  N1: [langfristige verbindlichkeiten, aktionaersdarlehen, hypothek, bankdarlehen, darlehen von aktionaeren]
  O1: [rueckstellungen, langfristige rueckstellungen, prozessrisiken, garantierueckstellung]
  P1: [eigenkapital, aktienkapital, reserven, gewinnverwendung, kapitalerhoehung, bilanzgewinn]
  R1: [personalaufwand, loehne, lohn, personal, saläre, salaere, lohnaufwand]
  S1: [steuern, direkte steuern, steuerrueckstellung, ertragssteuern]
  SCH1: [betrieblicher ertrag, umsatz, erloese, ertrag]
  SCH2: [direkter aufwand, materialaufwand, warenaufwand]
  SCH3: [uebriger betrieblicher aufwand, raumaufwand, verwaltungsaufwand]
  SCH4: [finanzaufwand, finanzertrag, zinsen, zinsaufwand]
  SCH5: [nebenbetrieb, betriebsfremd, ausserordentlich, ausserordentlicher aufwand]
  T1: [anhang, anhang zur jahresrechnung, 959c]
aufgaben:
- id: mandat-start
  titel: Mandat starten – Kontext fixieren und Überblick gewinnen
  stichworte: [start, starten, starte, beginnen, beginne, mandat, mandatskontext, kontext, dossier, dossier oeffnen, ueberblick, neue revision, revision starten, revision beginnen, auftrag erhalten, kontext-schluessel]
  prozess: "0"
  phase: p8-agentablauf
  ziel: Mandatskontext (Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag) fixieren, Dossier öffnen, Planung lesen (Revisionsart, Wesentlichkeit 3.3, Risiken 3.1, Strategie 3.5) und die markierten Prüffelder bestimmen.
  quelle: konzept-ki-revisionsagent-2026__c009-1
  zitat: Zu Beginn wird ein Kontext-Schlüssel fixiert
  regeln: [mandatskontext, schreibbereiche, lesen, visum]
  checkliste:
  - text: Kontext-Schlüssel festhalten – Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag. Jeder spätere Zugriff wird dagegen geprüft; Abweichung → abbrechen und Pendenz.
  - text: Kunde und Dossier (Jahresakte) in revio finden und öffnen.
    aufruf: revio K1
  - text: Wesentlichkeit 3.3 lesen (Gesamt, Toleranz 75 %, Nichtaufgriff 5 %) – nie ändern; Plausibilität prüfen.
    aufruf: aufgabe wesentlichkeit
  - text: Risikobeurteilung 3.1 und strategische Planung 3.5 lesen – welche Prüffelder sind markiert, Prüfungstiefe, Priorität.
    aufruf: revio K4
  - text: Vorjahr lesen (Vorjahresakte, Pendenzen, Feststellungen) und Vorjahresabstimmung einplanen.
    aufruf: revio K10
  - text: Revisionsart plausibilisieren (eingeschränkt? Opting-out?) – nur bei Zweifel, Entscheid WP.
    aufruf: revisionspflicht --bilanzsumme … --umsatz … --vollzeitstellen …
  fertig_wenn: Kontext-Schlüssel steht, Dossier offen, Wesentlichkeit und markierte Prüffelder bekannt.
  naechste: [import, prueffeld]
- id: import
  titel: Prozess 1 – Jahresrechnung importieren und abstimmen
  stichworte: [import, jahresrechnung, bilanz, erfolgsrechnung, saldenbilanz, kontenzuordnung, prozess 1, einlesen, vorzeichen]
  prozess: "1"
  phase: p8-agentablauf
  ziel: Definitive Bilanz und Erfolgsrechnung aus M-Files in revio 1.1 übernehmen, Konten zuordnen, Bilanzgleichheit und Totale abstimmen.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Definitive Bilanz und ER in M-Files suchen
  regeln: [mandatskontext, rechenmodul, testphase_halt, pendenz]
  checkliste:
  - text: Definitive Bilanz und ER des Geschäftsjahres in M-Files suchen (Kunde, Geschäftsjahr, Klasse) – nur «definitiv», nicht Entwürfe.
  - text: Import in revio (Saldenbilanz/Kontenplan) – Werkzeuge und Grenzen der Kette beachten.
    aufruf: revio K2
  - text: Vorzeichen der Passiven prüfen (offener Entscheid enco/revio, ob Importoption oder Excel-Zwischenschritt).
  - text: Konten den Positionen zuordnen; unklare Zuordnungen als Pendenz (Konto, Betrag).
    aufruf: aufgabe notiz
  - text: Bilanzgleichheit (Aktiven = Passiven), Totale und Jahresergebnis gegen die Jahresrechnung abstimmen – im Rechenmodul.
    aufruf: rechne "Aktiven = …; Passiven = …; Differenz = … - …"
  - text: Testphase – Halt nach dem Import, WP kontrolliert die Kontenzuordnung, bevor Prüffelder bearbeitet werden.
  fertig_wenn: Saldenbilanz in revio stimmt mit der definitiven Jahresrechnung überein (Differenz 0), unklare Zuordnungen als Pendenz erfasst, WP informiert (Halt).
  naechste: [prueffeld, unterlagen]
- id: prueffeld
  titel: Prozess 2 – Prüffeld bearbeiten (markierte Abschlussprüfung)
  stichworte: [prueffeld, abschlusspruefung, prozess 2, bilanzposition, pruefschritte, markierte pruefung]
  prozess: "2"
  phase: p3-durchfuehrung
  ziel: Alle Prüfschritte des Prüffelds nach Typ bearbeiten, Nachweise aus M-Files beschaffen, Ergebnis im Textfeld dokumentieren, Belege ablegen, Notizen erfassen – Visum offen lassen.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Prüfschritte nach Typ bearbeiten, Nachweise aus M-Files beschaffen, Ergebnis im Textfeld dokumentieren, Belege ablegen, Notizen erfassen
  regeln: [je_schritt, ergebnis, pruefziele, befragung, analytisch, detail, sonstige, wp, rechenmodul, prozess2]
  checkliste:
  - text: Prüffeld-Bündel lesen (unten) – Risiken, Bewertungsregeln, Unterlagen, Fragen an den Kunden, Schritte mit Rolle.
  - text: Kontenübersicht/Saldi des Prüffelds und Vorjahr aus revio lesen; Toleranzwesentlichkeit aus 3.3 bereithalten.
    aufruf: revio K5
  - text: Unterlagen (PBC) in M-Files suchen; Fehlendes → Pendenz und PBC-Vorschlag 10.10.
    aufruf: aufgabe notiz
  - text: Jeden Schritt einzeln bearbeiten (Reihenfolge 1xx → 2xx → 3xx; 4xx nur auf Anweisung; WP-Schritte nur auf Anweisung) – für jeden Schritt genau einen Aufruf.
    aufruf: pruefschritt <id>
  - text: Textfeld-Entwurf je Schritt (Prüfziel, Quellen mit M-Files-ID, Auswahl/Umfang mit Begründung, Ergebnis mit Zahlen, Feststellungen, Pendenzen, Status).
    aufruf: revio K6
  - text: Feststellungen und Pendenzen als Notiz erfassen (Buchungsvorschlag ohne Verbuchung).
    aufruf: revio K7
  - text: Visum, ✓ und Abschliessende Beurteilung offen lassen.
  fertig_wenn: Jeder Schritt hat Status (vorbereitet / mit Feststellungen / teilweise / nicht bearbeitet mit Grund), alle Feststellungen und Pendenzen sind als Notiz erfasst.
  naechste: [rapport]
- id: unterlagen
  titel: Prozess 3 – Unterlagen zum Abschluss (10.9 Protokolle, PBC-Liste, Kundenbefragung)
  stichworte: [unterlagen, protokoll, protokolle, 10.9, pbc, pbc-liste, 10.10, kundenbefragung, 10.11, gv-protokoll, vr-protokoll, prozess 3, fehlende unterlagen, ablegen]
  prozess: "3"
  phase: p8-agentablauf
  ziel: Protokoll Vorjahr (GV/VR) aus M-Files beschaffen, Zugehörigkeit prüfen und in 10.9 ablegen; fehlende Unterlagen als Vorschlag für die PBC-Liste (10.10); schriftliche Antworten der Kundenbefragung (10.11) auswerten.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Protokoll Vorjahr aus M-Files beschaffen, Zugehörigkeit prüfen, ablegen
  regeln: [schreibbereiche, befragung, pendenz, mandatskontext]
  checkliste:
  - text: Protokolle (ordentliche/ausserordentliche GV, VR) des Geschäftsjahres und des Vorjahres in M-Files suchen; Zugehörigkeit prüfen (Gesellschaft, Datum, Geschäftsjahr, Unterschriften).
  - text: In revio 10.9 ablegen – Status bleibt offen.
    aufruf: revio K8
  - text: Inhalt auswerten (Genehmigung Vorjahresrechnung, Gewinnverwendung, Wahl Revisionsstelle, Kapitalmassnahmen, Darlehen an Aktionäre) und Bezug zu P1/A1 herstellen.
    aufruf: prueffeld P1
  - text: Fehlende Unterlagen je Prüffeld sammeln → Vorschlag PBC-Liste 10.10 (Anforderung beim Kunden macht der Mensch).
    aufruf: unterlagen alle
  - text: Kundenbefragung 10.11 lesen und Antworten den Befragungsschritten (1xx) zuordnen.
    aufruf: revio K9
  fertig_wenn: Protokolle abgelegt (Status offen), PBC-Vorschläge erfasst, Antworten aus 10.11 den Schritten zugeordnet.
  naechste: [prueffeld, rapport]
- id: rapport
  titel: Prozess 4 – Revisionsrapport an den Wirtschaftsprüfer
  stichworte: [rapport, bericht an wp, zusammenfassung, status, email, mail, prozess 4, offene punkte, revisionsrapport]
  prozess: "4"
  phase: p8-agentablauf
  ziel: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet), offene und wesentliche Punkte zuerst, mit Verweis auf Schritt und Notiz – als E-Mail-Entwurf nur an die freigegebene WP-Adresse.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet), offene und wesentliche Punkte zuerst, Verweis auf Schritt und Notiz
  regeln: [ergebnis, pendenz_rapport, email, gesamt]
  checkliste:
  - text: Status je Prüffeld und Schritt aus revio sammeln (Textfelder, Notizen).
    aufruf: revio K11
  - text: 'Aufbau: 1. Wesentliche Feststellungen (Schritt-Id, Notiz, Betrag, Buchungsvorschlag) · 2. offene Pendenzen und PBC-Vorschläge · 3. Status je Prüffeld (Anzahl vorbereitet / mit Feststellungen / teilweise / nicht bearbeitet + Grund) · 4. Entscheide für den WP (z.B. Kapitalverlust, Hinweise im Bericht, WP-Schritte, Summe nicht korrigierter Fehler für 6.1).'
  - text: Summen der Feststellungen im Rechenmodul bilden und mit der Gesamtwesentlichkeit vergleichen (Beurteilung macht der WP in 6.1).
    aufruf: rechne "…"
  - text: Nur E-Mail-Entwurf bzw. Versand an die freigegebene WP-Adresse; nie an Kunden; keine Prüfungsaussage.
  fertig_wenn: Rapport-Entwurf enthält alle Feststellungen und Pendenzen mit Verweis, Status aller markierten Prüffelder, offene Entscheide.
  naechste: [gvb-bericht]
