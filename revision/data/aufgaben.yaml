  regeln: [gvb, or729b_bericht, or725a_kapitalverlust, or729c_anzeige]
  checkliste:
  - text: Berichtsstrategie 7.1 und Berichtskritik 7.5 lesen (nur lesen).
    aufruf: revio K12
  - text: Vorjahres-Deckblatt und -Berichtstext in M-Files kopieren (Original unverändert lassen) und Jahreszahlen, Stichtag, Jahresergebnis/Bilanzsumme aktualisieren.
  - text: 'Prüfen, ob der Normalwortlaut passt: Kapitalverlust (OR 725a), Überschuldung/Rangrücktritt (OR 725b), Gesetzesverstösse (Hinweis), Fortführung – Modifikation oder Hinweis entscheidet der WP; der Agent markiert nur.'
