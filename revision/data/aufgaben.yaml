  regeln: [or725a_kapitalverlust, or725b_zwischenabschluss, or725b_pruefung, or725b_rangruecktritt, or725b_90tage, or725b_gericht, or729c_anzeige, or725_zahlungsfaehigkeit]
  checkliste:
  - text: 'Aus der Jahresrechnung lesen: Aktiven; Fremdkapital (Verbindlichkeiten inkl. Rückstellungen und passive Rechnungsabgrenzungen) unverändert aus der Bilanz; Aktienkapital (nominell laut HR); gesetzliche Kapitalreserve (OR 671 Abs. 1) und gesetzliche Gewinnreserve im engeren Sinn (OR 672 Abs. 1). Kredite nach Art. 3 Covid-19-SBüV und Darlehen/Kredite nach Art. 21 HFMV 20 nur mit `--covid-kredit` eingeben – nicht zusätzlich von den Verbindlichkeiten abziehen; Kredite nach Art. 4 Covid-19-SBüV bleiben Fremdkapital. Aufwertungsreserve (OR 725c) und Reserve für eigene Kapitalanteile im Konzern (OR 659b) mit `--reserve-voll`, nicht in `--gewinnreserve`. Stille Reserven grundsätzlich nicht einrechnen (HWP ER Rz 369); dann rechnen.'
    aufruf: kapitalverlust --aktiven … --verbindlichkeiten … --aktienkapital … --kapitalreserve … --gewinnreserve … [--reserve-voll …] [--covid-kredit …] [--rangruecktritt …]
    fundstellen:
    - quelle: covid-sbueg__art-24
      zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
    - quelle: qa-or-rechnungslegung-2026__10-t3
      zitat: gilt der verbürgte COVID-19-Kredit im Umfang von CHF 0.5 Mio. nicht als Fremdkapital
    - quelle: hwp-er-2026__rz-0373-s113
      zitat: Dies gilt auch für Darlehen oder verbürgte/garantierte Kredite nach der Covid-19-Härtefallverordnung 2020 (Art. 21 HFMV 20).
    - quelle: hwp-er-2026__rz-0371-s112
      zitat: resultierend aus der Summe der Aktiven abzüglich der Summe der Verbindlichkeiten
    - quelle: hwp-er-2026__rz-0370-s112
      zitat: die gesetzliche Kapitalreserve (Art. 671 Abs. 1 OR) und die gesetzliche Gewinnreserve im engeren Sinn (Art. 672 Abs. 1 OR)
    - quelle: hwp-er-2026__rz-0370-s112
      zitat: der volle Betrag der gesetzlichen Reserven für eigene Kapitalanteile im Konzern (Art. 659b Abs. 2 OR) und aus Aufwertungen (Art. 725c Abs. 1 OR)
    - quelle: qa-kapitalverlust-2023__1-1-t2
      zitat: Die diesbezüglichen Bestimmungen des Covid-19-SBüG gelten vom 19. Dezember 2020 bis zum 31. Dezember 2032 (Art. 31).
    - quelle: or__art-725a
      zitat: nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve
    - quelle: hwp-er-2026__rz-0369-s112
      zitat: allfällige stille Reserven bei der Berechnung grundsätzlich keine Berücksichtigung
  - text: 'Kapitalverlust oder Überschuldung festgestellt → Sofortmeldung an den WP als Entwurf ganz oben in der Antwort bzw. im Rapport (Betreff, Kernaussage, Zahlen aus `kapitalverlust`), nicht erst am Schluss – gebotene Eile. Nicht senden: die Übermittlung an den WP macht der Mensch (Praxis/intern, Testphase; Regel email).' 
    fundstellen:
    - quelle: or__art-725a
      zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
    - quelle: or__art-725b-t2
      zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
  - text: Begründete Besorgnis einer Überschuldung (Rechner zeigt Überschuldung oder es liegen Indikatoren vor) → Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten beim VR als Pendenz anfordern; über die Prüfung durch die Revisionsstelle entscheidet der WP.
    fundstellen:
    - quelle: or__art-725b-t1
      zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
  - text: 'Rangrücktrittsvereinbarungen prüfen: Betrag UND Zinsen während der Dauer der Überschuldung, Stundung, Ausmass ≥ Überschuldung, unterzeichnet. Sind weitere Verluste absehbar: Sicherheitspolster (Höhe legt der WP fest) – Deckung mit `kapitalverlust … --rangruecktritt <Σ laut Vereinbarungen inkl. Zinsen> --rr-polster <Polster>`.'
    aufruf: thema rangruecktritt
    fundstellen:
    - quelle: or__art-725b-t1
      zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
    - quelle: hwp-er-2026__rz-0421-s125
      zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten 12 Monaten nach Unterzeichnung des Rangrücktritts
  - text: VR-Massnahmen (Protokolle) und Sanierung dokumentieren; Fortführungsfähigkeit beachten (ergänzend `pruefschritt A1-205`, Going Concern).
    aufruf: pruefschritt P1-313
  - text: Für den WP aufbereiten (Notiz Wesentliche Feststellungen/Schlussbesprechung) – Hinweis/Zusatz im Bericht und Anzeige (OR 729c) entscheidet der WP.
    aufruf: revio K7
  fertig_wenn: Rechnung dokumentiert (Textfeld P1-313, Querverweis A1-205), Rangrücktritte beurteilt, offene Punkte als Notiz; bei Kapitalverlust oder Überschuldung die Sofortmeldung an den WP als Entwurf ganz oben in der Antwort (nicht gesendet), sonst im Rapport.
