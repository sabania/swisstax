  ziel: Kapitalverlust (OR 725a) und Überschuldung (OR 725b) rechnerisch feststellen, Rangrücktritte und Zwischenabschlüsse prüfen, Folgen für Bericht und Anzeigepflicht für den WP aufbereiten.
