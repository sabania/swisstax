# Prozess-Aufgaben des Revisionsagenten – Einstieg für die Navigation (Tool `aufgabe`).
# Je Aufgabe ein Bündel: Ziel, Checkliste mit genauen Aufrufen, Regeln (Schlüssel aus regeln.yaml), revio-Ketten (ketten.yaml),
# Fertig-wenn, nächste Aufgabe. Ziel: der Agent hat nach EINEM Aufruf alles, was er für die Aufgabe braucht.
# Grundlage: Konzept KI-Revisionsagent (consis) – Fundstelle je Aufgabe. Status: agent-geprueft (Review offen).
# Checklistenpunkte mit eigener fachlicher Aussage tragen `fundstellen` (quelle + zitat, von lint.py geprüft).
# Hauptkette (erster Eintrag von naechste = Hauptnachfolger, weitere = danach): auftrag → mandat-start (darin wesentlichkeit, Punkt 10) →
# import → planung → prueffeld (je markiertes Prüffeld) → unterlagen → abschluss → rapport → gvb-bericht (Ende; pdf-akte nur auf Anweisung).
# Hilfsaufgaben (notiz, kapitalschutz, Playbooks) haben naechste: [] – danach zurück zur aufrufenden Checkliste; ebenso Aufgaben, die eine
# Checkliste mit `aufgabe <id>` aufruft (wesentlichkeit aus mandat-start).
# Synonyme je Prüffeld (für «Vorräte prüfen», «MWST», «Debitoren» …)
prueffeld_synonyme:
  A1: [allgemeine pruefungshandlungen, gesamtanalytik, jahresrechnung als ganzes]
  B1: [fluessige mittel, bank, banken, kasse, post, liquiditaet, bankkonto, bankkonten, bankguthaben, wertschriften]
  C1: [debitoren, forderungen lul, forderungen aus lieferungen, kundenforderungen, op-liste debitoren]
  D1: [uebrige forderungen, uebrige kurzfristige forderungen, verrechnungssteuer guthaben, kautionen]
  E1: [aktive rechnungsabgrenzung, transitorische aktiven, ara]
  F1: [vorraete, lager, inventar, inventur, warenlager]
  F2: [angefangene arbeiten, nicht fakturierte leistungen, projekte, ware in arbeit]
  G1: [mobile sachanlagen, sachanlagen, anlagen, fahrzeuge, maschinen, mobiliar, it-anlagen]
  G2: [immobile sachanlagen, liegenschaften, immobilien, gebaeude, grundstuecke]
  H1: [finanzanlagen, wertschriften anlagevermoegen]
  H2: [aktivdarlehen, darlehen an aktionaer, darlehen an nahestehende, darlehensforderung]
  H3: [beteiligungen, tochtergesellschaft, beteiligung]
  I1: [immaterielle anlagen, immaterielle werte, goodwill, software, lizenzen]
  K1: [kreditoren, verbindlichkeiten lul, lieferantenschulden, verbindlichkeiten aus lieferungen, lieferanten, lieferant]
  L1: [kurzfristige verzinsliche verbindlichkeiten, bankschulden kurzfristig, kontokorrent, bankschulden, kontokorrentkredit, festvorschuss, festkredit]
  M1: [uebrige kurzfristige verbindlichkeiten, sozialversicherungen, ahv, quellensteuer verbindlichkeit]
  M2: [mwst, mehrwertsteuer, vorsteuer, umsatzsteuer]
  M3: [passive rechnungsabgrenzung, transitorische passiven, pra, kurzfristige rueckstellungen]
  N1: [langfristige verbindlichkeiten, aktionaersdarlehen, hypothek, bankdarlehen, darlehen von aktionaeren]
  O1: [rueckstellungen, langfristige rueckstellungen, prozessrisiken, garantierueckstellung]
  P1: [eigenkapital, aktienkapital, reserven, gewinnverwendung, kapitalerhoehung, bilanzgewinn]
  R1: [personalaufwand, loehne, lohn, personal, saläre, salaere, lohnaufwand, lohnabstimmung, ahv abrechnung, lohnbuchhaltung, lohnausweis]
  S1: [steuern, direkte steuern, steuerrueckstellung, ertragssteuern]
  SCH1: [betrieblicher ertrag, umsatz, erloese, ertrag]
  SCH2: [direkter aufwand, materialaufwand, warenaufwand]
  SCH3: [uebriger betrieblicher aufwand, raumaufwand, verwaltungsaufwand]
  SCH4: [finanzaufwand, finanzertrag, zinsen, zinsaufwand]
  SCH5: [nebenbetrieb, betriebsfremd, ausserordentlich, ausserordentlicher aufwand]
  T1: [anhang, anhang zur jahresrechnung, 959c]
aufgaben:
- id: mandat-start
  titel: Mandat starten – Kontext fixieren und Überblick gewinnen
  stichworte: [start, starten, starte, beginnen, beginne, mandat, mandatskontext, kontext, dossier, dossier oeffnen, ueberblick, neue revision, revision starten, revision beginnen, auftrag erhalten, kontext-schluessel]
  prozess: "0"
  phase: p8-agentablauf
  ziel: Mandatskontext (Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag) fixieren, Dossier öffnen, Planung lesen (Revisionsart, Wesentlichkeit 3.3, Risiken 3.1, Strategie 3.5) und die markierten Prüffelder bestimmen.
  quelle: konzept-ki-revisionsagent-2026__c009-1
  zitat: Zu Beginn wird ein Kontext-Schlüssel fixiert
  regeln: [mandatskontext, schreibbereiche, lesen, visum, lesetest, audit_trail]
  checkliste:
  - text: Kontext-Schlüssel festhalten – Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag. Jeder spätere Zugriff wird dagegen geprüft; Abweichung → abbrechen und Pendenz.
  - text: 'Betriebsart vom WP festhalten: Lesetest (nichts in revio/M-Files ablegen; Textfeld- und Notiz-Entwürfe nur in den Rapport) oder Schreibtest (jede Schreibaktion mit Freigabe).'
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c023-1
      zitat: Der Agent bearbeitet ein Testmandat, schreibt den Rapport, legt aber nichts in revio oder M-Files ab.
    - quelle: konzept-ki-revisionsagent-2026__c023-1
      zitat: Zuerst die technische Machbarkeit klären, dann lesend testen und erst danach schreibend arbeiten lassen.
  - text: 'Protokoll (Audit Trail) führen: jede Aktion, Quelle, Berechnung und jeden Fehler mit Zeitstempel. Ablage pro Mandat/Jahr in M-Files – im Lesetest nicht ablegen (Übergabe regelt der WP).'
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c009-3
      zitat: Protokoll (Audit Trail). Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
    - quelle: flussdiagramm-revisionsagent-2026__s001-5
      zitat: Jede Aktion, Quelle und Berechnung wird protokolliert
  - text: Kunde und Dossier (Jahresakte) in revio finden und öffnen.
    aufruf: revio K1
  - text: 'Akte erschliessen (GJ und VJ): Ordner und Dateien mit vermutetem Prüffeld. Prüffelder immer mit revio-Code (A1 … T1) nennen, nie mit den Ordnerbuchstaben der Akte (Praxis/intern).'
    aufruf: akte <pfad> --vj <vj-pfad>
  - text: Risikobeurteilung 3.1 und strategische Planung 3.5 lesen – welche Prüffelder sind markiert, Prüfungstiefe, Priorität.
    aufruf: revio K4
  - text: 'Vorjahresakte lesen: Revisionsbericht, Schlussbesprechung, Feststellungen/Pendenzen und Hinweise «im Folgejahr» – jeden Hinweis ins Geschäftsjahr übernehmen (Pendenz oder Prüfschritt). Grosse Dateien mit `akte <vj-pfad> --inhalt <datei>` (Praxis/intern).'
    aufruf: akte <vj-pfad> --suche "Folgejahr|Schlussbesprechung|Feststellung|Pendenz"
  - text: Vorjahr in revio lesen (ohne Kontextwechsel) und Vorjahresabstimmung einplanen.
    aufruf: revio K10
  - text: 'Wahl der Revisionsstelle für das Geschäftsjahr im GV-Protokoll prüfen: Die GV wählt die Revisionsstelle für ein bis drei Geschäftsjahre; das Amt endet mit der Abnahme der letzten Jahresrechnung. Keine gültige Wahl für das Geschäftsjahr gefunden → Notiz für den WP (Pendenz).'
    aufruf: akte <pfad> --vj <vj-pfad> --suche "Revisionsstelle"
    fundstellen:
    - quelle: or__art-730
      zitat: Die Generalversammlung wählt die Revisionsstelle.
    - quelle: or__art-730a
      zitat: Die Revisionsstelle wird für ein bis drei Geschäftsjahre gewählt. Ihr Amt endet mit der Abnahme der letzten Jahresrechnung.
  - text: 'Pflichtschritt Wesentlichkeit: 3.3 nur lesen (nie ändern) und plausibilisieren, inkl. Vergleich mit dem Vorjahr (Bezugsgrösse, Prozentsätze, Beträge). Passen Bezugsgrösse, Satz und Begründung nicht zusammen → Pendenz.'
    aufruf: aufgabe wesentlichkeit
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c014-1
      zitat: Passen Bezugsgrösse, Prozentsatz und Begründung nicht zusammen, erfasst der Agent eine Pendenz.
  - text: 'Auslöser Eigenkapital negativ oder Kapitalverlust-Indiz (Bilanz, Vorjahresbericht, Anhang) → `aufgabe kapitalschutz` und `kapitalverlust` rechnen; Rangrücktritte mit den Beträgen laut unterzeichneten Vereinbarungen, nicht laut Anhang. Weicht die Anhangsangabe ab → Notiz.'
    aufruf: aufgabe kapitalschutz
    fundstellen:
    - quelle: or__art-725b-t1
      zitat: wenn Gesellschaftsgläubiger im Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden
    - quelle: ser-2022__1-2-t2
      zitat: Eine kritische Grundhaltung bedeutet, dass der Abschlussprüfer die Stichhaltigkeit erlangter Informationen und Unterlagen hinterfragt
  - text: 'Revisionsart plausibilisieren (eingeschränkt? Opting-out?) – nur bei Zweifel, Entscheid WP. Vorjahreswerte aus der Vorjahresakte lesen, nie schätzen: Vollzeitstellen im Anhang der Vorjahresrechnung (`akte <vj-pfad> --suche "Vollzeitstellen"`), Bilanzsumme/Umsatz aus der Vorjahresrechnung; Risikoeinstufung des Vorjahres: `akte <vj-pfad> --suche "Risiko"` (Praxis/intern).'
    fundstellen:
    - quelle: or__art-959c-t1
      zitat: eine Erklärung darüber, ob die Anzahl Vollzeitstellen im Jahresdurchschnitt nicht über 10, über 50 beziehungsweise über 250 liegt
    aufruf: revisionspflicht --bilanzsumme … --umsatz … --vollzeitstellen … --vj-bilanzsumme … --vj-umsatz … --vj-vollzeitstellen …
  fertig_wenn: Kontext-Schlüssel und Betriebsart (Lesetest/Schreibtest) stehen, Protokoll läuft, Dossier offen, Akte und Vorjahresakte erschlossen (Hinweise «im Folgejahr» übernommen), Wahl der Revisionsstelle geprüft, Wesentlichkeit plausibilisiert, markierte Prüffelder (revio-Codes) bekannt.
  naechste: [import]
- id: import
  titel: Prozess 1 – Jahresrechnung importieren und abstimmen
  stichworte: [import, jahresrechnung, bilanz, erfolgsrechnung, saldenbilanz, kontenzuordnung, prozess 1, einlesen, vorzeichen]
  prozess: "1"
  phase: p8-agentablauf
  ziel: Definitive Bilanz/ER aus M-Files lesen, Import in revio 1.1 nur simulieren (K2 Schritte 11–13), Vorzeichen, Zuordnung, Bilanzgleichheit, Totale und Perioden prüfen; Abweichungen und unklare Zuordnungen als Pendenz. Übernahme und Kontenzuordnung in 1.1 macht der Mensch (Entscheid consis offen).
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Definitive Bilanz und ER in M-Files suchen
  regeln: [mandatskontext, schreibbereiche, rechenmodul, testphase_halt, pendenz]
  checkliste:
  - text: Definitive Bilanz und ER des Geschäftsjahres in M-Files suchen (Kunde, Geschäftsjahr, Klasse) – nur «definitiv», nicht Entwürfe.
  - text: 'Jahresrechnung ganz lesen – Bilanz, Erfolgsrechnung, Anhang, Antrag über die Verwendung des Bilanzergebnisses, Unterzeichnung/Datum; grosse Dateien abschnittweise (Praxis/intern).'
    aufruf: akte <pfad> --inhalt <Jahresrechnung>
  - text: 'Formelle Grobprüfung: Mindestgliederung der Bilanz (OR 959a) und der Erfolgsrechnung (OR 959b) – Positionen einzeln und in der vorgegebenen Reihenfolge; jedes Zwischentotal und Total der Jahresrechnung mit `rechne` nachrechnen.'
    aufruf: pruefschritt A1-306
    fundstellen:
    - quelle: or__art-959a-t1
      zitat: mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
    - quelle: or__art-959b-t1
      zitat: mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
    - quelle: konzept-ki-revisionsagent-2026__c009-2
      zitat: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.
  - text: 'Import nur simulieren (LoadAccountSystems → LoadImportTemplates → GetImportSimulation). Import-Anfrage anlegen, übernehmen (AcceptImport) oder Konten in 1.1 zuordnen: nie, bis consis entscheidet.'
    aufruf: revio K2
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c006-1
      zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
  - text: Vorzeichen der Passiven prüfen (offener Entscheid enco/revio, ob Importoption oder Excel-Zwischenschritt).
  - text: Zuordnung Konto → Position in der Simulation kontrollieren; unklare Zuordnungen als Pendenz (Konto, Betrag). Die Zuordnung in revio ändert nur der Mensch.
    aufruf: revio K7
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c011-2
      zitat: Unklare Zuordnungen als Pendenz; Halt zur Kontrolle (Testphase)
  - text: 'Bilanzgleichheit (Aktiven = Passiven), Totale, Jahresergebnis und Perioden (Geschäftsjahr/Vorjahr) abstimmen – im Rechenmodul: jede Position der Jahresrechnung mit der Saldoliste, nicht nur die Gesamttotale (ein Gesamttotal kann zufällig stimmen – Praxis/intern); jedes Saldolistenkonto in der Jahresrechnung wiederfinden; beide Werte aus verschiedenen Quellen. Alle Positionen abstimmen, jede Differenz ≠ 0 als eigene Pendenz (Position, Konto, beide Beträge, Differenz); erst nach dem vollständigen Abgleich Halt bis Klärung – keine Prüffelder vorher. Ist der Text der Jahresrechnung tabellarisch zerstückelt (Konto, Bezeichnung und Betrag in getrennten Blöcken), positionsweise über die Saldoliste/Kontonummer lesen (`akte <pfad> --suche "<Kontonummer>"`); unklare Zuordnung → Original prüfen bzw. Pendenz (Praxis/intern).'
    aufruf: rechne "aktiven = …; passiven = …; aktiven - passiven"
    fundstellen:
    - quelle: flussdiagramm-revisionsagent-2026__s001-7
      zitat: Bilanz, Totale, Perioden ok? → Pendenz erfassen – Notiz «Pendenz», Halt bis Klärung (nein)
  - text: Jahresergebnis der Erfolgsrechnung = Jahresergebnis im Eigenkapital der Bilanz = Antrag über die Verwendung des Bilanzergebnisses.
    aufruf: pruefschritt A1-307
  - text: Vorjahreszahlen der Jahresrechnung mit der geprüften Vorjahresrechnung (Vorjahresakte) abstimmen.
    aufruf: pruefschritt A1-302
  - text: Testphase – Halt nach dem Import, WP kontrolliert die Kontenzuordnung, bevor Prüffelder bearbeitet werden.
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c009-3
      zitat: Menschliche Kontrollpunkte. In der Testphase ein Halt nach dem Import, weil eine falsche Kontenzuordnung alle Folgeprüfungen verfälscht.
  fertig_wenn: Simulation stimmt mit der definitiven Jahresrechnung überein (Differenz 0) oder Differenzen als Pendenz; Halt, WP informiert.
  naechste: [planung]
- id: planung
  titel: Planung vorbereiten – Verständnis, Abschlussanalyse, Planungsnotiz, Tor vor Agent-Prozess 2
  stichworte: [planung, pruefplanung, pruefprogramm, pruefplan, strategische planung, planung vorbereiten, risikobeurteilung, abschlussanalyse, unternehmen und umfeld, taetigkeit und umfeld, verstaendnis des unternehmens, tor]
  prozess: "0"
  phase: p2-planung
  ziel: 'Planung für den WP vorbereiten: Verständnis von Unternehmen und Umfeld aktualisieren, Abschlussanalyse rechnen, Planungsnotiz an den WP übergeben und das Tor vor Agent-Prozess 2 prüfen. revio 3 Planung (3.1–3.6) nur lesen; Vorschläge zu Risiko, Wesentlichkeit, Prüfungsplan und Prüfprogramm nur auf Anweisung des WP (Praxis/intern).'
  quelle: konzept-ki-revisionsagent-2026__c006-2
  zitat: 3.1 Risikobeurteilung pro Prüffeld, 3.2 Abschlussanalyse, 3.3 Wesentlichkeit, 3.4 Going concern, 3.5 Strategische Planung
  regeln: [lesen, schreibbereiche, rechenmodul, testphase_halt, pendenz, kunde]
  checkliste:
  - text: 'Voraussetzung: `aufgabe mandat-start` (Kontext, Akte, Vorjahr, Revisionsart, 3.1/3.5 lesen, Wesentlichkeit 3.3) und `aufgabe import` sind erledigt – dort Erledigtes nicht wiederholen, Ergebnisse übernehmen (Praxis/intern). Phase lesen: `prozess p2` (kompakt); Wortlaut der Schritte: `prozess p2 schritte`.'
    aufruf: prozess p2
  - text: 'Verständnis von Unternehmen und Umfeld aktualisieren: Organisation, Geschäftsmodell, Rechnungswesen, Standorte, Eigentümer und nahestehende Personen, Rechnungslegungsrahmen – aus GV-/VR-Protokollen, Vorjahres- und Zwischenabschlüssen und Dauerakte; Änderungen gegenüber dem Vorjahr festhalten. Fragen nie selbst stellen: schriftliche Antworten (10.11) auswerten, sonst Notiz «Pendenz» mit Titel «Frage an Kunde». 2.1 nur lesen.'
    aufruf: akte <pfad> --vj <vj-pfad> --suche "Protokoll|Statuten|Handelsregister|Organigramm"
    fundstellen:
    - quelle: ser-2022__3-1
      zitat: Diese Kenntnisse umfassen beispielsweise die Organisation, die wichtigsten Elemente des Geschäftsmodells, das Rechnungswesen, die Standorte
    - quelle: hwp-er-2026__rz-0026-s182
      zitat: Durchsicht von Vorjahres- und Zwischenabschlüssen sowie Verwaltungsrats- und Generalversammlungsprotokollen
    - quelle: konzept-ki-revisionsagent-2026__c012-1
      zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung)'
  - text: 'Abschlussanalyse: Bilanz und Erfolgsrechnung mit dem Vorjahr (und, wenn vorhanden, mit dem Budget) vergleichen, Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten, Eigenkapitalanteil) mit `rechne`; ungewöhnliche oder unerwartete Abweichungen je Prüffeld als mögliche Risikobereiche für den WP auflisten (Würdigung WP).'
    aufruf: rechne "marge = <Bruttogewinn> / <Umsatz>; marge_vj = <Bruttogewinn VJ> / <Umsatz VJ>; marge - marge_vj"
    fundstellen:
    - quelle: ser-2022__3-2
      zitat: Der Abschlussprüfer muss in der Planungsphase der Prüfung analytische Prüfungshandlungen durchführen
    - quelle: hwp-er-2026__rz-0031-s183
      zitat: Vergleiche wichtiger Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten im Umlaufvermögen, Eigenkapitalanteil etc.)
    - quelle: konzept-ki-revisionsagent-2026__c009-2
      zitat: 'Rechenmodul: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.'
  - text: 'Nur auf Anweisung des WP (Praxis/intern): Entwürfe zu Risikobeurteilung je Prüffeld, Wesentlichkeit (Rechner `wesentlichkeit`), Prüfungsplan und Prüfprogramm – nur in der Planungsnotiz, nie in revio 3.x erfassen. Ohne Anweisung keine Entwürfe; fehlende Unterlagen als Pendenz-Notiz «PBC-Vorschlag» (10.10 nur lesen).'
    aufruf: prozess p2 schritte
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c006-1
      zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
  - text: 'Fortführung und Kapital: Kapitalverlust (Art. 725a OR) und Überschuldung (Art. 725b OR) bei jedem Mandat nach dem Import mit dem Rechner nachrechnen – Werte aus der Bilanz, Verbindlichkeiten unverändert, Covid-Kredit nur mit `--covid-kredit`; Rechnung schon in `aufgabe mandat-start` (Auslöser) erledigt → übernehmen. Befund an den WP (Planungsnotiz), bei Kapitalverlust oder Überschuldung zusätzlich `aufgabe kapitalschutz`.'
    aufruf: kapitalverlust --aktienkapital … --aktiven … --verbindlichkeiten … --kapitalreserve … --gewinnreserve … [--reserve-voll …] [--covid-kredit …]
    fundstellen:
    - quelle: or__art-725a
      zitat: Zeigt die letzte Jahresrechnung, dass die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve nicht mehr decken
  - text: 'Planungsnotiz an den WP – als Entwurf in der Antwort bzw. im Rapport und im Agenten-Protokoll (Praxis/intern), nicht als revio-Notiz und nie in revio 3.x: Revisionspflicht mit Zahlen GJ/VJ, Unabhängigkeit/Mitwirkung (Angabe WP), Verständnis, Ergebnisse der Analytik, Befund Fortführung und Kapital (Punkt davor), angewiesene Entwürfe – je mit Quelle (M-Files-ID). Nur offene Punkte als revio-Notiz «Pendenz» bzw. Themen für den Kunden als «Schlussbesprechung» im Bereich 4 des betroffenen Prüffelds bzw. in 10.x (`revio K7`). Kein Visum.'
    aufruf: revio K7
    fundstellen:
    - quelle: ser-2022__7-1
      zitat: Zu dokumentieren sind insbesondere die Planung und die Durchführung der Prüfungsarbeiten.
    - quelle: ser-2022__7-2
      zitat: das inhärente Risiko sowie der darauf basierende Prüfungsplan;
  - text: 'Tor vor Agent-Prozess 2 (Ergebnis ins Agenten-Protokoll): (1) Testphase: Importkontrolle durch den WP erfolgt? Sonst Halt und Pendenz. (2) Wesentlichkeit 3.3 erfasst und gelesen? Ergebnis aus `aufgabe mandat-start` (Punkt Wesentlichkeit) übernehmen – nur falls dort nicht gelesen: `aufgabe wesentlichkeit`; fehlt 3.3: Pendenz und keine Prüffelder beginnen. (3) 3.1/3.5 gelesen? Fehlen Leserecht oder Eintrag: Pendenz, keine Annahme zu Risiko oder Strategie, nur die vom WP markierten bzw. angewiesenen Prüfschritte bearbeiten.'
    fundstellen:
    - quelle: konzept-ki-revisionsagent-2026__c009-3
      zitat: In der Testphase ein Halt nach dem Import, weil eine falsche Kontenzuordnung alle Folgeprüfungen verfälscht.
    - quelle: konzept-ki-revisionsagent-2026__c014-1
      zitat: 'Toleranzwesentlichkeit (75 %): steuert Prüfumfang und Stichprobe.'
    - quelle: konzept-ki-revisionsagent-2026__c012-1
      zitat: Risiko und Strategie aus 3.1 und 3.5 berücksichtigen
  fertig_wenn: Planungsnotiz (Verständnis, Analytik, Fortführung/Kapital; Entwürfe nur auf Anweisung) beim WP, offene Punkte als Notiz «Pendenz», Tor-Ergebnis im Agenten-Protokoll.
