- id: notiz
  titel: Notiz, Pendenz, Feststellung oder Buchungsvorschlag erfassen
  stichworte: [notiz, pendenz, feststellung, wesentliche feststellung, buchungsvorschlag, schlussbesprechung, beilage, fehlt, fehlende, nachfrage, frage an kunde]
  prozess: "2"
  phase: p3-durchfuehrung
  ziel: Jede offene Frage, fehlende Unterlage und jeden möglichen Fehler in der richtigen Notizkategorie erfassen – mit Konto, Datum, Betrag, Verweis auf den Schritt; Nachweis als Beilage.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Notizen löscht oder erledigt er nie.
  regeln: [pendenz, wesentliche_feststellungen, schlussbesprechung, review, nie_loeschen, beilage, buchung, nichtaufgriff]
  checkliste:
  - text: 'Kategorie wählen: Pendenz (fehlt/ungeklärt) · Wesentliche Feststellungen (möglicher Fehler + begründeter Buchungsvorschlag, keine Verbuchung) · Schlussbesprechung (Punkt für WP–Kunde) · Review: nie (gehört dem WP).'
  - text: 'Inhalt: Prüffeld und Schritt-Id, Konto, Datum, Betrag (im Rechenmodul gerechnet), Sachverhalt, Nachweis (M-Files-ID), bei Feststellung Buchungsvorschlag «Soll / Haben / Betrag».'
    aufruf: rechne "…"
  - text: Differenzen unter der Nichtaufgriffsgrenze nur im Textfeld protokollieren (keine Notiz), ausser qualitative Gründe.
  - text: Notiz in revio erfassen und Beilage anhängen.
    aufruf: revio K7
  fertig_wenn: Notiz mit Kategorie, Verweis, Betrag und Beilage erfasst; nichts gelöscht oder erledigt.
