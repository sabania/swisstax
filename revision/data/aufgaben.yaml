  - text: Keine Unterzeichnung, keine Datierung; Entwurf im Rapport melden.
  fertig_wenn: GVB-Entwurf mit aktualisierten Zahlen liegt in M-Files, Abweichungen vom Normalwortlaut sind für den WP markiert.
  naechste: [pdf-akte]
