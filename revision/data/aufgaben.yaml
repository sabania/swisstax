  titel: Prozess 5 – Bericht an die Generalversammlung (Entwurf)
  stichworte: [gvb, bericht, revisionsbericht, generalversammlung, deckblatt, berichtstext, prozess 5, normalwortlaut, hinweis, einschraenkung]
  prozess: "5"
  phase: p5-bericht
  ziel: Vorjahres-Deckblatt und -Berichtstext kopieren, Jahreszahlen, Stichtage und Jahresergebnis aktualisieren, gegen 7.1 Berichtsstrategie und 7.5 Berichtskritik prüfen – ohne Unterzeichnung und Datierung.
