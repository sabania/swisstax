  quelle: ser-2022__8-3-2-t1
  zitat: Hinweise auf Gesetzesverstösse ausserhalb des Prüfungsgegenstands im Zusammenhang mit der Untätigkeit des Verwaltungsrates bei Vorliegen eines hälftigen Kapitalverlusts (Art. 725a OR) oder einer
    Überschuldung (Art. 725b OR) sind in jedem Fall im
- bereich: gesetz
  key: or725_zahlungsfaehigkeit
  regel: 'Drohende Zahlungsunfähigkeit (OR 725): VR überwacht die Zahlungsfähigkeit und ergreift Massnahmen.'
  quelle: or__art-725
  zitat: Der Verwaltungsrat überwacht die Zahlungsfähigkeit der Gesellschaft.
- bereich: gesetz
  key: or729a_umfang
  regel: 'Prüfungsumfang eingeschränkte Revision (OR 729a Abs. 2): Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.'
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- bereich: gesetz
  key: or729a_gegenstand
  regel: 'Gegenstand (OR 729a Abs. 1): Jahresrechnung und Antrag über die Verwendung des Bilanzgewinns; Geschäftsführung des VR ist nicht Gegenstand (Abs. 3).'
  quelle: or__art-729a
  zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
- bereich: gesetz
  key: or729b_bericht
  regel: Zusammenfassender Bericht an die GV (OR 729b) – unterzeichnet von der Person, die die Revision geleitet hat (nie der Agent).
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- bereich: gesetz
  key: or730b_geheimnis
  regel: 'Geheimhaltung (OR 730b Abs. 2): die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen.'
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen
- bereich: gesetz
  key: stgb321_berufsgeheimnis
  regel: 'Berufsgeheimnis (StGB 321 Ziff. 1): Nach OR zur Verschwiegenheit verpflichtete Revisoren und ihre Hilfspersonen, die ein im Beruf anvertrautes oder wahrgenommenes Geheimnis offenbaren, werden
    auf Antrag mit Freiheitsstrafe bis zu drei Jahren oder Geldstrafe bestraft; strafbar auch nach Beendigung der Berufsausübung.'
  quelle: stgb__art-321
  zitat: sowie ihre Hilfspersonen, die ein Geheimnis offenbaren
- bereich: gesetz
  key: or730c_aufbewahrung
  regel: 'Dokumentation und Aufbewahrung (OR 730c): alle Revisionsdienstleistungen dokumentieren; Berichte und wesentliche Unterlagen mindestens zehn Jahre aufbewahren.'
  quelle: or__art-730c
  zitat: Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- bereich: gesetz
  key: or727_ordentlich
  regel: 'Ordentliche Revision (OR 727), wenn: Publikumsgesellschaft (Abs. 1 Ziff. 1); zwei der Grössen Bilanzsumme 20 Mio., Umsatzerlös 40 Mio., 250 Vollzeitstellen im Jahresdurchschnitt in zwei aufeinander
    folgenden Geschäftsjahren überschritten (Ziff. 2); Pflicht zur Konzernrechnung (Ziff. 3); Aktionäre mit zusammen mind. 10 % des AK verlangen es (Abs. 2); Statuten oder GV sehen es vor (Abs. 3).'
  quelle: or__art-727
  zitat: Gesellschaften, die zwei der nachstehenden Grössen in zwei aufeinander folgenden Geschäftsjahren überschreiten
- bereich: gesetz
  key: or727a_eingeschraenkt
  regel: 'Sonst eingeschränkte Revision (OR 727a Abs. 1). Opting-out: Zustimmung sämtlicher Aktionäre und höchstens zehn Vollzeitstellen im Jahresdurchschnitt; gilt nur für künftige Geschäftsjahre, Anmeldung
    beim Handelsregisteramt vor Beginn des Geschäftsjahres (Abs. 2; Beilage Jahresrechnung Abs. 2bis; Erklärung und Beilagen nach HRegV 62 ^[hregv__art-62-t1]); jeder Aktionär kann spätestens zehn
    Tage vor der GV eine eingeschränkte Revision verlangen (Abs. 4).'
  quelle: or__art-727a
  zitat: Mit der Zustimmung sämtlicher Aktionäre kann auf die eingeschränkte Revision verzichtet werden, wenn die Gesellschaft nicht mehr als zehn Vollzeitstellen im Jahresdurchschnitt hat.
- bereich: gesetz
  key: or729_mitwirkung
  regel: 'Mitwirken bei der Buchführung und andere Dienstleistungen zulässig; bei Risiko der Selbstprüfung organisatorische und personelle Massnahmen (OR 729 Abs. 2).'
  quelle: or__art-729
  zitat: Sofern das Risiko der Überprüfung eigener Arbeiten entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.
- bereich: wesentlichkeit
  key: hwp_toleranz
  regel: 'Toleranzwesentlichkeit in der Regel 50–75 % der Gesamtwesentlichkeit (HWP ER Rz 50); dient zur Beurteilung der Risiken auf Aussagenebene und für Art, Zeitpunkt und Umfang der Prüfungshandlungen.
    Für den Agenten nur zur Plausibilisierung von 3.3: Satz ausserhalb 50–75 % ohne Begründung → Pendenz (Regel plausibel).'
  quelle: hwp-er-2026__rz-0050-s187
  zitat: beträgt die Toleranzwesentlichkeit in der Regel zwischen 50 % und 75 % der Gesamtwesentlichkeit.
- bereich: wesentlichkeit
  key: hwp_toleranz_zweck
  regel: Toleranzwesentlichkeit liegt unter der Gesamtwesentlichkeit wegen des Aggregationsrisikos (einzeln unwesentliche Fehler können zusammen wesentlich sein).
  quelle: ser-2022__5-2-t2
  zitat: Um diesem sogenannten Aggregationsrisiko Rechnung zu tragen, legt der Abschlussprüfer eine entsprechend tiefere Toleranzwesentlichkeit fest.
- bereich: wesentlichkeit
  key: hwp_nag
  regel: Nichtaufgriffsgrenze bis zu 5 % der Gesamtwesentlichkeit (HWP ER Rz 51); darunter keine Erfassung in der Zusammenstellung der Fehlaussagen.
  quelle: hwp-er-2026__rz-0051-s187
  zitat: Sie kann bis zu 5 % der Gesamtwesentlichkeit betragen.
- bereich: wesentlichkeit
  key: hwp_kumulieren
  regel: 'Fehlaussagen über der Nichtaufgriffsgrenze werden erfasst, kumuliert und laufend auf Wesentlichkeit beurteilt (HWP ER Rz 53). Ob eine Feststellung wesentlich ist, entscheidet der WP (Ermessen
    des Abschlussprüfers); der Agent erfasst und summiert nur (`rechne`).'
  quelle: hwp-er-2026__rz-0053-s189
  zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert und laufend dahingehend beurteilt, ob sie zu einer wesentlichen
    Fehlaussage führen. Die Beurteilung, ob eine Feststellung wesentlich ist, liegt im professionellen Ermessen des Abschlussprüfers.
- bereich: gesetz
  key: hwp_kombination
  regel: 'Revisionspflicht: Im Berichts- und Vorjahr müssen nicht dieselben zwei Grössen überschritten sein (HWP ER Rz 309).'
  quelle: hwp-er-2026__rz-0309-s098
  zitat: ist es nicht erforderlich, dass im Berichts- und im Vorjahr die gleichen beiden Referenzgrössen die massgeblichen Schwellenwerte überschreiten
- bereich: gesetz
  key: hwp_optingout_vzs
