    zitat: ggf. Offenlegung einer wesentlichen Nettoauflösung im Anhang
- id: F1-321
  vorgehen: Stille Reserven auf Vorräten (Warendrittel, zusätzliche sowie beibehaltene, nicht mehr begründete Wertberichtigungen) per Stichtag und Vorjahr aus der Aufstellung des Kunden
    übernehmen und mit Inventarliste/Wertberichtigungskonto abstimmen. Veränderung (Bildung/Auflösung) berechnen, in die Gesamtaufstellung stille Reserven übertragen und für die Nettoauflösung
    in F1-320 vormerken.
  nachweise:
  - Aufstellung stille Reserven des Kunden
  - Berechnung Wertberichtigung (betriebsnotwendig vs. steuerlich)
  - Vollständigkeitserklärung
  rechnen: Stille Reserve = Wertberichtigung total − betriebsnotwendige Wertberichtigung (unkurant/verlustfreie Bewertung); Veränderung = Reserve GJ − Reserve VJ (negativ = Auflösung)
  feststellung_wenn: Aufstellung fehlt oder stimmt nicht mit Inventar/Wertberichtigung überein, oder wesentliche Nettoauflösung ohne Anhangsangabe.
