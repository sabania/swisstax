# Prüffeld F1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: F1
bezeichnung: Vorräte
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 12
    korrigiert: false
kurzbeschrieb: 'Vorräte (Rohmaterial, Handelswaren, Halb-/Fertigfabrikate, Verbrauchsmaterial) inkl. Wertberichtigungen. Eingeschränkte Revision: Bestand via Inventarliste/Inventurunterlagen
  und Abstimmung Hauptbuch, Bewertung zu AK/HK bzw. tieferem Netto-Veräusserungswert (Art. 960c OR), Abgrenzung, Fremdware, Anhang, stille Reserven (Warendrittel). Keine Inventurbeobachtung,
  keine Drittbestätigungen.'
gesetz:
- thema: 'Mindestgliederung: Position «Vorräte und nicht fakturierte Dienstleistungen» im Umlaufvermögen (Art. 959a Abs. 1 Ziff. 1 lit. d OR)'
  quelle: or__art-959a-t1
  zitat: d. Vorräte und nicht fakturierte Dienstleistungen
- thema: Begriff Vorräte (Art. 960c Abs. 2 OR)
  quelle: or__art-960c
  zitat: Als Vorräte gelten Rohmaterial, Erzeugnisse in Arbeit, fertige Erzeugnisse und Handelswaren.
- thema: Niederstwertprinzip / verlustfreie Bewertung in der Folgebewertung (Art. 960c Abs. 1 OR)
  quelle: or__art-960c
  zitat: der Veräusserungswert unter Berücksichtigung noch anfallender Kosten am Bilanzstichtag unter den Anschaffungs- oder Herstellungskosten, so muss dieser Wert eingesetzt werden
- thema: Höchstwert bei Ersterfassung (Art. 960a Abs. 1 OR)
  quelle: or__art-960a
  zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- thema: Höchstwert in der Folgebewertung (Art. 960a Abs. 2 OR)
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Wertberichtigungen für anderweitige Wertverluste, aktivseitig abzusetzen (Art. 960a Abs. 3 OR)
  quelle: or__art-960a
  zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
- thema: Zusätzliche Wertberichtigungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Einzel- vs. Gruppenbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet, sofern sie wesentlich sind
- thema: Vorsichtige Bewertung (Art. 960 Abs. 2 OR)
  quelle: or__art-960
  zitat: Die Bewertung muss vorsichtig erfolgen, darf aber die zuverlässige Beurteilung der wirtschaftlichen Lage des Unternehmens nicht verhindern.
- thema: Überprüfung bei Anzeichen einer Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Bestandsnachweis durch Inventar (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Stetigkeit in Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Periodenabgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erfolgsrechnung: Bestandesänderungen (Art. 959b Abs. 2 Ziff. 2 OR)'
  quelle: or__art-959b-t1
  zitat: Bestandesänderungen an unfertigen und fertigen Erzeugnissen sowie an nicht fakturierten Dienstleistungen
- thema: 'Anhang: angewandte Grundsätze (Art. 959c Abs. 1 Ziff. 1 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: verpfändete Aktiven und Aktiven unter Eigentumsvorbehalt (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
risiken:
- text: 'Ausgewiesene Vorräte sind physisch nicht (mehr) vorhanden: Schwund, Zähl- oder Übertragungsfehler von der Zählliste in die Inventarliste, ungeklärte Inventurdifferenzen.'
  pruefziele:
  - EX
  - RI
  quelle: hwp-bur-2023__rz-0204-s205
  zitat: Differenzen sind abzuklären und zu bereinigen.
- text: Falsche Periodenabgrenzung von Wareneingängen/-ausgängen um den Stichtag (Ware im Inventar ohne Verbindlichkeit bzw. umgekehrt; Waren in Transit).
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0204-s205
  zitat: Bei der Inventur ist der korrekten Abgrenzung besondere Beachtung zu schenken.
- text: 'Doppelerfassung: bereits fakturierte, noch nicht ausgelieferte Ware zusätzlich im Inventar; Material auf Baustellen sowohl im Inventar als auch in den angefangenen Arbeiten
    (F2).'
  pruefziele:
  - EX
  - PA
  quelle: hwp-bur-2023__rz-0234-s209
  zitat: Sofern diese Ware bereits als Forderung gebucht ist, darf sie nicht zusätzlich in der Position Vorräte
- text: Fremdware (Kommissions-/Konsignationsware Dritter, Kundeneigentum) im Inventar aktiviert; eigene Ware bei Dritten oder in Konsignation fehlt im Inventar.
  pruefziele:
  - RV
  - VO
  quelle: hwp-bur-2023__rz-0214-s207
  zitat: In Kommission genommene Waren dürfen grundsätzlich nicht aktiviert werden
- text: Überbewertung unkuranter, überalterter oder langsam drehender Ware; Netto-Veräusserungswert unter AK/HK nicht berücksichtigt.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0249-s213
  zitat: Für unkurante Artikel ist eine Bewertungskorrektur unerlässlich
- text: Verlustfreie Bewertung bei Produktkategorien mit tiefer oder negativer Marge nicht sichergestellt.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0246-s212
  zitat: Sind die Anschaffungs- oder Herstellungskosten höher als dieser Vergleichswert, ist eine entsprechende Wertberichtigung vorzunehmen (verlustfreie Bewertung).
- text: Einstandspreise falsch ermittelt (Rabatte nicht abgezogen, Finanzierungskosten aktiviert, veraltete Preise, Methode FIFO/Durchschnitt falsch angewandt).
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0219-s207
  zitat: Die Kosten einer Finanzierung des Wareneinkaufs durch Wechsel oder verzinsliche Lieferantenkredite dürfen nicht den Anschaffungskosten zugerechnet werden.
- text: Herstellkosten enthalten nicht aktivierbare Verwaltungs-/Vertriebskosten oder Kosten der Unterbeschäftigung.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0222-s208
  zitat: durch Unterbeschäftigung entstehende Mehrkosten dürfen den Fertigungsgemeinkosten der Vorräte nicht zugerechnet werden
- text: Unbegründeter oder nicht offengelegter Wechsel der Bewertungsmethode bzw. des Kalkulationsschemas.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden
- text: Rechen- und Additionsfehler in der Inventarliste (Menge × Preis, Zwischen- und Gesamttotale). Fundstelle aus HWP OR (nur ergänzend).
  pruefziele:
  - RI
  - BE
  quelle: hwp-or-2024__rz-0901-s348-t1
  zitat: Prüfung der mathematischen Richtigkeit der Bewertung
- text: Abbau des Warendrittels bzw. Auflösung zusätzlicher Wertberichtigungen führt zu einer offenlegungspflichtigen Nettoauflösung stiller Reserven, die im Anhang fehlt.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0759-s320
  zitat: zwangsläufig zu einer Auflösung stiller Reserven
- text: Verpfändete Vorräte (z.B. Faustpfand) oder Ware unter Eigentumsvorbehalt nicht im Anhang angegeben.
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0845-s349
  zitat: Warenlager (Faustpfand)
unterlagen:
- dokument: Bewertete Inventarliste per Bilanzstichtag (Menge, Preis, Wert, Totale je Konto, Wertberichtigungen) inkl. Vorjahresinventar
  zweck: Bestandsnachweis, Abstimmung Hauptbuch, Bewertung, rechnerische Prüfung, VJ-Vergleich (F1-201/203/301/302/405)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- dokument: Inventurinstruktion, Inventurprotokoll, unterzeichnete Zähllisten, Differenzliste
  zweck: Beurteilung Inventur, Abgleich Zählliste/Inventarliste, Inventurdifferenzen (F1-101/102/401/403)
  quelle: hwp-bur-2023__rz-0204-s205
  zitat: Eine genaue Inventurinstruktion kann Mängeln vorbeugen
- dokument: Lagerbuchhaltung bzw. Nachweise permanente Inventur (Zählplan, Zählprotokolle, Fortschreibung auf Stichtag)
  zweck: Bestandsnachweis ohne Stichtagsinventur (F1-103/402)
  quelle: hwp-bur-2023__rz-0204-s205
  zitat: Bei vorhandener Lagerbuchhaltung besteht neben der Stichtagsinventur die Möglichkeit der permanenten Inventur
- dokument: Lagerumschlags-/Altersliste (letzte Bewegung, letzte Bestellung) und Berechnung der Wertberichtigung unkurant
  zweck: Ladenhüter, Überalterung, Überbestände (F1-106/203/204)
  quelle: hwp-bur-2023__rz-0249-s213
  zitat: Die Höhe der Korrektur richtet sich im Allgemeinen nach der Umschlagshäufigkeit
- dokument: Lieferantenrechnungen der letzten Einkäufe zu ausgewählten Inventarpositionen
  zweck: Prüfung Einstandspreise (F1-302)
  quelle: ser-2022__6-1-3
  zitat: Bewertungsprüfungen können etwa mittels Belegprüfungen, Abstimmung mit Preislisten usw. durchgeführt werden.
- dokument: Verkaufspreislisten, Verkaufsrechnungen nach Stichtag, Margenauswertung je Produktkategorie
