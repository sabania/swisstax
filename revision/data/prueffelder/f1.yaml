  - Bilanz
  rechnen: 'Je Zeile: Menge × Preis = Inventarwert (jede Abweichung mit Artikel und Betrag); Σ Zeilen je Konto = ausgewiesenes Kontototal = Saldo Hauptbuchkonto; Σ Kontototale − Wertberichtigung
    = Bilanzposition Vorräte netto'
  feststellung_wenn: Zeilen- oder Additionsfehler in der Inventarliste, Differenz zwischen Inventarliste und Hauptbuch oder Vorratskonto mit Saldo ohne Inventarnachweis.
