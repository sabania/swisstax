  quelle: hwp-bur-2023__rz-0249-s213
  zitat: Die Höhe der Korrektur richtet sich im Allgemeinen nach der Umschlagshäufigkeit
- dokument: Nachweise zu Entsorgungs-/Recyclingkosten unverkäuflicher Ware (Offerten, Verträge) bzw. Rückstellungsberechnung
  zweck: Rückstellung für künftige Entsorgungskosten unkuranter Ware (F1-106)
  quelle: hwp-bur-2023__rz-0249-s213
  zitat: nötigenfalls noch eine zusätzliche Rückstellung für künftig anfallende Entsorgungskosten zu bilden
- dokument: Lieferantenrechnungen der letzten Einkäufe zu ausgewählten Inventarpositionen bzw. Berechnung gewichteter Durchschnittspreis
  zweck: Prüfung Einstandspreise nach gewählter Methode (F1-302)
  quelle: ser-2022__6-1-3
  zitat: Bewertungsprüfungen können etwa mittels Belegprüfungen, Abstimmung mit Preislisten usw. durchgeführt werden.
- dokument: Verkaufspreislisten, Verkaufsrechnungen nach Stichtag, Margenauswertung je Produktkategorie, aktuelle Beschaffungspreise für Rohmaterial
  zweck: Niederstwert und verlustfreie Bewertung, Margenanalyse (F1-104/107/202/304)
  quelle: hwp-bur-2023__rz-0245-s212
  zitat: Zur Beurteilung, ob der Preis des Absatzmarkts abzüglich Verwaltungs- und Vertriebskosten tiefer ist als die Anschaffungs- oder Herstellungskosten, dient die Rückrechnung.
- dokument: Kalkulationen und Kostenrechnung/Betriebsabrechnung (bei eigener Herstellung)
  zweck: Abstimmung Herstellkosten (F1-105/303)
  quelle: ser-2022__anh-d-s079-1
  zitat: Abstimmung der Herstellkostenwerte mit den Unterlagen der Kalkulation und Kostenrechnung
- dokument: Lieferscheine/Wareneingänge, Lieferverträge (Incoterms) und Ein-/Ausgangsrechnungen der letzten Dezember- und ersten Januartage, Kreditorenjournal Folgejahr
  zweck: Cut-off, Übergang von Nutzen und Gefahr, Waren in Transit (F1-108/109)
