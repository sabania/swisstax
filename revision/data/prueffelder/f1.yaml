- id: F1-320
  vorgehen: Prüfen, ob der Anhang die Bewertungsgrundsätze der Vorräte (soweit nicht gesetzlich vorgeschrieben), allfällige Methodenwechsel, verpfändete Vorräte bzw. Vorräte unter Eigentumsvorbehalt
    und eine Nettoauflösung stiller Reserven (Auflösung > Neubildung, z.B. Abbau Warendrittel), die das Ergebnis wesentlich günstiger darstellt, korrekt enthält. Abweichungen zu F1-104/105/111/321
    im Textfeld festhalten.
  nachweise:
  - Anhang Jahresrechnung
  - Ergebnisse F1-104, F1-105, F1-111, F1-321
  - Gesamtaufstellung stille Reserven
  rechnen: Nettoauflösung = Σ aufgelöste stille Reserven − Σ neu gebildete stille Reserven (Gesamtaufstellung über alle Positionen); Anhangsangabe nötig, wenn > 0 und das Ergebnis dadurch
    wesentlich günstiger dargestellt wird
  feststellung_wenn: Pflichtangabe fehlt/falsch (Bewertungsgrundsätze, Methodenwechsel, Verpfändung/Eigentumsvorbehalt) oder Nettoauflösung (Auflösung > Neubildung), die das Ergebnis
    wesentlich günstiger darstellt, ohne Anhangsangabe.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
  - quelle: or__art-959c-t1
    zitat: wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
