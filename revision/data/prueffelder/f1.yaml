schritte:
- id: F1-101
  vorgehen: 'Schriftliche Antwort der Leitung Finanzen/Lager zur Bestandesermittlung auswerten: Stichtags- oder permanente Inventur, Lagerbuchhaltung (mengen-/wertmässig), einbezogene
    Lagerorte inkl. Fremdlager, Zähl- und Übertragungsprozess. Antwort mit Inventurprotokoll abgleichen und im Textfeld zusammenfassen; fehlt sie, Frage als Pendenz erfassen.'
  nachweise:
  - Schriftliche Antwort Befragung Bestandesermittlung
  - Inventurprotokoll
  - Inventurinstruktion
  rechnen: ''
  feststellung_wenn: Keine nachvollziehbare Bestandesermittlung per Stichtag (weder Inventur noch verlässliche Lagerbuchhaltung) oder Angaben widersprechen dem Inventurprotokoll.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über die Methode der Bestandsermittlung
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Die Bestandsermittlung erfolgt entweder durch Inventur oder durch Übernahme der Bestände aus der Lagerbuchhaltung.
- id: F1-102
  vorgehen: 'Inventurdifferenzen (Buchbestand vs. Zählung) der letzten physischen Aufnahme und die daraus verbuchten Korrekturen erfragen: Höhe je Kategorie, Ursachen, Verbuchung, Genehmigung.
    Differenzliste und Korrekturbuchung im Kontoblatt (Bestandesänderung per Stichtag) einsehen und nachvollziehen; wiederkehrende oder ungeklärte Differenzen im Textfeld festhalten.'
  nachweise:
  - Differenzliste Inventur
  - Kontoblätter Vorräte (Korrekturbuchung)
  - Schriftliche Antwort
  rechnen: Inventurdifferenz = Buchbestand vor Korrektur − Inventarwert; verbuchte Korrektur = Inventurdifferenz
  feststellung_wenn: Wesentliche Inventurdifferenzen ungeklärt, nicht oder falsch verbucht, oder Korrektur ohne Beleg bzw. Genehmigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Besprechung von Korrekturen aufgrund der letzten physischen Bestandsaufnahme
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Differenzen sind abzuklären und zu bereinigen.
- id: F1-103
  vorgehen: 'Nur wenn per Bilanzstichtag nicht physisch aufgenommen wurde: erfragen, ob eine Lagerbuchhaltung mit permanenter Inventur besteht, wie oft welche Artikel gezählt und wie
    Differenzen bereinigt werden; Zählnachweise des Jahres anfordern. Bei vor-/nachverlegter Inventur Fortschreibung bzw. Rückrechnung auf den Stichtag nachvollziehen. Sonst «nicht anwendbar
    (Stichtagsinventur)» dokumentieren.'
  nachweise:
  - Zählplan und Zählprotokolle permanente Inventur
  - Lagerbuchhaltung
  - Fortschreibung/Rückrechnung auf Bilanzstichtag
  rechnen: Bestand Bilanzstichtag = Bestand Inventurtag ± Zu-/Abgänge zwischen Inventurtag und Bilanzstichtag
  feststellung_wenn: Weder Stichtagsinventur noch verlässliche permanente Inventur, oder Fortschreibung auf den Bilanzstichtag fehlt bzw. ist nicht nachvollziehbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: ein System der permanenten Inventur eingesetzt wird und ein periodischer Vergleich mit tatsächlich vorhandenen Mengen stattfindet
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Bei vorhandener Lagerbuchhaltung besteht neben der Stichtagsinventur die Möglichkeit der permanenten Inventur
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: ist eine einwandfreie Fortschreibung oder Rückrechnung auf den Bilanzstichtag sicherzustellen
- id: F1-104
  vorgehen: Bewertungsgrundlage je Vorratskategorie erfragen (effektiver Einstandspreis, FIFO, gleitender Durchschnitt, Herstell-/Standardkosten) und mit dem Anhang abgleichen. In der
    Inventarliste je Position Inventarpreis mit Markt-/Verkaufspreis abzüglich noch anfallender Kosten vergleichen; Positionen mit tieferem Netto-Veräusserungswert und deren Wertberichtigung
    im Textfeld auflisten.
  nachweise:
  - Schriftliche Antwort Bewertungsgrundsätze
  - Inventarliste mit Einstands- und Markt-/Verkaufspreisen
  - Anhang (Bewertungsgrundsätze)
  rechnen: 'Je Position: Wertberichtigungsbedarf = max(0; Menge × AK/HK − Menge × (Verkaufspreis − Erlösminderungen − noch anfallende Kosten)); Σ Bedarf vs. verbuchte Wertberichtigung'
  feststellung_wenn: Bewertungsgrundlage unklar oder im Anhang abweichend beschrieben, oder Positionen mit Netto-Veräusserungswert unter AK/HK ohne ausreichende Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über die Grundlagen der Bewertung in den einzelnen Kategorien
  - quelle: ser-2022__anh-d-s078-2
    zitat: Feststellung, ob das Niederstwertprinzip befolgt worden ist
  - quelle: or__art-960c
    zitat: der Veräusserungswert unter Berücksichtigung noch anfallender Kosten am Bilanzstichtag unter den Anschaffungs- oder Herstellungskosten, so muss dieser Wert eingesetzt werden
- id: F1-105
  vorgehen: Erfragen, ob Bewertungsmethode und Kalkulationsschema (Material, Löhne, Gemeinkostenzuschläge) gegenüber dem Vorjahr unverändert sind, ob eine Kostenrechnung/Betriebsbuchhaltung
    besteht und ob sie verlässlich war (Nachkalkulationen). Antwort mit Vorjahres-/Dauerakte und Anhang abgleichen; Methodenwechsel mit Begründung und Anhangsangabe im Textfeld dokumentieren.
  nachweise:
  - Schriftliche Antwort
  - Kalkulationsschema GJ/VJ
  - Dauerakte Bewertungsgrundsätze
  - Anhang
  rechnen: ''
  feststellung_wenn: Methoden- oder Kalkulationswechsel ohne Begründung bzw. Anhangsangabe, oder Kostenrechnung erweist sich als unzuverlässige Bewertungsgrundlage.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: unter Berücksichtigung von Faktoren wie Material, Saläre und Gemeinkosten stetig angewandt worden
  - quelle: hwp-bur-2023__rz-0059-s070
    zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- id: F1-106
  vorgehen: Erfragen, wie Ladenhüter und überalterte Artikel erkannt werden (Lagerumschlag, letzte Bewegung/Bestellung, technische Überalterung) und wie der Wertberichtigungssatz festgelegt
    wird. Lagerumschlags-/Altersliste anfordern und prüfen, ob die betroffenen Positionen zum Netto-Veräusserungswert bewertet sind; Methode und Ergebnis im Textfeld festhalten.
  nachweise:
  - Lagerumschlags-/Altersliste
  - Berechnung Wertberichtigung unkurant
  - Schriftliche Antwort
  rechnen: Umschlagshäufigkeit = Abgänge zu AK / Ø Lagerbestand; WB unkurant = Σ (AK − Netto-Veräusserungswert) × Menge der identifizierten Artikel
  feststellung_wenn: Keine Methode zur Erkennung unkuranter Ware oder identifizierte Ladenhüter nicht auf den Netto-Veräusserungswert wertberichtigt.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über die angewandte Methode zur Feststellung von Vorräten mit geringem Lagerumschlag und überalterten Vorräten
  - quelle: ser-2022__anh-d-s078-2
    zitat: netto realisierbaren Wert bewertet sind
  - quelle: hwp-bur-2023__rz-0249-s213
    zitat: Die Höhe der Korrektur richtet sich im Allgemeinen nach der Umschlagshäufigkeit
- id: F1-107
  vorgehen: Erfragen, wie bei Produktkategorien mit tiefer oder negativer Marge sichergestellt wird, dass der Bilanzwert den erzielbaren Erlös abzüglich Erlösminderungen und noch anfallender
    Kosten nicht übersteigt (Rückrechnung). Margenauswertung je Kategorie und Verkaufspreise nach Stichtag anfordern; Antwort im Textfeld, Nachrechnung in F1-304.
  nachweise:
  - Margenauswertung je Produktkategorie
  - Verkaufspreislisten/Verkaufsrechnungen nach Stichtag
  - Schriftliche Antwort
  rechnen: Vergleichswert = Verkaufspreis − Erlösschmälerungen − Vertriebs-/Verwaltungskosten (− noch anfallende Herstellkosten)
  feststellung_wenn: Keine Rückrechnung für margenschwache Kategorien oder Hinweise auf Verkaufspreise unter AK/HK ohne Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung, wie die verlustfreie Bewertung von Produktkategorien mit geringer Marge
  - quelle: hwp-bur-2023__rz-0246-s212
    zitat: Sind die Anschaffungs- oder Herstellungskosten höher als dieser Vergleichswert, ist eine entsprechende Wertberichtigung vorzunehmen (verlustfreie Bewertung).
- id: F1-108
  vorgehen: 'Erfragen, wie Wareneingänge, Warenausgänge und Verbräuche (Einkauf, Verkauf, Betriebsbuchhaltung) laufend und periodengerecht erfasst werden: massgeblicher Zeitpunkt (Wareneingang,
    Rechnung, Übergang von Nutzen und Gefahr/Incoterms), Waren in Transit, Abstimmung Lager- mit Finanzbuchhaltung. Antwort im Textfeld zusammenfassen; fehlt sie, Pendenz.'
  nachweise:
  - Schriftliche Antwort
  - Prozessbeschrieb Wareneingang/-ausgang
  - Abstimmung Lager-/Finanzbuchhaltung
  rechnen: ''
  feststellung_wenn: Kein geregeltes Vorgehen zur periodengerechten Erfassung von Vorratsbewegungen bei wesentlichen Beständen oder keine Abstimmung Lager-/Finanzbuchhaltung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0210-s206
    zitat: Der Übergang von Nutzen und Gefahr ist für die Aktivierungsfähigkeit in der Regel ausschlaggebend
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- id: F1-109
  vorgehen: 'Cut-off per Stichtag erfragen (Lagersperre, letzte Lieferscheine, Waren in Transit, Material auf Baustellen). Wareneingänge/Eingangsrechnungen und Auslieferungen der letzten
    Dezember- und ersten Januartage mit Inventarliste, Kreditoren und Debitoren abgleichen: Ware im Inventar nur mit Verbindlichkeit im alten Jahr; fakturierte, ausgelieferte Ware nicht
    mehr im Inventar. Abweichungen im Textfeld.'
  nachweise:
  - Inventurprotokoll (Lagersperre)
  - Lieferscheine/Wareneingänge Dez./Jan.
  - Kreditorenjournal Januar Folgejahr
  - Ausgangsrechnungen um den Stichtag
  rechnen: 'Je Beleg: Lieferdatum ≤ 31.12. ⇒ Ware im Inventar bzw. Verbindlichkeit/Aufwand im alten Jahr; Lieferdatum > 31.12. ⇒ weder Inventar noch Verbindlichkeit im alten Jahr'
  feststellung_wenn: Vorratsbewegungen um den Stichtag in der falschen Periode erfasst oder Ware sowohl als Forderung bzw. in Projekten als auch im Inventar bilanziert.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über das Vorgehen zur Überwachung der zeitlichen Abgrenzung am Ende
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Bei der Inventur ist der korrekten Abgrenzung besondere Beachtung zu schenken.
  - quelle: hwp-bur-2023__rz-0234-s209
    zitat: Sofern diese Ware bereits als Forderung gebucht ist, darf sie nicht zusätzlich in der Position Vorräte
- id: F1-110
  vorgehen: Erfragen, ob Fremdware (Kommissions-/Konsignationsware, Kundeneigentum, Leihgebinde) im Lager liegt und wie sie bei der Inventur ausgeschieden wird (separate Lagerplätze,
    Kennzeichnung, Aufzeichnungen). Antwort mit Inventurprotokoll abgleichen und Inventarliste auf fremde Artikel durchsehen; Ergebnis im Textfeld.
  nachweise:
  - Schriftliche Antwort
  - Inventurprotokoll (Angabe Fremdware)
  - Kommissionsverträge/Aufzeichnungen Fremdware
  rechnen: ''
  feststellung_wenn: Fremdware im Inventar aktiviert oder bei vorhandener Fremdware keine geregelte Ausscheidung.
  fundstellen:
  - quelle: ser-2022__anh-d-s079-2
    zitat: Befragung, ob das Unternehmen Vorräte von Dritten in Konsignation besitzt und wie
  - quelle: hwp-bur-2023__rz-0214-s207
    zitat: In Kommission genommene Waren dürfen grundsätzlich nicht aktiviert werden
- id: F1-111
  vorgehen: Erfragen, ob Vorräte verpfändet (z.B. Faustpfand für Bankkredit), unter Eigentumsvorbehalt erworben, bei Dritten eingelagert oder in Konsignation an Dritte gegeben sind;
    Kredit-/Pfandverträge, Lagerscheine und Konsignationsabrechnungen einsehen. Prüfen, ob Ware bei Dritten im Inventar enthalten ist und Verpfändung/Eigentumsvorbehalt im Anhang angegeben
    werden.
  nachweise:
  - Schriftliche Antwort
  - Kredit- und Pfandverträge
  - Lagerscheine/Konsignationsabrechnungen
  - Anhang
  rechnen: Anhangsangabe = Gesamtbetrag (Buchwert) der verpfändeten Vorräte bzw. der Vorräte unter Eigentumsvorbehalt
  feststellung_wenn: Verpfändete Vorräte oder Vorräte unter Eigentumsvorbehalt nicht im Anhang angegeben, oder eigene Ware bei Dritten/in Konsignation fehlt im Inventar.
  fundstellen:
  - quelle: ser-2022__anh-d-s079-2
    zitat: Befragung, ob Vorräte verpfändet, an anderen Orten eingelagert oder in Konsignation
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0213-s207
    zitat: In Kommission gegebene Waren (Konsignationsware) sind separat unter Vorräten, nicht als Forderungen auszuweisen.
- id: F1-201
  vorgehen: Saldi der Vorratskonten je Kategorie (inkl. Wertberichtigung) mit dem Vorjahr vergleichen und Lagerumschlag bzw. Lagerdauer je Kategorie aus Material-/Warenaufwand berechnen.
    Wesentliche Veränderungen und gesunkene Umschläge (Hinweis auf Überalterung) identifizieren, Erklärung beim Kunden als Pendenz anfordern und im Textfeld dokumentieren.
  nachweise:
  - Saldoliste GJ/VJ
  - Inventarliste GJ/VJ
  - Material-/Warenaufwand je Kategorie
  rechnen: Veränderung = Saldo GJ − Saldo VJ (CHF und %); Umschlag = Aufwand Kategorie / ((Bestand Anfang + Bestand Ende) / 2); Lagerdauer (Tage) = 365 / Umschlag
  feststellung_wenn: Wesentliche, unerklärte Bestandesveränderung oder deutlich gesunkener Umschlag einer Kategorie ohne entsprechende Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-3
    zitat: Vergleich des Lagerbestandes und -umschlages einzelner Produktkategorien mit jenem früherer Perioden
  - quelle: ser-2022__6-1-2-t1
    zitat: vergleichbaren Informationen über Vorperioden
- id: F1-202
