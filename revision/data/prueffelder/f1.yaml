    einsehen (Zählzyklus, Abdeckung aller Artikel im Jahr, Differenzbehandlung); b) Bestandesnachweise dokumentenbasiert (Zählprotokolle, Differenzlisten, Lagerbuchhaltung), kein Nachzählen.
