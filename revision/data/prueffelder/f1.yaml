schritte:
- id: F1-101
  vorgehen: 'Schriftliche Antwort (10.11 Kundenbefragung) zur Bestandesermittlung auswerten: Stichtags-, permanente oder Stichprobeninventur, Lagerbuchhaltung (mengen-/wertmässig), Lagerorte
    inkl. Fremdlager, Zähl- und Übertragungsprozess. Mit Inventurprotokoll abgleichen und im Textfeld zusammenfassen; fehlt sie, Frage als Pendenz für den WP. Status höchstens «teilweise
    bearbeitet».'
  nachweise:
  - Schriftliche Antwort Kundenbefragung (10.11) Bestandesermittlung
  - Inventurprotokoll
  - Inventurinstruktion
  rechnen: ''
  feststellung_wenn: Keine nachvollziehbare Bestandesermittlung per Stichtag (weder Inventur noch verlässliche Lagerbuchhaltung) oder Angaben widersprechen dem Inventurprotokoll.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über die Methode der Bestandsermittlung
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Die Bestandsermittlung erfolgt entweder durch Inventur oder durch Übernahme der Bestände aus der Lagerbuchhaltung.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- id: F1-102
  vorgehen: Zuerst klären, ob eine Lagerbuchhaltung besteht. Schriftliche Antwort (10.11) zu Korrekturen aus der letzten physischen Bestandesaufnahme (Höhe, Ursachen, Verbuchung, Genehmigung)
    auswerten und mit Differenzliste und Kontoblättern abgleichen; fehlt sie, Pendenz für den WP. Ohne Lagerbuchhaltung ist die Stichtagsbuchung die Bestandesänderung, keine Inventurdifferenz.
    Status höchstens «teilweise bearbeitet».
  nachweise:
  - Schriftliche Antwort Kundenbefragung (10.11)
  - Differenzliste Inventur (nur bei Lagerbuchhaltung)
  - Kontoblätter Vorräte (Stichtagsbuchung)
  rechnen: 'Nur bei Lagerbuchhaltung bzw. permanenter Inventur: Inventurdifferenz = Soll-Bestand Lagerbuchhaltung − Ist-Bestand gemäss Zählung; verbuchte Korrektur = Inventurdifferenz.
    Ohne Lagerbuchhaltung: Stichtagsbuchung = Bestandesänderung = Σ Inventarliste GJ − Saldo VJ (keine Inventurdifferenz); Mengenabgleich Zählliste ↔ Inventarliste nur in F1-401 d (auf
    Anweisung des WP)'
  feststellung_wenn: 'Bei Lagerbuchhaltung: wesentliche Inventurdifferenzen ungeklärt, nicht/falsch verbucht oder ohne Beleg/Genehmigung. Ohne Lagerbuchhaltung ist die Stichtagsbuchung
    allein keine Feststellung.'
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Besprechung von Korrekturen aufgrund der letzten physischen Bestandsaufnahme
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Differenzen sind abzuklären und zu bereinigen.
  - quelle: hwp-bur-2023__rz-0201-s204-t1
    zitat: Die exakten Bestände werden durch Inventur am Bilanzstichtag ermittelt und bewertet.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- id: F1-103
  vorgehen: 'Nur ohne physische Aufnahme per Stichtag: schriftliche Antwort (10.11) auswerten, ob eine Lagerbuchhaltung mit permanenter oder Stichprobeninventur besteht, wie oft welche
    Artikel gezählt und Differenzen bereinigt werden; Zählnachweise in M-Files suchen, sonst Pendenz für den WP. Bei vor-/nachverlegter Inventur Fortschreibung auf den Stichtag nachvollziehen.
    Sonst «nicht anwendbar (Stichtagsinventur)».'
  nachweise:
  - Zählplan und Zählprotokolle permanente Inventur bzw. Stichprobeninventur
  - Lagerbuchhaltung
  - Fortschreibung/Rückrechnung auf Bilanzstichtag
  - Schriftliche Antwort Kundenbefragung (10.11)
  rechnen: Bestand Bilanzstichtag = Bestand Inventurtag ± Zu-/Abgänge zwischen Inventurtag und Bilanzstichtag
  feststellung_wenn: Weder Stichtagsinventur noch verlässliche permanente Inventur, Stichprobeninventur ohne ordnungsgemässe Lagerbuchhaltung, oder Fortschreibung auf den Bilanzstichtag
    fehlt bzw. ist nicht nachvollziehbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: ein System der permanenten Inventur eingesetzt wird und ein periodischer Vergleich mit tatsächlich vorhandenen Mengen stattfindet
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Bei vorhandener Lagerbuchhaltung besteht neben der Stichtagsinventur die Möglichkeit der permanenten Inventur
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: ist eine einwandfreie Fortschreibung oder Rückrechnung auf den Bilanzstichtag sicherzustellen
  - quelle: hwp-bur-2023__rz-0204-s205
    zitat: Voraussetzung dazu ist eine ordnungsgemäss geführte Lagerbuchhaltung.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- id: F1-104
  vorgehen: Schriftliche Antwort (10.11) zur Bewertungsgrundlage je Kategorie (Einstandspreis, FIFO, gleitender Durchschnitt, Herstell-/Standardkosten) auswerten und mit dem Anhang abgleichen;
    fehlt sie, Pendenz für den WP. In der Inventarliste je Position AK/HK mit dem massgebenden Vergleichswert (Absatz- bzw. Beschaffungsmarkt) vergleichen; Positionen mit tieferem Wert
