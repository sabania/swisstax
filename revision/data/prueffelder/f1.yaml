- id: F1-304
  vorgehen: 'WP-Schritt (weiter gehend): nur auf Anordnung des WP, bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko (3.1). WB-Berechnung des Kunden für Kategorien
    mit ungenügender Marge nachrechnen: Vergleichswert (Absatzmarkt per Rückrechnung, Rohmaterial am Beschaffungsmarkt) je Position mit AK/HK vergleichen; Σ mit verbuchter Wertberichtigung
    abstimmen. Abweichungen im Textfeld.'
  nachweise:
  - Berechnung Wertberichtigung des Kunden
  - Verkaufspreislisten/Verkaufsrechnungen nach Stichtag
  - Aktuelle Beschaffungspreise Rohmaterial
  - Inventarliste
  - Kontoblatt Wertberichtigung Vorräte
  rechnen: 'Vergleichswert Absatzmarkt = Verkaufspreis − Erlösminderungen − Vertriebs-/Verwaltungskosten (− noch anfallende HK; bei erheblicher Lagerdauer − Fremdkapitalkosten); Rohmaterial/Hilfsstoffe:
    Wiederbeschaffungspreis, ausser Preissenkungen wirken sich nicht auf Verkaufspreise aus; bei Überbeständen tieferer Rückrechnungswert, mindestens Liquidationswert. WB je Position
    = max(0; AK/HK − Vergleichswert) × Menge; Σ WB vs. Saldo Wertberichtigungskonto'
  feststellung_wenn: Nachgerechneter Wertberichtigungsbedarf übersteigt die verbuchte Wertberichtigung (Überbewertung) oder Berechnung ist nicht nachvollziehbar.
