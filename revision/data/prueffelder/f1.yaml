    Toleranzwesentlichkeit plus auffällige (Vorschlag, von consis zu bestätigen), Begründung im Textfeld. Inventarpreise nach gewählter Methode mit Lieferantenrechnungen belegen (inkl.
    Bezugskosten, abzüglich Rabatte); keine Hochrechnung, Einzelabweichungen mit Betrag dokumentieren.'
