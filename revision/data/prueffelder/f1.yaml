  zitat: Der konkrete Zeitpunkt des Übergangs von Nutzen und Gefahr ist aufgrund der vertraglichen Grundlagen zu bestimmen (z.B. Incoterms).
- dokument: Vom Kunden eingeholte Bestätigungen, Lagerscheine bzw. Warenpapiere für Fremd- und Konsignationslager
  zweck: Bestandsnachweis Ware bei Dritten (F1-111/404)
  quelle: hwp-er-2026__rz-0137-s203
  zitat: kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise beiziehen
- dokument: Kredit- und Pfandverträge, Kaufverträge mit Eigentumsvorbehalt, Kommissions-/Konsignationsverträge
  zweck: Rechte/Verpflichtungen, Anhangsangaben (F1-110/111/320)
  quelle: ser-2022__anh-d-s097-1
  zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- dokument: Aufstellung stille Reserven (inkl. Warendrittel und beibehaltene, nicht mehr begründete Wertberichtigungen) GJ/VJ und Vollständigkeitserklärung
  zweck: Bestand und Veränderung stiller Reserven, Nettoauflösung (F1-321/320)
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: Sachversicherungspolice Warenlager/Betriebsinventar
  zweck: Angemessenheit Versicherungswerte (F1-406, nur auf Anweisung des WP; Praxis)
- dokument: Einkaufsstatistik nach Lieferanten, Rahmenverträge mit Hauptlieferanten
  zweck: Lieferantenstruktur und Abhängigkeiten (F1-205)
- dokument: Budget/Auftragsbestand bzw. Umsatzplanung
  zweck: Analytischer Vergleich mit Erwartungen, ABC-Analyse (F1-203/204)
  quelle: ser-2022__6-1-2-t1
  zitat: voraussichtlichen Ergebnissen des Unternehmens wie etwa Budgets, Prognosen
bewertung:
- regel: Ersterfassung höchstens zu Anschaffungs- oder Herstellungskosten.
  quelle: hwp-bur-2023__rz-0217-s207
  zitat: Vorräte dürfen bei der Ersterfassung höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden (Art. 960a OR).
- regel: Anschaffungskosten (Einstandspreis) = alle Kosten bis zur Einlagerung inkl. Bezugskosten, abzüglich Rabatte; handelsübliche Skonti müssen nicht abgezogen werden.
  quelle: hwp-bur-2023__rz-0218-s207
  zitat: Anschaffungskosten (Einstandspreise) umfassen alle Kosten, die bis zur Einlagerung anfallen, einschliesslich aller Bezugskosten wie Fracht, Zoll, Versicherungsprämien
- regel: Finanzierungskosten des Wareneinkaufs sind keine Anschaffungskosten.
  quelle: hwp-bur-2023__rz-0219-s207
  zitat: Die Kosten einer Finanzierung des Wareneinkaufs durch Wechsel oder verzinsliche Lieferantenkredite dürfen nicht den Anschaffungskosten zugerechnet werden.
- regel: 'Herstellungskosten: Material inkl. Materialgemeinkosten, Fertigungslöhne und Fertigungsgemeinkosten.'
  quelle: hwp-bur-2023__rz-0220-s207
  zitat: die Materialgemeinkosten, die Fertigungslöhne und die Fertigungsgemeinkosten
- regel: Allgemeine Verwaltungs- und Vertriebskosten (insbesondere Kosten der Verkaufslager) gehören nicht zu den Herstellungskosten.
  quelle: hwp-bur-2023__rz-0221-s207
  zitat: Nicht zu den Herstellungskosten gehören die allgemeinen Verwaltungs- und Vertriebskosten
- regel: Verwaltungskosten mit Bezug zur Materialverwaltung (ohne Verkaufslager) und zur Fabrikation (z.B. technische Leitung, Betriebs- und Lohnbuchhaltung) dürfen in die Herstellungskosten
    eingerechnet werden.
  quelle: hwp-bur-2023__rz-0222-s208
  zitat: Teile der Verwaltungskosten, die sich auf die Materialverwaltung (ohne Verkaufslager) und die Fabrikation beziehen
- regel: Fixkosten auf Basis Normalbeschäftigung; Unterbeschäftigungskosten nicht aktivierbar; Eigenkapitalzinsen nie aktivierbar.
  quelle: hwp-bur-2023__rz-0222-s208
  zitat: Ein Eigenkapitalzinsanteil ist in keinem Fall aktivierungsfähig.
- regel: 'Zulässige Verfahren zur Ermittlung der AK/HK: gewichteter Durchschnitt, Fifo, Lifo, Hifo, Rückrechnung vom Verkaufspreis, Standard-/Plankosten.'
  quelle: hwp-bur-2023__rz-0236-s210
  zitat: gewichtete Durchschnittsmethode
- regel: 'Niederstwertprinzip: Ist der Veräusserungswert abzüglich noch anfallender Kosten tiefer als AK/HK, ist dieser tiefere Wert einzusetzen.'
  quelle: hwp-bur-2023__rz-0233-s209
  zitat: so muss in der Folgebewertung dieser tiefere Wert eingesetzt werden
- regel: 'Rückrechnung: Verkaufspreis minus Erlösschmälerungen, Vertriebs-, Verwaltungs- und ggf. noch anfallende Herstellkosten ergibt den Vergleichswert; Korrektur unter Liquidationswert
    nicht nötig.'
  quelle: hwp-bur-2023__rz-0246-s212
  zitat: Eine Wertkorrektur unter den Liquidationswert ist nicht notwendig.
- regel: In der Rückrechnung sind bei Produkten mit erheblicher Lagerdauer zusätzlich die Fremdkapitalkosten abzuziehen.
  quelle: hwp-bur-2023__rz-0245-s212
  zitat: bei Produkten mit erheblicher Lagerdauer – die Fremdkapitalkosten
- regel: 'Massgebender Markt: für Rohmaterial, Hilfs-/Betriebsstoffe und fremdbeziehbare Halbfabrikate in der Regel der Beschaffungsmarkt, für alle anderen Vorräte der Absatzmarkt.'
  quelle: hwp-bur-2023__rz-0247-s213
  zitat: der Beschaffungsmarkt massgebend, für alle anderen Vorräte der Absatzmarkt
- regel: 'Ausnahmen beim Beschaffungsmarkt: keine Anpassung an den tieferen Beschaffungspreis, wenn sich Preissenkungen nicht auf die Verkaufspreise auswirken; ist der Rückrechnungswert
    tiefer (v.a. bei Überbeständen), dieser, mindestens aber der Liquidationswert.'
  quelle: hwp-bur-2023__rz-0247-s213
  zitat: Eine Anpassung an den niedrigeren Beschaffungspreis erübrigt sich
- regel: 'Unkurante Artikel: Bewertungskorrektur zwingend; bei grossen Lagern pauschale Abschläge nach Umschlagshäufigkeit üblich.'
  quelle: hwp-bur-2023__rz-0249-s213
  zitat: In solchen Fällen ist es üblich, pauschale Abschläge von den Anschaffungs- oder Herstellungskosten vorzunehmen.
- regel: Unkurante Artikel im Extremfall zum Liquidationswert; nötigenfalls zusätzlich Rückstellung für künftige Entsorgungskosten.
  quelle: hwp-bur-2023__rz-0249-s213
  zitat: nötigenfalls noch eine zusätzliche Rückstellung für künftig anfallende Entsorgungskosten zu bilden
- regel: Gruppenbewertung gleichartiger Vorratskategorien zulässig, ohne Verrechnung von Zwangsreserven.
  quelle: hwp-bur-2023__rz-0231-s209
  zitat: Gleichartige Vorratskategorien können dabei als Gruppen zu zweckmässigen Bewertungseinheiten
- regel: Marktpreisbewertung über AK nach Art. 960b OR (Börsenkurs bzw. beobachtbarer Marktpreis in aktivem Markt) bei Vorräten nur in wenigen Fällen (z.B. Rohstoffhandel); bei Produktionsvorräten
    nicht sachgerecht.
  quelle: hwp-bur-2023__rz-0231-s209
  zitat: dürften nur in wenigen Fällen gegeben sein (z.B. im Rohstoffhandel)
- regel: Aufwertung bei Kapitalverlust/Überschuldung (Art. 725c OR) nur für Grundstücke und Beteiligungen; bei Vorräten nicht möglich.
  quelle: hwp-bur-2023__rz-0886-s359
  zitat: Für eine Aufwertung kommen ausschliesslich Beteiligungen oder Grundstücke in Frage.
- regel: 'Warendrittel (Steuerpraxis gemäss HWP BuR): steuerlich zulässiger Bewertungsabzug von einem Drittel auf dem gesetzlichen Höchstwert; nach allen handelsrechtlich nötigen Korrekturen
    hat er Reservecharakter.'
  quelle: hwp-bur-2023__rz-0253-s214
  zitat: lassen die Steuerbehörden einen Bewertungsabzug von einem Drittel zu
- regel: Aktivierung ab Übergang von Nutzen und Gefahr gemäss Vertrag (z.B. Incoterms); versandbereite Ware bleibt bis dahin im Vorrat.
  quelle: hwp-bur-2023__rz-0211-s206
  zitat: Versandbereite Waren bleiben bis zum Übergang von Nutzen und Gefahr auf den Kaufenden Bestandteil der Vorräte.
- regel: In einfachen Verhältnissen darf für die Abgrenzung auf Wareneingang oder Rechnungserhalt abgestellt werden.
  quelle: hwp-bur-2023__rz-0210-s206
  zitat: In einfachen Verhältnissen wird auf leicht nachvollziehbare physische Sachverhalte wie Wareneingang oder Rechnungserhalt abgestellt.
- regel: In Kommission gegebene Ware bleibt beim Kommittenten unter Vorräten; in Kommission genommene Ware wird nicht aktiviert.
  quelle: hwp-bur-2023__rz-0213-s207
  zitat: In Kommission gegebene Waren (Konsignationsware) sind separat unter Vorräten, nicht als Forderungen auszuweisen.
- regel: 'Eigentumsvorbehalte Dritter: nur Anhangsangabe, bis Rückgabe verlangt wird.'
  quelle: hwp-bur-2023__rz-0212-s206
  zitat: Eigentumsvorbehalte Dritter an Waren sind bei der Rechnungslegung mit Ausnahme der Anhangsangabe (Art. 959c Abs. 2 Ziff. 9 OR) erst dann zu berücksichtigen, wenn die Rückgabe
    verlangt wird.
- regel: Bestandsermittlung durch Inventur oder Lagerbuchhaltung; bei vertretbaren Gründen mathematische Stichprobeninventur zulässig, Voraussetzung ist eine ordnungsgemäss geführte
    Lagerbuchhaltung.
  quelle: hwp-bur-2023__rz-0204-s205
  zitat: kann ein angemessenes mathematisches Stichprobenverfahren eingesetzt werden
- regel: Hilfs-, Betriebs- und Büromaterial kann pro memoria bilanziert werden (Verzicht auf Inventur meist vertretbar).
  quelle: hwp-bur-2023__rz-0209-s206
  zitat: Beim Hilfs-, Betriebs- und Büromaterial ist es meistens vertretbar, auf eine Inventur zu verzichten
- regel: Eine einmal gewählte Bewertungsmethode ist beizubehalten; Wechsel nur begründet und mit Anhangsangabe.
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: Eine einmal gewählte Methode ist grundsätzlich beizubehalten.
fallstricke:
- text: Inventurteilnahme (F1-401 a, inkl. Nachzählen F1-401 c) ist nicht Bestandteil der eingeschränkten Revision; der Abschlussprüfer verzichtet darauf (HWP ER Rz 134). Ordnet der
    WP sie dennoch an, geht dies über den ER-Umfang hinaus. Der Agent führt physische Tätigkeiten nie aus und prüft nur anhand der Dokumente.
  quelle: ser-2022__anh-d-s079-2
  zitat: Inventurteilnahme
- text: Externe Bestätigungen (z.B. Konsignationslager, F1-404) holt der Abschlussprüfer in der eingeschränkten Revision nicht selbst ein. Bestätigungen, die der Kunde selbst eingeholt
    hat, dürfen beigezogen werden.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: «Stichprobenmässig» heisst beim Prüfer bewusste Auswahl (Positionen über der Toleranzwesentlichkeit, auffällige Positionen), keine repräsentative Stichprobe mit Hochrechnung.
    Davon zu unterscheiden ist die Stichprobeninventur des Kunden (nur mit ordnungsgemässer Lagerbuchhaltung).
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: Vertiefte Prüfungen der Herstellkostenkalkulation sind nicht Bestandteil der eingeschränkten Revision; zulässig ist bei entsprechender Risikolage nur eine Plausibilisierung (HWP
    ER Rz 134, F1-303).
  quelle: ser-2022__anh-d-s079-2
  zitat: Vertiefte Prüfungen im Bereich der Kalkulation von Herstellkosten
- text: 'Weiter gehende Prüfungshandlungen (WP-Schritte F1-110, F1-111, F1-204, F1-302 bis F1-304) sind keine Standardarbeit: nur wenn die empfohlenen Handlungen auf wesentliche Fehlaussagen
    hindeuten oder ein erhöhtes inhärentes Risiko besteht, und nur auf Anordnung des WP (offener Entscheid, ob der Agent WP-Schritte vorbereitet).'
  quelle: ser-2022__anh-d-s079-1
  zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- text: 'Der Agent befragt nicht selbst und versendet nichts: Er wertet schriftliche Antworten (10.11 Kundenbefragung) aus und gleicht sie mit Unterlagen ab; fehlt eine Antwort, erfasst
    er die Frage als Pendenz für den WP. Befragungsschritte höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: Sonstige Prüfungshandlungen (F1-401 bis F1-406) nur auf Anweisung des WP; physische Tätigkeiten (Inventurteilnahme, Nachzählen) nie.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: Befragungen allein genügen für die wesentliche Position Vorräte nicht. Antworten mit Analytik und/oder Detailprüfungen (mindestens F1-301) erhärten.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Ohne Lagerbuchhaltung gibt es keinen Buchbestand: Die Stichtagsbuchung «Bestandesänderung gemäss Inventar» ist keine Inventurdifferenz und darf nicht als solche gemeldet werden
    (F1-102).'
  quelle: hwp-bur-2023__rz-0201-s204-t1
  zitat: Die exakten Bestände werden durch Inventur am Bilanzstichtag ermittelt und bewertet.
- text: Der Warendrittel ist (nach allen handelsrechtlich nötigen Korrekturen) eine stille Reserve, keine betriebsnotwendige Wertberichtigung. Sein Abbau bei Lagerrückgang ist eine Auflösung
    stiller Reserven (Anhang prüfen).
  quelle: hwp-bur-2023__rz-0253-s214
  zitat: Damit werden zwangsläufig stille Reserven aufgelöst
- text: Wertberichtigungen auf Vorräten dürfen nicht als Rückstellung unter den Passiven ausgewiesen werden.
  quelle: or__art-960a
  zitat: dürfen nicht unter den Passiven ausgewiesen werden
- text: Bei vor- oder nachverlegter Inventur fehlt oft die Fortschreibung bzw. Rückrechnung auf den Bilanzstichtag.
  quelle: hwp-bur-2023__rz-0204-s205
  zitat: ist eine einwandfreie Fortschreibung oder Rückrechnung auf den Bilanzstichtag sicherzustellen
- text: Inventarwerte zu Verkaufspreisen (Rückrechnungsmethode) oder nach Preiserhöhungen können über den tatsächlichen Einstandspreisen liegen.
  quelle: hwp-bur-2023__rz-0241-s211
  zitat: Die Rückrechnung darf jedenfalls nicht zur Folge haben, dass die Vorräte zu einem den tatsächlichen Einstandswert
- text: Lifo bei sinkenden Preisen führt zu Werten über den aktuellen Einstandspreisen; Korrektur nötig.
  quelle: hwp-bur-2023__rz-0239-s211
  zitat: weshalb eine Korrektur erforderlich ist
- text: Bei der Durchschnittsmethode weicht der Inventarpreis legitim vom letzten Rechnungspreis ab; Vergleich mit dem nachgerechneten gewichteten Durchschnitt, nicht mit der letzten
    Rechnung (F1-302). (Praxis, ohne Quelle)
- text: Gruppenbewertung darf Unterbewertungen (Zwangsreserven) nicht mit Überbewertungen einzelner Artikel verrechnen. Einzelne Positionen mit Netto-Veräusserungswert unter AK/HK sind
    trotzdem zu korrigieren.
  quelle: hwp-bur-2023__rz-0231-s209
  zitat: Im Rahmen der Gruppenbewertung dürfen allerdings keine Zwangsreserven zur (gedanklichen) Verrechnung gebracht werden
- text: Die Inventarliste wird oft erst nach dem Stichtag bewertet und von Hand aus den Zähllisten übertragen; Übertragungs- und Formelfehler in Excel-Inventaren sind häufig. Ein mit
    dem Hauptbuch übereinstimmendes Total schliesst Zeilenfehler (Menge × Preis ≠ Inventarwert) nicht aus; die Zeilen daher bereits in F1-301 nachrechnen. (Praxis, ohne Quelle)
fragen_kunde:
- frage: Wie wurde der Vorratsbestand per Bilanzstichtag ermittelt (Stichtagsinventur, permanente Inventur, Stichprobeninventur, Lagerbuchhaltung), und welche Lagerorte (inkl. Fremdlager,
    Baustellen) waren einbezogen?
  zweck: 'F1-101/F1-103: Methode der Bestandesermittlung (EX, VO) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: 'Führen Sie eine Lagerbuchhaltung? Falls ja: Welche Inventurdifferenzen ergaben sich bei der letzten physischen Bestandesaufnahme, wie wurden sie abgeklärt und verbucht?'
  zweck: 'F1-102: Korrekturen aus der Inventur; ohne Lagerbuchhaltung keine Inventurdifferenz (EX, EN, BE, RI) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Nach welcher Methode wird jede Vorratskategorie bewertet (effektiver Einstandspreis, FIFO, gleitender Durchschnitt, Herstell-/Standardkosten), und wie wird sichergestellt, dass
    der tiefere Netto-Veräusserungswert bzw. bei Rohmaterial der tiefere Wiederbeschaffungspreis eingesetzt wird?
  zweck: 'F1-104: Bewertungsgrundlagen, Niederstwertprinzip (BE, DO) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Wurden Bewertungsmethode, Kalkulationsschema oder Gemeinkostenzuschläge gegenüber dem Vorjahr geändert? Besteht eine Kostenrechnung, und hat sie sich bewährt (Nachkalkulationen)?
  zweck: 'F1-105: Stetigkeit, Verlässlichkeit Kostenrechnung (BE, DO) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Wie werden Ladenhüter und überalterte Artikel identifiziert (Umschlag, letzte Bewegung) und wie wird die Wertberichtigung berechnet? Fallen für unverkäufliche Ware Entsorgungskosten
    an? Bitte Berechnung zustellen.
  zweck: 'F1-106: unkurante Vorräte, Entsorgungskosten (VO, BE, DO) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Gibt es Produktkategorien mit geringer oder negativer Marge, und wie stellen Sie deren verlustfreie Bewertung sicher? Bitte Margenauswertung je Kategorie zustellen.
  zweck: 'F1-107/F1-304: verlustfreie Bewertung (BE) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Wie werden Wareneingänge, Warenausgänge und Verbräuche laufend und per Bilanzstichtag abgegrenzt (Lagersperre, Lieferscheine, Lieferbedingungen/Incoterms, Waren in Transit,
    Abstimmung Lager-/Finanzbuchhaltung)?
  zweck: 'F1-108/F1-109: zeitliche Abgrenzung (VO, PA) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Lagern bei Ihnen Waren Dritter (Kommissions-/Konsignationsware, Kundeneigentum)? Wie werden sie bei der Inventur ausgeschieden?
  zweck: 'F1-110 (WP-Schritt): Fremdware nicht im Inventar (VO) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Sind Vorräte verpfändet, unter Eigentumsvorbehalt erworben, bei Dritten eingelagert oder in Konsignation an Dritte gegeben? Bitte entsprechende Verträge bzw. Nachweise zustellen.
  zweck: 'F1-111 (WP-Schritt)/F1-404/F1-320: Rechte, Bestand bei Dritten, Anhangsangabe (RV, DO) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Wurde Material, das bereits auf Baustellen bzw. in Projekten verwendet wird, aus dem Inventar ausgeschieden und ausschliesslich in den angefangenen Arbeiten erfasst?
  zweck: 'F1-109/F1-203: Abgrenzung Vorräte/angefangene Arbeiten, keine Doppelerfassung (EX, PA) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Worauf sind die wesentlichen Veränderungen von Beständen, Mengen, Lagerumschlag und Margen gegenüber dem Vorjahr zurückzuführen?
  zweck: 'F1-201/F1-202/F1-203/F1-204: Erklärung analytischer Abweichungen – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Bestehen Abhängigkeiten von einzelnen Lieferanten oder Lieferengpässe, und ist die Belieferung (z.B. durch Rahmenverträge) gesichert?
  zweck: 'F1-205: Lieferantenstruktur (VO, BE) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Wie hoch ist die Versicherungssumme für das Warenlager/Betriebsinventar? Bitte aktuelle Police zustellen.
  zweck: 'F1-406 (nur auf Anweisung des WP): Angemessenheit Versicherungswerte (RV, BE) – Fragebogen wird vorbereitet, Versand durch den WP.'
- frage: Bitte Aufstellung der stillen Reserven auf den Vorräten (z.B. Warendrittel, zusätzliche oder nicht mehr begründete Wertberichtigungen) per Stichtag und Vorjahr zustellen.
  zweck: 'F1-321/F1-320: Bestand und Veränderung stiller Reserven, Anhang – Fragebogen wird vorbereitet, Versand durch den WP.'
