- id: F1-301
  vorgehen: Inventarliste zuerst rechnerisch nachvollziehen (je Zeile Menge × Preis = Inventarwert, Summe je Konto; Praxis als Vorbedingung, da ein stimmendes Total Zeilenfehler nicht
    ausschliesst). Dann Totale je Konto (inkl. Wertberichtigung) mit Hauptbuchsaldi und Bilanzposition Vorräte abstimmen. Zeilenfehler, Differenzen und Konten ohne Inventarnachweis im
    Textfeld; bei wesentlicher Position mindestens diese Detailprüfung.
