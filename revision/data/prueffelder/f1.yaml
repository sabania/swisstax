- id: F1-303
  vorgehen: 'WP-Schritt (weiter gehend): nur auf Anordnung des WP, bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko (3.1). Nur bei eigener Herstellung (Anlagen-/Projektgeschäft):
    HK ausgewählter Positionen mit Kalkulation abstimmen; plausibilisieren, dass keine allgemeinen Verwaltungs-/Vertriebskosten oder Unterbeschäftigung aktiviert sind (Material-/Fertigungsverwaltung
    zulässig). Keine vertiefte Prüfung; sonst «nicht anwendbar».'
