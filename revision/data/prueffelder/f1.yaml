- dokument: Kalkulationen und Kostenrechnung/Betriebsabrechnung (bei eigener Herstellung)
  zweck: Abstimmung Herstellkosten (F1-105/303)
  quelle: ser-2022__anh-d-s079-1
  zitat: Abstimmung der Herstellkostenwerte mit den Unterlagen der Kalkulation und Kostenrechnung
- dokument: Lieferscheine/Wareneingänge und Ein-/Ausgangsrechnungen der letzten Dezember- und ersten Januartage, Kreditorenjournal Folgejahr
  zweck: Cut-off (F1-108/109)
  quelle: hwp-bur-2023__rz-0210-s206
  zitat: In einfachen Verhältnissen wird auf leicht nachvollziehbare physische Sachverhalte wie Wareneingang oder Rechnungserhalt abgestellt.
- dokument: Vom Kunden eingeholte Bestätigungen, Lagerscheine bzw. Warenpapiere für Fremd- und Konsignationslager
