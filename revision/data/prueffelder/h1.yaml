schritte:
- id: H1-101
  vorgehen: 'Agent befragt nicht selbst: schriftliche Antwort (Kundenbefragung) und Anhang (Grundsätze) auswerten: Anschaffungswert abzüglich Wertberichtigungen oder Kurswert nach Art.
    960b OR, Anwendung auf ganze Position, Schwankungsreserve, Methode für Krypto-Assets, Änderungen ggü. Vorjahr. Fehlt die Antwort, Frage als Pendenz erfassen. Ergebnis und Stetigkeit
    im Textfeld festhalten.'
  nachweise:
  - Schriftliche Antwort Kundenbefragung
  - Anhang Jahresrechnung (Grundsätze)
  - Vorjahresakte
  rechnen: ''
  feststellung_wenn: Bewertung über Anschaffungswert ohne Voraussetzungen von Art. 960b OR, Wahlrecht nur für Teil der Position, oder Methodenwechsel ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung über die angewandten Bilanzierungs- und Bewertungsgrundsätze
  - quelle: or__art-960b
    zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- id: H1-102
  vorgehen: Schriftliche Stellungnahme der Geschäftsleitung zu Markt- bzw. inneren Werten unter Buchwert per 31.12. und nach dem Stichtag auswerten (Kursrückgänge, Verluste der Gesellschaften,
    Zahlungsrückstände). Ohne Antwort Frage als Pendenz. Genannte Titel mit Konto und Betrag im Textfeld festhalten und in H1-305/306/307 weiterverfolgen.
  nachweise:
  - Antwort Geschäftsleitung
  - Depotauszug/Kursliste 31.12.
  - Jahresrechnungen der Gesellschaften/Schuldner
  rechnen: Differenz je Titel = Buchwert – Markt- bzw. innerer Wert
  feststellung_wenn: Markt- oder innerer Wert eines Titels liegt wesentlich unter dem Buchwert und es ist keine Wertberichtigung gebucht.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Besprechung mit der Unternehmensleitung betreffend allfällige niedrigere Marktwerte
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- id: H1-103
  vorgehen: 'Halteabsicht, Laufzeiten und Sperrfristen schriftlich erfragen und mit Verträgen abgleichen: Halteabsicht oder Bindung über zwölf Monate = Anlagevermögen; Anteile ab 20
    % Stimmrechte = Beteiligungen; kurzfristig gehaltene Titel mit Börsenkurs = Umlaufvermögen. Ausweis in Saldoliste/Bilanz damit vergleichen; Umgliederungsbedarf mit Konto und Betrag
    dokumentieren.'
  nachweise:
  - Darlehens-, Kautions- und Kaufverträge
  - Saldoliste
  - Bilanz
  - Antwort Kunde
  rechnen: ''
  feststellung_wenn: Langfristig gebundene Aktiven (z.B. bis Vertragsende gesperrte Kaution, Beteiligung) im Umlaufvermögen oder in falscher Position mit wesentlichem Betrag.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Finanzanlagen
  - quelle: or__art-960d
    zitat: Als Anlagevermögen gelten Werte, die in der Absicht langfristiger Nutzung oder langfristigen Haltens erworben werden.
  - quelle: or__art-959
    zitat: Als Anlagevermögen müssen alle übrigen Aktiven bilanziert werden.
- id: H1-104
  vorgehen: 'Nur wenn Krypto-Assets vorhanden (Saldoliste, Kontenplan, Antwort). Schriftliche Antwort auswerten: Self-Custody oder Custodian, vollständige Wallet-/Adressliste, Eigentumsnachweis
    (Sign-Message, Custodian-Auszug, Mikrotransaktion), Zugriffsberechtigungen, Verpfändung oder Staking-Sperre. Fehlende Angaben als Pendenz; Ergebnis im Textfeld.'
  nachweise:
  - Antwort Kunde
  - Wallet-Liste
  - Custodian-Vertrag/-Auszug
  - Sign-Message-Protokoll
  rechnen: ''
  feststellung_wenn: Verfügungsmacht über bilanzierte Token nicht belegt, Wallets unvollständig erfasst oder Verpfändung/Staking-Sperre nicht offengelegt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0044-s166-t2
    zitat: Diese Information belegt die Verfügungsmacht über die entsprechenden Bestände jedoch noch nicht.
  - quelle: hwp-or-2024__rz-1179-s420
    zitat: Befragung der Geschäftsleitung oder anderer verantwortlicher Mitarbeitender, in welchen Wallets und unter welchem Namen die Token verwahrt werden.
- id: H1-105
  vorgehen: Nur bei Krypto-Assets. Schriftliche Angaben zu Preisquellen (ESTV-Kursliste, Handelsplatz, Börsenfeed), Bewertungszeitpunkt (Stichtag) und gewähltem Wahlrecht (Anschaffungs-/Niederstwert
    oder Marktpreis, Schwankungsreserve) auswerten; Stetigkeit ggü. Vorjahr prüfen. Fehlende Angaben als Pendenz.
  nachweise:
  - Antwort Kunde
  - Bewertungsliste Krypto 31.12.
  - Vorjahresakte
  rechnen: ''
  feststellung_wenn: Keine nachvollziehbare Preisquelle oder kein Stichtagskurs, Marktpreisbewertung nur für Teil der Position oder Methodenwechsel ohne Anhangangabe.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0045-s167-t1
    zitat: Es ist aber auch zulässig, eigene Marktbewertungen auf Basis von effektiven Transaktionskursen auf den für das Unternehmen relevanten Handelsplätzen per Bilanzstichtag vorzunehmen.
  - quelle: hwp-bur-2023__rz-0055-s170
    zitat: Die Bewertung per Bilanzstichtag erfolgt nach dem Stichtagsprinzip.
- id: H1-201
  vorgehen: 'Saldoliste: Finanzanlagekonten und zugehörige Erfolgskonten (Finanzertrag, Kurserfolge, Wertberichtigungen) mit Vorjahr vergleichen; Veränderung in Zugänge, Abgänge und
    Wertänderungen zerlegen und mit Belegen/Antworten erklären; Ertrag im Verhältnis zum Bestand plausibilisieren. Unerklärte wesentliche Abweichungen als Pendenz.'
  nachweise:
  - Saldoliste Berichtsjahr/Vorjahr
  - Kontoblätter
  - Antwort Kunde
  rechnen: Veränderung = Saldo 31.12. – Saldo Vorjahr je Konto; Anfangsbestand + Zugänge – Abgänge ± Wertänderungen = Endbestand; Rendite = Ertrag / Ø Bestand
  feststellung_wenn: Veränderung nicht durch Belege erklärbar, Überleitung geht nicht auf oder Ertrag fehlt bzw. ist im Verhältnis zum Bestand unplausibel (über Toleranzwesentlichkeit).
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Gemäss SER sind wesentliche Bilanzpositionen in der Regel nicht nur mit analytischen Prüfungshandlungen zu prüfen
- id: H1-202
  vorgehen: Nur bei Krypto-Assets. Menge und Wert je Token Vorjahr vs. 31.12. aufstellen; Wertänderung in Mengeneffekt (Käufe, Verkäufe, Forks, Airdrops, Staking) und Preiseffekt (Kurs
    Vorjahr vs. Stichtag) zerlegen; mit Kursverlauf plausibilisieren. Unerklärte Differenzen als Pendenz.
  nachweise:
  - Nebenbuch/Bestandesliste Krypto
  - Kursnachweise Vorjahr und 31.12.
  - Transaktionsliste
  rechnen: Mengeneffekt = (Menge 31.12. – Menge VJ) × Kurs VJ; Preiseffekt = Menge 31.12. × (Kurs 31.12. – Kurs VJ); Summe vs. Veränderung Buchwert
  feststellung_wenn: Mengen- oder Wertänderung nicht durch Transaktionen und Kurs erklärbar oder Kursrückgang ohne Wertberichtigung bei Anschaffungswertbewertung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0043-s166
    zitat: Zu beachten ist dabei auch die Vollständigkeit der Erfassung von Token aus Abspaltungen (sog. Forks)
  - quelle: hwp-bur-2023__rz-0052-s169
    zitat: Kryptowährungen weisen eine derart hohe Volatilität auf
- id: H1-301
  vorgehen: Aufstellung der Finanzanlagen per 31.12. (Titel, Menge, Buchwert) mit Saldoliste/Hauptbuch und Bilanz abstimmen; a) je Titel mit Depot- bzw. Kontoauszug oder Bestätigung
    per 31.12. vergleichen; b) bei Eigenverwahrung mit Wertschriftenverzeichnis, Titeln/Verträgen. Keine körperliche Inventur durch den Agenten; Bedarf als Pendenz an den WP.
  nachweise:
  - Aufstellung Finanzanlagen 31.12.
  - Depot-/Kontoauszüge 31.12.
  - Verträge
  - Saldoliste/Hauptbuch
  rechnen: Summe Aufstellung = Saldo Bilanzposition Finanzanlagen; je Titel Menge/Saldo gemäss Depot- bzw. Kontoauszug = Buchbestand
  feststellung_wenn: Differenz zwischen Aufstellung, Hauptbuch und Auszug über Toleranzwesentlichkeit oder Titel ohne Bestandesnachweis.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Abstimmung einer Aufstellung der Finanzanlagen per Bilanzstichtag mit der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0269-s217
    zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
  - quelle: hwp-er-2026__rz-0067-s191
    zitat: Abstimmung mit dem Depotauszug mit tendenziell hoher Prüfungssicherheit und geringem Aufwand
  - quelle: ser-2022__1-5
    zitat: keine Inventurbeobachtung und Drittbestätigungsanfragen durchgeführt
- id: H1-302
  vorgehen: Prüfen, ob die Gesellschaft oder kontrollierte Unternehmen eigene Aktien/Stammanteile halten (Wertschriftenbestand, Aktienbuch vs. Aktienkapital gemäss HR, Kaufverträge,
    VR-Protokolle). Anzahl, Anschaffungswert, Erwerb/Veräusserung festhalten; Ausweis als Minusposten im Eigenkapital (nicht als Finanzanlage), 10-%-Grenze und Anhangangabe prüfen.
  nachweise:
  - Aktienbuch
  - Handelsregisterauszug/Statuten
  - Kaufverträge eigene Anteile
  - Anhang
  rechnen: Anteil = Nennwert eigene Aktien / Aktienkapital gemäss HR (max. 10 %); Aktien im Aktienbuch + eigene Aktien = Total Aktien gemäss HR
  feststellung_wenn: Eigene Anteile als Aktivum ausgewiesen, 10-%-Grenze überschritten, Bestand unklar (Aktienbuch ≠ Aktienkapital) oder Anhangangaben fehlen.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Feststellen des Bestands an eigenen Kapitalanteilen
  - quelle: or__art-659a
    zitat: Die Gesellschaft hat in der Bilanz für die eigenen Aktien einen dem Anschaffungswert entsprechenden Betrag als Minusposten des Eigenkapitals darzustellen
  - quelle: or__art-659
    zitat: Der Erwerb eigener Aktien ist auf 10 Prozent des im Handelsregister eingetragenen Aktienkapitals beschränkt.
  - quelle: or__art-959c-t1
    zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
- id: H1-305
  vorgehen: 'Weitergehende Prüfungshandlung (WP): nur bei angenommener wesentlicher Fehlaussage, erhöhtem inhärentem Risiko oder auf Anweisung. Je kotiertem Titel Buchwert mit Menge
    × Jahresendkurs (Depotauszug/Börse) vergleichen, Fremdwährung zum Stichtagskurs; Anschaffungswertprinzip: höchstens tieferer Wert; bei Art. 960b OR alle Titel der Position zum Kurs.'
  nachweise:
  - Depotauszug 31.12.
  - Kursnachweise 31.12.
  - Aufstellung Finanzanlagen
  rechnen: Kurswert = Menge × Schlusskurs 31.12. × Devisenkurs 31.12.; zulässiger Höchstwert = min(Anschaffungswert, Kurswert) bzw. Kurswert bei Art. 960b OR; Differenz zum Buchwert
    je Titel
  feststellung_wenn: Buchwert über zulässigem Höchstwert oder Abweichung vom Stichtagskurs bei Bewertung nach Art. 960b OR über Toleranzwesentlichkeit.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vergleich der Buchwerte kotierter Wertpapiere mit den Jahresendkursen
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: hwp-bur-2023__rz-0030-s163
    zitat: Wertschriften in Fremdwährungen sind neben ihrem Kurswert auch zum Stichtagskurs der Fremdwährung zu bewerten.
- id: H1-306
  vorgehen: Weitergehende Prüfungshandlung (WP). Letzte verfügbare Jahresrechnung der Gesellschaft beschaffen (M-Files/PBC); anteiliges Eigenkapital und Ertragslage ermitteln und mit
    Buchwert vergleichen; Wertminderungsanzeichen (Verluste, negativer Ausblick, keine Dividenden) festhalten. Ob summarische Betrachtung genügt oder vertiefte Bewertung nötig ist, entscheidet
    der WP.
  nachweise:
  - Letzte Jahresrechnung der Gesellschaft
  - Kaufvertrag/Anschaffungswert
  - Planungsrechnung (falls vorhanden)
  rechnen: Anteiliger Substanzwert = Eigenkapital der Gesellschaft × Kapitalanteil; Differenz = Buchwert – anteiliger Substanzwert
  feststellung_wenn: Buchwert deutlich über anteiligem Eigenkapital bei Verlusten oder negativem Ausblick, ohne Wertberichtigung oder dokumentierte Ertragswertbegründung.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vergleich der Buchwerte nicht kotierter Wertpapiere mit dem inneren Wert aufgrund der letzten verfügbaren Jahresrechnung
  - quelle: hwp-bur-2023__rz-0291-s222
    zitat: Sinkt der erzielbare Wert einer Beteiligung unter den bisherigen Buchwert, wird eine Wertberichtigung erforderlich.
  - quelle: hwp-bur-2023__rz-0292-s222
    zitat: näherungsweise Bewertungsmethoden (beispielsweise eine Substanzwertbetrachtung oder eine einfache Ertragswertermittlung anhand einer Planungsrechnung)
- id: H1-307
  vorgehen: Weitergehende Prüfungshandlung (WP). Für Darlehen, Obligationen und Forderungsrechte ohne Kurswert die Bonität des Schuldners anhand Jahresabschluss, vertragsgemässer Zins-/Amortisationszahlungen
    und Sicherheiten beurteilen; Rangrücktritte und Nahestehende besonders beachten. Wertberichtigungsbedarf im Textfeld begründen.
  nachweise:
  - Darlehensvertrag
  - Jahresabschluss Schuldner
  - Zahlungseingänge Zinsen/Amortisationen
  - Sicherheitenverträge
  rechnen: Fällige Zinsen/Amortisationen gemäss Vertrag – Zahlungseingänge = Rückstand; Deckungsgrad = Sicherheitenwert / Forderung
  feststellung_wenn: Schuldner überschuldet, Zahlungsrückstände oder Rangrücktritt, ohne angemessene Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Beurteilung der Bonität der Darlehensnehmer anhand deren Jahresabschlüssen oder anderer Informationen (sofern verfügbar)
  - quelle: hwp-bur-2023__rz-0271-s217
    zitat: Die Notwendigkeit und Höhe von Wertberichtigungen auf Forderungen sind im Einzelfall aufgrund der finanziellen Situation der Schuldnerin oder des Schuldners
  - quelle: hwp-bur-2023__rz-0272-s218
    zitat: Besonders sorgfältige Bewertungsüberlegungen sind erforderlich, wenn gewährte Darlehen mit einem Rangrücktritt belastet sind
- id: H1-310
  vorgehen: Weitergehende Prüfungshandlung (WP). Kontoblätter der Finanzanlagekonten durchgehen; wesentliche Zugänge, Abgänge und Wertänderungen mit Belegen (Kaufvertrag, Abrechnung,
    Auszug) und Gegenbuchung abstimmen; Periode, Betrag inkl. Nebenkosten, Konto/Position und Abgangserfolg prüfen. Auswahl und Ergebnis dokumentieren.
  nachweise:
  - Kontoblätter Hauptbuch
  - Kauf-/Verkaufsabrechnungen
  - Verträge
  - Depotauszüge
  rechnen: Anfangsbestand + Zugänge – Abgänge ± Wertänderungen = Endbestand; Belegbetrag = Buchungsbetrag je ausgewählte Buchung; Abgangserfolg = Erlös – Buchwert
  feststellung_wenn: Buchung ohne Beleg, falsche Gegenbuchung oder Position, falsche Periode, unvollständige Anschaffungskosten oder falscher Abgangserfolg.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Prüfung der im Hauptbuch gebuchten Geschäftsfälle und Wertänderungen anhand der Unterlagen und der Gegenbuchungen
  - quelle: hwp-bur-2023__rz-0281-s220
    zitat: transaktionsbezogene Nebenkosten wie Courtagen, Kommissionen und Spesen (nicht aber Finanzierungskosten)
  - quelle: hwp-bur-2023__rz-0279-s219
    zitat: Abgänge sind zum Buchwert zu erfassen, damit realisierte Gewinne oder Verluste ausgewiesen werden können.
- id: H1-311
  vorgehen: Weitergehende Prüfungshandlung (WP). Ertrags- und Aufwandkonten (Zinsen, Dividenden, Kurserfolge, Wertberichtigungen) durchsehen; erwartete Erträge je Titel (Zinssatz, Dividende)
    mit Buchungen vergleichen; Bruttoverbuchung mit VSt-Guthaben, Zinsabgrenzung und Ausweis im Finanzergebnis prüfen.
  nachweise:
  - Kontoblätter Finanzertrag/-aufwand
  - Ertragsabrechnungen
  - Darlehensverträge
  rechnen: Erwarteter Zins = Nominal × Zinssatz × Tage/360; VSt = 35 % des Bruttoertrags; Bruttoertrag = Nettogutschrift / 0.65
  feststellung_wenn: Erträge fehlen trotz Bestand, Nettoverbuchung ohne VSt-Guthaben, fehlende Zinsabgrenzung oder falsch ausgewiesene Kurserfolge/Wertberichtigungen.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Durchsicht von Konten und Belegen, ob Gewinne, Verluste und Erträge ordnungsgemäss erfasst worden sind
  - quelle: hwp-bur-2023__rz-0789-s328
    zitat: Zinsen und Dividenden aus Wertpapieren
  - quelle: treuhand-almanach-2026__s068-1
    zitat: 35 % auf Kapitalerträgen und Lotteriegewinnen
- id: H1-312
  vorgehen: Nur bei Krypto-Assets. Gebuchten Bestand je Token/Wallet per 31.12. mit Nebenbuch und den vom Kunden gelieferten Blockchain-Nachweisen (Wallet-Explorer-Export, Sign-Message)
    bzw. Custodian-Auszug abstimmen; Vollständigkeit der Adressliste prüfen. Keine eigenen Bestätigungsanfragen beim Custodian; nur vorhandene Kundendokumente verwenden.
  nachweise:
  - Nebenbuch Krypto
  - Wallet-Liste
  - Blockchain-Export/Sign-Message-Protokoll
  - Custodian-Auszug 31.12.
  rechnen: Menge je Token/Wallet gemäss Blockchain bzw. Custodian = Menge Nebenbuch; Σ Menge × Bewertungskurs = Saldo Hauptbuch
  feststellung_wenn: Mengendifferenz, Wallet ohne Nachweis der Verfügungsmacht, nicht erfasste Adressen oder Custodian-Auszug weicht vom Buchbestand ab.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0042-s165
    zitat: ist eine regelmässige Abstimmung zwischen Haupt- und Nebenbuch sowie insbesondere zwischen dem Nebenbuch und dem Token-Bestand notwendig
  - quelle: hwp-bur-2023__rz-0044-s166-t2
    zitat: insbesondere für selbstverwaltete Wallets die Durchführung von Verfahren wie Sign-Message empfehlenswert
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise beiziehen
- id: H1-313
  vorgehen: Nur bei Krypto-Assets. Transaktionen kurz vor und nach dem 31.12. aus Blockchain-Export bzw. Custodian-Report (vom Kunden) mit Buchungsdatum im Hauptbuch und in den Kontoblättern
    des Folgejahres vergleichen; Zeitstempel der Blockchain beachten. Fehlende oder periodenfremde Buchungen mit Datum und Betrag dokumentieren.
  nachweise:
  - Blockchain-Export/Custodian-Report um den Stichtag
  - Hauptbuch Dezember
  - Kontoblätter Folgejahr
  rechnen: 'Je Transaktion: Zeitstempel ≤ 31.12. ⇔ Buchung im Berichtsjahr'
  feststellung_wenn: Transaktion vor dem Stichtag erst im Folgejahr gebucht (oder umgekehrt) mit wesentlicher Auswirkung auf Bestand oder Erfolg.
  fundstellen:
  - quelle: ser-2022__4-3-6
    zitat: Geprüft wird, ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden.
  - quelle: hwp-bur-2023__rz-0042-s165
    zitat: allein der Eintrag einer Transaktion in einer Blockchain als Verbuchungsnachweis für Zwecke der Buchführung nicht als ausreichend
- id: H1-314
  vorgehen: Nur bei Krypto-Assets. Buchwert je Token mit Stichtagskursen aus mindestens zwei unabhängigen Quellen (z.B. ESTV-Kursliste, Börsen-/Datenfeed) vergleichen; Methode (Anschaffungs-/Niederstwert
    oder Marktpreis für die ganze Position), Bewertungszeitpunkt und Schwankungsreserve im Textfeld dokumentieren.
  nachweise:
  - Bewertungsliste Krypto 31.12.
  - Kursnachweise mehrerer Quellen
  - ESTV-Kursliste
  rechnen: Marktwert = Menge × Kurs 31.12. je Quelle; Abweichung zwischen Quellen in %; Wertberichtigungsbedarf = Buchwert – min(Anschaffungswert, Marktwert) bei Anschaffungswertbewertung
  feststellung_wenn: Buchwert über zulässigem Wert, wesentliche Kursabweichung zwischen Quellen ohne Begründung oder Marktpreisbewertung nur für Teil der Position.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0045-s167-t1
    zitat: sind gestützt auf Art. 960b Abs. 1 OR alle Kryptowährungen in der jeweiligen Bilanzposition auf diese Weise zu erfassen
  - quelle: treuhand-almanach-2026__s060-1
    zitat: die ESTV publiziert die Steuerwerte der verbreitetsten Kryptowährungen in der Kursliste
  - quelle: hwp-or-2024__rz-1183-s420
    zitat: Die Bewertungspreise für die Folgebewertung sind grundsätzlich mit einer unabhängigen externen Kursquelle vom Prüfer nachzuvollziehen.
- id: H1-315
  vorgehen: Nur bei Krypto-Assets. Prüfen, ob der Ausweis sachgerecht ist (Wertschriften im Umlauf-/Anlagevermögen, Vorräte oder immaterielle Werte; nicht flüssige Mittel/Forderungen)
    und der Anhang Grundsätze, Hinweis auf Marktpreisbewertung mit Gesamtwert, Schwankungsreserve und wesentliche Wertverluste nach dem Stichtag enthält. Swiss GAAP FER/IFRS nur, falls
    angewendet.
  nachweise:
  - Bilanz und Anhang
  - Bewertungsliste Krypto
  - Kursnachweise nach Stichtag
  rechnen: ''
  feststellung_wenn: Ausweis als flüssige Mittel/Forderungen, fehlende Anhangangaben zu Methode oder Marktpreisbewertung oder nicht offengelegte wesentliche Wertverluste nach dem Stichtag.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0046-s167-t1
    zitat: Nicht sachgemäss ist ein Ausweis als flüssige Mittel oder als Forderungen.
  - quelle: hwp-bur-2023__rz-0051-s169
    zitat: Entsprechend ist gemäss Art. 959c Abs. 1 Ziff. 1 OR im Anhang offenzulegen, wie Kryptowährungen im Jahresabschluss berücksichtigt worden sind.
  - quelle: hwp-bur-2023__rz-0053-s170
    zitat: Sofern Bewertungen zu beobachtbaren Marktpreisen vorgenommen worden sind, ist im Anhang auf diese Bewertungen hinzuweisen
- id: H1-320
  vorgehen: 'Anhang auf Angaben zu Finanzanlagen prüfen: Grundsätze, Marktpreisbewertung mit Gesamtwert und Schwankungsreserve, Beteiligungen (Firma, Rechtsform, Sitz, Kapital-/Stimmenanteil),
    eigene Anteile, verpfändete/gesperrte Aktiven, Eventualverbindlichkeiten (Einzahlungs-/Nachschusspflicht), Forderungen ggü. Beteiligten, Nettoauflösung stiller Reserven, Ereignisse
    nach dem Stichtag.'
  nachweise:
  - Anhang Jahresrechnung
  - Prüfungsergebnisse H1-1xx bis H1-4xx
  rechnen: Anhangbeträge = Prüfungsergebnisse (z.B. Summe verpfändete Aktiven, Gesamtwert zu Marktpreisen)
  feststellung_wenn: Pflichtangabe nach Art. 959c, 959a Abs. 4 oder 960b OR fehlt oder Betrag weicht vom Prüfungsergebnis ab.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: or__art-960b
    zitat: Der Gesamtwert der entsprechenden Aktiven muss für Wertschriften und übrige Aktiven mit beobachtbarem Marktpreis je gesondert offengelegt werden.
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach direkt oder wesentlichen indirekt gehaltenen Anteilen an anderen Unternehmen
- id: H1-321
  vorgehen: Kundenaufstellung stille Reserven (Differenz Buchwert zu obligationenrechtlichem Höchstwert je Position) für Finanzanlagen übernehmen oder als Pendenz anfordern; Bestand
    und Veränderung ggü. Vorjahr nachrechnen, mit Ergebnissen H1-305/306 plausibilisieren; Nettoauflösung mit dem Jahresergebnis vergleichen (Anhangpflicht).
  nachweise:
  - Aufstellung stille Reserven Berichtsjahr/Vorjahr
  - Kurs-/Bewertungsnachweise
  - Anhang
  rechnen: Stille Reserve = obligationenrechtlicher Höchstwert – Buchwert je Position; Veränderung = Bestand 31.12. – Bestand Vorjahr; Nettoauflösung vs. Jahresergebnis
  feststellung_wenn: Nettoauflösung stellt das Ergebnis wesentlich günstiger dar und ist im Anhang nicht offengelegt, oder Aufstellung fehlt bzw. ist nicht nachvollziehbar.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- id: H1-322
  vorgehen: 'Dauerakte in M-Files mit mehrjährig gültigen Dokumenten zu Finanzanlagen ergänzen bzw. aktualisieren: Beteiligungsverzeichnis, Kauf-, Darlehens-, Kautions- und Pfandverträge,
    Rangrücktritte, Statuten/HR-Auszüge der Gesellschaften, Custodian-Verträge/Wallet-Liste. Fehlende Verträge als Pendenz; Änderungen im Textfeld vermerken.'
  nachweise:
  - Dauerakte M-Files
  - Verträge
  - Beteiligungsverzeichnis
  rechnen: ''
  feststellung_wenn: Wesentlicher Vertrag (z.B. Darlehen, Beteiligungskauf, Verpfändung) fehlt und ist beim Kunden nicht erhältlich (Pendenz).
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen, die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben
  - quelle: hwp-bur-2023__rz-0268-s217
    zitat: Insbesondere sollten bei allen längerfristigen Darlehensverhältnissen die wichtigsten Vertragspunkte im Interesse der Beweisbarkeit schriftlich festgehalten werden.
- id: H1-401
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. a) Bei nicht voll liberierten Titeln Einzahlungs- und Nachschusspflichten aus Titeln, Statuten, Kaufverträgen erheben; b) Verpfändungen,
    Sperren und Kautionen aus Pfand-/Kreditverträgen und Auszügen (Sperrvermerk) erheben. Gesamtbeträge mit Anhang (Sicherheiten, Eventualverbindlichkeiten) abgleichen.
  nachweise:
  - Titel/Statuten/Kaufverträge
  - Pfand- und Kreditverträge
  - Depot-/Kontoauszüge mit Sperrvermerk
  - Anhang
  rechnen: Ausstehende Einzahlung = Nennwert – einbezahlter Betrag je Titel; Summe verpfändete/gesperrte Aktiven = Anhangbetrag
  feststellung_wenn: Einzahlungs-/Nachschusspflicht oder verpfändete/gesperrte Aktiven bestehen und sind im Anhang nicht oder mit falschem Betrag angegeben.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0279-s219
    zitat: Aufbewahrungsort der Titel sowie Hinweise auf Einzahlungs- und Nachschusspflichten
  - quelle: or__art-687
    zitat: Der Erwerber einer nicht voll einbezahlten Namenaktie ist der Gesellschaft gegenüber zur Einzahlung verpflichtet, sobald er im Aktienbuch eingetragen ist.
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
- id: H1-402
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Bewertung je Titel mit a) Kurs-/Wertangabe im Depotauszug per 31.12., b) ESTV-Kursliste per 31.12. bzw. c) anderen Unterlagen
    (Abschlüsse, Transaktionspreise) vergleichen; Quelle und Kurs je Titel im Textfeld festhalten.
  nachweise:
  - Depotauszug 31.12.
  - ESTV-Kursliste 31.12.
  - Jahresabschlüsse/Transaktionsbelege
  rechnen: Kurswert = Menge × Kurs 31.12. (Depotauszug bzw. Kursliste); Differenz zum Buchwert je Titel
  feststellung_wenn: Buchwert über Kurs-/Marktwert ohne Begründung (Anschaffungswertprinzip) oder wesentliche Abweichung bei Marktpreisbewertung.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Bewertung angewandten Börsenkurse mit den entsprechenden Jahresendkursen von Banken, Börsen oder anderen Quellen
  - quelle: hwp-bur-2023__rz-0045-s167-t1
    zitat: Dabei kann beispielsweise auf die Bewertung der Eidgenössischen Steuerverwaltung (ESTV) abgestellt werden
  - quelle: treuhand-almanach-2026__s062-2
    zitat: Vgl. Kurslisten der ESTV
- id: H1-403
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Finanzanlagen nach Schuldner/Emittent, Anlageklasse, Währung und Nahestehenden gruppieren; Anteile an Total Finanzanlagen und
    Bilanzsumme berechnen; Klumpenrisiken (z.B. einzelner Darlehensnehmer, Krypto) im Textfeld festhalten und in die Bewertungsbeurteilung einbeziehen.
  nachweise:
  - Aufstellung Finanzanlagen
  - Bilanz
  rechnen: Anteil je Schuldner/Emittent = Buchwert / Total Finanzanlagen bzw. / Bilanzsumme
  feststellung_wenn: Einzelposition mit hohem Anteil an Bilanzsumme/Eigenkapital und erkennbarem Bonitäts- oder Kursrisiko ohne Wertberichtigung (Punkt für Schlussbesprechung).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0177-s197
    zitat: das Darlehen im Vergleich zu anderen Bilanzpositionen unverhältnismässig hoch ist und ein Klumpenrisiko darstellt
  - quelle: hwp-bur-2023__rz-0272-s218
    zitat: Das gesamte Engagement gegenüber dem Schuldnerunternehmen ist in die Beurteilung einzubeziehen
- id: H1-404
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. VSt-pflichtige Erträge (inländische Zinsen, Dividenden) aus Ertragsabrechnungen/Kontoauszügen erheben; prüfen, ob Ertrag brutto
    gebucht und 35 % VSt als Guthaben aktiviert sind; Vorjahresguthaben und Rückforderung (frühestens nach Ablauf des Kalenderjahres) abgleichen.
  nachweise:
  - Ertragsabrechnungen/Kontoauszüge
  - Kontoblatt VSt-Guthaben
  - Rückerstattungsantrag/-gutschrift
  rechnen: VSt-Guthaben = Σ VSt-pflichtige Bruttoerträge × 35 %; Saldo VSt-Konto = VSt Berichtsjahr + noch nicht zurückerstattete Vorjahresguthaben
  feststellung_wenn: VSt nicht aktiviert oder Ertrag netto gebucht (Rückerstattung gefährdet) oder alte Guthaben ohne Rückforderung.
  fundstellen:
  - quelle: treuhand-almanach-2026__s068-1
    zitat: 35 % auf Kapitalerträgen und Lotteriegewinnen
  - quelle: treuhand-almanach-2026__s069-2
    zitat: sofern sie die mit der Verrechnungssteuer belasteten Einkünfte ordnungsgemäss als Ertrag verbucht haben
  - quelle: treuhand-almanach-2026__s068-2
    zitat: Dieser Antrag kann gemäss Art. 29 Abs. 2 VStG frühestens nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt werden.
