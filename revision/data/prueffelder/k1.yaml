schritte:
- id: K1-101
  vorgehen: 'Kreditoren-OP-Liste per 31.12. aus M-Files kritisch durchsehen: Posten mit Fälligkeit vor dem Stichtag (alt), ungewöhnlich hohe Posten (≥ Toleranzwesentlichkeit bzw. Vorgabe
    WP) und Soll-Salden markieren. Schriftliche Kundenantworten auswerten; fehlen sie, je markiertem Posten Frage als Pendenz (Kreditor, Beleg, Betrag). Im Textfeld Auswahlkriterien,
    Posten, Antworten und abgedeckte Prüfziele (EX, VO, PA) dokumentieren.'
  nachweise:
  - Kreditoren-OP-Liste 31.12.
  - schriftliche Antworten der Finanzverantwortlichen
  - Saldoliste
  rechnen: Tage überfällig je Posten = 31.12. − Fälligkeitsdatum; Liste Posten ≥ Toleranzwesentlichkeit; Σ Sollsalden
  feststellung_wenn: Alte oder ungewöhnlich hohe Posten bzw. Sollsalden ohne plausible schriftliche Begründung oder mit Hinweisen auf Bestreitung, Doppelerfassung oder nicht mehr geschuldete
    Beträge.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Kritische Durchsicht der offenen Posten. Befragung über Gründe für alte, ungewöhnlich hohe Posten sowie Soll-Salden
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- id: K1-102
  vorgehen: Salden der Kreditorenkonten Geschäftsjahr/Vorjahr aus der Saldoliste gegenüberstellen und vorab eine Erwartung aus Einkaufs-/Materialaufwand und Geschäftsverlauf ableiten.
    Wesentliche Abweichungen (über tolerierbarer Abweichung) als Frage an den Kunden (Pendenz) erfassen; schriftliche Antworten kritisch gegen Kenntnisse (Aufwand, Zahlungsverhalten,
    Projekte) plausibilisieren und im Textfeld festhalten.
  nachweise:
  - Saldoliste 2025/2024
  - Erfolgsrechnung (Material-/Fremdleistungsaufwand)
  - schriftliche Antworten Kunde
  rechnen: Δ = Saldo Kreditoren 31.12.2025 − Saldo 31.12.2024; Δ% = Δ / Saldo VJ; Abweichung zum Erwartungswert vs. tolerierbare Abweichung
  feststellung_wenn: Wesentliche Abweichung ohne plausible Erklärung oder Erklärung widerspricht den übrigen Prüfungserkenntnissen.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Insbesondere geht der Abschlussprüfer Diskrepanzen zu seinem Verständnis des geprüften Unternehmens und anderen nicht plausiblen Auskünften nach.
- id: K1-103
  vorgehen: Schriftliche Beschreibung des Rechnungseingangs und der Abschlussarbeiten auswerten (Erfassung nach Leistungsdatum, Behandlung erhaltener, nicht fakturierter Lieferungen,
    Stichtagsregelung, Interimskonten); fehlt sie, Fragen als Pendenz. Aussagen mit Kontoblättern des Folgejahres und den passiven Abgrenzungen plausibilisieren (Verweis K1-302/K1-303).
    Keine IKS-Prüfung; Ergebnis im Textfeld.
  nachweise:
  - Prozessbeschrieb/Antwort Kunde
  - Kontoblätter Kreditoren Folgejahr
  - Liste passive Abgrenzungen
  rechnen: ''
  feststellung_wenn: Kein Verfahren zur Stichtagsabgrenzung erkennbar oder Antwort steht im Widerspruch zu Buchungen in neuer Rechnung.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Befragung, wie die vollständige, periodengerechte Erfassung sichergestellt wurde
  - quelle: ser-2022__4-3-4
    zitat: Befragungen von Personen, die nicht an der Erstellung der Jahresrechnung beteiligt sind, analytische Prüfungshandlungen sowie die Prüfung von Ereignissen nach dem Bilanzstichtag
- id: K1-201
  vorgehen: Bestand der Verbindlichkeiten aus LuL (inkl. Unterkonten) mit dem Vorjahr vergleichen; ergänzend Kreditorenfrist beider Jahre berechnen. Erwartung vor dem Vergleich formulieren,
    tolerierbare Abweichung aus der Toleranzwesentlichkeit ableiten. Ergebnis und Abweichungsanalyse im Textfeld; nicht plausible Abweichungen an K1-102 übergeben und mit Detailprüfungen
    (K1-301 ff.) ergänzen.
  nachweise:
  - Saldoliste 2025/2024
  - Jahresrechnung Vorjahr
  - Erfolgsrechnung
  rechnen: Δ = Kreditoren 2025 − Kreditoren 2024; Δ%; Kreditorenfrist (Tage) = Kreditoren / Material- und Fremdleistungsaufwand × 365 je Jahr; |Ist − Erwartung| ≤ tolerierbare Abweichung
  feststellung_wenn: Veränderung oder Kreditorenfrist weicht wesentlich von der Erwartung ab und ist nicht erklärt.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Vergleich des Bestands der Verbindlichkeiten mit dem Vorjahr
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: ser-2022__6-1-2-t3
    zitat: Bei wesentlichen Bilanzpositionen sind die analytischen Prüfungshandlungen in der Regel um angemessene Detailprüfungen zu ergänzen
- id: K1-202
  vorgehen: 'Fremdwährungskreditoren in OP-Liste und Hauptbuch identifizieren (Währung, FW-Betrag). Angewandten Umrechnungskurs je Posten mit dem Jahresendkurs aus Bankunterlagen (Kontoauszug,
    Bankbestätigung per 31.12.) vergleichen und CHF-Wert nachrechnen. Keine FW-Kreditoren: im Textfeld «nicht anwendbar» mit Begründung festhalten.'
  nachweise:
  - OP-Liste mit Währungsangabe
  - Kontoauszug/Bankbestätigung mit Devisenkurs 31.12.
  - Kontoblätter FW-Konten
  rechnen: CHF-Soll = FW-Betrag × Jahresendkurs; Differenz = CHF-Buchwert − CHF-Soll; Σ Differenzen je Währung vs. NAG
  feststellung_wenn: Verwendeter Kurs weicht wesentlich vom Jahresendkurs ab bzw. Umrechnungsdifferenz über NAG oder Kurs nicht belegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0088-s077
    zitat: bei Verpflichtungen der Briefkurs oder auch der durchschnittliche Devisenkurs des Bilanzstichtags
- id: K1-203
  vorgehen: 'Liste nahestehender Personen (Aktionäre gemäss Aktienbuch, VR/GL gemäss HR-Auszug, Beteiligungsgesellschaften) aus Dauerakte übernehmen bzw. erstellen und mit Kreditoren
    in OP-Liste/Kreditorenstamm abgleichen (Name, Adresse). Treffer: gesonderten Ausweis in Bilanz oder Anhang prüfen und Konditionen plausibilisieren; fehlende Informationen als Pendenz.'
  nachweise:
  - Aktienbuch
  - Handelsregisterauszug/Unternehmensinformationen
  - OP-Liste Kreditoren
  - Anhang Jahresrechnung
  rechnen: Σ Kreditoren ggü. Nahestehenden = Σ OP-Posten mit Kreditor ∈ Liste Nahestehende; Abgleich mit Ausweis Bilanz/Anhang
  feststellung_wenn: Kreditoren gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften ohne gesonderten Ausweis oder mit nicht marktüblichen Konditionen.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Feststellung von Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung
  - quelle: or__art-959a-t2
    zitat: Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils
      gesondert
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
- id: K1-301
  vorgehen: Total der Kreditoren-OP-Liste nachrechnen und mit Saldo Kreditorenkonto (Saldoliste, Kontoblatt) und Bilanzposition der Jahresrechnung abstimmen. Stichtag und Erstellungsdatum
    der Liste prüfen (keine Folgejahresbuchungen). Ergebnis mit Beträgen und allfälliger Differenz im Textfeld dokumentieren.
  nachweise:
  - Kreditoren-OP-Liste 31.12.
  - Saldoliste
  - Kontoblatt Kreditoren
  - Jahresrechnung (Bilanz)
  rechnen: Σ Offen CHF (OP-Liste) = Saldo Kreditorenkonto (Hauptbuch/Saldoliste) = Bilanzposition Verbindlichkeiten aus LuL; Differenz = 0
  feststellung_wenn: Nicht erklärte Differenz zwischen OP-Liste, Hauptbuch und Jahresrechnung oder OP-Liste nicht per Stichtag.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Abstimmung des Totals der Kreditoren-OP-Liste mit der Jahresrechnung
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege, Abstimmung mit Auszügen, Durchsicht von Belegen in neuer Rechnung usw.
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- id: K1-302
  vorgehen: 'Kreditorenjournal und Kontoblätter Kreditoren/Aufwand des Folgejahres bis Revisionsdatum sowie noch nicht verbuchte Rechnungen durchsehen; Rechnungen mit Liefer-/Leistungsdatum
    ≤ 31.12. herausfiltern und prüfen, ob in OP-Liste, passiven Abgrenzungen oder Rückstellungen erfasst. WP-Schritt: Agent erstellt Abgleichsliste mit Summe, Beurteilung durch WP.'
  nachweise:
  - Kreditorenjournal Folgejahr
  - Kontoblätter Folgejahr
  - Lieferantenrechnungen
  - Liste passive Abgrenzungen
  rechnen: Σ Rechnungen Folgejahr mit Leistung ≤ 31.12.2025, die weder in OP-Liste noch in Abgrenzungen enthalten sind = mögliche Unterbewertung; Vergleich mit NAG/TW
  feststellung_wenn: Rechnungen für im Geschäftsjahr erhaltene Lieferungen/Leistungen weder als Kreditor noch als Abgrenzung erfasst (Summe über NAG).
  fundstellen:
  - quelle: ser-2022__anh-d-s084-2
    zitat: Durchsicht der in neuer Rechnung verbuchten bzw. noch nicht verbuchten Kreditorenrechnungen und/oder der Kreditoren- und Aufwandskonten auf Rechnungen
  - quelle: hwp-bur-2023__rz-0445-s250
    zitat: Bereits erhaltene Lieferungen und Leistungen, die noch nicht fakturiert sind, stellen, auch wenn der Rechnungsbetrag bereits bestimmbar ist, Abgrenzungsposten dar
  - quelle: ser-2022__4-3-6
    zitat: Geprüft wird, ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden.
- id: K1-303
  vorgehen: 'Wareneingangsbelege/Lieferscheine kurz vor und nach dem Stichtag (Zeitraum gemäss Vorgabe WP) mit OP-Liste, Kreditorenjournal Folgejahr, Abgrenzungen und Inventar abgleichen:
    Lieferung bis 31.12. → Verbindlichkeit/Abgrenzung im Geschäftsjahr; Lieferung danach → keine Erfassung. WP-Schritt: Agent stellt Abgleichstabelle bereit.'
  nachweise:
  - Wareneingangsbelege/Lieferscheine Dez./Jan.
  - Kreditorenjournal Folgejahr
  - Inventarliste
  - OP-Liste
  rechnen: 'Je Wareneingang: Lieferdatum ≤ 31.12. ⇒ Kreditor oder Abgrenzung per 31.12. erforderlich; Lieferdatum > 31.12. ⇒ keine Erfassung im Geschäftsjahr'
  feststellung_wenn: Lieferungen vor dem Stichtag ohne Verbindlichkeit/Abgrenzung oder Lieferungen nach dem Stichtag im Geschäftsjahr passiviert (über NAG).
  fundstellen:
  - quelle: ser-2022__anh-d-s084-2
    zitat: Durchsicht von Wareneingangsbelegen für erhaltene Lieferungen kurz vor oder nach dem Jahresende
  - quelle: hwp-bur-2023__rz-0210-s206
    zitat: Der Übergang von Nutzen und Gefahr ist für die Aktivierungsfähigkeit in der Regel ausschlaggebend
  - quelle: ser-2022__anh-d-s092-1
    zitat: Einsicht in Rechnungen und Lieferpapiere vor und nach dem Periodenende zur Prüfung der richtigen zeitlichen Abgrenzung
- id: K1-320
  vorgehen: 'Ergebnisse des Prüffelds auf Anhangsangaben prüfen: gesonderter Ausweis Nahestehende (Art. 959a Abs. 4 OR), Aktiven unter Eigentumsvorbehalt, Eventualverbindlichkeiten aus
    bestrittenen Rechnungen, Erläuterung ausserordentlicher/periodenfremder Positionen (z. B. Lieferantenrabatte, nachträgliche Rechnungen). Abgleich mit dem Anhang; Lücken als Wesentliche
    Feststellung.'
  nachweise:
  - Anhang Jahresrechnung
  - Ergebnisse K1-203, K1-403, K1-409
  - Antworten Kunde zu Eigentumsvorbehalt/Bestreitungen
  rechnen: ''
  feststellung_wenn: Erforderliche Anhangsangabe (Nahestehende, Eigentumsvorbehalt, Eventualverbindlichkeit, a.o./periodenfremde Position) fehlt oder ist unvollständig.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-3
    zitat: gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, in der Bilanz oder im Anhang ausgewiesen (Art. 959a Abs. 4 OR)
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: or__art-959c-t2
    zitat: Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- id: K1-321
  vorgehen: 'Aufstellung stille Reserven des Kunden beiziehen und Position Kreditoren prüfen: Bewertung zum Nennwert, keine Reserven über fiktive oder überhöhte Kreditoren. Bestand und
    Veränderung der Position in die Gesamtaufstellung übernehmen; wesentliche Nettoauflösung für Anhang (Art. 959c Abs. 1 Ziff. 3 OR) an K1-320/Anhangsprüfung melden. Keine Reserven:
    «keine» dokumentieren.'
  nachweise:
  - Aufstellung stille Reserven
  - Ergebnisse K1-301/K1-405
  rechnen: Veränderung = Bestand stille Reserven Kreditoren 31.12.2025 − 31.12.2024; Übertrag in Gesamtaufstellung
  feststellung_wenn: Stille Reserven in den Kreditoren (fiktive oder überhöhte Verbindlichkeiten) oder wesentliche Nettoauflösung ohne Anhangsangabe.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0669-s296
    zitat: Diese Formen der Bildung von stillen Reserven schliessen es unter anderem aus, Aktiven wegzulassen und fiktive Verbindlichkeiten zu bilanzieren.
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- id: K1-322
  vorgehen: 'Dauerakte zum Prüffeld prüfen und aktualisieren: Rahmen-/Lieferverträge mit Hauptlieferanten (Konditionen, Boni, Eigentumsvorbehalt), Liste nahestehender Personen/Beteiligungen,
    Beschrieb Kreditorenprozess. Neue oder geänderte Dokumente aus M-Files verknüpfen, Fehlendes als Pendenz; im Textfeld Stand und Änderungen festhalten.'
  nachweise:
  - Dauerakte
  - Lieferverträge
  - Liste Nahestehende
  rechnen: ''
  feststellung_wenn: Wesentliche mehrjährige Verträge oder die Liste Nahestehender fehlen bzw. sind veraltet (Pendenz).
  fundstellen:
  - quelle: ser-2022__7-3
    zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen, die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben
- id: K1-401
  vorgehen: 'Einholen von Kreditorenbestätigungen geht über die eingeschränkte Revision hinaus: Agent holt nichts ein und versendet nichts; nur auf ausdrückliche Anweisung des WP vorbereiten.
    Liegen beim Kunden bereits Lieferantenkontoauszüge/Saldomeldungen vor, diese je Lieferant mit der OP-Liste abgleichen. Im Textfeld «nicht durchgeführt – über ER hinausgehend» bzw.
    Ergebnis des Abgleichs.'
  nachweise:
  - vorhandene Lieferantenkontoauszüge/Saldomeldungen
  - OP-Liste Kreditoren
  rechnen: 'Je Lieferant: Saldo gemäss Lieferantenauszug − Saldo OP-Liste = Differenz; Differenzen nach Ursache (Zahlung unterwegs, nicht erfasste Rechnung, Anzahlung) erklären'
  feststellung_wenn: Vorhandene Lieferantenbestätigung zeigt nicht erfasste Rechnungen oder nicht erklärte Differenzen über NAG.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-2
    zitat: Einholen von Kreditorenbestätigungen
  - quelle: hwp-er-2026__rz-0262-s085
    zitat: verlangt die eingeschränkte Revision von der Revisionsstelle weder das Einholen von Debitoren- und Kreditorenbestätigungen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
- id: K1-402
  vorgehen: 'Sammelschritt zu K1-114: Aus K1-203 die Kreditoren gegenüber beteiligten Unternehmen und Beteiligungsgesellschaften übernehmen und je Gegenpartei Saldo per 31.12. auflisten;
    Abstimmungsweg unter K1-114 dokumentieren. Kennzeichnung «?» im Katalog unklar: Zuständigkeit (EP/WP) beim WP als Pendenz klären.'
  nachweise:
  - Ergebnis K1-203
  - OP-Liste/Kontoblätter Kreditoren
  rechnen: 'Liste je Gegenpartei: Saldo Kreditor 31.12.2025'
  feststellung_wenn: Kreditoren gegenüber Beteiligungen/beteiligten Unternehmen ohne Nachweis oder ohne gesonderten Ausweis.
  fundstellen:
  - quelle: or__art-959a-t2
    zitat: Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils
      gesondert
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Feststellung von Transaktionen mit nahestehenden Personen mittels Befragung (Prüfungsziel «Vorhandensein»)
- id: K1-114
  vorgehen: 'a) Liegt die Buchhaltung oder Jahresrechnung der Gegenpartei (z. B. Tochtergesellschaft) beim Kunden vor, reziproke Salden per 31.12. abgleichen (Kreditor hier = Forderung
    dort) und Differenzen klären lassen. b) Saldobestätigungen Dritter gehören nicht zur eingeschränkten Revision: nur auf Anweisung WP, sonst vorhandene Unterlagen verwenden. Ergebnis
    je Gegenpartei im Textfeld.'
  nachweise:
  - Jahresrechnung/Saldenliste der Gegenpartei
  - OP-Liste Kreditoren
  - allenfalls vorhandene Bestätigungen
  rechnen: Saldo Kreditor (Gesellschaft) − Saldo Forderung (Gegenpartei, gleicher Stichtag/Währung) = Differenz; Differenz = 0 oder erklärt (Rechnungen/Zahlungen unterwegs)
  feststellung_wenn: Nicht erklärte Differenz zwischen reziproken Salden oder Gegenpartei weist Forderungen aus, die nicht passiviert sind.
  fundstellen:
  - quelle: hwp-er-2026__rz-0262-s085
    zitat: Die Prüfung beschränkt sich grundsätzlich auf beim geprüften Unternehmen intern verfügbare Informationen.
  - quelle: hwp-or-2024__rz-0923-s360-t1
    zitat: Abgleich der bilanzierten Salden mit der Gegenbuchhaltung
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: das Einholen von Bestätigungen von Dritten (Bank-, Debitoren- oder Kreditorenbestätigungen
- id: K1-403
  vorgehen: 'OP-Liste nach Fälligkeit in Altersklassen gliedern (nicht fällig, 1–30, 31–90, über 90 Tage überfällig) und mit Vorjahr vergleichen. Stark überfällige Posten hinterfragen:
    Bestreitung (Bilanzierung/Eventualverbindlichkeit), Liquiditätsengpass (Hinweis Fortführung), nicht mehr geschuldete Posten. Fragen als Pendenz (Verknüpfung K1-101); Ergebnis im
    Textfeld.'
  nachweise:
  - Kreditoren-OP-Liste 31.12. (Fälligkeiten)
  - OP-Liste Vorjahr
  - Antworten Kunde
  rechnen: Tage überfällig = 31.12.2025 − Fälligkeitsdatum; Σ je Altersklasse; Anteil überfällig = Σ überfällig / Total OP
  feststellung_wenn: Wesentlicher Anteil überfälliger Kreditoren, alte bestrittene Posten ohne Beurteilung oder alte Posten ohne Rechtsgrund weitergeführt bzw. ausgebucht.
  fundstellen:
  - quelle: ser-2022__anh-g-s138-2
    zitat: überzogene Zahlungsfristen für Kreditoren
  - quelle: hwp-bur-2023__rz-0448-s250
    zitat: Bestrittene Verbindlichkeiten sind, sofern sie nicht offensichtlich unberechtigt sind, zu bilanzieren oder als Eventualverbindlichkeiten im Anhang auszuweisen
  - quelle: ser-2022__anh-d-s084-1
    zitat: Kritische Durchsicht der offenen Posten. Befragung über Gründe für alte, ungewöhnlich hohe Posten sowie Soll-Salden
- id: K1-404
  vorgehen: 'Für Lieferungen um den Stichtag Konsistenz zwischen Wareneingang, Inventar/angefangenen Arbeiten und Kreditoren prüfen: Ware im Inventar bzw. Material auf Projekten per
    31.12. → zugehörige Rechnung als Kreditor oder Abgrenzung; Rechnung ohne Wareneingang → Anzahlung/Abgrenzung. Massgebend ist der Übergang von Nutzen und Gefahr. Ergebnisse mit den
    Prüffeldern Vorräte/angefangene Arbeiten abstimmen.'
  nachweise:
  - Inventarliste/Inventurprotokoll 31.12.
  - Projektliste angefangene Arbeiten
  - Wareneingangsbelege
  - OP-Liste/Kreditorenjournal Folgejahr
  rechnen: 'Je Stichtagslieferung: (im Inventar/Projekt per 31.12.) ⇔ (Kreditor oder Abgrenzung per 31.12.); Σ Inkonsistenzen vs. NAG'
  feststellung_wenn: Ware im Inventar/Projekt ohne korrespondierende Verbindlichkeit/Abgrenzung oder umgekehrt (über NAG).
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über das Vorgehen zur Überwachung der zeitlichen Abgrenzung am Ende des Geschäftsjahres
  - quelle: hwp-bur-2023__rz-0211-s206
    zitat: Der konkrete Zeitpunkt des Übergangs von Nutzen und Gefahr ist aufgrund der vertraglichen Grundlagen zu bestimmen
- id: K1-405
  vorgehen: 'Wesentliche OP-Posten (Auswahl nach Betrag/Risiko bzw. Vorgabe WP, keine repräsentative Stichprobe) mit den Lieferantenrechnungen in M-Files abgleichen: Lieferant, Rechnungsnummer,
    Datum, Leistungszeitraum, Betrag/Währung, Empfänger = Gesellschaft, Kontierung; Doppelerfassungen prüfen. Fehlende Rechnungen als Pendenz (Kreditor, Beleg, Betrag); Abdeckung im
    Textfeld.'
  nachweise:
  - Kreditoren-OP-Liste 31.12.
  - Lieferantenrechnungen
  rechnen: 'Je Posten: Betrag OP-Liste − Rechnungsbetrag (abzüglich Teilzahlungen/Gutschriften) = 0; Abdeckung = Σ geprüfte Posten / Total OP'
  feststellung_wenn: Rechnung fehlt, lautet nicht auf die Gesellschaft, Betrag/Datum weicht ab, Leistung nicht im Geschäftsjahr oder Doppelerfassung.
  fundstellen:
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
  - quelle: ser-2022__4-3-2
    zitat: Bilanzierte Verpflichtungen müssen solche des Unternehmens (und nicht z. B. des Eigentümers) sein.
- id: K1-406
  vorgehen: OP-Liste bzw. Kreditorensaldi je Lieferant auf Soll-Salden (Gutschriften, Anzahlungen, Doppelzahlungen) durchsuchen und Summe ermitteln. Prüfen, ob wesentliche Sollsalden
    in die übrigen kurzfristigen Forderungen (bzw. geleistete Anzahlungen) umgegliedert sind. Fehlende Umgliederung als Wesentliche Feststellung mit Buchungsvorschlag (keine Verbuchung).
  nachweise:
  - Kreditoren-OP-Liste/Saldenliste je Lieferant
  - Kontoblatt geleistete Anzahlungen
  rechnen: Σ Sollsalden je Lieferant; Kreditoren brutto = Kreditoren netto + Σ Sollsalden; Umgliederungsbedarf, falls Σ wesentlich
  feststellung_wenn: Wesentliche Sollsalden mit Habensalden verrechnet oder nicht als übrige kurzfristige Forderungen ausgewiesen.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0450-s251
    zitat: Wesentliche Sollsalden sind in den übrigen kurzfristigen Forderungen zu bilanzieren.
  - quelle: hwp-bur-2023__rz-0155-s192
    zitat: Sollsalden aus den Verbindlichkeiten aus Lieferungen und Leistungen sind als übrige kurzfristige Forderungen
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- id: K1-407
  vorgehen: 'Aktuelle OP-Liste (Stand Revisionsdatum) einsehen und mit der OP-Liste per 31.12. vergleichen: bezahlte Stichtagsposten (Bestätigung von Bestand und Höhe, Zahlungen mit
    Bankauszug Folgejahr plausibilisieren), noch offene Posten (Gründe → K1-101/K1-403) und neue Posten mit Leistung im Geschäftsjahr (Vollständigkeit) identifizieren.'
  nachweise:
  - aktuelle OP-Liste Kreditoren
  - OP-Liste 31.12.
  - Bankauszüge Folgejahr
  - Kontoblatt Kreditoren Folgejahr
  rechnen: Bezahlt seit Stichtag = Σ OP 31.12. nicht mehr offen; Quote = bezahlt / Total OP 31.12.; Σ neue Posten mit Leistung ≤ 31.12.2025
  feststellung_wenn: Neue Posten mit Leistung im Geschäftsjahr nicht passiviert oder Stichtagsposten ohne Zahlung und ohne plausible Erklärung.
  fundstellen:
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege, Abstimmung mit Auszügen, Durchsicht von Belegen in neuer Rechnung usw.
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Hinweise zu den Ereignissen nach dem Bilanzstichtag zu erhalten
  - quelle: ser-2022__4-3-4
    zitat: Befragungen von Personen, die nicht an der Erstellung der Jahresrechnung beteiligt sind, analytische Prüfungshandlungen sowie die Prüfung von Ereignissen nach dem Bilanzstichtag
- id: K1-408
  vorgehen: 'Kontoblätter des Kreditorenkontos und der Einkaufs-/Material-/Fremdleistungskonten kritisch durchsehen: manuelle Direktbuchungen, ungewöhnliche Gegenkonten, Sammel- und
    Korrekturbuchungen, Buchungen um den Stichtag, Stornos, runde oder hohe Beträge. Auffällige Buchungen anhand Belegen in M-Files prüfen oder als Pendenz erfassen; Auswahl und Ergebnis
    im Textfeld.'
  nachweise:
  - Kontoblatt Kreditoren
  - Kontoblätter Einkauf/Material/Fremdleistungen
  - Belege zu auffälligen Buchungen
  rechnen: Eröffnungssaldo + Σ Haben − Σ Soll = Schlusssaldo = Saldoliste; Liste Buchungen > NAG bzw. mit ungewöhnlichem Gegenkonto
  feststellung_wenn: Buchungen ohne Beleg, mit sachfremdem Gegenkonto oder falscher Periode, oder Kontoblatt nicht mit Saldoliste übereinstimmend.
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Hauptbuch und Buchungsjournale
  - quelle: ser-2022__anh-d-s092-1
    zitat: Befragung über die Grundsätze und zeitliche Abgrenzung bei der Verbuchung von Umsätzen und Waren-/Materialaufwand
- id: K1-409
  vorgehen: Konten für Einkaufspreisminderungen (Rabatte, Boni, Skonti, Gutschriften) mit Vorjahr analysieren. Bonusvereinbarungen der Hauptlieferanten einsehen und Jahresboni/Rückvergütungen
    für das Geschäftsjahr auf Abgrenzung und Ausweis (Minderung Materialaufwand, nicht a.o. Ertrag) prüfen; Gutschriften des Folgejahres auf das Geschäftsjahr betreffende Posten durchsehen.
  nachweise:
  - Kontoblätter Einkaufspreisminderungen/Skonti
  - Bonus-/Rabattvereinbarungen
  - Gutschriften Folgejahr
  - Erfolgsrechnung
  rechnen: Erwarteter Bonus = bonusberechtigter Einkauf × Bonussatz gemäss Vertrag; Differenz zu gebuchtem Betrag/Abgrenzung; Skontoquote = Skonti / Einkäufe (Vergleich VJ)
  feststellung_wenn: Boni/Rabatte des Geschäftsjahres nicht abgegrenzt, im falschen Jahr erfasst oder ausserhalb des Materialaufwands ausgewiesen (über NAG).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0756-s319
    zitat: Minderungen der Einkaufspreise (Rücksendungen, Rabatte und Preisnachlässe
  - quelle: hwp-bur-2023__rz-0218-s207
    zitat: gekürzt um Rabatte aller Art, einschliesslich der erst am Jahresende gewährten Treue- oder Mengenrabatte
  - quelle: hwp-or-2024__rz-0943-s366
    zitat: Prüfung von Rückvergütungen durch Abgleich mit geeigneten Unterlagen
