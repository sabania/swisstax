# Prüffeld K1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: K1
bezeichnung: Verbindlichkeiten aus Lieferungen und Leistungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 19
    korrigiert: false
kurzbeschrieb: 'Kreditoren aus Lieferungen und Leistungen (Mindestgliederung Art. 959a Abs. 2 Ziff. 1 lit. a OR). In der eingeschränkten Revision stehen Vollständigkeit und Periodenabgrenzung
  im Vordergrund: Befragung, Vorjahresvergleich, Abstimmung OP-Liste mit Jahresrechnung, Durchsicht neue Rechnung, Fremdwährung, Nahestehende. Kreditorenbestätigungen gehören nicht zur
  eingeschränkten Revision.'
gesetz:
- thema: Bilanzierungspflicht von Verbindlichkeiten (Fremdkapital)
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden, ein Mittelabfluss wahrscheinlich ist
- thema: 'Kurzfristige Verbindlichkeiten: Fälligkeit innert eines Jahres bzw. Geschäftszyklus'
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: 'Mindestgliederung: Verbindlichkeiten aus LuL als erste Position des kurzfristigen Fremdkapitals'
  quelle: or__art-959a-t1
  zitat: a. Verbindlichkeiten aus Lieferungen und Leistungen,
- thema: Gesonderter Ausweis gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils
    gesondert
- thema: Bewertung zum Nennwert (Art. 960e Abs. 1 OR)
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Verrechnungsverbot (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Bestandesnachweis durch Inventar oder auf andere Art (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Vollständige Erfassung der Geschäftsvorfälle (Art. 957a Abs. 2 Ziff. 1 OR)
  quelle: or__art-957a
  zitat: die vollständige, wahrheitsgetreue und systematische Erfassung der Geschäftsvorfälle und Sachverhalte
- thema: Vorjahreszahlen in der Jahresrechnung (Art. 958d Abs. 2 OR)
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- thema: 'Anhang: Aktiven unter Eigentumsvorbehalt (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: Eventualverbindlichkeiten, z. B. bestrittene Lieferantenrechnungen (Art. 959c Abs. 2 Ziff. 10 OR)'
  quelle: or__art-959c-t2
  zitat: Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: 'Anhang: ausserordentliche, einmalige oder periodenfremde Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: Verjährung (Art. 127 OR) – relevant bei alten offenen Posten
  quelle: or__art-127
  zitat: Mit Ablauf von zehn Jahren verjähren alle Forderungen, für die das Bundeszivilrecht nicht etwas anderes bestimmt.
risiken:
- text: 'Unvollständige Erfassung: Rechnungen für im Geschäftsjahr erhaltene Lieferungen/Leistungen erst im Folgejahr verbucht oder weder als Kreditor noch als Abgrenzung erfasst (Unterbewertung,
    Gewinn zu hoch).'
  pruefziele:
  - VO
  - PA
  quelle: ser-2022__4-3-4
  zitat: Es müssen sämtliche Vermögenswerte, Verbindlichkeiten, Abgrenzungen und Rückstellungen bilanziert
- text: Fiktive, doppelt erfasste oder überhöhte Kreditoren (z. B. zur Bildung stiller Reserven) – Bestand der Passiven ist wegen des Verbots fiktiver Verbindlichkeiten ebenfalls zu
    prüfen.
  pruefziele:
  - EX
  - RI
  quelle: ser-2022__4-3-1
  zitat: Wegen des Verbots der Bilanzierung fiktiver Verbindlichkeiten ist dies aber auch für die Passiven zu beachten.
- text: Verbindlichkeiten, die nicht die Gesellschaft, sondern Aktionäre/Organe betreffen (private Rechnungen), sind in den Kreditoren erfasst.
  pruefziele:
  - RV
  quelle: ser-2022__4-3-2
  zitat: Bilanzierte Verpflichtungen müssen solche des Unternehmens (und nicht z. B. des Eigentümers) sein.
- text: Falsche Periodenabgrenzung um den Bilanzstichtag (Wareneingang 2025, Rechnung 2026 oder umgekehrt), inkl. Inkonsistenz zu Vorräten und angefangenen Arbeiten.
  pruefziele:
  - PA
  - VO
  quelle: ser-2022__4-3-6
  zitat: Geprüft wird, ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden.
- text: Sollsalden (Gutschriften, Anzahlungen, Doppelzahlungen) mit Habensalden verrechnet statt als übrige kurzfristige Forderungen ausgewiesen.
  pruefziele:
  - DO
  - RI
  quelle: hwp-bur-2023__rz-0450-s251
  zitat: Eine Verrechnung von Soll- und Habensalden innerhalb der Verbindlichkeiten aus Lieferungen und Leistungen ist nicht zulässig.
- text: Kreditoren gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften nicht gesondert in Bilanz oder Anhang ausgewiesen bzw. nicht zu Drittkonditionen abgewickelt.
  pruefziele:
  - DO
  - RV
  - VO
  quelle: hwp-bur-2023__rz-0451-s251
  zitat: Für Verbindlichkeiten aus Lieferungen und Leistungen gegenüber nahestehenden Personen wird vom Gesetzgeber ein gesonderter Ausweis in der Bilanz oder im Anhang verlangt
- text: Fremdwährungskreditoren nicht zum Jahresendkurs umgerechnet (Bewertungsfehler).
  pruefziele:
  - BE
  quelle: ser-2022__anh-d-s084-1
  zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
- text: Bestrittene Lieferantenrechnungen weder passiviert noch als Eventualverbindlichkeit im Anhang offengelegt.
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0448-s250
  zitat: Bestrittene Verbindlichkeiten sind, sofern sie nicht offensichtlich unberechtigt sind, zu bilanzieren oder als Eventualverbindlichkeiten im Anhang auszuweisen
- text: Einkaufspreisminderungen (Rabatte, Boni, Skonti, Gutschriften) nicht periodengerecht abgegrenzt oder falsch ausgewiesen (z. B. ausserhalb des Materialaufwands).
  pruefziele:
  - BE
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0756-s319
  zitat: Minderungen der Einkaufspreise (Rücksendungen, Rabatte und Preisnachlässe
- text: Stark überfällige Kreditoren als Hinweis auf Liquiditätsengpässe und Zweifel an der Fortführungsfähigkeit.
  pruefziele:
  - VO
  - BE
  - DO
  quelle: ser-2022__anh-g-s138-2
  zitat: überzogene Zahlungsfristen für Kreditoren
unterlagen:
- dokument: 'Kreditoren-OP-Liste per 31.12. (je Posten: Kreditor, Beleg, Belegdatum, Fälligkeit, Währung, Betrag; mit Total)'
  zweck: Bestandesnachweis, Abstimmung mit Hauptbuch/Jahresrechnung, Altersstruktur, Sollsalden (K1-101, K1-301, K1-403, K1-405, K1-406)
  quelle: hwp-bur-2023__rz-0115-s186
  zitat: Je nach Buchführungssystem erfolgt die Bestandsermittlung anhand der Konten pro Schuldner oder aufgrund der unbezahlten Fakturen gemäss der Offen-Posten-Kontrolle.
- dokument: Saldoliste/Hauptbuch-Kontoblätter Kreditorenkonten und Einkaufs-/Materialaufwandskonten Geschäftsjahr und Vorjahr
  zweck: Vorjahresvergleich, Abstimmung, Durchsicht Buchungen (K1-102, K1-201, K1-301, K1-408)
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- dokument: Kreditorenjournal und Kontoblätter des Folgejahres bis Revisionsdatum sowie Liste noch nicht verbuchter Eingangsrechnungen
  zweck: Durchsicht neue Rechnung auf Rechnungen für Leistungen des Geschäftsjahres (K1-302, K1-407)
  quelle: ser-2022__anh-d-s084-2
  zitat: Durchsicht der in neuer Rechnung verbuchten bzw. noch nicht verbuchten Kreditorenrechnungen und/oder der Kreditoren- und Aufwandskonten auf Rechnungen
- dokument: Aktuelle OP-Liste Kreditoren (Stand Revisionsdatum) und Bankauszüge Folgejahr
  zweck: Nachweis Zahlung der Stichtagsposten, Hinweise nach dem Bilanzstichtag (K1-407)
  quelle: ser-2022__6-1-3
  zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege, Abstimmung mit Auszügen, Durchsicht von Belegen in neuer Rechnung usw.
- dokument: Lieferantenrechnungen zu ausgewählten offenen Posten und zu Rechnungen um den Stichtag
  zweck: Abstimmung OP-Liste mit Belegen, Leistungsdatum, Empfänger, Betrag (K1-405, K1-302)
  quelle: hwp-er-2026__rz-0115-s200
  zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
- dokument: Wareneingangsbelege/Lieferscheine kurz vor und nach dem Bilanzstichtag
  zweck: Cut-off-Prüfung Kreditoren/Vorräte (K1-303, K1-404)
  quelle: ser-2022__anh-d-s084-2
  zitat: Durchsicht von Wareneingangsbelegen für erhaltene Lieferungen kurz vor oder nach dem Jahresende
- dokument: Liste nahestehender Personen und Beteiligungen (Aktienbuch, Handelsregisterauszug, GV-/VR-Protokolle)
  zweck: Identifikation Kreditoren gegenüber Beteiligten, Organen, Beteiligungsgesellschaften (K1-203, K1-402)
  quelle: hwp-er-2026__rz-0161-s212
  zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
- dokument: Devisenkurse per 31.12. gemäss Bankunterlagen (Kontoauszug/Bankbestätigung)
  zweck: Kursvergleich Fremdwährungskreditoren (K1-202)
  quelle: ser-2022__anh-d-s084-1
  zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
- dokument: Beim Kunden vorhandene Lieferantenkontoauszüge/Saldomeldungen und ggf. Buchhaltung der Beteiligungsgesellschaft (Gegenbuchhaltung)
  zweck: Abgleich nur mit intern verfügbaren Unterlagen; kein Einholen durch den Agenten (K1-401, K1-114)
  quelle: hwp-er-2026__rz-0262-s085
  zitat: Die Prüfung beschränkt sich grundsätzlich auf beim geprüften Unternehmen intern verfügbare Informationen.
- dokument: Rabatt-, Bonus- und Skontovereinbarungen mit Hauptlieferanten, Gutschriften Folgejahr
  zweck: Verkehr und Abgrenzung Einkaufspreisminderungen (K1-409)
  quelle: hwp-bur-2023__rz-0218-s207
  zitat: gekürzt um Rabatte aller Art, einschliesslich der erst am Jahresende gewährten Treue- oder Mengenrabatte
- dokument: Aufstellung über Bestand und Veränderung stiller Reserven
  zweck: Position Kreditoren in der Reservenaufstellung (K1-321)
  quelle: ser-2022__anh-d-s097-2
  zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
- dokument: Liste bestrittener Lieferantenrechnungen/Mängelrügen, Verträge mit Eigentumsvorbehalt
  zweck: Bilanzierung bzw. Anhangsangaben (K1-320, K1-403)
  quelle: ser-2022__anh-d-s097-1
  zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- dokument: Unterzeichnete Vollständigkeitserklärung
  zweck: Bestätigung Vollständigkeit inkl. Ausweis Nahestehende
  quelle: ser-2022__anh-e-s103-2
  zitat: der Ausweis von Guthaben und Verbindlichkeiten gegenüber nahestehenden Personen (Art. 959a Abs. 4 OR) ist vollständig und richtig
bewertung:
- regel: Verbindlichkeiten aus LuL sind mit dem Nominal- bzw. Nennwert zu bilanzieren (Art. 960e Abs. 1 OR).
  quelle: hwp-bur-2023__rz-0447-s250
  zitat: Die Verbindlichkeiten sind mit dem Nominalbetrag in die Bilanz einzusetzen
- regel: 'Bestandsermittlung sinngemäss wie bei Forderungen: über Konten je Gläubiger oder OP-Kontrolle; Gutschriften und Akontozahlungen besonders beachten.'
  quelle: hwp-bur-2023__rz-0447-s250
  zitat: Die Bestandsermittlung der Verbindlichkeiten aus Lieferungen und Leistungen erfolgt sinngemäss wie bei den Forderungen aus Lieferungen und Leistungen
- regel: Erhaltene, aber noch nicht fakturierte Lieferungen/Leistungen sind Abgrenzungsposten, nicht Kreditoren.
  quelle: hwp-bur-2023__rz-0445-s250
  zitat: Bereits erhaltene Lieferungen und Leistungen, die noch nicht fakturiert sind, stellen, auch wenn der Rechnungsbetrag bereits bestimmbar ist, Abgrenzungsposten dar
- regel: Bestrittene Verbindlichkeiten bilanzieren oder als Eventualverbindlichkeit im Anhang ausweisen, ausser offensichtlich unberechtigt.
  quelle: hwp-bur-2023__rz-0448-s250
  zitat: Bestrittene Verbindlichkeiten sind, sofern sie nicht offensichtlich unberechtigt sind, zu bilanzieren oder als Eventualverbindlichkeiten im Anhang auszuweisen
- regel: Keine Verrechnung von Soll- und Habensalden; wesentliche Sollsalden unter übrigen kurzfristigen Forderungen ausweisen.
  quelle: hwp-bur-2023__rz-0450-s251
  zitat: Wesentliche Sollsalden sind in den übrigen kurzfristigen Forderungen zu bilanzieren.
- regel: Kurzfristig sind Verbindlichkeiten mit Fälligkeit innert eines Jahres bzw. des Geschäftszyklus.
  quelle: hwp-bur-2023__rz-0449-s250
  zitat: Als kurzfristig gelten Verbindlichkeiten, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur Zahlung fällig werden.
- regel: Kreditoren gegenüber nahestehenden Personen gesondert in Bilanz oder Anhang ausweisen (Art. 959a Abs. 4 OR).
  quelle: hwp-bur-2023__rz-0451-s251
  zitat: Für Verbindlichkeiten aus Lieferungen und Leistungen gegenüber nahestehenden Personen wird vom Gesetzgeber ein gesonderter Ausweis in der Bilanz oder im Anhang verlangt
- regel: Fremdwährungsverbindlichkeiten zum Stichtag nach dem Charakter der Position umrechnen (Briefkurs oder Durchschnittskurs des Bilanzstichtags).
  quelle: hwp-bur-2023__rz-0088-s077
  zitat: bei Verpflichtungen der Briefkurs oder auch der durchschnittliche Devisenkurs des Bilanzstichtags
- regel: Bei Fremdwährungsumrechnung Bewertungsgrundsätze (Art. 960 OR) und Imparität einhalten.
  quelle: hwp-bur-2023__rz-0089-s077
  zitat: In Abhängigkeit von der Entwicklung der Fremdwährungskurse ist das Niederstwertprinzip zu beachten
- regel: Einstandspreise sind um Rabatte aller Art inkl. Jahresendrabatte zu kürzen; handelsübliche Skonti müssen nicht abgezogen werden.
  quelle: hwp-bur-2023__rz-0218-s207
  zitat: Skonti müssen, sofern sie den handelsüblichen Rahmen nicht überschreiten, nicht abgezogen werden
- regel: Einkaufspreisminderungen (Rücksendungen, Rabatte, Preisnachlässe, Lieferantenskonti) gehören in den Materialaufwand (sofern Skonti nicht im Finanzertrag).
  quelle: hwp-bur-2023__rz-0756-s319
  zitat: Minderungen der Einkaufspreise (Rücksendungen, Rabatte und Preisnachlässe
- regel: Stille Reserven dürfen nicht durch fiktive Verbindlichkeiten gebildet werden.
  quelle: hwp-bur-2023__rz-0669-s296
  zitat: Diese Formen der Bildung von stillen Reserven schliessen es unter anderem aus, Aktiven wegzulassen und fiktive Verbindlichkeiten zu bilanzieren.
- regel: 'Bilanzierungszeitpunkt bei Warenbezug: Übergang von Nutzen und Gefahr (z. B. Incoterms); in einfachen Verhältnissen Wareneingang/Rechnungserhalt.'
  quelle: hwp-bur-2023__rz-0210-s206
  zitat: Der Übergang von Nutzen und Gefahr ist für die Aktivierungsfähigkeit in der Regel ausschlaggebend
fallstricke:
- text: Kreditorenbestätigungen (Saldobestätigungen) sind nicht Bestandteil der eingeschränkten Revision; K1-401 und K1-114 b) nicht von sich aus durchführen und nichts an Dritte versenden.
  quelle: hwp-er-2026__rz-0262-s085
  zitat: verlangt die eingeschränkte Revision von der Revisionsstelle weder das Einholen von Debitoren- und Kreditorenbestätigungen
- text: Bei wesentlichen Kreditoren (über Toleranzwesentlichkeit) genügt die Befragung allein nicht; mit analytischen und/oder Detailprüfungen ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Der Agent kann nicht selbst befragen: 1xx-Schritte nur über schriftliche Antworten auswerten, sonst Frage als Pendenz; Schritt höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: Analytische Vergleiche können durch sich kompensierende Fehler oder Veränderungen stiller Reserven verzerrt sein; Zahlen bereinigen und Erklärungen plausibilisieren.
  quelle: ser-2022__6-1-2-t3
  zitat: Zudem besteht das Risiko, dass sich zwei oder mehrere Fehlaussagen teilweise kompensieren können und deshalb bei analytischen Prüfungen nicht erkannt werden.
- text: Interims-/Abgrenzungskonten für erhaltene, nicht fakturierte Lieferungen gehören nicht in die Verbindlichkeiten aus LuL; Zuordnung in Saldoliste/Bilanz prüfen.
  quelle: hwp-bur-2023__rz-0445-s250
  zitat: Bereits erhaltene Lieferungen und Leistungen, die noch nicht fakturiert sind, stellen, auch wenn der Rechnungsbetrag bereits bestimmbar ist, Abgrenzungsposten dar
- text: Nachträgliche Lieferantenrabatte und Gutschriften sind Einkaufspreisminderungen und kein ausserordentlicher Ertrag; Ausweis in Erfolgsrechnung und Anhang prüfen.
  quelle: hwp-bur-2023__rz-0756-s319
  zitat: Minderungen der Einkaufspreise (Rücksendungen, Rabatte und Preisnachlässe
- text: 'Alte offene Kreditoren nicht ungeprüft weiterführen oder ausbuchen: Rechtsgrund (Bestreitung, Verzicht, Verjährung) klären lassen.'
  quelle: or__art-127
  zitat: Mit Ablauf von zehn Jahren verjähren alle Forderungen, für die das Bundeszivilrecht nicht etwas anderes bestimmt.
- text: OP-Liste muss den Stand per Bilanzstichtag zeigen; bei nachträglich gedruckten Listen auf Folgejahresbuchungen achten.
- text: Geleistete Anzahlungen an Lieferanten sind aktive Anzahlungen und dürfen nicht mit Kreditoren desselben Lieferanten verrechnet werden.
  quelle: hwp-bur-2023__rz-0188-s202
  zitat: Unter aktiven Anzahlungen werden geleistete Zahlungen für noch nicht oder erst teilweise erhaltene Lieferungen und Leistungen verstanden.
- text: WP-gekennzeichnete Schritte (K1-302, K1-303) bereitet der Agent nur vor (Listen, Abgleiche); Beurteilung, Visum und Abschluss bleiben beim Wirtschaftsprüfer.
fragen_kunde:
- frage: Welches sind die Gründe für die alten, ungewöhnlich hohen und die Soll-Posten in der Kreditoren-OP-Liste per 31.12. (je Posten Kreditor, Beleg, Betrag)?
  zweck: 'K1-101/K1-403/K1-406: Bestand, Vollständigkeit, Abgrenzung; schriftliche Antwort als Prüfungsnachweis'
- frage: Worauf ist die Veränderung des Kreditorenbestands gegenüber dem Vorjahr zurückzuführen (Einkaufsvolumen, Zahlungsverhalten, Projekte)?
  zweck: 'K1-102/K1-201: Erklärung wesentlicher Abweichungen'
- frage: Wie wird sichergestellt, dass alle Eingangsrechnungen und erhaltenen, noch nicht fakturierten Lieferungen/Leistungen des Geschäftsjahres per Stichtag erfasst sind (Stichtagsregelung,
    Abgrenzungen)?
  zweck: 'K1-103/K1-302/K1-303: Vollständigkeit und Periodenabgrenzung'
- frage: Bestehen Kreditoren gegenüber Aktionären, Organen oder Gesellschaften, an denen eine Beteiligung besteht bzw. die beteiligt sind? Zu welchen Konditionen?
  zweck: 'K1-203/K1-402: gesonderter Ausweis Art. 959a Abs. 4 OR, Drittvergleich'
- frage: Werden Kreditoren in Fremdwährung geführt, und welche Kurse wurden per 31.12. angewendet (Quelle)?
  zweck: 'K1-202: Bewertung'
- frage: Gibt es bestrittene Lieferantenrechnungen, Mängelrügen oder Streitigkeiten mit Lieferanten?
  zweck: 'K1-320/K1-403: Bilanzierung oder Eventualverbindlichkeit'
- frage: Wurden Waren unter Eigentumsvorbehalt bezogen oder Aktiven zur Sicherung von Lieferantenverbindlichkeiten verpfändet?
  zweck: 'K1-320: Anhangsangabe Art. 959c Abs. 2 Ziff. 9 OR'
- frage: Welche Rabatt-, Bonus- und Skontovereinbarungen bestehen, wie und auf welchen Konten werden Jahresboni und nachträgliche Gutschriften erfasst und abgegrenzt?
  zweck: 'K1-409: Verkehr und Abgrenzung Einkaufspreisminderungen'
- frage: Enthält die Position Kreditoren stille Reserven bzw. wurden solche im Geschäftsjahr gebildet oder aufgelöst (Berechnungsmethode)?
