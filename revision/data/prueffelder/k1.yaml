schritte:
- id: K1-101
  vorgehen: 'Kreditoren-OP-Liste per 31.12. aus M-Files kritisch durchsehen: Posten mit Fälligkeit vor dem Stichtag (alt), ungewöhnlich hohe Posten (≥ Toleranzwesentlichkeit bzw. Vorgabe
    WP) und Soll-Salden markieren. Schriftliche Kundenantworten auswerten; fehlen sie, je markiertem Posten Frage als Pendenz (Kreditor, Beleg, Betrag). Im Textfeld Auswahlkriterien,
    Posten, Antworten und abgedeckte Prüfziele (EX, VO, PA) dokumentieren.'
  nachweise:
  - Kreditoren-OP-Liste 31.12.
  - schriftliche Antworten der Finanzverantwortlichen
  - Saldoliste
  rechnen: Tage überfällig je Posten = 31.12. − Fälligkeitsdatum; Liste Posten ≥ Toleranzwesentlichkeit; Σ Sollsalden
  feststellung_wenn: Alte oder ungewöhnlich hohe Posten bzw. Sollsalden ohne plausible schriftliche Begründung oder mit Hinweisen auf Bestreitung, Doppelerfassung oder nicht mehr geschuldete
    Beträge.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Kritische Durchsicht der offenen Posten. Befragung über Gründe für alte, ungewöhnlich hohe Posten sowie Soll-Salden
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: hwp-er-2026__rz-0105-s198
    zitat: Der Begriff der Wesentlichkeit bezieht sich in diesem Zusammenhang auf die sogenannte Toleranzwesentlichkeit
- id: K1-102
  vorgehen: Salden der Kreditorenkonten Geschäftsjahr/Vorjahr aus der Saldoliste gegenüberstellen und vorab eine Erwartung aus Einkaufs-/Materialaufwand und Geschäftsverlauf ableiten.
    Wesentliche Abweichungen (über tolerierbarer Abweichung) als Frage an den Kunden (Pendenz) erfassen; schriftliche Antworten kritisch gegen Kenntnisse (Aufwand, Zahlungsverhalten,
    Projekte) plausibilisieren und im Textfeld festhalten.
  nachweise:
  - Saldoliste 2025/2024
  - Erfolgsrechnung (Material-/Fremdleistungsaufwand)
  - schriftliche Antworten Kunde
  rechnen: Δ = Saldo Kreditoren 31.12.2025 − Saldo 31.12.2024; Δ% = Δ / Saldo VJ; Abweichung zum Erwartungswert vs. tolerierbare Abweichung
  feststellung_wenn: Wesentliche Abweichung ohne plausible Erklärung oder Erklärung widerspricht den übrigen Prüfungserkenntnissen.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Insbesondere geht der Abschlussprüfer Diskrepanzen zu seinem Verständnis des geprüften Unternehmens und anderen nicht plausiblen Auskünften nach.
  - quelle: ser-2022__6-1-2-t3
    zitat: Auch für eine begrenzte Prüfungssicherheit ist es notwendig, die im Rahmen der Abweichungsanalyse erhaltenen Aussagen zu plausibilisieren.
- id: K1-103
  vorgehen: Schriftliche Beschreibung des Rechnungseingangs und der Abschlussarbeiten auswerten (Erfassung nach Leistungsdatum, Behandlung erhaltener, nicht fakturierter Lieferungen,
    Stichtagsregelung, Interimskonten); fehlt sie, Fragen als Pendenz. Aussagen nur mit vorhandenen Unterlagen plausibilisieren (bestehen passive Abgrenzungen für erhaltene, nicht fakturierte
    Leistungen?); keine systematische Durchsicht der Folgejahresrechnungen – das ist K1-302 (nur auf Anweisung). Hinweise auf nicht erfasste Rechnungen als Notiz an den WP (Anlass für
    K1-302). Keine IKS-Prüfung. Ergebnis kann Anlass für weitergehende K1-302/K1-303 sein (Entscheid WP).
  nachweise:
  - Prozessbeschrieb/Antwort Kunde
  - Kontoblätter Kreditoren Folgejahr (nur lesen, keine Durchsicht)
  - Liste passive Abgrenzungen
  rechnen: ''
  feststellung_wenn: Kein Verfahren zur Stichtagsabgrenzung erkennbar oder Antwort steht im Widerspruch zu Buchungen in neuer Rechnung.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Befragung, wie die vollständige, periodengerechte Erfassung sichergestellt wurde
  - quelle: ser-2022__4-3-4
    zitat: Befragungen von Personen, die nicht an der Erstellung der Jahresrechnung beteiligt sind, analytische Prüfungshandlungen sowie die Prüfung von Ereignissen nach dem Bilanzstichtag
- id: K1-201
  vorgehen: Bestand der Verbindlichkeiten aus LuL (inkl. Unterkonten) mit dem Vorjahr vergleichen; ergänzend Kreditorenfrist beider Jahre berechnen. Erwartung vor dem Vergleich formulieren,
    tolerierbare Abweichung aus der Toleranzwesentlichkeit ableiten. Ergebnis und Abweichungsanalyse im Textfeld; nicht plausible Abweichungen an K1-102 übergeben und mit Detailprüfungen
    (K1-301 ff.) ergänzen.
  nachweise:
  - Saldoliste 2025/2024
  - Jahresrechnung Vorjahr
  - Erfolgsrechnung
  rechnen: 'Mit `rechne`, nie im Kopf: (1) Kreditoren = Σ aller Konten der Gruppe inkl. Unterkonten; Δ% Kreditoren = (GJ − VJ) / VJ × 100; Δ% Aufwand = (Material- und Fremdleistungsaufwand
    GJ − VJ) / VJ × 100; Ertrag GJ vs. VJ ebenso (Geschäftsvolumen aus den Zahlen, nicht vermuten). (2) Erwartung = Kreditoren VJ × Aufwand GJ / Aufwand VJ; Abweichung = Kreditoren GJ
    − Erwartung. (3) Kreditorenfrist (Tage) = Kreditoren / Aufwand × 365 je Jahr. Entscheid: |Abweichung| ≤ tolerierbare Abweichung (aus Toleranzwesentlichkeit) → plausibel, sonst nicht
    plausibel. Abweichung negativ (Kreditoren tiefer als erwartet, Frist kürzer) = Hinweis auf nicht erfasste Rechnungen (Vollständigkeit).'
  feststellung_wenn: Abweichung zur Erwartung über der tolerierbaren Abweichung ohne belegte Erklärung – besonders Kreditoren deutlich unter der Erwartung bei gleichem oder höherem Aufwand
    (Risiko nicht erfasster Rechnungen).
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Vergleich des Bestands der Verbindlichkeiten mit dem Vorjahr
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: ser-2022__6-1-2-t3
    zitat: Bei wesentlichen Bilanzpositionen sind die analytischen Prüfungshandlungen in der Regel um angemessene Detailprüfungen zu ergänzen
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0029-s183
    zitat: stellt er dabei eine ungewöhnliche oder unerwartete Abweichung fest, untersucht er, ob erhöhte Risiken wesentlicher Fehlaussagen in der Jahresrechnung bestehen könnten
  - quelle: ser-2022__4-3-4
    zitat: Der Abschlussprüfer muss aufgrund seines Verständnisses des Unternehmens eine Vorstellung entwickeln, welche Werte und Transaktionen er in der Jahresrechnung erwartet.
  notiz: 'Nicht plausibel → Notiz «Pendenz» mit den gerechneten Zahlen (Frage an Kunde über WP) und Vorschlag an den WP: K1-302 (Durchsicht neue Rechnung) anordnen; aus Analytik allein
    keine «Wesentliche Feststellungen». Plausibel → nur Textfeld mit den Zahlen.'
- id: K1-202
  vorgehen: 'Fremdwährungskreditoren in OP-Liste und Hauptbuch identifizieren (Währung, FW-Betrag). Angewandten Kurs je Posten mit dem Jahresendkurs gemäss Bankkontoauszug 31.12. vergleichen
    (Bankbestätigung nur mit dokumentierter Herkunft, Verwendung entscheidet WP; keine einholen), CHF-Wert nachrechnen. Kursgewinne auf kurzfristigen Kreditoren sind zulässig (realisiert).
    Keine FW-Kreditoren: «nicht anwendbar» mit Begründung im Textfeld.'
  nachweise:
  - OP-Liste mit Währungsangabe
  - Kontoauszug mit Devisenkurs 31.12.; Bankbestätigung nur mit dokumentierter Herkunft (Verwendung entscheidet WP)
  - Kontoblätter FW-Konten
  rechnen: CHF-Soll = FW-Betrag × Jahresendkurs (Briefkurs bzw. Durchschnittskurs Stichtag); Differenz = CHF-Buchwert − CHF-Soll; Σ Differenzen je Währung vs. NAG
  feststellung_wenn: 'Verwendeter Kurs weicht wesentlich vom Jahresendkurs ab, Umrechnungsdifferenz über NAG oder Kurs nicht belegt. Kein Fehler: erfasster Kursgewinn auf kurzfristigen
    Kreditoren.'
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0088-s077
    zitat: bei Verpflichtungen der Briefkurs oder auch der durchschnittliche Devisenkurs des Bilanzstichtags
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: Gewinne oder Verluste können als realisiert betrachtet werden, wenn diese Positionen bei ihrer Ersterfassung eine Laufzeit von weniger als zwölf Monaten aufwiesen.
  - quelle: hwp-er-2026__rz-0262-s085
    zitat: Die Prüfung beschränkt sich grundsätzlich auf beim geprüften Unternehmen intern verfügbare Informationen.
- id: K1-203
  vorgehen: 'Liste nahestehender Personen (Aktionäre gemäss Aktienbuch, VR/GL gemäss HR-Auszug, GV-/VR-Protokolle, Beteiligungsgesellschaften) aus Dauerakte übernehmen bzw. erstellen
    und mit Kreditoren in OP-Liste/Kreditorenstamm abgleichen (Name, Adresse). Treffer: gesonderten Ausweis in Bilanz oder Anhang prüfen; Preise/Konditionen per Drittvergleich (Verträge,
    Vergleichspreise) plausibilisieren; fehlende Informationen als Pendenz.'
  nachweise:
  - Aktienbuch
  - Handelsregisterauszug/Unternehmensinformationen
  - GV-/VR-Protokolle
  - OP-Liste Kreditoren
  - Anhang Jahresrechnung
  - Verträge mit Nahestehenden
  rechnen: Σ Kreditoren ggü. Nahestehenden = Σ OP-Posten mit Kreditor ∈ Liste Nahestehende; Abgleich mit Ausweis Bilanz/Anhang
  feststellung_wenn: Kreditoren gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften ohne gesonderten Ausweis oder mit nicht marktüblichen Konditionen (Drittvergleich).
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Feststellung von Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung
  - quelle: or__art-959a-t2
    zitat: Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils
      gesondert
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Feststellung der korrekten Offenlegung der Beziehung zu nahestehenden Personen
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Beurteilung der (Transfer-)Preise der jeweiligen Geschäftsvorfälle mittels Drittvergleichs
- id: K1-301
  vorgehen: 'Total der Kreditoren-OP-Liste nachrechnen und mit Saldo Kreditorenkonto (Saldoliste, Kontoblatt) und Bilanzposition der Jahresrechnung abstimmen. Stichtag und Erstellungsdatum
    der Liste prüfen (keine Folgejahresbuchungen). Liegen beim Unternehmen bereits vorhandene Lieferanten-Saldobestätigungen oder Lieferantenkontoauszüge per Stichtag in der Akte: je
    Kreditor Saldo mit der OP-Liste abgleichen (Beiziehen vorhandener Unterlagen, nie einholen; Herkunft festhalten, siehe Fallstrick). Ergebnis mit Beträgen und allfälliger Differenz
    im Textfeld dokumentieren.'
  nachweise:
  - Kreditoren-OP-Liste 31.12.
  - Saldoliste
  - Kontoblatt Kreditoren
  - Jahresrechnung (Bilanz)
  rechnen: '(1) `rechne "Diff OP-HB = sum(<alle Beträge Spalte Offen>) - <Saldo Kreditorenkonto 2000 lt. Saldoliste>"` – Posten selbst summieren, gedrucktes Total nur vergleichen. (2)
    `rechne "Diff HB-Bilanz = sum(<Salden aller Konten der Gruppe Verbindlichkeiten aus L+L>) - <Bilanzposition>"`. Jede Formel ist ein vollständiger Ausdruck (Namen gelten nicht im
    nächsten Teil). 0 = abgestimmt; ≠ 0 → Pendenz; > NAG → Feststellung. (3) Nur wenn vorhanden, je Kreditor: `rechne "Diff = <Saldo laut Lieferantenauszug> - <Saldo OP-Liste>"`;
    ≠ 0 → Ursache (Zahlung unterwegs, nicht erfasste Rechnung, Gutschrift, Anzahlung).'
  feststellung_wenn: Nicht erklärte Differenz zwischen OP-Liste, Hauptbuch und Jahresrechnung oder OP-Liste nicht per Stichtag. Vorhandener Lieferantenauszug zeigt eine nicht erfasste
    Rechnung oder eine nicht erklärte Differenz zur OP-Liste.
  fundstellen:
  - quelle: ser-2022__anh-d-s084-1
    zitat: Abstimmung des Totals der Kreditoren-OP-Liste mit der Jahresrechnung
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege, Abstimmung mit Auszügen, Durchsicht von Belegen in neuer Rechnung usw.
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise beiziehen, selbst wenn diese nicht direkt an ihn gesandt worden sind
- id: K1-302
  vorgehen: 'WP-Schritt, weitergehende Handlung (SER Anh. D): Vorbereitung nur auf ausdrückliche Anweisung WP (offener Entscheid consis), v. a. wenn K1-101–K1-301 wesentliche Fehlaussagen
    vermuten lassen oder erhöhtes inhärentes Risiko (3.1). Dann: (1) Kreditorenjournal und Kontoblatt Kreditoren Folgejahr bis Revisionsdatum sowie Liste unverbuchter Rechnungen öffnen.
    (2) Auswahl nach Vorgabe WP; ohne Vorgabe Vorschlag gemäss offenem Entscheid (Praxis/intern): alle Rechnungen ≥ Toleranzwesentlichkeit sowie stichtagsnahe/ungewöhnliche (Rechnungsdatum
    oder Leistungstext ≤ 31.12.), Auswahl begründen; keine repräsentative Stichprobe, keine Hochrechnung. (3) Massgebend ist das Leistungs-/Lieferdatum (Rechnungstext, Leistungszeitraum,
    Lieferschein; bei Waren Übergang Nutzen und Gefahr), nicht das Erfassungsdatum. (4) Leistung ≤ 31.12. → Beleg muss in der OP-Liste 31.12. oder in der Liste passive Abgrenzungen stehen
    (Beleg-Nr. und Betrag abgleichen); bei Leistungszeitraum über den Stichtag nur der Anteil bis 31.12. (5) Nicht erfasst → Tabelle Kreditor/Rechnung/Leistungsdatum/Betrag; Leistungsdatum
    nicht ersichtlich → Pendenz. (6) Summe mit `rechne`; über NAG → Notiz «Wesentliche Feststellungen» mit Buchungsvorschlag (keine Verbuchung). Beurteilung, Visum, Abschluss beim WP.
    Ohne Anweisung: kein Textfeld, Folgejahresunterlagen in diesem Schritt nicht durchsehen. Fällt beim Lesen anderer Schritte eine Rechnung mit Leistung ≤ Stichtag ohne OP-Posten/Abgrenzung
    auf: nur Notiz «Pendenz» bzw. «Schlussbesprechung» (Beleg, Betrag) mit Vorschlag «K1-302 anordnen?» – keine «Wesentliche Feststellungen» ohne Anweisung.'
  nachweise:
  - Kreditorenjournal Folgejahr
  - Kontoblätter Folgejahr
  - Liste unverbuchter Eingangsrechnungen
  - Lieferantenrechnungen
  - Kreditoren-OP-Liste 31.12.
  - Liste passive Abgrenzungen
  rechnen: '`rechne "Nicht erfasst = sum(<Beträge mit Leistung ≤ 31.12. ohne OP-Posten/Abgrenzung>)"`; Ergebnis vs. NAG und TW'
  feststellung_wenn: Rechnungen für im Geschäftsjahr erhaltene Lieferungen/Leistungen weder als Kreditor noch als Abgrenzung erfasst (Summe über NAG).
  fundstellen:
  - quelle: ser-2022__anh-d-s084-2
    zitat: Durchsicht der in neuer Rechnung verbuchten bzw. noch nicht verbuchten Kreditorenrechnungen und/oder der Kreditoren- und Aufwandskonten auf Rechnungen
  - quelle: ser-2022__anh-d-s084-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: hwp-er-2026__rz-0133-s203
    zitat: Wenn kein erhöhtes inhärentes Risiko vorliegt und die empfohlenen Prüfungshandlungen ausreichende geeignete Prüfungsnachweise liefern, sind keine weitergehenden Prüfungshandlungen
      vorzunehmen.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: hwp-bur-2023__rz-0445-s250
    zitat: Bereits erhaltene Lieferungen und Leistungen, die noch nicht fakturiert sind, stellen, auch wenn der Rechnungsbetrag bereits bestimmbar ist, Abgrenzungsposten dar
  - quelle: ser-2022__4-3-6
    zitat: Geprüft wird, ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden.
  - quelle: ser-2022__anh-d-s084-2
    zitat: auf Rechnungen, die im zu prüfenden Geschäftsjahr erhaltene Lieferungen und Leistungen betreffen
  - quelle: hwp-bur-2023__rz-0445-s250
    zitat: Abgrenzungsposten dar und sind dort zu erfassen
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0210-s206
    zitat: Der Übergang von Nutzen und Gefahr ist für die Aktivierungsfähigkeit in der Regel ausschlaggebend
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Der Agent wählt standardmässig alle Posten über der Toleranzwesentlichkeit, ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe, nahestehende Personen)
- id: K1-303
  vorgehen: 'WP-Schritt, weitergehende Handlung (SER Anh. D): Vorbereitung nur auf ausdrückliche Anweisung WP (offener Entscheid consis), v. a. bei vermuteten wesentlichen Fehlaussagen
    oder erhöhtem inhärentem Risiko (3.1). Dann: Wareneingangsbelege/Lieferscheine um den Stichtag (Zeitraum gemäss WP) mit OP-Liste, Kreditorenjournal Folgejahr, Abgrenzungen und Inventar
    abgleichen; Abgleichstabelle. Fehlende Belege → Pendenz. Beurteilung beim WP.'
  nachweise:
