  vorgehen: 'Nur auf Anweisung WP; ohne: Status «nicht bearbeitet – nur auf Anweisung», Hinweise als Notiz. Kennzeichnung «?» im Katalog: Zuständigkeit (EP/WP) beim WP klären. Nach Anweisung:
    aus K1-203 die Kreditoren gegenüber beteiligten Unternehmen/Beteiligungsgesellschaften übernehmen, je Gegenpartei Saldo per 31.12. auflisten; Abstimmung unter K1-114 dokumentieren.'
  nachweise:
  - Ergebnis K1-203
  - OP-Liste/Kontoblätter Kreditoren
  rechnen: 'Liste je Gegenpartei: Saldo Kreditor 31.12.2025'
  feststellung_wenn: Kreditoren gegenüber Beteiligungen/beteiligten Unternehmen ohne Nachweis oder ohne gesonderten Ausweis.
