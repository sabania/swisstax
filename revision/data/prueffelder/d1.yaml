- id: D1-404
  vorgehen: 'Sonstige (4xx): nur auf Anweisung des WP; ohne Anweisung Status «nicht bearbeitet – nur auf Anweisung» und Ergebnis aus D1-201 (Forderungen mit Darlehenscharakter an Beteiligte/Nahestehende:
    Betrag, Vertrag, Zins) als Notiz an den WP und an P1-305 übergeben (`pruefschritt P1-305`, dort wird die Einlagenrückgewähr beurteilt). Mit Anweisung: Forderungen mit Darlehenscharakter
    an Aktionäre und Nahestehende (up-/cross-stream, aus D1-201) summieren und dem freien Eigenkapital gegenüberstellen. Übersteigen sie es: Drittvergleich anhand der VR-Analyse prüfen
    (Vertrag, Zins, Rückzahlung, Sicherheiten, Bonität); fehlt diese, Pendenz. Ergebnis und Auswirkung auf Gewinnverwendungsantrag/Bericht dem WP vorlegen.'
  nachweise:
  - Aufstellung Aktionärsforderungen
  - Darlehensverträge
  - VR-Analyse Drittvergleich
  - Eigenkapitalnachweis
  - Antrag über die Verwendung des Bilanzgewinns
  rechnen: 'Freies EK = Total Eigenkapital − einbezahltes Aktienkapital (+ stille Reserven netto); Test: Σ Aktionärsforderungen mit Darlehenscharakter ≤ freies EK'
  feststellung_wenn: Aktionärsforderungen übersteigen freies Eigenkapital und Drittvergleich nicht bestanden oder nicht dokumentiert (möglicher Verstoss Art. 680 Abs. 2 OR; Entscheid
