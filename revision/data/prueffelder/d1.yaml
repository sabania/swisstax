bewertung:
- regel: 'Für übrige kurzfristige Forderungen gelten die allgemeinen Bewertungsvorschriften (Art. 960/960a OR): Niederstwertprinzip, vorsichtige Bewertung.'
  quelle: hwp-bur-2023__rz-0159-s192
  zitat: wonach die Bewertung zum Niederstwertprinzip und vorsichtig zu erfolgen hat
- regel: Einzelbewertung wesentlicher Forderungen.
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- regel: Werthaltigkeit beurteilen und ggf. Wertberichtigungen bilden; Sicherheiten auf Werthaltigkeit prüfen.
  quelle: hwp-bur-2023__rz-0160-s192
  zitat: Die Werthaltigkeit der Forderungen ist zu beurteilen
- regel: Verjährte Forderungen dürfen nicht mehr bilanziert werden.
  quelle: hwp-bur-2023__rz-0160-s192
  zitat: Verjährte Forderungen sind nicht mehr bilanzierungsfähig.
- regel: Wertberichtigungen werden direkt oder indirekt bei den Aktiven abgesetzt, nicht unter den Passiven ausgewiesen.
  quelle: or__art-960a
  zitat: Sie sind direkt oder indirekt bei den betreffenden Aktiven zulasten der Erfolgsrechnung abzusetzen und dürfen nicht unter den Passiven ausgewiesen werden.
- regel: 'Forderungen gegenüber Nahestehenden: gleiche Bewertungsgrundsätze wie gegenüber Dritten; Bonitätsprüfung mit besonderer Aufmerksamkeit.'
  quelle: hwp-bur-2023__rz-0173-s195
  zitat: Für die Bewertung von Forderungen gegenüber nahestehenden Personen sind dieselben Grundsätze anzuwenden wie bei Forderungen gegenüber Dritten.
- regel: 'Tief- oder unverzinsliche langfristige Forderungen: Wertberichtigung auf den Barwert bei erheblicher Differenz.'
  quelle: hwp-bur-2023__rz-0173-s195
  zitat: Falls bei tief- oder unverzinslichen langfristigen Forderungen eine erhebliche Differenz zwischen Nennwert und Barwert besteht, ist eine Wertberichtigung auf den Barwert vorzunehmen.
- regel: 'Begünstigung Nahestehender: Steuerrisiken bei der Bilanzierung berücksichtigen.'
  quelle: hwp-bur-2023__rz-0173-s195
  zitat: Bei Begünstigung nahestehender Personen im Vergleich zu Dritten sind allfällige Steuer
- regel: 'Geleistete Anzahlungen: Bonität/Leistungsfähigkeit des Empfängers, Sicherheiten und zweckkonforme Verwendung beurteilen; tieferer Marktwert der Gegenleistung berücksichtigen.'
  quelle: hwp-bur-2023__rz-0191-s202
  zitat: Auch ein allfälliger tieferer Marktwert der zu liefernden Gegenleistung ist ggf. zu berücksichtigen
- regel: Geleistete Anzahlungen nach Verwendungszweck im Umlauf- oder Anlagevermögen ausweisen.
  quelle: hwp-bur-2023__rz-0192-s203
  zitat: Die geleisteten Anzahlungen sind nach Verwendungszweck im Umlauf- (Waren) oder Anlagevermögen (Immobilien, Maschinen) auszuweisen.
- regel: 'Fremdwährung: kurzfristige Guthaben zum Kurs am Bilanzstichtag; Kursdifferenzen bei Ursprungslaufzeit unter zwölf Monaten als realisiert.'
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Gewinne oder Verluste können als realisiert betrachtet werden, wenn diese Positionen bei ihrer Ersterfassung eine Lauf
- regel: 'Fremdwährung langfristig: unrealisierte Kursgewinne nicht erfolgswirksam.'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- regel: Keine Saldierung von Forderungen und Verbindlichkeiten, ausser bei gegenseitiger Verrechenbarkeit; bei Abrechnung über eine Saldogrösse (z.B. MWST) ist Verrechnung geboten.
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: geboten ist eine Verrechnung dann, wenn mit der Gegenpartei nur über eine Saldo
- regel: Sollsalden aus Kreditoren gehören in die übrigen kurzfristigen Forderungen (Habensalden aus Debitoren in die übrigen kurzfristigen Verbindlichkeiten).
  quelle: hwp-bur-2023__rz-0155-s192
  zitat: Sollsalden aus den Verbindlichkeiten aus Lieferungen und Leistungen sind als übrige kurzfristige Forderungen
- regel: Nicht betriebstypische Forderungen gehören zu den übrigen kurzfristigen Forderungen (nicht LuL).
  quelle: hwp-bur-2023__rz-0110-s185
  zitat: Ansprüche aus nicht betriebstypischen Lieferungen und Leistungen
- regel: 'Fristigkeit: Grenze kurz-/langfristig in der Regel ein Jahr bzw. ein Geschäftszyklus.'
  quelle: hwp-bur-2023__rz-0154-s192
  zitat: Die Grenze zwischen lang- und kurzfristigen Guthaben und Verbindlichkeiten liegt in der Regel bei einem Jahr bzw. einem Geschäftszyklus
- regel: 'Ausweis Nahestehender: Unterteilung nach Beteiligten/Organen und Beteiligungsgesellschaften je Forderungsposition.'
  quelle: hwp-bur-2023__rz-0174-s195
  zitat: Die genannte Unterteilung ist aus Gründen der Transparenz pro Forderungs- und Ver
- regel: 'Beteiligte: massgeblicher Einfluss vermutet ab 20 % der Stimmrechte.'
  quelle: hwp-bur-2023__rz-0166-s193
  zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 % der Stimmrechte gewähren (Art. 960d Abs. 3 OR).
- regel: 'Organe: die mit der Geschäftsführung betrauten obersten Leitungsorgane (VR, GL, Geschäftsführung GmbH).'
  quelle: hwp-bur-2023__rz-0167-s193
  zitat: Als Organe sind nicht in erster Linie die gesellschaftsrechtlichen Organe zu betrachten, sondern die mit der Geschäftsführung betrauten obersten Leitungsorgane.
- regel: 'Schwestergesellschaften: gesonderter Ausweis empfohlen.'
  quelle: hwp-bur-2023__rz-0169-s194
  zitat: Schwestergesellschaften gelten zwar nach dem Wortlaut des Gesetzes nicht als direkt oder indirekt Beteiligte
- regel: 'Einlagenrückgewähr: freies Eigenkapital = gesamtes Eigenkapital abzüglich einbezahltes Aktienkapital; Vergleich mit Total der Aktionärsforderungen mit Darlehenscharakter.'
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Das freie Eigenkapital entspricht gemäss bundesgerichtlicher Rechtsprechung dem gesamten Eigenkapital abzüglich des einbezahlten Aktienkapitals.
- regel: 'Einlagenrückgewähr: stille Reserven (netto) dürfen beim freien Eigenkapital berücksichtigt werden.'
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Bei der Ermittlung des freien Eigenkapitals dürfen stille Reserven (netto, unter Berücksichtigung latenter Steuerfolgen) berücksichtigt werden.
- regel: Aktionärs-/Konzerndarlehen ohne bestandenen Drittvergleich sperren ausschüttbares Eigenkapital im gesamten Darlehensumfang.
  quelle: hwp-er-2026__rz-0170-s216
  zitat: Bestehen Aktionärs- bzw. Konzerndarlehen, die einem Drittvergleich nicht standhalten, führt dies zu einer Sperrung von frei verfügbarem Eigenkapital im gesamten Umfang dieser
    Darlehen.
- regel: 'ESTV-Praxis: unverzinste oder ungenügend verzinste Darlehen an Beteiligte sind geldwerte Leistungen; ESTV-Zinssätze gelten als safe haven (Rundschreiben je Jahr).'
  quelle: estv-zinsen-2026__s002-1
  zitat: Diese Zinssätze gelten als „safe haven“.
- regel: 'VSt-Guthaben: Der Anspruch erlischt, wenn der Antrag nicht innert drei Jahren nach Ablauf des Fälligkeitsjahres gestellt wird; ältere Guthaben ohne Antrag sind nicht werthaltig.'
  quelle: vstg__art-32
  zitat: Der Anspruch auf Rückerstattung erlischt, wenn der Antrag nicht innert drei Jahren nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt
    wird.
- regel: 'VSt-Guthaben nur plausibel bei VSt-pflichtigem Ertrag: Zinsen von Kundenguthaben bis CHF 200 pro Kalenderjahr sind von der Steuer ausgenommen.'
  quelle: vstg__art-5-t1
  zitat: die Zinsen von Kundenguthaben, wenn der Zinsbetrag für ein Kalenderjahr 200 Franken nicht übersteigt
fallstricke:
- text: Langfristig gesperrte Guthaben (z.B. Mietkaution mit Freigabe erst nach Ende eines mehrjährigen Mietverhältnisses) erfüllen das Kriterium Umlaufvermögen nicht; Klassierung prüfen
    und Umgliederungsvorschlag erfassen.
  quelle: or__art-959
  zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
- text: 'Darlehen an Aktionäre/Organe werden oft in Debitoren (LuL) oder anderen Konten gebucht: Suche nach Nahestehenden über alle Forderungskonten und OP-Listen führen, nicht nur über
    die D1-Konten.'
  quelle: hwp-bur-2023__rz-0110-s185
  zitat: Forderungen im Zusammenhang mit nicht betrieblichen oder ausserordentlichen Ge
- text: Beteiligungskäufe oder Investitionen auf dem Konto «geleistete Anzahlungen» sind nach Verwendungszweck umzugliedern (z.B. Beteiligungen im Anlagevermögen).
  quelle: hwp-bur-2023__rz-0192-s203
  zitat: Die geleisteten Anzahlungen sind nach Verwendungszweck im Umlauf- (Waren) oder Anlagevermögen (Immobilien, Maschinen) auszuweisen.
- text: Debitoren-/Saldobestätigungen selbst einholen gehört nicht zur eingeschränkten Revision; vom Kunden vorgelegte Bestätigungen (Bank, Lieferant) dürfen als Nachweis verwendet werden.
  quelle: ser-2022__anh-d-s077-2
  zitat: Einholen von Debitorenbestätigungen
- text: Bestätigung der Gesetzeskonformität nur in der Vollständigkeitserklärung genügt nicht als Dokumentation des Drittvergleichs; fehlen Unterlagen, gilt der Drittvergleich als nicht
    gegeben.
  quelle: hwp-er-2026__rz-0182-s218
  zitat: Liegen keine Unterlagen zum Drittvergleich vor oder äussert der Verwaltungsrat (oder von ihm beauftragte Experten) Zweifel daran, darf die Revisionsstelle davon ausgehen
- text: Bei Anzeichen einer Einlagenrückgewähr ist ein Eventualhinweis im Bericht nicht angemessen; Prüfungsnachweise einholen und Auswirkung auf Gewinnverwendungsantrag dem WP vorlegen.
  quelle: hwp-er-2026__rz-0180-s218
  zitat: Ein Eventualhinweis im Bericht der Revisionsstelle an die Generalversammlung ist nicht angemessen
- text: Für Art. 680 OR zählen nur Forderungen mit Darlehenscharakter; konzerninterne LuL-Forderungen mit üblichen Zahlungszielen nicht.
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Konzerninterne Forderungen aus Lieferungen und Leistungen, die aus einem operativen Leistungsaustausch mit üblichen Zahlungszielen entstanden sind
- text: 'Zinssätze Nahestehende je Kalenderjahr, nie übertragen: Zinsen 2026 nach ESTV-RS 2026 CHF (estv-zinsen-2026) bzw. Fremdwährung (estv-rs-2-219-2026); Zinsen 2025 nur aus Sekundärquelle
    Treuhand-Almanach (`wert estv_zins_2025_vorschuss_an_beteiligte_fk` bzw. `wert estv_zins_2025_vorschuss_an_beteiligte_ek`), das Rundschreiben 2025 selbst fehlt im Wiki.'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: 'MWST: Vorsteuer und Umsatzsteuer werden gegenüber der ESTV über einen Saldo abgerechnet; Vorsteuerkonten mit Saldo 0 können korrekt sein, wenn auf ein Abrechnungskonto umgebucht
    wurde – Abstimmung mit der Abrechnung vornehmen.'
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: So besteht beispielsweise gegenüber der Eidg. Steuerverwal
- text: Unangemessen günstige Darlehenskonditionen an Nahestehende können eine verdeckte Gewinnausschüttung darstellen, auch ohne Einlagenrückgewähr.
  quelle: hwp-bur-2023__rz-0177-s197
  zitat: Solche Darlehen können den Tatbestand der verdeckten Gewinnausschüttung erfüllen
- text: Weitergehende Prüfungshandlungen (z.B. D1-308, Teile von D1-302) nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko; Entscheid durch den Wirtschaftsprüfer.
  quelle: hwp-er-2026__rz-0132-s203
  zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
    anzunehmen sind
- text: Bei wesentlichen Positionen genügt die Befragung allein nicht; Antworten mit Analytik oder Detailprüfung ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Unterjährig negative Saldi auf Forderungs-/Anzahlungskonten (Sammelbuchungen) können auf Fehlbuchungen oder Vermischung mit Kreditorenvorgängen hindeuten (Praxis/intern).
- text: Der Agent schlägt Umgliederungen, Wertberichtigungen oder Anhangergänzungen nur vor (Pendenz/Feststellung); er bucht nicht und setzt kein Visum.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- text: Besteht ein Covid-19-Kredit (Prüffelder L1/N1), ist ein in D1-201 gefundenes Darlehen an Gesellschafter/Nahestehende, das während der Dauer der Solidarbürgschaft gewährt oder
    erhöht wurde, eine mögliche Verletzung von Art. 2 Abs. 2 lit. b Covid-19-SBüG. Dann Notiz «Wesentliche Feststellungen» an den WP. Fristsetzung und Information der GV (Art. 23) entscheidet
    der WP.
  quelle: covid-sbueg__art-2-t1
  zitat: Während der Dauer der Solidarbürgschaft ausgeschlossen sind
- text: 'Darlehen an Aktionäre nie nur unter dem Ausweis prüfen: Zins/Marchzins (D1-304), Bonität (D1-306) und Kapitalschutz (freies EK, Art. 680 Abs. 2 OR → P1-305) gehören dazu; ist
    das Eigenkapital negativ, besteht kein freies EK.'
  quelle: hwp-er-2026__rz-0167-s215
  zitat: ist das freie Eigenkapital mit dem Total der Forderungen gegenüber Aktionären zu vergleichen
  schritte:
  - D1-201
  - D1-304
  - D1-404
  fundstellen:
  - quelle: or__art-680
    zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- text: 'Forderung gegenüber einer Beteiligungsgesellschaft und Beteiligung (H3) nicht getrennt beurteilen: zeigt H3 eine Unterdeckung, ist auch die Forderung kritisch zu prüfen (Kaskade
    Beteiligung → nachrangige Finanzierung → übrige Forderungen); kein «D1 ohne Feststellung» im Widerspruch zu H3.'
  quelle: hwp-bur-2023__rz-0293-s222
  zitat: Wertberichtigungen zuerst der Beteiligung, dann nachrangig gewährten Finanzierungen und schliesslich den übrigen Forderungen des Unternehmens gegenüber dem Tochterunternehmen
    zuzuordnen
  schritte:
  - D1-306
fragen_kunde:
- frage: Welche Geschäftsvorfälle liegen den wesentlichen übrigen Forderungen zugrunde (Gegenpartei, Entstehung, Fälligkeit, Sicherheiten)?
  zweck: 'D1-100: Hintergrund, Bestand und Werthaltigkeit; Klassierung kurz-/langfristig'
- frage: Sind Forderungen oder Guthaben verpfändet, abgetreten, zum Inkasso gegeben oder gesperrt (z.B. Mietkautionen, Zoll-/Bardepots, Garantiedepots)? Bitte Betrag und Begünstigten
    angeben.
  zweck: 'D1-101/D1-320: Rechte und Offenlegung nach Art. 959c Abs. 2 Ziff. 9 OR'
- frage: Worauf sind die wesentlichen Veränderungen der einzelnen Forderungskonten gegenüber dem Vorjahr zurückzuführen?
  zweck: 'D1-102/D1-202: Plausibilisierung der Abweichungen'
- frage: Bestehen Forderungen (auch Darlehen, Kontokorrente, Vorschüsse) gegenüber Aktionären, Verwaltungsrat, Geschäftsleitung, ihnen nahestehenden Personen oder Tochter-/Schwestergesellschaften
    – auch in anderen Bilanzpositionen?
  zweck: 'D1-201/D1-320: Vollständigkeit und gesonderter Ausweis nach Art. 959a Abs. 4 OR'
- frage: Hat der Verwaltungsrat für Darlehen an Aktionäre/Nahestehende einen Drittvergleich (Vertrag, Zins, Rückzahlung, Sicherheiten, Bonität) vorgenommen und dokumentiert? Bitte Unterlagen
    zustellen.
  zweck: 'P1-305 (D1-404 nur auf Anweisung): Beurteilung Einlagenrückgewähr; D1-306 Bonität'
- frage: Wie werden Darlehen/Kontokorrente mit Nahestehenden verzinst, wann wird abgerechnet und ist der Zins per Stichtag abgegrenzt?
  zweck: 'D1-304: Verzinsung und Periodenabgrenzung'
- frage: Welche geleisteten Anzahlungen betreffen bis zum Bilanzstichtag bereits erfolgte Lieferungen/Leistungen, und wann wurden bzw. werden die übrigen Geschäfte abgewickelt?
  zweck: 'D1-402/D1-403: Eintritt und Ausgleich der Anzahlungen'
- frage: Gibt es Schuldner mit Zahlungsschwierigkeiten, bestrittene Forderungen oder nach dem Stichtag ausgebuchte bzw. gutgeschriebene Beträge?
  zweck: 'D1-306/D1-307/D1-308: Wertberichtigungsbedarf'
- frage: Bestehen Forderungen in Fremdwährung und mit welchen Kursen wurden sie per Stichtag umgerechnet?
  zweck: 'D1-305: Fremdwährungsumrechnung'
- frage: Wurden auf übrigen Forderungen stille Reserven gebildet oder aufgelöst (Betrag, Berechnung gegenüber Vorjahr)?
  zweck: 'D1-321: Bestand und Veränderung stiller Reserven'
- frage: Wurde der Antrag auf Rückerstattung der Verrechnungssteuer gestellt bzw. wann wird er gestellt?
  zweck: 'D1-302 c: Nachweis VSt-Guthaben'
- frage: Besteht ein Covid-19-Kredit mit Solidarbürgschaft (Betrag, Datum, Rückzahlungsstand)?
  zweck: 'D1-201: Darlehen an Gesellschafter/Nahestehende während der Solidarbürgschaft (Art. 2 Abs. 2 lit. b Covid-19-SBüG)'
