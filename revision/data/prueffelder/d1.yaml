# Prüffeld D1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: D1
bezeichnung: Übrige kurzfristige Forderungen
status: extrahiert
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 15
    korrigiert: false
kurzbeschrieb: 'Agent: Befragung nur schriftlich (sonst Pendenz); WP-Schritte D1-302/308 und 4xx nur auf Anweisung; keine Bestätigungen bei Dritten; Einlagenrückgewähr in P1-305. Inhalt:
  MWST-/VSt-Guthaben, Sozialversicherungen, Personal, Kautionen, Anzahlungen, Darlehen an Nahestehende; Ausweis, Fristigkeit.'
gesetz:
- thema: 'Mindestgliederung: Position «übrige kurzfristige Forderungen» im Umlaufvermögen (Art. 959a Abs. 1 Ziff. 1 lit. c OR)'
  quelle: or__art-959a-t1
  zitat: c. übrige kurzfristige Forderungen
- thema: Gesonderter Ausweis von Forderungen gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden.
- thema: Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR)
  quelle: or__art-959
  zitat: ein Mittelzufluss wahrscheinlich ist und ihr Wert verlässlich geschätzt werden kann
- thema: Abgrenzung Umlauf-/Anlagevermögen nach Fristigkeit (Art. 959 Abs. 3 OR)
  quelle: or__art-959
  zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
- thema: Verrechnungsverbot (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Bestandsnachweis durch Inventar oder auf andere Art (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Belegnachweis für Buchungen (Art. 957a Abs. 2 Ziff. 2 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: Periodenabgrenzung, z.B. Zinsen auf Darlehen/Kontokorrenten (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Vorjahreszahlen in der Jahresrechnung (Art. 958d Abs. 2 OR)
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- thema: Einzelbewertung, Vorsicht, Überprüfung bei Anzeichen einer Überbewertung (Art. 960 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Wertberichtigungen (Art. 960a Abs. 3 OR)
  quelle: or__art-960a
  zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
- thema: Zusätzliche Wertberichtigungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
    übersteigt
- thema: 'Anhang: zur Sicherung eigener Verbindlichkeiten verwendete Aktiven (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: Umrechnungskurse im Anhang nur, wenn die Rechnungslegung nicht in Landeswährung erfolgt (Art. 958d Abs. 3 OR)
  quelle: or__art-958d
  zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
- thema: 'Rechnungslegung nicht in Landeswährung: Werte zusätzlich in Landeswährung angeben (Art. 958d Abs. 3 OR)'
  quelle: or__art-958d
  zitat: Wird nicht die Landeswährung verwendet, so müssen die Werte zusätzlich in der Landeswährung angegeben werden.
- thema: 'Verbot der Einlagenrückgewähr (Art. 680 Abs. 2 OR; GmbH: Art. 793 Abs. 2 OR gemäss HWP ER)'
  quelle: or__art-680
  zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- thema: Rückerstattungspflicht bei Missverhältnis von Leistung und Gegenleistung mit Nahestehenden (Art. 678 Abs. 2 OR)
  quelle: or__art-678
  zitat: soweit ein offensichtliches Missverhältnis zwischen Leistung und Gegenleistung besteht
- thema: 'Covid-19-Kredit: während der Dauer der Solidarbürgschaft ausgeschlossen: Gewährung/Rückzahlung von Darlehen von Gesellschaftern und Nahestehenden; Ausnahme vorbestehende Verpflichtungen
    ggü. Schweizer Gruppengesellschaften (Art. 2 Abs. 2 lit. b Covid-19-SBüG)'
  quelle: covid-sbueg__art-2-t1
  zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
- thema: 'Covid-19-Kredit: zulässig bleibt die Erfüllung vorbestehender Verpflichtungen ggü. verbundenen Gruppengesellschaften mit Sitz in der Schweiz (Art. 2 Abs. 2 lit. b Covid-19-SBüG)'
  quelle: covid-sbueg__art-2-t1
  zitat: zulässig ist jedoch die Erfüllung von Verpflichtungen gegenüber einer mit der Kreditnehmerin oder dem Kreditnehmer direkt oder indirekt verbundenen Gruppengesellschaft mit Sitz
    in der Schweiz, die vor Entstehung der Solidarbürgschaft bestanden haben
- thema: 'Pflicht der Revisionsstelle bei Verletzung: Frist setzen, sonst GV informieren (Art. 23 Abs. 1 Covid-19-SBüG)'
  quelle: covid-sbueg__art-23
  zitat: Wird dieser nicht innerhalb der gesetzten Frist hergestellt, so muss die Revisionsstelle die Generalversammlung informieren.
risiken:
- text: Ausgewiesene Forderungen bestehen nicht (mehr) oder sind nicht belegt (z.B. bereits verrechnete MWST/VSt, erledigte Anzahlungen).
  pruefziele:
  - EX
  - RI
  quelle: ser-2022__anh-d-s077-2
  zitat: Durchsicht von Zahlungen in neuer Rechnung und von Verträgen zur Feststellung des Vorhandenseins der Forderungen
- text: 'Fehlklassierung: langfristige Guthaben (z.B. langfristig gesperrte Kautionen), Beteiligungen, Darlehen oder LuL-Forderungen in der Position bzw. nicht betriebstypische Forderungen
    unter LuL.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0154-s192
  zitat: Die Grenze zwischen lang- und kurzfristigen Guthaben und Verbindlichkeiten liegt in der Regel bei einem Jahr bzw. einem Geschäftszyklus
- text: 'Überbewertung: zweifelhafte Forderungen (Bonität Schuldner, Sicherheiten, Verjährung) ohne angemessene Wertberichtigung.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0160-s192
  zitat: Erhaltene Sicherheiten sind auf ihre Werthaltigkeit hin zu überprüfen.
- text: Forderungen gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften werden nicht erkannt, nicht gesondert ausgewiesen oder zu nicht marktüblichen Konditionen und informell
    abgewickelt.
  pruefziele:
  - VO
  - DO
  - BE
  quelle: hwp-er-2026__rz-0157-s211
  zitat: Transaktionen zwischen nahestehenden Personen häufig informell abgewickelt werden
- text: Darlehen an Aktionäre ohne freies Eigenkapital und ohne bestandenen Drittvergleich (verbotene Einlagenrückgewähr; Sperrung von ausschüttbarem Eigenkapital).
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0175-s196
  zitat: Darlehen gegen das Verbot der Einlagenrückgewähr verstossen (Art. 680 Abs. 2 OR);
- text: Unzulässige Verrechnung von Habensaldi bzw. Verbindlichkeiten mit Forderungen.
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: Eine Saldierung von Forderungen und Verbindlichkeiten in der Bilanz ist unzulässig
- text: Verpfändete, abgetretene oder gesperrte Guthaben (Kautionen, Sicherheitsleistungen) werden im Anhang nicht offengelegt.
  pruefziele:
  - RV
  - DO
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- text: Geleistete Anzahlungen werden nach erfolgter Lieferung nicht ausgebucht (Doppelerfassung mit Kreditor/Vorrat/Anlage) oder enthalten Fremdvorgänge.
  pruefziele:
  - EX
  - PA
  - RI
  quelle: hwp-bur-2023__rz-0189-s202
  zitat: Bei Erfüllung der vorausbezahlten Lieferungen und Leistungen ist das Anzahlungs
- text: Zinsen auf Darlehen/Kontokorrenten an Nahestehende nicht, zu tief oder periodenfremd erfasst (geldwerte Leistung, Steuerrisiko).
  pruefziele:
  - PA
  - BE
  quelle: estv-zinsen-2026__s001-1
  zitat: Die Gewährung unverzinslicher oder ungenügend verzinster Vorschüsse oder Darlehen an Beteiligte oder an ihnen nahestehende Dritte stellt eine geldwerte Leistung dar.
- text: Fremdwährungsforderungen mit falschem Kurs umgerechnet oder unrealisierte Kursgewinne erfasst.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0089-s077
  zitat: In Abhängigkeit von der Entwicklung der Fremdwährungskurse ist das Niederstwertprinzip zu beachten
- text: Verrechnungssteuer-Guthaben nicht rückforderbar, wenn die belasteten Erträge nicht ordnungsgemäss verbucht wurden; MWST-Guthaben nicht mit Abrechnungen abgestimmt.
  pruefziele:
  - EX
  - BE
  quelle: vstg__art-25
  zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung
- text: Verjährte Forderungen weiterhin bilanziert.
  pruefziele:
  - EX
  - BE
  quelle: hwp-bur-2023__rz-0160-s192
  zitat: Verjährte Forderungen sind nicht mehr bilanzierungsfähig.
