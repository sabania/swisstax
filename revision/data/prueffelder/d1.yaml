schritte:
- id: D1-100
  vorgehen: 'Aus Saldoliste/Hauptbuch alle Konten der Gruppe «Übrige kurzfristige Forderungen» mit Saldo erfassen und wesentliche Posten (≥ Toleranzwesentlichkeit, Auffälligkeit) bestimmen.
    Nicht selbst befragen: vorhandene schriftliche Antworten (10.11, Vollständigkeitserklärung, Protokolle) auswerten. Fehlt eine Antwort, je Posten Frage (Art, Gegenpartei, Entstehung,
    Fälligkeit, Sicherheit) als Notiz «Pendenz» (Versand durch WP). Wesentliche Posten mit Belegen (D1-301) erhärten. Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Saldoliste 31.12.
  - Kontoblätter der Forderungskonten
  - Schriftliche Antworten (10.11, Vollständigkeitserklärung, Protokolle)
  rechnen: Saldo je Konto ≥ Toleranzwesentlichkeit → wesentlich (Befragung allein nicht ausreichend)
  feststellung_wenn: Hintergrund einer wesentlichen Forderung unklar oder unplausibel, Antwort fehlt oder Posten gehört nicht in die Position (LuL, Anlagevermögen, Beteiligung).
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Befragung zum geschäftlichen Hintergrund wesentlicher übriger Forderungen
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: hwp-er-2026__rz-0105-s198
    zitat: stützt sich der Abschlussprüfer bei wesentlichen Jahresabschlussposten nicht nur auf Befragungen ab
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: D1-101
  vorgehen: 'Nicht selbst befragen: schriftliche Antworten (10.11, Vollständigkeitserklärung) auswerten, sonst Frage als Notiz «Pendenz» (Versand durch WP): Sind Forderungen/Guthaben
    verpfändet, abgetreten, zum Inkasso gegeben oder gesperrt? Antwort mit beim Unternehmen vorhandenen Bank-, Kautions-/Depotbestätigungen und Verträgen abgleichen. Gesamtbetrag der
    zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven im Textfeld festhalten und an D1-320 übergeben. Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Antwort des Kunden
  - Bank-/Kautionsbestätigungen
  - Verpfändungs-/Zessionsverträge
  - Mietvertrag/Bewilligungen mit Sicherheitsleistung
  rechnen: Σ verpfändete/abgetretene/gesperrte Aktiven = Angabe im Anhang (Art. 959c Abs. 2 Ziff. 9 OR)
  feststellung_wenn: Verpfändung, Abtretung oder Sperre bekannt, aber im Anhang nicht oder mit anderem Betrag offengelegt, oder Antwort des Kunden fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Befragung, ob Forderungen verpfändet, abgetreten oder zum Inkasso gegeben worden sind
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: D1-102
  vorgehen: 'Ergebnisse aus D1-202 auswerten: wesentliche Abweichungen je Konto gegenüber Vorjahr oder Erwartung (neue/aufgelöste Konten, starke Veränderungen, Vorzeichenwechsel): vorhandene
    schriftliche Erklärungen (10.11, Protokolle) auswerten, fehlende als Notiz «Pendenz» (Versand durch WP). Schriftliche Erklärungen kritisch würdigen, mit Hauptbuch/Belegen plausibilisieren
    und je Abweichung Ursache und Beurteilung im Textfeld festhalten. Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Vorjahresvergleich (D1-202)
  - Schriftliche Erklärungen des Kunden
  - Kontoblätter/Belege
  rechnen: Veränderung = Saldo 31.12. − Saldo Vorjahr; Abweichung % = Veränderung / Saldo Vorjahr
  feststellung_wenn: Wesentliche Abweichung ohne plausible, belegte Erklärung oder Erklärung im Widerspruch zu Belegen bzw. Kenntnissen über das Unternehmen.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Forderungen gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: D1-201
  vorgehen: 'Kreis der Beteiligten, Organe und Beteiligungsgesellschaften aus Aktienbuch, HR-Auszug, Unternehmensinformationen und GV-/VR-Protokollen bestimmen. Alle Forderungskonten,
    Debitoren-OP-Liste und Buchungstexte nach diesen Namen durchsuchen (auch ausserhalb D1). Treffer mit Betrag, Grundlage und Ausweis (Bilanz/Anhang) auflisten und an D1-304, D1-320
    und P1-305 (Einlagenrückgewähr, EP: `pruefschritt P1-305`) übergeben. Jede Forderung mit Darlehenscharakter gegenüber Aktionären/Nahestehenden durch alle vier Prüfungen führen, nicht
    nur Ausweis: (1) Ausweis (hier, D1-320), (2) Zins und Marchzins (D1-304), (3) Bonität (D1-306), (4) Kapitalschutz: freies EK mit `rechne`; Σ Aktionärsdarlehen > freies EK oder EK
    negativ → Notiz an P1-305 (Einlagenrückgewähr Art. 680 Abs. 2 OR; Entscheid WP).'
  nachweise:
  - Aktienbuch
  - Handelsregisterauszug
  - Organliste
  - GV-/VR-Protokolle
  - Debitoren-OP-Liste
  - Kontoblätter
  - Darlehensverträge
  rechnen: Σ Forderungen ggü. Beteiligten/Organen bzw. Beteiligungsgesellschaften = gesonderter Ausweis Bilanz/Anhang; freies EK = Eigenkapital total − einbezahltes Aktienkapital; Test
    Σ Forderungen mit Darlehenscharakter ggü. Aktionären ≤ freies EK (Ergebnis an P1-305)
  feststellung_wenn: Forderung gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften nicht gesondert ausgewiesen oder unter falscher Position (z.B. LuL) bilanziert; oder Darlehen
    an Gesellschafter/Nahestehende, gewährt während eines bestehenden Covid-19-Kredits.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Feststellung von Forderungen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: or__art-959a-t2
    zitat: an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden.
  - quelle: hwp-er-2026__rz-0180-s218
    zitat: Bei Anzeichen auf einen Verstoss gegen das Verbot der Einlagenrückgewähr sind die notwendigen Prüfungshandlungen vorzunehmen
  - quelle: covid-sbueg__art-2-t1
    zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: ist das freie Eigenkapital mit dem Total der Forderungen gegenüber Aktionären zu vergleichen
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: Das freie Eigenkapital entspricht gemäss bundesgerichtlicher Rechtsprechung dem gesamten Eigenkapital abzüglich des einbezahlten Aktienkapitals.
  - quelle: or__art-680
    zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- id: D1-202
  vorgehen: Saldoliste Geschäftsjahr und Vorjahr je Konto gegenüberstellen (Betrag, Veränderung absolut/%). Neue, aufgelöste, stark veränderte Konten und Saldo 0 bzw. Vorzeichenwechsel
    markieren; Erwartung formulieren (z.B. MWST-Periode, VSt auf Zinsen, Anzahlungen gemäss Bestellungen). Vorjahreszahlen mit Vorjahresabschluss abstimmen; Abweichungen an D1-102 übergeben.
  nachweise:
  - Saldoliste mit Vorjahresspalte
  - Jahresrechnung Vorjahr
  - Eröffnungssaldi Hauptbuch
  rechnen: Veränderung = Saldo 31.12. − Saldo Vorjahr; Σ Konten = Bilanzposition (beide Jahre); EB = Saldo Vorjahr
  feststellung_wenn: Unerklärte wesentliche Veränderung oder Vorjahreszahl/Eröffnungssaldo weicht vom Vorjahresabschluss ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Vergleich des Bestands der Forderungen mit dem Vorjahr
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen
- id: D1-301
  vorgehen: 'Bilanzposition gemäss Jahresrechnung mit Summe der Hauptbuchkonten (Saldoliste) abstimmen, danach jeden Kontosaldo mit dem Einzelnachweis (Abrechnung, Bestätigung, Vertrag,
    Abstimmungsblatt) vergleichen. Differenzen und fehlende Einzelnachweise je Konto im Textfeld dokumentieren bzw. als PBC-Pendenz erfassen. Konto VSt: Einzelnachweis = Zins-/Dividendenabrechnung
    mit VSt-Abzug; prüfen, ob der Ertrag brutto verbucht ist und der Antrag innert drei Jahren nach Ablauf des Fälligkeitsjahres gestellt ist bzw. noch möglich ist.'
  nachweise:
  - Jahresrechnung
  - Saldoliste
  - Kontoblätter
  - Einzelnachweis je Konto
  rechnen: Σ Hauptbuchkonten Gruppe übrige kurzfristige Forderungen = Bilanzposition; je Konto Saldo HB − Einzelnachweis = 0
  feststellung_wenn: Differenz zwischen Bilanz, Hauptbuch und Einzelnachweis oder fehlender Einzelnachweis für einen wesentlichen Saldo.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Abstimmung des Gesamtbetrags mit dem Einzelnachweis
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
  - quelle: vstg__art-25
    zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung
  - quelle: vstg__art-32
    zitat: Der Anspruch auf Rückerstattung erlischt, wenn der Antrag nicht innert drei Jahren nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt
      wird.
- id: D1-302
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Ohne Anweisung läuft
    der Bestandesnachweis wesentlicher Konten über D1-301. Mit Anweisung: Je Konto Nachweis in M-Files suchen: a) vom Kunden vorgelegte Saldobestätigung, b) SV-Abrechnung, c) VSt-Antrag/Zinsabrechnung,
    d) Vertrag/Zinsabrechnung, e) Anzahlung: Bestellung, Kaufvertrag, Rechnung, Zahlung, Lieferantenrechnung n.R., f) andere (MWST-Abrechnung, Depotbestätigung). Betrag, Datum, Gegenpartei
    vergleichen; Fehlendes als PBC-Pendenz. Keine Bestätigungen bei Dritten (Bank, Sozialversicherungen, ESTV, Steueramt) anfordern; nur beim Unternehmen vorhandene Abrechnungen/Bestätigungen
    verwenden.'
  nachweise:
  - Saldo-/Richtigbefundsanzeigen
  - Abrechnungen Sozialversicherungen
  - VSt-Rückerstattungsantrag
  - Verträge und Zinsabrechnungen
  - Bestellungen, Kaufverträge, Lieferantenrechnungen neue Rechnung, Zahlungsbelege
  - MWST-Abrechnungen, Depot-/Kautionsbestätigungen
  rechnen: Saldo Konto − bestätigter bzw. abgerechneter Betrag gemäss Nachweis = Differenz je Konto
  feststellung_wenn: Kein geeigneter Nachweis für wesentlichen Saldo, Betrag weicht ab oder Nachweis zeigt andere Gegenpartei/Art des Geschäfts (Fehlklassierung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: hwp-bur-2023__rz-0158-s192
    zitat: Der Bestand anderer Guthaben bzw. Verbindlichkeiten kann auch anhand von Abrechnungen und anderen geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s077-2
    zitat: Durchsicht von Zahlungen in neuer Rechnung und von Verträgen zur Feststellung des Vorhandenseins der Forderungen
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der MWST-Forderungen und -Verbindlichkeiten mit den Abrechnungen
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: Prüfungshandlungen genannt, welche nicht Gegenstand der eingeschränkten Revision sind und auf die daher zu verzichten ist
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: Saldobestätigungen von MWST, AHV, SUVA , BVG/PK und Steuerämtern
- id: D1-303
  vorgehen: '(1) Forderungskonten und Debitoren-/Personenkonten auf Habensaldi per Stichtag prüfen → Umgliederung in übrige kurzfristige Verbindlichkeiten vorschlagen. (2) Saldoliste
    der Verbindlichkeitskonten (Kreditoren, Sozialversicherungen, MWST/Steuern, Personal) auf Sollsaldi durchsehen. Netto-Sollsaldi je Gegenpartei (Verrechnung geboten, wenn nur über
    einen Saldo abgerechnet wird) festhalten: Ist das Guthaben durch eine Abrechnung belegt, Umgliederung in übrige kurzfristige Forderungen als Notiz vorschlagen, sonst Notiz «Pendenz».
    Hinweis an M1/K1 (M1-406/K1-406 sind 4xx). (3) Zulässige Saldoverrechnung (z. B. MWST gegenüber ESTV) separat begründen. Unterjährige Vorzeichenwechsel als Hinweis vermerken.'
  nachweise:
  - Saldoliste
  - Kontoblätter
  - Debitoren-/Kreditoren-OP-Listen
  - Saldoliste Passiven (Kreditoren, SV, MWST, Personal)
  rechnen: Σ Habensaldi Forderungskonten = Umgliederung an Verbindlichkeiten; Σ Netto-Sollsaldi je Gegenpartei in Verbindlichkeitskonten = mögliche Umgliederung an Forderungen
  feststellung_wenn: Wesentliche Habensaldi mit Forderungen verrechnet (Verstoss Verrechnungsverbot) oder Ursache negativer Saldi ungeklärt; oder wesentliche Netto-Sollsaldi in Verbindlichkeitskonten
    nicht als übrige kurzfristige Forderungen ausgewiesen.
  fundstellen:
  - quelle: or__art-958c
    zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
  - quelle: hwp-bur-2023__rz-0163-s193
    zitat: Eine Saldierung von Forderungen und Verbindlichkeiten in der Bilanz ist unzulässig
  - quelle: hwp-bur-2023__rz-0155-s192
    zitat: Sollsalden aus den Verbindlichkeiten aus Lieferungen und Leistungen sind als übrige kurzfristige Forderungen
  - quelle: hwp-bur-2023__rz-0154-s192
    zitat: Forderungen und Verbindlichkeiten gegenüber Sozialversicherungen
  - quelle: hwp-bur-2023__rz-0163-s193
    zitat: geboten ist eine Verrechnung dann, wenn mit der Gegenpartei nur über eine Saldo
- id: D1-304
  vorgehen: 'Für verzinsliche Kontokorrente/Darlehen (v.a. Konzern, Aktionäre, Organe) Vertrag, Zinssatz und Zinsperiode erheben; Zins nachrechnen und mit Zinsertrag bzw. Marchzinsabgrenzung
    abstimmen. Mindestsatz mit `wert zinssatz darlehen` (2026) bzw. `wert estv_zins_2025_vorschuss_an_beteiligte_fk` (2025) bestimmen: Hat die Gesellschaft verzinsliches Fremdkapital,
    gelten Selbstkosten + Zuschlag (mindestens Tabellensatz), sonst der EK-Satz. FW-Darlehen: RS 2-219, mindestens der CHF-Satz. Satz nur als Steuerpraxis (safe haven) verwenden. Unterschreitung
    oder fehlender Vertrag als Hinweis auf geldwerte Leistung/Steuerrisiko im Textfeld vermerken.'
  nachweise:
  - Darlehens-/Kontokorrentverträge
  - Zinsabrechnungen
  - Kontoblatt Zinsertrag
  - ESTV-Rundschreiben Zinssätze des Geschäftsjahres
  rechnen: Sollzins = Σ (Saldo × Zinssatz × Tage / Zinstage-Basis gemäss Vertrag); Differenz = Sollzins − verbuchter Zinsertrag inkl. Abgrenzung
  feststellung_wenn: Zins nicht, zu tief oder nicht periodengerecht erfasst, Satz unter ESTV-safe-haven ohne Drittvergleich oder kein schriftlicher Vertrag.
  fundstellen:
  - quelle: estv-zinsen-2026__s001-1
    zitat: Die Gewährung unverzinslicher oder ungenügend verzinster Vorschüsse oder Darlehen an Beteiligte oder an ihnen nahestehende Dritte stellt eine geldwerte Leistung dar.
  - quelle: hwp-er-2026__rz-0157-s211
    zitat: Transaktionen mit nahestehenden Personen möglicherweise nicht zu marktüblichen Bedingungen abgewickelt werden und dies steuerliche Risiken implizieren kann
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: estv-zinsen-2026__s002-1
    zitat: aus Eigenkapital finanziert und wenn kein Fremdkapital verzinst werden muss
  - quelle: estv-zinsen-2026__s002-1
    zitat: aus Fremdkapital finanziert
  - quelle: estv-rs-2-219-2026__s002-1
    zitat: Ist die Kapitalgesellschaft oder Genossenschaft verzinsliche Verpflichtungen eingegangen
  - quelle: estv-rs-2-219-2026__s002-1
    zitat: so ist mindestens der entsprechende Zinssatz für Schweizer Franken zu berücksichtigen
  - quelle: treuhand-almanach-2026__s065-1
    zitat: 2024 2025 2026 mindestens mindestens mindestens 1,50 % 1,00 % 0,75 %
- id: D1-305
  vorgehen: Forderungskonten und Einzelposten in Fremdwährung identifizieren. Verwendete Stichtagskurse mit Jahresendkursen gemäss Bankunterlagen vergleichen und Umrechnung nachrechnen;
    bei langfristigen Posten prüfen, dass keine unrealisierten Kursgewinne erfasst sind. Ohne Fremdwährungsposten «nicht anwendbar» im Textfeld vermerken.
  nachweise:
  - Einzelnachweis mit Währung
  - Devisenkurse 31.12. (Bank)
  - Kontoblätter Kursdifferenzen
  rechnen: CHF-Wert = FW-Betrag × Stichtagskurs 31.12.; Differenz = CHF-Wert − Buchwert
  feststellung_wenn: Umrechnung mit falschem Kurs und wesentlicher Differenz oder unrealisierter Kursgewinn auf langfristiger Position im Ertrag erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
  - quelle: hwp-bur-2023__rz-0090-s077-t2
    zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- id: D1-306
  vorgehen: 'Je wesentlicher Forderung Schuldner, Fälligkeit, Sicherheiten und Zahlungsverhalten erheben. Bei Nahestehenden und Beteiligungsgesellschaften Jahresrechnung des Schuldners
    beiziehen (Eigenkapital, Verluste, Ausblick); bei Anzahlungen Leistungsfähigkeit des Lieferanten. Je Posten werthaltig/zweifelhaft im Textfeld begründen; zweifelhafte Posten an D1-307
    übergeben. Forderungen gegenüber einer Beteiligungsgesellschaft zusammen mit der Beteiligung (H3) beurteilen: JR der Beteiligung ganz lesen (EK, Ergebnis, Ausblick/Ereignisse nach
    Stichtag); Wertberichtigungen zuerst der Beteiligung, dann nachrangigen Finanzierungen, dann den übrigen Forderungen zuordnen. Ergebnis D1 und H3 gleichlautend.'
  nachweise:
  - Jahresrechnung des Schuldners
  - Verträge und Sicherheiten
  - Zahlungseingänge neue Rechnung
  rechnen: 'Ungedeckter Betrag = Forderung − werthaltige Sicherheiten. Beteiligungsgesellschaft (gleiche Begriffe wie H3-102): anteiliges EK = Eigenkapital der Gesellschaft × Kapitalquote;
    Unterdeckung = Buchwert Beteiligung − anteiliges EK (> 0 = Indiz für Wertberichtigung der Beteiligung, höchstens bis zum Buchwert). Darlehen und Forderungen an die Gesellschaft sind
    in deren Bilanz Fremdkapital und nicht nochmals vom EK abzuziehen. EK der Gesellschaft negativ: Beteiligung voll betroffen, zusätzlich Indiz auf Forderungen ≤ min(−EK der Gesellschaft;
    Σ Darlehen und Forderungen ggü. der Gesellschaft), zuerst nachrangige, dann übrige Forderungen (Kaskade); bei gleichrangigen Drittgläubigern kleiner. Gesamtengagement = Buchwert
    Beteiligung + Darlehen + übrige Forderungen; Σ Wertberichtigungen ≤ Gesamtengagement. Rechenschema Praxis/intern (Substanzwert als Indiz); höheren erzielbaren Wert nur mit Ertragswert-/Planungsbegründung
    der GL (H3-102/H3-302); den Betrag bestimmt der WP.'
  feststellung_wenn: Schuldner mit schlechter oder unklarer Bonität (Verluste, negatives Eigenkapital, keine Sicherheit) ohne angemessene Wertberichtigung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0160-s192
    zitat: Die Werthaltigkeit der Forderungen ist zu beurteilen
  - quelle: hwp-bur-2023__rz-0173-s195
    zitat: Der Bonitätsprüfung ist besondere Aufmerksamkeit zu schenken
  - quelle: hwp-bur-2023__rz-0191-s202
    zitat: Bei der Bewertung geleisteter Anzahlungen sind Bonität und Leistungsfähigkeit des Empfängers, allfällige Sicherheiten wie Anzahlungs- oder Bankgarantien
  - quelle: hwp-bur-2023__rz-0293-s222
    zitat: Wertberichtigungen zuerst der Beteiligung, dann nachrangig gewährten Finanzierungen und schliesslich den übrigen Forderungen des Unternehmens gegenüber dem Tochterunternehmen
      zuzuordnen
  - quelle: hwp-bur-2023__rz-0291-s222
    zitat: Sinkt der erzielbare Wert einer Beteiligung unter den bisherigen Buchwert, wird eine Wertberichtigung erforderlich.
  - quelle: hwp-bur-2023__rz-0292-s222
    zitat: beispielsweise eine Substanzwertbetrachtung oder eine einfache Ertragswertermittlung anhand einer Planungsrechnung
- id: D1-307
  vorgehen: Zahlungskonditionen/Fälligkeit je wesentlicher Forderung mit dem Stichtag vergleichen und Zahlungseingänge nach dem Stichtag aus Kontoauszügen/Kontoblättern neue Rechnung
    erheben. Überfällige, nicht bezahlte oder bestrittene Posten auf Wertberichtigungsbedarf prüfen; gebuchte Wertberichtigung mit Bedarf vergleichen und Differenz dokumentieren.
  nachweise:
  - Verträge/Zahlungskonditionen
  - Kontoauszüge und Kontoblätter neue Rechnung
  - Wertberichtigungsberechnung des Kunden
  rechnen: WB-Bedarf = Σ zweifelhafte Forderungen − werthaltige Sicherheiten; Differenz = WB-Bedarf − gebuchte WB; Zahlungsquote = Zahlungen nach Stichtag / Saldo 31.12.
  feststellung_wenn: Überfällige oder nach dem Stichtag nicht bezahlte wesentliche Forderung ohne Wertberichtigung, oder gebuchte Wertberichtigung wesentlich zu tief.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Beurteilung der Notwendigkeit einer Wertberichtigung durch Prüfung der Zahlungskonditionen oder dem nachträglichen Eingang der Zahlungen
  - quelle: or__art-960a
    zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- id: D1-308
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: Kontoblätter
    der übrigen Forderungskonten in neuer Rechnung bis zum Prüfungsdatum auf Ausbuchungen, Gutschriften, Storni und Umbuchungen gegen Aufwand durchsehen, die Bestände per Stichtag betreffen.
    Fehlen Kontoblätter neue Rechnung, PBC-Pendenz erfassen.'
  nachweise:
  - Kontoblätter neue Rechnung der D1-Konten
  - Belege zu Ausbuchungen/Gutschriften
  rechnen: Σ Ausbuchungen/Gutschriften n.R. zu Beständen per 31.12. − gebuchte Wertberichtigung = ungedeckter Betrag
  feststellung_wenn: Wesentliche Ausbuchung oder Gutschrift in neuer Rechnung zu einer Forderung per Stichtag ohne entsprechende Wertberichtigung oder Korrektur.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s077-2
    zitat: Durchsicht der Konten in neuer Rechnung auf auffällige Beträge, die darauf hindeuten, dass Forderungen des Vorjahres ausgebucht wurden
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
      anzunehmen sind
- id: D1-320
  vorgehen: 'Anhang auf Angaben zu übrigen Forderungen prüfen: gesonderter Ausweis gegenüber Beteiligten/Organen und Beteiligungsgesellschaften (aus D1-201), Gesamtbetrag verpfändeter/gesperrter
    Aktiven (aus D1-101), Erläuterungen zu wesentlichen Positionen, Umrechnungskurse nur bei Rechnungslegung in Fremdwährung (Art. 958d Abs. 3 OR). Fehlende oder abweichende Angaben
    mit Betrag im Textfeld festhalten.'
  nachweise:
  - Anhang der Jahresrechnung
  - Ergebnisse D1-101 und D1-201
  rechnen: Anhangangabe = Summe gemäss D1-101 bzw. D1-201
  feststellung_wenn: Pflichtangabe im Anhang fehlt oder Betrag weicht vom Prüfungsergebnis ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-3
    zitat: Sind Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: ser-2022__anh-d-s098-2
    zitat: Durchsicht des Anhangs auf vollständige Offenlegung der aufgrund der Befragungen zutreffenden Positionen gemäss Art. 959c OR
- id: D1-321
  vorgehen: Auf übrigen Forderungen festgestellte stille Reserven erheben (z.B. Wertberichtigungen über dem betriebswirtschaftlichen Bedarf) und Bestand Vorjahr, Bildung/Auflösung und
    Bestand Stichtag mit dem Detailnachweis des Kunden abstimmen. Nettoauflösung an die Gesamtbeurteilung (Anhangangabe Art. 959c Abs. 1 Ziff. 3 OR) weitergeben.
  nachweise:
  - Nachweis stille Reserven des Kunden
  - Wertberichtigungsberechnung
  - Ergebnisse D1-306/D1-307
  rechnen: Veränderung stille Reserven = Bestand 31.12. − Bestand Vorjahr; Nettoauflösung > 0 → Anhangangabe prüfen
  feststellung_wenn: Stille Reserven nicht nachgewiesen oder nicht abgestimmt, oder wesentliche Nettoauflösung ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: ser-2022__anh-d-s072-2
    zitat: Plausibilisierung von Bestand und Veränderungen der stillen Reserven auf Basis der Erkenntnisse aus den Prüfungsarbeiten bei den einzelnen Bilanzpositionen
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
      übersteigt
- id: D1-322
  vorgehen: Prüfen, ob mehrjährig gültige Dokumente zu den übrigen Forderungen (Darlehens-/Kontokorrentverträge mit Nahestehenden, Kautions- und Sicherheitsvereinbarungen, Bewilligungen,
    Verpfändungs-/Zessionsverträge) in der Dauerakte aktuell abgelegt sind. Neue oder geänderte Verträge aus M-Files zur Ablage vorschlagen und Laufzeiten vermerken.
  nachweise:
  - Dauerakte
  - Verträge und Bewilligungen in M-Files
  rechnen: ''
  feststellung_wenn: Wesentlicher Vertrag fehlt in der Dauerakte oder ist veraltet (Pendenz; keine Feststellung zur Jahresrechnung).
  fundstellen:
