# Prüffeld G1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: G1
bezeichnung: Mobile Sachanlagen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 17
    korrigiert: true
  ergaenzt: '2026-11-13 Runde R2: Wissenslücken aus E2E-Lauf ergänzt (Zitate maschinell geprüft, Zweitprüfung offen)'
kurzbeschrieb: 'Mobile Sachanlagen (Maschinen, Mobiliar, Informatik, Fahrzeuge; inkl. Wertberichtigungen) mit Abschreibungen, Zu-/Abgängen, Unterhalt. ER: Befragung, Vorjahresanalyse,
  Abstimmung Bilanz–Hauptbuch–Anlagespiegel–Inventarliste inkl. Abschreibung ↔ ER, Abgänge je Beleg, Anhang, stille Reserven.'
gesetz:
- thema: Prüfungsumfang eingeschränkte Revision
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Aktivierungspflicht/-fähigkeit (Verfügungsmacht)
  quelle: or__art-959
  zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann
- thema: 'Umlaufvermögen: innert eines Jahres zu realisierende Aktiven (zur Veräusserung vorgesehene Sachanlagen)'
  quelle: or__art-959
  zitat: Als Umlaufvermögen müssen die flüssigen Mittel bilanziert werden sowie andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag
- thema: Begriff Anlagevermögen (langfristige Nutzung)
  quelle: or__art-960d
  zitat: Als Anlagevermögen gelten Werte, die in der Absicht langfristiger Nutzung oder langfristigen Haltens erworben werden.
- thema: Langfristigkeit (> 12 Monate)
  quelle: or__art-960d
  zitat: Als langfristig gilt ein Zeitraum von mehr als zwölf Monaten.
- thema: Mindestgliederung Bilanz (Einzelausweis in vorgegebener Reihenfolge)
  quelle: or__art-959a-t1
  zitat: Unter den Aktiven müssen ihrem Liquiditätsgrad entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: 'Mindestgliederung: Sachanlagen als eigene Position im Anlagevermögen (Art. 959a Abs. 1 Ziff. 2 Bst. c OR)'
  quelle: or__art-959a-t1
  zitat: c. Sachanlagen
- thema: Ersterfassung höchstens zu Anschaffungs-/Herstellungskosten
  quelle: or__art-960a
  zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- thema: Folgebewertung – Höchstwert AK/HK
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Abschreibungen und Wertberichtigungen
  quelle: or__art-960a
  zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen, anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden.
- thema: Zusätzliche Abschreibungen (stille Reserven)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Einzelbewertung
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Überprüfung bei Anzeichen einer Überbewertung
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Stetigkeit von Darstellung und Bewertung
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Bestandesnachweis durch Inventar oder auf andere Art
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Verrechnungsverbot
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Belegnachweis
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: Ausweis Abschreibungen in der Erfolgsrechnung (Produktionserfolgsrechnung)
  quelle: or__art-959b-t1
  zitat: Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens
- thema: 'Absatzerfolgsrechnung: Abschreibungen auf Anlagevermögen im Anhang'
  quelle: or__art-959b-t2
  zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens ausgewiesen
    werden.
- thema: 'Anhang: angewandte Grundsätze'
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: 'Anhang: Nettoauflösung stiller Reserven (Gesamtbetrag)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: Nettoauflösung nur offenzulegen, wenn das Ergebnis wesentlich günstiger dargestellt wird'
  quelle: or__art-959c-t1
  zitat: wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
- thema: 'Anhang: Leasingverpflichtungen'
  quelle: or__art-959c-t2
  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen
- thema: 'Anhang: verpfändete Aktiven und Eigentumsvorbehalt'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: ausserordentliche/einmalige/periodenfremde Positionen (z.B. wesentliche Erfolge aus Anlagenverkäufen)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
risiken:
- text: Abgänge (Verkauf, Verschrottung, Entsorgung) nicht oder nicht vollständig ausgebucht; bilanzierte Anlagen sind nicht mehr vorhanden.
  pruefziele:
  - EX
  - VO
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Zu- und Abgänge von Sachanlagen sind einzeln zu erfassen.
- text: Verkaufserlös aus Anlagenabgang direkt als Ertrag verbucht, ohne Ausbuchung von AW/kumulierten Abschreibungen; Buchgewinn/-verlust falsch ermittelt oder mit anderen Positionen
    verrechnet.
  pruefziele:
  - EX
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- text: Wertvermehrende Investitionen als Unterhalt/Aufwand gebucht oder reiner Unterhalt aktiviert (Abgrenzung Unterhalt/Investition).
  pruefziele:
  - VO
  - BE
  - RI
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Unterhalt und Reparaturen sind in der Regel der Erfolgsrechnung zu belasten.
- text: Aktivierung über den Anschaffungskosten (Rabatte nicht abgezogen, nicht aktivierbare Kosten aktiviert).
  pruefziele:
  - BE
  quelle: or__art-960a
  zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- text: Bei effektiver MWST-Abrechnung abziehbare Vorsteuer mitaktiviert (Zugang brutto statt netto) und zugleich als Vorsteuer geltend gemacht.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0356-s148
  zitat: bei Investitionen und übrigem Betriebsaufwand bezahlte Vorsteuer ist – sofern sie vom Vorsteuerabzug nicht ausgeschlossen ist – rückforderbar
- text: Überbewertung durch unterlassene oder zu tiefe planmässige Abschreibungen bzw. fehlende Wertberichtigung bei dauerhafter Wertbeeinträchtigung (stillgelegte, veraltete Anlagen).
  pruefziele:
  - BE
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- text: Zu- oder Abgänge in falscher Periode erfasst (Übergang Verfügungsmacht/Eigentum).
  pruefziele:
  - PA
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: spätestens jedoch im Zeitpunkt des Eigentumsübergangs zu erfassen
- text: Bilanzierte Anlagen stehen nicht im Eigentum der Gesellschaft (Leasing, Eigentumsvorbehalt, Erwerb auf Namen Dritter) oder sind verpfändet, ohne Offenlegung.
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0385-s239
  zitat: rechtlich das Eigentum am Leasinggut für die Dauer des Vertragsverhältnisses beim Leasinggeber verbleibt
- text: Zur Veräusserung innert 12 Monaten vorgesehene Sachanlagen weiter im Anlagevermögen ausgewiesen oder zum (höheren) Veräusserungswert bilanziert.
  pruefziele:
  - DO
  - BE
  quelle: hwp-bur-2023__rz-0375-s238
  zitat: Zur Veräusserung vorgesehene Sachanlagegüter sind im Umlaufvermögen auszuweisen
- text: Methodenwechsel oder Reduktion von Abschreibungen (Auflösung stiller Reserven) ohne Begründung bzw. ohne Anhangangabe.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0329-s228-t2
  zitat: deren Auflösung offenlegungspflichtig sein kann (Art. 959c Abs. 1 Ziff. 3 OR)
- text: Anhangangaben zu Leasingverpflichtungen, verpfändeten Aktiven oder Aktiven unter Eigentumsvorbehalt fehlen oder sind unvollständig.
  pruefziele:
  - DO
  - RV
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- text: Bei angespannter Lage (Verluste, Fortführungsrisiko) Werthaltigkeit der Anlagen nicht gegeben bzw. Anlagen kurzfristig finanziert.
  pruefziele:
  - BE
  - DO
  quelle: hwp-er-2026__rz-0191-s224
  zitat: wesentliche Wertbeeinträchtigung von Aktiven
unterlagen:
- dokument: Anlagespiegel per 31.12. (AW 01.01., Zugänge, Abgänge, kumulierte Abschreibungen, Abschreibung LJ, Buchwert je Kategorie), LJ und VJ
  zweck: Abstimmung Bilanz/Hauptbuch (G1-301), Vorjahresvergleich (G1-201)
  quelle: hwp-bur-2023__rz-0333-s229
  zitat: weshalb die Erstellung eines Anlagespiegels zweckmässig sein kann
- dokument: Anlagenverzeichnis/Inventarliste der Einzelobjekte (Anschaffungsdatum, AK/HK, Nutzungsdauer, kumulierte Abschreibungen)
  zweck: Abstimmung mit Jahresrechnung (G1-302), Restwerte und Abschreibungen nachrechnen (G1-404, G1-405)
  quelle: ser-2022__anh-d-s082-2
  zitat: Abstimmung der Inventarliste mit Angabe der Anschaffungs- bzw. Herstellungskosten und der kumulierten Abschreibungen
- dokument: Abschreibungsrichtlinie bzw. Abschreibungsplan (Methoden, Sätze, Nutzungsdauern, Aktivierungsgrenze)
  zweck: Grundlage Bewertung und Stetigkeit (G1-101, G1-107, G1-405)
