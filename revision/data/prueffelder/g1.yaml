- id: G1-321
  vorgehen: 'Aufstellung Bestand/Veränderung stiller Reserven in M-Files suchen. Je Kategorie Buchwert mit dem OR-Höchstwert aus der Aufstellung des Kunden vergleichen; Zwangsreserven
    (Mehrwert über AK) nicht einrechnen. Fehlt die Aufstellung: Pendenz und Notiz Schlussbesprechung an WP; zusätzlich indikativ den Soll-Restwert je Objekt aus dem Anlagenverzeichnis
    nach der deklarierten Methode (G1-101) mit `rechne` ermitteln, linear = AW × (1 − verstrichene Jahre / Nutzungsdauer), mindestens 0, und als «indikativ, Beurteilung WP» kennzeichnen.
    Methode mit Vorjahr abgleichen, Veränderung an G1-320 und T1-305 melden. Steuerliche Normalsätze nicht unbesehen übernehmen.'
  nachweise:
  - Aufstellung stille Reserven LJ/VJ
  - Anlagenverzeichnis (AW, Anschaffungsdatum, Nutzungsdauer)
  - Anlagespiegel
  rechnen: Stille Reserve je Kategorie = OR-Höchstwert (AK – betriebswirtschaftlich notwendige planmässige Abschreibungen, max. erzielbarer Wert) – Buchwert; Mehrwerte über AK-Basis
    (Zwangsreserven) nicht einrechnen; Veränderung = Bestand LJ – Bestand VJ; G1-Nettoauflösung = Σ Auflösungen – Σ Bildungen (> 0) → T1-305
  feststellung_wenn: Nettoauflösung (Gesamtbetrag über alle Positionen, in T1-305) stellt Ergebnis wesentlich günstiger dar und fehlt im Anhang; Methode ggü. Vorjahr geändert; keine
    Aufstellung → Pendenz.
