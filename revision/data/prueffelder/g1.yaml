- id: G1-302
  vorgehen: 'Anlagenverzeichnis/Inventarliste (Einzelobjekte mit Anschaffung, AW, Nutzungsdauer, kumulierten Abschreibungen) je Kategorie summieren und mit Anlagespiegel und Jahresrechnung
    abstimmen. Fehlende kumulierte Abschreibungen je Objekt aus Nutzungsdauer nachrechnen oder als Pendenz erfassen. Zugänge laut Rechnungen und Abgänge laut Verträgen im Verzeichnis
    abgleichen. Bei Zugängen Rechnungsbetrag (netto/brutto; MWST-Methode aus M2) und Rechnungsempfänger notieren. Ermessensfragen (Nutzungsdauer, Aktivierbarkeit) nicht selbst beurteilen,
    sondern als Notiz «Schlussbesprechung» an den WP (Vorschlag G1-403/G1-305); klare Buchungsfehler siehe Notiz. Abgänge: jeden Verkaufs- und Entsorgungsbeleg (Kontoblätter Sachanlagen,
    Ertrags-/a.o.-Konten, Belegverzeichnis) einem Objekt zuordnen und prüfen, ob AW und kumulierte Abschreibungen ausgebucht und der Bucherfolg erfasst sind. Zugänge: aktivierten Betrag
    mit der Rechnung (netto/brutto) vergleichen. Je Objekt Soll-Restwert und Restdauer mit `rechne` (nie im Kopf).'
  nachweise:
  - Anlagenverzeichnis/Inventarliste 31.12.
  - Anlagespiegel
  - Jahresrechnung
  rechnen: 'Σ AW Inventarliste je Konto = AW 31.12. Anlagespiegel = Saldo 15x0; Σ kumulierte Abschreibungen je Kategorie = WB 31.12. = Saldo 15x9; je Abgang: Restbuchwert = AW − kum.
    Abschreibung des Objekts, Bucherfolg = Erlös − Restbuchwert (Erlös als Ertrag gebucht, Objekt noch im Verzeichnis → Fehler); je Zugang bei effektiver MWST-Methode: aktivierter Betrag
    − Rechnungsbetrag ohne MWST = mitaktivierte Vorsteuer; je Objekt nach deklarierter Methode (G1-101), linear: Monate = verstrichene Monate seit Anschaffung, Soll-kum. Abschreibung
    = AW × min(1; Monate / (Nutzungsdauer × 12)), Soll-Restwert = AW − Soll-kum. Abschreibung, Restdauer (Monate) = Nutzungsdauer × 12 − Monate'
  feststellung_wenn: Summe Inventarliste ≠ Anlagespiegel/Bilanz, abgegangene Objekte noch im Verzeichnis oder fehlende Angaben zu kumulierten Abschreibungen. Verkaufserlös gebucht, Objekt
    aber nicht ausgebucht; Vorsteuer mitaktiviert (effektive Methode); Buchwert eines Objekts wesentlich über dem Soll-Restwert (→ Schlussbesprechung, G1-404).
