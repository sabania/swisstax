- dokument: Kontoblätter Sachanlagen/Unterhalt und Kreditorenjournal der neuen Rechnung bis Prüfungsdatum
  zweck: Periodenabgrenzung (G1-304, nur auf ausdrückliche Anweisung des WP)
  quelle: ser-2022__anh-d-s082-2
