    Nutzungsdauer); Zeile 1700/1709 gehört zu I1. Zugang 1520 = 24''000 (= Rechnungstotal ITF-25-0512 inkl. MWST); Fahrzeuge Abgänge 0, Lieferwagen noch im Verzeichnis'
