  zweck: 'Pflichtlektüre für G1-301/G1-302: Abschreibungsbuchungen, Abgänge und Verkaufserlöse je Buchung; Wertvermehrende Anlagen im Aufwand (G1-406); Durchsicht ungewöhnlicher Posten
