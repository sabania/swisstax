  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen
- dokument: Kredit-, Pfand- und Sicherungsverträge; nur bereits in M-Files vorhandene Bankdokumente (z.B. vom Kunden abgelegte Bankbestätigungen, Abschnitt Sicherheiten) – keine Bestätigungen
