  quelle: hwp-bur-2023__rz-0360-s149
  zitat: Da bei der Saldosteuersatzmethode jeweils der Bruttobetrag massgebend ist
- dokument: Schriftliche Antworten der Geschäftsleitung (Kundenbefragung 10.11) zu den Befragungen G1-101 bis G1-107
  zweck: Auswertbarer Nachweis für Befragungsschritte, da der Agent nicht selbst befragt; fehlende Antworten als Pendenz
  quelle: ser-2022__anh-e-s102-1
  zitat: Eine schriftliche Erklärung der Unternehmensleitung ist ein besserer Prüfungsnachweis als eine mündliche Erklärung
bewertung:
- regel: Ersterfassung höchstens zu Anschaffungs- oder Herstellungskosten.
  quelle: or__art-960a
  zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- regel: Planmässige Abschreibung auf den geschätzten Restwert über die Nutzungsdauer (direkt/indirekt; linear, degressiv oder leistungsabhängig).
  quelle: hwp-bur-2023__rz-0332-s229
  zitat: Die Abschreibung der Anlagegüter auf den geschätzten Restwert erfolgt zur Verteilung der
- regel: 'Wertbeeinträchtigung: Buchwert mit erzielbarem Wert (höherer von Nutzwert und Netto-Marktwert) vergleichen; tiefer → ausserplanmässige Wertberichtigung.'
  quelle: hwp-bur-2023__rz-0342-s231
  zitat: Der erzielbare Wert ist der höhere von Nutzwert und Netto-Marktwert.
- regel: Kein Verzicht auf planmässige Abschreibungen mit der Begründung eines höheren Nutz-, Veräusserungs- oder Verkehrswerts (ausser zur Kompensation früherer Mehrabschreibungen =
    Auflösung stiller Reserven).
  quelle: hwp-bur-2023__rz-0345-s231
  zitat: Gegen den Grundsatz der Vorsicht und damit unzulässig wäre es, auf planmässige Abschreibungen von Anlagegütern
- regel: Anschaffungskosten umfassen Bezugs-, Einrichtungs-, Prüf- und Abnahmekosten.
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Zu den Anschaffungskosten gehören auch Bezugskosten, Kosten für Einrichtung
- regel: Rabatte vom Kaufpreis abziehen, handelsüblichen Skonto nicht.
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Vom Kaufpreis in Abzug zu bringen sind Rabatte aller Art, nicht hingegen handelsüblicher Skonto.
- regel: 'Effektive MWST-Abrechnungsmethode: abziehbare Vorsteuer auf Investitionen ist rückforderbar und gesondert als Vorsteuer zu erfassen; sie gehört nicht zu den aktivierten Anschaffungskosten
    (netto aktivieren).'
  quelle: hwp-bur-2023__rz-0356-s148
  zitat: bei Investitionen und übrigem Betriebsaufwand bezahlte Vorsteuer ist – sofern sie vom Vorsteuerabzug nicht ausgeschlossen ist – rückforderbar
- regel: 'Saldosteuersatzmethode: Aufwendungen werden brutto inkl. Vorsteuer erfasst; Zugänge entsprechend brutto aktivieren.'
  quelle: hwp-bur-2023__rz-0360-s149
  zitat: Die Aufwendungen werden immer brutto inklusive der darauf lastenden Vorsteuern erfasst.
- regel: Unterhalt/Reparaturen in die Erfolgsrechnung; wertvermehrende Investitionen (höherer Nutzwert, längere Lebensdauer) können aktiviert werden.
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: nachhaltig erhöhen oder die Lebensdauer wesentlich verlängern, können aktiviert werden
- regel: Indirekte Abschreibungsmethode ist vorzuziehen (AK bleiben ersichtlich).
  quelle: hwp-bur-2023__rz-0333-s229
  zitat: Der indirekten Abschreibungsmethode ist gegenüber der direkten Methode der Vorzug zu geben.
- regel: Die gewählte Abschreibungsmethode ist stetig anzuwenden.
  quelle: hwp-bur-2023__rz-0337-s230
  zitat: Die gewählte Methode ist stetig anzuwenden.
- regel: Methodenwechsel (z.B. linear/degressiv, vom Buch- oder Anschaffungswert) nur in begründeten Fällen; im Anhang begründen und darlegen.
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden
- regel: Nutzungsdauer periodisch und bei Anzeichen einer Wertverminderung überprüfen.
  quelle: hwp-bur-2023__rz-0336-s230
  zitat: Anzeichen auf Wertverminderung zu überprüfen
- regel: Ist der erzielbare Wert tiefer als der planmässige Restwert, ist auf diesen Wert wertzuberichtigen.
  quelle: hwp-bur-2023__rz-0345-s231
  zitat: (ausserplanmässige) Wertberichtigung auf diesen Wert vorzunehmen
- regel: Endgültig stillgelegte Anlagen auf Veräusserungs- bzw. Schrottwert wertberichtigen.
  quelle: hwp-bur-2023__rz-0373-s237
  zitat: Im letzteren Fall ist eine Wertberichtigung auf den Veräusserungswert
- regel: Zusätzliche Abschreibungen sind zulässig (stille Reserven); ihre spätere Unterlassung/Auflösung ist eine Auflösung stiller Reserven.
  quelle: hwp-bur-2023__rz-0340-s230
  zitat: Die Unterlassung oder Auflösung von Abschreibungen in Kompensation früher
- regel: Bestand stiller Reserven jährlich als Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert (AK/HK abzüglich nutzungs- und altersbedingter Abschreibungen, höchstens
    erzielbarer Wert) ermitteln, je Bilanzposition stetig.
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
- regel: Zwangsreserven (Wertsteigerung über die AK-Basis) sind keine offenlegungsrelevanten stillen Reserven; offenlegungsrelevant sind nur Mehrabschreibungen über den nutzungs- und
    altersbedingten Wertverlust.
  quelle: hwp-bur-2023__rz-0329-s228-t2
  zitat: Die Auflösung solcher Zwangsreserven ist nach dem Gesetz nicht offenlegungspflichtig.
- regel: 'Abgang bei indirekter Abschreibung: AK und kumulierte Abschreibungen/Wertberichtigungen ausbuchen; Buchgewinn/-verlust in die Erfolgsrechnung.'
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: bei indirekter Abschreibung die Anschaffungskosten sowie die kumulierten Abschreibungen und Wertberichtigungen
- regel: Gewinne und Verluste aus Anlagenabgängen nicht miteinander verrechnen (Verrechnungsverbot).
  quelle: hwp-bur-2023__rz-0382-s238
  zitat: Eine Verrechnung von Gewinnen mit Verlusten aus Anlagenabgängen ist gemäss Verrechnungsverbot nicht zulässig
- regel: Direkt mit dem Verkauf zusammenhängende Aufwendungen (z.B. Provisionen) dürfen mit dem Veräusserungserlös verrechnet werden.
  quelle: hwp-bur-2023__rz-0382-s238
  zitat: Es ist vertretbar, Aufwendungen, die direkt mit dem Verkauf in Zusammenhang stehen
- regel: Zur Veräusserung innert eines Jahres vorgesehene Sachanlagen im Umlaufvermögen ausweisen, nicht zum höheren Veräusserungswert.
  quelle: hwp-bur-2023__rz-0375-s238
  zitat: Dies ist indessen kein Grund, solche Sachanlagen zum (höheren) Veräusserungswert zu bilanzieren.
- regel: Bilanzierte Leasinggüter als solche bezeichnen; Aktiven unter Eigentumsvorbehalt und verpfändete Aktiven je im Gesamtbetrag offenlegen.
  quelle: hwp-bur-2023__rz-0377-s238
  zitat: Für Aktiven unter Eigentumsvorbehalt sowie zur Sicherung eigener Verbindlichkeiten verwendete Aktiven ist je der Gesamtbetrag offenlegungspflichtig
- regel: 'Steuerpraxis ESTV (Merkblatt A 1995; Art. 62 DBG ^[dbg__art-62]): Normalsätze in Prozent vom Buchwert ^[estv-mb-a-1995__s001-1], vom Anschaffungswert die Hälfte; gilt nur für
    Abschreibungen nach Art. 960a Abs. 3 OR. Nur zur Plausibilisierung, kein handelsrechtlicher Massstab (Sätze: `wert abschreibung`).'
  quelle: estv-mb-a-1995__s001-5
  zitat: Für Abschreibungen auf dem Anschaffungswert sind die genannten Sätze um die Hälfte zu reduzieren.
fallstricke:
- text: 'Physische Bestandsaufnahme (G1-306) ist in der SER eine weiter gehende Prüfungshandlung: nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko; sie
    bleibt dem WP vorbehalten.'
  quelle: ser-2022__anh-d-s082-2
  zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- text: Die Teilnahme an der Inventur (Beobachtung) ist in der eingeschränkten Revision ausgeschlossen. Der Agent führt physische Tätigkeiten nie aus und bereitet höchstens Auswahllisten
    vor.
  quelle: hwp-er-2026__rz-0134-s203
  zitat: die Teilnahme an der Inventur (Beobachtung)
- text: Bewertungsgutachten (G1-401) sind nicht Bestandteil der eingeschränkten Revision; der Verzicht muss nicht begründet werden. Der Agent holt keine Gutachten ein und gibt keine
    in Auftrag; ein vom Kunden ohnehin erstelltes Gutachten in M-Files nur auswerten.
  quelle: ser-2022__6-2-6
  zitat: Der Abschlussprüfer muss deshalb nicht begründen, weshalb er diese Prüfungshandlungen nicht durchführt.
- text: Keine Bestätigungen Dritter (Bank, Lieferanten, Leasinggeber) einholen; nur intern verfügbare bzw. bereits in M-Files abgelegte Dokumente auswerten.
  quelle: hwp-er-2026__rz-0262-s085
  zitat: Die Prüfung beschränkt sich grundsätzlich auf beim geprüften Unternehmen intern verfügbare Informationen.
- text: 'Agent hat kein Recht für Kundenversand: Unterlagen, Aufstellungen oder Begründungen nie beim Kunden anfordern, sondern als Pendenz (Konto, Datum, Betrag) erfassen; Punkte für
    den Kunden als Notiz Schlussbesprechung an den WP.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- text: Befragungsantworten allein genügen bei wesentlichen Positionen nicht; immer mit Analytik oder Detailprüfung (Anlagespiegel, Belege) ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: nicht ausschliesslich auf Befragungen stützen
- text: Keine repräsentativen Stichproben ziehen.
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: Gezielte Auswahl nach hohem Wert oder Schlüsselelementen (z.B. über Toleranzwesentlichkeit, auffällige Posten) und im Textfeld begründen; die Standardauswahl des Konzepts ist
    ein Vorschlag, durch consis zu bestätigen.
  quelle: hwp-er-2026__rz-0261-s243
  zitat: Elemente mit einem hohen Wert oder Schlüsselelemente
- text: 'Verkaufserlöse können direkt auf Ertrags- oder a.o.-Konten verbucht sein, während Anlagespiegel und Anlagenverzeichnis das Objekt weiterführen: Abgänge immer auch über Verkaufsverträge
    und Erlösbuchungen suchen.'
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- text: 'Reduzierte oder unterlassene Abschreibungen bei schlechtem Geschäftsgang sind kritisch: Werthaltigkeit erst recht prüfen und allfällige Auflösung stiller Reserven an G1-321/Anhang
    melden.'
  quelle: hwp-bur-2023__rz-0340-s230
  zitat: In solchen Fällen wird der Nutzwert wie auch der Netto-Marktwert der Sachanlagen erst recht kritisch beurteilt werden müssen
- text: ESTV-Normalsätze sind Steuerpraxis. Handelsrechtlicher Massstab ist der nutzungs- und altersbedingte Wertverlust (Art. 960a Abs. 3 OR); Abschreibungen darüber hinaus sind stille
    Reserven (an G1-321). Steuerlich sind höhere Sätze nur mit konkretem Nachweis möglich (Fachliteratur ^[ef-2026-08-buchungslogik__s005-1]).
  quelle: or__art-960a
  zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen, anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden.
- text: Abschreibungen über das betriebswirtschaftliche Mass hinaus bilden handelsrechtlich stille Reserven (an G1-321 melden); Basis ist der OR-Höchstwert, nicht der Markt- oder Verkehrswert.
  quelle: hwp-bur-2023__rz-0669-s296
  zitat: Durch Abschreibungen, Rückstellungen und Wertberichtigungen, die über das betriebswirtschaftliche Mass hinaus vorgenommen werden
- text: 'Nettoauflösung stiller Reserven betrifft den Gesamtbetrag über alle Bilanzpositionen und ist nur offenzulegen, wenn das Ergebnis dadurch wesentlich günstiger dargestellt wird:
    G1-Ergebnis an T1-305 übergeben, nicht isoliert beurteilen.'
  quelle: or__art-959c-t1
  zitat: wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
- text: Eigentumsvorbehalt des Lieferanten ändert die Aktivierung nicht, ist aber im Anhang offenzulegen.
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: ist aber in deren Anhang zur Jahresrechnung offenzulegen
- text: Bei geringwertigen Anschaffungen (Werkzeuge, Kleingeräte, Notebooks) ist die Grenze zum Unterhalt/Verbrauchsmaterial fliessend; die interne Aktivierungsgrenze erfragen (schriftlich/Pendenz)
    und stetig anwenden.
  quelle: hwp-bur-2023__rz-0368-s236
  zitat: sind die Grenzen zum Verbrauchsmaterial bzw. zum Unterhaltsaufwand fliessend
- text: 'Einkaufsrechnung lautet nicht auf die Gesellschaft (z.B. auf Organ/Privatadresse): Verfügungsmacht/Eigentum (RV) und mögliche Privatnutzung klären, bevor der Zugang als Bestandesnachweis
    gilt.'
  quelle: or__art-959
  zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann
- text: 'MWST bei Zugängen: Effektive Methode → abziehbare Vorsteuer gehört nicht zu den AK (netto aktivieren); Saldosteuersatzmethode → brutto aktivieren (HWP BuR Rz 360). Abrechnungsmethode
    mit M2 abstimmen, bevor eine Bruttoaktivierung als Fehler gemeldet wird.'
  quelle: hwp-bur-2023__rz-0356-s148
  zitat: bei Investitionen und übrigem Betriebsaufwand bezahlte Vorsteuer ist – sofern sie vom Vorsteuerabzug nicht ausgeschlossen ist – rückforderbar
- text: 'Verkauf von Anlagen durch eine steuerpflichtige Gesellschaft ist grundsätzlich steuerbar (Art. 18 Abs. 1 MWSTG), ausser bei einer Ausnahme nach Art. 21 Abs. 2 MWSTG (z.B. Ziff.
    24: gebrauchte Gegenstände, die ausschliesslich für ausgenommene Leistungen verwendet wurden ^[mwstg__art-21-t9]). Nutzungsänderung oder Privatentnahme: Eigenverbrauch (Art. 31 MWSTG
    ^[mwstg__art-31-t1]) bzw. Einlageentsteuerung ^[hwp-bur-2023__rz-0372-s152]. Vermerk «ohne MWST» → Hinweis an M2; Beurteilung M2/WP.'
  quelle: mwstg__art-18-t1
  zitat: Der Inlandsteuer unterliegen die im Inland durch steuerpflichtige Personen gegen Entgelt erbrachten Leistungen; sie sind steuerbar, soweit dieses Gesetz keine Ausnahme vorsieht.
- text: 'Praxis/intern: Anlagespiegel kann immaterielle Werte (Konten 17xx) enthalten; für G1 nur Konten 1500–1549 abstimmen, immaterielle Werte in I1, Liegenschaften in G2.'
- text: Abschreibungsbuchungen müssen in der Erfolgsrechnung unter der richtigen Position (Abschreibungen auf Anlagevermögen) und Gruppierung ausgewiesen sein; Saldo Abschreibungskonto
    mit Ausweis in der Jahresrechnung abgleichen. Bei Absatzerfolgsrechnung gehören sie in den Anhang.
  quelle: or__art-959b-t1
  zitat: Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens
- text: WP-gekennzeichnete Schritte (303–306) bereitet der Agent nur auf ausdrückliche Anweisung des WP vor (offener Entscheid consis ^[konzept-ki-revisionsagent-2026__c012-1]) und schlägt
    sie dem WP nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko vor; Visum, Abschluss und Buchungen bleiben beim Menschen.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: '4xx-Schritte G1-401 bis G1-407: nur auf ausdrückliche Anweisung des WP (Konzept). G1-403 gehört zum Pflichtenheft-Beispiel «G1 Einkaufsfakturen» (Hauptschritt G1-305, WP ^[konzept-ki-revisionsagent-2026__c013-1])
    und wird bei Anweisung zusammen mit G1-305 vorbereitet. Ob 403–407 künftig ohne Anweisung laufen, entscheidet consis – nicht selbst entscheiden.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
fragen_kunde:
- frage: Nach welchen Grundsätzen werden die mobilen Sachanlagen bewertet (Anschaffungskosten, Aktivierungsgrenze), welche Abschreibungsmethode (direkt/indirekt, linear/degressiv) und
    welche Sätze bzw. Nutzungsdauern gelten je Kategorie?
  zweck: G1-101 (BE, PA, DO)
- frage: 'Wurden Abschreibungsmethode, Sätze oder Nutzungsdauern gegenüber dem Vorjahr geändert? Falls ja: weshalb, und ist dies im Anhang erläutert?'
  zweck: G1-107 (Stetigkeit, Anhang)
- frage: Wie grenzen Sie Unterhalt und Reparaturen von wertvermehrenden Investitionen ab, und wurden 2025 Anschaffungen mit mehrjähriger Nutzung direkt dem Aufwand belastet?
  zweck: G1-103, G1-403, G1-406
- frage: Welche Anlagen wurden 2025 angeschafft, verkauft, verschrottet oder entsorgt (Datum, Erlös), und wie wurden Erlös sowie Buchgewinn/-verlust verbucht?
  zweck: G1-104 (PA), G1-403
- frage: Gibt es Anlagen, die stillgelegt, beschädigt, technisch überholt, nicht mehr genutzt oder innert 12 Monaten zum Verkauf vorgesehen sind?
  zweck: G1-105, G1-404 (Wertbeeinträchtigung, Ausweis im Umlaufvermögen)
- frage: Bestehen Leasing- oder Mietkaufverträge, Eigentumsvorbehalte, Verpfändungen oder Sicherungsübereignungen an Anlagen, oder wurden Anlagen auf den Namen von Organen/Aktionären
    erworben?
  zweck: G1-106 (RV, DO), G1-320
- frage: Wurden 2025 zusätzliche Abschreibungen (stille Reserven) gebildet oder aufgelöst, und wie wird der Bestand der stillen Reserven auf Sachanlagen ermittelt (Vergleichswert, Methode
    wie Vorjahr)?
  zweck: G1-321, G1-407
- frage: Wann wurde der physische Anlagenbestand zuletzt mit dem Anlagenverzeichnis abgeglichen (Anlageninventur), und gibt es nicht auffindbare Objekte?
  zweck: G1-402 (nur auf Anweisung), G1-306
