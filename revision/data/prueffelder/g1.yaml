- id: G1-301
  vorgehen: Bilanzwerte Sachanlagen (AW und WB je Kategorie, Total) aus der Jahresrechnung mit Saldoliste/Hauptbuch und Anlagespiegel abstimmen; Anlagespiegel je Kategorie zeilenweise
    nachrechnen (AW und WB getrennt) und Abschreibung LJ mit Konten 68xx und ER abstimmen; Eröffnungssaldi mit Vorjahresabschluss vergleichen; Ausweis (Sachanlagen gesondert im Anlagevermögen,
    WB als Minusposten) prüfen. Differenzen mit Konto, Betrag und Ursache im Textfeld; fehlender Anlagespiegel → Pendenz. AW/WB 01.01. nur aus Vorjahresunterlagen übernehmen (VJ-Anlagespiegel,
    VJ-Jahresrechnung, Saldoliste VJ-Spalte; die VJ-Akte kann anders gegliedert sein – suchen statt Pfad raten); nicht gefunden → Pendenz, nie schätzen oder einsetzen.
  nachweise:
  - Jahresrechnung 2025 (Bilanz)
  - Saldoliste
  - Hauptbuch Konten 1500–1549
  - Anlagespiegel
  rechnen: 'Je Kategorie (nur 1500–1549; Zeilen 17xx gehören zu I1): AW 01.01. + Zugänge − Abgänge = AW 31.12. = Saldo 15x0; WB 01.01. + Abschreibung LJ − WB auf Abgängen = WB 31.12.
    = Saldo 15x9; Abschreibung LJ = Saldo zugehöriges Abschreibungskonto 68xx. Σ (AW − WB) = Total Sachanlagen Bilanz. Σ aller Abschreibungskonten 68xx (inkl. I1/G2) = Position Abschreibungen
    ER bzw. Anhang (Absatzerfolgsrechnung). AW/WB 01.01. = Vorjahr 31.12. Alles mit `rechne`.'
  feststellung_wenn: Differenz zwischen Bilanz, Hauptbuch und Anlagespiegel über der Nicht-Aufgriffsgrenze, Eröffnungsdifferenz zum Vorjahr oder Abschreibung LJ laut Anlagespiegel ≠
    Saldo 68xx bzw. Σ 68xx ≠ Ausweis ER; fehlende Kontoblätter 68xx → Pendenz.
  fundstellen:
