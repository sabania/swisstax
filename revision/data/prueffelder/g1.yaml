- dokument: Einkaufsrechnungen der Zugänge; Kauf-, Verkaufs- und Entsorgungsbelege der Abgänge
  zweck: Aktivierungsfähigkeit (G1-403), Abgänge (G1-104); Belegprüfung Bestand/Rechte (G1-305, nur auf ausdrückliche Anweisung des WP)
  quelle: ser-2022__anh-d-s083-1
  zitat: Durchsicht von Einkaufsfakturen, Leasing- und anderen Verträgen sowie weiteren
- dokument: Leasing- und Mietkaufverträge, Kaufverträge mit Eigentumsvorbehalt
  zweck: Eigentum/Rechte (G1-106), Anhangangabe Leasing (G1-320)
