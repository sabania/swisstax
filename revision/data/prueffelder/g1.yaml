  bezug: 'PBC-Abgleich: welche G-Unterlagen vorliegen; fehlende Unterlagen als Pendenz'
schritte:
- id: G1-101
  vorgehen: 'Agent befragt nicht selbst: schriftliche Antwort (Kundenbefragung 10.11) bzw. Abschreibungsrichtlinie in M-Files suchen, sonst Frage als Pendenz. Antwort mit Anlagenverzeichnis
    (Nutzungsdauern), Anlagespiegel und Vorjahresakte abgleichen (direkt/indirekt, linear/degressiv, Sätze je Kategorie). Im Textfeld Quelle, Antwort, Abgleich und abgedeckte Prüfziele;
    Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Kundenantwort (10.11)
  - Abschreibungsrichtlinie/-plan
  - Anlagenverzeichnis mit Nutzungsdauern
  - Vorjahresakte G1
  rechnen: Implizite Abschreibungsquote je Kategorie = Abschreibung LJ / AW 01.01. (linear) bzw. / Buchwert 01.01. (degressiv); Vergleich mit genannter Methode/Nutzungsdauer
  feststellung_wenn: Angaben fehlen oder widersprechen Anlagenverzeichnis/Vorjahr (Methoden- oder Satzwechsel ohne Begründung/Anhangangabe); keine Antwort → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung über Grundlagen der Bewertung der Anlagen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
  - quelle: ser-2022__6-1-1-t1
    zitat: nicht ausschliesslich auf Befragungen stützen
- id: G1-103
  vorgehen: Schriftliche Antwort zur Abgrenzung Unterhalt/Investition (Aktivierungsgrenze, Kriterium Wertvermehrung) auswerten, sonst Pendenz. Mit Unterhalts-, Reparatur- und GWG-/Hardwarekonten
    (Saldoliste ER, LJ/VJ) und Zugängen im Anlagespiegel plausibilisieren. Grosse Einzelposten auf Aufwandskonten als Kandidaten für G1-406 notieren. Status höchstens «teilweise bearbeitet».
  nachweise:
  - Kundenantwort Abgrenzung Unterhalt/Investition
  - Saldoliste ER (Unterhalt, Reparaturen, GWG)
  - Anlagespiegel Zugänge
  rechnen: 'Unterhalt + Reparaturen + GWG: LJ – VJ (CHF, %); Einzelposten über Toleranzwesentlichkeit auflisten'
  feststellung_wenn: Keine nachvollziehbare Abgrenzungsregel, wesentliche wertvermehrende Beträge im Aufwand oder reiner Unterhalt aktiviert; keine Antwort → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung, wie Unterhaltsaufwendungen von Investitionen (Wertvermehrung) unterschieden werden
  - quelle: hwp-bur-2023__rz-0370-s236
    zitat: Unterhalt und Reparaturen sind in der Regel der Erfolgsrechnung zu belasten.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- id: G1-104
  vorgehen: Schriftliche Angaben zu Anschaffungen, Verkäufen und Entsorgungen 2025 und zur Verbuchung von Erlösen und Buchgewinnen/-verlusten auswerten, sonst Pendenz. Mit Zu-/Abgängen
    im Anlagespiegel, Kontoblättern 15xx, Kauf-/Verkaufsverträgen und Ertrags-/a.o.-Konten abgleichen; Erfassungsdatum gegen Übergang der Verfügungsmacht prüfen. MWST-Behandlung von
    Verkäufen als Hinweis an M2. Status höchstens «teilweise bearbeitet».
  nachweise:
  - Kundenangaben Zu-/Abgänge
  - Anlagespiegel
  - Kauf-/Verkaufsverträge, Entsorgungsbelege
  - Kontoblätter 15xx und Ertragskonten
  rechnen: Buchgewinn/-verlust je Abgang = Erlös – (AW – kumulierte Abschreibungen des Objekts); Σ Abgänge AW = Haben 15x0, Σ WB auf Abgängen = Soll 15x9
  feststellung_wenn: Abgang laut Vertrag/Beleg nicht ausgebucht, Erlös nicht als Buchgewinn/-verlust erfasst oder Zu-/Abgang in falscher Periode; fehlende Angaben → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung über Anschaffung und Verkäufe von Anlagen und über die Erfassung realisierter Gewinne und Verluste aus Abgängen
  - quelle: hwp-bur-2023__rz-0329-s228-t1
    zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
  - quelle: hwp-bur-2023__rz-0329-s228-t1
    zitat: spätestens jedoch im Zeitpunkt des Eigentumsübergangs zu erfassen
  - quelle: hwp-bur-2023__rz-0372-s152
    zitat: Mehrwertsteuerliche Nutzungsänderungen können bei aktivierbaren Gegenständen und Dienstleistungen zu einer Eigenverbrauchsbesteuerung bzw. einer Einlageentsteuerung führen.
  - quelle: mwstg__art-18-t1
    zitat: Der Inlandsteuer unterliegen die im Inland durch steuerpflichtige Personen gegen Entgelt erbrachten Leistungen; sie sind steuerbar, soweit dieses Gesetz keine Ausnahme vorsieht.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- id: G1-105
  vorgehen: Schriftliche Aussage zu stillgelegten, beschädigten, überholten, ungenutzten oder zum Verkauf vorgesehenen Anlagen auswerten, sonst Pendenz. Mit Anlagenverzeichnis (Alter
    vs. Nutzungsdauer), Abgängen und Geschäftslage plausibilisieren. Bei Anzeichen fehlende Vergleichsrechnung Buchwert/erzielbarer Wert als Pendenz (Konto, Datum, Betrag), Kundenpunkt
    als Notiz Schlussbesprechung; Ergebnis als Notiz «Schlussbesprechung» an WP (Vorschlag G1-404). Status höchstens «teilweise bearbeitet».
  nachweise:
  - Kundenantwort Wertbeeinträchtigung
  - Anlagenverzeichnis
  - Jahresrechnung/Anhang (Fortführung)
  rechnen: Restnutzungsdauer je Objekt = Nutzungsdauer – (Stichtag – Anschaffungsdatum); Objekte mit Restwert nach Ablauf der Nutzungsdauer auflisten
  feststellung_wenn: Anzeichen dauerhafter Wertbeeinträchtigung (Stilllegung, Nutzungsende, nachhaltige Verluste) ohne Wertberichtigung; keine Antwort oder Vergleichsrechnung → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: eine wesentliche, dauerhafte Wertbeeinträchtigung aufweisen
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: hwp-bur-2023__rz-0342-s231
    zitat: Der erzielbare Wert ist der höhere von Nutzwert und Netto-Marktwert.
  - quelle: konzept-ki-revisionsagent-2026__c007-1
