# Prüffeld SCH3 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: SCH3
bezeichnung: Übriger betrieblicher Aufwand
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: true
kurzbeschrieb: 'Position nach Art. 959b Abs. 2 Ziff. 5 OR (u.a. Raum-, Unterhalts-, Fahrzeug-, Versicherungs-, Verwaltungs-, IT-, Werbeaufwand). SER Anhang D r): Vorjahresvergleich mit
  Befragung über Gründe wesentlicher Abweichungen (Befragung ist Teil der Analytik); Belegabstimmung, Durchsicht ungewöhnlicher Beträge und neue Rechnung nur weitergehend (WP). Fokus:
  EN, VO, PA, RI (EX bei Detail) sowie Ausweis.'
gesetz:
- thema: 'Mindestgliederung Produktionserfolgsrechnung: übriger betrieblicher Aufwand als eigene Position (Art. 959b Abs. 2 Ziff. 5 OR)'
  quelle: or__art-959b-t1
  zitat: 5. übriger betrieblicher Aufwand;
- thema: 'Absatzerfolgsrechnung: übriger betrieblicher Aufwand funktional verteilt, u.a. auf die Anschaffungs- oder Herstellungskosten der verkauften Produkte und Leistungen (Art. 959b
    Abs. 3 Ziff. 2 OR)'
  quelle: or__art-959b-t1
  zitat: Anschaffungs- oder Herstellungskosten der verkauften Produkte und Leistungen
- thema: 'Absatzerfolgsrechnung: übrige Anteile als Verwaltungs- und Vertriebsaufwand (Art. 959b Abs. 3 Ziff. 3 OR)'
  quelle: or__art-959b-t1
  zitat: Verwaltungsaufwand und Vertriebsaufwand
- thema: Weitere Positionen einzeln ausweisen, wenn für Dritte wesentlich oder branchenüblich (Art. 959b Abs. 5 OR)
  quelle: or__art-959b-t2
  zitat: sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich oder aufgrund der Tätigkeit des Unternehmens üblich ist
- thema: Zeitliche und sachliche Abgrenzung von Aufwand und Ertrag (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erleichterung: Verzicht auf zeitliche Abgrenzung bei Nettoerlösen bzw. Finanzerträgen bis CHF 100''000 (Art. 958b Abs. 2 OR)'
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- thema: Verrechnungsverbot Aufwand/Ertrag (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Vollständigkeit der Rechnungslegung (Art. 958c Abs. 1 Ziff. 2 OR)
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- thema: Stetigkeit von Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Zusätzliche Abschreibungen (stille Reserven) zu Wiederbeschaffungszwecken und zur Sicherung des dauernden Gedeihens zulässig (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Belegnachweis für jede Buchung (Art. 957a Abs. 2 Ziff. 2 und Abs. 3 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: 'Anhang: Aufschlüsselungen und Erläuterungen zu Positionen der Erfolgsrechnung (Art. 959c Abs. 1 Ziff. 2 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: 'Anhang: Restbetrag der Leasingverpflichtungen, sofern nicht innert zwölf Monaten auslaufend oder kündbar (Art. 959c Abs. 2 Ziff. 6 OR); Gleichstellung langfristiger Mietverträge
    erst nach HWP BuR Rz 835 (siehe Risiken)'
  quelle: or__art-959c-t2
  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen
- thema: 'Anhang: Erläuterung ausserordentlicher, einmaliger oder periodenfremder Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
