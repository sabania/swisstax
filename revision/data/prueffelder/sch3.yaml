schritte:
- id: SCH3-101
  vorgehen: Aufwandkonten mit Abweichungen > NAG gegenüber Vorjahr bzw. Erwartung bestimmen und eine schriftliche Frage an die Leitung Finanzen als Pendenz-Entwurf erfassen (Grund, Einmaleffekt,
    Abgrenzung, Umgliederung; Versand durch Mensch). Vorliegende Antworten (z.B. 10.11) auswerten, mit Kontoblättern/Verträgen plausibilisieren; Frage, Antwort, Datum, Würdigung im Textfeld.
    Katalogtext = Befragung SER Anhang D q)/t); in r) Teil des Vorjahresvergleichs.
  nachweise:
  - Saldoliste Erfolgsrechnung X/X-1
  - Schriftliche Antwort der Unternehmensleitung
  - Kontoblätter der betroffenen Aufwandkonten
  - Verträge zu wesentlichen Aufwandarten
  rechnen: 'Je Konto: Abweichung = Saldo X – Saldo X-1 (absolut und %); in die Frageliste, wenn |Abweichung| > Nicht-Aufgriffsgrenze (3.3) oder qualitativer Faktor (Nahestehende, Privataufwand);
    Würdigung gegen tolerierbare Abweichung (Vorgabe WP aus Toleranzwesentlichkeit)'
  feststellung_wenn: Antwort fehlt (Pendenz), ist unplausibel oder widerspricht Buchhaltung/Verträgen, oder deutet auf fehlende Abgrenzung, Fehlbuchung oder nicht geschäftsmässigen Aufwand
    über der tolerierbaren Abweichung.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Diskrepanzen zwischen den erhaltenen Antworten und seinen Kenntnissen über das Unternehmen geht der Abschlussprüfer nach.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- id: SCH3-201
  vorgehen: 'Salden der SCH3 zugeordneten Konten X und X-1 aus der Saldoliste im Rechenmodul vergleichen (je Konto und Total, absolut und %) und das Total mit der Position der Jahresrechnung
    abstimmen. Abweichungen > NAG markieren und Gründe aus SCH3-101 übernehmen bzw. als Frage erfassen. Im Textfeld: Tabelle Konto, X, X-1, Differenz, %, Erklärung, Würdigung gegen die
    tolerierbare Abweichung.'
  nachweise:
  - Saldoliste Erfolgsrechnung X/X-1
  - Jahresrechnung (Erfolgsrechnung)
  - Schriftliche Erläuterungen zu Abweichungen
  rechnen: 'Δ = Saldo X – Saldo X-1 und Δ% je Konto; Summe der Konten gemäss Zuordnung SCH3 (Testakte: 6000–6790; Abschreibungen 68xx und Finanzerfolg 69xx gehören nicht dazu) = Position
    «Übriger betrieblicher Aufwand» der Jahresrechnung (X und X-1); markieren, wenn |Δ| > Nicht-Aufgriffsgrenze; Würdigung gegen tolerierbare Abweichung'
  feststellung_wenn: Kontensumme ≠ Ausweis in der Jahresrechnung oder Abweichung über der tolerierbaren Abweichung ohne plausible Erklärung bzw. mit Hinweis auf Fehlaussage (Abgrenzung,
    Fehlklassierung); bei qualitativen Faktoren kleiner.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: ser-2022__6-1-2-t3
    zitat: Analytische Prüfungshandlungen liefern bei der Prüfung der Erfolgsrechnung wertvolle Prüfungsnachweise.
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: aufgrund der an anderer Stelle definierten Toleranzwesentlichkeit und aufgrund der Erfahrung des Abschlussprüfers
- id: SCH3-202
  vorgehen: 'a) Saldovergleich aus SCH3-201 übernehmen; b) Konten analytisch auf Saldo- und Verlaufsauffälligkeiten durchsehen (Konten-/Monatsebene: Sprünge, Vorzeichenwechsel, neue/weggefallene
    Konten), fehlende Kontoblätter als Pendenz; c) Budgetvergleich, falls vorhanden, Verlässlichkeit würdigen; d) Erwartungswerte aus Verträgen (Miete, Prämien, Lizenzen). Ursache je
    signifikanter Änderung im Textfeld umschreiben; Einzelbuchungen erst in 303/301 (WP).'
  nachweise:
  - Saldoliste X/X-1
  - Kontoblätter Aufwandkonten (Monatsverkehrszahlen)
  - Budget/Forecast
  - Miet-, Versicherungs-, Leasing- und Lizenzverträge
  - Listen aktive/passive Rechnungsabgrenzungen
  rechnen: Δ Budget = Ist – Budget je Konto; Erwartungswert z.B. Raumaufwand = (Nettomiete + Nebenkosten-Akonto) mtl. × 12 ± Abgrenzungen; Δ bzw. Ist – Erwartung > Nicht-Aufgriffsgrenze
    erfassen; Würdigung gegen tolerierbare Abweichung (Vorgabe WP aus Toleranzwesentlichkeit 3.3)
  feststellung_wenn: Ursache einer signifikanten Änderung nicht feststellbar oder Differenz Ist – Erwartung über der tolerierbaren Abweichung ohne plausible Erklärung (qualitative Faktoren
    auch kleiner); fehlendes Budget nur dokumentieren.
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Budgetvergleiche → je nach Betriebsgrösse unterschiedlich häufig anzutreffende Prüfungshandlung
  - quelle: ser-2022__6-1-2-t1
    zitat: voraussichtlichen Ergebnissen des Unternehmens wie etwa Budgets, Prognosen oder diesbezüglichen Erwartungen des Abschlussprüfers
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: aufgrund der an anderer Stelle definierten Toleranzwesentlichkeit und aufgrund der Erfahrung des Abschlussprüfers
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: die Höhe der Differenzen zwischen den ausgewiesenen Beträgen und den erwarteten Werten, die für den Abschlussprüfer als noch vertretbar gelten können
  - quelle: hwp-er-2026__rz-0030-s183
    zitat: Zudem können analytische Prüfungshandlungen bei der Identifikation ungewöhnlicher Geschäftsvorfälle, Buchungen, Beträge oder Trends hilfreich sein.
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: Wenn erfasst, meldet der Agent auch kleinere Abweichungen.
- id: SCH3-301
  vorgehen: 'Weitergehend, nur bei Hinweisen aus 101–202 oder erhöhtem Risiko (WP-Entscheid): wesentliche bzw. auffällige Posten bewusst auswählen und mit Eingangsrechnung, Vertrag oder
    Abrechnung in M-Files abstimmen (Betrag, Leistungsperiode, Empfänger, Kontierung, geschäftlicher Zusammenhang, Doppelerfassung); Visierung des Kunden nur als Einzelnachweis. Im Textfeld:
    Auswahlbegründung und Liste Beleg, Betrag, Ergebnis.'
  nachweise:
  - Kontoblätter Aufwandkonten
  - Eingangsrechnungen und Abrechnungen
  - Verträge (Miete, Versicherung, Leasing, Lizenzen)
  - Spesenabrechnungen
  - Zahlungsbelege
  rechnen: 'Je Posten: Betrag Buchung = Betrag Beleg (netto, MWST beachten); Abdeckung = Summe geprüfte Posten / Saldo Konto'
  feststellung_wenn: Beleg fehlt (Pendenz), Betrag, Periode oder Kontierung weicht ab, Doppelerfassung oder Leistung ohne geschäftlichen Zusammenhang (z.B. Privataufwand Nahestehender);
    Fehler > Nicht-Aufgriffsgrenze erfassen.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s094-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: ob die Grunderfassung dem Beleg entspricht, und zwar hinsichtlich der Übereinstimmung von Beleginhalt und Buchung
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Dennoch kann mit der Prüfung der Visierung ggf. das Prüfungsziel «Verpflichtungen» geprüft werden
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- id: SCH3-302
  vorgehen: 'Weitergehend (WP): Kreditorenjournal, Kontoblätter und Eingangsrechnungen der ersten Monate X+1 sowie noch nicht verbuchte Eingangsrechnungen per Prüfungsdatum auf Leistungen
    des Berichtsjahres durchsehen und mit Kreditoren-OP-Liste und passiven Abgrenzungen per 31.12. abgleichen; umgekehrt im Jahr X gebuchte Aufwände für X+1 mit den aktiven Abgrenzungen.
    Im Textfeld: Beleg, Leistungsperiode, erfasst ja/nein, Betrag.'
  nachweise:
  - Kreditorenjournal und Kontoblätter Folgejahr
  - Eingangsrechnungen Folgejahr
  - 'Noch nicht verbuchte Eingangsrechnungen per Prüfungsdatum (fehlt in Testakte: Pendenz)'
  - Kreditoren-OP-Liste 31.12.
  - Listen aktive/passive Rechnungsabgrenzungen 31.12.
  rechnen: Summe Folgejahresrechnungen (verbucht und noch nicht verbucht) mit Leistung im Jahr X, weder in OP-Liste noch in passiven Abgrenzungen = nicht erfasster Aufwand; Summe im
    Jahr X gebuchter Aufwände für X+1 ohne aktive Abgrenzung = zu viel erfasster Aufwand
  feststellung_wenn: Aufwand des Berichtsjahres weder als Kreditor noch passiv abgegrenzt oder Folgejahresaufwand im Berichtsjahr belastet, in Summe über der NAG; fehlende Folgejahresunterlagen
    bzw. nicht verbuchte Rechnungen als Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht von Konten und/oder Belegen in neuer Rechnung auf Positionen, die das Berichtsjahr betreffen
  - quelle: ser-2022__anh-d-s084-2
    zitat: Durchsicht der in neuer Rechnung verbuchten bzw. noch nicht verbuchten Kreditorenrechnungen
  - quelle: ser-2022__6-1-3
    zitat: Durchsicht von Belegen in neuer Rechnung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0257-s215
    zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
  - quelle: hwp-bur-2023__rz-0256-s215
    zitat: 'Transitorische Aktiven: Ausgaben im alten Jahr, die als Aufwand dem neuen Rech nungsjahr zu belasten sind.'
- id: SCH3-303
  vorgehen: 'Weitergehend (WP-Entscheid): Kontoblätter der Aufwandkonten nach Einzelbuchungen filtern (hohe, runde, Haben-, Abschluss- und manuelle Buchungen, Zahlungen an Nahestehende,
    Unterhalt/GWG mit Investitionscharakter); fehlen Aufwand-Kontoblätter, Gegenkontenanalyse über Geld- und Kreditorenkonten. Treffer an SCH3-301 oder als Frage. Investitionen im Aufwand
    als stille Reserve festhalten. Im Textfeld: Kriterien, Treffer, Erklärung.'
  nachweise:
  - Kontoblätter Aufwandkonten
  - Hauptbuch Gegenkonten (Geld, Kreditoren, Abgrenzungen)
  - Anlagespiegel/Aktivierungen des Jahres
  - Liste Nahestehende/Organe
  - Belege zu Treffern
  rechnen: 'Filter: Einzelbuchungen ≥ Nicht-Aufgriffsgrenze; Haben-Buchungen auf Aufwandkonten; runde Beträge; Buchungen der letzten Dezembertage und Abschlussbuchungen; Gegenbuchungen
    6xxx in Geldkonten; Summe Treffer je Konto'
  feststellung_wenn: Ungewöhnlicher Posten ohne Erklärung/Beleg, nicht geschäftsmässiger Aufwand, aktivierter Unterhalt, unbegründet geänderte Aktivierung, falsche Periode oder Fehlklassierung
    über NAG; Investition im Aufwand nur notieren.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht der Konten auf hohe oder ungewöhnliche Beträge
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Durchsicht der Geldkonten auf ungewöhnliche Buchungen
  - quelle: hwp-bur-2023__rz-0680-s299
    zitat: geschäftsmässig nicht begründete Aufwendungen (Privataufwendungen)
  - quelle: hwp-bur-2023__rz-0370-s236
    zitat: Unterhalt und Reparaturen sind in der Regel der Erfolgsrechnung zu belasten.
  - quelle: hwp-bur-2023__rz-0370-s236
    zitat: Wertvermehrende Investitionen in bestehende Sachanlagen, die den Nutzwert bzw. Netto-Marktwert nachhaltig erhöhen oder die Lebensdauer wesentlich verlängern, können aktiviert
      werden.
  - quelle: or__art-960a
    zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
