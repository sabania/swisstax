# Prüffeld SCH3 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: SCH3
bezeichnung: Übriger betrieblicher Aufwand
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: false
kurzbeschrieb: 'Position nach Art. 959b Abs. 2 Ziff. 5 OR (u.a. Raum-, Unterhalts-, Fahrzeug-, Versicherungs-, Energie-, Verwaltungs-, IT- und Werbeaufwand). Eingeschränkte Revision:
  Vorjahres-/Budgetvergleich mit Befragung zu wesentlichen Abweichungen; Detailprüfungen (Belege, ungewöhnliche Beträge, neue Rechnung) nur weitergehend. Fokus: Eintritt, Vollständigkeit,
  Periodenabgrenzung, Ausweis.'
gesetz:
- thema: 'Mindestgliederung Produktionserfolgsrechnung: übriger betrieblicher Aufwand als eigene Position (Art. 959b Abs. 2 Ziff. 5 OR)'
  quelle: or__art-959b-t1
  zitat: 5. übriger betrieblicher Aufwand;
- thema: 'Absatzerfolgsrechnung: Ausweis als Verwaltungs- und Vertriebsaufwand (Art. 959b Abs. 3 Ziff. 3 OR)'
  quelle: or__art-959b-t1
  zitat: Verwaltungsaufwand und Vertriebsaufwand
- thema: Weitere Positionen einzeln ausweisen, wenn für Dritte wesentlich oder branchenüblich (Art. 959b Abs. 5 OR)
  quelle: or__art-959b-t2
  zitat: sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich oder aufgrund der Tätigkeit des Unternehmens üblich ist
- thema: Zeitliche und sachliche Abgrenzung von Aufwand und Ertrag (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erleichterung: Verzicht auf zeitliche Abgrenzung bei Nettoerlösen bzw. Finanzerträgen bis CHF 100''000 (Art. 958b Abs. 2 OR)'
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- thema: Verrechnungsverbot Aufwand/Ertrag (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Vollständigkeit der Rechnungslegung (Art. 958c Abs. 1 Ziff. 2 OR)
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- thema: Stetigkeit von Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Belegnachweis für jede Buchung (Art. 957a Abs. 2 Ziff. 2 und Abs. 3 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: 'Anhang: Aufschlüsselungen und Erläuterungen zu Positionen der Erfolgsrechnung (Art. 959c Abs. 1 Ziff. 2 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: 'Anhang: Restbetrag Leasing-/langfristige Mietverpflichtungen, sofern nicht innert zwölf Monaten auslaufend oder kündbar (Art. 959c Abs. 2 Ziff. 6 OR)'
  quelle: or__art-959c-t2
  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen
- thema: 'Anhang: Erläuterung ausserordentlicher, einmaliger oder periodenfremder Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: Aufwand ohne geschäftlichen Zusammenhang erfasst (Privataufwand von Aktionären/Organen, Leistungen an Nahestehende nicht zu Drittbedingungen, überhöhte Honorare/Spesen).
  pruefziele:
  - EN
  - RI
  quelle: hwp-bur-2023__rz-0680-s299
  zitat: geschäftsmässig nicht begründete Aufwendungen (Privataufwendungen)
- text: Verdeckte Gewinnausschüttung über zu hohe Aufwendungen an Gesellschafter oder Nahestehende.
  pruefziele:
  - EN
  - RI
  - DO
  quelle: hwp-er-2026__rz-0163-s212
  zitat: hierbei enthält die Erfolgsrechnung zu hohe Aufwendungen und/oder zu geringe Erträge
- text: 'Unvollständige Erfassung: Leistungen des Berichtsjahres (z.B. Strom, Telefon, Treuhand, Revisionshonorar, Nebenkostenabrechnung) weder als Kreditor noch als passive Abgrenzung
    erfasst.'
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
- text: Vorauszahlungen für das Folgejahr (Miete, Versicherungsprämien, Lizenzen, Beiträge) im Aufwand statt aktiv abgegrenzt.
  pruefziele:
  - PA
  - EN
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: vorausbezahlte Miet- und Pachtzinsen, Versicherungsprämien, Steuern, Beiträge
- text: Wertvermehrende Investitionen als Unterhalt, Reparatur oder GWG im Aufwand (bzw. Aufwand aktiviert); Verzerrung von Aufwand und Anlagevermögen.
  pruefziele:
  - RI
  - DO
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Unterhalt und Reparaturen sind in der Regel der Erfolgsrechnung zu belasten.
- text: Betriebliche Aufwände als ausserordentlich, einmalig, periodenfremd oder betriebsfremd ausgewiesen, um ein besseres Betriebsergebnis zu zeigen (oder umgekehrt).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Erfahrungsgemäss besteht eine gewisse Versuchung, Aufwendungen möglichst dem ausserordentlichen
- text: Verrechnung von Aufwand mit Ertrag (z.B. Untermiet- oder Weiterverrechnungserträge, Rückerstattungen) statt Bruttoausweis.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0067-s071
  zitat: Das Verbot der Verrechnung von Aufwand und Ertrag bezieht sich auch auf artgleiche Aufwendungen und Erträge und auf solche mit engem kausalem Zusammenhang.
- text: Übriger betrieblicher Aufwand als grosser, nichtssagender Sammelposten ohne erforderliche Aufgliederung.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0798-s329
  zitat: Würden alle nach Gesetz nicht gesondert auszuweisenden Aufwendungen dem übrigen (betrieblichen) Aufwand zugerechnet
- text: Aufwand oder Korrekturen früherer Perioden unter Umgehung der Erfolgsrechnung direkt über Bilanz- oder Eigenkapitalkonten gebucht.
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0741-s313-t1
  zitat: Aufwendungen, Erträge und ggf. Fehler, die eine frühere Periode betreffen (aber erst in der laufenden erkannt werden), über den Bilanzgewinn oder -verlust zu korrigieren
- text: Doppelt erfasste Eingangsrechnungen oder falsch übertragene Beträge (Betrag, Währung, MWST).
  pruefziele:
  - EX
  - RI
  quelle: hwp-er-2026__rz-0115-s200
  zitat: der richtigen Übertragung von Summe und Währung und der Verhinderung der mehrfachen Erfassung von Belegen
- text: Analytik verfehlt Fehler, weil sich Fehlaussagen kompensieren oder stille Reserven die Werte beeinflussen.
  pruefziele:
  - RI
  - VO
  quelle: ser-2022__6-1-2-t3
  zitat: Zudem besteht das Risiko, dass sich zwei oder mehrere Fehlaussagen teilweise kompensieren können und deshalb bei analytischen Prüfungen nicht erkannt werden.
- text: Langfristige Miet- und Leasingverpflichtungen nicht oder unvollständig im Anhang offengelegt.
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0835-s346
  zitat: Langfristige Mietverträge sind wirtschaftlich den Leasingverbindlichkeiten im engeren Sinne gleichzusetzen.
