schritte:
- id: SCH3-101
  vorgehen: Aus der Kontenübersicht (Rechenmodul) die Aufwandkonten mit wesentlichen Abweichungen gegenüber Vorjahr bzw. Erwartung bestimmen und daraus eine schriftliche Frage an die
    Leitung Finanzen als Pendenz erfassen (Grund, Einmaleffekt, Abgrenzung, Umgliederung). Vorliegende schriftliche Antworten (z.B. 10.11 Kundenbefragung) auswerten, mit Kontoblättern
    und Verträgen plausibilisieren und Frage, Antwort, Datum und Würdigung im Textfeld festhalten.
  nachweise:
  - Saldoliste Erfolgsrechnung X/X-1
  - Schriftliche Antwort der Unternehmensleitung
  - Kontoblätter der betroffenen Aufwandkonten
  - Verträge zu wesentlichen Aufwandarten
  rechnen: 'Je Konto: Abweichung = Saldo X – Saldo X-1 (absolut und %); in die Frageliste, wenn |Abweichung| > Nicht-Aufgriffsgrenze aus 3.3'
  feststellung_wenn: Antwort fehlt (Pendenz), ist unplausibel oder widerspricht Buchhaltung/Verträgen, oder die Erklärung deutet auf fehlende Abgrenzung, Fehlbuchung oder nicht geschäftsmässigen
    Aufwand über der Nicht-Aufgriffsgrenze.
  fundstellen:
  - quelle: ser-2022__anh-d-s093-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__anh-d-s094-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Diskrepanzen zwischen den erhaltenen Antworten und seinen Kenntnissen über das Unternehmen geht der Abschlussprüfer nach.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: SCH3-201
  vorgehen: 'Salden der SCH3 zugeordneten Konten X und X-1 aus der Saldoliste im Rechenmodul vergleichen (je Konto und Total, absolut und %) und das Total mit der Position der Jahresrechnung
    abstimmen. Wesentliche Abweichungen markieren und die Gründe aus SCH3-101 übernehmen bzw. als Frage erfassen. Im Textfeld: Tabelle Konto, X, X-1, Differenz, %, Erklärung, Würdigung.'
  nachweise:
  - Saldoliste Erfolgsrechnung X/X-1
  - Jahresrechnung (Erfolgsrechnung)
  - Schriftliche Erläuterungen zu Abweichungen
  rechnen: Δ = Saldo X – Saldo X-1 und Δ% je Konto; Summe der SCH3-Konten (z.B. 6000–6799 ohne 68xx) = Position «Übriger betrieblicher Aufwand» der Jahresrechnung (X und X-1); markieren,
    wenn |Δ| > Nicht-Aufgriffsgrenze
  feststellung_wenn: Summe der Konten ≠ Ausweis in der Jahresrechnung, oder wesentliche Abweichung ohne plausible Erklärung bzw. mit Hinweis auf Fehlaussage (Abgrenzung, Fehlklassierung)
    über der Nicht-Aufgriffsgrenze.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: ser-2022__6-1-2-t3
    zitat: Analytische Prüfungshandlungen liefern bei der Prüfung der Erfolgsrechnung wertvolle Prüfungsnachweise.
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
- id: SCH3-202
  vorgehen: a) Saldovergleich aus SCH3-201 übernehmen; b) Kontoblätter auf hohe oder ungewöhnliche Einzelbuchungen durchsehen (runde Beträge, Gutschriften, Storni, Abschlussbuchungen);
    c) Ist mit Budget/Forecast vergleichen, falls vorhanden, und dessen Verlässlichkeit würdigen; d) Erwartungswerte aus Verträgen bilden (z.B. Miete, Prämien, Lizenzen). Ursache jeder
    signifikanten Änderung im Textfeld umschreiben.
  nachweise:
  - Saldoliste X/X-1
  - Kontoblätter Aufwandkonten
  - Budget/Forecast
  - Miet-, Versicherungs-, Leasing- und Lizenzverträge
  - Listen aktive/passive Rechnungsabgrenzungen
  rechnen: Δ Budget = Ist – Budget je Konto; Erwartungswert z.B. Raumaufwand = (Nettomiete + Nebenkosten-Akonto) × 12 ± Abgrenzungen; Differenz Ist – Erwartung gegen tolerierbare Abweichung
    (aus Wesentlichkeit 3.3)
  feststellung_wenn: Ursache einer signifikanten Änderung nicht feststellbar, Differenz Ist – Erwartung über tolerierbarer Abweichung oder ungewöhnliche Buchung ohne Erklärung; fehlendes
    Budget nur dokumentieren.
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Budgetvergleiche → je nach Betriebsgrösse unterschiedlich häufig anzutreffende Prüfungshandlung
  - quelle: ser-2022__6-1-2-t1
    zitat: voraussichtlichen Ergebnissen des Unternehmens wie etwa Budgets, Prognosen oder diesbezüglichen Erwartungen des Abschlussprüfers
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: die Höhe der Differenzen zwischen den ausgewiesenen Beträgen und den erwarteten Werten, die für den Abschlussprüfer als noch vertretbar gelten können
  - quelle: hwp-er-2026__rz-0030-s183
    zitat: Zudem können analytische Prüfungshandlungen bei der Identifikation ungewöhnlicher Geschäftsvorfälle, Buchungen, Beträge oder Trends hilfreich sein.
- id: SCH3-301
  vorgehen: 'Weitergehend, nur bei Hinweisen aus 101–202 oder erhöhtem Risiko (WP-Entscheid): wesentliche bzw. auffällige Posten bewusst auswählen und mit Eingangsrechnung, Vertrag oder
    Abrechnung in M-Files abstimmen (Betrag, Leistungsperiode, Empfänger, Kontierung, geschäftlicher Zusammenhang, Doppelerfassung). Im Textfeld: Auswahlbegründung und Liste Beleg, Betrag,
    Ergebnis.'
  nachweise:
  - Kontoblätter Aufwandkonten
  - Eingangsrechnungen und Abrechnungen
  - Verträge (Miete, Versicherung, Leasing, Lizenzen)
  - Spesenabrechnungen
  - Zahlungsbelege
  rechnen: 'Je Posten: Betrag Buchung = Betrag Beleg (netto, MWST beachten); Abdeckung = Summe geprüfte Posten / Saldo Konto'
  feststellung_wenn: Beleg fehlt (Pendenz), Betrag, Periode oder Kontierung weicht ab, Doppelerfassung, oder Leistung nicht an die Gesellschaft bzw. ohne geschäftlichen Zusammenhang
    (z.B. Privataufwand Nahestehender).
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s096-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und anderen geeigneten Unterlagen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: ob die Grunderfassung dem Beleg entspricht, und zwar hinsichtlich der Übereinstimmung von Beleginhalt und Buchung
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- id: SCH3-302
  vorgehen: 'Weitergehend (WP): Kreditorenjournal, Kontoblätter und Eingangsrechnungen der ersten Monate X+1 auf Rechnungen mit Leistung im Berichtsjahr durchsehen (Datum, Text, Aufwandkonto)
    und mit Kreditoren-OP-Liste und passiven Abgrenzungen per 31.12. abgleichen; umgekehrt im Jahr X bezahlte Aufwände für X+1 mit den aktiven Abgrenzungen. Im Textfeld: Beleg, Leistungsperiode,
    erfasst ja/nein, Betrag.'
  nachweise:
  - Kreditorenjournal und Kontoblätter Folgejahr
  - Eingangsrechnungen Folgejahr
  - Kreditoren-OP-Liste 31.12.
  - Listen aktive/passive Rechnungsabgrenzungen 31.12.
  rechnen: Summe Folgejahresrechnungen mit Leistung im Jahr X, weder in OP-Liste noch in passiven Abgrenzungen = nicht erfasster Aufwand; Summe im Jahr X gebuchter Aufwände für X+1 ohne
    aktive Abgrenzung = zu viel erfasster Aufwand
  feststellung_wenn: Aufwand des Berichtsjahres weder als Kreditor noch als passive Abgrenzung erfasst oder Folgejahresaufwand im Berichtsjahr belastet, in Summe über Nicht-Aufgriffsgrenze;
    fehlende Folgejahresunterlagen als Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht von Konten und/oder Belegen in neuer Rechnung auf Positionen, die das Berichtsjahr betreffen
  - quelle: ser-2022__6-1-3
    zitat: Durchsicht von Belegen in neuer Rechnung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0257-s215
    zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
  - quelle: hwp-bur-2023__rz-0256-s215
    zitat: 'Transitorische Aktiven: Ausgaben im alten Jahr, die als Aufwand dem neuen Rech nungsjahr zu belasten sind.'
- id: SCH3-303
  vorgehen: 'Weitergehend (WP): Kontoblätter der Aufwandkonten (bei Sammelbuchungen auch Gegenbuchungen in Geld- und Kreditorenkonten) auf hohe, runde oder ungewöhnliche Beträge, Haben-Buchungen,
    Abschluss- und manuelle Buchungen, Zahlungen an Nahestehende und mögliche Investitionen (Unterhalt, GWG) durchsehen. Treffer an SCH3-301 oder als Frage weiterleiten. Im Textfeld:
    Kriterien, Treffer, Erklärung.'
  nachweise:
  - Kontoblätter Aufwandkonten
  - Hauptbuch Gegenkonten (Geld, Kreditoren, Abgrenzungen)
  - Liste Nahestehende/Organe
  - Belege zu Treffern
  rechnen: 'Filter: Einzelbuchungen ≥ Nicht-Aufgriffsgrenze; Haben-Buchungen auf Aufwandkonten; runde Beträge; Buchungen der letzten Dezembertage und Abschlussbuchungen; Summe Treffer
    je Konto'
  feststellung_wenn: Ungewöhnlicher Posten ohne plausible Erklärung oder Beleg, Hinweis auf nicht geschäftsmässig begründeten Aufwand, aktivierungspflichtige Investition, falsche Periode
    oder Fehlklassierung über Nicht-Aufgriffsgrenze.
  fundstellen:
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht der Konten auf hohe oder ungewöhnliche Beträge
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
  - quelle: hwp-bur-2023__rz-0680-s299
    zitat: geschäftsmässig nicht begründete Aufwendungen (Privataufwendungen)
  - quelle: hwp-bur-2023__rz-0370-s236
    zitat: Unterhalt und Reparaturen sind in der Regel der Erfolgsrechnung zu belasten.
