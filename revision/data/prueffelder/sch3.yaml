bewertung:
- regel: In der Produktionserfolgsrechnung ist der übrige betriebliche Aufwand als eigene Position in der gesetzlichen Reihenfolge auszuweisen.
  quelle: or__art-959b-t1
  zitat: In der Produktionserfolgsrechnung (Gesamtkostenverfahren) müssen mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- regel: Die Mindestgliederung genügt oft nicht; wesentliche Aufwandarten sind gesondert auszuweisen bzw. aufzugliedern (Klarheit, Wesentlichkeit).
  quelle: hwp-bur-2023__rz-0798-s329
  zitat: Vielfach genügen demnach die Vorschriften der Mindestgliederung nicht, um den Anforderungen der Klarheit, Verständlichkeit und Wesentlichkeit in der Rechnungslegung nachzukommen.
- regel: Ausgaben im Berichtsjahr für Aufwand des Folgejahres sind als transitorische Aktiven abzugrenzen.
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: 'Transitorische Aktiven: Ausgaben im alten Jahr, die als Aufwand dem neuen Rech nungsjahr zu belasten sind.'
- regel: Aufwand des Berichtsjahres, der erst im Folgejahr bezahlt wird, ist passiv abzugrenzen; das Revisionshonorar wird in der Praxis vollständig abgegrenzt.
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: Mit Bezug auf das Revisionshonorar ist es gängige Praxis, dieses (nach Berücksichtigung allfälliger Akontozahlungen)
- regel: Unterhalt und Reparaturen gehen in der Regel in die Erfolgsrechnung; ihre Aktivierung ist zu hinterfragen.
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Unterhalt und Reparaturen sind in der Regel der Erfolgsrechnung zu belasten.
- regel: 'Wertvermehrende Investitionen in bestehende Sachanlagen können aktiviert werden: Wahlrecht, keine Aktivierungspflicht.'
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Wertvermehrende Investitionen in bestehende Sachanlagen, die den Nutzwert bzw. Netto-Marktwert nachhaltig erhöhen oder die Lebensdauer wesentlich verlängern, können aktiviert
    werden.
- regel: Zusätzliche Abschreibungen zu Wiederbeschaffungszwecken und zur Sicherung des dauernden Gedeihens sind zulässig; die Erfassung von Investitionen im Aufwand ist als Bildung stiller
    Reserven zulässig, bei Analytik und Prüfung der stillen Reserven aber zu berücksichtigen.
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- regel: Nicht bilanzierte Leasing-/Mietzahlungen sind nach Fälligkeit und unter Berücksichtigung der zeitlichen Abgrenzung als Aufwand zu erfassen.
  quelle: hwp-bur-2023__rz-0398-s241
  zitat: unter Berücksichtigung der zeitlichen Abgrenzung als Aufwand zu erfassen
- regel: Langfristige Mietverträge sind wie Leasingverpflichtungen mit dem Restmietzins bis Vertragsende bzw. Kündigungstermin (Nominalwert) im Anhang offenzulegen.
  quelle: hwp-bur-2023__rz-0836-s346
  zitat: Bei den langfristigen Mietverträgen ist ebenfalls der bis zum Vertragsende bzw. zum Ablauf der Kündigungsfrist noch geschuldete Restmietzins (Nominalwert)
- regel: Verrechnungsverbot gilt auch für artgleiche und kausal verbundene Aufwände und Erträge (z.B. Untermiet- oder Weiterverrechnungserträge brutto ausweisen).
  quelle: hwp-bur-2023__rz-0067-s071
  zitat: Das Verbot der Verrechnung von Aufwand und Ertrag bezieht sich auch auf artgleiche Aufwendungen und Erträge und auf solche mit engem kausalem Zusammenhang.
- regel: 'Ausnahme: Posten mit Korrekturcharakter, u.a. Aufwendungen und Aufwandminderungen im engeren Sinn, dürfen bzw. sollen verrechnet werden. Rückerstattungen und Gutschriften zur
    gleichen Leistung gehören als Aufwandminderung in die betreffende Aufwandart; kein Bruttoausweis verlangen.'
  quelle: hwp-bur-2023__rz-0068-s071
  zitat: Eine Verrechnung in der Erfolgsrechnung ist hingegen erlaubt oder sogar angezeigt, wenn es sich um Posten mit Korrekturcharakter handelt
- regel: Betriebsfremd sind z.B. Aufwendungen für nicht betriebliche Sachanlagen; Ausweis nach dem Finanzerfolg, nicht im übrigen betrieblichen Aufwand.
  quelle: hwp-bur-2023__rz-0799-s329-t1
  zitat: Dazu gehören beispielsweise die Aufwendungen für und Erträge aus nicht betrieblichen Sachanlagen.
- regel: Ausserordentlich/periodenfremd eng auslegen; sporadische oder unüblich grosse Posten aus der normalen Tätigkeit (auch wiederkehrende Abrechnungsdifferenzen wie Nebenkosten-
    oder Prämienabrechnungen) bleiben in der betreffenden Aufwandart.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Sporadisch wiederkehrende Geschäftsvorfälle hingegen sind nicht periodenfremd bzw. ausserordentlich, nur weil sie unregelmässig anfallen.
- regel: Periodenfremd ist typischerweise die Korrektur wesentlicher Fehler aus einem Vorjahr; Rückerstattungen früherer Perioden nur bei wesentlicher Periodenfremdheit dort ausweisen,
    sonst als Aufwandminderung.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Typischerweise stellt die Korrektur von Fehlern aus einem Vorjahr, sofern wesentlich, einen periodenfremden Vorgang dar.
- regel: Erfolgswirksame Vorgänge sind über die Erfolgsrechnung zu buchen, nicht direkt auf Bilanzkonten.
  quelle: hwp-bur-2023__rz-0741-s313-t1
  zitat: Sie dürfen nicht unter Umgehung der Erfolgsrechnung direkt auf Bilanzkonten gebucht werden.
- regel: Leistungen an Gesellschafter/Nahestehende ohne angemessene Gegenleistung sind verdeckte Gewinnausschüttungen (zu hoher Aufwand); Arm's-length-Grundsatz.
  quelle: hwp-er-2026__rz-0163-s212
  zitat: hierbei enthält die Erfolgsrechnung zu hohe Aufwendungen und/oder zu geringe Erträge
- regel: Stetigkeit von Darstellung und Bewertung (Kontenzuordnung, Aktivierungspraxis) zwischen den Jahren; Änderungen sind zu erfragen und zu würdigen.
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
fallstricke:
- text: 'Die Detailprüfungen zu SER Anhang D r) (SCH3-301 bis -303) sind weitergehende Prüfungshandlungen: nur, wenn aus den empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen
    werden müssen (SER: «vor allem», auch bei erhöhtem inhärentem Risiko); WP-Entscheid, Begründung dokumentieren.'
  quelle: hwp-er-2026__rz-0140-s206-t1
  zitat: sind nur dann durchzuführen, wenn aufgrund der «empfohlenen Prüfungshandlungen» wesentliche Fehlaussagen angenommen werden müssen
- text: 'Der Agent kann nicht selbst befragen: Er wertet schriftliche Antworten aus oder erfasst die Frage als Pendenz; Befragungsschritte höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- text: Kundenfragen sind Entwürfe zuhanden WP bzw. Pendenzen; der Agent versendet nichts an den Kunden.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- text: Jeden Schritt im Textfeld dokumentieren und Notizen erfassen, das revio-Visum aber offen lassen; Abschluss und Freigabe durch den WP.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: im Textfeld dokumentieren → Notizen erfassen → Visum offen lassen
- text: Bei wesentlichen Posten genügt die Befragung allein nicht; Antworten mit Analytik oder Detailprüfung erhärten.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Erklärungen zu Abweichungen nicht ungeprüft übernehmen, sondern plausibilisieren (z.B. mit Verträgen, Kontoblättern).
  quelle: ser-2022__6-1-2-t3
  zitat: es notwendig, die im Rahmen der Abweichungsanalyse erhaltenen Aussagen zu plausibilisieren
- text: 'Schwellen nicht vermischen: Nicht-Aufgriffsgrenze = Erfassungs-/Protokollgrenze; Würdigung der Analytik gegen die tolerierbare Abweichung (Vorgabe WP aus Toleranzwesentlichkeit
    3.3); bei qualitativen Faktoren (Nahestehende, Privataufwand) auch kleinere Beträge melden.'
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: Wenn erfasst, meldet der Agent auch kleinere Abweichungen.
- text: Stille Reserven (z.B. im Aufwand erfasste wertvermehrende Investitionen, Rückstellungen) verzerren den Vorjahresvergleich; Zahlen vor dem Vergleich bereinigen. Expensierte Investitionen
    sind kein Fehler (Aktivierungswahlrecht), aber festzuhalten.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- text: Umgliederungen zwischen Konten oder Positionen täuschen Abweichungen vor bzw. verdecken sie; vor dem Vergleich Änderungen der Darstellung erfragen.
  quelle: ser-2022__anh-d-s072-1
  zitat: Befragung über allfällige Änderungen der Darstellung der Jahresrechnung oder der Bewertungsgrundsätze
- text: 'Verrechnungsverbot nicht überdehnen: Rückerstattungen und Gutschriften zur gleichen Leistung sind Aufwandminderungen (kein Bruttoausweis nötig) und nicht unbesehen als ausserordentlich
    oder periodenfremd zu akzeptieren.'
  quelle: hwp-bur-2023__rz-0068-s071
  zitat: Aufwendungen und Aufwandminderungen im engeren Sinn
- text: 'Keine repräsentativen Stichproben: Posten bewusst nach Höhe und Auffälligkeit auswählen und die Auswahl begründen.'
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: Visierung bzw. Freigabevermerke des Kunden auf Belegen nur als Einzelnachweis würdigen (z.B. Prüfungsziel «Verpflichtungen»), keine IKS-Funktionsprüfung; nicht mit dem revio-Visum
    verwechseln, das der Agent nie setzt.
  quelle: hwp-er-2026__rz-0116-s201
  zitat: Dennoch kann mit der Prüfung der Visierung ggf. das Prüfungsziel «Verpflichtungen» geprüft werden
- text: Alle Detailschritte von SCH3 sind WP-gekennzeichnet; ob der Agent sie vorbereitet oder auslässt, ist offen und richtet sich nach der Anweisung des Wirtschaftsprüfers.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: Rückbuchung der Vorjahresabgrenzungen und neue Abgrenzungen beeinflussen beide Jahre; Abgrenzungen im Vorjahresvergleich mitberücksichtigen.
  quelle: hwp-bur-2023__rz-0262-s216
  zitat: durch Vergleich mit den im Vorjahr ausgewiesenen Rechnungsabgrenzungen
- text: Elektronisch vorliegende Belege (PDF, Scans) auf Echtheit, Empfänger und Leistungsperiode prüfen.
  quelle: hwp-er-2026__rz-0116-s201
  zitat: Echtheit des Belegs (insbesondere bei nur in elektronischer Form vorliegenden Belegen)
- text: 'Vorzeichen beachten: In Saldolisten werden Aufwände oft negativ dargestellt; positive Salden oder Haben-Buchungen auf Aufwandkonten (Gutschriften, Abgrenzungsauflösungen) gezielt
    hinterfragen.'
- text: Kontenbereiche des übrigen betrieblichen Aufwands sind mandatsabhängig; Zuordnung der Konten zu SCH3 (ohne Abschreibungen, Finanz-, betriebsfremden und ausserordentlichen Erfolg)
    vor der Analytik prüfen.
fragen_kunde:
- frage: Bitte erläutern Sie schriftlich die Gründe für die wesentlichen Abweichungen der aufgeführten Aufwandkonten gegenüber Vorjahr bzw. Budget (Liste beigelegt), inkl. Einmaleffekte
    und Umgliederungen.
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-101, -201, -202 (EN, VO, PA, RI); Antwort im Textfeld würdigen
- frage: Wurden sämtliche Leistungen des Berichtsjahres (z.B. Strom, Telefon, Treuhand, Revisionshonorar, Nebenkostenabrechnung) bis 31.12. verbucht oder passiv abgegrenzt? Wie stellen
    Sie die Vollständigkeit sicher? Bitte noch nicht verbuchte Eingangsrechnungen einreichen.
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-302 (VO, PA)
- frage: Wurden im Berichtsjahr bezahlte Aufwände für das Folgejahr (Miete, Versicherungen, Lizenzen, Abonnemente) aktiv abgegrenzt? Bitte Liste mit Belegen.
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-302 (PA)
- frage: Enthält der übrige betriebliche Aufwand Leistungen an oder von Aktionären, Verwaltungsräten, Geschäftsleitung oder ihnen nahestehenden Personen (Honorare, Spesen, Fahrzeuge,
    Mieten)? Zu welchen Konditionen?
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-301 (RI), SCH3-303 (EN); verdeckte Gewinnausschüttung
- frage: Wurden Kontenplan oder Kontenzuordnung zur Jahresrechnung gegenüber dem Vorjahr geändert (Umgliederungen zwischen Material-, Personal- und übrigem Aufwand)?
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). Vergleichbarkeit für SCH3-201/-202; Stetigkeit (DO)
- frage: Wurden Unterhalts- oder Reparaturkosten aktiviert, oder enthalten Unterhalts-, Reparatur- und GWG-Konten wertvermehrende Investitionen? Welche Aktivierungsgrenze wenden Sie
    an, und wurde sie gegenüber dem Vorjahr geändert?
  zweck: 'Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-303 (EN, VO): aktivierter Unterhalt, Stetigkeit der Aktivierungspraxis; Investitionen im Aufwand als
    stille Reserve festhalten'
- frage: Nach welchen Kriterien werden Aufwände als ausserordentlich, einmalig, periodenfremd oder betriebsfremd statt im betrieblichen Aufwand ausgewiesen?
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). Ausweis (DO), Abgrenzung zum Prüffeld ausserordentlicher/betriebsfremder Erfolg
- frage: Werden Erträge (z.B. Untermiete, Weiterverrechnungen) mit Aufwandkonten verrechnet? Wie werden Rückerstattungen und Gutschriften (z.B. Nebenkostenabrechnung Vorjahr, Lieferantengutschriften)
    verbucht?
  zweck: 'Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). Ausweis (DO): Verrechnungsverbot bzw. zulässige Aufwandminderung'
- frage: Besteht ein Budget oder Forecast für das Berichtsjahr? Bitte einreichen und angeben, wie es erstellt wurde.
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-202c; Verlässlichkeit der Vergleichsbasis
- frage: Welche Miet-, Leasing- und anderen langfristigen Verträge bestehen (Laufzeit, Kündigungsfrist, Restverpflichtung per 31.12.)?
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). SCH3-202d Erwartungswerte; Anhangangabe Art. 959c Abs. 2 Ziff. 6 OR
- frage: Werden Privatanteile an Geschäftsaufwendungen und Bezüge von Dienstleistungen aus dem Ausland (z.B. Software, IT-Dienstleistungen) mit der MWST abgerechnet?
  zweck: Entwurf zuhanden WP (als Pendenz erfassen; Versand durch Mensch). Schnittstelle Prüffeld M2 (Bezugsteuer, Privatanteile; VO)
