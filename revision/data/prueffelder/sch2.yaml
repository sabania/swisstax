fallstricke:
- text: Befragung allein genügt bei wesentlichem direktem Aufwand nicht; Antworten mit Analytik und/oder Detailprüfungen ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Der Agent kann nicht selbst befragen: Befragungsschritte nur mit schriftlicher Antwort auswerten, sonst Pendenz; Fragen und Antworten dokumentieren, sonst ist die Befragung
    kein Prüfungsnachweis.'
  quelle: hwp-er-2026__rz-0103-s197
  zitat: Ansonsten ist die Befragung als Prüfungsnachweis ungeeignet.
- text: Analytik kann kompensierende Fehler übersehen; Erklärungen aus der Abweichungsanalyse sind zu plausibilisieren.
  quelle: ser-2022__6-1-2-t3
  zitat: die im Rahmen der Abweichungsanalyse erhaltenen Aussagen zu plausibilisieren
- text: In KMU verzerren Bildung/Auflösung stiller Reserven (z.B. Vorratsreserven) Material- und Margenzahlen; vor der Analyse bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden, und bereinigt die Zahlen entsprechend
- text: Budgetvergleich nur aussagekräftig, wenn das Budget sorgfältig erstellt wurde (keine reine Zielvorgabe).
  quelle: ser-2022__6-1-2-t2
  zitat: Verlässlichkeit der verfügbaren Informationen (werden z. B. Budgets hinreichend sorgfältig erstellt?)
- text: 'Keine Lieferanten-/Kreditorenbestätigungen einholen: Drittbestätigungen gehören nicht zur eingeschränkten Revision; Prüfung mit intern verfügbaren Unterlagen.'
  quelle: ser-2022__1-5
  zitat: keine Inventurbeobachtung und Drittbestätigungsanfragen durchgeführt
- text: Keine repräsentative Stichprobe ziehen; bewusste Auswahl (grosse, ungewöhnliche, stichtagsnahe Posten) begründen.
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: SCH2-303 ist im SER eine weiter gehende Prüfungshandlung und im Katalog WP-gekennzeichnet; ob der Agent sie vorbereitet, ist offen (Entscheid consis).
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: Lieferantenrabatte, Gutschriften oder nachträgliche Rechnungen werden gerne als ausserordentlich bzw. periodenfremd ausgewiesen, um das Betriebsergebnis zu verbessern; Begriffe
    eng auslegen.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Erfahrungsgemäss besteht eine gewisse Versuchung, Aufwendungen möglichst dem ausserordentlichen
- text: Sporadische oder unüblich grosse Posten aus der normalen Geschäftstätigkeit sind nicht deshalb ausserordentlich.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Sporadisch wiederkehrende Geschäftsvorfälle hingegen sind nicht periodenfremd bzw. ausserordentlich, nur weil sie unregelmässig anfallen.
- text: Bei Absatzerfolgsrechnung enthält der direkte Aufwand auch Personal und Abschreibungen der Herstellung; Margenvergleich und Anhangangaben (Personalaufwand, Abschreibungen) entsprechend
    anpassen.
  quelle: or__art-959b-t2
  zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen
- text: Erleichterung von Art. 958b Abs. 2 OR (Abstellen auf Ausgaben) nur bei Nettoerlösen bzw. Finanzerträgen bis CHF 100'000 – bei grösseren Gesellschaften ist die zeitliche Abgrenzung
    zwingend.
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- text: Cut-off-Prüfung mit den Prüffeldern Kreditoren und passive Rechnungsabgrenzungen abstimmen (gleiche Belege, keine Doppelarbeit, Feststellungen gegenseitig verweisen).
fragen_kunde:
- frage: Zu welchem Zeitpunkt erfassen Sie Material-, Waren- und Fremdleistungsaufwand (Lieferung/Leistungserbringung oder Rechnungseingang), und wie behandeln Sie Bestandesänderungen,
    Rabatte, Skonti, Rückvergütungen und Fremdwährungseinkäufe? Gab es Änderungen gegenüber dem Vorjahr?
  zweck: SCH2-101 Grundsätze der Verbuchung, Stetigkeit
- frage: Wie stellen Sie sicher, dass bis 31.12. erhaltene Lieferungen und Leistungen, deren Rechnung erst im Folgejahr eintrifft, als Kreditor oder passive Abgrenzung erfasst werden?
    Wer kontrolliert das?
  zweck: SCH2-101 zeitliche Abgrenzung, Vorbereitung SCH2-303
- frage: Wie erfassen Sie Umsätze (Zeitpunkt Lieferung/Abnahme bzw. Leistungsfortschritt), und wie wird der zugehörige Material- und Fremdleistungsaufwand denselben Projekten bzw. derselben
    Periode zugeordnet?
  zweck: SCH2-101 Umsatz und Waren-/Materialaufwand, sachliche Abgrenzung
- frage: Welche Gründe haben die wesentlichen Veränderungen der einzelnen Konten des direkten Aufwands gegenüber Vorjahr und Budget (beiliegende Abweichungsliste)?
  zweck: SCH2-102, SCH2-202 Ursachen signifikanter Änderungen
- frage: Wie haben sich die Bruttomargen je Produktkategorie bzw. Projekt entwickelt (Einkaufs- und Verkaufspreise, Produktmix, Verlustprojekte, Garantiearbeiten)?
  zweck: SCH2-201 Margenvergleich
- frage: Wurden nach dem Bilanzstichtag Lieferantenrabatte, Boni, Gutschriften oder Nachbelastungen gewährt bzw. erhalten, die das Berichtsjahr betreffen? Gibt es im direkten Aufwand
    Rechnungen, die frühere Jahre betreffen?
  zweck: SCH2-302/303 Periodenabgrenzung, periodenfremde Posten
- frage: Bestehen Einkäufe oder Fremdleistungen von Aktionären, Organen oder ihnen nahestehenden Personen/Gesellschaften, und zu welchen Konditionen?
  zweck: Risiko Nahestehende, Drittvergleich
- frage: Wurden Wertberichtigungen oder pauschale Reserven auf Vorräten gebildet oder aufgelöst, die den Materialaufwand beeinflussen?
  zweck: Stille Reserven, Anhangangabe Nettoauflösung
