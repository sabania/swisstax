schritte:
- id: SCH2-101
  vorgehen: 'Agent befragt nicht: schriftliche Antwort (revio 10.11, Richtlinien) auswerten, sonst Fragen als Pendenz für WP/Mandatsleitung: Erfassungszeitpunkt Aufwand, Abgrenzung nach
    Stichtag, Umsatzerfassung/POC, Bestandesänderungen, Rabatte/Skonti, Fremdwährung, Änderungen ggü. VJ. Antworten mit Anhang und Buchungspraxis abgleichen. Bedarf an schriftlicher
    Bestätigung der Kernaussagen (SER: «allenfalls») als Pendenz; kein direkter Kundenkontakt.'
  nachweise:
  - Schriftliche Antwort Kundenbefragung (revio 10.11) bzw. Aktennotiz
  - Kontierungs-/Abgrenzungsrichtlinien, Kontenplan 4xxx
  - Anhang Jahresrechnung (Grundsätze, Bewertung, POC)
  rechnen: ''
  feststellung_wenn: Antwort fehlt (Pendenz) oder widerspricht Buchungspraxis/Anhang, z.B. Aufwand erst bei Rechnungseingang ohne Abgrenzung oder geänderte Grundsätze ohne Offenlegung.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Befragung über die Grundsätze und zeitliche Abgrenzung bei der Verbuchung von Umsätzen und Waren-/Materialaufwand
  - quelle: ser-2022__anh-d-s084-1
    zitat: Befragung, wie die vollständige, periodengerechte Erfassung sichergestellt wurde
  - quelle: ser-2022__anh-d-s072-1
    zitat: Befragung über allfällige Änderungen der Darstellung der Jahresrechnung oder der Bewertungsgrundsätze
  - quelle: ser-2022__6-1-1-t1
    zitat: Um Missverständnisse zu vermeiden, sind die Kernaussagen vom Befragten allenfalls schriftlich bestätigen zu lassen.
  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: SCH2-102
  vorgehen: 'Wortlaut wie SER Anh. D q) (Analogie; gleich in i) und t)). Aus Saldovergleich (SCH2-202 a) 4xxx-Konten mit Abweichung über der Schwelle (vertretbare Differenz) auflisten.
    Schwelle = Vorgabe WP; fehlt sie: vorläufig Toleranzwesentlichkeit aus revio 3.3 (`revio 3.3`, Regel: `regeln wesentlichkeit`), im Textfeld als vorläufig kennzeichnen, Pendenz an
    den WP. Vorhandene schriftliche Erklärungen auswerten, fehlende als Pendenz für WP/Mandatsleitung. Erklärungen kritisch mit Umsatz-, Projekt- und Margenentwicklung abgleichen; Nachfragen
    zu nicht plausiblen Antworten als Pendenz; Frage/Antwort im Textfeld.'
  nachweise:
  - Saldoliste Erfolgsrechnung Berichts-/Vorjahr
  - Abweichungsliste 4xxx
  - Schriftliche Erklärungen Finanzen/GF
  rechnen: 'Abweichung je Konto = Saldo BJ − Saldo VJ (CHF; % = (BJ - VJ) / abs(VJ) * 100; VJ = 0 → «neu»); Auswahl Konten mit |Abweichung| > Schwelle (noch vertretbare Differenz). Schwelle
    = Vorgabe WP; fehlt sie: vorläufig Toleranzwesentlichkeit aus revio 3.3 (`revio 3.3`, Regel: `regeln wesentlichkeit`), im Textfeld als vorläufig kennzeichnen, Pendenz an den WP'
  feststellung_wenn: Wesentliche Abweichung ohne plausible Erklärung oder Erklärung im Widerspruch zu Umsatz-, Projekt- oder Margenentwicklung.
  fundstellen:
  - quelle: ser-2022__anh-d-s093-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: die Höhe der Differenzen zwischen den ausgewiesenen Beträgen und den erwarteten Werten, die für den Abschlussprüfer als noch vertretbar gelten können
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Diskrepanzen zwischen den erhaltenen Antworten und seinen Kenntnissen über das Unternehmen geht der Abschlussprüfer nach.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Toleranzwesentlichkeit (75 %): steuert Prüfumfang und Stichprobe.'
- id: SCH2-201
  vorgehen: Je Produktkategorie (BJ, VJ) Gesamtleistung, direkten Aufwand und Bruttomarge berechnen; bei Projektgeschäft Marge je Projekt aus Projektliste/Nachkalkulation. Erlösminderungen
    und Bestandesänderung angefangene Arbeiten ausdrücklich zuordnen. Margenveränderung in Prozentpunkten mit Erwartung aus Geschäftskenntnis vergleichen; Ursachen (Preise, Mix, Verlustprojekte,
    Garantie, Cut-off) aus schriftlichen Antworten bzw. als Pendenz dokumentieren.
  nachweise:
  - Saldoliste/Erfolgsrechnung Berichts- und Vorjahr
  - Margen-/Deckungsbeitragsstatistik je Kategorie
  - Projektliste bzw. Nachkalkulation
  rechnen: 'Gesamtleistung = Nettoerlöse (nach Erlösminderungen, z.B. Skonti) ± Bestandesänderungen an unfertigen/fertigen Erzeugnissen und nicht fakturierten Dienstleistungen; Bruttomarge
    % = (Gesamtleistung − direkter Aufwand) / Gesamtleistung × 100, je Kategorie und Jahr; direkter Aufwand inkl. Bestandesänderung Handelswaren (Konten gemäss Kontenplan des Mandats);
    Δ Marge = Marge BJ − Marge VJ (Prozentpunkte). Vorzeichen: Erlöse und Aufwand als positive Zahlen einsetzen. Gesamtleistung: Bestandeszunahme angefangene Arbeiten/Erzeugnisse +,
    Abnahme −. Direkter Aufwand: Bestandeszunahme Handelswaren −, Bestandesabnahme + (wie SCH2-302). Aufruf: rechne "Marge BJ = (<Gesamtleistung BJ> - <direkter Aufwand BJ>) / <Gesamtleistung
    BJ> * 100; Marge VJ = (<Gesamtleistung VJ> - <direkter Aufwand VJ>) / <Gesamtleistung VJ> * 100"'
  feststellung_wenn: Marge weicht wesentlich von Vorjahr/Erwartung ab ohne plausible Erklärung oder Aufwand und zugehöriger Ertrag fallen zeitlich auseinander (Hinweis auf Cut-off-/Matching-Fehler).
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Vergleich von Umsätzen, Warenaufwand und Bruttomargen je Produktkategorie mit dem Vorjahr; Besprechung wesentlicher Abweichungen
  - quelle: ser-2022__6-1-2-t1
    zitat: z. B. Bruttomarge oder Sozialaufwand in Prozenten der Löhne
  - quelle: hwp-er-2026__rz-0031-s183
    zitat: Vergleiche wichtiger Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten im Umlaufvermögen, Eigenkapitalanteil etc.) sind in der Regel nützlich und effizient.
  - quelle: or__art-959b-t1
    zitat: Bestandesänderungen an unfertigen und fertigen Erzeugnissen sowie an nicht fakturierten Dienstleistungen
  - quelle: hwp-bur-2023__rz-0235-s115
    zitat: Gesamtleistung (Nettoerlös zuzüglich oder abzüglich der Bestandsänderungen an unfertigen und fertigen Erzeugnissen sowie an nicht fakturierten Dienstleistungen)
  - quelle: hwp-bur-2023__rz-0757-s319
    zitat: Diese Position bezweckt einen periodengerechten Ergebnisausweis
- id: SCH2-202
  vorgehen: a) Saldovergleich aller 4xxx-Konten mit VJ; b) Kontoblätter kritisch auf hohe/ungewöhnliche Beträge durchsehen (Vorzeichen, runde Beträge, Stichtagsnähe, Korrekturen; SER
    Anh. D r) nur analog, dort weiter gehend); c) Budgetvergleich, falls Budget verlässlich; d) Margenvergleich aus SCH2-201; e) andere Unterlagen (Inventar, Projektliste, Vorsteuer).
    Ursache je signifikanter Änderung im Textfeld umschreiben, Einfluss stiller Reserven bereinigen.
  nachweise:
  - Saldoliste Berichts-/Vorjahr
  - Kontoblätter 4xxx
  - Budget/Forecast
  - Inventarlisten, Projektliste, MWST-Abrechnungen
  rechnen: 'Δ je Konto = Saldo BJ − Saldo VJ; Aufwandquote = direkter Aufwand (inkl. Bestandesänderung Handelswaren, Konten gemäss Kontenplan) / Gesamtleistung (Definition wie SCH2-201;
    BJ, VJ); Budgetabweichung = Ist − Budget; signifikant, wenn |Δ| > Schwelle. Schwelle = Vorgabe WP; fehlt sie: vorläufig Toleranzwesentlichkeit aus revio 3.3 (`revio 3.3`, Regel:
    `regeln wesentlichkeit`), im Textfeld als vorläufig kennzeichnen, Pendenz an den WP'
  feststellung_wenn: Signifikante Änderung nicht erklärbar, ungewöhnliche Einzelbuchung ohne Begründung oder Hinweis auf Fehlklassierung (z.B. Rabatte bzw. Vorjahresrechnungen im ausserordentlichen
    Ergebnis).
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht der Konten auf hohe oder ungewöhnliche Beträge
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Budgetvergleiche → je nach Betriebsgrösse unterschiedlich häufig anzutreffende Prüfungshandlung
