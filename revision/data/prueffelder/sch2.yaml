schritte:
- id: SCH2-101
  vorgehen: 'Agent befragt nicht: schriftliche Antwort (revio 10.11, Kontierungsrichtlinien) auswerten, sonst Fragen als Pendenz an Finanzen/GF: Erfassungszeitpunkt Material/Fremdleistungen
    (Lieferung vs. Rechnung), Abgrenzung von Rechnungen nach Stichtag, Umsatzerfassung, Bestandesänderungen, Rabatte/Skonti, Fremdwährung, Änderungen ggü. Vorjahr. Antworten mit Anhang
    (Grundsätze) und Buchungspraxis abgleichen; Kernaussagen schriftlich bestätigen lassen.'
  nachweise:
  - Schriftliche Antwort Kundenbefragung (revio 10.11) bzw. Aktennotiz
  - Kontierungs-/Abgrenzungsrichtlinien, Kontenplan 4xxx
  - Anhang Jahresrechnung (Grundsätze, Bewertung)
  rechnen: ''
  feststellung_wenn: Antwort fehlt (Pendenz) oder widerspricht Buchungspraxis/Anhang, z.B. Aufwand erst bei Rechnungseingang ohne Abgrenzung oder geänderte Grundsätze ohne Offenlegung.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Befragung über die Grundsätze und zeitliche Abgrenzung bei der Verbuchung von Umsätzen und Waren-/Materialaufwand
  - quelle: ser-2022__anh-d-s072-1
    zitat: Befragung über allfällige Änderungen der Darstellung der Jahresrechnung oder der Bewertungsgrundsätze
  - quelle: ser-2022__6-1-1-t1
    zitat: Um Missverständnisse zu vermeiden, sind die Kernaussagen vom Befragten allenfalls schriftlich bestätigen zu lassen.
  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
- id: SCH2-102
  vorgehen: Aus dem Saldovergleich (SCH2-202 a) alle 4xxx-Konten mit Abweichung über der Schwelle (Vorgabe WP, z.B. Anteil Toleranzwesentlichkeit) auflisten; Erklärung je Konto schriftlich
    einholen (Pendenz) oder vorhandene Antwort auswerten. Erklärungen kritisch mit Umsatz-, Projekt- und Margenentwicklung abgleichen; nicht plausible Antworten nachverfolgen und Frage/Antwort
    im Textfeld festhalten.
  nachweise:
  - Saldoliste Erfolgsrechnung Berichts-/Vorjahr
  - Abweichungsliste 4xxx
  - Schriftliche Erklärungen Finanzen/GF
  rechnen: Abweichung je Konto = Saldo BJ − Saldo VJ (CHF und %); Auswahl Konten mit |Abweichung| > Schwelle
  feststellung_wenn: Wesentliche Abweichung ohne plausible Erklärung oder Erklärung im Widerspruch zu Umsatz-, Projekt- oder Margenentwicklung.
  fundstellen:
  - quelle: ser-2022__anh-d-s093-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Diskrepanzen zwischen den erhaltenen Antworten und seinen Kenntnissen über das Unternehmen geht der Abschlussprüfer nach.
- id: SCH2-201
  vorgehen: Nettoerlös, direkten Aufwand (inkl. Bestandesänderungen) und Bruttomarge je Produktkategorie/Geschäftsbereich für Berichts- und Vorjahr berechnen; bei Projektgeschäft Marge
    je Projekt aus Projektliste/Nachkalkulation. Margenveränderungen in Prozentpunkten analysieren, Erwartung aus Geschäftskenntnis bilden, Ursachen (Preise, Mix, Verlustprojekte, Cut-off)
    mit Befragung bzw. Pendenz klären und dokumentieren.
  nachweise:
  - Saldoliste/Erfolgsrechnung Berichts- und Vorjahr
  - Margen-/Deckungsbeitragsstatistik je Kategorie
  - Projektliste bzw. Nachkalkulation
  rechnen: Bruttomarge % = (Nettoerlös − direkter Aufwand) / Nettoerlös je Kategorie und Jahr; Δ Marge = Marge BJ − Marge VJ (Prozentpunkte)
  feststellung_wenn: Marge weicht wesentlich von Vorjahr/Erwartung ab ohne plausible Erklärung oder Aufwand und zugehöriger Ertrag fallen zeitlich auseinander (Hinweis auf Cut-off-/Matching-Fehler).
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Vergleich von Umsätzen, Warenaufwand und Bruttomargen je Produktkategorie mit dem Vorjahr; Besprechung wesentlicher Abweichungen
  - quelle: ser-2022__6-1-2-t1
    zitat: z. B. Bruttomarge oder Sozialaufwand in Prozenten der Löhne
  - quelle: hwp-er-2026__rz-0031-s183
    zitat: Vergleiche wichtiger Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten im Umlaufvermögen, Eigenkapitalanteil etc.) sind in der Regel nützlich und effizient.
- id: SCH2-202
  vorgehen: a) Saldovergleich aller 4xxx-Konten mit Vorjahr; b) Kontoblätter auf hohe/ungewöhnliche Beträge durchsehen (Vorzeichen, runde Beträge, Stichtagsnähe, Korrekturen); c) Budgetvergleich,
    falls verlässliches Budget vorliegt; d) Margenvergleich aus SCH2-201; e) andere Unterlagen (Inventar, Projektliste, Vorsteuer). Ursache je signifikanter Änderung im Textfeld umschreiben,
    Einfluss stiller Reserven bereinigen.
  nachweise:
  - Saldoliste Berichts-/Vorjahr
  - Kontoblätter 4xxx
  - Budget/Forecast
  - Inventarlisten, Projektliste, MWST-Abrechnungen
  rechnen: Δ je Konto = Saldo BJ − Saldo VJ; Aufwandquote = direkter Aufwand / Nettoerlös (BJ, VJ); Budgetabweichung = Ist − Budget
  feststellung_wenn: Signifikante Änderung nicht erklärbar, ungewöhnliche Einzelbuchung ohne Begründung oder Hinweis auf Fehlklassierung (z.B. Rabatte bzw. Vorjahresrechnungen im ausserordentlichen
    Ergebnis).
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht der Konten auf hohe oder ungewöhnliche Beträge
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Budgetvergleiche → je nach Betriebsgrösse unterschiedlich häufig anzutreffende Prüfungshandlung
  - quelle: ser-2022__6-1-2-t1
    zitat: voraussichtlichen Ergebnissen des Unternehmens wie etwa Budgets, Prognosen oder diesbezüglichen Erwartungen des Abschlussprüfers
  - quelle: ser-2022__6-1-2-t2
    zitat: Einfluss der Bildung oder Auflösung stiller Reserven auf die ausgewiesenen Werte in der Jahresrechnung.
- id: SCH2-301
  vorgehen: 'Bewusste Auswahl aus den 4xxx-Konten (Posten über Toleranzwesentlichkeit, ungewöhnliche, stichtagsnahe Posten, Nahestehende; Auswahl begründen). Je Posten Lieferantenrechnung/Vertrag
    in M-Files mit Buchung abgleichen: Betrag, Währung, Datum/Leistungsperiode, Kontierung, Empfänger = Gesellschaft, Geschäftsbezug, keine Doppelerfassung. Fehlende Belege als PBC-Pendenz
    erfassen.'
  nachweise:
  - Kontoblätter 4xxx
  - Lieferantenrechnungen/Gutschriften der Auswahl
  - Verträge, Zahlungsbelege
  rechnen: Abdeckung = Σ geprüfte Posten / Saldo Konto; Differenz je Posten = Betrag Beleg − Betrag Buchung
  feststellung_wenn: Beleg fehlt, lautet nicht auf die Gesellschaft, ohne Geschäftsbezug, Betrag/Konto/Periode weicht ab oder Doppelerfassung.
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und anderen geeigneten Unterlagen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Der Agent wählt standardmässig alle Posten über der Toleranzwesentlichkeit, ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe, nahestehende Personen)
- id: SCH2-302
  vorgehen: 'Kontoblätter 4xxx kritisch durchsehen – sachlich: richtiges Konto, Abgrenzung zu übrigem Aufwand/Investitionen, Rabatte/Skonti als Aufwandminderung, keine Verrechnung mit
    Ertrag, Fremdwährung; zeitlich: Buchungen Dezember/Januar, Storni, Rechnungen Vorjahr, Bestandesänderungen gemäss Inventar. Auffälligkeiten mit Beleg klären und im Textfeld festhalten.'
  nachweise:
  - Kontoblätter 4xxx
  - Inventarlisten Berichts-/Vorjahr
  - Belege zu auffälligen Buchungen
  rechnen: Bestandesänderung Handelswaren = Inventarwert 31.12. VJ − Inventarwert 31.12. BJ, Abgleich mit Konten Bestandesänderung
  feststellung_wenn: Fehlkontierung, unzulässige Verrechnung, Aufwand früherer Perioden nicht als periodenfremd erkennbar, Rabatte/Gutschriften falsch klassiert oder Bestandesänderung
    nicht abstimmbar.
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
  - quelle: hwp-bur-2023__rz-0262-s216
    zitat: mittels Durchsicht der einzelnen Aufwands- und Ertragskonten im Hinblick auf die richtige Periodenabgrenzung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: or__art-958c
    zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- id: SCH2-303
  vorgehen: 'WP-Schritt: nur vorbereiten, Entscheid beim WP. Rechnungen, Lieferscheine und Leistungsrapporte im Zeitfenster vor und nach 31.12. (Vorgabe WP) aus Kreditorenjournal/Kontoblättern
    neuer Rechnung, OP-Liste und PRA-Liste auswählen; Liefer-/Leistungsdatum mit Buchungsperiode vergleichen. Leistungen BJ ohne Kreditor/Abgrenzung und Lieferungen Folgejahr im BJ auflisten
    und summieren.'
  nachweise:
  - Kreditorenjournal/Kontoblätter Folgejahr
  - Eingangsrechnungen mit Leistungsdatum
  - Lieferscheine/Wareneingänge, Montagerapporte
  - Kreditoren-OP-Liste, Liste passive Abgrenzungen 31.12.
  rechnen: Cut-off-Differenz = Σ Leistungen/Lieferungen ≤ 31.12. erst in neuer Rechnung gebucht und nicht abgegrenzt − Σ Leistungen/Lieferungen > 31.12. im Berichtsjahr gebucht
  feststellung_wenn: Nicht abgegrenzte Leistungen/Lieferungen einzeln oder kumuliert über Schwelle bzw. Toleranzwesentlichkeit, oder Aufwand des Folgejahres im Berichtsjahr erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Einsicht in Rechnungen und Lieferpapiere vor und nach dem Periodenende zur Prüfung der richtigen zeitlichen Abgrenzung
  - quelle: ser-2022__anh-d-s084-2
    zitat: Durchsicht von Wareneingangsbelegen für erhaltene Lieferungen kurz vor oder nach dem Jahresende
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht von Konten und/oder Belegen in neuer Rechnung auf Positionen, die das Berichtsjahr betreffen
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
