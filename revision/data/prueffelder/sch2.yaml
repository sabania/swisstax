- thema: 'Mindestgliederung Produktionserfolgsrechnung: Materialaufwand als eigene Position (Art. 959b Abs. 2 Ziff. 3 OR)'
  quelle: or__art-959b-t1
  zitat: In der Produktionserfolgsrechnung (Gesamtkostenverfahren) müssen mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: 'Absatzerfolgsrechnung: Anschaffungs-/Herstellungskosten der verkauften Produkte (Art. 959b Abs. 3 Ziff. 2 OR)'
  quelle: or__art-959b-t1
  zitat: Anschaffungs- oder Herstellungskosten der verkauften Produkte und Leistungen
- thema: 'Absatzerfolgsrechnung: Personalaufwand und Abschreibungen im Anhang (Art. 959b Abs. 4 OR)'
  quelle: or__art-959b-t2
  zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen
- thema: Zusätzliche Positionen in Erfolgsrechnung oder Anhang (Art. 959b Abs. 5 OR)
  quelle: or__art-959b-t2
  zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erleichterung: Verzicht auf zeitliche Abgrenzung bei Nettoerlösen/Finanzerträgen bis CHF 100''000 (Art. 958b Abs. 2 OR)'
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- thema: Verrechnungsverbot Aufwand/Ertrag (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Stetigkeit in Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Anpassung an Besonderheiten von Unternehmen und Branche (Art. 958c Abs. 3 OR)
