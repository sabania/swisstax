- id: SCH2-301
  vorgehen: 'Angemessene Detailprüfung (SER 6.1.3), Umfang nach Wesentlichkeit/Risiko: bewusste Auswahl aus 4xxx-Konten, Auswahl im Textfeld begründen. Standardauswahl gemäss Konzeptvorschlag
    (noch nicht bestätigt; Vorgabe WP je Mandat/Prüffeld geht vor): Posten über Toleranzwesentlichkeit, ungewöhnliche, stichtagsnahe Posten, Nahestehende. Je Posten Beleg/Vertrag in
    M-Files mit Buchung abgleichen (Betrag, Währung, Periode, Konto, Empfänger, Geschäftsbezug, Doppelerfassung); fehlende Belege als PBC-Pendenz.'
  nachweise:
  - Kontoblätter 4xxx
  - Lieferantenrechnungen/Gutschriften der Auswahl
  - Verträge, Zahlungsbelege
  - Liste nahestehender Personen/Vollständigkeitserklärung
  rechnen: Abdeckung = Σ geprüfte Posten / Saldo Konto; Differenz je Posten = Betrag Beleg − Betrag Buchung
  feststellung_wenn: Beleg fehlt, lautet nicht auf die Gesellschaft, ohne Geschäftsbezug, Betrag/Konto/Periode weicht ab oder Doppelerfassung.
  fundstellen:
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht
  - quelle: ser-2022__6-1-1-t1
    zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
  - quelle: ser-2022__6-1-3
    zitat: Bei einer eingeschränkten Revision sind angemessene Detailprüfungen – namentlich von Bestand und Bewertung – vorgesehen.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Der Agent wählt standardmässig alle Posten über der Toleranzwesentlichkeit, ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe, nahestehende Personen)
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: 'Zu bestätigen: Standardauswahl und wo der Wirtschaftsprüfer seine Vorgabe erfasst.'
- id: SCH2-302
  vorgehen: 'Kontoblätter 4xxx kritisch durchsehen, Umfang nach Wesentlichkeit/Risiko begründen. Sachlich: richtiges Konto, Abgrenzung zu übrigem Aufwand/Investitionen, Rabatte/Skonti
    als Aufwandminderung, keine Verrechnung mit Ertrag, Fremdwährung. Zeitlich: Buchungen Dez./Jan., Storni, Rechnungen Vorjahr, Bestandesänderungen gemäss Inventar. Auffälligkeiten
    mit Beleg klären und im Textfeld festhalten.'
  nachweise:
  - Kontoblätter 4xxx
  - Inventarlisten Berichts-/Vorjahr
  - Belege zu auffälligen Buchungen
  rechnen: Bestandesänderung Handelswaren = Inventarwert 31.12. VJ − Inventarwert 31.12. BJ (Einstandswerte); positiver Wert = Bestandesabnahme = Mehraufwand, negativer Wert = Bestandeszunahme
    = Aufwandminderung; Abgleich mit Σ Salden der Bestandesänderungskonten (gemäss Kontenplan) unter Beachtung der Buchungsrichtung (Soll/Haben); Vorzeichenkonvention der Saldoliste
    vorab feststellen und im Textfeld nennen; Wertberichtigung Vorräte (Konto gemäss Kontenplan) separat abstimmen
  feststellung_wenn: Fehlkontierung, unzulässige Verrechnung, Aufwand früherer Perioden nicht als periodenfremd erkennbar, Rabatte/Gutschriften falsch klassiert oder Bestandesänderung
    nicht abstimmbar.
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
  - quelle: hwp-bur-2023__rz-0262-s216
    zitat: mittels Durchsicht der einzelnen Aufwands- und Ertragskonten im Hinblick auf die richtige Periodenabgrenzung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: or__art-958c
    zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
  - quelle: hwp-bur-2023__rz-0232-s114
    zitat: Diese Bestandsänderungen können direkt im Waren- oder Materialaufwand erfasst werden.
  - quelle: ser-2022__6-1-3
    zitat: Einsicht in Belege, Abstimmung mit Auszügen, Durchsicht von Belegen in neuer Rechnung usw.
- id: SCH2-303
  vorgehen: 'WP-Schritt; gemäss SER weiter gehend. Nur auf ausdrückliche Anweisung des WP bearbeiten (Entscheid consis offen; Auslöser: Hinweise auf Abgrenzungsfehler aus SCH2-101/201/202
    oder erhöhtes inhärentes Risiko). Sonst Status «nicht bearbeitet – WP-Schritt», beobachtete Auslöser als Notiz für den WP; Visum offen. Bei Anordnung: Rechnungen/Lieferpapiere im
    Zeitfenster um 31.12. (Vorgabe WP) mit Buchungsperiode und OP-/PRA-Liste abgleichen.'
  nachweise:
  - Kreditorenjournal/Kontoblätter Folgejahr
  - Eingangsrechnungen mit Leistungsdatum
  - Lieferscheine/Wareneingänge, Montagerapporte
  - Kreditoren-OP-Liste, Liste passive Abgrenzungen 31.12.
  rechnen: A = Σ Leistungen/Lieferungen ≤ 31.12., die weder als Kreditor noch als passive Abgrenzung erfasst sind (Aufwand zu tief); B = Σ Leistungen/Lieferungen > 31.12., die im Berichtsjahr
    gebucht sind (Aufwand zu hoch); A und B je einzeln mit Schwelle/Toleranzwesentlichkeit vergleichen; Nettoeffekt A − B nur ergänzend ausweisen
  feststellung_wenn: A oder B einzeln über Schwelle bzw. Toleranzwesentlichkeit, oder Aufwand des Folgejahres im Berichtsjahr erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Einsicht in Rechnungen und Lieferpapiere vor und nach dem Periodenende zur Prüfung der richtigen zeitlichen Abgrenzung
  - quelle: ser-2022__anh-d-s092-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn
  - quelle: ser-2022__6-2-3
    zitat: ein erhöhtes inhärentes Risiko für wesentliche Fehlaussagen in der Jahresrechnung besteht
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
  - quelle: ser-2022__anh-d-s084-2
    zitat: Durchsicht von Wareneingangsbelegen für erhaltene Lieferungen kurz vor oder nach dem Jahresende
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht von Konten und/oder Belegen in neuer Rechnung auf Positionen, die das Berichtsjahr betreffen
  - quelle: ser-2022__6-1-2-t3
    zitat: Zudem besteht das Risiko, dass sich zwei oder mehrere Fehlaussagen teilweise kompensieren können
