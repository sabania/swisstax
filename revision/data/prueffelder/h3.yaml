- id: H3-304
  vorgehen: 'WP-Schritt (SER: weiter gehend): nur auf ausdrückliche Anweisung des WP. Ohne Anweisung: nicht bearbeiten, Status «nicht bearbeitet – WP-Schritt». Erkannte Auslöser aus
    H3-101/102/201/301 (z. B. Buchwert > anteiliges EK, wiederkehrende Verluste) mit Zahlen als Notiz «Schlussbesprechung» bzw. Pendenz an den WP. Bei Anweisung: Ertrags-/a.o. Konten
    durchsehen, Ausschüttungsbeschlüsse und Abrechnungen mit Erfassung (brutto, Periode) abgleichen; zeitgleiche Aktivierung: Voraussetzungen und Schema prüfen; KER-Ausschüttung als
    Ertrag.'
  nachweise:
  - Dividendenabrechnungen
  - GV-Protokolle/Ausschüttungsbeschlüsse der Beteiligungen
  - Kontoblätter Finanzertrag, VSt, a.o. Erfolg
  - Verkaufsabrechnungen
  rechnen: 'Nur für inländische, VSt-belastete Ausschüttungen: Bruttodividende = Nettogutschrift / (1 − 0.35), VSt = 35 % × Bruttodividende; nicht anwenden bei Ausschüttung aus Kapitaleinlagereserven
    (VSt-frei), Meldeverfahren (kein Abzug) oder ausländischer Dividende (Quellensteuer gemäss Abrechnung); Soll-Beteiligungsertrag gemäss Beschlüssen = gebuchter Ertrag'
  feststellung_wenn: Ertrag netto statt brutto oder in falscher Periode, zeitgleiche Aktivierung ohne Voraussetzungen/Anhangangabe, beschlossene Ausschüttung fehlt, KER-Ausschüttung
    mit Buchwert verrechnet oder Erfolg nicht belegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
