schritte:
- id: H3-101
  vorgehen: 'Schriftliche Kundenantwort (Kundenbefragung/Fragebogen) zu den Grundsätzen für Beteiligungen auswerten: Anschaffungskosten inkl. Nebenkosten, Einzel-/Gruppenbewertung, Wertberichtigungen,
    Erfassung Dividenden, Abgrenzung lang-/kurzfristig. Mit Anhang (Grundsätze) und Vorjahresakte abgleichen. Fehlt die Antwort: Frage als Pendenz, Schritt höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Kundenantwort/Fragebogen
  - Anhang Ziff. Grundsätze der Rechnungslegung
  - Beteiligungsverzeichnis
  - Vorjahres-Arbeitspapier
  rechnen: ''
  feststellung_wenn: Antwort widerspricht Buchhaltung/Anhang; Bewertung über Anschaffungskosten (z.B. Equity-Methode) oder Grundsätze ohne Begründung gegenüber Vorjahr geändert.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung über die angewandten Bilanzierungs- und Bewertungsgrundsätze
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Finanzanlagen
  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
  - quelle: hwp-bur-2023__rz-0281-s220
    zitat: Beteiligungen dürfen höchstens zu den Anschaffungskosten bewertet werden
- id: H3-102
  vorgehen: 'Schriftliche Stellungnahme der Geschäftsleitung zur Werthaltigkeit jeder Beteiligung auswerten (Anzeichen: Verluste, negativer Ausblick, Verkaufsangebote, Wegfall Betriebsnotwendigkeit)
    und mit Jahresrechnung/Ausblick der Beteiligung abgleichen. Fehlt die Stellungnahme: Frage als Pendenz und Punkt für die Schlussbesprechung; Beurteilung beim WP.'
  nachweise:
  - Stellungnahme GL/Werthaltigkeitsbeurteilung
  - Jahresrechnung der Beteiligung
  - Planungsrechnung/Budget der Beteiligung
  - VR-Protokolle
  rechnen: ''
  feststellung_wenn: Anzeichen einer Wertminderung (z.B. wiederkehrende Verluste, Verlustprognose) ohne Werthaltigkeitsbeurteilung oder Wertberichtigung, oder GL-Aussage widerspricht
    vorliegenden Abschlüssen.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Besprechung mit der Unternehmensleitung betreffend allfällige niedrigere Marktwerte
  - quelle: hwp-bur-2023__rz-0290-s221
    zitat: Die Prüfung auf Anzeichen für eine Wertminderung hat mindestens an jedem Abschlussstichtag zu erfolgen.
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Der Abschlussprüfer würdigt die erhaltenen Auskünfte in jedem Fall kritisch.
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- id: H3-201
  vorgehen: Beteiligungskonten, Wertberichtigungen und Beteiligungs-/Finanzerträge gemäss Saldoliste mit dem Vorjahr vergleichen und jede Veränderung über der Nicht-Aufgriffsgrenze einem
    Vorgang zuordnen (Kauf, Verkauf, Kapitalerhöhung, Zuschuss, Wertberichtigung, Dividende). Zugänge auf fremden Konten (z.B. Anzahlungen) und fehlende Erträge trotz bekannter Ausschüttung
    als Pendenz/Frage erfassen.
  nachweise:
  - Saldoliste LJ/VJ
  - Kontoblätter Beteiligungen/Finanzertrag
  - Beteiligungsverzeichnis LJ/VJ
  rechnen: 'Veränderung je Beteiligung = Buchwert 31.12. LJ − Buchwert 31.12. VJ; Kontrolle: Zugänge − Abgänge − Wertberichtigungen + Zuschreibungen = Veränderung; Beteiligungsertrag
    LJ vs. VJ (absolut und %)'
  feststellung_wenn: Veränderung nicht durch Vorgang/Beleg erklärbar, Zugang ausserhalb der Beteiligungskonten gebucht oder Ertrag/Wertberichtigung fehlt trotz entsprechendem Ereignis.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: hwp-er-2026__rz-0096-s197
    zitat: Untersuchungen von festgestellten Schwankungen, Abweichungen, Kennzahlenvergleiche etc.
  - quelle: hwp-er-2026__rz-0030-s183
    zitat: Zudem können analytische Prüfungshandlungen bei der Identifikation ungewöhnlicher Geschäftsvorfälle, Buchungen, Beträge oder Trends hilfreich sein.
- id: H3-301
  vorgehen: Bilanzposition Beteiligungen mit Hauptbuch und Beteiligungsverzeichnis abstimmen; je Beteiligung Bestand, Quote und Eigentum mit Depotauszug/Titel bzw. bei GmbH-Anteilen
    mit HR-Auszug und Kaufvertrag belegen; Stimmenanteil ≥ 20 % und Halteabsicht für die Klassierung prüfen. Körperliche Aufnahme führt der Agent nicht durch (Pendenz/Hinweis an WP).
  nachweise:
  - Beteiligungsverzeichnis 31.12.
  - Saldoliste/Kontoblätter
  - Depotauszug bzw. Titel 31.12.
  - HR-Auszug/Statuten der Beteiligung
  - Kaufvertrag
  rechnen: Summe Buchwerte Beteiligungsverzeichnis = Saldo Beteiligungskonten (netto nach Wertberichtigungen) = Bilanzposition Beteiligungen; Stimmenanteil = Stimmen gehalten / Stimmen
    total (≥ 20 % → Vermutung Beteiligung)
  feststellung_wenn: Differenz zwischen Verzeichnis, Hauptbuch und Bilanz; Eigentum nicht belegt; Beteiligung nicht gesondert im Anlagevermögen ausgewiesen bzw. unter anderer Position
    (z.B. Anzahlungen) gebucht.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Abstimmung einer Aufstellung der Finanzanlagen per Bilanzstichtag mit der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0280-s219
    zitat: Die Zusammensetzung der Bilanzposition Beteiligungen geht aus dem Beteiligungsverzeichnis hervor
  - quelle: hwp-bur-2023__rz-0304-s224
    zitat: Die Beteiligungen sind im Anlagevermögen gesondert auszuweisen.
  - quelle: or__art-960d
    zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 Prozent der Stimmrechte gewähren.
- id: H3-302
  vorgehen: 'Vorbereitung für den WP: je Beteiligung Buchwert mit anteiligem Eigenkapital (innerer Wert) gemäss letzter Jahresrechnung bzw. bei kotierten Titeln mit Jahresendkurs vergleichen;
    Anzeichen für Wertminderung und Werthaltigkeitsbeurteilung der GL zusammenstellen. Unterdeckungen im Textfeld mit Berechnung dokumentieren; Beurteilung und Entscheid beim WP.'
  nachweise:
  - Jahresrechnung/Revisionsbericht der Beteiligung
  - Jahresendkurs/Depotauszug
  - Werthaltigkeitsbeurteilung/Planungsrechnung GL
  - Kaufvertrag (Kaufpreisbasis)
  rechnen: 'Anteiliges EK = Eigenkapital Beteiligung × Kapitalquote; Unterdeckung = Buchwert − anteiliges EK (> 0: Begründung Ertragswert/Goodwill verlangen); kotiert: Kurswert = Stückzahl
    × Jahresendkurs, Vergleich mit Buchwert'
  feststellung_wenn: Buchwert über anteiligem EK bzw. Kurswert ohne nachvollziehbare Ertragswertbegründung, wiederkehrende Verluste ohne Wertberichtigung oder Bewertung über Anschaffungskosten.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vergleich der Buchwerte nicht kotierter Wertpapiere mit dem inneren Wert aufgrund der letzten verfügbaren Jahresrechnung
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vergleich der Buchwerte kotierter Wertpapiere mit den Jahresendkursen
  - quelle: hwp-bur-2023__rz-0291-s222
    zitat: Sinkt der erzielbare Wert einer Beteiligung unter den bisherigen Buchwert, wird eine Wertberichtigung erforderlich.
  - quelle: hwp-bur-2023__rz-0292-s222
    zitat: beispielsweise eine Substanzwertbetrachtung oder eine einfache Ertragswertermittlung anhand einer Planungsrechnung
- id: H3-303
  vorgehen: 'Vorbereitung für den WP: alle Buchungen auf Beteiligungs- und Wertberichtigungskonten (Zu-/Abgänge, Kapitalerhöhungen, Zuschüsse, Wertberichtigungen, Zuschreibungen) mit
    Belegen (Kaufvertrag, Zahlung, VR-Beschluss, HR) und Gegenkonto abgleichen; Anschaffungskosten und Abgangserfolg nachrechnen. Abweichungen mit Konto, Datum, Betrag im Textfeld festhalten.'
  nachweise:
  - Kontoblätter Beteiligungen/Wertberichtigungen
  - Kauf-/Verkaufsverträge
  - Bankbelege
  - VR-/GV-Protokolle
  - HR-Auszüge
  rechnen: Anschaffungskosten = Kaufpreis + transaktionsbezogene Nebenkosten (ohne Finanzierungskosten); Veräusserungserfolg = Erlös − Buchwert; Buchung = Beleg (Betrag, Datum, Gegenkonto)
  feststellung_wenn: Buchung ohne Beleg oder abweichend in Betrag/Datum/Gegenkonto, Goodwill oder Gratisaktien separat aktiviert, Zuschreibung über AK oder Abgang nicht zum Buchwert
    erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Prüfung der im Hauptbuch gebuchten Geschäftsfälle und Wertänderungen anhand der Unterlagen und der Gegenbuchungen
  - quelle: hwp-bur-2023__rz-0281-s220
    zitat: transaktionsbezogene Nebenkosten wie Courtagen, Kommissionen und Spesen (nicht aber Finanzierungskosten)
  - quelle: hwp-bur-2023__rz-0279-s219
    zitat: Abgänge sind zum Buchwert zu erfassen, damit realisierte Gewinne oder Verluste ausgewiesen werden können.
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
- id: H3-304
  vorgehen: 'Vorbereitung für den WP: Beteiligungs-, Finanzertrags- und ausserordentliche Konten durchsehen; Ausschüttungsbeschlüsse und Dividendenabrechnungen der Beteiligungen mit
    der Erfassung (brutto, Periode, VSt-Guthaben) abgleichen; Veräusserungsgewinne/-verluste und Wertberichtigungen mit Belegen abstimmen.'
  nachweise:
  - Dividendenabrechnungen
  - GV-Protokolle/Ausschüttungsbeschlüsse der Beteiligungen
  - Kontoblätter Finanzertrag, VSt, a.o. Erfolg
  - Verkaufsabrechnungen
  rechnen: Bruttodividende = Nettogutschrift / (1 − 0.35); VSt = 35 % × Bruttodividende; Soll-Beteiligungsertrag gemäss Beschlüssen = gebuchter Ertrag
  feststellung_wenn: Ertrag netto statt brutto oder in falscher Periode erfasst, beschlossene Ausschüttung nicht erfasst, Veräusserungserfolg oder Wertberichtigung nicht belegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Durchsicht von Konten und Belegen, ob Gewinne, Verluste und Erträge ordnungsgemäss erfasst worden sind
  - quelle: hwp-bur-2023__rz-0319-s226
    zitat: gilt als Realisationszeitpunkt des Beteiligungsertrags normalerweise der Ausschüttungsbeschluss oder das Datum der Ausschüttung
  - quelle: treuhand-almanach-2026__s068-1
    zitat: 35 % auf Kapitalerträgen und Lotteriegewinnen
- id: H3-320
  vorgehen: 'Anhang prüfen auf: Beteiligungen mit Firma, Rechtsform, Sitz, Kapital- und Stimmenanteil; eigene Anteile; gesonderter Ausweis Forderungen/Verbindlichkeiten gegenüber Beteiligungen;
    Sicherheiten, verpfändete Aktiven, Eventualverbindlichkeiten; Hinweis bei Börsenkursbewertung. Angaben mit Beteiligungsverzeichnis abgleichen; Lücken als Wesentliche Feststellung
    vorschlagen.'
  nachweise:
  - Anhang Jahresrechnung
  - Beteiligungsverzeichnis
  - Vollständigkeitserklärung
  rechnen: ''
  feststellung_wenn: Pflichtangabe nach Art. 959c Abs. 2 Ziff. 3–5 und 8–10 OR fehlt oder weicht vom Beteiligungsverzeichnis ab (Quote, Sitz, Rechtsform).
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach direkt oder wesentlichen indirekt gehaltenen Anteilen an anderen Unternehmen
  - quelle: or__art-959a-t2
    zitat: gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- id: H3-321
  vorgehen: Aufstellung der stillen Reserven des Kunden einholen; Anteil Beteiligungen (Differenz Buchwert zu Höchstwert = Anschaffungskosten bzw. tieferer erzielbarer Wert) mit den
    Ergebnissen aus H3-302 plausibilisieren und mit Vorjahr vergleichen. Wesentliche Nettoauflösung an Anhangprüfung melden; fehlende Aufstellung als Pendenz.
  nachweise:
  - Aufstellung stille Reserven LJ/VJ
  - Beteiligungsverzeichnis
  - Vollständigkeitserklärung
  rechnen: Stille Reserven Beteiligung = min(Anschaffungskosten; erzielbarer Wert) − Buchwert; Veränderung = Bestand LJ − Bestand VJ (negativ = Auflösung)
  feststellung_wenn: Aufstellung fehlt, widerspricht den Prüfungsergebnissen oder zeigt eine wesentliche Nettoauflösung ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
- id: H3-322
  vorgehen: 'Dauerakte Beteiligungen in M-Files sichten: Beteiligungsverzeichnis, Kauf- und Aktionärsbindungsverträge, Statuten und HR-Auszüge der Beteiligungen, Nachschuss-/Garantieverpflichtungen.
    Neue oder geänderte Dokumente als Vorschlag zur Ablage erfassen, Veraltetes kennzeichnen; nichts löschen.'
  nachweise:
  - Dauerakte M-Files
  - neue Verträge/HR-Auszüge des Geschäftsjahres
  rechnen: ''
  feststellung_wenn: Wesentliche Verträge oder Registerauszüge zu neuen oder geänderten Beteiligungen fehlen in der Dauerakte (Pendenz).
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben, wie beispielsweise wichtige Verträge, Registerauszüge, Statuten etc.
- id: H3-401
  vorgehen: Aktienbuch/Anteilbuch, HR-Auszug und Konten auf eigene Anteile durchsehen (auch von kontrollierten Gesellschaften gehaltene); Bestand mit Minusposten im Eigenkapital (Anschaffungswert)
    und Anhangangabe abstimmen; Grenze 10 % und frei verwendbares Eigenkapital nachrechnen. Ergebnis mit Prüffeld Eigenkapital abstimmen.
  nachweise:
  - Aktienbuch/Anteilbuch
  - HR-Auszug/Statuten
  - Kaufverträge eigene Anteile
  - Kontoblatt eigene Kapitalanteile
  - Anhang
  rechnen: Anzahl Titel gemäss Statuten/HR = Summe Titel im Aktienbuch + eigene Anteile; Nennwert eigene Anteile / im HR eingetragenes Kapital ≤ 10 %; Minusposten = Σ Anschaffungswerte
  feststellung_wenn: Eigene Anteile nicht als Minusposten ausgewiesen, über 10 % bzw. ohne frei verwendbares EK erworben, Anhangangabe fehlt oder Aktienbuch nicht mit Aktienkapital abstimmbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Feststellen des Bestands an eigenen Kapitalanteilen
  - quelle: or__art-659
    zitat: Der Erwerb eigener Aktien ist auf 10 Prozent des im Handelsregister eingetragenen Aktienkapitals beschränkt.
  - quelle: or__art-659a
    zitat: Die Gesellschaft hat in der Bilanz für die eigenen Aktien einen dem Anschaffungswert entsprechenden Betrag als Minusposten des Eigenkapitals darzustellen
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile durch das Unternehmen selbst oder durch Unternehmen, an denen eine Beteiligung besteht
- id: H3-402
  vorgehen: Aus Statuten/HR-Auszug der Beteiligungen (Liberierung, Nachschusspflicht), Kredit- und Pfandverträgen sowie Garantie-/Bürgschafts-/Patronatserklärungen die Verpflichtungen
    gegenüber Beteiligungsgesellschaften und Verpfändungen festhalten; mit Anhang (Sicherheiten, verpfändete Aktiven, Eventualverbindlichkeiten) und Vollständigkeitserklärung abgleichen.
    Fehlende Angaben als Frage/Pendenz.
  nachweise:
  - Statuten/HR-Auszug der Beteiligung
  - Kredit- und Pfandverträge, Bankbestätigung
  - Garantien/Bürgschaften/Patronatserklärungen
  - Anhang
