- id: H3-404
  vorgehen: Zusammensetzung der Beteiligungen und Wertschriften nach Gesellschaft, Branche, Währung und Land auswerten; Anteil je Position am Total Beteiligungen, an den Aktiven und
    am Eigenkapital berechnen; Klumpen-, Währungs- und Transferrisiken im Textfeld festhalten und an den WP melden.
