# Prüffeld H3 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: H3
bezeichnung: Beteiligungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: true
kurzbeschrieb: 'Beteiligungen (langfristig, massgeblicher Einfluss ab 20 % Stimmen vermutet), Erträge, eigene Anteile, VSt-Guthaben. ER: Befragung, VJ-Vergleich, Abstimmung mit JR, Anhang.
  Bewertung, Belegprüfung, Ertragsdurchsicht, Bonität (302–304, 403) weiter gehend: nur auf Anweisung WP, Auslöser melden.'
gesetz:
- thema: Begriff Beteiligung, Vermutung massgeblicher Einfluss ab 20 % (Art. 960d Abs. 3 OR)
  quelle: or__art-960d
  zitat: Als Beteiligungen gelten Anteile am Kapital eines anderen Unternehmens, die langfristig gehalten werden und einen massgeblichen Einfluss vermitteln.
- thema: 'Mindestgliederung: Beteiligungen gesondert im Anlagevermögen (Art. 959a Abs. 1 Ziff. 2 OR)'
  quelle: or__art-959a-t1
  zitat: a. Finanzanlagen, b. Beteiligungen,
- thema: Forderungen/Verbindlichkeiten gegenüber Beteiligungen gesondert (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- thema: 'Anhang: Beteiligungen mit Kapital- und Stimmenanteil (Art. 959c Abs. 2 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
- thema: 'Anhang: Anzahl eigener Anteile (Art. 959c Abs. 2 Ziff. 4 OR)'
  quelle: or__art-959c-t1
  zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
- thema: 'Anhang: Erwerb und Veräusserung eigener Anteile mit Bedingungen (Art. 959c Abs. 2 Ziff. 5 OR)'
  quelle: or__art-959c-t1
  zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
- thema: 'Anhang: Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten (Art. 959c Abs. 2 Ziff. 8 OR)'
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: 'Anhang: zur Sicherung eigener Verbindlichkeiten verwendete (verpfändete) Aktiven (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: Eventualverbindlichkeiten (Art. 959c Abs. 2 Ziff. 10 OR)'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
    übersteigt
- thema: Bestandsnachweis durch Inventar (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Einzelbewertung, Vorsicht, Überprüfung bei Anzeichen einer Überbewertung (Art. 960 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Höchstbewertung Anschaffungskosten, Wertberichtigungen (Art. 960a Abs. 1–3 OR)
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Zusätzliche Wertberichtigungen (stille Reserven) zulässig (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Bewertung zum Börsenkurs/beobachtbaren Marktpreis (Art. 960b OR)
  quelle: or__art-960b
  zitat: In der Folgebewertung dürfen Aktiven mit Börsenkurs oder einem anderen beobachtbaren Marktpreis in einem aktiven Markt zum Kurs oder Marktpreis am Bilanzstichtag bewertet werden
- thema: 'Anhang: Hinweis auf Bewertung zum Kurs/Marktpreis (Art. 960b Abs. 1 OR)'
  quelle: or__art-960b
  zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
- thema: Aufwertung nur zur Behebung von Kapitalverlust/Überschuldung, höchstens bis zum wirklichen Wert (Art. 725c Abs. 1 Satz 1 OR)
  quelle: or__art-725c
  zitat: dürfen Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs- oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden
- thema: Aufwertungsreserve gesondert unter der gesetzlichen Gewinnreserve (Art. 725c Abs. 1 Satz 2 OR)
  quelle: or__art-725c
  zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
- thema: Aufwertung von Beteiligungen nur mit schriftlicher Bestätigung (Art. 725c Abs. 2 OR)
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten
    sind.
- thema: 'Eigene Aktien: Erwerb nur mit frei verwendbarem Eigenkapital in Höhe des Anschaffungswerts (Art. 659 Abs. 1 OR)'
  quelle: or__art-659
  zitat: Die Gesellschaft darf eigene Aktien nur dann erwerben, wenn frei verwendbares Eigenkapital in der Höhe des Anschaffungswerts vorhanden ist.
- thema: 'Eigene Aktien: Grenze 10 % des im HR eingetragenen Aktienkapitals (Art. 659 Abs. 2 OR)'
  quelle: or__art-659
  zitat: Der Erwerb eigener Aktien ist auf 10 Prozent des im Handelsregister eingetragenen Aktienkapitals beschränkt.
- thema: 'Eigene Aktien: Höchstgrenze 20 % bei Übertragbarkeitsbeschränkung oder Auflösungsklage (Art. 659 Abs. 3 OR)'
  quelle: or__art-659
  zitat: Steht der Erwerb im Zusammenhang mit einer Übertragbarkeitsbeschränkung oder einer Auflösungsklage, so beträgt die Höchstgrenze 20 Prozent.
- thema: Eigene Aktien als Minusposten zum Anschaffungswert (Art. 659a Abs. 4 OR)
  quelle: or__art-659a
  zitat: Die Gesellschaft hat in der Bilanz für die eigenen Aktien einen dem Anschaffungswert entsprechenden Betrag als Minusposten des Eigenkapitals darzustellen
- thema: 'Erwerb durch kontrollierte Unternehmen: Regeln über eigene Aktien sinngemäss (Art. 659b Abs. 1 OR)'
  quelle: or__art-659b
  zitat: so gelten für den Erwerb ihrer Aktien durch diese Unternehmen die Voraussetzungen, Einschränkungen und Folgen für den Erwerb eigener Aktien sinngemäss
- thema: 'Aktien der Muttergesellschaft im Besitz kontrollierter Unternehmen: gesonderte gesetzliche Gewinnreserve (Art. 659b Abs. 2 OR)'
  quelle: or__art-659b
  zitat: einen dem Anschaffungswert dieser Aktien entsprechenden Betrag gesondert als gesetzliche Gewinnreserve auszuweisen
- thema: 'Eigene Stammanteile GmbH: frei verwendbares Eigenkapital (Art. 783 Abs. 1 OR)'
  quelle: or__art-783
  zitat: Die Gesellschaft darf eigene Stammanteile nur dann erwerben, wenn frei verwendbares Eigenkapital in der Höhe der dafür nötigen Mittel vorhanden ist
- thema: 'Eigene Stammanteile GmbH: Grenze 10 % des Stammkapitals (Art. 783 Abs. 1 OR)'
  quelle: or__art-783
  zitat: der gesamte Nennwert dieser Stammanteile zehn Prozent des Stammkapitals nicht übersteigt
- thema: 'Eigene Stammanteile GmbH: Höchstgrenze 35 % bei Übertragbarkeitsbeschränkung, Austritt, Ausschluss (Art. 783 Abs. 2 OR)'
  quelle: or__art-783
  zitat: Werden im Zusammenhang mit einer Übertragbarkeitsbeschränkung, einem Austritt oder einem Ausschluss Stammanteile erworben, so beträgt die Höchstgrenze 35 Prozent.
- thema: Einzahlungspflicht nicht voll liberierter Namenaktien (Art. 687 OR)
  quelle: or__art-687
  zitat: Der Erwerber einer nicht voll einbezahlten Namenaktie ist der Gesellschaft gegenüber zur Einzahlung verpflichtet, sobald er im Aktienbuch eingetragen ist.
- thema: Nachschusspflicht bei GmbH-Stammanteilen (Art. 795 OR)
  quelle: or__art-795
  zitat: Sehen die Statuten eine Nachschusspflicht vor, so müssen sie den Betrag der mit einem Stammanteil verbundenen Nachschusspflicht festlegen.
- thema: Abtretung von Stammanteilen nur schriftlich (Art. 785 Abs. 1 OR)
  quelle: or__art-785
  zitat: Die Abtretung von Stammanteilen sowie die Verpflichtung zur Abtretung bedürfen der schriftlichen Form.
- thema: Abtretung von Stammanteilen braucht von Gesetzes wegen die Zustimmung der Gesellschafterversammlung; nur die Statuten können verzichten (Art. 786 Abs. 1 und Abs. 2 Ziff. 1 OR)
  quelle: or__art-786
  zitat: Die Abtretung von Stammanteilen bedarf der Zustimmung der Gesellschafterversammlung.
- thema: Abtretung erst mit erforderlicher Zustimmung der Gesellschafterversammlung rechtswirksam (Art. 787 Abs. 1 OR)
  quelle: or__art-787
  zitat: Ist für die Abtretung von Stammanteilen die Zustimmung der Gesellschafterversammlung erforderlich, so wird die Abtretung erst mit dieser Zustimmung rechtswirksam.
- thema: Zustimmung gilt als erteilt ohne Ablehnung innert sechs Monaten (Art. 787 Abs. 2 OR)
  quelle: or__art-787
  zitat: Lehnt die Gesellschafterversammlung das Gesuch um Zustimmung zur Abtretung nicht innerhalb von sechs Monaten nach Eingang ab, so gilt die Zustimmung als erteilt.
- thema: Konzernrechnungspflicht bei Kontrolle anderer Unternehmen (Art. 963 Abs. 1 OR)
  quelle: or__art-963
  zitat: Kontrolliert eine rechnungslegungspflichtige juristische Person ein oder mehrere rechnungslegungspflichtige Unternehmen
- thema: Kontrolle u.a. bei Stimmenmehrheit im obersten Organ (Art. 963 Abs. 2 Ziff. 1 OR)
  quelle: or__art-963
  zitat: direkt oder indirekt über die Mehrheit der Stimmen im obersten Organ verfügt
- thema: Befreiung von der Konzernrechnungspflicht bei kontrollierten Beteiligungen (Art. 963a OR)
  quelle: or__art-963a
  zitat: zusammen mit den kontrollierten Unternehmen zwei der nachstehenden Grössen in zwei aufeinander folgenden Geschäftsjahren nicht überschreitet
- thema: Konzernrechnung trotz Grössenbefreiung (Art. 963a Abs. 2 OR)
  quelle: or__art-963a
  zitat: Eine Konzernrechnung ist dennoch zu erstellen, wenn
- thema: Konzernrechnungspflicht → ordentliche Revision, Pflicht entsteht unmittelbar (Art. 727 Abs. 1 Ziff. 3 OR; HWP ER Rz 310/336)
  quelle: or__art-727
  zitat: Gesellschaften, die zur Erstellung einer Konzernrechnung verpflichtet sind.
- thema: Verrechnungssteuer 35 % auf Kapitalerträgen (Art. 13 Abs. 1 Bst. a VStG)
  quelle: vstg__art-13
  zitat: 35 Prozent der steuerbaren Leistung
- thema: VSt-Forderung entsteht mit Fälligkeit der steuerbaren Leistung (Art. 12 Abs. 1 VStG)
  quelle: vstg__art-12
  zitat: entsteht die Steuerforderung im Zeitpunkt, in dem die steuerbare Leistung fällig wird
- thema: Meldeverfahren statt Steuerentrichtung, insbesondere bei Dividenden im Konzernverhältnis (Art. 20 Abs. 2 VStG)
  quelle: vstg__art-20
  zitat: Das Meldeverfahren ist insbesondere bei Dividendenausschüttungen und geldwerten Leistungen im inländischen und grenzüberschreitenden Konzernverhältnis zuzulassen.
- thema: Meldeverfahren für Dividenden möglich bei unmittelbarer Beteiligung von mindestens 10 % (Anweisung mit amtlichem Formular; Art. 26a Abs. 1 VStV)
  quelle: vstv__art-26a
  zitat: unmittelbar zu mindestens 10 Prozent am Grund- oder Stammkapital einer Kapitalgesellschaft oder Genossenschaft beteiligt, so kann sie diese mittels eines amtlichen Formulars
    anweisen, ihr die Dividende ohne Abzug der Verrechnungssteuer auszurichten
- thema: Rückerstattungsanspruch verwirkt, wenn VSt-belastete Einkünfte nicht ordnungsgemäss als Ertrag verbucht sind (Art. 25 Abs. 1 VStG)
  quelle: vstg__art-25
  zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung der von diesen Einkünften abgezogenen
    Verrechnungssteuer
- thema: Rückerstattungsantrag VSt frühestens nach Ablauf des Fälligkeitsjahres (Art. 29 Abs. 2 VStG)
  quelle: vstg__art-29
  zitat: Der Antrag kann frühestens nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt werden.
- thema: Erlöschen des VSt-Rückerstattungsanspruchs nach drei Jahren (Art. 32 Abs. 1 VStG)
  quelle: vstg__art-32
  zitat: Der Anspruch auf Rückerstattung erlischt, wenn der Antrag nicht innert drei Jahren nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt
    wird.
- thema: 'Eigene Beteiligungsrechte über den Rahmen von Art. 659/783 OR: Verrechnungssteuer (Art. 4a Abs. 1 VStG)'
  quelle: vstg__art-4a-t1
  zitat: Dasselbe gilt, soweit der Erwerb eigener Beteiligungsrechte den Rahmen der Artikel 659 oder 783 des Obligationenrechts (OR) überschreitet.
- thema: 'Eigene Beteiligungsrechte im Rahmen von Art. 659/783 OR: Verrechnungssteuer, wenn nicht innert sechs Jahren wieder veräussert (Art. 4a Abs. 2 VStG)'
  quelle: vstg__art-4a-t1
  zitat: so gilt Absatz 1 sinngemäss, wenn die Gesellschaft oder die Genossenschaft diese Beteiligungsrechte nicht innerhalb von sechs Jahren wieder veräussert
risiken:
- text: 'Bewertung: Beteiligung trotz Verlusten, negativem Ausblick oder Substanzverzehr der Beteiligungsgesellschaft ohne Wertberichtigung über dem erzielbaren Wert bilanziert.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0290-s221
  zitat: unter den Erwartungen liegende Gewinne oder wiederkehrende Verluste bei der Beteiligung
- text: Bewertung über Anschaffungskosten (Equity-Methode, Zuschreibung über AK, Aufwertung ohne Voraussetzungen nach Art. 725c OR).
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0295-s223
  zitat: ist für den handelsrechtlichen Einzelabschluss in der Schweiz nicht zulässig, falls dies zu einer Bewertung über den Anschaffungswert bzw. tieferen erzielbaren Wert führen würde
- text: 'Ausweis/Klassifikation: Beteiligung nicht gesondert im Anlagevermögen, sondern unter Finanzanlagen, Forderungen oder Anzahlungen erfasst bzw. Abgrenzung zu Darlehen und Wertschriften
    falsch.'
  pruefziele:
  - DO
  - EX
  quelle: hwp-bur-2023__rz-0304-s224
  zitat: Die Beteiligungen sind im Anlagevermögen gesondert auszuweisen.
- text: 'Bestand/Eigentum: Beteiligung bilanziert ohne Nachweis (Titel, Depotauszug, HR-Auszug, Kaufvertrag) oder Quote/Stimmrechte unrichtig erfasst.'
  pruefziele:
  - EX
  - RV
  quelle: hwp-bur-2023__rz-0280-s219
  zitat: gelten beispielsweise Bestätigungen der jeweiligen Beteiligung, Handelsregisterauszüge, Verträge, Statuten oder Aktienregister als Bestandsnachweis
- text: 'Eigentum an GmbH-Stammanteilen nicht übergegangen: Abtretung ohne Schriftform oder ohne Zustimmung der Gesellschafterversammlung (gesetzlich nötig, Art. 786 Abs. 1 OR, ausser
    die Statuten verzichten) – Abtretung noch nicht rechtswirksam.'
  pruefziele:
  - EX
  - RV
  quelle: or__art-787
  zitat: so wird die Abtretung erst mit dieser Zustimmung rechtswirksam
- text: 'Anschaffungskosten falsch: transaktionsbezogene Nebenkosten fehlen, Finanzierungskosten aktiviert, aufgeschobene oder bedingte Kaufpreiszahlungen (Earn-out) nicht erfasst.'
  pruefziele:
  - BE
  - VO
  quelle: hwp-bur-2023__rz-0281-s220
  zitat: Bedingte Kaufpreiszahlungen (beispielsweise earn-out) sind dann zusammen mit der entsprechenden Verbindlichkeit oder Rückstellung zu erfassen
- text: Goodwill aus dem Kaufpreis separat bilanziert statt in den Anschaffungskosten der Beteiligung; Gratisaktien aktiviert.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0282-s220
  zitat: Ein allfälliger beim Erwerb der Beteiligung im Kaufpreis enthaltener Goodwill wird in den Anschaffungskosten der Beteiligung subsumiert und darf nicht gesondert bilanziert werden.
- text: 'Periodenabgrenzung Beteiligungserträge: Dividende vor Ausschüttungsbeschluss bzw. zeitgleich aktiviert, ohne dass Voraussetzungen (Stichtag, GV-Beschluss Tochter vor GV Mutter,
    Anhangangabe) und Buchungsschema (aktive Rechnungsabgrenzung, Rückbuchung, Realisierung bei Fälligkeit) eingehalten sind.'
  pruefziele:
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0322-s227
  zitat: Erst bei Fälligkeit der steuerbaren Leistung darf der Beteiligungsertrag definitiv realisiert werden.
- text: Beteiligungsertrag netto statt brutto oder gar nicht erfasst; Anspruch auf Rückerstattung verwirkt, wenn der Ertrag nicht ordnungsgemäss (brutto) als Ertrag verbucht ist (Art.
    25 Abs. 1 VStG).
  pruefziele:
  - VO
  - BE
  quelle: vstg__art-25
  zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung der von diesen Einkünften abgezogenen
    Verrechnungssteuer
- text: Ausschüttung aus Kapitaleinlagereserven direkt mit dem Beteiligungsbuchwert verrechnet statt als Beteiligungsertrag erfasst (allfällige Wertkorrektur über den Aufwand).
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0324-s227
  zitat: sind diese über den Aufwand zu erfassen und nicht mit der erhaltenen Ausschüttung zu verrechnen
- text: Nicht erfasste Verpflichtungen gegenüber Beteiligungsgesellschaften (nicht liberierte Titel, Nachschusspflichten, Garantien, Patronatserklärungen) bzw. Verpfändungen von Beteiligungen.
  pruefziele:
  - VO
  - DO
  - BE
  quelle: hwp-bur-2023__rz-0279-s219
  zitat: Aufbewahrungsort der Titel sowie Hinweise auf Einzahlungs- und Nachschusspflichten
- text: Besondere Haftung (z. B. GmbH-Anteile mit Nachschusspflicht) nicht als Anzeichen einer Wertminderung berücksichtigt.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0290-s221
  zitat: besondere Haftung (besonders bei GmbH-Anteilen mit Nachschusspflicht)
- text: 'Eigene Anteile: Bestand nicht erkannt, nicht als Minusposten ausgewiesen, gesetzliche Grenzen (10 %, Ausnahmen 20 % AG / 35 % GmbH) oder frei verwendbares EK nicht eingehalten
    oder Anhangangabe fehlt.'
  pruefziele:
  - EX
  - DO
  - BE
  quelle: hwp-bur-2023__rz-0637-s291
  zitat: Eigene Kapitalanteile, die das bilanzierende Unternehmen selbst hält, sind als Minusposten im Eigenkapital auszuweisen
- text: 'Anhang unvollständig: Beteiligungen mit Kapital-/Stimmenanteil, Forderungen/Verbindlichkeiten gegenüber Beteiligungen, Hinweis auf Kursbewertung, zeitgleich aktivierte Beteiligungserträge
    oder wesentliche Nettoauflösung stiller Reserven nicht offengelegt.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0304-s224
  zitat: Jede direkte und jede wesentliche indirekte Beteiligung muss im Anhang einzeln aufgeführt werden
- text: Gesamtengagement gegenüber einer Tochter (Beteiligung plus Darlehen/Forderungen) nicht gesamthaft auf Werthaltigkeit beurteilt; Wertberichtigung falsch zugeordnet.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0293-s222
  zitat: Wertberichtigungen zuerst der Beteiligung, dann nachrangig gewährten Finanzierungen und schliesslich den übrigen Forderungen des Unternehmens gegenüber dem Tochterunternehmen
    zuzuordnen
- text: Erwerb von bzw. Geschäfte mit nahestehenden Personen (Verkäufer, Beteiligungsgesellschaft) nicht zu marktüblichen Bedingungen, z. B. Kaufpreis deutlich über dem inneren Wert
    ohne Ertragswertbegründung; Offenlegung fehlt.
  pruefziele:
  - BE
  - DO
  quelle: hwp-er-2026__rz-0157-s211
  zitat: Transaktionen mit nahestehenden Personen möglicherweise nicht zu marktüblichen Bedingungen abgewickelt werden
unterlagen:
- dokument: Beteiligungsverzeichnis per 31.12. (Firma, Rechtsform, Sitz, Anzahl/Nominal, Kapital- und Stimmenanteil, Anschaffungswert, Steuerwert, Buchwert, Aufwertungen Art. 725c OR,
    Wertberichtigungen, Aufbewahrungsort, Einzahlungs-/Nachschusspflichten)
  zweck: H3-301 Abstimmung Bestand, H3-302 Steuerwert/Aufwertungen, H3-320 Anhang, H3-402 Verpflichtungen
  quelle: hwp-bur-2023__rz-0279-s219
  zitat: Zweckmässig ist die Führung eines Beteiligungsverzeichnisses
- dokument: Kauf-/Verkaufsverträge, Zahlungsbelege, VR-Beschlüsse zu Zu- und Abgängen, Kapitalerhöhungen und Zuschüssen
  zweck: H3-301 Bestand, H3-303 Anschaffungskosten und Gegenbuchungen
  quelle: hwp-er-2026__rz-0119-s201
  zitat: Korrespondenzen mit Rechtsanwälten, Kaufverträge, langfristige Liefervereinbarungen
- dokument: Depotauszug bzw. Titel per 31.12.; bei GmbH-Anteilen HR-Auszug, Statuten, Gesellschafter-/Aktienregister der Beteiligung
