bewertung:
- regel: Höchstwert Anschaffungskosten; dazu gehören transaktionsbezogene Nebenkosten, nicht aber Finanzierungskosten.
  quelle: hwp-bur-2023__rz-0281-s220
  zitat: Zu den Anschaffungskosten gehören neben dem Kaufpreis der eigentlichen Kapitalanteile auch transaktionsbezogene Nebenkosten wie Courtagen, Kommissionen und Spesen (nicht aber
    Finanzierungskosten)
- regel: Keine planmässigen Abschreibungen, sondern Wertberichtigungen bei Wertverlust; Prüfung auf Anzeichen einer Wertminderung an jedem Abschlussstichtag.
  quelle: hwp-bur-2023__rz-0290-s221
  zitat: Die Prüfung auf Anzeichen für eine Wertminderung hat mindestens an jedem Abschlussstichtag zu erfolgen.
- regel: 'Wertminderungstest: Buchwert vs. erzielbarer Wert (höherer aus Nutzwert und Netto-Marktwert).'
  quelle: hwp-bur-2023__rz-0291-s222
  zitat: wird der Buchwert der Beteiligung mit dem erzielbaren Wert (höherer Wert aus Nutzwert und Netto-Marktwert) verglichen
- regel: Einzelbewertung; Gruppenbewertung nur in sachlich begründeten Einzelfällen (wirtschaftliche Einheit, kleinstmögliche Gruppe).
  quelle: hwp-bur-2023__rz-0289-s221
  zitat: Beteiligungen sind in der Regel einzeln zu bewerten (Art. 960 Abs. 1 OR).
- regel: Aufgeschobene und bedingte Kaufpreiszahlungen (Earn-out) gehören zu den Anschaffungskosten; bedingte, sobald die Ansatzkriterien erfüllt sind, zusammen mit Verbindlichkeit bzw.
    Rückstellung; Schätzungsänderungen erfolgsneutral.
  quelle: hwp-bur-2023__rz-0281-s220
  zitat: Bedingte Kaufpreiszahlungen (beispielsweise earn-out) sind dann zusammen mit der entsprechenden Verbindlichkeit oder Rückstellung zu erfassen, wenn deren Ansatzkriterien erfüllt
    sind
- regel: Im Kaufpreis enthaltener Goodwill ist Teil der Anschaffungskosten der Beteiligung und wird nicht separat bilanziert.
  quelle: hwp-bur-2023__rz-0282-s220
  zitat: Ein allfälliger beim Erwerb der Beteiligung im Kaufpreis enthaltener Goodwill wird in den Anschaffungskosten der Beteiligung subsumiert
- regel: Gratisaktien dürfen nicht aktiviert werden.
  quelle: hwp-bur-2023__rz-0283-s220
  zitat: Eine Aktivierung von Gratisaktien ist nicht zulässig
- regel: Bei unwesentlichen oder unproblematischen Beteiligungen genügen summarische Überlegungen (Substanzwert, einfache Ertragswertermittlung); sonst vertiefte Abklärungen.
  quelle: hwp-bur-2023__rz-0292-s222
  zitat: Andernfalls sind vertiefte Abklärungen vorzunehmen.
- regel: Equity-Bewertung im Einzelabschluss unzulässig, soweit sie über Anschaffungswert bzw. tieferen erzielbaren Wert führt.
  quelle: hwp-bur-2023__rz-0295-s223
  zitat: ist für den handelsrechtlichen Einzelabschluss in der Schweiz nicht zulässig
- regel: 'Fremdwährungsbeteiligung: Buchwert mit dem zum Stichtagskurs umgerechneten anteiligen Unternehmenswert vergleichen.'
  quelle: hwp-bur-2023__rz-0296-s223
  zitat: mit dem zum Bilanzstichtagskurs umgerechneten anteiligen Unternehmenswert der Beteiligung
- regel: Kotierte Beteiligungen können zum Börsenkurs bewertet werden (aktiver Markt, Paketgrösse); nicht kotierte in der Regel nicht.
  quelle: hwp-bur-2023__rz-0298-s223
  zitat: Beteiligungen an nicht kotierten Unternehmen erfüllen die Anforderungen an eine Bilanzierung zu einem beobachtbaren Marktpreis in der Regel nicht.
- regel: 'Plausibilisierung über Konzernrechnung: Liegt das konsolidierte Eigenkapital unter dem der Muttergesellschaft, Beteiligungsbewertung kritisch hinterfragen.'
  quelle: hwp-bur-2023__rz-0297-s223
  zitat: Liegt das konsolidierte Eigenkapital unter demjenigen der Muttergesellschaft, ist die Bewertung der Beteiligungen im Einzelabschluss kritisch zu hinterfragen.
- regel: Aufwertung über die Anschaffungskosten nur zur Behebung von Kapitalverlust/Überschuldung, höchstens bis zum wirklichen Wert, mit schriftlicher Bestätigung; Aufwertungsreserve
    gesondert ausweisen.
  quelle: or__art-725c
  zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
- regel: Sanierungszahlungen an Töchter grundsätzlich aktivierbar, aber Werthaltigkeit überprüfen.
  quelle: hwp-bur-2023__rz-0285-s221
  zitat: Zahlungen an sanierungsbedürftige Tochtergesellschaften (z.B. im Rahmen einer Kapitalerhöhung oder als Sanierungszuschuss) sind grundsätzlich aktivierbar
- regel: Einlagen in Enkelgesellschaften (ausser Sanierungszuschüssen) erhöhen den Buchwert der Tochter; der erhöhte Buchwert ist auf Werthaltigkeit zu prüfen.
  quelle: hwp-bur-2023__rz-0286-s221
  zitat: erhöhen Einlagen des bilanzierenden Unternehmens in Enkelgesellschaften den Beteiligungsbuchwert der Tochtergesellschaft
- regel: Abgänge zum Buchwert; Zuschreibungen innerhalb der Anschaffungskosten erfolgswirksam und bezeichnet.
  quelle: hwp-bur-2023__rz-0279-s219
  zitat: Abgänge sind zum Buchwert zu erfassen, damit realisierte Gewinne oder Verluste ausgewiesen werden können.
- regel: 'Beteiligungsertrag: Realisation grundsätzlich mit Ausschüttungsbeschluss bzw. Ausschüttung; zeitgleiche Aktivierung nur unter Voraussetzungen und mit Anhangangabe.'
  quelle: hwp-bur-2023__rz-0321-s227
  zitat: dieser Sachverhalt im Anhang der Obergesellschaft offengelegt wird
- regel: 'Zeitgleiche Aktivierung: Buchungsschema zwingend (aktive Rechnungsabgrenzung, Rückbuchung zu Beginn der Folgeperiode, definitive Realisierung erst bei Fälligkeit), um VSt-Rückerstattung
    bzw. Meldeverfahren zu wahren.'
  quelle: hwp-bur-2023__rz-0322-s227
  zitat: Erst bei Fälligkeit der steuerbaren Leistung darf der Beteiligungsertrag definitiv realisiert werden.
- regel: Ausschüttungen aus Beteiligungen (auch aus Kapitaleinlagereserven) handelsrechtlich grundsätzlich als Beteiligungsertrag; daraus folgende Wertkorrekturen über den Aufwand, nicht
    mit der Ausschüttung verrechnen.
  quelle: hwp-bur-2023__rz-0324-s227
  zitat: Handelsrechtlich gilt eine erhaltene Ausschüttung aus einer Beteiligung ungeachtet der steuerlichen Qualifikation im Grundsatz als Beteiligungsertrag, welcher über die Erfolgsrechnung
    zu erfassen ist.
- regel: 'VSt-Guthaben: verkürzte Verjährung (Rückerstattung drei Jahre); ältere offene Guthaben auf Werthaltigkeit prüfen.'
  quelle: hwp-bur-2023__rz-0549-s269
  zitat: Dabei gelten zum Teil verkürzte Verjährungsfristen
- regel: Nicht rückforderbare Quellensteuern auf künftige Ausschüttungen bei der Bewertung berücksichtigen.
  quelle: hwp-bur-2023__rz-0294-s223
  zitat: Solche Steuerfolgen sind bei der Bewertung einer Beteiligung zu berücksichtigen.
- regel: Stille Reserven je Bilanzposition (inkl. Beteiligungen) jährlich als Differenz Buchwert zu gesetzlichem Höchstwert ermitteln und mit Vorjahr vergleichen.
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
- regel: Eigene Kapitalanteile zum Anschaffungswert als Minusposten im Eigenkapital (Bruttodarstellung).
  quelle: hwp-bur-2023__rz-0637-s291
  zitat: die eigenen Kapitalanteile bis zu ihrer Veräusserung oder Vernichtung im Betrag ihres Anschaffungswerts als Minusposten vom Eigenkapital abgesetzt werden
fallstricke:
- text: 'Beteiligung vs. Darlehen/Wertschriften: Langfristige Darlehen (auch mit Eigenkapitalcharakter) und Titel ohne massgeblichen Einfluss gehören zu den Finanzanlagen; Erwerbe von
    Anteilen werden in der Praxis teils auf Anzahlungs- oder Forderungskonten gebucht – Kontierung immer gegen Kaufvertrag prüfen.'
  quelle: hwp-bur-2023__rz-0278-s219
  zitat: Von den Beteiligungen zu unterscheiden sind langfristige Darlehen
- text: Kaufpreis über anteiligem Eigenkapital (Goodwill) ist bei Verlust-Töchtern kein Beleg für Werthaltigkeit; Nutzwert richtet sich nach der künftigen nachhaltigen Ertragskraft,
    nicht nach dem bezahlten Preis.
  quelle: hwp-bur-2023__rz-0029-s162-t1
  zitat: Massgebend ist nicht der ausgeschüttete Gewinn oder das ausgewiesene Ergebnis, sondern vor allem die künftige, nachhaltige Ertragskraft.
- text: Aufwertung über die Anschaffungskosten (Art. 725c OR) ist nur zur Behebung von Kapitalverlust/Überschuldung, höchstens bis zum wirklichen Wert und mit gesondert ausgewiesener
    Aufwertungsreserve zulässig; die schriftliche Bestätigung ist eine besondere Prüfung, nicht Teil der eingeschränkten Revision – der Agent bereitet höchstens vor und meldet an den
    WP.
  quelle: hwp-er-2026__rz-0041-s033
  zitat: Aufwertung von Grundstücken und Beteiligungen über den Anschaffungswert bzw. die Herstellungskosten zwecks Beseitigung einer Unterbilanz (Art. 725c Abs. 2 OR)
- text: Befragungen sind in der eingeschränkten Revision auf Personen im Unternehmen beschränkt; Bestätigungen von Banken/Dritten zu Wertschriftenbeständen sowie Bewertungs- oder Expertengutachten
    zur Beteiligung bei Dritten einzuholen ist nicht Bestandteil der ER – Depotauszug/Bankbestätigung und vom Kunden vorhandene Bewertungen als Kundendokumente verwenden und kritisch
    würdigen.
  quelle: hwp-er-2026__rz-0134-s203
  zitat: das Einholen von Bestätigungen von Dritten (Bank-, Debitoren- oder Kreditorenbestätigungen, Anwaltsbestätigungen, Experten- und Bewertungsgutachten
- text: 'Körperliche Aufnahme von Titeln (H3-301 c) ist eine physische Tätigkeit. Das Konzept schliesst physische Tätigkeiten für die Sonstigen Prüfungshandlungen (4xx) aus; sinngemäss
    gilt das auch für diesen 3xx-Schritt: Der Agent führt sie nie aus, sondern erfasst eine Pendenz bzw. einen Hinweis an den WP.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: Auskünfte der Geschäftsleitung zur Werthaltigkeit kritisch würdigen und mit Abschluss/Ausblick der Beteiligung abgleichen; Befragung allein genügt bei wesentlichen Positionen
    nicht.
  quelle: hwp-er-2026__rz-0111-s199-t1
  zitat: Gemäss SER sind wesentliche Bilanzpositionen in der Regel nicht nur mit analytischen Prüfungshandlungen zu prüfen; vielmehr ist das Prüfungsvorgehen mit angemessenen Detailprüfungen
    zu ergänzen.
- text: 'Bei Erwerb einer kontrollierten Gesellschaft (z. B. 100 % der Stimmen) besteht grundsätzlich Konzernrechnungspflicht; Befreiung nach Art. 963a OR (Grössen) abklären und an den
    WP melden; Forderungen/Verbindlichkeiten gegenüber der Beteiligung gesondert ausweisen. Folge: Besteht die Konzernrechnungspflicht (keine Befreiung nach Art. 963a Abs. 1 OR oder
    ein Fall von Abs. 2), muss die Jahresrechnung ordentlich geprüft werden (Art. 727 Abs. 1 Ziff. 3 OR), ohne Aufschub, auch bei Kontrolle erst am Stichtag (HWP ER Rz 310/336). Neu
    geschaffener Konzern: von Beginn an befreit, wenn die Grössen im ersten und absehbar im zweiten Jahr nicht überschritten werden und kein Fall von Abs. 2 vorliegt (HWP ER Rz 335).
    Sofort Notiz «Wesentliche Feststellungen» an den WP (Revisionsart/Mandat betroffen). Der Entscheid liegt beim WP.'
  quelle: or__art-963
  zitat: Kontrolliert eine rechnungslegungspflichtige juristische Person ein oder mehrere rechnungslegungspflichtige Unternehmen
- text: VSt wird juristischen Personen nur zurückerstattet, wenn der Ertrag ordnungsgemäss (brutto) als Ertrag verbucht wurde; Netto-Verbuchung verwirkt den Anspruch (Art. 25 Abs. 1
    VStG).
  quelle: vstg__art-25
  zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung der von diesen Einkünften abgezogenen
    Verrechnungssteuer
- text: Kann eine nötige Wertberichtigung auf Beteiligungen einen Kapitalverlust oder eine Überschuldung auslösen, wirkt sie direkt auf Art. 725a/725b OR; bei Unsicherheit kommt ein
    Eventualzusatz im Bericht in Betracht (Entscheid WP). Ergebnis an Prüffeld Eigenkapital/Fortführung melden.
  quelle: hwp-er-2026__rz-0434-s283
  zitat: könnte ein Kapitalverlust oder eine Überschuldung im Sinne von Art. 725 a OR
- text: Vergleich Buchwert/innerer Wert bzw. Kurs, Belegprüfung, Ertragsdurchsicht und Bonität (H3-302–304, H3-403) sind gemäss SER weiter gehend und im Katalog WP- bzw. 4xx-Schritte.
    Der Agent führt sie nur auf Anweisung des WP aus. Erkannte Auslöser (Anzeichen wesentlicher Fehlaussagen, erhöhtes inhärentes Risiko) meldet er mit Begründung als Notiz.
  quelle: hwp-er-2026__rz-0133-s203
  zitat: Wenn kein erhöhtes inhärentes Risiko vorliegt und die empfohlenen Prüfungshandlungen ausreichende geeignete Prüfungsnachweise liefern, sind keine weitergehenden Prüfungshandlungen
    vorzunehmen.
- text: Der Steuerwert (Beteiligungsverzeichnis) ist kein handelsrechtlicher Wertmassstab, sondern nur ein Indiz; massgebend bleibt der erzielbare Wert, höchstens die Anschaffungskosten
    (Steuerwert = Steuerpraxis, kein handelsrechtlicher Massstab; handelsrechtlich HWP BuR Rz 281/291).
  quelle: hwp-bur-2023__rz-0291-s222
  zitat: wird der Buchwert der Beteiligung mit dem erzielbaren Wert (höherer Wert aus Nutzwert und Netto-Marktwert) verglichen
- text: Bruttohochrechnung «Nettogutschrift / 0.65» gilt nur für inländische, VSt-belastete Ausschüttungen – nicht für Ausschüttungen aus Kapitaleinlagereserven (VSt-frei), das Meldeverfahren
    (keine Steuerentrichtung) oder ausländische Dividenden (Quellensteuer gemäss Abrechnung).
  quelle: estv-ks-29c-2022__2-2-3-t4
  zitat: Rückzahlungen aus KER bzw. Ausland-KER einer Kapitalgesellschaft oder Genossenschaft unterliegen weder der Einkommenssteuer (Art. 20 Abs. 3 DBG) noch der Verrechnungssteuer
    (Art. 5 Abs. 1bis VStG).
- text: 'Eigene Anteile: Erwerb über den Rahmen von Art. 659/783 OR (10 %) oder im Hinblick auf eine Kapitalherabsetzung löst die Verrechnungssteuer auf der Teilliquidation sofort aus.
    Innerhalb des Rahmens gilt dasselbe, wenn die Anteile nicht innert sechs Jahren wieder veräussert werden (Art. 4a VStG; HWP BuR Rz 632; KS ESTV 51 Ziff. 3.1.2.3). Hinweis an Prüffeld
    P1/S1; die Beurteilung liegt beim WP (steuerliche Behandlung gemäss SER Anh. D o) weiter gehend).'
  quelle: vstg__art-4a-t1
  zitat: Dasselbe gilt, soweit der Erwerb eigener Beteiligungsrechte den Rahmen der Artikel 659 oder 783 des Obligationenrechts (OR) überschreitet.
- text: 'Erwerb von einer möglicherweise nahestehenden Person zu einem Preis deutlich über dem anteiligen Eigenkapital: Beziehung und Preisfestlegung erfragen (Drittvergleich); ein gleicher
    Familienname allein belegt keine Nahestehung.'
  quelle: hwp-er-2026__rz-0161-s212
  zitat: Beurteilung der (Transfer-)Preise der jeweiligen Geschäftsvorfälle mittels Drittvergleichs
- text: 'Der Agent bucht nie: Umgliederungen (z. B. Beteiligung auf falschem Konto) und Wertberichtigungen nur als Wesentliche Feststellung mit begründetem Buchungsvorschlag; kein Kundenversand
    von Fragen.'
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- text: 'Auslöser selbst rechnen: Auch wenn H3-302/303/304 (WP) nicht angewiesen sind, die Indikatoren (Buchwert > anteiliges EK, Verluste, negativer Ausblick in der JR der Beteiligung)
    in H3-102/H3-201 mit `rechne` ermitteln und als Notiz an den WP melden – kein «keine Feststellung» ohne gelesene JR der Beteiligung.'
  quelle: hwp-bur-2023__rz-0290-s221
  zitat: unter den Erwartungen liegende Gewinne oder wiederkehrende Verluste bei der Beteiligung
  schritte:
  - H3-102
  - H3-201
  - H3-302
fragen_kunde:
- frage: Welche Bilanzierungs- und Bewertungsgrundsätze wenden Sie für Beteiligungen an (Anschaffungskosten inkl. Nebenkosten, Einzel- oder Gruppenbewertung, Wertberichtigungen, Erfassung
    Dividenden)? Gab es Änderungen gegenüber dem Vorjahr?
  zweck: H3-101
- frage: Bestehen Anzeichen für tiefere Werte einzelner Beteiligungen (Verluste, rückläufige Aufträge, Verkaufsabsicht oder -angebote, Wegfall der Betriebsnotwendigkeit)? Wie haben Sie
    die Werthaltigkeit per 31.12. beurteilt (bitte Unterlagen beilegen)?
  zweck: H3-102, H3-302
- frage: Welche Beteiligungen wurden im Geschäftsjahr erworben, veräussert, aufgestockt, saniert oder mit Zuschüssen versehen, und auf welchen Konten wurden diese Vorgänge gebucht?
  zweck: H3-201, H3-301, H3-303
- frage: Von wem wurden Beteiligungen im Geschäftsjahr erworben? Steht der Verkäufer der Gesellschaft, ihren Organen, Aktionären oder Mitarbeitenden nahe (z. B. familiäre Beziehung)?
    Wie wurde der Kaufpreis festgelegt (Bewertung, Ertragsaussichten)?
  zweck: H3-303, H3-302 (nahestehende Personen, Drittvergleich Kaufpreis, Begründung eines Kaufpreises über dem anteiligen Eigenkapital)
- frage: Liegt der Zustimmungsbeschluss der Gesellschafterversammlung der Beteiligung zur Abtretung vor, oder verzichten deren Statuten darauf (bitte Statuten beilegen)? Ist die Gesellschaft
    als Gesellschafterin eingetragen?
  zweck: H3-301 Eigentumsnachweis
- frage: Werden die Anteile langfristig gehalten, und vermitteln sie einen massgeblichen Einfluss (Kapital- und Stimmenanteil)?
  zweck: H3-101, H3-301 (Abgrenzung Beteiligung/Wertschriften/Finanzanlagen)
- frage: Bestehen nicht voll einbezahlte Titel, statutarische Nachschusspflichten, Garantien, Bürgschaften, Patronatserklärungen oder Verpfändungen im Zusammenhang mit Beteiligungen?
  zweck: H3-402
- frage: Hält die Gesellschaft oder eine von ihr kontrollierte Gesellschaft eigene Anteile; wurden im Geschäftsjahr eigene Anteile erworben oder veräussert (Anzahl, Preis, Bedingungen)?
  zweck: H3-401
- frage: Haben Beteiligungsgesellschaften für das Geschäftsjahr oder das Vorjahr Ausschüttungen beschlossen (aus welchen Reserven, z. B. Kapitaleinlagereserven), wurde die Verrechnungssteuer
    zurückgefordert bzw. das Meldeverfahren angewandt, und bestehen ältere, noch nicht zurückerstattete VSt-Guthaben?
  zweck: H3-304, H3-405
- frage: Wie hoch sind Bestand und Veränderung der stillen Reserven auf Beteiligungen, und nach welcher Methode werden sie ermittelt?
  zweck: H3-321
- frage: Kontrolliert die Gesellschaft andere Unternehmen (Stimmenmehrheit), und wird eine Konzernrechnung erstellt oder die Befreiung nach Art. 963a OR beansprucht (Grössen der letzten
    zwei Jahre)?
  zweck: H3-320 (Konzernrechnungspflicht), H3-302 (Plausibilisierung)
- frage: Wurden Beteiligungen zur Behebung eines Kapitalverlusts oder einer Überschuldung aufgewertet (Art. 725c OR), und liegt dazu die schriftliche Bestätigung eines zugelassenen Revisors
    vor?
  zweck: H3-302, H3-320 (Aufwertungsreserve)
