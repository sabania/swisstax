- id: H3-320
  vorgehen: 'Anhang prüfen: Beteiligungen mit Firma, Rechtsform, Sitz, Kapital- und Stimmenanteil; eigene Anteile; Forderungen/Verbindlichkeiten gegenüber Beteiligungen; Sicherheiten,
    verpfändete Aktiven, Eventualverbindlichkeiten; Hinweis bei Kursbewertung; Offenlegung zeitgleich aktivierter Beteiligungserträge; Aufwertungsreserve. Bei Kontrolle (Stimmenmehrheit):
    Bilanzsumme, Umsatz und Vollzeitstellen zusammen mit den kontrollierten Unternehmen für BJ und VJ mit `rechne` summieren und mit 20 Mio. / 40 Mio. / 250 vergleichen (Art. 963a Abs.
    1 Ziff. 1 OR). Dafür NICHT `revisionspflicht` verwenden: Dort gilt die Zweijahresregel von Art. 727 Abs. 1 Ziff. 2 OR, und die Befreiung ist strenger (HWP ER Rz 334). Sind zwei Grössen
    im BJ oder VJ überschritten oder liegt ein Fall von Art. 963a Abs. 2 OR vor: Befreiung fraglich, ordentliche Revision möglich (Art. 727 Abs. 1 Ziff. 3 OR) → sofort Notiz «Wesentliche
    Feststellungen» an den WP. Lücken als Wesentliche Feststellung.'
  nachweise:
  - Anhang Jahresrechnung
  - Beteiligungsverzeichnis
  - Vollständigkeitserklärung
