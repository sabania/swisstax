- id: H3-401
  vorgehen: Der Bestand eigener Anteile wird im Prüffeld Eigenkapital als EP-Schritt geprüft → `pruefschritt P1-304`; hier nur auf Anweisung des WP ergänzen. Aktienbuch/Anteilbuch, HR-Auszug
    und Konten auf eigene Anteile durchsehen (auch von kontrollierten Gesellschaften gehaltene); Bestand mit Minusposten (Anschaffungswert), Anhang und ggf. Reserve nach Art. 659b Abs.
    2 OR abstimmen; Grenzen (10 %, Ausnahmen 20 % AG / 35 % GmbH) und frei verwendbares EK im Erwerbszeitpunkt nachrechnen. Ergebnis mit Prüffeld Eigenkapital abstimmen.
  nachweise:
  - Aktienbuch/Anteilbuch
  - HR-Auszug/Statuten
  - Kaufverträge eigene Anteile
  - Kontoblatt eigene Kapitalanteile
  - Anhang
  rechnen: Total Titel im Aktienbuch (inkl. auf die Gesellschaft eingetragene) = Anzahl gemäss Statuten/HR; eigene Anteile = auf die Gesellschaft bzw. kontrollierte Unternehmen eingetragene
    Titel; Nennwert eigene Anteile / im HR eingetragenes Kapital ≤ 10 % (Ausnahme 20 % AG bzw. 35 % GmbH); Anschaffungswert ≤ frei verwendbares EK; Minusposten = Σ Anschaffungswerte
  feststellung_wenn: Eigene Anteile nicht als Minusposten, Grenze überschritten oder ohne frei verwendbares EK erworben, Reserve nach Art. 659b OR oder Anhangangabe fehlt, Aktienbuch
    nicht mit Aktienkapital abstimmbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Feststellen des Bestands an eigenen Kapitalanteilen
  - quelle: or__art-659
    zitat: Die Gesellschaft darf eigene Aktien nur dann erwerben, wenn frei verwendbares Eigenkapital in der Höhe des Anschaffungswerts vorhanden ist.
  - quelle: or__art-659
    zitat: Der Erwerb eigener Aktien ist auf 10 Prozent des im Handelsregister eingetragenen Aktienkapitals beschränkt.
  - quelle: or__art-659
    zitat: Steht der Erwerb im Zusammenhang mit einer Übertragbarkeitsbeschränkung oder einer Auflösungsklage, so beträgt die Höchstgrenze 20 Prozent.
  - quelle: or__art-783
    zitat: der gesamte Nennwert dieser Stammanteile zehn Prozent des Stammkapitals nicht übersteigt
  - quelle: or__art-783
    zitat: Werden im Zusammenhang mit einer Übertragbarkeitsbeschränkung, einem Austritt oder einem Ausschluss Stammanteile erworben, so beträgt die Höchstgrenze 35 Prozent.
  - quelle: or__art-659a
    zitat: Die Gesellschaft hat in der Bilanz für die eigenen Aktien einen dem Anschaffungswert entsprechenden Betrag als Minusposten des Eigenkapitals darzustellen
  - quelle: or__art-659b
    zitat: einen dem Anschaffungswert dieser Aktien entsprechenden Betrag gesondert als gesetzliche Gewinnreserve auszuweisen
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile durch das Unternehmen selbst oder durch Unternehmen, an denen eine Beteiligung besteht
- id: H3-402
  vorgehen: Aus Statuten/HR-Auszug der Beteiligungen (Liberierung, Nachschusspflicht), Kredit- und Pfandverträgen, Bankbestätigung sowie Garantie-/Bürgschafts-/Patronatserklärungen Verpflichtungen
    gegenüber Beteiligungsgesellschaften und Verpfändungen von Beteiligungstiteln festhalten; Nachschusspflicht als Wertminderungsindiz an H3-302 melden; mit Anhang und Vollständigkeitserklärung
    abgleichen. Bürgschaften, Garantien, Pfandbestellungen für Verbindlichkeiten der Beteiligung sowie klagbare (harte) Patronatserklärungen → Anhang Ziff. 8 (Art. 959c Abs. 2 OR), volle
    Haftungssumme (HWP BuR Rz 840/841). Übrige Patronatserklärungen und Zusagen → Ziff. 10 (HWP BuR Rz 855). Lücken als Frage/Pendenz.
  nachweise:
  - Statuten/HR-Auszug der Beteiligung
  - Kredit- und Pfandverträge, Bankbestätigung
  - Garantien/Bürgschaften/Patronatserklärungen
  - Anhang
  - Vollständigkeitserklärung
  rechnen: Nicht einbezahlter Betrag = Nennwert − liberierter Betrag; Nachschusspflicht je Stammanteil ≤ 2 × Nennwert (Art. 795 Abs. 2 OR)
  feststellung_wenn: Einzahlungs-/Nachschusspflicht, Verpfändung oder Eventualverbindlichkeit besteht, ist aber nicht im Anhang offengelegt bzw. bei wahrscheinlicher Inanspruchnahme
    nicht zurückgestellt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0279-s219
    zitat: Aufbewahrungsort der Titel sowie Hinweise auf Einzahlungs- und Nachschusspflichten
  - quelle: or__art-795
    zitat: Dieser darf das Doppelte des Nennwertes des Stammanteils nicht übersteigen.
  - quelle: hwp-bur-2023__rz-0290-s221
    zitat: besondere Haftung (besonders bei GmbH-Anteilen mit Nachschusspflicht)
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über Bestand und Veränderungen von Bürgschaften, Garantieverpflichtungen und Pfandbestellungen zugunsten Dritter
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
  - quelle: hwp-bur-2023__rz-0840-s347-t1
    zitat: beispielsweise für den Bankkredit eines Tochterunternehmens
  - quelle: hwp-bur-2023__rz-0841-s347
    zitat: Verpflichtungen aus Patronatserklärungen, sofern aufgrund der darin enthaltenen Willenserklärung die Erfüllung der Verpflichtung klagbar ist.
  - quelle: hwp-bur-2023__rz-0841-s347
    zitat: Ausweispflichtig ist grundsätzlich die volle Haftungssumme.
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach rechtlichen oder tatsächlichen Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint
  - quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
      (Eventualverbindlichkeit)
  - quelle: hwp-bur-2023__rz-0855-s351-t2
    zitat: Aus einer Patronatserklärung zugunsten einer Beteiligung ergibt sich ggf. als auszuweisende Eventualverbindlichkeit der Betrag, bei dessen Leistung sich das Mutterunternehmen
      vollumfänglich aus der eingegangenen Verpflichtung lösen kann
- id: H3-403
  vorgehen: 'Sonstige Prüfungshandlung (4xx; SER: weiter gehend): nur auf ausdrückliche Anweisung des WP. Ohne Anweisung: nicht bearbeiten, Status «nicht bearbeitet – nur auf Anweisung».
    Erkannte Auslöser aus H3-101/102/201/301 (z. B. Buchwert > anteiliges EK, wiederkehrende Verluste) mit Zahlen als Notiz «Schlussbesprechung» bzw. Pendenz an den WP. Bei Anweisung:
    für nicht kotierte Titel und Forderungen (z. B. Darlehen an Beteiligungen) Bonität anhand letzter Jahresrechnung beurteilen; Gesamtengagement und WB-Reihenfolge beachten; Ergebnis
    für den WP.'
  nachweise:
  - Jahresrechnung des Schuldners/Emittenten
  - Darlehensverträge
  - Sicherheiten
  rechnen: 'Gesamtengagement = Beteiligungsbuchwert + Darlehen + übrige Forderungen. Indiz Wertberichtigung wie H3-102/D1-306: Beteiligung = Buchwert − anteiliges EK (bzw. − belegter
    erzielbarer Wert), begrenzt auf 0 bis Buchwert; EK der Gesellschaft negativ → zusätzlich Forderungen ≤ min(−EK der Gesellschaft; Σ Forderungen), zuerst nachrangige, dann übrige;
    Σ Wertberichtigungen ≤ Gesamtengagement. Nicht «anteiliges EK / Gesamtengagement» rechnen: Die Darlehen sind im EK der Gesellschaft schon als Fremdkapital abgezogen.'
  feststellung_wenn: Schuldner mit Verlusten, Unterbilanz oder negativem Ausblick ohne Wertberichtigung, oder Wertberichtigung nicht zuerst der Beteiligung zugeordnet.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Beurteilung der Bonität der Darlehensnehmer anhand deren Jahresabschlüssen oder anderer Informationen (sofern verfügbar)
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Punkte, die der Wirtschaftsprüfer mit dem Kunden besprechen sollte
  - quelle: hwp-bur-2023__rz-0271-s217
    zitat: aufgrund der finanziellen Situation der Schuldnerin oder des Schuldners, unter Berücksichtigung erhaltener Sicherheiten
  - quelle: hwp-bur-2023__rz-0293-s222
    zitat: Wertberichtigungen zuerst der Beteiligung, dann nachrangig gewährten Finanzierungen und schliesslich den übrigen Forderungen des Unternehmens gegenüber dem Tochterunternehmen
      zuzuordnen
- id: H3-404
  vorgehen: 'Zusammensetzung der Beteiligungen und Wertschriften nach Gesellschaft, Branche, Währung und Land auswerten; Anteil je Position am Total, an den Aktiven und am EK berechnen
    (Klumpenbetrachtung = Praxis ohne Quelle); Währungs- und Transferrisiken festhalten. Könnte eine Wertberichtigung Kapitalverlust/Überschuldung auslösen: an WP und Prüffeld Eigenkapital
    melden (Eventualzusatz entscheidet WP).'
  nachweise:
  - Beteiligungsverzeichnis
  - Bilanz
  - Jahresrechnungen der Beteiligungen
  rechnen: Anteil je Beteiligung = Buchwert / Total Beteiligungen; Exposure = Buchwert (inkl. Darlehen) / Eigenkapital
  feststellung_wenn: Einzelne Position im Verhältnis zum EK so gross, dass ein Wertverlust Kapitalverlust/Überschuldung (Art. 725a/725b OR) auslösen könnte, ohne Berücksichtigung in
    Bewertung oder Fortführungsbeurteilung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0029-s162-t1
    zitat: bei diesen sind ausserdem die Währungs- und Übertragungsrisiken zu berücksichtigen
  - quelle: hwp-bur-2023__rz-0290-s221
    zitat: sinkende Umrechnungskurse oder Kaufkraftschwund ausländischer Währungen
  - quelle: hwp-er-2026__rz-0434-s283
    zitat: könnte ein Kapitalverlust oder eine Überschuldung im Sinne von Art. 725 a OR
- id: H3-405
  vorgehen: 'Kontoblatt VSt-Guthaben mit VSt-pflichtigen Erträgen (Dividenden, Zinsen) abstimmen: Ertrag brutto, 35 % VSt aktiviert, Antrag nach Ablauf des Fälligkeitsjahres. Guthaben
    entsteht erst bei Fälligkeit (nicht bei zeitgleicher Aktivierung per 31.12.) und nicht beim Meldeverfahren. Meldeverfahren im Konzern möglich bei unmittelbarer Beteiligung von mindestens
    10 % (Art. 26a VStV, amtliches Formular; nicht mit den 20 % von Art. 960d OR verwechseln). Wurde es angewandt: kein VSt-Abzug, kein VSt-Guthaben. Guthaben älter als drei Jahre auf
    Antrag/Verwirkung prüfen.'
  nachweise:
  - Kontoblatt VSt-Guthaben
  - Dividenden-/Zinsabrechnungen, Bankauszüge
  - Rückerstattungsanträge und Gutschriften ESTV
  - Aufstellung offener VSt-Guthaben nach Fälligkeitsjahr (inkl. Vorjahre)
  rechnen: 'VSt-Soll = Σ VSt-pflichtige, im Geschäftsjahr fällige Bruttoerträge × 35 %; Saldo VSt-Konto = VSt-Soll (inkl. Vorjahre) − erhaltene Rückerstattungen; je offener Posten: Antragsfrist
    = Ende Fälligkeitsjahr + 3 Jahre (abgelaufen → Anspruch erloschen)'
  feststellung_wenn: Ertrag netto gebucht (VSt nicht aktiviert), VSt-Guthaben ohne zugrunde liegenden Ertrag bzw. vor Fälligkeit, oder Guthaben älter als drei Jahre ohne Antrag (Ausbuchung
    als Feststellung vorschlagen, keine Buchung).
  fundstellen:
  - quelle: vstg__art-13
    zitat: 35 Prozent der steuerbaren Leistung
  - quelle: vstg__art-25
    zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung der von diesen Einkünften abgezogenen
      Verrechnungssteuer
  - quelle: vstg__art-29
    zitat: Der Antrag kann frühestens nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt werden.
  - quelle: hwp-bur-2023__rz-0322-s227
    zitat: Erst bei Fälligkeit der steuerbaren Leistung darf der Beteiligungsertrag definitiv realisiert werden.
  - quelle: vstg__art-12
    zitat: entsteht die Steuerforderung im Zeitpunkt, in dem die steuerbare Leistung fällig wird
  - quelle: vstv__art-26a
    zitat: unmittelbar zu mindestens 10 Prozent am Grund- oder Stammkapital einer Kapitalgesellschaft oder Genossenschaft beteiligt, so kann sie diese mittels eines amtlichen Formulars
      anweisen, ihr die Dividende ohne Abzug der Verrechnungssteuer auszurichten
  - quelle: hwp-bur-2023__rz-0549-s269
    zitat: für die Rückerstattung der Verrechnungssteuer drei Jahre
  - quelle: vstg__art-32
    zitat: Der Anspruch auf Rückerstattung erlischt, wenn der Antrag nicht innert drei Jahren nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt
      wird.
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
