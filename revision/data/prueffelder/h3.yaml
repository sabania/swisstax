- id: H3-405
  vorgehen: 'Kontoblatt VSt-Guthaben mit den VSt-pflichtigen Erträgen (Dividenden, Zinsen) abstimmen: Ertrag brutto verbucht, 35 % VSt aktiviert, Rückforderung beantragt bzw. ab Folgejahr
    geplant; ältere Guthaben auf erfolgte Rückerstattung prüfen. Bei Beteiligungserträgen mit Meldeverfahren entsteht kein Guthaben.'
