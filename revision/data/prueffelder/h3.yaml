schritte:
- id: H3-101
  vorgehen: 'Schriftliche Kundenantwort (Kundenbefragung/Fragebogen) zu den Grundsätzen für Beteiligungen auswerten: Anschaffungskosten inkl. Nebenkosten, Einzel-/Gruppenbewertung, Wertberichtigungen,
    Erfassung Dividenden, Abgrenzung lang-/kurzfristig. Mit Anhang (Grundsätze) und Vorjahresakte abgleichen. Fehlt die Antwort: Frage als Pendenz, Schritt höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Kundenantwort/Fragebogen
  - Anhang Ziff. Grundsätze der Rechnungslegung
  - Beteiligungsverzeichnis
  - Vorjahres-Arbeitspapier
  rechnen: ''
  feststellung_wenn: Antwort widerspricht Buchhaltung/Anhang; Bewertung über Anschaffungskosten (z.B. Equity-Methode) oder Grundsätze ohne Begründung gegenüber Vorjahr geändert.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung über die angewandten Bilanzierungs- und Bewertungsgrundsätze
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Finanzanlagen
  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
  - quelle: hwp-bur-2023__rz-0281-s220
    zitat: Beteiligungen dürfen höchstens zu den Anschaffungskosten bewertet werden
- id: H3-102
  vorgehen: 'Schriftliche Stellungnahme der Geschäftsleitung zur Werthaltigkeit jeder Beteiligung auswerten (Anzeichen: Verluste, negativer Ausblick, Verkaufsangebote, Wegfall Betriebsnotwendigkeit)
    und mit Jahresrechnung/Ausblick der Beteiligung abgleichen. Fehlt die Stellungnahme: Frage als Pendenz und Punkt für die Schlussbesprechung; Beurteilung beim WP. JR der Beteiligung
    in der Akte ganz lesen (Bilanz, ER, Anhang mit Ereignissen nach Stichtag/Ausblick, ggf. Budget). Auch ohne schriftliche Stellungnahme die Indikatoren mit `rechne` ermitteln (siehe
    Rechnen) und als Auslöser an den WP melden; Forderungen gegenüber derselben Gesellschaft in D1-306 gleich beurteilen.'
  nachweise:
  - Stellungnahme GL/Werthaltigkeitsbeurteilung
  - Jahresrechnung der Beteiligung
  - Planungsrechnung/Budget der Beteiligung
  - VR-Protokolle
  rechnen: Anteiliges EK = Eigenkapital Beteiligung × Kapitalquote; Unterdeckung = Buchwert − anteiliges EK (> 0 = Indiz für Wertberichtigung der Beteiligung, höchstens bis zum Buchwert;
    Darlehen an die Beteiligung sind dort Fremdkapital, nicht nochmals abziehen); Jahresergebnis der Beteiligung GJ und VJ (Verlust, wiederkehrend?); Gesamtengagement = Buchwert + Darlehen/Forderungen
    gegenüber der Beteiligung (D1/H2). EK der Beteiligung negativ → zusätzlich Indiz auf Darlehen/Forderungen nach D1-306 (Kaskade); Σ Wertberichtigungen ≤ Gesamtengagement.
  feststellung_wenn: Anzeichen einer Wertminderung (z.B. wiederkehrende Verluste, Verlustprognose) ohne Werthaltigkeitsbeurteilung oder Wertberichtigung, oder GL-Aussage widerspricht
    vorliegenden Abschlüssen.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Besprechung mit der Unternehmensleitung betreffend allfällige niedrigere Marktwerte
  - quelle: hwp-bur-2023__rz-0290-s221
    zitat: Die Prüfung auf Anzeichen für eine Wertminderung hat mindestens an jedem Abschlussstichtag zu erfolgen.
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Der Abschlussprüfer würdigt die erhaltenen Auskünfte in jedem Fall kritisch.
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: hwp-bur-2023__rz-0290-s221
    zitat: unter den Erwartungen liegende Gewinne oder wiederkehrende Verluste bei der Beteiligung
  - quelle: hwp-bur-2023__rz-0293-s222
    zitat: Wertberichtigungen zuerst der Beteiligung, dann nachrangig gewährten Finanzierungen und schliesslich den übrigen Forderungen des Unternehmens gegenüber dem Tochterunternehmen
      zuzuordnen
  notiz: Unterdeckung > 0 zusammen mit Verlust oder negativem Ausblick → Notiz «Schlussbesprechung» an den WP mit Zahlen (Auslöser für H3-302, Entscheid WP). Stellungnahme oder JR der
    Beteiligung fehlt → «Pendenz» (Beteiligung, Stichtag, Buchwert).
- id: H3-201
  vorgehen: Beteiligungskonten, Wertberichtigungen und Beteiligungs-/Finanzerträge gemäss Saldoliste mit dem Vorjahr vergleichen und jede Veränderung über der Nicht-Aufgriffsgrenze einem
    Vorgang zuordnen (Kauf, Verkauf, Kapitalerhöhung, Zuschuss, Wertberichtigung, Dividende). Zugänge auf fremden Konten (z.B. Anzahlungen) und fehlende Erträge trotz bekannter Ausschüttung
    als Pendenz/Frage erfassen. (SER Anh. D g) enthält keine analytische Handlung; Wortlaut aus s) Finanzaufwand/-ertrag als Analogie.)
  nachweise:
  - Saldoliste LJ/VJ
  - Kontoblätter Beteiligungen/Finanzertrag
  - Beteiligungsverzeichnis LJ/VJ
  rechnen: 'Veränderung je Beteiligung = Buchwert 31.12. LJ − Buchwert 31.12. VJ; Kontrolle: Zugänge − Abgänge − Wertberichtigungen + Zuschreibungen = Veränderung; Beteiligungsertrag
    LJ vs. VJ (absolut und %)'
  feststellung_wenn: Veränderung nicht durch Vorgang/Beleg erklärbar, Zugang ausserhalb der Beteiligungskonten gebucht oder Ertrag/Wertberichtigung fehlt trotz entsprechendem Ereignis.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: hwp-er-2026__rz-0096-s197
    zitat: Untersuchungen von festgestellten Schwankungen, Abweichungen, Kennzahlenvergleiche etc.
  - quelle: hwp-er-2026__rz-0030-s183
    zitat: Zudem können analytische Prüfungshandlungen bei der Identifikation ungewöhnlicher Geschäftsvorfälle, Buchungen, Beträge oder Trends hilfreich sein.
- id: H3-301
  vorgehen: 'Bilanzposition mit Hauptbuch und Beteiligungsverzeichnis abstimmen; je Beteiligung Bestand, Quote und Eigentum mit Depotauszug/Titel bzw. bei GmbH-Anteilen mit schriftlichem
    Abtretungsvertrag, Zustimmung der Gesellschafterversammlung (Art. 786 OR; entfällt nur bei statutarischem Verzicht) und HR-Auszug belegen; Stimmenanteil und Halteabsicht prüfen.
    Körperliche Aufnahme: nur Pendenz an WP. Fehlklassierung als Wesentliche Feststellung mit Buchungsvorschlag, keine Verbuchung.'
  nachweise:
  - Beteiligungsverzeichnis 31.12.
  - Saldoliste/Kontoblätter
  - Depotauszug bzw. Titel 31.12.
  - HR-Auszug/Statuten der Beteiligung
  - Kaufvertrag
  - Abtretungsvertrag und Zustimmungsbeschluss der Gesellschafterversammlung bzw. statutarischer Verzicht (GmbH-Stammanteile)
  rechnen: Summe Buchwerte Beteiligungsverzeichnis = Saldo Beteiligungskonten (netto nach Wertberichtigungen) = Bilanzposition Beteiligungen; Stimmenanteil = Stimmen gehalten / Stimmen
    total (≥ 20 % → Vermutung Beteiligung; Stimmenmehrheit → Kontrolle → H3-320 (Befreiung Art. 963a OR prüfen, sonst ordentliche Revision))
  feststellung_wenn: Differenz Verzeichnis/Hauptbuch/Bilanz; Eigentum nicht belegt (z. B. Abtretung ohne Schriftform oder nötige Zustimmung); Beteiligung nicht gesondert im Anlagevermögen
    bzw. auf anderem Konto (z. B. Anzahlungen).
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Abstimmung einer Aufstellung der Finanzanlagen per Bilanzstichtag mit der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0280-s219
    zitat: Die Zusammensetzung der Bilanzposition Beteiligungen geht aus dem Beteiligungsverzeichnis hervor
  - quelle: hwp-bur-2023__rz-0304-s224
    zitat: Die Beteiligungen sind im Anlagevermögen gesondert auszuweisen.
  - quelle: or__art-960d
    zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 Prozent der Stimmrechte gewähren.
  - quelle: or__art-785
    zitat: Die Abtretung von Stammanteilen sowie die Verpflichtung zur Abtretung bedürfen der schriftlichen Form.
  - quelle: or__art-786
    zitat: Die Abtretung von Stammanteilen bedarf der Zustimmung der Gesellschafterversammlung.
  - quelle: or__art-786
    zitat: auf das Erfordernis der Zustimmung zur Abtretung verzichten
  - quelle: or__art-787
    zitat: so wird die Abtretung erst mit dieser Zustimmung rechtswirksam
  - quelle: or__art-963
    zitat: direkt oder indirekt über die Mehrheit der Stimmen im obersten Organ verfügt
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- id: H3-302
  vorgehen: 'WP-Schritt (SER: weiter gehend): nur auf ausdrückliche Anweisung des WP. Ohne Anweisung: nicht bearbeiten, Status «nicht bearbeitet – WP-Schritt». Erkannte Auslöser aus
    H3-101/102/201/301 (z. B. Buchwert > anteiliges EK, wiederkehrende Verluste) mit Zahlen als Notiz «Schlussbesprechung» bzw. Pendenz an den WP. Bei Anweisung: Buchwert mit anteiligem
    EK (letzte JR), Kurs und Steuerwert (Indiz) vergleichen; Aufwertungen (Art. 725c OR) erfassen; nur Kundenbewertungen nutzen. Unterdeckung > 0: zuerst die Ertragswert-/Planungsbegründung
    der GL auswerten (fehlt sie → Pendenz). Wesentliche Feststellung mit Buchungsvorschlag nur, wenn keine nachvollziehbare Begründung vorliegt und Verluste oder ein negativer Ausblick
    bestehen. Betrag = Buchwert − erzielbarer Wert. Ist der erzielbare Wert nicht belegt: Unterdeckung zum anteiligen EK als Indiz nennen; den Betrag bestimmt der WP.'
  nachweise:
  - Jahresrechnung/Revisionsbericht der Beteiligung
  - Jahresendkurs/Depotauszug
  - Werthaltigkeitsbeurteilung/Planungsrechnung GL
  - Kaufvertrag (Kaufpreisbasis)
  - Beteiligungsverzeichnis (Steuerwert, Aufwertungen)
  rechnen: 'Anteiliges EK = Eigenkapital Beteiligung × Kapitalquote; Unterdeckung = Buchwert − anteiliges EK (> 0: Ertragswertbegründung prüfen; fehlt sie → Pendenz; widersprechen Verluste/Ausblick
    → Wesentliche Feststellung); kotiert: Kurswert = Stückzahl × Jahresendkurs; Steuerwert gemäss Verzeichnis vs. Buchwert (nur Indiz); Obergrenze Buchwert = min(Anschaffungskosten;
    erzielbarer Wert)'
  feststellung_wenn: Buchwert über anteiligem EK bzw. Kurswert ohne nachvollziehbare Ertragswertbegründung bei Verlusten oder negativem Ausblick, wiederkehrende Verluste ohne Wertberichtigung,
    Bewertung über AK oder Aufwertung ohne Voraussetzungen (Art. 725c OR).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Punkte, die der Wirtschaftsprüfer mit dem Kunden besprechen sollte
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vergleich der Buchwerte nicht kotierter Wertpapiere mit dem inneren Wert aufgrund der letzten verfügbaren Jahresrechnung
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vergleich der Buchwerte kotierter Wertpapiere mit den Jahresendkursen
  - quelle: hwp-bur-2023__rz-0291-s222
    zitat: Sinkt der erzielbare Wert einer Beteiligung unter den bisherigen Buchwert, wird eine Wertberichtigung erforderlich.
  - quelle: hwp-bur-2023__rz-0292-s222
    zitat: beispielsweise eine Substanzwertbetrachtung oder eine einfache Ertragswertermittlung anhand einer Planungsrechnung
  - quelle: hwp-bur-2023__rz-0292-s222
    zitat: Andernfalls sind vertiefte Abklärungen vorzunehmen.
  - quelle: hwp-bur-2023__rz-0281-s220
    zitat: Beteiligungen dürfen höchstens zu den Anschaffungskosten bewertet werden
  - quelle: hwp-bur-2023__rz-0279-s219
    zitat: Steuerwert, Buchwert, Betrag von Aufwertungen (Art. 725c OR)
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: das Einholen von Bestätigungen von Dritten (Bank-, Debitoren- oder Kreditorenbestätigungen, Anwaltsbestätigungen, Experten- und Bewertungsgutachten
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- id: H3-303
  vorgehen: 'WP-Schritt (SER: weiter gehend): nur auf ausdrückliche Anweisung des WP. Ohne Anweisung: nicht bearbeiten, Status «nicht bearbeitet – WP-Schritt». Erkannte Auslöser aus
    H3-101/102/201/301 (z. B. Buchwert > anteiliges EK, wiederkehrende Verluste) mit Zahlen als Notiz «Schlussbesprechung» bzw. Pendenz an den WP. Bei Anweisung: Buchungen auf Beteiligungs-/WB-Konten
    mit Belegen (Kaufvertrag, Zahlung, VR-Beschluss, HR) und Gegenkonto abgleichen; AK inkl. Nebenkosten/Earn-out und Abgangserfolg nachrechnen; Nahestehung Verkäufer als Frage.'
  nachweise:
  - Kontoblätter Beteiligungen/Wertberichtigungen
  - Kauf-/Verkaufsverträge
  - Bankbelege
  - VR-/GV-Protokolle
  - HR-Auszüge
  rechnen: Anschaffungskosten = Kaufpreis + transaktionsbezogene Nebenkosten + aufgeschobene/bedingte Kaufpreise (sofern Ansatzkriterien erfüllt; ohne Finanzierungskosten); Veräusserungserfolg
    = Erlös − Buchwert; Buchung = Beleg (Betrag, Datum, Gegenkonto); Kaufpreis − anteiliges EK = im Preis bezahlter Mehrwert (Goodwill, Teil der AK)
  feststellung_wenn: Buchung ohne Beleg oder abweichend in Betrag/Datum/Gegenkonto, Goodwill/Gratisaktien separat aktiviert, Earn-out fehlt, Zuschreibung über AK, Abgang nicht zum Buchwert
    oder Kauf von Nahestehenden ohne Drittvergleich.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Prüfung der im Hauptbuch gebuchten Geschäftsfälle und Wertänderungen anhand der Unterlagen und der Gegenbuchungen
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Punkte, die der Wirtschaftsprüfer mit dem Kunden besprechen sollte
  - quelle: hwp-bur-2023__rz-0281-s220
    zitat: transaktionsbezogene Nebenkosten wie Courtagen, Kommissionen und Spesen (nicht aber Finanzierungskosten)
  - quelle: hwp-bur-2023__rz-0279-s219
