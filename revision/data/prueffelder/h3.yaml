- id: H3-403
  vorgehen: Für nicht kotierte Titel und Forderungsrechte (z.B. Darlehen an Beteiligungen) die Bonität anhand der letzten Jahresrechnung des Schuldners beurteilen (Eigenkapital, Ergebnis,
    Liquidität, Ausblick); Gesamtengagement Beteiligung + Darlehen + Forderungen betrachten und Wertberichtigungsreihenfolge beachten. Ergebnis als Vorbereitung für den WP dokumentieren.
  nachweise:
  - Jahresrechnung des Schuldners/Emittenten
  - Darlehensverträge
  - Sicherheiten
  rechnen: Gesamtengagement = Beteiligungsbuchwert + Darlehen + übrige Forderungen; Deckungsgrad = anteiliges EK bzw. erzielbarer Wert / Gesamtengagement
  feststellung_wenn: Schuldner mit Verlusten, Unterbilanz oder negativem Ausblick ohne Wertberichtigung, oder Wertberichtigung nicht zuerst der Beteiligung zugeordnet.
