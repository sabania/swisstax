bewertung:
- regel: Steueraufwand in der zugehörigen Gewinnperiode erfassen; die Gewinnsteuerlast entsteht mit der Gewinnerzielung.
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Die Gewinnsteuerlast entsteht gleichzeitig mit der Gewinnerzielung.
- regel: Steuern zurückstellen, soweit ein steuerbarer Gewinn entsteht.
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: soweit ein steuerbarer Gewinn entsteht, zurückzustellen sind
- regel: Geschuldete Steuern – veranlagt oder nicht – sind Fremdkapital; bereits veranlagte Steuern unter den übrigen kurzfristigen Verbindlichkeiten.
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: Geschuldete, von den Steuerverwaltungen am Bilanzstichtag bereits veranlagte Steuern sind in der Bilanz als übrige kurzfristige Verbindlichkeiten auszuweisen.
- regel: Noch nicht veranlagte geschuldete Steuern unter übrigen kurzfristigen Verbindlichkeiten oder passiven Rechnungsabgrenzungen.
  quelle: hwp-bur-2023__rz-0546-s269
  zitat: Geschuldete Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den passiven Rechnungsabgrenzungen auszuweisen.
- regel: Steuern sind bei der Ermittlung des Steueraufwands als geschäftsmässig begründeter Aufwand zu berücksichtigen.
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: Steuern sind als geschäftsmässig begründeter Aufwand bei der Ermittlung des Steueraufwands entsprechend zu berücksichtigen.
- regel: 'Mögliche Nachbelastungen (Steuerrevision, Rechtsmittel): Rückstellung nach Wahrscheinlichkeit am Tag der Bilanzerstellung schätzen.'
  quelle: hwp-bur-2023__rz-0547-s269
  zitat: Je nach Wahrscheinlichkeit einer Steuernachforderung ist am Tag der Bilanzerstellung die Höhe der erforderlichen Rückstellung zu schätzen.
- regel: 'Grundstückgewinnsteuern periodengerecht abgrenzen; SG (dualistisch) und Bund: Grundstückgewinne unterliegen der Gewinnsteuer; Steuern aus nicht steuerneutralen Umstrukturierungen
    im laufenden Jahr zurückstellen.'
  quelle: hwp-bur-2023__rz-0548-s269
  zitat: In Kantonen mit dem dualistischen System (z.B. St. Gallen, Zug) sowie bei der Besteuerung auf Bundesebene unterliegen Grundstückgewinne der (regulären) Gewinnsteuer.
- regel: Steuervorauszahlungen und erwartete Rückvergütungen können Aktiven sein; Bestand und Verjährung einzeln prüfen (VSt-Rückerstattung drei Jahre).
  quelle: hwp-bur-2023__rz-0549-s269
  zitat: Steuervorauszahlungen und erwartete Steuerrückvergütungen (beispielsweise Quellensteuern auf Zins- und Dividendenerträgen) können dazu führen, dass Steuern als Aktivposten erscheinen.
- regel: Für die laufende Steuerabgrenzung ist die Verrechnung von Verlustvorträgen mit dem Gewinn der Periode zulässig.
  quelle: hwp-bur-2023__rz-0551-s270
  zitat: Hingegen ist für die Ermittlung der Abgrenzung der laufenden Steuern eine Verrechnung von Verlustvorträgen mit dem Gewinn der laufenden Steuerperiode zulässig.
- regel: 'Latente Steuern nach OR: de facto Wahlrecht, stetig und für alle temporären Differenzen gleich; latente Steueraktiven nur bei erfüllten Aktivierungsvoraussetzungen (nicht auf
    steuerlichen Verlustvorträgen).'
  quelle: hwp-bur-2023__rz-0551-s270
  zitat: ein Wahlrecht dar, das stetig und für alle temporären Differenzen gleich anzuwenden ist
- regel: ER-Position direkte Steuern umfasst bezahlte und abgegrenzte Steuern; Aufteilung Gewinn-/Kapitalsteuern gesetzlich nicht verlangt.
  quelle: hwp-bur-2023__rz-0234-s114
  zitat: Diese Position beinhaltet nicht nur die bezahlten, sondern auch die abgegrenzten Steuern.
- regel: Nachsteuern, Strafsteuern, Bussen können als ausserordentlicher/periodenfremder Aufwand gezeigt werden; Kapitalsteuern wahlweise im Steuer- oder übrigen betrieblichen Aufwand
    (stetig).
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Nachsteuern, Strafsteuern oder Bussen können dem ausserordentlichen, einmaligen oder periodenfremden Aufwand zugeordnet werden.
- regel: Handelsrechtlich notwendige Steuerrückstellungen sind unabhängig von der steuerlichen Anerkennung zu bilden.
  quelle: hwp-bur-2023__rz-0513-s261
  zitat: Handelsrechtlich notwendige Rückstellungen müssen auch dann gebildet werden, wenn sie steuerlich keine Anerkennung finden.
- regel: 'Mögliche Anhangangaben zu direkten Steuern: Aufteilung Ertrags-/Kapitalsteuern, Stand der Veranlagung.'
  quelle: hwp-bur-2023__rz-0816-s339-t4
  zitat: Aufteilung Ertrags-/Kapitalsteuern
- regel: Bestand stiller Reserven jährlich je Bilanzposition (Buchwert vs. zulässiger Höchstwert) ermitteln und mit Vorjahr vergleichen.
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
- regel: Unverzinste oder ungenügend verzinste Darlehen an Beteiligte bzw. übersetzte Zinsen auf Beteiligtendarlehen sind geldwerte Leistungen (VSt 35 %; gleiche Kriterien DBG). Massgebend
    ist das Rundschreiben des jeweiligen Steuerjahres.
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- regel: Zinsen auf verdecktem Eigenkapital werden dem steuerbaren Gewinn zugerechnet (KS ESTV 6a).
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
fallstricke:
- text: 'Die eingeschränkte Revision ist keine Steuerprüfung: keine Prüfung der Steuerkonformität der Deklaration; beurteilt wird nur die Auswirkung auf die Jahresrechnung.'
  quelle: ser-2022__anh-c-s057-1
  zitat: keine Befragungen oder weiteren Prüfungen zur Aufdeckung von deliktischen Handlungen und weiteren Gesetzesverstössen (z. B. betreffend direkte Steuern
- text: 'S1-102, S1-103 und S1-303 entsprechen im SER weiter gehenden Prüfungshandlungen: nur bei Hinweisen auf Fehlaussagen oder erhöhtem inhärentem Risiko, Begründung dokumentieren.'
  quelle: hwp-er-2026__rz-0132-s203
  zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
    anzunehmen sind
- text: Auch nicht veranlagte Steuern sind Fremdkapital – «noch keine Veranlagung» rechtfertigt keine fehlende Abgrenzung.
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: dass geschuldete Steuern – veranlagt oder nicht veranlagt – Fremdkapital darstellen
- text: 'Verlustjahr heisst nicht «kein Steueraufwand»: Kapitalsteuern, separat besteuerte Gewinne und periodenfremde Nachzahlungen bleiben; Kapitalsteuer kann im übrigen betrieblichen
    Aufwand stecken (Analytik bereinigen).'
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Die Kapitalsteuern können entweder im Steueraufwand oder
- text: Steuerliche Verlustvorträge wirken nur über die laufende Steuerrückstellung; ein latentes Steuerguthaben darauf ist im OR-Abschluss nicht zu aktivieren.
  quelle: ef-2020-10-latente-steuern__s003-5
  zitat: In diesem Fall wird der steuerliche Verlustvortrag jedoch für die Berechnung der laufenden Steuerrückstellung berücksichtigt
- text: Steuerliche und handelsrechtliche Rückstellungszulässigkeit unterscheiden sich; steuerlich motivierte Rückstellungen über Bedarf sind stille Reserven (S1-321).
  quelle: hwp-bur-2023__rz-0212-s107
  zitat: Die steuerrechtliche Zulässigkeit von Rückstellungen kann von der handelsrechtlichen abweichen.
- text: Zinssätze für geldwerte Leistungen nur aus dem ESTV-Rundschreiben des betreffenden Steuerjahres; das im Wiki vorhandene Rundschreiben 2026 gilt nicht für 2025.
  quelle: estv-zinsen-2026__s001-1
  zitat: Steuerlich anerkannte Zinssätze 2026 für Vorschüsse oder Darlehen in Schweizer Franken
- text: 'Ob eine Leistung angemessen abgegolten ist, ist Ermessensfrage: der Agent hält geldwerte Leistungen nur fest; Beurteilung, Mitteilung an VR und Hinweis im Bericht entscheidet
    der WP.'
  quelle: hwp-er-2026__rz-0163-s212
  zitat: Bei der Beurteilung, ob eine Leistung der Gegenleistung entspricht, besteht in der Praxis ein erheblicher Ermessensspielraum.
- text: Keine Bestätigungen bei Steuerbehörden selbst einholen; nur beim Unternehmen vorhandene Verfügungen, Rechnungen und Korrespondenz verwenden.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: Befragungen nur als schriftlich festgehaltene Frage und Antwort verwertbar; bei wesentlichen Steuerpositionen zusätzlich analytisch/Detail prüfen.
  quelle: hwp-er-2026__rz-0105-s198
  zitat: Gemäss SER stützt sich der Abschlussprüfer bei wesentlichen Jahresabschlussposten nicht nur auf Befragungen ab
- text: 'Hat die Revisionsstelle die Steuerabgrenzung oder Steuererklärung selbst erstellt, besteht Selbstprüfungsrisiko: Unabhängigkeitsmassnahmen beim WP klären.'
  quelle: ser-2022__anh-b-s049-2
  zitat: Da beim Mitwirken bei der Buchführung per se das Risiko der Selbstprüfung besteht
- text: Auflösungsdifferenz der Vorjahres-Steuerrückstellung (Zahlung ≠ Rückstellung) ist periodenfremd und ggf. im Anhang zu erläutern; nicht mit dem laufenden Steueraufwand vermischen.
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- text: Veranlagungsstand getrennt für Bund und Kanton/Gemeinde erfassen; eine definitive Veranlagung auf einer Ebene sagt nichts über die andere.
fragen_kunde:
- frage: Sind alle direkten Steuern früherer Perioden (Bund, Kanton/Gemeinde) bezahlt oder abgegrenzt? Bitte Liste je Steuerperiode mit Status (bezahlt/offen, Betrag).
  zweck: S1-101 (VO, PA); Antwort schriftlich dokumentieren
- frage: Fanden im Geschäftsjahr oder bis heute Steuerrevisionen, Buchprüfungen, Nachforschungen oder Rückfragen der Steuerbehörden statt? Bitte Korrespondenz und allfällige Revisionsberichte
    beilegen.
  zweck: S1-102, S1-403 (RV, VO)
- frage: Für welche Steuerperioden liegen definitive Veranlagungen vor (getrennt Bund und Kanton)? Bitte Veranlagungsverfügungen einreichen.
  zweck: S1-103 (RV); Stand der Veranlagung
- frage: 'Sind Einsprachen, Rekurse oder Beschwerden in Steuersachen hängig? Wenn ja: Periode, Streitpunkt, Streitbetrag und Einschätzung des Ausgangs.'
  zweck: S1-104 (RV, VO); Rückstellung oder Eventualverbindlichkeit
- frage: Wer hat die Steuerabgrenzung 2025 berechnet und mit welchen Parametern (Steuersätze/-füsse, Verlustvorträge, steuerbares Kapital, Akontozahlungen)? Bitte Berechnung einreichen.
  zweck: S1-301, S1-304 (BE, RI)
- frage: Welche provisorischen Steuerrechnungen und Akontozahlungen betreffen 2025, und bestehen Steuerguthaben oder Rückerstattungsansprüche (inkl. Verrechnungssteuer)?
  zweck: S1-302, S1-303, S1-304
- frage: Gab es Leistungen an Aktionäre, Organe oder Nahestehende zu nicht marktüblichen Bedingungen (Darlehenszinsen, Saläre, Spesen, Privataufwand, Fahrzeugnutzung, Käufe/Verkäufe
    von Aktiven)?
  zweck: S1-401 (RV, VO, BE)
- frage: Lagen 2025 besondere steuerliche Verhältnisse vor (Grundstückgewinne, Umstrukturierungen, Sanierungsmassnahmen/Forderungsverzichte, Kapitalerhöhung, Ausschüttungen aus Kapitaleinlagereserven,
    Steuerrulings, abweichendes Geschäftsjahr)?
  zweck: S1-402 (EN, VO, PA)
- frage: Wie haben sich die stillen Reserven entwickelt (inkl. übersetzter Steuerrückstellungen und versteuerter stiller Reserven)? Bitte Detailnachweis einreichen.
  zweck: S1-321 (BE); Nettoauflösung Anhang
- frage: Werden latente Steuern erfasst (Wahlrecht), und falls ja, nach welcher Methode und mit welchem Steuersatz?
  zweck: S1-301, Bewertung latente Steuern (Stetigkeit)
