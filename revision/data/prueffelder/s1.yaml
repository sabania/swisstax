schritte:
- id: S1-101
  vorgehen: 'Schriftliche Frage an Leitung Finanzen als Pendenz erfassen bzw. Antwort aus der Kundenbefragung (10.11) auswerten: Sind alle direkten Steuern früherer Perioden bezahlt
    oder abgegrenzt? Antwort mit Kontoblatt Steuerrückstellung/-verbindlichkeit, Zahlungen im Geschäftsjahr und letzter Veranlagung abgleichen. Im Textfeld: Frage, Antwort, Datum, offene
    Perioden, Abgleich.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Kontoblatt Steuerrückstellung/Steuerverbindlichkeiten
  - Steuerrechnungen bzw. Steuerkontoauszug
  - Zahlungsbelege
  rechnen: 'Je offene Steuerperiode: Rückstellung/Verbindlichkeit 31.12. ≥ Steuer gemäss Rechnung/Schätzung − bezahlte Akonti; Summe offene Perioden = Saldo Steuerrückstellung + Steuerverbindlichkeiten'
  feststellung_wenn: Offene Steuerperiode weder bezahlt noch abgegrenzt, Antwort widerspricht der Buchhaltung oder Antwort fehlt (Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Befragung, ob alle direkten Steuern aus früheren Abschlussperioden bezahlt oder abgegrenzt wurden
  - quelle: hwp-bur-2023__rz-0545-s268
    zitat: Ebenso müssen Steuernachzahlungen als Folge definitiver Einschätzungen als Verbindlichkeit berücksichtigt werden.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: S1-102
  vorgehen: 'WP-Schritt (SER: weiter gehend); Agent bereitet vor: Frage nach Steuerrevisionen, Nachforschungen, Rückfragen als Pendenz erfassen; Steuerkorrespondenz in M-Files suchen
    und je Schreiben Datum, Behörde, Periode, Gegenstand, geforderter Betrag, Status auflisten. Mögliche Nachforderungen der gebuchten Rückstellung gegenüberstellen. Beurteilung durch
    WP.'
  nachweise:
  - Korrespondenz mit Steuerbehörden
  - Bericht/Verfügung Steuerrevision
  - Schriftliche Antwort der Unternehmensleitung
  - Kontoblatt Steuerrückstellung
  rechnen: Summe mögliche Nachforderungen gemäss Korrespondenz − gebuchte Rückstellung/Verbindlichkeit für diese Perioden = ungedeckter Betrag
  feststellung_wenn: Nachforderung oder Auflage aus Korrespondenz ohne Rückstellung/Offenlegung, Korrespondenz nicht vorgelegt oder Widerspruch zur Antwort.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-2
    zitat: Befragung, ob eine Steuerrevision, andere Nachforschungen oder Rückfragen seitens der Steuerbehörden stattgefunden haben
  - quelle: ser-2022__anh-d-s089-2
    zitat: Einblick in entsprechende Korrespondenz zur Feststellung allfälliger Nachforderungen und Risiken, für welche Rückstellungen zu bilden sind
  - quelle: hwp-bur-2023__rz-0547-s269
    zitat: Je nach Wahrscheinlichkeit einer Steuernachforderung ist am Tag der Bilanzerstellung die Höhe der erforderlichen Rückstellung zu schätzen.
- id: S1-103
  vorgehen: 'WP-Schritt; Agent: Frage nach definitiven Veranlagungen als Pendenz, vorhandene Veranlagungsverfügungen sammeln. Tabelle je Periode und Ebene (Bund, Kanton/Gemeinde): Status
    provisorisch/definitiv, Datum, veranlagter Gewinn/Kapital, Steuer, offener Betrag. Abweichungen zur Deklaration und Nachzahlungen markieren; Beurteilung WP.'
  nachweise:
  - Veranlagungsverfügungen Bund und Kanton
  - Steuerrechnungen
  - Schriftliche Antwort der Unternehmensleitung
  rechnen: 'Je Periode/Ebene: Steuer gemäss definitiver Veranlagung − Rückstellung bzw. bezahlte Akonti = zu buchende Nachzahlung/Rückerstattung'
  feststellung_wenn: Nachzahlung aus definitiver Veranlagung nicht gebucht, Veranlagung weicht von Deklaration ab ohne Folgeprüfung, oder Veranlagungsstand unbekannt (Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s089-2
    zitat: Befragung, inwieweit Steuerveranlagungen definitiv sind
  - quelle: hwp-bur-2023__rz-0545-s268
    zitat: Ebenso müssen Steuernachzahlungen als Folge definitiver Einschätzungen als Verbindlichkeit berücksichtigt werden.
  - quelle: hwp-bur-2023__rz-0816-s339-t4
    zitat: Stand der Veranlagung
- id: S1-104
  vorgehen: 'WP-Schritt; Agent: Frage an die Unternehmensleitung nach hängigen Einsprachen, Rekursen, Beschwerden (Periode, Streitpunkt, Streitbetrag, Einschätzung) als Pendenz. Antwort
    mit Korrespondenz/Entscheiden abgleichen und gebuchter Rückstellung bzw. Anhangangabe Eventualverbindlichkeit gegenüberstellen. Risiko beurteilt der WP.'
  nachweise:
  - Einsprachen, Rekurse, Entscheide
  - Einschätzung Steuervertreter
  - Schriftliche Antwort der Unternehmensleitung
  - Anhang Jahresrechnung
  rechnen: 'Je Verfahren: Streitbetrag und geschätzter Mittelabfluss vs. gebuchte Rückstellung bzw. Betrag Eventualverbindlichkeit im Anhang'
  feststellung_wenn: Hängiges Verfahren mit wahrscheinlichem Mittelabfluss ohne Rückstellung, oder unwahrscheinlicher/nicht schätzbarer Abfluss ohne Anhangangabe; fehlende Antwort als
    Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-2
    zitat: Einsprachen und Rekurse hängig sind
  - quelle: hwp-bur-2023__rz-0547-s269
    zitat: Nachbelastungen können sich aufgrund von Steuerrevisionen und bei hängigen Rechtsmittelverfahren ergeben
  - quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
      (Eventualverbindlichkeit)
- id: S1-201
  vorgehen: 'Aus Saldoliste/Jahresrechnung Ergebnis vor Steuern und direkte Steuern (laufend/Vorjahr) entnehmen, Steuerquote und Veränderung im Rechenmodul berechnen. Erwartung bilden:
    Gewinnjahr Gewinn- plus Kapitalsteuer, Verlustjahr grundsätzlich nur Kapitalsteuer plus allf. periodenfremde Effekte. Abweichungen über Nicht-Aufgriffsgrenze als Frage erfassen.
    Im Textfeld: Tabelle, Erwartung, Erklärung.'
  nachweise:
  - Saldoliste Erfolgsrechnung/Bilanz mit Vorjahr
  - Jahresrechnung
  - Steuerberechnung
  rechnen: 'Steuerquote = Direkte Steuern / Ergebnis vor Steuern (bei Gewinn); Veränderung = Steuern X − Steuern X-1; Verlustjahr: Steueraufwand vs. erwartete Kapitalsteuer'
  feststellung_wenn: Gewinnjahr ohne Gewinnsteuer, Verlustjahr mit unerklärtem Steueraufwand oder Quote/Veränderung ohne plausible Erklärung über der Nicht-Aufgriffsgrenze.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Beurteilung des Steueraufwands im Vergleich zum Periodenergebnis und zum Vorjahr
  - quelle: hwp-bur-2023__rz-0801-s331
    zitat: Die Gewinnsteuerlast entsteht gleichzeitig mit der Gewinnerzielung.
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
- id: S1-301
  vorgehen: 'Steuerberechnung des Kunden beiziehen (sonst Pendenz). Prüfen: Ausgangsgrösse = Ergebnis vor Steuern gemäss JR; Aufrechnungen; Verlustverrechnung gemäss letzter Veranlagung;
    steuerbares Kapital = Eigenkapital JR (+ versteuerte Reserven); Steuersätze/-füsse von Sitz und Periode (Plausibilisierung Treuhand-Almanach 2025); Akonti. Resultat mit gebuchtem
    Aufwand/Saldo abstimmen und nachrechnen.'
  nachweise:
  - Steuerberechnung 2025
  - Jahresrechnung/Saldoliste
  - Letzte Veranlagung (Verlustvortrag)
  - Steuerfüsse/-sätze des Steuerjahres
  - Akontorechnungen
  rechnen: Ergebnis vor Steuern (Berechnung) = JR; Gewinnsteuer = max(0; steuerbarer Gewinn − verrechenbare Verluste) × Satz; Kapitalsteuer = steuerbares Kapital × Satz; Abgrenzung =
    Gewinn- + Kapitalsteuer − Akonti = Saldo Steuerrückstellung/-verbindlichkeit
  feststellung_wenn: Keine Berechnung, Ausgangswert ≠ JR, Satz/Steuerfuss falsch oder Vorjahr, Verlustvortrag unbelegt, Kapitalsteuer fehlt, oder Resultat ≠ gebuchter Betrag über Nicht-Aufgriffsgrenze.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der Berechnung der Steuerabgrenzung mit der Jahresrechnung (inkl. der Parameter, die für die Berechnung verwendet wurden)
  - quelle: hwp-bur-2023__rz-0551-s270
    zitat: Hingegen ist für die Ermittlung der Abgrenzung der laufenden Steuern eine Verrechnung von Verlustvorträgen mit dem Gewinn der laufenden Steuerperiode zulässig.
  - quelle: hwp-bur-2023__rz-0545-s268
    zitat: Steuern sind als geschäftsmässig begründeter Aufwand bei der Ermittlung des Steueraufwands entsprechend zu berücksichtigen.
  - quelle: treuhand-almanach-2026__s056-1
    zitat: für die Steuerperiode 2025
- id: S1-302
  vorgehen: 'Kennzeichnung im Katalog offen («?», keine Prüfziele): als Detailprüfung vorbereiten, Kennzeichnung durch WP bestätigen lassen. Buchungen auf den Steuerkonten des Geschäftsjahres
    mit Steuerrechnungen (Akonto, Schlussrechnung), Steuererklärung und Veranlagungsverfügungen je Periode/Ebene abgleichen. Abweichung Deklaration–Veranlagung (Aufrechnungen) festhalten.'
  nachweise:
  - Kontoblätter Steuerkonten
  - Steuerrechnungen
  - Steuererklärung (Kopie)
  - Veranlagungsverfügungen
  - Zahlungsbelege
  rechnen: 'Je Buchung: Betrag Buchung = Betrag Steuerrechnung/Verfügung; deklarierter Gewinn/Kapital = Jahresrechnung der Periode; veranlagter − deklarierter Gewinn = Aufrechnungen'
  feststellung_wenn: Buchung ohne Rechnung/Verfügung, Betragsdifferenz, oder Veranlagung weicht von Deklaration ab ohne gebuchte Konsequenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der Steuererklärung mit der zugrunde liegenden Jahresrechnung
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-or-2024__rz-0960-s369
    zitat: Abgleich der Steuerrechnungen mit den Steuererklärungen und -einschätzungen
- id: S1-151
  vorgehen: 'Katalog (Anhang H) enthält keinen Text (Detail, WP, RV VO BE RI). Agent bearbeitet nichts eigenständig, sondern erfasst Pendenz an WP: Inhalt festlegen oder Schritt als
    nicht anwendbar markieren. Hinweis (nicht bestätigt): Die SER-Detailprüfung «Abstimmung der Steuererklärung mit der zugrunde liegenden Jahresrechnung» hat in S1 keinen eigenen Schritt.'
  nachweise:
  - Katalog revio 4.0 (Anhang H)
  - Vorgabe des Wirtschaftsprüfers
  rechnen: ''
  feststellung_wenn: Keine Feststellung; solange kein Katalogtext bzw. keine WP-Vorgabe vorliegt, Pendenz «Inhalt S1-151 festlegen» offen lassen.
  fundstellen:
  - quelle: katalog-revio4__c003-57
    zitat: S1-151 | Detail | WP | RV VO BE RI
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der Steuererklärung mit der zugrunde liegenden Jahresrechnung
- id: S1-303
  vorgehen: 'WP-Schritt (SER: weiter gehend). Rückstellungsspiegel Steuern je Periode/Ebene erstellen: Anfangsbestand (= Vorjahres-JR) + Bildung (S1-301) − Zahlungen (Bank, Steuerkontoauszug)
    ± Nachzahlung/Auflösung (Veranlagung) = Endbestand; mit Steuererklärung abgleichen. Zahlungen in neuer Rechnung einbeziehen; Auflösungsdifferenzen als periodenfremd kennzeichnen.'
  nachweise:
  - Rückstellungsspiegel
  - Kontoblatt Steuerrückstellung
  - Bankauszüge/Zahlungsbelege
  - Steuererklärung
  - Veranlagungen
  - Kontoblätter/Bankauszüge Folgejahr
  rechnen: AB + Bildung − Zahlungen ± Nachzahlung/Auflösung = EB = Saldo 31.12.; AB = Saldo Vorjahres-JR; Zahlung Vorjahresperiode − Rückstellung Vorjahr = periodenfremder Aufwand/Ertrag
  feststellung_wenn: EB ≠ Saldo, Zahlung nicht belegt, Vorjahresrückstellung ausgebucht ohne Zahlung/Veranlagung oder Differenz nicht als periodenfremd erkannt.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der Entwicklung der Steuerabgrenzung mit der Steuererklärung und den Zahlungen
  - quelle: ser-2022__anh-d-s088-1
    zitat: Kontendurchsicht betreffend die weitere Entwicklung in neuer Rechnung
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
      anzunehmen sind
- id: S1-304
  vorgehen: Prüfen, ob für die laufende Periode (Gewinn- und Kapitalsteuer, ggf. Grundstückgewinnsteuer) und alle nicht veranlagten Vorperioden Rückstellung/Abgrenzung besteht (Ergebnisse
    S1-101 bis S1-303). Ausweis und Bewertung beurteilen; Überdeckung als stille Reserve an S1-321; Steuerguthaben (Vorauszahlungen, VSt) auf Bestand und Verjährung prüfen.
  nachweise:
  - Steuerberechnung
  - Kontoblätter Steuerkonten
  - Veranlagungsstand (S1-103)
  - Korrespondenz (S1-102/S1-104)
  - Rückstellungsspiegel
  rechnen: Soll = Σ (geschätzte Steuer je offene Periode/Ebene − Akonti) + Risiken; Ist = Steuerrückstellung + Steuerverbindlichkeiten − Steuerguthaben; Differenz = Ist − Soll
  feststellung_wenn: Keine oder zu tiefe Rückstellung auf laufendem steuerbarem Gewinn/Kapital, falscher Ausweis, Steuerguthaben verjährt/unbelegt, oder Überdeckung ohne Begründung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0801-s331
    zitat: soweit ein steuerbarer Gewinn entsteht, zurückzustellen sind
  - quelle: hwp-bur-2023__rz-0546-s269
    zitat: Geschuldete Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den passiven Rechnungsabgrenzungen auszuweisen.
  - quelle: or__art-960e
    zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
      gebildet werden.
  - quelle: hwp-bur-2023__rz-0549-s269
    zitat: Dabei gelten zum Teil verkürzte Verjährungsfristen (beispielsweise für die Rückerstattung der Verrechnungssteuer drei Jahre).
- id: S1-321
  vorgehen: 'Standardschritt: Detailnachweis stille Reserven (je Position, 31.12. und Vorjahr) beiziehen, mit Saldoliste abstimmen, Veränderung berechnen. Steuerbezug: übersetzte Steuerrückstellungen
    und versteuerte stille Reserven festhalten. Nettoauflösung mit Jahresergebnis vergleichen, Anhangangabe nach Art. 959c Abs. 1 Ziff. 3 OR prüfen. Fehlt der Nachweis: Pendenz.'
  nachweise:
  - Detailnachweis stille Reserven
  - Saldoliste
  - Steuerberechnung (versteuerte Reserven)
  - Anhang
  rechnen: 'Veränderung = Bestand 31.12.X − Bestand 31.12.X-1; bei Nettoauflösung: Anteil am Jahresergebnis; Anhangbetrag = Nettoauflösung'
  feststellung_wenn: Wesentliche Nettoauflösung ohne Anhangangabe, Gewinn statt Verlust durch Auflösung, oder Detailnachweis fehlt/stimmt nicht mit Saldoliste.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
  - quelle: hwp-bur-2023__rz-0675-s298
    zitat: wenn aufgrund der Auflösung von stillen Reserven ein Jahresgewinn anstelle eines Jahresverlusts entsteht
- id: S1-401
  vorgehen: Transaktionen mit Beteiligten/Nahestehenden aus anderen Prüffeldern und Kontendurchsicht zusammentragen (Darlehen/Zinsen, Saläre, Spesen, Privataufwand, Fahrzeuge, Käufe/Verkäufe,
    entgangene Erträge). Zinssätze mit ESTV-Rundschreiben des Steuerjahres vergleichen. Liste mit Sachverhalt, Betrag, möglichen Steuerfolgen festhalten; Beurteilung und Vorgehen nach
    Art. 678 OR durch WP.
  nachweise:
  - Darlehensverträge mit Beteiligten
  - Kontoblätter Zinsen, Löhne, Spesen
  - Aktienbuch, GV-/VR-Protokolle
  - ESTV-Rundschreiben Zinssätze des Steuerjahres
  rechnen: 'Je Darlehen: Zins vertraglich − Zins zum ESTV-Satz des Jahres = mögliche geldwerte Leistung; mögliche VSt = geldwerte Leistung × 35 %'
  feststellung_wenn: Leistung an Beteiligte/Nahestehende ohne angemessene Gegenleistung oder Zinssatz ausserhalb der ESTV-Sätze ohne Nachweis; mögliche Steuerfolgen nicht zurückgestellt.
  fundstellen:
  - quelle: hwp-er-2026__rz-0163-s212
    zitat: Es handelt sich um eine geldwerte Leistung, die eine Gesellschaft ihren Gesellschaftern oder diesen nahestehenden Personen erbringt
  - quelle: estv-zinsen-2026__s001-1
    zitat: Die Gewährung unverzinslicher oder ungenügend verzinster Vorschüsse oder Darlehen an Beteiligte oder an ihnen nahestehende Dritte stellt eine geldwerte Leistung dar.
  - quelle: hwp-bur-2023__rz-0680-s299
    zitat: nicht marktgerechte Zinssätze (zu niedrig verzinste Darlehen der Gesellschaft oder überhöht verzinste Gesellschafterdarlehen)
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Beurteilung der (Transfer-)Preise der jeweiligen Geschäftsvorfälle mittels Drittvergleichs
- id: S1-402
  vorgehen: 'Aus Protokollen, Verträgen und Antworten besondere steuerliche Verhältnisse des Jahres festhalten: Grundstückgewinne, nicht steuerneutrale Umstrukturierungen, Sanierung/Kapitalerhöhung
    (Emissionsabgabe), Ausschüttungen (VSt), verdecktes Eigenkapital, Kurz-/Langjahr, Rulings. Je Sachverhalt prüfen, ob Steuerfolgen abgegrenzt bzw. offengelegt sind; offene Punkte
    als Frage.'
  nachweise:
  - GV-/VR-Protokolle
  - Verträge (Grundstücke, Umstrukturierungen)
  - Unternehmensinformationen
  - Steuerberechnung
  - Steuerrulings
  rechnen: Separat besteuerter Gewinn × Satz = abzugrenzende Steuer; Zinsen auf verdecktem Eigenkapital = nicht abzugsfähiger Zins (Aufrechnung in Steuerberechnung)
  feststellung_wenn: Besonderer Sachverhalt mit Steuerfolgen (z.B. Grundstückgewinn, Umstrukturierung, Emissionsabgabe, VSt) im Geschäftsjahr nicht abgegrenzt oder nicht offengelegt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0548-s269
    zitat: Einmalige Steuerfolgen können sich zudem bei nicht steuerneutralen Umstrukturierungen ergeben. Diese Steuern sind im laufenden Geschäftsjahr zurückzustellen.
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung der korrekten steuerlichen Behandlung von Kapitalerhöhungen (Emissionsabgabe) und -herabsetzungen sowie Gewinnausschüttungen (Verrechnungssteuer)
  - quelle: estv-ks-6a-2024__3-1
    zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
  - quelle: hwp-bur-2023__rz-0550-s270
    zitat: Art. 79 Abs. 3 DBG schreibt vor, dass in jedem Kalenderjahr ein Geschäftsabschluss zu erstellen ist.
- id: S1-403
  vorgehen: 'Bericht/Verfügung der letzten Steuerrevision aus Dauerakte bzw. M-Files beiziehen (sonst Pendenz). Feststellungen (Aufrechnungen, Auflagen, z.B. Abschreibungen, Rückstellungen,
    Privatanteile, Zinsen) auflisten und prüfen: Nachforderung gebucht/bezahlt, Auflage im laufenden Abschluss umgesetzt, wiederkehrendes Risiko in Steuerberechnung berücksichtigt. Dauerakte
    nachführen.'
  nachweise:
  - Bericht/Verfügung der Steuerrevision
  - Nachsteuerrechnungen und Zahlungen
  - Dauerakte
  - Steuerberechnung laufendes Jahr
  rechnen: Nachforderung gemäss Revision − gebuchte Verbindlichkeit/Zahlung = Differenz; gleichartige Aufrechnung im laufenden Jahr × Steuersatz = Risiko
  feststellung_wenn: Nachforderung nicht gebucht, Auflage im laufenden Jahr nicht umgesetzt (gleiche Aufrechnung ohne Rückstellung), oder Revisionsergebnis nicht verfügbar (Pendenz).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0547-s269
    zitat: Nachbelastungen können sich aufgrund von Steuerrevisionen und bei hängigen Rechtsmittelverfahren ergeben
  - quelle: ser-2022__anh-d-s089-2
    zitat: Befragung, ob eine Steuerrevision, andere Nachforschungen oder Rückfragen seitens der Steuerbehörden stattgefunden haben
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt
