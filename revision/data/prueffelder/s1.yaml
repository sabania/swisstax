code: S1
bezeichnung: Steuern
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 17
    korrigiert: true
kurzbeschrieb: 'Direkte Steuern (Gewinn-, Kapital-, Grundstückgewinnsteuern) in Bilanz (Steuerverbindlichkeiten, -abgrenzungen, -rückstellungen, Steuerguthaben) und Erfolgsrechnung (separater
  Ausweis). Eingeschränkte Revision: Abgrenzung, Abstimmung der Steuerabgrenzung, Veranlagungsstand, Steuerrisiken, geldwerte Leistungen, verdecktes Eigenkapital, VSt und Emissionsabgabe
  bei Sanierung – keine Steuerprüfung.'
gesetz:
- thema: Direkte Steuern als eigene Mindestposition der Erfolgsrechnung (Art. 959b Abs. 2 Ziff. 10 bzw. Abs. 3 Ziff. 7 OR)
  quelle: or__art-959b-t1
  zitat: direkte Steuern
- thema: 'Ausweis geschuldeter Steuern: übrige kurzfristige Verbindlichkeiten bzw. passive Rechnungsabgrenzungen (Art. 959a Abs. 2 Ziff. 1 lit. c/d OR)'
  quelle: or__art-959a-t1
  zitat: übrige kurzfristige Verbindlichkeiten
- thema: Ausweis Rückstellungen (Art. 959a Abs. 2 Ziff. 2 lit. c OR)
  quelle: or__art-959a-t1
  zitat: Rückstellungen sowie vom Gesetz vorgesehene ähnliche Positionen
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Vollständigkeit der Rechnungslegung (Art. 958c Abs. 1 Ziff. 2 OR)
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- thema: 'Verrechnungsverbot: Steuerguthaben und Steuerverbindlichkeiten unsaldiert ausweisen (Art. 958c Abs. 1 Ziff. 7 OR)'
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Rückstellungspflicht bei erwartetem Mittelabfluss (Art. 960e Abs. 2 OR)
  quelle: or__art-960e
  zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
    gebildet werden.
- thema: Keine Auflösungspflicht nicht mehr begründeter Rückstellungen (Art. 960e Abs. 4 OR) – stille Reserven
  quelle: or__art-960e
  zitat: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden.
- thema: Überprüfung bei Anzeichen zu geringer Rückstellungen (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: Eventualverbindlichkeiten, z.B. Steuerrisiken (Art. 959c Abs. 2 Ziff. 10 OR)'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: 'Anhang: Erläuterung periodenfremder Positionen, z.B. Nachsteuern (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: Gesonderter Ausweis gegenüber Beteiligten und Organen (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
- thema: Rückerstattung ungerechtfertigt bezogener Leistungen – geldwerte Leistungen (Art. 678 Abs. 1 OR)
  quelle: or__art-678
  zitat: oder anderen Leistungen verpflichtet, wenn sie diese ungerechtfertigt bezogen haben
- thema: Rückerstattung bei Rechtsgeschäften mit Beteiligten/Nahestehenden (z.B. Darlehen, Käufe) bei offensichtlichem Missverhältnis (Art. 678 Abs. 2 OR)
  quelle: or__art-678
  zitat: soweit ein offensichtliches Missverhältnis zwischen Leistung und Gegenleistung besteht
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: Steuern der laufenden Periode (Gewinn- und Kapitalsteuer) nicht oder zu tief abgegrenzt.
  pruefziele:
  - VO
  - PA
  - BE
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Der Steueraufwand ist in der dazugehörenden Gewinnperiode zu erfassen.
- text: Direkte Steuern früherer Perioden weder bezahlt noch abgegrenzt; Nachzahlungen aus definitiven Veranlagungen nicht erfasst.
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: Ebenso müssen Steuernachzahlungen als Folge definitiver Einschätzungen als Verbindlichkeit berücksichtigt werden.
- text: Nachforderungen aus Steuerrevisionen, Auflagen oder hängigen Einsprachen/Rekursen nicht zurückgestellt bzw. nicht als Eventualverbindlichkeit offengelegt.
  pruefziele:
  - RV
  - VO
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0547-s269
  zitat: Nachbelastungen können sich aufgrund von Steuerrevisionen und bei hängigen Rechtsmittelverfahren ergeben
- text: Berechnung der Steuerabgrenzung fehlerhaft (Ausgangsgrösse ≠ Jahresrechnung, falsche Steuersätze/-füsse oder Satzart, nicht belegte Verlustverrechnung, fehlende Kapitalsteuer).
  pruefziele:
  - BE
  - RI
  quelle: ser-2022__anh-d-s089-1
  zitat: Abstimmung der Berechnung der Steuerabgrenzung mit der Jahresrechnung (inkl. der Parameter, die für die Berechnung verwendet wurden)
- text: 'Entwicklung der Steuerrückstellung nicht nachvollziehbar: Vorjahresrückstellung ausgebucht ohne Zahlung/Veranlagung, Differenzen nicht als periodenfremd erfasst.'
  pruefziele:
  - EN
  - PA
  - RI
  quelle: ser-2022__anh-d-s089-1
  zitat: Abstimmung der Entwicklung der Steuerabgrenzung mit der Steuererklärung und den Zahlungen
- text: Separat besteuerte Gewinne (Grundstückgewinne, nicht steuerneutrale Umstrukturierungen) nicht periodengerecht abgegrenzt.
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0548-s269
  zitat: Auf Grundstückgewinnen geschuldete Steuern sind periodengerecht abzugrenzen.
- text: Geldwerte Leistungen an Beteiligte/Nahestehende (z.B. zu tief verzinste Darlehen an Aktionäre, übersetzte Zinsen auf Aktionärsdarlehen) mit möglichen Steuerfolgen (Gewinnsteuer,
    Verrechnungssteuer) nicht berücksichtigt.
  pruefziele:
  - RV
  - VO
  - BE
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: sind die allenfalls zu erwartenden Steuernachforderungen zu berücksichtigen
- text: 'Verrechnungssteuer auf geldwerten Leistungen nicht auf die Begünstigten überwälzt: Belastung der Gesellschaft (Aufrechnung ins Hundert) nicht zurückgestellt.'
  pruefziele:
  - VO
  - BE
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: Unterbleibt die Überwälzung, so führt dies bei einem Verrechnungssteuersatz von 35 % zu einer Belastung der Gesellschaft von 53,8 %
- text: 'Darlehen an Aktionäre steuerlich als simuliert beurteilt (z.B. ohne Sicherheit, für private Zwecke, in finanzieller Notlage der Gesellschaft): Steuerfolgen nicht berücksichtigt.'
  pruefziele:
  - RV
  - BE
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: Erachtet der Fiskus ein Darlehensverhältnis als unecht (simuliert)
- text: 'Verdecktes Eigenkapital (Aktionärsdarlehen bei Überschuldung): Zinsen steuerlich aufgerechnet, Mehrsteuer nicht abgegrenzt.'
  pruefziele:
  - BE
  - VO
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
- text: Zinsen auf verdecktem Eigenkapital unterliegen als geldwerte Leistung der Verrechnungssteuer; VSt-Folge (auch im Verlustjahr prüfen) nicht abgegrenzt.
  pruefziele:
  - VO
  - BE
  quelle: estv-ks-6a-2024__3-2
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen gemäss Ziffer 3.1 oben unterliegen als geldwerte Leistung
- text: Ausschüttung aus Kapitalreserven als verrechnungssteuerfrei behandelt, obwohl die Kapitaleinlagereserven von der ESTV nicht genehmigt bzw. durch Verlustverrechnung vermindert
    sind; Anhanghinweis fehlt.
  pruefziele:
