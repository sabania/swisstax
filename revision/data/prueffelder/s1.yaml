- text: 'Ausweis falsch: direkte Steuern nicht separat in der Erfolgsrechnung, Nachsteuern/Bussen oder Kapitalsteuern uneinheitlich zugeordnet, Steuerguthaben mit Steuerverbindlichkeiten
