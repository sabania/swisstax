bewertung:
- regel: Steueraufwand in der zugehörigen Gewinnperiode erfassen; die Gewinnsteuerlast entsteht mit der Gewinnerzielung.
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Die Gewinnsteuerlast entsteht gleichzeitig mit der Gewinnerzielung.
- regel: Steuern zurückstellen, soweit ein steuerbarer Gewinn entsteht.
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: soweit ein steuerbarer Gewinn entsteht, zurückzustellen sind
- regel: Geschuldete Steuern – veranlagt oder nicht – sind Fremdkapital; bereits veranlagte Steuern unter den übrigen kurzfristigen Verbindlichkeiten.
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: Geschuldete, von den Steuerverwaltungen am Bilanzstichtag bereits veranlagte Steuern sind in der Bilanz als übrige kurzfristige Verbindlichkeiten auszuweisen.
- regel: Noch nicht veranlagte geschuldete Steuern unter übrigen kurzfristigen Verbindlichkeiten oder passiven Rechnungsabgrenzungen.
  quelle: hwp-bur-2023__rz-0546-s269
  zitat: Geschuldete Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den passiven Rechnungsabgrenzungen auszuweisen.
- regel: Steuern sind bei der Ermittlung des Steueraufwands als geschäftsmässig begründeter Aufwand zu berücksichtigen (Satz daher auf den Gewinn vor Steuern effektiv bzw. auf den Gewinn
    nach Steuern statutarisch anwenden).
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: Steuern sind als geschäftsmässig begründeter Aufwand bei der Ermittlung des Steueraufwands entsprechend zu berücksichtigen.
- regel: 'Mögliche Nachbelastungen (Steuerrevision, Rechtsmittel): Rückstellung nach Wahrscheinlichkeit am Tag der Bilanzerstellung schätzen.'
  quelle: hwp-bur-2023__rz-0547-s269
  zitat: Je nach Wahrscheinlichkeit einer Steuernachforderung ist am Tag der Bilanzerstellung die Höhe der erforderlichen Rückstellung zu schätzen.
- regel: 'Grundstückgewinnsteuern periodengerecht abgrenzen; SG (dualistisch) und Bund: Grundstückgewinne unterliegen der Gewinnsteuer; Steuern aus nicht steuerneutralen Umstrukturierungen
    im laufenden Jahr zurückstellen.'
  quelle: hwp-bur-2023__rz-0548-s269
  zitat: In Kantonen mit dem dualistischen System (z.B. St. Gallen, Zug) sowie bei der Besteuerung auf Bundesebene unterliegen Grundstückgewinne der (regulären) Gewinnsteuer.
- regel: Steuervorauszahlungen und erwartete Rückvergütungen können Aktiven sein; Bestand und Verjährung einzeln prüfen (VSt-Rückerstattung drei Jahre); nicht mit Steuerverbindlichkeiten
    verrechnen.
  quelle: hwp-bur-2023__rz-0549-s269
  zitat: Steuervorauszahlungen und erwartete Steuerrückvergütungen (beispielsweise Quellensteuern auf Zins- und Dividendenerträgen) können dazu führen, dass Steuern als Aktivposten erscheinen.
- regel: Für die laufende Steuerabgrenzung ist die Verrechnung von Verlustvorträgen mit dem Gewinn der Periode zulässig.
  quelle: hwp-bur-2023__rz-0551-s270
  zitat: Hingegen ist für die Ermittlung der Abgrenzung der laufenden Steuern eine Verrechnung von Verlustvorträgen mit dem Gewinn der laufenden Steuerperiode zulässig.
- regel: 'Latente Steuern nach OR: de facto Wahlrecht, stetig und für alle temporären Differenzen gleich; latente Steueraktiven nur bei erfüllten Aktivierungsvoraussetzungen (nicht auf
    steuerlichen Verlustvorträgen).'
  quelle: hwp-bur-2023__rz-0551-s270
  zitat: ein Wahlrecht dar, das stetig und für alle temporären Differenzen gleich anzuwenden ist
- regel: ER-Position direkte Steuern umfasst bezahlte und abgegrenzte Steuern; Aufteilung Gewinn-/Kapitalsteuern gesetzlich nicht verlangt.
  quelle: hwp-bur-2023__rz-0234-s114
  zitat: Diese Position beinhaltet nicht nur die bezahlten, sondern auch die abgegrenzten Steuern.
- regel: Nachsteuern, Strafsteuern, Bussen können als ausserordentlicher/periodenfremder Aufwand gezeigt werden; Kapitalsteuern wahlweise im Steuer- oder übrigen betrieblichen Aufwand
    (stetig).
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Nachsteuern, Strafsteuern oder Bussen können dem ausserordentlichen, einmaligen oder periodenfremden Aufwand zugeordnet werden.
- regel: Handelsrechtlich notwendige Steuerrückstellungen sind unabhängig von der steuerlichen Anerkennung zu bilden.
  quelle: hwp-bur-2023__rz-0513-s261
  zitat: Handelsrechtlich notwendige Rückstellungen müssen auch dann gebildet werden, wenn sie steuerlich keine Anerkennung finden.
- regel: 'Mögliche Anhangangaben zu direkten Steuern: Aufteilung Ertrags-/Kapitalsteuern, Stand der Veranlagung.'
  quelle: hwp-bur-2023__rz-0816-s339-t4
  zitat: Aufteilung Ertrags-/Kapitalsteuern
- regel: Bestand stiller Reserven jährlich je Bilanzposition (Buchwert vs. zulässiger Höchstwert) ermitteln und mit Vorjahr vergleichen.
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
- regel: Unverzinste oder ungenügend verzinste Darlehen an Beteiligte bzw. übersetzte Zinsen auf Beteiligtendarlehen sind geldwerte Leistungen (VSt 35 %; gleiche Kriterien DBG).
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- regel: Das ESTV-Rundschreiben 2026 gilt ab 1.1.2026; für das Geschäftsjahr 2025 ist das Rundschreiben 2025 massgebend – im Wiki nicht vorhanden (Quellenlücke, Pendenz).
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- regel: Bei geldwerten Leistungen belasten Gewinnsteuern die Gesellschaft; die Verrechnungssteuer ist auf die Begünstigten zu überwälzen (Art. 14 VStG), sonst Belastung der Gesellschaft
    53,8 % (Aufrechnung ins Hundert).
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: die Gesellschaft hat die Verrechnungssteuer auf die Begünstigten zu überwälzen (Art. 14 VStG)
- regel: 'Simuliertes Darlehen an Aktionäre: Korrektur beim Aktionär ab Darlehensgewährung, Aufrechnung bei der Gesellschaft erst bei Abschreibung; VSt im Zeitpunkt der Entreicherung
    überwälzen.'
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: Erachtet der Fiskus ein Darlehensverhältnis als unecht (simuliert)
- regel: 'Verdecktes Eigenkapital: zulässiges Fremdkapital = Verkehrswerte der Aktiven × Belehnungssätze gemäss KS 6a; der Überschuss gilt nur insoweit als verdeckt, als er von Beteiligten/Nahestehenden
    stammt; Drittvergleich vorbehalten.'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
- regel: Zinsen auf verdecktem Eigenkapital werden dem steuerbaren Gewinn zugerechnet (KS ESTV 6a Ziff. 3.1).
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
- regel: Zinsen auf verdecktem Eigenkapital unterliegen als geldwerte Leistung der Verrechnungssteuer (KS ESTV 6a Ziff. 3.2).
  quelle: estv-ks-6a-2024__3-2
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen gemäss Ziffer 3.1 oben unterliegen als geldwerte Leistung
- regel: 'Steuerliche Kapitaleinlagereserven: solange von der ESTV nicht genehmigt, Hinweis im Anhang.'
  quelle: hwp-bur-2023__rz-0565-s275-t2
  zitat: Solange die handelsrechtlich ausgewiesenen steuerlichen Kapitaleinlagereserven von der EStV nicht genehmigt sind, ist im Anhang auf diesen Sachverhalt hinzuweisen
- regel: Kapitaleinlagen aus Sanierungen gelten nur als KER, soweit sie nicht durch Ausbuchung von Verlustvorträgen vernichtet werden (KS ESTV 29c Ziff. 2.2.3); mit KER verrechnete Verluste
    vermindern diese definitiv.
  quelle: estv-ks-29c-2022__2-2-3-t1
  zitat: Soweit Kapitaleinlagen nicht durch die Ausbuchung von handelsrechtlichen Verlustvorträgen vernichtet werden
- regel: Emissionsabgabe grundsätzlich 1 % des Zuflusses (Sekundärquelle Treuhand-Almanach; für 2025 vom WP bestätigen lassen).
  quelle: treuhand-almanach-2026__s067-1
  zitat: Die Emissionsabgabe beträgt grundsätzlich 1 % vom Wert dessen, was der Gesellschaft zufliesst.
- regel: Freibetrag CHF 1 Mio. bei Gründung/formeller Kapitalerhöhung, einmalig (Sekundärquelle, Stand «gegenwärtig» – für 2025 vom WP bestätigen lassen).
  quelle: treuhand-almanach-2026__s067-1
  zitat: gilt gegenwärtig für entgeltlich ausgegebene Beteiligungsrechte ein Freibetrag von CHF 1 Mio.
- regel: Sanierungen sind unter kumulativen Voraussetzungen von der Emissionsabgabe ausgenommen (Art. 6 Abs. 1 lit. k StG, KS ESTV 32a Ziff. 3.3.2); u.a. ist die Verrechnung mit bestehenden
    Verlusten zwingend.
  quelle: estv-ks-32a-2025__3-3-2-t1
  zitat: Nach Artikel 6 Absatz 1 Buchstabe k StG ist eine offene oder stille Sanierung von der Emissionsabgabe ausgenommen
fallstricke:
- text: 'Die eingeschränkte Revision ist keine Steuerprüfung: keine Prüfung der Steuerkonformität der Deklaration; beurteilt wird nur die Auswirkung auf die Jahresrechnung.'
  quelle: ser-2022__anh-c-s057-1
  zitat: keine Befragungen oder weiteren Prüfungen zur Aufdeckung von deliktischen Handlungen und weiteren Gesetzesverstössen (z. B. betreffend direkte Steuern
- text: 'S1-102, S1-103, S1-104 und S1-303 (sowie der Abgleich Steuererklärung–Jahresrechnung in S1-302) entsprechen im SER weiter gehenden Prüfungshandlungen (SER Anhang D n): nur bei
    Hinweisen auf Fehlaussagen oder erhöhtem inhärentem Risiko, Begründung dokumentieren.'
  quelle: hwp-er-2026__rz-0132-s203
  zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
    anzunehmen sind
- text: Die Frage nach hängigen Einsprachen und Rekursen (S1-104) steht im SER unter den weiter gehenden Befragungen, nicht unter den empfohlenen.
  quelle: ser-2022__anh-d-s089-2
  zitat: oder Einsprachen und Rekurse hängig sind
- text: 'Ob der Agent WP-Schritte (S1-102 bis S1-104, S1-151, S1-303) vorbereitet, ist noch offen: bis zum Entscheid nur vorbereiten und nie beurteilen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: S1-401 bis S1-403 (Typ Sonstige) nur auf Anweisung des WP bearbeiten; der Agent hält fest und bereitet vor.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
- text: Auch nicht veranlagte Steuern sind Fremdkapital – «noch keine Veranlagung» rechtfertigt keine fehlende Abgrenzung.
  quelle: hwp-bur-2023__rz-0545-s268
  zitat: dass geschuldete Steuern – veranlagt oder nicht veranlagt – Fremdkapital darstellen
- text: 'Verlustjahr heisst nicht «kein Steueraufwand»: Kapitalsteuern, separat besteuerte Gewinne, periodenfremde Nachzahlungen und VSt-Folgen (z.B. Zinsen auf verdecktem Eigenkapital)
    bleiben; Kapitalsteuer kann im übrigen betrieblichen Aufwand stecken (Analytik bereinigen).'
  quelle: hwp-bur-2023__rz-0801-s331
  zitat: Die Kapitalsteuern können entweder im Steueraufwand oder
- text: Steuerliche Verlustvorträge wirken nur über die laufende Steuerrückstellung; ein latentes Steuerguthaben darauf ist im OR-Abschluss nicht zu aktivieren.
  quelle: ef-2020-10-latente-steuern__s003-5
  zitat: In diesem Fall wird der steuerliche Verlustvortrag jedoch für die Berechnung der laufenden Steuerrückstellung berücksichtigt
- text: Steuerliche und handelsrechtliche Rückstellungszulässigkeit unterscheiden sich; steuerlich motivierte Rückstellungen über Bedarf sind stille Reserven (S1-321).
  quelle: hwp-bur-2023__rz-0212-s107
  zitat: Die steuerrechtliche Zulässigkeit von Rückstellungen kann von der handelsrechtlichen abweichen.
- text: Zinssätze für geldwerte Leistungen nur aus dem ESTV-Rundschreiben des betreffenden Jahres; das im Wiki vorhandene Rundschreiben 2026 gilt erst ab 1.1.2026, nicht für 2025.
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: 'Die Zinssatztabelle im Treuhand-Almanach 2026 (Tabelle 30, S. 64) zeigt nur eine Spalte «2023» und weicht vom Rundschreiben 2026 ab: für 2025 nicht verwenden, Rundschreiben
    2025 als Pendenz anfordern.'
  quelle: treuhand-almanach-2026__s064-1
  zitat: Für Vorschüsse an Beteiligte (in CHF) mindestens 1 aus Eigenkapital finanziert und wenn kein Fremdkapital verzinst werden muss 1,50 %
- text: 'Treuhand-Almanach-Sätze sind Maximalbelastungen (Grenzsteuersätze) am Hauptort inkl. DBG: nur zur Plausibilisierung; nicht den statutarischen Satz auf den Gewinn vor Steuern
    anwenden (Steuern sind abzugsfähiger Aufwand).'
  quelle: treuhand-almanach-2026__s056-1
  zitat: maximale Steuerbelastung (statutarischer und effektiver Grenzsteuersatz) in % des Gewinns
- text: 'Ob eine Leistung angemessen abgegolten ist, ist Ermessensfrage: der Agent hält geldwerte Leistungen nur fest; die Beurteilung trifft der WP.'
  quelle: hwp-er-2026__rz-0163-s212
  zitat: Bei der Beurteilung, ob eine Leistung der Gegenleistung entspricht, besteht in der Praxis ein erheblicher Ermessensspielraum.
- text: Mitteilung einer offensichtlichen und wesentlichen verdeckten Gewinnausschüttung an den VR, Beurteilung der Rückerstattung (Art. 678 OR) und Hinweis im Bericht erfolgen nur durch
    den WP; der Agent liefert die Liste.
  quelle: hwp-er-2026__rz-0164-s212-t1
  zitat: Die Revisionsstelle teilt die verdeckte Gewinnausschüttung dem Verwaltungsrat der Gesellschaft schriftlich mit.
- text: Befreiung von der Emissionsabgabe bei Sanierung setzt die Verrechnung mit bestehenden Verlusten voraus (spätestens an der GV zur Jahresrechnung der Sanierungsperiode); wird der
    Bilanzverlust vorgetragen, Abgabefolge durch den WP beurteilen lassen.
  quelle: estv-ks-32a-2025__3-3-2-t1
  zitat: Die Verrechnung der Verluste muss spätestens anlässlich der ordentlichen Generalversammlung beschlossen werden, welche die Jahresrechnung für die Periode genehmigt
- text: 'Mit Kapitaleinlagereserven verrechnete Verluste vermindern diese definitiv: «Ausschüttung aus Kapitalreserven = verrechnungssteuerfrei» nicht ungeprüft übernehmen.'
  quelle: estv-ks-29c-2022__2-2-3-t1
  zitat: Verluste, die den KER bzw. den Ausland-KER belastet wurden, vermindern diese definitiv.
- text: Keine Bestätigungen bei Steuerbehörden selbst einholen; nur beim Unternehmen vorhandene Verfügungen, Rechnungen und Korrespondenz verwenden.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: 'Der Agent befragt nicht selbst: er wertet schriftliche Antworten aus (z.B. Kundenbefragung 10.11) oder erfasst die Frage als Pendenz; Kernaussagen zusätzlich über die Vollständigkeitserklärung
    schriftlich bestätigen lassen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- text: 'Bei wesentlichen Steuerpositionen genügt die Befragung nicht: Antworten mit analytischen Prüfungshandlungen und/oder Detailprüfungen ergänzen.'
  quelle: hwp-er-2026__rz-0105-s198
  zitat: Gemäss SER stützt sich der Abschlussprüfer bei wesentlichen Jahresabschlussposten nicht nur auf Befragungen ab
- text: 'Berechnet oder verbucht die Revisionsstelle die Steuerabgrenzung (Mitwirken bei der Buchführung), besteht Selbstprüfungsrisiko: organisatorische und personelle Massnahmen beim
    WP klären.'
  quelle: ser-2022__anh-b-s049-2
  zitat: Da beim Mitwirken bei der Buchführung per se das Risiko der Selbstprüfung besteht
- text: Die Unterstützung bei der Erstellung der Steuererklärung ist eine zulässige Steuerdienstleistung ohne Selbstprüfungsgefahr – kein Unabhängigkeitsproblem allein deswegen melden.
  quelle: hwp-er-2026__rz-0050-s160
  zitat: insbesondere die Unterstützung bei der Erstellung der Steuer- und Abgabedeklarationen
- text: Auflösungsdifferenz der Vorjahres-Steuerrückstellung (Zahlung ≠ Rückstellung) ist periodenfremd und ggf. im Anhang zu erläutern; nicht mit dem laufenden Steueraufwand vermischen.
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- text: Veranlagungsstand getrennt für Bund und Kanton/Gemeinde erfassen; eine definitive Veranlagung auf einer Ebene sagt nichts über die andere.
  quelle: katalog-revio4__c003-57
  zitat: Befragung, inwieweit Steuerveranlagungen definitiv sind (Bund / Kanton)
fragen_kunde:
- frage: Sind alle direkten Steuern früherer Perioden (Bund, Kanton/Gemeinde) bezahlt oder abgegrenzt? Bitte Liste je Steuerperiode mit Status (bezahlt/offen, Betrag).
  zweck: S1-101 (VO, PA); Antwort schriftlich dokumentieren
- frage: Fanden im Geschäftsjahr oder bis heute Steuerrevisionen, Buchprüfungen, Nachforschungen oder Rückfragen der Steuerbehörden statt? Bitte Korrespondenz und allfällige Revisionsberichte
    beilegen.
  zweck: S1-102, S1-403 (RV, VO)
- frage: Für welche Steuerperioden liegen definitive Veranlagungen vor (getrennt Bund und Kanton)? Bitte Veranlagungsverfügungen einreichen.
  zweck: S1-103 (RV); Stand der Veranlagung
- frage: 'Sind Einsprachen, Rekurse oder Beschwerden in Steuersachen hängig? Wenn ja: Periode, Streitpunkt, Streitbetrag und Einschätzung des Ausgangs.'
  zweck: S1-104 (RV, VO); Rückstellung oder Eventualverbindlichkeit
- frage: Wer hat die Steuerabgrenzung 2025 berechnet und mit welchen Parametern (Steuersätze/-füsse, Verlustvorträge, steuerbares Kapital, Akontozahlungen)? Bitte Berechnung einreichen.
  zweck: S1-301, S1-304 (BE, RI); bei Berechnung/Verbuchung durch die Revisionsstelle Unabhängigkeit klären (WP)
- frage: Welche provisorischen Steuerrechnungen und Akontozahlungen betreffen 2025, und bestehen Steuerguthaben oder Rückerstattungsansprüche (inkl. Verrechnungssteuer)?
  zweck: S1-302, S1-303, S1-304
- frage: Gab es Leistungen an Aktionäre, Organe oder Nahestehende zu nicht marktüblichen Bedingungen (Darlehen an oder von Aktionären mit Zinssatz und Sicherheit, Saläre, Spesen, Privataufwand,
    Fahrzeugnutzung, Käufe/Verkäufe von Aktiven)? Wurde die Verrechnungssteuer auf allfällige geldwerte Leistungen überwälzt?
  zweck: S1-401 (RV, VO, BE)
- frage: Lagen 2025 besondere steuerliche Verhältnisse vor (Grundstückgewinne, Umstrukturierungen, Sanierungsmassnahmen/Forderungsverzichte, Kapitalerhöhung, Ausschüttungen aus Kapitaleinlagereserven,
    Steuerrulings, abweichendes Geschäftsjahr)?
  zweck: S1-402 (EN, VO, PA)
- frage: Wurde die Emissionsabgabe auf der Kapitalerhöhung vom 20.01.2025 abgerechnet oder eine Befreiung (Sanierung, Freibetrag) beansprucht? Liegt eine Bestätigung der ESTV zu den
    Kapitaleinlagereserven aus dem Agio vor?
  zweck: S1-402 (VO, PA); Abgrenzung Emissionsabgabe, VSt-Folgen der beantragten Ausschüttung, Anhanghinweis
- frage: Bitte Verkehrswerte der Aktiven per 31.12.2025 und eine allfällige Berechnung des verdeckten Eigenkapitals (Aktionärsdarlehen) einreichen.
  zweck: S1-402 (BE, VO); Zinsaufrechnung und VSt auf verdecktem Eigenkapital
- frage: Wie haben sich die stillen Reserven entwickelt (inkl. übersetzter Steuerrückstellungen und versteuerter stiller Reserven)? Bitte Detailnachweis einreichen.
  zweck: S1-321 (BE); Nettoauflösung Anhang
- frage: Werden latente Steuern erfasst (Wahlrecht), und falls ja, nach welcher Methode und mit welchem Steuersatz?
  zweck: S1-301, Bewertung latente Steuern (Stetigkeit)
