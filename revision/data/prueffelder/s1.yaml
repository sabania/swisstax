- id: S1-402
  vorgehen: 'Typ Sonstige: nur auf Anweisung des WP; Kennzeichnung leer → WP bestätigen. Festhalten: Grundstückgewinne, Umstrukturierungen, Sanierung/Kapitalerhöhung (Emissionsabgabe,
    Befreiung), Ausschüttungen (VSt, KER-Bestätigung ESTV), verdecktes EK (Verkehrswerte, Rangrücktritte), Kurz-/Langjahr, Rulings. Je Sachverhalt Abgrenzung/Offenlegung prüfen, Offenes
    als Frage. Steuerfolgen Kapitalerhöhung/Ausschüttung: SER weiter gehend.'
  nachweise:
  - GV-/VR-Protokolle, Antrag Verwendung Bilanzergebnis
  - Verträge (Grundstücke, Umstrukturierungen)
  - Unternehmensinformationen
  - Steuerberechnung
  - Steuerrulings
  - Verkehrswerte der Aktiven 31.12.2025
  - Rangrücktrittserklärungen
  - ESTV-Bestätigung Kapitaleinlagereserven
  - Abrechnung bzw. Befreiung Emissionsabgabe
  rechnen: Separat besteuerter Gewinn × Satz = abzugrenzende Steuer; zulässiges FK = Σ Verkehrswert Aktiven × Belehnungssatz KS 6a; verdecktes EK = min(FK von Beteiligten/Nahestehenden;
    FK − zulässiges FK); Zins auf verdecktem EK = Gewinnaufrechnung + VSt-Folge; Emissionsabgabe = 1 % × (Zufluss − nicht beanspruchter Freibetrag), sofern keine Ausnahme
  feststellung_wenn: Sachverhalt mit Steuerfolgen (Grundstückgewinn, Umstrukturierung, Emissionsabgabe, VSt auf Zinsen verdecktes EK oder Ausschüttung) nicht abgegrenzt/offengelegt,
    oder KER-Ausschüttung ohne ESTV-Bestätigung/Anhanghinweis.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
  - quelle: hwp-bur-2023__rz-0548-s269
    zitat: Einmalige Steuerfolgen können sich zudem bei nicht steuerneutralen Umstrukturierungen ergeben. Diese Steuern sind im laufenden Geschäftsjahr zurückzustellen.
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung der korrekten steuerlichen Behandlung von Kapitalerhöhungen (Emissionsabgabe) und -herabsetzungen sowie Gewinnausschüttungen (Verrechnungssteuer)
  - quelle: estv-ks-6a-2024__einleitung-t3
    zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
  - quelle: estv-ks-6a-2024__einleitung-t3
    zitat: Wesentlich ist, dass nur derjenige Teil als verdeckt gilt, der direkt oder indirekt von Anteilsinhabern oder diesen nahestehenden Personen stammt.
  - quelle: estv-ks-6a-2024__3-1
    zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
  - quelle: estv-ks-6a-2024__3-2
    zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen gemäss Ziffer 3.1 oben unterliegen als geldwerte Leistung
  - quelle: hwp-bur-2023__rz-0565-s275-t2
    zitat: Solange die handelsrechtlich ausgewiesenen steuerlichen Kapitaleinlagereserven von der EStV nicht genehmigt sind, ist im Anhang auf diesen Sachverhalt hinzuweisen
  - quelle: treuhand-almanach-2026__s067-1
    zitat: Die Emissionsabgabe beträgt grundsätzlich 1 % vom Wert dessen, was der Gesellschaft zufliesst.
  - quelle: treuhand-almanach-2026__s067-3
    zitat: Diverse Tatbestände (u. a. im Rahmen von Umstrukturierungen und Sanierungen) sind von der Emissionsabgabe ausgenommen.
