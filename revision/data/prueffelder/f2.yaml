  - Dauerakte Vorjahr
  - Rahmen-/Werkverträge
  - Bewertungsrichtlinie/Kalkulationsschema
  rechnen: ''
  feststellung_wenn: Wesentliche Dauerunterlagen (Rahmen-/Konsortialverträge, Bewertungsrichtlinie) fehlen oder sind veraltet (Pendenz).
  fundstellen:
  - quelle: ser-2022__7-3
