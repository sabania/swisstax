  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- id: F2-405
  vorgehen: 'Nur auf Anweisung des WP: Bewertung ausgewählter Projekte belegen mit a) Kreditorenfakturen Fremdleistungen, b) Herstellkostenberechnungen, c) Auftragsbestätigungen/Offerten,
    d) Schlussabrechnungen im neuen Jahr, e) Bruttomargen-Vergleich mit Vorkalkulation/Vorjahr, f) Projektschätzungen der Projektleitung. Je Projekt Nachweise und Abweichungen im Textfeld
    festhalten.'
  nachweise:
  - Kreditorenfakturen Fremdleistungen
  - Herstellkostenberechnungen
  - Auftragsbestätigungen/Offerten
  - Schlussabrechnungen neue Periode
  - Projektschätzungen Projektleitung
  rechnen: Bruttomarge = (Auftragswert − erwartete Gesamtkosten) / Auftragswert; Vergleich mit Offert- bzw. Vorjahresmarge
  feststellung_wenn: Bewertung durch Belege nicht gedeckt, Fremdleistungen fehlen, Schlussabrechnung deckt die Kosten nicht oder Margenverschlechterung ohne Wertberichtigung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0230-s209
    zitat: Kosten sind wie Herstellungskosten zu behandeln
  - quelle: ser-2022__anh-d-s092-1
    zitat: Vergleich von Umsätzen, Warenaufwand und Bruttomargen je Produktkategorie mit dem Vorjahr
  - quelle: hwp-or-2024__rz-0902-s349-t1
    zitat: kalkulierte Marge gemäss Offerte
- id: F2-406
  vorgehen: 'Nur auf Anweisung des WP: mehrjährige Projekte (PoC) kritisch beurteilen: POCM-Voraussetzungen (vertragliche Grundlage, Erfüllungswahrscheinlichkeit, geeignete Auftragsorganisation,
    zuverlässige Ermittlung von Erlösen, Kosten, Fertigstellungsgrad), Margenentwicklung gegenüber Vorkalkulation, Pauschalpreisrisiken. Ergebnis je Projekt als Entscheidungsgrundlage
    für den WP dokumentieren.'
  nachweise:
  - Werkverträge
  - Vor- und Nachkalkulation
  - Projektliste (FG, Restkosten)
  - Projektschätzungen Projektleitung
  rechnen: erwartete Marge = Auftragswert − (Kosten bis 31.12. + Restkosten); FG = Kosten/(Kosten + Restkosten); POCM-Wert = FG × Auftragswert vs. bilanzierter Wert
  feststellung_wenn: POCM-Voraussetzungen nicht erfüllt/dokumentiert, Marge verschlechtert oder negativ ohne Berücksichtigung, oder Fertigstellungsgrad nicht nachvollziehbar.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0748-s316-t2
    zitat: Eine zuverlässige Ermittlung aller mit dem Auftrag im Zusammenhang stehenden Auftragserlöse, Auftragsaufwendungen sowie des Fertigstellungsgrads ist möglich.
  - quelle: hwp-bur-2023__rz-0748-s316-t2
    zitat: Bei Pauschal- oder Festpreisen ist grössere Vorsicht geboten als beispielsweise bei Abrechnung nach Aufwand.
  - quelle: hwp-bur-2023__rz-0747-s315
    zitat: Ein sich abzeichnender Verlust ist bei Vertragsunterzeichnung vollumfänglich
