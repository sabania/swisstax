  vorgehen: 'Nur auf Anweisung des WP: je wesentliches Projekt Ist-Kosten plus geschätzte Restkosten mit der Vorkalkulation (Soll) vergleichen; Abweichungen und Gründe (Antwort Projektleitung,
    sonst Pendenz) dokumentieren und auf Auswirkungen auf die verlustfreie Bewertung hinweisen.'
