bewertung:
- regel: Verlustfreie Bewertung mittels Rückrechnung (erwarteter Erlös abzüglich Erlösminderungen und noch anfallender Kosten); liegt der Vergleichswert tiefer, Wertberichtigung.
  quelle: hwp-bur-2023__rz-0246-s212
  zitat: ist eine entsprechende Wertberichtigung vorzunehmen
- regel: Ein sich abzeichnender Auftragsverlust ist sofort vollumfänglich zu berücksichtigen (Wertberichtigung, ggf. Rückstellung).
  quelle: hwp-bur-2023__rz-0747-s315
  zitat: Ein sich abzeichnender Verlust ist bei Vertragsunterzeichnung vollumfänglich
- regel: POCM nur bei kumulativen Voraussetzungen, u.a. zuverlässige Ermittlung von Erlösen, Kosten und Fertigstellungsgrad.
  quelle: hwp-bur-2023__rz-0748-s316-t2
  zitat: Eine zuverlässige Ermittlung aller mit dem Auftrag im Zusammenhang stehenden Auftragserlöse, Auftragsaufwendungen sowie des Fertigstellungsgrads ist möglich.
- regel: Keine Verrechnung von Projekten mit negativem und positivem Saldo (Bruttoprinzip).
  quelle: hwp-bur-2023__rz-0748-s316-t1
  zitat: Eine Verrechnung von Aufträgen mit negativem Saldo mit solchen mit positivem Saldo widerspricht dem Bruttoprinzip
- regel: Nicht fakturierte Dienstleistungen sind buchhalterisch wie Vorräte (Erzeugnisse in Arbeit) zu behandeln.
  quelle: hwp-bur-2023__rz-0197-s204
  zitat: Die aufgelaufenen Kosten noch nicht fakturierter Dienstleistungen stellen also Vorräte dar
- regel: Mit der Leistungserbringung zusammenhängende Kosten sind wie Herstellungskosten zu behandeln.
  quelle: hwp-bur-2023__rz-0230-s209
  zitat: Kosten sind wie Herstellungskosten zu behandeln
- regel: Herstellungskosten umfassen Material, Materialgemeinkosten, Fertigungslöhne und Fertigungsgemeinkosten.
  quelle: hwp-bur-2023__rz-0220-s207
  zitat: Zu den Herstellungskosten gehören, neben den Anschaffungskosten für Rohmaterial, Hilfs- und Betriebsstoffe sowie für zugekaufte Teile, die Materialgemeinkosten
- regel: Allgemeine Verwaltungs- und Vertriebskosten sind nicht aktivierbar.
  quelle: hwp-bur-2023__rz-0221-s207
  zitat: Nicht zu den Herstellungskosten gehören die allgemeinen Verwaltungs-
- regel: 'Fabrikationsbezogene Verwaltungskosten (z.B. technische Leitung, Betriebs-/Lohnbuchhaltung) dürfen eingerechnet werden; allgemeine Verwaltung und Vertrieb nie. Kostenstelle
    «Verwaltung» im Zuschlag: Fabrikationsbezug als Pendenz erfragen, ohne Nachweis Hinweis an WP.'
  quelle: hwp-bur-2023__rz-0222-s208
  zitat: Teile der Verwaltungskosten, die sich auf die Materialverwaltung (ohne Verkaufslager) und die Fabrikation beziehen, beispielsweise Kosten der technischen Leitung oder der Betriebs-
    und Lohnbuchhaltung, können in die Herstellungskosten eingerechnet werden.
- regel: Fixe Gemeinkosten auf Basis Normalbeschäftigung zurechnen; Eigenkapitalzins nie aktivierbar.
  quelle: hwp-bur-2023__rz-0222-s208
  zitat: Bei der Zurechnung fester Kosten ist von einer Normalbeschäftigung auszugehen
- regel: Pauschalbewertung von Aufträgen in Arbeit nur zulässig, wenn Aktivierungsfähigkeit und verlustfreie Bewertung nachvollzogen sind.
  quelle: hwp-bur-2023__rz-0232-s209
  zitat: ob alle aktivierten Kosten tatsächlich aktivierungsfähig sind und ob eine verlustfreie Bewertung gegeben ist
- regel: 'Wahlrecht für langfristige Aufträge: POCM (anteilige Gewinnrealisierung), modifizierte POCM (ohne Gewinn) oder Completed Contract.'
  quelle: hwp-bur-2023__rz-0747-s315
  zitat: 'Modifizierte POCM: Umsatzerfassung im Ausmass der angefallenen Kosten, aber ohne Gewinnrealisierung'
- regel: Gewinnermittlung bei POCM zurückhaltend; bei Pauschal-/Festpreisen erhöhte Vorsicht.
  quelle: hwp-bur-2023__rz-0748-s316-t2
  zitat: Bei Pauschal- oder Festpreisen ist grössere Vorsicht geboten als beispielsweise bei Abrechnung nach Aufwand.
- regel: 'Erhaltene Anzahlungen: Brutto- oder Nettodarstellung; bei Nettodarstellung Nettobuchwert je Projekt, Überfinanzierung passivieren.'
  quelle: hwp-bur-2023__rz-0254-s214
  zitat: Bei der häufig angewandten Nettodarstellung wird für jedes einzelne Projekt ein Nettobuchwert ermittelt, der entweder aktiviert oder passiviert wird
- regel: Kundenanzahlungen werden erst bei Zahlungseingang bilanziert.
  quelle: hwp-bur-2023__rz-0109-s185
  zitat: Solche Anzahlungen von Kunden werden erst bilanziert, wenn die Zahlung erfolgt ist
- regel: Angefangene Bauten auf fremdem Boden haben Forderungscharakter; bei Ausweis unter Vorräten zweckmässig bezeichnen.
  quelle: hwp-bur-2023__rz-0198-s204
  zitat: Bauten auf fremdem Boden sind somit den Forderungen gleichzustellen
- regel: 'Anhang: Bewertungsgrundsätze für Vorräte und angefangene Arbeiten inkl. Methode langfristiger Fertigungsaufträge offenlegen.'
  quelle: hwp-bur-2023__rz-0814-s338
  zitat: Bewertungsmethoden langfristiger Fertigungsaufträge etc.
- regel: 'Stetigkeit: Änderung der Herstellkostenermittlung ist Methodenwechsel und im Anhang zu begründen.'
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: die Änderung der Ermittlung der Herstellungskosten (Kalkulationsschema, Kostenrechnungssystem etc.)
- regel: Umsatzerfassung nach OR nicht früher als nach einem parallel angewandten anerkannten Standard (Vorsichtsprinzip).
  quelle: hwp-bur-2023__rz-0749-s317
  zitat: eine frühere Erfassung des Umsatzes unter OR als unter dem anerkannten Standard zur Rechnungslegung nicht mit dem Vorsichtsprinzip nach Art. 958c Abs. 1 Ziff. 5 OR vereinbar
fallstricke:
- text: Vertiefte Prüfungen der Herstellkostenkalkulation gehören nicht zur eingeschränkten Revision; bei entsprechender Risikolage nur Plausibilisierung ^[hwp-er-2026__rz-0134-s203].
  quelle: ser-2022__anh-d-s079-2
  zitat: Vertiefte Prüfungen im Bereich der Kalkulation von Herstellkosten
- text: Inventurteilnahme ist nicht Bestandteil der eingeschränkten Revision.
  quelle: ser-2022__anh-d-s079-2
  zitat: Inventurteilnahme
- text: 'Bei wesentlicher Position nicht nur auf Befragungen abstützen: Antworten mit Analytik und angemessenen Detailprüfungen erhärten.'
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'F2-203, 303, 304, 306 sind weitergehende Prüfungshandlungen (WP): nur bei Anzeichen wesentlicher Fehlaussagen oder erhöhtem inhärentem Risiko; der Agent bereitet sie nur auf
    ausdrückliche Anweisung des WP vor (offener Entscheid consis); ohne Anweisung «nicht bearbeitet – WP-Schritt». Beurteilung beim WP ^[konzept-ki-revisionsagent-2026__c012-1].'
  quelle: ser-2022__anh-d-s079-1
  zitat: wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- text: 4xx-Schritte gelten als sonstige/weitergehende Handlungen und werden nur auf Anweisung bearbeitet.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
- text: 'Befragungen (1xx) kann der Agent nicht selbst führen: schriftliche Antworten auswerten, sonst Frage als Pendenz; Visum offen lassen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- text: Gesamtsaldo «angefangene Arbeiten minus Anzahlungen» verdeckt überfinanzierte Projekte – immer je Projekt beurteilen.
  quelle: hwp-bur-2023__rz-0748-s316-t1
  zitat: Eine Verrechnung von Aufträgen mit negativem Saldo mit solchen mit positivem Saldo widerspricht dem Bruttoprinzip
- text: Projektlisten können je Projekt unterschiedliche Bewertungsmethoden enthalten (Herstellkosten vs. anteiliger Auftragswert); Bewertungsspalte je Zeile lesen und mit Anhangangabe
    abgleichen.
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: Eine einmal gewählte Methode ist grundsätzlich beizubehalten.
- text: SER-Analytik «kein Gewinnanteil» setzt Bewertung zu Herstellkosten voraus; bei POCM ist ein Gewinnanteil nur unter den kumulativen Voraussetzungen und bei zurückhaltender Ermittlung
    zulässig.
  quelle: hwp-bur-2023__rz-0748-s316-t2
  zitat: Dabei hat die Gewinnermittlung zurückhaltend zu erfolgen.
- text: 'Abgenommene Projekte: nicht gleichzeitig als Forderung/Ertrag und als angefangene Arbeit erfassen.'
  quelle: hwp-bur-2023__rz-0234-s209
  zitat: Sofern diese Ware bereits als Forderung gebucht ist, darf sie nicht zusätzlich in der Position Vorräte
- text: Verluste, die vor dem Stichtag verursacht, aber erst danach bekannt wurden (z.B. Mängel, Gutschriften im Folgejahr), betreffen das alte Geschäftsjahr.
  quelle: hwp-bur-2023__rz-0530-s264
  zitat: Verluste, die vor dem Bilanzstichtag verursacht, aber erst danach bekannt geworden sind, zulasten des alten Geschäftsjahres zurückzustellen
- text: 'Praxis/intern: Anzahlungen werden oft im Prüffeld übrige kurzfristige Verbindlichkeiten geführt; Zuordnung je Projekt mit F2 abstimmen, um Doppel- oder Fehlbeurteilungen zu
    vermeiden.'
- text: 'Abnahme bzw. Fertigstellung vor dem Stichtag ist kein Ereignis nach dem Bilanzstichtag: Der Ertrag ist realisiert, sobald ein Entschädigungsanspruch durchsetzbar ist – auch
    wenn die Schlussrechnung erst im Folgejahr gestellt wird. Im Prüfjahr erfassen (F2-302). Spätere Belege liefern nur Nachweise; massgebend ist, ob der Sachverhalt am Stichtag bestand.'
  quelle: hwp-bur-2023__rz-0745-s315
  zitat: Umsatz kann dann als realisiert betrachtet und somit erfasst werden, wenn die dem Vertrag zugrunde liegende Leistungsverpflichtung
  fundstellen:
  - quelle: hwp-er-2026__rz-0317-s254
    zitat: Ereignisse, die Nachweise für Umstände bzw. Sachverhalte liefern, die bereits am Bilanzstichtag vorlagen (berücksichtigungspflichtige Ereignisse)
  schritte:
  - F2-102
  - F2-302
- text: 'Akonto-/Vorauszahlungsrechnungen für noch nicht erbrachte Leistungen (z.B. Leistungen des Folgejahres) sind weder Ertrag noch Forderung aus L+L: Anzahlungen werden erst bei
    Zahlungseingang bilanziert. Unbezahlte, als Ertrag/Debitor gebuchte Akontorechnung → Feststellung (Storno vorschlagen); bezahlte → erhaltene Anzahlung, nicht Ertrag.'
  quelle: hwp-bur-2023__rz-0109-s185
  zitat: Solche Anzahlungen von Kunden werden erst bilanziert, wenn die Zahlung erfolgt ist
  schritte:
  - F2-202
  - F2-302
- text: 'Verlustprojekte: Marge jeder Zeile der Projektliste mit `rechne` prüfen (Auftragswert − Kosten − Restkosten), nicht nur Totale oder die vom Kunden markierten Projekte. Ein sich
    abzeichnender Verlust ist sofort vollumfänglich zu erfassen: WB auf dem Projekt, Rest als Rückstellung. −Marge ist nur der Verlustindikator; WB-Bedarf und Rückstellung ab dem
    Bilanzwert rechnen (F2-105).'
  quelle: hwp-bur-2023__rz-0747-s315
  zitat: Ein sich abzeichnender Verlust ist bei Vertragsunterzeichnung vollumfänglich zurückzustellen.
  schritte:
  - F2-105
  - F2-301
  - F2-304
fragen_kunde:
- frage: Welcher Art sind die angefangenen Arbeiten bzw. nicht fakturierten Leistungen (Kundenaufträge mit Werkvertrag oder Arbeiten auf Lager)? Handelt es sich um Bauten auf fremdem
    Boden?
  zweck: 'F2-101: Bestand/Vollständigkeit, Ausweis und Bezeichnung'
- frage: Wie wird am Jahresende sichergestellt, dass alle Kosten bis 31.12. (Material, Montagestunden, Fremdleistungen/Unterakkordanten) erfasst und abgenommene Projekte schlussfakturiert
    werden?
  zweck: 'F2-102, 401: Vollständigkeit und Periodenabgrenzung'
- frage: Nach welcher Methode werden die Projekte bewertet (Herstellkosten, POCM, modifizierte POCM, Completed Contract) und wurde sie gegenüber dem Vorjahr oder zwischen Projekten geändert?
  zweck: 'F2-103, 104, 320: Bewertung, Stetigkeit, Anhangangabe'
- frage: Wie wird der Gemeinkostenzuschlag hergeleitet (Kostenstellen, Normalbeschäftigung)? Hat die Projektkostenrechnung in der Vergangenheit verlässliche Ergebnisse geliefert (Nachkalkulation
    abgeschlossener Projekte)?
  zweck: 'F2-104, 306: Aktivierbarkeit und Verlässlichkeit Kostenrechnung'
- frage: Bei welchen Projekten übersteigen die erwarteten Gesamtkosten den Auftragswert oder ist die Marge ungenügend? Wer hat die Restkosten geschätzt und genehmigt?
  zweck: 'F2-105, 304, 406, 407: verlustfreie Bewertung'
- frage: Weshalb sind per Stichtag fertiggestellte bzw. abgenommene Projekte noch nicht schlussfakturiert, und wann erfolgt die Schlussrechnung?
  zweck: 'F2-302, 401: Periodenabgrenzung, Doppelerfassung'
- frage: Sind nach dem Bilanzstichtag Mängel, Nachträge, Kostenüberschreitungen oder Streitigkeiten bei Projekten bekannt geworden, die vor dem Stichtag verursacht wurden?
  zweck: 'F2-302, 304: Ereignisse nach dem Bilanzstichtag'
- frage: Ist die Gesellschaft an Konsortien/ARGE beteiligt, und wie werden Anteile, Abrechnungen und Solidarhaftung erfasst?
  zweck: 'F2-408: Erfassung und Offenlegung'
- frage: Wurden auf den angefangenen Arbeiten stille Reserven gebildet oder aufgelöst? Bitte Aufstellung Bestand/Veränderung.
  zweck: 'F2-321: stille Reserven, Anhang'
- frage: Welche Versicherungsdeckung (Bauwesen-/Montageversicherung) besteht für laufende Projekte und decken die Versicherungssummen die Projektwerte?
  zweck: 'F2-403: Angemessenheit Versicherungswerte'
