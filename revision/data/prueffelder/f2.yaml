# Prüffeld F2 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: F2
bezeichnung: Nicht fakturierte Leistungen
status: extrahiert
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: false
  ergaenzt: '2026-11-13 Runde R2: Wissenslücken aus E2E-Lauf ergänzt (Zitate maschinell geprüft, Zweitprüfung offen)'
kurzbeschrieb: 'Nicht fakturierte Dienstleistungen/angefangene Arbeiten (Art. 959a OR) inkl. Anzahlungen und Bestandesänderung. ER: Befragung, Analytik und Detailprüfung zu Bestand,
  Bewertung (höchstens Herstellkosten, verlustfrei je Projekt) und Abgrenzung (vor dem Stichtag abgenommen = Ertrag des Prüfjahres).'
gesetz:
- thema: 'Mindestgliederung Bilanz: Ausweis Vorräte und nicht fakturierte Dienstleistungen (Art. 959a Abs. 1 Ziff. 1 lit. d OR)'
  quelle: or__art-959a-t1
  zitat: Vorräte und nicht fakturierte Dienstleistungen
- thema: Höchstbewertung zu Anschaffungs- oder Herstellungskosten (Art. 960a Abs. 2 OR)
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Verlustfreie Bewertung / tieferer Veräusserungswert (Art. 960c Abs. 1 OR)
  quelle: or__art-960c
  zitat: der Veräusserungswert unter Berücksichtigung noch anfallender Kosten am Bilanzstichtag unter den Anschaffungs- oder Herstellungskosten, so muss dieser Wert eingesetzt werden.
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Vorsichtige Bewertung (Art. 960 Abs. 2 OR)
  quelle: or__art-960
  zitat: Die Bewertung muss vorsichtig erfolgen, darf aber die zuverlässige Beurteilung der wirtschaftlichen Lage des Unternehmens nicht verhindern.
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Stetigkeit in Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Verrechnungsverbot, z.B. angefangene Arbeiten/Anzahlungen über Projekte hinweg (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Bestandesnachweis durch Inventar/Aufstellung (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: 'Erfolgsrechnung: Ausweis Bestandesänderungen nicht fakturierte Dienstleistungen (Art. 959b Abs. 2 Ziff. 2 OR)'
  quelle: or__art-959b-t1
  zitat: Bestandesänderungen an unfertigen und fertigen Erzeugnissen sowie an nicht fakturierten Dienstleistungen
- thema: 'Anhang: angewandte Grundsätze (Art. 959c Abs. 1 Ziff. 1 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: Zusätzliche Wertberichtigungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Rückstellungen, u.a. für drohende Auftragsverluste (Art. 960e Abs. 2 OR)
  quelle: or__art-960e
  zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
    gebildet werden.
- thema: 'Anhang: Eventualverbindlichkeiten, z.B. Solidarhaftung aus ARGE/Konsortium (Art. 959c Abs. 2 Ziff. 10 OR)'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
