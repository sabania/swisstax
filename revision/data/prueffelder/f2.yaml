  - quelle: hwp-bur-2023__rz-0234-s209
    zitat: Sofern diese Ware bereits als Forderung gebucht ist, darf sie nicht zusätzlich in der Position Vorräte
- id: F2-402
  vorgehen: 'Auf Anweisung des WP (rein rechnerisch, gut automatisierbar): Projektliste mit dem Rechenmodul nachrechnen (Einzelkosten + Gemeinkosten = Kosten total, Fertigstellungsgrad,
    Netto = Bilanzwert − Anzahlungen, Totalzeilen). Rechendifferenzen im Textfeld beziffern.'
  nachweise:
  - Projektliste inkl. Blatt Gemeinkostenzuschlag
  rechnen: Kosten total = Einzelkosten × (1 + GK-Satz); FG = Kosten/(Kosten + Restkosten); Netto = Bilanzwert − Anzahlungen; Totalzeile = Σ Einzelzeilen
  feststellung_wenn: Rechendifferenzen in Zeilen oder Totalen der Projektliste.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-3
    zitat: Abstimmung des Totals der Inventarlisten und des Nachweises der nicht fakturierten Dienstleistungen mit dem Hauptbuch
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
- id: F2-403
  vorgehen: 'Nur auf Anweisung des WP: Versicherungsdeckung laufender Projekte (Bauwesen-/Montageversicherung) anhand Policen bzw. schriftlicher Auskunft mit Auftrags- und Bilanzwerten
    vergleichen; Versicherungsaufwand der Erfolgsrechnung als Hinweis nutzen. Fehlende Policen als Pendenz; Ergebnis im Textfeld.'
  nachweise:
  - Versicherungspolicen
  - Projektliste (Auftragswerte)
  - Erfolgsrechnung (Versicherungsaufwand)
  rechnen: Deckungsgrad = Versicherungssumme / Σ Auftrags- bzw. Bilanzwerte laufender Projekte
  feststellung_wenn: Keine oder offensichtlich ungenügende Versicherungsdeckung für wesentliche laufende Projekte (Hinweis an WP).
