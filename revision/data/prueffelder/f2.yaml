  - Aufstellung stille Reserven
  - Projektliste
  - Vollständigkeitserklärung
  rechnen: Bestand Ende = Bestand Anfang + Bildung − Auflösung; Nettoauflösung = Auflösung − Bildung → T1-305 (gesamthaft über alle Positionen beurteilen)
  feststellung_wenn: Aufstellung fehlt oder ist nicht abgestimmt; Nettoauflösung F2 > 0 → Übergabe an T1-305 (Feststellung nur dort, Gesamtbetrag über alle Positionen).
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
  - quelle: or__art-959c-t1
    zitat: wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die Nettoauflösung von stillen Reserven (wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird)?
- id: F2-322
  vorgehen: 'Dauerakte mit mehrjährig gültigen Unterlagen dieses Prüffelds aktualisieren: Bewertungsrichtlinie/Kalkulationsschema, Herleitung Gemeinkostenzuschlag, wesentliche Werk-
    und Rahmenverträge, ARGE-/Konsortialverträge. Neue oder geänderte Dokumente in M-Files ablegen bzw. verknüpfen und Änderungen im Textfeld vermerken.'
