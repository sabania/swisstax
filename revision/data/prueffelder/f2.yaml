  - Vorkalkulationen
  - Projektliste (Kosten, Restkosten)
  - Antwort Projektleitung
  rechnen: Abweichung = (Ist-Kosten + Restkosten) − Soll-Kosten Vorkalkulation; in % der Soll-Kosten
  feststellung_wenn: Wesentliche Kostenüberschreitung gegenüber Kalkulation ohne Anpassung der Bewertung oder ohne Erklärung.
