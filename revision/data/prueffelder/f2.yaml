  - quelle: hwp-er-2026__rz-0279-s247
    zitat: die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben, wie beispielsweise wichtige Verträge, Registerauszüge, Statuten etc.
- id: F2-401
  vorgehen: 'Nur auf Anweisung des WP: Abgrenzung zwischen Einkauf (Kreditorenrechnungen/Fremdleistungen um den Stichtag), Betriebsbuchhaltung (Projektkosten bis 31.12.) und Schlussfakturierung
    (Abnahmen/Fakturen um den Stichtag) prüfen. Kreditorenjournal und Ertragskonten der Folgeperiode auf Leistungen des alten Jahres durchsehen; Ergebnis im Textfeld.'
  nachweise:
  - Kreditorenjournal Folgeperiode
  - Kontoblätter Folgejahr
  - Abnahmeprotokolle
  - Debitorenrechnungen um den Stichtag
  rechnen: ''
  feststellung_wenn: Kosten oder Erlöse des alten Jahres im neuen Jahr erfasst, abgenommene Projekte nicht fakturiert oder Leistungen doppelt (Forderung und angefangene Arbeit) erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Einsicht in Rechnungen und Lieferpapiere vor und nach dem Periodenende zur Prüfung der richtigen zeitlichen Abgrenzung
  - quelle: or__art-958b
