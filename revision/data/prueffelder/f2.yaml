  - quelle: hwp-bur-2023__rz-0254-s214
    zitat: im Anhang eine erläuternde Aufgliederung vorzunehmen
- id: F2-321
  vorgehen: Aufstellung der Gesellschaft über stille Reserven auf angefangenen Arbeiten (Bestand Vorjahr, Bildung, Auflösung, Bestand 31.12.) einholen und mit dem Detailnachweis abstimmen;
    mit Prüfungserkenntnissen (z.B. Bewertung unter Herstellkosten) plausibilisieren. F2-Beitrag (Bildung, Auflösung, Nettoauflösung) an T1-305 melden; nicht isoliert beurteilen; fehlende
    Aufstellung als Pendenz.
