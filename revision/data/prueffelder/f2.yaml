schritte:
- id: F2-101
  vorgehen: 'Schriftliche Antwort von Geschäftsleitung/Projektleitung zur Art der angefangenen Arbeiten auswerten (Kundenaufträge mit Werkvertrag vs. Arbeiten auf Lager; Bauten auf fremdem
    Boden). Mit Projektliste (Kunde, Auftragswert, Status) und Unternehmenszweck abgleichen. Fehlt die Antwort: Frage als Pendenz erfassen. Im Textfeld Quelle der Antwort, Abgleich und
    offene Punkte festhalten.'
  nachweise:
  - Schriftliche Antwort Kundenbefragung
  - Projektliste angefangene Arbeiten 31.12.
  - Werkverträge/Auftragsbestätigungen
  - Unternehmensinformationen (Zweck)
  rechnen: ''
  feststellung_wenn: Keine schriftliche Antwort (Pendenz); Projekte ohne Kundenauftrag/Werkvertrag; Bauten auf fremdem Boden ohne zweckmässige Bezeichnung bzw. Abgrenzung zu Forderungen.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über die Art der angefangenen Arbeiten und nicht fakturierten Dienstleistungen (Arbeiten im Auftrag oder zur Lagerhaltung)
  - quelle: hwp-bur-2023__rz-0198-s204
    zitat: Bauten auf fremdem Boden sind somit den Forderungen gleichzustellen
- id: F2-102
  vorgehen: 'Schriftliche Beschreibung des Jahresend-Cut-offs auswerten: Erfassung aller Kosten bis 31.12. (Material, Montagestunden, Fremdleistungen), Behandlung abgenommener Projekte
    (Schlussfakturierung), Zuordnung der Anzahlungen. Mit Buchungen um den Stichtag plausibilisieren (Kontoblätter 1301/2030, Kreditorenjournal Januar). Fehlt die Antwort: Pendenz. Ergebnis
    im Textfeld dokumentieren.'
  nachweise:
  - Schriftliche Antwort zum Cut-off-Vorgehen
  - Kontoblätter angefangene Arbeiten und Anzahlungen
  - Kreditorenjournal Folgeperiode
  - Abnahmeprotokolle
  rechnen: ''
  feststellung_wenn: Kein definiertes Cut-off-Vorgehen; Kosten/Fremdleistungen des alten Jahres erst im neuen Jahr erfasst; abgenommene Projekte ohne Schlussrechnung weiter in angefangenen
    Arbeiten.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Befragung über das Vorgehen zur Überwachung der zeitlichen Abgrenzung am Ende des Geschäftsjahres
  - quelle: ser-2022__4-3-6
    zitat: Der Abschlussprüfer stützt sich wie bei der Vollständigkeit weitgehend auf Befragungen, analytische Prüfungshandlungen und allenfalls die Beurteilung der Ereignisse nach dem
      Bilanzstichtag.
- id: F2-103
  vorgehen: Feststellen, ob die nicht fakturierten Leistungen höchstens zu Herstellkosten bzw. tieferem Veräusserungswert (Niederstwert) oder alternativ zu erwarteten Honoraransätzen
    bewertet sind. Bewertungsmethode je Projekt in der Projektliste und Anhangangabe auswerten; Auskunft der Geschäftsleitung zur Methode als Pendenz anfordern. Abweichende Projekte
    im Textfeld nennen.
  nachweise:
  - Projektliste (Spalte Bewertungsmethode)
  - Anhang Jahresrechnung (Bewertungsgrundsätze)
  - Schriftliche Antwort Geschäftsleitung
  rechnen: 'je Projekt mit `rechne`: Bilanzwert − Herstellkosten (Einzel- + Gemeinkosten); > 0 = Bewertung über HK, Methode und Betrag notieren. Bilanzwert ≤ Vergleichswert (Auftragswert
    − Erlösminderungen − Restkosten). Bei Bewertung zum anteiligen Auftragswert: FG laut Liste vs. FG = Kosten / (Kosten + Restkosten); Wert = FG × Auftragswert vs. Bilanzwert.'
  feststellung_wenn: 'Feststellung, wenn: Bilanzwert > Vergleichswert; Methode je Projekt uneinheitlich (z.B. ein Projekt zum anteiligen Auftragswert, übrige zu HK) oder Anhang widerspricht
    der angewandten Methode; FG laut Liste ≠ berechneter FG. Ist die Bewertung einheitlich über HK (POCM bzw. Honoraransätze): Projekt, Methode und Differenz zu HK als Hinweis an WP.
    Die POCM-Voraussetzungen beurteilt der WP (F2-406).'
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: Feststellung, ob das Niederstwertprinzip befolgt worden ist oder ob alternativ die nicht fakturierten Dienstleistungen zu den zu erwartenden Honoraransätzen bewertet wurden
  - quelle: or__art-960c
    zitat: der Veräusserungswert unter Berücksichtigung noch anfallender Kosten am Bilanzstichtag unter den Anschaffungs- oder Herstellungskosten, so muss dieser Wert eingesetzt werden.
  - quelle: or__art-960a
    zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
  - quelle: hwp-bur-2023__rz-0747-s315
    zitat: In der Schweizer Rechnungslegungspraxis hat sich ein Wahlrecht zur Verwendung folgender Methoden herausgebildet
- id: F2-104
  vorgehen: Schriftliche Auskunft zu Bewertungsgrundsätzen (Material, Saläre, Gemeinkosten), Kostenrechnungssystem und dessen Verlässlichkeit auswerten. Herleitung des Gemeinkostenzuschlags
    mit Vorjahr vergleichen (Stetigkeit) und auf nicht aktivierbare Bestandteile (allg. Verwaltung, Vertrieb) durchsehen. Verlässlichkeit anhand Nachkalkulation abgeschlossener Projekte
    beurteilen; fehlende Angaben als Pendenz.
  nachweise:
  - Schriftliche Antwort Geschäftsleitung
  - Herleitung Gemeinkostenzuschlag Berichts- und Vorjahr
  - Nachkalkulationen abgeschlossener Projekte
  - Anhang (Bewertungsgrundsätze)
  rechnen: Σ Zuschlagssätze je Kostenstelle = Total-Gemeinkostenzuschlag; Vergleich Zuschlag Berichtsjahr/Vorjahr
  feststellung_wenn: Zuschlag enthält allgemeine Verwaltungs- oder Vertriebskosten (Verwaltung ohne nachgewiesenen Fabrikationsbezug), Methodenwechsel ohne Anhangangabe oder Kostenrechnung
    nicht verlässlich (grosse Abweichungen Vor-/Nachkalkulation).
  fundstellen:
  - quelle: ser-2022__anh-d-s078-2
    zitat: ob ein Kostenrechnungssystem verwendet wird und dieses in der Vergangenheit verlässliche Informationen erbracht hat
  - quelle: hwp-bur-2023__rz-0059-s070
    zitat: die Änderung der Ermittlung der Herstellungskosten (Kalkulationsschema, Kostenrechnungssystem etc.)
  - quelle: hwp-bur-2023__rz-0221-s207
    zitat: Nicht zu den Herstellungskosten gehören die allgemeinen Verwaltungs-
  - quelle: hwp-bur-2023__rz-0222-s208
    zitat: Teile der Verwaltungskosten, die sich auf die Materialverwaltung (ohne Verkaufslager) und die Fabrikation beziehen, beispielsweise Kosten der technischen Leitung oder der
      Betriebs- und Lohnbuchhaltung, können in die Herstellungskosten eingerechnet werden.
- id: F2-105
  vorgehen: Schriftliche Antwort auswerten, wie die verlustfreie Bewertung sichergestellt wird (Restkostenschätzung je Projekt, Vergleich mit Auftragswert, Verlustrückstellungen). Prüfen,
    ob die Projektliste Auftragswert und Restkosten je Projekt enthält und Verlustprojekte erkennbar macht. Fehlende Auskunft als Pendenz; Ergebnis im Textfeld.
  nachweise:
  - Schriftliche Antwort Geschäftsleitung/Projektleitung
  - Projektliste mit Restkosten
  - Rückstellungsspiegel
  rechnen: 'Jede Zeile der Projektliste mit `rechne`, Ergebnis mit Projekt-Id beschriften. (1) Verlustindikator: Marge = Auftragswert − Kosten bis Stichtag − geschätzte Restkosten;
    Marge < 0 → Verlustprojekt. (2) Bewertung ab dem Bilanzwert (verlustfreie Bewertung): Vergleichswert = noch zu erfassender Erlös (Auftragswert − bereits als Ertrag gebuchte Teilrechnungen)
    − Erlösminderungen − noch anfallende Kosten (Restkosten inkl. Vertriebskosten); Bilanzwert = Wert vor WB; WB-Bedarf = min(Bilanzwert; max(0; Bilanzwert − Vergleichswert));
    Rückstellung = max(0; −Vergleichswert) (Verlust über dem Bilanzwert); beide mit der verbuchten WB/Rückstellung vergleichen. Enthält der Bilanzwert einen Gewinnanteil, ist der WB-Bedarf
    grösser als −Marge. Gegenprobe: Σ Zeilen = Listentotal.'
  feststellung_wenn: Kein Verfahren zur verlustfreien Bewertung, Restkosten nicht geschätzt oder Projekt mit erwartetem Verlust ohne Wertberichtigung/Rückstellung. WB-Bedarf bzw. Rückstellung
    nach (2) nicht vollständig erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-3
    zitat: Befragung, wie die verlustfreie Bewertung von nicht fakturierten Dienstleistungen sichergestellt ist
  - quelle: hwp-bur-2023__rz-0233-s209
    zitat: so muss in der Folgebewertung dieser tiefere Wert eingesetzt werden
  - quelle: hwp-bur-2023__rz-0747-s315
    zitat: Ein sich abzeichnender Verlust ist bei Vertragsunterzeichnung vollumfänglich zurückzustellen.
  - quelle: hwp-bur-2023__rz-0747-s315
    zitat: eine Rückstellung für Verluste, die über die aufgelaufenen Kosten hinausgehen
  - quelle: hwp-bur-2023__rz-0246-s212
    zitat: die Verminderung des Preises auf dem Absatzmarkt um die noch zu erwartenden Erlösschmälerungen und Kosten, ergibt den für Bewertungszwecke massgeblichen Vergleichswert
  - quelle: hwp-bur-2023__rz-0246-s212
    zitat: Sind die Anschaffungs- oder Herstellungskosten höher als dieser Vergleichswert, ist eine entsprechende Wertberichtigung vorzunehmen
  notiz: 'Verlustprojekt ohne (ausreichende) WB/Rückstellung ≥ NAG → «Wesentliche Feststellungen» als Feststellung formuliert (nicht als Kundenfrage): Projekt, WB-Bedarf und Rückstellung
    mit `rechne`, Buchungsvorschlag (Aufwand bzw. Bestandesänderung an WB angefangene Arbeiten; Rest an Rückstellung drohende Verluste), Betrag auch mit der Gesamtwesentlichkeit (3.3)
    vergleichen und nennen; < NAG nur Textfeld. Restkosten oder Antwort fehlen → «Pendenz».'
- id: F2-201
  vorgehen: Saldo nicht fakturierte Leistungen (Konto 1301) und Bestandesänderung (3900) mit Vorjahr vergleichen; Relationen zu Nettoerlös und erhaltenen Anzahlungen (2030) bilden. Wesentliche
    Veränderungen und unerwartete Entwicklungen im Textfeld begründen; Erklärungen der Gesellschaft als Pendenz anfordern und mit der Projektliste plausibilisieren.
  nachweise:
  - Saldoliste 2025 mit Vorjahr
  - Jahresrechnung (Bilanz/ER)
  - Projektliste
  rechnen: 'Veränderung = Saldo 1301 31.12.2025 − Saldo 31.12.2024 (absolut/%); Kennzahlen: angefangene Arbeiten in % Nettoerlös, Anzahlungen in % angefangene Arbeiten, je mit Vorjahr;
    Bestandesänderung ER = Saldo angefangene Arbeiten GJ − Saldo VJ (Vorzeichen beachten) – Differenz als Hinweis (Detail F2-404)'
  feststellung_wenn: Veränderung über Toleranzwesentlichkeit ohne plausible Erklärung oder nicht plausible Kennzahlen (dann Detailprüfungen ergänzen).
  fundstellen:
  - quelle: ser-2022__6-1-2-t1
    zitat: Sie bestehen in der Analyse wesentlicher Kennzahlen und Trends, einschliesslich der Beurteilung von Veränderungen und Relationen
  - quelle: ser-2022__6-1-2-t3
    zitat: insbesondere wenn die Analysen nicht plausible Relationen oder Entwicklungen hervorbringen
  - quelle: or__art-959b-t1
    zitat: Bestandesänderungen an unfertigen und fertigen Erzeugnissen sowie an nicht fakturierten Dienstleistungen
- id: F2-202
  vorgehen: Je Projekt Bilanzwert (aufgelaufene Kosten) den erhaltenen Anzahlungen bzw. Abrechnungen von Unterakkordanten gegenüberstellen. Summe Anzahlungen gemäss Projektliste mit
    Konto 2030 abstimmen; überfinanzierte Projekte (Anzahlungen > Kosten) und Projekte ohne Anzahlungen kennzeichnen. Prüfen, ob Brutto- oder Nettodarstellung stetig und ohne Verrechnung
    über Projekte hinweg angewandt ist.
  nachweise:
  - Projektliste (Anzahlungen, Netto)
  - Kontoblatt 2030 erhaltene Anzahlungen
  - Teil-/Anzahlungsrechnungen
  - Abrechnungen Unterakkordanten
  rechnen: je Projekt Netto = Bilanzwert − erhaltene Anzahlungen; Σ Anzahlungen Projektliste = Saldo Konto 2030; Σ positive Netto (aktiv) und Σ negative Netto (passiv) getrennt ausweisen
  feststellung_wenn: Σ Anzahlungen ≠ Konto 2030, Überfinanzierungen mit aktiven Projekten verrechnet oder Anzahlungen deutlich über dem Fertigstellungsgrad (Hinweis auf fehlende Abrechnung).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0254-s214
    zitat: Bei der häufig angewandten Nettodarstellung wird für jedes einzelne Projekt ein Nettobuchwert ermittelt, der entweder aktiviert oder passiviert wird
  - quelle: hwp-bur-2023__rz-0748-s316-t1
    zitat: Eine Verrechnung von Aufträgen mit negativem Saldo mit solchen mit positivem Saldo widerspricht dem Bruttoprinzip
  - quelle: hwp-or-2024__rz-0915-s357
    zitat: Abgleich der Anzahlungen von Kunden mit dem Stand der begonnenen Arbeiten
- id: F2-203
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung kein Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt», Hinweise als Notiz «Schlussbesprechung»:
    Projekte mit Bilanzwert über Herstellkosten aus F2-103. Mit Anweisung: je Projekt Bilanzwert mit aufgelaufenen Herstellkosten (Einzel- + Gemeinkosten) vergleichen; Differenz = möglicher
    Gewinnanteil. Bei Bewertung nach POCM Voraussetzungen und Anhangangabe kennzeichnen. Ergebnis als Tabelle im Textfeld; Beurteilung dem WP überlassen.'
  nachweise:
  - Projektliste (Kosten, Bilanzwert, Bewertungsmethode)
  - Anhang Ziff. Bewertung
  - Kalkulationen
  rechnen: je Projekt Gewinnanteil = Bilanzwert − (Einzelkosten + Gemeinkosten); Vergleich Bilanzwert/Auftragswert mit Kosten/(Kosten + Restkosten)
  feststellung_wenn: Bilanzwert eines Projekts übersteigt die aufgelaufenen Herstellkosten, ohne dass POCM-Voraussetzungen dokumentiert und im Anhang offengelegt sind.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s079-2
    zitat: Analytische Prüfung, ob in den angefangenen Arbeiten kein Gewinnanteil enthalten ist
  - quelle: hwp-bur-2023__rz-0050-s067
