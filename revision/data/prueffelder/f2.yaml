- id: F2-301
  vorgehen: Total der Projektliste (Bilanzwert) mit Saldo Konto 1301 laut Hauptbuch/Saldoliste und mit der Bilanzposition nicht fakturierte Dienstleistungen abstimmen; Eröffnungssaldo
    mit Vorjahresabschluss abstimmen. Differenzen im Textfeld beziffern und als Feststellung bzw. Pendenz erfassen.
  nachweise:
  - Projektliste 31.12.
  - Kontoblatt 1301
  - Saldoliste
  - Jahresrechnung (Bilanz)
  rechnen: Σ Bilanzwert Projektliste = Saldo Konto 1301 = Bilanzposition «Nicht fakturierte Dienstleistungen»; Differenz = 0; jede Spalte der Projektliste selbst summieren (gedrucktes
    Total nur vergleichen); Marge je Zeile siehe F2-105
  feststellung_wenn: Differenz zwischen Projektliste, Hauptbuch und Jahresrechnung oder kein Bestandesnachweis vorhanden.
  fundstellen:
  - quelle: ser-2022__anh-d-s078-3
    zitat: Abstimmung des Totals der Inventarlisten und des Nachweises der nicht fakturierten Dienstleistungen mit dem Hauptbuch
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- id: F2-302
  vorgehen: Je wesentliches Projekt Arbeitsfortschritt (Fertigstellungsgrad, Abnahmeprotokolle, Status) und Abrechnungen der neuen Periode (Fakturen, Ertrags-/Debitorenkonten Jan.–Feb.,
    Gutschriften) einsehen. Prüfen, ob per Stichtag abgenommene Projekte korrekt behandelt sind und spätere Abrechnungen den Bilanzwert decken. Je Projekt Nachweis und Ergebnis im Textfeld
    festhalten.
  nachweise:
  - Projektliste (Fertigstellungsgrad, Status)
  - Abnahmeprotokolle
  - Kontoblätter Folgejahr
  - Fakturen/Schlussrechnungen neue Periode
  rechnen: 'Fertigstellungsgrad = Kosten bis 31.12. / (Kosten bis 31.12. + Restkosten); Vergleich Bilanzwert mit Folgefakturierung abzüglich Anzahlungen; Abnahme ≤ Stichtag → Ertrag
    im Prüfjahr, mit `rechne`: Ertrag Prüfjahr = Auftragswert (exkl. MWST) − bereits als Ertrag gebuchte Teilrechnungen; Ergebniswirkung = Ertrag Prüfjahr − Bilanzwert angefangene Arbeit.
    Nicht den Nettobetrag einer Schlussrechnung nach Abzug der Akonto-/Anzahlungen als Ertrag verwenden; erhaltene Anzahlungen werden mit der Forderung verrechnet (ohne Ergebniswirkung).'
  feststellung_wenn: Projekt vor dem Stichtag abgenommen, aber noch als angefangene Arbeit bilanziert; Folgefakturen oder Gutschriften deuten auf Überbewertung oder Verlust hin.
  fundstellen:
  - quelle: ser-2022__anh-d-s079-1
    zitat: Prüfung angefangener Arbeiten und nicht fakturierter Dienstleistungen anhand des Arbeitsfortschritts und/oder Abrechnungen in neuer Periode
  - quelle: hwp-er-2026__rz-0317-s254
    zitat: Ereignisse, die Nachweise für Umstände bzw. Sachverhalte liefern, die bereits am Bilanzstichtag vorlagen (berücksichtigungspflichtige Ereignisse)
  - quelle: hwp-bur-2023__rz-0745-s315
    zitat: Umsatz kann dann als realisiert betrachtet und somit erfasst werden, wenn die dem Vertrag zugrunde liegende Leistungsverpflichtung
  - quelle: hwp-bur-2023__rz-0748-s316-t2
    zitat: eine Forderung gegenüber dem Bauherrn, die mit den erhaltenen Anzahlungen zu verrechnen ist
  notiz: 'Abnahme vor dem Stichtag, Projekt aber noch als angefangene Arbeit: Ergebniswirkung ≥ NAG → «Wesentliche Feststellungen» (Sachverhalt des Prüfjahres, kein Ereignis nach dem
    Bilanzstichtag) mit Buchungsvorschlag (ohne Verbuchung): Forderung bzw. aktive Abgrenzung an Ertrag (Ertrag Prüfjahr); Bestandesänderung an angefangene Arbeiten (Bilanzwert); erhaltene
    Anzahlungen an Forderung (Verrechnung). < NAG nur Textfeld; Abnahmedatum unklar → «Pendenz».'
- id: F2-303
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung kein Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt», Hinweise als Notiz «Schlussbesprechung»:
    Hinweise auf erhöhtes Risiko aus F2-1xx/2xx an WP melden, nicht selbst starten. Mit Anweisung: Projekte mit hohem Wert bzw. Schlüsselprojekte auswählen; Kosten je Projekt mit Stundenrapporten,
    Materialbezügen, Fremdleistungsrechnungen, vereinbarten Abrechnungssätzen und Kalkulation abgleichen. Auswahlbegründung, Nachweise und Abweichungen im Textfeld dokumentieren.'
  nachweise:
  - Stunden-/Arbeitsfortschrittsaufzeichnungen
  - Kreditorenrechnungen Fremdleistungen
  - Kalkulation/Kostenrechnung
  - Vereinbarte Abrechnungssätze
  rechnen: 'je Stichprobenprojekt: Σ belegte Einzelkosten × (1 + GK-Zuschlag) = ausgewiesene Kosten total; Abweichung'
  feststellung_wenn: Kosten nicht belegt oder nicht projektbezogen, oder Bewertung liegt über den belegten Herstellkosten.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s079-1
    zitat: Stichprobenmässige Prüfung der Bewertung der nicht fakturierten Dienstleistungen und angefangenen Arbeiten anhand geeigneter Dokumente
  - quelle: hwp-er-2026__rz-0140-s206-t2
    zitat: geeigneter Dokumente (z.B. Auswertungen aus der Betriebsbuchhaltung) erforderlich machen
  - quelle: hwp-er-2026__rz-0261-s243
    zitat: beispielsweise Elemente mit einem hohen Wert oder Schlüsselelemente
- id: F2-304
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung kein Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt», Hinweise als Notiz «Schlussbesprechung»:
    Verlustprojekte aus F2-105. Mit Anweisung: Berechnung der Gesellschaft zu Wertberichtigungen/Verlustrückstellungen für Projekte mit ungenügender Marge nachvollziehen (Rückrechnung:
    Auftragswert abzüglich Erlösminderungen und Restkosten). Fehlt eine Berechnung, Rückrechnung je Projekt aus der Projektliste vorbereiten, Rückstellungsspiegel durchsehen und Abweichungen
    dem WP vorlegen.'
  nachweise:
  - Berechnung Wertberichtigungen/Verlustrückstellungen
  - Projektliste (Auftragswert, Restkosten)
  - Rückstellungsspiegel
  rechnen: Vergleichswert = Auftragswert − Erlösminderungen − Restkosten; erforderliche WB = max(0; Bilanzwert − Vergleichswert); übersteigender Verlust → Rückstellung
  feststellung_wenn: Bilanzwert eines Projekts über dem Vergleichswert ohne Wertberichtigung oder erwarteter Projektverlust nicht vollständig berücksichtigt.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s079-1
    zitat: Nachvollzug der vom Kunden berechneten Wertberichtigungen für die verlustfreie Bewertung von Produktkategorien und nicht fakturierten Dienstleistungen mit ungenügenden Margen
  - quelle: hwp-bur-2023__rz-0246-s212
    zitat: ist eine entsprechende Wertberichtigung vorzunehmen
  - quelle: hwp-bur-2023__rz-0211-s107
    zitat: Somit sind auch für drohende Verluste aus schwebenden Geschäften Rückstellungen zu bilden.
- id: F2-306
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung kein Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt», Hinweise als Notiz «Schlussbesprechung».
    Mit Anweisung (bei Anlagen-/Projektgeschäft): Herstellkostenwerte der Projektliste mit Kalkulation und Kostenrechnung (Projektkostenauswertung, Herleitung Gemeinkostenzuschlag) abstimmen.
    Nur Abstimmung/Plausibilisierung, keine vertiefte Kalkulationsprüfung. Abweichungen und nicht aktivierbare Zuschlagsbestandteile im Textfeld aufführen.'
  nachweise:
  - Projektkostenauswertung Betriebsbuchhaltung
  - Herleitung Gemeinkostenzuschlag
  - Projektliste
  rechnen: Gemeinkosten je Projekt = Einzelkosten × Zuschlagssatz; Σ Kostenstellensätze = Total-Zuschlag; Kosten total Projektliste = Kosten gemäss Kostenrechnung
  feststellung_wenn: Abweichung zwischen Projektliste und Kostenrechnung oder Zuschlag enthält nicht aktivierbare Kosten (allg. Verwaltung ohne nachgewiesenen Fabrikationsbezug, Vertrieb,
    Unterbeschäftigung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s079-1
    zitat: Abstimmung der Herstellkostenwerte mit den Unterlagen der Kalkulation und Kostenrechnung (bei Unternehmen, welche im Anlagen- und Projektgeschäft tätig sind)
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: lediglich vertiefte Prüfungen sind ausgeschlossen; hingegen nimmt der Abschlussprüfer bei entsprechender Risikolage ggf. eine Plausibilisierung der Herstellkostenkalkulation
      vor
  - quelle: hwp-bur-2023__rz-0221-s207
    zitat: Nicht zu den Herstellungskosten gehören die allgemeinen Verwaltungs-
  - quelle: hwp-bur-2023__rz-0222-s208
    zitat: Teile der Verwaltungskosten, die sich auf die Materialverwaltung (ohne Verkaufslager) und die Fabrikation beziehen, beispielsweise Kosten der technischen Leitung oder der
      Betriebs- und Lohnbuchhaltung, können in die Herstellungskosten eingerechnet werden.
- id: F2-320
  vorgehen: 'Anhang auf Angaben zu den angefangenen Arbeiten durchsehen: Bewertungsgrundsätze (Herstellkosten/POCM, Fertigstellungsgrad), Methodenwechsel, Aufgliederung bei Nettodarstellung
    mit Anzahlungen, ggf. Eventualverbindlichkeiten aus ARGE. Anhangtext mit der tatsächlich angewandten Bewertung in der Projektliste abgleichen; Ergebnis im Textfeld.'
  nachweise:
  - Anhang Jahresrechnung
  - Projektliste (Bewertungsmethode)
  rechnen: ''
  feststellung_wenn: Anhangangabe fehlt, ist unvollständig oder widerspricht der tatsächlich angewandten Bewertungsmethode.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind?
