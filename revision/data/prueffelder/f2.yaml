    zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
- id: F2-404
  vorgehen: 'Auf Anweisung des WP: prüfen, ob die Bestandesänderung der nicht fakturierten Leistungen in der Erfolgsrechnung (z.B. Konto 3900) der Veränderung des Bilanzkontos entspricht
    und separat ausgewiesen ist; Beleg der Abschlussbuchung (Projektliste) einsehen. Ergebnis im Textfeld.'
  nachweise:
  - Saldoliste
  - Kontoblatt 1301
  - Erfolgsrechnung
  - Buchungsbeleg Abschlussbuchung
  rechnen: Bestandesänderung ER = Saldo 1301 31.12.2025 − Saldo 1301 31.12.2024 (Vorzeichen beachten)
  feststellung_wenn: Bestandesänderung ≠ Veränderung des Bilanzkontos, nicht separat ausgewiesen oder Buchung ohne Beleg.
  fundstellen:
