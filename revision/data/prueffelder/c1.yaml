# Prüffeld C1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: C1
bezeichnung: Forderungen aus Lieferungen und Leistungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 15
    korrigiert: true
kurzbeschrieb: 'Agent: Befragung nur schriftlich (sonst Pendenz); WP-Schritte (106, 208, 304–308) und 4xx nur auf Anweisung; keine Debitoren-/Bankbestätigungen einholen. Inhalt: Debitoren
  inkl. Delkredere (Einzel- vor Pauschal-WB), Erlöse, Abgrenzung, Fremdwährung, Nahestehende, Habensalden, Zession.'
gesetz:
- thema: 'Mindestgliederung: Forderungen aus L+L als eigene Position im Umlaufvermögen (Art. 959a Abs. 1 Ziff. 1 lit. b OR)'
  quelle: or__art-959a-t1
  zitat: Unter den Aktiven müssen ihrem Liquiditätsgrad entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: Gesonderter Ausweis von Forderungen gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht, müssen jeweils gesondert
- thema: Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR)
  quelle: or__art-959
  zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist
- thema: Umlaufvermögen/Kurzfristigkeit (Art. 959 Abs. 3 OR)
  quelle: or__art-959
  zitat: innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verrechnungsverbot (Art. 958c Abs. 1 Ziff. 7 OR) – Habensalden
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Bestandesnachweis durch Inventar/Saldenliste (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Einzelbewertung wesentlicher Aktiven (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet, sofern sie wesentlich sind
- thema: Vorsichtige Bewertung (Art. 960 Abs. 2 OR)
  quelle: or__art-960
  zitat: Die Bewertung muss vorsichtig erfolgen, darf aber die zuverlässige Beurteilung der wirtschaftlichen Lage des Unternehmens nicht verhindern.
- thema: Werthaltigkeitsprüfung bei Anzeichen einer Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Wertverluste auf Forderungen durch Wertberichtigungen (Delkredere) berücksichtigen (Art. 960a Abs. 3 Satz 1 OR)
  quelle: or__art-960a
  zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
- thema: Wertberichtigungen direkt oder indirekt bei den Aktiven absetzen, nicht unter den Passiven ausweisen (Art. 960a Abs. 3 Satz 3 OR)
  quelle: or__art-960a
  zitat: dürfen nicht unter den Passiven ausgewiesen werden
- thema: Zusätzliche Wertberichtigungen = stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: zur Sicherung eigener Verbindlichkeiten verwendete Aktiven, z. B. verpfändete/zedierte Forderungen (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: wesentliche Ereignisse nach dem Bilanzstichtag (Art. 959c Abs. 2 Ziff. 13 OR)'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- thema: Umrechnungskurse im Anhang, falls Rechnungslegung nicht in Landeswährung (Art. 958d Abs. 3 OR)
  quelle: or__art-958d
  zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
risiken:
- text: Ausgewiesene Forderungen bestehen nicht (bereits bezahlt, doppelt oder fiktiv erfasst).
  pruefziele:
  - EX
  - EN
  - RI
  quelle: hwp-er-2026__rz-0080-s194
  zitat: 'diese Kundenforderungen am Bilanzstichtag existieren (Aussage: Vorhandensein)'
- text: 'Periodenabgrenzung: Fakturen bzw. Akonto-/Anzahlungsrechnungen für Leistungen nach dem Stichtag als Forderung und Ertrag erfasst.'
  pruefziele:
  - PA
  - EN
  - EX
  quelle: hwp-bur-2023__rz-0109-s185
  zitat: Solche Anzahlungen von Kunden werden erst bilanziert, wenn die Zahlung erfolgt ist
- text: Lieferungen mit Rückgaberecht bzw. fakturierte, noch nicht ausgelieferte Ware (Bill-and-hold) vorzeitig als Forderung erfasst statt unter den Vorräten.
  pruefziele:
  - EX
  - PA
  - BE
  quelle: hwp-bur-2023__rz-0746-s315
  zitat: Bis zu diesem Zeitpunkt be gründet die ausgelieferte Ware noch keine Forderung und ist demnach unter den Vor räten zu bilanzieren.
- text: 'Ungenügendes Delkredere: gefährdete Einzelposten (Konkurs, Betreibung, Bestreitung) nicht oder zu tief wertberichtigt, allgemeines Kreditrisiko nicht berücksichtigt.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0120-s186
  zitat: Für zweifelhafte Forderungen und für das allgemeine Kreditrisiko ist ein angemessenes Delkredere zu bilden
- text: Uneinbringliche Forderungen (Konkurs, Verjährung) werden weiterhin bilanziert statt ausgebucht.
  pruefziele:
  - BE
  - EX
  quelle: hwp-bur-2023__rz-0121-s187
  zitat: Verjährte oder aufgrund von Konkursen uneinbringliche Forderungen sind nicht bilan zierungsfähig und daher auszubuchen.
- text: Erwartete Erlösminderungen (Rabatte, Skonti, Boni, Gutschriften) nicht berücksichtigt.
  pruefziele:
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0118-s186
  zitat: Für zu erwartende Erlösminderungen wie Rabatte, Preisnachlässe, von der Rechnung absetzbare Umsatzprämien oder Skonto und ähnliche Abzüge sind Wertberichtigungen zu bilden
- text: Fremdwährungsforderungen nicht zum Stichtagskurs bewertet.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
- text: Ansprüche, die nicht aus dem Verkauf betriebstypischer Erzeugnisse, Waren und Dienstleistungen stammen (z. B. Darlehen an Aktionäre), unter Forderungen aus L+L erfasst.
  pruefziele:
  - DO
  - EX
  quelle: hwp-bur-2023__rz-0108-s185
  zitat: Verkauf der für das einzelne Unternehmen typischen Erzeugnisse, Handelswaren und Dienstleistungen zu verstehen
- text: Forderungen gegenüber Beteiligten, Organen und Beteiligungsgesellschaften nicht gesondert in Bilanz oder Anhang ausgewiesen.
  pruefziele:
  - DO
  - RV
  quelle: or__art-959a-t2
  zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- text: Forderungen mit Darlehenscharakter gegenüber Aktionären verletzen allenfalls die Kapitalschutzbestimmungen (Einlagenrückgewähr) – Schnittstelle Eigenkapital-Prüffeld.
  pruefziele:
  - DO
  - RV
  quelle: hwp-bur-2023__rz-0176-s196-t1
  zitat: sofern der Gesellschaftszweck die Kreditgewährung nicht ausschliesst und die Kapitalschutzbestimmungen
- text: Habensalden (z. B. Gutschriften, Vorauszahlungen) mit Forderungen verrechnet statt als Verbindlichkeit ausgewiesen.
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0125-s187
  zitat: Eine Verrechnung von Positionen mit Habensalden mit anderen Forderungen aus Lie ferungen und Leistungen ist grundsätzlich nicht zulässig
- text: Verpfändete oder zedierte Forderungen (z. B. stille Globalzession an eine Bank) im Anhang nicht offengelegt.
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0112-s185
  zitat: Als Sicherheit abgetretene Forderungen bleiben weiterhin beim Zedenten oder der Ze dentin bilanzierungspflichtig.
- text: Im echten Factoring (Delkredererisiko beim Factor) abgetretene Forderungen nicht ausgebucht bzw. Zessionskredit wie Factoring behandelt.
  pruefziele:
  - EX
  - DO
  quelle: hwp-bur-2023__rz-0141-s190
  zitat: Die Übernahme des Delkredererisikos durch den Factor gestattet dem Factoring-Kun den, die abgetretenen Kundenforderungen auszubuchen
- text: OP-Liste/Altersgliederung (IT-Auswertung) unvollständig oder nicht mit dem Hauptbuch abgestimmt.
  pruefziele:
  - VO
  - RI
  - EX
  quelle: hwp-er-2026__rz-0266-s244
  zitat: IT-gestützte Auswertungen werden abgestimmt mit Werten aus der Finanzbuchhaltung oder den Nebenbüchern und auf die rechnerische Richtigkeit hin geprüft
- text: Stille Reserven im Delkredere unbekannt; Nettoauflösung nicht erkannt bzw. nicht offengelegt.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwi schen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
- text: Konsignationsware als Forderung statt als Vorrat erfasst.
  pruefziele:
  - EX
  - BE
  quelle: hwp-bur-2023__rz-0213-s207
  zitat: In Kommission gegebene Waren (Konsignationsware) sind separat unter Vorräten, nicht als Forderungen auszuweisen.
- text: Ereignisse nach dem Stichtag (Konkurs eines Kunden, Gutschriften, Ausbuchungen) nicht im Abschluss berücksichtigt.
  pruefziele:
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0864-s354
  zitat: wird seine oder ihre Zahlungsunfähigkeit bekannt, muss für die Forderungen eine Wertberichtigung gebildet werden.
