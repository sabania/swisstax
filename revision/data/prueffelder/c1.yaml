schritte:
- id: C1-101
  vorgehen: 'OP-Liste per Stichtag laden und alte (Altersgrenze nur nach Vorgabe WP, siehe Rechnen), im Verhältnis zum Total ungewöhnlich hohe Posten und Habensalden markieren. Nicht
    selbst befragen: vorhandene schriftliche Antworten (10.11, Vollständigkeitserklärung, Protokolle) auswerten und würdigen; sonst je Posten Frage (Grund, Einbringlichkeit, Ausweis
    Habensaldo) als Notiz «Pendenz» (Versand durch WP). Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Debitoren-OP-Liste per 31.12.
  - schriftliche Antworten (revio 10.11, Vollständigkeitserklärung, Protokolle)
  - Korrespondenz/Mahnungen zu markierten Posten
  rechnen: 'Markieren: (1) Tage überfällig je Posten mit `rechne`. Altersgrenze «alt» nur nach Vorgabe des WP. Fehlt sie: alle überfälligen Posten absteigend nach Tagen auflisten, keine
    eigene Grenze festlegen, Notiz «Pendenz: Altersgrenze «alt» festlegen (WP)». (2) Betrag > Toleranzwesentlichkeit (revio 3.3) oder im Vergleich zu den übrigen Posten auffällig hoch
    (Auswahl im Textfeld begründen). (3) Saldo < 0 (Habensaldo).'
  feststellung_wenn: Alte/hohe Ausstände ohne plausible schriftliche Begründung oder ohne Wertberichtigung; wesentliche Habensalden nicht als Verbindlichkeit ausgewiesen; Antwort fehlt
    (Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Durchsicht der Debitoren-OP-Liste und Befragung über Gründe für alte, ungewöhnlich hohe Ausstände sowie Habensalden
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Ab welchem Alter gilt eine Forderung als «alt»?
- id: C1-102
  vorgehen: 'Beim Unternehmen vorhandene Bankbestätigungen (Abschnitt Sicherheiten; keine eigenen anfordern) sowie Kredit-, Zessions- und Factoringverträge in M-Files auf Verpfändung,
    Zession, Factoring oder Inkasso durchsehen; schriftliche Antworten (10.11, Vollständigkeitserklärung) auswerten, sonst Frage als Notiz «Pendenz». Zessionskredit: bleibt bilanziert,
    Anhangsangabe; echtes Factoring: Ausbuchung. Ergebnis an C1-320. Status höchstens «teilweise bearbeitet». Bankbestätigungen und Kreditverträge liegen meist bei den flüssigen Mitteln
    bzw. Bankverbindlichkeiten, nicht bei den Debitoren: akteweit suchen («Zession», «Abtretung», «Sicherheiten», «Pfand»; GJ- und VJ-Akte) und den VJ-Anhang lesen (im VJ offengelegte
    Zession: Fortbestand prüfen). «Keine Zession» nur schreiben, wenn Bankbestätigung bzw. Kreditvertrag gelesen ist; sonst Status «teilweise bearbeitet» und Pendenz.'
  nachweise:
  - Bankbestätigungen per 31.12. (Sicherheiten zugunsten der Bank), sofern beim Unternehmen vorhanden
  - Kredit-, Zessions- oder Factoringverträge (Dauerakte)
  - schriftliche Antwort bzw. Vollständigkeitserklärung
  - Anhang Jahresrechnung
  rechnen: ''
  feststellung_wenn: Bankbestätigung oder Verträge nennen Zession/Verpfändung (z. B. Globalzession), aber Anhangsangabe nach Art. 959c Abs. 2 Ziff. 9 OR fehlt oder die schriftliche Antwort
    verneint eine Abtretung.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Befragung, ob Forderungen verpfändet, abgetreten oder zum Inkasso gegeben worden sind
  - quelle: hwp-bur-2023__rz-0112-s185
    zitat: Solche Forderungen sind im Anhang offenzulegen.
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0141-s190
    zitat: Die Übernahme des Delkredererisikos durch den Factor gestattet dem Factoring-Kun den, die abgetretenen Kundenforderungen auszubuchen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: hwp-er-2026__rz-0262-s085
    zitat: weder das Einholen von Debitoren- und Kreditorenbestätigungen noch von Bank- oder Anwaltsbestätigungen oder Experten-Gutachten
  - quelle: hwp-er-2026__rz-0011-s180
    zitat: die Ergebnisse aus den vorhergehenden eingeschränkten Revisionen
  - quelle: konzept-ki-revisionsagent-2026__c005-1
    zitat: fehlende Daten dürfen nicht erfunden werden
- id: C1-103
  vorgehen: Aus Saldoliste aktuell/VJ und ggf. Budget die Veränderungen der Konten Debitoren, Delkredere, Erlöse und Erlösminderungen berechnen. Für wesentliche Abweichungen vorhandene
    schriftliche Erläuterungen (10.11, Protokolle) auswerten und gegen das Unternehmensverständnis würdigen; fehlt eine Erklärung, Frage als Notiz «Pendenz» (Versand durch WP). Status
    höchstens «teilweise bearbeitet».
  nachweise:
  - Saldoliste aktuelles Jahr und Vorjahr
  - Budget/Erwartungen
  - schriftliche Erläuterungen der Unternehmensleitung
  rechnen: Abweichung = Saldo 31.12. − Saldo VJ (CHF und %); markieren, wenn über festgelegter Schwelle (z. B. Toleranzwesentlichkeit)
  feststellung_wenn: Wesentliche Abweichung ohne plausible schriftliche Erklärung oder Erklärung widerspricht anderen Prüfungsnachweisen.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: C1-104
  vorgehen: Schriftliche Beschreibung von Mahnwesen und Delkrederemethode (Einzel-/Pauschal-WB, Sätze, Stetigkeit) aus 10.11 bzw. M-Files auswerten, sonst Frage als Notiz «Pendenz».
    Methode mit Delkredereberechnung und Verlusterfahrung der VJ vergleichen und Angemessenheit vorbeurteilen; Wahl betriebswirtschaftlich vs. ESTV-Pauschale als offenen Punkt für den
    WP markieren. Status höchstens «teilweise bearbeitet».
  nachweise:
  - Beschreibung Debitorenbewirtschaftung/Mahnwesen (schriftlich)
  - Delkredereberechnung aktuell und VJ
  - Konto Debitorenverluste
  rechnen: ''
  feststellung_wenn: Keine nachvollziehbare oder nicht stetige Methode; Einzelrisiken nicht vor der Pauschal-WB erfasst; kein Delkredere trotz stark überfälliger Posten.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0120-s186
    zitat: Die Wertberichtigungen für gefährdete Forderungen sind zunächst einzeln zu ermitteln; danach sind Pauschalwertberichtigungen auf den restlichen Guthaben zu bilden.
  - quelle: hwp-er-2026__rz-0397-s273
    zitat: dass der Abschlussprüfer die Eignung der Bewertungsmethode wie auch deren stetige Anwendung prüft
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Betriebswirtschaftliche Herleitung oder steuerlich akzeptierte ESTV-Pauschale?
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: C1-105
  vorgehen: Schriftliche Antwort zum Abgrenzungsvorgehen (Fakturierung nach Lieferung/Abnahme, Teil- vs. Akontorechnungen, Bill-and-hold, Rückgaberecht, angefangene Arbeiten) auswerten,
    sonst Frage als Notiz «Pendenz». Mit Fakturen um den Stichtag (Rechnungs-/Leistungsdatum, Abnahmeprotokolle) abgleichen; Auffälligkeiten an C1-312 bzw. als Hinweis für C1-305 (WP).
    Status höchstens «teilweise bearbeitet».
  nachweise:
  - schriftliche Antwort zum Abgrenzungsvorgehen
  - Kontoblatt Debitoren Dezember/Januar
  - Fakturen und Abnahmeprotokolle um den Stichtag
  - Projektliste angefangene Arbeiten
  rechnen: Liste der im alten Jahr gebuchten Fakturen mit Rechnungs- oder Leistungsdatum nach dem Bilanzstichtag (Summe = möglicher Abgrenzungsfehler)
  feststellung_wenn: Fakturen für Leistungen nach dem Stichtag, unbezahlte Akontorechnungen oder nicht fertiggestellte Bill-and-hold-Lieferungen als Forderung/Ertrag gebucht; Gutschriften
    des alten Jahres fehlen.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Befragung über die Grundsätze und zeitliche Abgrenzung bei der Verbuchung von Umsätzen und Waren-/Materialaufwand
  - quelle: ser-2022__anh-d-s092-1
    zitat: Einsicht in Rechnungen und Lieferpapiere vor und nach dem Periodenende zur Prüfung der richtigen zeitlichen Abgrenzung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: C1-106
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: schriftliche
    Antworten auswerten, sonst Frage als Notiz «Pendenz»; Kontoblätter Debitoren/Erlöse neue Rechnung auf Ausbuchungen und Gutschriften durchsehen und je Fall festhalten, ob die Ursache
    am Stichtag bestand und erfasst ist. Höchstens «teilweise bearbeitet».'
  nachweise:
  - Kontoblätter Debitoren und Erlöse neue Rechnung
  - Gutschrifts- und Ausbuchungsbelege mit Begründung
  - schriftliche Antwort
  rechnen: Σ Gutschriften/Ausbuchungen neue Rechnung zu Vorjahresfakturen − im Abschluss erfasste Wertberichtigung/Abgrenzung
  feststellung_wenn: Wesentliche Ausbuchung/Gutschrift betrifft Umstände vor dem Stichtag und ist im Abschluss nicht berücksichtigt (nur bei Bearbeitung auf Anweisung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: hwp-er-2026__rz-0317-s254
    zitat: Ereignisse, die Nachweise für Umstände bzw. Sachverhalte liefern, die bereits am Bilanzstichtag vorlagen (berücksichtigungspflichtige Ereignisse)
  - quelle: ser-2022__anh-d-s075-2
    zitat: Durchsicht der Erlös- und Erlösminderungskonten in neuer Rechnung auf auffällige Beträge, die das Vorjahr betreffen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: C1-201
  vorgehen: Bestand Debitoren, Delkredere und Netto-Forderungen per Stichtag mit dem Vorjahr vergleichen und ins Verhältnis zum Nettoerlös setzen. Wesentliche Veränderungen mit den schriftlichen
    Erklärungen aus C1-103 begründen und Tabelle VJ/aktuell/Veränderung im Textfeld dokumentieren; bei unplausibler Entwicklung Ausweitung der Detailprüfungen dem WP als Notiz vorschlagen.
  nachweise:
  - Saldoliste bzw. Jahresrechnung VJ und aktuell
  rechnen: Veränderung = Saldo Debitoren aktuell − Saldo VJ; Forderungsquote = Forderungen / Nettoerlös (aktuell vs. VJ, gleiche Basis)
  feststellung_wenn: Veränderung wesentlich und weder durch Umsatzentwicklung noch durch schriftliche Erklärungen erklärt.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Vergleich des Bestands der Forderungen mit dem Vorjahr
  - quelle: ser-2022__6-1-2-t3
    zitat: Bei wesentlichen Bilanzpositionen sind die analytischen Prüfungshandlungen in der Regel um angemessene Detailprüfungen zu ergänzen
- id: C1-202
  vorgehen: Altersgliederung mit dem Total der OP-Liste und dem Hauptbuch abstimmen und stichprobenweise nachrechnen, ob Posten in der richtigen Überfälligkeitsklasse stehen. Anteile
    je Klasse mit dem VJ vergleichen; für alte, hohe und Haben-Posten schriftliche Begründungen auswerten, sonst Frage als Notiz «Pendenz» (Verbindung C1-101). Ergebnis an C1-302.
  nachweise:
  - Altersgliederung Debitoren per 31.12.
  - OP-Liste mit Fälligkeiten
  - schriftliche Antworten zur Einbringlichkeit
  rechnen: Tage überfällig = Stichtag − Fälligkeitsdatum; Σ je Altersklasse = Total OP-Liste; Anteil je Klasse in % (aktuell vs. VJ)
  feststellung_wenn: Altersgliederung nicht mit OP-Liste/Hauptbuch abstimmbar, Klassierung falsch oder hoher Anteil stark überfälliger Posten ohne Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Beurteilung der Altersstruktur der Forderungen
  - quelle: hwp-er-2026__rz-0266-s244
    zitat: ob Debitorenrechnungen in der richtigen Überfälligkeitskategorie angezeigt werden
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: C1-203
  vorgehen: Fremdwährungsposten der OP-Liste identifizieren und die angewandten Kurse mit den Jahresendkursen gemäss Bankunterlagen bzw. Kursliste per Stichtag vergleichen; Bewertungsdifferenz
    nachrechnen. Bestehen keine Fremdwährungsforderungen, dies im Textfeld festhalten.
  nachweise:
  - OP-Liste mit Währungsangabe
  - Kursliste/Bankauszug bzw. Bankbestätigung per 31.12.
  rechnen: Sollwert CHF = Betrag FW × Stichtagskurs; Differenz = Buchwert CHF − Sollwert CHF
  feststellung_wenn: Angewandter Kurs weicht vom Stichtagskurs ab und die Bewertungsdifferenz ist wesentlich.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
- id: C1-204
  vorgehen: OP-Liste und Kontoblatt mit Aktionären, Organen und Beteiligungen (Aktienbuch, HR-Auszug, Dauerakte) abgleichen und Forderungen gegenüber Nahestehenden identifizieren. Prüfen,
    ob sie aus betriebstypischen Lieferungen stammen oder Darlehenscharakter haben und ob sie gesondert in Bilanz oder Anhang ausgewiesen sind; Darlehen als Hinweis an D1-201 (Ausweis
    übrige Forderungen) und P1-305 (Einlagenrückgewähr) übergeben.
  nachweise:
  - OP-Liste und Kontoblatt Debitoren
  - Aktienbuch/Organliste/HR-Auszug
  - Verträge mit Nahestehenden (z. B. Darlehensverträge)
  - Anhang Jahresrechnung
  rechnen: Σ Forderungen gegenüber Beteiligten/Organen/Beteiligungsgesellschaften = gesonderter Ausweis in Bilanz bzw. Anhang
  feststellung_wenn: Forderungen gegenüber Nahestehenden nicht gesondert ausgewiesen, Darlehen unter Forderungen aus L+L erfasst oder Konditionen nicht drittvergleichskonform.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-1
    zitat: Feststellung von Forderungen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: hwp-bur-2023__rz-0124-s187
    zitat: Ein gesonderter Ausweis in der Bilanz oder im Anhang wird vom Gesetz für Forderun gen aus Lieferungen und Leistungen gegenüber nahestehenden Personen verlangt
  - quelle: hwp-bur-2023__rz-0108-s185
    zitat: Verkauf der für das einzelne Unternehmen typischen Erzeugnisse, Handelswaren und Dienstleistungen zu verstehen
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: Als Forderungen ihnen gegenüber gelten hierbei alle direkten (up stream) und indirekten (cross stream) Forderungen mit Darlehenscharakter.
  - quelle: hwp-er-2026__rz-0180-s218
    zitat: Bei Anzeichen auf einen Verstoss gegen das Verbot der Einlagenrückgewähr sind die notwendigen Prüfungshandlungen vorzunehmen
- id: C1-205
  vorgehen: Umsatzerlöse aus Saldoliste bzw. Umsatzstatistik nach geographischen Märkten, Kunden- und Artikelgruppen aufteilen und mit VJ und Budget vergleichen. Für wesentliche Veränderungen
    schriftliche Erklärungen auswerten, sonst Frage als Notiz «Pendenz»; fehlt eine Umsatzstatistik, Notiz «Pendenz» und PBC-Vorschlag (10.10).
  nachweise:
  - Umsatzstatistik nach Segmenten
  - Saldoliste Erfolgsrechnung VJ/aktuell
  - Budget
  rechnen: Anteil Segment = Umsatz Segment / Nettoerlös total; Veränderung zu VJ und Budget in CHF und %
  feststellung_wenn: Unerklärte wesentliche Veränderung einzelner Segmente oder Umsatzentwicklung nicht vereinbar mit dem Forderungsbestand.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Vergleich von Umsätzen, Warenaufwand und Bruttomargen je Produktkategorie mit dem Vorjahr; Besprechung wesentlicher Abweichungen
  - quelle: ser-2022__6-1-2-t1
    zitat: voraussichtlichen Ergebnissen des Unternehmens wie etwa Budgets, Prognosen
  - quelle: hwp-er-2026__rz-0058-s189
    zitat: Ebenso erlaubt die Prüfung der Forderungen aus Lieferungen und Leistungen eine Beurteilung des entsprechenden Umsatzes.
- id: C1-206
  vorgehen: Aus Umsatz je Kunde und OP-Liste die grössten Kunden nach Umsatz und die grössten Debitorenpositionen per Stichtag ermitteln (z. B. Top 5/Top 10) und Konzentrationen festhalten.
    Weitere Merkmale der Kundenstruktur (öffentliche Hand, Private, Ausland, Nahestehende) dokumentieren als Basis für Bewertung (C1-311) und Dauerakte.
  nachweise:
  - Umsatz je Kunde
  - OP-Liste per 31.12.
  rechnen: Anteil Top-n-Kunden am Nettoerlös; Anteil Top-n-Debitoren am OP-Total
  feststellung_wenn: Hohe Konzentration auf Kunden mit Bonitätszweifeln ohne Berücksichtigung in der Bewertung.
  fundstellen:
  - quelle: ser-2022__6-1-2-t1
    zitat: Sie bestehen in der Analyse wesentlicher Kennzahlen und Trends, einschliesslich der Beurteilung von Veränderungen und Relationen
  - quelle: hwp-er-2026__rz-0023-s182
    zitat: Der Abschlussprüfer nutzt seine Kenntnisse über die Geschäftstätigkeit (Kunden, Produkte und Leistungen) und das Umfeld des Unternehmens
- id: C1-207
  vorgehen: Debitorenverluste in % vom Umsatz und durchschnittliche Zahlungsfrist (Debitorenlaufzeit) für aktuelles Jahr und VJ berechnen und mit den vertraglichen Zahlungsfristen vergleichen.
    Umsatzbasis im Textfeld nennen (identisch mit C1-208, VJ gleich berechnet); deutliche Verschlechterungen als Bewertungsindiz an C1-302.
  nachweise:
  - Saldoliste Bilanz/Erfolgsrechnung VJ und aktuell
  - Konto Debitorenverluste bzw. Erlösminderungen
  - Zahlungskonditionen
  rechnen: Umsatz U = Erlöse aus L+L vor Erlösminderungen und Debitorenverlusten, exkl. MWST (gleiche Basis wie C1-208, VJ identisch); Verlustquote = Debitorenverluste / U × 100; Debitorenlaufzeit
    (Tage) = Debitorenbestand inkl. MWST (ggf. Ø Anfang/Ende) / (U inkl. MWST) × 365
  feststellung_wenn: Kennzahlen weichen wesentlich vom VJ oder von den Zahlungsfristen ab und sind nicht erklärt.
  fundstellen:
  - quelle: ser-2022__6-1-2-t1
    zitat: Vergleich des Verhältnisses von Umsatzerlösen zu Forderungen mit einem Branchendurchschnitt
  - quelle: hwp-bur-2023__rz-0750-s317-t2
    zitat: Tatsächlich eingetretene Debitorenverluste sowie Wertberichtigungen auf Forderungen für latente Ausfallrisiken (pauschales Delkredere, Einzelwertberichtigungen) können von
      den Erlösen
- id: C1-208
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: Rabatte/Skonti
    und Debitorenverluste in % des Umsatzes (Basis wie C1-207) für aktuelles Jahr und VJ berechnen und vergleichen; vorhandene Erläuterungen auswerten, sonst Frage als Notiz «Pendenz».'
  nachweise:
  - Saldoliste Erfolgsrechnung VJ/aktuell (Erlösminderungen, Skonti, Debitorenverluste)
  rechnen: Umsatz U wie C1-207 (Erlöse aus L+L vor Erlösminderungen und Debitorenverlusten, exkl. MWST); Rabattquote = (Rabatte + Skonti) / U × 100; Verlustquote = Debitorenverluste
    / U × 100 (identisch C1-207); Differenz in Prozentpunkten zum VJ (gleiche Basis)
  feststellung_wenn: Quote verändert sich wesentlich ohne Erklärung (Hinweis auf nicht erfasste Erlösminderungen oder Abgrenzungsfehler); nur bei Bearbeitung auf Anweisung.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s076-1
    zitat: Vergleich des Verhältnisses von Rabatten und Debitorenverlusten zum Umsatz mit dem Vorjahr
  - quelle: hwp-bur-2023__rz-0118-s186
    zitat: Für zu erwartende Erlösminderungen wie Rabatte, Preisnachlässe, von der Rechnung absetzbare Umsatzprämien oder Skonto und ähnliche Abzüge sind Wertberichtigungen zu bilden
- id: C1-301
  vorgehen: Total der Debitoren-OP-Liste rechnerisch nachaddieren und mit dem Saldo des Sammelkontos Debitoren im Hauptbuch bzw. der Saldoliste per Stichtag abstimmen. Differenzen nach
    Ursache (Zeitdifferenz, nicht verbuchte Posten, Fehlbuchung) analysieren und mit Beträgen im Textfeld festhalten; ungeklärte Differenzen als Notiz «Pendenz».
  nachweise:
  - Debitoren-OP-Liste per 31.12.
  - Kontoblatt/Saldoliste Debitoren
  - Erklärung der Differenzen
  rechnen: 'Σ OP-Liste (nachaddiert) = ausgewiesenes OP-Total = Saldo Konto Debitoren (HB) 31.12.; Differenz = HB − OP-Liste Immer mit `rechne`, auch wenn die Werte ähnlich aussehen:
    `rechne "op = <Total OP-Liste>; hb = <Saldo Debitoren Saldoliste>; hb - op"`.'
  feststellung_wenn: Differenz ≠ 0 und nicht nachvollziehbar erklärt, oder Nachaddition weicht vom ausgewiesenen OP-Total ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-2
    zitat: Abstimmung des Totals der Debitoren-OP-Liste mit dem Hauptbuch
  - quelle: hwp-bur-2023__rz-0114-s185-t2
    zitat: Dieses muss periodisch mit den Salden der Hilfsbuchhaltung(en) abgestimmt werden.
  - quelle: hwp-er-2026__rz-0266-s244
    zitat: IT-gestützte Auswertungen werden abgestimmt mit Werten aus der Finanzbuchhaltung oder den Nebenbüchern und auf die rechnerische Richtigkeit hin geprüft
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Fehlende Unterlagen, ungeklärte Sachverhalte, nicht verfügbare Belege mit Konto, Datum und Betrag
  notiz: Jede Differenz ≠ 0 im Textfeld (OP-Total, HB, Differenz, Datum OP-Liste). Ungeklärt und ≥ Nichtaufgriffsgrenze → «Wesentliche Feststellungen» (Korrekturvorschlag erst mit Ursache,
    keine Verbuchung); < NAG nur protokollieren; Ursache unbekannt → zusätzlich «Pendenz» (Konto, Datum, Betrag).
- id: C1-302
  vorgehen: 'Delkredereberechnung nachvollziehen: zuerst Einzel-WB gefährdeter Posten (Konkurs, Betreibung, Bestreitung, stark überfällig), dann Pauschal-WB auf dem Rest. Einzel-WB für
    die Posten aus C1-310 (Vorauswahl C1-101/C1-202) und für die in neuer Rechnung gutgeschriebenen/ausgebuchten Posten mit Ursache am Stichtag (C1-309); Methode aus C1-104 und Verlustquote
    aus C1-207 für die Pauschal-WB (WP-Schritte 208/304 nur, wenn auf Anweisung vorbereitet); Soll-Delkredere herleiten, mit Buchwert vergleichen, Überschuss als stille Reserve an C1-303.
    Unterdeckung als Notiz «Wesentliche Feststellungen».'
  nachweise:
  - Delkredereberechnung des Kunden
  - Altersgliederung
  - Aktennotizen/Korrespondenz zu Problemdebitoren
  - Zahlungseingänge neue Rechnung (C1-309)
  - Debitorenverluste Vorjahre
  rechnen: 'Soll-Delkredere = Σ Einzel-WB (je Posten aus C1-310/C1-309, nur ungedeckter bzw. unversicherter Teil) + Pauschal-WB auf dem Rest. Rest = OP-Total − einzelwertberichtigte
    Posten. (a) Betriebswirtschaftlich: Satz gemäss Methode des Kunden (C1-104), plausibilisiert mit Erfahrungswerten (Verlustquote C1-207) × Rest. (b) Nur Steuerpraxis, keine handelsrechtliche
    Regel: 5 % × Rest Inland + 10 % × Rest Ausland, je ohne Forderungen gegen öffentlich-rechtliche Körperschaften und voll gedeckte Forderungen. Differenz = gebuchtes Delkredere − Soll
    (a). Negativ → mögliche Überbewertung (Notiz «Wesentliche Feststellungen»), positiv → stille Reserve (C1-303). Alles mit `rechne`.'
  feststellung_wenn: Gebuchtes Delkredere unter dem Soll (Überbewertung) oder Einzelrisiken nicht wertberichtigt; mögliche Berichtsfolge beurteilt der WP. Betrag über dem Soll als stille
    Reserve dokumentieren.
  fundstellen:
  - quelle: ser-2022__anh-d-s075-2
    zitat: Beurteilung der Angemessenheit der Wertberichtigungen aufgrund der Erfahrungen in den Vorjahren, der Altersstruktur und der Ergebnisse der Befragungen
  - quelle: hwp-bur-2023__rz-0120-s186
    zitat: Für zweifelhafte Forderungen und für das allgemeine Kreditrisiko ist ein angemessenes Delkredere zu bilden
  - quelle: hwp-bur-2023__rz-0437-s248
    zitat: für die nach Vornahme von Wertberichtigungen für erkennbare Einzelrisiken verbleibenden Risiken von Forderungsausfällen
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Betriebswirtschaftliche Herleitung oder steuerlich akzeptierte ESTV-Pauschale?
  - quelle: hwp-bur-2023__rz-0669-s296
    zitat: Durch Abschreibungen, Rückstellungen und Wertberichtigungen, die über das betriebs wirtschaftliche Mass hinaus vorgenommen werden, entstehen in den entsprechenden Bilanzpositionen
      stille Reserven.
  - quelle: hwp-er-2026__rz-0412-s277
    zitat: Es liegt im Ermessen des Abschlussprüfers, zu entscheiden, ob das Gesamtbild der Jahresrechnung grundlegend verändert wird oder nicht.
  - quelle: konzept-ki-revisionsagent-2026__c013-1
    zitat: 104 Wertberichtigungen, 202 Altersstruktur (EP), 207 Kennzahlen, 208 Verluste und Rabatte (WP), 304 Zahlungen nach Stichtag (WP), 309, 310, 303 und 321 stille Reserven
  - quelle: hwp-bur-2023__rz-0437-s248
    zitat: eine pau schale Wertberichtigung von 5 % und auf ausländischen von 10 % zu
  - quelle: hwp-bur-2023__rz-0437-s248
    zitat: ausgenommen Forderungen gegen öffentlich-rechtliche Körperschaften und Forderungen mit voller Deckung
  - quelle: hwp-bur-2023__rz-0438-s248
    zitat: Sofern eine Exportrisikoversicherung oder eine Kreditversicherung besteht, hat das Delkredere nur den unversicherten Teil betrag zu decken.
  - quelle: or__art-960a
    zitat: Sie sind direkt oder indirekt bei den betreffenden Aktiven zulasten der Erfolgsrechnung abzusetzen und dürfen nicht unter den Passiven ausgewiesen werden.
  - quelle: hwp-bur-2023__rz-0750-s317-t2
    zitat: Wertberichtigungen auf Forderungen für latente Ausfallrisiken (pauschales Delkredere, Einzelwertberichtigungen) können von den Erlösen aus Lieferungen und Leistungen in Abzug
      gebracht werden
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  notiz: 'Unterdeckung ≥ Nichtaufgriffsgrenze → «Wesentliche Feststellungen» mit Buchungsvorschlag «Debitorenverluste bzw. Veränderung Delkredere (Erlösminderung/Aufwand) an Delkredere
    (Wertberichtigung, aktivseitig von den Forderungen abgesetzt)», Betrag = Soll − gebucht; uneinbringliche Forderung: «Debitorenverluste an Debitoren» (MWST-Korrektur Art. 41 MWSTG
    getrennt); keine Verbuchung. < NAG nur protokollieren. Überdeckung → stille Reserve (C1-303), keine Feststellung.'
- id: C1-303
  vorgehen: 'Aufstellung der stillen Reserven in M-Files suchen bzw. aus C1-302 den Teil des Delkredere über dem betriebswirtschaftlich notwendigen Wert ermitteln. Bestand Stichtag und
    VJ sowie Bildung/Auflösung tabellarisch erfassen; fehlt die Aufstellung, Notiz «Pendenz» und PBC-Vorschlag (10.10). Umgang mit stillen Reserven ist offener Entscheid (consis): Vorgabe
    WP anwenden.'
  nachweise:
  - Aufstellung stille Reserven VJ/aktuell
  - Delkredereberechnung (C1-302)
  rechnen: Stille Reserve = gebuchtes Delkredere − betriebswirtschaftlich notwendiges Delkredere; Veränderung = Bestand aktuell − Bestand VJ
  feststellung_wenn: Keine Aufstellung vorhanden oder Bestand/Veränderung nicht mit dem Detailnachweis abstimmbar.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
  - quelle: hwp-bur-2023__rz-0669-s296
    zitat: Durch Abschreibungen, Rückstellungen und Wertberichtigungen, die über das betriebs wirtschaftliche Mass hinaus vorgenommen werden, entstehen in den entsprechenden Bilanzpositionen
      stille Reserven.
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Umgang mit stillen Reserven (C1-303, C1-321)?
- id: C1-304
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: OP-Liste
    per Stichtag mit OP-Liste im Prüfungszeitpunkt bzw. Zahlungseingängen der neuen Rechnung abgleichen; je Posten bezahlt (Datum, Betrag), gutgeschrieben/ausgebucht oder offen festhalten;
    offene alte Posten an C1-302/C1-310.'
  nachweise:
  - OP-Liste im Prüfungszeitpunkt
  - Kontoblatt Debitoren neue Rechnung
  - Bankauszüge Folgeperiode
  rechnen: Anteil nachträglich bezahlt = Σ bezahlte Stichtagsposten / OP-Total; Rest offen = OP-Total − bezahlt − gutgeschrieben/ausgebucht
  feststellung_wenn: Wesentliche Stichtagsposten im Prüfungszeitpunkt weder bezahlt noch erklärt oder nur durch Gutschrift/Ausbuchung erledigt (nur bei Bearbeitung auf Anweisung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s076-1
    zitat: Durchsicht der OP-Liste im Prüfungszeitpunkt und/oder Zahlungen in neuer Rechnung
  - quelle: hwp-er-2026__rz-0397-s273
    zitat: Durchsicht noch offener Debitoren im Prüfungszeitpunkt
- id: C1-305
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: Kontoblätter
    Debitoren, Erlöse, Warenretouren, Erlösminderungen auf ungewöhnliche Posten durchsehen (atypisches Gegenkonto, runde Beträge, manuelle/Stichtagsbuchungen, Nicht-L+L wie Darlehen);
    ausgewählte Posten mit Beleg prüfen, Auswahl begründen.'
  nachweise:
  - Kontoblätter Debitoren/Erlöse/Erlösminderungen
  - Belege zu ausgewählten Posten
  rechnen: ''
  feststellung_wenn: Buchung ohne Beleg, in falscher Periode, auf falschem Konto (z. B. Nicht-L+L im Debitorenkonto) oder Gegenbuchung im Erlös nicht sachgerecht (nur bei Bearbeitung
    auf Anweisung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s075-2
    zitat: Durchsicht von Debitoren-, Erlös-, Warenretouren- und Erlösminderungskonten im Hauptbuch auf ungewöhnliche Posten; Belegprüfung solcher Posten
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- id: C1-306
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: Erlös-
    und Erlösminderungskonten der neuen Rechnung auf Gutschriften, Storni, Ausbuchungen mit Bezug zum Vorjahr durchsehen und prüfen, ob im Abschluss Wertberichtigung, Abgrenzung oder
    Erlösminderung erfasst ist.'
  nachweise:
  - Kontoblätter Erlöse/Erlösminderungen neue Rechnung
  - Gutschriftsbelege
  rechnen: Σ Gutschriften/Storni neue Rechnung mit Bezug Vorjahr − im Abschluss berücksichtigte Beträge
  feststellung_wenn: Wesentliche Vorjahresbeträge in neuer Rechnung ohne Abgrenzung oder Wertberichtigung im Abschluss (nur bei Bearbeitung auf Anweisung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s075-2
    zitat: Durchsicht der Erlös- und Erlösminderungskonten in neuer Rechnung auf auffällige Beträge, die das Vorjahr betreffen
  - quelle: hwp-bur-2023__rz-0119-s186
    zitat: Umsatzrückvergütungen, die nicht direkt von der Rechnung abgezogen werden, sind ab zugrenzen
- id: C1-307
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: für
    wesentliche/risikobehaftete Posten Faktura, Lieferschein/Abnahmeprotokoll, Vertrag oder Zahlungseingang in neuer Rechnung einsehen. Fehlen Leistungs- und Zahlungsnachweis: Notiz
    «Pendenz» und Hinweis an WP (keine Debitorenbestätigungen in der SER).'
  nachweise:
  - Debitorenrechnungen
  - Lieferscheine/Abnahmeprotokolle
  - Werkverträge/Aufträge
  - Zahlungseingänge neue Rechnung
  rechnen: ''
  feststellung_wenn: Für wesentlichen Posten fehlen Leistungsnachweis und Zahlungseingang, oder die Leistung wurde erst nach dem Stichtag erbracht (nur bei Bearbeitung auf Anweisung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s075-2
    zitat: Durchsicht von Versandpapieren, Zahlungen in neuer Rechnung und Verträgen zur Feststellung des Vorhandenseins von Forderungen
  - quelle: hwp-er-2026__rz-0139-s204-t1
    zitat: Dem Prüfungsrisiko kann indessen mit anderen Prüfungshandlungen begegnet werden, namentlich mit der Durchsicht von Versandpapieren oder Nachweisen von Zahlungseingängen im
      neuen Jahr.
- id: C1-308
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten; ohne Anweisung Status «nicht bearbeitet – WP-Schritt», Hinweise für den WP als Notiz. Mit Anweisung: Konto
    Debitorenverluste (bzw. Ausbuchungen über Erlösminderungen/Delkredere) durchsehen; für wesentliche Ausbuchungen Beleg, Begründung und Genehmigung gemäss Kompetenzregelung einsehen;
    fehlende Genehmigungen als Notiz «Pendenz».'
  nachweise:
  - Kontoblatt Debitorenverluste
  - Ausbuchungsbelege mit Visum
  - Kompetenzregelung
  rechnen: Σ Ausbuchungen gemäss Belegen = Saldo Debitorenverluste (abzüglich Eingänge früher abgeschriebener Forderungen)
  feststellung_wenn: Wesentliche Ausbuchung ohne Begründung oder ohne Genehmigung der zuständigen Stelle (nur bei Bearbeitung auf Anweisung).
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__anh-d-s076-1
    zitat: Durchsicht des Kontos Debitorenverluste und Feststellung der korrekten Autorisierung von Ausbuchungen
  - quelle: hwp-er-2026__rz-0118-s201
    zitat: Feststellung korrekter Autorisierung von Ausbuchungen von Debitorenverlusten
- id: C1-309
  vorgehen: Die seit dem Bilanzstichtag eingegangenen Zahlungen auf die Stichtagsposten aus Kontoblatt Debitoren bzw. Bankauszügen der neuen Rechnung festhalten (Posten, OP 31.12., bezahlt,
    Datum, offen). Posten, die nicht durch Zahlung, sondern durch Gutschrift, Storno oder Ausbuchung erledigt wurden, separat auflisten (Beleg, Datum, Betrag, Grund). Bestand die Ursache
    bereits am Stichtag (z. B. Mängelrüge, bestrittene Leistung), Einzel-WB bzw. Erlösminderung per Stichtag als Vorschlag an C1-302 und Notiz für den WP; bei Gutschrift/Erlösminderung
    Buchungsvorschlag mit getrenntem MWST-Anteil (Art. 41 MWSTG). C1-106/C1-306 sind WP-Schritte und werden nicht selbst bearbeitet. Nicht zuordenbare Sammelbuchungen als Notiz «Pendenz».
    Ergebnis an C1-302/C1-310.
  nachweise:
  - OP-Liste per Stichtag
  - Kontoblatt Debitoren neue Rechnung
  - Bankauszüge Folgeperiode
  - Gutschrifts-/Ausbuchungsbelege neue Rechnung
  rechnen: 'Je Posten: offen = OP 31.12. − Zahlungen − Gutschriften neue Rechnung; Σ Zahlungen / OP-Total in %'
  feststellung_wenn: Sammelbuchungen nicht auf Einzelposten zuordenbar; wesentliche Posten ohne Zahlungseingang; oder Stichtagsposten in neuer Rechnung gutgeschrieben/ausgebucht, Ursache
    vor dem Stichtag, ohne Wertberichtigung/Erlösminderung im Abschluss.
  fundstellen:
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege, Abstimmung mit Auszügen, Durchsicht von Belegen in neuer Rechnung usw.
  - quelle: hwp-bur-2023__rz-0861-s353
    zitat: Besteht die Ursache für ein Ereignis bereits am Bilanzstichtag, so ist das Ereignis in der Jahresrechnung des abgelaufenen Geschäftsjahres buchungspflichtig
  - quelle: hwp-er-2026__rz-0317-s254
    zitat: Ereignisse, die Nachweise für Umstände bzw. Sachverhalte liefern, die bereits am Bilanzstichtag vorlagen (berücksichtigungspflichtige Ereignisse)
  - quelle: hwp-er-2026__rz-0397-s273
    zitat: Durchsicht noch offener Debitoren im Prüfungszeitpunkt
  - quelle: mwstg__art-41
    zitat: so ist im Zeitpunkt, in dem die Korrektur verbucht oder das korrigierte Entgelt vereinnahmt wird, eine Anpassung der Umsatzsteuerschuld vorzunehmen
- id: C1-310
  vorgehen: 'Die im Prüfungszeitpunkt noch offenen, überfälligen Guthaben einzeln beurteilen: Mahnstand, Betreibung/Konkurs, Bestreitung, Zahlungsvereinbarung, Sicherheiten. Je Posten
    einen Bewertungsvorschlag (werthaltig, Einzel-WB, Ausbuchung) dokumentieren, Korrekturbedarf als Notiz «Wesentliche Feststellungen» mit begründetem Buchungsvorschlag (keine Verbuchung;
    bei Ausbuchung MWST-Anteil getrennt, Art. 41 MWSTG) und an C1-302 übergeben. Je Debitor Hinweise aus anderen Unterlagen übernehmen: VJ-Akte (nicht gebuchte Wertberichtigungen, «im
    Folgejahr neu beurteilen»), Aktennotizen zu Rechtsfällen/Mängelrügen (Rückstellungen O1/M3), Korrespondenz, Zahlungseingänge des Folgejahres (C1-309); jeden Hinweis neu beurteilen
    und das Ergebnis im Textfeld festhalten.'
  nachweise:
  - OP-Liste im Prüfungszeitpunkt
  - Mahn- und Betreibungsunterlagen
  - Aktennotizen zu Problemdebitoren
  - Konkursmitteilungen
  rechnen: ''
  feststellung_wenn: Überfällige Posten mit Konkurs, erfolgloser Betreibung oder Bestreitung ohne ausreichende Wertberichtigung bzw. Ausbuchung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0121-s187
    zitat: Verjährte oder aufgrund von Konkursen uneinbringliche Forderungen sind nicht bilan zierungsfähig und daher auszubuchen.
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
  - quelle: mwstg__art-41
    zitat: so ist im Zeitpunkt, in dem die Korrektur verbucht oder das korrigierte Entgelt vereinnahmt wird, eine Anpassung der Umsatzsteuerschuld vorzunehmen
  - quelle: hwp-er-2026__rz-0011-s180
    zitat: die Ergebnisse aus den vorhergehenden eingeschränkten Revisionen
- id: C1-311
  vorgehen: 'Grossdebitoren (über Toleranzwesentlichkeit bzw. Top-Positionen aus C1-206) einzeln bewerten: Bonität, Zahlungsverhalten, Sicherheiten, Kreditversicherung. Kurzfristige
    FW-Debitoren zum Stichtagskurs nachrechnen (Kursdifferenzen können als realisiert gelten); Niederstwertprinzip v. a. bei langfristigen FW-Forderungen beachten. Ergebnis an C1-302.'
  nachweise:
  - OP-Liste
  - Bonitätsinformationen/Korrespondenz
  - Kreditversicherungspolice/Sicherheiten
  - Kursliste 31.12.
