- id: C1-312
  vorgehen: 'Akonto-, Voraus- und Anzahlungsrechnungen in OP-Liste und Kontoblatt identifizieren und mit Projektliste und Konto erhaltene Anzahlungen abstimmen. Prüfen: Teilfakturen
    für erbrachte Leistungen als Forderung, Anzahlungsrechnungen ohne erbrachte Leistung erst bei Zahlung (als erhaltene Anzahlung im Fremdkapital). Korrekturbedarf als Notiz «Wesentliche
