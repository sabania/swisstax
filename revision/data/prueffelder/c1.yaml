bewertung:
- regel: 'Delkredere: zuerst Einzelwertberichtigungen gefährdeter Forderungen, danach Pauschalwertberichtigung auf dem Rest.'
  quelle: hwp-bur-2023__rz-0120-s186
  zitat: Die Wertberichtigungen für gefährdete Forderungen sind zunächst einzeln zu ermitteln; danach sind Pauschalwertberichtigungen auf den restlichen Guthaben zu bilden.
- regel: 'Nur Steuerpraxis, keine handelsrechtliche Bewertungsregel: Die ESTV-Pauschale deckt nur das allgemeine Kreditrisiko, d. h. die nach Einzelwertberichtigungen verbleibenden Ausfallrisiken;
    sie ersetzt keine Einzelwertberichtigung.'
  quelle: hwp-bur-2023__rz-0437-s248
  zitat: für die nach Vornahme von Wertberichtigungen für erkennbare Einzelrisiken verbleibenden Risiken von Forderungsausfällen
- regel: Konkurs/Zahlungsunfähigkeit eines Schuldners nach dem Stichtag erfordert eine Wertberichtigung im abzuschliessenden Jahr.
  quelle: hwp-bur-2023__rz-0864-s354
  zitat: wird seine oder ihre Zahlungsunfähigkeit bekannt, muss für die Forderungen eine Wertberichtigung gebildet werden.
- regel: 'SER: Monetäre Aktiven zum Nominalwert abzüglich angemessener Wertberichtigungen (Delkredere).'
  quelle: ser-2022__4-3-5
  zitat: Bei der Bewertung der monetären Aktiven kann von einem Nominalwert, allenfalls abzüglich angemessener Wertberichtigungen (z. B. Delkredere) ausgegangen werden.
- regel: Forderungen aus L+L umfassen Ansprüche aus erbrachten und fakturierten betriebstypischen Lieferungen und Leistungen.
  quelle: hwp-bur-2023__rz-0108-s185
  zitat: Zu Forderungen aus Lieferungen und Leistungen gehören alle Ansprüche gegenüber Dritten aus Lieferungen und Leistungen, die erbracht und fakturiert worden sind.
- regel: Erfassung im Zeitpunkt der Rechnungstellung, sofern das Geschäft so weit abgewickelt ist, dass ein Anspruch auf Gegenleistung besteht.
  quelle: hwp-bur-2023__rz-0114-s185-t1
  zitat: Forderungen werden im Zeitpunkt der Rechnungstellung erfasst.
- regel: Bei Handelswaren Umsatzerfassung mit Übergang von Nutzen und Gefahr.
  quelle: hwp-bur-2023__rz-0746-s315
  zitat: Bei Warenlieferungen von Handelswaren erfolgt die Umsatzerfassung mit dem Über gang von Nutzen und Gefahr
- regel: 'Lieferungen mit Rückgaberecht: Realisation erst bei Bezahlung bzw. Ablauf der Rückgabefrist; bis dahin keine Forderung, Ware bleibt in den Vorräten.'
  quelle: hwp-bur-2023__rz-0746-s315
  zitat: Bis zu diesem Zeitpunkt be gründet die ausgelieferte Ware noch keine Forderung und ist demnach unter den Vor räten zu bilanzieren.
- regel: Teilfakturen für erbrachte Leistungen sind Forderungen; Anzahlungsrechnungen ohne erbrachte Leistung werden erst bei Zahlung (als erhaltene Anzahlung, Fremdkapital) erfasst.
  quelle: hwp-bur-2023__rz-0109-s185
  zitat: Teilfakturen an Kunden für erbrachte Lieferungen und Leistungen werden ebenfalls unter den Forderungen aus Lieferungen und Leistungen aktiviert.
- regel: Bewertung grundsätzlich zum Nominalwert.
  quelle: hwp-bur-2023__rz-0117-s186
  zitat: Forderungen aus Lieferungen und Leistungen sind im Normalfall mit ihrem Nominal betrag in die Bilanz einzusetzen.
- regel: 'Ausnahme: Bei einer Vielzahl geringer Forderungsbeträge darf direkt pauschal wertberichtigt werden.'
  quelle: hwp-bur-2023__rz-0120-s186
  zitat: Bei einer Vielzahl geringer Forderungsbeträge kann auch direkt eine Methode der Pauschalwertberichtigung angewandt werden.
- regel: Für die Pauschalwertberichtigung sind Gruppen (z. B. Inlandforderungen) und Modelle für erwartete Verluste (expected credit losses) zulässig.
  quelle: hwp-bur-2023__rz-0120-s186
  zitat: Ebenfalls zulässig ist die Anwendung von Modellen zur Bestimmung von erwar teten Verlusten (expected credit losses)
- regel: Pauschalwertberichtigung aufgrund Erfahrungswerten und erwarteter Entwicklung quantifizieren.
  quelle: hwp-bur-2023__rz-0120-s186
  zitat: Die pauschale Wertberichtigung ist aufgrund von Erfahrungen aus der Vergangenheit und unter Berücksichtigung der erwarteten Entwicklung zu quantifizieren.
- regel: 'Nur Steuerpraxis, keine handelsrechtliche Bewertungsregel: Steuerliche Pauschale ESTV gemäss HWP BuR (Stand 2023, nicht für Steuerjahr bestätigt): 5 % auf inländischen, 10
    % auf ausländischen Guthaben, ausgenommen Forderungen gegen öffentlich-rechtliche Körperschaften und voll gedeckte Forderungen; Kantone teils abweichend.'
  quelle: hwp-bur-2023__rz-0437-s248
  zitat: eine pau schale Wertberichtigung von 5 % und auf ausländischen von 10 % zu
- regel: Sicherheiten und Kreditversicherung reduzieren das Delkredere auf den ungedeckten Teil.
  quelle: hwp-bur-2023__rz-0438-s248
  zitat: Sofern eine Exportrisikoversicherung oder eine Kreditversicherung besteht, hat das Delkredere nur den unversicherten Teil betrag zu decken.
- regel: Uneinbringliche (Konkurs) und verjährte Forderungen sind auszubuchen.
  quelle: hwp-bur-2023__rz-0121-s187
  zitat: Verjährte oder aufgrund von Konkursen uneinbringliche Forderungen sind nicht bilan zierungsfähig und daher auszubuchen.
- regel: Erwartete Erlösminderungen (Rabatte, Skonto, Umsatzprämien) als Wertberichtigung; nicht von der Rechnung abgezogene Umsatzrückvergütungen abgrenzen.
  quelle: hwp-bur-2023__rz-0119-s186
  zitat: Umsatzrückvergütungen, die nicht direkt von der Rechnung abgezogen werden, sind ab zugrenzen
- regel: 'Gutschriften, Rabatte und Ausbuchungen (Korrektur des Entgelts): Anpassung der Umsatzsteuerschuld im Zeitpunkt, in dem die Korrektur verbucht oder das korrigierte Entgelt vereinnahmt
    wird; im Buchungsvorschlag MWST-Anteil getrennt ausweisen. Eine blosse Wertberichtigung (Delkredere) ändert die MWST nicht (Praxis/intern). MWST-Folgen Prüffeld M2.'
  quelle: mwstg__art-41
  zitat: so ist im Zeitpunkt, in dem die Korrektur verbucht oder das korrigierte Entgelt vereinnahmt wird, eine Anpassung der Umsatzsteuerschuld vorzunehmen
- regel: Delkredere ist Korrekturposten auf der Aktivseite, keine Rückstellung; Ausweis unter den Passiven unzulässig.
  quelle: hwp-bur-2023__rz-0440-s248
  zitat: Ein Ausweis unter den Passiven ist nicht zu lässig (Art. 960a Abs. 3 OR).
- regel: Nicht aufgelöste, nicht mehr begründete Wertberichtigungen bilden stille Reserven (Wahlrecht, kein Wertaufholungsgebot).
  quelle: hwp-bur-2023__rz-0440-s248
  zitat: Wird die Wertaufholung nicht gebucht, entsteht eine stille Reserve (Art. 960a Abs. 4 OR).
- regel: Kurzfristige Fremdwährungsforderungen werden zum Stichtagskurs bewertet; Kursgewinne oder -verluste können als realisiert betrachtet werden, wenn die Laufzeit bei Ersterfassung
    unter zwölf Monaten lag (Wahlrecht).
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Gewinne oder Verluste können als realisiert betrachtet werden, wenn diese Positionen bei ihrer Ersterfassung eine Lauf zeit von weniger als zwölf Monaten aufwiesen.
- regel: 'Langfristige Fremdwährungsforderungen: Niederstwertprinzip; nicht realisierte Kursverluste erfassen, nicht realisierte Kursgewinne nicht ausweisen.'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: Bei den lang fristigen Guthaben und Verpflichtungen ist besonders auf das Niederstwertprinzip zu achten
- regel: Habensalden der Debitoren als übrige kurzfristige Verbindlichkeiten ausweisen.
  quelle: hwp-bur-2023__rz-0155-s192
  zitat: Habensalden aus den Forderungen aus Lieferungen und Leis tungen als übrige kurzfristige Verbindlichkeiten auszuweisen
- regel: Verrechnung von Forderungen mit Verbindlichkeiten nur, wenn die rechtlichen Voraussetzungen erfüllt sind (u. a. Gegenseitigkeit, Art. 120 Abs. 1 OR); dann kein Verstoss gegen
    das Verrechnungsverbot.
  quelle: hwp-bur-2023__rz-0125-s187
  zitat: Unter bestimmten Voraussetzungen können Forderungen und Verbindlichkeiten ver rechnet werden, ohne dass dadurch das Verrechnungsverbot verletzt wird
- regel: Langfristige Forderungen aus L+L gehören unter die Finanzanlagen.
  quelle: hwp-bur-2023__rz-0123-s187
  zitat: müssen gesondert unter den Finanzanlagen bilanziert werden
- regel: Als Sicherheit abgetretene Forderungen (Zessionskredit) bleiben bilanziert und sind im Anhang offenzulegen.
  quelle: hwp-bur-2023__rz-0112-s185
  zitat: Als Sicherheit abgetretene Forderungen bleiben weiterhin beim Zedenten oder der Ze dentin bilanzierungspflichtig.
- regel: 'Abgrenzung: Beim Zessionskredit werden Forderungen nur zur Sicherung abgetreten; beim Factoring übernimmt der Factor sie tatsächlich.'
  quelle: hwp-bur-2023__rz-0137-s189
  zitat: Beim Zessionskredit werden die Forderungen nur zur Sicherung eines Kredits abge treten
- regel: 'Echtes Factoring (Factor übernimmt das Delkredererisiko): abgetretene Forderungen werden ausgebucht.'
  quelle: hwp-bur-2023__rz-0141-s190
  zitat: Die Übernahme des Delkredererisikos durch den Factor gestattet dem Factoring-Kun den, die abgetretenen Kundenforderungen auszubuchen
- regel: Regressrisiken aus zedierten Forderungen mit Rückstellungen berücksichtigen.
  quelle: hwp-bur-2023__rz-0122-s187
  zitat: Allfälligen Regressrisiken aus zedierten Forderungen oder aus weitergegebenen Wech seln und Checks ist mit Rückstellungen Rechnung zu tragen.
- regel: Konsignationsware ist Vorrat, keine Forderung.
  quelle: hwp-bur-2023__rz-0213-s207
  zitat: In Kommission gegebene Waren (Konsignationsware) sind separat unter Vorräten, nicht als Forderungen auszuweisen.
- regel: Fakturierte, noch nicht ausgelieferte Ware (Bill-and-hold) ist nur dann Forderung, wenn die Lieferung am Bilanzstichtag fertiggestellt ist und der Kunde Nutzen und Gefahr trägt
    (schriftliche Bestätigung empfohlen).
  quelle: hwp-bur-2023__rz-0234-s209
  zitat: Die fakturierte Lieferung oder Leistung muss am Bilanzstichtag (allenfalls einschliesslich Montage, sofern diese nicht separat fakturiert wird) fertiggestellt
- regel: 'Bill-and-hold: noch zu erwartende Kosten, Risiken und nicht realisierte Margenanteile mit Rückstellung bzw. Wertberichtigung berücksichtigen.'
  quelle: hwp-bur-2023__rz-0234-s209
  zitat: ist den noch zu erwartenden Kosten, allfälligen Risiken und den noch nicht reali sierten Margenanteilen durch angemessene Rückstellungen oder Wertberichtigungen
- regel: 'Bill-and-hold: bereits als Forderung gebuchte Ware nicht zusätzlich als Vorrat bilanzieren.'
  quelle: hwp-bur-2023__rz-0234-s209
  zitat: Sofern diese Ware bereits als Forderung gebucht ist, darf sie nicht zusätzlich in der Position Vorräte bilan ziert werden.
fallstricke:
- text: 'Rolle des Agenten bei Befragungen (1xx): nicht selbst befragen, keinen Kunden kontaktieren; vorhandene schriftliche Antworten (10.11, Vollständigkeitserklärung, Protokolle)
    auswerten, sonst Frage als Notiz «Pendenz» (Versand/Besprechung durch WP); Status höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- text: 'Kein Kundenversand: Der Dienstbenutzer des Agenten hat kein Recht für Visum, Abschlussstatus, Freigabe und Kundenversand – Fragen und PBC-Vorschläge gehen über den WP.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- text: 'WP-Schritte (C1-106, 208, 304–308): Ob der Agent sie vorbereitet, ist offen – bis zum Entscheid nur auf ausdrückliche Anweisung des WP; ohne Anweisung Status «nicht bearbeitet
    – WP-Schritt», Hinweise für den WP als Notiz.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: Das Pflichtenheft-Beispiel «C1 Delkredere» nennt die WP-Schritte 208 und 304 als zugehörig; trotzdem nur auf Anweisung bearbeiten. Ohne Anweisung Zahlungen nach dem Stichtag
    über C1-309 und Verlustquote über C1-207 in C1-302 einbeziehen.
  quelle: konzept-ki-revisionsagent-2026__c013-1
  zitat: 208 Verluste und Rabatte (WP), 304 Zahlungen nach Stichtag (WP)
- text: Sonstige Prüfungshandlungen (C1-401 bis C1-408) nur auf Anweisung des WP; ohne Anweisung Status «nicht bearbeitet – nur auf Anweisung», Hinweise als Notiz.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: Mögliche Fehler und Korrekturen nur als Notiz «Wesentliche Feststellungen» mit begründetem Buchungsvorschlag – nie selbst buchen.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- text: Debitorenbestätigungen (Saldobestätigungen) sind in der eingeschränkten Revision nicht vorgesehen – der Agent fordert keine an; Vorhandensein über Versandpapiere/Zahlungseingänge
    belegen.
  quelle: hwp-er-2026__rz-0262-s085
  zitat: verlangt die eingeschränkte Revision von der Revisionsstelle weder das Einholen von Debitoren- und Kreditorenbestätigungen
- text: Liegen für einen wesentlichen Posten weder Versandpapiere noch Zahlungseingang vor, ist das Risiko kaum reduzierbar – Hinweis an den WP (mögliche Einschränkung), nicht selbst
    beurteilen.
  quelle: hwp-er-2026__rz-0139-s204-t1
  zitat: Sind im Einzelfall weder Versandpapiere noch ein Nachweis des Zahlungseingangs im neuen Jahr vorhanden, kann der Abschlussprüfer das Prüfungsrisiko vermutlich nicht in genügendem
    Mass reduzieren.
- text: Liegt der Debitorenbestand über der Toleranzwesentlichkeit, genügen Befragungen allein nicht; Antworten mit Analytik/Detailprüfungen erhärten.
  quelle: hwp-er-2026__rz-0105-s198
  zitat: Da die Kundenforderungen grösser sind als die Toleranzwesentlichkeit, darf die Bilanzposition nicht nur mit Befragungen geprüft werden.
- text: Keine repräsentativen bzw. statistischen Stichproben ziehen; Auswahl bewusst (Grösse, Risiko, Auffälligkeit) und begründet.
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: 'OP-Liste und Altersgliederung sind IT-Auswertungen des Kunden: nicht unbesehen übernehmen, sondern mit Hauptbuch abstimmen und Klassierung stichprobenweise nachprüfen.'
  quelle: hwp-er-2026__rz-0266-s244
  zitat: ob Debitorenrechnungen in der richtigen Überfälligkeitskategorie angezeigt werden
- text: Darlehen an Aktionäre/Organe gehören nicht zu den Forderungen aus L+L (Ausweis übrige Forderungen bzw. gesondert). Forderungen mit Darlehenscharakter zählen für die Prüfung der
    Einlagenrückgewähr – Hinweis an das Eigenkapital-Prüffeld.
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Als Forderungen ihnen gegenüber gelten hierbei alle direkten (up stream) und indirekten (cross stream) Forderungen mit Darlehenscharakter.
- text: Stille Zession (z. B. Globalzession an eine Bank) ist aus OP-Liste und Kontoblättern nicht erkennbar – Abschnitt Sicherheiten der beim Unternehmen vorhandenen Bankbestätigungen
    durchsehen (Praxis/intern).
- text: Akonto-/Anzahlungsrechnungen für noch nicht erbrachte Leistungen (oft mit Rechnungsdatum im Folgejahr) nicht als Forderung/Ertrag akzeptieren.
  quelle: hwp-bur-2023__rz-0109-s185
  zitat: Solche Anzahlungen von Kunden werden erst bilanziert, wenn die Zahlung erfolgt ist
- text: 'Rückgaberecht: Eine Realisation vor Bezahlung bzw. Fristablauf ist nur vertretbar, wenn Retouren verlässlich geschätzt und am Stichtag abgegrenzt werden.'
  quelle: hwp-bur-2023__rz-0746-s315
  zitat: Eine Annahme des Realisationszeitpunkts vor Bezahlung bzw. Ablauf der Rückgabefrist erscheint indes vertretbar
- text: Habensalden in der OP-Liste werden mit dem OP-Total netto ausgewiesen – auf Verrechnungsverbot achten.
  quelle: hwp-bur-2023__rz-0125-s187
  zitat: ist grundsätzlich nicht zulässig; stattdessen sind solche Pos ten, sofern sie wesentlich sind, unter den übrigen kurzfristigen Verbindlichkeiten aus zuweisen
- text: Gutschriften und Ausbuchungen in neuer Rechnung können Umstände per Stichtag belegen (berücksichtigungspflichtig) – nicht nur als Folgejahresvorgang behandeln.
  quelle: hwp-er-2026__rz-0317-s254
  zitat: Ereignisse, die Nachweise für Umstände bzw. Sachverhalte liefern, die bereits am Bilanzstichtag vorlagen (berücksichtigungspflichtige Ereignisse)
- text: Die steuerliche Pauschale deckt nur das nach Einzelwertberichtigungen verbleibende allgemeine Kreditrisiko; sie ersetzt keine Einzelwertberichtigung gefährdeter Posten.
  quelle: hwp-bur-2023__rz-0437-s248
  zitat: für die nach Vornahme von Wertberichtigungen für erkennbare Einzelrisiken verbleibenden Risiken von Forderungsausfällen
- text: 'Praxishinweis: Häufig werden nur die steuerlich akzeptierten Pauschalen verwendet – Einzelrisiken trotzdem erheben (C1-101, C1-310).'
  quelle: ef-2026-08-buchungslogik__s002-1
  zitat: Aus diesem Grund werden diejenigen Pauschalen verwendet, welche die Steuerbehörden akzeptieren.
- text: Stille Reserven im Delkredere, deren Bildung steuerlich nicht klar akzeptiert ist, können bei der Beurteilung einer Rückerstattungspflicht aus Gewinnbeteiligung zu einer Abgrenzung
    führen – Hinweis an den WP, keine eigene Beurteilung.
  quelle: qa-or-rechnungslegung-2026__4-5
  zitat: Falls die Bildung steuerlich nicht klar akzeptiert ist, könnte daraus eine Rückerstattungspflicht mit entsprechender Abgrenzung in der Jahresrechnung resultieren.
- text: Analytische Vergleiche durch Bildung/Auflösung stiller Reserven verzerrt – Zahlen bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: dass in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden, und bereinigt die Zahlen entsprechend
- text: Mahnwesen und Genehmigung von Verkaufsbedingungen nur zur Kenntnis und Risikobeurteilung erheben – keine IKS-Prüfung in der SER.
  quelle: ser-2022__1-5
  zitat: keine Prüfung des internen Kontrollsystems und der verwendeten IT-Systeme durchgeführt
- text: 'Offene interne Entscheide (consis) zu C1: Delkredere betriebswirtschaftlich oder ESTV-Pauschale, Umgang mit stillen Reserven, Altersgrenze «alt». Bis zum Entscheid Vorgabe des
    WP anwenden. Fehlt sie: keine eigene Altersgrenze oder Methode festlegen, Pendenz erfassen und beide Delkredere-Varianten ausweisen (a betriebswirtschaftlich, b ESTV-Pauschale nur
    als Steuerpraxis).'
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Betriebswirtschaftliche Herleitung oder steuerlich akzeptierte ESTV-Pauschale?
- text: Weiter gehende Prüfungshandlungen (WP-Schritte) nur bei Anzeichen wesentlicher Fehlaussagen oder erhöhtem inhärentem Risiko.
  quelle: ser-2022__6-2-3
  zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn
- text: Betragsdifferenzen zwischen OP-Liste (Druckdatum nach Stichtag) und Saldoliste/Hauptbuch nicht wegrunden, sondern einzeln erklären lassen.
  quelle: hwp-bur-2023__rz-0114-s185-t2
  zitat: Dieses muss periodisch mit den Salden der Hilfsbuchhaltung(en) abgestimmt werden.
- text: 'Nachweise für C1 liegen oft in anderen Ordnern/Prüffeldern: Bankbestätigung und Kreditverträge (flüssige Mittel, Bankverbindlichkeiten) → Zession; Projektliste/Abnahmeprotokolle
    (nicht fakturierte Leistungen) → Ertragsrealisierung/Akonto; Aktennotizen zu Rechtsfällen (Rückstellungen) → bestrittene Forderungen. «Nicht vorhanden» erst nach akteweiter Suche
    (GJ und VJ), sonst «nicht gefunden in <Ordner>» und Pendenz.'
  quelle: konzept-ki-revisionsagent-2026__c005-1
  zitat: fehlende Daten dürfen nicht erfunden werden
  schritte:
  - C1-102
  - C1-310
  - C1-312
- text: Hinweise der Vorjahresprüfung je Debitor übernehmen (nicht gebuchte Wertberichtigungen, «im Folgejahr neu beurteilen», offengelegte Zession) und im GJ neu beurteilen – nie ungelesen
    «keine Feststellung».
  quelle: hwp-er-2026__rz-0011-s180
  zitat: die Ergebnisse aus den vorhergehenden eingeschränkten Revisionen
  schritte:
  - C1-102
  - C1-302
  - C1-310
fragen_kunde:
- frage: Welches sind die Gründe für die markierten alten, ungewöhnlich hohen Ausstände und Habensalden der OP-Liste, und wie beurteilen Sie deren Einbringlichkeit?
  zweck: C1-101, C1-202 (EX, VO, BE)
- frage: Sind Forderungen verpfändet, zediert (z. B. Globalzession an eine Bank, Factoring) oder einem Inkassobüro übergeben worden? Trägt beim Factoring der Factor das Delkredererisiko?
    Bitte Verträge beilegen.
  zweck: C1-102 (RV, DO), Anhangsangabe Art. 959c Abs. 2 Ziff. 9 OR, Ausbuchung bei echtem Factoring
- frage: Wie erklären Sie die wesentlichen Veränderungen der Debitoren, des Delkredere und der Erlöse gegenüber Vorjahr bzw. Budget?
  zweck: C1-103, C1-201, C1-205 (BE, PA)
- frage: Wie identifizieren Sie säumige Zahler (Mahnstufen, Betreibung, Konkursmeldungen), und nach welcher Methode und mit welchen Sätzen legen Sie Einzel- und Pauschalwertberichtigungen
    fest? Wurde die Methode gegenüber Vorjahr geändert?
  zweck: C1-104, C1-302, C1-408 (BE)
- frage: Wie stellen Sie sicher, dass Fakturen, Akonto-/Anzahlungsrechnungen und Gutschriften in der richtigen Periode erfasst werden (Fakturierung nach Lieferung/Abnahme, angefangene
    Arbeiten)?
  zweck: C1-105, C1-312 (EN, VO, PA)
- frage: 'Wurden Waren per Stichtag fakturiert, aber noch nicht ausgeliefert (Bill-and-hold), oder mit Rückgaberecht geliefert? Wenn ja: Lieferung fertiggestellt, Nutzen und Gefahr beim
    Kunden, Rückgabefristen?'
  zweck: C1-105, C1-403 (EX, PA, BE)
- frage: Wurden seit dem Bilanzstichtag wesentliche Forderungen ausgebucht, Gutschriften ausgestellt oder grosse Nachlässe gewährt, die Umsätze des Vorjahres betreffen?
  zweck: C1-106, C1-306, C1-404 (EN, VO, BE, PA)
- frage: Bestehen Forderungen gegenüber Aktionären, Organen, nahestehenden Personen oder Beteiligungsgesellschaften, und zu welchen Konditionen (Zins, Sicherheiten, Rückzahlung)?
  zweck: C1-204 (EX, VO, DO), Art. 959a Abs. 4 OR, Schnittstelle Einlagenrückgewähr
- frage: Bestehen Forderungen in Fremdwährung, und welche Kurse wurden per Stichtag angewandt?
  zweck: C1-203, C1-311 (BE)
- frage: Wurden Waren in Konsignation an Kunden gegeben, und sind dafür Fakturen erstellt worden?
  zweck: C1-403 (VO, BE)
- frage: Wer genehmigt Verkaufs- und Zahlungsbedingungen, Spezialkonditionen, Gutschriften und Ausbuchungen?
  zweck: C1-308, C1-407 (EN, RV)
- frage: Bestehen im Delkredere bewusst gebildete stille Reserven, und wie haben sich diese gegenüber Vorjahr verändert?
  zweck: C1-303, C1-321 (BE, DO)
- frage: Bestehen Kreditversicherungen oder Sicherheiten (Garantien, Eigentumsvorbehalt) für Debitoren?
  zweck: C1-311, C1-302 (BE)
