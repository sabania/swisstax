  bezug: 'Blatt «Erfolgsrechnung»: Ertragskonten 3200/3201/3205/3400, Erlösminderungen 3800/3802, Bestandesänderung 3900 sowie Waren-/Materialaufwand 42xx–43xx mit Vorjahr – SCH1-102,
    201, 202a/d, 304/305 (Kontenzuordnung)'
- datei: 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md
  bezug: Erfolgsrechnung (Block «Betrieblicher Ertrag», Finanz-, Liegenschafts-, betriebsfremder und a.o. Ertrag) und Anhang Ziff. 1 Grundsätze, Ziff. 3 a.o. Positionen, Ziff. 4a POC
    – SCH1-101, 304, 305
- datei: 00_Allgemein/Hauptbuch_2025_Kontoblaetter.md
