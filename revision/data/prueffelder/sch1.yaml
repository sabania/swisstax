schritte:
- id: SCH1-101
  vorgehen: 'Agent befragt nicht selbst: Frage zu den Grundsätzen der Umsatzerfassung (Zeitpunkt Lieferung/Abnahme/Fakturierung, Akonto-/Teilrechnungen, langfristige Aufträge, Erlösminderungen,
    MWST) und zum Cut-off von Umsatz und Waren-/Materialaufwand als Pendenz an den Kunden. Vorab Anhang (Grundsätze) und Vorjahresakte auswerten; schriftliche Antwort gegen JR und Kontoblätter
    plausibilisieren und im Textfeld mit Quelle festhalten.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung (Leitung Finanzen)
  - Anhang Ziff. Grundsätze der Rechnungslegung
  - Vorjahres-Arbeitspapiere SCH1
  rechnen: ''
  feststellung_wenn: Praxis widerspricht dem Realisationsprinzip (z.B. Umsatz bei Fakturierung vor Leistung, Akontorechnungen als Ertrag), Cut-off nicht geregelt oder Antwort fehlt (Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Befragung über die Grundsätze und zeitliche Abgrenzung bei der Verbuchung von Umsätzen und Waren-/Materialaufwand
  - quelle: hwp-bur-2023__rz-0745-s315
    zitat: Umsatz kann dann als realisiert betrachtet und somit erfasst werden, wenn die dem Vertrag zugrunde liegende Leistungsverpflichtung
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
- id: SCH1-102
  vorgehen: Agent erstellt aus der Saldoliste eine Liste der Ertrags- und Erlösminderungskonten mit Abweichung zum Vorjahr (bzw. Budget) über der Schwelle und stellt sie als Fragenliste/Pendenz
    an den Kunden. Schriftliche Antworten kritisch gegen Kenntnisse (Projekte, Verträge, Analytik) würdigen; nicht plausible oder fehlende Erklärungen als Pendenz an den WP.
  nachweise:
  - Saldoliste Erfolgsrechnung 2025/2024
  - Fragenliste mit schriftlichen Antworten
  - Budget (falls vorhanden)
  rechnen: Abweichung je Konto = Saldo 2025 − Saldo 2024; Abw.-% = Abweichung / |Saldo 2024|; auflisten, wenn |Abweichung| > Schwelle (Toleranzwesentlichkeit bzw. WP-Vorgabe aus 3.3).
  feststellung_wenn: Wesentliche Abweichung ohne plausible, dokumentierte Erklärung oder Erklärung widerspricht anderen Prüfungsnachweisen.
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Diskrepanzen zwischen den erhaltenen Antworten und seinen Kenntnissen über das Unternehmen geht der Abschlussprüfer nach.
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
- id: SCH1-201
  vorgehen: 'Umsätze, Waren-/Materialaufwand und Bruttomarge je Produktkategorie (z.B. Anlagenbau, Service, Dienstleistungen, Handel) für 2025 und Vorjahr aus Saldoliste bzw. Umsatzstatistik
    berechnen und gegenüberstellen. Wesentliche Margenverschiebungen als Frage an den Kunden. Fehlt eine Aufteilung nach Kategorien: Gesamtmarge rechnen und Umsatz-/Margenstatistik als
    PBC-Pendenz.'
  nachweise:
  - Saldoliste ER 2025/2024
  - Umsatz- und Margenstatistik je Produktkategorie
  - Antworten zu Margenabweichungen
  rechnen: Bruttomarge je Kategorie = (Nettoerlös − zugeordneter Waren-/Materialaufwand) / Nettoerlös; Veränderung in %-Punkten zum Vorjahr; Gesamtmarge = (Summe Nettoerlöse 3xxx − Summe
    Waren-/Materialaufwand 4xxx) / Summe Nettoerlöse.
  feststellung_wenn: Wesentliche, nicht erklärte Margenveränderung (Hinweis auf Cut-off-Fehler, fehlende Erlöse/Aufwände oder Fehlklassierung).
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Vergleich von Umsätzen, Warenaufwand und Bruttomargen je Produktkategorie mit dem Vorjahr; Besprechung wesentlicher Abweichungen
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: Analytische Prüfungshandlungen sind allgemein effizient und liefern beispielsweise bei der Prüfung der Erfolgsrechnung wertvolle Prüfungsnachweise.
- id: SCH1-202
  vorgehen: a) Saldovergleich Ertragskonten mit Vorjahr; b) Kontoblätter auf hohe/ungewöhnliche Beträge durchsehen (Soll-Buchungen, runde Beträge, Stichtagsnähe); c) Budgetvergleich,
    falls Budget vorliegt; d) Margenvergleich aus SCH1-201; e) andere Unterlagen, v.a. MWST-Abrechnungen/Umsatzabstimmung und Fakturen-Soll Debitoren. Ursache je signifikanter Änderung
    im Textfeld umschreiben; ungeklärte als Pendenz.
  nachweise:
  - Saldoliste ER 2025/2024
  - Kontoblätter Ertragskonten
  - Budget
  - MWST-Abrechnungen/Umsatzabstimmung
  - Kontoblatt Debitoren
  rechnen: 'Umsatzabstimmung: deklarierter Umsatz MWST (Ziff. 200) − Ertragskonten netto gemäss Saldoliste = Differenz (zu erklären, z.B. steuerbefreite/nicht steuerbare Erträge, Abgrenzungen);
    Fakturen-Soll Konto 1100 abzüglich MWST ≈ Ertragskonten 3xxx.'
  feststellung_wenn: Signifikante Änderung ohne belegte Ursache, ungeklärte Differenz Umsatzabstimmung/Debitorenverkehr zu Ertrag, oder Budget-/Margenabweichung deutet auf fehlende bzw.
    zu früh erfasste Erlöse.
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Budgetvergleiche → je nach Betriebsgrösse unterschiedlich häufig anzutreffende Prüfungshandlung
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht der Konten auf hohe oder ungewöhnliche Beträge
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der MWST-Abrechnungen mit den Konti und/oder der Umsatzabstimmung
- id: SCH1-301
  vorgehen: Stichprobe aus den Ertragskonten bilden (alle Posten über Toleranzwesentlichkeit, ungewöhnliche Posten, weitere nach Risiko; WP-Vorgabe übernehmen) und je Posten Rechnung,
    Vertrag/Auftrag, Leistungsnachweis (Rapport, Lieferschein, Abnahmeprotokoll) und Zahlungseingang in M-Files suchen. Betrag netto, Datum/Periode, Kunde und Kontierung abgleichen;
    Auswahl und Ergebnis tabellarisch im Textfeld, fehlende Belege als PBC-Pendenz.
  nachweise:
  - Ausgangsrechnungen
  - Verträge/Auftragsbestätigungen
  - Lieferscheine, Rapporte, Abnahmeprotokolle
  - Zahlungseingänge Bank
  rechnen: 'Je Posten: gebuchter Betrag = Rechnungsbetrag netto (exkl. MWST) ± Erlösminderungen; Prüfabdeckung = Summe geprüfter Posten / Saldo Ertragskonto in %.'
  feststellung_wenn: Beleg fehlt, Betrag/Periode/Kunde weicht ab, Ertrag inkl. MWST gebucht oder Leistung nicht erbracht (Akonto-/Vorausrechnung als Ertrag).
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und anderen geeigneten Unterlagen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe, nahestehende Personen)
- id: SCH1-302
  vorgehen: 'Kontoblätter aller Ertrags- und Erlösminderungskonten sowie das Debitorenkonto kritisch durchsehen: Soll-Buchungen auf Ertrag, Storni, Gutschriften, Umbuchungen, sachfremde
    Gegenkonten, Buchungen Ende Dezember und Abschlussbuchungen. Zusätzlich Ertrags-/Erlösminderungskonten der neuen Rechnung auf Posten durchsehen, die das Berichtsjahr betreffen. Auffällige
    Posten mit Beleg klären oder als Pendenz.'
  nachweise:
  - Kontoblätter Ertrags- und Erlösminderungskonten 2025
  - Kontoblätter Ertrag/Debitoren Folgejahr
  - Belege zu auffälligen Posten
  rechnen: Monatsumsatz aus Fakturen-Buchungen je Monat; Abweichung je Monat zum Monatsdurchschnitt (Jahressaldo / 12), Ausreisser sowie Dezember/Januar gesondert ausweisen.
  feststellung_wenn: Gutschrift/Ausbuchung im Folgejahr mit Ursache im Berichtsjahr nicht erfasst, ungewöhnliche Buchung ohne Beleg/Erklärung oder sachfremde Erträge im Betriebsertrag.
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten;
  - quelle: ser-2022__anh-d-s075-2
    zitat: Durchsicht der Erlös- und Erlösminderungskonten in neuer Rechnung auf auffällige Beträge, die das Vorjahr betreffen
  - quelle: ser-2022__anh-d-s075-2
    zitat: Durchsicht von Debitoren-, Erlös-, Warenretouren- und Erlösminderungskonten im Hauptbuch auf ungewöhnliche Posten; Belegprüfung solcher Posten
- id: SCH1-303
  vorgehen: 'WP-Schritt: Agent bereitet nur eine Arbeitsliste vor (offener Entscheid zu WP-Schritten). Fakturen vor und nach dem Stichtag (Zeitraum gemäss WP-Vorgabe) aus Kontoblättern
    Debitoren/Ertrag 2025 und Folgejahr auflisten, je Faktura Leistungs-/Lieferdatum aus Rechnung, Rapport, Lieferschein oder Abnahmeprotokoll erfassen und mit der Buchungsperiode vergleichen.
    Abweichungen als Entwurf für den WP, keine Würdigung.'
  nachweise:
  - Fakturen Dezember 2025 und Januar 2026
  - Lieferscheine, Rapporte, Abnahmeprotokolle
  - Kontoblätter 1100/3xxx Dezember und Folgejahr
  - Debitoren-OP-Liste 31.12.
  rechnen: 'Je Faktura: Leistungsdatum ≤ 31.12. ↔ Buchungsperiode; Summe falsch abgegrenzter Nettobeträge = möglicher Korrekturbetrag, Vergleich mit Toleranzwesentlichkeit.'
  feststellung_wenn: Faktura für Leistung der Folgeperiode als Ertrag des Berichtsjahres gebucht (oder umgekehrt) bzw. Akontorechnung ohne Leistung als Ertrag; Entwurf zur Entscheidung
    durch WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s092-1
    zitat: Einsicht in Rechnungen und Lieferpapiere vor und nach dem Periodenende zur Prüfung der richtigen zeitlichen Abgrenzung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- id: SCH1-304
  vorgehen: 'Aus der JR feststellen, ob eine Absatzerfolgsrechnung (Umsatzkostenverfahren) vorliegt. Falls ja: Mindestpositionen nach Art. 959b Abs. 3 OR prüfen und im Anhang Personalaufwand
    sowie Abschreibungen/Wertberichtigungen in einer Position suchen und mit der Saldoliste abstimmen. Bei Produktionserfolgsrechnung den Schritt als «nicht anwendbar» mit Begründung
    dokumentieren.'
  nachweise:
  - Jahresrechnung inkl. Anhang
  - Saldoliste
  rechnen: Anhang Personalaufwand = Summe Personalaufwandskonten gemäss Saldoliste; Anhang Abschreibungen/Wertberichtigungen = Summe der entsprechenden Konten gemäss Saldoliste.
  feststellung_wenn: Absatzerfolgsrechnung ohne Angabe von Personalaufwand oder Abschreibungen im Anhang, Beträge nicht abgestimmt oder Mindestpositionen fehlen.
  fundstellen:
  - quelle: or__art-959b-t2
    zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens ausgewiesen
      werden.
  - quelle: or__art-959b-t1
    zitat: In der Absatzerfolgsrechnung (Umsatzkostenverfahren) müssen mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- id: SCH1-305
  vorgehen: 'Gliederung der ER mit den Mindestpositionen nach Art. 959b Abs. 2 OR (je einzeln, vorgegebene Reihenfolge) vergleichen und Kontenzuordnung gemäss Saldoliste prüfen: Nettoerlöse
    ohne Bestandesänderungen und ohne MWST, Erlösminderungen abgezogen, Finanz-, betriebsfremde und a.o./periodenfremde Erträge separat, keine Verrechnung. Fehlende oder zusammengefasste
    Positionen im Textfeld auflisten.'
  nachweise:
  - Jahresrechnung (Erfolgsrechnung)
  - Saldoliste mit Kontenzuordnung
  rechnen: 'Je Mindestposition: Summe zugeordneter Konten gemäss Saldoliste = Betrag in der ER; Summe aller Positionen = Jahresergebnis gemäss Saldoliste.'
  feststellung_wenn: Mindestposition fehlt oder Reihenfolge abweichend, Bestandesänderungen im Nettoerlös, Ertrag/Aufwand verrechnet oder betriebsfremde/a.o. Posten falsch klassiert.
  fundstellen:
  - quelle: or__art-959b-t1
    zitat: In der Produktionserfolgsrechnung (Gesamtkostenverfahren) müssen mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
  - quelle: hwp-bur-2023__rz-0750-s317-t2
    zitat: Sie sind nicht Teil des Nettoerlöses
  - quelle: hwp-bur-2023__rz-0230-s114
    zitat: Es ist nicht zulässig, die Nettoerlöse mit anderem Aufwand zur Erzielung des Umsatzes zu verkürzen
- id: SCH1-401
  vorgehen: 'Nur auf Anweisung des WP (Kennzeichnung offen; Aufdeckung deliktischer Handlungen ist nicht Teil der ER): Buchungsjournal-Export der Ertrags- und Erlösminderungskonten anfordern
    und Filter a)–j) anwenden (manuell, Zeitpunkt, runde Beträge, Benutzer, Ausreisser, Buchungstext, Periode, Erfassungs- vs. Belegdatum, Wiederholungen, Währungskurs). Treffer mit
    Begründung im Textfeld, Klärung als Pendenz.'
  nachweise:
  - Buchungsjournal-Export (Datum, Erfassungsdatum, Benutzer, Beleg, Text, Konto/Gegenkonto, Betrag, Währung)
  - Liste der buchungsberechtigten Personen
  - Kurstabelle Fremdwährungen
  rechnen: 'Filter (Schwellen gemäss WP-Vorgabe): Betrag ohne Rest durch 1''000 teilbar; Erfassung an Wochenende/Feiertag oder nach Abschlussdatum; |Betrag − Kontodurchschnitt| über
    Schwelle; Erfassungsdatum − Belegdatum > N Tage; gleicher Betrag ≥ 3× je Konto; Kurs ausserhalb Referenzkurs ± Toleranz.'
  feststellung_wenn: Treffer ohne plausible Erklärung oder Beleg, insbesondere manuelle Umsatzbuchung zum Jahresende ohne Leistungsnachweis, die den Ertrag wesentlich verändert.
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Hauptbuch und Buchungsjournale;
  - quelle: ser-2022__1-5
    zitat: keine Prüfungen zur Aufdeckung von deliktischen Handlungen
  - quelle: hwp-or-2024__rz-0375-s229-t2
    zitat: Journalbuchungen oder andere Anpassungen weisen runde Zahlen oder Zahlen mit denselben Endziffern auf
  - quelle: hwp-or-2024__rz-0375-s229-t1
    zitat: Journalbuchungen oder andere Anpassungen wurden durch Personen vorgenommen, die typischerweise keine Journalbuchungen vornehmen
- id: SCH1-155
  vorgehen: 'Als Teil der kritischen Durchsicht bzw. des JET die Gegenkonten aller Buchungen auf Ertrags- und Debitorenkonten auswerten. Erwartet: Debitoren, Bank/Kasse, Erlösminderungen,
    Abgrenzungen, angefangene Arbeiten. Ungewöhnlich: Ertrag gegen Aufwand-, Darlehens-, Aktionärs-/Nahestehenden-, Eigenkapital- oder Anlagekonten. Treffer mit Beleg klären und im Textfeld
    auflisten; offene als Pendenz.'
  nachweise:
  - Buchungsjournal bzw. Kontoblätter mit Gegenkonten
  - Belege der Treffer
  rechnen: Kreuztabelle Ertragskonto × Gegenkonto (Anzahl, Summe); Kombinationen ausserhalb der erwarteten Gegenkontengruppen ausweisen.
  feststellung_wenn: Ertrag gegen sachfremdes Gegenkonto ohne nachvollziehbaren Geschäftsvorfall (Verrechnung mit Aufwand, Nahestehenden- oder Bilanzkonten) oder Umgehung der Erfolgsrechnung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0741-s313-t1
    zitat: Grundsätzlich sind erfolgswirksame Vorgänge in der Erfolgsrechnung zu erfassen.
  - quelle: or__art-958c
    zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
  - quelle: hwp-or-2024__rz-0375-s229-t1
    zitat: Journalbuchungen oder andere Anpassungen auf nicht zusammenhängenden, ungewöhnlichen oder selten verwendeten Konten
- id: SCH1-402
  vorgehen: 'Drittbestätigungen sind nicht Bestandteil der eingeschränkten Revision: Agent holt keine Umsatzbestätigungen ein und dokumentiert den Schritt als «nicht Bestandteil ER»,
    sofern der WP nichts anderes vorgibt. Liegen beim Kunden bereits Abrechnungen oder Bestätigungen Dritter vor (z.B. Netzbetreiber, Plattformen, Kommissionäre), diese als intern verfügbare
    Unterlagen mit den gebuchten Umsätzen abstimmen.'
  nachweise:
  - Allfällige beim Kunden vorhandene Abrechnungen/Bestätigungen Dritter
  - Kontoblätter Ertrag je Gegenpartei
  rechnen: 'Falls vorhanden: bestätigter Umsatz je Gegenpartei − gebuchter Umsatz je Gegenpartei (netto MWST) = Differenz.'
  feststellung_wenn: Vorhandene Drittabrechnung weicht wesentlich vom gebuchten Umsatz ab; das Fehlen einer Bestätigung ist in der ER keine Feststellung.
  fundstellen:
  - quelle: ser-2022__1-5
    zitat: keine Inventurbeobachtung und Drittbestätigungsanfragen durchgeführt – die Prüfung beschränkt sich grundsätzlich auf beim geprüften Unternehmen intern verfügbare Informationen
  - quelle: hwp-er-2026__rz-0083-s194
    zitat: ist das Einholen von Drittbestätigungen nicht vorgesehen
  - quelle: ser-2022__6-2-6
    zitat: Der Abschlussprüfer muss deshalb nicht begründen, weshalb er diese Prüfungshandlungen nicht durchführt.
