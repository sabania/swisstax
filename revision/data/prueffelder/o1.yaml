- id: O1-320
  vorgehen: 'Anhang auf rückstellungsbezogene Angaben durchsehen: Eventualverbindlichkeiten (nicht schätzbare Prozessrisiken: Partei, Streitgegenstand, Streitwert, allfällige Versicherungsdeckungen
    und Gegenklagen, Stand im Instanzenzug), hohe Schätzunsicherheit, Sicherheiten für Dritte, a.o./periodenfremde Bildung oder Auflösung, Ereignisse nach Stichtag, Nettoauflösung stiller
