  - Aktennotizen/Einschätzungen
  - Berechnungen und interne Richtlinien
  - Abnahmeprotokolle (Garantiebeginn)
  rechnen: 'Berechnung nachrechnen: Satz × Bemessungsgrundlage = Rückstellung gemäss Berechnung; Differenz zum gebuchten Betrag.'
  feststellung_wenn: Keine geeignete Grundlage, Ereignis nach Stichtag, keine Verpflichtung gegenüber Dritten oder gebuchter Betrag weicht wesentlich von der eigenen Berechnung ab.
