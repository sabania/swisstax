    der Revisionsstelle. Ohne Anweisung: Status «nicht bearbeitet – nur auf Anweisung» (gleiche Bezeichnung wie Werkzeugausgabe). Auf Anweisung des WP: in M-Files nur vom Unternehmen
    selbst eingeholte Stellungnahmen/Gutachten suchen und auswerten (Ausgang, Betrag, Kosten). Ist das Risiko ohne Bestätigung nicht reduzierbar: Hinweis an WP.'
