    zitat: verlangt die eingeschränkte Revision von der Revisionsstelle weder das Einholen von Debitoren- und Kreditorenbestätigungen noch von Bank- oder Anwaltsbestätigungen oder Experten-Gutachten
  - quelle: hwp-er-2026__rz-0139-s204-t2
    zitat: Dieses Vorgehen, im SER als «Einholen von Anwaltsbestätigungen» bezeichnet, ist bei der eingeschränkten Revision nicht vorgesehen.
  - quelle: hwp-er-2026__rz-0139-s204-t3
    zitat: Liegt eine Bestätigung im Zeitpunkt der Abschlusserstellung vor, wird der Abschlussprüfer diese als Prüfungsnachweis betrachten
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: hwp-bur-2023__rz-0526-s263
    zitat: Es empfiehlt sich, bei laufenden Prozessen von den beauftragten Anwältinnen und Anwälten Stellungnahmen über den mutmasslichen Prozessausgang
  - quelle: hwp-er-2026__rz-0139-s204-t3
    zitat: Möglicherweise wird das Unternehmen bei der Erstellung und in Verantwortung der Aussagen in der Jahresrechnung von sich aus eine Anwaltsbestätigung einholen.
- id: O1-402
  vorgehen: '4xx: nur auf Anweisung des WP; Analogie zu SER Anhang D r) (dort weiter gehende Handlung). Rechts-/Beratungsaufwand und Rechtsschutz im Berichtsjahr sowie Buchungen/Kreditorenjournal
    der neuen Rechnung auf Anwalts-, Gerichts- und Gutachterrechnungen durchsehen; je Mandat/Gegenpartei prüfen, ob der Sachverhalt im Rückstellungsspiegel oder Anhang berücksichtigt
    ist. Liste mit Abgleich im Textfeld.'
  nachweise:
  - Kontoblätter Rechts-/Beratungsaufwand
  - Kreditorenjournal/Kontoblätter neue Rechnung
  - Anwaltsrechnungen
  rechnen: Saldo Rechts-/Beratungsaufwand Berichtsjahr vs. Vorjahr (Veränderung absolut/%); Summe Anwalts-/Gerichtskosten je Sachverhalt.
  feststellung_wenn: Anwalts-/Gerichtsrechnung deutet auf Rechtsfall hin, der weder zurückgestellt noch offengelegt ist, oder Kosten des Berichtsjahres sind nicht abgegrenzt.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht der Konten auf hohe oder ungewöhnliche Beträge
  - quelle: ser-2022__anh-d-s094-1
    zitat: Durchsicht von Konten und/oder Belegen in neuer Rechnung auf Positionen, die das Berichtsjahr betreffen
  - quelle: hwp-er-2026__rz-0119-s201
    zitat: Korrespondenzen mit Rechtsanwälten
- id: O1-403
  vorgehen: '4xx: nur auf Anweisung des WP. Gesamtwürdigung je Rückstellung: a) Zusammenhang mit Debitoren (Mängelrügen), Abnahmen, Bankgarantien, Steuern (S1), b) O1-201, c) vom Unternehmen
    eingeholte Anwaltseinschätzungen, d) andere Unterlagen. Vertretbarkeit der Schätzung beurteilen (Methode geeignet, stetig; Rückblick VJ). Nicht vertretbar: Hinweis an WP, Korrektur
    verlangt nur der WP. Differenz quantifizieren; bei Kapitalverlust/Überschuldung an P1.'
  nachweise:
  - Ergebnisse O1-101 bis O1-402
  - Debitoren-OP-Liste/Gutschriften
  - Abnahmeprotokolle
  - Bankbestätigungen
  - Aktennotizen/Einschätzungen
  rechnen: 'Schätzdifferenz = bestmögliche Schätzung − gebuchte Rückstellung (Einzelrisiko wie Rechtsfall: wahrscheinlichster Betrag inkl. Prozesskosten, Praxis/intern; grosse Grundgesamtheit
    wie Garantien: Erwartungswert); Differenz zum oberen Ende der Bandbreite separat als Spanne ausweisen; Summe über alle Rückstellungen; Wesentlichkeit aus revio 3.3 lesen.'
  feststellung_wenn: 'Differenz unter Nichtaufgriffsgrenze (3.3): nur im Textfeld protokollieren. Differenz über Nichtaufgriffsgrenze: Notiz «Wesentliche Feststellungen» mit Buchungsvorschlag
    (ohne Verbuchung; wird in A1 kumuliert). Ob einzeln oder kumuliert wesentlich, beurteilt der WP (6.1).'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: hwp-bur-2023__rz-0513-s261
    zitat: Bei einer bestehenden Verpflichtung ist eine Rückstellung sofort und in vollem Umfang zu bilden.
  - quelle: hwp-bur-2023__rz-0515-s261
    zitat: Das Vorsichtsprinzip impliziert, dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist.
  - quelle: hwp-er-2026__rz-0139-s204-t3
    zitat: muss er ermessen, wie hoch der Fehlbetrag sein könnte
  - quelle: hwp-er-2026__rz-0397-s273
    zitat: ob die durch die Unternehmensleitung geschätzten Werte im zu prüfenden Abschluss mit den Anforderungen des massgebenden Regelwerks der Rechnungslegung vereinbar und daher
      vertretbar sind
  - quelle: hwp-er-2026__rz-0400-s273
    zitat: Gelangt der Abschlussprüfer zum Schluss, dass der durch die Unternehmensleitung geschätzte Wert nicht vertretbar ist, verlangt er eine Korrektur des Abschlusses.
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Gesamtwesentlichkeit: Massstab für Wesentliche Feststellungen; die Summe der nicht korrigierten Fehler beurteilt der Mensch in 6.1.'
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: or__art-725a
    zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die Beurteilung, ob eine Feststellung wesentlich ist, liegt im professionellen Ermessen des Abschlussprüfers.
- id: O1-404
  vorgehen: '4xx: nur auf Anweisung des WP. Bewegungen auf den Rückstellungskonten (Bildung im Haben, Verwendung/Auflösung im Soll) anhand Buchungsbelegen und Grundlagen prüfen: Betrag,
    Datum, Gegenkonto, Begründung; Verwendung nur für artgleiche Posten, Auflösung nicht benötigter Beträge über die Erfolgsrechnung. Ergebnis je Buchung im Textfeld; fehlende Belege
    als Pendenz mit Konto/Datum/Betrag.'
  nachweise:
  - Kontoblätter Rückstellungskonten
  - Buchungsbelege (Abschlussbuchungen)
  - Zahlungsbelege bei Verwendung
  - Rückstellungsspiegel
  rechnen: Summe Haben-Buchungen = Bildung gemäss Spiegel; Summe Soll-Buchungen = Verwendung + Auflösung gemäss Spiegel.
  feststellung_wenn: Buchung ohne Beleg/Begründung, Verwendung für artfremden Zweck, Umwidmung ohne Erfolgsrechnung oder Bewegungen weichen vom Rückstellungsspiegel ab.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-bur-2023__rz-0507-s259
    zitat: Die Verwendung zweckbestimmter Rückstellungen erfolgt als Bestandsbuchung.
  - quelle: hwp-bur-2023__rz-0508-s260
    zitat: Eine Inanspruchnahme von Rückstellungen durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig.
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- id: O1-405
  vorgehen: '4xx: nur auf Anweisung des WP. Gegenkonten der Bildung/Auflösung beurteilen (sachlich zugehöriger Aufwand; a.o./periodenfremd nur wenn zutreffend, dann im Anhang erläutert).
    Ausweis: Rückstellungen gesondert, kurz-/langfristig nach Mittelabfluss; Ferien/Überzeit und laufende Steuern eher pRA (Grenzen fliessend, ohne Ergebniswirkung); keine Wertberichtigungen
    unter Passiven. Pauschale Bemessung → O1-301/O1-403.'
  nachweise:
  - Kontoblätter mit Gegenkonten
  - Jahresrechnung (Bilanz, ER, Anhang)
  - Kontenplan/Gruppenzuordnung Saldoliste
