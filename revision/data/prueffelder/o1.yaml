- id: O1-321
  vorgehen: Rückstellungen über dem betriebswirtschaftlich erforderlichen Betrag (inkl. nicht mehr begründete, Art. 960e Abs. 3 Ziff. 4 OR und Rückstellungen für nach dem Stichtag verursachte
    Verluste) als stille Reserven identifizieren und mit dem Nachweis stiller Reserven des Kunden abstimmen; Veränderung zum Vorjahr ermitteln und an die Gesamtbeurteilung (Nettoauflösung)
    weitergeben.
  nachweise:
  - Nachweis stille Reserven (Kunde)
  - Rückstellungsspiegel
  - Ergebnisse O1-102/O1-403
  rechnen: Stille Reserve je Rückstellung = gebuchter Betrag − betriebswirtschaftlich erforderlicher Betrag; Veränderung = Bestand 31.12. − Bestand Vorjahr; Auflösung > Bildung → Nettoauflösung.
  feststellung_wenn: Kein oder abweichender Nachweis stiller Reserven, oder wesentliche Nettoauflösung (u.a. aus Rückstellungen) ohne Anhangsangabe.
