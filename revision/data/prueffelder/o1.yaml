schritte:
- id: O1-101
  vorgehen: 'Agent befragt nicht selbst: wertet schriftliche Antworten (Kundenbefragung, Aktennotizen, Protokolle, Vollständigkeitserklärung) zu hängigen/angedrohten Rechtsfällen, Mängelrügen,
    Garantie- und anderen Ansprüchen aus, sonst Frage als Pendenz. Checkliste möglicher Ursachen (HWP BuR Rz 511) anwenden; je genanntem Risiko prüfen, ob es im Rückstellungsspiegel
    oder Anhang erscheint. Status höchstens «teilweise bearbeitet». Fehlt die schriftliche Antwort, Schritt trotzdem mit den vorhandenen Unterlagen bearbeiten (Protokolle, Aktennotizen,
    Anwalts-/Gerichtsrechnungen im Aufwand, Anhang) – nie überspringen.'
  nachweise:
  - schriftliche Antwort Unternehmensleitung (Kundenbefragung)
  - Aktennotizen/Korrespondenz Rechtsfälle
  - VR-/GV-Protokolle
  - Rückstellungsspiegel
  - Vollständigkeitserklärung
  rechnen: ''
  feststellung_wenn: Genanntes oder aus Unterlagen erkennbares Risiko mit Ursache vor dem Stichtag ist weder zurückgestellt noch im Anhang offengelegt; fehlende Antwort → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s088-1
    zitat: Befragung über pendente Risiken (Rechtsfälle, angedrohte Schadenersatz- und andere Ansprüche usw.), die eine Rückstellung erfordern
  - quelle: hwp-bur-2023__rz-0510-s260
    zitat: Zur Ermittlung des Rückstellungsbedarfs sind sämtliche am Abschlussstichtag bestehenden sowie die erkennbaren und vor dem Stichtag verursachten Risiken und Lasten
  - quelle: hwp-bur-2023__rz-0511-s260
    zitat: hängige Prozesse oder angedrohte Klagen
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: ser-2022__anh-d-s100-1
    zitat: Befragung zu bedeutenden schwebenden Geschäften und anderen Ursachen, die vor dem Bilanzstichtag liegen und ein Verlustrisiko beinhalten
- id: O1-102
  vorgehen: 'Besprechung führt der WP. Agent bereitet vor: Schätzung der Unternehmensleitung je Risiko (Methode, Bandbreite, wahrscheinlichster Betrag, Prozesskosten) aus Aktennotizen/Antworten
    zusammenstellen, mit dem gebuchten Betrag vergleichen und Vertretbarkeit beurteilen (Methode geeignet und stetig; Rückblick Vorjahresrückstellung gegenüber Verwendung/Auflösung).
    Nicht vertretbar: Hinweis an WP; die Korrektur verlangt nur der WP. Fehlt bei einem wesentlichen Prozess eine schriftliche Stellungnahme des Rechtsvertreters: Notiz «Pendenz» «Stellungnahme
    Rechtsvertreter, vom Unternehmen einzuholen (Empfehlung HWP BuR Rz 526)».'
  nachweise:
  - Aktennotiz/Einschätzung Unternehmensleitung bzw. Rechtsvertreter
  - schriftliche Antwort zur Schätzung
  - Rückstellungsspiegel Berichtsjahr und Vorjahr
  - Kontoblätter (Verwendung/Auflösung Vorjahresrückstellungen)
  rechnen: 'Je Risiko mit `rechne`: A = wahrscheinlichster Betrag + Anwalts-/Gerichtskosten (Praxis; Mindestwert); B = oberes Ende der Bandbreite + Kosten, sofern nicht schon in der
    Bandbreite enthalten (Vorsicht, HWP BuR Rz 515); Differenzen A − gebucht und B − gebucht beide ausweisen; Lage des gebuchten Betrags in der Bandbreite (unter/innerhalb/über); welcher
    Wert massgebend ist, entscheidet der WP. Rückblick: Rückstellung VJ − (Verwendung + Auflösung) Berichtsjahr.'
  feststellung_wenn: Gebuchter Betrag unter A oder unter der Bandbreite von Unternehmensleitung/Rechtsvertretung, Schätzung nicht dokumentiert oder Methode ungeeignet/nicht stetig (nicht
    vertretbar) → Hinweis an WP (Differenz A und B angeben).
  fundstellen:
  - quelle: ser-2022__anh-d-s088-1
    zitat: Besprechung der Einschätzung des finanziellen Ausmasses solcher Risiken durch die Unternehmensleitung
  - quelle: hwp-er-2026__rz-0118-s201
    zitat: Nachvollzug der Beurteilung der Unternehmensleitung zur Festlegung einer Rückstellung
  - quelle: hwp-bur-2023__rz-0516-s261
    zitat: Die notwendige Höhe der Rückstellung ist aufgrund bestmöglicher Schätzung zu bemessen.
  - quelle: hwp-bur-2023__rz-0515-s261
