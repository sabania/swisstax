  vorgehen: Mehrjährig gültige Unterlagen zu Rückstellungen (z.B. Garantierichtlinie/Berechnungsmethode, langfristige Verträge mit Garantie-, Rückbau- oder Abnahmeverpflichtungen, mehrjährige
