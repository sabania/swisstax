# Prüffeld O1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: O1
bezeichnung: Rückstellungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 12
    korrigiert: true
  ergaenzt: '2026-11-13 Runde R2: Wissenslücken aus E2E-Lauf ergänzt (Zitate maschinell geprüft, Zweitprüfung offen)'
kurzbeschrieb: 'Rückstellungen (Art. 960e OR) für ungewisse Verpflichtungen aus vergangenen Ereignissen (Prozesse, Garantien, Drohverluste): Bestand, Vollständigkeit, Bewertung (bestmögliche
  Schätzung), Ausweis, Abgrenzung zu pRA und Eventualverbindlichkeiten (Anhang). Keine Anwaltsbestätigungen einholen.'
gesetz:
- thema: Rückstellungspflicht bei erwartetem Mittelabfluss aus vergangenen Ereignissen
  quelle: or__art-960e
  zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
    gebildet werden.
- thema: Zulässige weitere Rückstellungen (Garantie, Sanierung Sachanlagen, Restrukturierung, dauerndes Gedeihen)
  quelle: or__art-960e
  zitat: regelmässig anfallende Aufwendungen aus Garantieverpflichtungen
- thema: Zulässige Rückstellungen zur Sicherung des dauernden Gedeihens des Unternehmens (Art. 960e Abs. 3 Ziff. 4 OR)
  quelle: or__art-960e
  zitat: die Sicherung des dauernden Gedeihens des Unternehmens
- thema: Keine Auflösungspflicht nicht mehr begründeter Rückstellungen
  quelle: or__art-960e
  zitat: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden.
- thema: Bilanzierungsvoraussetzungen Verbindlichkeiten (Fremdkapital)
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden, ein Mittelabfluss wahrscheinlich ist und ihre Höhe verlässlich
    geschätzt werden kann.
- thema: 'Mindestgliederung: Rückstellungen als eigene Position im Fremdkapital'
  quelle: or__art-959a-t1
  zitat: Rückstellungen sowie vom Gesetz vorgesehene ähnliche Positionen
- thema: Einzelbewertung
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Vorsichtige Bewertung
  quelle: or__art-960
  zitat: Die Bewertung muss vorsichtig erfolgen, darf aber die zuverlässige Beurteilung der wirtschaftlichen Lage des Unternehmens nicht verhindern.
- thema: Überprüfungspflicht bei Anzeichen zu geringer Rückstellungen
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Zeitliche und sachliche Abgrenzung
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Grundsatz der Vorsicht
  quelle: or__art-958c
  zitat: Sie muss vorsichtig sein.
- thema: Verrechnungsverbot
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Belegnachweis für Buchungen
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: 'Anhang: Eventualverbindlichkeiten (Art. 959c Abs. 2 Ziff. 10 OR)'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: 'Anhang: Sicherheiten für Verbindlichkeiten Dritter (Art. 959c Abs. 2 Ziff. 8 OR)'
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: 'Anhang: ausserordentliche, einmalige oder periodenfremde Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: 'Anhang: wesentliche Ereignisse nach dem Bilanzstichtag (Art. 959c Abs. 2 Ziff. 13 OR)'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Kapitalverlust (Art. 725a Abs. 1 OR): Auswirkung zusätzlicher Rückstellungen auf die Kapitaldeckung (Querverweis Prüffeld Eigenkapital P1)'
  quelle: or__art-725a
  zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital
- thema: 'Überschuldung (Art. 725b OR): begründete Besorgnis, Zwischenabschlüsse; Rangrücktritt im Ausmass der Überschuldung (Querverweis P1)'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
risiken:
- text: 'Unvollständige Rückstellungen: hängige oder angedrohte Rechtsfälle, Mängelrügen, Garantie- oder andere Verpflichtungen mit Ursache vor dem Stichtag sind nicht erfasst.'
  pruefziele:
  - VO
  - EN
  - PA
  quelle: hwp-bur-2023__rz-0510-s260
  zitat: Zur Ermittlung des Rückstellungsbedarfs sind sämtliche am Abschlussstichtag bestehenden sowie die erkennbaren und vor dem Stichtag verursachten Risiken und Lasten
- text: 'Unterbewertung: gebuchter Betrag liegt unter der bestmöglichen Schätzung bzw. am unteren Ende der Bandbreite.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: Das Vorsichtsprinzip impliziert, dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist.
- text: Bestehende Verpflichtung wird über mehrere Jahre aufgebaut statt sofort und vollständig zurückgestellt.
  pruefziele:
  - BE
  - VO
  quelle: hwp-bur-2023__rz-0513-s261
  zitat: Ein Aufbauen einer Rückstellung über mehrere Jahre ist in diesem Falle nicht zulässig.
- text: 'Falsche Klassifikation: Verzicht auf Rückstellung zugunsten einer blossen Eventualverbindlichkeit im Anhang trotz schätzbarer Bandbreite.'
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Eine grosse Bandbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten
- text: Nicht begründete oder fiktive Rückstellungen (Bestand/Eintritt), z.B. ohne vergangenes Ereignis oder ohne Verpflichtung gegenüber Dritten; überhöhte Beträge = stille Reserven.
  pruefziele:
  - EX
  - RV
  - EN
  quelle: ser-2022__4-3-1
  zitat: Wegen des Verbots der Bilanzierung fiktiver Verbindlichkeiten ist dies aber auch für die Passiven zu beachten.
- text: 'Periodenabgrenzung: nach dem Stichtag bekannt gewordene Verluste mit Ursache vor dem Stichtag werden nicht zurückgestellt.'
  pruefziele:
  - PA
  - VO
  quelle: hwp-bur-2023__rz-0517-s262
  zitat: Verluste, deren Ursache vor dem Abschlussstichtag liegt, die aber erst danach, jedoch vor Erstellung des Abschlusses bekannt werden, müssen zurückgestellt werden.
- text: Fehlende oder unvollständige Anhangsangaben (Eventualverbindlichkeit bei nicht schätzbarem Prozessrisiko, ausserordentliche Bildung/Auflösung, Nettoauflösung stiller Reserven).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0526-s263
  zitat: muss der Sachverhalt in jenen Fällen, in denen ein negativer Prozessausgang nicht ausgeschlossen werden kann, im Anhang als Eventualverbindlichkeit erläutert werden
- text: 'Falsche Verbuchung: Verwendung für artfremde Posten oder Zweckänderung ohne Erfolgsrechnung; Bildung über falsche Aufwandposition.'
  pruefziele:
  - RI
  - DO
  quelle: hwp-bur-2023__rz-0508-s260
  zitat: Eine Inanspruchnahme von Rückstellungen durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig.
- text: 'Ausweis: passive Rechnungsabgrenzungen (Ferien/Überzeit, laufende Steuern) unter den Rückstellungen (Grenzen fliessend, ohne Ergebniswirkung → Umgliederung) oder Wertberichtigungen
    unter den Passiven.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0512-s261
  zitat: Eher unter die passiven Rechnungsabgrenzungen fallen z.B.
- text: 'Hohe Schätzunsicherheit (v.a. Rechtsstreitigkeiten): Schätzung der Unternehmensleitung nicht vertretbar (Methode ungeeignet oder nicht stetig, Erfahrungen aus Vorjahren nicht
    berücksichtigt).'
  pruefziele:
  - BE
  - DO
  quelle: hwp-er-2026__rz-0395-s272
  zitat: geschätzte Werte im Zusammenhang mit dem Ausgang von Rechtsstreitigkeiten
- text: 'Ferien-/Überzeitguthaben pauschal statt je Mitarbeiter (Guthaben × Stundensatz) bemessen: Bewertungsmangel, nicht bloss Ausweisfrage.'
  pruefziele:
  - BE
  - VO
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Abgrenzungen in Form von Pauschalbeträgen oder Berechnungen auf der Basis von entgangenem Umsatz oder Gewinn sind nicht angemessen.
unterlagen:
- dokument: 'Rückstellungsspiegel/Detailaufstellung per Bilanzstichtag (je Rückstellung: Konto, Zweck, Anfangsbestand, Bildung, Verwendung, Auflösung, Endbestand, Begründung)'
  zweck: O1-201, O1-301, O1-404; Grundlage Abstimmung mit Saldoliste/JR
  quelle: hwp-bur-2023__rz-0505-s259
  zitat: Der Grundsatz der Ordnungsmässigkeit macht es erforderlich, die Zusammensetzung der Rückstellungen nach sachlichen Kriterien zu dokumentieren.
- dokument: 'Grundlagen je Rückstellung: Verträge, Klageschriften, Mängelrügen, Aktennotizen, Berechnungen'
  zweck: O1-302, O1-403 d)
  quelle: ser-2022__anh-d-s088-1
  zitat: Abstimmung der Bestände mit geeigneten Unterlagen (Verträge, Klageschriften, Berechnungen usw.)
- dokument: Berechnung Garantierückstellung inkl. interner Richtlinie und Erfahrungszahlen (tatsächlicher Garantieaufwand, Garantiedauer)
  zweck: O1-201, O1-302, O1-403
  quelle: hwp-bur-2023__rz-0523-s262
  zitat: Beispielsweise kann bei Serienprodukten die Rückstellung aufgrund von Erfahrungszahlen unter Berücksichtigung der durchschnittlichen vertraglichen oder gesetzlichen Garantiedauer
    ermittelt werden
- dokument: Vom Unternehmen selbst eingeholte Stellungnahmen der Rechtsvertreter/Gutachten (nicht durch die Revisionsstelle anfordern)
  zweck: O1-401, O1-403 c)
  quelle: hwp-er-2026__rz-0139-s204-t3
  zitat: Liegt eine Bestätigung im Zeitpunkt der Abschlusserstellung vor, wird der Abschlussprüfer diese als Prüfungsnachweis betrachten
- dokument: Korrespondenz mit Rechtsanwälten, VR-/GV-Protokolle, Beschlüsse (z.B. Restrukturierung)
  zweck: O1-101, O1-103, O1-302 (Aktenstudium)
  quelle: hwp-er-2026__rz-0119-s201
  zitat: Korrespondenzen mit Rechtsanwälten
- dokument: Kontoblätter Rückstellungskonten und zugehörige Aufwandkonten (inkl. Rechts-/Beratungsaufwand) Berichtsjahr sowie Buchungen/Kreditorenjournal in neuer Rechnung bis Prüfungsdatum
  zweck: O1-303, O1-402, O1-404
  quelle: ser-2022__anh-d-s088-1
  zitat: Kontendurchsicht betreffend die weitere Entwicklung in neuer Rechnung
- dokument: Schriftliche Antworten der Unternehmensleitung auf die Befragung (Rechtsfälle, Ansprüche, Eventualverbindlichkeiten, Schätzungen)
  zweck: O1-101 bis O1-103; Dokumentationspflicht der Befragung
  quelle: ser-2022__6-1-1-t1
  zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
- dokument: Vollständigkeitserklärung (Verbindlichkeiten und Eventualverbindlichkeiten erfasst bzw. offengelegt)
  zweck: O1-103; ergänzende schriftliche Erklärung
  quelle: ser-2022__anh-e-s104-1
  zitat: Wir haben alle gegenwärtigen Verbindlichkeiten sowie Eventualverbindlichkeiten (Garantien, Bürgschaften und vergleichbare Erklärungen gegenüber Dritten) in der Jahresrechnung
    ordnungsgemäss erfasst
- dokument: Nachweis stille Reserven (Bestand und Veränderung je Bilanzposition, inkl. Rückstellungen)
  zweck: O1-321
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: Vorjahres-Rückstellungsspiegel und Vorjahresakte (Schätzung VJ, Verwendung/Auflösung im Berichtsjahr)
  zweck: 'O1-102, O1-201, O1-403: Rückblick auf die Schätzgenauigkeit der Unternehmensleitung'
  quelle: hwp-er-2026__rz-0397-s273
  zitat: Die Erfahrungen aus vorangegangenen Prüfungen können ebenfalls hilfreich sein
- dokument: Versicherungspolicen (Haftpflicht, Rechtsschutz) und Deckungszusagen zu Prozessrisiken; Angaben zu Gegenklagen
  zweck: 'O1-102, O1-320: Bemessung (Erstattungsanspruch separat, Verrechnungsverbot) und Anhangsangabe'
  quelle: hwp-bur-2023__rz-0855-s351-t1
  zitat: allfällige Versicherungsdeckungen und Gegenklagen des Unternehmens
- dokument: Steuerrechnungen, Veranlagungen, Steuerkorrespondenz (Revisionen, Einsprachen) – Schnittstelle Prüffeld Steuern (S1)
  zweck: 'O1-201, O1-301: Steuerrückstellung/-abgrenzung und Steuerrisiken'
  quelle: ser-2022__anh-d-s089-2
  zitat: Feststellung allfälliger Nachforderungen und Risiken, für welche Rückstellungen zu bilden sind
- dokument: Jahresrechnung inkl. Anhang (Berichtsjahr und Vorjahr), Saldoliste mit Vorjahressaldi
  zweck: O1-201, O1-301, O1-320
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
bewertung:
- regel: 'Ansatzpflicht, wenn kumulativ: vergangenes Ereignis, erwarteter Mittelabfluss in künftigen Geschäftsjahren, verlässlich schätzbare Höhe.'
  quelle: hwp-bur-2023__rz-0496-s258
  zitat: müssen gebildet werden, wenn die folgenden Voraussetzungen kumulativ erfüllt sind
- regel: Auch ein erwarteter Minderzufluss (künftiger Verlust, z.B. Drohverlust aus schwebenden Geschäften) begründet eine Rückstellung.
  quelle: hwp-bur-2023__rz-0497-s258
  zitat: Neben einem Mittelabfluss kann auch ein erwarteter Minderzufluss/-erlös (zukünftiger Verlust) eine Rückstellung verursachen.
- regel: 'Abstufung nach Ungewissheit: Verbindlichkeit, passive Rechnungsabgrenzung, Rückstellung, Eventualverbindlichkeit (Anhang) oder kein Ausweis.'
  quelle: hwp-bur-2023__rz-0500-s258
  zitat: im Anhang als Eventualverbindlichkeit offengelegt oder überhaupt nicht ausgewiesen
- regel: Ereignisse sind einzeln zu beurteilen; erheblicher Ermessensspielraum der Unternehmensleitung.
  quelle: hwp-bur-2023__rz-0514-s261
  zitat: Ereignisse, die zu einem zukünftigen Mittelabfluss führen können, sind einzeln zu beurteilen
- regel: Eintretenswahrscheinlichkeit unter 50 % rechtfertigt nicht automatisch den Verzicht; mindestens anteilige Rückstellung prüfen.
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: ein Ereignis bei Eintretenswahrscheinlichkeit von unter 50 % nicht einfach als unwahrscheinlich qualifiziert und auf die Bildung einer Rückstellung verzichtet werden kann
- regel: 'Bemessung nach bestmöglicher Schätzung; Bandbreite genügt als verlässliche Schätzung; Vorsicht: eher oberes Ende der Bandbreite.'
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Die notwendige Höhe der Rückstellung ist aufgrund bestmöglicher Schätzung zu bemessen.
- regel: Bei hohen Beträgen und langen Zeiträumen (z.B. langfristige Garantierückstellungen) kann eine Diskontierung mit anschliessender Aufzinsung sinnvoll sein.
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: Eine Diskontierung des erwarteten Mittelabflusses mit anschliessender Aufzinsung des Rückstellungsbetrags kann bei hohen Beträgen und langen Zeiträumen sinnvoll sein.
- regel: 'Nur ausnahmsweise nicht schätzbar: dann Eventualverbindlichkeit im Anhang statt Rückstellung.'
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Derartige Verbindlichkeiten sind im Anhang als Eventualverbindlichkeiten auszuweisen.
- regel: Bei bestehender Verpflichtung sofort und vollständig bilden, kein Aufbau über mehrere Jahre; handelsrechtlich nötige Rückstellungen auch ohne steuerliche Anerkennung.
  quelle: hwp-bur-2023__rz-0513-s261
  zitat: Bei einer bestehenden Verpflichtung ist eine Rückstellung sofort und in vollem Umfang zu bilden.
- regel: 'Stichtagsprinzip: Ursache vor Stichtag, Kenntnis danach (vor Abschlusserstellung) → zurückstellen; Ursache nach Stichtag → keine Rückstellungspflicht, aber als stille Reserve
    zulässig (→ O1-321).'
  quelle: hwp-bur-2023__rz-0531-s264
  zitat: doch können solche Rückstellungen im schweizerischen Recht gestützt auf die Zulässigkeit stiller Reserven gebildet werden
- regel: Prozessrisiken sind trotz Schwierigkeit abzuschätzen und zurückzustellen; Stellungnahmen der beauftragten Anwälte empfohlen (Erstellerseite).
  quelle: hwp-bur-2023__rz-0526-s263
  zitat: Es empfiehlt sich, bei laufenden Prozessen von den beauftragten Anwältinnen und Anwälten Stellungnahmen über den mutmasslichen Prozessausgang
- regel: 'Bemessung Prozessrisiko: mutmasslicher Ausgang und Höhe der Schadenersatzverpflichtung einschliesslich Prozesskosten.'
  quelle: hwp-bur-2023__rz-0526-s263
  zitat: die Höhe allfälliger Schadenersatzverpflichtungen (einschliesslich Prozesskosten)
- regel: Garantierückstellungen anhand Erfahrungszahlen und Garantiedauer ermitteln.
  quelle: hwp-bur-2023__rz-0523-s262
  zitat: Beispielsweise kann bei Serienprodukten die Rückstellung aufgrund von Erfahrungszahlen unter Berücksichtigung der durchschnittlichen vertraglichen oder gesetzlichen Garantiedauer
    ermittelt werden
- regel: Restrukturierungsrückstellungen erst bei verpflichtendem Beschluss des leitenden Organs und realistisch geschätzt.
  quelle: hwp-bur-2023__rz-0527-s263
  zitat: Die Rückstellungen sollen dann gebildet werden, wenn ein verpflichtender Beschluss des leitenden Organs
- regel: 'Solidarbürgschaften/-schulden: bei Gefährdung des Hauptschuldners oft ganzer Betrag zurückzustellen.'
  quelle: hwp-bur-2023__rz-0529-s264
  zitat: Für Solidarbürgschaften und -schulden ist bei Gefährdung der Hauptschuldnerin bzw. des Hauptschuldners häufig der ganze Betrag zurückzustellen
- regel: Steuernachforderungen (Steuerrevisionen, hängige Rechtsmittelverfahren) je nach Wahrscheinlichkeit zurückstellen.
  quelle: hwp-bur-2023__rz-0547-s269
  zitat: Je nach Wahrscheinlichkeit einer Steuernachforderung ist am Tag der Bilanzerstellung die Höhe der erforderlichen Rückstellung zu schätzen.
- regel: Geschuldete laufende Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den pRA auszuweisen.
  quelle: hwp-bur-2023__rz-0546-s269
  zitat: Geschuldete Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den passiven Rechnungsabgrenzungen auszuweisen.
- regel: 'Ferien- und Überzeitguthaben sind zwingend abzugrenzen (je Mitarbeiter: Guthaben × Stundensatz inkl. Sozialleistungen); Pauschalbeträge sind nicht angemessen.'
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Abgrenzungen in Form von Pauschalbeträgen oder Berechnungen auf der Basis von entgangenem Umsatz oder Gewinn sind nicht angemessen.
- regel: 'Abgrenzung pRA/Rückstellung: Grenzen fliessend; laufende Steuern, Ferien/Überzeit, Boni u.ä. fallen eher unter die pRA.'
  quelle: hwp-bur-2023__rz-0512-s261
  zitat: wobei die Grenzen fliessend sein können
- regel: Ausweis von Ferien-/Überzeitabgrenzungen unter den Rückstellungen ist in der Praxis anzutreffen und ohne Einfluss auf das Periodenergebnis (→ Umgliederungshinweis).
  quelle: qa-or-rechnungslegung-2026__2-2-t2
  zitat: In der Praxis ist auch ein Ausweis unter den Rückstellungen anzutreffen, was jedoch keinen Einfluss auf das Periodenergebnis hat.
- regel: Kurzfristige Rückstellungen dürfen als Teil der pRA oder als separate Position ausgewiesen werden.
  quelle: hwp-bur-2023__rz-0225-s111
  zitat: Kurzfristige Rückstellungen sind als Teil der passiven Rechnungsabgrenzungen oder als separate Position auszuweisen.
- regel: Bildung zulasten der sachlich zugehörigen Aufwandposition; ausserordentliche/einmalige/periodenfremde Bildung als solche erfassen und im Anhang erläutern.
  quelle: hwp-bur-2023__rz-0504-s259
  zitat: Die Bildung einer Rückstellung erfolgt zulasten jener Position der Erfolgsrechnung, welcher der zugrunde liegende Vorgang inhaltlich zufällt.
- regel: Verwendung als Bestandsbuchung nur für artgleiche Posten; nicht benötigte Rückstellungen erfolgswirksam auflösen statt umbenennen.
  quelle: hwp-bur-2023__rz-0507-s259
  zitat: Die Verwendung zweckbestimmter Rückstellungen erfolgt als Bestandsbuchung.
- regel: Beibehaltene, nicht mehr begründete Rückstellungen sind stille Reserven.
  quelle: hwp-bur-2023__rz-0506-s259
  zitat: Werden sie beibehalten, handelt es sich um eine Bildung stiller Reserven
- regel: Ausweis gesondert im Fremdkapital, kurz- oder langfristig nach erwartetem Zeitpunkt des Mittelabflusses; Rückstellungsspiegel im Anhang zweckmässig.
  quelle: hwp-bur-2023__rz-0518-s262
  zitat: Je nach erwartetem Zeitpunkt des Mittelabflusses werden sie als kurzfristiges oder langfristiges Fremdkapital bilanziert.
- regel: Wertberichtigungen sind von Rückstellungen zu unterscheiden und beim Aktivum abzusetzen, nicht unter den Passiven.
  quelle: hwp-bur-2023__rz-0499-s258
  zitat: Die Rückstellungen sind von den Wertberichtigungen zu unterscheiden
- regel: 'Prüfungsmassstab ER für geschätzte Werte: mit dem Regelwerk vereinbar und daher vertretbar (HWP ER III.4.2.8.1.2).'
  quelle: hwp-er-2026__rz-0397-s273
  zitat: ob die durch die Unternehmensleitung geschätzten Werte im zu prüfenden Abschluss mit den Anforderungen des massgebenden Regelwerks der Rechnungslegung vereinbar und daher vertretbar
    sind
- regel: Der Abschlussprüfer prüft Eignung und stetige Anwendung der Bewertungsmethode.
  quelle: hwp-er-2026__rz-0397-s273
  zitat: Eignung der Bewertungsmethode wie auch deren stetige Anwendung prüft
- regel: 'Erfahrungen aus Vorjahren nutzen (Rückblick: Vorjahresschätzung gegenüber tatsächlicher Verwendung/Auflösung).'
  quelle: hwp-er-2026__rz-0397-s273
  zitat: Die Erfahrungen aus vorangegangenen Prüfungen können ebenfalls hilfreich sein
- regel: Geschätzte Werte zum Ausgang von Rechtsstreitigkeiten haben eine relativ hohe Schätzunsicherheit.
  quelle: hwp-er-2026__rz-0395-s272
  zitat: geschätzte Werte im Zusammenhang mit dem Ausgang von Rechtsstreitigkeiten
- regel: 'Nicht vertretbare Schätzung: der Abschlussprüfer (WP) verlangt eine Korrektur, sonst modifizierte Prüfungsaussage; der Agent meldet nur.'
  quelle: hwp-er-2026__rz-0400-s273
  zitat: Gelangt der Abschlussprüfer zum Schluss, dass der durch die Unternehmensleitung geschätzte Wert nicht vertretbar ist, verlangt er eine Korrektur des Abschlusses.
- regel: 'Hohe, bedeutsame Schätzunsicherheit bei völlig offenem Ausgang (z.B. Gerichtsentscheide, Haftungsfälle): Angabe im Anhang; der Abschlussprüfer wirkt auf angemessene Darstellung
    hin.'
  quelle: hwp-er-2026__rz-0402-s273
  zitat: In diesen Fällen wirkt der Abschlussprüfer darauf hin, dass die Angaben im Anhang des Abschlusses die vorhandene Unsicherheit angemessen darstellen.
fallstricke:
- text: 'Anwaltsbestätigungen und Experten-Gutachten sind nicht Bestandteil der eingeschränkten Revision: der Agent fordert sie nie an; nur vom Unternehmen selbst eingeholte Stellungnahmen
    werden als Nachweis verwendet.'
  quelle: hwp-er-2026__rz-0262-s085
  zitat: verlangt die eingeschränkte Revision von der Revisionsstelle weder das Einholen von Debitoren- und Kreditorenbestätigungen noch von Bank- oder Anwaltsbestätigungen oder Experten-Gutachten
- text: Bei wesentlichen Rückstellungen nicht allein auf Befragungen abstützen; mit Analytik und/oder Detailprüfungen ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Eine grosse Bandbreite ist kein Grund, nur eine Eventualverbindlichkeit offenzulegen; ein Betrag unter der eigenen Schätzung der Unternehmensleitung bzw. des Rechtsvertreters
    ist zu hinterfragen.
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Eine grosse Bandbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten
- text: Konten «Rückstellung» für Ferien/Überzeit oder laufende Steuern gehören eher zu den pRA; der Ausweis unter Rückstellungen ist ohne Ergebniswirkung (Q&A 2.2) → nur Umgliederungshinweis.
    Eine pauschale Ferienabgrenzung ist dagegen eine Bewertungsfeststellung.
  quelle: hwp-bur-2023__rz-0512-s261
  zitat: Eher unter die passiven Rechnungsabgrenzungen fallen z.B.
- text: Umwidmung nicht benötigter Rückstellungen (z.B. Garantie in Prozessrisiko) ohne Erfolgsrechnung ist unzulässig.
  quelle: hwp-bur-2023__rz-0508-s260
  zitat: Eine nicht benötigte Garantierückstellung darf auch nicht durch blosse Änderung der Bezeichnung
- text: Kann der Abschlussprüfer die Höhe der noch erforderlichen Rückstellung nicht abschätzen und ist die Auswirkung grundlegend, ist keine Prüfungsaussage möglich (Entscheid WP, Agent
    meldet nur).
  quelle: hwp-er-2026__rz-0139-s204-t3
  zitat: Im Grundsatz gilt, dass immer dann, wenn der Abschlussprüfer die Höhe der noch erforderlichen Rückstellung nicht abschätzen kann
- text: Bei völlig offenem Ausgang von Rechtsstreitigkeiten kann ein Zusatz mit weiteren Informationen im Revisionsbericht in Frage kommen – Entscheid WP.
  quelle: ser-2022__8-3-2-t3
  zitat: dies immer unter der Voraussetzung, dass der Ausgang der hängigen Situation völlig offen ist
- text: Bei hoher Schätzunsicherheit muss der Anhang die Unsicherheit angemessen darstellen; sonst modifiziert der WP die Prüfungsaussage (Agent meldet nur).
  quelle: hwp-er-2026__rz-0402-s273
  zitat: In diesen Fällen wirkt der Abschlussprüfer darauf hin, dass die Angaben im Anhang des Abschlusses die vorhandene Unsicherheit angemessen darstellen.
- text: 'Prozess ohne Rückstellung und ohne Anhangsangabe: SER Anhang F Beispiel 3 zeigt dafür eine verneinende Prüfungsaussage – Beurteilung allein durch den WP.'
  quelle: ser-2022__anh-f-s120-2
  zitat: Entsprechende Angaben im Anhang der Jahresrechnung fehlen.
- text: Stille Reserven in Rückstellungen sind zulässig, fiktive Verbindlichkeiten nicht; eine wesentliche Nettoauflösung ist im Anhang offenzulegen.
  quelle: hwp-bur-2023__rz-0669-s296
  zitat: schliessen es unter anderem aus, Aktiven wegzulassen und fiktive Verbindlichkeiten zu bilanzieren
- text: 'Mängelrügen können sowohl eine Rückstellung als auch eine Wertberichtigung auf der zugehörigen Forderung betreffen: Doppelerfassung bzw. Lücke vermeiden; Wertberichtigungen
    nicht unter den Passiven.'
  quelle: hwp-bur-2023__rz-0180-s100
  zitat: dürfen nicht unter den Passiven ausgewiesen werden
- text: Restrukturierungsaufwand nicht als ausserordentlich ausweisen, wenn Restrukturierungen regelmässig vorkommen.
  quelle: hwp-bur-2023__rz-0522-s262
  zitat: Treten Restrukturierungen mit einer gewissen Regelmässigkeit auf, ist ein derartiger Ausweis nicht sachgerecht.
- text: 'Der Agent bucht nicht: Korrekturbedarf nur als begründeter Buchungsvorschlag unter «Wesentliche Feststellungen»; Visum bleibt offen.'
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- text: 'Rückstellungen nach Stichtag verursachter Verluste sind keine Pflicht, aber als stille Reserven zulässig: nicht als unzulässig beurteilen, sondern in O1-321 erfassen.'
  quelle: hwp-bur-2023__rz-0531-s264
  zitat: doch können solche Rückstellungen im schweizerischen Recht gestützt auf die Zulässigkeit stiller Reserven gebildet werden
- text: Bei Kapitalverlust oder Überschuldung erhöht eine zusätzliche Rückstellung die Unterdeckung; quantifizierte Differenz an Prüffeld Eigenkapital (P1) und den WP melden.
  quelle: or__art-725a
  zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital
- text: Weiter gehende Prüfungshandlungen (WP-Schritte O1-302/O1-303) löst der Agent nicht selbst aus; ob sie angezeigt sind, entscheidet der WP.
  quelle: ser-2022__6-2-3
  zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn
- text: 'Nicht mehr begründete Rückstellungen: handelsrechtlich keine Auflösungspflicht (Art. 960e Abs. 4 OR, stille Reserve → O1-321); steuerlich Zurechnung zum Gewinn (Art. 63 Abs.
    2 DBG). Steuerfolgen nur als Hinweis an Prüffeld S1, keine handelsrechtliche Feststellung.'
  quelle: dbg__art-63
  zitat: Bisherige Rückstellungen werden dem steuerbaren Gewinn zugerechnet, soweit sie nicht mehr begründet sind.
- text: 'Unterdeckung ist keine stille Reserve: Liegt eine Rückstellung oder Abgrenzung unter dem voraussichtlich erforderlichen Betrag, ist das ein möglicher Fehler (Ergebnis zu gut).
    Differenz mit `rechne`: ≥ NAG (bzw. kleiner, wenn in 3.3 qualitative Faktoren erfasst sind) → «Wesentliche Feststellungen» mit Buchungsvorschlag (ohne Verbuchung); < NAG nur Textfeld.
    Stille Reserve ist nur der Teil über dem erforderlichen Betrag (Bestand/Veränderung in O1-321).'
  quelle: or__art-960e
  zitat: so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung gebildet werden
  fundstellen:
  - quelle: hwp-bur-2023__rz-0528-s264
    zitat: Darüber hinausgehende Rückstellungen sind möglich, gelten dann aber als stille Reserven
  schritte:
  - O1-102
  - O1-321
  - O1-403
- text: 'Begriffe nicht vertauschen: Die Höhe wird nach bestmöglicher Schätzung bemessen; das obere Ende der Bandbreite ist der Vorsichtswert. Grosse Grundgesamtheit (z.B. Garantien):
    Erwartungswert. Einzelrisiko (z.B. Rechtsfall): Praxis/intern – wahrscheinlichster Betrag inkl. zu erwartender Verfahrenskosten (Prozesskosten gehören zur Verpflichtung, HWP BuR
    Rz 526). Schätzwert und oberes Ende der Bandbreite getrennt mit `rechne` ausweisen und beschriften; welcher massgebend ist, entscheidet der WP. Keine Fakten ergänzen, die nicht in
    den Unterlagen stehen.'
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Die notwendige Höhe der Rückstellung ist aufgrund bestmöglicher Schätzung zu bemessen.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0515-s261
    zitat: bei einer grossen Grundgesamtheit beispielsweise mithilfe einer mathematischen Formel, die den Wahrscheinlichkeitsgrad berücksichtigt (Erwartungswert)
  - quelle: hwp-bur-2023__rz-0515-s261
    zitat: dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist
  - quelle: hwp-bur-2023__rz-0526-s263
    zitat: Höhe allfälliger Schadenersatzverpflichtungen (einschliesslich Prozesskosten)
  - quelle: konzept-ki-revisionsagent-2026__c005-1
    zitat: fehlende Daten dürfen nicht erfunden werden
  schritte:
  - O1-102
  - O1-403
fragen_kunde:
- frage: 'Bestehen per 31.12. oder seither hängige oder angedrohte Rechtsfälle, Mängelrügen, Schadenersatz- oder andere Ansprüche gegen die Gesellschaft? Bitte je Fall: Gegenpartei,
    Streitgegenstand, Streitwert, Verfahrensstand bzw. Stand im Instanzenzug, Einschätzung des Ausgangs, beauftragter Rechtsvertreter, allfällige Versicherungsdeckungen und Gegenklagen.'
  zweck: O1-101, O1-320; Pendenz bis schriftliche Antwort vorliegt
- frage: Wie hat die Geschäftsleitung das finanzielle Ausmass je Risiko geschätzt (Methode, Bandbreite, wahrscheinlichster Betrag, Anwalts- und Gerichtskosten), weshalb wurde genau der
    gebuchte Betrag gewählt, und wie wurden die Vorjahresrückstellungen tatsächlich verwendet oder aufgelöst?
  zweck: O1-102, O1-403; Nachvollzug der Schätzung
- frage: Gibt es nicht erfasste Verbindlichkeiten oder Eventualverbindlichkeiten (Bürgschaften, Garantien, Patronatserklärungen, Solidarhaftungen, für Dritte bestellte Sicherheiten,
    Rückbau-/Rücknahmeverpflichtungen, verlustbringende schwebende Geschäfte)?
  zweck: O1-103; Erfassung oder Offenlegung im Anhang
- frage: Nach welcher Methode wird die Garantierückstellung ermittelt (Satz, Bemessungsgrundlage, Erfahrungswerte zum tatsächlichen Garantieaufwand, Garantiedauer) und wurde die Methode
    gegenüber dem Vorjahr geändert?
  zweck: O1-201, O1-302, O1-403
- frage: Sind nach dem Bilanzstichtag Zahlungen, Vergleiche, Urteile, Gutschriften oder Kulanzleistungen zu Sachverhalten erfolgt oder absehbar, deren Ursache vor dem Stichtag liegt?
  zweck: O1-303; Ereignisse nach dem Bilanzstichtag
- frage: Gibt es beschlossene Restrukturierungen, bedeutende schwebende Geschäfte (z.B. belastende Liefer-/Abnahmeverträge, Drohverluste) oder andere Ursachen vor dem Stichtag mit Verlustrisiko,
    oder Steuerrisiken aus laufenden Veranlagungen bzw. Revisionen?
  zweck: 'O1-101, O1-303; Vollständigkeit der Rückstellungen (Steuerrisiken: Abstimmung mit S1)'
- frage: Welche Rückstellungen sind betriebswirtschaftlich nicht mehr oder nicht in dieser Höhe erforderlich (stille Reserven), und wie haben sich diese gegenüber dem Vorjahr verändert?
  zweck: O1-321; Nettoauflösung im Anhang
- frage: Hat die Gesellschaft selbst Stellungnahmen von Anwälten oder Gutachten zu Rechtsfällen oder Schätzungen eingeholt? Falls ja, bitte zur Verfügung stellen.
  zweck: O1-401, O1-403 c); Revisionsstelle fordert solche Bestätigungen nicht selbst an
