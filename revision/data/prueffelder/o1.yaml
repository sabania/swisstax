- id: O1-103
  vorgehen: 'Schriftliche Antworten und Vollständigkeitserklärung zu nicht erfassten Verbindlichkeiten/Eventualverbindlichkeiten auswerten; Hinweise aus Bankbestätigungen (Garantien,
    Sicherheiten), Verträgen und Protokollen sammeln. Typische Eventualverbindlichkeiten gezielt durchsehen (HWP BuR Rz 855): Patronatserklärungen, Konventionalstrafen, Unterdeckung
    der Vorsorgeeinrichtung, Solidarschulden (einfache Gesellschaft/ARGE; MWST-Gruppe, Art. 15 Abs. 1 Bst. c MWSTG). Garantien des Unternehmens für Dritte → Anhang Art. 959c Abs. 2 Ziff.
    8 OR (HWP BuR Rz 705). Je Sachverhalt Einordnung nach Ungewissheit (Verbindlichkeit/Rückstellung/Eventualverbindlichkeit/kein Ausweis) vorschlagen und mit Bilanz/Anhang abgleichen;
    offene Punkte als Pendenz bzw. Schlussbesprechung. Auch ohne schriftliche Antwort vorhandene Unterlagen auswerten (Bankbelege/-bestätigungen Abschnitt Garantien und Sicherheiten,
    Kredit- und Mietverträge, Protokolle, Anhang). Je Garantie/Bürgschaft Begünstigten, gesicherte Verpflichtung (eigene oder eines Dritten), Betrag, Laufzeit und Sicherheit notieren
    und Anhangsziffer vorschlagen: (a) Sicherheit für Verbindlichkeiten Dritter → Art. 959c Abs. 2 Ziff. 8 OR; (b) eigene Aktiven als Sicherheit (z.B. verpfändetes oder gesperrtes Konto)
    → Ziff. 9; (c) mögliche Inanspruchnahme aus eigener Verpflichtung: Mittelabfluss unwahrscheinlich oder nicht verlässlich schätzbar → Ziff. 10 (Eventualverbindlichkeit), wahrscheinlich
    und schätzbar → Rückstellung. Zuordnung ist Vorschlag, Entscheid WP (Praxis/intern).'
  nachweise:
  - schriftliche Antwort Unternehmensleitung
  - Vollständigkeitserklärung
  - Bankbestätigungen (Garantien, Sicherheiten)
  - Verträge/Protokolle
  - Anhang
  rechnen: 'Je Anhangsziffer mit `rechne`: Σ Haftungsbeträge laut Unterlagen − Betrag laut Anhang = 0; fehlt die Angabe ganz, ist der Soll-Betrag Σ Unterlagen.'
  feststellung_wenn: Verpflichtung mit wahrscheinlichem Mittelabfluss nicht passiviert, oder Eventualverbindlichkeit/Sicherheit für Dritte nicht im Anhang offengelegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach rechtlichen oder tatsächlichen Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt
      werden kann
  - quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
      (Eventualverbindlichkeit)
  - quelle: hwp-bur-2023__rz-0500-s258
    zitat: Je nach Grad ihrer Ungewissheit werden rechtliche oder faktische Verpflichtungen handelsrechtlich als Verbindlichkeit, passive Rechnungsabgrenzungen oder Rückstellung in der
      Bilanz erfasst
  - quelle: ser-2022__anh-e-s104-1
    zitat: Wir haben alle gegenwärtigen Verbindlichkeiten sowie Eventualverbindlichkeiten (Garantien, Bürgschaften und vergleichbare Erklärungen gegenüber Dritten) in der Jahresrechnung
      ordnungsgemäss erfasst
  - quelle: hwp-bur-2023__rz-0855-s351-t2
    zitat: Aus einer Patronatserklärung zugunsten einer Beteiligung ergibt sich ggf. als auszuweisende Eventualverbindlichkeit der Betrag
  - quelle: hwp-bur-2023__rz-0855-s351-t2
    zitat: Hat sich ein Unternehmen zur Leistung von Konventionalstrafen verpflichtet
  - quelle: hwp-bur-2023__rz-0855-s351-t2
    zitat: Ergibt sich aus einer Unterdeckung bei einer Vorsorgeeinrichtung eine Eventualverbindlichkeit
  - quelle: hwp-bur-2023__rz-0855-s351-t3
    zitat: Häufig treten Solidarschulden im Zusammenhang mit der gruppenweisen Abrechnung der Mehrwertsteuer auf.
  - quelle: mwstg__art-15-t1
    zitat: jede zu einer Mehrwertsteuergruppe (Art. 13) gehörende Person oder Personengesellschaft, mit Ausnahme von Vorsorgeeinrichtungen, für sämtliche von der Gruppe geschuldeten
      Steuern
  - quelle: hwp-bur-2023__rz-0705-s302
    zitat: Garantieverpflichtung im Anhang der Jahresrechnung als Teil des
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0839-s346
    zitat: Als Sicherheiten sind insbesondere Bürgschaften, Garantieverpflichtungen, Pfandbestellungen, Sicherungszessionen und Sicherungsübereignungen zu verstehen.
  - quelle: hwp-bur-2023__rz-0854-s350
    zitat: Entstehen aus demselben Sachverhalt sowohl eine Rückstellung wie eine Eventualverbindlichkeit, ist es nicht ausreichend, aufgrund der gebildeten Rückstellung auf die Angaben
      zu einer eventuell deutlich höheren Eventualverbindlichkeit
  notiz: 'Fehlende oder zu tiefe Anhangsangabe: Betrag ≥ NAG (bzw. kleiner, wenn in 3.3 qualitative Faktoren erfasst sind) → «Wesentliche Feststellungen» (Korrekturvorschlag Anhang,
    keine Buchung); sonst nur Textfeld. Klassierung unklar (Ziff. 8/9/10 oder Rückstellung) → «Schlussbesprechung» mit Vorschlag; Unterlage fehlt → «Pendenz».'
- id: O1-201
  vorgehen: 'Rückstellungskonten aus der Saldoliste (31.12. Berichtsjahr vs. Vorjahr) je Konto vergleichen; Anfangsbestände des Rückstellungsspiegels mit den Vorjahressaldi abstimmen;
    Garantierückstellung mit Umsatz und Garantieaufwand plausibilisieren. Erklärungen aus vorhandenen schriftlichen Antworten/Unterlagen entnehmen; fehlt eine Erklärung → Frage als Pendenz
    (Kundenbefragung über WP). Steuerrückstellung: Hinweis an S1. Tabelle im Textfeld.'
  nachweise:
  - Saldoliste mit Vorjahressaldi
  - Rückstellungsspiegel
  - Jahresrechnung Vorjahr
  - Erfolgskonten Garantieaufwand/Umsatz
  rechnen: 'Je Konto: Veränderung = Saldo 31.12. Berichtsjahr − Saldo 31.12. Vorjahr (absolut/%); Stand 01.01. Rückstellungsspiegel = Saldo 31.12. Vorjahr; Quote Garantierückstellung
    / Umsatz Berichtsjahr vs. Vorjahr.'
  feststellung_wenn: Wesentliche Veränderung ohne plausible Erklärung, Anfangsbestand ≠ Vorjahressaldo oder Quote Garantierückstellung weicht ohne Begründung von Erfahrung/Vorjahr ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s088-1
    zitat: Vergleich mit den Beständen des Vorjahres
  - quelle: ser-2022__4-3-5
    zitat: Bei der Prüfung der Rückstellungen sind Befragungen und analytische Prüfungshandlungen (z. B. bei Garantierückstellungen) taugliche Prüfungshandlungen.
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
- id: O1-301
  vorgehen: 'Rückstellungsspiegel mit Saldoliste, Hauptbuch und Bilanzposition der JR abstimmen, Zeilenarithmetik nachrechnen. Kritische Durchsicht: Zweck und Begründung je Position,
    vergangenes Ereignis, Bemessungsgrundlage (pauschal?), Abgrenzung zu pRA und Wertberichtigungen, Fristigkeit. Steuerrückstellung/-abgrenzung: klären, wo laufende Steuern abgegrenzt
    sind (Prüffeld S1). Abweichungen im Textfeld. Kontoblätter der Rückstellungskonten lesen: Gegenkonto jeder Bildung und Auflösung notieren (Bildung über den sachlich zugehörigen Aufwand;
    Verwendung nur artgleich); Auffälligkeiten als Hinweis (Detail O1-404/O1-405 auf Anweisung).'
  nachweise:
  - Rückstellungsspiegel
  - Saldoliste
  - Kontoblätter Rückstellungskonten
  - Jahresrechnung (Bilanz)
  rechnen: 'Je Zeile: Anfang + Bildung − Verwendung − Auflösung = Ende; Summe Endbestände je Gruppe = Saldo Konten (z.B. 2330 bzw. 2630) gemäss Saldoliste = Bilanzposition JR. Σ Bildungen
    laut Kontoblatt = Bildung laut Spiegel.'
  feststellung_wenn: Differenz Spiegel ↔ Saldoliste/JR, Rechenfehler, Position ohne erkennbaren Zweck/Grundlage, pauschale Bemessung oder Wertberichtigung unter Rückstellungen; pRA unter
    Rückstellungen → Umgliederungshinweis (O1-405).
  fundstellen:
  - quelle: ser-2022__anh-d-s088-1
    zitat: Abstimmung einer Detailaufstellung mit der Jahresrechnung und kritische Durchsicht
  - quelle: hwp-bur-2023__rz-0505-s259
    zitat: Der Grundsatz der Ordnungsmässigkeit macht es erforderlich, die Zusammensetzung der Rückstellungen nach sachlichen Kriterien zu dokumentieren.
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
  - quelle: hwp-bur-2023__rz-0501-s258
    zitat: Rückstellungen lassen sich von Rechnungsabgrenzungen (vgl. III.2.13) dadurch unterscheiden, dass bei ihnen Unsicherheiten bezüglich des Zeitpunkts und/oder der Höhe
  - quelle: ser-2022__anh-d-s089-2
    zitat: Feststellung allfälliger Nachforderungen und Risiken, für welche Rückstellungen zu bilden sind
