  - quelle: hwp-bur-2023__rz-0504-s259
    zitat: Die Bildung einer Rückstellung erfolgt zulasten jener Position der Erfolgsrechnung, welcher der zugrunde liegende Vorgang inhaltlich zufällt.
  notiz: 'Eine Notiz je Sachverhalt (nicht doppelt in mehreren Kategorien): Bewertungsfehler mit Ergebniswirkung ≥ NAG (fehlende oder zu tiefe Abgrenzung/Rückstellung, Ferien ohne Sozialleistungen)
    → «Wesentliche Feststellungen» mit Buchungsvorschlag (Aufwand an pRA/Rückstellung; ohne Verbuchung); < NAG nur Textfeld. Reiner Ausweis ohne Ergebniswirkung (z.B. Ferien unter Rückstellungen)
    → «Schlussbesprechung». Fehlende Liste oder Unterlage → «Pendenz» (Konto, Datum, Betrag).'
- id: O1-302
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten. Bei Anzeichen erhöhten Risikos (z.B. angekündigte Klage, Rückstellung unter der Bandbreite) meldet der Agent
    dem WP, dass weiter gehende Handlungen nach SER 6.2.3 angezeigt sein können (Notiz Pendenz). Mit Anweisung: je Rückstellung Grundlagen in M-Files suchen, Ereignis vor Stichtag, Verpflichtung
    gegenüber Dritten und Berechnung prüfen; Fehlendes als Pendenz.'
  nachweise:
