      verpflichtet sind.
  - quelle: or__art-959c-t3
    zitat: Werden in den Vorschriften zur Mindestgliederung von Bilanz und Erfolgsrechnung zusätzliche Angaben gefordert und wird auf die Erstellung eines Anhangs verzichtet, so sind
      diese Angaben direkt in der Bilanz oder in der Erfolgsrechnung auszuweisen.
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die angewandten Grundsätze, soweit diese
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben zu Firma oder Namen sowie Rechtsform und Sitz des
  - quelle: hwp-bur-2023__rz-0819-s343
