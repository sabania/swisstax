- id: T1-106
  vorgehen: Frage nach verpfändeten/abgetretenen Aktiven und Aktiven unter Eigentumsvorbehalt als Pendenz bzw. Antwort auswerten. Bankbestätigungen (Sicherheiten zugunsten Bank, Zessionen,
    Pfandrecht bei Kredit), Kredit- und Pfandverträge durchsehen; Buchwerte der belasteten Aktiven aus der Saldoliste summieren und mit Anhang vergleichen.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Bankbestätigungen
  - Kredit-, Pfand-, Zessionsverträge
  - Saldoliste (Buchwerte)
  - Anhang
  rechnen: Summe Buchwerte verpfändeter/abgetretener Aktiven (inkl. zedierte Debitoren, Guthaben bei kreditgebender Bank) sowie separat Aktiven unter Eigentumsvorbehalt = Anhangsangabe
    Ziff. 9
  feststellung_wenn: Belastete Aktiven (z.B. Zession, verpfändetes Depot, Guthaben bei kreditgebender Bank) nicht oder nicht zu Buchwerten im Anhang.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0846-s349
    zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen
  - quelle: hwp-bur-2023__rz-0847-s349-t2
    zitat: stellt diese Verpfändung einen ausweispflichtigen Tatbestand dar
- id: T1-107
  vorgehen: Frage nach Rechtsfällen, Gewährleistungsrisiken, Konventionalstrafen und Solidarhaftungen als Pendenz bzw. Antwort auswerten. Aktennotizen, Anwaltskorrespondenz und Rückstellungsspiegel
    durchsehen; je Sachverhalt festhalten, ob Rückstellung (wahrscheinlich, schätzbar) oder Anhangsangabe (Umschreibung, möglicher Umfang). Beurteilung dem WP vorlegen.
  nachweise:
  - Schriftliche Antwort VR/GF, Vollständigkeitserklärung
  - Aktennotizen/Anwaltskorrespondenz
  - Rückstellungsspiegel
  - Anhang
  rechnen: 'Je Sachverhalt: Obergrenze der möglichen Inanspruchnahme vs. gebildete Rückstellung; übersteigender Betrag = Hinweis für Anhangsangabe'
  feststellung_wenn: Sachverhalt mit möglichem Mittelabfluss weder zurückgestellt noch im Anhang umschrieben, oder Verzicht auf Rückstellung nur wegen grosser Bandbreite.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach rechtlichen oder tatsächlichen Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint
  - quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
      (Eventualverbindlichkeit)
  - quelle: hwp-bur-2023__rz-0853-s350
    zitat: Eine grosse Spannbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten
  - quelle: hwp-bur-2023__rz-0854-s350
    zitat: umfasst die Offenlegung im Anhang der Jahresrechnung eine Umschreibung der rechtlichen oder faktischen Verpflichtung
- id: T1-108
  vorgehen: Frage nach im Geschäftsjahr an VR, Geschäftsleitung oder Mitarbeitende zugeteilten Aktien/Optionen als Pendenz bzw. Antwort auswerten. Aktienbuch, Lohnunterlagen und VR-Protokolle
    auf Zuteilungen durchsehen; Anzahl und Wert getrennt nach Organen/Mitarbeitenden und nach Rechten/Optionen mit Anhang abgleichen.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Beteiligungs-/Optionspläne
  - Aktienbuch
  - Lohnunterlagen
  - VR-Protokolle
  rechnen: Anzahl × Wert je Kategorie (Kurswert, Steuerwert oder finanzmathematisch – nicht Nennwert)
  feststellung_wenn: Zuteilungen im Berichtsjahr ohne Anhangsangabe oder ohne Trennung Organe/Mitarbeitende; Bewertung zum Nennwert.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach im Geschäftsjahr an Leitungs- und Verwaltungsorgane oder Mitarbeitende ausgegebenen Beteiligungsrechten oder Optionen
  - quelle: or__art-959c-t2
    zitat: Anzahl und Wert von Beteiligungsrechten oder Optionen auf solche Rechte für alle Leitungs- und Verwaltungsorgane sowie für die Mitarbeitenden
  - quelle: hwp-bur-2023__rz-0858-s352-t1
    zitat: dass im Anhang nur die im Berichtsjahr zugeteilte Anzahl von Beteiligungsrechten und Optionen auf solche Rechte sowie deren Werte
- id: T1-109
  vorgehen: 'Frage nach wesentlichen Ereignissen nach dem Stichtag (Ursache vor/nach Stichtag, quantitative Auswirkung) als Pendenz bzw. Antwort auswerten, möglichst nahe am Berichtsdatum.
    Kontoblätter/Kontoauszüge Folgejahr und VR-/GV-Protokolle durchsehen; je Ereignis: buchungspflichtig (Ursache vor Stichtag) oder Anhangsangabe (Art, geschätzte Auswirkung).'
  nachweise:
  - Schriftliche Antwort VR/GF, Vollständigkeitserklärung
  - Kontoblätter und Kontoauszüge Folgejahr
  - Kreditorenjournal Folgejahr
  - VR-/GV-Protokolle nach Stichtag
  rechnen: Quantitative Auswirkung je Ereignis (z.B. Ausbuchung, Gutschrift, Verlust im Folgejahr) vs. Toleranzwesentlichkeit
  feststellung_wenn: Ereignis mit Ursache vor Stichtag nicht gebucht, oder wesentliches Ereignis nach Stichtag nicht im Anhang bzw. ohne geschätzte Auswirkung.
  fundstellen:
  - quelle: ser-2022__anh-d-s100-1
    zitat: Befragung zu bedeutenden schwebenden Geschäften und anderen Ursachen, die vor
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach anderen wesentlichen positiven oder negativen Ereignissen nach
  - quelle: hwp-er-2026__rz-0321-s255-t1
    zitat: Der Abschlussprüfer befragt die Unternehmensleitung zu allfälligen eingetretenen Ereignissen, die Anpassungen des Abschlusses oder Angaben im Abschluss erfordern.
  - quelle: hwp-bur-2023__rz-0861-s353
    zitat: Tritt die auslösende Ursache erst nach dem Bilanzstichtag ein, wird das Ereignis grundsätzlich nicht in der Jahresrechnung erfasst, ist aber im Anhang ausweispflichtig.
- id: T1-110
  vorgehen: Frage, ob die Statuten ein Kapitalband vorsehen und der VR im Geschäftsjahr Erhöhungen/Herabsetzungen vorgenommen hat, als Pendenz bzw. Antwort auswerten. Statuten, HR-Auszug,
    VR-Beschlüsse und Konto Aktienkapital prüfen; Bandbreite, Laufzeit und Veränderungen mit Anhang abgleichen. Ordentliche Kapitalerhöhungen durch die GV gesondert kennzeichnen.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Statuten, HR-Auszug
  - VR-Beschlüsse/Kapitalerhöhungsberichte
  - Saldoliste Aktienkapital
  rechnen: Aktienkapital Vorjahr ± Veränderungen (GV-Beschlüsse und Kapitalband getrennt) = Aktienkapital Stichtag gemäss Saldoliste und HR
  feststellung_wenn: Kapitalveränderung durch den VR im Kapitalband ohne Anhangsangabe (Bandbreite, Laufzeit, Veränderungen) oder Widerspruch zu HR/Statuten.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-2
    zitat: der Verwaltungsrat innerhalb eines Kapitalbands vorgenommen hat
  - quelle: or__art-959c-t2
    zitat: alle Kapitalerhöhungen und Kapitalherabsetzungen, die der Verwaltungsrat innerhalb eines Kapitalbands vorgenommen hat
  - quelle: hwp-bur-2023__rz-0869-s356
    zitat: Im Anhang sind die in den Statuten festgelegte Bandbreite, deren Laufzeit sowie die erfolgten Erhöhungen und Herabsetzungen
- id: T1-111
  vorgehen: Frage nach Methode und Nachweis der stillen Reserven (Aufstellung Bestand/Veränderung je Bilanzposition, Stetigkeit zum Vorjahr) als Pendenz bzw. Antwort auswerten; Aufstellung
    in M-Files suchen. Bestand und Veränderung mit den Prüfungsresultaten der Einzelpositionen (Vorräte, Anlagen, Rückstellungen, Wertberichtigungen) plausibilisieren; Ergebnis als Grundlage
    für T1-305 dokumentieren.
  nachweise:
  - Aufstellung stille Reserven aktuell und Vorjahr
  - Arbeitspapiere der Prüffelder (Vorräte, Anlagen, Rückstellungen)
  - Vollständigkeitserklärung
  rechnen: 'Je Position: stille Reserve = gesetzlich zulässiger Höchstwert bzw. erforderlicher Betrag minus Buchwert (Passiven umgekehrt); Total Stichtag − Total Vorjahr = Bildung (+)
    bzw. Auflösung (−)'
  feststellung_wenn: Keine Aufstellung oder Methode, Methodenwechsel ohne Begründung, oder Widerspruch zu Prüfungsresultaten der Einzelpositionen → Pendenz an WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr und Plausibilisierung mit den Prüfungsresultaten
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz
  - quelle: ser-2022__anh-e-s104-1
    zitat: Bildung, Auflösung und Bestand stiller Reserven haben wir Ihnen im Einzelnen mitgeteilt (Art. 959c Abs. 1 Ziff. 3 OR).
- id: T1-112
  vorgehen: Frage, ob im Geschäftsjahr die Revisionsstelle vorzeitig zurückgetreten ist oder abberufen wurde, als Pendenz bzw. Antwort auswerten. GV-Protokolle (Wahl, Amtsdauer), HR-Auszug
    und Mandatsunterlagen durchsehen; falls zutreffend Rücktrittsschreiben beschaffen (→ T1-402). Sonst «nicht zutreffend» mit Nachweis dokumentieren.
  nachweise:
  - Schriftliche Antwort VR/GF
  - GV-Protokolle
  - HR-Auszug
  - Rücktrittsschreiben (falls vorhanden)
  rechnen: ''
  feststellung_wenn: Vorzeitiger Rücktritt oder Abberufung im Geschäftsjahr ohne Angabe der Gründe im Anhang; Sachverhalt unklar → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung zu Gründen für einen vorzeitigen Rücktritt der Revisionsstelle (falls Rücktritt der Revisionsstelle im Geschäftsjahr erfolgt ist) oder zu Gründen der Abberufung
      der Revisionsstelle
  - quelle: or__art-959c-t2
    zitat: 'bei einem vorzeitigen Rücktritt oder einer Abberufung der Revisionsstelle: die Gründe, die dazu geführt haben'
  - quelle: hwp-bur-2023__rz-0868-s355-t2
    zitat: Ein vorzeitiger Rücktritt liegt vor, wenn die Revisionsstelle vor Ablauf der Amtsdauer zurücktritt, ohne dass sie der Generalversammlung Bericht über die Revision erstattet.
- id: T1-301
  vorgehen: 'Anhang der definitiven Jahresrechnung (M-Files/revio 1.1) gegen Gliederung Art. 959c OR prüfen: Hinweis auf Rechnungslegungsrecht, angewandte Grundsätze, Erläuterungen zu
    Bilanz/ER, Nettoauflösung stiller Reserven, weitere gesetzliche Angaben, Pflichtangaben Abs. 2 inkl. Firma/Rechtsform/Sitz und Vorjahresangaben. Checkliste «vorhanden/nicht zutreffend/fehlt»
    im Textfeld festhalten.'
  nachweise:
  - Definitive, vom VR genehmigte Jahresrechnung inkl. Anhang
  - Anhang Vorjahr
  - Checkliste Art. 959c OR
  rechnen: ''
  feststellung_wenn: Pflichtbestandteil fehlt, Firma/Rechtsform/Sitz nicht ersichtlich, Vorjahresangaben fehlen oder Gliederung unvollständig.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Der Anhang der Jahresrechnung ergänzt und erläutert die anderen Bestandteile der Jahresrechnung.
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die angewandten Grundsätze, soweit diese
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben zu Firma oder Namen sowie Rechtsform und Sitz des
  - quelle: hwp-bur-2023__rz-0810-s337
    zitat: gelten auch für die Darstellung der Positionen im Anhang (Angaben zum Geschäftsjahr und zum Vorjahr)
- id: T1-302
  vorgehen: Im Anhang beschriebene Grundsätze (z.B. Bewertung Vorräte und angefangene Arbeiten, Umsatzerfassung, Rückstellungen, Fremdwährung) mit den in den Prüffeldern festgestellten
    tatsächlichen Methoden vergleichen; Änderungen gegenüber Vorjahr identifizieren und Begründung im Anhang prüfen. Abweichungen mit Verweis auf das betroffene Prüffeld im Textfeld
    dokumentieren.
  nachweise:
  - Anhang (Grundsätze, Bewertung)
  - Arbeitspapiere der Prüffelder (Vorräte, angefangene Arbeiten, Anlagen, Rückstellungen)
  - Anhang Vorjahr
  rechnen: ''
  feststellung_wenn: Beschriebene Methode weicht von der angewandten ab, Methodenwechsel nicht begründet/offengelegt, oder wesentliche Wahlrechte nicht beschrieben.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
  - quelle: hwp-bur-2023__rz-0814-s338
    zitat: Darunter sind die Wahlmöglichkeiten in der Erfassung, Darstellung und Bewertung zu verstehen (Accounting policies).
  - quelle: hwp-bur-2023__rz-0059-s070
    zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden (Art. 959c Abs. 1 Ziff. 1 OR).
- id: T1-303
  vorgehen: Jede betragsmässige Anhangsangabe (Aufschlüsselungen, nahestehende Parteien, a.o. Positionen, Mietverpflichtungen, Vorjahr) mit Bilanz, Erfolgsrechnung und Saldoliste abstimmen
    und Summen nachrechnen. Differenzen je Angabe mit Konto und Betrag im Textfeld festhalten.
  nachweise:
  - Anhang
  - Bilanz und Erfolgsrechnung
  - Saldoliste 2025 und Vorjahr
  rechnen: 'Je Aufschlüsselung: Summe Einzelangaben Anhang = zugehörige Position Bilanz/ER = Summe Konten Saldoliste (Geschäftsjahr und Vorjahr); Differenz ≠ 0 ausweisen'
  feststellung_wenn: Rechen- oder Abstimmungsdifferenz zwischen Anhang und Bilanz/ER/Saldoliste (inkl. Vorjahr) oder Summenfehler im Anhang.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
  - quelle: or__art-959c-t1
    zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
  - quelle: or__art-958d
    zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- id: T1-304
  vorgehen: 'Anhangsangabe (nicht über 10 / über 50 / über 250) mit Personalliste, Lohnjournal bzw. AHV-Lohnmeldung plausibilisieren: Jahresdurchschnitt aus Monats- oder Quartalsendbeständen,
    Teilzeit anteilig, nur Mitarbeitende mit Arbeitsvertrag beim Unternehmen. Vorjahresangabe und Bedeutung für Opting-out/Revisionspflicht für den WP vermerken.'
  nachweise:
  - Personalliste/Lohnjournal mit Pensen, Ein- und Austritten
  - AHV-Jahreslohnmeldung
  - Anhang
  rechnen: FTE-Jahresdurchschnitt = Σ (Pensum × Beschäftigungsmonate im Jahr) / 12; Einordnung in Schwelle ≤ 10 / > 50 / > 250
  feststellung_wenn: Berechneter Jahresdurchschnitt liegt in einer anderen Schwelle als die Anhangsangabe, oder Angabe fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Plausibilisierung der Angabe der Vollzeitstellen (weniger als 10, über 50 beziehungsweise über 250) im Jahresdurchschnitt
  - quelle: or__art-959c-t1
    zitat: eine Erklärung darüber, ob die Anzahl Vollzeitstellen im Jahresdurchschnitt nicht über 10, über 50 beziehungsweise über 250 liegt
  - quelle: hwp-bur-2023__rz-0822-s344
    zitat: Für die Ermittlung der Anzahl Stellen ist die rechtliche Stellung der Mitarbeitenden massgebend.
  - quelle: hwp-bur-2023__rz-0823-s344
    zitat: Teilzeitmitarbeitende können anteilig berücksichtigt werden.
- id: T1-305
  vorgehen: 'Veränderung der stillen Reserven aus T1-111 übernehmen; bei Nettoauflösung prüfen, ob das Ergebnis dadurch wesentlich günstiger dargestellt wird (Vergleich mit Wesentlichkeit
    3.3). Falls ja: Gesamtbetrag der Nettoauflösung im Anhang abgleichen. Zwangs- und Schwankungsreserven ausklammern; Wesentlichkeitsurteil dem WP vorlegen.'
  nachweise:
  - Aufstellung stille Reserven (T1-111)
  - Wesentlichkeit (3.3)
  - Anhang
  rechnen: Nettoauflösung = Total stille Reserven Vorjahr − Total Stichtag (falls > 0); Vergleich mit Gesamtwesentlichkeit; Anhangsbetrag = Nettoauflösung
  feststellung_wenn: Wesentliche Nettoauflösung ohne Anhangsangabe oder mit abweichendem Betrag; Ermittlungsunterlagen fehlen → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die Nettoauflösung von stillen Reserven (wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird)?
  - quelle: or__art-959c-t1
    zitat: soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven übersteigt, wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
  - quelle: hwp-bur-2023__rz-0817-s341-t1
    zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
  - quelle: muster-hwp-er-2026__c025-1
    zitat: Nettoauflösung stiller Reserven im Anhang nicht offengelegt
- id: T1-306
  vorgehen: 'Prüfen, ob zutreffende weitere Angaben offengelegt sind: Abweichungen von Stetigkeit und Fortführung, Umrechnungskurse bei Fremdwährungsabschluss, Bewertung zu Börsen-/Marktpreisen
    und Schwankungsreserven, Aufwertungen (Art. 725c OR), Angaben nach Spezialgesetzen (z.B. FusG). Je Punkt «zutreffend/nicht zutreffend» mit Nachweis (Saldoliste, Bewertungsgrundlagen,
    Protokolle) dokumentieren.'
  nachweise:
  - Anhang
  - Saldoliste/Bewertungsunterlagen
  - VR-/GV-Protokolle
  - Arbeitspapiere übrige Prüffelder
  rechnen: ''
  feststellung_wenn: Ein zutreffender Sachverhalt (Methodenwechsel, Fortführungsabweichung, Fremdwährung, Kursbewertung, Schwankungsreserve, Aufwertung, FusG) ist im Anhang nicht oder
    unvollständig offengelegt.
  fundstellen:
  - quelle: or__art-958d
    zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
  - quelle: ser-2022__anh-d-s098-3
    zitat: Weist der Anhang darauf hin, dass ggf. Aktiven zum Börsenkurs oder beobachtbaren
  - quelle: or__art-960b
    zitat: Der Betrag der Schwankungsreserven ist insgesamt in der Bilanz oder im Anhang gesondert auszuweisen.
  - quelle: hwp-bur-2023__rz-0818-s342-t2
    zitat: Angaben über Gegenstand und Betrag von Aufwertungen nach Art. 725c OR.
  - quelle: hwp-bur-2023__rz-0818-s342-t2
    zitat: Angaben gemäss Spezialgesetzen.
- id: T1-307
  vorgehen: Beurteilen, ob für Dritte wesentliche oder branchenübliche Zusatzangaben in Bilanz, ER oder Anhang fehlen (z.B. Rangrücktritte, Verfügungsbeschränkungen wie Mietkautionen,
    Zusammensetzung wesentlicher Sammelpositionen, Rückstellungsspiegel). Sachverhalte aus den übrigen Prüffeldern sammeln und im Textfeld als Vorschlag an den WP festhalten.
  nachweise:
  - Bilanz, ER, Anhang
  - Arbeitspapiere übrige Prüffelder
  - Rangrücktrittsvereinbarungen, Verträge mit Verfügungsbeschränkungen
  rechnen: ''
  feststellung_wenn: Für die Beurteilung der Vermögens-, Finanz- oder Ertragslage wesentlicher Sachverhalt (z.B. Rangrücktritt) weder in Bilanz/ER noch im Anhang erläutert.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Werden die für die Beurteilung der Vermögens-, Finanz- und Ertragslage durch Dritte
  - quelle: or__art-959a-t2
    zitat: Weitere Positionen müssen in der Bilanz oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Vermögens- oder Finanzierungslage durch Dritte wesentlich
  - quelle: or__art-959b-t2
    zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
  - quelle: hwp-er-2026__rz-0430-s127
    zitat: Der Umstand, dass ein Gläubiger dem Unternehmen für seine Forderung einen Rangrücktritt gewährt hat, ist für die Beurteilung der Vermögens- und Finanzierungslage durch Dritte
      wesentlich
- id: T1-308
  vorgehen: 'Weiter gehende Prüfungshandlung (Kennzeichnung WP; nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem Risiko): Agent bereitet für jede betragsmässige Anhangsangabe
    die Belege aus M-Files vor (Verträge, Bank- und Saldobestätigungen, Aufstellungen) und stellt Anhangsbetrag und Belegbetrag gegenüber; Auswahl und Umfang legt der WP fest.'
  nachweise:
  - Belege je Anhangsposten (Verträge, Bestätigungen, Aufstellungen)
  - Anhang
  rechnen: 'Je Anhangsposten: Betrag Anhang − Betrag gemäss Beleg = Differenz'
  feststellung_wenn: Anhangsbetrag nicht durch Beleg gestützt oder Differenz zum Beleg; Beleg fehlt → PBC-Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s099-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen oder anderen geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s099-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- id: T1-309
  vorgehen: Anhangsangabe der Verbindlichkeiten gegenüber Vorsorgeeinrichtungen mit Kontoauszug bzw. Saldobestätigung der Vorsorgeeinrichtung per 31.12. und mit dem Konto BVG (Saldoliste/Hauptbuch)
    abstimmen; Dezemberbeiträge und Schlussabrechnung berücksichtigen. Fehlender Auszug → PBC-Pendenz.
  nachweise:
  - Kontoauszug/Saldobestätigung Vorsorgeeinrichtung per 31.12.
  - Hauptbuch Konto BVG
  - Anhang
  rechnen: Saldo gemäss Kontoauszug Vorsorgeeinrichtung per 31.12. = Passivsaldo Konto BVG = Anhangsangabe
  feststellung_wenn: Differenz zwischen Kontoauszug, Buchsaldo und Anhang, oder Kontoauszug nicht vorhanden.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: hwp-bur-2023__rz-0838-s346
    zitat: Der Ausweis eines Gesamtbetrags genügt üblicherweise.
- id: T1-310
  vorgehen: Konten ausserordentlicher, einmaliger und periodenfremder Aufwand/Ertrag (Saldoliste, Hauptbuch) mit der Anhangserläuterung abgleichen; Identifikationskriterien mit Vorjahr
    vergleichen und prüfen, ob wesentliche Posten (Ursache, Betrag) erläutert sind. Einmalige Vorgänge aus anderen Prüffeldern (z.B. Kulanz, Nachbuchungen Vorjahr, Anlagenverkäufe) einbeziehen.
  nachweise:
  - Saldoliste und Hauptbuch a.o. Konten
  - Anhang (Erläuterung a.o. Positionen)
  - Erfolgsrechnung
  rechnen: Summe erläuterte a.o. Posten im Anhang = Total a.o. Aufwand bzw. Ertrag gemäss ER = Summe Konten Saldoliste
  feststellung_wenn: Wesentlicher a.o./einmaliger/periodenfremder Posten nicht erläutert, oder Anhangsbetrag stimmt nicht mit ER/Saldoliste überein.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
  - quelle: hwp-bur-2023__rz-0859-s353
    zitat: Wesentliche Posten sind im Anhang zu erläutern, wie beispielsweise Ursachen eines solchen Ereignisses (Schadensfall etc.).
  - quelle: ser-2022__anh-d-s096-1
    zitat: Vergleich der Salden und Identifikationskriterien mit dem Vorjahr
- id: T1-315
  vorgehen: Forderungen und Verbindlichkeiten gegenüber Aktionären/Beteiligten, Organen und Beteiligungsgesellschaften aus Saldoliste, Darlehensverträgen und Aktienbuch identifizieren;
    prüfen, ob sie in Bilanz oder Anhang gesondert ausgewiesen sind und die Beträge (inkl. Zinsen, Vorjahr) übereinstimmen. Rangrücktritte (Betrag, Umfang) mit den Vereinbarungen abgleichen.
  nachweise:
  - Saldoliste/Hauptbuch
  - Darlehensverträge, Rangrücktrittsvereinbarungen
  - Aktienbuch
  - Anhang
  - Vollständigkeitserklärung (nahestehende Personen)
  rechnen: Summe Konten ggü. Beteiligten/Organen/Beteiligungen = gesonderter Ausweis Bilanz + Anhang; Summe Rangrücktritte gemäss Vereinbarungen vs. Anhang
  feststellung_wenn: Position ggü. Beteiligten/Organen/Beteiligungen weder in Bilanz noch Anhang gesondert; Betrags- oder Vorjahresdifferenz; Rangrücktritt nicht erläutert.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-3
    zitat: Sind Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten
  - quelle: ser-2022__anh-d-s098-3
    zitat: in der Bilanz oder im Anhang ausgewiesen (Art. 959a Abs. 4 OR)?
  - quelle: or__art-959a-t2
    zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
  - quelle: ser-2022__anh-e-s103-2
    zitat: der Ausweis von Guthaben und Verbindlichkeiten gegenüber nahestehenden Personen (Art. 959a Abs. 4 OR) ist vollständig und richtig.
- id: T1-316
  vorgehen: 'Feststellen, ob die Erfolgsrechnung als Absatzerfolgsrechnung (Umsatzkostenverfahren) gegliedert ist. Falls ja: Personalaufwand sowie Abschreibungen und Wertberichtigungen
    auf Anlagevermögen im Anhang mit Personalkonten und Anlagespiegel abstimmen. Bei Produktionserfolgsrechnung «nicht zutreffend» dokumentieren.'
  nachweise:
  - Erfolgsrechnung
  - Anhang
  - Personalkonten/Lohnjournal
  - Anlagespiegel
  rechnen: Personalaufwand Anhang = Summe Personalkonten; Abschreibungen/WB Anhang = Abschreibungen gemäss Anlagespiegel
  feststellung_wenn: Absatzerfolgsrechnung ohne Anhangsangabe Personalaufwand bzw. Abschreibungen/Wertberichtigungen, oder Betrag weicht ab.
  fundstellen:
  - quelle: or__art-959b-t2
    zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens ausgewiesen
      werden.
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang bei Anwendung der Absatzerfolgsrechnung (Umsatzkostenverfahren) den Personalaufwand sowie die Abschreibungen und Wertberichtigungen auf
- id: T1-317
  vorgehen: Anhangsangaben zu eigenen Anteilen (Anzahl per Stichtag; Erwerb/Veräusserung mit Datum, Anzahl, Art, Preis, Bedingungen) mit Aktienbuch, Kaufverträgen, Konto eigene Kapitalanteile
    und VR-Beschlüssen abgleichen (Ergebnis T1-102 übernehmen). Ohne eigene Anteile «nicht zutreffend» mit Nachweis dokumentieren.
  nachweise:
  - Aktienbuch
  - Kaufverträge eigene Anteile
  - Saldoliste Konto eigene Kapitalanteile
  - VR-Beschlüsse
  - Anhang
  rechnen: Bestand eigene Anteile Vorjahr + Erwerbe − Veräusserungen = Bestand Stichtag (Anzahl und Buchwert)
  feststellung_wenn: Anzahl oder Transaktionen eigener Anteile im Anhang fehlen oder weichen von Aktienbuch/Buchhaltung ab.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
  - quelle: or__art-959c-t1
    zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
  - quelle: hwp-bur-2023__rz-0829-s345
    zitat: Zumindest anzugeben sind das Datum, die Anzahl und die Art der Anteile, der bezahlte Preis sowie weitere Bedingungen wie beispielsweise Rückkaufvereinbarungen.
- id: T1-318
  vorgehen: 'Ergebnis der Fortführungsbeurteilung (Planung, SER Anhang G) übernehmen. Bei Abweichung von der Fortführung: Vermerk und Einfluss auf die wirtschaftliche Lage im Anhang
    prüfen; bei wesentlicher Unsicherheit (z.B. Überschuldung mit Rangrücktritten, angespannte Liquidität) prüfen, ob sie klar offengelegt ist. Folgen für den Bericht (Zusatz/Modifizierung)
    entscheidet der WP.'
  nachweise:
  - Anhang (Fortführung, Ereignisse)
  - Fortführungsbeurteilung/Liquiditätsplanung
  - Rangrücktrittsvereinbarungen
  rechnen: ''
  feststellung_wenn: Abweichung von der Fortführung nicht vermerkt oder Einfluss nicht dargelegt; wesentliche Fortführungsunsicherheit im Anhang nicht oder unzureichend offengelegt.
  fundstellen:
  - quelle: or__art-958a
    zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken; ihr Einfluss auf die wirtschaftliche Lage ist darzulegen.
  - quelle: ser-2022__anh-d-s098-3
    zitat: Werden Abweichungen von der Annahme der Fortführung im Anhang vermerkt und
  - quelle: hwp-er-2026__rz-0199-s226
    zitat: Bestehen erhebliche Zweifel an der Fortführungsfähigkeit, muss dies in der Jahresrechnung klar offengelegt werden.
  - quelle: hwp-er-2026__rz-0200-s226-t1
    zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
- id: T1-319
  vorgehen: 'Katalog: Kennzeichnung «?», Prüfziele leer – vom WP zu bestätigen. Feststellen, ob eine Aufwertung von Grundstücken/Beteiligungen nach Art. 725c OR erfolgt ist (Aufwertungsreserve,
    VR-Beschluss, Bestätigung der Revisionsstelle). Falls ja: Anhang auf Position inkl. Bilanzposition, Höhe/Veränderung der Aufwertungsreserve und Datum des Prüfungsberichts prüfen;
    sonst «nicht zutreffend».'
  nachweise:
  - Saldoliste (Aufwertungsreserve)
  - VR-Beschluss Aufwertung
  - Schriftliche Bestätigung Revisionsstelle/zugelassener Revisor
  - Anhang
  rechnen: Aufwertungsreserve gemäss Saldoliste = Aufwertungsbetrag gemäss Anhang ± nachgelagerte Veränderungen (Spiegel)
  feststellung_wenn: Aufwertung ohne Anhangsangabe (Gegenstand, Betrag, Prüfungsbericht), Betrag weicht von Aufwertungsreserve ab, oder schriftliche Bestätigung fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-3
    zitat: Werden im Anhang ggf. Angaben über Gegenstand und Betrag von Aufwertungen gemacht?
  - quelle: or__art-725c
    zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
  - quelle: hwp-bur-2023__rz-0906-s365
    zitat: Datum des Prüfungsberichts der Revisionsstelle resp. des zugelassenen Revisors oder der zugelassenen Revisorin.
- id: T1-173
  vorgehen: 'Katalogtext leer (EP; Prüfziele DO, RI) – Inhalt vom WP zu bestätigen, Pendenz erfassen. Vorschlag (Annahme, ohne Katalogtext): Schlussdurchsicht des Anhangs auf vollständige
    Offenlegung der aus den Befragungen T1-101 bis T1-112 zutreffenden Positionen gemäss Art. 959c OR, inkl. Firma/Rechtsform/Sitz. Je Befragungsergebnis «offengelegt / nicht zutreffend
    / fehlt» dokumentieren.'
  nachweise:
  - Ergebnisse T1-101 bis T1-112
  - Anhang
  - Vollständigkeitserklärung
  rechnen: ''
  feststellung_wenn: Aus Befragungen bekannter offenlegungspflichtiger Sachverhalt fehlt im Anhang; Inhalt des Schritts vom WP nicht bestätigt → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Durchsicht des Anhangs auf vollständige Offenlegung der aufgrund der Befragungen
  - quelle: ser-2022__anh-d-s098-2
    zitat: zutreffenden Positionen gemäss Art. 959c OR sowie der weiteren vom Gesetz verlangten Angaben
- id: T1-401
  vorgehen: 'Anhand Saldoliste (Anleihenskonten), Protokollen und Befragung feststellen, ob Anleihensobligationen ausstehend sind. Falls ja: Angaben je Anleihe (Betrag, Zinssatz, Fälligkeit,
    weitere Konditionen) mit Anleihensbedingungen abgleichen und den WP auf die Revisionsart hinweisen (ausstehende Anleihen bedingen ordentliche Revision). Sonst «nicht zutreffend».'
  nachweise:
  - Saldoliste
  - Anleihensbedingungen/Prospekt
  - VR-Protokolle
  - Anhang
  rechnen: Anleihensbetrag gemäss Anhang = Saldo Anleihenskonto
  feststellung_wenn: Ausstehende Anleihe ohne vollständige Angaben im Anhang; zudem Hinweis an WP zur Revisionspflicht (ordentliche statt eingeschränkte Revision).
  fundstellen:
  - quelle: or__art-959c-t3
    zitat: Unternehmen, die Anleihensobligationen ausstehend haben, müssen Angaben zu deren Beträgen, Zinssätzen, Fälligkeiten und zu den weiteren Konditionen machen.
  - quelle: hwp-bur-2023__rz-0878-s357
    zitat: Als Minimalangaben sind für jede Anleihe Anleihensbetrag, Zinssatz, Fälligkeit und weitere Konditionen
  - quelle: or__art-727
    zitat: Anleihensobligationen ausstehend haben,
- id: T1-402
  vorgehen: 'Nur falls T1-112 einen vorzeitigen Rücktritt oder eine Abberufung ergibt: Rücktrittsschreiben bzw. GV-Beschluss in M-Files beschaffen und den Anhangstext mit den darin genannten
    Gründen vergleichen (Wortlaut, Umfang). Sonst «nicht zutreffend» mit Verweis auf T1-112.'
  nachweise:
  - Rücktrittsschreiben der Revisionsstelle
  - GV-Protokoll (Abberufung)
  - Anhang
  rechnen: ''
  feststellung_wenn: Anhangstext gibt die Gründe gemäss Rücktrittsschreiben nicht, verkürzt oder abweichend wieder; Schreiben fehlt → Pendenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0868-s355-t2
    zitat: Wortlaut und Umfang der Offenlegung richten sich nach der Begründung der
  - quelle: or__art-730a
    zitat: Tritt eine Revisionsstelle zurück, so hat sie den Verwaltungsrat über die Gründe zu informieren; dieser teilt sie der nächsten Generalversammlung mit.
  - quelle: hwp-er-2026__rz-0171-s069
    zitat: Zudem sind diese Gründe im Anhang der Jahresrechnung darzulegen (Art. 959c Abs. 2 Ziff. 14 OR).
- id: T1-403
  vorgehen: 'Prüfen, ob das Unternehmen von Gesetzes wegen ordentlich revisionspflichtig und damit «grösseres Unternehmen» ist; in der eingeschränkten Revision in der Regel nicht zutreffend
    → begründet dokumentieren. Falls anwendbar oder freiwillig angegeben: Fälligkeitsaufteilung (1–5 Jahre, > 5 Jahre) mit Darlehensverträgen und Bilanzposition abstimmen.'
  nachweise:
  - Unternehmensinformationen/Schwellenwerte
  - Darlehens- und Kreditverträge
  - Bilanz
  - Anhang
  rechnen: Summe Fälligkeiten 1–5 Jahre + > 5 Jahre = Bilanzposition langfristige verzinsliche Verbindlichkeiten
  feststellung_wenn: Bei Pflicht (grösseres Unternehmen) fehlt die Fälligkeitsaufteilung, die Summe weicht ab, oder der kurzfristige Anteil ist nicht umgegliedert.
  fundstellen:
  - quelle: or__art-961a
    zitat: zu den langfristigen verzinslichen Verbindlichkeiten, aufgeteilt nach Fälligkeit innerhalb von einem bis fünf Jahren und nach fünf Jahren
  - quelle: hwp-bur-2023__rz-0871-s356
    zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, gelten als grössere Unternehmen im Sinne des Rechnungslegungsrechts
  - quelle: hwp-bur-2023__rz-0875-s356
    zitat: (kurzfristiger Anteil langfristiger Verbindlichkeiten) sind grundsätzlich als kurzfristige verzinsliche Verbindlichkeiten zu bilanzieren
- id: T1-404
  vorgehen: 'Anwendbarkeit wie T1-403 klären (grösseres Unternehmen); in der eingeschränkten Revision in der Regel nicht zutreffend. Falls anwendbar oder freiwillig angegeben: Honorare
    je Revisionsdienstleistungen und andere Dienstleistungen mit Honorarrechnungen und Aufwandkonto abstimmen (Revisionshonorar periodengerecht).'
  nachweise:
  - Honorarrechnungen der Revisionsstelle
  - Aufwandkonto VR/GV/Revisionsstelle
  - Anhang
  rechnen: Revisionshonorar Anhang = periodengerecht erfasster Aufwand gemäss Konto/Rechnungen; andere Dienstleistungen separat
  feststellung_wenn: Bei Pflicht fehlt die getrennte Honorarangabe oder die Beträge weichen von Rechnungen/Konto ab.
  fundstellen:
  - quelle: or__art-961a
    zitat: zum Honorar der Revisionsstelle je gesondert für Revisionsdienstleistungen und andere Dienstleistungen
  - quelle: hwp-bur-2023__rz-0876-s356
    zitat: periodengerecht im Aufwand erfassten Honorare (Accrual-Prinzip)
  - quelle: hwp-bur-2023__rz-0877-s357
    zitat: Alle übrigen Dienstleistungen der Revisionsstelle gelten als andere Dienstleistungen.
