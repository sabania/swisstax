- id: T1-304
  vorgehen: 'Anhangsangabe mit Personalliste, Lohnjournal und AHV-Jahreslohnmeldung plausibilisieren: Jahresdurchschnitt aus Monats- oder Quartalsendbeständen, Teilzeit anteilig, Auszubildende
    üblicherweise als Teilzeit, nur Mitarbeitende mit Arbeitsvertrag beim Unternehmen. Vorjahresangabe vergleichen; Bedeutung der Schwellen für den WP vermerken (10 = Opting-out, 50
    = Kriterium Vereine, 250 = Kriterium ordentliche Revision). Katalog/SER «weniger als 10» weicht vom Gesetz ab: massgebend ist Art. 959c Abs. 2 Ziff. 2 OR «nicht über 10» (genau 10,0
    = nicht über 10).'
  nachweise:
  - Personalliste/Lohnjournal mit Pensen, Ein- und Austritten
  - AHV-Jahreslohnmeldung
  - Anhang
  rechnen: FTE-Jahresdurchschnitt = Σ Vollzeitäquivalente an den Monats- (oder Quartals-)enden / Anzahl Stichtage (Teilzeit anteilig); Einordnung in Band ≤ 10 / > 10 bis 50 / > 50 bis
    250 / > 250 und Vergleich mit Anhangsangabe
  feststellung_wenn: Berechneter Jahresdurchschnitt liegt in einem anderen Band als die Anhangsangabe, oder Angabe fehlt; Hinweis auf Schwelle 250 (Revisionsart) → Pendenz an WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Plausibilisierung der Angabe der Vollzeitstellen (weniger als 10, über 50 beziehungsweise über 250) im Jahresdurchschnitt
  - quelle: or__art-959c-t1
    zitat: eine Erklärung darüber, ob die Anzahl Vollzeitstellen im Jahresdurchschnitt nicht über 10, über 50 beziehungsweise über 250 liegt
  - quelle: hwp-bur-2023__rz-0822-s344
    zitat: Für die Ermittlung der Anzahl Stellen ist die rechtliche Stellung der Mitarbeitenden massgebend.
