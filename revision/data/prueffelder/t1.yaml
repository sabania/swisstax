schritte:
- id: T1-101
  vorgehen: 'Schriftliche Antwort (Kundenbefragung, VE) auswerten, sonst Frage als Pendenz (revio-Notiz); Einholung beim Kunden durch Mitarbeitende/WP. Alle Konten (auch kurzfr. Forderungen),
    Kaufverträge über Anteile und Anhang abgleichen (Firma, Rechtsform, Sitz, Kapital-/Stimmenanteil). Katalog «mehr als 20 %» weicht ab: massgebend Art. 960d Abs. 3 OR (≥ 20 %), Definition
    langfristig/massgeblicher Einfluss. Bilanzierung dem WP vorlegen.'
  nachweise:
  - Schriftliche Antwort VR/GF bzw. Kundenbefragung
  - Beteiligungsliste, Kaufverträge über Anteile
  - Saldoliste/Hauptbuch (alle Konten mit Anteilen)
  - Anhang der Jahresrechnung
  rechnen: Stimmanteil je Gesellschaft = gehaltene Stimmrechte / total Stimmrechte; Kennzeichnung >= 20 % (Vermutung Beteiligung, Art. 960d Abs. 3 OR)
  feststellung_wenn: Beteiligung (auch < 20 % mit massgeblichem Einfluss oder nicht als Beteiligung gebucht) im Anhang fehlend oder ohne Firma/Rechtsform/Sitz/Kapital-/Stimmenanteil;
    Antwort fehlt → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach direkt oder wesentlichen indirekt gehaltenen Anteilen an anderen
  - quelle: or__art-959c-t1
    zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
  - quelle: or__art-960d
    zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 Prozent der Stimmrechte gewähren.
  - quelle: hwp-bur-2023__rz-0825-s344
    zitat: Als Beteiligungen gelten Anteile am Kapital eines anderen Unternehmens, die langfristig gehalten werden und einen massgeblichen Einfluss vermitteln.
  - quelle: hwp-bur-2023__rz-0825-s344
    zitat: Der Umkehrschluss, dass Anteile unter 20 % keine Beteiligungen darstellen, ist unzulässig
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- id: T1-102
  vorgehen: 'Zuerst schriftliche Antwort zu Bestand per Stichtag sowie Erwerb/Veräusserung eigener Anteile (auch durch kontrollierte Unternehmen) suchen und auswerten (10.11 Kundenbefragung,
    nur userSubmitted; Vollständigkeitserklärung; VR-/GV-Protokolle); nur wenn keine vorliegt: Notiz «Pendenz» mit der Frage (Wortlaut: Vorlage in `pruefschritt` bzw. `fragen T1`). Abgleich
    mit Aktienbuch (Anzahl Aktien vs. Aktienkapital gemäss Statuten/HR), Konto eigene Kapitalanteile und VR-/GV-Protokollen. Ergebnis mit Verweis auf T1-317 dokumentieren.'
  nachweise:
  - Schriftliche Antwort VR/GF
  - Aktienbuch
  - Saldoliste (Konto eigene Kapitalanteile)
  - VR-/GV-Protokolle, Kaufverträge eigene Aktien
  rechnen: Summe Aktien gemäss Aktienbuch vs. Anzahl Aktien gemäss Statuten/HR; Differenz klären (eigene oder nicht eingetragene Anteile)
  feststellung_wenn: Eigene Anteile vorhanden oder gehandelt, aber Anzahl, Transaktionen oder Bedingungen im Anhang fehlen; Widerspruch Aktienbuch zu Kapital; Antwort fehlt → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile durch das Unternehmen selbst oder durch Unternehmen, an denen eine Beteiligung besteht
  - quelle: or__art-959c-t1
    zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
  - quelle: or__art-959c-t1
    zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: T1-103
  vorgehen: 'Zuerst schriftliche Antwort zu nicht bilanzierten Leasing- und Mietverträgen mit Laufzeit/Kündbarkeit > 12 Monate suchen und auswerten (10.11 Kundenbefragung, nur userSubmitted;
    Vollständigkeitserklärung; VR-/GV-Protokolle); nur wenn keine vorliegt: Notiz «Pendenz» mit der Frage (Wortlaut: Vorlage in `pruefschritt` bzw. `fragen T1`). Verträge in M-Files
    suchen (Miet-, Leasingverträge; Konten Raumaufwand/Leasing), Restbetrag bis Vertragsende bzw. Ablauf Kündigungsfrist nachrechnen und mit Anhang vergleichen. Wirtschaftliche Kündbarkeit
    dem WP zur Beurteilung vorlegen.'
  nachweise:
  - Schriftliche Antwort VR/GF
  - Miet- und Leasingverträge
  - Kontoblätter Raumaufwand/Leasing
  - Anhang (Angabe Leasing-/Mietverbindlichkeiten)
  rechnen: Restbetrag = Summe der bis Vertragsende bzw. Ablauf Kündigungsfrist geschuldeten Raten/Mietzinse (Nominalwert, inkl. Zinsen und Kosten); Differenz zur Anhangsangabe
  feststellung_wenn: Langfristige Leasing- oder Mietverpflichtung nicht oder zu tief im Anhang; Differenz zwischen berechnetem Restbetrag und Anhang über der Toleranzwesentlichkeit.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach nicht bilanzierten Leasing- und Mietverpflichtungen, welche nicht in
  - quelle: or__art-959c-t2
    zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen, sofern diese nicht innert zwölf Monaten ab Bilanzstichtag
      auslaufen
  - quelle: hwp-bur-2023__rz-0835-s346
    zitat: Langfristige Mietverträge sind wirtschaftlich den Leasingverbindlichkeiten im engeren Sinne gleichzusetzen.
  - quelle: hwp-bur-2023__rz-0836-s346
    zitat: noch zu leistenden Beträge einschliesslich Zinsen und Kosten auszuweisen, und zwar in voller Höhe und nicht bloss der Teil, der erst nach zwölf Monaten fällig ist.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: T1-104
  vorgehen: 'Zuerst schriftliche Antwort zu Verbindlichkeiten gegenüber Vorsorgeeinrichtungen (ausstehende Beiträge, Kontokorrent, Darlehen) suchen und auswerten (10.11 Kundenbefragung,
    nur userSubmitted; Vollständigkeitserklärung; VR-/GV-Protokolle); nur wenn keine vorliegt: Notiz «Pendenz» mit der Frage (Wortlaut: Vorlage in `pruefschritt` bzw. `fragen T1`). Mit
    Saldoliste (Konto Abrechnung BVG u.ä.) und Anhang abgleichen; Detailabstimmung mit Kontoauszug in T1-309.'
  nachweise:
  - Schriftliche Antwort VR/GF
  - Saldoliste/Hauptbuch Vorsorgekonten
  - Anhang
  rechnen: Summe Passivsalden Vorsorgekonten = Anhangsangabe Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  feststellung_wenn: Passivsaldo gegenüber einer Vorsorgeeinrichtung vorhanden, aber nicht in Anhang oder Bilanz ersichtlich, oder Betrag weicht ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: or__art-959c-t2
    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: hwp-bur-2023__rz-0838-s346
    zitat: Die Ausweispflicht ist unabhängig von der Form der Vorsorge zu verstehen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: T1-105
  vorgehen: 'Zuerst schriftliche Antwort zu Bürgschaften, Garantien, Pfandbestellungen und Patronatserklärungen zugunsten Dritter (Bestand, Veränderung) suchen und auswerten (10.11 Kundenbefragung,
    nur userSubmitted; Vollständigkeitserklärung; VR-/GV-Protokolle); nur wenn keine vorliegt: Notiz «Pendenz» mit der Frage (Wortlaut: Vorlage in `pruefschritt` bzw. `fragen T1`). Vorhandene
    Bankunterlagen, Verträge und VR-Protokolle durchsehen; keine Bankbestätigung einholen (nur auf Anweisung WP). Abgrenzung zu Garantien für eigenes Handeln festhalten, WP vorlegen.
    Volle Haftungssummen mit Anhang vergleichen.'
  nachweise:
  - Schriftliche Antwort VR/GF
  - Vorhandene Bankunterlagen/-bestätigungen (M-Files)
  - Bürgschafts-, Garantie-, Pfandverträge
  - VR-Protokolle
  - Anhang
  rechnen: Summe volle Haftungsbeträge aller Sicherheiten zugunsten Dritter = Anhangsangabe Art. 959c Abs. 2 Ziff. 8 OR; bei bestehender Rückstellung gewählte Darstellung (voll mit Hinweis
    oder über Rückstellung hinaus) kennzeichnen
  feststellung_wenn: Sicherheit zugunsten Dritter nicht oder nur mit beanspruchtem statt vollem Betrag offengelegt (ohne feste Rückzahlungsvereinbarung); drohender Verlust ohne Rückstellung;
    Einordnung eigene/Dritte unklar → Pendenz an WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über Bestand und Veränderungen von Bürgschaften, Garantieverpflichtungen und Pfandbestellungen zugunsten Dritter (nicht für eigene Verpflichtungen)
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
  - quelle: hwp-bur-2023__rz-0841-s347
    zitat: Ausweispflichtig ist grundsätzlich die volle Haftungssumme.
  - quelle: hwp-bur-2023__rz-0841-s347
    zitat: Der Ausweis nur des beanspruchten Betrags ist nur dann zulässig, wenn der Schuldner oder die Schuldnerin aufgrund einer festen Rückzahlungsvereinbarung die garantierte, verbürgte
      oder durch Pfand sichergestellte Schuld ohne Einverständnis der Garanten und Garantinnen, Bürgenden oder Pfandgebenden nicht wieder erhöhen kann.
  - quelle: hwp-bur-2023__rz-0841-s347
    zitat: Verpflichtungen aus Patronatserklärungen, sofern aufgrund der darin enthaltenen Willenserklärung die Erfüllung der Verpflichtung klagbar ist.
  - quelle: hwp-bur-2023__rz-0842-s348
    zitat: Erfüllungsgarantien für eigenes Handeln zugunsten Dritter stellen keine Sicherungsverpflichtungen im Sinne des Gesetzes dar.
  - quelle: hwp-bur-2023__rz-0842-s348
    zitat: In solchen Fällen besteht ein Darstellungswahlrecht
  - quelle: ser-2022__anh-d-s074-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen
  - quelle: ser-2022__anh-d-s074-2
    zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
  - quelle: hwp-er-2026__rz-0300-s092-t2
    zitat: Kein Einholen von Bankbestätigungen vorgesehen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: T1-106
  vorgehen: 'Zuerst schriftliche Antwort zu verpfändeten/abgetretenen Aktiven, Sicherheitsleistungen (z.B. Bardepots, Kautionen) und Aktiven unter Eigentumsvorbehalt suchen und auswerten
    (10.11 Kundenbefragung, nur userSubmitted; Vollständigkeitserklärung; VR-/GV-Protokolle); nur wenn keine vorliegt: Notiz «Pendenz» mit der Frage (Wortlaut: Vorlage in `pruefschritt`
    bzw. `fragen T1`). Vorhandene Bankunterlagen, Kredit- und Pfandverträge durchsehen (keine Bankbestätigung einholen). AGB-Pfandrecht nur bei nicht (voll) gesichertem, beanspruchtem
    Kredit – dann alle Guthaben bei dieser Bank. Buchwerte summieren, mit Anhang vergleichen.'
  nachweise:
  - Schriftliche Antwort VR/GF
  - Vorhandene Bankunterlagen/-bestätigungen, Kontoauszüge (Kreditlimiten)
  - Kredit-, Pfand-, Zessionsverträge, Nachweise Sicherheitsleistungen
  - Saldoliste (Buchwerte)
  - Anhang
  rechnen: Summe Buchwerte verpfändeter/abgetretener Aktiven und Sicherheitsleistungen (inkl. zedierte Debitoren; alle Guthaben/Depots bei Banken mit beanspruchtem, nicht voll besonders
    gesichertem Kredit) sowie separat Aktiven unter Eigentumsvorbehalt = Anhangsangabe Ziff. 9
  feststellung_wenn: Belastete Aktiven (z.B. Zession, verpfändetes Depot, Bardepot als Sicherheitsleistung, Guthaben bei Bank mit beanspruchtem Kredit) nicht oder nicht zu Buchwerten
    im Anhang.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0846-s349
    zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen
  - quelle: hwp-bur-2023__rz-0847-s349-t2
    zitat: ein nicht oder nicht vollständig durch besondere Sicherheiten gesichertes Kreditverhältnis hat
  - quelle: hwp-bur-2023__rz-0847-s349-t2
    zitat: sind gewährte Kreditlimiten nicht beansprucht, ist ein Ausweis unter dem Sicherstellungstitel nicht erforderlich
  - quelle: ser-2022__anh-d-s074-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen
  - quelle: ser-2022__anh-d-s074-2
    zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
  - quelle: hwp-er-2026__rz-0300-s092-t2
    zitat: Kein Einholen von Bankbestätigungen vorgesehen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
