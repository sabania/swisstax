  - Saldoliste 2025 und Vorjahr
  rechnen: 'Je Aufschlüsselung: Summe Einzelangaben Anhang = zugehörige Position Bilanz/ER = Summe Konten Saldoliste (Geschäftsjahr und Vorjahr); Differenz ≠ 0 ausweisen'
