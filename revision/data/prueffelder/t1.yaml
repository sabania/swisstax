    zitat: Teilzeitmitarbeitende können anteilig berücksichtigt werden.
  - quelle: hwp-bur-2023__rz-0820-s343
    zitat: '10 Vollzeitstellen im Jahresdurchschnitt: Opting-out (Art. 727a Abs. 2 OR)'
  - quelle: hwp-bur-2023__rz-0820-s343
    zitat: '50 Vollzeitstellen im Jahresdurchschnitt: eines von drei Kriterien bei Vereinen für die Beurteilung, ob die Vereinsrechnung ordentlich geprüft werden muss (Art. 69b ZGB)'
