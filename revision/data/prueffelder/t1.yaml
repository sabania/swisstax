# Prüffeld T1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: T1
bezeichnung: Anhang zur Jahresrechnung
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 18
    korrigiert: true
kurzbeschrieb: Prüffeld T1 umfasst den Anhang der Jahresrechnung (Art. 959c OR und weitere gesetzliche Angaben). In der eingeschränkten Revision werden offenlegungspflichtige Sachverhalte
  durch Befragungen (SER Anhang D Bst. u) erhoben und durch Detailprüfungen beurteilt, ob der Anhang vollständig, richtig und mit Bilanz/Erfolgsrechnung abgestimmt ist. Bank- und Anwaltsbestätigungen
  werden nicht eingeholt.
gesetz:
- thema: Zweck und Inhalt des Anhangs (Art. 959c Abs. 1 OR)
  quelle: or__art-959c-t1
  zitat: Der Anhang der Jahresrechnung ergänzt und erläutert die anderen Bestandteile der Jahresrechnung.
- thema: Angewandte Grundsätze (Art. 959c Abs. 1 Ziff. 1 OR)
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: Erläuterungen zu Bilanz und Erfolgsrechnung (Art. 959c Abs. 1 Ziff. 2 OR)
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)
  quelle: or__art-959c-t1
  zitat: soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven übersteigt, wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
- thema: Weitere vom Gesetz verlangte Angaben (Art. 959c Abs. 1 Ziff. 4 OR; Grundlage T1-306)
  quelle: or__art-959c-t1
  zitat: weitere vom Gesetz verlangte Angaben
- thema: Pflichtangaben, sofern nicht aus Bilanz/ER ersichtlich (Art. 959c Abs. 2 OR)
  quelle: or__art-959c-t1
  zitat: Der Anhang muss weiter folgende Angaben enthalten, sofern diese nicht bereits aus der Bilanz oder der Erfolgsrechnung ersichtlich sind
- thema: Firma oder Name, Rechtsform und Sitz (Art. 959c Abs. 2 Ziff. 1 OR)
  quelle: or__art-959c-t1
  zitat: Firma oder Name sowie Rechtsform und Sitz des Unternehmens
- thema: Vollzeitstellen im Jahresdurchschnitt (Art. 959c Abs. 2 Ziff. 2 OR)
  quelle: or__art-959c-t1
  zitat: eine Erklärung darüber, ob die Anzahl Vollzeitstellen im Jahresdurchschnitt nicht über 10, über 50 beziehungsweise über 250 liegt
- thema: Beteiligungen (Art. 959c Abs. 2 Ziff. 3 OR)
  quelle: or__art-959c-t1
  zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
- thema: 'Eigene Anteile: Bestand (Art. 959c Abs. 2 Ziff. 4 OR)'
  quelle: or__art-959c-t1
  zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
- thema: 'Eigene Anteile: Erwerb/Veräusserung (Art. 959c Abs. 2 Ziff. 5 OR)'
  quelle: or__art-959c-t1
  zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
- thema: Leasing- und langfristige Verpflichtungen (Art. 959c Abs. 2 Ziff. 6 OR)
  quelle: or__art-959c-t2
  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen, sofern diese nicht innert zwölf Monaten ab Bilanzstichtag
    auslaufen
- thema: Vorsorgeeinrichtungen (Art. 959c Abs. 2 Ziff. 7 OR)
  quelle: or__art-959c-t2
  zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
- thema: Sicherheiten für Dritte (Art. 959c Abs. 2 Ziff. 8 OR)
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: Belastete Aktiven, Eigentumsvorbehalt (Art. 959c Abs. 2 Ziff. 9 OR)
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: Eventualverbindlichkeiten (Art. 959c Abs. 2 Ziff. 10 OR)
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: Beteiligungsrechte/Optionen (Art. 959c Abs. 2 Ziff. 11 OR)
  quelle: or__art-959c-t2
  zitat: Anzahl und Wert von Beteiligungsrechten oder Optionen auf solche Rechte für alle Leitungs- und Verwaltungsorgane sowie für die Mitarbeitenden
- thema: Ausserordentliche, einmalige, periodenfremde Positionen (Art. 959c Abs. 2 Ziff. 12 OR)
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: Ereignisse nach dem Bilanzstichtag (Art. 959c Abs. 2 Ziff. 13 OR)
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- thema: Rücktritt/Abberufung Revisionsstelle (Art. 959c Abs. 2 Ziff. 14 OR)
  quelle: or__art-959c-t2
  zitat: 'bei einem vorzeitigen Rücktritt oder einer Abberufung der Revisionsstelle: die Gründe, die dazu geführt haben'
- thema: Kapitalband (Art. 959c Abs. 2 Ziff. 15 OR)
  quelle: or__art-959c-t2
  zitat: alle Kapitalerhöhungen und Kapitalherabsetzungen, die der Verwaltungsrat innerhalb eines Kapitalbands vorgenommen hat
- thema: Verzicht auf Anhang nur für Einzelunternehmen/Personengesellschaften (Art. 959c Abs. 3 OR)
  quelle: or__art-959c-t3
  zitat: Einzelunternehmen und Personengesellschaften können auf die Erstellung des Anhangs verzichten, wenn sie nicht zur Rechnungslegung nach den Vorschriften für grössere Unternehmen
    verpflichtet sind
- thema: Anleihensobligationen (Art. 959c Abs. 4 OR)
  quelle: or__art-959c-t3
  zitat: Unternehmen, die Anleihensobligationen ausstehend haben, müssen Angaben zu deren Beträgen, Zinssätzen, Fälligkeiten und zu den weiteren Konditionen machen.
- thema: Anhang als Bestandteil der Jahresrechnung (Art. 958 Abs. 2 OR)
  quelle: or__art-958
  zitat: Dieser enthält die Jahresrechnung (Einzelabschluss), die sich aus der Bilanz, der Erfolgsrechnung und dem Anhang zusammensetzt.
- thema: Abweichung von der Fortführung (Art. 958a Abs. 3 OR)
  quelle: or__art-958a
  zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken; ihr Einfluss auf die wirtschaftliche Lage ist darzulegen.
- thema: Stetigkeit und Nachweis der Anhangspositionen (Art. 958c OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Vorjahreszahlen und Umrechnungskurse (Art. 958d Abs. 2–3 OR)
  quelle: or__art-958d
  zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
- thema: Zusätzliche Positionen und nahestehende Beteiligte/Organe in Bilanz oder Anhang (Art. 959a Abs. 3–4 OR)
  quelle: or__art-959a-t2
  zitat: Weitere Positionen müssen in der Bilanz oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Vermögens- oder Finanzierungslage durch Dritte wesentlich
- thema: Absatzerfolgsrechnung und zusätzliche ER-Positionen (Art. 959b Abs. 4–5 OR)
  quelle: or__art-959b-t2
  zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens ausgewiesen
    werden.
- thema: Bewertung zu Kurs-/Marktwerten und Schwankungsreserven (Art. 960b OR)
  quelle: or__art-960b
  zitat: Der Betrag der Schwankungsreserven ist insgesamt in der Bilanz oder im Anhang gesondert auszuweisen.
- thema: Begriff Beteiligung (Art. 960d Abs. 3 OR)
  quelle: or__art-960d
  zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 Prozent der Stimmrechte gewähren.
- thema: Aufwertung von Grundstücken und Beteiligungen (Art. 725c OR)
  quelle: or__art-725c
  zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
- thema: Rücktritt der Revisionsstelle (Art. 730a Abs. 3 OR)
  quelle: or__art-730a
  zitat: Tritt eine Revisionsstelle zurück, so hat sie den Verwaltungsrat über die Gründe zu informieren; dieser teilt sie der nächsten Generalversammlung mit.
- thema: 'Grössere Unternehmen: zusätzliche Anhangsangaben (Art. 961, 961a OR)'
  quelle: or__art-961a
  zitat: zu den langfristigen verzinslichen Verbindlichkeiten, aufgeteilt nach Fälligkeit innerhalb von einem bis fünf Jahren und nach fünf Jahren
- thema: Ordentliche Revisionspflicht bei ausstehenden Anleihen (Art. 727 Abs. 1 Ziff. 1 lit. b OR)
  quelle: or__art-727
  zitat: Anleihensobligationen ausstehend haben,
- thema: 'Ordentliche Revisionspflicht: Schwellenwerte in zwei Folgejahren und Konzernrechnungspflicht (Art. 727 Abs. 1 Ziff. 2–3 OR)'
  quelle: or__art-727
  zitat: Gesellschaften, die zwei der nachstehenden Grössen in zwei aufeinander folgenden Geschäftsjahren überschreiten
- thema: Anhangsinformation Vermögensübertragung (Art. 74 FusG)
  quelle: fusg__art-74
  zitat: Das oberste Leitungs- oder Verwaltungsorgan der übertragenden Gesellschaft muss die Gesellschafterinnen und Gesellschafter über die Vermögensübertragung im Anhang zur Jahresrechnung
    informieren.
risiken:
- text: Pflichtangaben nach Art. 959c OR fehlen oder sind unrichtig (z.B. Leasing/Miete, Sicherheiten, Eventualverbindlichkeiten, Beteiligungen), weil Sachverhalte nicht erhoben wurden.
  pruefziele:
  - VO
  - DO
  - EX
  quelle: hwp-er-2026__rz-0377-s269
  zitat: der Anhang die vorgeschriebenen Angaben nicht vollständig und nicht richtig enthält (Art. 959c OR)
- text: Wesentliche Verstösse gegen Offenlegungspflichten führen zur Modifizierung der Prüfungsaussage.
  pruefziele:
  - DO
  quelle: hwp-er-2026__rz-0386-s270-t2
  zitat: Wesentliche Verstösse gegen Gliederungsvorschriften oder Offenlegungspflichten im Anhang führen zu einer modifizierten Prüfungsaussage.
- text: Wesentliche Nettoauflösung stiller Reserven wird nicht offengelegt; Ergebnis erscheint günstiger.
  pruefziele:
  - DO
  - BE
  - RI
  quelle: muster-hwp-er-2026__c025-1
  zitat: Nettoauflösung stiller Reserven im Anhang nicht offengelegt
- text: Nettoauflösung wird nur an der relativen Höhe gemessen und übersehen, obwohl sie einen Jahresverlust in einen Jahresgewinn dreht.
  pruefziele:
  - DO
  - BE
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: wenn aufgrund der Auflösung von stillen Reserven ein Jahresgewinn anstelle eines Jahresverlusts entsteht
- text: Erhebliche Fortführungsunsicherheit (z.B. Überschuldung, angespannte Liquidität) im Anhang nicht oder unzureichend offengelegt.
  pruefziele:
  - DO
  quelle: ser-2022__anh-g-s141-2
  zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang der Jahresrechnung trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
- text: Langfristige Mietverträge werden nicht als Leasingverpflichtungen im Anhang erfasst oder nur mit Teilbetrag.
  pruefziele:
  - VO
  - DO
  - RI
  quelle: hwp-bur-2023__rz-0835-s346
  zitat: Langfristige Mietverträge sind wirtschaftlich den Leasingverbindlichkeiten im engeren Sinne gleichzusetzen.
- text: Rangrücktritte und Positionen gegenüber Beteiligten/Organen werden nicht gesondert ausgewiesen bzw. nicht erläutert.
  pruefziele:
  - DO
  - VO
  quelle: hwp-er-2026__rz-0430-s127
  zitat: in der Jahresrechnung des Schuldners (in der Bilanz oder im Anhang) ausgewiesen und erläutert werden
- text: Ereignisse nach dem Bilanzstichtag werden falsch behandelt (Ursache vor Stichtag nicht gebucht bzw. Ereignis nach Stichtag nicht offengelegt).
  pruefziele:
  - PA
  - DO
  - EX
  quelle: hwp-bur-2023__rz-0861-s353
  zitat: Tritt die auslösende Ursache erst nach dem Bilanzstichtag ein, wird das Ereignis grundsätzlich nicht in der Jahresrechnung erfasst, ist aber im Anhang ausweispflichtig.
- text: Im Anhang beschriebene Grundsätze entsprechen nicht der tatsächlichen Bewertung; Methodenwechsel ohne Begründung.
  pruefziele:
  - DO
  - RI
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden (Art. 959c Abs. 1 Ziff. 1 OR).
- text: Guthaben/Depots bei einer Bank mit nicht oder nicht vollständig besonders gesichertem Kreditverhältnis (AGB-Pfandrecht) sowie Zessionen werden nicht als belastete Aktiven ausgewiesen.
  pruefziele:
  - RV
  - DO
  - EX
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: stellt diese Verpfändung einen ausweispflichtigen Tatbestand dar
- text: Beteiligungen werden nicht erkannt, weil erworbene Anteile nicht als Beteiligung (z.B. unter kurzfristigen Forderungen) gebucht sind.
  pruefziele:
  - EX
  - DO
  quelle: hwp-bur-2023__rz-0825-s344
  zitat: Als Beteiligungen gelten Anteile am Kapital eines anderen Unternehmens, die langfristig gehalten werden und einen massgeblichen Einfluss vermitteln.
- text: Anhangsbeträge stimmen nicht mit Bilanz, Erfolgsrechnung oder Vorjahr überein.
  pruefziele:
  - RI
  - DO
  quelle: hwp-bur-2023__rz-0810-s337
  zitat: gelten auch für die Darstellung der Positionen im Anhang (Angaben zum Geschäftsjahr und zum Vorjahr)
unterlagen:
- dokument: Definitive, vom VR genehmigte und unterzeichnete Jahresrechnung inkl. Anhang mit Vorjahreszahlen
  zweck: Prüfgegenstand für alle Schritte; Vorjahresvergleich
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- dokument: Vollständigkeitserklärung der Unternehmensleitung (SER Anhang E), im Regelfall auf das Datum des Revisionsberichts datiert (vgl. T1-109)
  zweck: Schriftliche Bestätigung zu Bildung/Auflösung/Bestand stiller Reserven (T1-111), Verbindlichkeiten und Eventualverbindlichkeiten (T1-107), Belastungen von Aktiven (T1-106),
    Ereignissen nach dem Stichtag (T1-109) und nahestehenden Personen (T1-315)
  quelle: ser-2022__anh-e-s104-1
  zitat: Bildung, Auflösung und Bestand stiller Reserven haben wir Ihnen im Einzelnen mitgeteilt (Art. 959c Abs. 1 Ziff. 3 OR).
- dokument: Aufstellung Bestand und Veränderung stiller Reserven je Bilanzposition (aktuell und Vorjahr)
  zweck: T1-111, T1-305 Nettoauflösung
  quelle: hwp-bur-2023__rz-0667-s296
  zitat: über den Bestand und die Veränderung stiller Reserven ausserhalb der Buchhaltung eine Kontrolle zu führen.
- dokument: Beteiligungsliste (Firma, Rechtsform, Sitz, Kapital- und Stimmanteil, direkt/indirekt) und Kaufverträge über Anteile (unabhängig vom gebuchten Konto)
  zweck: T1-101
  quelle: hwp-bur-2023__rz-0826-s344
  zitat: Für offenlegungspflichtige Beteiligungen sind zumindest Firma, Rechtsform, Sitz, Kapital- und Stimmrechtsanteil anzugeben, sowie ob sie direkt oder indirekt gehalten werden.
- dokument: Aktienbuch und Aufstellung eigener Anteile inkl. Transaktionen (Datum, Anzahl, Art, Preis, Bedingungen)
  zweck: T1-102, T1-317
  quelle: hwp-bur-2023__rz-0829-s345
  zitat: Zumindest anzugeben sind das Datum, die Anzahl und die Art der Anteile, der bezahlte Preis sowie weitere Bedingungen wie beispielsweise Rückkaufvereinbarungen.
- dokument: Leasing- und Mietverträge mit Laufzeit, Kündigungsfristen und Berechnung des Restbetrags per Stichtag
  zweck: T1-103
  quelle: hwp-bur-2023__rz-0836-s346
  zitat: Der Ausweis des Restbetrags hat hierbei zum Nominalwert zu erfolgen.
- dokument: Kontoauszug/Saldobestätigung der Vorsorgeeinrichtung per 31.12.
  zweck: T1-104, T1-309
  quelle: katalog-revio4__c003-67
  zitat: Kontoauszug BVG
- dokument: Kredit-, Pfand- und Zessionsverträge, Eigentumsvorbehalte, Nachweise zu Sicherheitsleistungen (z.B. Bardepots, Kautionen) sowie die im Dossier vorhandenen Bankunterlagen
  zweck: T1-105, T1-106 (belastete Aktiven, Sicherheiten)
  quelle: hwp-bur-2023__rz-0844-s348
  zitat: gemäss Eigentumsvorbehaltsregister, Grundbuch, Leasingvertrag, Pfandvertrag
- dokument: 'Bankbestätigungen und Anwaltskorrespondenz nur, soweit im Dossier (M-Files) vorhanden – keine PBC-Pendenz «Bestätigung einholen» ohne Anweisung des WP (SER Anhang D: nicht
    Bestandteil der eingeschränkten Revision)'
  zweck: 'T1-105 bis T1-107: vorhandene Unterlagen auswerten; aktives Einholen gehört nicht zur eingeschränkten Revision'
  quelle: ser-2022__anh-d-s074-2
  zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
- dokument: Bürgschafts-, Garantie- und Patronatsverträge zugunsten Dritter
  zweck: T1-105 (volle Haftungssumme)
  quelle: hwp-bur-2023__rz-0839-s346
  zitat: Nach dem Wortlaut des Gesetzes ist das Gesamttotal der vollen Haftungssummen aller Sicherungsgeschäfte in einem Betrag auszuweisen.
- dokument: Aufstellung Rechtsfälle/Aktennotizen, vorhandene Anwaltskorrespondenz, Rückstellungsspiegel
  zweck: T1-107 Eventualverbindlichkeiten vs. Rückstellungen
  quelle: hwp-bur-2023__rz-0855-s351-t1
  zitat: Offene Rechtsstreitigkeiten und Prozessrisiken
- dokument: Beteiligungs-/Optionspläne und Zuteilungen im Geschäftsjahr
  zweck: T1-108
  quelle: hwp-bur-2023__rz-0858-s352-t1
  zitat: Es sind Anzahl und Wert von Beteiligungsrechten oder Optionen auf solche Rechte
- dokument: Protokolle VR und GV (Geschäftsjahr und Folgejahr bis Berichtsdatum), Statuten, HR-Auszug
  zweck: T1-109, T1-110 (Kapitalband), T1-112, T1-315, T1-319
  quelle: hwp-bur-2023__rz-0869-s356
  zitat: Im Anhang sind die in den Statuten festgelegte Bandbreite, deren Laufzeit sowie die erfolgten Erhöhungen und Herabsetzungen
- dokument: Buchungen/Kontoblätter, Kreditorenjournal und Kontoauszüge des Folgejahres (bis möglichst nahe am Berichtsdatum)
  zweck: T1-109 Ereignisse nach dem Bilanzstichtag (Durchsicht in neuer Rechnung)
  quelle: ser-2022__6-1-3
  zitat: Durchsicht von Belegen in neuer Rechnung
- dokument: Personalliste/Lohnjournal mit Pensen, Ein- und Austritten; AHV-Jahreslohnmeldung
  zweck: T1-304 Vollzeitstellen
  quelle: hwp-bur-2023__rz-0822-s344
  zitat: Für die Ermittlung der Anzahl Stellen ist die rechtliche Stellung der Mitarbeitenden massgebend.
- dokument: Darlehensverträge und Rangrücktrittsvereinbarungen mit Aktionären/Nahestehenden
  zweck: T1-315, T1-307
  quelle: hwp-er-2026__rz-0430-s127
  zitat: Der Umstand, dass ein Gläubiger dem Unternehmen für seine Forderung einen Rangrücktritt gewährt hat, ist für die Beurteilung der Vermögens- und Finanzierungslage durch Dritte
    wesentlich
- dokument: Rücktrittsschreiben der Revisionsstelle bzw. GV-Beschluss zur Abberufung (falls zutreffend; in M-Files suchen, sonst Pendenz)
  zweck: T1-112, T1-402
  quelle: hwp-bur-2023__rz-0868-s355-t2
  zitat: Wortlaut und Umfang der Offenlegung richten sich nach der Begründung der
- dokument: Nachweise zu Aufwertungen nach Art. 725c OR (VR-Beschluss, schriftliche Bestätigung der Revisionsstelle)
  zweck: T1-319, T1-306
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten
    sind.
bewertung:
- regel: Im Anhang sind Geschäftsjahr und Vorjahr anzugeben; nur zutreffende Positionen (keine Negativangaben).
  quelle: hwp-bur-2023__rz-0810-s337
  zitat: gelten auch für die Darstellung der Positionen im Anhang (Angaben zum Geschäftsjahr und zum Vorjahr)
- regel: Firma/Name, Rechtsform und Sitz sind im Anhang nur nötig, wenn sie nicht sonst aus der Jahresrechnung ersichtlich sind (z.B. Titel, Kopf- oder Fusszeile).
  quelle: hwp-bur-2023__rz-0819-s343
  zitat: sofern diese Informationen nicht sonst aus der Jahresrechnung ersichtlich sind
- regel: Angewandte Grundsätze = Wahlrechte bei Erfassung, Darstellung und Bewertung (Accounting policies).
  quelle: hwp-bur-2023__rz-0814-s338
  zitat: Darunter sind die Wahlmöglichkeiten in der Erfassung, Darstellung und Bewertung zu verstehen (Accounting policies).
- regel: Werden freiwillig weitergehende Angaben zu Erfassung, Darstellung und Bewertung gemacht und gleichzeitig stille Reserven gebildet/aufgelöst, ist im Anhang darauf hinzuweisen.
  quelle: hwp-bur-2023__rz-0815-s339
  zitat: wird gleichzeitig die Möglichkeit der Bildung und Auflösung stiller Reserven wahrgenommen, ist auf diesen Umstand hinzuweisen.
- regel: 'Stetigkeit: gleiche Massstäbe in Darstellung und Bewertung; Methodenwechsel im Anhang begründen.'
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- regel: 'Nettoauflösung stiller Reserven: nur Nettobetrag, als Gesamtbetrag, nur wenn wesentlich ergebnisverbessernd.'
  quelle: hwp-bur-2023__rz-0817-s341-t1
  zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
- regel: Eine Nettoabnahme stiller Reserven ist mit dem tatsächlichen (bereinigten) Jahresergebnis, d.h. vor Auflösung, zu vergleichen; ob sie das Ergebnis wesentlich günstiger darstellt,
    ist im Einzelfall zu beurteilen.
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: mit dem tatsächlichen (bereinigten) Jahresergebnis verglichen werden
- regel: Die relative Höhe der Auflösung ist nicht allein ausschlaggebend, wenn durch die Auflösung ein Jahresgewinn statt eines Jahresverlusts entsteht.
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: Die relative Höhe der Auflösung, z.B. im Verhältnis zum Jahresergebnis, ist insbesondere dann nicht allein ausschlaggebend
- regel: Stille Reserven jährlich per Stichtag als Differenz Buchwert zu gesetzlich zulässigem Höchstwert (bzw. erforderlichem Betrag) je Bilanzposition nach stetiger Methode ermitteln
    und mit Vorjahr vergleichen.
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz
- regel: Bildung stiller Reserven ist zulässig (zusätzliche Abschreibungen/Wertberichtigungen, Nichtauflösung).
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- regel: 'Leasing/Miete: Restbetrag in voller Höhe inkl. Zinsen und Kosten, zum Nominalwert.'
  quelle: hwp-bur-2023__rz-0836-s346
  zitat: noch zu leistenden Beträge einschliesslich Zinsen und Kosten auszuweisen, und zwar in voller Höhe und nicht bloss der Teil, der erst nach zwölf Monaten fällig ist.
- regel: 'Sicherheiten für Dritte: grundsätzlich volle Haftungssumme (Maximalbetrag) ausweisen. Ausnahme: nur der beanspruchte Betrag, wenn der Schuldner die gesicherte Schuld aufgrund
    fester Rückzahlungsvereinbarung ohne Einverständnis des Sicherungsgebers nicht wieder erhöhen kann. Patronatserklärungen nur, wenn die Erfüllung klagbar ist.'
  quelle: hwp-bur-2023__rz-0841-s347
  zitat: Ausweispflichtig ist grundsätzlich die volle Haftungssumme.
- regel: Drohen aus Sicherungsverpflichtungen oder Eventualverbindlichkeiten Verluste, ist eine Rückstellung zu bilden.
  quelle: hwp-bur-2023__rz-0842-s348
  zitat: Verluste drohen, sind Rückstellungen zu bilden
- regel: 'Besteht für eine Sicherungsverpflichtung bereits eine Rückstellung, besteht ein Darstellungswahlrecht: volle Offenlegung mit Hinweis auf die Rückstellung oder Ausweis nur über
    die Rückstellung hinaus.'
  quelle: hwp-bur-2023__rz-0842-s348
  zitat: In solchen Fällen besteht ein Darstellungswahlrecht
- regel: Belastete Aktiven werden zu Buchwerten wie in der Bilanz angegeben.
  quelle: hwp-bur-2023__rz-0846-s349
  zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen
- regel: 'AGB-Pfandrecht: Ausweispflicht, soweit bei der Bank ein nicht oder nicht vollständig besonders gesichertes Kreditverhältnis besteht; dann sämtliche Vermögenswerte bei allen
    Niederlassungen dieser Bank. Ohne Kreditverhältnis oder bei nicht beanspruchter Limite kein Ausweis.'
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: ein nicht oder nicht vollständig durch besondere Sicherheiten gesichertes Kreditverhältnis hat
- regel: 'Eventualverbindlichkeit vs. Rückstellung: grosse Schätzbandbreite rechtfertigt keinen Verzicht auf Rückstellung.'
  quelle: hwp-bur-2023__rz-0853-s350
  zitat: Eine grosse Spannbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten
- regel: 'Eventualverbindlichkeit im Anhang: Umschreibung der Verpflichtung und möglicher Umfang am Stichtag.'
  quelle: hwp-bur-2023__rz-0854-s350
  zitat: umfasst die Offenlegung im Anhang der Jahresrechnung eine Umschreibung der rechtlichen oder faktischen Verpflichtung
- regel: 'Ereignis mit Ursache vor dem Stichtag ist buchungspflichtig; Ursache nach dem Stichtag grundsätzlich nicht buchen, aber im Anhang angeben. Ausnahme: Hebt ein Ereignis nach
    dem Stichtag die Fortführungsfähigkeit auf, darf die Jahresrechnung nicht mehr auf Basis von Fortführungswerten erstellt werden (→ T1-318; Beurteilung WP).'
  quelle: hwp-bur-2023__rz-0861-s353
  zitat: Besteht die Ursache für ein Ereignis bereits am Bilanzstichtag
- regel: 'Ereignisse zwischen Bilanzstichtag und Freigabe der Jahresrechnung durch das zuständige Organ: Art und geschätzte finanzielle Auswirkung offenlegen; sonst Unmöglichkeit der
    Schätzung angeben.'
  quelle: hwp-bur-2023__rz-0860-s353
  zitat: zwischen dem Bilanzstichtag und der Freigabe der Jahresrechnung durch das zuständige Organ eintreten. Es sind die Art des Ereignisses und eine Schätzung der finanziellen Auswirkungen
    offenzulegen.
- regel: 'Empfohlen: Angabe des Datums der Freigabe der Jahresrechnung durch den VR; zeigt, bis wann Ereignisse nach dem Stichtag berücksichtigt sind.'
  quelle: hwp-bur-2023__rz-0863-s353
  zitat: Weiter empfiehlt sich auch die Angabe des Datums, wann die Jahresrechnung durch das zuständige Gremium
- regel: Beteiligung = langfristig gehaltene Anteile mit massgeblichem Einfluss; massgebend ist die Definition, nicht das gebuchte Konto.
  quelle: hwp-bur-2023__rz-0825-s344
  zitat: Als Beteiligungen gelten Anteile am Kapital eines anderen Unternehmens, die langfristig gehalten werden und einen massgeblichen Einfluss vermitteln.
- regel: Massgeblicher Einfluss wird ab 20 % der Stimmrechte (mindestens 20 %) vermutet.
  quelle: or__art-960d
  zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 Prozent der Stimmrechte gewähren.
- regel: 'Beteiligungsrechte/Optionen: nur die im Berichtsjahr zugeteilten, mit Anzahl und Wert.'
  quelle: hwp-bur-2023__rz-0858-s352-t1
  zitat: dass im Anhang nur die im Berichtsjahr zugeteilte Anzahl von Beteiligungsrechten und Optionen auf solche Rechte sowie deren Werte
- regel: 'Beteiligungsrechte/Optionen: Angaben getrennt für Leitungs-/Verwaltungsorgane und übrige Mitarbeitende; Nennwert ist als Wert ungeeignet (stattdessen z.B. Kurswert, Steuerwert,
    finanzmathematisch).'
  quelle: hwp-bur-2023__rz-0858-s352-t2
  zitat: Der Nennwert widerspiegelt den Wert der Vergütung in der Regel nicht.
- regel: 'Vollzeitstellen: Zurechnung nach Arbeitsvertrag; Teilzeit anteilig.'
  quelle: hwp-bur-2023__rz-0823-s344
  zitat: Teilzeitmitarbeitende können anteilig berücksichtigt werden.
- regel: 'Vollzeitstellen: Jahresdurchschnitt je nach Saisonalität aus den Monats- oder Quartalsendbeständen.'
  quelle: hwp-bur-2023__rz-0822-s344
  zitat: kann je nach Saisonalität vom Stand an den Monats- oder Quartalsenden ausgegangen werden
- regel: 'Bedeutung der Schwellen: 10 = Opting-out; 50 = eines von drei Kriterien für die ordentliche Revision bei Vereinen (Art. 69b Abs. 1 Ziff. 3 ZGB); 250 = eines von drei Kriterien
    für die ordentliche Revision (Art. 727 OR).'
  quelle: hwp-bur-2023__rz-0820-s343
  zitat: '10 Vollzeitstellen im Jahresdurchschnitt: Opting-out (Art. 727a Abs. 2 OR); • 50 Vollzeitstellen im Jahresdurchschnitt: eines von drei Kriterien bei Vereinen für die Beurteilung,
    ob die Vereinsrechnung ordentlich geprüft werden muss (Art. 69b ZGB); • 250 Vollzeitstellen im Jahresdurchschnitt: eines von drei Kriterien für die Beurteilung, ob die Jahresrechnung
    ordentlich geprüft werden muss (Art. 727 OR)'
- regel: 'Verbindlichkeiten gegenüber Vorsorgeeinrichtungen: Gesamtbetrag genügt üblicherweise.'
  quelle: hwp-bur-2023__rz-0838-s346
  zitat: Der Ausweis eines Gesamtbetrags genügt üblicherweise.
- regel: 'Bewertung zu Börsenkursen/Marktpreisen: Hinweis sowie gesonderte Offenlegung des Gesamtwerts, aufgeteilt in Wertschriften und übrige Aktiven.'
  quelle: hwp-bur-2023__rz-0818-s342-t2
  zitat: gesonderte Offenlegung des Gesamtwerts der entsprechenden Aktiven
- regel: Grössere Unternehmen (Art. 961a OR) sind die von Gesetzes wegen ordentlich revisionspflichtigen.
  quelle: hwp-bur-2023__rz-0871-s356
  zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, gelten als grössere Unternehmen im Sinne des Rechnungslegungsrechts
- regel: Revisionshonorar periodengerecht (Accrual) offenlegen.
  quelle: hwp-bur-2023__rz-0876-s356
  zitat: periodengerecht im Aufwand erfassten Honorare (Accrual-Prinzip)
- regel: 'Aufwertung: aufgewertete Position inkl. Bilanzposition, Aufwertungsreserve und Datum Prüfungsbericht angeben, solange die Reserve besteht.'
  quelle: hwp-bur-2023__rz-0906-s365
  zitat: aufgewertete Position (z.B. Beteiligung A / Grundstück B) inkl. Bilanzposition
- regel: Rangrücktritt ist in Bilanz oder Anhang auszuweisen und zu erläutern.
  quelle: hwp-er-2026__rz-0430-s127
  zitat: in der Jahresrechnung des Schuldners (in der Bilanz oder im Anhang) ausgewiesen und erläutert werden
fallstricke:
- text: Anteile unter 20 % können trotzdem Beteiligungen sein; die 20-%-Schwelle ist nur eine Vermutung.
  quelle: hwp-bur-2023__rz-0825-s344
  zitat: Der Umkehrschluss, dass Anteile unter 20 % keine Beteiligungen darstellen, ist unzulässig
- text: 'Katalogtext T1-101 («Stimmanteil von mehr als 20%») weicht vom Gesetz ab: Die Vermutung gilt ab mindestens 20 % (Art. 960d Abs. 3 OR); massgebend ist das Gesetz.'
  quelle: or__art-960d
  zitat: Dieser wird vermutet, wenn die Anteile mindestens 20 Prozent der Stimmrechte gewähren.
- text: Erworbene Anteile können unter anderen Konten (z.B. kurzfristige Forderungen) gebucht sein; Beteiligungen nicht nur aus dem Beteiligungskonto ableiten, Bilanzierung (Beteiligung
    vs. Forderung) dem WP vorlegen.
  quelle: hwp-bur-2023__rz-0825-s344
  zitat: Als Beteiligungen gelten Anteile am Kapital eines anderen Unternehmens, die langfristig gehalten werden und einen massgeblichen Einfluss vermitteln.
- text: 'Vertragliche Kündbarkeit genügt nicht: Leasing/Miete ist nur dann nicht anzugeben, wenn eine Kündigung auch wirtschaftlich möglich ist.'
  quelle: hwp-bur-2023__rz-0834-s345
  zitat: tatsächlich in der Lage sein, aus wirtschaftlicher Sicht eine Kündigung
- text: Garantien für eigenes Handeln (z.B. Erfüllungsgarantien gegenüber Kunden) sind keine Sicherheiten für Dritte nach Ziff. 8; Einordnung von Bankgarantien sorgfältig prüfen und
    WP vorlegen.
  quelle: hwp-bur-2023__rz-0842-s348
  zitat: Erfüllungsgarantien für eigenes Handeln zugunsten Dritter stellen keine Sicherungsverpflichtungen im Sinne des Gesetzes dar.
- text: 'Nicht nur den beanspruchten Kreditbetrag, sondern die volle Haftungssumme der Sicherheit ausweisen. Ausnahme: nur der beanspruchte Betrag, wenn der Schuldner die gesicherte
    Schuld aufgrund fester Rückzahlungsvereinbarung ohne Einverständnis des Sicherungsgebers nicht wieder erhöhen kann. Patronatserklärungen nur, wenn die Erfüllung klagbar ist.'
  quelle: hwp-bur-2023__rz-0841-s347
  zitat: Dies gilt auch dann, wenn das Ausmass des Grundgeschäfts
- text: 'AGB-Pfandrecht der Bank: Guthaben/Depots sind nur auszuweisen, wenn bei dieser Bank ein nicht oder nicht vollständig besonders gesichertes Kreditverhältnis besteht – dann aber
    alle Vermögenswerte bei allen Niederlassungen. Ohne Kreditverhältnis oder bei nicht beanspruchter Limite entfällt der Ausweis.'
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: sind gewährte Kreditlimiten nicht beansprucht, ist ein Ausweis unter dem Sicherstellungstitel nicht erforderlich
- text: Gebildete Rückstellung entbindet nicht von der Angabe einer deutlich höheren Eventualverbindlichkeit aus demselben Sachverhalt.
  quelle: hwp-bur-2023__rz-0854-s350
  zitat: ist es nicht ausreichend, aufgrund der gebildeten Rück
- text: Rangrücktritte sind keine Eventualverbindlichkeiten, aber als Erläuterung zu Bilanzpositionen offenzulegen.
  quelle: hwp-bur-2023__rz-0856-s351
  zitat: Sie stellen damit keine Eventualverbindlichkeiten im Sinne des Gesetzes dar
- text: 'Solidarhaftungen als Eventualverbindlichkeit: v.a. MWST-Gruppe (Art. 15 Abs. 1 lit. c MWSTG: Haftung für sämtliche von der Gruppe geschuldeten Steuern) und einfache Gesellschaft/ARGE;
    in der Praxis oft verbale Darstellung statt Betrag.'
  quelle: mwstg__art-15-t1
  zitat: jede zu einer Mehrwertsteuergruppe (Art. 13) gehörende Person oder Personengesellschaft, mit Ausnahme von Vorsorgeeinrichtungen, für sämtliche von der Gruppe geschuldeten Steuern
- text: Bereits gebuchte Ereignisse nach Stichtag fallen nicht unter Ziff. 13; Verwechslung buchungs-/offenlegungspflichtig vermeiden.
  quelle: hwp-bur-2023__rz-0862-s353
  zitat: Buchungspflichtige Ereignisse unterliegen nicht einer Offenlegung unter diesem Titel
- text: Rücktritt auf Ende der Amtsdauer mit erstattetem Bericht ist kein vorzeitiger Rücktritt; bei Abberufung sind die Gründe aber ebenfalls offenzulegen.
  quelle: hwp-bur-2023__rz-0868-s355-t3
  zitat: Bei einer Abberufung sind die Gründe, welche dazu geführt haben, ebenso im Anhang offenzulegen.
- text: Ziff. 15 erfasst nur Kapitalveränderungen, die der VR innerhalb eines Kapitalbands vornimmt; eine ordentliche Kapitalerhöhung durch die GV ist keine Kapitalband-Angabe.
  quelle: or__art-959c-t2
  zitat: alle Kapitalerhöhungen und Kapitalherabsetzungen, die der Verwaltungsrat innerhalb eines Kapitalbands vorgenommen hat
- text: Für den Zeitpunkt einer Kapitalerhöhung oder -herabsetzung ist grundsätzlich die Eintragung im Handelsregister massgebend (konstitutiv).
  quelle: hwp-bur-2023__rz-0866-s354
  zitat: Analog hat bei einer Kapitalerhöhung oder eine Kapitalherabsetzung die Eintragung im Handelsregister konstitutive Wirkung.
- text: Zwangs- und Schwankungsreserven gehören nicht zur offenlegungspflichtigen Nettoauflösung stiller Reserven.
  quelle: hwp-bur-2023__rz-0817-s341-t2
  zitat: so auch nicht die Schwankungsreserven, welche separat auszuweisen sind
- text: Eine Nettoauflösung unter der Gesamtwesentlichkeit kann offenlegungspflichtig sein, wenn sie einen Jahresverlust in einen Gewinn dreht (z.B. bei negativem Eigenkapital); Gesamtwesentlichkeit
    nicht als alleiniges Kriterium verwenden.
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: wenn aufgrund der Auflösung von stillen Reserven ein Jahresgewinn anstelle eines Jahresverlusts entsteht
- text: Die genaue Zahl der Vollzeitstellen ist nicht anzugeben, nur die Schwelle.
  quelle: hwp-bur-2023__rz-0821-s343
  zitat: Die genaue Anzahl der Vollzeitzeitstellen ist hingegen nicht offenzulegen.
- text: Auszubildende gelten üblicherweise als Teilzeit-, nicht als Vollzeitangestellte (Ansichten uneinheitlich).
  quelle: hwp-bur-2023__rz-0823-s344
  zitat: werden Auszubildende üblicherweise nicht als Vollzeit-, sondern als Teilzeitangestellte
- text: Art. 961a OR (Fälligkeiten langfristiger Verbindlichkeiten, Revisionshonorar) gilt nur für grössere Unternehmen = von Gesetzes wegen ordentlich revisionspflichtige. Ist die eingeschränkte
    Revision zulässig, ist er nicht anwendbar; Hinweise auf ein Überschreiten von Art. 727 Abs. 1 OR betreffen die Revisionsart → Pendenz an WP.
  quelle: hwp-bur-2023__rz-0871-s356
  zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, gelten als grössere Unternehmen im Sinne des Rechnungslegungsrechts
- text: Ausstehende Anleihensobligationen bedeuten ordentliche Revisionspflicht (Publikumsgesellschaft).
  quelle: or__art-727
  zitat: Anleihensobligationen ausstehend haben,
- text: 'SER-Grenze: Bankbestätigungen werden in der eingeschränkten Revision nicht eingeholt (SER Anhang D: nicht Bestandteil der eingeschränkten Revision); nur vorhandene Bankunterlagen
    auswerten, keine PBC-Pendenz «Bankbestätigung einholen» ohne Anweisung des WP.'
  quelle: ser-2022__anh-d-s074-2
  zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
- text: 'SER-Grenze: Anwaltsbestätigungen werden nicht eingeholt (SER Anhang D: nicht Bestandteil der eingeschränkten Revision); vorhandene Anwaltskorrespondenz und Kontendurchsicht
    in neuer Rechnung nutzen, Restrisiko dem WP melden.'
  quelle: ser-2022__anh-d-s088-1
  zitat: Einholen von Anwaltsbestätigungen und/oder Experten-Gutachten
- text: 'Der Agent kann Befragungen nicht selbst führen: schriftliche Antworten auswerten oder Frage als Pendenz erfassen; Befragungsschritte höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz; höchstens «teilweise bearbeitet»'
- text: 'Kein Kundenversand durch den Agenten: Fragen an den Kunden nur als Pendenz (revio-Notiz) erfassen; die Einholung beim Kunden machen Mitarbeitende/WP.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- text: WP-Schritte (T1-308) nur auf Anweisung des WP vorbereiten; ob der Agent WP-Schritte vorbereitet, ist im Konzept ein offener Entscheid.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: Visum, Abschluss und Review des Prüffelds bleiben beim Menschen.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: 'Visum (Kürzel und Datum) pro Schritt, ✓ pro Prüffeld, «Abgeschlossen» und «Review» in der Fusszeile, Status in Bereich 10: alles bleibt beim Menschen.'
- text: 'Anhangsprüfung nicht erst am Schluss: frühzeitig beginnen, damit Anpassungen rechtzeitig erfolgen können.'
  quelle: hwp-er-2026__rz-0077-s193
  zitat: Sie wird idealerweise nicht erst gegen Ende des Prüfungsprozesses, sondern bereits zu einem früheren Zeitpunkt vorgenommen
- text: 'Praxis/intern: Katalogschritt T1-173 hat keinen Text; T1-319 hat Kennzeichnung «?» und keine Prüfziele – zuerst in revio nachlesen; Inhalt bzw. Zuordnung einmalig durch WP/consis
    bestätigen lassen (keine Pendenz je Mandat).'
fragen_kunde:
- frage: Hält die Gesellschaft direkt oder indirekt Anteile an anderen Unternehmen (auch unter 20 % mit massgeblichem Einfluss, auch nicht als Beteiligung gebuchte Anteile)? Bitte Liste
    mit Firma, Rechtsform, Sitz, Kapital- und Stimmanteil sowie Halteabsicht.
  zweck: T1-101 Beteiligungen (Art. 959c Abs. 2 Ziff. 3 OR)
- frage: Hält die Gesellschaft oder ein von ihr kontrolliertes Unternehmen eigene Anteile? Gab es im Geschäftsjahr Erwerbe/Veräusserungen (Datum, Anzahl, Preis, Bedingungen)?
  zweck: T1-102, T1-317 eigene Anteile
- frage: Bestehen nicht bilanzierte Leasing- oder Mietverträge, die nicht innert zwölf Monaten nach dem Stichtag auslaufen oder (wirtschaftlich) gekündigt werden können? Bitte Verträge
    und Restbetrag.
  zweck: T1-103 (Art. 959c Abs. 2 Ziff. 6 OR)
- frage: Bestehen per Stichtag Verbindlichkeiten gegenüber Vorsorgeeinrichtungen (Beiträge, Kontokorrent, Darlehen)? Bitte Kontoauszug der Vorsorgeeinrichtung per 31.12.
  zweck: T1-104, T1-309
- frage: 'Hat die Gesellschaft Bürgschaften, Garantien, Pfandbestellungen, Sicherungszessionen oder Patronatserklärungen zugunsten Dritter abgegeben oder verändert? Bitte Haftungsbeträge
    und allfällige Rückstellungen dafür. Bei Krediten Dritter: Besteht eine feste Rückzahlungsvereinbarung? Sind Patronatserklärungen rechtlich verbindlich (klagbar)?'
  zweck: T1-105 (Art. 959c Abs. 2 Ziff. 8 OR)
- frage: Welche Aktiven sind zur Sicherung eigener Verbindlichkeiten verpfändet oder abgetreten (z.B. Globalzession, Guthaben/Depots bei kreditgebender Bank, Bardepots/Sicherheitsleistungen
    bei Behörden, Kautionen) oder stehen unter Eigentumsvorbehalt? Welche Kreditlimiten waren am Stichtag beansprucht?
  zweck: T1-106 (Art. 959c Abs. 2 Ziff. 9 OR)
- frage: Bestehen Rechtsstreitigkeiten, Garantie-/Gewährleistungsfälle, Konventionalstrafen oder Solidarhaftungen, für die keine Rückstellung gebildet wurde? Wie wird die Eintretenswahrscheinlichkeit
    beurteilt? Ist die Gesellschaft Mitglied einer MWST-Gruppe oder Gesellschafterin einer einfachen Gesellschaft/ARGE?
  zweck: T1-107 Eventualverbindlichkeiten
- frage: Wurden im Geschäftsjahr Aktien oder Optionen an VR, Geschäftsleitung oder Mitarbeitende zugeteilt (Anzahl, Wert, Bewertungsmethode)?
  zweck: T1-108 (Art. 959c Abs. 2 Ziff. 11 OR)
- frage: Sind nach dem Bilanzstichtag wesentliche Ereignisse eingetreten (Verluste, Klagen, Debitorenausfälle, Kapitalmassnahmen, Verträge)? Mit welcher geschätzten finanziellen Auswirkung?
    Wann hat der VR die Jahresrechnung freigegeben?
  zweck: T1-109 Ereignisse nach dem Bilanzstichtag
- frage: Sehen die Statuten ein Kapitalband vor, und hat der VR im Geschäftsjahr innerhalb dieses Bands das Kapital erhöht oder herabgesetzt?
  zweck: T1-110 (Art. 959c Abs. 2 Ziff. 15 OR)
- frage: Nach welcher Methode werden die stillen Reserven ermittelt, hat sie gegenüber dem Vorjahr geändert, und wie haben sich Bestand und Veränderung je Bilanzposition entwickelt?
  zweck: T1-111, T1-305
- frage: Ist im Geschäftsjahr eine Revisionsstelle vorzeitig zurückgetreten oder abberufen worden? Falls ja, bitte Rücktrittsschreiben bzw. Beschluss.
  zweck: T1-112, T1-402
