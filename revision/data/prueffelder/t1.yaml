- id: T1-305
  vorgehen: 'Veränderung der stillen Reserven aus T1-111 übernehmen. Bei Nettoauflösung mit dem bereinigten Jahresergebnis (vor Auflösung) vergleichen und immer kennzeichnen, wenn die
    Auflösung einen Verlust in einen Gewinn dreht; Beurteilung im Einzelfall. Falls offenlegungspflichtig: Nettobetrag mit Anhang abgleichen. Zwangs- und Schwankungsreserven ausklammern;
    Urteil «wesentlich günstiger» dem WP vorlegen.'
  nachweise:
  - Aufstellung stille Reserven (T1-111)
  - Erfolgsrechnung (Jahresergebnis)
  - Wesentlichkeit (3.3)
  - Anhang
  rechnen: Nettoauflösung = Total stille Reserven Vorjahr − Total Stichtag (falls > 0); Verhältnis zum bereinigten Jahresergebnis (Ergebnis vor Auflösung); immer kennzeichnen, wenn die
    Auflösung einen Verlust in einen Gewinn dreht; Gesamtwesentlichkeit nur als Massstab für die Feststellung; Anhangsbetrag = Nettoauflösung (reiner Betrag der gesamthaften Reservenauflösung,
    nicht korrigiert um latente Steuern – verbreitete Praxis); Urteil WP
  feststellung_wenn: Nettoauflösung offenlegungspflichtig (wesentlich ggü. bereinigtem Ergebnis oder Verlust→Gewinn), aber ohne Anhangsangabe oder mit abweichendem Betrag; Ermittlungsunterlagen
    fehlen → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die Nettoauflösung von stillen Reserven (wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird)?
  - quelle: or__art-959c-t1
    zitat: soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven übersteigt, wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
  - quelle: hwp-bur-2023__rz-0675-s298
    zitat: mit dem tatsächlichen (bereinigten) Jahresergebnis verglichen werden
  - quelle: hwp-bur-2023__rz-0675-s298
    zitat: wenn aufgrund der Auflösung von stillen Reserven ein Jahresgewinn anstelle eines Jahresverlusts entsteht
  - quelle: hwp-bur-2023__rz-0817-s341-t1
    zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
  - quelle: hwp-bur-2023__rz-0817-s341-t2
    zitat: Die verlangte Offenlegung wird nach verbreiteter Praxis als reiner Betrag der gesamthaften Reservenauflösung aufgefasst, also nicht korrigiert um Änderungseffekte in den latenten
      Steuern.
  - quelle: muster-hwp-er-2026__c025-1
    zitat: Nettoauflösung stiller Reserven im Anhang nicht offengelegt
- id: T1-306
  vorgehen: 'Prüfen, ob zutreffende weitere Angaben offengelegt sind: (1) Abweichungen von Stetigkeit und Fortführung; (2) bei Fremdwährungsabschluss: Werte zusätzlich in Landeswährung
    (CHF) und verwendete Umrechnungskurse; (3) Bewertung zu Börsen-/Marktpreisen (Hinweis, Gesamtwert aufgeteilt in Wertschriften und übrige Aktiven) und Schwankungsreserven; (4) Aufwertungen
    (Art. 725c OR); (5) Spezialgesetze, v.a. Vermögensübertragung (Art. 74 FusG, nur übertragende Gesellschaft): im Anhang rechtlich und wirtschaftlich erläutert und begründet – Zweck
    und Folgen, Übertragungsvertrag, Gegenleistung, Folgen für Arbeitnehmende/Sozialplan; entfällt, wenn übertragene Aktiven < 5 % der Bilanzsumme. Je Punkt «zutreffend/nicht zutreffend»
    mit Nachweis dokumentieren.'
  nachweise:
  - Anhang
  - Saldoliste/Bewertungsunterlagen
  - VR-/GV-Protokolle
  - Arbeitspapiere übrige Prüffelder
  rechnen: 'Bei Kursbewertung: Gesamtwert Wertschriften + übrige Aktiven zu Kurs-/Marktwerten gemäss Saldoliste = Anhangsangabe; Vermögensübertragung: übertragene Aktiven / Bilanzsumme
    der übertragenden Gesellschaft (mit `rechne`); ≥ 5 % → Anhangspflicht Art. 74 FusG'
  feststellung_wenn: Ein zutreffender Sachverhalt (Methodenwechsel, Fortführungsabweichung, Fremdwährung (Werte in CHF oder Kurse fehlen), Kursbewertung, Schwankungsreserve, Aufwertung,
    FusG) ist im Anhang nicht oder unvollständig offengelegt.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: weitere vom Gesetz verlangte Angaben
  - quelle: or__art-958d
    zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
  - quelle: or__art-958d
    zitat: Wird nicht die Landeswährung verwendet, so müssen die Werte zusätzlich in der Landeswährung angegeben werden.
  - quelle: ser-2022__anh-d-s098-3
    zitat: Sind die Werte in Landeswährung und die verwendeten Umrechnungskurse im Anhang angegeben
  - quelle: ser-2022__anh-d-s098-3
    zitat: Weist der Anhang darauf hin, dass ggf. Aktiven zum Börsenkurs oder beobachtbaren
  - quelle: hwp-bur-2023__rz-0818-s342-t2
    zitat: gesonderte Offenlegung des Gesamtwerts der entsprechenden Aktiven
  - quelle: or__art-960b
    zitat: Der Betrag der Schwankungsreserven ist insgesamt in der Bilanz oder im Anhang gesondert auszuweisen.
  - quelle: hwp-bur-2023__rz-0818-s342-t2
    zitat: Angaben über Gegenstand und Betrag von Aufwertungen nach Art. 725c OR.
  - quelle: hwp-bur-2023__rz-0818-s342-t2
    zitat: Angaben gemäss Spezialgesetzen.
  - quelle: fusg__art-74
    zitat: Das oberste Leitungs- oder Verwaltungsorgan der übertragenden Gesellschaft muss die Gesellschafterinnen und Gesellschafter über die Vermögensübertragung im Anhang zur Jahresrechnung
      informieren.
  - quelle: fusg__art-74
    zitat: der Zweck und die Folgen der Vermögensübertragung
  - quelle: fusg__art-74
    zitat: Die Informationspflicht entfällt, falls die übertragenen Aktiven weniger als 5 Prozent der Bilanzsumme der übertragenden Gesellschaft ausmachen.
- id: T1-307
  vorgehen: Beurteilen, ob für Dritte wesentliche oder branchenübliche Zusatzangaben in Bilanz, ER oder Anhang fehlen (z.B. Rangrücktritte, Verfügungsbeschränkungen wie Mietkautionen,
    Zusammensetzung wesentlicher Sammelpositionen, Rückstellungsspiegel). Sachverhalte aus den übrigen Prüffeldern sammeln und im Textfeld als Vorschlag an den WP festhalten.
  nachweise:
  - Bilanz, ER, Anhang
  - Arbeitspapiere übrige Prüffelder
  - Rangrücktrittsvereinbarungen, Verträge mit Verfügungsbeschränkungen
  rechnen: ''
  feststellung_wenn: Für die Beurteilung der Vermögens-, Finanz- oder Ertragslage wesentlicher Sachverhalt (z.B. Rangrücktritt) weder in Bilanz/ER noch im Anhang erläutert.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Werden die für die Beurteilung der Vermögens-, Finanz- und Ertragslage durch Dritte
  - quelle: or__art-959a-t2
    zitat: Weitere Positionen müssen in der Bilanz oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Vermögens- oder Finanzierungslage durch Dritte wesentlich
  - quelle: or__art-959b-t2
    zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
  - quelle: hwp-er-2026__rz-0430-s127
    zitat: Der Umstand, dass ein Gläubiger dem Unternehmen für seine Forderung einen Rangrücktritt gewährt hat, ist für die Beurteilung der Vermögens- und Finanzierungslage durch Dritte
      wesentlich
- id: T1-308
  vorgehen: 'Ohne Anweisung des WP: kein Eintrag im Textfeld; im Rapport «nicht bearbeitet – WP-Schritt» mit Grund; nur konkrete Hinweise für den WP als Notiz «Schlussbesprechung» bzw.
    «Pendenz». Mit Anweisung: Weiter gehende Prüfungshandlung (Kennzeichnung WP; nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem Risiko). Belege je betragsmässiger Anhangsangabe
    aus M-Files bereitstellen (Verträge, vorhandene Bestätigungen, Aufstellungen) und Anhangs- und Belegbetrag gegenüberstellen; Auswahl und Umfang legt der WP fest.'
  nachweise:
  - Anweisung des WP (Auswahl, Umfang)
  - Belege je Anhangsposten (Verträge, vorhandene Bestätigungen, Aufstellungen)
  - Anhang
  rechnen: 'Je Anhangsposten: Betrag Anhang − Betrag gemäss Beleg = Differenz'
  feststellung_wenn: Anhangsbetrag nicht durch Beleg gestützt oder Differenz zum Beleg; Beleg fehlt → PBC-Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s099-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen oder anderen geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s099-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
  - quelle: flussdiagramm-revisionsagent-2026__s001-3
    zitat: Grund für den Rapport
- id: T1-309
  vorgehen: Anhangsangabe der Verbindlichkeiten gegenüber Vorsorgeeinrichtungen mit Kontoauszug bzw. Saldobestätigung der Vorsorgeeinrichtung per 31.12. und mit dem Konto BVG (Saldoliste/Hauptbuch)
    abstimmen; Dezemberbeiträge und Schlussabrechnung berücksichtigen. Fehlender Auszug → PBC-Pendenz.
  nachweise:
  - Kontoauszug/Saldobestätigung Vorsorgeeinrichtung per 31.12.
  - Hauptbuch Konto BVG
  - Anhang
  rechnen: Saldo gemäss Kontoauszug Vorsorgeeinrichtung per 31.12. = Passivsaldo Konto BVG = Anhangsangabe
  feststellung_wenn: Differenz zwischen Kontoauszug, Buchsaldo und Anhang, oder Kontoauszug nicht vorhanden.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: hwp-bur-2023__rz-0838-s346
    zitat: Der Ausweis eines Gesamtbetrags genügt üblicherweise.
- id: T1-310
  vorgehen: 'Konten ausserordentlicher, einmaliger und periodenfremder Aufwand/Ertrag (Saldoliste, Hauptbuch) mit der Anhangserläuterung abgleichen; Identifikationskriterien mit Vorjahr
    vergleichen und prüfen, ob wesentliche Posten (Ursache, Betrag) erläutert sind. Einmalige Vorgänge aus anderen Prüffeldern (z.B. Kulanz, Nachbuchungen Vorjahr, Anlagenverkäufe) einbeziehen.
    Je erläutertem Posten die Klassierung prüfen (Regeln: `prueffeld SCH5` Bewertung/Fallstricke; Ergebnisse aus SCH5-102/SCH5-202 übernehmen): Posten aus der normalen Geschäftstätigkeit,
    auch unüblich grosse (z.B. Lieferantenrabatte, Gutschriften, Rückerstattungen), sowie Schätzungsänderungen sind betrieblich; im Zweifel betrieblich.'
  nachweise:
  - Saldoliste und Hauptbuch a.o. Konten
  - Anhang (Erläuterung a.o. Positionen)
  - Erfolgsrechnung
  - Verträge zu einmaligen Vorgängen (z.B. Anlagenverkauf)
  rechnen: Total a.o. Aufwand/Ertrag gemäss Anhang (falls angegeben) = ER = Saldoliste; wesentliche Einzelposten mit Ursache erläutert (nicht jeder Posten)
  feststellung_wenn: Wesentlicher a.o./einmaliger/periodenfremder Posten nicht erläutert, oder angegebenes Total im Anhang stimmt nicht mit ER/Saldoliste überein, oder erläuterter Posten
    ist betrieblich (Fehlklassierung → Notiz «Wesentliche Feststellung» mit Umgliederungsvorschlag, ergebnisneutral, keine Verbuchung).
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
  - quelle: hwp-bur-2023__rz-0859-s353
    zitat: Wesentliche Posten sind im Anhang zu erläutern, wie beispielsweise Ursachen eines solchen Ereignisses (Schadensfall etc.).
  - quelle: ser-2022__anh-d-s096-1
    zitat: Vergleich der Salden und Identifikationskriterien mit dem Vorjahr
  - quelle: hwp-bur-2023__rz-0800-s330-t2
    zitat: Gleiches gilt auch für unüblich grosse Posten, soweit sie aus der normalen Geschäftstätigkeit des Unternehmens stammen.
  - quelle: hwp-bur-2023__rz-0800-s330-t1
    zitat: im Zweifelsfall als Teil des ordentlichen bzw. betrieblichen Ergebnisses zu klassifizieren sein wird
- id: T1-315
  vorgehen: Nahestehende über schriftliche Antwort/Vollständigkeitserklärung, Aktienbuch, HR-Auszug und GV-/VR-Protokolle identifizieren. Forderungen und Verbindlichkeiten gegenüber
    Beteiligten, Organen und Beteiligungsgesellschaften aus Saldoliste und Darlehensverträgen erheben; prüfen, ob sie in Bilanz oder Anhang gesondert ausgewiesen sind und Beträge (inkl.
    Zinsen, Vorjahr) stimmen. Rangrücktritte (Betrag, Umfang) mit Vereinbarungen abgleichen.
  nachweise:
  - Saldoliste/Hauptbuch
  - Darlehensverträge, Rangrücktrittsvereinbarungen
  - Aktienbuch, HR-Auszug, GV-/VR-Protokolle
  - Anhang
  - Vollständigkeitserklärung (nahestehende Personen)
  rechnen: Summe Konten ggü. Beteiligten/Organen/Beteiligungen = gesonderter Ausweis Bilanz + Anhang; Summe Rangrücktritte gemäss Vereinbarungen vs. Anhang
  feststellung_wenn: Position ggü. Beteiligten/Organen/Beteiligungen weder in Bilanz noch Anhang gesondert; Betrags- oder Vorjahresdifferenz; Rangrücktritt nicht erläutert.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-3
    zitat: Sind Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten
  - quelle: ser-2022__anh-d-s098-3
    zitat: in der Bilanz oder im Anhang ausgewiesen (Art. 959a Abs. 4 OR)?
  - quelle: or__art-959a-t2
    zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: ser-2022__anh-e-s103-2
    zitat: der Ausweis von Guthaben und Verbindlichkeiten gegenüber nahestehenden Personen (Art. 959a Abs. 4 OR) ist vollständig und richtig.
- id: T1-316
  vorgehen: 'Feststellen, ob die Erfolgsrechnung als Absatzerfolgsrechnung (Umsatzkostenverfahren) gegliedert ist. Falls ja: Personalaufwand sowie Abschreibungen und Wertberichtigungen
    auf Anlagevermögen im Anhang mit Personalkonten und Anlagespiegel abstimmen. Bei Produktionserfolgsrechnung «nicht zutreffend» dokumentieren.'
  nachweise:
  - Erfolgsrechnung
  - Anhang
  - Personalkonten/Lohnjournal
  - Anlagespiegel
  rechnen: Personalaufwand Anhang = Summe Personalkonten; Abschreibungen/WB Anhang = Abschreibungen gemäss Anlagespiegel
  feststellung_wenn: Absatzerfolgsrechnung ohne Anhangsangabe Personalaufwand bzw. Abschreibungen/Wertberichtigungen, oder Betrag weicht ab.
  fundstellen:
  - quelle: or__art-959b-t2
    zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens ausgewiesen
      werden.
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang bei Anwendung der Absatzerfolgsrechnung (Umsatzkostenverfahren) den Personalaufwand sowie die Abschreibungen und Wertberichtigungen auf
- id: T1-317
  vorgehen: Anhangsangaben zu eigenen Anteilen (Anzahl per Stichtag; Erwerb/Veräusserung mit Datum, Anzahl, Art, Preis, Bedingungen) mit Aktienbuch, Kaufverträgen, Konto eigene Kapitalanteile
    und VR-Beschlüssen abgleichen (Ergebnis T1-102 übernehmen). Ohne eigene Anteile «nicht zutreffend» mit Nachweis dokumentieren.
  nachweise:
  - Aktienbuch
  - Kaufverträge eigene Anteile
  - Saldoliste Konto eigene Kapitalanteile
  - VR-Beschlüsse
  - Anhang
  rechnen: Bestand eigene Anteile Vorjahr + Erwerbe − Veräusserungen = Bestand Stichtag (Anzahl und Buchwert)
  feststellung_wenn: Anzahl oder Transaktionen eigener Anteile im Anhang fehlen oder weichen von Aktienbuch/Buchhaltung ab.
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
  - quelle: or__art-959c-t1
    zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
  - quelle: hwp-bur-2023__rz-0829-s345
    zitat: Zumindest anzugeben sind das Datum, die Anzahl und die Art der Anteile, der bezahlte Preis sowie weitere Bedingungen wie beispielsweise Rückkaufvereinbarungen.
- id: T1-318
  vorgehen: 'Ergebnis der Fortführungsbeurteilung (Planung; SER Anhang G) übernehmen. Bei Abweichung von der Fortführung: Vermerk und Einfluss auf die wirtschaftliche Lage im Anhang
    prüfen; bei wesentlicher Unsicherheit (z.B. Überschuldung mit Rangrücktritten, negatives Eigenkapital, angespannte Liquidität) prüfen, ob sie klar offengelegt ist. Folgen für den
    Bericht (Zusatz/Modifizierung) entscheidet der WP.'
