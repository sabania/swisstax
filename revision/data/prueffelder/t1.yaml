  - Anhang (Fortführung, Ereignisse)
  - Fortführungsbeurteilung/Liquiditätsplanung
  - Rangrücktrittsvereinbarungen
  rechnen: ''
  feststellung_wenn: Abweichung von der Fortführung nicht vermerkt oder Einfluss nicht dargelegt; wesentliche Fortführungsunsicherheit im Anhang nicht oder unzureichend offengelegt.
  fundstellen:
  - quelle: or__art-958a
    zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken; ihr Einfluss auf die wirtschaftliche Lage ist darzulegen.
  - quelle: ser-2022__anh-d-s098-3
    zitat: Werden Abweichungen von der Annahme der Fortführung im Anhang vermerkt und
  - quelle: ser-2022__anh-g-s141-2
    zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang der Jahresrechnung trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
  - quelle: hwp-er-2026__rz-0199-s226
    zitat: Bestehen erhebliche Zweifel an der Fortführungsfähigkeit, muss dies in der Jahresrechnung klar offengelegt werden.
  - quelle: hwp-er-2026__rz-0200-s226-t1
    zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
- id: T1-319
  vorgehen: 'Kennzeichnung «?» (Prüfziele leer) → bis zur Klärung wie WP-Schritt: ohne Anweisung kein Eintrag im Textfeld, im Rapport «nicht bearbeitet – Kennzeichnung «?» (wie WP)»;
    Hinweise für den WP als Notiz «Pendenz». Hinweis an WP/consis: im SER Anhang D u) empfohlene Detailprüfung (S. 98), nicht weiter gehend → Kennzeichnung in revio prüfen. Mit Anweisung:
    Feststellen, ob eine Aufwertung von Grundstücken/Beteiligungen nach Art. 725c OR erfolgt ist (Aufwertungsreserve, VR-Beschluss, Bestätigung der Revisionsstelle). Falls ja: Anhang
    auf Position inkl. Bilanzposition, Höhe/Veränderung der Aufwertungsreserve und Datum des Prüfungsberichts prüfen; sonst «nicht zutreffend».'
  nachweise:
  - Saldoliste (Aufwertungsreserve)
  - VR-Beschluss Aufwertung
  - Schriftliche Bestätigung Revisionsstelle/zugelassener Revisor
  - Anhang
  rechnen: Aufwertungsreserve gemäss Saldoliste = Aufwertungsbetrag gemäss Anhang ± nachgelagerte Veränderungen (Spiegel)
  feststellung_wenn: Aufwertung ohne Anhangsangabe (Gegenstand, Betrag, Prüfungsbericht), Betrag weicht von Aufwertungsreserve ab, oder schriftliche Bestätigung fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-3
    zitat: Werden im Anhang ggf. Angaben über Gegenstand und Betrag von Aufwertungen gemacht?
  - quelle: or__art-725c
    zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
  - quelle: hwp-bur-2023__rz-0906-s365
    zitat: Datum des Prüfungsberichts der Revisionsstelle resp. des zugelassenen Revisors oder der zugelassenen Revisorin.
- id: T1-173
  vorgehen: 'Katalogtext leer (EP; Prüfziele DO, RI) – Schritttext zuerst in revio nachlesen (Aktivität); fehlt er auch dort: Inhalt durch WP/consis zu bestätigen (Katalogpflege einmalig
    melden, keine Pendenz je Mandat). Vorschlag (Annahme, ohne Katalogtext): Schlussdurchsicht des Anhangs auf vollständige Offenlegung der aus den Befragungen T1-101 bis T1-112 zutreffenden
    Positionen gemäss Art. 959c OR, inkl. Firma/Rechtsform/Sitz. Je Befragungsergebnis «offengelegt / nicht zutreffend / fehlt» dokumentieren.'
  nachweise:
  - Ergebnisse T1-101 bis T1-112
  - Anhang
