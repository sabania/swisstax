  vorgehen: Jede betragsmässige Anhangsangabe (Aufschlüsselungen, nahestehende Parteien, a.o. Positionen, Mietverpflichtungen, Vorjahr) mit Bilanz, Erfolgsrechnung und Saldoliste abstimmen
    und Summen nachrechnen. Differenzen je Angabe mit Konto und Betrag im Textfeld festhalten.
