- id: T1-301
  vorgehen: 'Anhang der definitiven Jahresrechnung (M-Files/revio 1.1) gegen Gliederung Art. 959c OR prüfen: Hinweis auf Rechnungslegungsrecht, angewandte Grundsätze, Erläuterungen zu
    Bilanz/ER, Nettoauflösung stiller Reserven, weitere gesetzliche Angaben, Pflichtangaben Abs. 2 inkl. Firma/Rechtsform/Sitz (genügt auch im Titel oder in Kopf-/Fusszeile) und Vorjahresangaben.
    Checkliste «vorhanden/nicht zutreffend/fehlt» im Textfeld. Fehlt der Anhang: nur zulässig bei Einzelunternehmen/Personengesellschaften, die nicht nach den Vorschriften für grössere
    Unternehmen rechnungslegungspflichtig sind; dann die von der Mindestgliederung verlangten Zusatzangaben direkt in Bilanz/ER prüfen.'
