- id: T1-302
  vorgehen: Im Anhang beschriebene Grundsätze (z.B. Vorräte, angefangene Arbeiten, Umsatzerfassung, Rückstellungen, Fremdwährung) mit den in den Prüffeldern festgestellten Methoden vergleichen;
    Änderungen gegenüber Vorjahr und deren Begründung prüfen. Bei freiwillig weitergehenden Angaben und Bildung/Auflösung stiller Reserven den Hinweis darauf prüfen. Abweichungen mit
    Verweis auf das Prüffeld im Textfeld dokumentieren.
  nachweise:
