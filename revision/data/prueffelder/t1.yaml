schritte:
- id: T1-101
  vorgehen: 'Agent befragt nicht selbst: schriftliche Antwort (Kundenbefragung/Vollständigkeitserklärung) auswerten, sonst Frage als Pendenz an VR/GF. Abgleich mit Saldoliste/Hauptbuch
    (Beteiligungs-, Finanzanlage- und Anzahlungskonten), Kaufverträgen über Anteile und Anhang: je direkte/wesentliche indirekte Beteiligung Firma, Rechtsform, Sitz, Kapital- und Stimmenanteil.
    Quelle der Antwort und Abdeckung EX/DO im Textfeld festhalten.'
  nachweise:
  - Schriftliche Antwort VR/GF bzw. Kundenbefragung
  - Beteiligungsliste, Kaufverträge über Anteile
  - Saldoliste/Hauptbuch
  - Anhang der Jahresrechnung
  rechnen: Stimmanteil je Gesellschaft = gehaltene Stimmrechte / total Stimmrechte; Kennzeichnung >= 20 % (Vermutung Beteiligung, Art. 960d Abs. 3 OR)
  feststellung_wenn: Beteiligung (auch < 20 % mit massgeblichem Einfluss) bekannt, aber im Anhang fehlend oder ohne Firma/Rechtsform/Sitz/Kapital- und Stimmenanteil; Antwort fehlt →
    Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach direkt oder wesentlichen indirekt gehaltenen Anteilen an anderen
  - quelle: or__art-959c-t1
    zitat: Firma, Rechtsform und Sitz der Unternehmen, an denen direkte oder wesentliche indirekte Beteiligungen bestehen, unter Angabe des Kapital- und des Stimmenanteils
  - quelle: hwp-bur-2023__rz-0825-s344
    zitat: Der Umkehrschluss, dass Anteile unter 20 % keine Beteiligungen darstellen, ist unzulässig
- id: T1-102
  vorgehen: Frage nach Bestand per Stichtag sowie Erwerb/Veräusserung eigener Anteile (auch durch kontrollierte Unternehmen) als Pendenz erfassen bzw. schriftliche Antwort auswerten.
    Abgleich mit Aktienbuch (Anzahl Aktien vs. Aktienkapital gemäss Statuten/HR), Konto eigene Kapitalanteile und VR-/GV-Protokollen. Ergebnis mit Verweis auf T1-317 dokumentieren.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Aktienbuch
  - Saldoliste (Konto eigene Kapitalanteile)
  - VR-/GV-Protokolle, Kaufverträge eigene Aktien
  rechnen: Summe Aktien gemäss Aktienbuch vs. Anzahl Aktien gemäss Statuten/HR; Differenz klären (eigene oder nicht eingetragene Anteile)
  feststellung_wenn: Eigene Anteile vorhanden oder gehandelt, aber Anzahl, Transaktionen oder Bedingungen im Anhang fehlen; Widerspruch Aktienbuch zu Kapital; Antwort fehlt → Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile durch das Unternehmen selbst oder durch Unternehmen, an denen eine Beteiligung besteht
  - quelle: or__art-959c-t1
    zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
  - quelle: or__art-959c-t1
    zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
- id: T1-103
  vorgehen: Frage nach nicht bilanzierten Leasing- und Mietverträgen mit Laufzeit/Kündbarkeit > 12 Monate als Pendenz bzw. Antwort auswerten. Verträge in M-Files suchen (Miet-, Leasingverträge;
    Konten Raumaufwand/Leasing), Restbetrag bis Vertragsende bzw. Ablauf Kündigungsfrist nachrechnen und mit Anhang vergleichen. Wirtschaftliche Kündbarkeit dem WP zur Beurteilung vorlegen.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Miet- und Leasingverträge
  - Kontoblätter Raumaufwand/Leasing
  - Anhang (Angabe Leasing-/Mietverbindlichkeiten)
  rechnen: Restbetrag = Summe der bis Vertragsende bzw. Ablauf Kündigungsfrist geschuldeten Raten/Mietzinse (Nominalwert, inkl. Zinsen und Kosten); Differenz zur Anhangsangabe
  feststellung_wenn: Langfristige Leasing- oder Mietverpflichtung nicht oder zu tief im Anhang; Differenz zwischen berechnetem Restbetrag und Anhang über der Toleranzwesentlichkeit.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach nicht bilanzierten Leasing- und Mietverpflichtungen, welche nicht in
  - quelle: or__art-959c-t2
    zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen, sofern diese nicht innert zwölf Monaten ab Bilanzstichtag
      auslaufen
  - quelle: hwp-bur-2023__rz-0835-s346
    zitat: Langfristige Mietverträge sind wirtschaftlich den Leasingverbindlichkeiten im engeren Sinne gleichzusetzen.
  - quelle: hwp-bur-2023__rz-0836-s346
    zitat: noch zu leistenden Beträge einschliesslich Zinsen und Kosten auszuweisen, und zwar in voller Höhe und nicht bloss der Teil, der erst nach zwölf Monaten fällig ist.
- id: T1-104
  vorgehen: Frage nach Verbindlichkeiten gegenüber Vorsorgeeinrichtungen (ausstehende Beiträge, Kontokorrent, Darlehen) als Pendenz bzw. Antwort auswerten. Mit Saldoliste (Konto Abrechnung
    BVG u.ä.) und Anhang abgleichen; Detailabstimmung mit Kontoauszug in T1-309.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Saldoliste/Hauptbuch Vorsorgekonten
  - Anhang
  rechnen: Summe Passivsalden Vorsorgekonten = Anhangsangabe Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  feststellung_wenn: Passivsaldo gegenüber einer Vorsorgeeinrichtung vorhanden, aber nicht in Anhang oder Bilanz ersichtlich, oder Betrag weicht ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: or__art-959c-t2
    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: hwp-bur-2023__rz-0838-s346
    zitat: Die Ausweispflicht ist unabhängig von der Form der Vorsorge zu verstehen
- id: T1-105
  vorgehen: Frage nach Bürgschaften, Garantien, Pfandbestellungen und Patronatserklärungen zugunsten Dritter (Bestand, Veränderung) als Pendenz bzw. Antwort auswerten. Bankbestätigungen
    (Abschnitt Garantien), Verträge und VR-Protokolle durchsehen; Abgrenzung zu Garantien für eigenes Handeln festhalten und WP vorlegen. Gesamtbetrag der vollen Haftungssummen mit Anhang
    vergleichen.
  nachweise:
  - Schriftliche Antwort VR/GF
  - Bankbestätigungen
  - Bürgschafts-, Garantie-, Pfandverträge
  - VR-Protokolle
  - Anhang
  rechnen: Summe volle Haftungsbeträge aller Sicherheiten zugunsten Dritter = Anhangsangabe Art. 959c Abs. 2 Ziff. 8 OR
  feststellung_wenn: Sicherheit zugunsten Dritter nicht oder nur mit beanspruchtem statt vollem Betrag offengelegt; Einordnung eigene/Dritte unklar → Pendenz an WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über Bestand und Veränderungen von Bürgschaften, Garantieverpflichtungen und Pfandbestellungen zugunsten Dritter (nicht für eigene Verpflichtungen)
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
  - quelle: hwp-bur-2023__rz-0841-s347
