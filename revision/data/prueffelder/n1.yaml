bewertung:
- regel: Verbindlichkeiten zum Nennwert; keine Bewertung zum tieferen Marktwert.
  quelle: hwp-bur-2023__rz-0486-s256
  zitat: Das Nennwertprinzip für die Verbindlichkeiten schliesst eine Bewertung zum tieferen Marktwert aus.
- regel: Voraussichtlich innert 12 Monaten fällige Teilbeträge sind kurzfristig, übrige langfristig; verzinsliche Verbindlichkeiten gesondert.
  quelle: hwp-bur-2023__rz-0489-s257
  zitat: die voraussichtlich innerhalb von zwölf Monaten nach Bilanzstichtag zur Zahlung fällig werden, sind in der Bilanz als kurzfristig auszuweisen
- regel: Kurzfristiger Anteil langfristiger Verbindlichkeiten ist unter den kurzfristigen verzinslichen Verbindlichkeiten zu bilanzieren.
  quelle: hwp-bur-2023__rz-0875-s356
  zitat: sind grundsätzlich als kurzfristige verzinsliche Verbindlichkeiten zu bilanzieren
- regel: Innert eines Jahres fällige Amortisationsraten sind kurzfristig auszuweisen.
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
- regel: Hypotheken bleiben trotz kurzfristiger Kündbarkeit langfristig (keine mechanische Umgliederung nach Kündigungsfrist).
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Hypothekarschulden sind unter den langfristigen Verbindlichkeiten auszuweisen, auch wenn sie in der Praxis häufig kurzfristig kündbar sind.
- regel: Im Folgejahr auslaufende Festhypotheken bleiben langfristig, soweit die Verlängerung beabsichtigt und wahrscheinlich ist (Wahrscheinlichkeit beurteilt WP).
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Im Folgejahr auslaufende Festhypotheken können weiterhin als langfristig bilanziert werden, soweit ihre Verlängerung beabsichtigt und wahrscheinlich ist.
- regel: Kurzfristig auszuweisen sind kündbare Hypotheken/Darlehen bei konkreter Kündigungsabsicht des Schuldners oder wenn mit einer Kündigung durch den Gläubiger zu rechnen ist.
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: wenn eine konkrete kurzfristige Kündigungsabsicht durch den Schuldner oder die Schuldnerin besteht
- regel: Wahrscheinliche Kündigung durch den Gläubiger liegt z.B. bei Verletzung von Covenants vor.
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: wenn aufgrund der Verletzung bestimmter Kreditvertragsklauseln (sog. Covenants) eine frühzeitige Vertragsauflösung als wahrscheinlich erscheint
- regel: Covenant-Einhaltung ist bei der Abschlusserstellung zu überprüfen; bei Verletzung grundsätzlich Umgliederung in kurzfristige verzinsliche Verbindlichkeiten.
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Bei der Abschlusserstellung muss deshalb überprüft werden, ob die Covenants eingehalten sind
- regel: Ein schriftlicher Waiver der Bank vor Abschlusserstellung kann die Umgliederung nur allenfalls vermeiden (kein Automatismus; Beurteilung WP).
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Die Umgliederung in die kurzfristigen verzinslichen Verbindlichkeiten kann allenfalls vermieden werden
- regel: Bei Covenant-Verletzung/Waiver ist eine Offenlegung als Ereignis nach dem Bilanzstichtag zu prüfen (N1-320).
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Eine Offenlegung als Ereignis nach dem Bilanzstichtag ist zu prüfen.
- regel: Langfristige Verbindlichkeiten gegenüber Nahestehenden gesondert in Bilanz oder Anhang.
  quelle: hwp-bur-2023__rz-0490-s257
  zitat: Ein gesonderter Ausweis in der Bilanz oder im Anhang wird vom Gesetz für langfristige Verbindlichkeiten gegenüber nahestehenden Personen verlangt
- regel: Passivdarlehen mit Rangrücktritt gesondert ausweisen, Nachrangigkeit durch Bezeichnung erkennbar.
  quelle: hwp-bur-2023__rz-0494-s257
  zitat: Passivdarlehen mit Rangrücktritt sind in der Jahresrechnung oder im Anhang gesondert auszuweisen
- regel: Zinsen laufen trotz Rangrücktritt weiter und müssen dem Rangrücktritt unterliegen.
  quelle: hwp-bur-2023__rz-0714-s305
  zitat: Der Zinsendienst wird durch den Rangrücktritt nicht unterbrochen, jedoch müssen die Zinsen ebenfalls dem Rangrücktritt unterliegen
- regel: 'RR nur nötig, wenn die Gesellschaft gemäss beiden geprüften Zwischenabschlüssen überschuldet ist (bei fehlender Fortführungsannahme: gemäss dem Zwischenabschluss zu Veräusserungswerten,
    Art. 725b Abs. 1 Satz 3 OR); nur zu Fortführungswerten überschuldet → kein RR nötig, Sanierungspflicht des VR bleibt.'
  quelle: or__art-725b-t1
  zitat: Ist die Gesellschaft gemäss den beiden Zwischenabschlüssen überschuldet, so benachrichtigt der Verwaltungsrat das Gericht.
- regel: 'Nur zu Fortführungswerten überschuldet (Zwischenabschluss zu Veräusserungswerten ohne Überschuldung): keine durch RR abwendbare Pflicht zur Benachrichtigung des Gerichts; der
    VR muss aber Sanierungsmassnahmen ergreifen bzw. beantragen (HWP ER Rz 406).'
  quelle: hwp-er-2026__rz-0406-s122
  zitat: Ja, die Gesellschaft ist nicht gemäss beiden Zwischenabschlüssen überschuldet
- regel: 'Höhe des Rangrücktritts: Fortführung nicht infrage → Deckungslücke zu Fortführungswerten (HWP ER Rz 420 / HWP BuR Rz 719); Fortführungsfähigkeit/-willigkeit infrage → Betrag
    über dieser Lücke; konkrete Gefahr der Fortführungsunfähigkeit → Deckungslücke zu Liquidationswerten (HWP BuR Rz 720); bei absehbaren Verlusten zusätzlich Sicherheitspolster für
    die in 12 Monaten nach Unterzeichnung, mindestens bis zur nächsten Prüfung erwarteten Verluste (HWP ER Rz 421). Stufe und Polster wählt der WP.'
  quelle: hwp-er-2026__rz-0420-s125
  zitat: sollte ein Rangrücktritt, der «nur» auf die Deckungslücke zu Fortführungswerten ausgerichtet ist, genügen
- regel: 'RR-Höhe Stufe 1: Fortführungsfähigkeit/-willigkeit nicht infrage → Deckungslücke zu Fortführungswerten genügt (HWP BuR Rz 719).'
  quelle: hwp-bur-2023__rz-0719-s307
  zitat: Steht die Fortführungsfähigkeit und -willigkeit nicht infrage oder bestehen nach sachgerechter und pflichtgemässer Beurteilung gute Voraussetzungen, dass die Gesellschaft die
    Überschuldung zu überwinden vermag, genügt es, auf die Deckungslücke zu Fortführungswerten abzustellen.
- regel: 'RR-Höhe Stufe 2: Fortführungsfähigkeit/-willigkeit infrage → RR über der Deckungslücke zu Fortführungswerten (HWP BuR Rz 720).'
  quelle: hwp-bur-2023__rz-0720-s307
  zitat: Steht die Fortführungsfähigkeit und -willigkeit infrage, ist es angezeigt, den Rangrücktritt in einem die Deckungslücke zu Fortführungswerten übersteigenden Betrag auszusprechen.
- regel: 'RR-Höhe Stufe 3: konkrete Gefahr der Fortführungsunfähigkeit → RR deckt die Deckungslücke zu Liquidationswerten (HWP BuR Rz 720).'
  quelle: hwp-bur-2023__rz-0720-s307
  zitat: muss der Rangrücktritt die Deckungslücke zu Liquidationswerten abdecken
- regel: 'Sicherheitspolster bei absehbaren weiteren Verlusten: erwartete Verluste der nächsten 12 Monate nach Unterzeichnung des RR, mindestens bis zur nächsten Prüfung, zusätzlich
    abdecken (HWP ER Rz 421; Höhe beurteilt der WP).'
  quelle: hwp-er-2026__rz-0421-s125
  zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten 12 Monaten nach Unterzeichnung des Rangrücktritts, mindestens aber bis zum nächsten Prüfungszeitpunkt
    noch zu erwartenden Verluste zu berücksichtigen.
- regel: 'Anhang: Buchwert der infolge Sicherung nicht frei verfügbaren Aktiven (nicht die gesicherten Schulden) angeben.'
  quelle: hwp-bur-2023__rz-0844-s348
  zitat: Das Gesetz verlangt nicht den separaten Ausweis der Verbindlichkeiten, für die eine Sicherstellung erfolgte
- regel: Für jede langfristige Verbindlichkeit gesonderte Aufzeichnung der Eigenschaften und Bedingungen führen; schriftliche Verträge auch bei Nahestehenden.
  quelle: hwp-bur-2023__rz-0484-s256
  zitat: Es ist zweckmässig, für jede langfristige Verbindlichkeit eine gesonderte Aufzeichnung mit den relevanten Eigenschaften und Bedingungen zu führen.
- regel: 'Fremdwährungsdarlehen (langfristig): unrealisierte Kursverluste aufwandwirksam erfassen, unrealisierte Kursgewinne nicht ausweisen (Kurssicherungen berücksichtigen).'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: allfällige noch nicht realisierte Kursverluste sind aufwandswirksam zu erfassen – unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- regel: Die Umgliederung des kurzfristigen Anteils eines langfristigen Fremdwährungsdarlehens realisiert keinen Kursgewinn.
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Die Umgliederung des kurzfristigen Anteils eines langfristigen Darlehens stellt jedoch keinen Realisationstatbestand dar.
- regel: 'Steuerlich (KS 6a): Basis sind die Verkehrswerte der Aktiven am Ende der Steuerperiode.'
  quelle: estv-ks-6a-2024__einleitung-t2
  zitat: Massgebend sind die Verkehrswerte am Ende der Steuerperiode.
- regel: Ohne Nachweis höherer Verkehrswerte gelten die Buchwerte bzw. Gewinnsteuerwerte.
  quelle: estv-ks-6a-2024__einleitung-t2
  zitat: Sofern keine höheren Verkehrswerte nachgewiesen sind, geht die Veranlagungsbehörde von den Buchwerten
- regel: Als verdecktes Eigenkapital gilt nur der Teil des übersteigenden Fremdkapitals, der direkt oder indirekt von Anteilsinhabern/Nahestehenden stammt.
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Wesentlich ist, dass nur derjenige Teil als verdeckt gilt, der direkt oder indirekt von Anteilsinhabern oder diesen nahestehenden Personen stammt.
- regel: Fremdkapital unabhängiger Dritter ist nur dann kein verdecktes Eigenkapital, wenn es nicht von Anteilsinhabern/Nahestehenden sichergestellt ist.
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: ohne Sicherstellung durch den Anteilsinhaber oder diesem nahestehenden Personen
- regel: Der Nachweis, dass die Finanzierung dem Drittvergleich standhält, bleibt vorbehalten.
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Der Nachweis, dass die konkrete Finanzierung dem Drittvergleich standhält, bleibt vorbehalten.
- regel: Auf verdecktes Eigenkapital entfallende Schuldzinsen sind dem Reingewinn hinzuzurechnen (Gewinnsteuer).
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
- regel: Bei Darlehen Beteiligter zu einem Zins unter dem Marktniveau wird nur der über den zulässigen Zins hinausgehende Rest aufgerechnet.
  quelle: estv-ks-6a-2024__3-1
  zitat: Nur der verbleibende Rest wird aufgerechnet.
- regel: Zinsen auf verdecktem Eigenkapital unterliegen als geldwerte Leistung der Verrechnungssteuer.
  quelle: estv-ks-6a-2024__3-2
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen gemäss Ziffer 3.1 oben unterliegen als geldwerte Leistung
fallstricke:
- text: Bankbestätigungen werden in der eingeschränkten Revision nicht selbst eingeholt (N1-301 a); vom Unternehmen selbst eingeholte Bestätigungen dürfen verwendet werden.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: Vom Unternehmen selbst eingeholte Drittbestätigungen sind zulässige Prüfungsnachweise, auch wenn sie nicht direkt an die Revisionsstelle gingen.
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
- text: 'Saldobestätigungen von Aktionären/Konzerngesellschaften fordert der Agent nicht an; an die Revisionsstelle adressierte Bestätigungen: Herkunft im Textfeld dokumentieren, über
    die Verwendung entscheidet der WP.'
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Die eingeschränkte Revision beschränkt sich auf die im Unternehmen intern vorhandenen Unterlagen.
- text: 'Rangrücktritt ohne ausdrücklichen Einschluss der Zinsen genügt dem Gesetz nicht; aufgelaufene Zinsen auf RR-Darlehen mitberücksichtigen. Alte Rangrücktritte ohne Zinsklausel:
    Übergangsfrist lief bis 31.12.2024 (Q&A Antwort 23); seither gilt das neue Recht für alle Verträge → für GJ ab 2025 ist ein RR ohne ausdrückliche Zinsklausel eine Feststellung (HWP
    ER Rz 412). Je RR Datum der Fassung und Zinsklausel festhalten; fehlt die Klausel: Notiz «Wesentliche Feststellungen» + «Schlussbesprechung». Die in der Q&A 2023 erwähnte Rechtsunsicherheit
    würdigt nur der WP.'
  quelle: hwp-er-2026__rz-0412-s123
  zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
- text: 'Q&A Kapitalverlust Antwort 23: Nach Ablauf der Übergangsfrist (31.12.2024) gilt das neue Recht für alle Rangrücktritte – Zinsen müssen ausdrücklich eingeschlossen sein.'
  quelle: qa-kapitalverlust-2023__5-t2
  zitat: Nach Ablauf dieser Frist sind die Vorschriften des neuen Rechts auf alle Verträge anwendbar.
- text: 'RR ohne Zinsklausel trotzdem als Feststellung erfassen: Die Q&A 2023 (vor Fristablauf) sah dazu «keine gefestigte Meinung»; diese Rechtsunsicherheit würdigt nur der WP.'
  quelle: qa-kapitalverlust-2023__5-t2
  zitat: gibt es derzeit keine gefestigte Meinung
- text: Rangrücktritt muss unwiderruflich (Vertrag zugunsten Dritter) und ohne Befristung/Kündigungsmöglichkeit vor Beseitigung der Überschuldung ausgestaltet sein.
  quelle: hwp-bur-2023__rz-0715-s305
  zitat: Der Rangrücktritt muss als Vertrag zugunsten Dritter unwiderruflich ausgestaltet werden.
- text: Aufhebung eines Rangrücktritts erst nach SA-CH-geprüftem (Zwischen-)Abschluss ohne Überschuldung; der Bericht zur eingeschränkten Revision genügt dafür nicht.
  quelle: hwp-bur-2023__rz-0717-s305-t1
  zitat: Der Revisionsbericht bei eingeschränkter Revision genügt zur Aufhebung einer Rangrücktrittsvereinbarung deshalb nicht
- text: Reduktion eines Rangrücktritts ist nur unter engen Bedingungen zulässig (u.a. SA-CH-geprüfter Zwischenabschluss); bei Reduktion/Ersatz prüft die Revisionsstelle sämtliche Anforderungen
    erneut.
  quelle: hwp-er-2026__rz-0425-s126
  zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
- text: Keine Tilgung, Zinszahlung oder Verrechnung (z.B. mit einem Aktivdarlehen an denselben Aktionär) auf Forderungen unter Rangrücktritt.
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
- text: 'Ungültiger oder ungenügender Rangrücktritt ohne andere unmittelbar bilanzwirksame Sanierungsmassnahmen und ohne begründete Aussicht, die Überschuldung spätestens 90 Tage nach
    Vorliegen der geprüften Zwischenabschlüsse zu beheben, ohne die Gläubiger zusätzlich zu gefährden (Art. 725b Abs. 4 Ziff. 2 OR): Benachrichtigung des Gerichts nicht vermeidbar, Mahnung
    des VR und subsidiäre Anzeige durch die Revisionsstelle. Darüber entscheidet nur der WP; der Agent erfasst eine wesentliche Feststellung und einen Punkt für die Schlussbesprechung
    und kontaktiert weder VR noch Gericht.'
  quelle: hwp-er-2026__rz-0433-s127
  zitat: keine anderen unmittelbar bilanzwirksame Sanierungsmassnahmen ergriffen wurden, lässt sich die Benachrichtigung des Gerichts nicht vermeiden
- text: 'RR-Forderung trotz andauernder Überschuldung getilgt oder verrechnet (auch im Folgejahr): Hinweis nach Art. 729c OR und Auswirkung auf die Prüfungsaussage beurteilt der WP;
    der Agent eskaliert als wesentliche Feststellung.'
  quelle: hwp-er-2026__rz-0434-s128
  zitat: so sind ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen
- text: Umwandlung einer RR-Forderung in Eigenkapital (Verrechnungsliberierung) bzw. Verzicht ist zulässig und lässt den Rangrücktritt dahinfallen; danach Deckung der Überschuldung neu
    beurteilen.
  quelle: hwp-er-2026__rz-0416-s124
  zitat: Gestattet ist der Verzicht auf eine im Rang zurückgestellte Forderung oder deren Umwandlung in Eigenkapital der Gesellschaft
- text: Rangrücktritte ersetzen bei Überschuldung nicht die Pflicht zu Zwischenabschlüssen; sie erlauben nur den Verzicht auf die Benachrichtigung des Gerichts.
  quelle: hwp-er-2026__rz-0423-s125-t2
  zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
- text: Nachträgliche Sicherstellung einer Forderung unter Rangrücktritt ist abzulehnen.
  quelle: hwp-er-2026__rz-0418-s124
  zitat: Eine nachträgliche Sicherstellung der Forderung ist abzulehnen.
- text: 'Rangrücktritt in anderer Währung als das Darlehen: Deckung wegen Kursrisiko zum Stichtagskurs nachrechnen; Überwachung obliegt dem VR.'
  quelle: hwp-bur-2023__rz-0717-s305-t2
  zitat: ist dessen Höhe vom Verwaltungsrat zu überwachen, um dem Kursrisiko Rechnung zu tragen
- text: N1-105 (Befragung RR) und N1-401 (Einsicht RR) sind in SER Anh. D weiter gehende Prüfungshandlungen; die 4xx-Schritte (N1-401 bis N1-403) bearbeitet der Agent nur, wenn der WP
    sie markiert bzw. angewiesen hat.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: Bank-AGB-Pfandrecht ist im Anhang offenzulegen (sämtliche Guthaben/Depots bei dieser Bank), soweit ein nicht oder nicht vollständig besonders gesichertes Kreditverhältnis besteht
    – auch wenn die Bank es nicht geltend macht.
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: ein nicht oder nicht vollständig durch besondere Sicherheiten gesichertes Kreditverhältnis hat
- text: Kein Ausweis des AGB-Pfandrechts, wenn am Stichtag kein Kreditverhältnis besteht oder die Kreditlimiten nicht beansprucht sind.
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: Besteht hingegen am Abschlussstichtag kein Kreditverhältnis oder sind gewährte Kreditlimiten nicht beansprucht
- text: Neben dem AGB-Pfandrecht häufig Sicherungszession/Abtretungsvereinbarung; für den Anhang zählt, ob die Abtretungs- bzw. Pfandrechte am Stichtag noch bestehen.
  quelle: hwp-bur-2023__rz-0847-s349-t1
  zitat: Abtretungsvereinbarung (fiduziarische Sicherungsübereignung bzw. Sicherungszession)
- text: Verzinsliche Aktionärsdarlehen gehören unter die langfristigen verzinslichen (nicht unter übrige) Verbindlichkeiten; Gruppenzuordnung der Konten in der Saldoliste prüfen.
  quelle: or__art-959a-t1
  zitat: langfristige verzinsliche Verbindlichkeiten
- text: Fälligkeitsaufteilung 1–5 / über 5 Jahre (Art. 961a Ziff. 1 OR) ist nur bei ordentlicher Revision Pflicht; Fehlen bei SER-Mandat nicht als Mangel erfassen.
  quelle: or__art-961
  zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, müssen
- text: 'Kündbare Hypotheken bzw. sinngemäss Darlehen mit unbestimmter Laufzeit nicht mechanisch nach Kündigungsfrist umgliedern: kurzfristig nur bei konkreter Kündigungsabsicht des
    Schuldners oder wahrscheinlicher Kündigung durch den Gläubiger; Annahme im Textfeld dokumentieren.'
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: wenn eine konkrete kurzfristige Kündigungsabsicht durch den Schuldner oder die Schuldnerin besteht
- text: 'ESTV-Zinssätze gelten je Kalenderjahr: Rundschreiben 2026 gilt ab 1.1.2026, nicht für Zinsen 2025. Für 2025: `wert zins beteiligte 2025` (Treuhand-Almanach, Sekundärquelle;
    im Textfeld «Sekundärquelle, ESTV-Rundschreiben 2025 nicht im Wiki» vermerken; Original als Pendenz).'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: Für ESTV-Limiten sind Kredite sämtlicher Beteiligter und Nahestehender zusammenzuzählen; höhere Sätze nur mit Drittvergleich.
  quelle: estv-zinsen-2026__s002-1
  zitat: Für die Berechnung der Limiten sind die Kredite sämtlicher Beteiligten und nahestehender Personen zusammen zu zählen.
- text: 'Festgestellte verdeckte Gewinnausschüttung (z.B. übersetzte Zinsen): Mitteilung an den VR, Rückerstattung nach Art. 678 OR, Hinweis im Bericht und VSt-Aspekte entscheidet der
    WP; der Agent erfasst eine wesentliche Feststellung.'
  quelle: hwp-er-2026__rz-0164-s212-t1
  zitat: Die Revisionsstelle teilt die verdeckte Gewinnausschüttung dem Verwaltungsrat der Gesellschaft schriftlich mit.
- text: Zinsplausibilisierung allein genügt für wesentliche Positionen nicht; mit Detailprüfungen (Abstimmung, Verträge) ergänzen.
  quelle: hwp-er-2026__rz-0111-s199-t1
  zitat: Gemäss SER sind wesentliche Bilanzpositionen in der Regel nicht nur mit analytischen Prüfungshandlungen zu prüfen
- text: 'Covid-19-Kredit: Rückzahlung/Verrechnung von Aktionärsdarlehen oder neue Darlehen an Aktionäre während der Solidarbürgschaft = möglicher Verstoss gegen Art. 2 Abs. 2 Covid-19-SBüG
    → Notiz «Wesentliche Feststellungen» + «Schlussbesprechung». Fristansetzung und Information von GV und Bürgschaftsorganisation (Art. 23) nur durch den WP; der Agent kontaktiert niemanden.'
  quelle: covid-sbueg__art-23
  zitat: so informiert die Revisionsstelle die zuständige Bürgschaftsorganisation
- text: 'Überschuldungs-/Kapitalverlustrechnung: nur den nach Art. 3 Covid-19-SBüV verbürgten Betrag (Kreditvereinbarung) aus dem Fremdkapital nehmen – mit `kapitalverlust … --covid-kredit
    <Betrag>`, nicht zusätzlich von Hand abziehen.'
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- text: 'Darlehen unter Rangrücktritt nach dem Bilanzstichtag: nur mit tatsächlichem Zahlungsfluss zulässig und im Anhang als Ereignis nach dem Bilanzstichtag auszuweisen; rückwirkende
    Einbuchung gegen eine (kurzfristige) Forderung gegenüber dem Darlehensgeber ist unzulässig → Notiz «Wesentliche Feststellungen».'
  quelle: hwp-bur-2023__rz-0721-s307
  zitat: Nicht zulässig ist daher die rückwirkende Einbuchung eines Passivdarlehens unter Rangrücktritt gegen eine (kurzfristige) Forderung gegenüber dem Darlehensgeber oder der Darlehensgeberin.
- text: 'Rangrücktritt: Für die Deckung zählt je Gläubiger min(Betrag laut gültiger, unterzeichneter Vereinbarung; bestehende Forderung = geschuldeter Betrag + aufgelaufene, vom
    Rangrücktritt erfasste Zinsen laut Kontoblatt) – nicht die Anhangangabe; ein Darlehenssaldo ohne Vereinbarung zählt nicht; nach Verzicht oder Umwandlung in EK fällt die Vereinbarung
    dahin (HWP ER Rz 416); Anhang ↔ Vereinbarung abgleichen (N1-320), Deckung in P1-313 rechnen.'
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
  fundstellen:
  - quelle: or__art-725b-t1
    zitat: 'sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst'
  - quelle: hwp-er-2026__rz-0416-s124
    zitat: 'beides führt zum Dahinfallen der Vereinbarung'
- text: 'RR-Reduktion ≠ Darlehensreduktion: Reduktion oder Aufhebung eines Rangrücktritts ändert die Forderung nicht – die Verbindlichkeit bleibt in voller Höhe Fremdkapital; nie einen
    Buchungsvorschlag auf das Darlehen ableiten. Reduktion während Überschuldung ohne die drei Voraussetzungen (HWP ER Rz 425) → «Wesentliche Feststellungen» + «Schlussbesprechung» (N1-105,
    N1-401).'
  quelle: hwp-er-2026__rz-0423-s125-t1
  zitat: Er bewirkt auch keine Veränderung der Forderung, ausser, dass sie gestundet und damit einredebelastet wird.
- text: 'Zinsen zeitanteilig: Monate bzw. Tage ab Auszahlung, Amortisation oder letztem Zinstermin immer mit `rechne` bestimmen (`monate(…)`, `tage(…)`, `tage360(…)`), nie im Kopf zählen;
    frühere Grenze = Tag vor Zinsbeginn bzw. letzter bezahlter Zinstermin (Auszahlung 01.02. → monate(31.12.2025, 31.01.2025) = 11, nicht monate(31.12.2025, 01.02.2025) = 10); monate() zählt
    nur ganze Monate – beginnt der Zinslauf im Laufe eines Monats, tage()/365 bzw. tage360()/360 gemäss Vertrag verwenden; Praxis/intern: Kontonummern nie als Betrag lesen (N1-201, N1-303).'
  quelle: hwp-bur-2023__rz-0048-s066
  zitat: Der Grundsatz der zeitlichen Abgrenzung verlangt, dass Aufwand und Ertrag, die zeitraumbezogen anfallen (z.B. Zinsen, Miete), auch entsprechend abgegrenzt und erfasst werden.
fragen_kunde:
- frage: 'Wurden im Geschäftsjahr oder bis heute Bestimmungen von Kredit-/Darlehensverträgen (Covenants/Kennzahlen, Amortisationen, Zinszahlungen, Verwendungszweck) nicht eingehalten?
    Wenn ja: welche Massnahmen, liegt ein schriftlicher Waiver vor (Datum)?'
  zweck: 'N1-101: Fristigkeit, Fortführung, Ereignis nach dem Stichtag, allfällige Korrekturen'
- frage: Welche Sicherheiten bestehen zugunsten der Darlehensgeber (Grundpfand/Schuldbriefe, Faustpfand, Zession, Bank-AGB-Pfandrecht, Garantien/Bürgschaften)? Wie hoch ist der Buchwert
    der verpfändeten/abgetretenen Aktiven per 31.12.? Welche Kreditlimiten waren am Stichtag beansprucht?
  zweck: 'N1-102/N1-320: Rechte/Verpflichtungen, Anhang Art. 959c Abs. 2 Ziff. 9 OR'
- frage: Welche Amortisationen/Rückzahlungen werden innert 12 Monaten nach Bilanzstichtag fällig? Bestehen Kündigungen oder konkrete Kündigungsabsichten (eigene oder der Bank)? Laufen
    Festhypotheken/Festkredite im Folgejahr aus und ist ihre Verlängerung beabsichtigt (Nachweis)?
  zweck: 'N1-103/N1-402: Gliederung kurz-/langfristig'
- frage: Bestehen Darlehen von Aktionären, VR-/GL-Mitgliedern, diesen nahestehenden Personen oder Gesellschaften, an denen eine Beteiligung besteht? Zu welchen Konditionen (Zins, Laufzeit,
    Sicherheiten) und wie wurde der Zins festgelegt?
  zweck: 'N1-104/N1-304: Vollständigkeit, Ausweis Art. 959a Abs. 4 OR, Drittvergleich'
- frage: Haben Aktionäre oder ihnen Nahestehende Kredite Dritter an die Gesellschaft sichergestellt (Bürgschaft, Garantie, Verpfändung)? Liegen Nachweise für Verkehrswerte der Aktiven
    über den Buchwerten vor?
  zweck: 'N1-304: Berechnung verdecktes Eigenkapital nach ESTV-KS 6a'
- frage: Bestand im Geschäftsjahr begründete Besorgnis einer Überschuldung? Wurden Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten erstellt und geprüft?
  zweck: 'N1-105/N1-401: Massstab für die Höhe der Rangrücktritte'
- frage: Welche Rangrücktritte bestehen (Gläubiger, Betrag inkl. Zinsen, Währung)? Wurden sie im Jahr oder danach geändert, reduziert, ersetzt oder aufgehoben? Wurden darauf Zinsen/Rückzahlungen
    bezahlt oder Verrechnungen vorgenommen? Welche Bonitätsnachweise der Gläubiger liegen vor?
  zweck: 'N1-105/N1-401: Gültigkeit und Höhe der Rangrücktritte, Bonität (WP-Beurteilung)'
- frage: Bestehen Darlehen in Fremdwährung? Zu welchem Kurs wurden sie erfasst und per 31.12. bewertet?
  zweck: 'N1-301: Bewertung Fremdwährungsdarlehen'
- frage: Was ist der Hintergrund der Zu- und Abgänge auf den Darlehenskonten (Neuaufnahmen, Rückzahlungen, Umbuchungen, Verrechnungsliberierung)? Liegen die entsprechenden Verträge und
    Beschlüsse vor?
  zweck: 'N1-403: Eintritt, Rechte/Verpflichtungen'
- frage: Sind nach dem Bilanzstichtag wesentliche Ereignisse eingetreten (Kündigung, Neuverhandlung, Rückzahlung, neue Sicherheiten, Änderung von Rangrücktritten)?
  zweck: 'N1-320: Anhang Art. 959c Abs. 2 Ziff. 13 OR, Fristigkeit'
- frage: Besteht ein Covid-19-Kredit (nach Art. 3 oder Art. 4 Covid-19-SBüV) oder ein Härtefall-Darlehen (HFMV 20)? Bitte Kreditvereinbarung, Amortisationsplan und verbürgten Betrag
    per 31.12. zur Verfügung stellen. Wurden während der Solidarbürgschaft Dividenden/Tantiemen ausgerichtet, Kapitaleinlagen zurückerstattet, Darlehen an Aktionäre/Nahestehende gewährt
    oder Darlehen von ihnen zurückbezahlt bzw. verrechnet?
  zweck: 'N1-103/N1-402: kurzfristige Covid-Amortisation; N1-403: Verwendungsverbote Art. 2 Abs. 2 Covid-19-SBüG; N1-105: kein Fremdkapital bei Überschuldung (Art. 24)'
