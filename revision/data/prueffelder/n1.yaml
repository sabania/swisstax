  - quelle: hwp-bur-2023__rz-0484-s256
    zitat: Insbesondere sollten bei allen längerfristigen Darlehensverhältnissen die wichtigsten Vertragspunkte im Interesse der Beweisbarkeit schriftlich festgehalten werden.
- id: N1-303
  vorgehen: 'Zinsabgrenzungsberechnung des Kunden einsehen bzw. nachrechnen: aufgelaufene, per Stichtag unbezahlte Zinsen je Darlehen gemäss vertraglichen Zinsterminen. Mit passiven
    Rechnungsabgrenzungen bzw. Zinsverbindlichkeiten abstimmen; Ausweis von Zinsen auf RR-Forderungen (unter Rangrücktritt) beachten. Gegenbuchung der Zins-Abschlussbuchung im Kontoblatt
    Zinsaufwand nachsehen: aufgelaufener Zins gehört in die passive Rechnungsabgrenzung bzw. Zinsverbindlichkeit; wurde er dem Darlehenskonto gutgeschrieben (kapitalisiert), Vertrag
    prüfen (Kapitalisierung vereinbart?). Derselbe Betrag ergibt nur eine Feststellung (Ausweis), nicht zusätzlich «nicht abgegrenzt» (Praxis/intern).'
  nachweise:
  - Zinsabgrenzungsberechnung
  - Verträge (Zinstermine, Zinsusanz)
  - Kontoblätter Zinsaufwand und Abgrenzungen
  rechnen: Marchzins = Saldo × Zinssatz × Tage seit letztem Zinstermin bis 31.12. / Jahrestage gemäss vertraglicher Zinsusanz (z.B. 30/360 oder act/365; Praxis, keine Fundstelle); Σ
    Marchzinsen = gebuchte Zinsabgrenzung
  feststellung_wenn: Aufgelaufene Zinsen nicht oder falsch abgegrenzt und Differenz über der Nichtaufgriffsgrenze (3.3).
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in die Zinsabgrenzungsberechnung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0714-s305
    zitat: Der Zinsendienst wird durch den Rangrücktritt nicht unterbrochen, jedoch müssen die Zinsen ebenfalls dem Rangrücktritt unterliegen
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
  - quelle: hwp-bur-2023__rz-0257-s215
    zitat: wie beispielsweise Darlehens- und Hypothekenzinsen
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Qualitative Faktoren und besondere Umstände: Wenn erfasst, meldet der Agent auch kleinere Abweichungen.'
  notiz: 'Zins nicht erfasst (Marchzins fehlt) oder Differenz ≥ Nichtaufgriffsgrenze → «Wesentliche Feststellungen» mit Buchungsvorschlag Zinsaufwand an passive Rechnungsabgrenzung bzw.
    Zinsverbindlichkeit (ohne Verbuchung). Zins im Zinsaufwand erfasst, aber dem Darlehenskonto gutgeschrieben, ohne dass der Vertrag die Kapitalisierung vorsieht → nur «Wesentliche
    Feststellungen» mit Umgliederungsvorschlag Darlehen an passive Rechnungsabgrenzung bzw. Zinsverbindlichkeit (kein zusätzlicher Zinsaufwand; ab Nichtaufgriffsgrenze); Kapitalisierung
    vertraglich vereinbart → keine Feststellung. Differenz < Nichtaufgriffsgrenze → nur im Textfeld protokollieren (ausser qualitative Faktoren/besondere Umstände in 3.3 erfasst → Notiz auch
    darunter). Zinsabgrenzungsberechnung, Vertrag oder Zinsabrechnung nicht gefunden → «Pendenz» (Konto, Datum, Betrag, durchsuchte Ordner).'
- id: N1-304
  vorgehen: 'Bei Darlehen Beteiligter/Nahestehender oder von ihnen sichergestellten Drittkrediten: zulässiges Fremdkapital nach ESTV-KS 6a berechnen (Verkehrswerte Ende Steuerperiode,
    mangels Nachweis Buchwerte) und mit dem Fremdkapital vergleichen. Zinssatz mit den ESTV-Höchstsätzen des Geschäftsjahres vergleichen: `wert zins beteiligte <GJ>` (z.B. `wert zins
    beteiligte 2025`); Kredite aller Beteiligten/Nahestehenden zusammenzählen; Fremdwährung: ESTV-RS 2-219 Tabelle S. 3, Spalte des Geschäftsjahres (GJ 2025: Spalte 2025; `wert zinssatz
    darlehen`, Zeile Fremdwährung; Tabelle in sources/raw ablesen); Sätze = safe haven, höherer Satz nur mit Drittvergleich. Belehnungssätze KS 6a: `wert belehnung`. Fehlende Verkehrswert-
    oder Drittvergleichsnachweise → Notiz «Pendenz». Berechnetes verdecktes EK bzw. übersetzte Zinsen über der Nichtaufgriffsgrenze → Notiz «Wesentliche Feststellungen» mit Berechnung
    (mögliche geldwerte Leistung, VSt 35 %, Formular 102 gemäss `thema verdecktes eigenkapital`; Hinweis Steuerrückstellung an S1); Beurteilung der Folgen (vGA, Art. 678 OR, VSt-Schuld)
    nur durch den WP bzw. eine Steuerfachperson.'
  nachweise:
  - Berechnung verdecktes Eigenkapital
  - Nachweise Verkehrswerte (falls über Buchwert)
  - Darlehensverträge mit Beteiligten
  - Sicherstellungen Beteiligter für Drittkredite (Bürgschaften, Garantien, Pfänder)
  - ESTV-Zinssätze des Geschäftsjahres (CHF; bei Fremdwährung RS 2-219, Spalte GJ)
  rechnen: Zulässiges FK = Σ (Verkehrswert, mangels Nachweis Buchwert, × Ansatz KS 6a); verdecktes EK = max(0, FK – zulässiges FK), begrenzt auf FK, das direkt/indirekt von Beteiligten/Nahestehenden
    stammt oder von ihnen sichergestellt ist; aufzurechnender Zins = Zins auf verdecktem EK, bei Zins unter Marktniveau nur der Rest nach KS 6a Ziff. 3.1
  feststellung_wenn: Fremdkapital über zulässigem FK, soweit von Beteiligten/Nahestehenden stammend oder sichergestellt, oder Zinssatz über steuerlich anerkanntem Satz ohne Drittvergleich
    (Folgen vGA/VSt entscheidet WP).
  fundstellen:
  - quelle: dbg__art-65
    zitat: Zum steuerbaren Gewinn der Kapitalgesellschaften und Genossenschaften gehören auch die Schuldzinsen, die auf jenen Teil des Fremdkapitals entfallen, dem wirtschaftlich die
      Bedeutung von Eigenkapital zukommt.
  - quelle: estv-ks-6a-2024__einleitung-t3
    zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
  - quelle: estv-ks-6a-2024__einleitung-t2
    zitat: Sofern keine höheren Verkehrswerte nachgewiesen sind, geht die Veranlagungsbehörde von den Buchwerten
  - quelle: estv-ks-6a-2024__einleitung-t2
    zitat: Massgebend sind die Verkehrswerte am Ende der Steuerperiode.
  - quelle: estv-ks-6a-2024__einleitung-t3
    zitat: ohne Sicherstellung durch den Anteilsinhaber oder diesem nahestehenden Personen
  - quelle: estv-ks-6a-2024__3-1
    zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
  - quelle: estv-ks-6a-2024__3-1
    zitat: Nur der verbleibende Rest wird aufgerechnet.
  - quelle: estv-ks-6a-2024__3-2
    zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen gemäss Ziffer 3.1 oben unterliegen als geldwerte Leistung
  - quelle: estv-zinsen-2026__s001-1
