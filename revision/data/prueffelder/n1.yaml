- id: N1-201
  vorgehen: Erwartungswert Zinsaufwand je Darlehen bilden (Saldo bzw. zeitgewichteter Saldo ab Auszahlung/Amortisation × Vertragszins) und mit gebuchtem Zinsaufwand vergleichen. Abweichungen
    über der tolerierbaren Abweichung (= Toleranzwesentlichkeit 3.3, lesen mit `revio K3`; tieferer Wert nur auf Vorgabe WP) klären (fehlende Abgrenzung, Gebühren, Zinsen unter Rangrücktritt).
    Rechnung, Toleranz und Ergebnis im Textfeld dokumentieren.
  nachweise:
  - Darlehensspiegel mit Zinssätzen
  - Kontoblatt Zinsaufwand
  - Verträge (Zinssatz, Auszahlungsdatum)
  rechnen: 'Erwarteter Zins = Σ (Saldo × Zinssatz × Laufzeit im Jahr ab Auszahlung bzw. bis Amortisation); Abweichung = gebuchter Zinsaufwand – Erwartungswert ≤ tolerierbare Abweichung
    (Toleranzwesentlichkeit 3.3, `revio K3`); Laufzeit nie im Kopf zählen, immer `rechne`. Frühere Grenze = Tag VOR Zinsbeginn bzw. letzter bezahlter Zinstermin, spätere Grenze = 31.12.:
    Auszahlung 01.02. → `rechne "saldo = 500000; satz = 0.025; m = monate(31.12.2025, 31.01.2025); saldo * satz * m / 12"` (m = 11; falsch wäre monate(31.12.2025, 01.02.2025) = 10). monate()
    zählt nur ganze Monate: beginnt der Zinslauf nicht am Monatsersten, taggenau rechnen mit `tage(31.12.2025, <Tag vor Zinsbeginn>)` / 365 bzw. 30/360 `tage360(31.12.2025, <Tag vor
    Zinsbeginn>)` / 360 gemäss Vertrag; zählt der Vertrag den Auszahlungstag nicht mit, das Auszahlungsdatum selbst eingeben. Verwendete Zählweise im Textfeld nennen.'
  feststellung_wenn: Abweichung zwischen Erwartungswert und gebuchtem Zinsaufwand über der tolerierbaren Abweichung (Toleranzwesentlichkeit 3.3, `revio K3`) und nicht erklärbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Beurteilung, ob der Zinsaufwand im Verhältnis zu den Darlehenssalden plausibel erscheint
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0108-s198
    zitat: Dabei wird keine exakte Übereinstimmung der geprüften Daten mit den zur Verfügung stehenden Vergleichsgrössen angestrebt
- id: N1-301
  vorgehen: Darlehensspiegel/Saldoliste mit Hauptbuch und Bilanz abstimmen; je Darlehen Saldo 31.12. abgleichen mit a) beim Unternehmen vorhandener Bankbestätigung/Kontoauszug, b) Zins-/Amortisationsabrechnungen,
    c) Verträgen, d) Gegenbuchhaltung bzw. vom Unternehmen selbst eingeholter Saldobestätigung, e) übrigen Unterlagen (z.B. GV-Protokoll). Keine Bestätigung selbst einholen; Herkunft
    dokumentieren, fehlende Nachweise als Pendenz.
  nachweise:
  - Darlehensspiegel
  - Saldoliste/Kontoblätter
  - Bankbestätigung bzw. Kontoauszug per 31.12. (beim Unternehmen vorhanden)
  - Zinsabrechnungen
  - Verträge
  - Gegenbuchhaltung bzw. vom Unternehmen eingeholte Saldobestätigung
  rechnen: 'Σ Einzelsalden Darlehensspiegel = Saldo Bilanzposition = Σ Hauptbuchkonten; je Darlehen Saldo Buchhaltung = Saldo Nachweis; Fremdwährungsdarlehen: FW-Betrag × höherer von
    historischem und Stichtagskurs (unrealisierte Kursgewinne nicht erfassen, Kurssicherung vorbehalten)'
  feststellung_wenn: Differenz zwischen Bilanz, Hauptbuch und Nachweis je Darlehen, kein Nachweis für ein wesentliches Darlehen, oder unrealisierter Kursgewinn auf Fremdwährungsdarlehen
    erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Abstimmung einer Aufstellung der Verbindlichkeiten mit der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0485-s256
    zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Die eingeschränkte Revision beschränkt sich auf die im Unternehmen intern vorhandenen Unterlagen.
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
  - quelle: hwp-er-2026__rz-0095-s196
    zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
  - quelle: hwp-bur-2023__rz-0090-s077-t2
    zitat: allfällige noch nicht realisierte Kursverluste sind aufwandswirksam zu erfassen – unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- id: N1-302
  vorgehen: Kredit- und Darlehensverträge inkl. Nachträge einsehen; Parteien, Betrag, Währung, Auszahlung, Zinssatz, Fälligkeit/Amortisation, Kündigung, Sicherheiten, Covenants und Rangrücktrittsklauseln
    tabellarisch erfassen und mit Buchhaltung und Anhang abgleichen. Fehlende oder nicht unterzeichnete Verträge als Pendenz erfassen; Verträge für Dauerakte vormerken.
  nachweise:
  - Kredit- und Darlehensverträge inkl. Nachträge
  - Vertragsübersicht (Arbeitspapier)
  rechnen: Vertragsbetrag ± Auszahlungen/Amortisationen = Saldo 31.12. gemäss Buchhaltung
  feststellung_wenn: Kein schriftlicher Vertrag für ein wesentliches Darlehen, oder Vertragskonditionen weichen von Buchhaltung/Anhang ab.
