schritte:
- id: N1-101
  vorgehen: 'Schriftliche Antwort von GL/VR (z.B. 10.11 Kundenbefragung) auswerten; fehlt sie: Frage als Pendenz, Status höchstens «teilweise bearbeitet». Wurden Kreditbedingungen (Covenants,
    Amortisationen, Zinsen) verletzt? Mit Kreditverträgen und Bankkorrespondenz abgleichen; bei Verletzung Massnahmen, Waiver (Datum) und Folgen für Fristigkeit (N1-402), Fortführung
    und Anhang (Ereignis nach Stichtag, N1-320) festhalten.'
  nachweise:
  - Schriftliche Antwort GL/VR
  - Kreditverträge mit Covenant-Klauseln
  - Covenant-Berechnung/Compliance-Bestätigung
  - Waiver der Bank (falls Verletzung)
  rechnen: Covenant-Kennzahlen gemäss Vertragsdefinition aus Jahresrechnung nachrechnen und mit Schwellenwert vergleichen
  feststellung_wenn: Covenant verletzt und weiterhin langfristig ausgewiesen ohne Waiver vor Abschlusserstellung (Wirkung beurteilt WP), Offenlegung nach Stichtag fehlt, oder Antwort
    widerspricht den Unterlagen.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung, ob die Unternehmensleitung Bestimmungen von Darlehensverträgen (z. B. Kennzahlen in Kreditverträgen) nicht eingehalten hat
  - quelle: ser-2022__anh-d-s085-1
    zitat: Besprechung der Massnahmen der Unternehmensleitung und der allfällig erforderlichen Korrekturen in der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: Bei der Abschlusserstellung muss deshalb überprüft werden, ob die Covenants eingehalten sind
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: Die Umgliederung in die kurzfristigen verzinslichen Verbindlichkeiten kann allenfalls vermieden werden
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: Eine Offenlegung als Ereignis nach dem Bilanzstichtag ist zu prüfen.
  - quelle: hwp-er-2026__rz-0103-s197
    zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: sonst Frage als Pendenz; höchstens «teilweise bearbeitet»
- id: N1-102
  vorgehen: 'Schriftliche Antwort zu Sicherheiten (Grundpfand, Faustpfand, Zession, Bank-AGB-Pfandrecht, Garantien) auswerten; fehlt sie: Frage als Pendenz, Status höchstens «teilweise
    bearbeitet». Mit Kredit-, Pfand-/Zessionsverträgen und Bankunterlagen (Sicherheiten, Limiten) abgleichen. Buchwert verpfändeter/abgetretener Aktiven ermitteln (AGB-Pfandrecht nur
    bei beanspruchtem, nicht voll besonders gesichertem Kredit) und mit Anhang vergleichen.'
  nachweise:
  - Antwort GL zu Sicherheiten
  - Pfand-, Zessions- und Sicherungsverträge
  - Bankunterlagen/Kreditvertrag (Sicherheiten, Limiten)
  - Anhang der Jahresrechnung
  rechnen: Summe Buchwerte verpfändeter/abgetretener Aktiven per 31.12. (inkl. Guthaben bei Banken mit AGB-Pfandrecht und beanspruchtem Kredit) = Anhangangabe zur Sicherung eigener Verbindlichkeiten
    verwendete Aktiven
  feststellung_wenn: Verpfändung/Zession besteht, ist aber nicht oder mit abweichendem Betrag im Anhang offengelegt, oder Antwort widerspricht Verträgen/Bankunterlagen.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung über Sicherheiten zugunsten von Darlehensgebern
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0844-s348
    zitat: Das Gesetz verlangt nicht den separaten Ausweis der Verbindlichkeiten, für die eine Sicherstellung erfolgte
  - quelle: hwp-bur-2023__rz-0847-s349-t2
    zitat: ein nicht oder nicht vollständig durch besondere Sicherheiten gesichertes Kreditverhältnis hat
  - quelle: hwp-bur-2023__rz-0847-s349-t2
    zitat: Besteht hingegen am Abschlussstichtag kein Kreditverhältnis oder sind gewährte Kreditlimiten nicht beansprucht
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- id: N1-103
  vorgehen: 'Schriftliche Antwort der GL (z.B. 10.11 Kundenbefragung) zur Fristigkeit auswerten; fehlt sie: Frage als Pendenz, Status höchstens «teilweise bearbeitet». Inhalt: Fälligkeiten
    innert 12 Monaten, Kündigungen/Kündigungsabsichten, Covenant-Verletzungen, auslaufende Festhypotheken mit Verlängerungsabsicht. Mit Amortisationsplänen, Verträgen und Bankkorrespondenz
    abgleichen; Ergebnis als Grundlage für N1-402 festhalten.'
  nachweise:
  - Antwort GL zur Fälligkeit
  - Kreditverträge/Amortisationspläne
  - Kündigungs-/Verlängerungskorrespondenz, Bankofferten
  rechnen: Kurzfristiger Anteil = Σ vertraglich innert 12 Monaten nach Stichtag fällige Amortisationen/Rückzahlungen (inkl. innert 12 Monaten fällige Covid-Amortisation gemäss Amortisationsplan)
    – im Folgejahr auslaufende Festhypotheken mit belegter Verlängerungsabsicht (Wahrscheinlichkeit beurteilt WP) + kündbare Darlehen mit konkreter Kündigungsabsicht bzw. Covenant-Verletzung
    ohne Waiver
  feststellung_wenn: Voraussichtlich innert 12 Monaten fällige Beträge langfristig ausgewiesen, Antwort widerspricht den Verträgen, oder Grenzfall (Verlängerung, Waiver) ohne Nachweis
    – dann Pendenz an WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Darlehen
  - quelle: or__art-959
    zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
      Zahlung fällig werden.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Hypothekarschulden sind unter den langfristigen Verbindlichkeiten auszuweisen, auch wenn sie in der Praxis häufig kurzfristig kündbar sind.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Im Folgejahr auslaufende Festhypotheken können weiterhin als langfristig bilanziert werden, soweit ihre Verlängerung beabsichtigt und wahrscheinlich ist.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: wenn eine konkrete kurzfristige Kündigungsabsicht durch den Schuldner oder die Schuldnerin besteht
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: wenn aufgrund der Verletzung bestimmter Kreditvertragsklauseln (sog. Covenants) eine frühzeitige Vertragsauflösung als wahrscheinlich erscheint
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: sonst Frage als Pendenz; höchstens «teilweise bearbeitet»
  - quelle: covid-sbueg__art-3
    zitat: Die Kredite nach der Covid-19-SBüV sind innerhalb von acht Jahren vollständig zu amortisieren.
  - quelle: covid-sbueg__art-3
    zitat: jedoch höchstens auf zehn Jahre verlängern
- id: N1-104
  vorgehen: 'Liste der Nahestehenden (Aktionäre, VR/GL, Beteiligungen) aus Aktienbuch, HR-Auszug und GV-/VR-Protokollen erstellen. Schriftliche Antwort der GL zu deren Darlehen (z.B.
    10.11 Kundenbefragung) auswerten; fehlt sie: Frage als Pendenz, Status höchstens «teilweise bearbeitet». Mit Hauptbuchkonten abgleichen, gesonderten Ausweis in Bilanz/Anhang prüfen
    und Konditionen für N1-304 notieren.'
  nachweise:
  - Aktienbuch, HR-Auszug, GV-/VR-Protokolle
  - Antwort GL zu Darlehen Nahestehender
  - Darlehensverträge mit Nahestehenden
  - Bilanz/Anhang
  rechnen: Summe Darlehen Nahestehender gemäss Hauptbuch = gesondert ausgewiesener Betrag in Bilanz bzw. Anhang
  feststellung_wenn: Darlehen von Beteiligten/Organen/Beteiligungsgesellschaften nicht gesondert ausgewiesen, nicht vollständig erfasst oder ohne schriftlichen Vertrag.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zu Darlehen gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: sonst Frage als Pendenz; höchstens «teilweise bearbeitet»
- id: N1-105
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP vorbereiten. Ohne Anweisung: kein Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt»; erkannte Punkte als Notiz
    «Schlussbesprechung» bzw. «Pendenz», Rangrücktrittsvereinbarungen, Kontoblätter und Zwischenabschlüsse als Beilage. Mit Anweisung (weiter gehende Prüfungshandlung, SER Anh. D, als
    «Vorbereitung für WP» kennzeichnen): schriftliche Antwort von GL/VR zu Rangrücktritten (Gläubiger, Betrag inkl. Zinsen, Änderungen, Zahlungen/Verrechnungen) auswerten; fehlt sie: Frage
    als Pendenz. Mit Vereinbarungen (N1-401) und geprüften Zwischenabschlüssen abgleichen. Bonitätsnachweise zusammenstellen; Bonitätsbeurteilung als Pendenz an den WP (kein eigenes Urteil).
    Ohne Anweisung trotzdem lesen (Praxis/intern): alle Rangrücktrittsvereinbarungen aus GJ-, VJ- und Dauerakte mit Gläubiger, Betrag laut Vereinbarung, Forderungssaldo inkl. aufgelaufener
    Zinsen laut Kontoblatt, Datum und Zinsklausel auflisten (Beilage zur Notiz) und die Σ an P1-313 übergeben; dort mit `kapitalverlust` (Aufruf unter «Rechnen», inkl. `--rangruecktritt <Σ>`) gegen die Überschuldung rechnen.'
  nachweise:
  - Antwort GL/VR zu Rangrücktritten
  - Rangrücktrittsvereinbarungen
  - Geprüfte Zwischenabschlüsse (Fortführungs-/Veräusserungswerte) bzw. Überschuldungsstatus
  - Bonitätsnachweise der Gläubiger
  rechnen: 'Nur wenn überschuldet gemäss beiden geprüften Zwischenabschlüssen (bzw. nur gemäss Zwischenabschluss zu Veräusserungswerten bei fehlender Fortführung; Art. 725b Abs. 1 und
    3 OR): Deckung = Σ gültige RR inkl. Zinsen (Fremdwährung zum Stichtagskurs) − Überschuldung der vom WP gewählten Stufe (HWP BuR Rz 719/720) − Sicherheitspolster (HWP ER Rz 421, Höhe
    WP) ≥ 0; Covid-19-Kredite nach Art. 3 SBüV (und HFMV 20) nicht als Fremdkapital (Art. 24 Covid-19-SBüG; `--covid-kredit`). Je Stufe ein Aufruf mit den Werten des
    jeweiligen Zwischenabschlusses: `kapitalverlust --aktienkapital … --aktiven … --verbindlichkeiten … [--covid-kredit …] --rangruecktritt <Σ RR inkl. Zinsen> --rr-polster <Polster laut WP>`
    (Ausgabe «Deckung»); Varianten zeigen, nicht entscheiden.'
  feststellung_wenn: 'RR deckt Überschuldung inkl. Zinsen nicht, ist ungültig, Bonitätsnachweis fehlt oder RR-Forderung getilgt/verrechnet: wesentliche Feststellung + Schlussbesprechung,
    sofort an WP.'
  fundstellen:
