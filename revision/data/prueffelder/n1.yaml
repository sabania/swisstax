kurzbeschrieb: 'Langfristige Verbindlichkeiten (Bank-, Hypothekar-, Aktionärs-, Konzern-, Rangrücktrittsdarlehen) inkl. Zinsen. ER: Befragungen (Covenants, Sicherheiten, Fristigkeit,
  Nahestehende), Zinsplausibilisierung, Abstimmung, Verträge, Marchzins, verdecktes EK, Anhang; Rangrücktritte weiter gehend (WP).'
gesetz:
- thema: Ansatz von Verbindlichkeiten als Fremdkapital (Art. 959 Abs. 5 OR)
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden
- thema: Fristigkeit kurz-/langfristig (Art. 959 Abs. 6 OR)
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: Mindestgliederung Passiven, Position langfristige verzinsliche Verbindlichkeiten (Art. 959a Abs. 2 OR)
  quelle: or__art-959a-t1
  zitat: Unter den Passiven müssen ihrer Fälligkeit entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: Gesonderter Ausweis ggü. Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- thema: Bewertung zum Nennwert (Art. 960e Abs. 1 OR)
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Zeitliche Abgrenzung (Zinsen) (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verrechnungsverbot und Bestandesnachweis (Art. 958c Abs. 1 Ziff. 7 und Abs. 2 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: 'Anhang: zur Sicherung eigener Verbindlichkeiten verwendete Aktiven (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: Sicherheiten für Dritte und Ereignisse nach dem Bilanzstichtag (Art. 959c Abs. 2 Ziff. 8 und 13 OR)'
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten bei begründeter Besorgnis einer Überschuldung (Art. 725b Abs. 1 OR)
  quelle: or__art-725b-t1
  zitat: erstellt der Verwaltungsrat unverzüglich je einen Zwischenabschluss zu Fortführungswerten und Veräusserungswerten
- thema: Prüfung der Zwischenabschlüsse durch die Revisionsstelle (Art. 725b Abs. 2 OR)
  quelle: or__art-725b-t1
  zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen
- thema: Rangrücktritt bei Überschuldung inkl. Zinsforderungen (Art. 725b Abs. 4 Ziff. 1 OR)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: 'Ausnahme: begründete Aussicht auf Behebung der Überschuldung innert angemessener Frist, spätestens 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse (Art. 725b Abs. 4
    Ziff. 2 OR; Beurteilung WP)'
  quelle: or__art-725b-t1
  zitat: solange begründete Aussicht besteht, dass die Überschuldung innert angemessener Frist, spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse, behoben werden
    kann
- thema: Subsidiäre Anzeigepflicht der Revisionsstelle bei offensichtlicher Überschuldung (Art. 729c OR)
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: Liberierung durch Verrechnung mit Darlehensforderung (Art. 634a Abs. 1 OR)
  quelle: or__art-634a
  zitat: Die Liberierung kann auch durch Verrechnung mit einer Forderung erfolgen.
- thema: Zusatzangaben (u.a. Art. 961a OR) nur bei ordentlicher Revision (Art. 961 OR)
  quelle: or__art-961
  zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, müssen
- thema: Fälligkeitsaufteilung der langfristigen verzinslichen Verbindlichkeiten 1–5 Jahre / über 5 Jahre (Art. 961a Ziff. 1 OR; nur ordentliche Revision)
  quelle: or__art-961a
  zitat: zu den langfristigen verzinslichen Verbindlichkeiten, aufgeteilt nach Fälligkeit innerhalb von einem bis fünf Jahren und nach fünf Jahren
- thema: 'Covid-19-Kredit: während der Solidarbürgschaft ausgeschlossen: Gewährung von Darlehen an und Rückzahlung von Darlehen von Gesellschaftern/Nahestehenden (Art. 2 Abs. 2 lit.
    b Covid-19-SBüG); Ausnahme vorbestehende Verpflichtungen gegenüber Schweizer Gruppengesellschaften (Beurteilung WP)'
  quelle: covid-sbueg__art-2-t1
  zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
- thema: 'Covid-19-Kredit: während der Solidarbürgschaft ebenso ausgeschlossen: Dividenden/Tantiemen und Rückerstattung von Kapitaleinlagen (Art. 2 Abs. 2 lit. a Covid-19-SBüG)'
  quelle: covid-sbueg__art-2-t1
  zitat: Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen
- thema: 'Covid-19-Kredit: Amortisation innert 8 Jahren, Verlängerung höchstens auf 10 Jahre (Art. 3 Abs. 2 und 3 Covid-19-SBüG)'
  quelle: covid-sbueg__art-3
  zitat: Die Kredite nach der Covid-19-SBüV sind innerhalb von acht Jahren vollständig zu amortisieren.
- thema: 'Covid-19-Kredit: Pflichten der Revisionsstelle bei Verstoss: Frist, Information GV, Information Bürgschaftsorganisation (Art. 23 Abs. 1 Covid-19-SBüG) – nur WP'
  quelle: covid-sbueg__art-23
  zitat: Stellt die Revisionsstelle der Kreditnehmerin oder des Kreditnehmers im Rahmen der eingeschränkten oder ordentlichen Revision der Jahres- oder Konzernrechnung eine Verletzung
    einer Vorgabe nach Artikel 2 Absätze 2–4 fest, so setzt sie ihr oder ihm eine angemessene Frist zur Herstellung des ordnungsgemässen Zustandes.
- thema: 'Covid-19-Kredit: Kredite nach Art. 3 Covid-19-SBüV für Art. 725a/725b OR nicht als Fremdkapital (Art. 24 Abs. 1 Covid-19-SBüG; gilt bis 31.12.2032, Art. 31 Abs. 2); Kredite
    nach Art. 4 SBüV und unverbürgte Teile bleiben Fremdkapital; HFMV-20-Darlehen ebenso ausgenommen (HWP ER Rz 373)'
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- thema: 'Steuerlich: Zinsen auf verdecktem Eigenkapital gehören zum steuerbaren Gewinn (Art. 65 DBG; Steuerrecht, keine handelsrechtliche Bewertungsregel)'
  quelle: dbg__art-65
  zitat: Zum steuerbaren Gewinn der Kapitalgesellschaften und Genossenschaften gehören auch die Schuldzinsen, die auf jenen Teil des Fremdkapitals entfallen, dem wirtschaftlich die Bedeutung
    von Eigenkapital zukommt.
risiken:
- text: Nicht erfasste Darlehen, Zinsen oder Verpflichtungen (z.B. Aktionärsdarlehen nur mündlich vereinbart, Zinsen nicht gebucht).
  pruefziele:
  - VO
  - PA
  quelle: ser-2022__4-3-4
  zitat: Es müssen sämtliche Vermögenswerte, Verbindlichkeiten, Abgrenzungen und Rückstellungen bilanziert
- text: Bilanzierte Verbindlichkeiten bestehen nicht oder sind nicht solche der Gesellschaft (z.B. Privatschulden des Aktionärs, bereits verrechnete/umgewandelte Darlehen).
  pruefziele:
  - EX
  - RV
  quelle: ser-2022__4-3-2
  zitat: Bilanzierte Verpflichtungen müssen solche des Unternehmens (und nicht z. B. des Eigentümers) sein.
- text: 'Falsche Fristigkeit: voraussichtlich innert 12 Monaten fällige Amortisationen/Rückzahlungen oder Darlehen mit wahrscheinlicher Kündigung (z.B. Covenant-Verletzung) weiterhin
    langfristig – bzw. umgekehrt Hypotheken oder auslaufende Festhypotheken mit wahrscheinlicher Verlängerung unnötig umgegliedert.'
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0489-s257
  zitat: die voraussichtlich innerhalb von zwölf Monaten nach Bilanzstichtag zur Zahlung fällig werden, sind in der Bilanz als kurzfristig auszuweisen
- text: Verbindlichkeiten gegenüber Beteiligten/Organen/Nahestehenden nicht gesondert ausgewiesen oder nicht zu Drittbedingungen.
  pruefziele:
  - DO
  - BE
  - VO
  quelle: hwp-er-2026__rz-0162-s212
  zitat: Stellt der Abschlussprüfer wesentliche Transaktionen mit nahestehenden Personen fest, welche nicht korrekt erfasst, bewertet und/oder offengelegt sind
- text: Rangrücktritt ungültig oder ungenügend (Höhe < Überschuldung, Zinsen nicht eingeschlossen, befristet/widerruflich, unzulässig reduziert) oder Gläubiger ohne ausreichende Bonität;
    Verletzung des Tilgungs-/Verrechnungsverbots. Folge kann die Benachrichtigung des Gerichts sein.
  pruefziele:
  - EX
  - RV
  - BE
  - DO
  quelle: hwp-er-2026__rz-0432-s127
  zitat: dass der Rangrücktritt in qualitativer und quantitativer Hinsicht ausreichend ist
- text: Zinsaufwand nicht periodengerecht abgegrenzt (Marchzinsen, Zinsen auf Rangrücktrittsforderungen).
  pruefziele:
  - PA
  - RI
  quelle: ser-2022__4-3-6
  zitat: Geprüft wird, ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden.
- text: Verpfändungen/Zessionen nicht im Anhang offengelegt, insbesondere Bank-AGB-Pfandrecht bei beanspruchtem, nicht vollständig besonders gesichertem Kredit.
  pruefziele:
  - DO
  - RV
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: stellt diese Verpfändung einen ausweispflichtigen Tatbestand dar
- text: Übersetzte Zinsen an Beteiligte bzw. Zinsen auf verdecktem Eigenkapital (verdeckte Gewinnausschüttung, steuerliche Aufrechnung, Verrechnungssteuer).
  pruefziele:
  - BE
  - RI
  - PA
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- text: Verletzte Kreditbedingungen oder auslaufende Finanzierungen gefährden die Fortführung (Bewertung zu Fortführungswerten, Anhangangaben).
  pruefziele:
  - BE
  - DO
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
- text: Fremdwährungsdarlehen falsch bewertet (unrealisierte Kursgewinne erfasst, Kursverluste nicht erfasst).
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: allfällige noch nicht realisierte Kursverluste sind aufwandswirksam zu erfassen – unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- text: 'Covid-19-Kredit: Verwendungsverbote verletzt (Rückzahlung/Verrechnung Aktionärsdarlehen, Darlehen an Aktionär, Dividende) oder kurzfristiger Amortisationsanteil nicht umgegliedert.'
  pruefziele:
