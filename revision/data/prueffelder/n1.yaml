    zitat: über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
- id: N1-401
  vorgehen: 'Nur auf Anweisung/Markierung des WP (4xx; SER Anh. D: weiter gehend). Je Vereinbarung festhalten: Betrag (≥ Überschuldung gemäss geprüftem Zwischenabschluss), Einschluss
    Zinsen ausdrücklich (Datum der Fassung; Übergangsfrist bis 31.12.2024 abgelaufen, Q&A Antwort 23), Stundung, unbefristet, unwiderruflich, Aufhebungs-/Ersatzbedingung, Währung, Unterzeichnung,
    Datum. Ersetzte/reduzierte Fassungen gegen die HWP-Bedingungen prüfen; Abgleich mit Hauptbuch und Anhang.'
  nachweise:
  - Rangrücktrittsvereinbarungen (alle Fassungen)
  - Geprüfte Zwischenabschlüsse bzw. Überschuldungsstatus
  - Kontoblätter der RR-Darlehen und Zinsen
  rechnen: 'Nur wenn überschuldet gemäss beiden geprüften Zwischenabschlüssen (bzw. nur gemäss Zwischenabschluss zu Veräusserungswerten bei fehlender Fortführung; Art. 725b Abs. 1 und
    3 OR): Deckung = Σ gültige RR inkl. Zinsen (Fremdwährung zum Stichtagskurs) − Überschuldung der vom WP gewählten Stufe (HWP BuR Rz 719/720) − Sicherheitspolster (HWP ER Rz 421, Höhe
    WP) ≥ 0; Covid-19-Kredite nach Art. 3 SBüV (und HFMV 20) nicht als Fremdkapital (Art. 24 Covid-19-SBüG; `--covid-kredit`). Je Stufe ein Aufruf mit den Werten des
    jeweiligen Zwischenabschlusses: `kapitalverlust --aktienkapital … --aktiven … --verbindlichkeiten … [--covid-kredit …] --rangruecktritt <Σ RR inkl. Zinsen> --rr-polster <Polster laut WP>`
    (Ausgabe «Deckung»); Varianten zeigen, nicht entscheiden. RR-Betrag
    je Gläubiger ≤ Forderung inkl. Zinsen gemäss Hauptbuch.'
  feststellung_wenn: 'RR ohne Zinseinschluss, befristet/kündbar/widerruflich, unzulässig reduziert, nicht unterzeichnet oder deckt Überschuldung nicht: wesentliche Feststellung + Schlussbesprechung,
    sofort an WP.'
  fundstellen:
  - quelle: ser-2022__anh-d-s085-2
    zitat: Einsicht in Rangrücktrittsvereinbarungen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: hwp-er-2026__rz-0412-s123
    zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
  - quelle: hwp-er-2026__rz-0415-s123-t1
    zitat: Der Rangrücktritt muss zeitlich unbefristet abgeschlossen werden
  - quelle: hwp-bur-2023__rz-0715-s305
    zitat: Der Rangrücktritt muss als Vertrag zugunsten Dritter unwiderruflich ausgestaltet werden.
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: Die Revisionsstelle prüft erneut sämtliche Anforderungen an einen gültigen Rangrücktritt.
  - quelle: or__art-725b-t1
    zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
  - quelle: hwp-er-2026__rz-0420-s125
    zitat: sollte ein Rangrücktritt, der «nur» auf die Deckungslücke zu Fortführungswerten ausgerichtet ist, genügen
  - quelle: hwp-bur-2023__rz-0717-s305-t2
    zitat: ist dessen Höhe vom Verwaltungsrat zu überwachen, um dem Kursrisiko Rechnung zu tragen
  - quelle: hwp-er-2026__rz-0433-s127
    zitat: lässt sich die Benachrichtigung des Gerichts nicht vermeiden
  - quelle: qa-kapitalverlust-2023__5-t1
    zitat: müssen Verträge innerhalb von 2 Jahren (also bis 31.12.2024) angepasst werden.
  - quelle: qa-kapitalverlust-2023__5-t2
    zitat: Nach Ablauf dieser Frist sind die Vorschriften des neuen Rechts auf alle Verträge anwendbar.
  - quelle: or__art-725b-t1
    zitat: Ist die Gesellschaft gemäss den beiden Zwischenabschlüssen überschuldet, so benachrichtigt der Verwaltungsrat das Gericht.
  - quelle: or__art-725b-t1
    zitat: Ist die Annahme der Fortführung nicht gegeben, so genügt ein Zwischenabschluss zu Veräusserungswerten.
  - quelle: hwp-er-2026__rz-0406-s122
    zitat: Ja, die Gesellschaft ist nicht gemäss beiden Zwischenabschlüssen überschuldet
  - quelle: hwp-bur-2023__rz-0719-s307
    zitat: Steht die Fortführungsfähigkeit und -willigkeit nicht infrage oder bestehen nach sachgerechter und pflichtgemässer Beurteilung gute Voraussetzungen, dass die Gesellschaft
      die Überschuldung zu überwinden vermag, genügt es, auf die Deckungslücke zu Fortführungswerten abzustellen.
  - quelle: hwp-bur-2023__rz-0720-s307
    zitat: Steht die Fortführungsfähigkeit und -willigkeit infrage, ist es angezeigt, den Rangrücktritt in einem die Deckungslücke zu Fortführungswerten übersteigenden Betrag auszusprechen.
  - quelle: hwp-bur-2023__rz-0720-s307
    zitat: muss der Rangrücktritt die Deckungslücke zu Liquidationswerten abdecken
  - quelle: hwp-er-2026__rz-0421-s125
    zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten 12 Monaten nach Unterzeichnung des Rangrücktritts, mindestens aber bis zum nächsten Prüfungszeitpunkt
      noch zu erwartenden Verluste zu berücksichtigen.
  - quelle: covid-sbueg__art-24
    zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
  - quelle: hwp-er-2026__rz-0373-s113
    zitat: Dies gilt auch für Darlehen oder verbürgte/garantierte Kredite nach der Covid-19-Härtefallverordnung 2020 (Art. 21 HFMV 20).
- id: N1-402
  vorgehen: 'Nur auf Anweisung des WP (4xx). Ausweis gemäss Mindestgliederung prüfen: langfristige verzinsliche vs. übrige langfristige Verbindlichkeiten; kurzfristiger Anteil gemäss
    N1-103 (inkl. Covenant-Verletzung ohne wirksamen Waiver) unter kurzfristigen verzinslichen Verbindlichkeiten; Hypotheken und auslaufende Festhypotheken mit wahrscheinlicher Verlängerung
    bleiben langfristig. Umgliederungsbedarf im Textfeld beziffern.'
  nachweise:
  - Bilanz/Saldoliste mit Gruppenzuordnung
  - Ergebnisse N1-101, N1-103, N1-302
  rechnen: Umgliederung = kurzfristiger Anteil gemäss N1-103 (Σ innert 12 Monaten fällige Amortisationen/Rückzahlungen inkl. innert 12 Monaten fällige Covid-Amortisation gemäss Amortisationsplan
    – auslaufende Festhypotheken mit belegter Verlängerungsabsicht + Darlehen mit konkreter Kündigungsabsicht bzw. Covenant-Verletzung ohne Waiver) – bereits kurzfristig ausgewiesene
    Beträge
  feststellung_wenn: Kurzfristig fällige Anteile langfristig ausgewiesen oder verzinsliche Darlehen unter übrigen Verbindlichkeiten, und Betrag über der Nichtaufgriffsgrenze (3.3); Grenzfälle
    (Verlängerung, Waiver) als Pendenz an WP.
  fundstellen:
  - quelle: or__art-959a-t1
    zitat: Unter den Passiven müssen ihrer Fälligkeit entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Hypothekarschulden sind unter den langfristigen Verbindlichkeiten auszuweisen, auch wenn sie in der Praxis häufig kurzfristig kündbar sind.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Im Folgejahr auslaufende Festhypotheken können weiterhin als langfristig bilanziert werden, soweit ihre Verlängerung beabsichtigt und wahrscheinlich ist.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: wenn aufgrund der Verletzung bestimmter Kreditvertragsklauseln (sog. Covenants) eine frühzeitige Vertragsauflösung als wahrscheinlich erscheint
  - quelle: hwp-bur-2023__rz-0875-s356
    zitat: sind grundsätzlich als kurzfristige verzinsliche Verbindlichkeiten zu bilanzieren
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: Die Umgliederung in die kurzfristigen verzinslichen Verbindlichkeiten kann allenfalls vermieden werden
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: covid-sbueg__art-3
    zitat: Die Kredite nach der Covid-19-SBüV sind innerhalb von acht Jahren vollständig zu amortisieren.
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
- id: N1-403
  vorgehen: 'Nur auf Anweisung des WP (4xx). Bewegungen der Darlehenskonten mit Verträgen, Bankbelegen, Amortisationsplänen und Beschlüssen (z.B. GV-Protokoll bei Verrechnungsliberierung)
    abgleichen; bei RR-Forderungen auch Folgejahr bis Prüfungsdatum. Umbuchungen, Verrechnungen und Rückzahlungen auf Zulässigkeit prüfen (Verrechnungsverbot, Tilgungsverbot bei RR).
    Bei Covid-19-Kredit: Rückzahlungen/Verrechnungen von Aktionärsdarlehen und Darlehen an Aktionäre = möglicher Verstoss Art. 2 Abs. 2 lit. b Covid-19-SBüG (Ausnahme Gruppengesellschaft
    beurteilt WP). Saldofortschreibung je Konto dokumentieren.'
  nachweise:
  - Kontoblätter Darlehenskonten (inkl. Folgejahr)
  - Verträge/Nachträge
  - Bankbelege (Auszahlung, Amortisation)
  - GV-/VR-Beschlüsse
  rechnen: Saldo 01.01. + Zugänge – Abgänge (Amortisation, Rückzahlung, Verrechnung) = Saldo 31.12. je Konto
  feststellung_wenn: 'Zu-/Abgang ohne Vertrag/Beleg/Beschluss oder unzulässige Verrechnung; Tilgung/Verrechnung einer RR-Forderung trotz Überschuldung: wesentliche Feststellung, sofort
    an WP (Art. 729c OR). Rückwirkende Einbuchung eines RR-Darlehens gegen eine Forderung an den Darlehensgeber: wesentliche Feststellung.'
  fundstellen:
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
  - quelle: hwp-er-2026__rz-0434-s128
    zitat: so sind ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen
  - quelle: or__art-634a
    zitat: Die Liberierung kann auch durch Verrechnung mit einer Forderung erfolgen.
  - quelle: hwp-er-2026__rz-0416-s124
    zitat: Gestattet ist der Verzicht auf eine im Rang zurückgestellte Forderung oder deren Umwandlung in Eigenkapital der Gesellschaft
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: covid-sbueg__art-2-t1
    zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
  - quelle: covid-sbueg__art-2-t1
    zitat: zulässig ist jedoch die Erfüllung von Verpflichtungen gegenüber einer mit der Kreditnehmerin oder dem Kreditnehmer direkt oder indirekt verbundenen Gruppengesellschaft mit
      Sitz in der Schweiz, die vor Entstehung der Solidarbürgschaft bestanden haben
  - quelle: hwp-bur-2023__rz-0721-s307
    zitat: Nicht zulässig ist daher die rückwirkende Einbuchung eines Passivdarlehens unter Rangrücktritt gegen eine (kurzfristige) Forderung gegenüber dem Darlehensgeber oder der Darlehensgeberin.
