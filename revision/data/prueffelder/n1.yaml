- id: N1-320
  vorgehen: 'Anhang prüfen auf: gesonderten Ausweis der Verbindlichkeiten ggü. Beteiligten/Organen, Kennzeichnung der Rangrücktritte, Gesamtbetrag verpfändeter/abgetretener Aktiven (inkl.
