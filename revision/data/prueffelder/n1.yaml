schritte:
- id: N1-101
  vorgehen: 'Schriftliche Antwort von GL/VR auswerten (fehlt sie: Frage als Pendenz erfassen): Wurden Kreditbedingungen (Covenants, Amortisationen, Zinszahlungen) verletzt? Antwort mit
    Kreditverträgen und Bankkorrespondenz abgleichen; bei Verletzung Massnahmen, Waiver und Folgen für Fristigkeit und Fortführung festhalten. Frage und Antwort im Textfeld dokumentieren.'
  nachweise:
  - Schriftliche Antwort GL/VR
  - Kreditverträge mit Covenant-Klauseln
  - Covenant-Berechnung/Compliance-Bestätigung
  - Waiver der Bank (falls Verletzung)
  rechnen: Covenant-Kennzahlen gemäss Vertragsdefinition aus Jahresrechnung nachrechnen und mit Schwellenwert vergleichen
  feststellung_wenn: Verletzte Kreditbedingungen ohne schriftlichen Waiver vor Abschlusserstellung bei weiterhin langfristigem Ausweis, oder Antwort fehlt bzw. widerspricht den Unterlagen.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung, ob die Unternehmensleitung Bestimmungen von Darlehensverträgen (z. B. Kennzahlen in Kreditverträgen) nicht eingehalten hat
  - quelle: ser-2022__anh-d-s085-1
    zitat: Besprechung der Massnahmen der Unternehmensleitung und der allfällig erforderlichen Korrekturen in der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: Bei der Abschlusserstellung muss deshalb überprüft werden, ob die Covenants eingehalten sind
  - quelle: hwp-er-2026__rz-0103-s197
    zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- id: N1-102
  vorgehen: Antwort zu Sicherheiten (Grundpfand, Faustpfand, Zession, Bank-AGB-Pfandrecht, Garantien) auswerten bzw. als Pendenz erfragen; mit Kreditverträgen, Pfand-/Zessionsverträgen
    und vorhandener Bankbestätigung (Abschnitt Sicherheiten) abgleichen. Buchwert verpfändeter/abgetretener Aktiven ermitteln und mit Anhangangabe vergleichen.
  nachweise:
  - Antwort GL zu Sicherheiten
  - Pfand-, Zessions- und Sicherungsverträge
  - Bankbestätigung/Kreditvertrag (Sicherheiten)
  - Anhang der Jahresrechnung
  rechnen: Summe Buchwerte verpfändeter/abgetretener Aktiven per 31.12. = Anhangangabe zur Sicherung eigener Verbindlichkeiten verwendete Aktiven
  feststellung_wenn: Verpfändung/Zession besteht, ist aber nicht oder mit abweichendem Betrag im Anhang offengelegt, oder Antwort widerspricht Verträgen/Bankunterlagen.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung über Sicherheiten zugunsten von Darlehensgebern
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0844-s348
    zitat: Das Gesetz verlangt nicht den separaten Ausweis der Verbindlichkeiten, für die eine Sicherstellung erfolgte
- id: N1-103
  vorgehen: 'Antwort der GL zur Fristigkeit auswerten bzw. erfragen: innert 12 Monaten fällige Amortisationen/Rückzahlungen, Kündigungen, auslaufende Festkredite und Verlängerungsabsichten.
    Mit Amortisationsplänen und Verträgen abgleichen; Ergebnis als Grundlage für N1-402 im Textfeld festhalten.'
  nachweise:
  - Antwort GL zur Fälligkeit
  - Kreditverträge/Amortisationspläne
  - Kündigungs-/Verlängerungskorrespondenz
  rechnen: Kurzfristiger Anteil = Summe der vertraglich zwischen 01.01. und 31.12. des Folgejahres fälligen Amortisationen/Rückzahlungen
  feststellung_wenn: Innert 12 Monaten fällige Beträge gemäss Antwort oder Vertrag sind nicht als kurzfristig ausgewiesen, oder Antwort widerspricht den Verträgen.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Darlehen
  - quelle: or__art-959
    zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
      Zahlung fällig werden.
- id: N1-104
  vorgehen: Liste der Nahestehenden (Aktionäre, VR/GL, Beteiligungen) aus Aktienbuch, HR-Auszug und GV-/VR-Protokollen erstellen; schriftliche Antwort der GL zu deren Darlehen auswerten
    und mit Hauptbuchkonten abgleichen. Gesonderten Ausweis in Bilanz/Anhang prüfen und Konditionen für N1-304 notieren.
  nachweise:
  - Aktienbuch, HR-Auszug, GV-/VR-Protokolle
  - Antwort GL zu Darlehen Nahestehender
  - Darlehensverträge mit Nahestehenden
  - Bilanz/Anhang
  rechnen: Summe Darlehen Nahestehender gemäss Hauptbuch = gesondert ausgewiesener Betrag in Bilanz bzw. Anhang
  feststellung_wenn: Darlehen von Beteiligten/Organen/Beteiligungsgesellschaften nicht gesondert ausgewiesen, nicht vollständig erfasst oder ohne schriftlichen Vertrag.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zu Darlehen gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
- id: N1-105
  vorgehen: Antwort von GL/VR zu Rangrücktritten (Gläubiger, Betrag inkl. Zinsen, Änderungen, Zahlungen/Verrechnungen) auswerten bzw. erfragen und mit den Vereinbarungen (N1-401) und
    dem Überschuldungsstatus abgleichen. Bonitätsnachweise der Gläubiger zusammenstellen und die Bonitätsbeurteilung als Pendenz an den WP übergeben (Kennzeichnung WP, kein eigenes Urteil).
  nachweise:
  - Antwort GL/VR zu Rangrücktritten
  - Rangrücktrittsvereinbarungen
  - Überschuldungsstatus/Zwischenabschluss
  - Bonitätsnachweise der Gläubiger
  rechnen: Überschuldung = Fremdkapital – Aktiven (zu Fortführungswerten) per 31.12.; Summe Rangrücktritte inkl. Zinsen – Überschuldung ≥ 0
  feststellung_wenn: Rangrücktritte decken die Überschuldung inkl. Zinsen nicht, Bonitätsnachweis fehlt, oder auf RR-Forderungen wurden Zahlungen/Verrechnungen vorgenommen.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zu Rangrücktritten
  - quelle: hwp-er-2026__rz-0432-s127
    zitat: Dies beinhaltet auch die Beurteilung der Bonität des Rangrücktrittgläubigers
  - quelle: hwp-er-2026__rz-0420-s125
    zitat: Gemäss Art. 725b Abs. 4 OR hat der Rangrücktritt mindestens im Ausmass der Überschuldung zu erfolgen.
  - quelle: hwp-bur-2023__rz-0717-s305-t2
    zitat: Der Verwaltungsrat hat die Einhaltung sämtlicher Anforderungen an einen gültigen Rangrücktritt, auch die Bonität des Gläubigers oder der Gläubigerin, nachzuweisen.
- id: N1-201
  vorgehen: Erwartungswert Zinsaufwand je Darlehen bilden (Saldo bzw. zeitgewichteter Saldo ab Auszahlung/Amortisation × Vertragszins) und mit gebuchtem Zinsaufwand vergleichen. Abweichungen
    über der tolerierbaren Abweichung klären (fehlende Abgrenzung, Gebühren, Zinsen unter Rangrücktritt). Rechnung, Toleranz und Ergebnis im Textfeld dokumentieren.
  nachweise:
  - Darlehensspiegel mit Zinssätzen
  - Kontoblatt Zinsaufwand
  - Verträge (Zinssatz, Auszahlungsdatum)
  rechnen: Erwarteter Zins = Σ (Saldo × Zinssatz × Laufzeit im Jahr ab Auszahlung bzw. bis Amortisation); Abweichung = gebuchter Zinsaufwand – Erwartungswert ≤ tolerierbare Abweichung
  feststellung_wenn: Abweichung zwischen Erwartungswert und gebuchtem Zinsaufwand über der tolerierbaren Abweichung und nicht erklärbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Beurteilung, ob der Zinsaufwand im Verhältnis zu den Darlehenssalden plausibel erscheint
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0108-s198
    zitat: Dabei wird keine exakte Übereinstimmung der geprüften Daten mit den zur Verfügung stehenden Vergleichsgrössen angestrebt
- id: N1-301
  vorgehen: Darlehensspiegel/Saldoliste mit Hauptbuch und Bilanz abstimmen; je Darlehen Saldo 31.12. abgleichen mit a) vom Kunden vorliegender Bankbestätigung/Kontoauszug, b) Zins-/Amortisationsabrechnungen,
    c) Verträgen, d) Gegenbuchhaltung/Saldobestätigung, e) übrigen Unterlagen (z.B. GV-Protokoll). Keine Bankbestätigung selbst einholen; fehlende Nachweise als Pendenz.
  nachweise:
  - Darlehensspiegel
  - Saldoliste/Kontoblätter
  - Bankbestätigung bzw. Kontoauszug per 31.12.
  - Zinsabrechnungen
  - Verträge
  - Saldobestätigung Gegenpartei
  rechnen: Σ Einzelsalden Darlehensspiegel = Saldo Bilanzposition = Σ Hauptbuchkonten; je Darlehen Saldo Buchhaltung = Saldo Nachweis
  feststellung_wenn: Differenz zwischen Bilanz, Hauptbuch und Nachweis je Darlehen, oder kein Nachweis für ein wesentliches Darlehen vorhanden.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Abstimmung einer Aufstellung der Verbindlichkeiten mit der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0485-s256
    zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
- id: N1-302
  vorgehen: Kredit- und Darlehensverträge inkl. Nachträge einsehen; Parteien, Betrag, Auszahlung, Zinssatz, Fälligkeit/Amortisation, Kündigung, Sicherheiten, Covenants und Rangrücktrittsklauseln
    tabellarisch erfassen und mit Buchhaltung und Anhang abgleichen. Fehlende oder nicht unterzeichnete Verträge als Pendenz erfassen; Verträge für Dauerakte vormerken.
  nachweise:
  - Kredit- und Darlehensverträge inkl. Nachträge
  - Vertragsübersicht (Arbeitspapier)
  rechnen: Vertragsbetrag ± Auszahlungen/Amortisationen = Saldo 31.12. gemäss Buchhaltung
  feststellung_wenn: Kein schriftlicher Vertrag für ein wesentliches Darlehen, oder Vertragskonditionen weichen von Buchhaltung/Anhang ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in Kredit- und Darlehensverträge
  - quelle: hwp-bur-2023__rz-0484-s256
    zitat: Es ist zweckmässig, für jede langfristige Verbindlichkeit eine gesonderte Aufzeichnung mit den relevanten Eigenschaften und Bedingungen zu führen.
  - quelle: hwp-er-2026__rz-0175-s217
    zitat: Hat die Gesellschaft selbst nachweislich einen rechtsgültigen Vertrag über das Darlehen abgeschlossen
- id: N1-303
  vorgehen: 'Zinsabgrenzungsberechnung des Kunden einsehen bzw. nachrechnen: aufgelaufene, per Stichtag unbezahlte Zinsen je Darlehen gemäss vertraglichen Zinsterminen. Mit passiven
    Rechnungsabgrenzungen bzw. Zinsverbindlichkeiten abstimmen; Ausweis von Zinsen auf RR-Forderungen beachten.'
  nachweise:
  - Zinsabgrenzungsberechnung
  - Verträge (Zinstermine)
  - Kontoblätter Zinsaufwand und Abgrenzungen
  rechnen: Marchzins = Saldo × Zinssatz × Tage seit letztem Zinstermin bis 31.12. / 360; Σ Marchzinsen = gebuchte Zinsabgrenzung
  feststellung_wenn: Aufgelaufene Zinsen nicht oder falsch abgegrenzt und Differenz nicht unwesentlich.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in die Zinsabgrenzungsberechnung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- id: N1-304
  vorgehen: 'Bei Darlehen von Beteiligten/Nahestehenden: zulässiges Fremdkapital nach ESTV-KS 6a (Ansätze auf Aktiven) berechnen und mit dem Fremdkapital vergleichen; Zinssatz mit den
    steuerlich anerkannten Sätzen des massgebenden Jahres und Drittvergleich vergleichen. Mögliches verdecktes Eigenkapital bzw. übersetzte Zinsen (verdeckte Gewinnausschüttung) als
    Pendenz an den WP.'
  nachweise:
  - Berechnung verdecktes Eigenkapital
  - Darlehensverträge mit Beteiligten
  - ESTV-Rundschreiben Zinssätze des Geschäftsjahres
  - Bilanz zu Buch-/Verkehrswerten
  rechnen: Zulässiges FK = Σ (Aktiven × Ansatz KS 6a); verdecktes EK = max(0, FK – zulässiges FK), höchstens FK von Beteiligten/Nahestehenden; aufzurechnender Zins = Zins auf verdecktem
    EK
  feststellung_wenn: Fremdkapital über zulässigem Fremdkapital aus Mitteln Beteiligter oder Zinssatz über dem steuerlich anerkannten Satz ohne Drittvergleich.
  fundstellen:
  - quelle: estv-ks-6a-2024__einleitung-t3
    zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
  - quelle: estv-ks-6a-2024__3-1
    zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
  - quelle: hwp-er-2026__rz-0163-s212
    zitat: Eine verdeckte Gewinnausschüttung liegt dann vor, wenn eine Gesellschaft Leistungen erbringt, ohne dafür eine (angemessene) Gegenleistung zu erhalten.
  - quelle: hwp-er-2026__rz-0176-s217
    zitat: Entspricht der Zinssatz den Marktkonditionen für den Darlehensnehmer
- id: N1-320
  vorgehen: 'Anhang prüfen auf: gesonderten Ausweis der Verbindlichkeiten ggü. Beteiligten/Organen, Kennzeichnung der Rangrücktritte, Gesamtbetrag verpfändeter/abgetretener Aktiven,
    Sicherheiten für Dritte und wesentliche Ereignisse nach dem Stichtag. Ergebnisse aus N1-102, N1-104, N1-105 einbeziehen; Fälligkeitsaufteilung nach Art. 961a OR nur bei ordentlicher
    Revision.'
  nachweise:
  - Anhang der Jahresrechnung
  - Ergebnisse N1-102, N1-104, N1-105
  rechnen: Anhangbeträge (Nahestehende, Rangrücktritte, verpfändete Aktiven) = Werte gemäss Prüfung
  feststellung_wenn: Pflichtangabe fehlt oder Betrag im Anhang weicht von den Prüfungsergebnissen ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Durchsicht des Anhangs auf vollständige Offenlegung der aufgrund der Befragungen zutreffenden Positionen gemäss Art. 959c OR
  - quelle: ser-2022__anh-d-s098-3
    zitat: Sind Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: hwp-bur-2023__rz-0494-s257
    zitat: Passivdarlehen mit Rangrücktritt sind in der Jahresrechnung oder im Anhang gesondert auszuweisen
  - quelle: or__art-959c-t2
    zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- id: N1-322
  vorgehen: Neue oder geänderte Kredit-/Darlehensverträge, Rangrücktrittsvereinbarungen und Pfand-/Zessionsverträge für die Dauerakte in M-Files vorschlagen bzw. ablegen; ersetzte Fassungen
    kennzeichnen. Darlehensübersicht (Gläubiger, Konditionen, Sicherheiten, Rangrücktritt) fortschreiben.
  nachweise:
  - Dauerakte M-Files
  - Aktualisierte Darlehensübersicht
  rechnen: ''
  feststellung_wenn: Wesentlicher Vertrag oder Rangrücktritt fehlt in der Dauerakte bzw. ist nicht beschaffbar (als Pendenz erfassen).
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: wie beispielsweise wichtige Verträge, Registerauszüge, Statuten etc.
  - quelle: ser-2022__7-3
    zitat: über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
- id: N1-401
  vorgehen: 'Rangrücktrittsvereinbarungen einsehen und je Vereinbarung festhalten: Betrag (≥ Überschuldung), Einschluss Zinsen, unbefristet/unwiderruflich, Stundung, Aufhebungs-/Ersatzbedingung,
    Unterzeichnung, Datum. Ersetzte/reduzierte Fassungen gegen die HWP-Bedingungen prüfen; Abgleich mit Hauptbuch und Anhang.'
  nachweise:
  - Rangrücktrittsvereinbarungen (alle Fassungen)
  - Überschuldungsstatus
  - Kontoblätter der RR-Darlehen und Zinsen
  rechnen: Σ Rangrücktritte inkl. Zinsen – Überschuldung per 31.12. ≥ 0; RR-Betrag je Gläubiger ≤ Forderung inkl. Zinsen gemäss Hauptbuch
  feststellung_wenn: Vereinbarung ohne Zinseinschluss, befristet/kündbar, unzulässig reduziert, nicht unterzeichnet, oder Summe deckt die Überschuldung nicht.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-2
    zitat: Einsicht in Rangrücktrittsvereinbarungen
  - quelle: hwp-er-2026__rz-0412-s123
    zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
  - quelle: hwp-er-2026__rz-0415-s123-t1
    zitat: Der Rangrücktritt muss zeitlich unbefristet abgeschlossen werden
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: Die Revisionsstelle prüft erneut sämtliche Anforderungen an einen gültigen Rangrücktritt.
  - quelle: or__art-725b-t1
    zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- id: N1-402
  vorgehen: 'Ausweis gemäss Mindestgliederung prüfen: langfristige verzinsliche vs. übrige langfristige Verbindlichkeiten; innert 12 Monaten fällige Amortisationen/Rückzahlungen (aus
    N1-103/N1-302) und Darlehen mit verletzten Covenants ohne Waiver unter kurzfristigen verzinslichen Verbindlichkeiten. Umgliederungsbedarf im Textfeld beziffern.'
  nachweise:
  - Bilanz/Saldoliste mit Gruppenzuordnung
  - Ergebnisse N1-101, N1-103, N1-302
  rechnen: Umgliederung = Σ innert 12 Monaten fällige Beträge gemäss Verträgen – bereits kurzfristig ausgewiesene Beträge
  feststellung_wenn: Kurzfristig fällige Anteile langfristig ausgewiesen oder verzinsliche Darlehen unter übrigen Verbindlichkeiten, und Betrag nicht unwesentlich.
  fundstellen:
  - quelle: or__art-959a-t1
    zitat: Unter den Passiven müssen ihrer Fälligkeit entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
  - quelle: hwp-bur-2023__rz-0875-s356
    zitat: sind grundsätzlich als kurzfristige verzinsliche Verbindlichkeiten zu bilanzieren
- id: N1-403
  vorgehen: Bewegungen der Darlehenskonten (Kontoblätter) mit Verträgen, Bankbelegen, Amortisationsplänen und Beschlüssen (z.B. GV-Protokoll bei Verrechnungsliberierung) abgleichen.
    Umbuchungen und Verrechnungen auf Zulässigkeit prüfen (Verrechnungsverbot, Tilgungsverbot bei Rangrücktritt). Saldofortschreibung je Konto dokumentieren.
  nachweise:
  - Kontoblätter Darlehenskonten
  - Verträge/Nachträge
  - Bankbelege (Auszahlung, Amortisation)
  - GV-/VR-Beschlüsse
  rechnen: Saldo 01.01. + Zugänge – Abgänge (Amortisation, Rückzahlung, Verrechnung) = Saldo 31.12. je Konto
  feststellung_wenn: Zu-/Abgang ohne Vertrag/Beleg/Beschluss, unzulässige Verrechnung oder Rückzahlung einer Forderung unter Rangrücktritt.
  fundstellen:
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
  - quelle: or__art-634a
    zitat: Die Liberierung kann auch durch Verrechnung mit einer Forderung erfolgen.
  - quelle: hwp-er-2026__rz-0416-s124
    zitat: Gestattet ist der Verzicht auf eine im Rang zurückgestellte Forderung oder deren Umwandlung in Eigenkapital der Gesellschaft
