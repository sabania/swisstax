# Prüffeld N1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: N1
bezeichnung: Langfristige Verbindlichkeiten
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: false
kurzbeschrieb: 'Langfristige verzinsliche und übrige langfristige Verbindlichkeiten (Bank-/Hypothekardarlehen, Aktionärs- und Konzerndarlehen, Darlehen mit Rangrücktritt) inkl. Zinsen.
  In der eingeschränkten Revision: Befragungen (Covenants, Sicherheiten, Fristigkeit, Nahestehende, Rangrücktritte), Zinsplausibilisierung und Detailprüfungen (Abstimmung, Verträge,
  Zinsabgrenzung, Gliederung, Anhang).'
gesetz:
- thema: Ansatz von Verbindlichkeiten als Fremdkapital (Art. 959 Abs. 5 OR)
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden
- thema: Fristigkeit kurz-/langfristig (Art. 959 Abs. 6 OR)
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: Mindestgliederung Passiven, Position langfristige verzinsliche Verbindlichkeiten (Art. 959a Abs. 2 OR)
  quelle: or__art-959a-t1
  zitat: Unter den Passiven müssen ihrer Fälligkeit entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: Gesonderter Ausweis ggü. Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- thema: Bewertung zum Nennwert (Art. 960e Abs. 1 OR)
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Zeitliche Abgrenzung (Zinsen) (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verrechnungsverbot und Bestandesnachweis (Art. 958c Abs. 1 Ziff. 7 und Abs. 2 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: 'Anhang: zur Sicherung eigener Verbindlichkeiten verwendete Aktiven (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: Sicherheiten für Dritte und Ereignisse nach dem Bilanzstichtag (Art. 959c Abs. 2 Ziff. 8 und 13 OR)'
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: Rangrücktritt bei Überschuldung inkl. Zinsforderungen (Art. 725b Abs. 4 Ziff. 1 OR)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: Liberierung durch Verrechnung mit Darlehensforderung (Art. 634a Abs. 1 OR)
  quelle: or__art-634a
  zitat: Die Liberierung kann auch durch Verrechnung mit einer Forderung erfolgen.
- thema: Zusatzangaben (u.a. Fälligkeiten langfristiger verzinslicher Verbindlichkeiten, Art. 961a OR) nur bei ordentlicher Revision (Art. 961 OR)
  quelle: or__art-961
  zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, müssen
risiken:
- text: Nicht erfasste Darlehen, Zinsen oder Verpflichtungen (z.B. Aktionärsdarlehen nur mündlich vereinbart, Zinsen nicht gebucht).
  pruefziele:
  - VO
  - PA
  quelle: ser-2022__4-3-4
  zitat: Es müssen sämtliche Vermögenswerte, Verbindlichkeiten, Abgrenzungen und Rückstellungen bilanziert
- text: Bilanzierte Verbindlichkeiten bestehen nicht oder sind nicht solche der Gesellschaft (z.B. Privatschulden des Aktionärs, bereits verrechnete/umgewandelte Darlehen).
  pruefziele:
  - EX
  - RV
  quelle: ser-2022__4-3-2
  zitat: Bilanzierte Verpflichtungen müssen solche des Unternehmens (und nicht z. B. des Eigentümers) sein.
- text: 'Falsche Fristigkeit: innert 12 Monaten fällige Amortisationen/Rückzahlungen oder Darlehen mit verletzten Covenants weiterhin als langfristig ausgewiesen.'
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0489-s257
  zitat: die voraussichtlich innerhalb von zwölf Monaten nach Bilanzstichtag zur Zahlung fällig werden, sind in der Bilanz als kurzfristig auszuweisen
- text: Verbindlichkeiten gegenüber Beteiligten/Organen/Nahestehenden nicht gesondert ausgewiesen oder nicht zu Drittbedingungen.
  pruefziele:
  - DO
  - BE
  - VO
  quelle: hwp-er-2026__rz-0162-s212
  zitat: Stellt der Abschlussprüfer wesentliche Transaktionen mit nahestehenden Personen fest, welche nicht korrekt erfasst, bewertet und/oder offengelegt sind
- text: Rangrücktritt ungenügend (Höhe < Überschuldung, Zinsen nicht eingeschlossen, befristet/kündbar, unzulässig reduziert) oder Gläubiger ohne ausreichende Bonität; Verletzung des
    Tilgungs-/Verrechnungsverbots.
  pruefziele:
  - EX
  - RV
  - BE
  - DO
  quelle: hwp-er-2026__rz-0432-s127
  zitat: dass der Rangrücktritt in qualitativer und quantitativer Hinsicht ausreichend ist
- text: Zinsaufwand nicht periodengerecht abgegrenzt (Marchzinsen, Zinsen auf Rangrücktrittsforderungen).
  pruefziele:
  - PA
  - RI
  quelle: ser-2022__4-3-6
  zitat: Geprüft wird, ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden.
- text: Verpfändungen/Zessionen (inkl. Bank-AGB-Pfandrecht, Globalzession) nicht im Anhang offengelegt.
  pruefziele:
  - DO
  - RV
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: stellt diese Verpfändung einen ausweispflichtigen Tatbestand dar
- text: Übersetzte Zinsen an Beteiligte bzw. Zinsen auf verdecktem Eigenkapital (verdeckte Gewinnausschüttung, steuerliche Aufrechnung, Verrechnungssteuer).
  pruefziele:
  - BE
  - RI
  - PA
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- text: Verletzte Kreditbedingungen oder auslaufende Finanzierungen gefährden die Fortführung (Bewertung zu Fortführungswerten, Anhangangaben).
  pruefziele:
  - BE
  - DO
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
unterlagen:
- dokument: Darlehensspiegel/Aufstellung aller lang- und kurzfristigen verzinslichen Verbindlichkeiten per 31.12. (Gläubiger, Saldo VJ, Zu-/Abgänge, Saldo, Zinssatz, Zinsaufwand, Fälligkeit/Amortisation,
    Sicherheiten, Rangrücktritt)
  zweck: Abstimmung mit Hauptbuch/Bilanz (N1-301, N1-402, N1-403)
  quelle: ser-2022__anh-d-s085-1
  zitat: Abstimmung einer Aufstellung der Verbindlichkeiten mit der Jahresrechnung
- dokument: Kredit- und Darlehensverträge inkl. Nachträge, Amortisationspläne, Covenant-Klauseln
  zweck: Konditionen, Fälligkeit, Sicherheiten, Covenants (N1-101 bis N1-103, N1-302)
  quelle: ser-2022__anh-d-s085-1
  zitat: Einsicht in Kredit- und Darlehensverträge
- dokument: Bankauszüge, Zins- und Amortisationsabrechnungen sowie vom Kunden selbst eingeholte Bank-/Saldobestätigungen per 31.12.
  zweck: Bestandesnachweis je Darlehen (N1-301 a/b)
  quelle: hwp-bur-2023__rz-0485-s256
  zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
- dokument: Saldobestätigung bzw. Kontoauszug der Gegenbuchhaltung bei Konzern- und Aktionärsdarlehen
  zweck: Abstimmung Gegenbuchhaltung (N1-301 d)
  quelle: hwp-bur-2023__rz-0485-s256
  zitat: Bei Darlehen zwischen Konzerngesellschaften sind die Salden der Buchhaltungen gegenseitig abzustimmen.
- dokument: Zinsabgrenzungsberechnung per 31.12.
  zweck: Prüfung Marchzinsen (N1-303)
  quelle: ser-2022__anh-d-s085-1
  zitat: Einsicht in die Zinsabgrenzungsberechnung
- dokument: Rangrücktrittsvereinbarungen inkl. ersetzter/geänderter Fassungen
  zweck: Ausgestaltung, Höhe, Einschluss Zinsen (N1-105, N1-401)
  quelle: ser-2022__anh-d-s085-2
  zitat: Einsicht in Rangrücktrittsvereinbarungen
- dokument: Bonitätsnachweise der Rangrücktrittsgläubiger (z.B. Jahresrechnung, Vermögensnachweis) und Nachweis des VR zur Einhaltung der Rangrücktrittsanforderungen
  zweck: Beurteilung Bonität durch WP (N1-105)
  quelle: hwp-bur-2023__rz-0717-s305-t2
  zitat: Der Verwaltungsrat hat die Einhaltung sämtlicher Anforderungen an einen gültigen Rangrücktritt, auch die Bonität des Gläubigers oder der Gläubigerin, nachzuweisen.
- dokument: Covenant-Berechnung/Compliance-Bestätigung und ggf. schriftlicher Waiver der Bank
  zweck: Einhaltung Kreditbedingungen, Fristigkeit (N1-101, N1-402)
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: dass sie trotz Verletzung der Kreditbedingungen auf die sofortige bzw. innert eines Jahres fällige Rückzahlung verzichtet
- dokument: Pfand-, Zessions- und Sicherungsverträge, Grundbuchauszug/Schuldbriefe
  zweck: Sicherheiten und Anhangangabe verpfändete Aktiven (N1-102, N1-320)
  quelle: hwp-bur-2023__rz-0844-s348
  zitat: gemäss Eigentumsvorbehaltsregister, Grundbuch, Leasingvertrag, Pfandvertrag, Abtretungsvertrag
- dokument: Aktienbuch, Handelsregisterauszug, GV- und VR-Protokolle
  zweck: Identifikation Nahestehender, Beschlüsse zu Darlehen/Verrechnungsliberierung (N1-104, N1-403)
  quelle: hwp-er-2026__rz-0161-s212
  zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
- dokument: 'Bei Überschuldung: geprüfte Zwischenabschlüsse bzw. Überschuldungsstatus'
  zweck: Höhe der erforderlichen Rangrücktritte (N1-105, N1-401)
  quelle: hwp-er-2026__rz-0423-s125-t2
  zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
- dokument: Berechnung verdecktes Eigenkapital (Aktiven zu Verkehrs-/Buchwerten) bei Darlehen von Beteiligten
  zweck: Beurteilung verdecktes Eigenkapital (N1-304)
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
- dokument: Vollständigkeitserklärung (u.a. Nahestehende, Belastungen, Verbindlichkeiten)
  zweck: Schriftliche Bestätigung der Befragungsergebnisse
  quelle: ser-2022__anh-e-s111-1
  zitat: der Ausweis von Guthaben und Verbindlichkeiten gegenüber nahestehenden Personen (Art. 959a Abs. 4 OR) ist vollständig und richtig
bewertung:
- regel: Verbindlichkeiten zum Nennwert; keine Bewertung zum tieferen Marktwert.
  quelle: hwp-bur-2023__rz-0486-s256
  zitat: Das Nennwertprinzip für die Verbindlichkeiten schliesst eine Bewertung zum tieferen Marktwert aus.
- regel: Innert 12 Monaten fällige Teilbeträge sind kurzfristig, übrige langfristig; verzinsliche Verbindlichkeiten gesondert.
  quelle: hwp-bur-2023__rz-0489-s257
  zitat: die voraussichtlich innerhalb von zwölf Monaten nach Bilanzstichtag zur Zahlung fällig werden, sind in der Bilanz als kurzfristig auszuweisen
- regel: Kurzfristiger Anteil langfristiger Verbindlichkeiten ist unter den kurzfristigen verzinslichen Verbindlichkeiten zu bilanzieren.
  quelle: hwp-bur-2023__rz-0875-s356
  zitat: sind grundsätzlich als kurzfristige verzinsliche Verbindlichkeiten zu bilanzieren
- regel: Innert eines Jahres fällige Amortisationsraten sind kurzfristig auszuweisen.
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
- regel: Covenant-Einhaltung bei Abschlusserstellung prüfen; bei Verletzung Umgliederung in kurzfristig, ausser schriftlicher Waiver vor Abschlusserstellung.
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Bei der Abschlusserstellung muss deshalb überprüft werden, ob die Covenants eingehalten sind
- regel: Langfristige Verbindlichkeiten gegenüber Nahestehenden gesondert in Bilanz oder Anhang.
  quelle: hwp-bur-2023__rz-0490-s257
  zitat: Ein gesonderter Ausweis in der Bilanz oder im Anhang wird vom Gesetz für langfristige Verbindlichkeiten gegenüber nahestehenden Personen verlangt
- regel: Passivdarlehen mit Rangrücktritt gesondert ausweisen, Nachrangigkeit durch Bezeichnung erkennbar.
  quelle: hwp-bur-2023__rz-0494-s257
  zitat: Passivdarlehen mit Rangrücktritt sind in der Jahresrechnung oder im Anhang gesondert auszuweisen
- regel: Zinsen laufen trotz Rangrücktritt weiter und müssen dem Rangrücktritt unterliegen.
  quelle: hwp-bur-2023__rz-0714-s305
  zitat: Der Zinsendienst wird durch den Rangrücktritt nicht unterbrochen, jedoch müssen die Zinsen ebenfalls dem Rangrücktritt unterliegen
- regel: 'Anhang: Buchwert der infolge Sicherung nicht frei verfügbaren Aktiven (nicht die gesicherten Schulden) angeben.'
  quelle: hwp-bur-2023__rz-0844-s348
  zitat: Das Gesetz verlangt nicht den separaten Ausweis der Verbindlichkeiten, für die eine Sicherstellung erfolgte
- regel: Für jede langfristige Verbindlichkeit gesonderte Aufzeichnung der Eigenschaften und Bedingungen führen; schriftliche Verträge auch bei Nahestehenden.
  quelle: hwp-bur-2023__rz-0484-s256
  zitat: Es ist zweckmässig, für jede langfristige Verbindlichkeit eine gesonderte Aufzeichnung mit den relevanten Eigenschaften und Bedingungen zu führen.
- regel: 'Steuerlich: verdecktes Eigenkapital nur soweit von Anteilsinhabern/Nahestehenden stammend; Zinsen darauf werden aufgerechnet (Gewinnsteuer, Verrechnungssteuer).'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Wesentlich ist, dass nur derjenige Teil als verdeckt gilt, der direkt oder indirekt von Anteilsinhabern oder diesen nahestehenden Personen stammt.
- regel: Auf verdecktes Eigenkapital entfallende Schuldzinsen sind dem Reingewinn hinzuzurechnen.
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
fallstricke:
- text: Bankbestätigungen werden in der eingeschränkten Revision nicht selbst eingeholt (N1-301 a); vom Kunden selbst eingeholte Bestätigungen dürfen verwendet werden.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: Vom Unternehmen selbst eingeholte Drittbestätigungen sind zulässige Prüfungsnachweise, auch wenn sie nicht direkt an die Revisionsstelle gingen.
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
- text: Rangrücktritt ohne ausdrücklichen Einschluss der Zinsen genügt dem Gesetz nicht; aufgelaufene Zinsen auf RR-Darlehen mitberücksichtigen.
  quelle: hwp-er-2026__rz-0412-s123
  zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
- text: Reduktion eines Rangrücktritts ist nur unter engen Bedingungen zulässig (u.a. SA-CH-geprüfter Zwischenabschluss); bei Reduktion/Ersatz prüft die Revisionsstelle sämtliche Anforderungen
    erneut.
  quelle: hwp-er-2026__rz-0425-s126
  zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
- text: Keine Tilgung, Zinszahlung oder Verrechnung (z.B. mit einem Aktivdarlehen an denselben Aktionär) auf Forderungen unter Rangrücktritt.
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
- text: Umwandlung einer RR-Forderung in Eigenkapital (Verrechnungsliberierung) bzw. Verzicht ist zulässig und lässt den Rangrücktritt dahinfallen; danach Deckung der Überschuldung neu
    beurteilen.
  quelle: hwp-er-2026__rz-0416-s124
  zitat: Gestattet ist der Verzicht auf eine im Rang zurückgestellte Forderung oder deren Umwandlung in Eigenkapital der Gesellschaft
- text: Rangrücktritte ersetzen bei Überschuldung nicht die Pflicht zu Zwischenabschlüssen; sie erlauben nur den Verzicht auf die Benachrichtigung des Gerichts.
  quelle: hwp-er-2026__rz-0423-s125-t2
  zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
- text: Nachträgliche Sicherstellung einer Forderung unter Rangrücktritt ist abzulehnen.
  quelle: hwp-er-2026__rz-0418-s124
  zitat: Eine nachträgliche Sicherstellung der Forderung ist abzulehnen.
- text: Bank-AGB-Pfandrecht/Globalzession bei beanspruchtem Kredit ist im Anhang offenzulegen, auch wenn die Bank es nicht geltend macht.
  quelle: hwp-bur-2023__rz-0847-s349-t2
  zitat: stellt diese Verpfändung einen ausweispflichtigen Tatbestand dar
- text: Verzinsliche Aktionärsdarlehen gehören unter die langfristigen verzinslichen (nicht unter übrige) Verbindlichkeiten; Gruppenzuordnung der Konten in der Saldoliste prüfen.
  quelle: or__art-959a-t1
  zitat: langfristige verzinsliche Verbindlichkeiten
- text: Fälligkeitsaufteilung 1–5 / über 5 Jahre (Art. 961a OR) ist nur bei ordentlicher Revision Pflicht; Fehlen bei SER-Mandat nicht als Mangel erfassen.
  quelle: or__art-961
  zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind, müssen
- text: 'ESTV-Zinssätze gelten je Kalenderjahr: das Rundschreiben 2026 gilt ab 1.1.2026 und darf nicht auf das Geschäftsjahr 2025 übertragen werden; das Rundschreiben 2025 ist im Wiki
    nicht erfasst (Pendenz/Quelle beschaffen).'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: Für ESTV-Limiten sind Kredite sämtlicher Beteiligter und Nahestehender zusammenzuzählen; höhere Sätze nur mit Drittvergleich.
  quelle: estv-zinsen-2026__s002-1
  zitat: Für die Berechnung der Limiten sind die Kredite sämtlicher Beteiligten und nahestehender Personen zusammen zu zählen.
- text: Zinsplausibilisierung allein genügt für wesentliche Positionen nicht; mit Detailprüfungen (Abstimmung, Verträge) ergänzen.
  quelle: hwp-er-2026__rz-0111-s199-t1
  zitat: Gemäss SER sind wesentliche Bilanzpositionen in der Regel nicht nur mit analytischen Prüfungshandlungen zu prüfen
- text: 'Darlehen mit unbestimmter Laufzeit und kurzer Kündigungsfrist: Fristigkeit nach voraussichtlicher Fälligkeit beurteilen (Kündigungsabsicht, Rangrücktritt schliesst Rückzahlung
    aus) und Annahme dokumentieren.'
fragen_kunde:
- frage: 'Wurden im Geschäftsjahr oder bis heute Bestimmungen von Kredit-/Darlehensverträgen (Covenants/Kennzahlen, Amortisationen, Zinszahlungen, Verwendungszweck) nicht eingehalten?
    Wenn ja: welche Massnahmen, liegt ein schriftlicher Waiver vor?'
  zweck: 'N1-101: Fristigkeit, Fortführung, allfällige Korrekturen'
- frage: Welche Sicherheiten bestehen zugunsten der Darlehensgeber (Grundpfand/Schuldbriefe, Faustpfand, Zession, Bank-AGB-Pfandrecht, Garantien/Bürgschaften)? Wie hoch ist der Buchwert
    der verpfändeten/abgetretenen Aktiven per 31.12.?
  zweck: 'N1-102/N1-320: Rechte/Verpflichtungen, Anhang Art. 959c Abs. 2 Ziff. 9 OR'
- frage: Welche Amortisationen/Rückzahlungen werden innert 12 Monaten nach Bilanzstichtag fällig? Bestehen Kündigungen, Kündigungsabsichten oder auslaufende Festkredite (Verlängerung
    beabsichtigt)?
  zweck: 'N1-103/N1-402: Gliederung kurz-/langfristig'
- frage: Bestehen Darlehen von Aktionären, VR-/GL-Mitgliedern, diesen nahestehenden Personen oder Gesellschaften, an denen eine Beteiligung besteht? Zu welchen Konditionen (Zins, Laufzeit,
    Sicherheiten) und wie wurde der Zins festgelegt?
  zweck: 'N1-104/N1-304: Vollständigkeit, Ausweis Art. 959a Abs. 4 OR, Drittvergleich'
- frage: Welche Rangrücktritte bestehen (Gläubiger, Betrag inkl. Zinsen)? Wurden sie im Jahr oder danach geändert, reduziert, ersetzt oder aufgehoben? Wurden darauf Zinsen/Rückzahlungen
    bezahlt oder Verrechnungen vorgenommen? Welche Bonitätsnachweise der Gläubiger liegen vor?
  zweck: 'N1-105/N1-401: Gültigkeit und Höhe der Rangrücktritte, Bonität (WP-Beurteilung)'
- frage: Was ist der Hintergrund der Zu- und Abgänge auf den Darlehenskonten (Neuaufnahmen, Rückzahlungen, Umbuchungen, Verrechnungsliberierung)? Liegen die entsprechenden Verträge und
    Beschlüsse vor?
  zweck: 'N1-403: Eintritt, Rechte/Verpflichtungen'
- frage: Sind nach dem Bilanzstichtag wesentliche Ereignisse eingetreten (Kündigung, Neuverhandlung, Rückzahlung, neue Sicherheiten, Änderung von Rangrücktritten)?
  zweck: 'N1-320: Anhang Art. 959c Abs. 2 Ziff. 13 OR, Fristigkeit'
