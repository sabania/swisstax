# Prüffeld G2 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: G2
bezeichnung: Immobile Sachanlagen
status: extrahiert
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: false
kurzbeschrieb: 'Grundstücke und Bauten im Eigentum (inkl. Baurecht, angefangene Bauten). Agent: 101–106 schriftlich auswerten, 201/202, 301/302, 320–322. WP-Schritte 303–306 und 4xx
  (z.B. Grundbuch, Gutachten) nur mit Anweisung des WP. Keine Liegenschaften: je Schritt «Vorschlag: nicht anwendbar» (Entscheid WP).'
gesetz:
- thema: Sachanlagen als Mindestposition des Anlagevermögens (Art. 959a Abs. 1 Ziff. 2 lit. c OR)
  quelle: or__art-959a-t1
  zitat: c. Sachanlagen
- thema: Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR)
  quelle: or__art-959
  zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist
- thema: Begriff Anlagevermögen (Art. 960d Abs. 1 OR)
  quelle: or__art-960d
  zitat: Als Anlagevermögen gelten Werte, die in der Absicht langfristiger Nutzung oder langfristigen Haltens erworben werden.
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Überprüfung bei Anzeichen von Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Ersterfassung höchstens zu Anschaffungs-/Herstellungskosten (Art. 960a Abs. 1 OR)
  quelle: or__art-960a
  zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- thema: 'Folgebewertung: Höchstwert AK/HK (Art. 960a Abs. 2 OR)'
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Abschreibungen und Wertberichtigungen (Art. 960a Abs. 3 OR)
  quelle: or__art-960a
  zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen, anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden.
- thema: Abschreibungen nicht unter den Passiven (Art. 960a Abs. 3 OR)
  quelle: or__art-960a
  zitat: dürfen nicht unter den Passiven ausgewiesen werden
- thema: Zusätzliche Abschreibungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Rückstellungen für Sanierungen von Sachanlagen (Art. 960e Abs. 3 Ziff. 2 OR)
  quelle: or__art-960e
  zitat: Sanierungen von Sachanlagen
- thema: Stetigkeit (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Bestandesnachweis durch Inventar (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Belegnachweis (Art. 957a Abs. 2 Ziff. 2 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erfolgsrechnung: Abschreibungen auf Anlagevermögen (Art. 959b Abs. 2 Ziff. 6 OR)'
  quelle: or__art-959b-t1
  zitat: Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens
- thema: 'Erfolgsrechnung: betriebsfremder Erfolg, z.B. Liegenschaftserfolg (Art. 959b Abs. 2 Ziff. 8 OR)'
  quelle: or__art-959b-t1
  zitat: betriebsfremder Aufwand und betriebsfremder Ertrag
- thema: 'Anhang: angewandte Grundsätze (Art. 959c Abs. 1 Ziff. 1 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: Leasingverpflichtungen (Art. 959c Abs. 2 Ziff. 6 OR)'
  quelle: or__art-959c-t2
  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen
- thema: 'Anhang: Sicherheiten für Verbindlichkeiten Dritter (Art. 959c Abs. 2 Ziff. 8 OR)'
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: 'Anhang: verpfändete Aktiven / Eigentumsvorbehalt (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: ausserordentliche/einmalige Positionen, z.B. Liegenschaftsverkauf (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: Aufwertung von Grundstücken bei Kapitalverlust/Überschuldung (Art. 725c Abs. 1 OR)
  quelle: or__art-725c
  zitat: dürfen Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs- oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden
- thema: Aufwertung nur mit schriftlicher Bestätigung der Revisionsstelle (Art. 725c Abs. 2 OR)
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten
    sind.
- thema: Prüfungsumfang der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: 'Bestand/Eigentum: Liegenschaft bilanziert, obwohl nicht (mehr) im Eigentum, oder Kauf/Verkauf vor dem Grundbucheintrag definitiv gebucht.'
  pruefziele:
  - EX
  - RV
  - PA
  quelle: hwp-bur-2023__rz-0351-s232
  zitat: Der Eigentumsübergang erfolgt erst im Zeitpunkt der Eintragung.
- text: 'Überbewertung: Liegenschaft bringt die Vollkosten inkl. Abschreibungen nicht nachhaltig ein oder ist schlecht unterhalten, ohne ausserplanmässige Abschreibung/Wertberichtigung.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0363-s235
  zitat: Ebenso kann schlechter Unterhalt zusätzliche Abschreibungen bzw. Wertberichtigungen notwendig machen.
- text: Planmässige Gebäudeabschreibungen unterlassen mit Hinweis auf höheren Verkehrswert.
  pruefziele:
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0362-s235
  zitat: Sie sind auch dann vorzunehmen, wenn der Verkehrswert der Liegenschaft den Restbuchwert übersteigt.
- text: 'Falsche Abgrenzung Unterhalt/Investition: reiner Unterhalt aktiviert (Überbewertung) bzw. wertvermehrende Investition im Aufwand (stille Reserve, nicht im Nachweis).'
  pruefziele:
  - EX
  - VO
  - BE
  quelle: hwp-bur-2023__rz-0364-s235
  zitat: Kosten, die ausschliesslich dem Unterhalt dienen, sind der Erfolgsrechnung zu belasten.
- text: Unzulässige Aufwertung über Anschaffungskosten gestützt auf eine Immobilienschätzung (ausserhalb Art. 725c OR).
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0366-s235
  zitat: erfüllt eine unabhängige Immobilienschätzung das Kriterium des beobachtbaren Marktpreises im Sinne von Art. 960b Abs. 1 OR nicht
- text: 'Abgänge: Restbuchwert nicht ausgebucht, Buchgewinn direkt mit bestehenden Anlagen verrechnet oder nicht in der Erfolgsrechnung erfasst.'
  pruefziele:
  - EX
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Eine direkte Verrechnung von realisierten Buchgewinnen mit bestehenden Sachanlagen
- text: Verletzung der Stetigkeit durch willkürlich wechselnde Abschreibungssätze ohne Berücksichtigung bei den stillen Reserven.
  pruefziele:
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0061-s070
  zitat: Die Anwendung willkürlicher, jährlich unterschiedlicher Abschreibungssätze, die sich nicht durch den Ermessensspielraum des Vorsichtsprinzips rechtfertigen lassen
- text: Unterlassene oder rückgängig gemachte Abschreibungen = Auflösung stiller Reserven, die im Anhang nicht offengelegt wird.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0341-s230
  zitat: Der Auflösungsbetrag hat in die Berechnung des Gesamtbetrags der Reserveveränderung einzufliessen
- text: Grundpfandbelastungen, Verpfändungen oder Sicherheiten für Dritte im Anhang unvollständig oder nicht zu Buchwerten offengelegt.
  pruefziele:
  - RV
  - DO
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- text: 'Angefangene Bauten: Gesamtkosten übersteigen Fortführungswert; Bauhandwerkerpfandrecht bei Zahlungen an Generalunternehmer.'
  pruefziele:
  - BE
  - RV
  quelle: hwp-bur-2023__rz-0359-s234
  zitat: Risiko des Bauhandwerkerpfandrechts
- text: 'Periodenabgrenzung: Bau-/Unterhaltsrechnungen mit Leistung im Geschäftsjahr erst in neuer Rechnung erfasst.'
  pruefziele:
  - VO
  - PA
  quelle: ser-2022__anh-d-s082-2
  zitat: Durchsicht der Bestands- sowie Unterhaltskonten in neuer Rechnung auf auffällige Beträge, die das Vorjahr betreffen
- text: 'Mieterträge unvollständig erfasst; Mieterträge ohne direkten Zusammenhang mit dem Hauptzweck (z.B. Wohnliegenschaft eines Produktionsbetriebs) nicht separat als betriebsfremder
    Ertrag ausgewiesen (gehört die Vermietung zum Hauptzweck, z.B. Immobiliengesellschaft: kein betriebsfremder Ertrag).'
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0750-s317-t2
  zitat: Nebenerlöse, welche nicht direkt mit dem primären Unternehmenszweck in Zusammenhang stehen, sind separat unter dem betriebsfremden Ertrag auszuweisen (beispielsweise Mieterträge
    aus Wohnliegenschaften in einem Produktionsunternehmen)
unterlagen:
- dokument: Anlagespiegel/Anlagenverzeichnis Liegenschaften (je Objekt AK/HK, kum. Abschreibungen, Zu-/Abgänge, Nutzungsdauer, Land/Gebäude getrennt)
  zweck: Abstimmung mit Jahresrechnung, Nachrechnen der Abschreibungen (G2-301/302/407)
  quelle: ser-2022__anh-d-s082-2
  zitat: Abstimmung der Inventarliste mit Angabe der Anschaffungs- bzw. Herstellungskosten und der kumulierten Abschreibungen
- dokument: Aktuelle Grundbuchauszüge je Liegenschaft (Eigentum, Grundpfandrechte, Dienstbarkeiten, Anmerkungen)
  zweck: Bestandes- und Eigentumsnachweis, Grundpfandbelastung (G2-106/401/405/406)
  quelle: hwp-bur-2023__rz-0355-s233
  zitat: Für die Bestandsermittlung ist die periodische Abstimmung mit dem Grundbuch erforderlich.
- dokument: Kauf-/Verkaufsverträge (öffentlich beurkundet), Abrechnungen Notariat/Grundbuchamt, Maklerrechnungen
  zweck: Zu-/Abgänge, aktivierbare Nebenkosten, Datum Eigentumsübergang (G2-104/305/403)
  quelle: hwp-bur-2023__rz-0356-s233-t1
  zitat: Dazu gehören unter anderem die von den Kaufenden bezahlten Vermittlungsprovisionen und Handänderungsgebühren.
- dokument: Bauabrechnungen, Werkverträge, Handwerker- und Unterhaltsrechnungen
  zweck: Belegprüfung Zugänge, Abgrenzung Unterhalt/Wertvermehrung (G2-103/305/403/409)
  quelle: ser-2022__anh-d-s083-1
  zitat: Durchsicht von Einkaufsfakturen, Leasing- und anderen Verträgen sowie weiteren Dokumenten im Zusammenhang mit Anschaffung bzw. Veräusserung von Sachanlagen
- dokument: Hypothekar-/Kreditverträge, Zins- und Amortisationsabrechnungen per 31.12., Verzeichnis der Schuldbriefe (inkl. Eigentümerschuldbriefe)
  zweck: Vergleich Grundpfand mit Hypothekarschulden, Anhang verpfändete Aktiven (G2-401/320)
  quelle: hwp-bur-2023__rz-0461-s252
  zitat: Der Bestand auf den Bilanzstichtag wird anhand der Kreditakten und der jährlichen Amortisations- und Zinsabrechnungen nachgewiesen.
- dokument: Baurechtsvertrag (bei Gebäuden auf fremdem Boden)
  zweck: Abschreibungsgrundlage und -dauer (G2-407)
  quelle: hwp-bur-2023__rz-0365-s235
  zitat: Für Gebäude, die auf fremdem Boden erstellt wurden, ist die Abschreibungsgrundlage aufgrund der Baurechtsvereinbarung zu ermitteln.
- dokument: Abschreibungsplan / Rechnungslegungsgrundsätze Liegenschaften (Nutzungsdauer, Methode, Sätze)
  zweck: Stetigkeit und Angemessenheit der Abschreibungen (G2-101/102/407)
  quelle: hwp-bur-2023__rz-0336-s230
  zitat: Die dem Abschreibungsplan eines Anlageguts zugrunde liegende Nutzungsdauer ist deshalb periodisch sowie bei konkreten Anzeichen auf Wertverminderung zu überprüfen
- dokument: Detailnachweis stille Reserven (betriebswirtschaftliche Werte je Liegenschaft, Bestand und Veränderung)
  zweck: Aufstellung stille Reserven, Nettoauflösung (G2-321/410)
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: Mieterspiegel, Mietverträge, Leerstandsliste
  zweck: Vollständigkeit Mieterträge, Rentabilität (G2-404/411)
  quelle: katalog-revio4__c003-29
  zitat: Vollständigkeit der Erträge (Mieten etc.)
  weitere_fundstellen:
  - quelle: katalog-revio4__c003-28
    zitat: Beurteilung der Bewertung anhand der Rentabilität
- dokument: Gebäudeversicherungspolice/-nachweis (Versicherungswert)
  zweck: Existenzhinweis, Plausibilisierung Wert (G2-406)
  quelle: katalog-revio4__c003-28
  zitat: Bestandesnachweis durch Grundbuchauszüge, Versicherungsnachweise etc.
- dokument: Bereits vorhandene Schätzungen/Gutachten des Kunden (z.B. Bank- oder Steuerschätzung) – nur sofern vorhanden, keine Einholung durch die Revision
  zweck: Indikator für Werthaltigkeit (G2-105/402/408)
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Die eingeschränkte Revision beschränkt sich auf die im Unternehmen intern vorhandenen Unterlagen.
  weitere_fundstellen:
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: das Einholen von Bestätigungen von Dritten (Bank-, Debitoren- oder Kreditorenbestätigungen, Anwaltsbestätigungen, Experten- und Bewertungsgutachten
- dokument: VR- und GV-Protokolle (Investitions-, Kauf- und Verkaufsentscheide)
  zweck: Vollständigkeit Zu-/Abgänge, Ereignisse (G2-104)
  quelle: ser-2022__anh-d-s073-1
  zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen
- dokument: Kontoblätter Liegenschafts-, Unterhalts- und Liegenschaftsertragskonten Berichtsjahr sowie Folgejahr (neue Rechnung)
  zweck: Durchsicht ungewöhnlicher Posten und Vorjahresbeträge (G2-303/304/409)
  quelle: ser-2022__anh-d-s082-2
  zitat: Durchsicht der Bestands- sowie der Abschreibungskonten im Hauptbuch auf ungewöhnliche Posten; Belegprüfung solcher Posten
- dokument: Unterzeichnete Vollständigkeitserklärung (Verfügungsberechtigung, Belastungen, stille Reserven)
  zweck: Schriftliche Bestätigung Eigentum/Belastungen (G2-106/321)
  quelle: ser-2022__anh-e-s104-1
  zitat: ist nachweislich Verfügungsberechtigte aller aktivierten Vermögenswerte
bewertung:
- regel: 'Folgebewertung: AK/HK abzüglich notwendiger Abschreibungen und Wertberichtigungen.'
  quelle: hwp-bur-2023__rz-0360-s234
  zitat: Bei der Folgebewertung hat die Bilanzierung zu Anschaffungs- oder Herstellungskosten, vermindert um die notwendigen Abschreibungen sowie allfällige Wertberichtigungen, zu erfolgen.
- regel: Gebäude nach Nutzungsdauer abschreiben; Restwert nicht unbesehen übernehmen, sondern auf erzielbaren Wert prüfen.
  quelle: hwp-bur-2023__rz-0362-s235
  zitat: Der nach Vornahme der Abschreibungen verbleibende Restwert von Liegenschaften kann nicht unbesehen in die Bilanz übernommen werden, sondern ist zu überprüfen.
- regel: 'Unbebautes Land: in der Regel keine planmässige Abschreibung; Wertberichtigung bei dauernder Werteinbusse (z.B. Umzonung).'
  quelle: hwp-bur-2023__rz-0361-s235
  zitat: Unbebaute Grundstücke unterliegen im Allgemeinen keinem nutzungsbedingten Wertverzehr, weshalb Abschreibungen normalerweise nicht erforderlich sind.
- regel: Aufwertung über AK nur bei aktivem Markt (bei Immobilien sehr selten) oder nach Art. 725c OR; eine Immobilienschätzung genügt nicht.
  quelle: hwp-bur-2023__rz-0367-s236
  zitat: wonach eine Aufwertung über den Anschaffungswert zwecks Bilanzsanierung unter bestimmten Voraussetzungen zulässig ist (Art. 725c OR
- regel: Ersterfassung zu AK/HK inkl. aller unmittelbar verbundenen Kosten (z.B. Handänderungsgebühren, Vermittlungsprovisionen); Rückvergütungen abziehen.
  quelle: hwp-bur-2023__rz-0356-s233-t1
  zitat: Alle mit dem Kauf oder der Erstellung eines Objekts unmittelbar verbundenen Kosten gelten als Anschaffungs- oder Herstellungskosten.
- regel: Rückvergütungen/Preisminderungen reduzieren die Anschaffungskosten.
  quelle: hwp-bur-2023__rz-0358-s234
  zitat: Von den Anschaffungskosten in Abzug zu bringen sind Rückvergütungen aller Art
- regel: 'Bauzinsen: direkt zuordenbare Fremdkapitalzinsen während Bauzeit aktivierbar; keine Zinsaktivierung auf Landreserven.'
  quelle: hwp-bur-2023__rz-0357-s234
  zitat: Eine Zinsaktivierung auf Landreserven ist nicht statthaft.
- regel: Angefangene Bauten zu den bis zum Stichtag aufgelaufenen Baukosten; Wertberichtigung, wenn Gesamtkosten den Fortführungswert übersteigen.
  quelle: hwp-bur-2023__rz-0359-s234
  zitat: Die Bilanzierung angefangener Bauten hat grundsätzlich zu den bis zum Bilanzstichtag aufgelaufenen Baukosten zu erfolgen.
- regel: Einzelbewertung je Grundstück/Baute; Zusammenfassung nur in sachlich begründeten Fällen.
  quelle: hwp-bur-2023__rz-0360-s234
  zitat: Grundstücke und Bauten sind in der Regel einzeln zu bewerten (Art. 960 Abs. 1 OR).
- regel: 'Impairment-Test: Buchwert vs. erzielbarer Wert (höherer von Nutzwert und Netto-Marktwert).'
  quelle: hwp-bur-2023__rz-0342-s231
  zitat: Der erzielbare Wert ist der höhere von Nutzwert und Netto-Marktwert.
- regel: 'Impairment-Indikator Liegenschaft: Vollkosten inkl. planmässiger Abschreibungen werden nicht nachhaltig eingebracht.'
  quelle: hwp-bur-2023__rz-0363-s235
  zitat: die Vollkosten der in dieser Liegenschaft hergestellten bzw. erbrachten Güter und Dienstleistungen einschliesslich der planmässigen Abschreibungen nicht nachhaltig einbringen
    kann
- regel: Aktivierung von Erneuerungen/Umbauten nur bei Wertvermehrung oder zusätzlicher Nutzung; Projekt als Ganzes beurteilen.
  quelle: hwp-bur-2023__rz-0364-s235
  zitat: Hingegen ist die Aktivierung von Kosten für Erneuerungen, Verbesserungen und Umbauten gerechtfertigt, sofern damit eine Wertvermehrung oder eine zusätzliche Nutzungsmöglichkeit
    geschaffen wird.
- regel: Wahlrecht der Abschreibungsmethode (linear/degressiv/leistungsabhängig; direkt/indirekt), stetig anzuwenden.
  quelle: hwp-bur-2023__rz-0337-s230
  zitat: Die gewählte Methode ist stetig anzuwenden.
- regel: Indirekte Abschreibung (separates Wertberichtigungskonto) ist vorzuziehen; Anlagespiegel zweckmässig.
  quelle: hwp-bur-2023__rz-0333-s229
  zitat: Der indirekten Abschreibungsmethode ist gegenüber der direkten Methode der Vorzug zu geben.
- regel: 'Kauf/Verkauf von Grundeigentum: Erfassung grundsätzlich erst mit Grundbucheintrag; vorherige Erfassung nur ausnahmsweise (Vertrag vor Stichtag, Eintrag vor Abschlusserstellung).'
  quelle: hwp-bur-2023__rz-0351-s232
  zitat: Eine vorherige definitive buchhalterische Berücksichtigung von Erwerb und Verkauf von Grundeigentum ist nur ausnahmsweise zulässig
- regel: Buchgewinne/-verluste aus Abgängen in der Erfolgsrechnung erfassen.
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- regel: Über den nötigen Wertverlust hinausgehende Abschreibungen bilden stille Reserven; deren Auflösung kann offenlegungspflichtig sein.
  quelle: hwp-bur-2023__rz-0329-s228-t2
  zitat: Falls jedoch auf dem Anlagegegenstand mehr abgeschrieben worden war, als gemäss nutzungs- und altersbedingtem Wertverlust erforderlich gewesen wäre, wurden stille Reserven gebildet
- regel: 'Hypothekarschulden: tatsächlicher Schuldbetrag (nicht Grundbuchbelastung), Nennwert; Eigentümerschuldbriefe nicht bilanzieren.'
  quelle: hwp-bur-2023__rz-0460-s252
  zitat: In der Buchhaltung ist nicht die Gesamtbelastung gemäss Grundbuch, sondern der tatsächliche Schuldbetrag zu führen.
- regel: Anhangangabe verpfändeter Liegenschaften zu Buchwerten.
  quelle: hwp-bur-2023__rz-0846-s349
  zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen Ansätzen wie in der Bilanz, also zu Buchwerten.
- regel: 'Steuerliche Normalsätze ESTV-Merkblatt A 1995 (Steuerpraxis, kein handelsrechtlicher Massstab): Prozent vom Buchwert, vom Anschaffungswert die Hälfte; Sätze je Gebäudeart mit
    `wert abschreibung gebäude` (Original geprüft). Wohnhaus-Satz nur für Wohnhäuser von Immobiliengesellschaften und Personalwohnhäuser; gemischte Nutzung anteilig.'
  quelle: estv-mb-a-1995__s001-5
  zitat: Für Abschreibungen auf dem Anschaffungswert sind die genannten Sätze um die Hälfte zu reduzieren.
- regel: 'Höherer Satz «Gebäude allein» nur, wenn das Gebäude separat aktiviert ist; Gebäude und Land in einer Bilanzposition: tieferer Satz und Abschreibung nur bis auf den Landwert;
    auf Land grundsätzlich keine Abschreibung.'
  quelle: estv-mb-a-1995__s001-5
  zitat: Der höhere Abschreibungssatz für Gebäude allein kann nur angewendet werden, wenn der restliche Buchwert bzw. die Gestehungskosten der Gebäude separat aktiviert sind.
fallstricke:
- text: 'Bewertungsgutachten sind nicht Bestandteil der eingeschränkten Revision: keine Einholung bzw. Beauftragung; nur vorhandene Unterlagen des Kunden auswerten.'
  quelle: hwp-er-2026__rz-0134-s203
  zitat: Experten- und Bewertungsgutachten
- text: Nicht durchgeführte Handlungen gemäss Anhang D (nicht Bestandteil) müssen nicht begründet werden; der Agent schlägt sie nicht von sich aus vor.
  quelle: ser-2022__6-2-6
  zitat: Der Abschlussprüfer muss deshalb nicht begründen, weshalb er diese Prüfungshandlungen nicht durchführt.
- text: Physische Bestandesaufnahme/Besichtigung ist eine weitergehende Handlung; der Agent führt nie physische Tätigkeiten aus, nur Vorlage/Pendenz für den WP.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: physische Tätigkeiten nie
- text: 'Befragungen kann der Agent nicht selbst führen: schriftliche Antworten auswerten, sonst Frage als Pendenz; Schritt höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: Schlechter Geschäftsgang rechtfertigt keine Reduktion der Abschreibungen; im Gegenteil Werthaltigkeit kritisch prüfen.
  quelle: hwp-bur-2023__rz-0340-s230
  zitat: Insbesondere kann nicht ein schlechter Geschäftsgang unbesehen zum Anlass genommen werden, Abschreibungen zu reduzieren.
- text: Grundbuchbelastung (Schuldbriefe) ist nicht gleich Hypothekarschuld; Eigentümerschuldbriefe werden nicht bilanziert, sind aber bei Verpfändung im Anhang zu berücksichtigen.
  quelle: hwp-bur-2023__rz-0460-s252
  zitat: Eigentümerschuldbriefe sind nicht zu bilanzieren, denn es handelt sich dabei um eine Forderung gegen sich selbst.
- text: Im Grundbuch als Zugehör angemerkte Maschinen/Betriebseinrichtungen gehören nicht zu den Grundstücken (Abgrenzung zu G1 mobile Sachanlagen).
  quelle: hwp-bur-2023__rz-0353-s233
  zitat: Nicht zu den Grundstücken im juristischen Sinne zählen Maschinen und Betriebseinrichtungen, selbst wenn sie im Grundbuch als Zugehör angemerkt sind
- text: 'Land und Gebäude getrennt führen: steuerliche Sätze unterscheiden sich je nach Bilanzierungsart (ESTV MB A: tieferer Satz, wenn Gebäude und Land in einer einzigen Bilanzposition
    erscheinen ^[estv-mb-a-1995__s001-5]).'
  quelle: hwp-bur-2023__rz-0354-s233
  zitat: da für die beiden Bilanzierungsarten die steuerlich zulässigen Abschreibungssätze unterschiedlich sind
- text: Ein getrennter Ausweis mobiler/immobiler Sachanlagen ist nicht vorgeschrieben; ein fehlender Ausweis ist daher kein Gliederungsfehler.
  quelle: hwp-bur-2023__rz-0223-s109
  zitat: Der Gesetzgeber verlangt jedoch keinen getrennten Ausweis dieser Positionen.
- text: Aufwertung nach Art. 725c OR ist eine besondere Prüfung mit schriftlicher Bestätigung; Entscheid und Bestätigung nur durch den WP.
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt
- text: Stille Reserven = Differenz Buchwert zu gesetzlichem Höchstwert, nicht zum Verkehrswert; Wertsteigerungen von Grundstücken über AK/HK sind Zwangsreserven und fallen nicht unter
    die Offenlegung der Nettoauflösung ^[hwp-bur-2023__rz-0817-s341-t2].
  quelle: hwp-bur-2023__rz-0654-s294
  zitat: Solche Zwangsreserven entstehen z.B. durch die Wertzunahme von Grundstücken.
- text: 'Keine Konten für Grundstücke/Bauten (Saldoliste, Anlagespiegel): je Schritt Status «nicht bearbeitet», Begründung «Vorschlag: nicht anwendbar (keine immobilen Sachanlagen)»,
    Entscheid WP. Hinweise weitergeben: langfristiger Mietvertrag → Anhang (T1-103) ^[hwp-bur-2023__rz-0835-s346], Mietkaution → H1-103, Untermiete 7500 → SCH5.'
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet)
fragen_kunde:
- frage: Nach welchen Grundsätzen werden die Liegenschaften bewertet (AK/HK, Land und Gebäude getrennt), welche Nutzungsdauern, Abschreibungssätze und -methoden gelten, und wurde gegenüber
    dem Vorjahr etwas geändert (mit Begründung)?
  zweck: 'G2-101/102: Bewertungsgrundlagen und Stetigkeit'
- frage: Wie wird Unterhalt von wertvermehrenden Investitionen abgegrenzt (Aktivierungsgrenze, Projektbetrachtung) und welche grösseren Renovationen/Umbauten fanden im Berichtsjahr statt,
    wie wurden sie verbucht?
  zweck: 'G2-103/403/409: Aktivierungsfähigkeit, stille Reserven'
- frage: Wurden im Berichtsjahr oder nach dem Bilanzstichtag Liegenschaften gekauft oder verkauft? Bitte Verträge, Datum des Grundbucheintrags und Abrechnung des Verkaufserfolgs einreichen.
  zweck: 'G2-104: Bestand, Periodenabgrenzung, Erfassung Gewinne/Verluste'
- frage: 'Bestehen Anzeichen einer dauerhaften Wertminderung (Leerstand, Umzonung, Schäden, Altlasten, Nutzungsänderung, ungenügende Erträge)? Falls ja: Wie wurde die Werthaltigkeit
    beurteilt?'
  zweck: 'G2-105/404/408: Bewertung'
- frage: Welche Grundpfandrechte/Schuldbriefe lasten auf den Liegenschaften, wofür sind sie verpfändet (auch für Dritte), und bestehen Kaufs-, Vorkaufs-, Bau- oder Bauhandwerkerpfandrechte?
  zweck: 'G2-106/401/320: Rechte und Verpflichtungen, Anhang'
- frage: Sind alle Mieterträge (inkl. Parkplätze, Untermiete, Mieten von Nahestehenden) erfasst, welche Leerstände und Mietzinsreduktionen bestanden im Berichtsjahr?
  zweck: 'G2-411: Vollständigkeit der Erträge'
- frage: Liegen Schätzungen oder Gutachten zu den Liegenschaften vor (Bank, Steuer, Versicherung)? Bitte Kopie einreichen.
  zweck: 'G2-402/408: Hinweise zur Werthaltigkeit (keine Einholung durch die Revision)'
- frage: Wie werden die stillen Reserven auf Liegenschaften berechnet (Methode wie Vorjahr?) und wie haben sie sich im Berichtsjahr verändert?
  zweck: 'G2-321/410: stille Reserven, Anhang'
- frage: Bestehen Verpflichtungen für Sanierungen, Altlasten oder Rückbau (z.B. aus Baurecht)?
  zweck: 'G2-105/407: Rückstellungen, Bewertung'
