schritte:
- id: G2-101
  vorgehen: 'Schriftliche Kundenantwort bzw. Fragebogen zu Bewertungsbasis (AK/HK), Trennung Land/Gebäude, Nutzungsdauer und Abschreibungsmethode auswerten und mit Anlagespiegel, Anhang
    (angewandte Grundsätze) und Vorjahresakte abgleichen. Fehlt die Antwort: Frage als Pendenz erfassen; Schritt höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Kundenantwort/Fragebogen
  - Anlagespiegel Liegenschaften
  - Anhang (Bewertungsgrundsätze)
  - Vorjahres-Arbeitspapier
  rechnen: Abschreibungssatz je Objekt = Abschreibung Berichtsjahr / Abschreibungsbasis (AK bzw. Buchwert 01.01.); Vergleich mit Vorjahressatz
  feststellung_wenn: Antwort widerspricht Buchhaltung/Anhang, Bewertung über AK/HK, Land planmässig abgeschrieben oder Methode/Satz ohne Begründung geändert.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung über Grundlagen der Bewertung der Anlagen (z. B. von Maschinenpark, Immobilien
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Der Abschlussprüfer würdigt die erhaltenen Auskünfte in jedem Fall kritisch.
  - quelle: or__art-960a
    zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- id: G2-102
  vorgehen: 'Abschreibungssätze und -methoden des Berichtsjahres je Objekt mit dem Vorjahr (Vorjahresakte, Anlagespiegel Vorjahr) vergleichen und die schriftliche Kundenantwort zur Stetigkeit
    auswerten. Bei Änderungen dokumentieren, ob Schätzungsänderung (Nutzungsdauer) oder Methodenwechsel; Effekt an G2-321 (stille Reserven) übergeben. Fehlende Antwort: Pendenz.'
  nachweise:
  - Anlagespiegel Berichtsjahr und Vorjahr
  - Schriftliche Kundenantwort
  - Vorjahresakte
  rechnen: Satz Berichtsjahr – Satz Vorjahr je Objekt; Abschreibung Berichtsjahr zum Vorjahressatz als Vergleichswert; Differenz = Effekt der Änderung
  feststellung_wenn: Satz oder Methode ohne sachliche Begründung geändert, Abschreibung unterlassen oder Änderung nicht bei stillen Reserven/Anhang berücksichtigt.
  fundstellen:
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
  - quelle: hwp-bur-2023__rz-0061-s070
    zitat: Die Anwendung willkürlicher, jährlich unterschiedlicher Abschreibungssätze, die sich nicht durch den Ermessensspielraum des Vorsichtsprinzips rechtfertigen lassen
  - quelle: hwp-bur-2023__rz-0337-s230
    zitat: Die gewählte Methode ist stetig anzuwenden.
- id: G2-103
  vorgehen: 'Schriftliche Kundenantwort zur Abgrenzungspraxis (Aktivierungsgrenze, Projektbetrachtung) auswerten und mit den Buchungen des Berichtsjahres vergleichen: Zugänge auf Liegenschaftskonten
    und grosse Posten in Unterhalts-/Reparaturkonten nach Beleginhalt (Reparatur, Erneuerung, Umbau) klassieren. Fehlende Antwort: Pendenz.'
  nachweise:
  - Schriftliche Kundenantwort
  - Kontoblätter Liegenschaften und Unterhalt
  - Bau- und Handwerkerrechnungen
  rechnen: Unterhaltsaufwand Berichtsjahr vs. Vorjahr; Anteil aktivierter Zugänge an den gesamten Liegenschaftsausgaben
  feststellung_wenn: Reiner Unterhalt aktiviert (Überbewertung) oder wesentliche wertvermehrende Investition ohne Begründung im Aufwand (stille Reserve, an G2-321/409).
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung, wie Unterhaltsaufwendungen von Investitionen (Wertvermehrung) unterschieden werden
  - quelle: hwp-bur-2023__rz-0364-s235
    zitat: Kosten, die ausschliesslich dem Unterhalt dienen, sind der Erfolgsrechnung zu belasten.
- id: G2-104
  vorgehen: 'Kundenantwort zu Käufen/Verkäufen im Berichtsjahr und nach Stichtag mit Anlagespiegel (Zu-/Abgänge), Kontoblättern und VR-Protokollen abgleichen. Je Transaktion Vertrag,
    Datum Grundbucheintrag, Ausbuchung (AK und kum. Abschreibungen) und Ausweis des Buchgewinns/-verlusts in der ER prüfen. Fehlende Unterlagen: Pendenz.'
  nachweise:
  - Kauf-/Verkaufsverträge
  - Grundbuchauszug/-anmeldung
  - Abrechnung Notariat
  - Anlagespiegel
  - VR-Protokolle
  rechnen: Verkaufserlös – Restbuchwert (AK – kum. Abschreibungen) = Buchgewinn/-verlust; Abgleich mit gebuchtem Ergebnis
  feststellung_wenn: Abgang ohne Grundbucheintrag bis Abschlusserstellung gebucht, Restbuchwert nicht ausgebucht, Buchgewinn mit Anlagen verrechnet oder falsch ausgewiesen.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung über Anschaffung und Verkäufe von Anlagen und über die Erfassung realisierter Gewinne und Verluste aus Abgängen
  - quelle: hwp-bur-2023__rz-0351-s232
    zitat: Der Eigentumsübergang erfolgt erst im Zeitpunkt der Eintragung.
  - quelle: hwp-bur-2023__rz-0329-s228-t1
    zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- id: G2-105
  vorgehen: Schriftliche Kundenantwort zu Wertminderungsanzeichen (Leerstand, Umzonung, Schäden, Altlasten, sinkende Erträge, Nutzung nicht kostendeckend) auswerten und mit Liegenschaftserfolg,
    Protokollen und Erkenntnissen anderer Prüffelder plausibilisieren. Bei Anzeichen Werthaltigkeitsbeurteilung des Kunden als Pendenz anfordern.
  nachweise:
  - Schriftliche Kundenantwort
  - Liegenschaftsrechnung/Mieterspiegel
  - VR-Protokolle
  - vorhandene Schätzungen
  rechnen: Buchwert 31.12. – erzielbarer Wert (höherer von Nutzwert und Netto-Marktwert gemäss Kundennachweis) = möglicher Wertberichtigungsbedarf
  feststellung_wenn: Anzeichen für Wertbeeinträchtigung ohne Werthaltigkeitsbeurteilung oder Buchwert über erzielbarem Wert ohne Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung, ob Sachanlagen oder immaterielle Werte eine wesentliche, dauerhafte Wertbeeinträchtigung aufweisen
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: hwp-bur-2023__rz-0342-s231
    zitat: Der erzielbare Wert ist der höhere von Nutzwert und Netto-Marktwert.
- id: G2-106
  vorgehen: 'Schriftliche Kundenantwort zu Grundpfandrechten, Schuldbriefen, Kaufs-/Vorkaufsrechten, Baurechten und Bauhandwerkerpfandrechten auswerten; mit Grundbuchauszug, Kreditverträgen,
    Bankbestätigung (Sicherheiten) und Anhang abgleichen; Vollständigkeitserklärung (Belastungen) prüfen. Fehlende Antwort/Unterlage: Pendenz.'
  nachweise:
  - Schriftliche Kundenantwort
  - Grundbuchauszug
  - Hypothekar-/Kreditverträge
  - Anhang
  - Vollständigkeitserklärung
  rechnen: Buchwert belasteter Liegenschaften = Anhangbetrag verpfändete Aktiven (Anteil Liegenschaften)
  feststellung_wenn: Belastung oder Verpfändung gemäss Grundbuch/Kreditvertrag nicht oder nicht zu Buchwerten im Anhang offengelegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung, ob Sachanlagen irgendwelchen Eigentumsbeschränkungen unterliegen
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: ser-2022__anh-e-s104-1
    zitat: ist nachweislich Verfügungsberechtigte aller aktivierten Vermögenswerte
- id: G2-201
  vorgehen: Aus Saldoliste und Anlagespiegel Bestände (AK, kum. Abschreibungen, Buchwert), Zugänge, Abgänge, Abschreibungsaufwand und -sätze je Liegenschaftskonto Berichtsjahr vs. Vorjahr
    tabellieren. Abweichungen über der Toleranz (Wesentlichkeit) begründen bzw. Begründung als Pendenz anfordern; Ergebnis im Textfeld.
  nachweise:
  - Saldoliste Berichtsjahr mit Vorjahr
  - Anlagespiegel Berichtsjahr und Vorjahr
  - Kontoblätter Abschreibungen
  rechnen: 'Veränderung = Saldo 31.12. Berichtsjahr – Saldo 31.12. Vorjahr (CHF und %); Abschreibungssatz = Abschreibung / Basis; Kontrolle: BW 01.01. + Zugänge – Abgänge – Abschreibungen
    = BW 31.12.'
  feststellung_wenn: Wesentliche unerklärte Veränderung, Abschreibungssatz/-aufwand ohne Zu-/Abgang deutlich verändert oder Abschreibung fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Vergleich der Bestände, der Anschaffungen, der Verkäufe sowie der Abschreibungssätze und des Abschreibungsaufwands mit dem Vorjahr
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
- id: G2-202
  vorgehen: Mit dem Rechenmodul Anlagenintensität und Finanzierung der Investitionen (Anlagedeckungsgrade, Belehnung) für Berichtsjahr und Vorjahr berechnen und Veränderungen kommentieren.
    Auffälligkeiten (z.B. Liegenschaften kurzfristig finanziert) an die Prüffelder Finanzierung und Fortführung weitergeben.
  nachweise:
  - Bilanz Berichtsjahr und Vorjahr (Saldoliste)
  - Hypothekar-/Darlehenskonten
  rechnen: a) Anlagenintensität = Anlagevermögen / Gesamtvermögen (zusätzlich immobile Sachanlagen / Gesamtvermögen); b) Anlagedeckungsgrad I = EK / AV, II = (EK + langfristiges FK)
    / AV; Belehnung = Hypotheken / Buchwert Liegenschaften
  feststellung_wenn: Anlagedeckungsgrad II unter 100 % (Anlagevermögen teilweise kurzfristig finanziert) oder starke, unerklärte Veränderung der Kennzahlen.
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Kennzahlenanalyse → wichtige Analyse bei der Prüfungsplanung
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: kurzfristige Kredite werden im Übermass zur Finanzierung von Anlagevermögen herangezogen
  - quelle: hwp-er-2026__rz-0031-s183
    zitat: Vergleiche wichtiger Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten im Umlaufvermögen, Eigenkapitalanteil etc.) sind in der Regel nützlich und effizient.
- id: G2-301
  vorgehen: 'Keine Konten für Grundstücke/Bauten (Saldoliste, Anlagespiegel): je Schritt Status «nicht bearbeitet», Begründung «Vorschlag: nicht anwendbar (keine immobilen Sachanlagen)»,
    Entscheid WP. Hinweise weitergeben: langfristiger Mietvertrag → Anhang (T1-103), Mietkaution → H1-103, Untermiete 7500 → SCH5. Saldi der Liegenschaftskonten inkl. Wertberichtigungskonten
    gemäss Hauptbuch/Saldoliste mit der Bilanzposition der Jahresrechnung und mit dem Total des Anlagespiegels (Grundstücke/Bauten) abstimmen. Differenzen mit Konto und Betrag im Textfeld;
    fehlender Anlagespiegel: Pendenz.'
  nachweise:
  - Saldoliste/Hauptbuch Berichtsjahr
  - Jahresrechnung Berichtsjahr (Bilanz)
  - Anlagespiegel Berichtsjahr
  rechnen: Σ Konten Liegenschaften (AK – WB) gemäss Saldoliste = Bilanzposition = Buchwert 31.12. gemäss Anlagespiegel; Differenz = 0
  feststellung_wenn: Differenz zwischen Hauptbuch, Anlagespiegel und Bilanz.
  fundstellen:
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet)
  - quelle: hwp-bur-2023__rz-0835-s346
    zitat: Somit sind auch langfristige Mietverträge, welche nicht innerhalb von zwölf Monaten auslaufen oder gekündigt werden können, im Anhang offenzulegen.
- id: G2-302
  vorgehen: Anlagenverzeichnis je Objekt (Land/Gebäude getrennt) mit AK/HK, kumulierten Abschreibungen und Buchwert summieren und mit der Jahresrechnung abstimmen; Spiegelbewegungen
    nachrechnen und Anfangsbestand mit dem Vorjahresabschluss vergleichen.
  nachweise:
  - Anlagenverzeichnis/Anlagespiegel
  - Jahresrechnung Berichtsjahr
  - Vorjahresabschluss
  rechnen: Σ AK je Objekt – Σ kum. Abschreibungen = Buchwert JR; AK 01.01. + Zugänge – Abgänge = AK 31.12.; WB 01.01. + Abschreibung – WB auf Abgängen = WB 31.12.
  feststellung_wenn: Summe Inventarliste ≠ Jahresrechnung, Anlagespiegel rechnerisch falsch oder Anfangsbestand ≠ Vorjahresabschluss.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-2
    zitat: Abstimmung der Inventarliste mit Angabe der Anschaffungs- bzw. Herstellungskosten und der kumulierten Abschreibungen der einzelnen Anlagen und immateriellen Werte mit der
      Jahresrechnung
  - quelle: hwp-bur-2023__rz-0330-s229
    zitat: Die Führung einer Anlagebuchhaltung ist für den Vermögensschutz sowie im Hinblick auf die Ermittlung stiller Reserven und zur Feststellung des Gewinns aus Anlageabgängen unumgänglich.
- id: G2-303
  vorgehen: 'WP-Schritt (weitergehende Handlung, SER Anhang D h): nur mit ausdrücklicher Anweisung des WP; ohne Anweisung kein Textfeld-Eintrag, Status «nicht bearbeitet – WP-Schritt»;
    ein erhöhtes Risiko aus 3.1 nur als Notiz «Schlussbesprechung». Mit Anweisung: Kontoblätter der Liegenschafts- und Abschreibungskonten auf ungewöhnliche Posten (manuelle Korrekturen,
    Gegenbuchung Ertrag/Eigenkapital, Rundbeträge, Jahresendbuchungen) durchsehen; Auswahl mit Begründung und Belege aus M-Files dokumentieren; Visum offen.'
  nachweise:
  - Kontoblätter Liegenschafts- und Abschreibungskonten
  - Belege zu ausgewählten Posten
  rechnen: Σ geprüfte Posten / Kontobewegungen = Abdeckung
  feststellung_wenn: Buchung ohne Beleg, Beleginhalt ≠ Buchung oder Aufwertung/Verrechnung über das Bestandeskonto.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-2
    zitat: Durchsicht der Bestands- sowie der Abschreibungskonten im Hauptbuch auf ungewöhnliche Posten; Belegprüfung solcher Posten
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
- id: G2-304
  vorgehen: 'WP-Schritt (weitergehende Handlung, SER Anhang D h): nur mit ausdrücklicher Anweisung des WP; ohne Anweisung kein Textfeld-Eintrag, Status «nicht bearbeitet – WP-Schritt»;
    ein erhöhtes Risiko aus 3.1 nur als Notiz «Schlussbesprechung». Mit Anweisung: Kontoblätter Liegenschaften und Unterhalt in neuer Rechnung (bis Abschlussdatum) auf Rechnungen mit
    Leistung im Berichtsjahr durchsehen (Text, Leistungsdatum). Treffer: prüfen, ob per 31.12. Berichtsjahr abgegrenzt oder aktiviert; Korrektur nur als Buchungsvorschlag in den Feststellungen.'
  nachweise:
  - Kontoblätter Folgejahr (neue Rechnung)
  - Rechnungen mit Leistungsdatum im Berichtsjahr
  - Kreditoren/Abgrenzungen 31.12. Berichtsjahr
  rechnen: Σ nicht abgegrenzte Vorjahresbeträge vs. Wesentlichkeit
  feststellung_wenn: Bau- oder Unterhaltsrechnung mit Leistung im Berichtsjahr in neuer Rechnung ohne Abgrenzung/Aktivierung per 31.12. Berichtsjahr.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-2
    zitat: Durchsicht der Bestands- sowie Unterhaltskonten in neuer Rechnung auf auffällige Beträge, die das Vorjahr betreffen
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- id: G2-305
  vorgehen: 'WP-Schritt (weitergehende Handlung, SER Anhang D h): nur mit ausdrücklicher Anweisung des WP; ohne Anweisung kein Textfeld-Eintrag, Status «nicht bearbeitet – WP-Schritt»;
    ein erhöhtes Risiko aus 3.1 nur als Notiz «Schlussbesprechung». Mit Anweisung: für wesentliche Zu- und Abgänge Kaufverträge, Bauabrechnungen, Handwerkerrechnungen, Grundbuchanmeldung
    und ggf. Leasing-/Baurechtsverträge aus M-Files mit der Buchung vergleichen (Betrag, Datum, Eigentümerin, Objekt). Fehlende Belege als Pendenz mit Konto, Datum und Betrag.'
  nachweise:
  - Kaufverträge
  - Bauabrechnungen/Rechnungen
  - Grundbuchanmeldung/-auszug
  - Leasing-/Baurechtsverträge
  rechnen: Σ geprüfte Zugänge / Σ Zugänge gemäss Anlagespiegel = Abdeckung; Belegbetrag inkl. Nebenkosten = gebuchter Zugang
  feststellung_wenn: Beleg lautet auf Dritte/Aktionär, Betrag weicht ab, Zugang ohne Vertrag oder Grundbuchnachweis oder Unterhalt aktiviert.
  fundstellen:
  - quelle: ser-2022__anh-d-s083-1
    zitat: Durchsicht von Einkaufsfakturen, Leasing- und anderen Verträgen sowie weiteren Dokumenten im Zusammenhang mit Anschaffung bzw. Veräusserung von Sachanlagen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
- id: G2-306
  vorgehen: 'Physische Handlung: der Agent führt sie nie aus. Ordnet der WP eine Besichtigung an, bereitet der Agent nur eine Objektliste (Adresse, Nutzung, Buchwert) aus dem Anlagenverzeichnis
    vor und erfasst eine Pendenz für den WP; das Ergebnis dokumentiert der WP.'
  nachweise:
  - Objektliste aus Anlagenverzeichnis (Vorlage)
  rechnen: ''
  feststellung_wenn: 'Nur Pendenz: Besichtigung angeordnet, aber nicht dokumentiert, oder Unterlagen deuten auf nicht mehr vorhandene/beschädigte Objekte hin.'
  fundstellen:
  - quelle: ser-2022__anh-d-s083-1
    zitat: Physische Bestandsaufnahme
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: physische Tätigkeiten nie
- id: G2-320
  vorgehen: 'Anhang auf liegenschaftsbezogene Angaben prüfen: angewandte Grundsätze (Bewertung/Abschreibung), verpfändete Aktiven zu Buchwerten, Sicherheiten für Dritte, Leasing/Baurecht,
    ausserordentliche Gewinne aus Liegenschaftsverkäufen, Nettoauflösung stiller Reserven; mit Ergebnissen G2-104/106/321/401 abgleichen und an Prüffeld Anhang übergeben.'
  nachweise:
  - Anhang Berichtsjahr
  - Grundbuchauszüge/Kreditverträge
  - Arbeitspapiere G2-104/106/321/401
  rechnen: Anhangbetrag verpfändete Aktiven = Σ Buchwerte belasteter Liegenschaften (+ übrige verpfändete Aktiven)
  feststellung_wenn: Pflichtangabe fehlt oder Betrag weicht von Buchwert, Grundbuch oder Kreditvertrag ab.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0846-s349
    zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen Ansätzen wie in der Bilanz, also zu Buchwerten.
- id: G2-321
  vorgehen: Detailnachweis der stillen Reserven auf Liegenschaften beim Kunden beschaffen; Bestand 01.01. mit Vorjahresakte abstimmen, Veränderung im Berichtsjahr (zusätzliche/unterlassene
    Abschreibungen, Abgänge, aufwandwirksame Investitionen) nachvollziehen und Berechnungsmethode mit Vorjahr vergleichen. Nettoauflösung an Prüffeld stille Reserven/Anhang übergeben.
  nachweise:
  - Detailnachweis stille Reserven Berichtsjahr und Vorjahr
  - Anlagespiegel
  - Ergebnisse G2-102/409/410
  rechnen: Stille Reserve je Objekt = gesetzlich zulässiger Höchstwert (AK/HK abzüglich der nutzungsbedingt nötigen Abschreibungen, höchstens erzielbarer Wert) – Buchwert; Veränderung
    = Bestand 31.12. – Bestand Vorjahr; negative Veränderung = Auflösung. Verkehrs-/Schätzwert über AK/HK zählt nicht (Zwangsreserve).
  feststellung_wenn: Kein Nachweis, Methode gegenüber Vorjahr geändert, wesentliche Nettoauflösung ohne Anhangangabe oder Reserve auf Basis Verkehrs-/Schätzwert über AK/HK berechnet.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
  - quelle: hwp-bur-2023__rz-0341-s230
    zitat: Der Auflösungsbetrag hat in die Berechnung des Gesamtbetrags der Reserveveränderung einzufliessen
  - quelle: hwp-bur-2023__rz-0817-s341-t2
    zitat: ist für die obligationenrechtliche Jahresrechnung eine stichtagsbezogene Bestandsermittlung der stillen Reserven aufgrund der Differenz zwischen dem Buchwert und dem gesetzlich
      zulässigen Höchstwert bzw. erforderlichen Betrag gemeint
  - quelle: hwp-bur-2023__rz-0660-s295
    zitat: Die Veränderung der Zwangsreserven ist bei der Offenlegung von Reservenauflösungen im Anhang (Art. 959c Abs. 1 Ziff. 3 OR) nicht zu berücksichtigen.
- id: G2-322
  vorgehen: 'Dauerakte Liegenschaften in M-Files auf Aktualität prüfen und ergänzen: Grundbuchauszüge, Kauf-, Baurechts- und Mietverträge, Hypothekar-/Kreditverträge, Schuldbriefverzeichnis,
    Versicherungspolicen, Abschreibungsplan. Fehlende oder veraltete Dokumente als Pendenz; nichts löschen.'
  nachweise:
  - Dauerakte M-Files
  - Neue Verträge/Grundbuchauszüge Berichtsjahr
  rechnen: ''
  feststellung_wenn: 'Nur Pendenz: Dauerakte fehlt oder ist veraltet (z.B. Grundbuchauszug vor letztem Zu-/Abgang).'
  fundstellen:
  - quelle: ser-2022__7-3
    zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt
- id: G2-401
  vorgehen: Aus dem Grundbuchauszug je Liegenschaft Grundpfandrechte/Schuldbriefe (Betrag, Gläubiger, Eigentümerschuldbriefe) erfassen und mit den Hypothekar-/Bankschulden gemäss Bankauszug
    und Kreditvertrag per 31.12. vergleichen; Belehnung berechnen; Ergebnis an G2-320 und Prüffeld Bankverbindlichkeiten übergeben.
  nachweise:
  - Grundbuchauszug
  - Schuldbriefverzeichnis
  - Kreditverträge
  - Bankauszug/Zinsabrechnung 31.12.
  rechnen: 'Σ Grundpfandrechte gemäss Grundbuch vs. Σ Hypothekarschulden; Belehnung = Hypothekarschulden / Buchwert Liegenschaften; Liste: Schuld ohne Pfand, Pfand ohne Schuld'
  feststellung_wenn: Grundpfand für Dritte oder ohne bilanzierte Schuld, Hypothek nicht bilanziert oder Verpfändung im Anhang fehlt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0461-s252
    zitat: Die Vollständigkeit der Grundpfandtitel ist periodisch anhand eines Grundbuchauszugs festzustellen
  - quelle: hwp-bur-2023__rz-0460-s252
    zitat: In der Buchhaltung ist nicht die Gesamtbelastung gemäss Grundbuch, sondern der tatsächliche Schuldbetrag zu führen.
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- id: G2-402
  vorgehen: 'Nur auf Anweisung des WP. Ein Gutachten einholen oder beauftragen: nie durch den Agenten (nicht Bestandteil der eingeschränkten Revision, SER Anhang D h); ob eines eingeholt
    wird, entscheidet und veranlasst der WP. Mit Anweisung: nur bereits in M-Files vorhandene Schätzungen des Kunden (Bank, Steuer, Versicherung) suchen und Datum, Ersteller und Wert
    für G2-105/408 notieren.'
  nachweise:
  - Vorhandene Schätzungen/Gutachten des Kunden (falls vorhanden)
  rechnen: Buchwert – vorhandener Schätzwert; nur ein positiver Betrag (Schätzwert unter Buchwert) ist ein Hinweis für G2-105/408. Ein Schätzwert über dem Buchwert ist weder Aufwertungsgrundlage
    noch stille Reserve.
  feststellung_wenn: Vorhandene Schätzung liegt unter dem Buchwert (Hinweis auf Wertberichtigungsbedarf, an G2-105/408).
  fundstellen:
  - quelle: ser-2022__anh-d-s083-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: Experten- und Bewertungsgutachten
  - quelle: hwp-bur-2023__rz-0366-s235
    zitat: erfüllt eine unabhängige Immobilienschätzung das Kriterium des beobachtbaren Marktpreises im Sinne von Art. 960b Abs. 1 OR nicht
  - quelle: hwp-bur-2023__rz-0817-s341-t2
    zitat: ist für die obligationenrechtliche Jahresrechnung eine stichtagsbezogene Bestandsermittlung der stillen Reserven aufgrund der Differenz zwischen dem Buchwert und dem gesetzlich
      zulässigen Höchstwert bzw. erforderlichen Betrag gemeint
- id: G2-403
  vorgehen: 'Je wesentlichem Zugang anhand Beleg beurteilen: Erwerb (Kaufpreis plus direkt zurechenbare Nebenkosten wie Handänderungsgebühren, Provisionen, abzüglich Rückvergütungen),
    Bau (Baukosten, ggf. Bauzinsen), Umbau/Erneuerung (Wertvermehrung oder zusätzliche Nutzung, Projektbetrachtung). Nicht aktivierbare Teile im Textfeld beziffern.'
  nachweise:
  - Kaufverträge/Abrechnungen Notariat
  - Bauabrechnungen
  - Kontoblätter Zugänge
  rechnen: Aktivierbarer Betrag = Kaufpreis bzw. Baukosten + direkte Nebenkosten – Rückvergütungen; Differenz zum gebuchten Zugang
  feststellung_wenn: Unterhalt, Eigenkapitalzinsen oder Zinsen auf Landreserven aktiviert, Rückvergütungen nicht abgezogen oder Zugang ohne Verfügungsmacht.
  fundstellen:
  - quelle: or__art-959
    zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist
  - quelle: hwp-bur-2023__rz-0356-s233-t1
    zitat: Alle mit dem Kauf oder der Erstellung eines Objekts unmittelbar verbundenen Kosten gelten als Anschaffungs- oder Herstellungskosten.
  - quelle: hwp-bur-2023__rz-0364-s235
    zitat: Hingegen ist die Aktivierung von Kosten für Erneuerungen, Verbesserungen und Umbauten gerechtfertigt, sofern damit eine Wertvermehrung oder eine zusätzliche Nutzungsmöglichkeit
      geschaffen wird.
  - quelle: hwp-bur-2023__rz-0357-s234
    zitat: Eine Zinsaktivierung auf Landreserven ist nicht statthaft.
- id: G2-404
  vorgehen: 'Liegenschaftserfolg je Objekt (Mietertrag bzw. vom Kunden genannter Nutzwert, Unterhalt, Hypothekarzinsen, Abschreibungen) aus ER/Kontoblättern zusammenstellen, Rendite
    auf Buchwert berechnen und mit Vorjahr vergleichen. Deckt die Liegenschaft die Vollkosten nachhaltig nicht: Werthaltigkeitsbeurteilung des Kunden als Pendenz.'
  nachweise:
  - Liegenschaftsrechnung/Kontoblätter Ertrag und Aufwand
  - Mieterspiegel
  - Anlagespiegel
  rechnen: Bruttorendite = Mietertrag / Buchwert; Nettoergebnis = Mietertrag – Unterhalt – Zinsen – Abschreibungen; Vergleich mit Vorjahr (Kapitalisierungssatz nur gemäss Vorgabe Kunde/WP)
  feststellung_wenn: Liegenschaft deckt die Vollkosten inkl. Abschreibungen nachhaltig nicht oder Ertragswert gemäss Kundennachweis liegt unter dem Buchwert.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0363-s235
    zitat: die Vollkosten der in dieser Liegenschaft hergestellten bzw. erbrachten Güter und Dienstleistungen einschliesslich der planmässigen Abschreibungen nicht nachhaltig einbringen
      kann
  - quelle: hwp-bur-2023__rz-0343-s231
    zitat: Für die Ermittlung des Nutzwerts herangezogen werden insbesondere Cashflow-, Ertrags- und Deckungsbeitragsprognosen
- id: G2-405
  vorgehen: Prüfen, ob die Gesellschaft ein aktuelles Liegenschaftsinventar führt und periodisch mit dem Grundbuch abgestimmt hat (Grundstücknummer, Fläche, Eigentümerin, Datum). Abweichungen
    zwischen Inventar, Grundbuch und Anlagespiegel auflisten; fehlende Abstimmung als Pendenz.
  nachweise:
  - Liegenschaftsinventar/Anlagenverzeichnis
  - Grundbuchauszüge
  - Anlagespiegel
  rechnen: Anzahl/Nummern Objekte Inventar = Grundbuch = Anlagespiegel (1:1-Abgleich)
  feststellung_wenn: Objekt im Grundbuch, aber nicht bilanziert (oder umgekehrt), oder Inventar bzw. Abstimmung mit Grundbuch fehlt.
  fundstellen:
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-bur-2023__rz-0355-s233
    zitat: Für die Bestandsermittlung ist die periodische Abstimmung mit dem Grundbuch erforderlich.
- id: G2-406
  vorgehen: 'Vom Kunden gelieferte aktuelle Grundbuchauszüge je Liegenschaft mit dem Anlagenverzeichnis abgleichen: Eigentümerin = Gesellschaft, Grundstücknummer, Grundpfandrechte, Dienstbarkeiten/Anmerkungen;
    Gebäudeversicherungsnachweis auf Objekt und Versicherungswert sichten. Keine Drittbestätigungen anfragen; fehlende Unterlagen: Pendenz.'
  nachweise:
  - Grundbuchauszüge
  - Gebäudeversicherungsnachweis
  - Anlagenverzeichnis
  rechnen: Objekte Grundbuch vs. Anlagenverzeichnis (1:1); Versicherungswert vs. Buchwert (nur Hinweis)
  feststellung_wenn: Eigentümer gemäss Grundbuch ≠ Gesellschaft (z.B. Aktionär), bilanziertes Objekt fehlt im Grundbuch oder Belastungen nicht offengelegt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0351-s232
    zitat: Zum Erwerb von Grundeigentum bedarf es der Eintragung in das Grundbuch (Art. 656 Abs. 1 ZGB).
  - quelle: hwp-bur-2023__rz-0355-s233
    zitat: Für die Bestandsermittlung ist die periodische Abstimmung mit dem Grundbuch erforderlich.
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: das Einholen von Bestätigungen von Dritten
- id: G2-407
  vorgehen: 'Abschreibungen des Berichtsjahres je Objekt nachrechnen (Basis, Satz, Methode, pro rata bei Zugängen) und mit dem Abschreibungsaufwand der ER abstimmen. Nutzungsdauer plausibilisieren
    (Gebäude/Land getrennt, Baurecht). Abweichungen zu steuerlichen Normalsätzen nur als Hinweis auf stille Reserven an G2-321. Steuerlich erhöhte Abschreibungen auf energiesparende
    Investitionen (MB A Ziff. 2: bis 50 % vom Buchwert im 1. und 2. Jahr) sind kein handelsrechtlicher Massstab; der über den nutzungsbedingten Wertverlust hinausgehende Teil ist stille
    Reserve → G2-321.'
  nachweise:
  - Anlagespiegel
  - Abschreibungsplan
  - Kontoblatt Abschreibungen Liegenschaften
  - Baurechtsvertrag (falls vorhanden)
  rechnen: 'Soll-Abschreibung = Basis × Satz (linear: AK; degressiv: Buchwert 01.01.), pro rata bei Zugang; Σ Soll = Abschreibungsaufwand ER; Differenz; ESTV-Vergleichssatz je Objekt:
    `wert abschreibung gebäude` (vom Buchwert; vom Anschaffungswert ½) – Differenz nur als Hinweis an G2-321 bzw. Prüffeld S1'
  feststellung_wenn: Abschreibung unterlassen oder rechnerisch falsch, Land planmässig abgeschrieben oder Abschreibung unter den Passiven ausgewiesen.
  fundstellen:
  - quelle: or__art-960a
    zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen, anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden.
  - quelle: hwp-bur-2023__rz-0362-s235
    zitat: Die Abschreibungen von Gebäuden richten sich nach der Nutzungsdauer.
  - quelle: hwp-bur-2023__rz-0361-s235
    zitat: Unbebaute Grundstücke unterliegen im Allgemeinen keinem nutzungsbedingten Wertverzehr, weshalb Abschreibungen normalerweise nicht erforderlich sind.
  - quelle: estv-mb-a-1995__s001-1
    zitat: Normalsätze in Prozenten des Buchwertes
  - quelle: estv-mb-a-1995__s001-3
    zitat: im ersten und im zweiten Jahr bis zu 50% vom Buchwert
  - quelle: hwp-bur-2023__rz-0329-s228-t2
    zitat: Falls jedoch auf dem Anlagegegenstand mehr abgeschrieben worden war, als gemäss nutzungs- und altersbedingtem Wertverlust erforderlich gewesen wäre, wurden stille Reserven
      gebildet
- id: G2-408
  vorgehen: Restbuchwert je Objekt mit verfügbaren Indikatoren für den erzielbaren Wert vergleichen (Rentabilität G2-404, vorhandene Schätzungen G2-402, Zustand/Unterhalt, Leerstand);
    Ermessenspunkte für den WP im Textfeld festhalten. Bei möglicher Unterdeckung Werthaltigkeitsnachweis des Kunden als Pendenz.
  nachweise:
  - Anlagespiegel
  - Ergebnisse G2-105/402/404
  - Werthaltigkeitsnachweis Kunde
  rechnen: Restbuchwert 31.12. – erzielbarer Wert gemäss Kundennachweis = Wertberichtigungsbedarf (falls positiv)
  feststellung_wenn: Restbuchwert übersteigt den erzielbaren Wert ohne Wertberichtigung oder Bewertung über AK/HK.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0362-s235
    zitat: Der nach Vornahme der Abschreibungen verbleibende Restwert von Liegenschaften kann nicht unbesehen in die Bilanz übernommen werden, sondern ist zu überprüfen.
  - quelle: or__art-960a
    zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- id: G2-409
  vorgehen: Unterhalts-, Reparatur- und Renovationskonten des Berichtsjahres auf grössere Posten (Schwelle nach Wesentlichkeit) durchsehen und nach Beleg in werterhaltend/wertvermehrend
    klassieren. Umbauten und Renovationen als Projekt als Ganzes klassieren, nicht je Einzelrechnung. Wertvermehrende Beträge im Aufwand beziffern und als stille Reserve an G2-321 übergeben;
    steuerliche Folgen beurteilt der WP (Schlussbesprechung).
  nachweise:
  - Kontoblätter Unterhalt/Reparaturen Liegenschaften
  - Rechnungen grösserer Posten
  rechnen: Σ wertvermehrende Anteile in Aufwandkonten = nicht aktivierte Investitionen (stille Reserve)
  feststellung_wenn: Wesentliche wertvermehrende Investitionen im Aufwand, die im Nachweis der stillen Reserven fehlen.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0364-s235
    zitat: Hingegen ist die Aktivierung von Kosten für Erneuerungen, Verbesserungen und Umbauten gerechtfertigt, sofern damit eine Wertvermehrung oder eine zusätzliche Nutzungsmöglichkeit
      geschaffen wird.
  - quelle: hwp-bur-2023__rz-0364-s235
    zitat: In diesem Sinne sind weniger einzelne Bautätigkeiten zu beurteilen, sondern das Projekt als Ganzes.
  - quelle: hwp-bur-2023__rz-0739-s311-t1
    zitat: wertvermehrenden Unterhaltskosten
  - quelle: or__art-960a
    zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- id: G2-410
  vorgehen: Prüfen, ob neben den Buchwerten eine Anlagenbuchhaltung zu betriebswirtschaftlichen Werten (Abschreibung über Nutzungsdauer) geführt wird; Werte je Objekt nachrechnen und
    Methode mit Vorjahr vergleichen. Differenz zu den Buchwerten als stille Reserven an G2-321 übergeben.
  nachweise:
  - Anlagenbuchhaltung betriebswirtschaftlich
  - Anlagespiegel (Buchwerte)
  - Vorjahresnachweis
  rechnen: Betriebswirtschaftlicher Wert = AK – kum. betriebswirtschaftliche Abschreibung (AK / Nutzungsdauer × Jahre); Differenz zum Buchwert = stille Reserve
  feststellung_wenn: Ermittlung nicht nachvollziehbar, Methode gewechselt oder betriebswirtschaftlicher Wert über AK/HK.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0330-s229
    zitat: Die Führung einer Anlagebuchhaltung ist für den Vermögensschutz sowie im Hinblick auf die Ermittlung stiller Reserven und zur Feststellung des Gewinns aus Anlageabgängen unumgänglich.
  - quelle: hwp-bur-2023__rz-0817-s341-t1
    zitat: Die stillen Reserven sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln
- id: G2-411
  vorgehen: Soll-Mietertrag aus Mieterspiegel/Mietverträgen (inkl. Parkplätze, Untermiete, Baurechtszinsen) berechnen und mit dem gebuchten Liegenschaftsertrag abstimmen; Leerstände,
    Mietzinsreduktionen und Mieten von Nahestehenden belegen lassen (Pendenz). Ausweis betriebsfremd/betrieblich und Abgrenzung (Ausstände, Vorauszahlungen) prüfen.
  nachweise:
  - Mieterspiegel/Mietverträge
  - Kontoblatt Liegenschaftsertrag
  - Erfolgsrechnung Berichtsjahr und Vorjahr
  rechnen: Soll-Ertrag = Σ (Monatsmiete × vermietete Monate) je Vertrag; Differenz zum gebuchten Ertrag; Ertrag Berichtsjahr vs. Vorjahr
  feststellung_wenn: Unerklärte Differenz Soll/Ist, Ertrag fällt ohne Begründung weg, Mieten Nahestehender auffällig oder Ausweis passt nicht zum Hauptzweck (betriebsfremd nur, wenn
    die Vermietung nicht zum Hauptzweck gehört).
  fundstellen:
  - quelle: or__art-959b-t1
    zitat: betriebsfremder Aufwand und betriebsfremder Ertrag
  - quelle: hwp-bur-2023__rz-0750-s317-t2
    zitat: Nebenerlöse, welche nicht direkt mit dem primären Unternehmenszweck in Zusammenhang stehen, sind separat unter dem betriebsfremden Ertrag auszuweisen
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
