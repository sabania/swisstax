    zitat: Die Rechnungsabgrenzungen sind nach den Grundsätzen, die für Forderungen bzw. Verbindlichkeiten gelten, zu bewerten.
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: ser-2022__anh-d-s077-1
    zitat: Beurteilung der Notwendigkeit einer Wertberichtigung durch Prüfung der Zahlungskonditionen oder dem nachträglichen Eingang der Zahlungen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Bei der Belegprüfung ist sicherzustellen, dass die Zahlen und die weiteren Angaben bei der erstmaligen Erfassung im System des Rechnungswesens vollständig und richtig sind.
