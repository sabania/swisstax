schritte:
- id: E1-101
  vorgehen: 'Agent kann nicht selbst befragen: in M-Files schriftliche Antworten (Kundenbefragung, Fragebogen, Vollständigkeitserklärung) zur Werthaltigkeit jeder wesentlichen Position
    der Detailaufstellung 1300 suchen und auswerten (Leistung 2026 noch nutzbar, Vertrag ungekündigt, Gegenpartei solvent, Geldeingang gesichert). Fehlt eine Antwort: Frage je Position
    als Pendenz erfassen; Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Antwort Kundenbefragung zur Werthaltigkeit
  - Detailaufstellung aktive Rechnungsabgrenzungen 31.12.2025
  - Vollständigkeitserklärung
  rechnen: ''
  feststellung_wenn: Antwort zeigt für eine wesentliche Position fehlenden künftigen Geld- oder Nutzenzugang (Kündigung, Leistung entfällt, Gegenpartei insolvent) oder Antwort fehlt
    (dann Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Befragung über die Werthaltigkeit (künftiger Geld- oder Nutzenzugang) der aktivierten Beträge
  - quelle: hwp-er-2026__rz-0104-s198
    zitat: Bei Kernaussagen wird der Abschlussprüfer allenfalls eine schriftliche Bestätigung der erhaltenen Auskünfte vom Befragten einverlangen.
  - quelle: or__art-959
    zitat: ein Mittelzufluss wahrscheinlich ist
- id: E1-201
  vorgehen: 'Saldo Konto 1300 bzw. Bilanzposition per 31.12.2025 mit 31.12.2024 vergleichen (Saldoliste, Vorjahres-JR). Detailaufstellung positionsweise der Vorjahresaufstellung gegenüberstellen:
    wiederkehrende Positionen (Versicherungen, Mieten, Lizenzen) erwarten, neue, weggefallene und stark veränderte Positionen markieren. Unerklärte Abweichungen über der Toleranzwesentlichkeit
    als Frage an die Unternehmensleitung (Pendenz) erfassen.'
  nachweise:
  - Saldoliste 2025 mit Vorjahr
  - Detailaufstellung 1300 per 31.12.2025
  - Detailaufstellung 1300 per 31.12.2024
  rechnen: 'Veränderung = Saldo 1300 per 31.12.2025 − Saldo per 31.12.2024; Veränderung % = Veränderung / Saldo VJ; je Position: Betrag LJ − Betrag VJ'
  feststellung_wenn: Wiederkehrende Vorjahresposition fehlt ohne Erklärung (Vollständigkeit) oder neue/erhöhte Position ohne nachvollziehbaren Grund; unerklärte Veränderung über der
    Toleranzwesentlichkeit.
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Vergleich mit den Beständen des Vorjahres
  - quelle: hwp-bur-2023__rz-0262-s216
    zitat: durch Vergleich mit den im Vorjahr ausgewiesenen Rechnungsabgrenzungen
- id: E1-202
  vorgehen: Zugehörige Aufwands- und Ertragskonten (Versicherungsprämien, Miete, Software/Lizenzen, Wartung, Zins-, Miet- und Provisionsertrag) aus der Saldoliste LJ/VJ vergleichen,
    Erwartung aus Vorjahr und Verträgen bilden und Abgrenzungsbetrag plausibilisieren. Wesentliche Abweichungen auflisten und als Frage zur Besprechung mit der Unternehmensleitung (Pendenz,
    Besprechung durch WP) erfassen; Einfluss stiller Reserven beachten.
  nachweise:
  - Saldoliste Erfolgsrechnung 2025 mit Vorjahr
  - Verträge zu wiederkehrenden Aufwänden/Erträgen
  - Detailaufstellung 1300
  rechnen: 'Je Konto: Saldo 2025 − Saldo 2024 und Abweichung %; erwartete Abgrenzung = Jahresbetrag × Monate nach 31.12.2025 / Monate Leistungsperiode; Vergleich mit gebuchter Abgrenzung'
  feststellung_wenn: Aufwands- oder Ertragskonto weicht wesentlich von Vorjahr/Erwartung ab und die Abgrenzung erklärt dies nicht (Hinweis auf zu hohe oder fehlende Abgrenzung).
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Vergleich der Salden zugehöriger Ertrags- und Aufwandskonten mit denjenigen vorangegangener Perioden; Besprechung wesentlicher Abweichungen mit der Unternehmensleitung
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- id: E1-203
  vorgehen: Liste nahestehender Parteien (Aktionäre, VR, GL, Beteiligungsgesellschaften) aus Unternehmensinformationen, HR-Auszug, Aktienbuch, Protokollen und Anhang erstellen und mit
    den Gegenparteien der Detailaufstellung 1300 abgleichen. Bei Treffern gesonderten Ausweis in Bilanz oder Anhang (Art. 959a Abs. 4 OR) prüfen. Unklare Gegenparteien als Pendenz erfassen.
  nachweise:
  - Detailaufstellung 1300 mit Gegenparteien
  - Unternehmensinformationen/HR-Auszug/Aktienbuch
  - Anhang der Jahresrechnung
  - Vollständigkeitserklärung (nahestehende Personen)
  rechnen: Summe Abgrenzungen ggü. Nahestehenden = Summe Positionen mit Gegenpartei auf Liste Nahestehender; Abgleich mit Anhangangabe
  feststellung_wenn: Abgrenzung gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften ohne gesonderten Ausweis in Bilanz/Anhang, oder Gegenpartei einer wesentlichen Position
    unklar.
  fundstellen:
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Feststellung der korrekten Offenlegung der Beziehung zu nahestehenden Personen in der Jahresrechnung
- id: E1-301
  vorgehen: 'Detailaufstellung 1300 (PBC) in M-Files suchen, Summe nachrechnen und mit Saldo Konto 1300 (Hauptbuch, Saldoliste) und der Bilanzposition «Aktive Rechnungsabgrenzungen»
    der Jahresrechnung abstimmen. Je Position Beleg, Leistungszeitraum (nach 31.12.2025) und Gegenpartei festhalten; keine Saldierung mit passiven Abgrenzungen. Fehlt die Aufstellung:
    Pendenz.'
  nachweise:
  - Detailaufstellung 1300 per 31.12.2025
  - Kontoblatt 1300 / Saldoliste
  - Jahresrechnung 2025 (Bilanz)
  rechnen: Summe Detailaufstellung = Saldo Konto 1300 (Hauptbuch) = Bilanzposition Aktive Rechnungsabgrenzungen JR 31.12.2025; Differenz = 0
  feststellung_wenn: Differenz zwischen Aufstellung, Hauptbuch und Jahresrechnung; Position betrifft Leistungszeitraum 2025; Saldierung mit passiven Abgrenzungen; Aufstellung fehlt (Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Abstimmung einer Detailaufstellung mit der Jahresrechnung
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-er-2026__rz-0091-s196
    zitat: Das Nachrechnen besteht aus der Prüfung der rechnerischen Richtigkeit von quantitativen Angaben in Dokumenten oder Aufzeichnungen.
- id: E1-302
  vorgehen: 'Für wesentliche Positionen Beleg (Rechnung, Police) einsehen: Echtheit (Gegenpartei, Betrag, Zahlung 2025) und zeitanteiligen Abgrenzungsbetrag nachrechnen. Antizipative
    Aktiven: Bonität und Geldeingang in neuer Rechnung prüfen; transitorische Aktiven: künftigen Nutzen (Leistung 2026 beziehbar) beurteilen. Notwendige Wertberichtigung oder Korrektur
    im Textfeld begründen.'
  nachweise:
  - Rechnungen/Policen der abgegrenzten Positionen
  - Zahlungsbelege 2025
  - Zahlungseingänge 2026 (antizipative Aktiven)
  - Detailaufstellung 1300
  rechnen: Abgrenzung = Rechnungsbetrag × Tage (Monate) Leistungszeitraum nach 31.12.2025 / Tage (Monate) gesamter Leistungszeitraum; Differenz zum gebuchten Betrag
  feststellung_wenn: Beleg fehlt oder weicht ab; Leistungszeitraum ganz/teilweise 2025; Geldeingang zweifelhaft oder kein künftiger Nutzen; wesentliche Rechendifferenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0263-s216
    zitat: Die Rechnungsabgrenzungen sind nach den Grundsätzen, die für Forderungen bzw. Verbindlichkeiten gelten, zu bewerten.
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
  - quelle: ser-2022__anh-d-s077-1
    zitat: Beurteilung der Notwendigkeit einer Wertberichtigung durch Prüfung der Zahlungskonditionen oder dem nachträglichen Eingang der Zahlungen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Bei der Belegprüfung ist sicherzustellen, dass die Zahlen und die weiteren Angaben bei der erstmaligen Erfassung im System des Rechnungswesens vollständig und richtig sind.
- id: E1-303
  vorgehen: 'Weitergehende Handlung, nur auf Anordnung WP oder bei erhöhtem Risiko. Kontoblätter typischer Konten (Versicherungen, Miete, Leasing, Lizenzen/Wartung, Beiträge; Zins-,
    Miet-, Provisionsertrag, Boni) kritisch durchsehen: Buchungen Okt.–Dez. mit Leistungszeitraum 2026 ohne Abgrenzung und Ertrag 2025 ohne Erfassung auflisten. Fehlen Kontoblätter:
    PBC-Vorschlag.'
  nachweise:
  - Kontoblätter Aufwands- und Ertragskonten 2025
  - Rechnungen Okt.–Dez. 2025
  - Detailaufstellung 1300
  rechnen: 'Je Fund: abzugrenzender Anteil = Betrag × Monate 2026 / Monate Leistungsperiode; Summe nicht/falsch abgegrenzter Anteile vs. Toleranzwesentlichkeit'
  feststellung_wenn: Nicht oder falsch abgegrenzte Beträge erreichen einzeln oder zusammen die Toleranzwesentlichkeit, oder Aufwand 2025 wurde als aktive Abgrenzung aktiviert.
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Kritische Durchsicht von Ertrags- und Aufwandskonten, welche häufig aktive Rechnungsabgrenzungen enthalten
  - quelle: hwp-bur-2023__rz-0262-s216
    zitat: mittels Durchsicht der einzelnen Aufwands- und Ertragskonten im Hinblick auf die richtige Periodenabgrenzung
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
- id: E1-304
  vorgehen: 'Weitergehende Handlung (WP). Wesentliche Positionen mit Verträgen abstimmen (Versicherungspolice, Lizenz-, Miet-, Leasing-, Wartungsvertrag): Vertragspartei ist die Gesellschaft,
    Leistungszeitraum, Prämie/Preis, Laufzeit und Kündigung. Ergebnis je Position im Textfeld dokumentieren; fehlende Verträge als Pendenz bzw. PBC-Vorschlag erfassen.'
  nachweise:
  - Verträge/Policen zu den Positionen 1300
  - Detailaufstellung 1300
  rechnen: Abgrenzung gemäss Vertrag = Vertragsbetrag × Restlaufzeit-Anteil nach 31.12.2025; Differenz zur gebuchten Abgrenzung
  feststellung_wenn: Vertrag fehlt, lautet auf Dritte (z.B. Aktionär) oder Vertragsdaten (Zeitraum, Betrag) stimmen nicht mit der Abgrenzung überein.
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Abstimmung der Bestände mit geeigneten Unterlagen (Verträge usw.)
  - quelle: hwp-er-2026__rz-0090-s196
    zitat: kritische Durchsicht von Verträgen
- id: E1-305
  vorgehen: 'Weitergehende Handlung (WP). Konto 1300 und zugehörige Konten in neuer Rechnung (ab 01.01.2026 bis Prüfungsdatum) durchsehen: Auflösung des Saldos, Geldeingänge der antizipativen
    Aktiven, Gutschriften, Rückerstattungen oder Kündigungen, die Bestand oder Wert in Frage stellen. Fehlen Kontoblätter 2026: PBC-Vorschlag.'
  nachweise:
  - Kontoblatt 1300 neue Rechnung 2026
  - Kontoblätter zugehörige Aufwands-/Ertragskonten 2026
  - Bankbelege Zahlungseingänge 2026
  rechnen: Auflösung 2026 (Haben 1300) = Saldo 1300 per 31.12.2025; Geldeingänge antizipative Aktiven 2026 ≥ abgegrenzter Betrag
  feststellung_wenn: Auflösung weicht vom Bilanzsaldo ab, Geldeingang bleibt aus oder ist tiefer, oder Buchungen 2026 zeigen, dass die Leistung entfällt (Rückerstattung, Gutschrift).
  fundstellen:
  - quelle: ser-2022__anh-d-s080-1
    zitat: Kontendurchsicht betreffend die weitere Entwicklung in neuer Rechnung
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Hinweise zu den Ereignissen nach dem Bilanzstichtag zu erhalten
- id: E1-306
  vorgehen: 'Kontoblatt 1300 anhand Belegen prüfen: Auflösung der Vorjahresabgrenzung (Rückbuchung Anfang 2025 = Saldo 31.12.2024, in die richtigen Aufwands-/Ertragskonten, nicht als
    periodenfremd/ausserordentlich) und Bildung per 31.12.2025 (= Detailaufstellung, korrektes Gegenkonto, Beleg vorhanden). Bei Belassen-Methode Anpassung an die aktuelle Situation
    prüfen.'
  nachweise:
  - Kontoblatt 1300 2025
  - Buchungsbelege Auflösung und Bildung
  - Detailaufstellungen 1300 per 31.12.2024 und 31.12.2025
  rechnen: Auflösung VJ (Haben 1300) = Saldo 1300 per 31.12.2024; Bildung (Soll 1300) = Total Detailaufstellung 31.12.2025; Eröffnungssaldo + Soll − Haben = Saldo 31.12.2025
  feststellung_wenn: Vorjahresabgrenzung nicht oder nur teilweise aufgelöst, Gegenkonto falsch (z.B. ausserordentlicher Ertrag), Buchung ohne Beleg oder Bildung ≠ Detailaufstellung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0261-s216
    zitat: Nach Eröffnung der Buchhaltung im neuen Geschäftsjahr erfolgt entweder eine Rückbuchung in die betreffenden Aufwands- und Ertragskonten
  - quelle: hwp-bur-2023__rz-0261-s216
    zitat: dabei gilt die Rückbuchung nicht als periodenfremd
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- id: E1-320
  vorgehen: 'Nachweis stille Reserven (Kunde) in M-Files suchen; Bestand und Veränderung in der Position aktive Rechnungsabgrenzungen mit den Erkenntnissen aus E1-101 bis E1-306 plausibilisieren
    und in die Gesamtübersicht stille Reserven/Nettoauflösung (Anhang, Art. 959c Abs. 1 Ziff. 3 OR) übertragen. Methode wie Vorjahr? Fehlt der Nachweis: Pendenz.'
  nachweise:
  - Nachweis stille Reserven 31.12.2025 und 31.12.2024
  - Vollständigkeitserklärung
  - Anhang der Jahresrechnung
  rechnen: Stille Reserven aRA = Wert nach OR-Höchstbewertung − Buchwert; Veränderung = Bestand 31.12.2025 − Bestand 31.12.2024; Übertrag in Gesamtnachweis stille Reserven
  feststellung_wenn: Auflösung stiller Reserven in der Position nicht im Nachweis erfasst, wesentliche Nettoauflösung ohne Anhangangabe oder Nachweis fehlt (Pendenz).
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: ser-2022__anh-d-s072-2
    zitat: Plausibilisierung von Bestand und Veränderungen der stillen Reserven auf Basis der Erkenntnisse aus den Prüfungsarbeiten bei den einzelnen Bilanzpositionen
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
  - quelle: hwp-bur-2023__rz-0667-s296
    zitat: über den Bestand und die Veränderung stiller Reserven ausserhalb der Buchhaltung eine Kontrolle zu führen
