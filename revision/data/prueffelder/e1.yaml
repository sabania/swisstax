- id: E1-302
  vorgehen: 'Wesentliche Positionen: Beleg (Rechnung, Police) einsehen, Echtheit (Gegenpartei, Betrag, Zahlung 2025) prüfen, zeitanteiligen Betrag nachrechnen. Antizipative Aktiven:
    Bonität, Geldeingang 2026; transitorische: künftiger Nutzen. Bewertung wie Forderungen, analog SER Anh. D lit. d (Übrige Forderungen) i.V.m. HWP BuR Rz 263. Wertberichtigungs-/Korrekturbedarf
    mit Berechnung als Vorschlag zuhanden WP festhalten; keine Buchung, kein Entscheid.'
