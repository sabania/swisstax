bewertung:
- regel: Rechnungsabgrenzungen dienen der Ermittlung von Vermögen/Schulden am Stichtag und der periodengerechten Abgrenzung; in der Regel kurzfristig.
  quelle: hwp-bur-2023__rz-0255-s215
  zitat: Die Rechnungsabgrenzungen dienen sowohl der korrekten Ermittlung der Vermögenswerte und der Schulden auf den Bilanzstichtag als auch der periodengerechten Abgrenzung
- regel: 'Transitorische Aktiven: im alten Jahr bezahlter Aufwand des neuen Jahres (z.B. vorausbezahlte Mieten, Versicherungsprämien).'
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: vorausbezahlte Miet- und Pachtzinsen, Versicherungsprämien
- regel: 'Antizipative Aktiven: Erträge des alten Jahres mit Einnahme im neuen Jahr.'
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: wie beispielsweise Kapitalzinsen, Mieten, Provisionen und Umsatzprämien
- regel: Bewertung nach den Grundsätzen für Forderungen (Werthaltigkeit, ggf. Wertberichtigung).
  quelle: hwp-bur-2023__rz-0263-s216
  zitat: Die Rechnungsabgrenzungen sind nach den Grundsätzen, die für Forderungen bzw. Verbindlichkeiten gelten, zu bewerten.
- regel: Bilanzierung zum Nominalwert.
  quelle: hwp-bur-2023__rz-0263-s216
  zitat: Die Bilanzierung erfolgt zu Nominalwerten.
- regel: Aktivierung nur bei Verfügungsmacht, wahrscheinlichem Mittelzufluss und verlässlicher Schätzbarkeit.
  quelle: or__art-959
  zitat: ein Mittelzufluss wahrscheinlich ist
- regel: Bei konkreten Anzeichen einer Überbewertung Wert überprüfen und anpassen.
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- regel: Aktive und passive Abgrenzungen gesondert ausweisen, keine Saldierung.
  quelle: hwp-bur-2023__rz-0264-s216
  zitat: eine Saldierung der beiden Positionen ist nicht zulässig
- regel: Ausweis in der Regel kurzfristig; langfristige Anteile möglich (z.B. Disagio).
  quelle: hwp-bur-2023__rz-0264-s216
  zitat: Die aktiven und passiven Rechnungsabgrenzungen sind in der Regel im kurzfristigen Bereich auszuweisen.
- regel: Auflösung im neuen Jahr per Rückbuchung in die Aufwands-/Ertragskonten; diese gilt nicht als periodenfremd.
  quelle: hwp-bur-2023__rz-0261-s216
  zitat: dabei gilt die Rückbuchung nicht als periodenfremd
- regel: Bestandsaufnahme u.a. über Beurteilung von Aktiv-/Passivposten (Marchzinsen) und Vorjahresvergleich.
  quelle: hwp-bur-2023__rz-0262-s216
  zitat: im Zusammenhang mit der Beurteilung von Aktiv- und Passivposten (beispielsweise Marchzinsen)
- regel: Stille Reserven je Bilanzposition nach stetiger Methode ermitteln; nur Nettoauflösung im Anhang offenlegen.
  quelle: hwp-bur-2023__rz-0817-s341-t1
  zitat: Die stillen Reserven sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln
fallstricke:
- text: Saldierung von aktiven mit passiven Rechnungsabgrenzungen ist unzulässig – Bilanz und Detailaufstellungen 1300/2300 getrennt prüfen.
  quelle: hwp-bur-2023__rz-0264-s216
  zitat: eine Saldierung der beiden Positionen ist nicht zulässig
- text: Abgrenzung zu Anzahlungen ist unscharf; entscheidend ist die korrekte Fristigkeit. Vorauszahlungen für Waren/Anlagen gehören nicht zwingend in 1300.
  quelle: hwp-bur-2023__rz-0259-s215
  zitat: solange die Fristigkeit korrekt dargestellt ist
- text: Belassen-Methode (Saldo wird nicht zurückgebucht) nur in einfachen Fällen; sonst Gefahr veralteter Abgrenzungen.
  quelle: hwp-bur-2023__rz-0261-s216
  zitat: sollte aber nur in einfachen, übersichtlichen Fällen angewandt werden
- text: Erleichterung nach Art. 958b Abs. 2 OR betrifft nur die zeitliche Abgrenzung; sachliche Abgrenzungen bleiben Pflicht.
  quelle: hwp-bur-2023__rz-0019-s061
  zitat: Die sachlichen Abgrenzungen sind jedoch vorzunehmen.
- text: 'Mehrjährige Vorauszahlungen: Anteil über 12 Monate ist langfristig; Ausweis prüfen.'
  quelle: hwp-bur-2023__rz-0264-s216
  zitat: Langfristige Positionen können z.B. im Zusammenhang mit Disagio bzw. Agio von Anleihen bestehen
- text: Analytik in KMU durch stille Reserven verzerrt – Vergleichszahlen vorher bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- text: 'Agent führt keine Befragung selbst: nur schriftliche Antworten auswerten, sonst Frage als Pendenz; Visum bleibt offen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: WP-Schritte E1-303 bis E1-305 sind weitergehende Prüfungshandlungen – nur bei angenommenen wesentlichen Fehlaussagen oder erhöhtem inhärentem Risiko bzw. auf Anordnung des WP.
  quelle: hwp-er-2026__rz-0132-s203
  zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
    anzunehmen sind
- text: 'Mehrjährige Software-/Lizenzzahlungen: prüfen, ob eine Abgrenzung oder ein immaterieller Wert vorliegt und ob der Nutzen im Folgejahr tatsächlich anfällt (Praxis, keine Quelle).'
fragen_kunde:
- frage: Sind die aktivierten Beträge je Position werthaltig, d.h. wird die vorausbezahlte Leistung 2026 noch bezogen (Vertrag ungekündigt, Lieferant leistungsfähig) bzw. ist der Geldeingang
    der abgegrenzten Erträge gesichert?
  zweck: 'E1-101 / E1-302: Bewertung (künftiger Geld- oder Nutzenzugang)'
- frage: Worauf sind die Veränderungen des Kontos 1300 gegenüber dem Vorjahr (neue, weggefallene, veränderte Positionen) zurückzuführen?
  zweck: 'E1-201: Begründung von Abweichungen zum Vorjahresbestand'
- frage: Wie erklären sich wesentliche Abweichungen der zugehörigen Aufwands- und Ertragskonten (z.B. Versicherungen, Software/Lizenzen, Miete, Zinsertrag) gegenüber dem Vorjahr?
  zweck: 'E1-202: Besprechung wesentlicher Abweichungen mit der Unternehmensleitung'
- frage: Wie werden die aktiven Abgrenzungen ermittelt (Verfahren, Durchsicht welcher Konten, Rückbuchungs- oder Belassen-Methode) und wurden auch antizipative Erträge (Zinsen, Boni,
    Rückvergütungen, Provisionen) erfasst?
  zweck: 'E1-303 / E1-306: Vollständigkeit und korrekte Verbuchung'
- frage: Bestehen aktive Abgrenzungen gegenüber Aktionären, Organen, nahestehenden Personen oder Gesellschaften, an denen eine Beteiligung besteht?
  zweck: 'E1-203: Ausweis nach Art. 959a Abs. 4 OR'
- frage: Wurden in der Position stille Reserven gebildet oder aufgelöst (z.B. bewusster Verzicht auf Aktivierung) und wurde die Berechnungsmethode gegenüber dem Vorjahr beibehalten?
  zweck: 'E1-320: Bestand und Veränderung stiller Reserven'
- frage: Enthält die Position Anteile mit Leistungszeitraum über 12 Monate nach dem Bilanzstichtag oder Anzahlungen für Waren/Anlagen?
  zweck: Darstellung/Fristigkeit (E1-301)
