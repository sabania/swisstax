# Prüffeld E1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: E1
bezeichnung: Aktive Rechnungsabgrenzung
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: true
kurzbeschrieb: 'Aktive Rechnungsabgrenzungen (Konto 1300): transitorische Aktiven (2025 bezahlter Aufwand des Folgejahres) und antizipative Aktiven (Ertrag 2025, Geldeingang 2026). Eingeschränkte
  Revision: Bestand, Vollständigkeit, Bewertung (künftiger Geld- oder Nutzenzugang) und Periodenabgrenzung mit Befragung, Analytik und Abstimmung der Detailaufstellung; Abgrenzungen
  ggü. Nahestehenden erkennen.'
gesetz:
- thema: 'Mindestgliederung: aktive Rechnungsabgrenzungen als eigene Position im Umlaufvermögen (Art. 959a Abs. 1 Ziff. 1 lit. e OR)'
  quelle: or__art-959a-t1
  zitat: e. aktive Rechnungsabgrenzungen
- thema: Zeitliche und sachliche Abgrenzung von Aufwand und Ertrag (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erleichterung bei Nettoerlösen/Finanzerträgen bis CHF 100''000: Verzicht auf zeitliche Abgrenzung (Art. 958b Abs. 2 OR)'
  quelle: or__art-958b
  zitat: kann auf die zeitliche Abgrenzung verzichtet und stattdessen auf Ausgaben und Einnahmen abgestellt werden
- thema: Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR)
  quelle: or__art-959
  zitat: wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist und ihr Wert verlässlich geschätzt werden kann
- thema: Zuordnung Umlaufvermögen (Art. 959 Abs. 3 OR)
  quelle: or__art-959
  zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden oder anderweitig realisiert
    werden
- thema: Bestandesnachweis durch Inventar/Detailaufstellung (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Verrechnungsverbot (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Überprüfung bei Anzeichen einer Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Höchstbewertung zu Anschaffungskosten (Art. 960a Abs. 2 OR)
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Stille Reserven durch zusätzliche Abschreibungen/Wertberichtigungen (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Gesonderter Ausweis von Forderungen und Verbindlichkeiten gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR); gilt für Forderungen – für aRA
    kann auf die Aufgliederung verzichtet werden (hwp-bur-2023__rz-0174-s195); relevant, wenn Vorschüsse/Darlehen an Nahestehende als aRA verbucht sind
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: Belegnachweis für Bildung und Auflösung (Art. 957a Abs. 2 Ziff. 2 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: Prüfungsumfang der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: 'Überbewertung: aktivierte Beträge ohne künftigen Geld- oder Nutzenzugang (Leistung entfällt, Vertrag gekündigt, Gegenpartei insolvent, antizipativer Ertrag nicht einbringlich).'
  pruefziele:
  - BE
  - EX
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven
- text: 'Nicht existierende oder zu hohe transitorische Aktiven: Aufwand des laufenden Jahres wird als Aufwand des Folgejahres aktiviert (Ergebnisverbesserung).'
  pruefziele:
  - EX
  - EN
  - PA
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- text: 'Unvollständige antizipative Aktiven: Erträge 2025 (Zinsen, Mieten, Provisionen, Umsatzprämien/Boni) mit Geldeingang 2026 nicht erfasst.'
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: 'Antizipative Aktiven: Erträge des alten Jahres, die erst im neuen Jahr zu Einnahmen führen'
- text: 'Falsche Periodenabgrenzung: zeitanteiliger Betrag falsch berechnet oder Leistungszeitraum betrifft ganz/teilweise 2025.'
  pruefziele:
  - PA
  - BE
  - RI
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- text: Vorjahresabgrenzung nicht oder falsch aufgelöst (doppelte Aktivierung) bzw. bei Belassen-Methode nicht an die aktuelle Situation angepasst.
  pruefziele:
  - EX
  - PA
  quelle: hwp-bur-2023__rz-0261-s216
  zitat: Oder die Rechnungsabgrenzungsposten werden belassen und beim nächsten Zwischen- oder Jahresabschluss, falls erforderlich, an die aktuelle Situation angepasst.
- text: 'Fehlerhafter Ausweis: Saldierung mit passiven Abgrenzungen oder falsche Fristigkeit (Anteile, die erst später als 12 Monate nach dem Stichtag realisiert werden, im Umlaufvermögen).'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0264-s216
  zitat: eine Saldierung der beiden Positionen ist nicht zulässig
- text: Vorschüsse oder Darlehen an Nahestehende werden als aktive Rechnungsabgrenzung verbucht und umgehen so den gesonderten Ausweis von Forderungen nach Art. 959a Abs. 4 OR (aRA selbst
    sind keine Forderungen im Sinne der Mindestgliederung).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0174-s195
  zitat: da diese keine Forderungen und Verbindlichkeiten im Sinne der Mindestgliederungsvorschriften von Art. 959a Abs. 1 und Abs. 2 OR darstellen
- text: Vorauszahlungen bzw. Abgrenzungen gegenüber Nahestehenden sind nicht geschäftlich begründet, betreffen eine Verpflichtung des Eigentümers statt der Gesellschaft oder sind nicht
    zu Drittpreisen vereinbart.
  pruefziele:
  - EN
  - RV
  - BE
  quelle: hwp-er-2026__rz-0161-s212
  zitat: Beurteilung der (Transfer-)Preise der jeweiligen Geschäftsvorfälle mittels Drittvergleichs
- text: Bestand/Veränderung stiller Reserven in der Position nicht im Nachweis erfasst; wesentliche Nettoauflösung ohne Anhangangabe.
  pruefziele:
  - VO
  - BE
  - DO
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
