  - Rechnungen/Policen der abgegrenzten Positionen
  - Zahlungsbelege 2025
  - Zahlungseingänge 2026 (antizipative Aktiven)
  - Detailaufstellung 1300
  rechnen: 'Transitorisch (2025 bezahlt, Leistung 2026): Abgrenzung = Rechnungsbetrag × Tage Leistungszeitraum nach 31.12.2025 / Tage gesamter Leistungszeitraum. Antizipativ (Ertrag
    2025, Geldeingang 2026, z.B. Marchzins, Miete, Bonus): Abgrenzung = Ertrag der Abrechnungsperiode × Tage der Periode bis 31.12.2025 / Tage gesamte Abrechnungsperiode. Zähler und
    Nenner in derselben Einheit (Tage; bei Perioden in ganzen Monaten Monate). Differenz zum gebuchten Betrag mit `rechne`'
