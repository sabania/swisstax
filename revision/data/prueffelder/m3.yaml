schritte:
- id: M3-101
  vorgehen: 'Agent befragt nicht selbst: schriftliche Antwort (Kundenbefragung 10.11) auswerten, sonst Frage als Pendenz. Gefragt: Prozess zur vollständigen Erfassung der passiven Abgrenzungen
    (Verantwortliche, Quellen wie Verträge, Kreditoreneingang neue Rechnung, Liste wiederkehrender Abgrenzungen) und pendente Risiken für kurzfristige Rückstellungen. Antwort mit Detailliste
    und Kreditorenjournal Folgejahr plausibilisieren; Fragen/Antworten dokumentieren.'
  nachweise:
  - Schriftliche Antwort Kundenbefragung (10.11) bzw. Pendenz
  - Detailliste passive Rechnungsabgrenzungen 31.12.
  - Aktennotizen/Protokolle zu pendenten Risiken
  - Kreditorenjournal Folgejahr
  rechnen: ''
  feststellung_wenn: Kein geregelter Abgrenzungsprozess, Antwort widerspricht Detailliste/Kreditorenjournal oder genanntes Risiko ohne Rückstellung bzw. Anhangangabe; fehlende Antwort
    = Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s087-1
    zitat: Befragung über den Prozess zur Sicherstellung der Vollständigkeit der passiven Rechnungsabgrenzungen
  - quelle: ser-2022__anh-d-s088-1
    zitat: Befragung über pendente Risiken (Rechtsfälle, angedrohte Schadenersatz- und andere Ansprüche usw.), die eine Rückstellung erfordern
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: M3-201
  vorgehen: Aus der Saldoliste die Aufwands- und Ertragskonten mit typischen Abgrenzungen (Miete, Energie, Telefon, Beratung/Revision, Zinsen, Löhne, Steuern) mit Vorjahr vergleichen;
    Veränderung absolut und in % rechnen. Abweichungen über der Schwelle als Frage an die GL (Pendenz), Antworten plausibilisieren und mit der Bestandsveränderung (M3-202) abgleichen;
    im Textfeld dokumentieren.
  nachweise:
  - Saldoliste Geschäftsjahr mit Vorjahr
  - Kontoblätter der Aufwandskonten
  - Antwort GL zu Abweichungen
  rechnen: Veränderung = Saldo GJ – Saldo VJ; Abweichung % = Veränderung / |Saldo VJ|; Prüfen ab Schwelle gemäss Wesentlichkeit
  feststellung_wenn: Wesentlicher Aufwandsrückgang ohne plausible Begründung (Hinweis auf fehlende Abgrenzung) oder Erklärung der GL widerspricht Belegen bzw. Verträgen.
  fundstellen:
  - quelle: ser-2022__anh-d-s087-1
    zitat: Vergleich der Salden zugehöriger Aufwands- und Ertragskonten mit denjenigen vorangegangener Perioden; Besprechung wesentlicher Abweichungen mit der Unternehmensleitung
  - quelle: ser-2022__6-1-2-t3
    zitat: Auch für eine begrenzte Prüfungssicherheit ist es notwendig, die im Rahmen der Abweichungsanalyse erhaltenen Aussagen zu plausibilisieren.
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
- id: M3-202
  vorgehen: 'Bestände der passiven Abgrenzungen und kurzfristigen Rückstellungen je Konto und je Position der Detailliste mit dem Vorjahr (Vorjahresakte) vergleichen: weggefallene, neue
    und stark veränderte Positionen markieren, wiederkehrende Abgrenzungen (Revision, Energie, Zinsen, Ferien, Steuern) auf Vorhandensein prüfen. Ursachen aus Belegen erklären oder erfragen
    und im Textfeld festhalten.'
  nachweise:
  - Detaillisten passive Abgrenzungen/Rückstellungen GJ und VJ
  - Saldoliste
  - Vorjahresakte
  rechnen: Veränderung je Konto = Saldo 31.12. GJ – Saldo 31.12. VJ; Positionen des Vorjahres ohne Gegenstück im Geschäftsjahr auflisten
  feststellung_wenn: Wiederkehrende Abgrenzung fehlt, wesentliche Veränderung bleibt unerklärt oder Rückstellung wurde ohne Begründung reduziert bzw. aufgelöst.
  fundstellen:
  - quelle: ser-2022__anh-d-s087-1
    zitat: Vergleich mit den Beständen des Vorjahres
  - quelle: ser-2022__anh-d-s088-1
    zitat: Vergleich mit den Beständen des Vorjahres
  - quelle: hwp-bur-2023__rz-0262-s216
    zitat: durch Vergleich mit den im Vorjahr ausgewiesenen Rechnungsabgrenzungen
- id: M3-301
  vorgehen: 'Detailliste der passiven Abgrenzungen und Rückstellungsspiegel beschaffen, Summen nachrechnen und mit Saldoliste/Bilanz abstimmen. Kritische Durchsicht: Gläubiger, Leistungszeitraum,
    Grundlage, Fristigkeit, Klassierung (Abgrenzung/Rückstellung/Verbindlichkeit); pauschale, runde oder unbelegte Positionen und offensichtlich Fehlendes (Revisionshonorar, Steuern,
    Ferien) markieren.'
  nachweise:
  - Detailliste passive Rechnungsabgrenzungen
  - Rückstellungsspiegel
  - Saldoliste/Bilanz 31.12.
  - Jahresrechnung
  rechnen: 'Σ Detailliste = Saldo Konto 2300 (bzw. Total pRA); Spiegel je Konto: Stand 01.01. + Bildung – Verwendung – Auflösung = Stand 31.12. = Saldo; Stand 01.01. = Stand 31.12. VJ'
  feststellung_wenn: Differenz Detailliste/Spiegel zu Saldo, keine Detailliste, Position ohne Grundlage, falsche Fristigkeit/Klassierung oder offensichtlich fehlende Abgrenzung.
  fundstellen:
  - quelle: ser-2022__anh-d-s088-1
    zitat: Abstimmung einer Detailaufstellung mit der Jahresrechnung und kritische Durchsicht
  - quelle: ser-2022__anh-d-s087-1
    zitat: Abstimmung einer Detailaufstellung mit der Jahresrechnung
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-bur-2023__rz-0505-s259
    zitat: Der Grundsatz der Ordnungsmässigkeit macht es erforderlich, die Zusammensetzung der Rückstellungen nach sachlichen Kriterien zu dokumentieren.
- id: M3-302
  vorgehen: WP-Schritt, nur vorbereiten. Kontoblätter der Konten mit typischen Abgrenzungen (Miete, Energie, Telefon, Honorare, Zinsen, Versicherungen) auf Anzahl Monatsbelastungen und
    Periodenzugehörigkeit durchsehen; erwarteten Jahresaufwand aus Verträgen rechnen und Lücken als mögliche fehlende Abgrenzung im Textfeld auflisten. Beurteilung durch den WP.
  nachweise:
  - Kontoblätter Aufwand/Ertrag des Geschäftsjahrs
  - Verträge (Miete, Darlehen, Service)
  - Detailliste passive Abgrenzungen
  rechnen: Erwarteter Aufwand = Monatsbetrag gemäss Vertrag × 12; Differenz zu gebuchtem Aufwand (nach Rückbuchung VJ-Abgrenzung) = mögliche Abgrenzungslücke
  feststellung_wenn: Fehlende Monatsbelastungen oder Aufwand des Geschäftsjahrs ohne Abgrenzung über der Wesentlichkeitsschwelle.
  fundstellen:
  - quelle: ser-2022__anh-d-s087-1
    zitat: Kritische Durchsicht von Aufwands- und Ertragskonten, welche häufig passive Rechnungsabgrenzungen enthalten
  - quelle: hwp-bur-2023__rz-0262-s216
    zitat: mittels Durchsicht der einzelnen Aufwands- und Ertragskonten im Hinblick auf die richtige Periodenabgrenzung
  - quelle: hwp-bur-2023__rz-0257-s215
    zitat: wie beispielsweise Darlehens- und Hypothekenzinsen, Mieten, Löhne, Steuern, Provisionen, noch nicht fakturierte Beraterhonorare
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
- id: M3-304
  vorgehen: 'WP-Schritt, nur vorbereiten. Wesentliche Positionen von Detailliste und Rückstellungsspiegel mit Unterlagen abstimmen: Verträge, Rechnungen neue Rechnung, Ferien-/Überzeitsaldi
    × Lohnansatz, Aktennotizen, Klageschriften, Berechnungen. Abweichungen und fehlende Unterlagen (Pendenz) im Textfeld. Anwaltsbestätigung nicht einfordern; vom Unternehmen eingeholte
    Stellungnahme verwenden.'
  nachweise:
  - Verträge/Rechnungen zu Abgrenzungen
  - Ferien-/Überzeitsaldi 31.12.
  - Aktennotizen, Klageschriften, Berechnungen zu Rückstellungen
  - Stellungnahme Rechtsvertreter (falls vorhanden)
  rechnen: Abgrenzung = Vertragsbetrag × Anteil Leistungszeitraum im GJ; Ferien/Überzeit = Σ je MA (Feriensaldo Tage × Tageslohn + Überzeit h × Stundenlohn) vs. Saldo; Rückstellung vs.
    dokumentierte Bandbreite
  feststellung_wenn: Position nicht belegt, Betrag weicht wesentlich von Unterlage/Berechnung ab oder Rückstellung liegt unter der dokumentierten Schätzung bzw. Bandbreite.
  fundstellen:
  - quelle: ser-2022__anh-d-s087-1
    zitat: Abstimmung der Bestände mit geeigneten Unterlagen (Verträge usw.)
  - quelle: ser-2022__anh-d-s088-1
    zitat: Abstimmung der Bestände mit geeigneten Unterlagen (Verträge, Klageschriften, Berechnungen usw.)
  - quelle: hwp-er-2026__rz-0139-s204-t2
    zitat: Abstimmungen mit Verträgen oder die Kontendurchsicht in neuer Rechnung können helfen, das Risiko zu reduzieren.
  - quelle: hwp-er-2026__rz-0139-s204-t3
    zitat: Liegt eine Bestätigung im Zeitpunkt der Abschlusserstellung vor, wird der Abschlussprüfer diese als Prüfungsnachweis betrachten
  - quelle: qa-or-rechnungslegung-2026__2-2-t1
    zitat: Multiplikation (pro Mitarbeiter) der Ferien- oder Überzeitguthaben in Stunden mit dem Stundensatz für Lohnkosten, Sozialleistungen etc.
- id: M3-305
  vorgehen: 'WP-Schritt, nur vorbereiten. Kontoblätter, Kreditorenjournal und Zahlungen in neuer Rechnung bis zum Prüfungsdatum durchsehen: Abgrenzungen/Rückstellungen mit effektiven
    Rechnungen, Zahlungen, Gutschriften, Vergleichen oder Urteilen vergleichen; Rechnungen mit Leistung bis 31.12. ohne Abgrenzung oder Kreditor auflisten. Ereignisse nach dem Bilanzstichtag
    im Textfeld festhalten.'
  nachweise:
  - Kontoblätter Folgejahr
  - Kreditorenjournal Folgejahr
  - Zahlungsausgänge
  - Korrespondenz/Vergleich zu Rechtsfällen
  rechnen: Differenz = Abgrenzung bzw. Rückstellung 31.12. – effektive Rechnung/Zahlung in neuer Rechnung; Σ Rechnungen mit Leistungsdatum ≤ 31.12. ohne Abgrenzung/Kreditor
  feststellung_wenn: Wesentliche Rechnung für Leistung des Geschäftsjahrs ohne Abgrenzung, effektiver Betrag deutlich über Rückstellung oder Ereignis nach Stichtag erhellt ein Risiko
    am Stichtag.
  fundstellen:
  - quelle: ser-2022__anh-d-s087-1
    zitat: Kontendurchsicht betreffend die weitere Entwicklung in neuer Rechnung
  - quelle: ser-2022__anh-d-s088-1
    zitat: Kontendurchsicht betreffend die weitere Entwicklung in neuer Rechnung
  - quelle: hwp-er-2026__rz-0321-s255-t2
    zitat: ob Ereignisse eingetreten sind, die für die Ermittlung von geschätzten Werten oder Rückstellungen im Abschluss relevant sind
  - quelle: hwp-bur-2023__rz-0517-s262
    zitat: Verluste, deren Ursache vor dem Abschlussstichtag liegt, die aber erst danach, jedoch vor Erstellung des Abschlusses bekannt werden, müssen zurückgestellt werden.
- id: M3-320
  vorgehen: 'Anhang auf Angaben mit Bezug zu M3 prüfen: Eventualverbindlichkeiten (z.B. Rechtsstreit ohne oder mit nur teilweiser Rückstellung), Erläuterung ausserordentlicher/periodenfremder
    Bildungen und Auflösungen, wesentliche Ereignisse nach dem Bilanzstichtag, Grundsätze. Mit Ergebnissen M3-101/304/305/321 abgleichen und Bedarf an Prüffeld T1 übergeben.'
  nachweise:
  - Anhang zur Jahresrechnung
  - Rückstellungsspiegel
  - Arbeitspapiere M3-101/304/305/321
  rechnen: ''
  feststellung_wenn: Pflichtangabe (Eventualverbindlichkeit, a.o. Position, Ereignis nach Stichtag, Nettoauflösung stiller Reserven) fehlt oder widerspricht den Prüfungsergebnissen.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
      (Eventualverbindlichkeit)
  - quelle: or__art-959c-t2
    zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach rechtlichen oder tatsächlichen Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt
      werden kann
  - quelle: hwp-er-2026__rz-0139-s204-t2
    zitat: Um das Prüfungsrisiko in den Aussagen «Vollständigkeit» der Rückstellungen und «Offenlegung» im Anhang auf ein vertretbares Mass zu reduzieren
  - quelle: hwp-bur-2023__rz-0855-s351-t1
    zitat: Wird gegen ein Unternehmen Klage erhoben und ist ein negativer Prozessausgang möglich
- id: M3-321
  vorgehen: 'Detailnachweis stille Reserven beschaffen: in Rückstellungen/Abgrenzungen enthaltene, nicht betriebsnotwendige Beträge (z.B. nicht mehr begründete Rückstellungen) je Position
    mit Vorjahr abstimmen, Veränderung aus dem Rückstellungsspiegel (Auflösungen, Neubildungen) nachvollziehen und Methode mit Vorjahr vergleichen. Nettoauflösung an Prüffeld stille
    Reserven/Anhang (T1) übergeben.'
  nachweise:
  - Detailnachweis stille Reserven GJ/VJ
  - Rückstellungsspiegel
  - Vollständigkeitserklärung
  rechnen: Stille Reserve je Position = gebuchter Betrag – betriebswirtschaftlich notwendiger Betrag; Veränderung = Bestand 31.12. – Bestand 01.01.; negative Veränderung = Auflösung
  feststellung_wenn: Kein Nachweis, Methode geändert, nicht begründete Rückstellung nicht als stille Reserve erfasst oder wesentliche Nettoauflösung ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr und Plausibilisierung mit den Prüfungsresultaten in den einzelnen Bilanzpositionen
  - quelle: hwp-bur-2023__rz-0506-s259
    zitat: Werden sie beibehalten, handelt es sich um eine Bildung stiller Reserven
  - quelle: hwp-bur-2023__rz-0817-s341-t1
    zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
- id: M3-322
  vorgehen: 'Dauerakte in M-Files prüfen und ergänzen: Miet-, Darlehens-, Leasing- und Serviceverträge mit Abgrenzungsbezug, interne Rückstellungs-/Garantierichtlinien, Unterlagen zu
    mehrjährigen Rechtsfällen, Personal-/Ferienreglement. Fehlende oder veraltete Dokumente als Pendenz erfassen; nichts löschen.'
  nachweise:
  - Dauerakte M-Files
  - Neue Verträge/Reglemente/Richtlinien des Geschäftsjahrs
  rechnen: ''
  feststellung_wenn: 'Nur Pendenz: Dauerakte fehlt oder ist veraltet (z.B. neuer Mietvertrag, neue Rückstellungsrichtlinie, laufender Rechtsfall nicht abgelegt).'
  fundstellen:
  - quelle: ser-2022__7-3
    zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt
- id: M3-401
  vorgehen: 'Nur auf Anweisung des WP. Buchungen von Bildung, Verwendung und Auflösung je Konto (inkl. Rückbuchung der VJ-Abgrenzungen) mit Belegen und Gegenkonten abstimmen: Bildung
    zulasten der sachlich zugehörigen Position, Verwendung als Bestandsbuchung nur für artgleiche Posten, Auflösung über Erfolgsrechnung mit sachgerechtem Ausweis. Abweichungen als Wesentliche
    Feststellung mit Buchungsvorschlag (nicht buchen).'
  nachweise:
  - Kontoblätter Abgrenzungs- und Rückstellungskonten
  - Buchungsbelege Bildung/Verwendung/Auflösung
  - Rückstellungsspiegel
  rechnen: 'Je Konto: Saldo 01.01. – Rückbuchung/Verwendung/Auflösung + Bildung = Saldo 31.12.; Σ Bildungen = Belastungen der Gegenkonten gemäss Kontoblatt'
  feststellung_wenn: Buchung ohne Beleg, Bildung oder Auflösung über sachfremdes Konto, artfremde Verwendung oder Umgehung der Erfolgsrechnung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0504-s259
    zitat: Die Bildung einer Rückstellung erfolgt zulasten jener Position der Erfolgsrechnung, welcher der zugrunde liegende Vorgang inhaltlich zufällt.
  - quelle: hwp-bur-2023__rz-0507-s259
    zitat: Die Verwendung zweckbestimmter Rückstellungen erfolgt als Bestandsbuchung.
  - quelle: hwp-bur-2023__rz-0508-s260
    zitat: Eine Inanspruchnahme von Rückstellungen durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig.
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
