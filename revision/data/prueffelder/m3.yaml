- id: M3-305
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP; sonst «nicht bearbeitet – WP-Schritt», kein Textfeld-Eintrag. Hinweise aus M3-101/201/202/301 (z.B. fehlende wiederkehrende
    Abgrenzung, Rechtsfall) nur als Notiz «Schlussbesprechung» bzw. «Pendenz»; ob weiter gehend geprüft wird (SER Anh. D l/m), entscheidet der WP. Auf Anweisung: Kontoblätter, Kreditorenjournal,
    Zahlungen neue Rechnung bis Prüfungsdatum durchsehen: Abgrenzungen/Rückstellungen mit Rechnungen, Zahlungen, Gutschriften, Vergleichen, Urteilen vergleichen; GJ-Leistungen ohne Abgrenzung/Kreditor
