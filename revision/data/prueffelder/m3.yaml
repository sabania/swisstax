  - Detailliste passive Abgrenzungen
  rechnen: Erwarteter Aufwand = Monatsbetrag gemäss Vertrag × 12; gebuchter Periodenaufwand nach Berücksichtigung der Rückbuchung bzw. der Auflösung über das Abgrenzungskonto; Differenz
    = mögliche Abgrenzungslücke
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Fehlende Monatsbelastungen oder Aufwand des Geschäftsjahrs ohne Abgrenzung über der Wesentlichkeitsschwelle.'
