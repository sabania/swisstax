- id: M3-304
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP; sonst «nicht bearbeitet – WP-Schritt», kein Textfeld-Eintrag. Hinweise aus M3-101/201/202/301 (z.B. fehlende wiederkehrende
    Abgrenzung, Rechtsfall) nur als Notiz «Schlussbesprechung» bzw. «Pendenz»; ob weiter gehend geprüft wird (SER Anh. D l/m), entscheidet der WP. Auf Anweisung: Wesentliche Positionen
    mit Verträgen, Rechnungen neue Rechnung, Ferien-/Überzeitsaldi (Lohnansatz inkl. Sozialleistungen), Aktennotizen, Klageschriften, Berechnungen abstimmen; möglichen Fehlbetrag beziffern.
    Anwaltsbestätigung nicht einfordern, vorhandene Stellungnahme verwenden.'
  nachweise:
  - Verträge/Rechnungen zu Abgrenzungen
  - Ferien-/Überzeitsaldi 31.12.
  - Lohnansätze und Sozialleistungssatz (Prüffeld R1 bzw. Pendenz)
  - Aktennotizen, Klageschriften, Berechnungen zu Rückstellungen
  - Stellungnahme Rechtsvertreter (falls vorhanden)
  - Wesentlichkeit (revio 3.3)
  rechnen: 'Abgrenzung = Vertragsbetrag × Anteil Leistungszeitraum im GJ; Ferien/Überzeit = Σ je MA (Feriensaldo Tage × Tageslohn + Überzeit h × Stundenlohn) × (1 + AG-Sozialleistungssatz)
    vs. Saldo Ferien-/Überzeitabgrenzung; möglicher Fehlbetrag Rückstellung = bestmögliche Schätzung (inkl. Prozesskosten) – gebuchte Rückstellung; zusätzlich Spanne ausweisen: (unteres
    Ende + Prozesskosten – gebucht) bis (oberes Ende + Prozesskosten – gebucht); liegt die gebuchte Rückstellung am oder unter dem unteren Ende: Hinweis Vorsichtsprinzip (eher oberes
    Ende) an den WP; Vergleich mit der Wesentlichkeit'
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Position nicht belegt, Betrag weicht wesentlich ab (z.B. Ferien ohne Sozialleistungen) oder Rückstellung unter Schätzung/Bandbreite
    inkl. Prozesskosten: Wesentliche Feststellung mit Buchungsvorschlag (nicht buchen).'
  fundstellen:
  - quelle: ser-2022__anh-d-s088-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
