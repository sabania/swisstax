- id: M3-401
  vorgehen: 'Nur auf Anweisung des WP (4xx). Buchungen von Bildung, Verwendung und Auflösung je Konto (inkl. Rückbuchung der VJ-Abgrenzungen) mit Belegen und Gegenkonten abstimmen: Bildung
    zulasten der sachlich zugehörigen Position, Verwendung als Bestandsbuchung nur für artgleiche Posten, Auflösung über Erfolgsrechnung mit sachgerechtem Ausweis. Abweichungen als Wesentliche
    Feststellung mit Buchungsvorschlag (nicht buchen).'
