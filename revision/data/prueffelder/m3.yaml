# Prüffeld M3 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: M3
bezeichnung: Passive Rechnungsabgrenzungen und kurzfristige Rückstellungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: true
  ergaenzt: '2026-11-13 Runde R2: Wissenslücken aus E2E-Lauf ergänzt (Zitate maschinell geprüft, Zweitprüfung offen)'
kurzbeschrieb: 'Passive Rechnungsabgrenzungen (GJ-Aufwand, im Folgejahr bezahlt, z.B. Honorare, Zinsen, Ferien/Überzeit inkl. Sozialleistungen, Steuern) und kurzfristige Rückstellungen
  (Art. 959 OR). Fokus: Vollständigkeit, Periodenabgrenzung, Bewertung; Befragung, Vorjahresanalytik, Abstimmung Detailliste.'
gesetz:
- thema: Zeitliche und sachliche Abgrenzung (Periodenabgrenzung)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Vollständigkeit der Rechnungslegung
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- thema: Bestandesnachweis durch Inventar/Detailaufstellung
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Bilanzierungspflicht von Verbindlichkeiten
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden, ein Mittelabfluss wahrscheinlich ist und ihre Höhe verlässlich
    geschätzt werden kann.
- thema: Fristigkeit kurzfristig/langfristig
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: 'Mindestgliederung: passive Rechnungsabgrenzungen (kurzfristiges Fremdkapital, Art. 959a Abs. 2 Ziff. 1 lit. d OR)'
  quelle: or__art-959a-t1
  zitat: passive Rechnungsabgrenzungen
- thema: 'Mindestgliederung: Rückstellungen (Art. 959a Abs. 2 Ziff. 2 lit. c OR)'
  quelle: or__art-959a-t1
  zitat: Rückstellungen sowie vom Gesetz vorgesehene ähnliche Positionen
- thema: Vorsichtige Bewertung; Anpassung bei zu geringen Rückstellungen
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Bewertung Verbindlichkeiten zum Nennwert
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Pflicht zur Bildung von Rückstellungen
  quelle: or__art-960e
  zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
    gebildet werden.
- thema: Nicht mehr begründete Rückstellungen (Wahlrecht, stille Reserven)
  quelle: or__art-960e
  zitat: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden.
- thema: 'Anhang: Aufschlüsselungen zu Bilanzpositionen'
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: 'Anhang: Nettoauflösung stiller Reserven'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
    übersteigt
- thema: 'Anhang: Eventualverbindlichkeiten'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: 'Anhang: ausserordentliche/periodenfremde Positionen'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: 'Anhang: Ereignisse nach dem Bilanzstichtag'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
risiken:
- text: 'Vollständigkeit ist anspruchsvoll: Fehlende Abgrenzungen/Rückstellungen stehen in keiner Detailliste; nötig ist ein Erwartungsbild aus dem Verständnis des Unternehmens (wiederkehrende
    Abgrenzungen, Verträge, Rechtsfälle) und die Durchsicht der Ereignisse nach dem Bilanzstichtag.'
  pruefziele:
  - VO
  quelle: ser-2022__4-3-4
  zitat: Die Vollständigkeit ist ein anspruchsvolles Prüfungsziel.
- text: 'Unvollständige passive Rechnungsabgrenzungen: Aufwand des Geschäftsjahrs (z.B. Honorare inkl. Revision, Energie, Telefon, Zinsen, Miete, Subunternehmerleistungen), der erst
    im Folgejahr fakturiert oder bezahlt wird, ist nicht abgegrenzt.'
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
- text: Fehlende oder zu tiefe kurzfristige Rückstellungen für pendente Risiken (Rechtsfälle, Mängelrügen, Garantie- und Schadenersatzansprüche).
  pruefziele:
  - VO
  - BE
  quelle: hwp-bur-2023__rz-0510-s260
  zitat: Zur Ermittlung des Rückstellungsbedarfs sind sämtliche am Abschlussstichtag bestehenden sowie die erkennbaren und vor dem Stichtag verursachten Risiken und Lasten
- text: 'Unterbewertung: Rückstellung unter der bestmöglichen Schätzung bzw. am unteren Ende der dokumentierten Bandbreite, ohne Prozesskosten, oder schrittweiser Aufbau über mehrere
    Jahre.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: Das Vorsichtsprinzip impliziert, dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist.
- text: Ferien- und Überzeitguthaben pauschal statt auf Basis der Saldi je Mitarbeiter abgegrenzt.
  pruefziele:
  - BE
  - VO
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Abgrenzungen in Form von Pauschalbeträgen oder Berechnungen auf der Basis von entgangenem Umsatz oder Gewinn sind nicht angemessen.
- text: Laufende Steuern des Geschäftsjahrs nicht abgegrenzt (Schnittstelle Prüffeld S1).
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0546-s269
  zitat: Geschuldete Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den passiven Rechnungsabgrenzungen auszuweisen.
- text: Nicht mehr begründete oder überhöhte Rückstellungen/Abgrenzungen werden beibehalten (stille Reserven) bzw. Auflösungen ohne Anhangangabe zur Ergebnisverbesserung genutzt.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0506-s259
  zitat: Werden sie beibehalten, handelt es sich um eine Bildung stiller Reserven
- text: 'Falsche Klassierung: Rückstellung vs. passive Abgrenzung vs. Verbindlichkeit vs. Eventualverbindlichkeit; kurz- vs. langfristig; Saldierung mit aktiven Abgrenzungen.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0518-s262
  zitat: Je nach erwartetem Zeitpunkt des Mittelabflusses werden sie als kurzfristiges oder langfristiges Fremdkapital bilanziert.
- text: Artfremde Verwendung oder Umbenennung von Rückstellungen unter Umgehung der Erfolgsrechnung; Verwendung in neuer Rechnung über Aufwand/Ertrag statt als Bestandsbuchung.
  pruefziele:
  - RI
  - PA
  quelle: hwp-bur-2023__rz-0508-s260
  zitat: Eine Inanspruchnahme von Rückstellungen durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig.
- text: Fehlende oder unvollständige Offenlegung im Anhang (Eventualverbindlichkeit aus Rechtsstreit, a.o. Rückstellungsbildung, Ereignisse nach Bilanzstichtag).
  pruefziele:
  - DO
  quelle: hwp-er-2026__rz-0139-s204-t4
  zitat: weil beispielsweise die Rückstellungen nach wie vor zu niedrig ausgewiesen sind oder die Offenlegung im Anhang fehlt oder unvollständig ist
- text: Nicht bestehende oder doppelt erfasste Abgrenzungen (z.B. Rechnung bereits als Kreditor gebucht und zusätzlich abgegrenzt).
  pruefziele:
  - EX
  - RI
  quelle: hwp-er-2026__rz-0115-s200
  zitat: der Verhinderung der mehrfachen Erfassung von Belegen
