# Prüffeld M3 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: M3
bezeichnung: Passive Rechnungsabgrenzungen und kurzfristige Rückstellungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: false
kurzbeschrieb: 'Passive Rechnungsabgrenzungen (Aufwand des Geschäftsjahrs, der erst im Folgejahr bezahlt wird, z.B. Honorare, Energie, Zinsen, Ferien/Überzeit, Steuern; vorausbezahlte
  Erträge) und kurzfristige Rückstellungen (Mittelabfluss innert 12 Monaten, z.B. Prozessrisiken). Schwerpunkt: Vollständigkeit, Periodenabgrenzung, Bewertung via Befragung, Vorjahresanalytik,
  Abgleich Detailliste/Spiegel.'
gesetz:
- thema: Zeitliche und sachliche Abgrenzung (Periodenabgrenzung)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Vollständigkeit der Rechnungslegung
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- thema: Bestandesnachweis durch Inventar/Detailaufstellung
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Bilanzierungspflicht von Verbindlichkeiten
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden, ein Mittelabfluss wahrscheinlich ist und ihre Höhe verlässlich
    geschätzt werden kann.
- thema: Fristigkeit kurzfristig/langfristig
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: 'Mindestgliederung: passive Rechnungsabgrenzungen (kurzfristiges Fremdkapital, Art. 959a Abs. 2 Ziff. 1 lit. d OR)'
  quelle: or__art-959a-t1
  zitat: passive Rechnungsabgrenzungen
- thema: 'Mindestgliederung: Rückstellungen (Art. 959a Abs. 2 Ziff. 2 lit. c OR)'
  quelle: or__art-959a-t1
  zitat: Rückstellungen sowie vom Gesetz vorgesehene ähnliche Positionen
- thema: Vorsichtige Bewertung; Anpassung bei zu geringen Rückstellungen
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Bewertung Verbindlichkeiten zum Nennwert
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Pflicht zur Bildung von Rückstellungen
  quelle: or__art-960e
  zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
    gebildet werden.
- thema: Nicht mehr begründete Rückstellungen (Wahlrecht, stille Reserven)
  quelle: or__art-960e
  zitat: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden.
- thema: 'Anhang: Aufschlüsselungen zu Bilanzpositionen'
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: 'Anhang: Nettoauflösung stiller Reserven'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
    übersteigt
- thema: 'Anhang: Eventualverbindlichkeiten'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann (Eventualverbindlichkeit)
- thema: 'Anhang: ausserordentliche/periodenfremde Positionen'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: 'Anhang: Ereignisse nach dem Bilanzstichtag'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
risiken:
- text: 'Unvollständige passive Rechnungsabgrenzungen: Aufwand des Geschäftsjahrs (z.B. Honorare inkl. Revision, Energie, Telefon, Zinsen, Miete, Subunternehmerleistungen), der erst
    im Folgejahr fakturiert oder bezahlt wird, ist nicht abgegrenzt.'
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
- text: Fehlende oder zu tiefe kurzfristige Rückstellungen für pendente Risiken (Rechtsfälle, Mängelrügen, Garantie- und Schadenersatzansprüche).
  pruefziele:
  - VO
  - BE
  quelle: hwp-bur-2023__rz-0510-s260
  zitat: Zur Ermittlung des Rückstellungsbedarfs sind sämtliche am Abschlussstichtag bestehenden sowie die erkennbaren und vor dem Stichtag verursachten Risiken und Lasten
- text: 'Unterbewertung: Rückstellung unter der bestmöglichen Schätzung bzw. am unteren Ende der dokumentierten Bandbreite, oder schrittweiser Aufbau über mehrere Jahre.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: Das Vorsichtsprinzip impliziert, dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist.
- text: Ferien- und Überzeitguthaben pauschal statt auf Basis der Saldi je Mitarbeiter abgegrenzt.
  pruefziele:
  - BE
  - VO
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Abgrenzungen in Form von Pauschalbeträgen oder Berechnungen auf der Basis von entgangenem Umsatz oder Gewinn sind nicht angemessen.
- text: Laufende Steuern des Geschäftsjahrs nicht abgegrenzt (Schnittstelle Prüffeld S1).
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0546-s269
  zitat: Geschuldete Steuern sind schon vor der Veranlagung unter den übrigen kurzfristigen Verbindlichkeiten oder den passiven Rechnungsabgrenzungen auszuweisen.
- text: Nicht mehr begründete oder überhöhte Rückstellungen/Abgrenzungen werden beibehalten (stille Reserven) bzw. Auflösungen ohne Anhangangabe zur Ergebnisverbesserung genutzt.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0506-s259
  zitat: Werden sie beibehalten, handelt es sich um eine Bildung stiller Reserven
- text: 'Falsche Klassierung: Rückstellung vs. passive Abgrenzung vs. Verbindlichkeit vs. Eventualverbindlichkeit; kurz- vs. langfristig; Saldierung mit aktiven Abgrenzungen.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0518-s262
  zitat: Je nach erwartetem Zeitpunkt des Mittelabflusses werden sie als kurzfristiges oder langfristiges Fremdkapital bilanziert.
- text: Artfremde Verwendung oder Umbenennung von Rückstellungen unter Umgehung der Erfolgsrechnung; Verwendung in neuer Rechnung über Aufwand/Ertrag statt als Bestandsbuchung.
  pruefziele:
  - RI
  - PA
  quelle: hwp-bur-2023__rz-0508-s260
  zitat: Eine Inanspruchnahme von Rückstellungen durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig.
- text: Fehlende oder unvollständige Offenlegung im Anhang (Eventualverbindlichkeit aus Rechtsstreit, a.o. Rückstellungsbildung, Ereignisse nach Bilanzstichtag).
  pruefziele:
  - DO
  quelle: hwp-er-2026__rz-0139-s204-t4
  zitat: weil beispielsweise die Rückstellungen nach wie vor zu niedrig ausgewiesen sind oder die Offenlegung im Anhang fehlt oder unvollständig ist
- text: Nicht bestehende oder doppelt erfasste Abgrenzungen (z.B. Rechnung bereits als Kreditor gebucht und zusätzlich abgegrenzt).
  pruefziele:
  - EX
  - RI
  quelle: hwp-er-2026__rz-0115-s200
  zitat: der Verhinderung der mehrfachen Erfassung von Belegen
unterlagen:
- dokument: Detailliste passive Rechnungsabgrenzungen per 31.12. (Text, Gläubiger, Leistungszeitraum, Betrag, Grundlage)
  zweck: Abstimmung mit Saldo/Jahresrechnung und kritische Durchsicht (M3-301)
  quelle: ser-2022__anh-d-s087-1
  zitat: Abstimmung einer Detailaufstellung mit der Jahresrechnung
- dokument: Rückstellungsspiegel (Stand 01.01., Bildung, Verwendung, Auflösung, Stand 31.12., Fristigkeit)
  zweck: Abstimmung Bestände und Bewegungen (M3-301, M3-401, M3-321)
  quelle: hwp-bur-2023__rz-0519-s262
  zitat: beispielsweise in Form eines Rückstellungsspiegels
- dokument: 'Berechnungsgrundlagen der Rückstellungen: Aktennotizen, Klageschriften, Korrespondenz, Berechnungen'
  zweck: Abstimmung der Bestände mit Unterlagen (M3-304)
  quelle: ser-2022__anh-d-s088-1
  zitat: Abstimmung der Bestände mit geeigneten Unterlagen (Verträge, Klageschriften, Berechnungen usw.)
- dokument: Stellungnahme des Rechtsvertreters zu laufenden Prozessen (nur falls vom Unternehmen selbst eingeholt)
  zweck: Prüfungsnachweis zur Bewertung von Prozessrisiken (M3-304)
  quelle: hwp-er-2026__rz-0139-s204-t3
  zitat: Liegt eine Bestätigung im Zeitpunkt der Abschlusserstellung vor, wird der Abschlussprüfer diese als Prüfungsnachweis betrachten
- dokument: Verträge mit Abgrenzungsbezug (Miete, Darlehen, Leasing, Service, Honorarofferten)
  zweck: Abstimmung der Abgrenzungen und Nachrechnen des Periodenaufwands (M3-302, M3-304)
  quelle: ser-2022__anh-d-s087-1
  zitat: Abstimmung der Bestände mit geeigneten Unterlagen (Verträge usw.)
- dokument: Ferien- und Überzeitsaldi je Mitarbeiter per 31.12. aus Zeiterfassung mit Lohnansätzen
  zweck: Nachrechnen der Ferien-/Überzeitabgrenzung (M3-304)
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Multiplikation (pro Mitarbeiter) der Ferien- oder Überzeitguthaben in Stunden mit dem Stundensatz für Lohnkosten, Sozialleistungen etc.
- dokument: Steuerberechnung/Steuerabgrenzung des Geschäftsjahrs
  zweck: Abstimmung Steuerabgrenzung (Schnittstelle S1; M3-301)
  quelle: ser-2022__anh-d-s089-1
  zitat: Abstimmung der Berechnung der Steuerabgrenzung mit der Jahresrechnung
- dokument: Kreditorenjournal und Kontoblätter neue Rechnung bis Prüfungsdatum (Eingangsrechnungen, Zahlungen)
  zweck: Kontendurchsicht neue Rechnung, Suche nach nicht abgegrenzten Leistungen (M3-305)
  quelle: ser-2022__anh-d-s084-2
  zitat: Durchsicht der in neuer Rechnung verbuchten bzw. noch nicht verbuchten Kreditorenrechnungen und/oder der Kreditoren- und Aufwandskonten auf Rechnungen
- dokument: Detailnachweis stille Reserven (Geschäftsjahr und Vorjahr)
  zweck: Plausibilisierung Bestand/Veränderung stiller Reserven in Rückstellungen (M3-321)
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: Detaillisten passive Abgrenzungen/Rückstellungen des Vorjahres (Vorjahresakte)
  zweck: Vorjahresvergleich je Position (M3-202)
  quelle: hwp-bur-2023__rz-0262-s216
  zitat: durch Vergleich mit den im Vorjahr ausgewiesenen Rechnungsabgrenzungen
- dokument: VR- und GL-Protokolle, Aktennotizen des Geschäftsjahrs und des Folgejahrs bis Prüfungsdatum
  zweck: Hinweise auf Rechtsfälle und Risiken (M3-101, M3-305)
  quelle: hwp-er-2026__rz-0124-s202
  zitat: Sitzungsprotokolle der Unternehmensorgane
- dokument: Unterzeichnete Vollständigkeitserklärung
  zweck: Bestätigung Vollständigkeit Verbindlichkeiten/Eventualverbindlichkeiten und stille Reserven (M3-320, M3-321)
  quelle: ser-2022__anh-e-s104-1
  zitat: Wir haben alle gegenwärtigen Verbindlichkeiten sowie Eventualverbindlichkeiten (Garantien, Bürgschaften und vergleichbare Erklärungen gegenüber Dritten) in der Jahresrechnung
    ordnungsgemäss erfasst
bewertung:
- regel: Passive Rechnungsabgrenzungen werden wie Verbindlichkeiten zu Nominalwerten bewertet.
  quelle: hwp-bur-2023__rz-0263-s216
  zitat: Die Rechnungsabgrenzungen sind nach den Grundsätzen, die für Forderungen bzw. Verbindlichkeiten gelten, zu bewerten. Die Bilanzierung erfolgt zu Nominalwerten.
- regel: Abgrenzung Rückstellung vs. passive Rechnungsabgrenzung nach dem Grad der Unsicherheit über Zeitpunkt oder Höhe.
  quelle: hwp-bur-2023__rz-0260-s215
  zitat: dass bei ihnen grössere Unsicherheiten bezüglich des Zeitpunkts oder der Höhe des zukünftigen Mittelabflusses bestehen
- regel: Rückstellungshöhe nach bestmöglicher Schätzung; eine Bandbreite genügt als verlässliche Schätzung.
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Die notwendige Höhe der Rückstellung ist aufgrund bestmöglicher Schätzung zu bemessen.
- regel: 'Vorsichtsprinzip: eher oberes Ende der Bandbreite erfassen.'
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: Das Vorsichtsprinzip impliziert, dass bei der Rückstellungsbildung eher das obere Ende der Bandbreite zu erfassen ist.
- regel: Eintretenswahrscheinlichkeit unter 50 % rechtfertigt nicht automatisch den Verzicht auf eine Rückstellung.
  quelle: hwp-bur-2023__rz-0515-s261
  zitat: ein Ereignis bei Eintretenswahrscheinlichkeit von unter 50 % nicht einfach als unwahrscheinlich qualifiziert und auf die Bildung einer Rückstellung verzichtet werden kann
- regel: Bei bestehender Verpflichtung sofort und in vollem Umfang bilden; kein Aufbau über mehrere Jahre.
  quelle: hwp-bur-2023__rz-0513-s261
  zitat: Bei einer bestehenden Verpflichtung ist eine Rückstellung sofort und in vollem Umfang zu bilden.
- regel: Handelsrechtlich notwendige Rückstellungen unabhängig von der steuerlichen Anerkennung bilden.
  quelle: hwp-bur-2023__rz-0513-s261
  zitat: Handelsrechtlich notwendige Rückstellungen müssen auch dann gebildet werden, wenn sie steuerlich keine Anerkennung finden.
- regel: Wertaufhellende Ereignisse bis zur Abschlusserstellung berücksichtigen.
  quelle: hwp-bur-2023__rz-0517-s262
  zitat: Verluste, deren Ursache vor dem Abschlussstichtag liegt, die aber erst danach, jedoch vor Erstellung des Abschlusses bekannt werden, müssen zurückgestellt werden.
- regel: Prozessrisiken abschätzen und angemessen zurückstellen; Eventualverbindlichkeit nur, wenn nicht bezifferbar.
  quelle: hwp-bur-2023__rz-0526-s263
  zitat: Besonders anspruchsvoll kann die Beurteilung von Prozessrisiken sein. Diese sind trotzdem abzuschätzen, und es ist dafür eine angemessene Rückstellung zu bilden.
- regel: Ferien- und Überzeitguthaben sind zwingend abzugrenzen (Saldi × Lohnansatz), Ausweis als passive Rechnungsabgrenzung.
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Am Bilanzstichtag noch nicht bezogene Ferien- oder Überzeitansprüche sind handelsrechtlich also zwingend abzugrenzen.
- regel: Revisionshonorar nach gängiger Praxis vollständig abgrenzen (nach Akontozahlungen).
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: Mit Bezug auf das Revisionshonorar ist es gängige Praxis, dieses (nach Berücksichtigung allfälliger Akontozahlungen) vollständig abzugrenzen
- regel: Kurzfristige Rückstellungen unter dem kurzfristigen Fremdkapital, als Teil der passiven Abgrenzungen oder separat ausweisen.
  quelle: hwp-bur-2023__rz-0225-s111
  zitat: Kurzfristige Rückstellungen sind als Teil der passiven Rechnungsabgrenzungen oder als separate Position auszuweisen.
- regel: Keine Saldierung aktiver und passiver Rechnungsabgrenzungen.
  quelle: hwp-bur-2023__rz-0264-s216
  zitat: eine Saldierung der beiden Positionen ist nicht zulässig
- regel: Nicht mehr begründete, beibehaltene Rückstellungen gelten als stille Reserven.
  quelle: hwp-bur-2023__rz-0528-s264
  zitat: Darüber hinausgehende Rückstellungen sind möglich, gelten dann aber als stille Reserven und sind entsprechend zu behandeln.
- regel: Bildung zulasten der sachlich zugehörigen Aufwandsposition; a.o./periodenfremde Bildung separat und im Anhang erläutern.
  quelle: hwp-bur-2023__rz-0504-s259
  zitat: Die Bildung einer Rückstellung erfolgt zulasten jener Position der Erfolgsrechnung, welcher der zugrunde liegende Vorgang inhaltlich zufällt.
- regel: Verwendung zweckbestimmter Rückstellungen als Bestandsbuchung, nur für artgleiche Posten.
  quelle: hwp-bur-2023__rz-0507-s259
  zitat: Die Verwendung zweckbestimmter Rückstellungen erfolgt als Bestandsbuchung.
fallstricke:
- text: Befragung allein genügt bei wesentlichen Positionen nicht; Antworten der GL mit Analytik und Detailprüfungen untermauern und kritisch würdigen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Anwalts- und Drittbestätigungen sind nicht Teil der eingeschränkten Revision: nicht aktiv einfordern; eine vom Unternehmen selbst eingeholte Stellungnahme darf verwendet werden.'
  quelle: hwp-er-2026__rz-0139-s204-t2
  zitat: Dieses Vorgehen, im SER als «Einholen von Anwaltsbestätigungen» bezeichnet, ist bei der eingeschränkten Revision nicht vorgesehen.
- text: Rückbuchung der Vorjahresabgrenzungen per 01.01. über die Aufwandskonten verzerrt den Vorjahresvergleich der Aufwandskonten; sie gilt nicht als periodenfremd.
  quelle: hwp-bur-2023__rz-0261-s216
  zitat: dabei gilt die Rückbuchung nicht als periodenfremd
- text: Analytik kann sich kompensierende Fehler (z.B. fehlende Abgrenzung und Rückbuchung) nicht aufdecken.
  quelle: ser-2022__6-1-2-t3
  zitat: Zudem besteht das Risiko, dass sich zwei oder mehrere Fehlaussagen teilweise kompensieren können und deshalb bei analytischen Prüfungen nicht erkannt werden.
- text: Grosse Bandbreite des Prozessrisikos ist kein Grund, statt einer Rückstellung nur eine Eventualverbindlichkeit offenzulegen.
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Eine grosse Bandbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten und stattdessen nur eine Eventualverbindlichkeit im Anhang
- text: Kosten/Gutschriften zu einem zurückgestellten Sachverhalt in neuer Rechnung sind der Rückstellung zu belasten (Bestandsbuchung), nicht erneut Aufwand bzw. Ertragsminderung.
  quelle: hwp-bur-2023__rz-0507-s259
  zitat: Wurden beispielsweise Prozesskosten zurückgestellt und fallen diese in der Folgeperiode an, wird die Zahlung bei Fälligkeit direkt der Rückstellung belastet.
- text: Umwidmung einer nicht benötigten Rückstellung in eine andere Rückstellungsart ohne Erfolgsrechnung ist unzulässig.
  quelle: hwp-bur-2023__rz-0508-s260
  zitat: Eine nicht benötigte Garantierückstellung darf auch nicht durch blosse Änderung der Bezeichnung – also unter Umgehung der Erfolgsrechnung – in eine Prozessrisikorückstellung
    umgewandelt werden.
- text: Konto heisst «Rückstellung Ferien/Überzeit», ist aber sachlich eine passive Rechnungsabgrenzung; Ausweis und Berechnung (nicht pauschal) prüfen.
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: die als passive Rechnungsabgrenzung auszuweisen ist
- text: 'Abgrenzung zu anderen Prüffeldern: langfristige Rückstellungen und Rechtsfälle (O1), Steuern (S1), Personal/Ferien (R1), Kreditoren und Rechnungen neue Rechnung (K1), Anhang
    (T1); Ergebnisse übergeben statt doppelt prüfen.'
- text: WP-Schritte (M3-302, M3-304, M3-305) nur vorbereiten; Beurteilung, Visum und allfällige Buchungen entscheidet der Wirtschaftsprüfer.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: Nicht benötigte Rückstellungen werden in KMU oft nicht separat aufgelistet; Detailnachweis stille Reserven aktiv anfordern.
  quelle: ef-2026-08-buchungslogik__s005-3
  zitat: Betreffend nicht benötigter Rückstellungen wird in den meisten Fällen ebenfalls keine separate Liste geführt.
fragen_kunde:
- frage: Wie stellen Sie sicher, dass alle Aufwände des Geschäftsjahrs, deren Rechnung erst im Folgejahr eintrifft (Honorare inkl. Revision, Energie, Telefon, Zinsen, Subunternehmer),
    abgegrenzt sind? Wer erstellt die Liste, auf welcher Grundlage und bis wann?
  zweck: 'M3-101: Prozess zur Vollständigkeit der passiven Abgrenzungen (VO); Antwort schriftlich dokumentieren'
- frage: Bestehen per Bilanzstichtag oder bis heute pendente Risiken (Rechtsfälle, Mängelrügen, angedrohte Schadenersatz- oder Garantieansprüche)? Wie schätzt die Geschäftsleitung das
    finanzielle Ausmass ein (Bandbreite, wahrscheinlichster Betrag, Verfahrenskosten)?
  zweck: 'M3-101/M3-304: Vollständigkeit und Bewertung kurzfristiger Rückstellungen (VO, BE); Schnittstelle O1'
- frage: Welche Gründe haben die wesentlichen Veränderungen der passiven Abgrenzungen, der Rückstellungen und der zugehörigen Aufwandskonten gegenüber dem Vorjahr?
  zweck: 'M3-201/M3-202: Abweichungsanalyse (VO, PA, BE)'
- frage: Wie wurde die Abgrenzung der Ferien- und Überzeitguthaben ermittelt (Saldi je Mitarbeiter × Lohnansatz oder Pauschale)? Bitte Saldoliste aus der Zeiterfassung beilegen.
  zweck: 'M3-304: Bewertung der Ferien-/Überzeitabgrenzung (BE)'
- frage: Wurden die direkten Steuern des Geschäftsjahrs berechnet und abgegrenzt? Bitte Steuerberechnung beilegen.
  zweck: 'M3-301: Vollständigkeit Steuerabgrenzung (VO); Schnittstelle S1'
- frage: Ist das Revisionshonorar für das geprüfte Geschäftsjahr abgegrenzt?
  zweck: 'M3-302: Vollständigkeit typischer Abgrenzungen (VO)'
- frage: Gab es nach dem Bilanzstichtag Entwicklungen bei zurückgestellten Sachverhalten (Vergleich, Urteil, Gutschriften, Zahlungen) oder neue Ansprüche Dritter?
  zweck: 'M3-305: Entwicklung in neuer Rechnung, Ereignisse nach Bilanzstichtag (EN, VO, PA)'
- frage: Liegt zu laufenden Rechtsfällen eine Stellungnahme Ihres Rechtsvertreters vor? Falls ja, bitte zur Verfügung stellen.
  zweck: 'M3-304: Bewertungsnachweis Prozessrisiko (nur verwenden, nicht aktiv einfordern)'
- frage: Enthalten Rückstellungen oder Abgrenzungen Beträge über das betriebswirtschaftlich Notwendige (stille Reserven)? Bitte Detailnachweis Bestand und Veränderung.
  zweck: 'M3-321: stille Reserven, Nettoauflösung (BE, DO)'
