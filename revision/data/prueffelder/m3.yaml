  - Vollständigkeitserklärung (Passus Ereignisse nach dem Bilanzstichtag)
  rechnen: Differenz = Abgrenzung bzw. Rückstellung 31.12. – effektive Rechnung/Zahlung in neuer Rechnung; Σ Rechnungen mit Leistungsdatum ≤ 31.12. ohne Abgrenzung/Kreditor
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Rechnung für Leistung des GJ ohne Abgrenzung, effektiver Betrag deutlich über Rückstellung oder wertaufhellendes Ereignis nicht
