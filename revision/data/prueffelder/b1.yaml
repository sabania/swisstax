- id: B1-404
  vorgehen: 'Nur auf Anweisung des WP; ohne Anweisung Schritt offen lassen (Hinweis als Pendenz). Stichprobe von Ein- und Ausgängen auf den Geldkonten (risikoorientiert, über Toleranzwesentlichkeit)
    mit Bankauszug und Grundbeleg abgleichen: Betrag, Datum, Gegenpartei, Kontierung, Echtheit. Auswahl, Stichprobengrösse und Ergebnis dokumentieren.'
