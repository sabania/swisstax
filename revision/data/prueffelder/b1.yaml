  zitat: Belegprüfung einzelner wesentlicher Wertschriftentransaktionen
- dokument: Liquiditätsplanung / Budget Folgejahr
  zweck: Beurteilung Liquiditätsentwicklung und Fortführung
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Abfluss von Liquidität aus dem operativen Geschäft («Cash Drain»)
bewertung:
- regel: Flüssige Mittel = Kasse sowie Post- und Bankguthaben auf Sicht; Festgelder nur bei Restlaufzeit bis drei Monate ab Bilanzstichtag.
  quelle: hwp-bur-2023__rz-0003-s156
  zitat: Ebenfalls zu den flüssigen Mitteln können Festgeldguthaben gezählt werden, die eine Restlaufzeit von höchstens drei Monaten ab Bilanzstichtag aufweisen.
- regel: Länger gebundene oder kündbare Bankguthaben gehören zu den übrigen kurzfristigen Forderungen.
  quelle: hwp-bur-2023__rz-0009-s157
  zitat: sind nicht unter den flüssigen Mitteln, sondern unter den übrigen kurzfristigen Forderungen auszuweisen
- regel: Als Zahlung erhaltene, noch nicht eingelöste Bankchecks üblicherweise unter den flüssigen Mitteln.
  quelle: hwp-bur-2023__rz-0005-s156
  zitat: Die als Zahlung erhaltenen, noch nicht eingelösten Bankchecks werden üblicherweise den flüssigen Mitteln zugerechnet.
- regel: Reka-Checks, Gutscheine u.Ä. sind Forderungen gegenüber Organisationen ohne Banklizenz und gehören zu den übrigen kurzfristigen Forderungen.
  quelle: hwp-bur-2023__rz-0005-s156
  zitat: Forderungen gegenüber Organisationen ohne Banklizenz
- regel: WIR-Guthaben (Verrechnungsforderungen) unter übrigen kurzfristigen Forderungen; nur bar auszahlbare Guthaben (WIR bar) unter flüssigen Mitteln.
  quelle: hwp-bur-2023__rz-0006-s156
  zitat: Nicht zu den flüssigen Mitteln gehören Verrechnungsforderungen gegenüber der WIR-Bank
- regel: 'Guthaben bei notleidenden Finanzinstituten, mit Transferrestriktionen sowie ungedeckte Checks: Ausweis unter übrigen Forderungen, ggf. Wertberichtigung.'
  quelle: hwp-bur-2023__rz-0010-s157
  zitat: Forderungen gegenüber notleidenden Finanzinstituten, Bestände an flüssigen Mitteln in Ländern mit Transferrestriktionen sowie Checks ohne genügende Deckung
- regel: 'Kurzfristig gehaltene Aktiven mit Marktpreis: Wertschriften, Edelmetalle, Kryptowährungen, Rohstoffe, sofern liquid gehandelt und entsprechend bewertet (sonst nicht unter B1).'
  quelle: hwp-bur-2023__rz-0011-s157
  zitat: gehören Wertschriften, Edelmetalle, Kryptowährungen sowie Rohstoffe, sofern diese an einer Börse oder einem aktiven Markt liquid gehandelt und entsprechend bewertet werden
- regel: Kryptowährungen bei einem Wallet-Provider begründen einen Anspruch auf Kryptowährung, nicht auf flüssige Mittel.
  quelle: hwp-bur-2023__rz-0046-s167-t2
  zitat: besteht ein Anspruch auf Bitcoin oder andere Kryptowährungen und nicht auf flüssige Mittel
- regel: Verpfändete Konten bleiben flüssige Mittel, sind aber im Anhang offenzulegen; Kautionskonten ggf. unter Forderungen.
  quelle: hwp-bur-2023__rz-0008-s157
  zitat: Verpfändete Konten oder Konten, auf welchen die Bank ein Verrechnungsrecht im Rahmen einer Cash-Pool-Rahmenvereinbarung hat, qualifizieren hingegen als flüssige Mittel.
- regel: Geld unterwegs in der Regel unter flüssigen Mitteln; Bestandsermittlung nach Valuta-Datum.
  quelle: hwp-bur-2023__rz-0004-s156
  zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
- regel: Konten in Buchführungswährung zum Nennwert.
  quelle: hwp-bur-2023__rz-0015-s158
  zitat: In Buchführungswährung lautende Konten sind zum Nennwert zu bewerten.
- regel: Fremdwährungskasse zu Noten-/Jahresendkursen; FW-Bankguthaben zum Devisenkurs am Bilanzstichtag (Geldkurs; Mittelkurs als Vereinfachung, wenn Differenz unwesentlich); Kursdifferenzen
    gelten als realisiert.
  quelle: hwp-bur-2023__rz-0015-s158
  zitat: Kassenbestände in Fremdwährung sind anhand der Notenkurse bzw. Jahresendkurse umzurechnen.
- regel: Flüssige Mittel und Bankguthaben auf Sicht uneingeschränkt zum Devisenkurs des Bilanzstichtags.
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Bankguthaben und -schulden auf Sicht und Aktiven mit Börsenkurs oder einem anderen beobachtbaren Marktpreis können uneingeschränkt zum Devisenkurs des Bilanzstichtags ausgewiesen
    werden.
- regel: Nach OR ist die Folgebewertung zum Kurs oder Marktpreis am Bilanzstichtag ein Wahlrecht («dürfen»), einheitlich für die ganze Position.
  quelle: or__art-960b
  zitat: In der Folgebewertung dürfen Aktiven mit Börsenkurs oder einem anderen beobachtbaren Marktpreis in einem aktiven Markt zum Kurs oder Marktpreis am Bilanzstichtag bewertet werden
- regel: 'Ohne Ausübung des Wahlrechts: Folgebewertung höchstens zu Anschaffungskosten (Niederstwertprinzip).'
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- regel: Nach HWP setzt der Ausweis unter dieser Position die Bewertung zum Kurs am Bilanzstichtag voraus; Kursgewinne/-verluste gelten als realisiert.
  quelle: hwp-bur-2023__rz-0015-s158
  zitat: Kurzfristig gehaltene Aktiven mit Börsenkurs oder beobachtbarem Marktpreis sind zum Börsenkurs oder zum beobachtbaren Marktpreis am Bilanzstichtag zu bewerten
- regel: Bei Kursbewertung Schwankungsreserve zulässig (zulasten Erfolgsrechnung), gesamthaft in Bilanz oder Anhang gesondert auszuweisen.
  quelle: or__art-960b
  zitat: so darf eine Wertberichtigung zulasten der Erfolgsrechnung gebildet werden, um Schwankungen im Kursverlauf Rechnung zu tragen
- regel: 'Obergrenze Schwankungsreserve: Buchwert nach Reserve nicht unter Anschaffungswert und zugleich nicht unter dem allenfalls tieferen Kurswert, d.h. Reserve ≤ Kurswert – min(Anschaffungswert;
    Kurswert).'
  quelle: or__art-960b
  zitat: Solche Wertberichtigungen sind jedoch nicht zulässig, wenn dadurch sowohl der Anschaffungswert als auch der allenfalls tiefere Kurswert unterschritten würden.
- regel: 'Bei Kursbewertung im Anhang: Hinweis und Gesamtwert je für Wertschriften und übrige Aktiven mit Marktpreis gesondert.'
  quelle: or__art-960b
  zitat: Der Gesamtwert der entsprechenden Aktiven muss für Wertschriften und übrige Aktiven mit beobachtbarem Marktpreis je gesondert offengelegt werden.
- regel: Eigene Kapitalanteile nicht unter B1, sondern als Minusposten im Eigenkapital (zu Anschaffungswert).
  quelle: hwp-bur-2023__rz-0637-s291
  zitat: Eigene Kapitalanteile, die das bilanzierende Unternehmen selbst hält, sind als Minusposten im Eigenkapital auszuweisen
- regel: Bankschulden unter kurzfristigen verzinslichen Verbindlichkeiten; Verrechnung nur gleichartiger, gleichzeitig fälliger Positionen derselben Bank bei vertraglicher Zulässigkeit.
  quelle: hwp-bur-2023__rz-0016-s159
  zitat: können miteinander verrechnet werden, sofern die Vertragsbedingungen dies zulassen (Art. 120 OR)
- regel: Kontokorrentkredite stets als kurzfristig ausweisen.
  quelle: hwp-bur-2023__rz-0012-s157
  zitat: Kontokorrentkredite sind stets als kurzfristig auszuweisen.
- regel: Gebucht wird nur der beanspruchte Kreditbetrag, nicht die Limite.
  quelle: hwp-bur-2023__rz-0013-s157
  zitat: In der Buchführung der Kreditnehmenden wird der beanspruchte Betrag, nicht aber die eingeräumte Kreditlimite erfasst.
- regel: 'Devisentermingeschäfte: Ersterfassung zu Anschaffungskosten, in der Regel null.'
  quelle: hwp-bur-2023__rz-0074-s175
  zitat: sind die Anschaffungskosten in der Regel null
- regel: 'Derivate ohne Absicherungszweck: Folgebewertung nach Niederstwertprinzip oder (Wahlrecht Art. 960b OR) zu Marktwerten, einheitlich für alle Derivate der Bilanzposition.'
  quelle: hwp-bur-2023__rz-0075-s176-t1
  zitat: Weiter ist zu beachten, dass die Marktwertbewertung für alle Posten der betreffenden Bilanzposition vorzunehmen ist
- regel: 'Negativer Marktwert eines Derivats ohne Absicherungszweck: Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts.'
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
    werden.
- regel: 'Derivate mit Absicherungszweck: wahlweise wie ohne Absicherungszweck oder mit Hedge Accounting (Grund- und Absicherungsgeschäft als Bewertungseinheit).'
  quelle: hwp-bur-2023__rz-0076-s176
  zitat: Derivate mit Absicherungszweck können wahlweise entweder analog zu Derivaten ohne Absicherungszweck oder dann unter Anwendung von Hedge Accounting bewertet werden
- regel: Getrennter Ausweis von flüssigen Mitteln und Wertschriften in Bilanz oder Anhang empfohlen.
  quelle: hwp-bur-2023__rz-0016-s159
  zitat: empfiehlt sich aus Gründen der Klarheit ein getrennter Ausweis in der Bilanz oder im Anhang
- regel: 'Verrechnungssteuer: Satz 35 % auf Kapitalerträgen (Art. 13 VStG).'
  quelle: treuhand-almanach-2026__s068-1
  zitat: 35 % auf Kapitalerträgen und Lotteriegewinnen
- regel: 'Verrechnungssteuer: Ausnahmen von der Steuerpflicht nach Art. 5 VStG beachten; nicht jeder Zins unterliegt der VSt.'
  quelle: treuhand-almanach-2026__s068-1
  zitat: in Art. 5 VStG die entsprechenden Ausnahmen aufgeführt
- regel: 'Verrechnungssteuer: Rückerstattung an juristische Personen nur bei ordnungsgemässer Verbuchung der belasteten Erträge als Ertrag.'
  quelle: treuhand-almanach-2026__s069-2
  zitat: juristischen Personen mit Sitz in der Schweiz, sofern sie die mit der Verrechnungssteuer belasteten Einkünfte ordnungsgemäss als Ertrag verbucht haben
fallstricke:
- text: Bankbestätigungen selbst einholen ist nicht Teil der eingeschränkten Revision; der Agent fordert keine Bestätigungen bei Banken an und verwendet nur beim Unternehmen vorhandene
    Bestätigungen.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: Weitergehende Handlungen (Durchsicht Geldkonti, Belegprüfung Wertschriften, Eigentumsrechte, Befragung zu aussergewöhnlichen Transaktionen) nur bei Hinweisen auf Fehlaussagen
    oder erhöhtem inhärentem Risiko; Begründung dokumentieren.
  quelle: hwp-er-2026__rz-0132-s203
  zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
    anzunehmen sind
- text: 'WP-Schritte (Katalog: B1-102, 201, 202, 309, 310) bereitet der Agent nur vor, wenn der WP dies vorsieht; Entscheid ist offen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: Sonstige Prüfungshandlungen (4xx) nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: 'Befragungsschritte: Agent wertet nur schriftliche Antworten aus, sonst Frage als Pendenz; Status höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: höchstens «teilweise bearbeitet»
- text: 'Kein Kundenkontakt: Fragen an den Kunden nur als Pendenz bzw. Vorschlag erfassen, nicht selbst versenden; nur in M-Files vorhandene Unterlagen auswerten.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- text: Bei wesentlichen Beständen genügt eine Befragung allein nicht; immer mit Abstimmung/Detailprüfung ergänzen.
  quelle: hwp-er-2026__rz-0105-s198
  zitat: Gemäss SER stützt sich der Abschlussprüfer bei wesentlichen Jahresabschlussposten nicht nur auf Befragungen ab
- text: Befragungen nur als schriftlich festgehaltene Frage und Antwort verwertbar; mündliche Auskünfte ohne Dokumentation sind kein Prüfungsnachweis.
  quelle: hwp-er-2026__rz-0103-s197
  zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- text: Kontoauszüge, die nicht auf den Bilanzstichtag lauten (z.B. Halbjahres- oder Vormonatsauszug), belegen den Bestand per 31.12. nicht; Pendenz erfassen.
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Die per Bilanzstichtag tatsächlich vorhandenen Bestände (Kassen, Post- und Bankguthaben einschliesslich Checks und Post-/Bankschulden) sind durch ein Inventar oder auf andere
    Art nachzuweisen.
- text: 'Screenshots oder App-Ansichten von Online-Konten: Echtheit, Stichtag und Kontoinhaber kritisch würdigen.'
  quelle: hwp-er-2026__rz-0116-s201
  zitat: Echtheit des Belegs (insbesondere bei nur in elektronischer Form vorliegenden Belegen)
- text: Guthaben bei Anbietern ohne Banklizenz (Zahlungsdienstleister, Gutscheine) nicht ungeprüft als flüssige Mittel übernehmen; Ausweis durch Fachperson beurteilen lassen (Analogie).
  quelle: hwp-bur-2023__rz-0005-s156
  zitat: Forderungen gegenüber Organisationen ohne Banklizenz
- text: Kryptowährungen bei Wallet-Providern nicht als flüssige Mittel (Bankguthaben) behandeln.
  quelle: hwp-bur-2023__rz-0046-s167-t2
  zitat: besteht ein Anspruch auf Bitcoin oder andere Kryptowährungen und nicht auf flüssige Mittel
- text: Zero-Balancing-Cash-Pool-Guthaben sind in der Regel keine flüssigen Mittel.
  quelle: hwp-bur-2023__rz-0007-s156
  zitat: grundsätzlich Forderungen gegenüber Konzerngesellschaften dar und dürfen in aller Regel nicht unter den flüssigen Mitteln
- text: Negative Kontokorrente nicht mit Guthaben anderer Konten/Banken saldieren (Verrechnungsverbot).
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- text: Das Wahlrecht zur Börsenkursbewertung gilt für die ganze Bilanzposition, nicht titelweise.
  quelle: or__art-960b
  zitat: Wer von diesem Recht Gebrauch macht, muss alle Aktiven der entsprechenden Positionen der Bilanz, die einen beobachtbaren Marktpreis aufweisen, zum Kurs oder Marktpreis am Bilanzstichtag
    bewerten.
- text: VSt-Hochrechnung (Netto / 0.65) nicht pauschal auf alle Zinsen anwenden; nur bei Zinsen mit VSt-Abzug gemäss Ausweis (Ausnahmen Art. 5 VStG).
  quelle: treuhand-almanach-2026__s068-1
  zitat: in Art. 5 VStG die entsprechenden Ausnahmen aufgeführt
- text: Der Agent kann keine Kassenaufnahme durchführen; er stützt sich auf das Protokoll des Kunden und erfasst bei Fehlen eine Pendenz.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: Keine Funktionsprüfungen des IKS (z.B. Visa-/Zahlungsfreigaben) als eigenes Prüfziel.
  quelle: hwp-er-2026__rz-0098-s197
  zitat: Funktionsprüfungen als Teil der Prüfungshandlungen sind in der eingeschränkten Revision nicht vorgesehen
- text: Visierung nur als Nachweis im Einzelfall (z.B. Prüfziel Verpflichtungen), nicht als IKS-Prüfung.
  quelle: hwp-er-2026__rz-0116-s201
  zitat: Dennoch kann mit der Prüfung der Visierung ggf. das Prüfungsziel «Verpflichtungen» geprüft werden
fragen_kunde:
- frage: Bestehen per Stichtag Verpfändungen, Sperren, Garantiedepots, Verrechnungsrechte der Bank oder andere Verfügungsbeschränkungen auf Konten oder Depots? Bitte Verträge beilegen.
  zweck: B1-101 (RV), Ausweis und Anhangangabe Art. 959c Abs. 2 Ziff. 9 OR
- frage: Gab es im Geschäftsjahr aussergewöhnliche Geldtransaktionen (grosse Bargeldbezüge, Zahlungen an Aktionäre/Nahestehende, Zahlungen ohne Rechnung, Krypto-/Auslandzahlungen)?
  zweck: B1-102 (EN, PA); schriftliche Antwort dokumentieren
- frage: Sind sämtliche Bank-, Post-, Online-Zahlungs- und Depotkonten (inkl. im Jahr eröffneter oder saldierter Konten) in der Buchhaltung erfasst? Bitte vollständige Kontenliste je
    Institut.
  zweck: Vollständigkeit (VO), B1-301/B1-401
- frage: Verfügen die Anbieter von Online-/Zahlungsdienstkonten über eine Banklizenz? Bestehen WIR-Guthaben (Verrechnung oder WIR bar)?
  zweck: Ausweis unter flüssigen Mitteln oder übrigen kurzfristigen Forderungen (DO), B1-301/B1-402
- frage: Wer hat die Kassenaufnahme per 31.12. durchgeführt und wo ist das unterzeichnete Protokoll? Sind alle Kassenbelege und Spesenvorschüsse per Stichtag verbucht?
  zweck: B1-201/B1-301 Nachweis und Vollständigkeit Kassenbestand
- frage: Welche Kreditlimiten bestehen, wurden Kreditbedingungen (Kennzahlen/Covenants) eingehalten und gab es nach dem Stichtag neue Kredite, Garantien oder Kündigungen?
  zweck: B1-304/B1-306, Fortführung, Ereignisse nach dem Bilanzstichtag
- frage: Bestehen per Stichtag offene Devisentermingeschäfte oder andere Derivate, und dienen sie der Absicherung eines Grundgeschäfts (Hedge Accounting)? Bitte Kontraktübersicht und
    Bankbewertung per 31.12. einreichen.
  zweck: B1-307 (BE, VO)
- frage: Nach welchem Grundsatz werden Wertschriften bewertet (höchstens Anschaffungswert oder Kurs nach Art. 960b OR) und besteht eine Schwankungsreserve?
  zweck: B1-308, Stetigkeit, Anhanghinweis
- frage: Hält das Unternehmen eigene Aktien bzw. Anteile (direkt oder über Beteiligungen), und wo sind sie bilanziert?
  zweck: B1-308, Ausweis als Minusposten im Eigenkapital (DO), Anhang
- frage: Hat das Unternehmen selbst Bankbestätigungen per Stichtag eingeholt? Falls ja, bitte vollständig einreichen.
  zweck: 'B1-401: Verwendung nur von beim Unternehmen vorhandenen Bestätigungen'
- frage: Wurde die Verrechnungssteuer auf Zinserträgen zurückgefordert bzw. als Guthaben erfasst?
  zweck: B1-303 (VO, PA)
