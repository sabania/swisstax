  - Vom Unternehmen eingeholte Bankbestätigungen
  - Hauptbuch/Saldoliste
  - Anhang
  rechnen: 'Je Konto: Saldo Bestätigung = Saldo Hauptbuch; Anzahl Konten Bestätigung = Anzahl Konten Hauptbuch je Bank; Summe Verpflichtungen Bestätigung = Bilanz/Anhang'
