  - quelle: ser-2022__anh-d-s074-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen
  - quelle: ser-2022__anh-d-s074-2
    zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
- id: B1-402
  vorgehen: Nur auf Anweisung des WP; ohne Anweisung Schritt offen lassen (Hinweis als Pendenz). Je Bank bzw. Kontoanbieter beurteilen, ob Hinweise auf Zahlungsschwierigkeiten, fehlende
    Banklizenz oder Transferrestriktionen bestehen (öffentliche Informationen, Korrespondenz). Ergebnis je Institut knapp dokumentieren; Zweifel als Frage an den WP erfassen.
