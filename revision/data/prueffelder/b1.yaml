- id: B1-320
  vorgehen: 'Anhang auf Angaben aus diesem Prüffeld prüfen: verpfändete/abgetretene Aktiven (Art. 959c Abs. 2 Ziff. 9 OR), Sicherheiten für Dritte (Ziff. 8), bei Kursbewertung Hinweis,
    Gesamtwert je Wertschriften/übrige Aktiven gesondert und Schwankungsreserve (Art. 960b OR), Umrechnungskurse bei Fremdwährungsabschluss. Beträge mit B1-101/306/308 abgleichen. Bilanzbezeichnung
    prüfen: Enthält die Position nur flüssige Mittel, muss sie «Flüssige Mittel» heissen; bei Wertschriften ist ein getrennter Ausweis in Bilanz oder Anhang empfohlen (Hinweis, keine
    Feststellung). Ziff. 10 (Eventualverbindlichkeiten) nicht vergessen: aus Bankunterlagen bzw. Bankbestätigung ersichtliche Garantien und Verpflichtungen je Sachverhalt einer Ziffer
    zuordnen – Sicherheit für fremde Schuld → Ziff. 8; eigene Aktiven verpfändet/gesperrt → Ziff. 9; Garantie der Bank für eine eigene Verpflichtung des Unternehmens (z.B. Miet-, Erfüllungs-,
    Anzahlungsgarantie) ist keine Sicherheit für Dritte → Offenlegung als Eventualverbindlichkeit (Ziff. 10) prüfen, Entscheid WP; Übergabe an T1-105/T1-107.'
  nachweise:
  - Anhang der Jahresrechnung
  - Ergebnisse B1-101, B1-306, B1-308
  rechnen: Anhangbetrag verpfändete Aktiven = Summe gemäss Verträgen/Auszügen; Gesamtwert Wertschriften bzw. übrige Aktiven zum Kurs = Summe gemäss B1-308
  feststellung_wenn: Pflichtangabe fehlt (Ziff. 8, 9, 10, Kursbewertung), falsche Ziffer oder Betrag weicht von den Unterlagen ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
