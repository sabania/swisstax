schritte:
- id: B1-101
  vorgehen: 'Schriftliche Befragung der Leitung Finanzen zu Verpfändungen, Sperren, Garantiedepots und Verrechnungsrechten auf allen Konten/Depots als Pendenz/Frage erfassen. Antwort
    mit Bankauszügen, Kredit-/Pfandverträgen und ggf. vorhandenen Bankbestätigungen abgleichen. Im Textfeld: Frage, Antwort, Datum, betroffene Konten und Beträge sowie Folgerung für
    Ausweis und Anhang.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Pfand-/Garantieverträge
  - Bankauszüge Garantie-/Sperrkonten
  - Vorhandene Bankbestätigungen
  rechnen: Summe verpfändete/gesperrte Guthaben = Betrag Anhangangabe Art. 959c Abs. 2 Ziff. 9 OR
  feststellung_wenn: Verpfändung/Sperre bekannt, aber nicht im Anhang offengelegt, oder Kautions-/Sperrkonto ohne Prüfung des Ausweises unter flüssigen Mitteln; fehlende Antwort als
    Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Befragung über allfällige Verpfändungen und Verfügungsbeschränkungen
  - quelle: hwp-bur-2023__rz-0008-s157
    zitat: Solche Fälle müssen jedoch im Anhang offengelegt werden
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- id: B1-102
  vorgehen: 'Weitergehende Befragung (WP): Frage nach aussergewöhnlichen Geldtransaktionen (grosse Bargeldbezüge, Zahlungen an Nahestehende, Auslands-/Kryptozahlungen, runde Beträge)
    als Pendenz erfassen. Antwort mit Auffälligkeiten aus der Durchsicht der Geldkonti (B1-305) abgleichen. Nur bei Hinweisen auf Fehlaussagen oder erhöhtem Risiko; Begründung, Frage
    und Antwort dokumentieren.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Hauptbuch Geldkonten
  - Belege zu genannten Transaktionen
  rechnen: ''
  feststellung_wenn: Aussergewöhnliche Transaktion ohne nachvollziehbaren wirtschaftlichen Hintergrund, falsche Periode oder Widerspruch zwischen Antwort und Buchhaltung.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Befragung zu aussergewöhnlichen Transaktionen
  - quelle: hwp-er-2026__rz-0103-s197
    zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- id: B1-201
  vorgehen: 'Kassenkonten aus Saldoliste mit Vorjahr und Monatsverlauf (Hauptbuch) vergleichen; Höhe im Verhältnis zur Geschäftstätigkeit und zu den flüssigen Mitteln beurteilen. Negative
    Zwischensalden, ungewöhnlich hohe Bestände oder sprunghafte Veränderungen festhalten und Erklärung als Frage erfassen. Im Textfeld: Bestände X/X-1, Veränderung, Erwartung, Ergebnis.'
  nachweise:
  - Saldoliste Vorjahr/aktuell
  - Kontoblatt Kasse
  - Kassabuch
  rechnen: Veränderung Kasse = Saldo 31.12.X – Saldo 31.12.X-1; Anteil Kasse = Kasse / Total flüssige Mittel; Prüfung negativer Zwischensalden im Kontoblatt
  feststellung_wenn: Negativer Kassensaldo, unplausibel hoher Bestand oder Veränderung ohne Erklärung, die über der Nicht-Aufgriffsgrenze liegt.
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Physische Bestandsaufnahmen und Abstimmung mit den Kassenbüchern.
- id: B1-202
  vorgehen: 'Überträge zwischen Geldkonten in den letzten und ersten Tagen um den Stichtag aus Hauptbuch und Bankauszügen (Dezember/Januar) auflisten; je Übertrag Belastung und Gutschrift
    paaren und Valuta-Datum vergleichen. Geld unterwegs, Doppel- oder Nichterfassungen identifizieren. Im Textfeld: Liste der Überträge, Paarung, offene Posten.'
  nachweise:
  - Hauptbuch Geldkonten Dezember
  - Bankauszüge Dezember und Januar Folgejahr
  - Kontoblätter Folgejahr
  rechnen: 'Je Übertrag: Belastung Konto A = Gutschrift Konto B; Summe ungepaarter Überträge per 31.12. = Geld unterwegs; Differenz Buchdatum vs. Valuta-Datum'
  feststellung_wenn: Übertrag nur einseitig per 31.12. erfasst, doppelt erfasst oder Geld unterwegs nicht korrekt abgegrenzt; ungeklärter Übertrag als Pendenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0004-s156
    zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Hierbei ist auf das Valuta-Datum abzustellen.
- id: B1-301
  vorgehen: 'Für jedes Geldkonto Saldo Hauptbuch per 31.12. mit Nachweis abstimmen: Kassabuch/Kassenaufnahmeprotokoll, PC-/Bankauszug, Festgeldkorrespondenz, Depotauszug; bei Differenzen
    Kunden-Überleitung einsehen. Vollständigkeit der Konti mit Bankenliste abgleichen. Im Textfeld: Tabelle Konto, Buchsaldo, Nachweissaldo, Differenz, Dokument (M-Files-ID).'
  nachweise:
  - Saldoliste/Hauptbuch
  - Kassabuch und Kassenaufnahmeprotokoll
  - Bank-/PC-Auszüge per 31.12.
  - Festgeldbestätigungen
  - Depotauszug per 31.12.
  rechnen: 'Je Konto: Saldo Hauptbuch 31.12. = Saldo Nachweis ± Überleitungsposten; Summe Konten flüssige Mittel = Bilanzposition'
  feststellung_wenn: Differenz zwischen Buch- und Nachweissaldo ohne Überleitung, fehlender Stichtagsnachweis (Pendenz) oder Konto in Unterlagen, das nicht gebucht ist.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Abstimmung der Bestände mit Kassenbüchern, Bank- und PC-Auszügen oder Wertschriftenverzeichnissen (ggf. Einsichtnahme in die vom Kunden erstellten Abstimmungen)
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Nachweis durch Auszüge oder Bestätigungen der Post bzw. Banken
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- id: B1-302
  vorgehen: 'Für alle Fremdwährungskonten (Kasse, Bank) Währungssaldo und angewandten Kurs aus der Buchhaltung mit dem Jahresendkurs gemäss Bankauszug oder Kursliste per 31.12. vergleichen
    und den CHF-Wert nachrechnen. Kursdifferenzen mit den Konten Kursgewinn/-verlust plausibilisieren. Im Textfeld: Konto, FW-Saldo, Kurs Buchhaltung, Kurs Quelle, CHF-Differenz.'
  nachweise:
  - Bankauszüge Fremdwährungskonten per 31.12.
  - Devisenkursliste per 31.12.
  - Kontoblätter Kursdifferenzen
  rechnen: FW-Saldo × Stichtagskurs = Soll-Buchwert CHF; Differenz = Buchwert CHF – Soll-Buchwert CHF
  feststellung_wenn: Umrechnung nicht zum Stichtagskurs oder Differenz über der Nicht-Aufgriffsgrenze; Buchungsvorschlag für Kursdifferenz erfassen.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Kursgewinne oder -verluste aus Fremdwährungen sind als realisiert zu betrachten.
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Die Bilanzierung zum Mittelkurs wird in der Praxis oft angewandt.
- id: B1-303
  vorgehen: 'Zins- und Kapitalausweise der Banken mit den Buchungen auf Zinsertrag/-aufwand und VSt-Guthaben abgleichen: Zinsertrag brutto erfasst, VSt (35 %) als Forderung gebucht,
    Periode korrekt. Erwarteten Zinsertrag aus Durchschnittsguthaben × Zinssatz plausibilisieren. Im Textfeld: Konto, Bruttozins, VSt, Buchung, Differenz.'
  nachweise:
  - Zins-/Kapitalausweise der Banken
  - Kontoblätter Zinsertrag/-aufwand
  - Kontoblatt Verrechnungssteuerguthaben
  rechnen: VSt = Bruttozins × 35 %; Bruttozins = Nettogutschrift / 0.65; Erwarteter Zins = Ø Guthaben × Zinssatz; Summe VSt lt. Ausweisen = Saldo VSt-Konto
  feststellung_wenn: Zins netto gebucht, VSt-Guthaben fehlt oder nicht abgestimmt, Zins in falscher Periode oder unplausible Abweichung zum Erwartungswert.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich des Finanzaufwands und -ertrags mit den erwarteten Werten aufgrund der verzinslichen Aktiven und Passiven
  - quelle: treuhand-almanach-2026__s068-1
    zitat: 35 % auf Kapitalerträgen und Lotteriegewinnen
  - quelle: treuhand-almanach-2026__s069-2
    zitat: juristischen Personen mit Sitz in der Schweiz, sofern sie die mit der Verrechnungssteuer belasteten Einkünfte ordnungsgemäss als Ertrag verbucht haben
- id: B1-304
  vorgehen: Entwicklung der flüssigen Mittel und der Bankkredite (X/X-1, Monatsverlauf) analysieren; Kreditlimiten aus Verträgen/Auszügen mit Beanspruchung per Stichtag vergleichen.
    Hinweise auf Liquiditätsengpass oder Verletzung von Kreditbedingungen festhalten und an Fortführungsbeurteilung melden. Kreditbedingungen als Frage erfassen.
  nachweise:
  - Saldoliste/Hauptbuch Geldkonten und Bankkredite
  - Kredit-/Kontokorrentverträge mit Limiten
  - Bankauszüge
  - Liquiditätsplanung
  rechnen: Liquiditätsveränderung = flüssige Mittel X – X-1; Ausschöpfung = beanspruchter Kredit / Limite; freie Limite = Limite – Beanspruchung
  feststellung_wenn: Limite überschritten oder voll ausgeschöpft, Kreditbedingungen verletzt, starker Liquiditätsabfluss mit Fortführungsrelevanz; fehlende Verträge als Pendenz.
  fundstellen:
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
  - quelle: hwp-bur-2023__rz-0013-s157
    zitat: In der Buchführung der Kreditnehmenden wird der beanspruchte Betrag, nicht aber die eingeräumte Kreditlimite erfasst.
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung, ob die Unternehmensleitung Bestimmungen von Darlehensverträgen (z. B. Kennzahlen in Kreditverträgen) nicht eingehalten hat
- id: B1-305
  vorgehen: 'Hauptbuchkonti der flüssigen Mittel kritisch durchsehen: Buchungen über Toleranzwesentlichkeit, runde Beträge, Gegenkonten ausserhalb des normalen Geschäfts, Buchungen mit
    Nahestehenden, Storni und Stichtagsbuchungen auswählen. Wirtschaftlichen Hintergrund mit Belegen/Verträgen klären, offene Punkte als Frage erfassen. Auswahlkriterien und Ergebnis
    dokumentieren.'
  nachweise:
  - Hauptbuch Geldkonten
  - Belege und Verträge zu ausgewählten Buchungen
  - Antworten der Unternehmensleitung
  rechnen: 'Auswahl: Buchungen ≥ Toleranzwesentlichkeit oder ungewöhnlich; Summe ausgewählter Buchungen / Total Bewegungen = Abdeckung'
  feststellung_wenn: Buchung ohne geschäftlichen Grund, ohne Beleg, zugunsten Nahestehender ohne Grundlage oder in falscher Periode.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Durchsicht der Geldkonti auf ungewöhnliche Buchungen
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Unterlagen im Bereich der flüssigen Mittel (Durchsicht der Geldkonten auf ungewöhnliche Buchungen)
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Beurteilung des wirtschaftlichen Hintergrunds vorhandener wesentlicher Transaktionen mit nahestehenden Personen
- id: B1-306
  vorgehen: 'Bankkorrespondenz und Bankverträge (Kontokorrent-, Kredit-, Pfand-, Garantie-, Depotverträge) in M-Files einsehen: Konten, Limiten, Sicherheiten, Garantien zugunsten Dritter,
    Kündigungen. Erkenntnisse mit Buchhaltung und Anhang abgleichen. Im Textfeld: Vertrag, Datum, relevante Bestimmungen, Auswirkung.'
  nachweise:
  - Bankverträge
  - Bankkorrespondenz
  - Pfand- und Garantieverträge
  rechnen: ''
  feststellung_wenn: Vertrag zeigt Konto, Kredit, Sicherheit oder Garantie, die in Buchhaltung oder Anhang fehlt; fehlende Verträge als Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in Kredit- und Darlehensverträge
  - quelle: hwp-er-2026__rz-0118-s201
    zitat: Das Aktenstudium kann einerseits zur Prüfung buchmässig erfasster und belegter Sachverhalte erforderlich sein
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über Bestand und Veränderungen von Bürgschaften, Garantieverpflichtungen und Pfandbestellungen zugunsten Dritter
- id: B1-307
  vorgehen: 'Offene Devisentermingeschäfte per Stichtag erfragen und Bankbewertung per 31.12. einholen (beim Kunden). Bewertungsmethode (Niederstwert oder Marktwert, einheitlich je Position)
    feststellen; negative Marktwerte ohne Absicherungszweck müssen als Verbindlichkeit/Rückstellung erfasst sein. Anhangangabe prüfen. Ohne Kontrakte: Bestätigung in der Antwort dokumentieren.'
  nachweise:
  - Kontraktübersicht/Bankbewertung per 31.12.
  - Kontrakte/Abrechnungen
  - Schriftliche Antwort der Unternehmensleitung
  rechnen: Marktwert = Nominal × (Terminkurs Stichtag – Kontraktkurs); Summe negative Marktwerte = Verbindlichkeit/Rückstellung
  feststellung_wenn: Negativer Marktwert nicht erfasst, Methode uneinheitlich oder fehlende Angabe im Anhang.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0074-s175
    zitat: sind die Anschaffungskosten in der Regel null
  - quelle: hwp-bur-2023__rz-0075-s176-t2
    zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
      werden.
  - quelle: hwp-bur-2023__rz-0075-s176-t1
    zitat: Weiter ist zu beachten, dass die Marktwertbewertung für alle Posten der betreffenden Bilanzposition vorzunehmen ist
- id: B1-308
  vorgehen: 'Für kurzfristig gehaltene Wertschriften Anzahl und Kurs gemäss Bewertung der Buchhaltung mit Depotauszug bzw. Jahresendkursen von Banken/Börsen per 31.12. vergleichen und
    Wert nachrechnen. Einheitliche Anwendung von Art. 960b OR und Schwankungsreserve prüfen. Im Textfeld: Titel, Anzahl, Kurs Buchhaltung, Kurs Quelle, Differenz.'
  nachweise:
  - Depotauszug per 31.12.
  - Kursliste Jahresendkurse
  - Wertschriftenverzeichnis der Buchhaltung
  rechnen: Anzahl × Jahresendkurs (× Devisenkurs) = Soll-Bilanzwert; Differenz = Buchwert – Soll-Bilanzwert
  feststellung_wenn: Abweichung über der Nicht-Aufgriffsgrenze, uneinheitliche Bewertung innerhalb der Position oder Börsenkursbewertung ohne Anhanghinweis.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Bewertung angewandten Börsenkurse mit den entsprechenden Jahresendkursen von Banken, Börsen oder anderen Quellen
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Kurzfristig gehaltene Aktiven mit Börsenkurs oder beobachtbarem Marktpreis sind zum Börsenkurs oder zum beobachtbaren Marktpreis am Bilanzstichtag zu bewerten
  - quelle: or__art-960b
    zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
- id: B1-309
  vorgehen: 'Weitergehend (WP): wesentliche Käufe/Verkäufe von Wertschriften aus Hauptbuch auswählen und mit Börsenabrechnung abgleichen (Titel, Anzahl, Kurs, Spesen, Datum, Gegenbuchung);
    realisierte Gewinne/Verluste nachvollziehen. Auswahlkriterium und Ergebnis dokumentieren.'
  nachweise:
  - Börsenabrechnungen
  - Hauptbuch Wertschriften und Finanzerfolg
  - Depotauszüge
  rechnen: Abrechnungsbetrag = Anzahl × Kurs ± Spesen/Courtage = gebuchter Betrag; realisierter Erfolg = Verkaufserlös – Buchwert
  feststellung_wenn: Buchung weicht von Abrechnung ab, Abrechnung fehlt (Pendenz) oder Erfolg falsch erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Belegprüfung einzelner wesentlicher Wertschriftentransaktionen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
- id: B1-310
  vorgehen: 'Weitergehend (WP): auf Depot-/Kontoauszügen und Verträgen Inhaber der Konten und Wertschriften prüfen (lautet auf das Unternehmen, nicht auf Aktionäre/Dritte); Treuhand-,
    Sammel- oder Drittdepots und Sicherungsübereignungen klären. Ergebnis je Konto/Depot dokumentieren.'
  nachweise:
  - Depot-/Kontoauszüge mit Inhaberangabe
  - Kontoeröffnungs-/Depotverträge
  - Treuhandverträge
  rechnen: ''
  feststellung_wenn: Konto/Depot lautet nicht auf das Unternehmen ohne nachvollziehbare vertragliche Grundlage, oder Eigentum unklar.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Prüfung der Eigentumsrechte des Unternehmens an den ausgewiesenen Beständen
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Nachweis durch Wertschriftenverzeichnis einer Bank oder Inventar.
- id: B1-320
  vorgehen: 'Anhang auf Angaben aus diesem Prüffeld prüfen: verpfändete/abgetretene Aktiven (Art. 959c Abs. 2 Ziff. 9 OR), Sicherheiten für Dritte (Ziff. 8), Hinweis auf Börsenkursbewertung
    und Schwankungsreserve (Art. 960b OR), Umrechnungskurse bei Fremdwährungsabschluss. Beträge mit Erkenntnissen aus B1-101/306/308 abgleichen.'
  nachweise:
  - Anhang der Jahresrechnung
  - Ergebnisse B1-101, B1-306, B1-308
  rechnen: Anhangbetrag verpfändete Aktiven = Summe gemäss Verträgen/Auszügen
  feststellung_wenn: Pflichtangabe fehlt oder Betrag weicht von den Unterlagen ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: ser-2022__anh-d-s098-3
    zitat: Weist der Anhang darauf hin, dass ggf. Aktiven zum Börsenkurs oder beobachtbaren Marktpreis bewertet werden (Art. 960b Abs. 1 OR)?
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- id: B1-322
  vorgehen: 'Dauerakte nachführen: Liste der Bankbeziehungen und Konten (inkl. Online-Konten), Kredit-, Pfand- und Garantieverträge, Zeichnungsberechtigungen, Bewertungsgrundsatz Wertschriften.
    Neue/geänderte Dokumente in M-Files verknüpfen; Änderungen gegenüber Vorjahr im Textfeld nennen.'
  nachweise:
  - Dauerakte Vorjahr
  - Aktuelle Bankverträge und Kontenliste
  rechnen: ''
  feststellung_wenn: Keine Feststellung; fehlende Verträge oder ungeklärte Änderungen als Pendenz erfassen.
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen
  - quelle: ser-2022__7-3
    zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
- id: B1-401
  vorgehen: 'Keine eigenen Bankbestätigungen anfordern. Liegen vom Unternehmen eingeholte Bestätigungen vor: Herkunft dokumentieren, je Bank Konten, Salden, Kredite, Garantien und Sicherheiten
    mit Hauptbuch und Anhang abgleichen (Vollständigkeit der Konti und Verpflichtungen). Fehlen sie: Schritt als nicht anwendbar kennzeichnen und Vollständigkeit über Auszüge/Befragung
    belegen.'
  nachweise:
  - Vom Unternehmen eingeholte Bankbestätigungen
  - Hauptbuch/Saldoliste
  - Anhang
  rechnen: 'Je Konto: Saldo Bestätigung = Saldo Hauptbuch; Anzahl Konten Bestätigung = Anzahl Konten Hauptbuch je Bank; Summe Verpflichtungen Bestätigung = Bilanz/Anhang'
  feststellung_wenn: Bestätigung zeigt nicht gebuchtes Konto, Kredit, Garantie oder Sicherheit bzw. abweichenden Saldo; unklare Herkunft der Bestätigung als Pendenz.
  fundstellen:
  - quelle: hwp-er-2026__rz-0095-s196
    zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat, kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise
      beiziehen
  - quelle: ser-2022__anh-d-s074-2
    zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
- id: B1-402
  vorgehen: Für jede Bank bzw. jeden Kontoanbieter beurteilen, ob Hinweise auf Zahlungsschwierigkeiten, fehlende Banklizenz oder Transferrestriktionen bestehen (öffentlich bekannte Informationen,
    Korrespondenz). Ergebnis je Institut knapp dokumentieren; Zweifel als Frage an den WP erfassen.
  nachweise:
  - Liste der Banken/Kontoanbieter
  - Bankkorrespondenz
  - Öffentliche Informationen zum Institut
  rechnen: ''
  feststellung_wenn: Guthaben bei notleidendem Institut, Anbieter ohne Banklizenz oder Transferrestriktion, aber Ausweis als flüssige Mittel ohne Wertberichtigung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0010-s157
    zitat: Forderungen gegenüber notleidenden Finanzinstituten, Bestände an flüssigen Mitteln in Ländern mit Transferrestriktionen
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- id: B1-404
  vorgehen: 'Stichprobe von Ein- und Ausgängen auf den Geldkonten (risikoorientiert, über Toleranzwesentlichkeit) mit Bankauszug und Grundbeleg abgleichen: Betrag, Datum, Gegenpartei,
    Kontierung, Echtheit. Auswahl, Stichprobengrösse und Ergebnis dokumentieren.'
  nachweise:
  - Hauptbuch Geldkonten
  - Bankauszüge
  - Rechnungen/Grundbelege
  rechnen: 'Je Stichprobe: Betrag Beleg = Betrag Buchung = Betrag Bankauszug'
  feststellung_wenn: Buchung ohne Beleg, Betrag/Gegenpartei weicht ab oder Beleg nicht echt bzw. nicht auf das Unternehmen lautend.
  fundstellen:
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Echtheit des Belegs (insbesondere bei nur in elektronischer Form vorliegenden Belegen)
- id: B1-405
  vorgehen: Für ausgewählte Zahlungen die zugrunde liegenden Unterlagen einsehen (Vertrag, Bestellung, Rechnung, Beschluss) und prüfen, ob die Zahlung eine Verpflichtung des Unternehmens
    betrifft, wirtschaftlich begründet ist und in der richtigen Periode erfasst wurde. Ergebnis je Zahlung dokumentieren.
  nachweise:
  - Verträge, Bestellungen, Rechnungen
  - VR-/GV-Beschlüsse bei Zahlungen an Organe/Aktionäre
  - Bankauszüge
  rechnen: ''
  feststellung_wenn: Zahlung ohne Rechtsgrund des Unternehmens (z.B. Privataufwand), ohne Grundlage oder periodenfremd.
  fundstellen:
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
  - quelle: or__art-957a
    zitat: Als Buchungsbeleg gelten alle schriftlichen Aufzeichnungen auf Papier oder in elektronischer oder vergleichbarer Form
- id: B1-406
  vorgehen: 'Eröffnungssalden 01.01. der Geldkonten mit Schlusssalden der Vorjahresrechnung (geprüft, falls vorhanden) und Schlusssalden 31.12. mit Saldoliste und Bilanz abstimmen. Im
    Textfeld: Konto, Vorjahr, Eröffnung, Schlusssaldo, Bilanzwert, Differenz.'
  nachweise:
  - Jahresrechnung Vorjahr
  - Saldoliste/Hauptbuch
  - Jahresrechnung Berichtsjahr
  rechnen: Eröffnungssaldo 01.01.X = Schlusssaldo 31.12.X-1; Summe Schlusssalden Geldkonten 31.12.X = Bilanzposition flüssige Mittel
  feststellung_wenn: Differenz zwischen Vorjahresabschluss und Eröffnung oder zwischen Hauptbuch und Bilanz.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
- id: B1-407
  vorgehen: Interne Überträge zwischen Kasse, Post und Banken im Jahresverlauf aus dem Hauptbuch filtern; je Übertrag Abgang und Zugang paaren, Transfer-/Geldtransitkonto per 31.12.
    auf Nullsaldo bzw. erklärte Restposten prüfen. Nicht gepaarte Überträge als Frage erfassen.
  nachweise:
  - Hauptbuch Geldkonten
  - Bankauszüge
  - Kassabuch
  rechnen: Summe Überträge Soll Zielkonten = Summe Überträge Haben Quellkonten; Saldo Transferkonto 31.12. = 0 oder erklärter Transitbetrag
  feststellung_wenn: Übertrag nur einseitig erfasst, Transferkonto mit unerklärtem Saldo oder Übertrag ohne Gegenbuchung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0004-s156
    zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
  - quelle: hwp-bur-2023__rz-0013-s157
    zitat: periodische Abstimmung der Buchsalden mit den Ist-Beständen
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
