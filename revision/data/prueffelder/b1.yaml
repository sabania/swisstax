# Prüffeld B1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: B1
bezeichnung: Flüssige Mittel und kurzfristig gehaltene Aktiven mit Börsenkurs
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 18
    korrigiert: true
kurzbeschrieb: 'Kasse, Sichtguthaben Post/Bank, Festgeld ≤ 3 Monate, Bankchecks; Wertschriften, Edelmetalle, Krypto mit Marktpreis. Nicht: WIR-Verrechnung (WIR bar zählt), Anbieter ohne
  Banklizenz (Entscheid WP). SER: Abstimmung mit internen Unterlagen, FW-Kurse, Verpfändungen, Anhang; keine Bestätigungen einholen.'
gesetz:
- thema: 'Mindestgliederung: Bilanzposition flüssige Mittel und kurzfristig gehaltene Aktiven mit Börsenkurs (Art. 959a Abs. 1 Ziff. 1 lit. a OR)'
  quelle: or__art-959a-t1
  zitat: flüssige Mittel und kurzfristig gehaltene Aktiven mit Börsenkurs
- thema: Eigene Kapitalanteile als Minusposten im Eigenkapital, nicht unter B1 (Art. 959a Abs. 2 Ziff. 3 lit. e OR)
  quelle: or__art-959a-t1
  zitat: eigene Kapitalanteile als Minusposten
- thema: Bestandesnachweis durch Inventar oder auf andere Art (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Vollständigkeit und Verrechnungsverbot (Art. 958c Abs. 1 Ziff. 2 und 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Belegnachweis für jede Buchung (Art. 957a Abs. 2 Ziff. 2 und Abs. 3 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: Vorsichtige Bewertung, Überprüfung bei Anzeichen für Überbewertung (Art. 960 Abs. 2 und 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Folgebewertung höchstens zu Anschaffungskosten, wenn das Wahlrecht nach Art. 960b OR nicht ausgeübt wird (Art. 960a Abs. 2 OR)
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: 'Wahlrecht: Folgebewertung zum Kurs oder Marktpreis am Bilanzstichtag (Art. 960b Abs. 1 Satz 1 OR)'
  quelle: or__art-960b
  zitat: In der Folgebewertung dürfen Aktiven mit Börsenkurs oder einem anderen beobachtbaren Marktpreis in einem aktiven Markt zum Kurs oder Marktpreis am Bilanzstichtag bewertet werden
- thema: 'Stetigkeit: Kursbewertung für alle Aktiven der ganzen Position (Art. 960b Abs. 1 Satz 2 OR)'
  quelle: or__art-960b
  zitat: Wer von diesem Recht Gebrauch macht, muss alle Aktiven der entsprechenden Positionen der Bilanz, die einen beobachtbaren Marktpreis aufweisen, zum Kurs oder Marktpreis am Bilanzstichtag
    bewerten.
- thema: 'Anhang: Hinweis auf Kursbewertung (Art. 960b Abs. 1 Satz 3 OR)'
  quelle: or__art-960b
  zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
- thema: 'Anhang: Gesamtwert der zum Kurs bewerteten Aktiven je für Wertschriften und übrige Aktiven gesondert (Art. 960b Abs. 1 Satz 4 OR)'
  quelle: or__art-960b
  zitat: Der Gesamtwert der entsprechenden Aktiven muss für Wertschriften und übrige Aktiven mit beobachtbarem Marktpreis je gesondert offengelegt werden.
- thema: Obergrenze der Schwankungsreserve (Art. 960b Abs. 2 Satz 2 OR)
  quelle: or__art-960b
  zitat: Solche Wertberichtigungen sind jedoch nicht zulässig, wenn dadurch sowohl der Anschaffungswert als auch der allenfalls tiefere Kurswert unterschritten würden.
- thema: Schwankungsreserve auf Aktiven mit Börsenkurs, gesonderter Ausweis (Art. 960b Abs. 2 Satz 3 OR)
  quelle: or__art-960b
  zitat: Der Betrag der Schwankungsreserven ist insgesamt in der Bilanz oder im Anhang gesondert auszuweisen.
- thema: 'Anhang: verpfändete Aktiven und Sicherheiten für Dritte (Art. 959c Abs. 2 Ziff. 8 und 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: Umrechnungskurse im Anhang bei Rechnungslegung in Fremdwährung (Art. 958d Abs. 3 OR)
  quelle: or__art-958d
  zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: Ausgewiesene Guthaben bestehen nicht oder nicht in dieser Höhe (fehlende Abstimmung mit Auszug, Kassabuch, Depotauszug per Stichtag).
  pruefziele:
  - EX
  quelle: ser-2022__anh-d-s074-1
  zitat: Abstimmung der Bestände mit Kassenbüchern, Bank- und PC-Auszügen oder Wertschriftenverzeichnissen (ggf. Einsichtnahme in die vom Kunden erstellten Abstimmungen)
- text: Nicht erfasste Konten (neu eröffnete Konten, Online-/Zahlungsdienstkonten, Depots) oder nicht erfasste Bankverbindlichkeiten.
  pruefziele:
  - VO
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- text: Unverbuchte Belege per Stichtag (z. B. Spesenvorschüsse, Kassenbelege) nicht aufgearbeitet; Kassenbestand und Gegenposten unvollständig oder falsch.
  pruefziele:
  - VO
  - EX
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Auf den Bilanzstichtag sind alle unverbuchten Belege (Spesenvorschüsse etc.) aufzuarbeiten
- text: Guthaben ohne Qualifikation als flüssige Mittel unter B1 ausgewiesen (WIR-Guthaben, Guthaben bei Organisationen ohne Banklizenz, ungedeckte Checks, Kryptoansprüche).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0006-s156
  zitat: Nicht zu den flüssigen Mitteln gehören Verrechnungsforderungen gegenüber der WIR-Bank
- text: Fremdwährungsbestände zu falschem oder nicht stichtagsbezogenem Kurs umgerechnet.
  pruefziele:
  - BE
  quelle: ser-2022__anh-d-s074-1
  zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
- text: Wertschriften mit Börsenkurs falsch bewertet (Kurs, Stichtag, uneinheitliche Anwendung des Wahlrechts nach Art. 960b OR, Schwankungsreserve über der gesetzlichen Obergrenze).
  pruefziele:
  - BE
  quelle: ser-2022__anh-d-s074-1
  zitat: Vergleich der für die Bewertung angewandten Börsenkurse mit den entsprechenden Jahresendkursen von Banken, Börsen oder anderen Quellen
- text: Eigene Aktien im Wertschriftenbestand unter B1 statt als Minusposten im Eigenkapital ausgewiesen.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0637-s291
  zitat: Eigene Kapitalanteile, die das bilanzierende Unternehmen selbst hält, sind als Minusposten im Eigenkapital auszuweisen
- text: Verpfändete, gesperrte oder als Kaution gehaltene Konten falsch ausgewiesen oder im Anhang nicht offengelegt.
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0008-s157
  zitat: Konten mit eingeschränkter Verfügbarkeit (z.B. Kautionskonten) sind ggf. unter den Forderungen auszuweisen.
- text: Geld unterwegs und Überträge zwischen Geldkonten um den Stichtag doppelt oder nicht erfasst (Valuta-Datum).
  pruefziele:
  - EX
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Hierbei ist auf das Valuta-Datum abzustellen.
- text: Ungewöhnliche oder nicht geschäftsmässig begründete Geldabflüsse (z.B. an Nahestehende, Bargeldbezüge).
  pruefziele:
  - EN
  - RV
  quelle: ser-2022__anh-d-s074-1
  zitat: Durchsicht der Geldkonti auf ungewöhnliche Buchungen
- text: Negative Bankkonten mit Guthaben verrechnet statt als kurzfristige verzinsliche Verbindlichkeiten ausgewiesen.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0016-s159
  zitat: Kurzfristige Bankschulden sind unter den kurzfristigen verzinslichen Verbindlichkeiten auszuweisen
- text: Verrechnungssteuerpflichtige Zinsen netto statt brutto verbucht, Verrechnungssteuerguthaben fehlt; Rückerstattungsanspruch gefährdet.
  pruefziele:
  - VO
  - PA
  quelle: vstg__art-25
  zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung
- text: Offene Devisentermingeschäfte ohne Absicherungszweck mit negativem Marktwert nicht als Verbindlichkeit/Rückstellung erfasst.
  pruefziele:
  - BE
  - VO
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
    werden.
- text: Guthaben bei notleidenden Instituten oder mit Transferrestriktionen als flüssige Mittel ausgewiesen.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0010-s157
  zitat: Forderungen gegenüber notleidenden Finanzinstituten, Bestände an flüssigen Mitteln in Ländern mit Transferrestriktionen
- text: Liquiditätsengpass bzw. Verletzung von Kreditbedingungen als Hinweis auf gefährdete Fortführung.
  pruefziele:
  - RV
  - BE
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
unterlagen:
- dokument: Saldoliste und Hauptbuch-Kontoblätter aller Geldkonten (Kasse, Post, Banken, Online-Konten, Wertschriften) mit Vorjahr
  zweck: Ausgangsbasis für Abstimmung, Vorjahresvergleich und Durchsicht
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
- dokument: Bank-/Postauszüge bzw. Jahresabschlussauszüge per 31.12. für sämtliche Konten (inkl. Festgeld, Sparkonten, Fremdwährungskonten)
  zweck: Bestandesnachweis je Konto
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Nachweis durch Auszüge oder Bestätigungen der Post bzw. Banken
- dokument: Kassabuch und Kassenaufnahmeprotokoll per 31.12. (unterzeichnet)
  zweck: Nachweis Kassenbestand
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Physische Bestandsaufnahmen und Abstimmung mit den Kassenbüchern.
- dokument: Depot-/Wertschriftenauszug per 31.12. mit Kurswerten (inkl. Angabe allfälliger eigener Aktien)
  zweck: Bestand und Bewertung kurzfristig gehaltener Aktiven mit Börsenkurs
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Nachweis durch Wertschriftenverzeichnis einer Bank oder Inventar.
- dokument: Bankauszüge der ersten Wochen des Folgejahres (Geldkonten mit Stichtagsüberträgen)
