  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Nachweis durch Wertschriftenverzeichnis einer Bank oder Inventar.
- id: B1-320
  vorgehen: 'Anhang auf Angaben aus diesem Prüffeld prüfen: verpfändete/abgetretene Aktiven (Art. 959c Abs. 2 Ziff. 9 OR), Sicherheiten für Dritte (Ziff. 8), bei Kursbewertung Hinweis,
    Gesamtwert je Wertschriften/übrige Aktiven gesondert und Schwankungsreserve (Art. 960b OR), Umrechnungskurse bei Fremdwährungsabschluss. Beträge mit B1-101/306/308 abgleichen.'
  nachweise:
  - Anhang der Jahresrechnung
  - Ergebnisse B1-101, B1-306, B1-308
