  - Börsenabrechnungen
  - Hauptbuch Wertschriften und Finanzerfolg
  - Depotauszüge
  rechnen: Abrechnungsbetrag = Anzahl × Kurs ± Spesen/Courtage = gebuchter Betrag; realisierter Erfolg = Verkaufserlös – Buchwert
  feststellung_wenn: Buchung weicht von Abrechnung ab, Abrechnung fehlt (Pendenz) oder Erfolg falsch erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Belegprüfung einzelner wesentlicher Wertschriftentransaktionen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
- id: B1-310
  vorgehen: 'Weitergehend (WP): auf Depot-/Kontoauszügen und Verträgen Inhaber der Konten und Wertschriften prüfen (lautet auf das Unternehmen, nicht auf Aktionäre/Dritte); Treuhand-,
    Sammel- oder Drittdepots und Sicherungsübereignungen klären. Ergebnis je Konto/Depot dokumentieren.'
  nachweise:
  - Depot-/Kontoauszüge mit Inhaberangabe
  - Kontoeröffnungs-/Depotverträge
  - Treuhandverträge
  rechnen: ''
  feststellung_wenn: Konto/Depot lautet nicht auf das Unternehmen ohne nachvollziehbare vertragliche Grundlage, oder Eigentum unklar.
