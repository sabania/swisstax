  zitat: Einsicht in Kredit- und Darlehensverträge
- dokument: Pfand-, Garantie- und Sicherungsverträge (Verpfändungen, Garantiedepots, Sperrkonten)
  zweck: Verfügungsbeschränkungen und Anhangangaben
