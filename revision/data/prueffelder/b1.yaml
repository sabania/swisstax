  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Kursgewinne oder -verluste aus Fremdwährungen sind als realisiert zu betrachten.
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Die Bilanzierung zum Mittelkurs wird in der Praxis oft angewandt.
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich und Plausibilisierung der Fremdwährungsdifferenzen mit dem Geschäftsmodell
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- id: B1-303
  vorgehen: 'Zins-/Kapitalausweise mit Buchungen auf Zinsertrag/-aufwand und VSt-Guthaben abgleichen: Zins brutto erfasst, VSt als Forderung gebucht, Periode korrekt. VSt-Rechnung nur
    für Zinsen mit VSt-Abzug gemäss Ausweis (Ausnahmen Art. 5 VStG); im Zweifel Frage an den WP. Erwarteten Zins aus Ø Guthaben × Zinssatz plausibilisieren. Im Textfeld: Konto, Bruttozins,
    VSt, Buchung, Differenz.'
  nachweise:
  - Zins-/Kapitalausweise der Banken
  - Kontoblätter Zinsertrag/-aufwand
  - Kontoblatt Verrechnungssteuerguthaben
  rechnen: 'Nur Zinsen mit VSt-Abzug gemäss Ausweis: VSt = Bruttozins × 35 %; Bruttozins = Nettogutschrift / 0.65; Summe VSt lt. Ausweisen = Saldo VSt-Konto. Alle Zinsen: erwarteter
    Zins = Ø Guthaben × Zinssatz'
  feststellung_wenn: 'Bei Zinsen mit VSt-Abzug: netto gebucht oder VSt-Guthaben fehlt/nicht abgestimmt; ferner Zins in falscher Periode oder unplausible Abweichung zum Erwartungswert.'
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich des Finanzaufwands und -ertrags mit den erwarteten Werten aufgrund der verzinslichen Aktiven und Passiven
  - quelle: treuhand-almanach-2026__s068-1
    zitat: 35 % auf Kapitalerträgen und Lotteriegewinnen
  - quelle: treuhand-almanach-2026__s068-1
    zitat: in Art. 5 VStG die entsprechenden Ausnahmen aufgeführt
  - quelle: treuhand-almanach-2026__s069-2
    zitat: juristischen Personen mit Sitz in der Schweiz, sofern sie die mit der Verrechnungssteuer belasteten Einkünfte ordnungsgemäss als Ertrag verbucht haben
- id: B1-304
  vorgehen: Entwicklung flüssige Mittel und Bankkredite (X/X-1, Monatsverlauf) analysieren; Kreditlimiten aus Verträgen/Auszügen mit Beanspruchung per Stichtag vergleichen; Kontokorrentkredite
    müssen kurzfristig ausgewiesen sein. Hinweise auf Liquiditätsengpass oder verletzte Kreditbedingungen festhalten und an die Fortführungsbeurteilung melden; Einhaltung der Kreditbedingungen
    als Frage (Pendenz) erfassen.
  nachweise:
  - Saldoliste/Hauptbuch Geldkonten und Bankkredite
  - Kredit-/Kontokorrentverträge mit Limiten
  - Bankauszüge
  - Liquiditätsplanung
  rechnen: Liquiditätsveränderung = flüssige Mittel X – X-1; Ausschöpfung = beanspruchter Kredit / Limite; freie Limite = Limite – Beanspruchung
  feststellung_wenn: Limite überschritten oder voll ausgeschöpft, Kreditbedingungen verletzt, Kontokorrentkredit langfristig ausgewiesen, starker Liquiditätsabfluss mit Fortführungsrelevanz;
    fehlende Verträge als Pendenz.
  fundstellen:
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
  - quelle: hwp-bur-2023__rz-0013-s157
    zitat: In der Buchführung der Kreditnehmenden wird der beanspruchte Betrag, nicht aber die eingeräumte Kreditlimite erfasst.
  - quelle: hwp-bur-2023__rz-0012-s157
    zitat: Kontokorrentkredite sind stets als kurzfristig auszuweisen.
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung, ob die Unternehmensleitung Bestimmungen von Darlehensverträgen (z. B. Kennzahlen in Kreditverträgen) nicht eingehalten hat
- id: B1-305
  vorgehen: 'Gemäss SER weitergehend: nur bei Hinweisen auf Fehlaussagen oder erhöhtem inhärentem Risiko bzw. auf Anweisung des WP; Begründung dokumentieren. Geldkonti durchsehen: Buchungen
    über Toleranzwesentlichkeit, runde Beträge, unübliche Gegenkonten, Nahestehende, Storni, Stichtagsbuchungen. Hintergrund mit Belegen/Verträgen klären, offene Punkte als Frage erfassen;
    Auswahlkriterien und Ergebnis dokumentieren.'
  nachweise:
  - Hauptbuch Geldkonten
  - Belege und Verträge zu ausgewählten Buchungen
  - Antworten der Unternehmensleitung
  rechnen: 'Auswahl: Buchungen ≥ Toleranzwesentlichkeit oder ungewöhnlich; Summe ausgewählter Buchungen / Total Bewegungen = Abdeckung'
  feststellung_wenn: Buchung ohne geschäftlichen Grund, ohne Beleg, zugunsten Nahestehender ohne Grundlage oder in falscher Periode.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Durchsicht der Geldkonti auf ungewöhnliche Buchungen
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Unterlagen im Bereich der flüssigen Mittel (Durchsicht der Geldkonten auf ungewöhnliche Buchungen)
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Beurteilung des wirtschaftlichen Hintergrunds vorhandener wesentlicher Transaktionen mit nahestehenden Personen
- id: B1-306
  vorgehen: 'Bankkorrespondenz und Bankverträge (Kontokorrent-, Kredit-, Pfand-, Garantie-, Depotverträge) in M-Files einsehen: Konten, Limiten, Sicherheiten, Garantien zugunsten Dritter,
    Kündigungen. Erkenntnisse mit Buchhaltung und Anhang abgleichen. Im Textfeld: Vertrag, Datum, relevante Bestimmungen, Auswirkung.'
  nachweise:
  - Bankverträge
  - Bankkorrespondenz
  - Pfand- und Garantieverträge
  rechnen: ''
  feststellung_wenn: Vertrag zeigt Konto, Kredit, Sicherheit oder Garantie, die in Buchhaltung oder Anhang fehlt; fehlende Verträge als Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in Kredit- und Darlehensverträge
  - quelle: hwp-er-2026__rz-0118-s201
    zitat: Das Aktenstudium kann einerseits zur Prüfung buchmässig erfasster und belegter Sachverhalte erforderlich sein
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über Bestand und Veränderungen von Bürgschaften, Garantieverpflichtungen und Pfandbestellungen zugunsten Dritter
- id: B1-307
  vorgehen: 'Frage nach offenen Devisenkontrakten und Absicherungszweck als Pendenz erfassen; vorhandene Kontraktübersicht/Bankbewertung per 31.12. in M-Files auswerten (kein Kundenkontakt).
    Methode feststellen: Niederstwert oder Marktwert, einheitlich je Position; mit Absicherungszweck wahlweise Hedge Accounting. Negativer Marktwert ohne Absicherungszweck als Verbindlichkeit/Rückstellung;
    bei Marktwertbewertung Anhanghinweis.'
  nachweise:
  - Kontraktübersicht/Bankbewertung per 31.12. (in M-Files)
  - Kontrakte/Abrechnungen
  - Schriftliche Antwort der Unternehmensleitung (Absicherungszweck, Grundgeschäft)
  rechnen: 'Massgebend: Marktwert gemäss Bankbewertung; Summe negative Marktwerte ohne Absicherungszweck = Verbindlichkeit/Rückstellung. Plausibilisierung: Kauf FW = Nominal × (Terminkurs
    Stichtag – Kontraktkurs); Verkauf FW = Nominal × (Kontraktkurs – Terminkurs Stichtag)'
  feststellung_wenn: Negativer Marktwert ohne Absicherungszweck nicht erfasst, Methode uneinheitlich, Abweichung zur Bankbewertung oder Marktwertbewertung ohne Anhanghinweis; fehlende
    Unterlagen als Pendenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0074-s175
    zitat: sind die Anschaffungskosten in der Regel null
  - quelle: hwp-bur-2023__rz-0075-s176-t2
    zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
      werden.
  - quelle: hwp-bur-2023__rz-0075-s176-t1
    zitat: Weiter ist zu beachten, dass die Marktwertbewertung für alle Posten der betreffenden Bilanzposition vorzunehmen ist
  - quelle: hwp-bur-2023__rz-0076-s176
    zitat: Derivate mit Absicherungszweck können wahlweise entweder analog zu Derivaten ohne Absicherungszweck oder dann unter Anwendung von Hedge Accounting bewertet werden
  - quelle: or__art-960b
    zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Die eingeschränkte Revision beschränkt sich auf die im Unternehmen intern vorhandenen Unterlagen.
- id: B1-308
  vorgehen: 'Für kurzfristig gehaltene Wertschriften Anzahl und Kurs der Buchhaltung mit Depotauszug bzw. Jahresendkursen per 31.12. vergleichen und Wert nachrechnen. Grundsatz feststellen
    (Art. 960b OR einheitlich je Position oder höchstens Anschaffungswert), Schwankungsreserve samt Obergrenze prüfen, eigene Aktien im Bestand feststellen. Im Textfeld: Titel, Anzahl,
    Kurs Buchhaltung, Kurs Quelle, Differenz.'
  nachweise:
  - Depotauszug per 31.12.
  - Kursliste Jahresendkurse
  - Wertschriftenverzeichnis der Buchhaltung (Anschaffungswerte)
  rechnen: 'Anzahl × Jahresendkurs (× Devisenkurs) = Soll-Bilanzwert; Differenz = Buchwert – Soll-Bilanzwert; ohne Art. 960b: Buchwert ≤ Anschaffungswert; Schwankungsreserve ≤ Kurswert
    – min(Anschaffungswert; Kurswert)'
  feststellung_wenn: Abweichung über Nicht-Aufgriffsgrenze, uneinheitliche Bewertung, Schwankungsreserve über Obergrenze, eigene Aktien unter B1 oder Kursbewertung ohne Anhanghinweis.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Bewertung angewandten Börsenkurse mit den entsprechenden Jahresendkursen von Banken, Börsen oder anderen Quellen
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Kurzfristig gehaltene Aktiven mit Börsenkurs oder beobachtbarem Marktpreis sind zum Börsenkurs oder zum beobachtbaren Marktpreis am Bilanzstichtag zu bewerten
  - quelle: or__art-960b
    zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
  - quelle: or__art-960b
    zitat: Solche Wertberichtigungen sind jedoch nicht zulässig, wenn dadurch sowohl der Anschaffungswert als auch der allenfalls tiefere Kurswert unterschritten würden.
  - quelle: or__art-960a
    zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
  - quelle: hwp-bur-2023__rz-0637-s291
    zitat: Eigene Kapitalanteile, die das bilanzierende Unternehmen selbst hält, sind als Minusposten im Eigenkapital auszuweisen
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile
- id: B1-309
  vorgehen: 'Weitergehend (WP): wesentliche Käufe/Verkäufe von Wertschriften aus Hauptbuch auswählen und mit Börsenabrechnung abgleichen (Titel, Anzahl, Kurs, Spesen, Datum, Gegenbuchung);
    realisierte Gewinne/Verluste nachvollziehen. Auswahlkriterium und Ergebnis dokumentieren.'
