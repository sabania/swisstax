- id: B1-401
  vorgehen: 'Nur auf Anweisung des WP: systematischer Abgleich aller Positionen je Bank anhand von Bankbestätigungen (Konten, Salden, Kredite, Limiten, Garantien, Sicherheiten mit Hauptbuch
    und Anhang). Ohne Anweisung: kein Eintrag im Textfeld, im Rapport «nicht bearbeitet – nur auf Anweisung», keine Pendenz. Keine eigenen Bankbestätigungen anfordern. Abgrenzung: Eine
    vom Unternehmen eingeholte Bestätigung, die schon in der Akte liegt, ist eine Unterlage des Kunden (HWP ER Rz 137) und wird ohne Anweisung in den zugehörigen Schritten ausgewertet
    – B1-301 (Saldi, Vollständigkeit der Konti), B1-101/B1-320 (Verpfändungen, Sicherheiten, Garantien), C1-102 (Zession), L1-102/L1-301/L1-303 (Kredite, Limiten, Sicherheiten). Mit
    Anweisung: Herkunft dokumentieren, je Bank alle Positionen abgleichen. Fehlen Bestätigungen: als nicht anwendbar vorschlagen (Entscheid WP); Vollständigkeit über Auszüge/Antworten
    belegen.'
  nachweise:
  - Vom Unternehmen eingeholte Bankbestätigungen
  - Hauptbuch/Saldoliste
  - Anhang
  rechnen: 'Je Konto: Saldo Bestätigung = Saldo Hauptbuch; Anzahl Konten Bestätigung = Anzahl Konten Hauptbuch je Bank; Summe Verpflichtungen Bestätigung = Bilanz/Anhang'
