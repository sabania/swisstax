schritte:
- id: B1-101
  vorgehen: 'Zuerst vorhandene schriftliche Antworten (z. B. 10.11 Kundenbefragung) zu Verpfändungen, Sperren, Garantiedepots und Verrechnungsrechten auswerten, sonst Frage als Pendenz;
    Status höchstens «teilweise bearbeitet». Antwort mit Bankauszügen, Pfand-/Kreditverträgen und vorhandenen Bankbestätigungen abgleichen. Im Textfeld: Frage, Antwort, Datum, Konten/Beträge,
    Folgerung für Ausweis und Anhang.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung (z. B. 10.11 Kundenbefragung)
  - Pfand-/Garantieverträge
  - Bankauszüge Garantie-/Sperrkonten
  - Vorhandene Bankbestätigungen
  rechnen: Summe verpfändete/gesperrte Guthaben = Betrag Anhangangabe Art. 959c Abs. 2 Ziff. 9 OR
  feststellung_wenn: Verpfändung/Sperre bekannt, aber nicht im Anhang offengelegt, oder Kautions-/Sperrkonto ohne Prüfung des Ausweises unter flüssigen Mitteln; fehlende Antwort als
    Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Befragung über allfällige Verpfändungen und Verfügungsbeschränkungen
  - quelle: hwp-bur-2023__rz-0008-s157
    zitat: Solche Fälle müssen jedoch im Anhang offengelegt werden
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- id: B1-102
  vorgehen: 'Weitergehend (WP): nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko bzw. auf Anweisung des WP; Begründung dokumentieren. Vorhandene schriftliche
    Antworten (z. B. 10.11) zu aussergewöhnlichen Geldtransaktionen auswerten, sonst Frage als Pendenz; Status höchstens «teilweise bearbeitet». Antwort mit Auffälligkeiten aus B1-305
    abgleichen; Frage und Antwort dokumentieren.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Hauptbuch Geldkonten
  - Belege zu genannten Transaktionen
  rechnen: ''
  feststellung_wenn: Aussergewöhnliche Transaktion ohne nachvollziehbaren wirtschaftlichen Hintergrund, falsche Periode oder Widerspruch zwischen Antwort und Buchhaltung.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Befragung zu aussergewöhnlichen Transaktionen
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
      anzunehmen sind
  - quelle: hwp-er-2026__rz-0103-s197
    zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- id: B1-201
  vorgehen: 'WP-Schritt (Katalog): nur auf Anweisung des WP oder bei Hinweisen auf wesentliche Fehlaussagen bzw. erhöhtem inhärentem Risiko; Begründung dokumentieren. Kasse X/X-1 und
    Monatsverlauf (Hauptbuch) vergleichen, Höhe gegenüber Geschäftstätigkeit beurteilen; negative Zwischensalden, hohe Bestände, Sprünge und unverbuchte Belege per Stichtag als Frage
    erfassen. Im Textfeld: Bestände, Veränderung, Erwartung, Ergebnis.'
  nachweise:
  - Saldoliste Vorjahr/aktuell
  - Kontoblatt Kasse
  - Kassabuch
  rechnen: Veränderung Kasse = Saldo 31.12.X – Saldo 31.12.X-1; Anteil Kasse = Kasse / Total flüssige Mittel; Prüfung negativer Zwischensalden im Kontoblatt
  feststellung_wenn: Negativer Kassensaldo, unplausibel hoher Bestand, unverbuchte Belege per Stichtag oder Veränderung ohne Erklärung über der Nicht-Aufgriffsgrenze.
  fundstellen:
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Physische Bestandsaufnahmen und Abstimmung mit den Kassenbüchern.
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Auf den Bilanzstichtag sind alle unverbuchten Belege (Spesenvorschüsse etc.) aufzuarbeiten
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
      anzunehmen sind
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- id: B1-202
  vorgehen: 'WP-Schritt (Katalog): nur auf Anweisung des WP oder bei Hinweisen auf wesentliche Fehlaussagen bzw. erhöhtem inhärentem Risiko; Begründung dokumentieren. Überträge zwischen
    Geldkonten um den Stichtag aus Hauptbuch und Auszügen Dez./Jan. auflisten, Belastung und Gutschrift paaren, Valuta-Datum vergleichen; Geld unterwegs, Doppel- und Nichterfassungen
    erkennen. Im Textfeld: Überträge, Paarung, offene Posten.'
  nachweise:
  - Hauptbuch Geldkonten Dezember
  - Bankauszüge Dezember und Januar Folgejahr
  - Kontoblätter Folgejahr
  rechnen: 'Je Übertrag: Belastung Konto A = Gutschrift Konto B; Summe ungepaarter Überträge per 31.12. = Geld unterwegs; Differenz Buchdatum vs. Valuta-Datum'
  feststellung_wenn: Übertrag nur einseitig per 31.12. erfasst, doppelt erfasst oder Geld unterwegs nicht korrekt abgegrenzt; ungeklärter Übertrag als Pendenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0004-s156
    zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Hierbei ist auf das Valuta-Datum abzustellen.
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
      anzunehmen sind
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- id: B1-301
  vorgehen: 'Je Geldkonto Saldo Hauptbuch 31.12. mit Nachweis per Stichtag abstimmen: Kassabuch/Kassenaufnahmeprotokoll, PC-/Bankauszug, Festgeldkorrespondenz, Depotauszug; bei Differenzen
    Kunden-Überleitung einsehen. Auszug auf anderen Stichtag oder unverbuchte Belege als Pendenz. Vollständigkeit der Konti mit Bankenliste abgleichen. Im Textfeld: Konto, Buchsaldo,
    Nachweissaldo, Differenz, Dokument (M-Files-ID).'
  nachweise:
  - Saldoliste/Hauptbuch
  - Kassabuch und Kassenaufnahmeprotokoll
  - Bank-/PC-Auszüge per 31.12.
  - Festgeldbestätigungen
  - Depotauszug per 31.12.
  rechnen: 'Je Konto: Saldo Hauptbuch 31.12. = Saldo Nachweis ± Überleitungsposten; Summe Konten flüssige Mittel = Bilanzposition'
  feststellung_wenn: Differenz Buch-/Nachweissaldo ohne Überleitung, kein Stichtagsnachweis (Pendenz), ungebuchtes Konto oder Guthaben ohne Qualifikation als flüssige Mittel (z. B. ohne
    Banklizenz, WIR) unter B1.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Abstimmung der Bestände mit Kassenbüchern, Bank- und PC-Auszügen oder Wertschriftenverzeichnissen (ggf. Einsichtnahme in die vom Kunden erstellten Abstimmungen)
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Nachweis durch Auszüge oder Bestätigungen der Post bzw. Banken
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Auf den Bilanzstichtag sind alle unverbuchten Belege (Spesenvorschüsse etc.) aufzuarbeiten
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-bur-2023__rz-0005-s156
    zitat: Forderungen gegenüber Organisationen ohne Banklizenz
- id: B1-302
  vorgehen: 'Für alle Fremdwährungskonten (Kasse, Bank) Währungssaldo und angewandten Kurs aus der Buchhaltung mit dem Jahresendkurs gemäss Bankauszug oder Kursliste per 31.12. vergleichen
    und den CHF-Wert nachrechnen. Kursdifferenzen mit den Konten Kursgewinn/-verlust plausibilisieren. Im Textfeld: Konto, FW-Saldo, Kurs Buchhaltung, Kurs Quelle, CHF-Differenz.'
  nachweise:
  - Bankauszüge Fremdwährungskonten per 31.12.
  - Devisenkursliste per 31.12.
  - Kontoblätter Kursdifferenzen
  rechnen: FW-Saldo × Stichtagskurs = Soll-Buchwert CHF; Differenz = Buchwert CHF – Soll-Buchwert CHF
  feststellung_wenn: 'Umrechnung nicht zum Stichtagskurs oder Differenz über der Nicht-Aufgriffsgrenze: begründeter Buchungsvorschlag als Notiz «Wesentliche Feststellungen», keine Verbuchung.'
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
