  - quelle: or__art-960b
    zitat: Der Gesamtwert der entsprechenden Aktiven muss für Wertschriften und übrige Aktiven mit beobachtbarem Marktpreis je gesondert offengelegt werden.
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- id: B1-322
  vorgehen: 'Dauerakte nachführen: Liste der Bankbeziehungen und Konten (inkl. Online-Konten), Kredit-, Pfand- und Garantieverträge, Zeichnungsberechtigungen, Bewertungsgrundsatz Wertschriften.
    Neue/geänderte Dokumente in M-Files verknüpfen; Änderungen gegenüber Vorjahr im Textfeld nennen.'
