# Prüffeld B1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: B1
bezeichnung: Flüssige Mittel und kurzfristig gehaltene Aktiven mit Börsenkurs
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-11'
  nachpruefung:
    urteil: null
    befunde: 0
    korrigiert: false
kurzbeschrieb: 'Position nach Art. 959a Abs. 1 Ziff. 1 lit. a OR: Kasse, Post-/Bankguthaben auf Sicht, Festgelder bis 3 Monate, Online-Zahlungskonten, kurzfristig gehaltene Wertschriften
  mit Börsenkurs. Eingeschränkte Revision: Bestand/Vollständigkeit durch Abstimmung mit internen Unterlagen (Auszüge, Kassabuch, Depot), Bewertung (Devisen-/Börsenkurse), Verpfändungen
  und Anhang; keine eigenen Bankbestätigungen.'
gesetz:
- thema: 'Mindestgliederung: Bilanzposition flüssige Mittel und kurzfristig gehaltene Aktiven mit Börsenkurs (Art. 959a Abs. 1 Ziff. 1 lit. a OR)'
  quelle: or__art-959a-t1
  zitat: flüssige Mittel und kurzfristig gehaltene Aktiven mit Börsenkurs
- thema: Bestandesnachweis durch Inventar oder auf andere Art (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Vollständigkeit und Verrechnungsverbot (Art. 958c Abs. 1 Ziff. 2 und 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Belegnachweis für jede Buchung (Art. 957a Abs. 2 Ziff. 2 und Abs. 3 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: Vorsichtige Bewertung, Überprüfung bei Anzeichen für Überbewertung (Art. 960 Abs. 2 und 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Bewertung zum Börsenkurs, Stetigkeit über die ganze Position, Anhanghinweis (Art. 960b Abs. 1 OR)
  quelle: or__art-960b
  zitat: Wer von diesem Recht Gebrauch macht, muss alle Aktiven der entsprechenden Positionen der Bilanz, die einen beobachtbaren Marktpreis aufweisen, zum Kurs oder Marktpreis am Bilanzstichtag
    bewerten.
- thema: Schwankungsreserve auf Aktiven mit Börsenkurs, gesonderter Ausweis (Art. 960b Abs. 2 OR)
  quelle: or__art-960b
  zitat: Der Betrag der Schwankungsreserven ist insgesamt in der Bilanz oder im Anhang gesondert auszuweisen.
- thema: 'Anhang: verpfändete Aktiven und Sicherheiten für Dritte (Art. 959c Abs. 2 Ziff. 8 und 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: Umrechnungskurse im Anhang bei Rechnungslegung in Fremdwährung (Art. 958d Abs. 3 OR)
  quelle: or__art-958d
  zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: Ausgewiesene Guthaben bestehen nicht oder nicht in dieser Höhe (fehlende Abstimmung mit Auszug, Kassabuch, Depotauszug per Stichtag).
  pruefziele:
  - EX
  quelle: ser-2022__anh-d-s074-1
  zitat: Abstimmung der Bestände mit Kassenbüchern, Bank- und PC-Auszügen oder Wertschriftenverzeichnissen (ggf. Einsichtnahme in die vom Kunden erstellten Abstimmungen)
- text: Nicht erfasste Konten (neu eröffnete Konten, Online-/Zahlungsdienstkonten, Depots) oder nicht erfasste Bankverbindlichkeiten.
  pruefziele:
  - VO
  quelle: or__art-958c
  zitat: Sie muss vollständig sein.
- text: Fremdwährungsbestände zu falschem oder nicht stichtagsbezogenem Kurs umgerechnet.
  pruefziele:
  - BE
  quelle: ser-2022__anh-d-s074-1
  zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
- text: Wertschriften mit Börsenkurs falsch bewertet (Kurs, Stichtag, uneinheitliche Anwendung des Wahlrechts nach Art. 960b OR).
  pruefziele:
  - BE
  quelle: ser-2022__anh-d-s074-1
  zitat: Vergleich der für die Bewertung angewandten Börsenkurse mit den entsprechenden Jahresendkursen von Banken, Börsen oder anderen Quellen
- text: Verpfändete, gesperrte oder als Kaution gehaltene Konten falsch ausgewiesen oder im Anhang nicht offengelegt.
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0008-s157
  zitat: Konten mit eingeschränkter Verfügbarkeit (z.B. Kautionskonten) sind ggf. unter den Forderungen auszuweisen.
- text: Geld unterwegs und Überträge zwischen Geldkonten um den Stichtag doppelt oder nicht erfasst (Valuta-Datum).
  pruefziele:
  - EX
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Hierbei ist auf das Valuta-Datum abzustellen.
- text: Ungewöhnliche oder nicht geschäftsmässig begründete Geldabflüsse (z.B. an Nahestehende, Bargeldbezüge).
  pruefziele:
  - EN
  - RV
  quelle: ser-2022__anh-d-s074-1
  zitat: Durchsicht der Geldkonti auf ungewöhnliche Buchungen
- text: Negative Bankkonten mit Guthaben verrechnet statt als kurzfristige verzinsliche Verbindlichkeiten ausgewiesen.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0016-s159
  zitat: Kurzfristige Bankschulden sind unter den kurzfristigen verzinslichen Verbindlichkeiten auszuweisen
- text: Zinsen netto statt brutto verbucht, Verrechnungssteuerguthaben fehlt; Rückerstattungsanspruch gefährdet.
  pruefziele:
  - VO
  - PA
  quelle: treuhand-almanach-2026__s069-2
  zitat: juristischen Personen mit Sitz in der Schweiz, sofern sie die mit der Verrechnungssteuer belasteten Einkünfte ordnungsgemäss als Ertrag verbucht haben
- text: Offene Devisentermingeschäfte mit negativem Marktwert nicht als Verbindlichkeit/Rückstellung erfasst.
  pruefziele:
  - BE
  - VO
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
    werden.
- text: Guthaben bei notleidenden Instituten oder mit Transferrestriktionen als flüssige Mittel ausgewiesen.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0010-s157
  zitat: Forderungen gegenüber notleidenden Finanzinstituten, Bestände an flüssigen Mitteln in Ländern mit Transferrestriktionen
- text: Liquiditätsengpass bzw. Verletzung von Kreditbedingungen als Hinweis auf gefährdete Fortführung.
  pruefziele:
  - RV
  - BE
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
unterlagen:
- dokument: Saldoliste und Hauptbuch-Kontoblätter aller Geldkonten (Kasse, Post, Banken, Online-Konten, Wertschriften) mit Vorjahr
  zweck: Ausgangsbasis für Abstimmung, Vorjahresvergleich und Durchsicht
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
- dokument: Bank-/Postauszüge bzw. Jahresabschlussauszüge per 31.12. für sämtliche Konten (inkl. Festgeld, Sparkonten, Fremdwährungskonten)
  zweck: Bestandesnachweis je Konto
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Nachweis durch Auszüge oder Bestätigungen der Post bzw. Banken
- dokument: Kassabuch und Kassenaufnahmeprotokoll per 31.12. (unterzeichnet)
  zweck: Nachweis Kassenbestand
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Physische Bestandsaufnahmen und Abstimmung mit den Kassenbüchern.
- dokument: Depot-/Wertschriftenauszug per 31.12. mit Kurswerten
  zweck: Bestand und Bewertung kurzfristig gehaltener Aktiven mit Börsenkurs
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Nachweis durch Wertschriftenverzeichnis einer Bank oder Inventar.
- dokument: Bankauszüge der ersten Wochen des Folgejahres (Geldkonten mit Stichtagsüberträgen)
  zweck: Abklärung Überträge/Geld unterwegs um den Stichtag
  quelle: hwp-bur-2023__rz-0004-s156
  zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
- dokument: Devisenkursliste per 31.12. (Bank oder andere Quelle)
  zweck: Vergleich der Umrechnungskurse
  quelle: ser-2022__anh-d-s074-1
  zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
- dokument: Zins- und Kapitalausweise der Banken mit Verrechnungssteuerabzug
  zweck: Prüfung Bruttoverbuchung Zinsen und VSt-Guthaben
- dokument: Kredit-, Rahmen- und Kontokorrentverträge inkl. Limiten; Bankkorrespondenz
  zweck: Kreditlimiten, Sicherheiten, Bedingungen
  quelle: ser-2022__anh-d-s085-1
  zitat: Einsicht in Kredit- und Darlehensverträge
- dokument: Pfand-, Garantie- und Sicherungsverträge (Verpfändungen, Garantiedepots, Sperrkonten)
  zweck: Verfügungsbeschränkungen und Anhangangaben
  quelle: ser-2022__anh-d-s097-1
  zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- dokument: Bankbestätigungen, sofern vom Unternehmen selbst bei der Abschlusserstellung eingeholt
  zweck: Zusätzlicher Nachweis Bestand und Vollständigkeit (kein eigenes Einholen durch die Revisionsstelle)
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat, kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise
    beiziehen
- dokument: Übersicht offene Devisentermingeschäfte/Derivate per 31.12. mit Marktwerten der Bank
  zweck: Bewertung offener Kontrakte
  quelle: hwp-bur-2023__rz-0064-s173
  zitat: Devisentermingeschäfte sind OTC-Geschäfte
- dokument: Wertschriftenabrechnungen (Kauf/Verkauf) wesentlicher Transaktionen
  zweck: Belegprüfung Wertschriftentransaktionen
  quelle: ser-2022__anh-d-s074-1
  zitat: Belegprüfung einzelner wesentlicher Wertschriftentransaktionen
- dokument: Liquiditätsplanung / Budget Folgejahr
  zweck: Beurteilung Liquiditätsentwicklung und Fortführung
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Abfluss von Liquidität aus dem operativen Geschäft («Cash Drain»)
bewertung:
- regel: Flüssige Mittel = Kasse sowie Post- und Bankguthaben auf Sicht; Festgelder nur bei Restlaufzeit bis drei Monate ab Bilanzstichtag.
  quelle: hwp-bur-2023__rz-0003-s156
  zitat: Ebenfalls zu den flüssigen Mitteln können Festgeldguthaben gezählt werden, die eine Restlaufzeit von höchstens drei Monaten ab Bilanzstichtag aufweisen.
- regel: Länger gebundene oder kündbare Bankguthaben gehören zu den übrigen kurzfristigen Forderungen.
  quelle: hwp-bur-2023__rz-0009-s157
  zitat: sind nicht unter den flüssigen Mitteln, sondern unter den übrigen kurzfristigen Forderungen auszuweisen
- regel: Verpfändete Konten bleiben flüssige Mittel, sind aber im Anhang offenzulegen; Kautionskonten ggf. unter Forderungen.
  quelle: hwp-bur-2023__rz-0008-s157
  zitat: Verpfändete Konten oder Konten, auf welchen die Bank ein Verrechnungsrecht im Rahmen einer Cash-Pool-Rahmenvereinbarung hat, qualifizieren hingegen als flüssige Mittel.
- regel: Geld unterwegs in der Regel unter flüssigen Mitteln; Bestandsermittlung nach Valuta-Datum.
  quelle: hwp-bur-2023__rz-0004-s156
  zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
- regel: Konten in Buchführungswährung zum Nennwert.
  quelle: hwp-bur-2023__rz-0015-s158
  zitat: In Buchführungswährung lautende Konten sind zum Nennwert zu bewerten.
- regel: Fremdwährungskasse zu Noten-/Jahresendkursen; FW-Bankguthaben zum Devisenkurs am Bilanzstichtag (Geldkurs; Mittelkurs als Vereinfachung, wenn Differenz unwesentlich); Kursdifferenzen
    gelten als realisiert.
  quelle: hwp-bur-2023__rz-0015-s158
  zitat: Kassenbestände in Fremdwährung sind anhand der Notenkurse bzw. Jahresendkurse umzurechnen.
- regel: Flüssige Mittel und Bankguthaben auf Sicht uneingeschränkt zum Devisenkurs des Bilanzstichtags.
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Bankguthaben und -schulden auf Sicht und Aktiven mit Börsenkurs oder einem anderen beobachtbaren Marktpreis können uneingeschränkt zum Devisenkurs des Bilanzstichtags ausgewiesen
    werden.
- regel: Kurzfristig gehaltene Aktiven mit Börsenkurs zum Kurs am Bilanzstichtag; Gewinne/Verluste realisiert.
  quelle: hwp-bur-2023__rz-0015-s158
  zitat: Kurzfristig gehaltene Aktiven mit Börsenkurs oder beobachtbarem Marktpreis sind zum Börsenkurs oder zum beobachtbaren Marktpreis am Bilanzstichtag zu bewerten
- regel: Bei Bewertung zum Börsenkurs Hinweis im Anhang; Schwankungsreserve zulässig, aber gesondert auszuweisen.
  quelle: or__art-960b
  zitat: so darf eine Wertberichtigung zulasten der Erfolgsrechnung gebildet werden, um Schwankungen im Kursverlauf Rechnung zu tragen
- regel: Bankschulden unter kurzfristigen verzinslichen Verbindlichkeiten; Verrechnung nur gleichartiger, gleichzeitig fälliger Positionen derselben Bank bei vertraglicher Zulässigkeit.
  quelle: hwp-bur-2023__rz-0016-s159
  zitat: können miteinander verrechnet werden, sofern die Vertragsbedingungen dies zulassen (Art. 120 OR)
- regel: Kontokorrentkredite stets kurzfristig; gebucht wird nur der beanspruchte Betrag, nicht die Limite.
  quelle: hwp-bur-2023__rz-0013-s157
  zitat: In der Buchführung der Kreditnehmenden wird der beanspruchte Betrag, nicht aber die eingeräumte Kreditlimite erfasst.
- regel: 'Guthaben bei notleidenden Finanzinstituten/mit Transferrestriktionen: Ausweis unter übrigen Forderungen, ggf. Wertberichtigung.'
  quelle: hwp-bur-2023__rz-0010-s157
  zitat: Forderungen gegenüber notleidenden Finanzinstituten, Bestände an flüssigen Mitteln in Ländern mit Transferrestriktionen
- regel: 'Devisentermingeschäfte: Ersterfassung in der Regel zu null; Folgebewertung nach Niederstwertprinzip oder zu Marktwerten (einheitlich je Position); negativer Marktwert ohne
    Absicherungszweck als Verbindlichkeit/Rückstellung.'
  quelle: hwp-bur-2023__rz-0074-s175
  zitat: sind die Anschaffungskosten in der Regel null
- regel: Getrennter Ausweis von flüssigen Mitteln und Wertschriften in Bilanz oder Anhang empfohlen.
  quelle: hwp-bur-2023__rz-0016-s159
  zitat: empfiehlt sich aus Gründen der Klarheit ein getrennter Ausweis in der Bilanz oder im Anhang
- regel: 'Verrechnungssteuer: Rückerstattung an juristische Personen nur bei ordnungsgemässer Verbuchung der belasteten Erträge als Ertrag (35 % auf Kapitalerträgen).'
  quelle: treuhand-almanach-2026__s069-2
  zitat: juristischen Personen mit Sitz in der Schweiz, sofern sie die mit der Verrechnungssteuer belasteten Einkünfte ordnungsgemäss als Ertrag verbucht haben
fallstricke:
- text: Bankbestätigungen selbst einholen ist nicht Teil der eingeschränkten Revision; der Agent fordert keine Bestätigungen bei Banken an und verwendet nur beim Unternehmen vorhandene
    Bestätigungen.
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: Weitergehende Handlungen (Durchsicht Geldkonti, Belegprüfung Wertschriften, Eigentumsrechte, Befragung zu aussergewöhnlichen Transaktionen) nur bei Hinweisen auf Fehlaussagen
    oder erhöhtem inhärentem Risiko; Begründung dokumentieren.
  quelle: hwp-er-2026__rz-0132-s203
  zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt, wenn entweder nach Durchführung von empfohlenen Prüfungshandlungen wesentliche Fehlaussagen
    anzunehmen sind
- text: Bei wesentlichen Beständen genügt eine Befragung allein nicht; immer mit Abstimmung/Detailprüfung ergänzen.
  quelle: hwp-er-2026__rz-0105-s198
  zitat: Gemäss SER stützt sich der Abschlussprüfer bei wesentlichen Jahresabschlussposten nicht nur auf Befragungen ab
- text: Befragungen nur als schriftlich festgehaltene Frage und Antwort verwertbar; mündliche Auskünfte ohne Dokumentation sind kein Prüfungsnachweis.
  quelle: hwp-er-2026__rz-0103-s197
  zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- text: Kontoauszüge, die nicht auf den Bilanzstichtag lauten (z.B. Halbjahres- oder Vormonatsauszug), belegen den Bestand per 31.12. nicht; Pendenz erfassen.
  quelle: hwp-bur-2023__rz-0014-s158
  zitat: Hierbei ist auf das Valuta-Datum abzustellen.
- text: 'Screenshots oder App-Ansichten von Online-Konten: Echtheit, Stichtag und Kontoinhaber kritisch würdigen.'
  quelle: hwp-er-2026__rz-0116-s201
  zitat: Echtheit des Belegs (insbesondere bei nur in elektronischer Form vorliegenden Belegen)
- text: Guthaben bei Anbietern ohne Banklizenz (Zahlungsdienstleister, Gutscheine) nicht ungeprüft als flüssige Mittel übernehmen; Ausweis durch Fachperson beurteilen lassen (Analogie).
  quelle: hwp-bur-2023__rz-0005-s156
  zitat: Forderungen gegenüber Organisationen ohne Banklizenz
- text: Zero-Balancing-Cash-Pool-Guthaben sind in der Regel keine flüssigen Mittel.
  quelle: hwp-bur-2023__rz-0007-s156
  zitat: grundsätzlich Forderungen gegenüber Konzerngesellschaften dar und dürfen in aller Regel nicht unter den flüssigen Mitteln
- text: Negative Kontokorrente nicht mit Guthaben anderer Konten/Banken saldieren (Verrechnungsverbot).
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- text: Das Wahlrecht zur Börsenkursbewertung gilt für die ganze Bilanzposition, nicht titelweise.
  quelle: or__art-960b
  zitat: Wer von diesem Recht Gebrauch macht, muss alle Aktiven der entsprechenden Positionen der Bilanz, die einen beobachtbaren Marktpreis aufweisen, zum Kurs oder Marktpreis am Bilanzstichtag
    bewerten.
- text: Der Agent kann keine Kassenaufnahme durchführen; er stützt sich auf das Protokoll des Kunden und erfasst bei Fehlen eine Pendenz.
- text: Keine Funktionsprüfungen des IKS (z.B. Visa-/Zahlungsfreigaben) als eigenes Prüfziel; Visierung nur als Nachweis im Einzelfall.
  quelle: hwp-er-2026__rz-0098-s197
  zitat: Funktionsprüfungen als Teil der Prüfungshandlungen sind in der eingeschränkten Revision nicht vorgesehen
fragen_kunde:
- frage: Bestehen per Stichtag Verpfändungen, Sperren, Garantiedepots, Verrechnungsrechte der Bank oder andere Verfügungsbeschränkungen auf Konten oder Depots? Bitte Verträge beilegen.
  zweck: B1-101 (RV), Ausweis und Anhangangabe Art. 959c Abs. 2 Ziff. 9 OR
- frage: Gab es im Geschäftsjahr aussergewöhnliche Geldtransaktionen (grosse Bargeldbezüge, Zahlungen an Aktionäre/Nahestehende, Zahlungen ohne Rechnung, Krypto-/Auslandzahlungen)?
  zweck: B1-102 (EN, PA); schriftliche Antwort dokumentieren
- frage: Sind sämtliche Bank-, Post-, Online-Zahlungs- und Depotkonten (inkl. im Jahr eröffneter oder saldierter Konten) in der Buchhaltung erfasst? Bitte vollständige Kontenliste je
    Institut.
  zweck: Vollständigkeit (VO), B1-301/B1-401
- frage: Wer hat die Kassenaufnahme per 31.12. durchgeführt und wo ist das unterzeichnete Protokoll?
  zweck: B1-201/B1-301 Nachweis Kassenbestand
- frage: Welche Kreditlimiten bestehen, wurden Kreditbedingungen (Kennzahlen/Covenants) eingehalten und gab es nach dem Stichtag neue Kredite, Garantien oder Kündigungen?
  zweck: B1-304/B1-306, Fortführung, Ereignisse nach dem Bilanzstichtag
- frage: Bestehen per Stichtag offene Devisentermingeschäfte oder andere Derivate? Bitte Bankbewertung per 31.12. einreichen.
  zweck: B1-307 (BE, VO)
- frage: Nach welchem Grundsatz werden Wertschriften bewertet (Anschaffungs-/Niederstwert oder Börsenkurs nach Art. 960b OR) und besteht eine Schwankungsreserve?
  zweck: B1-308, Stetigkeit, Anhanghinweis
- frage: Hat das Unternehmen selbst Bankbestätigungen per Stichtag eingeholt? Falls ja, bitte vollständig einreichen.
  zweck: 'B1-401: Verwendung nur von beim Unternehmen vorhandenen Bestätigungen'
- frage: Wurde die Verrechnungssteuer auf Zinserträgen zurückgefordert bzw. als Guthaben erfasst?
  zweck: B1-303 (VO, PA)
