- id: B1-401
  vorgehen: 'Nur auf Anweisung des WP; ohne Anweisung Schritt offen lassen (Hinweis als Pendenz). Keine eigenen Bankbestätigungen anfordern. Vom Unternehmen eingeholte Bestätigungen:
    Herkunft dokumentieren, je Bank Konten, Salden, Kredite, Garantien, Sicherheiten mit Hauptbuch und Anhang abgleichen. Fehlen sie: als nicht anwendbar vorschlagen (Entscheid WP);
    Vollständigkeit über Auszüge/Antworten belegen.'
