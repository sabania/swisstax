- id: B1-202
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung des WP bearbeiten. Ohne Anweisung: kein Eintrag im Textfeld, im Rapport «nicht bearbeitet – WP-Schritt»; Auffälligkeiten aus
    anderen Schritten (z.B. B1-301, B1-305) nur als Notiz für den WP. Mit Anweisung: Überträge zwischen Geldkonten um den Stichtag aus Hauptbuch und Auszügen Dez./Jan. auflisten, Belastung
    und Gutschrift paaren, Valuta-Datum vergleichen; Geld unterwegs, Doppel- und Nichterfassungen erkennen. Im Textfeld: Überträge, Paarung, offene Posten.'
  nachweise:
  - Hauptbuch Geldkonten Dezember
  - Bankauszüge Dezember und Januar Folgejahr
  - Kontoblätter Folgejahr
  rechnen: 'Je Übertrag: Belastung Konto A = Gutschrift Konto B; Summe ungepaarter Überträge per 31.12. = Geld unterwegs; Differenz Buchdatum vs. Valuta-Datum'
  feststellung_wenn: Übertrag nur einseitig per 31.12. erfasst, doppelt erfasst oder Geld unterwegs nicht korrekt abgegrenzt; ungeklärter Übertrag als Pendenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0004-s156
    zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Hierbei ist auf das Valuta-Datum abzustellen.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- id: B1-301
  vorgehen: 'Je Geldkonto Saldo Hauptbuch 31.12. mit Nachweis per Stichtag abstimmen: Kassabuch/Kassenaufnahmeprotokoll, PC-/Bankauszug, Festgeldkorrespondenz, Depotauszug; bei Differenzen
    Kunden-Überleitung einsehen. Auszug auf anderen Stichtag oder unverbuchte Belege als Pendenz. Vollständigkeit der Konti mit Bankenliste abgleichen. Im Textfeld: Konto, Buchsaldo,
    Nachweissaldo, Differenz, Dokument (M-Files-ID). Je Konto die Einstufung festhalten: Kasse, Sichtguthaben und Festgeld mit Fälligkeit bis 31.03. des Folgejahres = B1. Festgeld mit
    späterer Fälligkeit, Kautions-/Sperrkonten mit eingeschränkter Verfügbarkeit, WIR-Verrechnung und Anbieter ohne Banklizenz → Hinweis auf Ausweis unter übrigen kurzfristigen Forderungen
    (Entscheid WP). Verpfändete Konten bleiben B1 (nur Anhang, B1-101/B1-320). Zuordnung Nachweis → Konto: jede Zeile von Bankauszug bzw. vorhandener Bankbestätigung über Bank, Währung
    und IBAN/Kontobezeichnung einem HB-Konto zuordnen; Ziffern der IBAN sind keine Kontonummern des Kontenplans. «Konto nicht erfasst» erst nach Suche über die ganze Saldoliste (Kautions-/Sperrkonten
    können unter übrigen Forderungen oder Finanzanlagen stehen). Eine vom Unternehmen eingeholte Bankbestätigung, die schon in der Akte liegt, hier auswerten – das ist kein Einholen
    (Unterlage des Kunden, HWP ER Rz 137).'
  nachweise:
  - Saldoliste/Hauptbuch
  - Kassabuch und Kassenaufnahmeprotokoll
  - Bank-/PC-Auszüge per 31.12.
  - Festgeldbestätigungen
  - Depotauszug per 31.12.
  - Vorhandene, vom Unternehmen eingeholte Bankbestätigungen (falls in der Akte)
  rechnen: 'Je Konto: Saldo Hauptbuch 31.12. = Saldo Nachweis ± Überleitungsposten; Summe Konten flüssige Mittel = Bilanzposition; Festgeld: Fälligkeitsdatum ≤ 31.03. des Folgejahres
    (Restlaufzeit ≤ 3 Monate ab 31.12.)'
  feststellung_wenn: 'Differenz Buch-/Nachweissaldo ohne Überleitung: unter der Nichtaufgriffsgrenze (revio 3.3) nur im Textfeld protokollieren, ab NAG Notiz «Wesentliche Feststellungen»
    mit Buchungsvorschlag; kein Stichtagsnachweis → Pendenz; ungebuchtes Konto; Guthaben ohne Einstufung als flüssige Mittel (Festgeld > 3 Monate, Kaution, WIR, ohne Banklizenz) unter
    B1.'
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Abstimmung der Bestände mit Kassenbüchern, Bank- und PC-Auszügen oder Wertschriftenverzeichnissen (ggf. Einsichtnahme in die vom Kunden erstellten Abstimmungen)
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Nachweis durch Auszüge oder Bestätigungen der Post bzw. Banken
  - quelle: hwp-bur-2023__rz-0014-s158
    zitat: Auf den Bilanzstichtag sind alle unverbuchten Belege (Spesenvorschüsse etc.) aufzuarbeiten
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-bur-2023__rz-0005-s156
    zitat: Forderungen gegenüber Organisationen ohne Banklizenz
  - quelle: hwp-bur-2023__rz-0003-s156
    zitat: die eine Restlaufzeit von höchstens drei Monaten ab Bilanzstichtag aufweisen
  - quelle: hwp-bur-2023__rz-0009-s157
    zitat: sind nicht unter den flüssigen Mitteln, sondern unter den übrigen kurzfristigen Forderungen auszuweisen
  - quelle: hwp-bur-2023__rz-0008-s157
    zitat: Konten mit eingeschränkter Verfügbarkeit (z.B. Kautionskonten) sind ggf. unter den Forderungen auszuweisen.
  - quelle: hwp-bur-2023__rz-0008-s157
    zitat: Verpfändete Konten oder Konten, auf welchen die Bank ein Verrechnungsrecht im Rahmen einer Cash-Pool-Rahmenvereinbarung hat, qualifizieren hingegen als flüssige Mittel.
  - quelle: hwp-bur-2023__rz-0006-s156
    zitat: Nicht zu den flüssigen Mitteln gehören Verrechnungsforderungen gegenüber der WIR-Bank
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Es handelt sich um Dokumente, welche beim Prüfungskunden vorliegen und folglich der Abschlussprüfer für die eingeschränkte Revision verwenden kann.
- id: B1-302
  vorgehen: 'Für jedes Fremdwährungskonto einzeln (Kasse, Bank, auch Zahlungsdienst-/Online-Konten in FW): FW-Saldo laut Auszug, CHF-Buchwert laut HB und gebuchten Kurs ermitteln (Kurs
    Buchhaltung = CHF-Buchwert ÷ FW-Saldo; Buchung «Kursbewertung»/«Kursdifferenz» im Kontoblatt suchen). Stichtagskurs aus Bankauszug oder Kursliste per 31.12. (CHF je 1 FW-Einheit;
    Kurse je 100 Einheiten durch 100 teilen). CHF-Sollwert nachrechnen und Differenz aufteilen: Saldodifferenz in FW (gehört zu B1-301) und Bewertungsdifferenz (Kurs). Kursdifferenzen
    mit den Konten Kursgewinn/-verlust plausibilisieren. Im Textfeld: Konto, FW-Saldo, Kurs Buchhaltung, Kurs Quelle, CHF-Soll, CHF-Differenz.'
  nachweise:
  - Bankauszüge Fremdwährungskonten per 31.12.
  - Devisenkursliste per 31.12.
  - Kontoblätter Kursdifferenzen
  rechnen: 'Je Konto mit `rechne`: soll = FW-Saldo × Stichtagskurs; diff = Buchwert CHF − soll (nie FW ÷ Kurs). Probe: soll ÷ FW-Saldo = Stichtagskurs. Bewertungsdifferenz = FW-Saldo
    × (Kurs Buchhaltung − Stichtagskurs). Mittelkurs zulässig, wenn die Differenz Geld-/Briefkurs unwesentlich ist.'
  feststellung_wenn: Umrechnung nicht zum Stichtagskurs bzw. CHF-Differenz ≠ 0 oder FW-Saldo weicht vom Auszug ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Kursgewinne oder -verluste aus Fremdwährungen sind als realisiert zu betrachten.
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Die Bilanzierung zum Mittelkurs wird in der Praxis oft angewandt.
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich und Plausibilisierung der Fremdwährungsdifferenzen mit dem Geschäftsmodell
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
  - quelle: hwp-bur-2023__rz-0015-s158
    zitat: Fremdwährungsguthaben und -schulden bei Post und Banken sind anhand der Devisenkurse am Bilanzstichtag umzurechnen
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  notiz: 'Differenz < Nichtaufgriffsgrenze (revio 3.3): nur im Textfeld protokollieren. ≥ NAG: «Wesentliche Feststellungen» mit begründetem Buchungsvorschlag (Kursverlust: Finanzaufwand
    an Bankkonto FW; Kursgewinn: Bankkonto FW an Finanzertrag), keine Verbuchung. Auszug oder Kurs fehlt: «Pendenz» (Konto, Datum, Betrag).'
- id: B1-303
  vorgehen: 'Zins-/Kapitalausweise mit Buchungen auf Zinsertrag/-aufwand und VSt-Guthaben abgleichen: Zins brutto erfasst, VSt als Forderung gebucht, Periode korrekt. VSt nur für Zinsen
    mit VSt-Abzug gemäss Ausweis rechnen. Kein Abzug zu erwarten bei Zinsen ≤ CHF 200 je Kundenguthaben und Kalenderjahr (einmalige Vergütung) sowie bei ausländischen Banken. VSt-Guthaben
    aus Fälligkeitsjahren mit abgelaufener Frist: Hinweis (Rückerstattung erloschen, Werthaltigkeit in D1 prüfen). Im Zweifel Frage an den WP. Erwarteten Zins aus Ø Guthaben × Zinssatz
    plausibilisieren. Im Textfeld: Konto, Bruttozins, VSt, Buchung, Differenz.'
  nachweise:
  - Zins-/Kapitalausweise der Banken
  - Kontoblätter Zinsertrag/-aufwand
  - Kontoblatt Verrechnungssteuerguthaben
  rechnen: 'Nur Zinsen mit VSt-Abzug gemäss Ausweis: VSt = Bruttozins × 35 %; Bruttozins = Nettogutschrift / 0.65; Summe VSt lt. Ausweisen = Saldo VSt-Konto. Alle Zinsen: erwarteter
    Zins = Ø Guthaben × Zinssatz. Anspruch erloschen, wenn Antragsjahr > Fälligkeitsjahr + 3.'
  feststellung_wenn: 'Bei Zinsen mit VSt-Abzug: netto gebucht oder VSt-Guthaben fehlt/nicht abgestimmt; ferner Zins in falscher Periode oder unplausible Abweichung zum Erwartungswert.'
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich des Finanzaufwands und -ertrags mit den erwarteten Werten aufgrund der verzinslichen Aktiven und Passiven
  - quelle: vstg__art-13
    zitat: 35 Prozent der steuerbaren Leistung
  - quelle: vstg__art-4
    zitat: der Kundenguthaben bei inländischen Banken und Sparkassen
  - quelle: vstg__art-5-t1
    zitat: die Zinsen von Kundenguthaben, wenn der Zinsbetrag für ein Kalenderjahr 200 Franken nicht übersteigt
  - quelle: vstv__art-16
    zitat: Die Freigrenze nach Artikel 5 Absatz 1 Buchstabe c VStG gilt für Zinsbeträge, die für das Kundenguthaben einmal pro Kalenderjahr vergütet werden.
  - quelle: vstg__art-25
    zitat: welche die mit der Verrechnungssteuer belasteten Einkünfte nicht ordnungsgemäss als Ertrag verbuchen, verwirken den Anspruch auf Rückerstattung
  - quelle: vstg__art-32
    zitat: Der Anspruch auf Rückerstattung erlischt, wenn der Antrag nicht innert drei Jahren nach Ablauf des Kalenderjahres, in dem die steuerbare Leistung fällig geworden ist, gestellt
      wird.
- id: B1-304
  vorgehen: Entwicklung flüssige Mittel und Bankkredite (X/X-1, Monatsverlauf) analysieren; Kreditlimiten aus Verträgen/Auszügen mit Beanspruchung per Stichtag vergleichen; Kontokorrentkredite
    müssen kurzfristig ausgewiesen sein. Hinweise auf Liquiditätsengpass oder verletzte Kreditbedingungen festhalten und an die Fortführungsbeurteilung melden; Einhaltung der Kreditbedingungen
    als Frage (Pendenz) erfassen. Monatsverlauf und Kennzahlen aus revio 1.2 lesen (rv_get_financialStatement_LoadCashflowDetail, rv_get_financialStatement_LoadKeyFigureView). Befund
    als Hinweis zu A1-205 (Going Concern) notieren.
  nachweise:
  - Saldoliste/Hauptbuch Geldkonten und Bankkredite
  - Kredit-/Kontokorrentverträge mit Limiten
  - Bankauszüge
  - Liquiditätsplanung
  rechnen: Liquiditätsveränderung = flüssige Mittel X – X-1; Ausschöpfung = beanspruchter Kredit / Limite; freie Limite = Limite – Beanspruchung
  feststellung_wenn: Limite überschritten oder voll ausgeschöpft, Kreditbedingungen verletzt, Kontokorrentkredit langfristig ausgewiesen, starker Liquiditätsabfluss mit Fortführungsrelevanz;
    fehlende Verträge als Pendenz.
  fundstellen:
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
  - quelle: hwp-bur-2023__rz-0013-s157
    zitat: In der Buchführung der Kreditnehmenden wird der beanspruchte Betrag, nicht aber die eingeräumte Kreditlimite erfasst.
  - quelle: hwp-bur-2023__rz-0012-s157
    zitat: Kontokorrentkredite sind stets als kurzfristig auszuweisen.
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung, ob die Unternehmensleitung Bestimmungen von Darlehensverträgen (z. B. Kennzahlen in Kreditverträgen) nicht eingehalten hat
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: 1.2 Kennzahlen und Dashboard
- id: B1-305
  vorgehen: 'Vorbereiten, falls im Prüfprogramm markiert (3xx, keine WP-Kennzeichnung). SER führt die Durchsicht als weitergehende Handlung; den Umfang nach Risiko 3.1 und Strategie
    3.5 festlegen, Vorgaben des WP übernehmen und die Auswahl im Textfeld begründen. Geldkonti durchsehen: Buchungen über Toleranzwesentlichkeit, runde Beträge, unübliche Gegenkonten,
    Nahestehende, Storni, Stichtagsbuchungen. Hintergrund mit Belegen/Verträgen klären, offene Punkte als Frage erfassen; Auswahlkriterien und Ergebnis dokumentieren.'
  nachweise:
  - Hauptbuch Geldkonten
  - Belege und Verträge zu ausgewählten Buchungen
  - Antworten der Unternehmensleitung
  rechnen: 'Auswahl (Vorschlag Konzept, offener Entscheid consis): alle Buchungen ≥ Toleranzwesentlichkeit (revio 3.3) + ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe,
    Nahestehende) + weitere nach Risiko 3.1; Abdeckung = Summe Auswahl / Total Bewegungen (mit `rechne`).'
  feststellung_wenn: Buchung ohne geschäftlichen Grund, ohne Beleg, zugunsten Nahestehender ohne Grundlage oder in falscher Periode.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Durchsicht der Geldkonti auf ungewöhnliche Buchungen
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Unterlagen im Bereich der flüssigen Mittel (Durchsicht der Geldkonten auf ungewöhnliche Buchungen)
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Beurteilung des wirtschaftlichen Hintergrunds vorhandener wesentlicher Transaktionen mit nahestehenden Personen
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Der Agent wählt standardmässig alle Posten über der Toleranzwesentlichkeit, ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe, nahestehende Personen)
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: übernimmt Vorgaben des Wirtschaftsprüfers pro Mandat oder Prüffeld
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Toleranzwesentlichkeit (75 %): steuert Prüfumfang und Stichprobe.'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Ablauf je Schritt: Ziel und Prüfziele lesen → Risiko und Strategie aus 3.1 und 3.5 berücksichtigen'
- id: B1-306
  vorgehen: 'Bankkorrespondenz und Bankverträge (Kontokorrent-, Kredit-, Pfand-, Garantie-, Depotverträge) in M-Files einsehen: Konten, Limiten, Sicherheiten, Garantien zugunsten Dritter,
    Kündigungen. Erkenntnisse mit Buchhaltung und Anhang abgleichen. Im Textfeld: Vertrag, Datum, relevante Bestimmungen, Auswirkung.'
  nachweise:
  - Bankverträge
  - Bankkorrespondenz
  - Pfand- und Garantieverträge
  rechnen: ''
  feststellung_wenn: Vertrag zeigt Konto, Kredit, Sicherheit oder Garantie, die in Buchhaltung oder Anhang fehlt; fehlende Verträge als Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in Kredit- und Darlehensverträge
  - quelle: hwp-er-2026__rz-0118-s201
    zitat: Das Aktenstudium kann einerseits zur Prüfung buchmässig erfasster und belegter Sachverhalte erforderlich sein
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über Bestand und Veränderungen von Bürgschaften, Garantieverpflichtungen und Pfandbestellungen zugunsten Dritter
- id: B1-307
  vorgehen: 'Zuerst Saldoliste, Bankauszüge, vorhandene Bankbestätigungen sowie schriftliche Antworten (10.11, VE) auf Devisentermingeschäfte/Derivate durchsehen. Keine Hinweise: Status
    «nicht bearbeitet», Begründung «Vorschlag: nicht anwendbar (keine offenen Kontrakte gemäss <Quelle, M-Files-ID>)», Entscheid WP. Nur wenn die Information fehlt: Frage als Pendenz
    (mit B1-101 zusammenfassen). Vorhandene Kontraktübersicht/Bankbewertung per 31.12. in M-Files auswerten (kein Kundenkontakt). Methode feststellen: Niederstwert oder Marktwert, einheitlich
    je Position; mit Absicherungszweck wahlweise Hedge Accounting. Negativer Marktwert ohne Absicherungszweck als Verbindlichkeit/Rückstellung; bei Marktwertbewertung Anhanghinweis.'
  nachweise:
  - Kontraktübersicht/Bankbewertung per 31.12. (in M-Files)
  - Kontrakte/Abrechnungen
  - Schriftliche Antwort der Unternehmensleitung (Absicherungszweck, Grundgeschäft)
  rechnen: 'Massgebend: Marktwert gemäss Bankbewertung; Summe negative Marktwerte ohne Absicherungszweck = Verbindlichkeit/Rückstellung. Plausibilisierung: Kauf FW = Nominal × (Terminkurs
    Stichtag – Kontraktkurs); Verkauf FW = Nominal × (Kontraktkurs – Terminkurs Stichtag)'
  feststellung_wenn: Negativer Marktwert ohne Absicherungszweck nicht erfasst, Methode uneinheitlich, Abweichung zur Bankbewertung oder Marktwertbewertung ohne Anhanghinweis; fehlende
    Unterlagen als Pendenz.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0074-s175
    zitat: sind die Anschaffungskosten in der Regel null
  - quelle: hwp-bur-2023__rz-0075-s176-t2
    zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
      werden.
  - quelle: hwp-bur-2023__rz-0075-s176-t1
    zitat: Weiter ist zu beachten, dass die Marktwertbewertung für alle Posten der betreffenden Bilanzposition vorzunehmen ist
  - quelle: hwp-bur-2023__rz-0076-s176
    zitat: Derivate mit Absicherungszweck können wahlweise entweder analog zu Derivaten ohne Absicherungszweck oder dann unter Anwendung von Hedge Accounting bewertet werden
  - quelle: or__art-960b
    zitat: Im Anhang muss auf diese Bewertung hingewiesen werden.
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Die eingeschränkte Revision beschränkt sich auf die im Unternehmen intern vorhandenen Unterlagen.
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet)
- id: B1-308
  vorgehen: 'Keine Wertschriften bzw. Aktiven mit Börsenkurs in Saldoliste und Depotauszügen: Status «nicht bearbeitet», Begründung «Vorschlag: nicht anwendbar», Entscheid WP. Sonst:
    Für kurzfristig gehaltene Wertschriften Anzahl und Kurs der Buchhaltung mit Depotauszug bzw. Jahresendkursen per 31.12. vergleichen und Wert nachrechnen. Grundsatz feststellen (Art.
    960b OR einheitlich je Position oder höchstens Anschaffungswert), Schwankungsreserve samt Obergrenze prüfen, eigene Aktien im Bestand feststellen. Im Textfeld: Titel, Anzahl, Kurs
    Buchhaltung, Kurs Quelle, Differenz.'
  nachweise:
  - Depotauszug per 31.12.
  - Kursliste Jahresendkurse
  - Wertschriftenverzeichnis der Buchhaltung (Anschaffungswerte)
  rechnen: 'Anzahl × Jahresendkurs (× Devisenkurs) = Soll-Bilanzwert; Differenz = Buchwert – Soll-Bilanzwert; ohne Art. 960b: Buchwert ≤ Anschaffungswert; Schwankungsreserve ≤ Kurswert
    – min(Anschaffungswert; Kurswert); Wertschriften unter B1 zu Anschaffungswert → Hinweis Ausweis (HWP Rz 11)'
  feststellung_wenn: Abweichung über Nicht-Aufgriffsgrenze, uneinheitliche Bewertung, Schwankungsreserve über Obergrenze, eigene Aktien unter B1 oder Kursbewertung ohne Anhanghinweis,
    oder Wertschriften unter B1 nicht zum Kurs bewertet (Hinweis Ausweis, Entscheid WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Bewertung angewandten Börsenkurse mit den entsprechenden Jahresendkursen von Banken, Börsen oder anderen Quellen
  - quelle: hwp-bur-2023__rz-0015-s158
