# Prüffeld SCH5 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: SCH5
bezeichnung: Nebenbetrieb, betriebsfremd und ausserordentlich
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 12
    korrigiert: true
kurzbeschrieb: 'Erfolgspositionen ausserhalb des Kerngeschäfts: Nebenbetrieb/Nebenerlöse, betriebsfremder Aufwand/Ertrag (z.B. nicht betriebsnotwendige Liegenschaften) sowie ausserordentlicher,
  einmaliger oder periodenfremder Aufwand/Ertrag (z.B. Vorjahreskorrekturen). Anlagenverkaufserfolge nach Sachverhalt klassieren. Geprüft: Eintritt, Vollständigkeit, Abgrenzung, Klassierung
  (Art. 959b OR), Anhang.'
gesetz:
- thema: 'Mindestgliederung Produktionserfolgsrechnung: separater Ausweis betriebsfremder Aufwand/Ertrag (Art. 959b Abs. 2 Ziff. 8 OR)'
  quelle: or__art-959b-t1
  zitat: 8. betriebsfremder Aufwand und betriebsfremder Ertrag;
- thema: 'Mindestgliederung: separater Ausweis ausserordentlicher, einmaliger oder periodenfremder Aufwand/Ertrag (Art. 959b Abs. 2 Ziff. 9, Abs. 3 Ziff. 6 OR)'
  quelle: or__art-959b-t1
  zitat: 9. ausserordentlicher, einmaliger oder periodenfremder Aufwand und Ertrag;
- thema: Weitere Positionen (z.B. Nebenbetrieb, wesentliche Gewinne aus Anlagenverkäufen) einzeln ausweisen (Art. 959b Abs. 5 OR)
  quelle: or__art-959b-t2
  zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
- thema: 'Anhang: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: 12. Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung;
- thema: 'Anhang: Aufschlüsselungen und Erläuterungen zu ER-Positionen, z.B. betriebsfremd (Art. 959c Abs. 1 Ziff. 2 OR)'
  quelle: or__art-959c-t1
  zitat: 2. Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung;
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR), z.B. über ausserordentlichen Ertrag'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: Stetigkeit in Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR) – Identifikationskriterien und Kontenzuordnung
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Verrechnungsverbot Aufwand/Ertrag (Art. 958c Abs. 1 Ziff. 7 OR)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR) – periodenfremde Posten
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Vorjahreszahlen in der Jahresrechnung (Art. 958d Abs. 2 OR)
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- thema: Belegnachweis für Buchungen (Art. 957a Abs. 2 Ziff. 2 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge;
- thema: Buchungsbeleg muss den Geschäftsvorfall nachvollziehbar machen (Art. 957a Abs. 3 OR)
  quelle: or__art-957a
  zitat: die notwendig sind, um den einer Buchung zugrunde liegenden Geschäftsvorfall oder Sachverhalt nachvollziehen zu können
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: 'Fehlklassierung: betriebliche (auch seltene oder unüblich grosse) Aufwendungen werden als ausserordentlich, einmalig, periodenfremd oder betriebsfremd ausgewiesen, um das Betriebsergebnis
    zu verbessern.'
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Erfahrungsgemäss besteht eine gewisse Versuchung, Aufwendungen möglichst dem ausserordentlichen, einmaligen oder periodenfremden Bereich zuzuordnen, um bessere Betriebsergebnisse
    auszuweisen.
- text: Rückstellungen für Vorgänge aus dem operativen Geschäft (z.B. Mängelrügen, Rechtsfälle oder Garantien aus eigenen Lieferungen und Leistungen) werden zulasten des ausserordentlichen
    statt des betrieblichen Aufwands gebildet.
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0504-s259
  zitat: Die Bildung einer Rückstellung erfolgt zulasten jener Position der Erfolgsrechnung, welcher der zugrunde liegende Vorgang inhaltlich zufällt.
- text: Gebuchte Erträge/Aufwände in den Konten Nebenbetrieb, betriebsfremd oder ausserordentlich sind nicht eingetreten, nicht belegt oder Sammelbuchungen ohne nachvollziehbaren Sachverhalt.
  pruefziele:
  - EN
  - EX
  - RI
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge;
- text: Periodenfremde Posten (Nachbuchungen, Abrechnungen und Fehlerkorrekturen für Vorjahre) werden nicht erkannt, falsch abgegrenzt oder nicht im Anhang erläutert.
  pruefziele:
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Typischerweise stellt die Korrektur von Fehlern aus einem Vorjahr, sofern wesentlich, einen periodenfremden Vorgang dar.
- text: Unzulässige Verrechnung von betriebsfremdem Aufwand und Ertrag (z.B. Mietertrag mit direkt zuordenbarem Liegenschaftsaufwand) bzw. von ausserordentlichem Aufwand mit ausserordentlichem
    Ertrag.
  pruefziele:
  - DO
  - RI
  quelle: hwp-bur-2023__rz-0067-s071
  zitat: betriebsfremder Aufwand und Ertrag; • ausserordentlicher, einmaliger und periodenfremder Aufwand und Ertrag
- text: Gewinne und Verluste aus Anlagenabgängen werden miteinander verrechnet (Nettoausweis in einem Konto bzw. einer ER-Position).
  pruefziele:
  - DO
  - RI
  quelle: hwp-bur-2023__rz-0382-s238
  zitat: Eine Verrechnung von Gewinnen mit Verlusten aus Anlagenabgängen ist gemäss Verrechnungsverbot nicht zulässig
- text: 'Anlagenverkauf falsch abgebildet: Verkaufserlös statt Buchgewinn/-verlust erfasst, Anschaffungswert und kumulierte Abschreibungen bzw. Restbuchwert nicht ausgebucht (Sachanlagen
    und Ertrag überhöht).'
  pruefziele:
  - RI
  - BE
  - EX
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: bei indirekter Abschreibung die Anschaffungskosten sowie die kumulierten Abschreibungen und Wertberichtigungen
- text: 'Anhang unvollständig oder nicht mit der Erfolgsrechnung übereinstimmend: Erläuterung der ausserordentlichen, einmaligen oder periodenfremden Posten fehlt oder weicht betragsmässig
    ab.'
  pruefziele:
  - DO
  - VO
  quelle: or__art-959c-t2
  zitat: 12. Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung;
- text: Wesentliche Nettoauflösung gewillkürter stiller Reserven (z.B. Auflösung übersetzter Rückstellungen/Wertberichtigungen oder Buchgewinne auf übermässig abgeschriebenen Anlagen
    über ausserordentlichen Ertrag) wird nicht offengelegt, obwohl das Ergebnis dadurch wesentlich günstiger dargestellt wird. Die Auflösung von Zwangsreserven ist nicht offenlegungspflichtig.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0817-s341-t1
  zitat: Diese Bestimmung führt, falls das Ergebnis der Erfolgsrechnung daraus wesentlich günstiger dargestellt wird, zu einer Ausweispflicht der Auflösung der stillen Reserven.
- text: Identifikationskriterien bzw. Kontenzuordnung zu den ER-Positionen gegenüber dem Vorjahr geändert, ohne Erläuterung; Vergleichbarkeit beeinträchtigt.
  pruefziele:
  - DO
  - VO
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- text: Nebenerlöse ohne direkten Zusammenhang mit dem Unternehmenszweck werden im betrieblichen Ertrag ausgewiesen (bzw. umgekehrt betriebliche Erlöse als betriebsfremd).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0750-s317-t2
  zitat: Nebenerlöse, welche nicht direkt mit dem primären Unternehmenszweck in Zusammenhang stehen, sind separat unter dem betriebsfremden Ertrag auszuweisen
- text: Geschäfte mit Aktionären oder Nahestehenden im betriebsfremden Bereich (z.B. Liegenschaften, Verkauf von Anlagen) zu nicht marktüblichen Bedingungen (verdeckte Gewinnausschüttung).
  pruefziele:
  - BE
  - RV
  - DO
  quelle: hwp-er-2026__rz-0163-s212
  zitat: hierbei enthält die Erfolgsrechnung zu hohe Aufwendungen und/oder zu geringe Erträge
