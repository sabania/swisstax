unterlagen:
- dokument: Kontoblätter der Konten Nebenbetrieb, betriebsfremder Aufwand/Ertrag sowie ausserordentlicher, einmaliger oder periodenfremder Aufwand/Ertrag mit Einzelbuchungen des Geschäftsjahres
  zweck: Grundlage Vorjahresvergleich (SCH5-201) und Belegabstimmung (SCH5-301)
  quelle: ser-2022__anh-d-s096-1
  zitat: Abstimmung der ausgewiesenen Posten mit Belegen und anderen geeigneten Unterlagen
- dokument: Saldoliste bzw. Erfolgsrechnung Geschäftsjahr und Vorjahr (inkl. Vorjahres-Jahresrechnung mit Gliederung)
  zweck: Vorjahresvergleich der Salden und der Kontenzuordnung (SCH5-101, SCH5-201)
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- dokument: Aufstellung der ausserordentlichen, einmaligen und periodenfremden Posten mit Begründung je Posten (Grundlage der Anhangerläuterung)
