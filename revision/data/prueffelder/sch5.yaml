bewertung:
- regel: 'Betriebsfremd: Vorgänge, die sich klar von der gewöhnlichen Geschäftstätigkeit unterscheiden, aber regelmässig auftreten (in Anlehnung an FER 3/21), z.B. Aufwand/Ertrag aus
    nicht betrieblichen Sachanlagen.'
  quelle: hwp-bur-2023__rz-0799-s329-t1
  zitat: wenn sie sich klar von der gewöhnlichen Geschäftstätigkeit des Unternehmens unterscheiden, aber mit einer gewissen Regelmässigkeit auftreten
- regel: Klassierung betrieblich/betriebsfremd je einzelne Anlage; keine Aufsplittung z.B. gemischt genutzter Liegenschaften.
  quelle: hwp-bur-2023__rz-0799-s329-t1
  zitat: Die Klassifizierung in betrieblich oder betriebsfremd ist dabei für die einzelne Anlage vorzunehmen
- regel: Betriebsfremde Positionen nach dem Finanzerfolg ausweisen; keine explizite Anhangpflicht, Aufschlüsselung (z.B. Mietertrag und direkter Liegenschaftsaufwand) aber zweckmässig.
  quelle: hwp-bur-2023__rz-0799-s329-t2
  zitat: Der betriebsfremde Aufwand und der betriebsfremde Ertrag sind in der Erfolgsrechnung nach dem Finanzaufwand und Finanzertrag auszuweisen.
- regel: Nebenerlöse ohne direkten Zusammenhang mit dem primären Unternehmenszweck sind als betriebsfremder Ertrag auszuweisen.
  quelle: hwp-bur-2023__rz-0750-s317-t2
  zitat: Nebenerlöse, welche nicht direkt mit dem primären Unternehmenszweck in Zusammenhang stehen, sind separat unter dem betriebsfremden Ertrag auszuweisen
- regel: 'Ausserordentlich: ungewöhnliche, in der Regel einmalige oder mit dem Geschäftsgang nicht ohne Weiteres zusammenhängende Vorgänge.'
  quelle: hwp-bur-2023__rz-0800-s330-t1
  zitat: Als ausserordentliche Aufwendungen und Erträge gelten ungewöhnliche, in der Regel einmalige oder mit dem Geschäftsgang nicht ohne Weiteres zusammenhängende Vorgänge.
- regel: Kein Wahlrecht bei der Einordnung; im Zweifel ordentliches/betriebliches Ergebnis; Ausweis als ausserordentlich ist im Einzelnen zu begründen.
  quelle: hwp-bur-2023__rz-0800-s330-t1
  zitat: Bezüglich Einordung von Aufwendungen und Erträgen als ordentlich oder ausserordentlich besteht grundsätzlich kein Wahlrecht.
- regel: Unwesentliche Einzelereignisse nicht als ausserordentlich ausweisen (ausser gleiches Ereignis, in der Summe wesentlich).
  quelle: hwp-bur-2023__rz-0800-s330-t1
  zitat: Es wird als nicht opportun erachtet, unwesentliche Einzelereignisse als ausserordentlich auszuweisen
- regel: Sporadisch wiederkehrende oder unüblich grosse Posten aus der normalen Geschäftstätigkeit sind nicht ausserordentlich/periodenfremd; Begriffe eng auslegen.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: In der Rechnungslegungspraxis sollten die Begriffe ausserordentlich, einmalig und periodenfremd eng ausgelegt werden.
- regel: 'Fehlerkorrekturen aus Vorjahren: keine Anpassung des Vorjahresergebnisses; Korrektur über die Erfolgsrechnung des laufenden Jahres mit Anhangerläuterung (periodenfremd).'
  quelle: hwp-bur-2023__rz-0071-s072
  zitat: Notwendige Korrekturen sind über die Erfolgsrechnung des laufenden Jahres mit entsprechenden Erläuterungen im Anhang vorzunehmen.
- regel: Ausserordentliche, einmalige und periodenfremde Posten dürfen in einer Position zusammengefasst werden; Verrechnung von Aufwand und Ertrag nur bei unwesentlichen Grössen.
  quelle: hwp-bur-2023__rz-0233-s114
  zitat: Eine Verrechnung ist nur bei unwesentlichen Grössen statthaft.
- regel: Verrechnungsverbot gilt ausdrücklich auch für betriebsfremden sowie ausserordentlichen, einmaligen und periodenfremden Aufwand und Ertrag.
  quelle: hwp-bur-2023__rz-0067-s071
  zitat: ausserordentlicher, einmaliger und periodenfremder Aufwand und Ertrag
- regel: 'Anlagenabgang: bei indirekter Abschreibung Anschaffungskosten und kumulierte Abschreibungen ausbuchen; Buchgewinn bzw. -verlust in der Erfolgsrechnung erfassen.'
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- regel: Keine Verrechnung von Gewinnen mit Verlusten aus Anlagenabgängen; bedeutende Gewinne/Verluste aus Veräusserung von Sachanlagen einzeln ausweisen und erläutern.
  quelle: hwp-bur-2023__rz-0382-s238
  zitat: Eine Verrechnung von Gewinnen mit Verlusten aus Anlagenabgängen ist gemäss Verrechnungsverbot nicht zulässig
- regel: Buchgewinne aus Anlagenverkäufen bedeuten aufgelöste stille Reserven; bei wesentlich günstigerer Ergebnisdarstellung Nettoauflösung im Anhang offenlegen (Nettobetrag).
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Entstehen aus der Veräusserung von Sachanlagen Buchgewinne, sind stille Reserven zur Auflösung gekommen.
- regel: Nur tatsächliche Erträge ausweisen, keine kalkulatorischen Eigenmieten oder Sollmieterträge.
  quelle: hwp-bur-2023__rz-0753-s319
  zitat: keine kalkulatorischen oder budgetierten Werte, wie z.B. kalkulatorische Eigenmieten oder Sollmieterträge
- regel: Umgliederungen ohne Einfluss auf Vorjahresergebnis und Eigenkapital sind zur Vergleichbarkeit mit Erläuterung im Anhang zulässig.
  quelle: hwp-bur-2023__rz-0070-s072
  zitat: Solche Anpassungen können aus Gründen der Vergleichbarkeit mit den Zahlen des Geschäftsjahres angebracht sein und sind mit entsprechender Erläuterung im Anhang zulässig.
fallstricke:
- text: Seltene, aber betriebliche Vorgänge (z.B. Messebesuch alle vier Jahre, Wertberichtigung einer hohen Kundenforderung) gehören in den betrieblichen Aufwand, nicht in den ausserordentlichen.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Messebesuch alle vier Jahre
- text: Unüblich grosse Posten aus der normalen Geschäftstätigkeit (z.B. nachträgliche Lieferantenrabatte, Gutschriften aus Lieferungen) sind nicht schon wegen ihrer Grösse ausserordentlich.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: Gleiches gilt auch für unüblich grosse Posten, soweit sie aus der normalen Geschäftstätigkeit des Unternehmens stammen.
- text: 'Im Zweifel ordentlich: Ermessensfälle sind dem betrieblichen Ergebnis zuzuordnen; die Begründungslast liegt beim Ausweis als ausserordentlich.'
  quelle: hwp-bur-2023__rz-0800-s330-t1
  zitat: mit den entsprechenden Aufwendungen und Erträgen im Zweifelsfall als Teil des
- text: 'Anlagenverkauf: voller Verkaufserlös als Ertrag gebucht und Anlage im Anlagespiegel nicht ausgebucht – Ertrag und Sachanlagen überhöht; Buchgewinn = Erlös minus Restbuchwert.'
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- text: Aufwandkonto mit Habensaldo bzw. Nettoausweis von ausserordentlichem Aufwand und Ertrag deutet auf Verrechnung oder Fehlbuchung hin.
  quelle: hwp-bur-2023__rz-0067-s071
  zitat: Das Verbot der Verrechnung von Aufwand und Ertrag bezieht sich auch auf artgleiche Aufwendungen und Erträge
- text: Anhangerläuterung der ausserordentlichen Posten stimmt betragsmässig oder inhaltlich nicht mit den Positionen der Erfolgsrechnung überein – immer abstimmen.
  quelle: ser-2022__anh-d-s098-2
  zitat: insbes. zu wesentlichen ausserordentlichen, einmaligen oder periodenfremden Positionen
- text: Konten (z.B. Nebenbetrieb, Liegenschafts-/Untermietertrag) wechseln zwischen den Jahren die ER-Position; Kontenzuordnung immer mit dem Vorjahr vergleichen.
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- text: Pauschale Sammelbuchungen per Jahresende ohne spezifischen Belegtext sind ohne Einzelbeleg nicht nachvollziehbar.
  quelle: or__art-957a
  zitat: Als Buchungsbeleg gelten alle schriftlichen Aufzeichnungen auf Papier oder in elektronischer oder vergleichbarer Form
- text: Bei KMU verzerren Bildung/Auflösung stiller Reserven die Vergleichswerte; analytische Vergleiche bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- text: Bei wesentlichen Posten nicht allein auf Befragung abstützen; mit Analytik bzw. Detailprüfung ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'SCH5-301 ist im SER eine weiter gehende Prüfungshandlung (Kennzeichnung WP): nur bei vermuteter wesentlicher Fehlaussage oder erhöhtem inhärentem Risiko; Agent bereitet vor,
    der Wirtschaftsprüfer entscheidet.'
  quelle: ser-2022__anh-d-s096-1
  zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- text: Kalkulatorische Mieten (z.B. Eigennutzung einer Liegenschaft) dürfen nicht als betriebsfremder Ertrag gebucht werden.
  quelle: hwp-bur-2023__rz-0753-s319
  zitat: keine kalkulatorischen oder budgetierten Werte, wie z.B. kalkulatorische Eigenmieten oder Sollmieterträge
fragen_kunde:
- frage: Welches sind die Gründe für die wesentlichen Veränderungen der Konten Nebenbetrieb, betriebsfremder Aufwand/Ertrag und ausserordentlicher/periodenfremder Aufwand/Ertrag gegenüber
    dem Vorjahr (je Konto mit Betrag und Sachverhalt)?
  zweck: 'SCH5-101/201: Abweichungen erklären (EN, VO, PA)'
- frage: Nach welchen Kriterien ordnen Sie Posten als betriebsfremd, ausserordentlich, einmalig oder periodenfremd ein, und haben sich Kriterien oder Kontenzuordnung gegenüber dem Vorjahr
    geändert?
  zweck: 'SCH5-102/201: Klassierung und Stetigkeit (VO, DO)'
- frage: Welche Sondervorgänge gab es im Geschäftsjahr (z.B. Anlagenverkäufe, Versicherungsleistungen, Vergleiche, Rückerstattungen, Nachbuchungen oder Fehlerkorrekturen für Vorjahre),
    und auf welchen Konten sind sie erfasst?
  zweck: 'SCH5-202: Erwartungswerte bilden; Vollständigkeit und Periodenabgrenzung'
- frage: Besitzt die Gesellschaft nicht betriebsnotwendige Vermögenswerte oder Nebenbetriebe (z.B. Liegenschaften, Untervermietung)? Bestehen dazu Verträge mit Aktionären oder Nahestehenden,
    und zu welchen Konditionen?
  zweck: Abgrenzung betrieblich/betriebsfremd; Hinweise auf verdeckte Gewinnausschüttung
- frage: Wie wurden Anlagenverkäufe des Geschäftsjahres erfasst (Erlös, Ausbuchung Anschaffungswert und Abschreibungen, Buchgewinn bzw. -verlust, Konto)?
  zweck: 'SCH5-202/301: Richtigkeit und Verrechnungsverbot (RI, BE)'
- frage: Wurden im Geschäftsjahr stille Reserven netto aufgelöst (z.B. über ausserordentlichen Ertrag), und in welchem Betrag?
  zweck: Anhangangabe Art. 959c Abs. 1 Ziff. 3 OR (DO)
- frage: Können Sie die Kernaussagen zur Klassierung und zu den Sondervorgängen schriftlich bestätigen?
  zweck: Schriftliche Bestätigung von Kernaussagen (Befragung dokumentieren)
