- dokument: Schriftliche Beschreibung der Kriterien bzw. Kontierungsregeln zur Identifikation betriebsfremder, ausserordentlicher, einmaliger oder periodenfremder Posten (inkl. Änderungen
    ggü. Vorjahr)
  zweck: Befragung SCH5-102 schriftlich auswerten; Stetigkeit (SCH5-201)
  quelle: ser-2022__anh-d-s096-1
  zitat: Besprechung der angewandten Kriterien zur Identifikation von betriebsfremden
- dokument: Belege zu wesentlichen Einzelposten (Verträge, Gutschriften, Abrechnungen, Versicherungs- oder Vergleichsunterlagen)
