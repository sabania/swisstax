schritte:
- id: SCH5-101
  vorgehen: 'Aus der Saldoliste ER die Konten Nebenbetrieb, betriebsfremd und ausserordentlich/periodenfremd mit dem Vorjahr gegenüberstellen; Abweichungen ab Toleranzwesentlichkeit
    (3.3) oder qualitativ auffällige (Vorzeichenwechsel, Konto neu oder auf null) listen. Schriftliche Kundenantwort (10.11) kritisch gegen die Akte würdigen, sonst Frage je Konto als
    Pendenz. Im Textfeld: Liste, Antworten, Würdigung; höchstens «teilweise bearbeitet».'
  nachweise:
  - Saldoliste Erfolgsrechnung 2025/2024
  - Jahresrechnung mit Vorjahreszahlen
  - schriftliche Antworten der Unternehmensleitung (Kundenbefragung 10.11)
  - Kontoblätter der betroffenen Konten
  rechnen: Δ je Konto = Saldo 2025 − Saldo 2024; Δ% = Δ / |Saldo 2024|; auffällig, wenn |Δ| ≥ Toleranzwesentlichkeit oder Aufwandkonto mit Habensaldo bzw. Ertragskonto mit Sollsaldo
  feststellung_wenn: 'Pendenz: keine oder unplausible Antwort zu Abweichung ab Toleranzwesentlichkeit. Wesentliche Feststellung: Antwort zeigt Fehlklassierung, fehlende Abgrenzung oder
    nicht eingetretenen Posten.'
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Insbesondere geht der Abschlussprüfer Diskrepanzen zu seinem Verständnis des geprüften Unternehmens und anderen nicht plausiblen Auskünften nach.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
- id: SCH5-102
  vorgehen: 'Kriterienbeschrieb bzw. Kontierungsregeln in M-Files/Dauerakte suchen; schriftliche Kundenantwort (10.11) gegen HWP BuR (betriebsfremd: nicht betriebstypisch, regelmässig;
    ausserordentlich: ungewöhnlich, nicht wiederkehrend; eng auslegen) und den Zweck würdigen. Fehlt beides: Frage als Pendenz. Im Textfeld wesentliche Fragen, Antworten und Würdigung
    dokumentieren; Status höchstens «teilweise bearbeitet», Visum offen.'
  nachweise:
  - schriftliche Kriterienbeschreibung oder Kundenantwort
  - Kontenplan mit Zuordnung zu den ER-Positionen
  - Zweck gemäss Handelsregister/Unternehmensinformationen
  - Anhangerläuterung der ausserordentlichen Posten
  rechnen: ''
  feststellung_wenn: 'Pendenz: Kriterien nicht dokumentiert, keine Antwort. Wesentliche Feststellung: Kriterien weiter als HWP BuR (betriebliche oder wiederkehrende Posten als ausserordentlich)
    oder Ausweis ohne Begründung.'
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Besprechung der angewandten Kriterien zur Identifikation von betriebsfremden
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Visum offen lassen
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: ser-2022__6-1-1-t1
    zitat: Um Missverständnisse zu vermeiden, sind die Kernaussagen vom Befragten allenfalls schriftlich bestätigen zu lassen.
  - quelle: hwp-bur-2023__rz-0800-s330-t1
    zitat: Somit ist zwar im Einzelnen zu begründen, wenn ein Posten als ausserordentlich erfasst wurde, nicht jedoch, wenn dies nicht der Fall ist.
  - quelle: hwp-bur-2023__rz-0800-s330-t2
    zitat: In der Rechnungslegungspraxis sollten die Begriffe ausserordentlich, einmalig und periodenfremd eng ausgelegt werden.
  - quelle: hwp-bur-2023__rz-0799-s329-t1
    zitat: wenn sie sich klar von der gewöhnlichen Geschäftstätigkeit des Unternehmens unterscheiden, aber mit einer gewissen Regelmässigkeit auftreten
- id: SCH5-201
  vorgehen: Je Konto und je ER-Position (Nebenbetrieb/Liegenschaft, betriebsfremd, ausserordentlich/einmalig/periodenfremd) Saldo 2025 und 2024 im Rechenmodul vergleichen; Kontenzuordnung
    zu den ER-Positionen mit der Vorjahres-Jahresrechnung abgleichen (Umgliederungen, neue Konten); Kriterien aus SCH5-102 mit der Vorjahresakte vergleichen. Unerklärte Veränderungen
    in SCH5-101 übernehmen. Tabelle und Würdigung im Textfeld.
  nachweise:
  - Saldoliste Erfolgsrechnung 2025/2024
  - Jahresrechnung 2025 mit Vorjahreszahlen und Vorjahres-Jahresrechnung
  - Vorjahresakte (Kriterien, Anhang)
  rechnen: Summe Konten je ER-Position = Ausweis Jahresrechnung (2025 und 2024); Δ je Position = Saldo 2025 − Saldo 2024; Δ% = Δ / |Saldo 2024|
  feststellung_wenn: 'Wesentliche Feststellung: Kontenzuordnung oder Kriterien ggü. Vorjahr geändert ohne Anhangerläuterung, oder ER-Position ≠ Summe Konten. Pendenz: Veränderung ab
    Toleranzwesentlichkeit unerklärt.'
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Vergleich der Salden und Identifikationskriterien mit dem Vorjahr
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
  - quelle: hwp-bur-2023__rz-0070-s072
    zitat: Solche Anpassungen können aus Gründen der Vergleichbarkeit mit den Zahlen des Geschäftsjahres angebracht sein und sind mit entsprechender Erläuterung im Anhang zulässig.
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vorjahresvergleiche → werden oft gemacht und liefern wichtige Informationen
- id: SCH5-202
  vorgehen: Erwartungswerte vor dem Vergleich festhalten (Miet-/Untermietverträge, Kaufvertrag/Anlagespiegel, Rückstellungsspiegel, VR-/GV-Protokolle, Sondervorgänge, Vorjahreskorrekturen)
    und mit den Salden vergleichen. Begründung für Differenzen über der tolerierbaren Abweichung aus schriftlicher Kundenantwort (10.11) bzw. Akte entnehmen, sonst Frage als Pendenz
    mit Konto, Betrag und Differenz. Bekannte Vorgänge ohne Buchung als Vollständigkeitsthema.
  nachweise:
  - Miet- und Untermietverträge
  - Kaufverträge Anlagenverkäufe und Anlagespiegel
  - Rückstellungsspiegel und Aktennotizen
  - VR-/GV-Protokolle
  - Budget/Forecast
  - Saldoliste Erfolgsrechnung
  rechnen: Buchgewinn Anlagenverkauf = Verkaufserlös (ggf. abzüglich direkter Verkaufskosten) − (Anschaffungswert − kumulierte Abschreibungen bis Abgang); erwarteter Mietertrag = Monatsmiete
    × Monate; Differenz = gebucht − Erwartung, vergleichen mit tolerierbarer Abweichung (aus Toleranzwesentlichkeit)
  feststellung_wenn: 'Pendenz: Differenz Erwartung/Ist über tolerierbarer Abweichung unerklärt. Wesentliche Feststellung: bekannter Sondervorgang nicht oder falsch erfasst (z.B. Erlös
    statt Buchgewinn) bzw. Buchung ohne Vorgang.'
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Vergleich der Salden mit den erwarteten Werten aufgrund der Kenntnisse der Geschäftstätigkeit im zu prüfenden Geschäftsjahr
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Die tolerierbare Abweichung zwischen dem Erwartungswert und dem Ausweis
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
  - quelle: hwp-er-2026__rz-0029-s183
    zitat: stellt er dabei eine ungewöhnliche oder unerwartete Abweichung fest, untersucht er, ob erhöhte Risiken wesentlicher Fehlaussagen in der Jahresrechnung bestehen könnten
  - quelle: hwp-bur-2023__rz-0329-s228-t1
    zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
  - quelle: hwp-bur-2023__rz-0382-s238
    zitat: Es ist vertretbar, Aufwendungen, die direkt mit dem Verkauf in Zusammenhang stehen
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- id: SCH5-301
  vorgehen: revio WP = Wirtschaftsprüfer; im SER weiter gehend. Nur auf Anweisung des Wirtschaftsprüfers bzw. gemäss Entscheid consis vorbereiten, sonst Status «nicht bearbeitet» mit
    Grund als Notiz. Posten ab Toleranzwesentlichkeit und auffällige (Jahresend-, Sammel-, runde Buchungen) wählen; ohne Kontoblatt Gegenbuchungen auf 7xxx/8xxx in Bilanz-Kontoblättern
    suchen. Belege in M-Files; Betrag, Periode, Sachverhalt, Klassierung, Verrechnung, Anhang prüfen.
  nachweise:
  - Kontoblätter der Konten Nebenbetrieb, betriebsfremd, ausserordentlich bzw. Bilanz-Kontoblätter mit Gegenbuchungen
  - Belege (Verträge, Gutschriften, Abrechnungen, Aktennotizen)
  - Rückstellungsspiegel
  - Anhang der Jahresrechnung
  - Anlagespiegel bei Anlagenverkäufen
  rechnen: Summe Einzelbuchungen Kontoblatt (bzw. Gegenbuchungen aus Bilanz-Kontoblättern) = Saldo Saldoliste je Konto; Summe a.o.-Konten = Total a.o. Aufwand bzw. Ertrag in der ER =
    Anhangangabe; Abdeckung % = geprüfte Posten / Kontosaldo
  feststellung_wenn: 'Pendenz: Beleg fehlt (Konto, Datum, Betrag). Notiz «Wesentliche Feststellung» mit begründetem Buchungsvorschlag, keine Verbuchung: Beleg ≠ Buchung, falsche Periode/Klassierung,
    Verrechnung, Anhang ≠ ER.'
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und anderen geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s096-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: konzept-ki-revisionsagent-2026__c008-1
    zitat: 'Kennzeichnung: EP = Einzelfallprüfung, WP = Wirtschaftsprüfer.'
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: konzept-ki-revisionsagent-2026__c023-1
    zitat: consis entscheidet über WP-Schritte
  - quelle: flussdiagramm-revisionsagent-2026__s001-3
    zitat: Status «nicht bearbeitet»
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
  - quelle: hwp-bur-2023__rz-0504-s259
    zitat: Die Bildung einer Rückstellung erfolgt zulasten jener Position der Erfolgsrechnung, welcher der zugrunde liegende Vorgang inhaltlich zufällt.
  - quelle: or__art-959c-t2
    zitat: 12. Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung;
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Fehlende Unterlagen, ungeklärte Sachverhalte, nicht verfügbare Belege mit Konto, Datum und Betrag
  - quelle: konzept-ki-revisionsagent-2026__c007-1
