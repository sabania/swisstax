    6031 «Aufwand Inserate Untermiete» im betrieblichen Raumaufwand als direkt zuordenbarer Aufwand zu 7500 (Zuordnung prüfen)'
- datei: 00_Allgemein/Jahresrechnung_2025_Fiktive_Zahlen_AG_Testfassung.md
