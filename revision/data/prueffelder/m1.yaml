bewertung:
- regel: 'Klassierung: übrige kurzfristige Verbindlichkeiten sind nicht verzinslich und stammen nicht aus Lieferungen/Leistungen (verzinste Kontokorrente → kurzfristige verzinsliche
    Verbindlichkeiten)'
  quelle: hwp-bur-2023__rz-0154-s192
  zitat: nicht verzinsliche Verbindlichkeiten, die nicht aus Lieferungen und Leistungen stammen
- regel: Verbindlichkeiten zum Nennwert
  quelle: hwp-bur-2023__rz-0159-s192
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden (Art. 960e OR).
- regel: Erhaltene Anzahlungen zum Nennwert
  quelle: hwp-bur-2023__rz-0457-s252
  zitat: Passive Anzahlungen werden – wie die Verbindlichkeiten im Allgemeinen – zu ihrem Nennwert bilanziert
- regel: Anzahlungen mit reinem Vorleistungscharakter im kurzfristigen (ausnahmsweise langfristigen) Fremdkapital
  quelle: hwp-bur-2023__rz-0458-s252
  zitat: Soweit erhaltene Anzahlungen reinen Vorleistungscharakter haben
- regel: Kundenanzahlungen erst bei Zahlungseingang bilanzieren
  quelle: hwp-bur-2023__rz-0109-s185
  zitat: Solche Anzahlungen von Kunden werden erst bilanziert, wenn die Zahlung erfolgt ist
- regel: Bei Abschluss fällige, unbezahlte Anzahlungsrechnungen mit Anzahlungen saldieren (keine Bilanzverlängerung)
  quelle: hwp-bur-2023__rz-0455-s251
  zitat: fällige, jedoch noch nicht bezahlte Rechnungen mit den Anzahlungen zu saldieren
- regel: 'Nettodarstellung je Projekt: Überfinanzierung (Anzahlungen über Projektkosten) unter übrigen Verbindlichkeiten'
  quelle: hwp-bur-2023__rz-0254-s214
  zitat: im umgekehrten Fall einer Überfinanzierung wird der Buchwert unter den übrigen Verbindlichkeiten bilanziert
- regel: Saldierung von Forderungen und Verbindlichkeiten nur bei gegenseitiger Verrechenbarkeit
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: Eine Saldierung von Forderungen und Verbindlichkeiten in der Bilanz ist unzulässig, es sei denn, die Posten seien gegenseitig verrechenbar
- regel: Verrechnung geboten, wenn mit der Gegenpartei nur über eine Saldogrösse abgerechnet wird (z.B. Unterkonten derselben Ausgleichskasse); auszugliedern sind nur Netto-Sollsaldi
    je Gegenpartei
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: Nicht nur zulässig, sondern geboten ist eine Verrechnung dann, wenn mit der Gegenpartei nur über eine Saldogrösse abgerechnet wird.
- regel: 'MWST: Saldo Umsatzsteuer abzüglich Vorsteuer als eine Forderung bzw. Verbindlichkeit (Verrechnung geboten)'
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: aus der Mehrwertsteuerpflicht eine Forderung oder Verbindlichkeit, die dem Saldo
- regel: Kurzfristige Fremdwährungsverbindlichkeiten zum Stichtagskurs
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
- regel: Verjährte Verbindlichkeiten bleiben bilanziert, wenn Erfüllungsabsicht oder Verrechnung möglich
  quelle: hwp-bur-2023__rz-0161-s193
  zitat: Verjährte Verbindlichkeiten (beispielsweise Obligationenzinsen) sind dann weiterhin zu bilanzieren, wenn die Absicht besteht
- regel: Vorsorgebeiträge (reglementarisch und freiwillig) als Aufwand erfassen, sobald fällig oder beschlossen
  quelle: hwp-bur-2023__rz-0536-s265
  zitat: gleichgültig ob reglementarische oder freiwillige, als Aufwand zu erfassen
- regel: 'Anhang Vorsorgeverbindlichkeiten: Gesamtbetrag genügt üblicherweise'
  quelle: hwp-bur-2023__rz-0838-s346
  zitat: Der Ausweis eines Gesamtbetrags genügt üblicherweise.
- regel: 'Nahestehende: gesonderter Ausweis mindestens für Beteiligte im Sinne von Art. 960d Abs. 3 OR (vermutet ab 20 % der Stimmrechte); weitergehender Ausweis empfohlen'
  quelle: hwp-bur-2023__rz-0166-s193
  zitat: umfasst mindestens diejenigen Inhaber von Beteiligungspapieren, welche eine Beteiligung (im Sinne von Art. 960d Abs. 3 OR) halten
- regel: Auch Verbindlichkeiten gegenüber der Revisionsstelle als Organ separat ausweisen
  quelle: hwp-bur-2023__rz-0168-s194
  zitat: Auch allfällige Forderungen oder Verbindlichkeiten gegenüber der Revisionsstelle als Organ des Unternehmens sind separat auszuweisen.
- regel: Organe bei der AG = Verwaltungsrat und Geschäftsleitung; Lohn-, Bonus- und Spesenguthaben der GL fallen unter den gesonderten Ausweis (Art. 959a Abs. 4 OR)
  quelle: hwp-bur-2023__rz-0167-s193
  zitat: der Verwaltungsrat und die Geschäftsleitung bei der Aktiengesellschaft
- regel: Unterteilung Beteiligte/Organe und Beteiligungsunternehmen je Verbindlichkeitsposition der Bilanz
  quelle: hwp-bur-2023__rz-0174-s195
  zitat: pro Forderungs- und Verbindlichkeitsposition in der Bilanz vorzunehmen
- regel: 'Schwestergesellschaften: gesonderter Ausweis empfohlen (gesetzlich nicht verlangt)'
  quelle: hwp-bur-2023__rz-0169-s194
  zitat: empfiehlt sich indes ein gesonderter Ausweis
- regel: Arbeitgeberbeitragsreserven ohne Verwendungsverzicht sind zu aktivieren; nicht aktivierte AGBR stellen stille Reserven dar (ausserhalb M1)
  quelle: hwp-bur-2023__rz-0536-s265
  zitat: Arbeitgeberbeitragsreserven ohne Verwendungsverzicht sind zu aktivieren
- regel: Stetigkeit der Darstellung (z.B. Netto-/Bruttodarstellung Anzahlungen und angefangene Arbeiten)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
fallstricke:
- text: 'Drittbestätigungen (AHV, SUVA, BVG/PK) und Kreditorenbestätigungen holt die Revisionsstelle in der eingeschränkten Revision nicht selbst ein (SER Anh. D q) und k): nicht Bestandteil);
    Nachweis über intern vorhandene Abrechnungen.'
  quelle: ser-2022__anh-d-s093-2
  zitat: Einholen von Drittbestätigungen wie AHV, SUVA, BVG/PK usw.
- text: Vom Unternehmen selbst eingeholte Bestätigungen (z.B. Kontoauszug Pensionskasse, Richtigbefundsanzeige) dürfen als Nachweis verwendet werden.
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
- text: Wesentliche Posten (z.B. hohe erhaltene Anzahlungen) nicht allein mit Befragungen abdecken; analytische Prüfungshandlungen und/oder Detailprüfungen ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Vorzeichen in Saldolisten beachten: negative Salden auf Passivkonten (z.B. Abrechnungskonten Sozialversicherungen) sind Sollsaldi; auszugliedern sind die Netto-Sollsaldi je
    Gegenpartei (bei Saldoabrechnung derselben Gegenpartei ist die Verrechnung geboten).'
  quelle: hwp-bur-2023__rz-0154-s192
  zitat: Forderungen und Verbindlichkeiten gegenüber Sozialversicherungen
- text: 'Doppelarbeit vermeiden: MWST-Abrechnungskonto nur Bestandsabstimmung (materielle MWST-Prüfung in M2), Aufwandabstimmung Sozialversicherungen primär in R1, Zinsprüfung Kontokorrente
    koordiniert mit L1/N1/SCH4.'
- text: Abgrenzung Ferien-/Überzeitguthaben gehört nicht zu M1, sondern ist als passive Rechnungsabgrenzung auszuweisen (Prüffeld M3); hier nur Abgrenzung.
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: die als passive Rechnungsabgrenzung auszuweisen ist
- text: 'Abgrenzung zwischen passiven Anzahlungen und passiven Rechnungsabgrenzungen ist nicht eindeutig; Praxis: Anzahlungen bei Lieferungen/Grossprojekten, passive Abgrenzung bei laufenden
    Erträgen.'
  quelle: hwp-bur-2023__rz-0454-s251
  zitat: ist in Theorie und Praxis nicht eindeutig
- text: 'ESTV-Zinssätze gelten je Kalenderjahr: das Rundschreiben 2026 gilt erst ab 1.1.2026; für das Geschäftsjahr 2025 das Rundschreiben 2025 beiziehen (im Wiki nicht vorhanden), Werte
    nicht übertragen.'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: ESTV-Sätze sind steuerliche Safe-Haven-Werte; ein höherer Zins kann im Drittvergleich begründet sein.
  quelle: estv-zinsen-2026__s002-1
  zitat: Der Nachweis höherer Zinssätze im Drittvergleich bleibt vorbehalten.
- text: 'Möglicher Ablauf gemäss HWP ER bei offensichtlicher und wesentlicher verdeckter Gewinnausschüttung (z.B. übersetzte Zinsen): schriftliche Mitteilung an den VR, Beurteilung der
    Rückerstattung nach Art. 678 OR, allenfalls Hinweis im Bericht; Entscheid ausschliesslich beim WP, kein Kundenkontakt durch den Agenten.'
  quelle: hwp-er-2026__rz-0164-s212-t1
  zitat: Wenn der Abschlussprüfer eine offensichtliche und wesentliche verdeckte Gewinnausschüttung feststellt, kann er wie folgt vorgehen
- text: Agent befragt nicht selbst (1xx nur über schriftliche Antworten, sonst Pendenz); WP-Schritt M1-302 nur vorbereiten, vorbehältlich Entscheid consis; 4xx-Schritte nur auf Anweisung
    des Wirtschaftsprüfers.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: Ob der Agent WP-Schritte (hier M1-302) vorbereiten darf, ist ein offener Entscheid von consis; bis zum Entscheid nur vorbereiten, Beurteilung beim WP.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: Fragen an den Kunden (fragen_kunde, fehlende Unterlagen) nur als Pendenz erfassen; der Agent versendet nichts an Kunden.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- text: 'Einhaltung arbeits- und verwaltungsrechtlicher Vorgaben (z.B. Art. 331 Abs. 3 OR: Beitragshöhe, Überweisungsfrist BVG) ist nicht Bestandteil der eingeschränkten Revision; nur
    auf ausdrückliche Anweisung des WP, Verstoss nur als Notiz an den WP.'
  quelle: ser-2022__anh-d-s093-2
  zitat: Prüfen, ob arbeitsrechtliche und verwaltungsrechtliche Vorgaben eingehalten werden
- text: Gesetzesverstösse ohne direkten Bezug zur Rechnungslegung lösen keine gesetzliche Hinweispflicht aus; ein Hinweis im Bericht kommt nur bei Wesentlichkeit und direktem Bezug zur
    Jahresrechnung in Frage – Entscheid beim WP.
  quelle: ser-2022__8-3-2-t1
  zitat: wenn sie wesentlich sind, einen direkten Bezug zur Jahresrechnung aufweisen
- text: Kennzahl «Sozialversicherungsbeiträge zur Lohnsumme» bezieht sich auf den Aufwand; der Stichtagssaldo hängt vom Akonto- und Abrechnungsrhythmus ab und ist nicht zur Lohnsumme
    ins Verhältnis zu setzen (für den Bestand Erwartung aus Abrechnung bilden).
  quelle: hwp-er-2026__rz-0109-s199
  zitat: Sozialversicherungsbeiträge im Verhältnis zur Lohnsumme
- text: Verzinste Kontokorrente (Aktionäre, Organe, Konzern) gehören nicht in M1, sondern unter kurzfristige verzinsliche Verbindlichkeiten (Prüffeld L1).
  quelle: or__art-959a-t1
  zitat: b. kurzfristige verzinsliche Verbindlichkeiten
fragen_kunde:
- frage: Welche wesentlichen übrigen Verbindlichkeiten bestehen per 31.12. (Gläubiger, Grund, Fälligkeit), und welche sind gegenüber dem Vorjahr neu oder weggefallen?
  zweck: M1-101 geschäftlicher Hintergrund, M1-102 Abweichungen
- frage: Wie stellen Sie sicher, dass Schlussabrechnungen der Sozialversicherungen (Ausgleichskasse, UVG, KTG, BVG), Quellensteuer und Personalverbindlichkeiten für das Geschäftsjahr
    vollständig und periodengerecht erfasst sind? Liegen alle Schlussabrechnungen vor?
  zweck: M1-103 Vollständigkeit/Periodenabgrenzung
- frage: Wurden nach dem Bilanzstichtag Boni oder Erfolgsprämien für das Geschäftsjahr beschlossen oder ausbezahlt, und wo sind sie erfasst?
  zweck: M1-103 Vollständigkeit Personalverbindlichkeiten
- frage: Bestehen Verbindlichkeiten oder Kontokorrente gegenüber Aktionären, Verwaltungsrat, Geschäftsleitung, ihnen nahestehenden Personen oder Konzerngesellschaften? Zu welchem Zinssatz
    und auf welcher vertraglichen Grundlage?
  zweck: M1-304 Ausweis Nahestehende, M1-407 Verzinsung
- frage: Bestehen Verbindlichkeiten in Fremdwährung, und mit welchen Kursen wurden sie per 31.12. umgerechnet?
  zweck: M1-303 Fremdwährungsumrechnung
- frage: Wie werden Kundenanzahlungen erfasst (bei Rechnungsstellung oder bei Zahlungseingang), wann werden Anzahlungskonten nach Schlussrechnung ausgeglichen, und werden Anzahlungen
    mit angefangenen Arbeiten verrechnet (Netto- oder Bruttodarstellung)?
  zweck: M1-402 bis M1-405 Anzahlungen
- frage: Weshalb weisen einzelne Abrechnungskonten (Sozialversicherungen, Quellensteuer) Sollsaldi auf (Vorauszahlung, Rückforderung, Fehlbuchung)? Rechnen Sie mit derselben Gegenpartei
    über mehrere Konten nur über einen Saldo ab (z.B. Unterkonten derselben Ausgleichskasse, UVG/UVGZ oder KTG beim selben Versicherer)?
  zweck: M1-406 Ausgliedern von Sollsaldi bzw. gebotene Verrechnung je Gegenpartei
- frage: 'Sind alle BVG-Beiträge des Geschäftsjahres bezahlt bzw. spätestens Ende des ersten Monats nach dem Kalender- bzw. Versicherungsjahr überwiesen worden (bei Versicherungsjahr
    = Kalenderjahr: 31.1. des Folgejahres)? Bestehen per 31.12. Beitragsausstände, Zahlungsvereinbarungen oder Arbeitgeberbeitragsreserven?'
  zweck: M1-408 vollständige Passivierung der Schuld gegenüber der VE, M1-320 Anhang, M1-321 AGBR
- frage: Haben Arbeitgeberkontrollen der Sozialversicherungen (AHV, SUVA) oder Kontrollen der Quellensteuer stattgefunden, und sind Nachforderungen hängig?
  zweck: M1-103 Vollständigkeit, M1-302 Nachweis
- frage: Enthält die Quellensteuer-Abrechnung Dezember Korrekturen, Nachbelastungen oder Tarifwechsel, die hohe Abzüge im Verhältnis zum Bruttolohn erklären?
  zweck: M1-201/M1-302e Plausibilisierung QST-Abzug je Person
- frage: Werden Kontokorrente von Aktionären, Organen oder Konzerngesellschaften verzinst, und unter welcher Bilanzposition werden sie ausgewiesen?
  zweck: M1-301/M1-407 Klassierung (verzinsliche Verbindlichkeiten, Prüffeld L1)
