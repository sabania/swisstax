- text: 'Erhaltene Kundenanzahlungen: Konten nach Schlussrechnung nicht ausgeglichen, unbezahlte Anzahlungsrechnungen passiviert (Bilanzverlängerung) oder falsche Abgrenzung zu angefangenen
    Arbeiten.'
  pruefziele:
  - EX
  - VO
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0455-s251
  zitat: spätestens bei der Schlussabrechnung, zu bereinigen
- text: Verbindlichkeiten gegenüber Beteiligten, Organen oder Vorsorgeeinrichtungen nicht gesondert in Bilanz bzw. Anhang ausgewiesen.
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0162-s193
