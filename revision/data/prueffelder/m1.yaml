  quelle: ser-2022__anh-d-s086-1
  zitat: Abstimmung des Gesamtbetrags mit dem Einzelnachweis
- dokument: 'Schluss-/Jahresabrechnungen 2025 der Sozialversicherungen: Ausgleichskasse (AHV/IV/EO/ALV/FAK), UVG/UVGZ, KTG, BVG/Pensionskasse; Jahreslohnmeldung'
  zweck: Bestandesnachweis (M1-302b), Abstimmung Aufwand (M1-401), Sollsaldi (M1-406), BVG-Ausstände (M1-408)
