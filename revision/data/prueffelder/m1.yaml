- text: 'Übersetzte Zinsen auf Kontokorrenten von Beteiligten/Nahestehenden: geldwerte Leistung mit Verrechnungssteuerfolgen, allenfalls Rückerstattungspflicht.'
  pruefziele:
  - BE
