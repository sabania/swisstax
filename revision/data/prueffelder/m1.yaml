schritte:
- id: M1-101
  vorgehen: 'Agent befragt nicht selbst: schriftliche Antwort der Geschäftsleitung zu Gläubiger, Grund und Fälligkeit wesentlicher übriger Verbindlichkeiten (Sozialversicherungen, QST,
    Personal, Kundenanzahlungen, Kontokorrente) auswerten und mit Saldoliste abgleichen. Prüfen, ob die Schuld die Gesellschaft verpflichtet. Fehlt die Antwort, Frage als Pendenz erfassen;
    Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Antwort Kundenbefragung
  - Saldoliste 31.12.
  - Einzelnachweis je Konto
  rechnen: ''
  feststellung_wenn: Verbindlichkeit ohne nachvollziehbaren geschäftlichen Hintergrund, nicht der Gesellschaft zuzuordnen (z.B. Eigentümer) oder Antwort widerspricht Saldoliste/Belegen.
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Befragung zum geschäftlichen Hintergrund wesentlicher übriger Verbindlichkeiten
  - quelle: ser-2022__4-3-2
    zitat: Bilanzierte Verpflichtungen müssen solche des Unternehmens (und nicht z. B. des Eigentümers) sein.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- id: M1-102
  vorgehen: Veränderung je Konto gegenüber Vorjahr und Erwartung (Lohnsumme, Projektvolumen, Abrechnungsrhythmus) berechnen. Wesentliche Abweichungen als schriftliche Frage an die Geschäftsleitung
    (Pendenz) formulieren bzw. vorliegende Antworten kritisch auf Plausibilität würdigen und mit Konto und Betrag im Textfeld dokumentieren.
  nachweise:
  - Saldoliste mit Vorjahr
  - Antwort Geschäftsleitung
  - Vorjahresakte
  rechnen: Abweichung je Konto = Saldo 31.12. – Saldo Vorjahr (absolut und in %); Vergleich mit Toleranzwesentlichkeit
  feststellung_wenn: Wesentliche Abweichung ohne plausible Erklärung oder Erklärung widerspricht den Unterlagen (Abrechnungen, Projektliste).
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Verbindlichkeiten gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
- id: M1-103
  vorgehen: 'Schriftliche Darstellung des Abschlussprozesses auswerten: Erfassung von Schlussabrechnungen Sozialversicherungen, QST, Boni/Lohnnachzahlungen und Kundenanzahlungen per
    Stichtag. Mit Abrechnungen und Zahlungen neue Rechnung stichprobenweise plausibilisieren; ohne Antwort Pendenz. Nur auf Anweisung WP: Aufwandkonten neue Rechnung auf Personalaufwand
    des Vorjahres durchsehen, Berichte von Arbeitgeberkontrollen einsehen.'
  nachweise:
  - Antwort Geschäftsleitung zum Abschlussprozess
  - Schlussabrechnungen Sozialversicherungen
  - Buchungen und Zahlungen neue Rechnung
  - GV-/VR-Protokolle (Boni)
  - Berichte Arbeitgeberkontrollen (falls vorhanden)
  rechnen: ''
  feststellung_wenn: Kein Verfahren zur Erfassung von Schlussabrechnungen/Boni erkennbar oder in neuer Rechnung erfasste Beträge betreffen wesentlich das Geschäftsjahr.
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Befragung, wie die vollständige, periodengerechte Erfassung sichergestellt wurde
  - quelle: ser-2022__anh-d-s093-1
    zitat: Befragung, ob nach dem Bilanzstichtag Leistungs- oder Erfolgsprämien für das vergangene Jahr beschlossen wurden
  - quelle: ser-2022__4-3-6
    zitat: Der Abschlussprüfer stützt sich wie bei der Vollständigkeit weitgehend auf Befragungen, analytische Prüfungshandlungen
  - quelle: ser-2022__anh-d-s093-2
    zitat: Durchsicht der Aufwandskonten in neuer Rechnung auf auffällige Beträge mit Personalbezug, die das Vorjahr betreffen
  - quelle: ser-2022__anh-d-s093-1
    zitat: Einsichtnahme in Berichte von anderen Prüfern (AHV, SUVA, MWST usw.)
- id: M1-201
  vorgehen: 'Konten mit Vorjahr vergleichen: neue/weggefallene Konten, Vorzeichenwechsel, Anzahlungen zum Auftragsbestand. Bestand mit Erwartung vergleichen (Saldo Ausgleichskasse aus
    Lohnmeldung, Sätzen gemäss Abrechnung und Akonto). Kennzahl Sozialversicherungsaufwand/AHV-Lohnsumme mit Vorjahr (nicht den Stichtagssaldo). QST-Abzug je Person zum Bruttolohn plausibilisieren.
    Auffälliges an M1-102, Ergebnis ins Textfeld.'
  nachweise:
  - Saldoliste 31.12./Vorjahr
  - Vorjahresakte
  - AHV-Lohnmeldung (Lohnsumme)
  - Schlussabrechnung Ausgleichskasse (Sätze, Akonto)
  - Projektliste
  - QST-Abrechnung, Personalliste
  rechnen: Veränderung je Konto = Saldo 31.12. – Saldo Vorjahr; Summe Konten = Bilanzposition; Kennzahl Sozialversicherungsaufwand / AHV-Lohnsumme (Vorjahresvergleich); erwarteter Saldo
    Ausgleichskasse = Beiträge gemäss Lohnmeldung × Beitragssätze gemäss Abrechnung − geleistete Akonto; QST-Quote je Person = QST-Abzug / Bruttolohn
  feststellung_wenn: Wesentliche unerklärte Veränderung, Saldo weicht wesentlich von der Erwartung ab, erwartete Verbindlichkeit fehlt oder QST-Quote auffällig (Pendenz bzw. Notiz an
    den WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Vergleich des Bestands der Verbindlichkeiten mit dem Vorjahr
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Sozialversicherungsbeiträge im Verhältnis zur Lohnsumme
  - quelle: ser-2022__anh-d-s093-1
    zitat: Vergleich der Relation zwischen Salären und Sozialleistungen mit dem Vorjahr
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: wesentliche Bilanzpositionen in der Regel nicht nur mit analytischen Prüfungshandlungen zu prüfen
- id: M1-301
  vorgehen: 'Einzelnachweise je Konto beschaffen (Abrechnungen Sozialversicherungen, QST, MWST Q4, Projektliste Anzahlungen, Lohnsammelkonto mit Lohnjournal Dezember und Auszahlungen
    Januar) und mit Hauptbuch und Bilanz abstimmen. Klassierung prüfen: verzinsliche Schulden (L1), LuL bzw. Interimskreditoren (K1), Abgrenzungen (M3) gehören nicht in M1. Differenzen
    mit Konto und Betrag dokumentieren, fehlende Nachweise als Pendenz.'
  nachweise:
  - Einzelnachweise/Abrechnungen je Konto
  - Lohnjournal Dezember, Auszahlungsbelege Januar
  - Saldoliste/Hauptbuch
  - Bilanz
  rechnen: Summe Einzelnachweise je Konto = Saldo Konto; Summe Konten = Bilanzposition Übrige kurzfristige Verbindlichkeiten
  feststellung_wenn: Differenz zwischen Einzelnachweis und Saldo über Toleranz, Saldo ohne Nachweis oder Fehlklassierung (verzinsliche, langfristige oder LuL-Schuld).
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Abstimmung des Gesamtbetrags mit dem Einzelnachweis
  - quelle: or__art-958c
    zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
  - quelle: hwp-bur-2023__rz-0154-s192
    zitat: nicht verzinsliche Verbindlichkeiten, die nicht aus Lieferungen und Leistungen stammen
  - quelle: hwp-bur-2023__rz-0158-s192
    zitat: beispielsweise Zahlungen nach dem Bilanzstichtag
- id: M1-302
  vorgehen: 'WP-Schritt, vorbehältlich Entscheid consis nur vorbereiten: Nachweise abgleichen: a) vom Kunden selbst eingeholte Bestätigungen (Kreditoren-/Drittbestätigungen holt die
    Revisionsstelle nicht ein: SER Anh. D, nicht Bestandteil), b) Schlussabrechnungen AHV/UVG/KTG/BVG, c) Verträge, Zinsabrechnungen, d) Vorauszahlungen: Aufträge, Fakturen neue Rechnung,
    Zahlungen, e) QST, Lohnjournal; QST-Abzug je Person plausibilisieren. Lücken als Pendenz.'
  nachweise:
  - Saldobestätigungen (vom Kunden eingeholt)
  - Abrechnungen Sozialversicherungen
  - Verträge/Zinsabrechnungen
  - Auftragsunterlagen, Fakturen, Zahlungsbelege
  - QST-Abrechnung, Lohnjournal
  rechnen: Differenz je Gläubiger = Saldo gemäss Nachweis – Saldo Konto
  feststellung_wenn: Nachweis weicht wesentlich vom Saldo ab, Verpflichtung ist nicht der Gesellschaft zuzuordnen oder Nachweis fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Durchsicht von Verträgen, Rechnungen usw. als Nachweis der Verbindlichkeiten
  - quelle: hwp-bur-2023__rz-0158-s192
    zitat: Der Bestand wird zweckmässigerweise mit Bestandsmeldungen oder Abrechnungen
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Die eingeschränkte Revision beschränkt sich auf die im Unternehmen intern vorhandenen Unterlagen.
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise beiziehen
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- id: M1-303
  vorgehen: Fremdwährungssalden der Position identifizieren (Konto- bzw. Gläubigerwährung). Angewandte Umrechnungskurse mit den Jahresendkursen gemäss Bankunterlagen vergleichen und
    Umrechnung nachrechnen. Ohne Fremdwährungspositionen im Textfeld «nicht anwendbar» mit Begründung vermerken.
  nachweise:
  - Einzelnachweis mit Währung
  - Devisenkurse 31.12. (Bankunterlagen)
  - Kontoblätter
  rechnen: CHF-Wert = Fremdwährungsbetrag × Stichtagskurs; Differenz = CHF-Wert – Buchwert
  feststellung_wenn: Umrechnung nicht zum Stichtagskurs und Differenz wesentlich.
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
- id: M1-304
  vorgehen: 'Nahestehende aus Aktienbuch, HR-Auszug, Unternehmensinformationen und Protokollen bestimmen: Beteiligte (mind. ab 20 % Stimmrechte), Organe = VR und Geschäftsleitung, Beteiligungsunternehmen;
    Schwestergesellschaften gesondert empfohlen. Mit Gläubigern abgleichen, inkl. Lohn-, Bonus- und Spesenguthaben der GL im Lohnsammelkonto. Je Bilanzposition gesonderten Ausweis in
    Bilanz oder Anhang prüfen.'
  nachweise:
  - Aktienbuch
  - HR-Auszug
  - GV-/VR-Protokolle
  - Einzelnachweis Gläubiger
  - Lohnjournal/Bonusabrechnung GL
  - Anhang
  rechnen: Summe Verbindlichkeiten gegenüber Beteiligten/Organen bzw. Beteiligungsunternehmen je Bilanzposition = Ausweis Bilanz/Anhang
  feststellung_wenn: Verbindlichkeit gegenüber Beteiligten, Organen (inkl. GL-Guthaben im Lohnsammelkonto) oder Beteiligungsgesellschaften nicht gesondert ausgewiesen oder Betrag weicht
    ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s086-1
    zitat: Feststellung von Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: or__art-959a-t2
    zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: hwp-bur-2023__rz-0167-s193
    zitat: der Verwaltungsrat und die Geschäftsleitung bei der Aktiengesellschaft
  - quelle: hwp-bur-2023__rz-0166-s193
    zitat: umfasst mindestens diejenigen Inhaber von Beteiligungspapieren, welche eine Beteiligung (im Sinne von Art. 960d Abs. 3 OR) halten
  - quelle: hwp-bur-2023__rz-0174-s195
    zitat: ist eine Unterteilung in Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: hwp-bur-2023__rz-0169-s194
    zitat: empfiehlt sich indes ein gesonderter Ausweis
- id: M1-320
  vorgehen: 'Anhang auf Angaben zur Position prüfen: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen, Verbindlichkeiten gegenüber Nahestehenden (falls nicht in der Bilanz), Aufschlüsselung
    wesentlicher Posten, Grundsätze (z.B. Nettodarstellung Anzahlungen/angefangene Arbeiten). Beträge mit Ergebnissen aus M1-304, M1-405 und M1-408 abgleichen.'
  nachweise:
  - Anhang Jahresrechnung
  - Ergebnisse M1-304, M1-405, M1-408
  rechnen: Anhangbetrag Vorsorgeverbindlichkeiten = Habensaldo BVG-/PK-Konten gemäss Prüfung
  feststellung_wenn: Pflichtangabe nach Art. 959c oder 959a Abs. 4 OR fehlt oder weicht vom Prüfungsergebnis ab.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: ser-2022__anh-d-s098-2
    zitat: Durchsicht des Anhangs auf vollständige Offenlegung der aufgrund der Befragungen zutreffenden Positionen gemäss Art. 959c OR
  - quelle: hwp-bur-2023__rz-0254-s214
    zitat: im Anhang eine erläuternde Aufgliederung vorzunehmen
  - quelle: hwp-bur-2023__rz-0174-s195
    zitat: pro Forderungs- und Verbindlichkeitsposition in der Bilanz vorzunehmen
- id: M1-321
  vorgehen: 'Kundenaufstellung stille Reserven für die Position durchsehen: Verbindlichkeiten sind zum Nennwert anzusetzen, fiktive oder überhöhte Verbindlichkeiten sind keine zulässige
    stille Reserve. Je Konto Buchwert mit Nennwert gemäss Nachweis vergleichen (Soll: Differenz 0); eine Differenz ist eine Fehlaussage. Stille Reserven ausserhalb M1 (z.B. nicht aktivierte
    AGBR) nur verweisen. Fehlt die Aufstellung, Pendenz.'
  nachweise:
  - Aufstellung stille Reserven Berichtsjahr/Vorjahr
  - Einzelnachweise M1-301
  rechnen: Differenz je Konto = Buchwert − Nennwert gemäss Nachweis (Soll 0). Eine Differenz ist eine Fehlaussage (Feststellung), keine zulässige stille Reserve.
  feststellung_wenn: Buchwert weicht vom Nennwert gemäss Nachweis ab (fiktive oder überhöhte Verbindlichkeit) oder wesentliche Nettoauflösung stiller Reserven nicht im Anhang offengelegt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0159-s192
    zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden (Art. 960e OR).
  - quelle: hwp-bur-2023__rz-0669-s296
    zitat: Diese Formen der Bildung von stillen Reserven schliessen es unter anderem aus, Aktiven wegzulassen und fiktive Verbindlichkeiten zu bilanzieren.
  - quelle: hwp-bur-2023__rz-0536-s265
    zitat: sie stellen bei Nichtaktivierung stille Reserven dar
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
- id: M1-322
  vorgehen: 'Dauerakte in M-Files mit mehrjährig gültigen Unterlagen zur Position ergänzen bzw. aktualisieren: Anschlussverträge/Reglemente Sozialversicherungen und Pensionskasse, Kontokorrent-/Darlehensvereinbarungen
    mit Nahestehenden, Rahmen-/Werkverträge mit Anzahlungsregelung. Fehlende Dokumente als Pendenz; Änderungen im Textfeld vermerken.'
  nachweise:
  - Dauerakte M-Files
  - Verträge/Reglemente
  rechnen: ''
  feststellung_wenn: Wesentlicher Vertrag (z.B. Anschlussvertrag Pensionskasse, KK-Vereinbarung mit Aktionär) fehlt und ist beim Kunden nicht erhältlich (Pendenz).
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen, die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben
- id: M1-401
  vorgehen: 'Nur auf Anweisung des WP: Kontoblätter der Bestandeskonten und Gegenkonten kritisch durchsehen (ungewöhnliche, Jahresend- und Ausbuchungen, falsche Gegenkonten); auffällige
    Posten belegmässig prüfen. In M1 nur Bestandesseite: Akonto + Saldo = Schlussabrechnung je Versicherung. Aufwandabstimmung mit Jahresabrechnungen primär in R1 (Ergebnis übernehmen,
    keine Doppelarbeit).'
  nachweise:
  - Kontoblätter Bestandes- und Aufwandkonten
  - Jahresabrechnungen AHV/UVG/KTG/BVG
  - Belege
  rechnen: Akonto gebucht + Saldo Konto = Beiträge gemäss Schlussabrechnung (je Versicherung/Gegenpartei)
  feststellung_wenn: Buchung ohne Beleg oder plausiblen Grund, falsches Gegenkonto oder Akonto plus Saldo weicht wesentlich von der Schlussabrechnung ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s093-1
    zitat: Abstimmen des ausgewiesenen Aufwands mit geeigneten Jahresaufstellungen und -abrechnungen (AHV-, BVG-Abrechnungen usw.)
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- id: M1-402
  vorgehen: 'Nur auf Anweisung des WP: Zugänge auf dem Konto erhaltene Anzahlungen (Sammelbuchungen) je Projekt aufschlüsseln und stichprobenweise mit Auftragsbestätigung/Werkvertrag
    (vereinbarte Anzahlungsrate), Anzahlungsrechnung und Zahlungseingang abgleichen. Prüfen, dass nur bezahlte Anzahlungen passiviert sind.'
  nachweise:
  - Kontoblatt erhaltene Anzahlungen
  - Projektliste
  - Werkverträge/Auftragsbestätigungen
  - Anzahlungsrechnungen
  - Bankbelege
  rechnen: Summe Zugänge Stichprobe = Zahlungseingänge gemäss Bank; Anzahlung ≤ vertragliche Rate
  feststellung_wenn: Zugang ohne Vertrag oder Zahlung, Anzahlung eines Dritten bzw. für fremde Rechnung oder unbezahlte Anzahlungsrechnung passiviert (Bilanzverlängerung).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0456-s251
    zitat: Die Bestandsermittlung erfolgt aufgrund von Verträgen, Korrespondenzen
  - quelle: hwp-bur-2023__rz-0109-s185
    zitat: Solche Anzahlungen von Kunden werden erst bilanziert, wenn die Zahlung erfolgt ist
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
- id: M1-403
  vorgehen: 'Nur auf Anweisung des WP: Für abgeschlossene bzw. abgenommene Projekte (Abnahmeprotokoll, Schlussrechnung, auch in neuer Rechnung) prüfen, ob die Anzahlungen mit der Schlussrechnung
    verrechnet und das Anzahlungskonto je Projekt ausgeglichen wurde. Restsalden abgeschlossener Projekte mit Projekt, Konto und Betrag auflisten.'
  nachweise:
  - Projektliste
  - Abnahmeprotokolle
  - Schlussrechnungen
  - Kontoblatt erhaltene Anzahlungen
  rechnen: 'Restsaldo je abgeschlossenem Projekt = Anzahlungen – mit Schlussrechnung verrechnet (Soll: 0)'
  feststellung_wenn: Abgeschlossenes Projekt mit wesentlichem Restsaldo auf Anzahlungen bzw. Ertrag nicht realisiert.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0455-s251
    zitat: Die Anzahlungskonten sind periodisch abzustimmen und im Zeitpunkt der Erfüllung des Vertrags, spätestens bei der Schlussabrechnung, zu bereinigen.
- id: M1-404
  vorgehen: 'Nur auf Anweisung des WP: Liste der Kundenvorauszahlungen per 31.12. a) mit Saldo Hauptbuch abstimmen, b) je wesentlichem Posten mit Auftragsbestätigung/Kaufvertrag, c)
    mit Faktura bzw. Verrechnung in neuer Rechnung und d) mit Zahlungsbeleg abgleichen. Ausweis (kurzfristig, nicht mit Forderungen verrechnet) im Textfeld festhalten.'
  nachweise:
  - Liste Kundenvorauszahlungen
  - Hauptbuch
  - Auftragsbestätigungen/Kaufverträge
  - Fakturen neue Rechnung
  - Zahlungsbelege
  rechnen: Summe Liste = Saldo Konto erhaltene Anzahlungen; je Posten Zahlungseingang = Anzahlungsbetrag
  feststellung_wenn: Liste weicht vom Hauptbuch ab, Vorauszahlung ohne Vertrag oder Zahlung, oder bereits erbrachte Leistung weiterhin als Anzahlung passiviert.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0453-s251
    zitat: Soweit für die erhaltene Anzahlung noch keine Lieferung oder Leistung erbracht worden ist, entspricht die Anzahlung einer Vorleistung
  - quelle: hwp-bur-2023__rz-0457-s252
    zitat: Passive Anzahlungen werden – wie die Verbindlichkeiten im Allgemeinen – zu ihrem Nennwert bilanziert
  - quelle: hwp-bur-2023__rz-0458-s252
    zitat: Soweit erhaltene Anzahlungen reinen Vorleistungscharakter haben
- id: M1-405
  vorgehen: 'Nur auf Anweisung des WP: Projektliste angefangene Arbeiten mit erhaltenen Anzahlungen je Projekt abgleichen (vgl. F2). Darstellung (brutto oder netto je Projekt) und Stetigkeit
    feststellen; bei Nettodarstellung Überfinanzierungen unter übrigen Verbindlichkeiten. Abgrenzung zu passiven Rechnungsabgrenzungen beurteilen.'
  nachweise:
  - Projektliste angefangene Arbeiten/Anzahlungen
  - Kontoblätter Anzahlungen und angefangene Arbeiten
  - Anhang
  rechnen: Netto je Projekt = Bilanzwert angefangene Arbeiten – erhaltene Anzahlungen; bei Nettodarstellung Summe negativer Nettowerte = Ausweis unter Verbindlichkeiten
  feststellung_wenn: Uneinheitliche Darstellung, Anzahlungen doppelt oder nicht verrechnet, oder Überfinanzierung als Aktivum ausgewiesen.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0254-s214
    zitat: im umgekehrten Fall einer Überfinanzierung wird der Buchwert unter den übrigen Verbindlichkeiten bilanziert
  - quelle: hwp-bur-2023__rz-0454-s251
    zitat: Die begriffliche Grenzziehung zwischen passiven Anzahlungen mit Vorauszahlungscharakter und passiven Rechnungsabgrenzungen
  - quelle: ser-2022__anh-d-s079-1
    zitat: Prüfung angefangener Arbeiten und nicht fakturierter Dienstleistungen anhand des Arbeitsfortschritts und/oder Abrechnungen in neuer Periode
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- id: M1-406
  vorgehen: 'Nur auf Anweisung des WP: Konten auf Sollsaldi durchsehen (negatives Vorzeichen auf Passivkonten). Vor jeder Umgliederung je Gegenpartei klären, ob nur über einen Saldo
    abgerechnet wird (z.B. Unterkonten derselben Ausgleichskasse, UVG/UVGZ beim selben Versicherer): dann ist Verrechnung geboten. Nur Netto-Sollsaldi je Gegenpartei ausgliedern; Ursache
    klären, Umgliederung mit Konto und Betrag als Feststellung vorschlagen (keine Buchung).'
  nachweise:
  - Saldoliste
  - Kontoblätter
  - Abrechnungen der Gegenpartei
  rechnen: Netto-Saldo je Gegenpartei = Summe ihrer Konten; Umgliederungsbetrag = Summe der Netto-Sollsaldi je Gegenpartei; Position nach Umgliederung = Summe der Netto-Habensaldi
  feststellung_wenn: Wesentlicher Netto-Sollsaldo einer Gegenpartei mit Habensaldi anderer Gegenparteien saldiert, Saldoabrechnung derselben Gegenpartei nicht verrechnet oder Sollsaldo
    aus Fehlbuchung.
  fundstellen:
  - quelle: or__art-958c
    zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
  - quelle: hwp-bur-2023__rz-0163-s193
    zitat: Eine Saldierung von Forderungen und Verbindlichkeiten in der Bilanz ist unzulässig
  - quelle: hwp-bur-2023__rz-0163-s193
    zitat: Nicht nur zulässig, sondern geboten ist eine Verrechnung dann, wenn mit der Gegenpartei nur über eine Saldogrösse abgerechnet wird.
  - quelle: hwp-bur-2023__rz-0154-s192
    zitat: Forderungen und Verbindlichkeiten gegenüber Sozialversicherungen
- id: M1-407
  vorgehen: 'Nur auf Anweisung des WP, koordiniert mit L1/N1/SCH4: Verzinste Kontokorrente gehören zu kurzfristigen verzinslichen Verbindlichkeiten; Ausweis in M1 ist Fehlklassierung
    (Feststellung in M1-301). KK Nahestehender/Konzern mit Vertrag und Zinsabrechnung abgleichen, Zins nachrechnen, Satz mit Drittvergleich bzw. ESTV-Rundschreiben des Geschäftsjahres
    vergleichen; fehlen die ESTV-Sätze 2025, im Textfeld vermerken.'
  nachweise:
  - KK-Verträge/Vereinbarungen
  - Zinsabrechnungen
  - Kontoblätter Zinsaufwand
  - ESTV-Rundschreiben Zinssätze des Geschäftsjahres
  rechnen: Zins = Saldo × vertraglicher Zinssatz × Laufzeit; Differenz zum gebuchten Zins; Vergleich Satz mit ESTV-Höchstsatz des Jahres
  feststellung_wenn: Zinssatz über ESTV-Höchstsatz des Jahres ohne Drittvergleich, Zins weicht vom Vertrag ab oder ist nicht abgegrenzt; verzinstes Kontokorrent in M1 (Fehlklassierung).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0154-s192
    zitat: nicht verzinsliche Verbindlichkeiten, die nicht aus Lieferungen und Leistungen stammen
  - quelle: or__art-959a-t1
    zitat: b. kurzfristige verzinsliche Verbindlichkeiten
  - quelle: estv-zinsen-2026__s001-1
    zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
  - quelle: estv-zinsen-2026__s001-2
    zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Beurteilung der (Transfer-)Preise der jeweiligen Geschäftsvorfälle mittels Drittvergleichs
  - quelle: estv-zinsen-2026__s002-1
    zitat: Der Nachweis höherer Zinssätze im Drittvergleich bleibt vorbehalten.
- id: M1-408
  vorgehen: 'Nur auf Anweisung des WP: Kontoauszug/Beitragsrechnung der Vorsorgeeinrichtung per 31.12. mit BVG-Konto abstimmen; Schuld gegenüber der VE vollständig passiviert und im
    Anhang (Art. 959c Abs. 2 Ziff. 7 OR) angegeben? Einhaltung von Art. 331 Abs. 3 OR (Beitragshöhe, Frist) ist weitergehend (SER Anh. D: nicht Bestandteil): nur auf ausdrückliche Anweisung;
    Verstoss nur als Notiz an den WP, der über einen Hinweis entscheidet.'
  nachweise:
  - Beitragsrechnung/Kontoauszug Vorsorgeeinrichtung 31.12.
  - Kontoblatt BVG und Aufwand BVG
  - Zahlungsbelege Januar Folgejahr
  - Anhang
  - Reglement/Anschlussvertrag (nur bei Anweisung Art. 331 OR)
  rechnen: Saldo BVG-Konto = Ausstand gemäss Kontoauszug VE (Differenz 0); Anhangbetrag Vorsorgeverbindlichkeiten = Habensaldo gegenüber VE
  feststellung_wenn: Verbindlichkeit gegenüber der VE nicht vollständig passiviert bzw. Anhangangabe fehlt oder weicht ab. Verstoss gegen Art. 331 Abs. 3 OR nur als Notiz an den WP.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0838-s346
    zitat: Mit dem Ausweis der Verbindlichkeiten gegenüber der Vorsorgeeinrichtung soll das Ausmass der Verschuldung eines Unternehmens gegenüber dessen Vorsorgeeinrichtung beurteilt
      werden können.
  - quelle: or__art-959c-t2
    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
  - quelle: hwp-bur-2023__rz-0536-s265
    zitat: alle fälligen oder bereits beschlossenen Beiträge an die Vorsorgeeinrichtung
  - quelle: ser-2022__anh-d-s093-2
    zitat: Prüfen, ob arbeitsrechtliche und verwaltungsrechtliche Vorgaben eingehalten werden
  - quelle: ser-2022__1-6-t2
    zitat: Bei Verstössen gegen Gesetz, Statuten oder Organisationsreglement, welche nicht direkt mit der Rechnungslegung in Zusammenhang stehen, besteht keine gesetzliche Hinweispflicht
      für den Abschlussprüfer.
  - quelle: ser-2022__8-3-2-t1
    zitat: wenn sie wesentlich sind, einen direkten Bezug zur Jahresrechnung aufweisen
  - quelle: or__art-331-t1
    zitat: spätestens am Ende des ersten Monats nach dem Kalender- oder Versicherungsjahr
