# Prüffeld M1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: M1
bezeichnung: übrige kurzfristige Verbindlichkeiten
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 17
    korrigiert: false
kurzbeschrieb: 'Übrige kurzfristige Verbindlichkeiten (Art. 959a Abs. 2 Ziff. 1 lit. c OR): nicht verzinsliche, nicht aus Lieferungen/Leistungen stammende Schulden bis 12 Monate, v.a.
  Sozialversicherungen (AHV, UVG, KTG, BVG), Quellensteuer, MWST-Abrechnungskonto, Personal, Kundenanzahlungen. Eingeschränkte Revision: Vollständigkeit, Abstimmung mit Abrechnungen,
  Sollsaldi, Ausweis (Art. 959a Abs. 4, 959c OR).'
gesetz:
- thema: 'Mindestgliederung: übrige kurzfristige Verbindlichkeiten als eigene Position des kurzfristigen Fremdkapitals (Art. 959a Abs. 2 Ziff. 1 lit. c OR)'
  quelle: or__art-959a-t1
  zitat: c. übrige kurzfristige Verbindlichkeiten
- thema: 'Passivierungspflicht: vergangenes Ereignis, wahrscheinlicher Mittelabfluss, verlässliche Schätzung (Art. 959 Abs. 5 OR)'
  quelle: or__art-959
  zitat: Verbindlichkeiten müssen als Fremdkapital bilanziert werden, wenn sie durch vergangene Ereignisse bewirkt wurden
- thema: 'Fristigkeit: kurzfristig bei Fälligkeit innert eines Jahres bzw. Geschäftszyklus (Art. 959 Abs. 6 OR)'
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: Gesonderter Ausweis von Verbindlichkeiten gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
- thema: Bewertung zum Nennwert (Art. 960e Abs. 1 OR)
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verrechnungsverbot Aktiven/Passiven (Art. 958c Abs. 1 Ziff. 7 OR), massgebend für Sollsaldi
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Bestandesnachweis (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Belegnachweis für Buchungen (Art. 957a Abs. 2 Ziff. 2 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
- thema: 'Anhang: Aufschlüsselungen und Erläuterungen zu Bilanzpositionen (Art. 959c Abs. 1 Ziff. 2 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen (Art. 959c Abs. 2 Ziff. 7 OR)'
  quelle: or__art-959c-t2
  zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
- thema: 'Arbeitgeberbeiträge Personalvorsorge: mindestens gleich hoch wie Arbeitnehmerbeiträge, Überweisungsfrist (Art. 331 Abs. 3 OR)'
  quelle: or__art-331-t1
  zitat: spätestens am Ende des ersten Monats nach dem Kalender- oder Versicherungsjahr, für das die Beiträge geschuldet sind, an die Vorsorgeeinrichtung überweisen
- thema: Rückerstattungspflicht bei Missverhältnis von Leistung und Gegenleistung mit Nahestehenden, z.B. übersetzte Zinsen (Art. 678 Abs. 2 OR)
  quelle: or__art-678
  zitat: soweit ein offensichtliches Missverhältnis zwischen Leistung und Gegenleistung besteht
- thema: Prüfungsumfang der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: 'Unvollständige Erfassung: Schulden gegenüber Sozialversicherungen (Schlussabrechnungen AHV, UVG, KTG, BVG), Quellensteuer oder Personal (Boni, Lohnnachzahlungen) fehlen per
    Stichtag.'
  pruefziele:
  - VO
  - PA
  quelle: ser-2022__4-3-4
  zitat: Es müssen sämtliche Vermögenswerte, Verbindlichkeiten, Abgrenzungen und Rückstellungen bilanziert
- text: 'Periodenfehler: Abrechnungen und Anzahlungen nicht stichtagsgerecht erfasst (z.B. Schlussabrechnung Ausgleichskasse erst im Folgejahr gebucht).'
  pruefziele:
  - PA
  - RI
  quelle: ser-2022__4-3-6
  zitat: ob Geschäftsvorfälle oder Ereignisse betragsmässig richtig erfasst sowie zeitlich zutreffend abgegrenzt wurden
- text: Fiktive, überhöhte oder nicht mehr bestehende Verbindlichkeiten (Altsalden ohne Abrechnung, Bildung stiller Reserven über Passiven).
  pruefziele:
  - EX
  - BE
  quelle: ser-2022__4-3-1
  zitat: Wegen des Verbots der Bilanzierung fiktiver Verbindlichkeiten ist dies aber auch für die Passiven zu beachten.
- text: Bilanzierte Schulden betreffen den Eigentümer oder Dritte und nicht die Gesellschaft.
  pruefziele:
  - RV
  quelle: ser-2022__4-3-2
  zitat: Bilanzierte Verpflichtungen müssen solche des Unternehmens (und nicht z. B. des Eigentümers) sein.
- text: Sollsaldi (Guthaben gegenüber Sozialversicherungen, Überzahlungen) mit Habensaldi verrechnet statt als übrige kurzfristige Forderungen ausgewiesen.
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: Eine Saldierung von Forderungen und Verbindlichkeiten in der Bilanz ist unzulässig
- text: 'Erhaltene Kundenanzahlungen: Konten nach Schlussrechnung nicht ausgeglichen, unbezahlte Anzahlungsrechnungen passiviert (Bilanzverlängerung) oder falsche Abgrenzung zu angefangenen
    Arbeiten.'
  pruefziele:
  - EX
  - VO
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0455-s251
  zitat: spätestens bei der Schlussabrechnung, zu bereinigen
- text: Verbindlichkeiten gegenüber Beteiligten, Organen oder Vorsorgeeinrichtungen nicht gesondert in Bilanz bzw. Anhang ausgewiesen.
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0162-s193
  zitat: Eine separate Ausweispflicht im Anhang besteht für Verbindlichkeiten gegenüber Vorsorgeeinrichtungen
- text: Fremdwährungsverbindlichkeiten nicht zum Stichtagskurs umgerechnet.
  pruefziele:
  - BE
  - RI
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: werden ebenfalls zum Kurs am Bilanzstichtag bewertet
- text: 'Übersetzte Zinsen auf Kontokorrenten von Beteiligten/Nahestehenden: geldwerte Leistung mit Verrechnungssteuerfolgen, allenfalls Rückerstattungspflicht.'
  pruefziele:
  - BE
  - RI
  - DO
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- text: Rückständige oder zu tiefe Arbeitgeberbeiträge an die Vorsorgeeinrichtung (Verstoss gegen Art. 331 Abs. 3 OR).
  pruefziele:
  - RV
  - VO
  - DO
  quelle: or__art-331-t1
  zitat: zur gleichen Zeit mindestens gleich hohe Beiträge wie die gesamten Beiträge aller Arbeitnehmer zu entrichten
unterlagen:
