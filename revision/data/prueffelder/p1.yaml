schritte:
- id: P1-301
  vorgehen: Gültige Statuten und aktuellen HR-Auszug (Dauerakte/M-Files; HR öffentlich) beschaffen. Aktienkapital (Betrag, Anzahl, Nennwert, Kategorie, Liberierung) mit Saldo Konto 2800,
    Bilanz und Aktienbuch abstimmen; bei Kapitalveränderung im GJ HR-Eintragungsdatum mit Buchungsdatum vergleichen. Abstimmung mit Fundstellen im Textfeld dokumentieren; fehlende Statuten
    bzw. HR-Auszug als Pendenz.
  nachweise:
  - Statuten (gültige Fassung)
  - Handelsregisterauszug
  - Aktienbuch
  - Saldoliste/Kontoblatt 2800
  - Bilanz
  rechnen: Anzahl Aktien × Nennwert = Aktienkapital lt. Statuten/HR = Saldo Konto 2800 = Bilanzposition Aktienkapital; Σ Nominal Aktienbuch = Aktienkapital
  feststellung_wenn: Saldo/Bilanz weicht von Statuten, HR oder Aktienbuch ab, Kapitalveränderung ohne HR-Eintrag gebucht oder nicht einbezahltes Kapital nicht gesondert aktiviert.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Abstimmung des Grundkapitals mit den gültigen Statuten oder dem Handelsregisterauszug
  - quelle: hwp-bur-2023__rz-0561-s273
    zitat: Die Höhe und die Zusammensetzung des Grundkapitals müssen mit den Statuten, der Eintragung im Handelsregister und allenfalls dem Aktienbuch
  - quelle: hwp-bur-2023__rz-0563-s273
    zitat: Ein nicht einbezahlter Teil ist unter den Aktiven gesondert auszuweisen
  - quelle: or__art-936
    zitat: Die Einträge, Statuten und Stiftungsurkunden werden im Internet gebührenfrei zugänglich gemacht.
- id: P1-302
  vorgehen: Eröffnungssaldi der Reservekonten (29xx), Gewinn-/Verlustvortrag und Jahresergebnis mit der geprüften Vorjahresbilanz abstimmen; Veränderungen mit dem Protokoll der GV über
    das Vorjahr (Gewinnverwendung, Verlustverrechnung, Ausschüttung) abgleichen. Je Konto Saldo VJ, Beschluss, Buchung und Saldo 31.12. tabellarisch im Textfeld dokumentieren; fehlendes
    GV-Protokoll als Pendenz.
  nachweise:
  - Geprüfte Jahresrechnung Vorjahr
  - Protokoll oGV über das Vorjahr
  - Kontoblätter EK-Konten
  - Saldoliste
  rechnen: 'je EK-Konto: Saldo VJ lt. geprüfter JR ± GV-beschlossene Zuweisungen/Verrechnungen/Ausschüttungen ± übrige belegte Bewegungen = Saldo 31.12.; Vortrag 2970 neu = Vortrag VJ
    + Jahresergebnis VJ − beschlossene Verwendung'
  feststellung_wenn: Eröffnungssaldo weicht von geprüfter VJ-Bilanz ab, Buchung entspricht nicht dem GV-Beschluss oder Bewegung ohne Beschluss; fehlende Unterlagen als Pendenz.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Abstimmung der Reserven und des Bilanzgewinns/-verlusts mit der Jahresrechnung des Vorjahres und dem GV-Protokoll
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres
  - quelle: hwp-er-2026__rz-0219-s235
    zitat: Abstimmung der Reserven und des Bilanzgewinns/-verlusts mit der Jahresrechnung des Vorjahres und dem GV-Protokoll
- id: P1-303
  vorgehen: 'Antrag VR inkl. Rückzahlung aus gesetzl. Kapitalreserve (im Bericht separat aufzuführen) beschaffen, nachrechnen, mit Bilanz abstimmen. Prüfen: Reservezuweisung Art. 672,
    Verlustverrechnung Art. 674, Schwelle Art. 671 Abs. 2–4 OR, ausschüttbares EK (HWP ER Abb. 31, Sperre durch Aktionärsforderungen P1-305), Statuten, Liquidität (Budget; bei erheblichem
    Entzug Fortführung), Ereignisse nach Stichtag. Covid-19-Kredit (Art. 3 oder 4 SBüV) mit laufender Solidarbürgschaft? Dann sind Dividenden, Tantiemen und Rückerstattung von Kapitaleinlagen
    (auch aus KER) ausgeschlossen (Art. 2 Abs. 2 lit. a Covid-19-SBüG) → Notiz «Wesentliche Feststellungen» an den WP. Fristansetzung und Information von GV und Bürgschaftsorganisation
    (Art. 23) entscheidet und vollzieht nur der WP; der Agent setzt keine Frist und informiert niemanden. Bei Begründung «KER, verrechnungssteuerfrei»: verbleibenden KER-Bestand nach
    Verlustverrechnung und ESTV-Bestätigung über P1-315 klären. Zielkonflikt Verlustverrechnung (Sanierungsfreibetrag Emissionsabgabe, P1-308) gegenüber KER-Erhalt als Notiz an den WP.
    Berechnung dokumentieren; Prüfaussage: WP.'
  nachweise:
  - Antrag VR über Verwendung des Bilanzgewinns
  - Bilanz/Eigenkapital
  - Statuten
  - Budget/Liquiditätsplanung
  - Ergebnis P1-305 (Aktionärsforderungen)
  - Ergebnis P1-313 (Kapitalverlust/Überschuldung)
  rechnen: 'Bilanzgewinn/-verlust = Vortrag + Jahresergebnis; Σ Antrag = Bilanzgewinn/-verlust; Zuweisung 5 % Jahresgewinn (nach Beseitigung Verlustvortrag) bis gesetzl. Kapital- + Gewinnreserve
    = 50 % AK, Holding 20 % (Art. 672 Abs. 2, Abs. 3 i.V.m. 671 Abs. 4); Rückzahlung KR nur soweit (gesetzl. Kapital- + Gewinnreserve ohne Aufwertungsreserve und Reserve eigene Aktien
    im Konzern − Verluste) > 50 % AK (Holding > 20 %); Ausschüttung ≤ ausschüttbares EK (nur offene Reserven − Bilanzverlust − gesperrte Reserven − nicht drittvergleichskonforme Aktionärsforderungen);
    Verlustverrechnung zwingend in der Reihenfolge Gewinnvortrag → freiwillige Gewinnreserven → gesetzliche Gewinnreserve → gesetzliche Kapitalreserve; nur anstelle der Verrechnung mit
    den gesetzlichen Reserven darf vorgetragen werden (Art. 674 Abs. 1/2 OR); Dividende erst nach den Reservezuweisungen (Art. 675 Abs. 3 OR); Beispiel Art. 671 Abs. 2 OR: `rechne "ak
    = 100000; kr = 70000; gr = 10000; verlust = 20000; reserven = kr + gr - verlust; reserven - ak / 2"` (> 0 = höchstens dieser Betrag aus der Kapitalreserve rückzahlbar; ≤ 0 = keine
    Rückzahlung). Liquidität: `rechne "fluessig = 45000; ausschuettung = 48000; fluessig - ausschuettung"` (< 0 oder knapp → Budget/Liquiditätsplanung bis Auszahlung als «Pendenz»).'
  feststellung_wenn: Antrag rechnerisch falsch/nicht bilanzkonform, Zuweisung oder Verlustverrechnung fehlerhaft, Ausschüttung > ausschüttbares EK bzw. Schwelle Art. 671 OR verletzt,
    Liquidität nicht belegt oder Fortführung gefährdet.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Beurteilung des Antrags über die Verwendung des Bilanzgewinns
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung, ob die gesetzliche Reservezuweisung vorgenommen wurde (sofern erforderlich)
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung, ob ggf. gesetzliche Verlustverrechnung nach Art. 674 OR eingehalten ist
  - quelle: hwp-er-2026__rz-0220-s235
    zitat: Nachrechnen des Gewinnverwendungs- bzw. Verlustverrechnungsvorschlags
  - quelle: hwp-er-2026__rz-0224-s236
    zitat: ob die von Art. 674 OR vorgegebene Reihenfolge der Verrechnung eingehalten wird
  - quelle: or__art-729a
    zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
  - quelle: or__art-671
    zitat: wenn die gesetzlichen Kapital- und Gewinnreserven, abzüglich des Betrags allfälliger Verluste, die Hälfte des im Handelsregister eingetragenen Aktienkapitals übersteigen
  - quelle: or__art-671
    zitat: wenn die gesetzlichen Kapital- und Gewinnreserven 20 Prozent des im Handelsregister eingetragenen Aktienkapitals überschreiten
  - quelle: or__art-671
    zitat: die gesetzliche Gewinnreserve für eigene Aktien im Konzern (Art. 659b) und die gesetzliche Gewinnreserve aus Aufwertungen (Art. 725c) nicht berücksichtigt werden
  - quelle: or__art-672
    zitat: Die gesetzliche Gewinnreserve ist zu äufnen, bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte des im Handelsregister eingetragenen Aktienkapitals erreicht.
  - quelle: hwp-er-2026__rz-0225-s236
    zitat: Der Bilanzverlust muss bei der Berechnung des ausschüttbaren Eigenkapitals berücksichtigt werden.
  - quelle: hwp-er-2026__rz-0170-s216
    zitat: Abzüglich Aktionärs- bzw. Konzernforderungen, die einem Drittvergleich nicht standhalten
  - quelle: hwp-er-2026__rz-0256-s242
    zitat: Es ist zu beurteilen, ob die Gesellschaft über ausreichend flüssige Mittel verfügt, um die geplante Dividende zu entrichten.
  - quelle: hwp-er-2026__rz-0222-s235
    zitat: Stellt die beantragte Gewinnverwendung offensichtlich einen erheblichen Liquiditätsentzug dar, beurteilt der Abschlussprüfer die Fortführungsfähigkeit des Unternehmens
  - quelle: hwp-er-2026__rz-0255-s242
    zitat: auch der «Antrag über die Rückzahlung aus der gesetzlichen Kapitalreserve» separat aufgeführt
  - quelle: or__art-674
    zitat: Verluste müssen in folgender Reihenfolge verrechnet werden mit
  - quelle: or__art-674
    zitat: Anstelle der Verrechnung mit der gesetzlichen Gewinnreserve oder der gesetzlichen Kapitalreserve dürfen verbleibende Verluste auch teilweise oder ganz auf die neue Jahresrechnung
      vorgetragen werden.
  - quelle: or__art-675
    zitat: Dividenden dürfen erst festgesetzt werden, nachdem die Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven erfolgt sind.
  - quelle: covid-sbueg__art-2-t1
    zitat: Während der Dauer der Solidarbürgschaft ausgeschlossen sind
  - quelle: covid-sbueg__art-2-t1
    zitat: Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen
  - quelle: covid-sbueg__art-3
    zitat: Eine Solidarbürgschaft dauert höchstens acht Jahre
  - quelle: covid-sbueg__art-23
    zitat: so setzt sie ihr oder ihm eine angemessene Frist zur Herstellung des ordnungsgemässen Zustandes
  - quelle: covid-sbueg__art-23
    zitat: so muss die Revisionsstelle die Generalversammlung informieren
  - quelle: covid-sbueg__art-23
    zitat: Sollte der Verwaltungsrat den ordnungsgemässen Zustand auch dann nicht unverzüglich herstellen, so informiert die Revisionsstelle die zuständige Bürgschaftsorganisation.
  - quelle: estv-ks-29c-2022__2-2-3-t1
    zitat: Verluste, die den KER bzw. den Ausland-KER belastet wurden, vermindern diese definitiv.
  - quelle: estv-ks-32a-2025__3-3-2-t1
    zitat: die Verrechnung der Sanierungsleistungen mit den bestehenden Verlusten ist zwingend
  notiz: Antrag rechnerisch falsch, Zuweisung oder Verlustverrechnung fehlerhaft, Ausschüttung > ausschüttbares EK oder Schwelle Art. 671 Abs. 2 OR verletzt → «Wesentliche Feststellungen»
    (kein Buchungsvorschlag; Stellungnahme im Bericht entscheidet der WP) + «Schlussbesprechung». Antrag, Budget oder Liquiditätsplanung nicht gefunden → «Pendenz». Flüssige Mittel decken
    die Ausschüttung nicht → «Schlussbesprechung» (Fortführung, WP).
- id: P1-304
  vorgehen: Saldoliste/Kontoblätter auf eigene Kapitalanteile (Minusposten) durchsehen; Bestand (Anzahl, Anschaffungswert) mit Aufstellung, Aktienbuch bzw. Depotauszug abstimmen. Schriftliche
    Antwort zur Befragung nach Bestand, Erwerb und Veräusserung (auch durch Tochtergesellschaften) auswerten, sonst Frage als Pendenz. Grenzen Art. 659 OR und Anhangangabe der Anzahl
    prüfen und dokumentieren.
  nachweise:
  - Aufstellung eigene Kapitalanteile
  - Aktienbuch
  - Depotauszug/Verträge
  - Kundenbefragung (schriftlich)
  - Anhang
  - Erwerbsdatum, Erwerbspreis und Zweck (Kapitalherabsetzung ja/nein) je Tranche
  rechnen: 'Minusposten = Σ Anschaffungswerte gehaltener eigener Aktien; Nominal eigene Aktien ≤ 10 % des im HR eingetragenen AK (20 % bei Art. 659 Abs. 3 OR); Anschaffungswert ≤ frei
    verwendbares EK; je Tranche (FIFO): Erwerb im Hinblick auf Kapitalherabsetzung oder über dem Rahmen von Art. 659 OR → VSt sofort. Sonst (erste 10 %) Steuerforderung bei Haltedauer
    > 6 Jahre (Art. 4a Abs. 2, Art. 12 Abs. 1bis VStG). VSt = 35 % × (Erwerbspreis − einbezahlter Nennwert − anteilige KER, sofern der Minusposten unter KER verbucht ist; KS 51 Ziff.
    3.1.2.12)'
  feststellung_wenn: Eigene Anteile vorhanden, aber nicht als Minusposten zum Anschaffungswert ausgewiesen, Grenze Art. 659 OR überschritten oder Anzahl im Anhang fehlt; VSt-Folge aus
    Art. 4a VStG nicht abgerechnet/abgegrenzt (→ P1-308, Beurteilung WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Feststellen des Bestands an eigenen Kapitalanteilen
  - quelle: or__art-659
    zitat: Die Gesellschaft darf eigene Aktien nur dann erwerben, wenn frei verwendbares Eigenkapital in der Höhe des Anschaffungswerts vorhanden ist.
  - quelle: or__art-959c-t1
    zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile durch das Unternehmen selbst
  - quelle: vstg__art-4a-t1
    zitat: so unterliegt die Differenz zwischen dem Erwerbspreis und dem einbezahlten Nennwert dieser Beteiligungsrechte der Verrechnungssteuer
  - quelle: vstg__art-4a-t1
    zitat: Dasselbe gilt, soweit der Erwerb eigener Beteiligungsrechte den Rahmen der Artikel 659 oder 783 des Obligationenrechts (OR) überschreitet.
  - quelle: vstg__art-4a-t1
    zitat: wenn die Gesellschaft oder die Genossenschaft diese Beteiligungsrechte nicht innerhalb von sechs Jahren wieder veräussert
  - quelle: vstg__art-12
    zitat: Im Falle des Erwerbs eigener Beteiligungsrechte nach Artikel 4a Absatz 2 entsteht die Steuerforderung mit Ablauf der dort geregelten Frist.
  - quelle: vstg__art-13
    zitat: 35 Prozent der steuerbaren Leistung
  - quelle: estv-ks-51-2026__3-1-1-t1
    zitat: Der Rückkauf eigener Beteiligungsrechte stellt für die Verrechnungssteuer grundsätzlich eine Teilliquidation dar.
  - quelle: estv-ks-51-2026__3-1-2-3-t1
    zitat: so unterliegt der Erwerb der ersten 10 Prozent der Regelung gemäss Artikel 4a Absatz 2 VStG.
  - quelle: estv-ks-51-2026__3-1-2-3-t1
    zitat: Insoweit erfolgt eine Besteuerung erst nach Ablauf der Sechsjahresfrist. Es gilt das Prinzip «first in, first out».
  - quelle: estv-ks-51-2026__3-1-2-12
    zitat: dem einbezahlten Nennwert zuzüglich den allfälligen KER
  - quelle: estv-ks-51-2026__4
    zitat: Es ist auf alle dannzumal noch offenen Veranlagungen anzuwenden.
- id: P1-305
  vorgehen: Gegenparteien lt. Aktienbuch und Organen (je Name `akte <pfad> --suche "<Name>"`) in Debitoren-/OP-Listen, Kontoblättern aller Forderungskonten (1100 ff., 114x, 119x) und
    Ergebnissen der Prüffelder B/C suchen; Forderungen mit Darlehenscharakter (up-/cross-stream, Cash-Pool; ohne operative L+L) erfassen. Freies EK berechnen, mit dem Total vergleichen;
    ist das Total höher, Drittvergleichsanalyse des VR (Vertrag, Zins, Rückzahlung, Sicherheit) einsehen, sonst Pendenz. Dokumentieren.
  nachweise:
  - Aktienbuch, Organe lt. HR-Auszug
  - Debitoren-/OP-Listen, Kontoblätter aller Forderungskonten
  - Ergebnisse Prüffelder B/C
  - Darlehensverträge Aktionäre/Konzern mit VR-Genehmigung
  - Drittvergleichsanalyse VR
  - Eigenkapital lt. Bilanz
  rechnen: Freies EK = Total ausgewiesenes EK − einbezahltes Grundkapital (optional + stille Reserven netto, nur für Art. 680 Abs. 2, nicht für das ausschüttbare EK); Σ Forderungen mit
    Darlehenscharakter ggü. Aktionären/Konzern aus allen Forderungskonten (ohne operative L+L; Verrechnung mit Verbindlichkeiten nur nach Art. 120 OR oder Vertrag) ≤ freies EK
  feststellung_wenn: 'Σ Aktionärs-/Konzernforderungen > freies EK ohne dokumentierten Drittvergleich oder Aktionärsdarlehen unter Debitoren/übrigen Forderungen verbucht: möglicher Verstoss
    Art. 680 Abs. 2 OR, Sperre ausschüttbares EK (WP); oder Gewährung bzw. Rückzahlung von Darlehen an/von Aktionären oder Nahestehenden während laufender Covid-Solidarbürgschaft (Art.
    2 Abs. 2 lit. b Covid-19-SBüG; die Ausnahme für vorbestehende Verpflichtungen gegenüber Schweizer Gruppengesellschaften beurteilt der WP).'
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung allfälliger Rückzahlungen von Einlagen der Aktionäre im Hinblick auf Art. 680
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: ist das freie Eigenkapital mit dem Total der Forderungen gegenüber Aktionären zu vergleichen
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: Als Forderungen ihnen gegenüber gelten hierbei alle direkten (up stream) und indirekten (cross stream) Forderungen mit Darlehenscharakter.
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: Konzerninterne Forderungen aus Lieferungen und Leistungen, die aus einem operativen Leistungsaustausch mit üblichen Zahlungszielen entstanden sind
  - quelle: hwp-er-2026__rz-0167-s215
    zitat: Bei der Ermittlung des freien Eigenkapitals dürfen stille Reserven (netto, unter Berücksichtigung latenter Steuerfolgen) berücksichtigt werden.
  - quelle: hwp-er-2026__rz-0168-s215
    zitat: In solchen Fällen ist zu analysieren, ob die Forderungen ihnen gegenüber einem Drittvergleich («Arm’s-length»-Prinzip) standhalten.
  - quelle: hwp-er-2026__rz-0182-s218
    zitat: darf die Revisionsstelle davon ausgehen, dass dieser nicht gegeben ist
  - quelle: hwp-er-2026__rz-0170-s216
    zitat: führt dies zu einer Sperrung von frei verfügbarem Eigenkapital im gesamten Umfang dieser Darlehen
  - quelle: covid-sbueg__art-2-t1
    zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
  - quelle: covid-sbueg__art-2-t1
    zitat: zulässig ist jedoch die Erfüllung von Verpflichtungen gegenüber einer mit der Kreditnehmerin oder dem Kreditnehmer direkt oder indirekt verbundenen Gruppengesellschaft mit
      Sitz in der Schweiz
- id: P1-306
  vorgehen: 'WP-Schritt: ohne ausdrückliche Anweisung des WP kein Textfeld-Eintrag (Status «nicht bearbeitet – WP-Schritt»; Hinweise nur als Notiz Schlussbesprechung/Pendenz). Mit Anweisung,
    gekennzeichnet als «Vorbereitung für WP»: Käufe/Verkäufe eigener Anteile aus Kontoblättern mit Verträgen bzw. Abrechnungen abgleichen; Erfassung zum Anschaffungswert als Minusposten,
    Ausbuchung bei Veräusserung zum Anschaffungswert und Behandlung des Mehr-/Mindererlöses (Stetigkeit) nachvollziehen; Anhangangaben zu Erwerb/Veräusserung und Bedingungen prüfen.
    Ergebnis zur Beurteilung durch den WP dokumentieren.'
  nachweise:
  - Kontoblatt eigene Kapitalanteile
  - Kauf-/Verkaufsverträge, Bankabrechnungen
  - VR-/GV-Beschlüsse
  - Anhang
  rechnen: Minusposten Anfang + Zugänge (Anschaffungswert) − Abgänge (Anschaffungswert) = Minusposten Ende; Veräusserungserlös − Anschaffungswert = Mehr-/Mindererlös (Erfassung gemäss
    gewählter Methode)
  feststellung_wenn: Transaktion nicht belegt, nicht zum Anschaffungswert erfasst, Folgebewertung vorgenommen, Methode Mehr-/Mindererlös unstetig oder Anhangangabe Art. 959c Abs. 2 Ziff.
    5 OR fehlt; VSt-Folge aus Art. 4a VStG (Erwerb im Hinblick auf Kapitalherabsetzung, über dem Rahmen von Art. 659 OR oder Haltedauer > 6 Jahre) nicht abgerechnet/abgegrenzt (→ P1-308,
    Beurteilung WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Analyse von Käufen oder Verkäufen eigener Anteile und deren Bilanzierung als Minusposten im Eigenkapital
  - quelle: hwp-bur-2023__rz-0648-s293
    zitat: Bei Veräusserung eigener Kapitalanteile wird der Minusposten im Umfang des entsprechenden Anschaffungswerts vermindert.
  - quelle: hwp-bur-2023__rz-0640-s292
    zitat: ist als Grundsatz der Rechnungslegung stetig anzuwenden und ggf. im Anhang offenzulegen
  - quelle: or__art-959c-t1
    zitat: Erwerb und Veräusserung eigener Anteile und die Bedingungen, zu denen sie erworben oder veräussert wurden
  - quelle: vstg__art-4a-t1
    zitat: so unterliegt die Differenz zwischen dem Erwerbspreis und dem einbezahlten Nennwert dieser Beteiligungsrechte der Verrechnungssteuer
  - quelle: vstg__art-4a-t1
    zitat: wenn die Gesellschaft oder die Genossenschaft diese Beteiligungsrechte nicht innerhalb von sechs Jahren wieder veräussert
- id: P1-307
  vorgehen: 'WP-Schritt: ohne ausdrückliche Anweisung des WP kein Textfeld-Eintrag (Status «nicht bearbeitet – WP-Schritt»; Hinweise nur als Notiz Schlussbesprechung/Pendenz). Mit Anweisung,
    gekennzeichnet als «Vorbereitung für WP»: bei Kapitalerhöhung/-herabsetzung, Kapitalband oder Optionen Urkunden, Statuten, Zeichnungsscheine, Kapitalerhöhungsbericht mit Prüfungsbestätigung
    und HR-Eintrag einsehen; bei Verrechnungsliberierung Forderungsbetrag, Gläubiger und zugeteilte Aktien in GV-Beschluss und Statuten prüfen; Buchungen (Nennwert 2800, Agio in gesetzl.
    Kapitalreserve, Gegenkonten) und Datum mit Belegen, Optionen mit Anhang abgleichen. HR-Anmeldung innert 6 Monaten nach dem GV-Beschluss (sonst ist der Beschluss dahingefallen, Art.
    650 Abs. 3 OR). Belege nach Art. 46 HRegV: Urkunden GV- und VR-Beschluss (652g), angepasste Statuten, Kapitalerhöhungsbericht (652e), bei Verrechnung vorbehaltlose Prüfungsbestätigung
    (652f).'
  nachweise:
  - Öffentliche Urkunden GV/VR
  - Statuten (neue Fassung)
  - Zeichnungsscheine
  - Kapitalerhöhungsbericht mit Prüfungsbestätigung
  - HR-Auszug
  - Kontoblätter 2800, Kapitalreserve, Gegenkonten
  - Options-/Beteiligungspläne
  - HR-Anmeldung mit Datum (Belege nach Art. 46 HRegV)
  rechnen: Ausgabebetrag = Anzahl neue Aktien × Nennwert + Agio; Ausgabebetrag = Bareinzahlung + verrechnete Forderung (+ Sacheinlage); Agio lt. Beschluss = Zugang gesetzliche Kapitalreserve;
    Zugang Konto 2800 = Anzahl neue Aktien × Nennwert
  feststellung_wenn: Buchungen weichen von Urkunde/Bericht ab, Agio nicht in gesetzl. Kapitalreserve, Verrechnungsforderung nicht belegt, Statuten/GV-Beschluss ohne Angaben zur Verrechnungsliberierung,
    HR-Eintrag oder Anhangangabe fehlt, Anmeldung später als 6 Monate nach dem Beschluss oder Prüfungsbestätigung fehlt bzw. mit Vorbehalt.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: 'Bei Änderungen im Grundkapital und Ausgabe von Optionen: kritische Durchsicht'
  - quelle: or__art-650-t1
    zitat: 'bei Liberierung durch Verrechnung mit einer Forderung: den Betrag der zur Verrechnung gebrachten Forderung, den Namen des Gläubigers und die ihm zukommenden Aktien'
  - quelle: or__art-634a
    zitat: Die Statuten müssen den Betrag der zur Verrechnung gebrachten Forderung, den Namen des Aktionärs und die ihm zukommenden Aktien angeben.
  - quelle: or__art-652c
    zitat: Soweit das Gesetz nichts anderes vorschreibt, sind die Einlagen nach den Bestimmungen über die Gründung zu leisten.
  - quelle: or__art-671
    zitat: der Erlös, der bei der Ausgabe von Aktien über den Nennwert und die Ausgabekosten hinaus erzielt wird
  - quelle: hwp-bwp-2024__rz-0081-s223
    zitat: Der Bericht ist durch einen zugelassenen Revisor zu prüfen (Art. 652f OR).
  - quelle: or__art-959c-t2
    zitat: Anzahl und Wert von Beteiligungsrechten oder Optionen auf solche Rechte für alle Leitungs- und Verwaltungsorgane sowie für die Mitarbeitenden
  - quelle: or__art-650-t2
    zitat: Die Kapitalerhöhung muss innerhalb von sechs Monaten nach dem Beschluss der Generalversammlung beim Handelsregisteramt zur Eintragung angemeldet werden; sonst fällt der Beschluss
      dahin.
  - quelle: hregv__art-46-t1
    zitat: Eine ordentliche Erhöhung des Aktienkapitals muss innerhalb von sechs Monaten nach dem Beschluss der Generalversammlung beim Handelsregisteramt zur Eintragung angemeldet werden.
  - quelle: hregv__art-46-t1
    zitat: die öffentliche Urkunde über den Beschluss des Verwaltungsrates (Art. 652g Abs. 2 OR)
  - quelle: hregv__art-46-t1
    zitat: die angepassten Statuten
  - quelle: hregv__art-46-t1
    zitat: der von einem Mitglied des Verwaltungsrates unterzeichnete Kapitalerhöhungsbericht (Art. 652e OR)
  - quelle: hregv__art-46-t1
    zitat: Bestehen Sacheinlagen, Verrechnungstatbestände oder besondere Vorteile
  - quelle: hregv__art-46-t2
    zitat: die vorbehaltslose Prüfungsbestätigung eines staatlich beaufsichtigten Revisionsunternehmens
- id: P1-308
  vorgehen: 'Kennzeichnung «?» – bis Klärung wie WP-Schritt: ohne ausdrückliche Anweisung des WP kein Textfeld-Eintrag (Status «nicht bearbeitet – Kennzeichnung «?» (wie WP)»); bei Kapitalerhöhung/Ausschüttung
    im GJ bzw. Antrag die Durchführung dem WP per Notiz (Schlussbesprechung/Pendenz) vorschlagen (SER: weiter gehende Prüfungshandlung bei Anzeichen wesentlicher Fehlaussagen oder erhöhtem
    inhärentem Risiko). Mit Anweisung, gekennzeichnet als «Vorbereitung für WP»: Steuerfolgen anhand ESTV-Abrechnungen nachvollziehen: Emissionsabgabe (Satz, Freibetrag, Ausnahmen z.B.
    Sanierung), VSt auf Gewinnausschüttungen, KER (separater Ausweis, Meldung/Bestätigung); fehlende Abrechnungen als Pendenz. Würdigung WP.'
  nachweise:
  - Abrechnung Emissionsabgabe/ESTV-Verfügung
  - Abrechnung Verrechnungssteuer
  - KER-Bestätigung/Meldung ESTV (Formular 170)
  - Protokolle GV (Ausgabebetrag, Ausschüttung)
  - Kontoblätter Steueraufwand/-verbindlichkeiten
  rechnen: 'Emissionsabgabe = 1 % × (Mittelzufluss − Freibetrag). Sanierungsfreibetrag (Art. 6 Abs. 1 lit. k StG, KS 32a Ziff. 3.3.2): Leistungen der Anteilsinhaber bis gesamthaft CHF
    10 Mio., nur bei offener Sanierung (Herabsetzung mit Wiedererhöhung bis max. zum ursprünglichen Kapital) oder stiller Sanierung (Zuschüsse, Agio-Einlagen zur Verlustabdeckung) und
    nur, wenn die Sanierungsleistungen mit bestehenden Verlusten verrechnet werden (Beschluss spätestens an der oGV über die Sanierungsperiode). Sonst einmaliger Freibetrag CHF 1 Mio.
    bei Gründung/Kapitalerhöhung (nicht bei Zuschüssen). Verlust vorgetragen statt verrechnet → Freibetrag fraglich (WP). VSt = 35 % × steuerbare Gewinnausschüttung (Art. 13 VStG)'
  feststellung_wenn: Emissionsabgabe oder VSt nicht abgerechnet bzw. nicht abgegrenzt, Freibetrag/Ausnahme nicht belegt oder Ausschüttung aus KER ohne separaten Ausweis bzw. ESTV-Bestätigung
    oder Sanierungsfreibetrag beansprucht, obwohl die Verluste nicht verrechnet sind.
  fundstellen:
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung der korrekten steuerlichen Behandlung von Kapitalerhöhungen (Emissionsabgabe) und -herabsetzungen sowie Gewinnausschüttungen (Verrechnungssteuer)
  - quelle: ser-2022__anh-d-s091-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: treuhand-almanach-2026__s067-1
    zitat: Die Emissionsabgabe beträgt grundsätzlich 1 % vom Wert dessen, was der Gesellschaft zufliesst.
  - quelle: treuhand-almanach-2026__s067-1
    zitat: ein Freibetrag von CHF 1 Mio. (Art. 6 Abs. 1 lit. b und lit. h StG, einmalig, d. h. nicht pro Ereignis)
  - quelle: treuhand-almanach-2026__s067-3
    zitat: Diverse Tatbestände (u. a. im Rahmen von Umstrukturierungen und Sanierungen) sind von der Emissionsabgabe ausgenommen.
  - quelle: vstg__art-13
    zitat: 35 Prozent der steuerbaren Leistung
  - quelle: hwp-bur-2023__rz-0565-s275-t2
    zitat: sind bei Erfüllung der steuerlichen Voraussetzungen (beispielsweise offener Ausweis in der Bilanz) steuerfrei
  - quelle: estv-ks-32a-2025__3-3-2-t1
    zitat: Nach Artikel 6 Absatz 1 Buchstabe k StG ist eine offene oder stille Sanierung von der Emissionsabgabe ausgenommen
  - quelle: estv-ks-32a-2025__3-3-2-t1
    zitat: Als offene Sanierungen gelten Herabsetzungen des Grund- oder Stammkapitals einer Kapitalgesellschaft oder Genossenschaft mit anschliessender (in der Regel gleichzeitiger)
      Wiedererhöhung
  - quelle: estv-ks-32a-2025__3-3-2-t1
    zitat: Als stille Sanierungen gelten Zuschüsse im Sinn von Artikel 5 Absatz 2 Buchstabe a StG sowie Einlagen in das Agio, die zur Abdeckung von Verlusten führen.
  - quelle: estv-ks-32a-2025__3-3-2-t1
    zitat: die Verrechnung der Sanierungsleistungen mit den bestehenden Verlusten ist zwingend
  - quelle: estv-ks-32a-2025__3-3-2-t1
    zitat: Die Verrechnung der Verluste muss spätestens anlässlich der ordentlichen Generalversammlung beschlossen werden, welche die Jahresrechnung für die Periode genehmigt, in welcher
      die Sanierungsleistung erbracht wurde.
  - quelle: estv-ks-32a-2025__3-3-2-t2
    zitat: Bei offenen oder stillen Sanierungen sind die Leistungen der Anteilsinhaber, welche den Betrag von gesamthaft 10 Millionen Franken nicht übersteigen, von der Emissionsabgabe
      ausgenommen.
- id: P1-141
  vorgehen: 'Katalogtext in revio leer (WP-Schritt, Prüfziele RV VO BE DO RI). Agent bearbeitet den Schritt nicht inhaltlich, sondern erfasst eine Pendenz an den WP zur Festlegung des
    Inhalts mit Hinweis: Position zwischen P1-308 und P1-310 und Typ «Detail» deuten auf einen Nummerierungsfehler (vermutlich P1-309). Die SER-Schritte Reservezuweisung (Art. 672 OR)
    und Verlustverrechnung (Art. 674 OR) bearbeitet der Agent unabhängig davon in P1-303; Visum offen.'
  nachweise:
  - revio-Katalog Zeile P1-141
  - Ergebnis P1-303 (Reservezuweisung, Verlustverrechnung)
  rechnen: keine eigene Rechnung; Reservezuweisung (5 % des Jahresgewinns bis 50 % AK, Holding 20 %) und Reihenfolge der Verlustverrechnung nach Art. 674 OR werden in P1-303 gerechnet
  feststellung_wenn: Immer Pendenz an WP (Inhalt festlegen; Hinweis vermutlich P1-309); Feststellungen zu Reservezuweisung/Verlustverrechnung werden in P1-303 erfasst.
  fundstellen:
  - quelle: katalog-revio4__c003-52
    zitat: '| P1 | Eigenkapital | 141 | P1-141 | Detail | WP | RV VO BE DO RI | | |'
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung, ob die gesetzliche Reservezuweisung vorgenommen wurde (sofern erforderlich)
  - quelle: ser-2022__anh-d-s091-1
    zitat: Prüfung, ob ggf. gesetzliche Verlustverrechnung nach Art. 674 OR eingehalten ist
  - quelle: hwp-er-2026__rz-0224-s236
    zitat: ob die von Art. 674 OR vorgegebene Reihenfolge der Verrechnung eingehalten wird
- id: P1-310
  vorgehen: 'EK in der Bilanz mit Mindestgliederung Art. 959a Abs. 2 Ziff. 3 OR vergleichen: AK, gesetzliche Kapitalreserve (unterteilt in KER und übrige), gesetzliche Gewinnreserve
    (Aufwertungsreserve, Reserve eigene Anteile im Konzern gesondert), freiwillige Gewinnreserven, eigene Kapitalanteile und Verlustvortrag/-ergebnis als Minusposten. Kontozuordnung
    29xx gegen Kontenrahmen prüfen (Agio = gesetzliche Kapitalreserve) und dokumentieren.'
  nachweise:
  - Bilanz (Entwurf Jahresrechnung)
  - Saldoliste EK-Konten
  - Kontenplan/Zuordnung
  - GV-Beschluss Kapitalerhöhung (Agio)
  rechnen: Σ EK-Konten Saldoliste = Total Eigenkapital Bilanz; Total Aktiven − Total Fremdkapital = Total Eigenkapital; Saldo Agio-Konto = Agio lt. GV-Beschluss
  feststellung_wenn: Pflichtposition fehlt oder ist zusammengefasst, Agio/KER nicht als gesetzliche Kapitalreserve bzw. auf Konto freiwilliger Reserven, Saldo ≠ Beschluss oder Verlust
    bereits in der Abschlussperiode verrechnet; Kapitaleinlagen nicht gesondert als KER ausgewiesen (steuerlich übrige Reserven, Umqualifikation unzulässig).
  fundstellen:
  - quelle: or__art-959a-t1
    zitat: Grund-, Gesellschafter- oder Stiftungskapital, gegebenenfalls gesondert nach Beteiligungskategorien
  - quelle: or__art-959
    zitat: Das Eigenkapital ist der Rechtsform entsprechend auszuweisen und zu gliedern.
  - quelle: hwp-bur-2023__rz-0572-s277-t2
    zitat: Die gesetzliche Kapitalreserve (unterteilt in steuerliche Kapitaleinlagereserven und übrige Kapitalreserven)
  - quelle: or__art-671
    zitat: der Erlös, der bei der Ausgabe von Aktien über den Nennwert und die Ausgabekosten hinaus erzielt wird
  - quelle: hwp-bur-2023__rz-0572-s277-t2
    zitat: Separat als Teil der gesetzlichen Gewinnreserve auszuweisen sind auch die Reserve für eigene Kapitalanteile im Konzern und die Aufwertungsreserve.
  - quelle: estv-ks-29c-2022__2-2-3-t2
    zitat: Gleiches gilt für offene Kapitaleinlagen, die in der Handelsbilanz nicht gesondert ausgewiesen wurden.
  - quelle: estv-ks-29c-2022__2-2-3-t2
    zitat: Eine Umqualifikation von übrigen Reserven in KER bzw. Ausland-KER ist unzulässig und wird steuerlich nicht anerkannt.
- id: P1-311
  vorgehen: 'Katalogverweis «OR 670» ist überholt; massgebend ist Art. 725c OR. Konten und VR-Beschlüsse auf Aufwertungen von Grundstücken/Beteiligungen durchsehen. Falls vorhanden:
    Zweck (Behebung Kapitalverlust/Überschuldung), Obergrenze wirklicher Wert, schriftliche Bestätigung des Revisors und gesonderter Ausweis unter der gesetzlichen Gewinnreserve prüfen;
    sonst «nicht anwendbar» dokumentieren. Grenzen rechnen: `kapitalverlust … --buchwert … --verkehrswert …`.'
  nachweise:
  - VR-Beschluss Aufwertung
  - Bewertungsnachweis (wirklicher Wert)
  - Bestätigung Revisionsstelle/zugelassener Revisor
  - Bilanz/Kontoblatt Aufwertungsreserve
  rechnen: Aufwertung ≤ wirklicher Wert − Buchwert (Anschaffungs-/Herstellkosten überschreitend höchstens bis wirklicher Wert); Aufwertungsreserve = Σ Aufwertungen − zulässige Auflösungen
  feststellung_wenn: Aufwertung ohne Kapitalverlust/Überschuldung, über dem wirklichen Wert, ohne schriftliche Bestätigung, nicht gesondert ausgewiesen oder unzulässig aufgelöst.
  fundstellen:
  - quelle: or__art-670
    zitat: Aufgehoben durch Ziff. I des BG vom 19. Juni 2020 (Aktienrecht), mit Wirkung seit 1. Jan. 2023
  - quelle: or__art-725c
    zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
  - quelle: or__art-725c
    zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt
  - quelle: hwp-bur-2023__rz-0567-s276
    zitat: Die Aufwertungsreserve (Art. 725c OR) ist ebenfalls Teil der gesetzlichen Gewinnreserve
- id: P1-312
  vorgehen: 'GV-Beschluss über die Verwendung des Bilanzergebnisses des Vorjahres (Protokoll oGV) mit den Buchungen im Prüfjahr abgleichen: Vortrag Jahresergebnis, Reservezuweisungen,
    Verlustverrechnung, Dividende/Rückzahlung inkl. Buchungsdatum (GV-Datum) und Gegenkonten. Abweichung des GV-Beschlusses vom geprüften VR-Antrag festhalten (Prüfung im Folgejahr).
    Ergebnis dokumentieren. Zuordnung: Die ordentliche GV im GJ beschliesst über die Jahresrechnung des Vorjahres – Basis ist das Bilanzergebnis laut geprüfter JR VJ, nicht jenes des
    Vorvorjahres. Alle ao GV-Protokolle und VR-Beschlüsse des GJ ebenfalls lesen (Kapitalmassnahmen → P1-316); Wahl der Revisionsstelle im selben Protokoll → A1-304.'
  nachweise:
  - Protokoll oGV über das Vorjahr
  - Antrag VR Vorjahr
  - Kontoblätter EK-Konten, Dividendenverbindlichkeit, Bank
  rechnen: 'Σ beschlossene Verwendungen = Bilanzgewinn/-verlust VJ; je Position: Buchung im Prüfjahr = Beschlussbetrag'
  feststellung_wenn: Buchung fehlt, weicht vom Beschluss ab, ist vor dem GV-Datum erfasst, oder GV beschloss abweichend vom geprüften Antrag (Gesetzes-/Statutenkonformität ungeprüft).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0572-s277-t1
    zitat: Bildung und Verwendung der gesetzlichen sowie der freiwilligen Reserven sind aufgrund von Generalversammlungsbeschlüssen unter dem betreffenden Datum zu buchen.
  - quelle: hwp-er-2026__rz-0233-s237
    zitat: Die Revisionsstelle wird den Gewinnverwendungsbeschluss erst im Folgejahr prüfen können.
  - quelle: ser-2022__anh-d-s073-2
    zitat: Beschluss über die Verwendung des Bilanzgewinns (umfasst auch einen allfälligen Bilanzverlust)
  - quelle: or__art-699
    zitat: Die ordentliche Generalversammlung findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt.
- id: P1-313
  vorgehen: 'FEHLERFALLEN ZUERST: (1) Σ Rangrücktritte = Summe je Gläubiger von min(Betrag laut gültiger, unterzeichneter Vereinbarung (aktuelle Fassung; auch VJ-Akte/Dauerakte); bestehende
    Forderung = geschuldeter Betrag + aufgelaufene, vom Rangrücktritt erfasste Zinsen laut Kontoblatt per Stichtag), Beispiel `rechne "min(600000, 450000 + 9000)"` – nicht die Anhangangabe;
    ein Darlehenssaldo ohne Vereinbarung zählt nicht; Verzicht oder Umwandlung in EK lässt die Vereinbarung dahinfallen (HWP ER Rz 416) → Summe in `--rangruecktritt` eingeben. (2)
    RR-Reduktion ≠ Darlehensreduktion: das Darlehen bleibt in voller Höhe Fremdkapital – nie Buchungsvorschlag auf das Darlehen; Reduktion während Überschuldung ohne die Voraussetzungen
    (a)–(c) HWP ER Rz 425 → «Wesentliche Feststellungen». (3) Korrekturvorschläge (Wesentliche Feststellungen) aller Prüffelder mit Ergebniswirkung kumulieren und zusätzlich «nach
    Korrekturen» rechnen. Rechnen mit `kapitalverlust --aktiven … --verbindlichkeiten … --aktienkapital … --kapitalreserve … --gewinnreserve … [--reserve-voll …] [--covid-kredit …]
    --rangruecktritt …` (`--verbindlichkeiten` unverändert aus der Bilanz; Kredite nach Art. 3 Covid-19-SBüV und HFMV-20-Darlehen nur über `--covid-kredit`), Ausgabe ins Textfeld; Ablauf:
    `aufgabe kapitalschutz`. Geschütztes EK berechnen, hälftig mit dem EK für OR 725a/725b vergleichen. Bei Überschuldung: Vorliegen/Datum der Zwischenabschlüsse feststellen (Prüfung:
    separater Auftrag PS-CH 290); Rangrücktritte prüfen (schriftlich, zweiseitig, Betrag + Zinsen, Stundung, unwiderruflich, unbefristet, Bonität); Zahlungen, Verrechnungen, Darlehen an
    Rangrücktrittsgläubiger im GJ und nach Stichtag suchen; Sanierungsaussicht, Anhang würdigen; für WP dokumentieren.'
  nachweise:
  - Bilanz/Eigenkapital
  - HR-Auszug (eingetragenes AK/PS-Kapital)
  - Rangrücktrittsvereinbarungen inkl. Änderungen
  - Darlehensverträge der Rangrücktrittsgläubiger
  - Kontoblätter/Bankauszüge GJ und nach Stichtag
  - Zwischenabschlüsse/Sanierungsplan
  - Anhang (Fortführung, Ereignisse nach Stichtag)
  rechnen: 'Geschütztes EK = AK + PS-Kapital + min(gesetzl. Kapitalreserve + gesetzl. Gewinnreserve i.e.S.; 50 % von AK + PS, Holding 20 %) + Aufwertungsreserve + Reserve eigene Anteile im
    Konzern; EK für OR 725a/725b = bilanzielles EK + Kredite nach Art. 3 Covid-19-SBüV + Darlehen nach Art. 21 HFMV 20. Im Rechner nur über `--covid-kredit` eingeben; `--verbindlichkeiten`
    unverändert aus der Bilanz übernehmen (nicht zusätzlich abziehen). Kredite nach Art. 4 SBüV bleiben FK; Kapitalverlust, wenn EK für OR 725a/725b < 50 % geschütztes EK; Überschuldung,
    wenn EK für OR 725a/725b < 0; Σ anrechenbare Rangrücktritte (je Gläubiger min(Betrag laut Vereinbarung; Forderung + aufgelaufene Zinsen)) ≥ Überschuldung + Sicherheitspolster für erwartete
    Verluste (Höhe legt der WP fest; im Rechner `--rr-polster`, Ausgabe «Deckung»); Nach Korrekturen und Deckung, Beispiel: `rechne "ek = -420000; korr = -35000; ek_neu = ek + korr; rr = 380000; rr + ek_neu"` (< 0 = Deckungslücke in dieser Höhe).'
  feststellung_wenn: Kapitalverlust/Überschuldung ohne erfüllte VR-Pflichten oder Rangrücktritte ungenügend/mangelhaft/umgangen; bei Anzeichen offensichtlicher Überschuldung sofort Notiz
    «Wesentliche Feststellung» an WP (Art. 729c OR).
  fundstellen:
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: Zuerst muss das geschützte Eigenkapital berechnet werden
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: das nominelle Aktien- und ein etwaiges nominelles Partizipationskapital
  - quelle: hwp-er-2026__rz-0372-s112
    zitat: dann liegt ein Kapitalverlust im Sinne von Art. 725a Abs. 1 OR vor
  - quelle: covid-sbueg__art-24
    zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
  - quelle: covid-sbueg__art-3
    zitat: ab der Unterzeichnung des Bürgschaftsvertrags für einen Kredit nach Artikel 4 Covid-19-SBüV
  - quelle: qa-or-rechnungslegung-2026__10-t3
    zitat: gilt der verbürgte COVID-19-Kredit im Umfang von CHF 0.5 Mio. nicht als
  - quelle: hwp-er-2026__rz-0373-s113
    zitat: Darlehen oder verbürgte/garantierte Kredite nach der Covid-19-Härtefallverordnung 2020 (Art. 21 HFMV 20).
  - quelle: qa-kapitalverlust-2023__1-1-t1
    zitat: Ja. Die Bestimmungen sind auch unter den (neuen) Art. 725a und 725b OR anwendbar.
  - quelle: or__art-725b-t1
    zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
  - quelle: or__art-725b-t1
    zitat: solange begründete Aussicht besteht, dass die Überschuldung innert angemessener Frist, spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse, behoben werden
      kann
  - quelle: ser-2022__anh-h-s142-1
    zitat: wenn jeder verständige Bilanzleser ohne weitere Abklärungen sofort sieht, dass die Aktiven die Verbindlichkeiten nicht zu decken vermögen
  - quelle: ser-2022__anh-h-s142-1
    zitat: keine oder keine genügenden Rangrücktritte vorhanden sind
  - quelle: ser-2022__anh-h-s143-1
    zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
  - quelle: ser-2022__anh-h-s145-1
    zitat: Prüfung durch Revisionsstelle nach separaten Berufsregeln (PS-CH 290)
  - quelle: hwp-er-2026__rz-0410-s123
    zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
  - quelle: hwp-er-2026__rz-0414-s123
    zitat: Er darf an keine Bedingungen geknüpft sein, die einer zeitlichen Beschränkung oder einer Kündigung vor einer nachhaltigen Beseitigung der Überschuldung gleichzusetzen sind.
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung
  - quelle: hwp-bur-2023__rz-0721-s307
    zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten zwölf Monaten nach Unterzeichnung des Rangrücktritts
  - quelle: ser-2022__9-t2
    zitat: handelt es sich weder um eine eingeschränkte noch um eine ordentliche Revision
  - quelle: ser-2022__9-t2
    zitat: Ergibt sich aus der eingeschränkten Revision eine Überschuldung, so wird diese im Revisionsbericht festgehalten
  - quelle: hwp-er-2026__rz-0459-s134
    zitat: erscheint es geboten, dass der zugelassene Revisor in seinem Bericht einen entsprechenden Zusatz im Sinne der nachstehenden Textbeispiele anbringt
  - quelle: or__art-729c
    zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
  - quelle: hwp-er-2026__rz-0423-s125-t1
    zitat: Er bewirkt auch keine Veränderung der Forderung, ausser, dass sie gestundet und damit einredebelastet wird.
  - quelle: hwp-er-2026__rz-0423-s125-t1
    zitat: Der Rangrücktritt bewirkt auch keine Umwandlung von Fremdkapital in Eigenkapital.
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
  - quelle: hwp-er-2026__rz-0416-s124
    zitat: 'beides führt zum Dahinfallen der Vereinbarung'
  - quelle: hwp-er-2026__rz-0424-s126
    zitat: 'dass er erst dann wieder aufgehoben werden kann, wenn er entweder durch einen anderen in Höhe und Ausgestaltung genügenden Rangrücktritt ersetzt wird'
  - quelle: hwp-er-2026__rz-0421-s125
    zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten 12 Monaten nach Unterzeichnung des Rangrücktritts
  notiz: 'Deckungslücke (Σ anrechenbare RR < Überschuldung) oder Rangrücktritt mangelhaft, getilgt oder ohne die Voraussetzungen reduziert bzw. aufgehoben (Reduktion: (a)–(c) HWP ER Rz 425;
    Aufhebung: Rz 424; zulässig ist Verzicht oder Umwandlung in EK, Rz 416) → «Wesentliche Feststellungen» (kein Buchungsvorschlag auf das Darlehen) + «Schlussbesprechung»; Anzeichen
    offensichtlicher Überschuldung → zusätzlich sofort an den WP (Art. 729c OR). Zwischenabschluss oder Vereinbarung nach Suche in GJ-, VJ- und Dauerakte nicht gefunden → «Pendenz» mit
    durchsuchten Ordnern. Kapitalverlust ohne Sanierungsmassnahmen des VR → «Schlussbesprechung».'
- id: P1-314
  vorgehen: Statutenänderungen des GJ und bis Berichtsdatum (Kapital, Firma, Sitz, Zweck, Kapitalband, Vinkulierung) anhand öffentlicher Urkunden, HR-Auszug und SHAB-Publikation festhalten;
    Beschluss-, HR-Eintrags- und Buchungsdatum vergleichen; bei Verrechnungsliberierung Statutenangabe (Forderung, Aktionär, Aktien) prüfen; geltende Statuten in der Dauerakte ablegen.
    Fehlende Urkunden oder HR-Nachweise als Pendenz.
  nachweise:
  - Öffentliche Urkunden zu Statutenänderungen
  - HR-Auszug/SHAB-Publikation
  - Statuten (neue Fassung)
  rechnen: HR-Anmeldedatum − GV-Beschlussdatum ≤ 6 Monate (`rechne`); Buchungsdatum Kapitalerhöhung ≥ HR-Eintragsdatum
  feststellung_wenn: Statutenänderung ohne Beurkundung oder HR-Eintrag, Statuten ohne Angabe der Verrechnungsliberierung, Abweichung Statuten–HR–Buchhaltung oder Kapitaländerung vor
    HR-Eintrag ohne Erläuterung gebucht oder Anmeldung nach Ablauf von 6 Monaten.
  fundstellen:
  - quelle: or__art-647
    zitat: ist öffentlich zu beurkunden und ins Handelsregister einzutragen
  - quelle: or__art-634a
    zitat: Die Statuten müssen den Betrag der zur Verrechnung gebrachten Forderung, den Namen des Aktionärs und die ihm zukommenden Aktien angeben.
  - quelle: or__art-652c
    zitat: Soweit das Gesetz nichts anderes vorschreibt, sind die Einlagen nach den Bestimmungen über die Gründung zu leisten.
  - quelle: or__art-652h
    zitat: Aktien, die vor der Eintragung der Kapitalerhöhung ins Handelsregister ausgegeben werden, sind nichtig
  - quelle: or__art-936
    zitat: Die Einträge, Statuten und Stiftungsurkunden werden im Internet gebührenfrei zugänglich gemacht.
  - quelle: or__art-650-t2
    zitat: Die Kapitalerhöhung muss innerhalb von sechs Monaten nach dem Beschluss der Generalversammlung beim Handelsregisteramt zur Eintragung angemeldet werden; sonst fällt der Beschluss
      dahin.
  - quelle: hregv__art-46-t1
    zitat: Eine ordentliche Erhöhung des Aktienkapitals muss innerhalb von sechs Monaten nach dem Beschluss der Generalversammlung beim Handelsregisteramt zur Eintragung angemeldet werden.
- id: P1-315
  vorgehen: Im GJ ausgerichtete und nach Stichtag beschlossene Dividenden/Rückzahlungen ermitteln (GV-Protokoll, Bank, Kontoblätter). Brutto/Netto, VSt-Entrichtung oder Meldeverfahren,
    Abrechnung/Zahlung an die ESTV und Verbuchung (Dividendenverbindlichkeit ab GV-Beschluss) nachvollziehen; bei Rückzahlung aus KER separaten Ausweis, ESTV-Bestätigung und Meldung
    (Formular 170) prüfen. VSt fällig 30 Tage nach Fälligkeit der Dividende (Art. 12 Abs. 1, Art. 16 Abs. 1 lit. c VStG); ausstehende Beträge mit Verzugszins. Fehlende Abrechnung als
    Pendenz.
  nachweise:
  - GV-Protokoll (Dividendenbeschluss)
  - Bankbelege Auszahlung
  - Abrechnung bzw. Meldung Verrechnungssteuer ESTV
  - Kontoblätter Dividende/VSt-Verbindlichkeit
  - KER-Nachweis (Bestätigung, Formular 170)
  rechnen: VSt = 35 % × steuerbare Bruttoausschüttung (nicht bei Meldeverfahren bzw. Rückzahlung aus anerkannten KER); Nettoauszahlung = Brutto − VSt; Brutto = Beschluss je Aktie × Anzahl
    berechtigte Aktien; Fälligkeit VSt = Fälligkeit Dividende (i.d.R. GV-Datum) + 30 Tage
  feststellung_wenn: VSt nicht oder falsch abgerechnet, abgeführt bzw. gemeldet, Auszahlung weicht vom GV-Beschluss ab, Dividendenverbindlichkeit vor Beschluss erfasst oder KER-Rückzahlung
    ohne Nachweis/Meldung; KER durch Verrechnung mit Verlusten vermindert, Sanierungseinlage durch Verlustausbuchung vernichtet bzw. Einlage nicht gesondert als KER ausgewiesen (KS 29c
    Ziff. 2.2.3, 3.1, 3.2) → Rückzahlung insoweit nicht VSt-frei (Beurteilung WP).
  fundstellen:
  - quelle: vstg__art-14
    zitat: Die steuerbare Leistung ist bei der Auszahlung, Überweisung, Gutschrift oder Verrechnung ohne Rücksicht auf die Person des Gläubigers um den Steuerbetrag zu kürzen.
  - quelle: vstg__art-13
    zitat: 35 Prozent der steuerbaren Leistung
  - quelle: vstg__art-20
    zitat: ihre Steuerpflicht durch Meldung der steuerbaren Leistung zu erfüllen
  - quelle: vstg__art-20
    zitat: Das Meldeverfahren ist insbesondere bei Dividendenausschüttungen und geldwerten Leistungen im inländischen und grenzüberschreitenden Konzernverhältnis zuzulassen.
  - quelle: hwp-bur-2023__rz-0605-s285
    zitat: auf der Basis des Dividendenbeschlusses der Generalversammlung dann auch die Erfassung einer Dividendenverbindlichkeit
  - quelle: hwp-bur-2023__rz-0599-s283
    zitat: Sofern die Generalversammlung keinen anderweitigen Beschluss fasst, ist die Dividende unmittelbar nach der ordentlichen Generalversammlung fällig.
  - quelle: hwp-bur-2023__rz-0565-s275-t2
    zitat: sind bei Erfüllung der steuerlichen Voraussetzungen (beispielsweise offener Ausweis in der Bilanz) steuerfrei
  - quelle: estv-ks-29c-2022__7-2-5-t5
    zitat: Erfolgen Rückzahlungen von KER bzw. Ausland-KER, sind diese innert 30 Tagen nach der Generalversammlung oder spätestens 30 Tage nach der Rückzahlung mittels Formular 170 unaufgefordert
      zu melden.
  - quelle: vstg__art-5-t3
    zitat: wenn die Reserven aus Kapitaleinlagen von der Kapitalgesellschaft oder Genossenschaft in der Handelsbilanz auf einem gesonderten Konto ausgewiesen werden und die Gesellschaft
      oder Genossenschaft jede Veränderung auf diesem Konto der Eidgenössischen Steuerverwaltung (ESTV) meldet
  - quelle: vstg__art-12
    zitat: entsteht die Steuerforderung im Zeitpunkt, in dem die steuerbare Leistung fällig wird
  - quelle: vstg__art-16
    zitat: 30 Tage nach Entstehung der Steuerforderung (Art. 12)
  - quelle: vstg__art-16
    zitat: Auf Steuerbeträgen, die nach Ablauf der in Absatz 1 geregelten Fälligkeitstermine ausstehen, ist ohne Mahnung ein Verzugszins geschuldet.
  - quelle: estv-ks-29c-2022__2-2-3-t1
    zitat: Verluste, die den KER bzw. den Ausland-KER belastet wurden, vermindern diese definitiv.
  - quelle: estv-ks-29c-2022__2-2-3-t1
    zitat: Soweit Kapitaleinlagen nicht durch die Ausbuchung von handelsrechtlichen Verlustvorträgen vernichtet werden
  - quelle: estv-ks-29c-2022__2-2-3-t2
    zitat: Gleiches gilt für offene Kapitaleinlagen, die in der Handelsbilanz nicht gesondert ausgewiesen wurden.
  - quelle: estv-ks-29c-2022__2-2-3-t2
    zitat: Eine Umqualifikation von übrigen Reserven in KER bzw. Ausland-KER ist unzulässig und wird steuerlich nicht anerkannt.
- id: P1-316
  vorgehen: Alle Buchungen auf EK-Konten (Kontoblätter 28xx/29xx) auflisten und je Buchung Grundlage (GV-/VR-Beschluss, Urkunde, Abrechnung), Beleg, Datum und Gegenkonto prüfen. Direkt
    im EK erfasste Vorgänge auf Zulässigkeit beurteilen (Transaktionen mit Eigentümern, Aufwertung Art. 725c OR); übrige Vorgänge gehören in die Erfolgsrechnung. Liste mit Beurteilung
    im Textfeld dokumentieren (HWP OR nur ergänzend).
  nachweise:
  - Kontoblätter EK-Konten
  - GV-/VR-Protokolle
  - Urkunden/Belege der Buchungen
  rechnen: 'Σ Buchungen je EK-Konto = Saldo 31.12. − Saldo VJ (Abstimmung mit Eigenkapitalspiegel P1-401); Buchungsbetrag = Betrag lt. Beschluss/Urkunde; Kapitalerhöhung im GJ: `rechne
    "anzahl = 1000; nennwert = 100; ausgabepreis = 250; ak_zugang = anzahl * nennwert; agio = anzahl * (ausgabepreis - nennwert); anzahl * ausgabepreis"` → Zugang Aktienkapital = ak_zugang,
    Zugang gesetzliche Kapitalreserve = agio (abzüglich Ausgabekosten), Liberierung laut Bank/Verrechnung = Ausgabebetrag laut GV-Beschluss.'
  feststellung_wenn: Buchung ohne Beschluss oder Beleg, Betrag weicht vom Beschluss ab, falsches Datum oder Gegenkonto, oder erfolgswirksamer Vorgang direkt im Eigenkapital erfasst.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0572-s277-t1
    zitat: Bildung und Verwendung der gesetzlichen sowie der freiwilligen Reserven sind aufgrund von Generalversammlungsbeschlüssen unter dem betreffenden Datum zu buchen.
  - quelle: hwp-bur-2023__rz-0573-s277-t1
    zitat: Leistungen von Aktionären und Aktionärinnen durch Liberierung von Aktienkapital und Agio oder Verkauf eigener Aktien
  - quelle: hwp-bur-2023__rz-0575-s278
    zitat: Alle übrigen Veränderungen der Nettoaktiven sind grundsätzlich durch eine erfolgswirksame Buchung zu erfassen.
  - quelle: hwp-or-2024__rz-0925-s361
    zitat: Abgleich der Buchungen über die Kapitalkonten mit Gegenbuchungen und Belegen
  - quelle: or__art-671
    zitat: der Erlös, der bei der Ausgabe von Aktien über den Nennwert und die Ausgabekosten hinaus erzielt wird
- id: P1-317
  vorgehen: 'Aktienbuch per Stichtag einsehen: Eigentümer/Nutzniesser mit Name und Adresse, Anzahl, Nennwert; Summe mit AK lt. Statuten/HR und Konto 2800 abstimmen; Nachführung von Übertragungen
    und Kapitalerhöhungen (Zeichner) prüfen; Verzeichnis der wirtschaftlich berechtigten Personen nach der für GJ 2025 geltenden Fassung erfragen (Art. 697j OR per 1.10.2026 aufgehoben).
    Fehlendes/nicht nachgeführtes Aktienbuch als Pendenz und Hinweis an WP.'
  nachweise:
  - Aktienbuch
  - Statuten/HR-Auszug
  - Zeichnungsscheine/Übertragungsbelege
  - Verzeichnis wirtschaftlich berechtigte Personen
  rechnen: Σ Aktien im Aktienbuch = Anzahl Aktien lt. Statuten/HR; Σ Nominal Aktienbuch = Saldo Konto 2800
  feststellung_wenn: Aktienbuch fehlt, ist unvollständig oder nicht nachgeführt (z.B. Zeichner einer Kapitalerhöhung fehlen) oder stimmt nicht mit Statuten/HR überein.
  fundstellen:
  - quelle: or__art-686
    zitat: Die Gesellschaft führt über die Namenaktien ein Aktienbuch, in welches die Eigentümer und Nutzniesser mit Namen und Adresse eingetragen werden.
  - quelle: hwp-bur-2023__rz-0560-s273
    zitat: Bei der Aktiengesellschaft mit Namenaktien ist ein Aktienbuch (Art. 686 Abs. 1 OR)
  - quelle: treuhand-almanach-2026__s093-2
    zitat: die Auflösung der Gesellschaft aufgrund eines Organisationsmangels zu verlangen
  - quelle: or__art-697j
    zitat: über die Transparenz juristischer Personen und die Identifikation der wirtschaftlich berechtigten Personen, mit Wirkung seit 1. Okt. 2026
- id: P1-320
  vorgehen: 'Anhang auf eigenkapitalbezogene Angaben durchsehen: eigene Anteile (Anzahl, Erwerb/Veräusserung), Optionen an Organe und Mitarbeitende, Kapitalband-Veränderungen, Einlagen/Sanierungsbeiträge
    der Eigentümer, nicht bestätigte KER, Forderungen/Verbindlichkeiten ggü. Beteiligten und Organen (gesondert), Kapitalverlust/Überschuldung/Rangrücktritte und Ereignisse nach Stichtag.
    Fehlende Angaben im Textfeld und als Feststellung erfassen.'
  nachweise:
  - Anhang (Entwurf Jahresrechnung)
  - Ergebnisse P1-304, P1-305, P1-306, P1-307, P1-313
  rechnen: Anhangangaben (z.B. Anzahl eigene Anteile, Aktionärsforderungen/-darlehen, Rangrücktritte, Kapitalveränderungen) = Werte aus P1-304, P1-305, P1-307, P1-313
  feststellung_wenn: Gesetzlich verlangte Angabe (Art. 959a Abs. 4, 959c OR) fehlt oder widerspricht Bilanz bzw. Ergebnissen der übrigen Prüfschritte.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Durchsicht des Anhangs auf vollständige Offenlegung der aufgrund der Befragungen zutreffenden Positionen gemäss Art. 959c OR
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: or__art-959c-t2
    zitat: alle Kapitalerhöhungen und Kapitalherabsetzungen, die der Verwaltungsrat innerhalb eines Kapitalbands vorgenommen hat
  - quelle: hwp-bur-2023__rz-0573-s277-t1
    zitat: Solche Leistungen von Eigentümern und Eigentümerinnen sollten im Anhang erläutert oder anderweitig ersichtlich offengelegt werden.
  - quelle: hwp-bur-2023__rz-0565-s275-t2
    zitat: Solange die handelsrechtlich ausgewiesenen steuerlichen Kapitaleinlagereserven von der EStV nicht genehmigt sind, ist im Anhang auf diesen Sachverhalt hinzuweisen
- id: P1-321
  vorgehen: 'Dauerakte in M-Files nachführen: gültige Statuten, HR-Auszug, Aktienbuch, Urkunden zu Kapitalveränderungen, Rangrücktrittsvereinbarungen (inkl. Ersatzerklärungen) und KER-Bestätigungen
    neu ablegen bzw. auf Aktualität prüfen. Bestehende Dokumente nicht ändern; überholte in einer Notiz/Pendenz mit Fundort auflisten. Fehlende Dokumente als PBC-Vorschlag (10.10) erfassen.'
  nachweise:
  - Statuten
  - HR-Auszug
  - Aktienbuch
  - Urkunden Kapitalveränderungen
  - Rangrücktrittsvereinbarungen
  rechnen: ''
  feststellung_wenn: Dauerakte ohne gültige Statuten oder HR-Auszug, oder Dokumente zu Kapitalveränderungen bzw. Rangrücktritten des Geschäftsjahres fehlen (Pendenz/PBC).
  fundstellen:
  - quelle: ser-2022__7-3
    zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: fehlende Unterlagen als Vorschlag für die PBC-Liste (10.10)
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Fehlende Unterlagen, ungeklärte Sachverhalte, nicht verfügbare Belege mit Konto, Datum und Betrag
- id: P1-401
  vorgehen: Eigenkapitalspiegel in M-Files suchen; fehlt er, aus Saldoliste und Kontoblättern selbst erstellen und den Kundenspiegel als PBC-Vorschlag (10.10) erfassen. Je EK-Position
    Saldo VJ, Gewinnverwendung VJ, Kapitalerhöhungen/-rückzahlungen, Dividenden/Rückzahlungen Kapitalreserve, eigene Anteile, Jahresergebnis, Saldo 31.12. Spiegel mit Bilanz, GV-Beschlüssen
    und Urkunden abstimmen und als Arbeitspapier ablegen.
  nachweise:
  - Eigenkapitalspiegel (M-Files oder selbst erstellt)
  - Saldoliste
  - Kontoblätter EK-Konten
  - GV-/VR-Protokolle, Urkunden
  rechnen: 'je Position: Saldo VJ + Zugänge − Abgänge = Saldo 31.12. = Bilanz; Σ Positionen = Total EK; Veränderung Total EK = Jahresergebnis + Transaktionen mit Eigentümern (Einlagen
    − Ausschüttungen ± eigene Anteile)'
  feststellung_wenn: Spiegel nicht mit Bilanz/Saldoliste abstimmbar, ungeklärte Bewegung oder Bewegung ohne bzw. abweichend von GV-/VR-Beschluss bzw. Urkunde.
  fundstellen:
  - quelle: katalog-revio4__c003-53
    zitat: 'Eigenkapitalspiegel: Beschaffung einer Aufstellung der Bewegungen auf Eigenkapitalkonten, einschliesslich Kapitalerhöhungen, Kapitalrückzahlungen und Dividenden'
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Anforderung beim Kunden durch den Menschen
  - quelle: hwp-bur-2023__rz-0573-s277-t1
    zitat: Diese Verkettung wird durchbrochen bei Geschäftsvorfällen, die ein Aktivum oder eine Verbindlichkeit verändern und gleichzeitig eine direkte Buchung im Eigenkapital auslösen.
