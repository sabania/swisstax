kurzbeschrieb: 'Eigenkapital (Art. 959a Abs. 2 Ziff. 3 OR). ER: Abstimmung mit Statuten/HR, Aktienbuch, Vorjahr und GV-Protokoll, Antrag Gewinnverwendung (Art. 729a OR), Kapitalschutz
  (Art. 680, 725a/b OR, Rangrücktritte), Kapitalveränderungen, Steuern, Gliederung, Anhang.'
gesetz:
- thema: Mindestgliederung Eigenkapital (Art. 959a Abs. 2 Ziff. 3 OR)
  quelle: or__art-959a-t1
  zitat: Grund-, Gesellschafter- oder Stiftungskapital, gegebenenfalls gesondert nach Beteiligungskategorien
- thema: Eigene Kapitalanteile als Minusposten (Art. 959a Abs. 2 Ziff. 3 lit. e OR)
  quelle: or__art-959a-t1
  zitat: e. eigene Kapitalanteile als Minusposten
- thema: Gesonderter Ausweis Forderungen/Verbindlichkeiten ggü. Beteiligten und Organen (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
- thema: Ausweis und Gliederung nach Rechtsform (Art. 959 Abs. 7 OR)
  quelle: or__art-959
  zitat: Das Eigenkapital ist der Rechtsform entsprechend auszuweisen und zu gliedern.
- thema: 'Gesetzliche Kapitalreserve: Zuweisung Agio (Art. 671 Abs. 1 Ziff. 1 OR)'
  quelle: or__art-671
  zitat: der Erlös, der bei der Ausgabe von Aktien über den Nennwert und die Ausgabekosten hinaus erzielt wird
- thema: Rückzahlung gesetzliche Kapitalreserve nur über Schwelle 50 % AK (Art. 671 Abs. 2 OR)
  quelle: or__art-671
  zitat: wenn die gesetzlichen Kapital- und Gewinnreserven, abzüglich des Betrags allfälliger Verluste, die Hälfte des im Handelsregister eingetragenen Aktienkapitals übersteigen
- thema: 'Holdinggesellschaften: Schwelle 20 % AK für Rückzahlung (Art. 671 Abs. 3 OR)'
  quelle: or__art-671
  zitat: wenn die gesetzlichen Kapital- und Gewinnreserven 20 Prozent des im Handelsregister eingetragenen Aktienkapitals überschreiten
- thema: Schwellenberechnung ohne Reserve eigene Aktien im Konzern und Aufwertungsreserve (Art. 671 Abs. 4 OR)
  quelle: or__art-671
  zitat: die gesetzliche Gewinnreserve für eigene Aktien im Konzern (Art. 659b) und die gesetzliche Gewinnreserve aus Aufwertungen (Art. 725c) nicht berücksichtigt werden
- thema: Gesetzliche Gewinnreserve 5 % (Art. 672 Abs. 1 OR)
  quelle: or__art-672
  zitat: Der gesetzlichen Gewinnreserve sind 5 Prozent des Jahresgewinns zuzuweisen. Liegt ein Verlustvortrag vor, so ist dieser vor der Zuweisung an die Reserve zu beseitigen.
- thema: Äufnung bis 50 % AK, Holding 20 % (Art. 672 Abs. 2 OR)
  quelle: or__art-672
  zitat: Die gesetzliche Gewinnreserve ist zu äufnen, bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte des im Handelsregister eingetragenen Aktienkapitals erreicht.
- thema: Ermittlung/Verwendung gesetzliche Gewinnreserve analog Art. 671 Abs. 2–4 (Art. 672 Abs. 3 OR)
  quelle: or__art-672
  zitat: Für die Ermittlung und Verwendung der gesetzlichen Gewinnreserve gilt Artikel 671 Absätze 2, 3 und 4 entsprechend.
- thema: 'Verlustverrechnung: zwingende Reihenfolge Gewinnvortrag → freiwillige Gewinnreserven → gesetzliche Gewinnreserve → gesetzliche Kapitalreserve (Art. 674 Abs. 1 OR)'
  quelle: or__art-674
  zitat: Verluste müssen in folgender Reihenfolge verrechnet werden mit
- thema: 'Verlustverrechnung: Vortrag anstelle der Verrechnung mit den gesetzlichen Reserven (Art. 674 Abs. 2 OR)'
  quelle: or__art-674
  zitat: Anstelle der Verrechnung mit der gesetzlichen Gewinnreserve oder der gesetzlichen Kapitalreserve dürfen verbleibende Verluste auch teilweise oder ganz auf die neue Jahresrechnung
    vorgetragen werden.
- thema: Dividenden nur aus Bilanzgewinn und Reserven (Art. 675 Abs. 2 OR)
  quelle: or__art-675
  zitat: Dividenden dürfen nur aus dem Bilanzgewinn und aus hierfür gebildeten Reserven ausgerichtet werden.
- thema: Dividenden erst nach den Reservezuweisungen (Art. 675 Abs. 3 OR)
  quelle: or__art-675
  zitat: Dividenden dürfen erst festgesetzt werden, nachdem die Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven erfolgt sind.
- thema: 'Zwischendividende: Prüfung Zwischenabschluss vor GV-Beschluss (Art. 675a Abs. 2 OR)'
  quelle: or__art-675a
  zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
- thema: Verbot der Einlagerückgewähr (Art. 680 Abs. 2 OR)
  quelle: or__art-680
  zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- thema: 'Erwerb eigener Aktien: frei verwendbares EK, 10 %-Grenze (Art. 659 OR)'
  quelle: or__art-659
  zitat: Der Erwerb eigener Aktien ist auf 10 Prozent des im Handelsregister eingetragenen Aktienkapitals beschränkt.
- thema: Eigene Aktien zum Anschaffungswert als Minusposten (Art. 659a Abs. 4 OR)
  quelle: or__art-659a
  zitat: Die Gesellschaft hat in der Bilanz für die eigenen Aktien einen dem Anschaffungswert entsprechenden Betrag als Minusposten des Eigenkapitals darzustellen
- thema: Aktienbuch bei Namenaktien (Art. 686 Abs. 1 OR)
  quelle: or__art-686
  zitat: Die Gesellschaft führt über die Namenaktien ein Aktienbuch, in welches die Eigentümer und Nutzniesser mit Namen und Adresse eingetragen werden.
- thema: 'Statutenänderung: Beurkundung und HR-Eintrag (Art. 647 OR)'
  quelle: or__art-647
  zitat: ist öffentlich zu beurkunden und ins Handelsregister einzutragen
- thema: 'Verrechnungsliberierung: Angaben in den Statuten (Art. 634a Abs. 3 OR)'
  quelle: or__art-634a
  zitat: Die Statuten müssen den Betrag der zur Verrechnung gebrachten Forderung, den Namen des Aktionärs und die ihm zukommenden Aktien angeben.
- thema: 'Kapitalerhöhung: Einlagen nach den Gründungsbestimmungen (Art. 652c OR)'
  quelle: or__art-652c
  zitat: Soweit das Gesetz nichts anderes vorschreibt, sind die Einlagen nach den Bestimmungen über die Gründung zu leisten.
- thema: 'Kapitalerhöhung mit Verrechnungsliberierung: Inhalt GV-Beschluss (Art. 650 Abs. 2 Ziff. 5 OR)'
  quelle: or__art-650-t1
  zitat: 'bei Liberierung durch Verrechnung mit einer Forderung: den Betrag der zur Verrechnung gebrachten Forderung, den Namen des Gläubigers und die ihm zukommenden Aktien'
- thema: 'Kapitalerhöhung: HR-Anmeldung innert 6 Monaten (Art. 650 Abs. 3 OR, Art. 46 HRegV)'
  quelle: or__art-650-t2
  zitat: Die Kapitalerhöhung muss innerhalb von sechs Monaten nach dem Beschluss der Generalversammlung beim Handelsregisteramt zur Eintragung angemeldet werden; sonst fällt der Beschluss
    dahin.
- thema: Prüfungsbestätigung zum Kapitalerhöhungsbericht (Art. 652f OR)
  quelle: or__art-652f
  zitat: Ein zugelassener Revisor prüft den Kapitalerhöhungsbericht und bestätigt schriftlich, dass dieser vollständig und richtig ist.
- thema: Prüfung Antrag über Verwendung des Bilanzgewinns (Art. 729a Abs. 1 Ziff. 2 OR)
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: GV-Kompetenz Rückzahlung gesetzliche Kapitalreserve (Art. 698 Abs. 2 Ziff. 6 OR)
  quelle: or__art-698
  zitat: die Beschlussfassung über die Rückzahlung der gesetzlichen Kapitalreserve
- thema: Kapitalverlust (Art. 725a Abs. 1 OR)
  quelle: or__art-725a
  zitat: die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve nicht mehr decken
- thema: 'Überschuldung: Zwischenabschlüsse bei begründeter Besorgnis (Art. 725b Abs. 1 OR)'
  quelle: or__art-725b-t1
  zitat: so erstellt der Verwaltungsrat unverzüglich je einen Zwischenabschluss zu Fortführungswerten und Veräusserungswerten
- thema: 'Überschuldung: Rangrücktritt als Ausnahme von der Benachrichtigung des Gerichts (Art. 725b Abs. 4 Ziff. 1 OR)'
  quelle: or__art-725b-t1
  zitat: wenn Gesellschaftsgläubiger im Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden
- thema: 'Überschuldung: begründete Sanierungsaussicht innert 90 Tagen als zweite Ausnahme (Art. 725b Abs. 4 Ziff. 2 OR)'
  quelle: or__art-725b-t1
  zitat: solange begründete Aussicht besteht, dass die Überschuldung innert angemessener Frist, spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse, behoben werden
    kann
- thema: Anzeigepflicht der Revisionsstelle (Art. 729c OR)
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: 'Covid-Kredit: Kredite nach Art. 3 Covid-19-SBüV kein Fremdkapital bei Art. 725a/725b OR (Art. 24 Abs. 1 Covid-19-SBüG)'
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- thema: 'Covid-Kredit: Ausschüttungs- und Darlehensverbot (Art. 2 Abs. 2 Covid-19-SBüG)'
  quelle: covid-sbueg__art-2-t1
  zitat: Während der Dauer der Solidarbürgschaft ausgeschlossen sind
- thema: Pflichten der Revisionsstelle bei Verstoss (Art. 23 Abs. 1 Covid-19-SBüG)
  quelle: covid-sbueg__art-23
  zitat: so setzt sie ihr oder ihm eine angemessene Frist zur Herstellung des ordnungsgemässen Zustandes
- thema: Aufwertungsreserve (Art. 725c OR, ersetzt Art. 670 OR)
  quelle: or__art-725c
  zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
- thema: 'Anhang: eigene Anteile (Art. 959c Abs. 2 Ziff. 4 OR)'
  quelle: or__art-959c-t1
  zitat: Anzahl eigener Anteile, die das Unternehmen selbst oder die von ihm kontrollierten Unternehmen (Art. 963) halten
- thema: 'Anhang: Beteiligungsrechte/Optionen für Organe und Mitarbeitende (Art. 959c Abs. 2 Ziff. 11 OR)'
  quelle: or__art-959c-t2
  zitat: Anzahl und Wert von Beteiligungsrechten oder Optionen auf solche Rechte für alle Leitungs- und Verwaltungsorgane sowie für die Mitarbeitenden
- thema: Nichtigkeit GV-Beschlüsse ohne Revisionsbericht (Art. 731 Abs. 3 OR)
  quelle: or__art-731
  zitat: Liegt der erforderliche Revisionsbericht nicht vor, so sind die Beschlüsse zur Genehmigung der Jahresrechnung und der Konzernrechnung sowie zur Verwendung des Bilanzgewinnes
    nichtig.
risiken:
- text: Ausgewiesenes Aktienkapital stimmt nicht mit Statuten, HR-Eintrag oder Aktienbuch überein (Kapitalveränderung nicht, falsch oder vor HR-Eintrag erfasst; nicht einbezahltes Kapital
    nicht aktiviert).
  pruefziele:
  - EX
  - RV
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0561-s273
  zitat: Die Höhe und die Zusammensetzung des Grundkapitals müssen mit den Statuten, der Eintragung im Handelsregister und allenfalls dem Aktienbuch
- text: Reserven und Bilanzergebnis nicht korrekt aus dem Vorjahr vorgetragen bzw. GV-Beschluss (Gewinnverwendung, Verlustverrechnung, Ausschüttung) nicht, falsch oder mit falschem Datum
    gebucht.
  pruefziele:
  - EX
  - RV
  - PA
  - RI
  quelle: hwp-bur-2023__rz-0572-s277-t1
  zitat: Bildung und Verwendung der gesetzlichen sowie der freiwilligen Reserven sind aufgrund von Generalversammlungsbeschlüssen unter dem betreffenden Datum zu buchen.
- text: Kapitalverlust oder Überschuldung nicht erkannt bzw. Pflichten des VR nach Art. 725a/725b OR nicht erfüllt (Massnahmen, Zwischenabschlüsse, ungenügende Rangrücktritte).
  pruefziele:
  - BE
  - RV
  - DO
  quelle: hwp-er-2026__rz-0447-s130
  zitat: Eine Verletzung des Gesetzes liegt erst dann vor, wenn der Verwaltungsrat seine entsprechenden Handlungs- und Anzeigepflichten
- text: Rangrücktritte ungenügend (Betrag inkl. Zinsen), formell mangelhaft (nicht schriftlich/zweiseitig, widerrufen, reduziert, befristet) oder umgangen (Tilgung, Verrechnung, Darlehen
    an den Gläubiger); offensichtliche Überschuldung mit Anzeigepflicht (Art. 729c OR) nicht erkannt.
  pruefziele:
  - BE
  - RV
  - DO
  quelle: ser-2022__anh-h-s142-1
  zitat: keine oder keine genügenden Rangrücktritte vorhanden sind
- text: Antrag über die Verwendung des Bilanzgewinns bzw. Rückzahlung aus gesetzlicher Kapitalreserve verstösst gegen Gesetz/Statuten (Reservezuweisung, Art. 671 Abs. 2–4, Art. 674,
    ausschüttbares EK) oder ist mit der Liquidität bzw. der Fortführung nicht vereinbar.
  pruefziele:
  - RV
  - BE
  - DO
  quelle: hwp-er-2026__rz-0256-s242
  zitat: Ist die Ausschüttung von Dividenden mit der Vermögens- und Liquiditätslage der Gesellschaft nicht zu vereinbaren, ist der Antrag des Verwaltungsrats zur Ablehnung zu empfehlen.
- text: 'Verbotene Einlagerückgewähr: Forderungen mit Darlehenscharakter gegenüber Aktionären/Konzerngesellschaften (auch unter Debitoren oder übrigen Forderungen verbucht) nicht durch
    freies EK gedeckt und nicht drittvergleichskonform; sperrt ausschüttbares EK.'
  pruefziele:
  - BE
  - DO
  - RV
  quelle: hwp-er-2026__rz-0170-s216
  zitat: führt dies zu einer Sperrung von frei verfügbarem Eigenkapital im gesamten Umfang dieser Darlehen
- text: Eigene Kapitalanteile nicht erkannt, nicht als Minusposten zum Anschaffungswert ausgewiesen, Grenzen Art. 659 OR überschritten oder Anhangangaben fehlen.
  pruefziele:
  - EX
  - VO
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0637-s291
  zitat: Eigene Kapitalanteile, die das bilanzierende Unternehmen selbst hält, sind als Minusposten im Eigenkapital auszuweisen
- text: 'Gliederung fehlerhaft: Agio/KER nicht als gesetzliche Kapitalreserve, Aufwertungsreserve nicht gesondert, Verluste bereits in der Abschlussperiode mit Reserven verrechnet.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0572-s277-t1
  zitat: Eine Verrechnung bereits in der Vorperiode wäre eine Verletzung der Mindestgliederungsvorschriften der Bilanz.
- text: Steuerfolgen von Kapitalerhöhung, Zuschüssen und Ausschüttungen (Emissionsabgabe, Verrechnungssteuer, KER) nicht oder falsch abgerechnet bzw. nicht abgegrenzt.
  pruefziele:
  - VO
  - RI
  quelle: treuhand-almanach-2026__s067-1
  zitat: Die Emissionsabgabe beträgt grundsätzlich 1 % vom Wert dessen, was der Gesellschaft zufliesst.
- text: Erfolgswirksame Vorgänge direkt im Eigenkapital gebucht (Umgehung der Erfolgsrechnung) oder EK-Buchungen ohne Beschluss/Beleg.
  pruefziele:
  - EN
  - RI
  - DO
  quelle: hwp-bur-2023__rz-0575-s278
  zitat: Alle übrigen Veränderungen der Nettoaktiven sind grundsätzlich durch eine erfolgswirksame Buchung zu erfassen.
- text: Aktienbuch nicht geführt oder nicht nachgeführt (Übertragungen, Zeichner von Kapitalerhöhungen); Organisationsmangel.
  pruefziele:
  - RV
  - RI
  quelle: treuhand-almanach-2026__s093-2
  zitat: Sofern das Aktienbuch, das Anteilbuch oder das Verzeichnis der wirtschaftlich berechtigten Personen nicht vorschriftsgemäss geführt werden
unterlagen:
- dokument: Gültige Statuten (aktuelle Fassung) und aktueller Handelsregisterauszug
  zweck: Abstimmung Aktienkapital, Statutenänderungen inkl. Statutenangabe zur Verrechnungsliberierung, Dauerakte (P1-301, P1-307, P1-314, P1-321)
  quelle: ser-2022__anh-d-s091-1
  zitat: Abstimmung des Grundkapitals mit den gültigen Statuten oder dem Handelsregisterauszug
- dokument: Protokoll der ordentlichen GV im GJ über die Jahresrechnung des Vorjahres (Genehmigung JR, Verwendung Bilanzergebnis, Wahl Revisionsstelle) sowie Protokolle aller ausserordentlichen
    GV und VR-Beschlüsse/Zirkularbeschlüsse des GJ bis Berichtsdatum
  zweck: Abstimmung Reserven/Bilanzergebnis, Vollzug Gewinnverwendung (P1-302, P1-312)
  quelle: ser-2022__anh-d-s091-1
  zitat: Abstimmung der Reserven und des Bilanzgewinns/-verlusts mit der Jahresrechnung des Vorjahres und dem GV-Protokoll
- dokument: Geprüfte Jahresrechnung und Revisionsbericht des Vorjahres
  zweck: Vortrag der Vorjahresbestände (P1-302)
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres
- dokument: Antrag des VR über die Verwendung des Bilanzgewinns (inkl. allfälliger Antrag auf Rückzahlung aus gesetzlicher Kapitalreserve)
  zweck: Prüfung Antrag nach Art. 729a Abs. 1 Ziff. 2 OR (P1-303)
  quelle: ser-2022__anh-d-s091-1
  zitat: Beurteilung des Antrags über die Verwendung des Bilanzgewinns
- dokument: Aktienbuch per Bilanzstichtag (und ggf. Verzeichnis der wirtschaftlich berechtigten Personen)
  zweck: Führung Aktienbuch, Abstimmung Anzahl/Nominal, Aktionäre als Gegenparteien für P1-305 (P1-317, P1-301, P1-304, P1-305)
  quelle: hwp-bur-2023__rz-0560-s273
  zitat: Bei der Aktiengesellschaft mit Namenaktien ist ein Aktienbuch (Art. 686 Abs. 1 OR)
- dokument: 'Unterlagen zu Kapitalveränderungen: öffentliche Urkunden GV/VR, Zeichnungsscheine, Kapitalerhöhungsbericht mit Prüfungsbestätigung, Einzahlungs-/Verrechnungsnachweis, HR-Eintrag'
  zweck: Kritische Durchsicht Kapitalveränderung, Buchungen (P1-307, P1-314, P1-316)
  quelle: hwp-bwp-2024__rz-0081-s223
  zitat: Der Verwaltungsrat gibt in einem schriftlichen Bericht Rechenschaft über den Bestand und die Verrechenbarkeit der Schuld ab
- dokument: Kontoblätter aller Eigenkapitalkonten; Eigenkapitalspiegel des Kunden (in M-Files suchen, sonst PBC-Vorschlag)
  zweck: Buchungen auf EK-Konti, Eigenkapitalspiegel (P1-316, P1-401)
  quelle: hwp-bur-2023__rz-0572-s277-t1
  zitat: in der Buchhaltung für alle Arten von gesetzlichen und freiwilligen Reserven separate Konten zu führen
- dokument: Aufstellung eigene Kapitalanteile (Anzahl, Anschaffungswert, Käufe/Verkäufe mit Verträgen bzw. Abrechnungen, Bestand bei Tochtergesellschaften)
  zweck: Bestand und Transaktionen eigener Anteile (P1-304, P1-306)
  quelle: ser-2022__anh-d-s097-1
  zitat: Befragung nach Bestand, Erwerb und Veräusserung eigener Anteile durch das Unternehmen selbst
- dokument: Debitoren-/OP-Listen und Kontoblätter aller Forderungskonten (1100 ff., 114x, 119x) mit Gegenparteien
  zweck: Suche nach Forderungen mit Darlehenscharakter ggü. Aktionären/Organen, auch ausserhalb der Aktionärskonten (P1-305, P1-303)
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Als Forderungen ihnen gegenüber gelten hierbei alle direkten (up stream) und indirekten (cross stream) Forderungen mit Darlehenscharakter.
- dokument: Aufstellung Forderungen gegenüber Aktionären, Nahestehenden und Konzerngesellschaften (inkl. Cash-Pool) mit Darlehensverträgen, VR-Genehmigung und Drittvergleichsanalyse
    des VR
  zweck: Einlagerückgewähr Art. 680 Abs. 2 OR (P1-305)
  quelle: hwp-er-2026__rz-0181-s218
  zitat: Die Revisionsstelle nimmt Einsicht in die Analyse, die der Verwaltungsrat oder die Geschäftsleitung erarbeitet hat.
- dokument: Darlehensverträge der Aktionäre an die Gesellschaft (Betrag, Zins, Laufzeit, Kündigung)
  zweck: Abgleich Betrag/Zins mit Rangrücktritten, Verrechnungsmöglichkeit (P1-313, P1-305)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- dokument: Budget/Liquiditätsplanung bis zum Ausschüttungszeitpunkt
  zweck: Liquidität und Fortführung bei beantragter Ausschüttung (P1-303)
  quelle: hwp-er-2026__rz-0256-s242
  zitat: anhand von Budgets, Forecasts und Befragungen beurteilen muss
- dokument: 'Abrechnungen/Korrespondenz ESTV: Emissionsabgabe, Verrechnungssteuer auf Ausschüttungen, Bestätigung bzw. Meldung der Kapitaleinlagereserven (Formular 170)'
  zweck: Steuerliche Behandlung (P1-308, P1-315, P1-320)
  quelle: hwp-bur-2023__rz-0565-s275-t2
  zitat: Solange die handelsrechtlich ausgewiesenen steuerlichen Kapitaleinlagereserven von der EStV nicht genehmigt sind, ist im Anhang auf diesen Sachverhalt hinzuweisen
- dokument: Rangrücktrittsvereinbarungen (schriftlich, beidseitig unterzeichnet, inkl. Änderungen/Ersatzerklärungen), ggf. Zwischenabschlüsse nach Art. 725b OR mit Prüfungsbericht, Sanierungsmassnahmen/-plan
  zweck: Beurteilung Kapitalverlust/Überschuldung und Rangrücktritte (P1-313)
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
- dokument: Bankauszüge und Kontoblätter des GJ und nach Stichtag zu Zahlungen, Verrechnungen und Darlehen an Gläubiger mit Rangrücktritt
  zweck: Einhaltung Tilgungs- und Verrechnungsverbot (P1-313, P1-305)
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung
- dokument: VR-Protokolle des Geschäftsjahres und bis Berichtsdatum (Kapitalband, Aufwertung, Optionen, Ausschüttungen, Darlehen an Aktionäre/Organe)
  zweck: Vollständigkeit Kapitalvorgänge, Nahestehende (P1-305, P1-307, P1-311, P1-314)
  quelle: hwp-er-2026__rz-0161-s212
  zitat: Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
- dokument: 'Bei Zwischendividende: Zwischenabschluss mit Prüfungsbericht der Revisionsstelle bzw. Zustimmung sämtlicher Aktionäre'
  zweck: Zulässigkeit Zwischendividende (P1-303, P1-315)
  quelle: or__art-675a
  zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
- dokument: 'Bei Aufwertung: schriftliche Bestätigung der Revisionsstelle bzw. des zugelassenen Revisors und Bewertungsnachweis'
  zweck: Aufwertungsreserve (P1-311)
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt
- dokument: Beteiligungs-/Optionspläne für Organe und Mitarbeitende
  zweck: Optionen, Anhangangabe (P1-307, P1-320)
  quelle: ser-2022__anh-d-s097-2
  zitat: Befragung nach im Geschäftsjahr an Leitungs- und Verwaltungsorgane oder Mitarbeitende ausgegebenen Beteiligungsrechten oder Optionen
- dokument: Covid-19-Kreditvereinbarung/Bürgschaftsvertrag und Amortisationsplan
  zweck: 'Covid-Kredit (Art. 3 oder 4 Covid-19-SBüV): Ausschüttungs- und Darlehensverbot während der Solidarbürgschaft (P1-303, P1-305), Fremdkapital bei Art. 725a/725b OR (P1-313)'
  quelle: covid-sbueg__art-3
  zitat: Eine Solidarbürgschaft dauert höchstens acht Jahre
bewertung:
- regel: Grundkapital zum Nennwert; nicht einbezahlter Teil gesondert aktivieren und auf Werthaltigkeit beurteilen
  quelle: hwp-bur-2023__rz-0562-s273
  zitat: Das Grundkapital wird zum Nennwert bilanziert.
- regel: Offene Reserven zum Nominalbetrag
  quelle: hwp-bur-2023__rz-0572-s277-t1
  zitat: Die offenen Reserven werden zum Nominalbetrag ausgewiesen.
- regel: Gesetzliche Kapitalreserve unterteilt in steuerliche Kapitaleinlagereserven und übrige Kapitalreserven
  quelle: hwp-bur-2023__rz-0572-s277-t2
  zitat: Die gesetzliche Kapitalreserve (unterteilt in steuerliche Kapitaleinlagereserven und übrige Kapitalreserven)
- regel: Einlagen, Zuschüsse und Sanierungsbeiträge der Eigentümer direkt in die gesetzliche Kapitalreserve, nicht über die Erfolgsrechnung
  quelle: hwp-bur-2023__rz-0573-s277-t1
  zitat: unter Auslassung der Erfolgsrechnung direkt im Eigenkapital (gesetzliche Kapitalreserven, Art. 671 Abs. 1 Ziff. 3 OR) zu erfassen sind
- regel: Verlustverrechnung wird erst mit Abnahme der Jahresrechnung durch die GV ausgelöst und auf dieses Datum gebucht
  quelle: hwp-bur-2023__rz-0572-s277-t1
  zitat: Die Verrechnung wird mit der Abnahme der Jahresrechnung durch die Generalversammlung ausgelöst und ist auf dieses Datum hin zu verbuchen.
- regel: Eigene Kapitalanteile zum Anschaffungswert, keine Folgebewertung
  quelle: hwp-bur-2023__rz-0646-s293
  zitat: Im Anschluss an die erstmalige Erfassung findet keine Wertanpassung (Folgebewertung) statt
- regel: Mehr-/Mindererlös aus eigenen Anteilen erfolgsneutral oder erfolgswirksam, Methode stetig anwenden und ggf. offenlegen
  quelle: hwp-bur-2023__rz-0640-s292
  zitat: ist als Grundsatz der Rechnungslegung stetig anzuwenden und ggf. im Anhang offenzulegen
- regel: Dividendenverbindlichkeit erst auf Basis des GV-Beschlusses erfassen
  quelle: hwp-bur-2023__rz-0605-s285
  zitat: auf der Basis des Dividendenbeschlusses der Generalversammlung dann auch die Erfassung einer Dividendenverbindlichkeit
- regel: Freies EK für Art. 680 Abs. 2 OR = gesamtes EK abzüglich einbezahltes Aktienkapital
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Das freie Eigenkapital entspricht gemäss bundesgerichtlicher Rechtsprechung dem gesamten Eigenkapital abzüglich des einbezahlten Aktienkapitals.
- regel: Stille Reserven (netto, nach latenten Steuern) nur beim freien EK für Art. 680 Abs. 2 OR anrechenbar, nicht beim ausschüttbaren EK
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Bei der Ermittlung des freien Eigenkapitals dürfen stille Reserven (netto, unter Berücksichtigung latenter Steuerfolgen) berücksichtigt werden.
- regel: Operative L+L-Forderungen mit üblichen Zahlungszielen ohne Finanzierungscharakter sind keine Darlehen an Aktionäre
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Konzerninterne Forderungen aus Lieferungen und Leistungen, die aus einem operativen Leistungsaustausch mit üblichen Zahlungszielen entstanden sind
- regel: 'Ausschüttbares EK: gesperrte gesetzliche Reserven, notwendige Reservezuweisung und nicht drittvergleichskonforme Aktionärsforderungen abziehen'
  quelle: hwp-er-2026__rz-0170-s216
  zitat: Abzüglich Aktionärs- bzw. Konzernforderungen, die einem Drittvergleich nicht standhalten
- regel: 'Kapitalverlust: Hälfte des geschützten EK als Bezugsgrösse, Vergleich mit bilanziellem EK'
  quelle: hwp-er-2026__rz-0371-s112
  zitat: Zur Feststellung des Kapitalverlusts ist die Hälfte des geschützten Eigenkapitals als Bezugsgrösse zu nehmen.
- regel: Geschütztes EK umfasst auch ein nominelles Partizipationskapital
  quelle: hwp-er-2026__rz-0370-s112
  zitat: das nominelle Aktien- und ein etwaiges nominelles Partizipationskapital
- regel: Eigene Kapitalanteile vermindern das frei verfügbare, nicht das geschützte Eigenkapital
  quelle: qa-kapitalverlust-2023__1-1-t1
  zitat: Eigene Kapitalanteile vermindern das frei verfügbare Eigenkapital.
- regel: Nur Kredite, die nach Art. 3 Covid-19-SBüV verbürgt wurden, zählen bei Art. 725a/725b OR nicht als Fremdkapital (Art. 24 Covid-19-SBüG). Kredite nach Art. 4 Covid-19-SBüV (Covid-19-Kredit
    Plus) und der unverbürgte Teil bleiben Fremdkapital. Darlehen und Kredite nach Art. 21 HFMV 20 zählen ebenfalls nicht als Fremdkapital (HWP ER Rz 373, Q&A).
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- regel: Darlehen und verbürgte/garantierte Kredite nach Art. 21 HFMV 20 zählen bei Art. 725a/725b OR ebenfalls nicht als Fremdkapital
  quelle: hwp-er-2026__rz-0373-s113
  zitat: Darlehen oder verbürgte/garantierte Kredite nach der Covid-19-Härtefallverordnung 2020 (Art. 21 HFMV 20).
- regel: Covid-19-Kredit- und HFMV-20-Ausnahme gilt auch unter den neuen Art. 725a/725b OR (Q&A)
  quelle: qa-kapitalverlust-2023__1-1-t1
  zitat: Ja. Die Bestimmungen sind auch unter den (neuen) Art. 725a und 725b OR anwendbar.
- regel: 'Offensichtliche Überschuldung (Art. 729c OR): für jeden verständigen Bilanzleser erkennbar, ohne genügende Rangrücktritte und ohne begründete Sanierungsaussicht'
  quelle: ser-2022__anh-h-s142-1
  zitat: wenn jeder verständige Bilanzleser ohne weitere Abklärungen sofort sieht, dass die Aktiven die Verbindlichkeiten nicht zu decken vermögen
- regel: Rangrücktritt nur schriftlich beurteilbar
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
- regel: Rangrücktritt ist zweiseitiges Rechtsgeschäft zwischen Gläubiger und Gesellschaft
  quelle: ser-2022__anh-h-s142-2
  zitat: ist ein zweiseitiges Rechtsgeschäft, das zwischen einem Gläubiger und einem Schuldner über eine bestehende Forderung abgeschlossen wird
- regel: Zinsen müssen ausdrücklich vom Rangrücktritt erfasst sein
  quelle: hwp-er-2026__rz-0412-s123
  zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
- regel: Rangrücktritt unwiderruflich, ohne Befristung oder Kündigung vor nachhaltiger Beseitigung der Überschuldung
  quelle: hwp-er-2026__rz-0414-s123
  zitat: Er darf an keine Bedingungen geknüpft sein, die einer zeitlichen Beschränkung oder einer Kündigung vor einer nachhaltigen Beseitigung der Überschuldung gleichzusetzen sind.
- regel: Während der Überschuldung keine Tilgung und keine Verrechnung der rangrücktrittsbelasteten Forderung (inkl. Zinsen)
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung
- regel: Verzicht oder Umwandlung in EK lässt den Rangrücktritt dahinfallen
  quelle: hwp-er-2026__rz-0416-s124
  zitat: beides führt zum Dahinfallen der Vereinbarung
- regel: Fehlende Bonität des Darlehensgebers kann die Gültigkeit des Rangrücktritts in Frage stellen
  quelle: ser-2022__anh-h-s143-1
  zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
- regel: Höhe des Rangrücktritts mit Sicherheitspolster für erwartete Verluste bemessen
  quelle: hwp-bur-2023__rz-0721-s307
  zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten zwölf Monaten nach Unterzeichnung des Rangrücktritts
- regel: Zwischendividende nur gestützt auf einen vor dem GV-Beschluss geprüften Zwischenabschluss (Ausnahmen Art. 675a Abs. 2 OR)
  quelle: or__art-675a
  zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
- regel: Aufwertungsreserve nur durch Umwandlung, Wertberichtigung oder Veräusserung auflösbar
  quelle: or__art-725c
  zitat: Die Aufwertungsreserve kann nur durch Umwandlung in Aktien- oder Partizipationskapital sowie durch Wertberichtigung oder Veräusserung der aufgewerteten Aktiven aufgelöst werden.
- regel: Verrechnungsliberierung gilt auch bei nicht mehr gedeckter Forderung als Deckung
  quelle: or__art-634a
  zitat: Die Verrechnung mit einer Forderung gilt auch als Deckung, wenn die Forderung nicht mehr durch Aktiven gedeckt ist.
fallstricke:
- text: 'Katalogverweis «OR 670» (P1-311) ist überholt: Art. 670 OR ist seit 1.1.2023 aufgehoben, massgebend ist Art. 725c OR.'
  quelle: or__art-670
  zitat: Aufgehoben durch Ziff. I des BG vom 19. Juni 2020 (Aktienrecht), mit Wirkung seit 1. Jan. 2023
- text: 'Katalogverweis «OR 725» (P1-313): Art. 725 OR betrifft heute die Zahlungsfähigkeit; Kapitalverlust und Überschuldung sind in Art. 725a und 725b OR geregelt.'
  quelle: or__art-725
  zitat: Der Verwaltungsrat überwacht die Zahlungsfähigkeit der Gesellschaft.
- text: Rangrücktritte beseitigen einen Kapitalverlust nicht; sie befreien nur von der Benachrichtigung des Gerichts bei Überschuldung.
  quelle: qa-kapitalverlust-2023__1-2-t3
  zitat: Ein Rangrücktritt an sich beseitigt den Kapitalverlust nicht und stellt auch keine Sanierungsmassnahme nach Art. 725a OR dar.
- text: Kapitalverlust/Überschuldung sind für sich keine Gesetzesverletzung; trotzdem gehört ein Zusatz in den Bericht (Entscheid WP).
  quelle: hwp-er-2026__rz-0447-s130
  zitat: Die Tatbestände eines Kapitalverlusts oder einer Überschuldung i.S.v. Art. 725a bzw. 725b OR sind als solche keine Gesetzesverletzungen
- text: Ausschüttung aus Reserven trotz Bilanzverlust ist möglich, aber der Bilanzverlust ist beim ausschüttbaren EK abzuziehen und Art. 674 OR zu beachten.
  quelle: hwp-er-2026__rz-0225-s236
  zitat: Der Bilanzverlust muss bei der Berechnung des ausschüttbaren Eigenkapitals berücksichtigt werden.
- text: Für die Ausschüttungsfähigkeit zählen nur offene Reserven; stille Reserven nur bei der Frage nach Art. 680 Abs. 2 OR (freies EK).
  quelle: hwp-er-2026__rz-0172-s216
  zitat: Für die Beurteilung, ob eine Ausschüttung vorgenommen werden kann, sind nur die in der Jahresrechnung ausgewiesenen offenen Reserven massgeblich.
- text: Beim freien EK nach Art. 680 Abs. 2 OR ist das einbezahlte, nicht das nominelle Kapital massgebend.
  quelle: hwp-er-2026__rz-0171-s216
  zitat: wird nicht auf das nominelle, sondern auf das einbezahlte Grundkapital abgestellt
- text: Eine Bestätigung nur in der Vollständigkeitserklärung genügt nicht als Nachweis des Drittvergleichs.
  quelle: hwp-er-2026__rz-0182-s218
  zitat: Eine Bestätigung der Gesetzeskonformität durch die Verantwortlichen ausschliesslich in der Vollständigkeitserklärung zur Jahresrechnung kann nicht als ausreichende Dokumentation
    betrachtet werden.
- text: Fehlen Unterlagen zum Drittvergleich, darf die Revisionsstelle davon ausgehen, dass der Drittvergleich nicht gegeben ist (Beurteilung WP).
  quelle: hwp-er-2026__rz-0182-s218
  zitat: darf die Revisionsstelle davon ausgehen, dass dieser nicht gegeben ist
- text: Aktionärsdarlehen sind nicht nur auf Aktionärskonten zu suchen (auch Debitoren/übrige Forderungen). Teilrückzahlung eines Rangrücktritts und Darlehen an Aktionäre sind typische
    Beispiele möglicher Gesetzesverletzungen (Hinweispflicht, Entscheid WP).
  quelle: camponovo-2026-hinweispflichten__s041-1
  zitat: Z.B. Teilrückzahlung Rangrücktritt, Darlehen an Aktionär
- text: Darlehen, Zahlungen oder Verrechnungen der Gesellschaft zugunsten eines Gläubigers mit Rangrücktritt auf mögliche Umgehung des Tilgungs- und Verrechnungsverbots prüfen (Beurteilung
    WP).
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung
- text: Ein während der Überschuldung reduzierter oder ersetzter Rangrücktritt ist auf die verlangte Unwiderruflichkeit zu würdigen (Beurteilung WP).
  quelle: hwp-er-2026__rz-0414-s123
  zitat: Er darf an keine Bedingungen geknüpft sein, die einer zeitlichen Beschränkung oder einer Kündigung vor einer nachhaltigen Beseitigung der Überschuldung gleichzusetzen sind.
- text: Die Prüfung der Zwischenabschlüsse nach Art. 725b OR ist weder eingeschränkte noch ordentliche Revision (PS-CH 290); der Agent stellt nur Vorliegen und Datum fest.
  quelle: ser-2022__9-t2
  zitat: handelt es sich weder um eine eingeschränkte noch um eine ordentliche Revision
- text: Auch ein Antrag ohne Ausschüttung (Vortrag auf neue Rechnung) wird geprüft.
  quelle: hwp-er-2026__rz-0223-s235
  zitat: Sieht der Antrag des Verwaltungsrats über die Verwendung des Bilanzgewinns keine Ausschüttung, sondern einen Vortrag auf neue Rechnung vor, dann unterliegt auch dies der Prüfung
- text: Bei nicht verrechenbarem Bilanzverlust entfällt die Stellungnahme im Bericht nur, wenn keine Antragspflicht nach Art. 674 OR besteht und keine Ausschüttungen aus anderen Reserven
    beantragt werden; bei beantragter Rückzahlung aus Kapitalreserven ist Stellung zu nehmen.
  quelle: hwp-er-2026__rz-0224-s236
  zitat: wenn der Verwaltungsrat keinen Antrag an die Generalversammlung stellen muss (Art. 674 OR) und keine Ausschüttungen aus anderen Reserven beantragt werden
- text: Rückzahlung aus der gesetzlichen Kapitalreserve ist ein formell getrennter GV-Beschluss mit separater Stellungnahme der Revisionsstelle.
  quelle: hwp-er-2026__rz-0254-s242
  zitat: erfolgt formell getrennt von anderen Beschlüssen
- text: Im Revisionsbericht ist der Antrag über die Rückzahlung aus der gesetzlichen Kapitalreserve separat aufzuführen (Entscheid WP).
  quelle: hwp-er-2026__rz-0255-s242
  zitat: auch der «Antrag über die Rückzahlung aus der gesetzlichen Kapitalreserve» separat aufgeführt
- text: Bedeutet die beantragte Ausschüttung einen erheblichen Liquiditätsentzug, ist die Fortführungsfähigkeit zu beurteilen (Hinweis an WP).
  quelle: hwp-er-2026__rz-0222-s235
  zitat: Stellt die beantragte Gewinnverwendung offensichtlich einen erheblichen Liquiditätsentzug dar, beurteilt der Abschlussprüfer die Fortführungsfähigkeit des Unternehmens
- text: 'Zwischendividende: Der Zwischenabschluss wird von der Revisionsstelle nicht nachträglich geprüft; fehlende Voraussetzungen festhalten (Beurteilung WP).'
  quelle: hwp-er-2026__rz-0249-s241
  zitat: Es ist nicht Aufgabe der Revisionsstelle, den Zwischenabschluss im Nachhinein zu prüfen.
- text: 'Emissionsabgabe: Freibetrag CHF 1 Mio. nur einmalig und nicht für reine Zuschüsse; Ausnahmen u.a. bei Sanierungen (Art. 6 StG). Sanierung: bis CHF 10 Mio., nur mit Verlustverrechnung
    (KS 32a Ziff. 3.3.2).'
  quelle: treuhand-almanach-2026__s067-1
  zitat: Bei reinen Zuschüssen kann der Freibetrag nicht in Anspruch genommen werden.
- text: 'Eingeschränkte Revision: keine Drittbestätigungen; der Agent arbeitet mit beim Kunden verfügbaren Unterlagen (HR-Einträge und Statuten sind öffentlich zugänglich).'
  quelle: ser-2022__1-5
  zitat: keine Inventurbeobachtung und Drittbestätigungsanfragen durchgeführt
- text: 'WP-Schritte (P1-306, P1-307, P1-308 «?», P1-141): ohne ausdrückliche Anweisung kein Textfeld, nur Notiz (offener Entscheid consis); Beurteilung und Visum immer beim WP.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: 'Katalog unvollständig: P1-141 ohne Text (Position zwischen P1-308 und P1-310 und Typ deuten auf P1-309), P1-308 mit Kennzeichnung «?» – Inhalt bzw. Zuständigkeit vom WP klären
    lassen (Pendenz).'
  quelle: katalog-revio4__c003-52
  zitat: '| P1 | Eigenkapital | 141 | P1-141 | Detail | WP | RV VO BE DO RI | | |'
- text: 'SER ordnet steuerliche Behandlung (P1-308), Käufe/Verkäufe eigener Anteile, Änderungen im Grundkapital und Art. 680 Abs. 2 OR als weiter gehende Prüfungshandlungen ein: Durchführung
    bei Anzeichen wesentlicher Fehlaussagen oder erhöhtem inhärentem Risiko (Entscheid WP).'
  quelle: ser-2022__anh-d-s091-1
  zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- text: 'Verzeichnis der wirtschaftlich berechtigten Personen: Art. 697j OR ist per 1.10.2026 durch das Transparenzgesetz aufgehoben – für GJ 2025 die damals geltende Fassung beachten.'
  quelle: or__art-697j
  zitat: über die Transparenz juristischer Personen und die Identifikation der wirtschaftlich berechtigten Personen, mit Wirkung seit 1. Okt. 2026
- text: Ohne Revisionsbericht gefasste GV-Beschlüsse zu Jahresrechnung und Gewinnverwendung sind nichtig – bei P1-302/P1-312 Datum Revisionsbericht Vorjahr vs. GV-Datum beachten.
  quelle: or__art-731
  zitat: Liegt der erforderliche Revisionsbericht nicht vor, so sind die Beschlüsse zur Genehmigung der Jahresrechnung und der Konzernrechnung sowie zur Verwendung des Bilanzgewinnes
    nichtig.
- text: 'Fehlerfalle P1-313: Reduktion oder Aufhebung eines Rangrücktritts ist keine Rückzahlung – das Darlehen bleibt in voller Höhe Fremdkapital (`--verbindlichkeiten` unverändert),
    kein Buchungsvorschlag auf das Darlehen. Zu prüfen ist, ob die Σ der Rangrücktritte die Überschuldung noch deckt und ob die Voraussetzungen der Reduktion (HWP ER Rz 425) erfüllt
    sind.'
  quelle: hwp-er-2026__rz-0423-s125-t1
  zitat: Er bewirkt auch keine Veränderung der Forderung, ausser, dass sie gestundet und damit einredebelastet wird.
- text: 'P1-313: Anrechenbarer Rangrücktritt je Gläubiger = min(Betrag laut gültiger, unterzeichneter Vereinbarung (aktuelle Fassung, auch aus VJ-Akte/Dauerakte); bestehende Forderung inkl.
    aufgelaufener, vom Rangrücktritt erfasster Zinsen laut Kontoblatt) – nicht die Anhangangabe; ein Kontosaldo ohne Vereinbarung zählt nicht, der Teil eines Vereinbarungsbetrags über der
    bestehenden Forderung (z.B. nach Verzicht oder Umwandlung in EK) ebenfalls nicht; die Anhangangabe damit abgleichen (P1-320).'
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
  fundstellen:
  - quelle: or__art-725b-t1
    zitat: 'sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst'
  - quelle: hwp-er-2026__rz-0416-s124
    zitat: 'beides führt zum Dahinfallen der Vereinbarung'
fragen_kunde:
- frage: Wurden im Geschäftsjahr oder seit dem Bilanzstichtag die Statuten geändert oder Kapitalerhöhungen/-herabsetzungen (auch innerhalb eines Kapitalbands) beschlossen bzw. im Handelsregister
    eingetragen? Bitte Urkunden und HR-Auszug einreichen.
  zweck: P1-301, P1-307, P1-314
- frage: Hält die Gesellschaft oder eine von ihr kontrollierte Gesellschaft eigene Aktien, und wurden im Geschäftsjahr eigene Aktien erworben oder veräussert (Anzahl, Preis, Bedingungen)?
  zweck: P1-304, P1-306, P1-320
- frage: Bestehen Darlehen oder andere Forderungen gegenüber Aktionären, Organen, Nahestehenden oder Konzerngesellschaften (inkl. Cash-Pool, auch unter Debitoren oder übrigen Forderungen
    verbucht)? Liegt eine dokumentierte Beurteilung des Drittvergleichs durch den VR vor?
  zweck: P1-305 Einlagerückgewähr, ausschüttbares Eigenkapital (P1-303)
- frage: Ist das Aktienbuch vollständig nachgeführt (alle Übertragungen, Zeichner von Kapitalerhöhungen) und wird das Verzeichnis der wirtschaftlich berechtigten Personen nach der für
    das Geschäftsjahr geltenden Fassung geführt?
  zweck: P1-317
- frage: Wurden im Geschäftsjahr oder nach dem Bilanzstichtag Dividenden, Zwischendividenden oder Rückzahlungen aus Kapitalreserven beschlossen bzw. ausbezahlt? Wie wurden Verrechnungssteuer
    bzw. Kapitaleinlagereserven gegenüber der ESTV abgerechnet bzw. gemeldet (Formular 170)?
  zweck: P1-312, P1-315, P1-308
- frage: Wurde die Emissionsabgabe auf Kapitalerhöhungen oder Zuschüssen abgerechnet oder eine Ausnahme bzw. der Freibetrag beansprucht? Bitte Abrechnung/Verfügung der ESTV einreichen.
  zweck: P1-308
- frage: Bestehen statutarische Bestimmungen zur Gewinnverwendung oder Reservenbildung, und reicht die Liquidität im Zeitpunkt der beantragten Ausschüttung (Budget/Liquiditätsplanung)?
  zweck: P1-303
- frage: Welche Massnahmen hat der VR bei Kapitalverlust bzw. Überschuldung ergriffen (Sanierung, Zwischenabschlüsse, Rangrücktritte inkl. Zinsen, Stundung)? Gelten die Rangrücktritte
    unverändert und wurden darunter fallende Forderungen getilgt oder verrechnet?
  zweck: P1-313
- frage: Hat die Gesellschaft im Geschäftsjahr oder nach dem Stichtag Gläubigern mit Rangrücktritt Darlehen gewährt, Zahlungen geleistet oder Forderungen verrechnet? Wurden Rangrücktritte
    geändert, reduziert oder ersetzt?
  zweck: P1-313, P1-305 (Tilgungsverbot, Unwiderruflichkeit)
- frage: Wurden Optionen oder Beteiligungsrechte an Verwaltungsrat, Geschäftsleitung oder Mitarbeitende ausgegeben?
  zweck: P1-307, P1-320
- frage: Wurden Grundstücke oder Beteiligungen zur Behebung eines Kapitalverlusts oder einer Überschuldung aufgewertet?
  zweck: P1-311
- frage: Besteht oder bestand im GJ bzw. bis zur GV ein nach Covid-19-SBüV verbürgter Kredit (Art. 3 oder Art. 4)? Betrag, Kreditvereinbarung bzw. Bürgschaftsvertrag und Amortisationsplan
    einreichen.
  zweck: P1-303, P1-305, P1-313
