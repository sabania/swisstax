fragen_kunde:
- frage: Welches sind die Gründe für die wesentlichen Veränderungen der Konten Finanzaufwand und Finanzertrag gegenüber dem Vorjahr (Zinsaufwand, Bankkommissionen/Garantien, Kursdifferenzen,
    Erträge Finanzanlagen)?
  zweck: 'SCH4-101/201: Erklärung von Abweichungen (VO, PA)'
- frage: Welche verzinslichen Kredite und Darlehen (Bank, Aktionäre, Nahestehende) bestanden im Geschäftsjahr, zu welchen Zinssätzen, Zinsusanzen und Zinsterminen, und sind die bis 31.12.
    aufgelaufenen Zinsen vollständig verbucht bzw. abgegrenzt?
  zweck: 'SCH4-202: Erwartungswert Zinsaufwand, Periodenabgrenzung'
- frage: Hat die Gesellschaft Darlehen an Aktionäre, Organe oder Nahestehende gewährt? Wie sind sie verzinst, werden die Zinsen vereinbarungsgemäss bezahlt (oder kapitalisiert bzw. erst
    mit Rückzahlung fällig) und wie wird der Zins per Stichtag erfasst bzw. abgegrenzt?
  zweck: 'SCH4-202: Vollständigkeit/Abgrenzung Zinsertrag, vGA-Risiko (SER Anhang D lit. d; HWP ER Rz 177)'
- frage: Wie wurden die Zinssätze für Darlehen von bzw. an Beteiligte festgelegt (Marktkonditionen, Bonität, Sicherheiten, Vergleichsofferten) und liegen sie innerhalb der steuerlich
    anerkannten ESTV-Sätze des Geschäftsjahres?
  zweck: 'SCH4-202/302: Drittvergleich (HWP ER Rz 176); ESTV-Abgleich nur steuerlicher Hinweis; vGA-Beurteilung durch WP'
- frage: Bestehen Rangrücktritte mit Zinsverzicht oder Zinsstundung während der Überschuldung, und wie wurden die betroffenen Zinsen verbucht?
  zweck: 'SCH4-202: Erwartungswert Zinsaufwand unter Rangrücktritt, Ausweis Zinsverbindlichkeiten'
- frage: In welchen Fremdwährungen bestehen Bankkonten, Forderungen und Verbindlichkeiten bzw. wesentliche Einkäufe/Verkäufe, welche Stichtagskurse wurden verwendet und wo werden Kursdifferenzen
    aus dem operativen Geschäft verbucht?
  zweck: 'SCH4-203: Plausibilisierung FX-Differenzen mit Geschäftsmodell, Zuordnung'
- frage: Bestehen Kurs- oder Zinsabsicherungsgeschäfte (z.B. Devisentermingeschäfte, Zinsswaps) oder Finanzanlagen mit Börsenkurs?
  zweck: 'SCH4-203: Vollständigkeit und Ausweis Finanzerfolg'
- frage: Welchen Inhalt haben ungewöhnliche Positionen im Finanzerfolg (z.B. Weiterverrechnungen, Garantiekommissionen, Ertragskonten innerhalb des Finanzaufwands, Sammel- oder Jahresendbuchungen)
    und weshalb werden sie dort ausgewiesen?
  zweck: 'SCH4-201/302: Hintergrund ungewöhnlicher Posten, Zuordnung und Verrechnung (DO)'
