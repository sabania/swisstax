schritte:
- id: SCH4-101
  vorgehen: 'Katalogtext stammt aus SER Anhang D lit. t (lit. s hat keinen Abschnitt Befragungen; die Befragung zu Abweichungen ist dort Teil der Analytik, SCH4-201). Agent befragt nicht
    selbst: aus der Saldoliste ER (GJ/VJ) Finanzkonten mit wesentlichen Abweichungen ggü. Vorjahr oder Erwartung ermitteln und je Konto eine konkrete Frage als Pendenz formulieren. Liegt
    eine schriftliche Antwort vor, kritisch mit Verträgen und Kontoblättern abgleichen und im Textfeld dokumentieren; Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Saldoliste Erfolgsrechnung laufendes Jahr und Vorjahr
  - schriftliche Antwort der Unternehmensleitung (Kundenbefragung)
  - Darlehens-/Kreditverträge zur Plausibilisierung der Antwort
  rechnen: Abweichung je Finanzkonto = Saldo GJ − Saldo VJ; Abweichung % = Abweichung / |Saldo VJ|; Liste der Konten mit |Abweichung| > festgelegter Schwelle
  feststellung_wenn: Wesentliche Abweichung ohne plausible schriftliche Erklärung oder Erklärung widerspricht Verträgen/Kontoblättern (z.B. Darlehenszunahme, aber sinkender Zinsaufwand).
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
  - quelle: hwp-er-2026__rz-0103-s197
    zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
- id: SCH4-201
  vorgehen: Alle Finanzkonten aus der Saldoliste ER GJ/VJ gegenüberstellen (Rechenmodul). Jedes Konto nach seiner Natur als Aufwand oder Ertrag klassieren, unabhängig von der JR-Gruppierung,
    und die Bruttosummen mit den JR-Positionen Finanzaufwand/-ertrag abstimmen. Wesentliche Veränderungen gegen die Toleranzwesentlichkeit beurteilen, Ursachen aus Bilanz und Kontoblättern
    herleiten; offene Gründe in der Pendenz aus SCH4-101 ergänzen, keine zweite Pendenz; nur wenn SCH4-101 nicht bearbeitet ist, eigene Pendenz. Ergebnis im Textfeld.
  nachweise:
  - Saldoliste ER und Bilanz GJ/VJ
  - Jahresrechnung mit Vorjahreszahlen
  - Kontoblätter Bank-, Darlehens- und Zinsverbindlichkeitskonten
  rechnen: Δ je Konto = GJ − VJ; Δ% = Δ / |VJ|; Klassierung je Konto nach Natur (Aufwand/Ertrag), unabhängig von der JR-Gruppierung; Σ Aufwandskonten = Position Finanzaufwand JR und
    Σ Ertragskonten = Position Finanzertrag JR (GJ und VJ); Ertragskonto innerhalb Finanzaufwand (oder Aufwandskonto im Finanzertrag) = Verrechnung, ausser Kursgewinne/-verluste derselben
    Währung → Feststellungskandidat
  feststellung_wenn: Veränderung über Schwelle ohne plausible Erklärung, Kontosummen ≠ JR-Positionen oder Ertragskonto im Finanzaufwand bzw. Aufwandskonto im Finanzertrag (Verrechnung;
    ausser Kursdifferenzen gleicher Währung).
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: ser-2022__6-1-2-t3
    zitat: Analytische Prüfungshandlungen liefern bei der Prüfung der Erfolgsrechnung wertvolle Prüfungsnachweise.
  - quelle: ser-2022__6-1-2-t1
    zitat: vergleichbaren Informationen über Vorperioden
  - quelle: or__art-958c
    zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
  - quelle: hwp-bur-2023__rz-0787-s327
    zitat: Unter dem Finanzergebnis sind der Finanzertrag sowie der Finanzaufwand je gesondert auszuweisen und dürfen nicht miteinander verrechnet werden
  - quelle: hwp-bur-2023__rz-0091-s078
    zitat: innerhalb der gleichen Währung Kursgewinne und -verluste ohne Weiteres verrechnet werden können
- id: SCH4-202
  vorgehen: Aufstellung der verzinslichen Aktiven und Passiven (Bankkredite, Festvorschüsse, Aktionärsdarlehen, Darlehen an Aktionäre, Bankguthaben) mit Bestand, Datum, Vertragszins
    und Zinsfälligkeit erstellen. Erwarteten Zins zeitanteilig berechnen, mit gebuchten Zinsen inkl. Abgrenzungen vergleichen. Zinssätze mit Beteiligten nach Drittvergleich würdigen;
    ESTV-Satz des Zinsjahres mit `wert zins 2025` bzw. `wert zinssatz darlehen` / `wert betriebskredit` holen (Regeln unter Rechnen); nur steuerlicher Hinweis an WP. Ergebnis im Textfeld.
  nachweise:
  - Kredit- und Darlehensverträge (inkl. Darlehen an Aktionäre)
  - Bankunterlagen/Bankbestätigungen mit Zinssätzen und Zinsabrechnungen
  - Kontoblätter Darlehen und Zinsverbindlichkeiten
  - Zinsabgrenzungsberechnung
  - Rangrücktrittserklärungen (Zinsverzicht/Stundung)
  - Unterlagen zum Drittvergleich (Marktkonditionen, Bonität, Sicherheiten)
  - 'ESTV-Sätze des Zinsjahres: `wert zins 2025` (GJ 2025, Sekundärquelle) bzw. `wert zinssatz darlehen` / `wert betriebskredit` (2026); RS 2-218 nur CHF'
  rechnen: 'Erwarteter Zins je Darlehen = Kapital × Zinssatz × Laufzeit im GJ (Zinsusanz gemäss Vertrag bzw. Bankabrechnung) oder Ø-Bestand ((Anfangs- + Endbestand)/2) × Ø-Zinssatz;
    Rangrücktritt = Stundung samt Zinsforderungen (Art. 725b Abs. 4 Ziff. 1 OR): Zins weiter im Erwartungswert und abgrenzen; «Verzicht auf Zins- und Rückzahlungen» während der Überschuldung
    betrifft die Zahlung, nicht die Zinsforderung; Erwartung 0 nur bei ausdrücklichem Erlass der Zinsforderung; Klausel unklar → Zins rechnen und Pendenz an WP; Zins fällig nach Stichtag
    (z.B. mit Rückzahlung) → Abgrenzung erwartet; Differenz = gebuchter Zinsaufwand bzw. -ertrag − Σ Erwartungswerte; |Differenz| vs. tolerierbare Abweichung; ESTV-Hinweis (nur steuerlich,
    keine Feststellung): Darlehen AN Beteiligte – hat die Gesellschaft verzinsliches Fremdkapital: im Umfang dieser Verpflichtungen Mindestzins = Selbstkosten (eigener Fremdkapitalzins
    inkl. Gebühren) + Zuschlag (½ % bis und mit CHF 10 Mio., ¼ % darüber), mindestens Tabellensatz; sonst Tabellensatz «aus Eigenkapital finanziert». Darlehen VON Beteiligten – Limite
    = Σ Kredite aller Beteiligten und Nahestehenden (nicht je Darlehen); Spalte nach Unternehmensart (Handel/Fabrikation bzw. Holding/Vermögensverwaltung); Liegenschaftskredite gesondert.
    Σ > CHF 1 Mio.: Satz «ab CHF 1 Mio.» und Mischsatz ((1 Mio. × Satz «bis» + (Σ − 1 Mio.) × Satz «ab») / Σ) mit `rechne`; die Quelle regelt nicht, ob gestaffelt oder für den ganzen
    Kredit → Vertragszins über Satz «ab» = Hinweis an WP mit beiden Werten. Zinsdifferenz = Kapital × (Vertragszins − ESTV-Satz) × Laufzeit im GJ (Zinsusanz wie Vertrag) → Hinweis an
    WP.'
  feststellung_wenn: Differenz > tolerierbare Abweichung, fehlende Zinsabgrenzung oder fehlender Zinsertrag. Zins ggü. Beteiligten ausserhalb ESTV-Sätze des GJ oder ohne Drittvergleich
    → Hinweis an WP (vGA-Indiz), keine eigene Feststellung.
