- id: SCH4-203
  vorgehen: 'FW-Bestände und -Geschäfte (FW-Bankkonten, FW-Debitoren/-Kreditoren, Einkäufe in FW) und Geschäftsmodell erfassen. Kursentwicklung im GJ mit Beständen vergleichen, gebuchte
    Kursgewinne/-verluste plausibilisieren, Stichtagskurse mit Bankunterlagen abgleichen. Zuordnung (Finanzerfolg vs. betrieblich) und Anhang beurteilen: Grundsätze, wesentliche Kursdifferenzen;
    Umrechnungskurse nur bei Rechnungslegung in FW. Ergebnis im Textfeld.'
  nachweise:
  - Kontoauszüge Fremdwährungskonten Dezember mit Devisenkurs
  - Kursbewertungsbuchungen/-berechnung
  - Bankbestätigung bzw. Bankunterlagen mit Jahresendkurs
  - Saldoliste FW-Konten GJ/VJ
  - Anhang der Jahresrechnung (Grundsätze, Kursdifferenzen)
  rechnen: Erwartete Bewertungsdifferenz je FW-Konto = FW-Saldo × (Stichtagskurs − Buchkurs); Σ erwartete Differenzen vs. (Kursgewinne − Kursverluste) gebucht; Kursdifferenz Buchhaltung
    vs. Bank = Kurs_Buchhaltung − Kurs_Bank; Kursgewinne nur auf Sichtguthaben/kurzfristigen Posten (Laufzeit < 12 Mt. bei Ersterfassung), nicht auf langfristigen Posten
  feststellung_wenn: Kurs weicht vom Jahresendkurs der Bank ab, Kursdifferenzen passen nicht zu Bestand/Kursentwicklung, unrealisierte Kursgewinne auf langfristigen Posten erfasst oder
    wesentliche Kursdifferenzen nicht offengelegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich und Plausibilisierung der Fremdwährungsdifferenzen mit dem Geschäftsmodell und den Entwicklungen der entsprechenden Fremdwährungen
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0092-s078
    zitat: Kursdifferenzen auf Geschäftsvorfällen, die nicht zum normalen Geschäftszweck gehören, sind als Teil des Finanzaufwands oder -ertrags auszuweisen.
  - quelle: hwp-bur-2023__rz-0090-s077-t2
    zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
  - quelle: hwp-bur-2023__rz-0091-s078
    zitat: Eine Offenlegung der Kursgewinne und -verluste im Anhang ist bei wesentlichen Beträgen vorzunehmen.
  - quelle: or__art-959c-t1
    zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
  - quelle: ser-2022__anh-e-s112-2
    zitat: sofern die Rechnungslegung nicht in der Landeswährung erfolgt (Art. 958d Abs. 3 OR)
- id: SCH4-301
  vorgehen: 'WP-Schritt: nur mit ausdrücklicher Anweisung des WP. Zeigen SCH4-201 bis -203 eine wesentliche Fehlaussage oder ein erhöhtes Risiko: als Notiz «Pendenz» an den WP melden,
    nicht selbst beginnen. Mit Anweisung (Textfeld als «Vorbereitung für WP»): wesentliche Buchungen in bewusster Auswahl (Betrag/Risiko), ohne repräsentative Stichprobenverfahren, mit
    Belegen in M-Files nach Betrag, Periode, Gegenpartei, Konto abstimmen; fehlende Belege als PBC-Pendenz; Visum offen.'
  nachweise:
  - Bank-, Zins- und Kommissionsabrechnungen, Kontoauszüge
  - Darlehens- und Kreditverträge
  - Kursbewertungsberechnung
  - Abgrenzungsbelege (Zinsabgrenzung)
  rechnen: 'Je ausgewählter Buchung: Betrag Beleg = Betrag Buchung; Zinsperiode Beleg im GJ (sonst Abgrenzung); Abdeckungsgrad = Σ abgestimmte Beträge / Kontosaldo'
  feststellung_wenn: Beleg fehlt, Betrag/Periode/Konto weicht ab, Zinsperiode ausserhalb GJ ohne Abgrenzung oder Aufwand/Ertrag betrifft nicht die Gesellschaft.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und geeigneten Unterlagen
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
