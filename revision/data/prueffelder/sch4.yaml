  bezug: 'Darlehen der Gesellschaft an Aktionär mit Zinsklausel: erwarteter Zinsertrag/Abgrenzung SCH4-202, Abgleich ESTV-Mindestsatz'
schritte:
- id: SCH4-101
  vorgehen: 'Agent befragt nicht selbst: aus der Saldoliste ER (Jahr/Vorjahr) die Finanzkonten mit wesentlichen Abweichungen gegenüber Vorjahr oder Erwartung ermitteln und je Konto eine
    konkrete Frage als Pendenz an die Unternehmensleitung formulieren. Liegt eine schriftliche Antwort vor, diese kritisch mit Verträgen und Kontoblättern abgleichen und im Textfeld
    dokumentieren; Status höchstens «teilweise bearbeitet».'
  nachweise:
  - Saldoliste Erfolgsrechnung laufendes Jahr und Vorjahr
  - schriftliche Antwort der Unternehmensleitung (Kundenbefragung)
  - Darlehens-/Kreditverträge zur Plausibilisierung der Antwort
  rechnen: Abweichung je Finanzkonto = Saldo GJ − Saldo VJ; Abweichung % = Abweichung / |Saldo VJ|; Liste der Konten mit |Abweichung| > festgelegter Schwelle
  feststellung_wenn: Wesentliche Abweichung ohne plausible schriftliche Erklärung oder Erklärung widerspricht Verträgen/Kontoblättern (z.B. Darlehenszunahme, aber sinkender Zinsaufwand).
  fundstellen:
  - quelle: ser-2022__anh-d-s096-1
    zitat: Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden oder gegenüber den Erwartungen
  - quelle: ser-2022__6-1-1-t2
    zitat: Die erhaltenen Antworten sind kritisch zu würdigen.
  - quelle: hwp-er-2026__rz-0103-s197
    zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- id: SCH4-201
  vorgehen: Alle Konten Finanzaufwand und Finanzertrag aus der Saldoliste ER Jahr/Vorjahr gegenüberstellen (Rechenmodul) und Kontosummen mit den Positionen der Jahresrechnung abstimmen.
    Wesentliche Veränderungen gegen die Toleranzwesentlichkeit beurteilen und Ursachen aus Bilanzveränderungen (verzinsliche Positionen, Fremdwährungsbestände) und Kontoblättern herleiten;
    offene Gründe als Frage/Pendenz (vgl. SCH4-101). Ergebnis im Textfeld.
  nachweise:
  - Saldoliste ER und Bilanz GJ/VJ
  - Jahresrechnung mit Vorjahreszahlen
  - Kontoblätter Bank-, Darlehens- und Zinsverbindlichkeitskonten
  rechnen: Δ je Konto = GJ − VJ; Δ% = Δ / |VJ|; Summe Konten Finanzaufwand = Position Finanzaufwand JR und Summe Konten Finanzertrag = Position Finanzertrag JR (GJ und VJ)
  feststellung_wenn: Veränderung über Toleranzwesentlichkeit/Schwelle ohne plausible Erklärung, Kontosummen ≠ Positionen der Jahresrechnung oder Aufwand und Ertrag verrechnet ausgewiesen.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich mit dem Vorjahr und Befragung über die Gründe für wesentliche Abweichungen
  - quelle: ser-2022__6-1-2-t3
    zitat: Analytische Prüfungshandlungen liefern bei der Prüfung der Erfolgsrechnung wertvolle Prüfungsnachweise.
  - quelle: ser-2022__6-1-2-t1
    zitat: vergleichbaren Informationen über Vorperioden
- id: SCH4-202
  vorgehen: Aufstellung der verzinslichen Aktiven und Passiven (Bankkredite, Festvorschüsse, Aktionärsdarlehen, Darlehen an Aktionäre, verzinsliche Bankguthaben) mit Bestand, Auszahlungsdatum
    und Vertragszins erstellen. Erwarteten Zins zeitanteilig berechnen, mit gebuchten Zinsen inkl. Abgrenzungen vergleichen und gegen die tolerierbare Abweichung beurteilen. Zinssätze
    mit Beteiligten mit den ESTV-Sätzen des Geschäftsjahres abgleichen; Ergebnis im Textfeld.
  nachweise:
  - Kredit- und Darlehensverträge
  - Bankunterlagen mit Zinssätzen/Zinsabrechnungen
  - Kontoblätter Darlehen und Zinsverbindlichkeiten
  - Zinsabgrenzungsberechnung
  - ESTV-Rundschreiben Zinssätze des Geschäftsjahres
  rechnen: Erwarteter Zins je Darlehen = Kapital × Zinssatz × Laufzeit im GJ (Tage/360 bzw. Monate/12) oder Ø-Bestand ((Anfangs- + Endbestand)/2) × Ø-Zinssatz; Differenz = gebuchter
    Zinsaufwand bzw. -ertrag − Σ Erwartungswerte; |Differenz| vs. tolerierbare Abweichung
  feststellung_wenn: Differenz Erwartungswert/Buchung > tolerierbare Abweichung, fehlende Zinsabgrenzung per Stichtag, fehlender Zinsertrag auf verzinslichen Forderungen oder Zinssätze
    ggü. Beteiligten ausserhalb ESTV-Sätze.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich des Finanzaufwands und -ertrags mit den erwarteten Werten aufgrund der verzinslichen Aktiven und Passiven
  - quelle: ser-2022__anh-d-s085-1
    zitat: Beurteilung, ob der Zinsaufwand im Verhältnis zu den Darlehenssalden plausibel erscheint
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0111-s199-t2
    zitat: Da die Abweichung zwischen dem Erwartungswert und dem Ausweis der
  - quelle: estv-zinsen-2026__s001-2
    zitat: Für die Bemessung einer angemessenen Verzinsung von Vorschüssen oder Darlehen in Schweizer Franken an Beteiligte
- id: SCH4-203
  vorgehen: Fremdwährungsbestände und -geschäfte (FW-Bankkonten, FW-Debitoren/-Kreditoren, Einkäufe in FW) und Geschäftsmodell erfassen. Kursentwicklung der Währungen im Geschäftsjahr
    mit Beständen vergleichen und gebuchte Kursgewinne/-verluste plausibilisieren; verwendete Stichtagskurse mit Bankunterlagen abgleichen. Zuordnung (Finanzerfolg vs. betriebliche Position)
    und Anhangsangabe beurteilen; Ergebnis im Textfeld.
  nachweise:
  - Kontoauszüge Fremdwährungskonten Dezember mit Devisenkurs
  - Kursbewertungsbuchungen/-berechnung
  - Bankbestätigung bzw. Bankunterlagen mit Jahresendkurs
  - Saldoliste FW-Konten GJ/VJ
  rechnen: Erwartete Bewertungsdifferenz je FW-Konto = FW-Saldo × (Stichtagskurs − Buchkurs); Σ erwartete Differenzen vs. (Kursgewinne − Kursverluste) gebucht; Kursdifferenz Buchhaltung
    vs. Bank = Kurs_Buchhaltung − Kurs_Bank
  feststellung_wenn: Kurs weicht vom Jahresendkurs der Bank ab, Kursdifferenzen passen nicht zu Bestand/Kursentwicklung, unrealisierte Kursgewinne auf langfristigen Posten erfasst oder
    wesentliche Kursdifferenzen nicht offengelegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich und Plausibilisierung der Fremdwährungsdifferenzen mit dem Geschäftsmodell und den Entwicklungen der entsprechenden Fremdwährungen
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0092-s078
    zitat: Kursdifferenzen auf Geschäftsvorfällen, die nicht zum normalen Geschäftszweck gehören, sind als Teil des Finanzaufwands oder -ertrags auszuweisen.
  - quelle: or__art-958d
    zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
- id: SCH4-301
  vorgehen: 'WP-Schritt (weitergehende Prüfung): Agent bereitet nur vor. Wesentliche Buchungen der Finanzkonten (Zinsen, Kommissionen, Spesen, Kursbewertungen, Erträge Finanzanlagen)
    auswählen und mit Belegen in M-Files (Bank-/Zinsabrechnungen, Verträge, Kursbewertungsberechnung) nach Betrag, Periode, Gegenpartei und Konto abstimmen, ohne Stichprobenverfahren.
    Ergebnis im Textfeld; fehlende Belege als PBC-Pendenz; Visum offen.'
  nachweise:
  - Bank-, Zins- und Kommissionsabrechnungen, Kontoauszüge
  - Darlehens- und Kreditverträge
  - Kursbewertungsberechnung
  - Abgrenzungsbelege (Zinsabgrenzung)
  rechnen: 'Je ausgewählter Buchung: Betrag Beleg = Betrag Buchung; Zinsperiode Beleg im GJ (sonst Abgrenzung); Abdeckungsgrad = Σ abgestimmte Beträge / Kontosaldo'
  feststellung_wenn: Beleg fehlt, Betrag/Periode/Konto weicht ab, Zinsperiode ausserhalb GJ ohne Abgrenzung oder Aufwand/Ertrag betrifft nicht die Gesellschaft.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und geeigneten Unterlagen
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0132-s203
    zitat: Die weitergehenden Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- id: SCH4-302
  vorgehen: 'WP-Schritt (weitergehende Prüfung): Kontoblätter der Finanzkonten bzw. Gegenbuchungen auf Bank-, Darlehens- und Zinsverbindlichkeitskonten kritisch durchsehen auf hohe,
    runde, manuelle, periodenfremde oder ungewöhnliche Buchungen (Jahresend-/Sammelbuchungen, Zinsen Nahestehender, Stornos). Auffällige Posten mit Datum, Text, Betrag und Gegenkonto
    auflisten, als Kandidaten für SCH4-301 bzw. Kundenfrage erfassen; Visum offen.'
  nachweise:
  - Kontoblätter Finanzkonten 69xx
  - Kontoblätter Bank-, Darlehens- und Zinsverbindlichkeitskonten
  - Buchungsjournal Dezember
  rechnen: 'Filter: |Buchungsbetrag| ≥ Schwelle (Anteil Toleranzwesentlichkeit) oder Gegenkonto Nahestehende/Darlehen/Abgrenzung oder runder Betrag; Anzahl und Summe auffälliger Posten'
  feststellung_wenn: Ungewöhnliche Buchung ohne nachvollziehbaren Geschäftshintergrund, nicht marktkonforme Zinsen ggü. Nahestehenden oder Hinweis auf periodenfremde/fehlerhafte Erfassung.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Durchsicht der Konten auf hohe oder sonst ungewöhnliche Beträge
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: bestimmte Aufwands- oder Ertragskonten
  - quelle: hwp-er-2026__rz-0163-s212
    zitat: hierbei enthält die Erfolgsrechnung zu hohe Aufwendungen und/oder zu geringe Erträge
