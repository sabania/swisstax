bewertung:
- regel: Finanzertrag und Finanzaufwand je gesondert ausweisen, keine Verrechnung; für Fremdwährungsdifferenzen gelten abweichende Regeln.
  quelle: hwp-bur-2023__rz-0787-s327
  zitat: Abweichende Regelungen gelten für die Verbuchung von Fremdwährungsdifferenzen
- regel: Finanzaufwand umfasst Zinsaufwand für Bank-, Darlehens- und andere Verbindlichkeiten sowie übrige Kapitalkosten (Bankspesen, Kommissionen, Bürgschaftsprovisionen), soweit nicht
    betrieblicher Aufwand.
  quelle: hwp-bur-2023__rz-0791-s328
  zitat: übrige Kapitalkosten (Bankspesen, Kreditvermittlungskommissionen, Bürgschaftsprovisionen u.Ä.)
- regel: Finanzertrag umfasst u.a. Zinsen aus Bankguthaben und Forderungen sowie Zinsen und Dividenden aus Wertpapieren, soweit nicht betrieblicher Ertrag.
  quelle: hwp-bur-2023__rz-0789-s328
  zitat: Zinsen aus Bankguthaben und Forderungen (einschliesslich Verzugszinsen auf Forderungen aus Lieferungen und Leistungen)
- regel: Kursverluste auf Fremdwährungsposten (realisiert und nicht realisiert) im Finanzaufwand; bei klarem Zusammenhang mit betrieblichen Grundgeschäften Ausweis in der entsprechenden
    ER-Position möglich.
  quelle: hwp-bur-2023__rz-0791-s328
  zitat: realisierte und nicht realisierte Kursverluste auf Fremdwährungsposten
- regel: Im Finanzertrag nur realisierte Kursgewinne auf Fremdwährungsposten.
  quelle: hwp-bur-2023__rz-0789-s328
  zitat: realisierte Kursgewinne auf Fremdwährungsposten
- regel: Flüssige Mittel und Bankguthaben/-schulden auf Sicht zum Devisenkurs des Bilanzstichtags; Kursgewinne und -verluste gelten als realisiert.
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Gewinne oder Verluste sind als realisiert zu betrachten.
- regel: 'Langfristige Guthaben und Verpflichtungen in Fremdwährung: Niederstwertprinzip; unrealisierte Kursverluste aufwandswirksam, unrealisierte Kursgewinne nicht in der ER.'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: allfällige noch nicht realisierte Kursverluste sind aufwandswirksam zu erfassen
- regel: Kursgewinne und -verluste innerhalb der gleichen Währung dürfen verrechnet werden; wesentliche Kursdifferenzen im Anhang offenlegen.
  quelle: hwp-bur-2023__rz-0091-s078
  zitat: Eine Offenlegung der Kursgewinne und -verluste im Anhang ist bei wesentlichen Beträgen vorzunehmen.
- regel: Kursdifferenzen aus eindeutig betrieblichen Geschäftsvorfällen können zusammen mit dem Grundgeschäft (z.B. Warenaufwand) erfasst werden.
  quelle: hwp-bur-2023__rz-0093-s078
  zitat: zusammen mit dem Grundgeschäft in der Erfolgsrechnung (beispielsweise als Warenaufwand) erfasst werden sollen
- regel: Wertveränderungen von Finanzanlagen zu Börsenkurs/beobachtbarem Marktpreis und Veränderung der Schwankungsreserve im Finanzertrag bzw. Finanzaufwand.
  quelle: hwp-bur-2023__rz-0788-s327
  zitat: Die Wertveränderungen von Finanzanlagen, welche zum Börsenkurs oder zu anderen beobachtbaren Marktpreisen bewertet werden, sind entweder als Finanzertrag oder Finanzaufwand
    zu erfassen.
- regel: Aufgelaufene, erst im Folgejahr bezahlte Darlehenszinsen als antizipative Passiven abgrenzen; Marchzinsen bei der Beurteilung der Aktiv-/Passivposten erfassen.
  quelle: hwp-bur-2023__rz-0262-s216
  zitat: im Zusammenhang mit der Beurteilung von Aktiv- und Passivposten (beispielsweise Marchzinsen)
- regel: 'ESTV-Praxis: unverzinsliche/ungenügend verzinste Darlehen an Beteiligte sowie übersetzte Zinsen an Beteiligte gelten als geldwerte Leistung (VSt, Gewinnsteuer); massgebend
    sind die Zinssätze des jeweiligen Jahres.'
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- regel: 'ESTV KS 6a: Schuldzinsen auf verdecktem Eigenkapital werden steuerlich zum Gewinn hinzugerechnet (Hinweis für Steuerrückstellung, nicht handelsrechtliche Korrektur).'
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
fallstricke:
- text: Analytik allein kann kompensierende Fehler verdecken (z.B. fehlende Aktionärszinsen und überhöhte Bankzinsen); Abweichungserklärungen sind zu plausibilisieren.
  quelle: ser-2022__6-1-2-t3
  zitat: Zudem besteht das Risiko, dass sich zwei oder mehrere Fehlaussagen teilweise kompensieren können
- text: Bei wesentlichen Posten genügt die Befragung allein nicht; Antworten mit Analytik/Detailprüfung ergänzen.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Kleiner Saldo ≠ kein Risiko: Ein tiefer oder fehlender Zinsertrag/-aufwand kann gerade auf Unvollständigkeit hinweisen (z.B. Zinsertrag 0 trotz verzinslicher Forderung).'
  quelle: hwp-er-2026__rz-0060-s190
  zitat: auch eine im Betrag geringe Position der Jahresrechnung eine wesentliche Fehlaussage bewirken kann
- text: Stille Reserven und deren Veränderung können die Zahlen der Vorjahresanalyse verzerren; Zahlen für die Analytik bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- text: Verrechnungsverbot gilt für Finanzaufwand/-ertrag (z.B. Zinsaufwand mit Weiterverrechnungserträgen), Kursgewinne und -verluste derselben Währung dürfen hingegen verrechnet werden
    – nicht verwechseln.
  quelle: hwp-bur-2023__rz-0091-s078
  zitat: innerhalb der gleichen Währung Kursgewinne und -verluste ohne Weiteres verrechnet werden können
- text: 'ESTV-Zinssätze sind jahresbezogen: Im Wiki liegt nur das Rundschreiben 2026 (ab 1.1.2026) vor; für das Geschäftsjahr 2025 die Sätze 2025 beiziehen, sonst ausdrücklich als «andere
    Periode, nicht bestätigt» kennzeichnen.'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: 'Zinsen auf Darlehen unter Rangrücktritt: Zinsendienst läuft grundsätzlich weiter (Erwartungswert Zinsaufwand nicht auf null setzen), Zinsen müssen aber ebenfalls unter Rangrücktritt
    stehen; Vertragsklauseln zum Zinsverzicht genau lesen.'
  quelle: hwp-bur-2023__rz-0714-s305
  zitat: Der Zinsendienst wird durch den Rangrücktritt nicht unterbrochen
- text: Bankbestätigungen selbst einzuholen ist in SER Anhang D als über die eingeschränkte Revision hinausgehend aufgeführt; vom Kunden vorgelegte Bankunterlagen nutzen, Einholung nur
    auf Anweisung des WP.
  quelle: ser-2022__anh-d-s074-2
  zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
- text: 'Verzinsliche Bankguthaben mit Verrechnungssteuer: Zinsertrag brutto erfassen, VSt als Guthaben (nicht Netto-Zins als Ertrag) – Praxis, ohne Quelle im Wiki.'
- text: Der Agent dokumentiert und schlägt Feststellungen vor; Beurteilung vGA/Korrekturbedarf und Visum bleiben beim Wirtschaftsprüfer.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Visum offen lassen
fragen_kunde:
- frage: Welches sind die Gründe für die wesentlichen Veränderungen der Konten Finanzaufwand und Finanzertrag gegenüber dem Vorjahr (Zinsaufwand, Bankkommissionen/Garantien, Kursdifferenzen,
    Erträge Finanzanlagen)?
  zweck: 'SCH4-101/201: Erklärung von Abweichungen (VO, PA)'
- frage: Welche verzinslichen Kredite und Darlehen (Bank, Aktionäre, Nahestehende) bestanden im Geschäftsjahr, zu welchen Zinssätzen und Zinsterminen, und sind die bis 31.12. aufgelaufenen
    Zinsen vollständig verbucht bzw. abgegrenzt?
  zweck: 'SCH4-202: Erwartungswert Zinsaufwand, Periodenabgrenzung'
- frage: Hat die Gesellschaft Darlehen an Aktionäre, Organe oder Nahestehende gewährt? Wie sind sie verzinst und wie wird der Zins per Stichtag erfasst bzw. abgegrenzt?
  zweck: 'SCH4-202: Vollständigkeit Zinsertrag, vGA-Risiko'
- frage: Wie wurden die Zinssätze für Darlehen von bzw. an Beteiligte festgelegt, und weichen sie von den steuerlich anerkannten Zinssätzen der ESTV ab?
  zweck: 'SCH4-202/302: Marktkonformität, verdeckte Gewinnausschüttung'
- frage: In welchen Fremdwährungen bestehen Bankkonten, Forderungen und Verbindlichkeiten bzw. wesentliche Einkäufe/Verkäufe, welche Stichtagskurse wurden verwendet und wo werden Kursdifferenzen
    aus dem operativen Geschäft verbucht?
  zweck: 'SCH4-203: Plausibilisierung FX-Differenzen mit Geschäftsmodell, Zuordnung'
- frage: Bestehen Kurs- oder Zinsabsicherungsgeschäfte (z.B. Devisentermingeschäfte, Zinsswaps) oder Finanzanlagen mit Börsenkurs?
  zweck: 'SCH4-203: Vollständigkeit und Ausweis Finanzerfolg'
- frage: Welchen Inhalt haben ungewöhnliche Positionen im Finanzerfolg (z.B. Weiterverrechnungen, Garantiekommissionen, Sammel- oder Jahresendbuchungen) und weshalb werden sie dort ausgewiesen?
  zweck: 'SCH4-302: Hintergrund ungewöhnlicher Posten, Zuordnung (DO)'
