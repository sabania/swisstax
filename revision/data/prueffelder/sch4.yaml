bewertung:
- regel: Finanzertrag und Finanzaufwand je gesondert ausweisen, keine Verrechnung; für Fremdwährungsdifferenzen gelten abweichende Regeln.
  quelle: hwp-bur-2023__rz-0787-s327
  zitat: Abweichende Regelungen gelten für die Verbuchung von Fremdwährungsdifferenzen
- regel: Finanzaufwand umfasst Zinsaufwand für Bank-, Darlehens- und andere Verbindlichkeiten sowie übrige Kapitalkosten (Bankspesen, Kommissionen, Bürgschaftsprovisionen), soweit nicht
    betrieblicher Aufwand.
  quelle: hwp-bur-2023__rz-0791-s328
  zitat: übrige Kapitalkosten (Bankspesen, Kreditvermittlungskommissionen, Bürgschaftsprovisionen u.Ä.)
- regel: Finanzertrag umfasst u.a. Zinsen aus Bankguthaben und Forderungen sowie Zinsen und Dividenden aus Wertpapieren, soweit nicht betrieblicher Ertrag.
  quelle: hwp-bur-2023__rz-0789-s328
  zitat: Zinsen aus Bankguthaben und Forderungen (einschliesslich Verzugszinsen auf Forderungen aus Lieferungen und Leistungen)
- regel: Kursverluste auf Fremdwährungsposten (realisiert und nicht realisiert) im Finanzaufwand; bei klarem Zusammenhang mit betrieblichen Grundgeschäften Ausweis in der entsprechenden
    ER-Position möglich.
  quelle: hwp-bur-2023__rz-0791-s328
  zitat: realisierte und nicht realisierte Kursverluste auf Fremdwährungsposten
- regel: 'Kursgewinne auf Fremdwährungsposten nur, soweit realisiert oder als realisiert geltend: flüssige Mittel/Sichtguthaben zum Stichtagskurs; übrige kurzfristige Posten (auch ggü.
    Nahestehenden) mit Laufzeit < 12 Mt. bei Ersterfassung; keine unrealisierten Gewinne auf langfristigen Posten (Rz 90, 2. Teil).'
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Gewinne oder Verluste können als realisiert betrachtet werden, wenn diese Positionen bei ihrer Ersterfassung eine Lauf
- regel: Flüssige Mittel, Bankguthaben/-schulden auf Sicht und Aktiven mit Börsenkurs zum Devisenkurs des Bilanzstichtags; Kursgewinne und -verluste gelten als realisiert (Stichtagsbewertung
    EUR-Bankkonten ist zulässig).
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Gewinne oder Verluste sind als realisiert zu betrachten.
- regel: Die Umgliederung des kurzfristigen Anteils eines langfristigen Fremdwährungsdarlehens ist kein Realisationstatbestand (kein Ausweis unrealisierter Kursgewinne).
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Die Umgliederung des kurzfristigen Anteils eines langfristigen Darlehens stellt jedoch keinen Realisationstatbestand dar.
- regel: Realisierte und nicht realisierte Kursgewinne auf finanziellen Aktiven mit Börsenkurs oder beobachtbarem Marktpreis gehören in den Finanzertrag; realisierte Kursgewinne auf
    Fremdwährungsposten ebenfalls, bei klarem Zusammenhang mit betrieblichen Grundgeschäften in der entsprechenden ER-Position.
  quelle: hwp-bur-2023__rz-0789-s328
  zitat: realisierte und nicht realisierte Kursgewinne auf finanziellen Aktiven mit Börsenkurs
- regel: 'Langfristige Guthaben und Verpflichtungen in Fremdwährung: Niederstwertprinzip; unrealisierte Kursverluste aufwandswirksam, unrealisierte Kursgewinne nicht in der ER.'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: allfällige noch nicht realisierte Kursverluste sind aufwandswirksam zu erfassen
- regel: Kursgewinne und -verluste innerhalb der gleichen Währung dürfen verrechnet werden; wesentliche Kursdifferenzen im Anhang offenlegen.
  quelle: hwp-bur-2023__rz-0091-s078
  zitat: Eine Offenlegung der Kursgewinne und -verluste im Anhang ist bei wesentlichen Beträgen vorzunehmen.
- regel: Umrechnungskurse sind im Anhang nur offenzulegen, wenn die Rechnungslegung nicht in der Landeswährung erfolgt; bei CHF-Rechnungslegung keine Feststellung wegen fehlender Kursangabe.
  quelle: ser-2022__anh-e-s112-2
  zitat: sofern die Rechnungslegung nicht in der Landeswährung erfolgt (Art. 958d Abs. 3 OR)
- regel: Kursdifferenzen aus eindeutig betrieblichen Geschäftsvorfällen können zusammen mit dem Grundgeschäft (z.B. Warenaufwand) erfasst werden.
  quelle: hwp-bur-2023__rz-0093-s078
  zitat: zusammen mit dem Grundgeschäft in der Erfolgsrechnung (beispielsweise als Warenaufwand) erfasst werden sollen
- regel: Wertveränderungen von Finanzanlagen zu Börsenkurs/beobachtbarem Marktpreis und Veränderung der Schwankungsreserve im Finanzertrag bzw. Finanzaufwand.
  quelle: hwp-bur-2023__rz-0788-s327
  zitat: Die Wertveränderungen von Finanzanlagen, welche zum Börsenkurs oder zu anderen beobachtbaren Marktpreisen bewertet werden, sind entweder als Finanzertrag oder Finanzaufwand
    zu erfassen.
- regel: Aufgelaufene, erst im Folgejahr bezahlte Darlehenszinsen als antizipative Passiven abgrenzen.
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
- regel: Aufgelaufene, erst im Folgejahr vereinnahmte Zinserträge (z.B. Zins zahlbar mit Rückzahlung) als antizipative Aktiven abgrenzen.
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: 'Antizipative Aktiven: Erträge des alten Jahres, die erst im neuen Jahr zu Einnahmen führen'
- regel: Bestandsaufnahme der Rechnungsabgrenzungen u.a. im Zusammenhang mit der Beurteilung der Aktiv- und Passivposten (Marchzinsen) und durch Vergleich mit dem Vorjahr.
  quelle: hwp-bur-2023__rz-0262-s216
  zitat: im Zusammenhang mit der Beurteilung von Aktiv- und Passivposten (beispielsweise Marchzinsen)
- regel: 'Handelsrechtlich massgebend: Zinssätze mit Nahestehenden nach Drittvergleich beurteilen (Marktkonditionen für den Darlehensnehmer, Währung, Bonität, Sicherheiten); auch steuerlich
    akzeptierte Zinssätze sind nach diesen Kriterien zu beurteilen.'
  quelle: hwp-er-2026__rz-0176-s217
  zitat: Auch steuerlich akzeptierte Zinssätze sind nach diesen Kriterien zu beurteilen.
- regel: 'ESTV-Praxis (steuerlich, keine handelsrechtliche Bewertungsregel): unverzinsliche/ungenügend verzinste Darlehen an Beteiligte sowie übersetzte Zinsen an Beteiligte gelten als
    geldwerte Leistung (Verrechnungssteuer, Gewinnsteuer). Folge der geldwerten Leistung: Gewinnsteuer (Art. 58 Abs. 1 lit. b DBG) und VSt 35 % (Art. 4 Abs. 1 lit. b VStG, Art. 20 Abs.
    1 VStV; Satz Art. 13 VStG), Deklaration mit Formular 102 innert 30 Tagen nach Fälligkeit – nur Hinweis an WP (mögliche nicht erfasste VSt-Verbindlichkeit).'
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
  weitere_fundstellen:
  - quelle: dbg__art-58
    zitat: offene und verdeckte Gewinnausschüttungen und geschäftsmässig nicht begründete Zuwendungen an Dritte
  - quelle: vstg__art-4
    zitat: b. der von einem Inländer ausgegebenen Aktien, Stammanteile an Gesellschaften mit beschränkter Haftung
  - quelle: vstv__art-20
    zitat: jede geldwerte Leistung der Gesellschaft oder Genossenschaft an die Inhaber gesellschaftlicher Beteiligungsrechte oder an ihnen nahestehende Dritte
  - quelle: vstg__art-13
    zitat: 35 Prozent der steuerbaren Leistung
  - quelle: estv-zinsen-2026__s001-1
    zitat: Die geldwerten Leistungen sind mittels Formular 102 unaufgefordert innert 30 Tagen nach ihrer Fälligkeit zu deklarieren.
- regel: 'ESTV-Sätze gelten je Kalenderjahr der Zinsperiode (RS 2-218 nur CHF; FW: RS 2-219). 2026 aus dem ESTV-RS, 2025 nur aus dem Treuhand-Almanach (Sekundärquelle). Sätze nie aus
    dem Gedächtnis: `wert zins 2025` bzw. `wert zinssatz darlehen`.'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
