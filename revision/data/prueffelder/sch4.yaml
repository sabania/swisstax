# Prüffeld SCH4 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: SCH4
bezeichnung: Finanzaufwand und Finanzertrag
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: true
kurzbeschrieb: 'ER-Position Finanzaufwand und Finanzertrag (Art. 959b OR): Zinsen auf Bank- und Aktionärsdarlehen, Darlehen an Aktionäre und Bankguthaben, Bankspesen/-kommissionen, Erträge
  aus Finanzanlagen, Fremdwährungsdifferenzen. In der eingeschränkten Revision v.a. analytisch (Vorjahresvergleich, Erwartungswert aus verzinslichen Positionen, Plausibilisierung FX);
  Detailprüfungen nur weitergehend (WP).'
gesetz:
- thema: 'Mindestgliederung ER: Finanzaufwand und Finanzertrag als eigene Position (Produktionserfolgsrechnung Ziff. 7; Absatzerfolgsrechnung Ziff. 4)'
  quelle: or__art-959b-t1
  zitat: 7. Finanzaufwand und Finanzertrag
- thema: Zusätzlicher Einzelausweis in ER oder Anhang, wenn für die Beurteilung der Ertragslage wesentlich
  quelle: or__art-959b-t2
  zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
- thema: Zeitliche und sachliche Abgrenzung (Marchzinsen per Bilanzstichtag)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verzicht auf zeitliche Abgrenzung nur, wenn Nettoerlöse oder Finanzerträge CHF 100'000 nicht überschreiten
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten
- thema: Verrechnungsverbot Aufwand/Ertrag (Bruttoausweis Finanzaufwand und Finanzertrag)
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Vorjahreszahlen in der Jahresrechnung (Grundlage Vorjahresvergleich)
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- thema: Währung der Rechnungslegung (Landeswährung oder für die Geschäftstätigkeit wesentliche Währung); Offenlegung der Umrechnungskurse im Anhang nur, wenn nicht in der Landeswährung
    Rechnung gelegt wird (bei CHF-Rechnungslegung nicht anwendbar, vgl. SER Anhang E)
  quelle: or__art-958d
  zitat: Wird nicht die Landeswährung verwendet, so müssen die Werte zusätzlich in der Landeswährung angegeben werden. Die verwendeten Umrechnungskurse sind im Anhang offenzulegen
- thema: 'Anhang: angewandte Grundsätze, soweit nicht gesetzlich vorgeschrieben (z.B. Fremdwährungsumrechnung, Ausweis der Kursdifferenzen)'
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: 'Anhang: Aufschlüsselungen und Erläuterungen zu ER-Positionen'
  quelle: or__art-959c-t1
  zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- thema: Schwankungsreserve auf Aktiven zum Börsenkurs/Marktpreis (Veränderung im Finanzerfolg, vgl. HWP BuR Rz 788)
  quelle: or__art-960b
  zitat: so darf eine Wertberichtigung zulasten der Erfolgsrechnung gebildet werden, um Schwankungen im Kursverlauf Rechnung zu tragen
- thema: Gesonderter Ausweis von Forderungen/Verbindlichkeiten gegenüber Beteiligten und Organen (Basis der Zinsen Nahestehender)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
- thema: Rückerstattungspflicht bei offensichtlichem Missverhältnis von Leistung und Gegenleistung (nicht marktkonforme Zinsen mit Aktionären)
  quelle: or__art-678
  zitat: soweit ein offensichtliches Missverhältnis zwischen Leistung und Gegenleistung besteht
- thema: Verbot der Einlagenrückgewähr (Darlehen an Aktionäre zu nicht marktkonformen Bedingungen, vgl. HWP BuR Rz 175)
  quelle: or__art-680
  zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- thema: Rangrücktritt muss auch die Zinsforderungen umfassen
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: Prüfungshandlungen der eingeschränkten Revision
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
risiken:
- text: Zinsaufwand für Bank- und Aktionärsdarlehen nicht vollständig oder nicht periodengerecht erfasst (fehlende Abgrenzung aufgelaufener Zinsen per Bilanzstichtag).
  pruefziele:
  - VO
  - PA
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird, wie beispielsweise Darlehens- und Hypothekenzinsen
- text: Zinserträge (z.B. auf Darlehen an Aktionäre oder verzinsliche Bankguthaben) nicht oder nicht periodengerecht erfasst (antizipative Aktiven), insbesondere wenn der Zins erst mit
    der Rückzahlung fällig ist.
  pruefziele:
  - VO
  - EN
  - PA
  quelle: hwp-bur-2023__rz-0256-s215
  zitat: Erträge des alten Jahres, die erst im neuen Jahr zu Einnahmen führen, wie beispielsweise Kapitalzinsen
- text: 'Zinsen auf Darlehen (von und an Aktionäre/Nahestehende) nicht vereinbarungsgemäss bezahlt, sondern kapitalisiert oder erst mit Rückzahlung fällig: Zinsaufwand/-ertrag nicht
    abgegrenzt; zugleich Hinweis auf Bonitäts- bzw. Drittvergleichsproblem.'
  pruefziele:
  - VO
  - PA
  - BE
  quelle: hwp-er-2026__rz-0177-s217
  zitat: Werden die Zinsen vereinbarungsgemäss bezahlt und nicht mit dem Darlehen kapitalisiert?
- text: Nicht marktkonforme Zinsen mit Aktionären/Nahestehenden (übersetzter Zins auf Aktionärsdarlehen, zu tiefer oder fehlender Zins auf Darlehen an Aktionäre) → verdeckte Gewinnausschüttung
    (zu hohe Aufwendungen bzw. zu geringe Erträge), Rückerstattung Art. 678 OR; steuerliche Folgen als geldwerte Leistung (ESTV, vgl. Bewertung).
  pruefziele:
  - EN
  - RI
  - DO
  quelle: hwp-er-2026__rz-0163-s212
  zitat: Eine verdeckte Gewinnausschüttung liegt dann vor, wenn eine Gesellschaft Leistungen erbringt, ohne dafür eine (angemessene) Gegenleistung zu erhalten.
- text: Darlehen der Gesellschaft an Aktionäre/Nahestehende zu unangemessen günstigen Bedingungen (tiefer Zins, fehlende Sicherheit, ungenügende Bonität) → Zinsertrag zu tief, möglicher
    vGA-Tatbestand.
  pruefziele:
  - VO
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0177-s197
  zitat: die Darlehensbedingungen für den Schuldner oder die Schuldnerin unangemessen
- text: Darlehen an Aktionäre verstossen gegen das Verbot der Einlagenrückgewähr (Art. 680 Abs. 2 OR); Konditionen und Zinsertrag sind dann nicht nur eine Frage des Finanzerfolgs (Hinweis
    an WP).
  pruefziele:
  - RI
  - DO
  quelle: hwp-bur-2023__rz-0175-s196
  zitat: Darlehen gegen das Verbot der Einlagenrückgewähr verstossen (Art. 680 Abs. 2 OR)
- text: Finanzaufwand und Finanzertrag miteinander verrechnet (Nettoausweis, z.B. Ertragskonten innerhalb der Gruppe «Finanzaufwand») oder Positionen falsch zugeordnet (z.B. Weiterverrechnungen,
    Garantiekommissionen, Erträge Finanzanlagen).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0787-s327
  zitat: Unter dem Finanzergebnis sind der Finanzertrag sowie der Finanzaufwand je gesondert auszuweisen und dürfen nicht miteinander verrechnet werden
- text: Fremdwährungsdifferenzen falsch ermittelt (Kurs weicht vom Jahresendkurs ab) oder unrealisierte Kursgewinne auf langfristigen Positionen erfolgswirksam erfasst.
  pruefziele:
  - BE
  - RI
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- text: Kursdifferenzen aus nicht betrieblichen Vorgängen beeinflussen den Bruttogewinn bzw. betriebliche Kursdifferenzen werden ohne Begründung im Finanzerfolg gezeigt.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0092-s078
  zitat: Diese Kursdifferenzen dürfen daher den Bruttogewinn nicht beeinflussen.
- text: Wertberichtigungen auf übrigen, nicht zum Börsenkurs bewerteten Finanzanlagen fälschlich im Finanzaufwand statt unter Abschreibungen und Wertberichtigungen (HWP BuR III.3.9).
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0792-s328
  zitat: Nicht zum Finanzaufwand gehören die Wertberichtigungen auf den Gegenständen des übrigen Finanzanlagevermögens
- text: 'Zinsen auf Darlehen mit Rangrücktritt: Zinsen nicht vom Rangrücktritt erfasst oder Zinsverbindlichkeiten falsch klassiert/ausgewiesen.'
  pruefziele:
  - RV
  - DO
  quelle: hwp-bur-2023__rz-0714-s305
  zitat: Der Zinsendienst wird durch den Rangrücktritt nicht unterbrochen, jedoch müssen die Zinsen ebenfalls dem Rangrücktritt unterliegen
