- text: 'Steuersätze nicht aus Vorjahren übernehmen: Normalsatz 8,1 % gilt seit 1.1.2024; bei Leistungen vor 2024 können andere Sätze gelten.'
  quelle: treuhand-almanach-2026__s047-1
  zitat: Gültig seit 1. Januar 2024
- text: Katalogverweis «RZ 958 MWStG» in M2-302 ist im Wiki nicht als Quelle vorhanden; Grundlage für die Umsatzabstimmung ist Art. 128 MWSTV (via HWP BuR/PH 20).
- text: 'Befragungen kann der Agent nicht selbst führen: Antworten nur aus schriftlichen Unterlagen auswerten, sonst Pendenz; bei wesentlichen Posten Befragung mit Analytik/Detailprüfung
    ergänzen.'
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
fragen_kunde:
- frage: Liegt die Umsatzabstimmung (Finanzbuchhaltung ↔ deklarierte MWST-Abrechnungen) und die Vorsteuerabstimmung für das Geschäftsjahr bzw. das Vorjahr vor? Wer hat sie erstellt,
    wie wurden Differenzen begründet und wurde eine Korrekturabrechnung eingereicht?
  zweck: 'M2-101/M2-302: Vorhandensein und Nachvollzug der Umsatzabstimmung'
- frage: Nach welcher Methode wird abgerechnet (effektiv oder Saldo-/Pauschalsteuersatz), nach vereinbartem oder vereinnahmtem Entgelt, in welcher Periodizität? Ist die Gesellschaft
    Mitglied einer MWST-Gruppe?
  zweck: 'M2-102: Abrechnungsart und Sonderfälle; Anhangangabe MWST-Gruppe'
- frage: Werden Umsätze zum reduzierten oder Sondersatz, steuerbefreite Umsätze (Export) oder von der Steuer ausgenommene Umsätze (z.B. Vermietung, Geld- und Kapitalverkehr) erzielt?
    Wurde für ausgenommene Umsätze optiert?
  zweck: M2-102, M2-305 a/b/e, M2-407
- frage: Werden Privatanteile (Geschäftsfahrzeuge, Spesen, Naturalleistungen an Mitarbeitende und Aktionäre) mit MWST abgerechnet? Bitte Berechnung und Deklaration in der Abrechnung
    angeben.
  zweck: M2-103, M2-304
- frage: Werden Dienstleistungen von Unternehmen mit Sitz im Ausland bezogen (z.B. Software, Lizenzen, Beratung, Werbung)? Wird darauf die Bezugsteuer deklariert?
  zweck: M2-103, M2-405
- frage: Gibt es branchenspezifische MWST-Eigenheiten, Rulings, Vereinbarungen oder Bewilligungen der ESTV? Fanden in den letzten Jahren ESTV-Kontrollen statt, gibt es Rückfragen, Einsprachen
    oder hängige Verfahren?
  zweck: M2-104, Rückstellungsbedarf
- frage: Wie werden Wareneinfuhren abgewickelt (ZAZ-Konto, Spediteur) und wie wird die Einfuhrsteuer verbucht?
  zweck: M2-406
- frage: Bestehen Leistungen an Nahestehende oder Verrechnungs-/Tauschgeschäfte, gab es eine Übernahme oder Übergabe eines Betriebs(teils) mit Meldeverfahren oder Nutzungsänderungen
    bei Immobilien bzw. Anlagen?
  zweck: M2-305 c/d/g/h
- frage: Welche Probleme, Unsicherheiten, Korrekturabrechnungen, verspäteten Abrechnungen oder Verzugszinsen gab es bei der Erstellung der MWST-Abrechnungen?
  zweck: M2-408
