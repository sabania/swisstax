- thema: Festsetzungsverjährung fünf Jahre nach Ablauf der Steuerperiode (Art. 42 Abs. 1 MWSTG) – offene Perioden für Rückstellungsbedarf (Unterbrechung Abs. 2, neue Frist Abs. 3, absolut
    10 Jahre Abs. 6)
  quelle: mwstg__art-42
  zitat: Das Recht, eine Steuerforderung festzusetzen, verjährt fünf Jahre nach Ablauf der Steuerperiode
- thema: Unterbrechung der Festsetzungsverjährung durch Erklärung, Verfügung, Einspracheentscheid oder Urteil (Art. 42 Abs. 2 MWSTG)
  quelle: mwstg__art-42
  zitat: Die Verjährung wird durch eine auf Festsetzung oder Korrektur der Steuerforderung gerichtete empfangsbedürftige schriftliche Erklärung, eine Verfügung, einen Einspracheentscheid
    oder ein Urteil unterbrochen.
- thema: Unterbrechung auch durch Ankündigung einer ESTV-Kontrolle bzw. Beginn einer unangekündigten Kontrolle (Art. 42 Abs. 2 MWSTG)
  quelle: mwstg__art-42
  zitat: Zu einer entsprechenden Unterbrechung der Verjährung führen auch die Ankündigung einer Kontrolle nach Artikel 78 Absatz 3 oder der Beginn einer unangekündigten Kontrolle.
- thema: Nach Unterbrechung durch ESTV oder Rechtsmittelinstanz neue Verjährungsfrist von zwei Jahren (Art. 42 Abs. 3 MWSTG)
  quelle: mwstg__art-42
  zitat: Wird die Verjährung durch die ESTV oder eine Rechtsmittelinstanz unterbrochen, so beginnt die Verjährungsfrist neu zu laufen. Sie beträgt neu zwei Jahre.
- thema: 'Absolute Festsetzungsverjährung: zehn Jahre nach Ablauf der Steuerperiode (Art. 42 Abs. 6 MWSTG)'
  quelle: mwstg__art-42
  zitat: Das Recht, die Steuerforderung festzusetzen, verjährt in jedem Fall zehn Jahre nach Ablauf der Steuerperiode, in der die Steuerforderung entstanden ist.
- thema: Korrekturpflicht für erkannte Mängel in nicht rechtskräftigen bzw. nicht verjährten Steuerperioden (Art. 72 Abs. 2 MWSTG)
  quelle: mwstg__art-72
  zitat: Die steuerpflichtige Person ist verpflichtet, erkannte Mängel in Abrechnungen über zurückliegende Steuerperioden nachträglich zu korrigieren, soweit die Steuerforderungen dieser
    Steuerperioden nicht in Rechtskraft erwachsen oder verjährt sind.
