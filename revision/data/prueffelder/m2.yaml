  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: hwp-bur-2023__rz-0357-s148
    zitat: spätestens aber auf Ende einer Abrechnungsperiode, auf die Konten Umsatzsteuer bzw. Vorsteuer übertragen
  - quelle: hwp-bur-2023__rz-0367-s151
    zitat: Aus der Vorsteuerabstimmung muss ersichtlich sein, dass die Vorsteuern gemäss Vorsteuerkonten oder sonstigen Aufzeichnungen mit den deklarierten Vorsteuern abgestimmt wurden.
  - quelle: mwstg__art-40
    zitat: Im Falle der Abrechnung nach vereinnahmten Entgelten entsteht der Anspruch auf Vorsteuerabzug im Zeitpunkt der Bezahlung. Die Umsatzsteuerschuld entsteht mit der Vereinnahmung
      des Entgelts.
- id: M2-304
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung; sonst «nicht bearbeitet – WP-Schritt», Hinweise aus M2-101/301/305 nur als Notiz «Schlussbesprechung»/Pendenz. Auf Anweisung:
    aus Kontoblättern Fahrzeug, Spesen und Lohn die Privatanteile ermitteln und prüfen, ob darauf MWST abgerechnet bzw. die Vorsteuer korrigiert und deklariert wurde; Berechnung des
    Kunden nachrechnen. Fehlende Abrechnung als Hinweis an den WP, unklare Fälle als Pendenz.'
  nachweise:
  - Kontoblätter Fahrzeug-, Spesen- und Lohnkonten
  - Berechnung Privatanteile / Lohnausweise
  - MWST-Abrechnungen (Deklaration Privatanteile)
  rechnen: 'Bemessungsgrundlage für Leistungen an Personal (auch mitarbeitende Aktionäre), die im Lohnausweis zu deklarieren sind = Betrag, der für die direkten Steuern massgebend ist;
    Pauschalen der direkten Steuern zulässig (Art. 47 Abs. 2, 4, 5 MWSTV). Steuer: Nettobasis MWST = Betrag × Satz; Betrag inkl. MWST: MWST = Betrag × Satz/(100 + Satz) (Umrechnung:
    Praxis). Vergleich mit gebuchtem und deklariertem Betrag.'
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Privatnutzung oder Privatanteile vorhanden, aber keine MWST bzw. Vorsteuerkorrektur deklariert, oder Berechnung nicht nachvollziehbar.'
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: ob der Privatanteil von Geschäftsaufwendungen und Dienstleistungsbezug aus dem Ausland mit MWST abgerechnet ist
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: konzept-ki-revisionsagent-2026__c008-1
    zitat: 'Kennzeichnung: EP = Einzelfallprüfung, WP = Wirtschaftsprüfer.'
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Das Nachrechnen bzw. die rechnerische Prüfung ist eine wichtige Prüfungshandlung im Rahmen der Detailprüfungen.
  - quelle: mwstv__art-47
    zitat: Leistungen des Arbeitgebers an das Personal, die im Lohnausweis zu deklarieren sind, gelten als entgeltlich erbracht. Die Steuer ist von dem Betrag zu berechnen, der auch
      für die direkten Steuern massgebend ist.
  - quelle: mwstv__art-47
    zitat: Soweit bei den direkten Steuern Pauschalen für die Ermittlung von Lohnanteilen zulässig sind, die auch für die Bemessung der Mehrwertsteuer dienlich sind, können diese für
      die Mehrwertsteuer ebenfalls angewendet werden.
  - quelle: mwstv__art-47
    zitat: Für die Anwendung der Absätze 2–4 ist nicht erheblich, ob es sich dabei um eng verbundene Personen nach Artikel 3 Buchstabe h MWSTG handelt.
- id: M2-305
  vorgehen: 'Spezialitätenliste a–h anhand Branche, Konten, Verträgen und Kundenantworten durchgehen; je Punkt «zutreffend/nicht zutreffend» begründen. Zutreffende belegen: a) Satz je
    Ertragsart, b) Ausfuhrnachweis, c) Bruttoverbuchung, bei Tausch Marktwert als Entgelt (Art. 24 Abs. 3 MWSTG), d) Entgelt an Nahestehende = Wert unter unabhängigen Dritten (Art. 24
    Abs. 2 MWSTG), e) ausgenommene Umsätze (Deklaration, Option, Vorsteuerkorrektur), f) Bezugsteuer, g) Meldeverfahren, h) Nutzungsänderungen. Risiken (Rückstellung, Anhang) dem WP
    vorlegen; 4xx nur auf Anweisung.'
  nachweise:
  - Spezialitätenliste (Arbeitspapier, Textfeld)
  - Ertrags-/Aufwandskonten und Verträge
  - Ausfuhrnachweise
  - Verträge/Abrechnungen mit Nahestehenden
  - Unterlagen Option, Meldeverfahren und Immobiliennutzung
  rechnen: ''
  feststellung_wenn: Ein Punkt a–h trifft zu und ist nicht korrekt abgerechnet oder nicht belegt (z.B. Ausfuhrnachweis fehlt, Nettoverrechnung, ausgenommene Umsätze ohne Vorsteuerkorrektur)
    mit möglicher wesentlicher Nachforderung.
  fundstellen:
  - quelle: ph-20-mwst-2016__c006-1
    zitat: beurteilt der Abschlussprüfer die inhärenten MWST-Risiken unter Berücksichtigung von Branche, Tätigkeit und Komplexität des Unternehmens
  - quelle: mwstg__art-25-t1
    zitat: Die Steuer beträgt 8,1 Prozent (Normalsatz)
  - quelle: mwstg__art-23-t1
    zitat: die direkt ins Ausland befördert oder versendet werden
  - quelle: hwp-bur-2023__rz-0354-s148
    zitat: Als unerlässliche Fälle gelten insbesondere Dokumentationsvorschriften, welche die Geltendmachung von Steuervorteilen bezwecken
  - quelle: hwp-bur-2023__rz-0366-s150
    zitat: Aus Sicht der Mehrwertsteuer ist das Bruttoprinzip zwingend einzuhalten.
  - quelle: mwstg__art-24-t1
    zitat: Bei Tauschverhältnissen gilt der Marktwert jeder Leistung als Entgelt für die andere Leistung.
  - quelle: mwstg__art-24-t1
    zitat: Bei Leistungen an eng verbundene Personen (Art. 3 Bst. h) gilt als Entgelt der Wert, der unter unabhängigen Dritten vereinbart würde.
  - quelle: mwstg__art-22
    zitat: jede von der Steuer ausgenommene Leistung durch offenen Ausweis der Steuer oder durch Deklaration in der Abrechnung versteuern (Option)
  - quelle: mwstg__art-29
    zitat: die für die Erbringung von Leistungen, die von der Steuer ausgenommen sind und für deren Versteuerung nicht optiert wurde, verwendet werden
  - quelle: mwstg__art-38
    zitat: so hat die steuerpflichtige Person ihre Abrechnungs- und Steuerentrichtungspflicht in den folgenden Fällen durch Meldung zu erfüllen
  - quelle: hwp-bur-2023__rz-0372-s152
    zitat: Mehrwertsteuerliche Nutzungsänderungen können bei aktivierbaren Gegenständen und Dienstleistungen zu einer Eigenverbrauchsbesteuerung bzw. einer Einlageentsteuerung führen.
- id: M2-401
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: deklarierte Vorsteuer je Periode zu vorsteuerbelasteten Aufwänden und
    Investitionen in Relation setzen, mit Erwartung und Vorjahr vergleichen und die Vorsteuerabstimmung des Kunden kritisch durchsehen. Auffällige Abweichungen (z.B. Investitionsschübe,
    fehlende Vorsteuerkorrektur) als Frage/Pendenz im Textfeld.'
  nachweise:
  - Vorsteuerabstimmung des Kunden
  - Saldoliste Aufwand und Investitionen
  - MWST-Abrechnungen
  - Vorjahreswerte
  rechnen: Erwartete Vorsteuer ≈ vorsteuerbelasteter Aufwand und Investitionen (ohne Löhne, Sozialleistungen, Abschreibungen, ausgenommene Bezüge) × anwendbarer Steuersatz; Abweichung
    zur deklarierten Vorsteuer in % und gegenüber Vorjahr
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: deklarierte Vorsteuer weicht ohne Erklärung wesentlich von der Erwartung oder dem Vorjahr ab, oder Vorsteuerabstimmung fehlt.'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: mwstv__art-128-t2
    zitat: Aus der Vorsteuerabstimmung muss ersichtlich sein, dass die Vorsteuern gemäss Vorsteuerkonti oder sonstigen Aufzeichnungen mit den deklarierten Vorsteuern abgestimmt wurden.
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vergleich mit den Erwartungen des Abschlussprüfers
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen
- id: M2-402
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: bewusst ausgewählte Debitorenrechnungen und Vorsteuerbelege auf die Angaben
    nach Art. 26 Abs. 2 MWSTG durchsehen (Leistungserbringer mit MWST-Nr., Empfänger, Datum, Leistung, Entgelt, Steuersatz/-betrag; bei Entgelt inkl. Steuer genügt der Satz). Mängel
    je Beleg im Textfeld, fraglicher Vorsteuerabzug als Pendenz; Beurteilung WP.'
  nachweise:
  - Ausgewählte Debitorenrechnungen
  - Ausgewählte Kreditoren-/Vorsteuerbelege
  - Kontoblätter Vorsteuer
  rechnen: Steuerbetrag = Nettoentgelt × ausgewiesener Steuersatz (Rundungstoleranz); Brutto = Netto + Steuer
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Vorsteuer auf Belegen, die nicht auf die Gesellschaft lauten oder rechnerisch falsch sind; Debitorenrechnungen ohne korrekte
    MWST-Angaben. Fehlt nur ein Element nach Art. 26 Abs. 2 lit. a–f MWSTG («in der Regel», z.B. MWST-Nr.): Hinweis bzw. Pendenz, keine Wesentliche Feststellung. Bei erkennbar eingeforderter
    MWST eines eingetragenen Leistungserbringers ist der Vorsteuerabzug nicht allein wegen eines Formmangels ausgeschlossen (Art. 81 Abs. 3 MWSTG, Art. 59 MWSTV) – Beurteilung WP. Weiterhin
    als mögliche Feststellung behandeln: Beleg identifiziert die Gesellschaft nicht als Empfängerin, Leistungserbringer nicht eingetragen (Art. 59 Abs. 2 MWSTV) oder Betrag rechnerisch
    falsch.'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: mwstg__art-26
    zitat: den Hinweis, dass er oder sie im Register der steuerpflichtigen Personen eingetragen ist, sowie die Nummer
  - quelle: mwstg__art-26
    zitat: den anwendbaren Steuersatz und den vom Entgelt geschuldeten Steuerbetrag
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Belegtext (Umschreibung des Geschäftsvorfalls, Firmenanschrift)
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
  - quelle: mwstg__art-26
    zitat: und in der Regel folgende Elemente enthalten
  - quelle: mwstg__art-26
    zitat: Die Rechnung muss den Leistungserbringer oder die Leistungserbringerin, den Leistungsempfänger oder die Leistungsempfängerin und die Art der Leistung eindeutig identifizieren
  - quelle: mwstg__art-26
    zitat: schliesst das Entgelt die Steuer ein, so genügt die Angabe des anwendbaren Steuersatzes
  - quelle: mwstg__art-81
    zitat: Es ist unzulässig, Nachweise ausschliesslich vom Vorliegen bestimmter Beweismittel abhängig zu machen.
  - quelle: mwstv__art-59
    zitat: Die Inlandsteuer gilt als in Rechnung gestellt, wenn der Leistungserbringer oder die Leistungserbringerin für den Leistungsempfänger oder die Leistungsempfängerin erkennbar
      von diesem oder dieser die Mehrwertsteuer eingefordert hat.
  - quelle: mwstv__art-59
    zitat: Weiss er oder sie aber, dass die Person, die die Mehrwertsteuer überwälzt hat, nicht als steuerpflichtige Person eingetragen ist, so ist der Vorsteuerabzug ausgeschlossen.
- id: M2-403
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: bewusste Auswahl aus den Vorsteuerkonten (hohe Beträge, Investitionen,
    Auslandsbezüge, ungewöhnliche Buchungen) begründen; je Posten Beleg einsehen, Vorsteuer nachrechnen, Kontierung, Periode (vereinbarte Entgelte: Empfang der Rechnung; vereinnahmte:
    Bezahlung, Art. 40 Abs. 1/2 MWSTG) und Abzugsberechtigung prüfen. Ergebnis je Posten tabellarisch im Textfeld; keine Hochrechnung.'
  nachweise:
  - Kontoblätter Vorsteuerkonten
  - Ausgewählte Kreditorenbelege
  - Begründung der Auswahl
  rechnen: 'Je Beleg: berechnete Vorsteuer = Nettobetrag × Steuersatz bzw. ausgewiesene MWST; gebuchte Vorsteuer – berechnete Vorsteuer = 0'
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Vorsteuer falsch berechnet, falsch kontiert/periodisiert oder auf nicht abzugsberechtigten bzw. nicht auf die Gesellschaft lautenden
    Belegen geltend gemacht.'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
  - quelle: hwp-er-2026__rz-0261-s243
    zitat: beispielsweise Elemente mit einem hohen Wert oder Schlüsselelemente
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: rechnerische Richtigkeit (evtl. Umrechnung der Fremdwährung)
  - quelle: hwp-bur-2023__rz-0356-s148
    zitat: Vorsteuer auf Investitionen und übrigem Betriebsaufwand
  - quelle: mwstg__art-29
    zitat: die für die Erbringung von Leistungen, die von der Steuer ausgenommen sind und für deren Versteuerung nicht optiert wurde, verwendet werden
  - quelle: mwstg__art-40
    zitat: Im Falle der Abrechnung nach vereinbarten Entgelten entsteht der Anspruch auf Vorsteuerabzug im Zeitpunkt des Empfangs der Rechnung.
  - quelle: mwstg__art-40
    zitat: Im Falle der Abrechnung nach vereinnahmten Entgelten entsteht der Anspruch auf Vorsteuerabzug im Zeitpunkt der Bezahlung. Die Umsatzsteuerschuld entsteht mit der Vereinnahmung
      des Entgelts.
- id: M2-404
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: Kontenplan mit MWST-Codes anfordern (Pendenz) und durchsehen: Ertragskonten
    je Steuersatz bzw. befreit/ausgenommen getrennt, Aufwand-/Investitionskonten mit passendem Vorsteuercode, keine Erträge auf Aufwandkonten, Saldosteuersatz-Ertragsarten separat. Auffällige
    Codes im Textfeld auflisten.'
  nachweise:
  - Kontenplan mit MWST-Codes (Export Fibu)
  - Steuercode-Tabelle
  - Saldoliste
  rechnen: ''
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Konten ohne oder mit unpassendem MWST-Code (z.B. Ertragskonto ohne Umsatzsteuercode, ausgenommene Erträge mit Normalsatz) oder
    Kontenplan nicht erhältlich.'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: hwp-bur-2023__rz-0366-s150
    zitat: Sämtliche Erträge (Umsätze gemäss Definition der Mehrwertsteuer) sollten auf separaten, dafür vorgesehenen Ertragskonten verbucht werden.
  - quelle: hwp-bur-2023__rz-0354-s148
    zitat: so einzurichten hat, dass sich die für die Abrechnung der Mehrwertsteuer massgebenden Tatsachen zuverlässig ermitteln lassen
  - quelle: mwstv__art-84
    zitat: Steuerpflichtige Personen, denen mehrere Saldosteuersätze bewilligt wurden, müssen die Erträge für jeden dieser Saldosteuersätze separat verbuchen.
  - quelle: hwp-bur-2023__rz-0361-s149
    zitat: die Ertragsarten, welche unterschiedlichen Saldosteuersätzen unterliegen, auf jeweils separaten Ertragskonten zu erfassen sind
- id: M2-405
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: Kreditoren mit Sitz im Ausland und Konten mit typischen Auslandsbezügen
    (Software, Lizenzen, Beratung, Werbung) durchsehen; Bezüge je Periode (ESTV-Kurs) mit deklarierter Bezugsteuer und Vorsteuerabzug abgleichen (bei Saldosteuersatz kein Vorsteuerabzug).
    Nicht deklarierte Bezüge im Textfeld auflisten.'
  nachweise:
  - Kreditorenjournal / Liste ausländische Lieferanten
  - Rechnungen ausländischer Dienstleister
  - MWST-Abrechnungen (Bezugsteuer, Vorsteuer)
  rechnen: Bezugsteuer = Σ Dienstleistungsbezüge Ausland in CHF (ESTV-Monatsmittel- oder Tageskurs bzw. Konzernkurs; Methode mind. eine Steuerperiode beibehalten, Art. 45 Abs. 3–5 MWSTV)
    × gesetzlicher Steuersatz (auch bei SSS, Art. 91 MWSTV); Vergleich mit Deklaration; Vorsteuer aus Bezugsteuer ≤ deklarierte Bezugsteuer (bei Saldosteuersatz = 0)
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Dienstleistungsbezüge aus dem Ausland ohne Bezugsteuerdeklaration oder Vorsteuer ohne entsprechende Bezugsteuer geltend gemacht.'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: mwstg__art-45-t1
    zitat: Dienstleistungen, deren Ort sich nach Artikel 8 Absatz 1 im Inland befindet und die erbracht werden durch Unternehmen mit Sitz im Ausland
  - quelle: hwp-bur-2023__rz-0362-s149
    zitat: Die deklarierte Bezugsteuer kann in der gleichen Abrechnung, soweit die Voraussetzungen für das Vorsteuerabzugsrecht erfüllt sind, als Vorsteuer deklariert
  - quelle: hwp-bur-2023__rz-0362-s149
    zitat: sofern nicht mit der Saldosteuersatz- bzw. Pauschalsteuersatzmethode abgerechnet wird
  - quelle: hwp-bur-2023__rz-0363-s150
    zitat: Wird von einer fortlaufenden Erfassung abgesehen, muss jeweils per Ende der Abrechnungsperiode die buchhalterische Erfassung der sich aus den Bezügen der Periode ergebenden
      Steuerschuld erfolgen.
  - quelle: hwp-bur-2023__rz-0364-s150
    zitat: unter Verwendung eines zulässigen, von der Eidgenössischen Steuerverwaltung publizierten Umrechnungskurses zu erfolgen
  - quelle: mwstv__art-45
    zitat: Die Umrechnung erfolgt nach dem von der ESTV veröffentlichten Wechselkurs, wobei wahlweise der Monatsmittelkurs oder der Tageskurs für den Verkauf von Devisen verwendet werden
      kann.
  - quelle: mwstv__art-45
    zitat: Steuerpflichtige Personen, die Teil eines Konzerns sind, können für die Umrechnung ihren Konzernumrechnungskurs verwenden.
  - quelle: mwstv__art-45
    zitat: Das gewählte Vorgehen (Monatsmittel-, Tages- oder Konzernkurs) ist während mindestens einer Steuerperiode beizubehalten.
  - quelle: mwstv__art-91
    zitat: müssen die Bezugsteuer in der entsprechenden Abrechnungsperiode zum hierfür geltenden gesetzlichen Steuersatz entrichten
- id: M2-406
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: Wareneinfuhren identifizieren (ausländische Lieferanten, Speditionsrechnungen,
    ZAZ-Konto); prüfen, ob die veranlagte Einfuhrsteuer als Vorsteuer (nicht als Aufwand) und nicht doppelt über die Spediteurrechnung gebucht ist und das Konto Einfuhrsteuer per Periodenende
    ausgeglichen ist. Doppelerfassung: Praxis ohne Fundstelle, Beurteilung WP. Abzug am Ende der Abrechnungsperiode, in der die Einfuhrsteuer festgesetzt wurde (Art. 40 Abs. 4 MWSTG).'
  nachweise:
  - Veranlagungsverfügungen MWST (Zoll)
  - Rechnungen der Spediteure/Transporteure
  - Kontoblatt Einfuhrsteuer/ZAZ
  - Kontoblätter Vorsteuer
  rechnen: Σ Einfuhrsteuer gemäss Veranlagungsverfügungen = als Vorsteuer verbuchter Betrag; Saldo Verrechnungskonto Einfuhrsteuer per Periodenende = 0
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Einfuhrsteuer ohne Veranlagungsverfügung als Vorsteuer verbucht, als Aufwand erfasst, doppelt gebucht oder Verrechnungskonto
    mit unerklärtem Saldo.'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: mwstg__art-28
    zitat: die von ihr entrichtete oder zu entrichtende Einfuhrsteuer, die mit unbedingter Forderung veranlagt wurde
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Kontierung
  - quelle: hwp-bur-2023__rz-0218-s207
    zitat: nicht rückforderbare Mehrwertsteuern
  - quelle: mwstg__art-40
    zitat: Der Anspruch auf Vorsteuerabzug aufgrund der Einfuhrsteuer entsteht am Ende der Abrechnungsperiode, in der die Steuer festgesetzt wurde.
- id: M2-407
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: Ertragskonten auf ausgenommene Umsätze (z.B. Überlassung von Grundstücken,
    Geld- und Kapitalverkehr) durchsehen; prüfen, ob sie als ausgenommen deklariert (bzw. optiert) sind und die Vorsteuer auf zugehörigen Aufwänden korrigiert/gekürzt und in den Aufwand
    rückübertragen wurde. Berechnung der Vorsteuerkorrektur nachrechnen; Ergebnis im Textfeld.'
  nachweise:
  - Ertragskonten (Saldoliste/Kontoblätter)
  - MWST-Abrechnungen (ausgenommene Umsätze, Vorsteuerkorrekturen)
  - Berechnung Vorsteuerkorrektur/-kürzung des Kunden
  rechnen: Vorsteuerkorrektur = Vorsteuer auf gemischt verwendeten Aufwänden × Anteil ausgenommene Verwendung (Schlüssel gemäss Kunde); Vergleich mit Deklaration
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: ausgenommene Umsätze vorhanden, aber nicht deklariert oder ohne Vorsteuerkorrektur/-kürzung; Korrekturschlüssel nicht nachvollziehbar;
    bei eigenen Berechnungen nicht umfassend belegt oder nicht plausibilisiert (Art. 67 MWSTV).'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
  - quelle: mwstg__art-29
    zitat: die für die Erbringung von Leistungen, die von der Steuer ausgenommen sind und für deren Versteuerung nicht optiert wurde, verwendet werden
  - quelle: mwstg__art-30
    zitat: so hat sie den Vorsteuerabzug nach dem Verhältnis der Verwendung zu korrigieren
  - quelle: hwp-bur-2023__rz-0358-s148
    zitat: Bei nicht oder nur teilweise abzugsberechtigten Vorsteuern (Vorsteuerkorrekturen und Vorsteuerkürzung) ist am Ende der Abrechnungsperiode eine Rückübertragung in den Aufwand
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen
  - quelle: mwstv__art-67
    zitat: so muss sie die Sachverhalte, die ihren Berechnungen zugrunde liegen, umfassend belegen sowie eine Plausibilitätsprüfung durchführen
- id: M2-408
  vorgehen: 'Sonstige (4xx) – nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen. Auf Anweisung: Frage als Pendenz an die MWST-verantwortliche Person (Probleme, Korrekturabrechnungen,
    verspätete Abrechnungen, Verzugszinsen, Rückfragen ESTV); Antwort mit Erkenntnissen aus den bearbeiteten M2-Schritten abgleichen und offene Punkte (Nachforderung, Rückstellung, Anhang,
    Vollständigkeitserklärung) für die Besprechung mit dem WP zusammenfassen.'
  nachweise:
  - Schriftliche Antwort des Kunden
  - Korrekturabrechnungen, Korrespondenz ESTV
  - Pendenzenliste M2
  - Vollständigkeitserklärung (MWST-Ergänzung)
  rechnen: ''
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: ungelöste MWST-Probleme mit möglicher wesentlicher Nachforderung ohne Rückstellung oder Offenlegung, oder Antwort fehlt.'
