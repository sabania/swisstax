schritte:
- id: M2-101
  vorgehen: 'Frage als Pendenz an die Leiterin Finanzen: Liegt die Umsatzabstimmung (und Vorsteuerabstimmung) zwischen Fibu und deklarierten MWST-Abrechnungen für das Geschäftsjahr bzw.
    Vorjahr vor, wer hat sie erstellt, sind Differenzen begründet und korrigiert? Schriftliche Antwort (z.B. Kundenbefragung) auswerten, Abstimmung in M-Files suchen und Ergebnis im
    Textfeld festhalten; Weiterprüfung in M2-302.'
  nachweise:
  - Schriftliche Antwort des Kunden (Pendenz/Kundenbefragung)
  - Umsatzabstimmung nach Art. 128 MWSTV (M-Files)
  - MWST-Abrechnungen des Geschäftsjahres
  rechnen: ''
  feststellung_wenn: Keine Umsatzabstimmung vorhanden bzw. nicht fristgerecht erstellt, Differenzen unbegründet oder nicht korrigiert, oder Antwort des Kunden fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Vorhandensein der MWST-Umsatzabstimmung
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Die Umsatzabstimmung ist vom Unternehmen innert 180 Tagen zu erstellen, und allfällige Abweichungen sind zu begründen.
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
- id: M2-102
  vorgehen: 'Frage als Pendenz: Abrechnungsmethode (effektiv oder Saldo-/Pauschalsteuersatz mit Bewilligung), Abrechnungsart (vereinbartes/vereinnahmtes Entgelt), Periodizität, MWST-Gruppe
    sowie Sonderfälle (ausgenommene Umsätze mit/ohne Option, befreite Umsätze, reduzierte Sätze). Antwort mit den Abrechnungen und der Verbuchung (Vorsteuerkonten vorhanden?) abgleichen;
    Ergebnis im Textfeld, Beurteilung durch WP.'
  nachweise:
  - Schriftliche Antwort des Kunden
  - MWST-Abrechnungen (Methode, Abrechnungsart)
  - Bewilligung Saldosteuersatz bzw. Gruppenbesteuerung, falls zutreffend
  - Kontenplan/Saldoliste
  rechnen: ''
  feststellung_wenn: Angaben widersprechen Abrechnungen oder Verbuchung (z.B. Vorsteuerkonten trotz Saldosteuersatz), MWST-Gruppe ohne Anhangangabe oder Antwort fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: Befragung nach der Art der MWST-Abrechnung (vereinnahmtes oder vereinbartes Entgelt) sowie allfälligen Sonderfällen (ausgenommene Umsätze, Saldosätze usw.)
  - quelle: hwp-bur-2023__rz-0359-s149
    zitat: Dabei wird auf eine Erfassung der Vorsteuern verzichtet.
  - quelle: hwp-bur-2023__rz-0370-s151
    zitat: Dieser Sachverhalt ist im Anhang der Jahresrechnungen der Gruppenmitglieder offenzulegen
- id: M2-103
  vorgehen: 'Frage als Pendenz an die Unternehmensleitung: Werden Privatanteile (Geschäftsfahrzeuge, Spesen, Naturalleistungen an Mitarbeitende/Aktionäre) und Dienstleistungsbezüge aus
    dem Ausland (z.B. Software, Beratung) mit MWST abgerechnet, wie und in welcher Periode? Antwort mit Privatanteilsbuchungen und Kreditoren mit Sitz im Ausland plausibilisieren; Vertiefung
    in M2-304 und M2-405.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Buchungen Privatanteile (Fahrzeug/Spesen)
  - Liste Kreditoren mit Sitz im Ausland
  - MWST-Abrechnungen (Bezugsteuer, Eigenverbrauch)
  rechnen: ''
  feststellung_wenn: Privatanteile oder Auslandsbezüge vorhanden, aber nicht mit MWST abgerechnet, oder Antwort fehlt bzw. ist unplausibel.
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: Befragung der Unternehmensleitung, ob der Privatanteil von Geschäftsaufwendungen und Dienstleistungsbezug aus dem Ausland mit MWST abgerechnet ist
  - quelle: ph-20-mwst-2016__c004-2
    zitat: dass sich in der Schweiz eine Abrechnungspflicht auch bei Bezug von Leistungen von Unternehmen aus dem Ausland ergibt
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Der Abschlussprüfer würdigt die erhaltenen Auskünfte in jedem Fall kritisch.
- id: M2-104
  vorgehen: 'Frage als Pendenz an die Unternehmensleitung: Branchenspezifische MWST-Eigenheiten (z.B. Werklieferungen/Montage, Anzahlungen, Handel, Auslandgeschäft), Rulings, Vereinbarungen/Bewilligungen
    der ESTV, ESTV-Kontrollen, Rückfragen und hängige Verfahren. Unterlagen in M-Files suchen, Ergebnis im Textfeld festhalten; Risiken an M2-305 und an die Rückstellungsprüfung weitergeben.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Rulings, Bewilligungen, Korrespondenz ESTV
  - Kontrollberichte/Einschätzungsmitteilungen ESTV
  rechnen: ''
  feststellung_wenn: Branchenspezifische Risiken oder ESTV-Auflagen ohne Abklärung bzw. Umsetzung, Nachforderungen ohne Rückstellung, oder Antwort fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: Befragung der Unternehmensleitung nach branchenspezifischen MWST-Eigenheiten und entsprechenden Abklärungen, Unterlagen und Vereinbarungen mit der Steuerverwaltung
  - quelle: ser-2022__anh-d-s089-2
    zitat: Befragung, ob eine Steuerrevision, andere Nachforschungen oder Rückfragen seitens der Steuerbehörden stattgefunden haben
  - quelle: ph-20-mwst-2016__c006-1
    zitat: beurteilt der Abschlussprüfer die inhärenten MWST-Risiken unter Berücksichtigung von Branche, Tätigkeit und Komplexität des Unternehmens
- id: M2-301
  vorgehen: Salden aller MWST-Konten per Stichtag (Vorsteuer, Umsatzsteuer, Abrechnungskonto, Einfuhrsteuer) aus der Saldoliste erfassen und mit Zahllast/Guthaben der letzten Abrechnung
    sowie offener Vorperioden abgleichen; Zahlung in neuer Rechnung prüfen. Abweichungen, Restsaldi und Bilanzausweis (Saldogrösse gegenüber ESTV, übrige kurzfristige Forderungen/Verbindlichkeiten)
    im Textfeld dokumentieren.
  nachweise:
  - Saldoliste 31.12.
  - Kontoblätter MWST-Konten
  - MWST-Abrechnung letzte Periode inkl. Zahlungsbeleg
  rechnen: Σ Salden MWST-Konten (Umsatzsteuer – Vorsteuer ± Abrechnungskonto) = Zahllast bzw. Guthaben gemäss Abrechnung(en) der offenen Perioden; Differenz = 0
  feststellung_wenn: Saldo weicht von der Abrechnung ab, unerklärte Restsaldi aus Vorperioden, Abrechnung fehlt oder Ausweis in falscher Bilanzposition.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der MWST-Forderungen und -Verbindlichkeiten mit den Abrechnungen
  - quelle: hwp-bur-2023__rz-0163-s193
    zitat: aus der Mehrwertsteuerpflicht eine Forderung oder Verbindlichkeit, die dem Saldo geschuldeter Umsatzsteuern abzüglich erbrachter Vorsteuern entspricht
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
- id: M2-302
  vorgehen: 'Umsatzabstimmung des Kunden nachvollziehen: Ertragskonten der Fibu (Nettoerlöse, übrige Erträge, Anlageverkäufe, Eigenverbrauch) mit der Summe der deklarierten Umsätze aller
    Perioden abgleichen; Überleitungsposten (Anzahlungen, Bestandesänderungen, Nicht-Entgelte, Debitorenverluste, befreite/ausgenommene Umsätze) belegen lassen. Unerklärte Differenzen
    im Textfeld festhalten; Beurteilung durch WP.'
  nachweise:
  - Umsatzabstimmung des Kunden
  - Saldoliste Erfolgsrechnung
  - MWST-Abrechnungen aller Perioden
  - Belege zu Überleitungsposten
  rechnen: Σ Ertragskonten Fibu ± Überleitungsposten = Σ deklarierter Umsatz (Ziff. 200) aller Perioden; Restdifferenz = 0
  feststellung_wenn: Unerklärte Differenz zwischen Fibu und deklariertem Umsatz, Umsatzabstimmung fehlt oder steuerbare Umsätze (z.B. Anlageverkäufe) nicht deklariert.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Nachvollzug der MWST-Umsatzabstimmung
  - quelle: hwp-bur-2023__rz-0366-s150
    zitat: Bei Nichtberücksichtigen dieser Anforderungen besteht die Gefahr, dass die Umsatzabstimmung nicht lückenlos erstellt werden kann, was eine Nachdeklaration erfordern kann.
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Umsatzaufteilung (steuerbar / steuerbefreit / ausgenommen / Nichtentgelte / Steuersätze)
- id: M2-303
  vorgehen: 'Kontoblätter der Vorsteuer- und Umsatzsteuerkonten je Abrechnungsperiode durchsehen: Sind die Salden per Quartalsende auf das Abrechnungskonto übertragen (Saldo 0)? Bewegungen
    je Quartal mit Umsatzsteuer und Vorsteuer der jeweiligen Abrechnung abstimmen; Zahlungen der Zahllast im Abrechnungskonto nachvollziehen. Abweichungen je Quartal tabellarisch im
    Textfeld dokumentieren.'
  nachweise:
  - Kontoblätter Vorsteuer, Umsatzsteuer, Abrechnungskonto
  - MWST-Abrechnungen je Quartal
  - Zahlungsbelege ESTV
  rechnen: 'Je Quartal: Umsatzsteuer gemäss Konto = Umsatzsteuer gemäss Abrechnung; Σ Vorsteuer gemäss Konten = Vorsteuer gemäss Abrechnung; Saldo Vorsteuer-/Umsatzsteuerkonten per Quartalsende
    = 0'
  feststellung_wenn: Konten per Periodenende nicht ausgeglichen, Quartalsbeträge weichen von der Abrechnung ab oder Zahllast nicht bezahlt bzw. nicht verbucht.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0357-s148
    zitat: spätestens aber auf Ende einer Abrechnungsperiode, auf die Konten Umsatzsteuer bzw. Vorsteuer übertragen
  - quelle: hwp-bur-2023__rz-0367-s151
    zitat: Aus der Vorsteuerabstimmung muss ersichtlich sein, dass die Vorsteuern gemäss Vorsteuerkonten oder sonstigen Aufzeichnungen mit den deklarierten Vorsteuern abgestimmt wurden.
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der MWST-Abrechnungen mit den Konti und/oder der Umsatzabstimmung
- id: M2-304
  vorgehen: Aus Kontoblättern Fahrzeugaufwand, Spesen und Lohn die Privatanteile (Fahrzeug, Naturalleistungen, Spesen) ermitteln und prüfen, ob darauf MWST abgerechnet bzw. die Vorsteuer
    korrigiert und in der Abrechnung deklariert wurde. Berechnung des Kunden nachrechnen; fehlende Abrechnung als Feststellung, unklare Fälle als Pendenz im Textfeld festhalten.
  nachweise:
  - Kontoblätter Fahrzeug-, Spesen- und Lohnkonten
  - Berechnung Privatanteile / Lohnausweise
  - MWST-Abrechnungen (Deklaration Privatanteile)
  rechnen: MWST auf Privatanteil = Bemessungsgrundlage Privatanteil (gemäss Kunde) × Steuersatz der Periode; Vergleich mit gebuchtem und deklariertem Betrag
  feststellung_wenn: Privatnutzung oder Privatanteile vorhanden, aber keine MWST bzw. Vorsteuerkorrektur deklariert, oder Berechnung nicht nachvollziehbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: ob der Privatanteil von Geschäftsaufwendungen und Dienstleistungsbezug aus dem Ausland mit MWST abgerechnet ist
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Das Nachrechnen bzw. die rechnerische Prüfung ist eine wichtige Prüfungshandlung im Rahmen der Detailprüfungen.
- id: M2-305
  vorgehen: Spezialitätenliste a–h anhand Branche, Ertrags-/Aufwandskonten, Verträgen und Kundenantworten durchgehen; je Punkt «zutreffend/nicht zutreffend» mit Begründung festhalten.
    Zutreffende Punkte belegen (Satz je Ertragsart, Ausfuhrnachweise, Bruttoverbuchung, Konditionen Nahestehender, Bezugsteuer, Meldeverfahren, Nutzungsänderungen) und Risiken mit möglicher
    Auswirkung (Rückstellung, Anhang) dem WP vorlegen.
  nachweise:
  - Spezialitätenliste (Arbeitspapier, Textfeld)
  - Ertrags-/Aufwandskonten und Verträge
  - Ausfuhrnachweise
  - Verträge/Abrechnungen mit Nahestehenden
  - Unterlagen Meldeverfahren und Immobiliennutzung
  rechnen: ''
  feststellung_wenn: Ein Punkt a–h trifft zu und ist nicht korrekt abgerechnet oder nicht belegt (z.B. Ausfuhrnachweis fehlt, Nettoverrechnung, nicht marktkonforme Preise) mit möglicher
    wesentlicher Nachforderung.
  fundstellen:
  - quelle: ph-20-mwst-2016__c006-1
    zitat: beurteilt der Abschlussprüfer die inhärenten MWST-Risiken unter Berücksichtigung von Branche, Tätigkeit und Komplexität des Unternehmens
  - quelle: hwp-bur-2023__rz-0366-s150
    zitat: Aus Sicht der Mehrwertsteuer ist das Bruttoprinzip zwingend einzuhalten.
  - quelle: hwp-bur-2023__rz-0354-s148
    zitat: Als unerlässliche Fälle gelten insbesondere Dokumentationsvorschriften, welche die Geltendmachung von Steuervorteilen bezwecken
  - quelle: hwp-bur-2023__rz-0372-s152
    zitat: Mehrwertsteuerliche Nutzungsänderungen können bei aktivierbaren Gegenständen und Dienstleistungen zu einer Eigenverbrauchsbesteuerung bzw. einer Einlageentsteuerung führen.
- id: M2-401
  vorgehen: Deklarierte Vorsteuer je Periode in Relation zu den vorsteuerbelasteten Aufwänden und Investitionen setzen, mit Erwartung und Vorjahr vergleichen und die Vorsteuerabstimmung
    des Kunden kritisch durchsehen. Auffällige Abweichungen (z.B. Investitionsschübe, fehlende Vorsteuerkorrektur) als Frage/Pendenz im Textfeld erfassen.
  nachweise:
  - Vorsteuerabstimmung des Kunden
  - Saldoliste Aufwand und Investitionen
  - MWST-Abrechnungen
  - Vorjahreswerte
  rechnen: Erwartete Vorsteuer ≈ vorsteuerbelasteter Aufwand und Investitionen (ohne Löhne, Sozialleistungen, Abschreibungen, ausgenommene Bezüge) × anwendbarer Steuersatz; Abweichung
    zur deklarierten Vorsteuer in % und gegenüber Vorjahr
  feststellung_wenn: Deklarierte Vorsteuer weicht ohne Erklärung wesentlich von der Erwartung oder dem Vorjahr ab, oder Vorsteuerabstimmung fehlt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0367-s151
    zitat: Aus der Vorsteuerabstimmung muss ersichtlich sein, dass die Vorsteuern gemäss Vorsteuerkonten oder sonstigen Aufzeichnungen mit den deklarierten Vorsteuern abgestimmt wurden.
  - quelle: hwp-er-2026__rz-0109-s199
    zitat: Vergleich mit den Erwartungen des Abschlussprüfers
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen
- id: M2-402
  vorgehen: 'Ausgewählte Debitorenrechnungen und Vorsteuerbelege (bewusste Auswahl: hohe Beträge, Investitionen, Auffälligkeiten) auf die MWST-Angaben durchsehen: Leistungserbringer
    mit MWST-Nummer, Empfänger (Gesellschaft, nicht Privatperson), Datum, Leistungsbeschrieb, Entgelt, Steuersatz und Steuerbetrag. Mängel je Beleg im Textfeld auflisten; fraglicher
    Vorsteuerabzug als Pendenz.'
  nachweise:
  - Ausgewählte Debitorenrechnungen
  - Ausgewählte Kreditoren-/Vorsteuerbelege
  - Kontoblätter Vorsteuer
  rechnen: Steuerbetrag = Nettoentgelt × ausgewiesener Steuersatz (Rundungstoleranz); Brutto = Netto + Steuer
  feststellung_wenn: Vorsteuer auf Belegen geltend gemacht, die nicht auf die Gesellschaft lauten, keine MWST-Nr./Steuerangaben enthalten oder rechnerisch falsch sind; Debitorenrechnungen
    ohne korrekte MWST-Angaben.
  fundstellen:
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Belegtext (Umschreibung des Geschäftsvorfalls, Firmenanschrift)
  - quelle: or__art-957a
    zitat: der Belegnachweis für die einzelnen Buchungsvorgänge
  - quelle: ph-20-mwst-2016__c004-2
    zitat: Der Steuerpflichtige ist dafür verantwortlich, dass die Nachweise für die mehrwertsteuerliche Qualifikation der Mittelzuflüsse und Vorsteuern
- id: M2-403
  vorgehen: Bewusste Auswahl aus den Vorsteuerkonten (hohe Beträge, Investitionen, Auslandsbezüge, ungewöhnliche Buchungen) treffen und begründen. Je Posten Beleg einsehen, Vorsteuer
    nachrechnen, Kontierung (Material/DL vs. Investitionen/übriger Aufwand), Periode und Abzugsberechtigung (geschäftlich, kein ausgenommener Zweck) prüfen. Ergebnis je Posten tabellarisch
    im Textfeld; keine Hochrechnung.
  nachweise:
  - Kontoblätter Vorsteuerkonten
  - Ausgewählte Kreditorenbelege
  - Begründung der Auswahl
  rechnen: 'Je Beleg: berechnete Vorsteuer = Nettobetrag × Steuersatz bzw. ausgewiesene MWST; gebuchte Vorsteuer – berechnete Vorsteuer = 0'
  feststellung_wenn: Vorsteuer falsch berechnet, falsch kontiert/periodisiert oder auf nicht abzugsberechtigten bzw. nicht auf die Gesellschaft lautenden Belegen geltend gemacht.
  fundstellen:
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
  - quelle: hwp-er-2026__rz-0261-s243
    zitat: beispielsweise Elemente mit einem hohen Wert oder Schlüsselelemente
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: rechnerische Richtigkeit (evtl. Umrechnung der Fremdwährung)
  - quelle: hwp-bur-2023__rz-0356-s148
    zitat: Vorsteuer auf Investitionen und übrigem Betriebsaufwand
- id: M2-404
  vorgehen: 'Kontenplan mit hinterlegten MWST-Codes beim Kunden anfordern (Pendenz) und durchsehen: Ertragskonten je Steuersatz bzw. befreit/ausgenommen getrennt, Aufwand- und Investitionskonten
    mit passendem Vorsteuercode, keine Erträge auf Aufwandkonten, Saldosteuersatz-Ertragsarten separat. Auffällige Codezuordnungen im Textfeld auflisten.'
  nachweise:
  - Kontenplan mit MWST-Codes (Export Fibu)
  - Steuercode-Tabelle
  - Saldoliste
  rechnen: ''
  feststellung_wenn: Konten ohne oder mit unpassendem MWST-Code (z.B. Ertragskonto ohne Umsatzsteuercode, ausgenommene Erträge mit Normalsatz) oder Kontenplan nicht erhältlich.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0366-s150
    zitat: Sämtliche Erträge (Umsätze gemäss Definition der Mehrwertsteuer) sollten auf separaten, dafür vorgesehenen Ertragskonten verbucht werden.
  - quelle: hwp-bur-2023__rz-0354-s148
    zitat: so einzurichten hat, dass sich die für die Abrechnung der Mehrwertsteuer massgebenden Tatsachen zuverlässig ermitteln lassen
  - quelle: hwp-bur-2023__rz-0361-s149
    zitat: die Ertragsarten, welche unterschiedlichen Saldosteuersätzen unterliegen, auf jeweils separaten Ertragskonten zu erfassen sind
- id: M2-405
  vorgehen: Kreditoren mit Sitz im Ausland und Aufwandkonten mit typischen Auslandsbezügen (Software, Lizenzen, Beratung, Werbung) durchsehen; Summe der Bezüge je Periode (Fremdwährung
    zum ESTV-Kurs) mit der deklarierten Bezugsteuer und dem gleichzeitig geltend gemachten Vorsteuerabzug abgleichen. Nicht deklarierte Bezüge im Textfeld auflisten.
  nachweise:
  - Kreditorenjournal / Liste ausländische Lieferanten
  - Rechnungen ausländischer Dienstleister
  - MWST-Abrechnungen (Bezugsteuer, Vorsteuer)
  rechnen: Bezugsteuer = Σ Dienstleistungsbezüge Ausland in CHF (ESTV-Kurs) × Steuersatz; Vergleich mit Deklaration; Vorsteuer aus Bezugsteuer ≤ deklarierte Bezugsteuer
  feststellung_wenn: Dienstleistungsbezüge aus dem Ausland ohne Bezugsteuerdeklaration oder Vorsteuer ohne entsprechende Bezugsteuer geltend gemacht.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0362-s149
    zitat: Die deklarierte Bezugsteuer kann in der gleichen Abrechnung, soweit die Voraussetzungen für das Vorsteuerabzugsrecht erfüllt sind, als Vorsteuer deklariert
  - quelle: hwp-bur-2023__rz-0363-s150
    zitat: Wird von einer fortlaufenden Erfassung abgesehen, muss jeweils per Ende der Abrechnungsperiode die buchhalterische Erfassung der sich aus den Bezügen der Periode ergebenden
      Steuerschuld erfolgen.
  - quelle: hwp-bur-2023__rz-0364-s150
    zitat: unter Verwendung eines zulässigen, von der Eidgenössischen Steuerverwaltung publizierten Umrechnungskurses zu erfolgen
- id: M2-406
  vorgehen: Wareneinfuhren identifizieren (ausländische Lieferanten, Speditionsrechnungen, ZAZ-Konto). Prüfen, ob die Einfuhrsteuer gemäss Veranlagungsverfügung als Vorsteuer (nicht
    als Aufwand) und nicht doppelt über die Transporteurrechnung gebucht ist und das Verrechnungskonto Einfuhrsteuer/Zoll per Periodenende ausgeglichen ist. Abweichungen im Textfeld
    festhalten.
  nachweise:
  - Veranlagungsverfügungen MWST (Zoll)
  - Rechnungen der Spediteure/Transporteure
  - Kontoblatt Einfuhrsteuer/ZAZ
  - Kontoblätter Vorsteuer
  rechnen: Σ Einfuhrsteuer gemäss Veranlagungsverfügungen = als Vorsteuer verbuchter Betrag; Saldo Verrechnungskonto Einfuhrsteuer per Periodenende = 0
  feststellung_wenn: Einfuhrsteuer ohne Veranlagungsverfügung als Vorsteuer verbucht, als Aufwand erfasst, doppelt gebucht oder Verrechnungskonto mit unerklärtem Saldo.
  fundstellen:
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Kontierung
  - quelle: hwp-bur-2023__rz-0218-s207
    zitat: nicht rückforderbare Mehrwertsteuern
- id: M2-407
  vorgehen: Ertragskonten auf von der Steuer ausgenommene Umsätze (z.B. Überlassung von Grundstücken, Geld- und Kapitalverkehr) durchsehen; prüfen, ob sie in der Abrechnung als ausgenommen
    deklariert (bzw. optiert) sind und die Vorsteuer auf zugehörigen Aufwänden korrigiert/gekürzt und in den Aufwand rückübertragen wurde. Berechnung der Vorsteuerkorrektur nachrechnen;
    Ergebnis im Textfeld.
  nachweise:
  - Ertragskonten (Saldoliste/Kontoblätter)
  - MWST-Abrechnungen (ausgenommene Umsätze, Vorsteuerkorrekturen)
  - Berechnung Vorsteuerkorrektur/-kürzung des Kunden
  rechnen: Vorsteuerkorrektur = Vorsteuer auf gemischt verwendeten Aufwänden × Anteil ausgenommene Verwendung (Schlüssel gemäss Kunde); Vergleich mit Deklaration
  feststellung_wenn: Ausgenommene Umsätze vorhanden, aber nicht deklariert oder ohne Vorsteuerkorrektur/-kürzung; Korrekturschlüssel nicht nachvollziehbar.
  fundstellen:
  - quelle: treuhand-almanach-2026__s043-1
    zitat: Ausgenommene Umsätze führen zu einer Vorsteuerkorrektur.
  - quelle: hwp-bur-2023__rz-0358-s148
    zitat: Bei nicht oder nur teilweise abzugsberechtigten Vorsteuern (Vorsteuerkorrekturen und Vorsteuerkürzung) ist am Ende der Abrechnungsperiode eine Rückübertragung in den Aufwand
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen
- id: M2-408
  vorgehen: 'Frage als Pendenz an die MWST-verantwortliche Person: Probleme, Unsicherheiten, Korrekturabrechnungen, verspätete Abrechnungen, Verzugszinsen oder Rückfragen der ESTV? Antwort
    mit Erkenntnissen aus M2-101 bis M2-407 abgleichen; offene Punkte mit möglicher Auswirkung (Nachforderung, Rückstellung, Anhang, Vollständigkeitserklärung) für die Besprechung mit
    dem WP im Textfeld zusammenfassen.'
  nachweise:
  - Schriftliche Antwort des Kunden
  - Korrekturabrechnungen, Korrespondenz ESTV
  - Pendenzenliste M2
  - Vollständigkeitserklärung (MWST-Ergänzung)
  rechnen: ''
  feststellung_wenn: Ungelöste MWST-Probleme mit möglicher wesentlicher Nachforderung ohne Rückstellung oder Offenlegung, oder Antwort fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s089-2
    zitat: Einblick in entsprechende Korrespondenz zur Feststellung allfälliger Nachforderungen und Risiken, für welche Rückstellungen zu bilden sind
  - quelle: ph-20-mwst-2016__c004-2
    zitat: sich rechtzeitig Klarheit zu verschaffen (z.B. durch schriftliche Anfrage bei der zuständigen Steuerbehörde oder Beizug eines Beraters)
  - quelle: ph-20-mwst-2016__c008-1
    zitat: Erkenntnisse über bedeutende Schwächen der internen Kontrollen und über MWST-Risiken
  - quelle: ser-2022__anh-e-s113-1
    zitat: Gemäss unseren Abklärungen bestehen im Bereich der MWST keine wesentlichen Risiken bzw. sind die bekannten Risiken in der Jahresrechnung angemessen berücksichtigt.
