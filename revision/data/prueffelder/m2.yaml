- text: 'MWST-Gruppe: fehlendes Vorsteuerclearing zwischen Gruppenmitgliedern; gruppeninterne Umsätze nicht separat erfasst bzw. in der Umsatzabstimmung nicht berücksichtigt.'
  pruefziele:
