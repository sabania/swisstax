schritte:
- id: M2-101
  vorgehen: '1) Umsatz- und Vorsteuerabstimmung (GJ, sonst Vorjahr) in M-Files suchen; 2) schriftliche Antwort (10.11) auswerten; 3) nur wenn Abstimmung oder Antwort fehlt: Frage als
    Pendenz (Liegen Umsatz- und Vorsteuerabstimmung vor, wer hat sie erstellt, sind Differenzen begründet und korrigiert?). Vorhandensein im Textfeld festhalten; Status höchstens «teilweise
    bearbeitet». Fehlt die GJ-Abstimmung, weil die Frist (Deklarationsfrist der Periode mit dem 180. Tag) noch läuft: keine Feststellung, VJ-Abstimmung einsehen, Pendenz für das GJ.
    Nachvollzug (M2-302) nur falls vom WP angewiesen.'
  nachweise:
  - Schriftliche Antwort des Kunden (Pendenz/Kundenbefragung)
  - Umsatzabstimmung nach Art. 128 Abs. 2 MWSTV (M-Files)
  - Umsatzabstimmung des Vorjahres
  - MWST-Abrechnungen des Geschäftsjahres
  rechnen: ''
  feststellung_wenn: 'Keine Umsatzabstimmung vorhanden bzw. Frist (Deklarationsfrist der Periode mit dem 180. Tag) im Prüfungszeitpunkt bereits abgelaufen (meist nur beim Vorjahr; läuft
    die GJ-Frist noch: keine Feststellung), Differenzen unbegründet oder nicht korrigiert, oder schriftliche Antwort fehlt (Pendenz).'
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Vorhandensein der MWST-Umsatzabstimmung
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Die Umsatzabstimmung ist vom Unternehmen innert 180 Tagen zu erstellen, und allfällige Abweichungen sind zu begründen.
  - quelle: ph-20-mwst-2016__c003-1
    zitat: Die Frist endet mit der ordentlichen Deklarationsfrist der Abrechnungsperiode, in welche der 180. Tag nach dem letzten Geschäftsabschluss fällt.
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- id: M2-102
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung; sonst «nicht bearbeitet – WP-Schritt», Hinweise aus M2-101/301/305 nur als Notiz «Schlussbesprechung»/Pendenz. Weiter gehend
    (SER Anh. D n): nur bei Hinweisen auf wesentliche Fehlaussagen/erhöhtem inhärentem Risiko; begründen. Auf Anweisung: Antwort zu Methode, Abrechnungsart, MWST-Gruppe (auch früher)
    und Sonderfällen mit Abrechnungen und Verbuchung abgleichen; höchstens «teilweise bearbeitet».'
  nachweise:
  - Schriftliche Antwort des Kunden
  - MWST-Abrechnungen (Methode, Abrechnungsart)
  - Bewilligung Saldosteuersatz bzw. Nachweis MWST-Gruppe (aktuell/früher), falls zutreffend
  - Kontenplan/Saldoliste
  - Anhang der Jahresrechnung
  rechnen: ''
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Angaben widersprechen Abrechnungen/Verbuchung (z.B. Vorsteuerkonten trotz Saldosteuersatz), aktuelle oder frühere MWST-Gruppe
    ohne Anhangangabe, Saldosteuersatz und MWST-Gruppe gleichzeitig angegeben (Art. 77 Abs. 2 lit. c MWSTV), oder Antwort fehlt.'
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: Befragung nach der Art der MWST-Abrechnung (vereinnahmtes oder vereinbartes Entgelt) sowie allfälligen Sonderfällen (ausgenommene Umsätze, Saldosätze usw.)
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: konzept-ki-revisionsagent-2026__c008-1
    zitat: 'Kennzeichnung: EP = Einzelfallprüfung, WP = Wirtschaftsprüfer.'
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: hwp-bur-2023__rz-0359-s149
    zitat: Dabei wird auf eine Erfassung der Vorsteuern verzichtet.
  - quelle: hwp-bur-2023__rz-0370-s151
    zitat: Dieser Sachverhalt ist im Anhang der Jahresrechnungen der Gruppenmitglieder offenzulegen
  - quelle: ph-20-mwst-2016__c011-5
    zitat: Offenlegung allfällige aktuelle oder frühere Zugehörigkeit
  - quelle: mwstv__art-77
    zitat: die Gruppenbesteuerung nach Artikel 13 MWSTG anwenden
- id: M2-103
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung; sonst «nicht bearbeitet – WP-Schritt», Hinweise aus M2-101/301/305 nur als Notiz «Schlussbesprechung»/Pendenz. Weiter gehend
    (SER Anh. D n): nur bei Hinweisen auf wesentliche Fehlaussagen/erhöhtem inhärentem Risiko; begründen. Auf Anweisung: Antwort zu Privatanteilen und Auslandsbezügen mit Privatanteilsbuchungen
    und Kreditoren im Ausland plausibilisieren; M2-304/M2-405 nur falls vom WP angewiesen.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Buchungen Privatanteile (Fahrzeug/Spesen)
  - Liste Kreditoren mit Sitz im Ausland
  - MWST-Abrechnungen (Bezugsteuer, Privatanteile)
  rechnen: ''
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: Privatanteile oder Auslandsbezüge vorhanden, aber nicht mit MWST abgerechnet, oder Antwort fehlt bzw. ist unplausibel.'
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: Befragung der Unternehmensleitung, ob der Privatanteil von Geschäftsaufwendungen und Dienstleistungsbezug aus dem Ausland mit MWST abgerechnet ist
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: ph-20-mwst-2016__c004-2
    zitat: dass sich in der Schweiz eine Abrechnungspflicht auch bei Bezug von Leistungen von Unternehmen aus dem Ausland ergibt
  - quelle: hwp-er-2026__rz-0102-s197
    zitat: Der Abschlussprüfer würdigt die erhaltenen Auskünfte in jedem Fall kritisch.
- id: M2-104
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung; sonst «nicht bearbeitet – WP-Schritt», Hinweise aus M2-101/301/305 nur als Notiz «Schlussbesprechung»/Pendenz. Weiter gehend
    (SER Anh. D n): nur bei Hinweisen auf wesentliche Fehlaussagen/erhöhtem inhärentem Risiko; begründen. Auf Anweisung: Antwort zu Branchenspezifika (Handel, Auslandslieferungen), Rulings,
    ESTV-Kontrollen (3 Jahre), Verfahren und offenen Perioden mit M-Files-Unterlagen abgleichen.'
  nachweise:
  - Schriftliche Antwort der Unternehmensleitung
  - Rulings, Bewilligungen, Korrespondenz ESTV
  - Kontrollberichte/Einschätzungsmitteilungen ESTV
  - Abklärungen MWST-Registrierung im Ausland
  rechnen: ''
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: branchenspezifische Risiken oder ESTV-Auflagen ohne Abklärung/Umsetzung, Nachforderungen offener Perioden ohne Rückstellung,
    oder Antwort fehlt.'
  fundstellen:
  - quelle: ser-2022__anh-d-s090-1
    zitat: Befragung der Unternehmensleitung nach branchenspezifischen MWST-Eigenheiten und entsprechenden Abklärungen, Unterlagen und Vereinbarungen mit der Steuerverwaltung
  - quelle: ser-2022__anh-d-s089-2
    zitat: Befragung, ob eine Steuerrevision, andere Nachforschungen oder Rückfragen seitens der Steuerbehörden stattgefunden haben
  - quelle: ser-2022__anh-d-s089-2
    zitat: Befragung, inwieweit Steuerveranlagungen definitiv sind
  - quelle: ph-20-mwst-2016__c011-4
    zitat: Fand in den drei letzten, der Prüfungsperiode / vorangegangenen Jahren eine Revision durch die Steuerbehörde oder einen externen Berater statt?
  - quelle: ph-20-mwst-2016__c011-3
    zitat: Werden im Ausland Direktlieferungen oder Reihengeschäfte ausgeführt?
  - quelle: ser-2022__anh-d-s093-1
    zitat: Einsichtnahme in Berichte von anderen Prüfern (AHV, SUVA, MWST usw.)
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
- id: M2-301
  vorgehen: 'Salden aller MWST-Konten per Stichtag (Vorsteuer, Umsatzsteuer, Abrechnungskonto, Einfuhrsteuer) aus der Saldoliste erfassen und mit Zahllast/Guthaben der letzten Abrechnung
    sowie offener Vorperioden abgleichen; Zahlung im Folgejahr prüfen. Massgebend ist der Nettosaldo gegenüber der ESTV, nicht der Saldo eines einzelnen Kontos. Abweichungen, Restsaldi
    und Bilanzausweis (Saldogrösse gegenüber ESTV, übrige kurzfristige Forderungen/Verbindlichkeiten) im Textfeld dokumentieren. Abstimmung je Quartal (M2-303) nur falls vom WP angewiesen.
    Abrechnung nach vereinnahmten Entgelten: MWST auf offenen Debitoren/Kreditoren ist noch nicht deklariert (Art. 40 Abs. 2 MWSTG) → als Überleitungsposten erklären, nicht als Differenz
    werten. MWST-Gruppenmitglied: mit der internen MWST-Abrechnung (Art. 21 Abs. 2 MWSTV) und dem Kontokorrent Gruppenträger (Praxis/intern) abstimmen.'
  nachweise:
  - Saldoliste 31.12.
  - Kontoblätter MWST-Konten
  - MWST-Abrechnung letzte Periode inkl. Zahlungsbeleg
  rechnen: Σ Salden MWST-Konten (Umsatzsteuer – Vorsteuer ± Abrechnungskonto) = Zahllast bzw. Guthaben gemäss Abrechnung(en) der offenen Perioden; Differenz = 0
  feststellung_wenn: Summe aller MWST-Konten (Umsatzsteuer, Vorsteuer, Abrechnungs-, Einfuhrsteuerkonto) weicht von Zahllast/Guthaben der offenen Abrechnung(en) ab, unerklärte Restsaldi
    aus Vorperioden, Abrechnung fehlt oder Nettosaldo in falscher Bilanzposition. KEINE Feststellung, wenn einzelne MWST-Konten (z.B. «Geschuldete MWST») 0 zeigen und die Zahllast im
    Abrechnungskonto steht; keine Umbuchung zwischen MWST-Konten derselben Bilanzposition vorschlagen (Praxis/intern).
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Abstimmung der MWST-Forderungen und -Verbindlichkeiten mit den Abrechnungen
  - quelle: hwp-bur-2023__rz-0163-s193
    zitat: aus der Mehrwertsteuerpflicht eine Forderung oder Verbindlichkeit, die dem Saldo geschuldeter Umsatzsteuern abzüglich erbrachter Vorsteuern entspricht
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
  - quelle: mwstg__art-40
    zitat: Im Falle der Abrechnung nach vereinnahmten Entgelten entsteht der Anspruch auf Vorsteuerabzug im Zeitpunkt der Bezahlung. Die Umsatzsteuerschuld entsteht mit der Vereinnahmung
      des Entgelts.
  - quelle: mwstv__art-21
    zitat: Jedes Mitglied muss eine interne Mehrwertsteuerabrechnung erstellen, die in der Abrechnung der Mehrwertsteuergruppe zu konsolidieren ist.
- id: M2-302
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung; sonst «nicht bearbeitet – WP-Schritt», Hinweise aus M2-101/301/305 nur als Notiz «Schlussbesprechung»/Pendenz. Weiter gehend
    (SER Anh. D n): nur bei Hinweisen auf wesentliche Fehlaussagen/erhöhtem inhärentem Risiko; begründen. Auf Anweisung: Umsatzabstimmung mit Ertragskonten (inkl. betriebsfremd/a.o.,
    Anlageverkäufe, gruppenintern) und Überleitungsposten (Art. 128 Abs. 2 MWSTV) nachvollziehen.'
  nachweise:
  - Umsatzabstimmung des Kunden
  - Saldoliste Erfolgsrechnung
  - MWST-Abrechnungen aller Perioden
  - Belege zu Überleitungsposten
  rechnen: 'Σ Ertragskonten Fibu ± Überleitungsposten = Σ deklarierter Umsatz (Ziff. 200) aller Perioden; Restdifferenz = 0; bei SSS: deklarierte Steuer = Σ steuerbare Entgelte inkl.
    Steuer × bewilligter SSS (Art. 37 Abs. 2 MWSTG)'
  feststellung_wenn: 'Nur bei Bearbeitung auf Anweisung: unerklärte Differenz Fibu ↔ deklarierter Umsatz, Umsatzabstimmung fehlt oder steuerbare Umsätze (z.B. Anlageverkäufe) nicht deklariert.'
  fundstellen:
  - quelle: ser-2022__anh-d-s089-1
    zitat: Nachvollzug der MWST-Umsatzabstimmung
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: mwstv__art-128-t1
    zitat: Aus der Umsatzabstimmung muss ersichtlich sein, wie die Deklaration für die Steuerperiode unter Berücksichtigung der verschiedenen Steuersätze
  - quelle: mwstv__art-128-t2
    zitat: die konzerninternen Verrechnungen, die nicht im Betriebsumsatz enthalten sind
  - quelle: hwp-bur-2023__rz-0366-s150
    zitat: Bei Nichtberücksichtigen dieser Anforderungen besteht die Gefahr, dass die Umsatzabstimmung nicht lückenlos erstellt werden kann, was eine Nachdeklaration erfordern kann.
  - quelle: hwp-bur-2023__rz-0369-s151
    zitat: Solche gruppeninternen Umsätze sind buchmässig separat zu erfassen
  - quelle: mwstg__art-37
    zitat: wird die Steuerforderung durch Multiplikation des Totals aller in einer Abrechnungsperiode erzielten steuerbaren Entgelte, einschliesslich Steuer, mit dem von der ESTV bewilligten
      Saldosteuersatz ermittelt
- id: M2-303
  vorgehen: 'WP-Schritt: nur auf ausdrückliche Anweisung; sonst «nicht bearbeitet – WP-Schritt», Hinweise aus M2-101/301/305 nur als Notiz «Schlussbesprechung»/Pendenz. Weiter gehend
    (SER Anh. D n): nur bei Hinweisen auf wesentliche Fehlaussagen/erhöhtem inhärentem Risiko; begründen. Auf Anweisung: Kontoblätter Vorsteuer/Umsatzsteuer je Quartal auf Übertrag (Saldo
    0) und Übereinstimmung mit der Abrechnung prüfen, Zahlung der Zahllast nachvollziehen.'
