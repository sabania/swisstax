  quelle: mwstg__art-26
  zitat: den anwendbaren Steuersatz und den vom Entgelt geschuldeten Steuerbetrag
- thema: 'Vorsteuerabzug: Inlandsteuer, Bezugsteuer, Einfuhrsteuer (Art. 28 Abs. 1 MWSTG)'
  quelle: mwstg__art-28
