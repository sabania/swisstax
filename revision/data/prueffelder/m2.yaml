  quelle: mwstg__art-30
  zitat: so hat sie den Vorsteuerabzug nach dem Verhältnis der Verwendung zu korrigieren
- thema: Bezugsteuer auf Dienstleistungen aus dem Ausland (Art. 45 Abs. 1 MWSTG), zitiert nach HWP BuR
  quelle: hwp-bur-2023__rz-0362-s149
  zitat: Das Mehrwertsteuergesetz (Art. 45 Abs. 1 MWSTG) regelt die Besteuerung des Bezugs von Dienstleistungen von Unternehmen mit Sitz im Ausland (Bezugsteuer).
- thema: 'Saldosteuersatzmethode: Grenzen CHF 5 024 000 Umsatz / CHF 108 000 Steuern (Art. 37 Abs. 1 MWSTG)'
  quelle: mwstg__art-37
  zitat: jährlich nicht mehr als 5 024 000 Franken Umsatz aus steuerbaren Leistungen erzielt und im gleichen Zeitraum nicht mehr als 108 000 Franken Steuern
- thema: 'Saldosteuersatzmethode: Antrag, Bindung eine Steuerperiode, Wechsel aus effektiver Methode frühestens nach drei Jahren (Art. 37 Abs. 4 MWSTG)'
  quelle: mwstg__art-37
  zitat: so kann sie frühestens nach drei Jahren zur Saldosteuersatzmethode wechseln
- thema: Meldeverfahren bei Übertragung eines Gesamt- oder Teilvermögens (Art. 38 Abs. 1 MWSTG)
  quelle: mwstg__art-38
  zitat: so hat die steuerpflichtige Person ihre Abrechnungs- und Steuerentrichtungspflicht in den folgenden Fällen durch Meldung zu erfüllen
- thema: Gruppenbesteuerung (Art. 13 MWSTG), zitiert nach HWP BuR
  quelle: hwp-bur-2023__rz-0368-s151
  zitat: auf Antrag gemeinsam als eine einzige steuerpflichtige Person – eine Mehrwertsteuergruppe – behandelt zu werden (Art. 13 MWSTG)
- thema: Mithaftung der Gruppenmitglieder (Art. 15 Abs. 1 lit. c MWSTG)
  quelle: mwstg__art-15-t1
  zitat: jede zu einer Mehrwertsteuergruppe (Art. 13) gehörende Person oder Personengesellschaft, mit Ausnahme von Vorsorgeeinrichtungen, für sämtliche von der Gruppe geschuldeten Steuern
- thema: Nach Austritt Haftung nur für Steuerforderungen aus eigener Tätigkeit (Art. 15 Abs. 1 lit. c MWSTG)
  quelle: mwstg__art-15-t1
  zitat: tritt eine Person oder Personengesellschaft aus der Gruppe aus, so haftet sie nur noch für die Steuerforderungen, die sich aus ihren eigenen unternehmerischen Tätigkeiten ergeben
    haben
- thema: Mithaftung für alle während der Zugehörigkeit entstandenen Steuer-, Zins- und Kostenforderungen, ausgenommen Bussen (Art. 22 Abs. 1 MWSTV)
  quelle: mwstv__art-22
  zitat: Die Mithaftung eines Mitglieds einer Mehrwertsteuergruppe erstreckt sich auf alle Steuer-, Zins- und Kostenforderungen, die während dessen Zugehörigkeit zur Gruppe entstehen,
    ausgenommen Bussen.
- thema: Kein Entzug der Mithaftung durch Austritt bei Betreibung, Einschätzungsmitteilung oder angekündigter Kontrolle (Art. 22 Abs. 2 MWSTV)
  quelle: mwstv__art-22
  zitat: Wurde gegenüber einem Gruppenmitglied eine Betreibung eingeleitet, bei der Gruppenvertretung eine Steuernachforderung mittels Einschätzungsmitteilung geltend gemacht oder wurde
    eine Kontrolle angekündigt, so kann sich ein Gruppenmitglied nicht durch Austritt aus der Gruppe der Mithaftung entziehen.
- thema: Saldo-/Pauschalsteuersatzmethode (Art. 37 MWSTG), zitiert nach HWP BuR
  quelle: hwp-bur-2023__rz-0359-s149
  zitat: haben die Möglichkeit, nach der Saldo- bzw. Pauschalsteuersatzmethode abzurechnen (Art. 37 MWSTG)
- thema: 'Saldosteuersatzmethode: Steuer = Σ steuerbare Entgelte inkl. Steuer × von der ESTV bewilligter SSS (Art. 37 Abs. 2 MWSTG)'
  quelle: mwstg__art-37
  zitat: wird die Steuerforderung durch Multiplikation des Totals aller in einer Abrechnungsperiode erzielten steuerbaren Entgelte, einschliesslich Steuer, mit dem von der ESTV bewilligten
    Saldosteuersatz ermittelt
- thema: 'SSS je Branche: Tabelle im Anhang der VO Saldosteuersätze – nur zur Plausibilisierung; massgebend ist der bewilligte Satz (Art. 84 Abs. 1 MWSTV)'
  quelle: estv-vo-sss__art-1
  zitat: Die Saldosteuersätze (SSS) nach Branchen und Tätigkeiten richten sich nach der Tabelle im Anhang.
- thema: VO Saldosteuersätze in Kraft seit 1.1.2025 (Art. 3 VO Saldosteuersätze)
  quelle: estv-vo-sss__art-3
  zitat: Diese Verordnung tritt am 1. Januar 2025 in Kraft.
- thema: Massgebend ist der von der ESTV bewilligte Saldosteuersatz (Art. 84 Abs. 1 MWSTV)
  quelle: mwstv__art-84
  zitat: Steuerpflichtige Personen müssen ihre Tätigkeiten zu den von der ESTV bewilligten Saldosteuersätzen abrechnen.
- thema: 'Mehrere SSS: Erträge je SSS separat verbuchen (Art. 84 Abs. 3 MWSTV)'
  quelle: mwstv__art-84
  zitat: Steuerpflichtige Personen, denen mehrere Saldosteuersätze bewilligt wurden, müssen die Erträge für jeden dieser Saldosteuersätze separat verbuchen.
- thema: SSS ausgeschlossen bei Gruppenbesteuerung (Art. 77 Abs. 2 lit. c MWSTV)
  quelle: mwstv__art-77
  zitat: die Gruppenbesteuerung nach Artikel 13 MWSTG anwenden
- thema: Bezugsteuer bei SSS zum gesetzlichen Steuersatz (Art. 91 MWSTV)
  quelle: mwstv__art-91
  zitat: müssen die Bezugsteuer in der entsprechenden Abrechnungsperiode zum hierfür geltenden gesetzlichen Steuersatz entrichten
risiken:
- text: MWST-Salden (Vorsteuer, Umsatzsteuer, Abrechnungskonto) stimmen nicht mit den Abrechnungen überein; Restsaldi aus Vorperioden, falscher Bilanzausweis der Forderung/Verbindlichkeit
    gegenüber der ESTV.
  pruefziele:
