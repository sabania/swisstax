bewertung:
- regel: 'Effektive Methode: MWST ist Durchlaufposten; Umsatzsteuer auf Passivkonto, Vorsteuern getrennt auf Aktivkonten (Material/DL bzw. Investitionen/übriger Betriebsaufwand).'
  quelle: hwp-bur-2023__rz-0356-s148
  zitat: Die Mehrwertsteuer hat bei der effektiven Abrechnungsmethode grundsätzlich den Charakter eines Durchlaufpostens.
- regel: 'Netto- oder Bruttomethode: Umsatz- und Vorsteuer spätestens per Ende der Abrechnungsperiode auf die Bestandeskonten übertragen.'
  quelle: hwp-bur-2023__rz-0357-s148
  zitat: Wird nach der Bruttomethode vorgegangen, gehen Umsatzsteuer und Vorsteuer zunächst in die Ertrags- und Aufwandskonten
- regel: Nicht abzugsberechtigte Vorsteuern (Vorsteuerkorrektur/-kürzung) per Periodenende in den Aufwand bzw. auf das Anlagekonto zurückübertragen; bei direkter Methode (Immobilien)
    objektmässig zuordnen.
  quelle: hwp-bur-2023__rz-0358-s148
  zitat: Wendet das Unternehmen eine direkte Vorsteuerkorrekturmethode an, was insbesondere bei Immobilien zutreffend ist
- regel: 'Saldosteuersatzmethode: nur Passivkonto Umsatzsteuer, keine Vorsteuerkonten; Aufwand brutto; Ertragsarten mit unterschiedlichen Saldosteuersätzen auf separaten Ertragskonten.'
  quelle: hwp-bur-2023__rz-0360-s149
  zitat: Die Aufwendungen werden immer brutto inklusive der darauf lastenden Vorsteuern erfasst.
- regel: 'Bezugsteuer: Umsatzsteuer auf Passivkonto, Gegenkonto Vorsteuer (bei Abzugsberechtigung) oder Aufwand-/Bilanzkonto.'
  quelle: hwp-bur-2023__rz-0363-s150
  zitat: Gegenkonto ist bei einer Vorsteuerabzugsberechtigung das Aktivkonto Vorsteuer, andernfalls dasjenige Aufwand- oder Bilanzkonto
- regel: 'Fremdwährung: Buchungen auf Vorsteuer- und Umsatzsteuerkonten zu einem von der ESTV publizierten Kurs (Konzernkurs zulässig).'
  quelle: hwp-bur-2023__rz-0364-s150
  zitat: unter Verwendung eines zulässigen, von der Eidgenössischen Steuerverwaltung publizierten Umrechnungskurses zu erfolgen
- regel: Gegenüber der ESTV ist eine Verrechnung zur Saldogrösse (Umsatzsteuer abzüglich Vorsteuer) geboten; Ausweis als übrige kurzfristige Forderung bzw. Verbindlichkeit.
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: aus der Mehrwertsteuerpflicht eine Forderung oder Verbindlichkeit, die dem Saldo geschuldeter Umsatzsteuern abzüglich erbrachter Vorsteuern entspricht
- regel: Umsatz netto ohne MWST ausweisen.
  quelle: hwp-bur-2023__rz-0750-s317-t2
  zitat: Umsatzsteuern wie die Mehrwertsteuer sind nicht als Umsatz auszuweisen
- regel: Nicht rückforderbare MWST ist Bestandteil der Anschaffungskosten.
  quelle: hwp-bur-2023__rz-0218-s207
  zitat: nicht rückforderbare Mehrwertsteuern
- regel: 'Bruttoprinzip: Leistungen (auch Tausch, konzerninterne Verrechnungen) brutto erfassen; keine Erträge aus Weiterverrechnungen auf Aufwandkonten.'
  quelle: hwp-bur-2023__rz-0366-s150
  zitat: Im Weiteren sollten auf Aufwandskonten keine Erträge aus Weiterverrechnungen erfasst werden.
- regel: 'Nutzungsänderung: Änderungen von Vorsteuerguthaben/-korrekturen spätestens bei Deklarationspflicht auf den Bilanzkonten erfassen; Gegenkonto primär betroffenes Aktivum.'
  quelle: hwp-bur-2023__rz-0372-s152
  zitat: sind spätestens zum Zeitpunkt der Deklarationspflicht den entsprechenden Bilanzkonten zu belasten bzw. gutzuschreiben
- regel: 'MWST-Gruppe: Solidarhaftung für die während der Mitgliedschaft entstandenen MWST-Schulden im Anhang offenlegen (Art. 959c Abs. 2 Ziff. 10 OR); nach Austritt Haftung nur noch
    für Forderungen aus eigener Tätigkeit, ausser bei Betreibung, Einschätzungsmitteilung oder angekündigter Kontrolle (Art. 22 Abs. 2 MWSTV).'
  quelle: hwp-bur-2023__rz-0370-s151
  zitat: Dieser Sachverhalt ist im Anhang der Jahresrechnungen der Gruppenmitglieder offenzulegen
- regel: 'MWST-Gruppe: Offenlegung auch bei früherer Zugehörigkeit (PH 20, Anhang 2 B3).'
  quelle: ph-20-mwst-2016__c011-5
  zitat: Offenlegung allfällige aktuelle oder frühere Zugehörigkeit
- regel: 'MWST-Gruppe (Solidarschuld): Praxis oft verbale Darstellung des Sachverhalts statt Angabe eines Betrags.'
  quelle: hwp-bur-2023__rz-0855-s351-t3
  zitat: behilft sich die Praxis häufig mit einer lediglich verbalen Darstellung des Sachverhalts anstelle der Angabe eines Betrags
- regel: 'MWST-Gruppe: gruppeninterne Umsätze buchmässig separat erfassen und in der Umsatzabstimmung des Mitglieds berücksichtigen.'
  quelle: hwp-bur-2023__rz-0369-s151
  zitat: Solche gruppeninternen Umsätze sind buchmässig separat zu erfassen
- regel: 'Rückstellungsbedarf für MWST-Nachforderungen aus allen noch nicht rechtskräftig festgesetzten bzw. nicht verjährten Steuerperioden beurteilen (Art. 960e Abs. 2 OR): Festsetzungsverjährung
    grundsätzlich 5 Jahre (Art. 42 Abs. 1 MWSTG); unterbrochen u.a. durch Einschätzungsmitteilung, Verfügung oder Ankündigung einer ESTV-Kontrolle, danach neue Frist von 2 Jahren (Abs.
    2/3); absolut 10 Jahre (Abs. 6). Erkannte Mängel solcher Perioden muss das Unternehmen korrigieren (Art. 72 Abs. 2 MWSTG).'
  quelle: mwstg__art-42
  zitat: Das Recht, eine Steuerforderung festzusetzen, verjährt fünf Jahre nach Ablauf der Steuerperiode
- regel: 'MWST-Risiken aus Verfahren: Rückstellung (Art. 960e Abs. 2 OR); Eventualverbindlichkeit im Anhang nur, wenn der Mittelabfluss unwahrscheinlich oder ausnahmsweise nicht verlässlich
    schätzbar ist (Art. 959c Abs. 2 Ziff. 10 OR).'
  quelle: hwp-bur-2023__rz-0516-s261
  zitat: Nur in Ausnahmefällen kann die Verpflichtungshöhe nicht zuverlässig bestimmt werden.
- regel: Zusatz mit weiteren Informationen (SER Ziff. 8.3.2.2) nur bei völlig offenem Verfahrensausgang UND angemessener Offenlegung im Anhang; ersetzt keine fehlende Rückstellung/Offenlegung
    (Entscheid WP).
  quelle: ser-2022__8-3-2-t3
  zitat: dies immer unter der Voraussetzung, dass der Ausgang der hängigen Situation völlig offen ist
- regel: 'Voraussetzung des Zusatzes (vorheriger Punkt): angemessene Offenlegung des Sachverhalts im Anhang (HWP ER Rz 139).'
  quelle: hwp-er-2026__rz-0139-s204-t4
  zitat: falls eine angemessene Offenlegung des Sachverhalts im Anhang erfolgt (objektive Unüberprüfbarkeit)
- regel: 'Fehlen Rückstellung bzw. Offenlegung: dem WP als Hinweis vorlegen; der WP ermisst den möglichen Fehlbetrag und entscheidet über die Prüfungsaussage.'
  quelle: hwp-er-2026__rz-0139-s204-t3
  zitat: muss er ermessen, wie hoch der Fehlbetrag sein könnte
- regel: 'Ergänzend (PH 20, Abschlussprüfung nach PS): Auseinandersetzung mit der Steuerbehörde kann wesentliche Unsicherheit begründen; PS-Begriffe «Absatz zur Hervorhebung»/«Vermerk»
    nicht für den SER-Bericht übernehmen.'
  quelle: ph-20-mwst-2016__c008-1
  zitat: Bei einer Auseinandersetzung zwischen Unternehmen und Steuerbehörden kann eine wesentliche Unsicherheit über den Verfahrensausgang bestehen.
fallstricke:
- text: 'Rollenverteilung: WP-Schritte (M2-102, M2-103, M2-104, M2-302, M2-303, M2-304) nur auf ausdrückliche Anweisung vorbereiten; ohne Anweisung kein Textfeld-Eintrag, Status «nicht
    bearbeitet – WP-Schritt», Hinweise nur als Notiz oder Pendenz; Beurteilung immer beim WP.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
- text: 'Sonstige Schritte (4xx: M2-401, M2-402, M2-403, M2-404, M2-405, M2-406, M2-407, M2-408) nur auf Anweisung des WP; ohne Anweisung bleibt der Schritt offen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: SER Anhang D n) empfiehlt für die MWST nur die Abstimmung der Salden mit den Abrechnungen und das Vorhandensein der Umsatzabstimmung; Nachvollzug der Umsatzabstimmung, Abstimmung
    der Abrechnungen mit den Konten und die MWST-Befragungen sind weiter gehend – nur bei Hinweisen auf wesentliche Fehlaussagen oder erhöhtem inhärentem Risiko, Begründung dokumentieren.
  quelle: ser-2022__6-2-3
  zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
- text: Ohne erhöhtes inhärentes Risiko und bei ausreichenden Nachweisen aus den empfohlenen Handlungen keine weiter gehenden MWST-Handlungen vorschlagen.
  quelle: hwp-er-2026__rz-0133-s203
  zitat: Wenn kein erhöhtes inhärentes Risiko vorliegt und die empfohlenen Prüfungshandlungen ausreichende geeignete Prüfungsnachweise liefern, sind keine weitergehenden Prüfungshandlungen
    vorzunehmen.
- text: Saldobestätigungen der ESTV nicht einholen – nicht Bestandteil der eingeschränkten Revision.
  quelle: hwp-er-2026__rz-0134-s203
  zitat: das Einholen von Bestätigungen von Dritten
- text: Keine Suche nach MWST-Gesetzesverstössen und keine Zusicherung zur korrekten MWST-Handhabung; der Agent dokumentiert nur Hinweise mit Bezug zur Jahresrechnung.
  quelle: ser-2022__anh-c-s057-1
  zitat: keine Befragungen oder weiteren Prüfungen zur Aufdeckung von deliktischen Handlungen und weiteren Gesetzesverstössen (z. B. betreffend direkte Steuern, Mehrwertsteuer
- text: «Stichprobe» (M2-403) bedeutet bewusste Auswahl einzelner Elemente, keine repräsentative Stichprobe und keine Hochrechnung.
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: PH 20 ist für die Abschlussprüfung formuliert; Anhang 2 ist nur Arbeitshilfe, keine Pflichtcheckliste für die eingeschränkte Revision.
  quelle: ph-20-mwst-2016__c011-1
  zitat: Die nachstehende Arbeitshilfe ist nicht als Programm oder Checkliste für den Abschlussprüfer gedacht.
- text: 'Umsatzabstimmung des geprüften Jahres liegt bei der Revision oft noch nicht vor: Die Frist endet mit der ordentlichen Deklarationsfrist der Abrechnungsperiode, in die der 180.
    Tag nach Geschäftsabschluss fällt (nicht pauschal «180 Tage»). Dann Abstimmung des Vorjahres einsehen und für das laufende Jahr Pendenz an das Unternehmen.'
  quelle: ph-20-mwst-2016__c003-1
  zitat: Die Frist endet mit der ordentlichen Deklarationsfrist der Abrechnungsperiode, in welche der 180. Tag nach dem letzten Geschäftsabschluss fällt.
- text: Die Umsatzabstimmung muss das Unternehmen erstellen; eine eigene Überleitung des Prüfers ersetzt sie nicht und ist höchstens Analytik auf Anweisung des WP (M2-302 ist WP-Schritt).
  quelle: ph-20-mwst-2016__c011-5
  zitat: Die Umsatzabstimmung ist vom Unternehmen innert 180 Tagen zu erstellen, und allfällige Abweichungen sind zu begründen.
- text: 'Saldo 0 auf Vorsteuer-/Umsatzsteuerkonten bzw. auf «Geschuldete MWST» per 31.12. ist weder Nachweis noch Fehler: Die Zahllast der letzten Periode liegt oft im Abrechnungskonto
    und ist mit der Abrechnung abzustimmen (M2-301).'
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: aus der Mehrwertsteuerpflicht eine Forderung oder Verbindlichkeit, die dem Saldo geschuldeter Umsatzsteuern abzüglich erbrachter Vorsteuern entspricht
- text: 'Bezugsteuer: Verzicht auf buchhalterische Erfassung nur, wenn der Grenzbetrag von CHF 10 000 nicht erreicht und keine Steuerpflicht gegeben ist.'
  quelle: hwp-bur-2023__rz-0362-s149
  zitat: Wird der Grenzbetrag von CHF 10 000 nicht erreicht und ist die Steuerpflicht nicht gegeben (Art. 10 MWSTG), kann auf eine buchhalterische Erfassung verzichtet werden.
- text: Bei Steuerpflicht die Bezugsteuer fortlaufend erfassen (empfohlen), zwingend spätestens per Ende der Abrechnungsperiode.
  quelle: hwp-bur-2023__rz-0363-s150
  zitat: In allen anderen Fällen empfiehlt es sich, die sich aus den Bezügen von Dienstleistungen ergebenden Umsatzsteuern fortlaufend auf einem Passivkonto Umsatzsteuer zu erfassen.
- text: 'Saldosteuersatzmethode: Vorsteuerkonten entfallen; Vorsteuerprüfungen (M2-401, M2-403, M2-406 sowie der Vorsteuerkorrektur-Teil von M2-407) entfallen; Einfuhrsteuer ist Aufwand;
    stattdessen Ertragsarten je Saldosteuersatz auf separaten Ertragskonten prüfen.'
  quelle: hwp-bur-2023__rz-0360-s149
  zitat: Die Aktivkonten «Vorsteuer» entfallen.
- text: 'Saldosteuersatzmethode: M2-405 bleibt relevant – Bezugsteuer ist zum gesetzlichen Steuersatz (Art. 91 MWSTV) abzurechnen, aber ohne Vorsteuerabzug.'
  quelle: hwp-bur-2023__rz-0362-s149
  zitat: sofern nicht mit der Saldosteuersatz- bzw. Pauschalsteuersatzmethode abgerechnet wird
- text: Befreite Umsätze (Export) führen nicht zu einer Vorsteuerkorrektur, ausgenommene Umsätze schon – nicht verwechseln.
  quelle: treuhand-almanach-2026__s044-2
  zitat: Das Erzielen von befreiten Umsätzen führt zu keiner Vorsteuerkorrektur.
- text: 'Aufbewahrung Immobilienunterlagen (Einlageentsteuerung/Eigenverbrauch): 20 Jahre nach Art. 70 Abs. 3 MWSTG (massgebend); die 25 Jahre in PH 20 (Stand 2016) nicht verwenden.
    Für die eingeschränkte Revision nur Hinweis, keine Feststellung.'
  quelle: mwstg__art-70
  zitat: Geschäftsunterlagen, die im Zusammenhang mit der Berechnung der Einlageentsteuerung und des Eigenverbrauchs von unbeweglichen Gegenständen benötigt werden, sind während 20 Jahren
    aufzubewahren
- text: 'Steuersätze nicht aus Vorjahren übernehmen: seit 1.1.2024 Normalsatz 8,10 %, reduzierter Satz 2,60 %, Sondersatz Beherbergung 3,80 % (relevant für M2-305 a). Sätze vor 2024:
    im Wiki nicht belegt.'
  quelle: treuhand-almanach-2026__s047-1
  zitat: Gültig seit 1. Januar 2024 Kategorien Aktueller Satz Reduzierter Satz 2,60 % Sondersatz für Beherbergung 3,80 % Normalsatz 8,10 %
- text: Saldosteuersatzmethode nur mit Bewilligung der ESTV und innerhalb der Grenzen von Art. 37 Abs. 1 MWSTG; Wechsel aus der effektiven Methode frühestens nach drei Jahren – Methode
    nur gemäss Abrechnung und Bewilligung annehmen.
  quelle: mwstg__art-37
  zitat: so kann sie frühestens nach drei Jahren zur Saldosteuersatzmethode wechseln
- text: Katalogverweis «RZ 958 MWStG» in M2-302 ist im Wiki nicht auffindbar; gesetzliche Grundlage der Umsatzabstimmung ist Art. 128 Abs. 2 MWSTV.
  quelle: mwstv__art-128-t1
  zitat: Aus der Umsatzabstimmung muss ersichtlich sein, wie die Deklaration für die Steuerperiode unter Berücksichtigung der verschiedenen Steuersätze
- text: 'Befragungen kann der Agent nicht selbst führen: Antworten nur aus schriftlichen Unterlagen auswerten, sonst Pendenz; bei wesentlichen Posten Befragung mit Analytik/Detailprüfung
    ergänzen.'
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Schnittstellen (Praxis/intern): M2-301 ist die massgebende MWST-Saldenabstimmung; M1-301 (Abrechnungskonto, nur Bestand) und D1-302 f (Vorsteuer-/MWST-Guthaben) übernehmen das
    Ergebnis als Verweis, keine zweite Feststellung zum selben Sachverhalt; MWST-Zahlungen in neuer Rechnung gehören zu M2 (nicht S1).'
fragen_kunde:
- frage: Liegt die Umsatzabstimmung (Finanzbuchhaltung ↔ deklarierte MWST-Abrechnungen) und die Vorsteuerabstimmung für das Geschäftsjahr bzw. das Vorjahr vor? Wer hat sie erstellt,
    wie wurden Differenzen begründet und wurde eine Korrekturabrechnung eingereicht?
  zweck: 'M2-101 (EP): Vorhandensein der Umsatzabstimmung; Nachvollzug (M2-302) nur auf Anweisung des WP'
- frage: Nach welcher Methode wird abgerechnet (effektiv oder Saldo-/Pauschalsteuersatz), nach vereinbartem oder vereinnahmtem Entgelt, in welcher Periodizität? Ist oder war die Gesellschaft
    Mitglied einer MWST-Gruppe?
  zweck: 'M2-102 (WP-Schritt: nur auf Anweisung, sonst Pendenz-Vorschlag); Anhangangabe MWST-Gruppe'
- frage: Werden Umsätze zum reduzierten oder Sondersatz, steuerbefreite Umsätze (Export) oder von der Steuer ausgenommene Umsätze (z.B. Vermietung, Geld- und Kapitalverkehr) erzielt?
    Wurde für ausgenommene Umsätze optiert?
  zweck: M2-305 a/b/e; M2-102 und M2-407 nur auf Anweisung des WP
