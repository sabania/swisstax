  - VO
  - BE
  - DO
  quelle: ph-20-mwst-2016__c002-1
  zitat: (Ausweis der Steuerforderungen und/oder -verbindlichkeiten; Rückstellungen für MWST-Risiken)
- text: Umsätze gemäss Finanzbuchhaltung nicht vollständig deklariert (Umsatzabstimmung fehlt oder ist lückenhaft) → Nachdeklaration/Nachforderung ohne Rückstellung.
  pruefziele:
  - VO
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0366-s150
  zitat: Bei Nichtberücksichtigen dieser Anforderungen besteht die Gefahr, dass die Umsatzabstimmung nicht lückenlos erstellt werden kann, was eine Nachdeklaration erfordern kann.
- text: Privatanteile von Geschäftsaufwendungen oder Dienstleistungsbezüge aus dem Ausland (Bezugsteuer) nicht mit MWST abgerechnet.
  pruefziele:
  - VO
  - BE
  quelle: ser-2022__anh-d-s090-1
  zitat: ob der Privatanteil von Geschäftsaufwendungen und Dienstleistungsbezug aus dem Ausland mit MWST abgerechnet ist
- text: 'Vorsteuer zu hoch geltend gemacht: fehlende Vorsteuerkorrektur/-kürzung bei ausgenommenen Umsätzen oder gemischter Verwendung.'
  pruefziele:
  - BE
  - RI
  quelle: hwp-bur-2023__rz-0358-s148
  zitat: Bei nicht oder nur teilweise abzugsberechtigten Vorsteuern (Vorsteuerkorrekturen und Vorsteuerkürzung) ist am Ende der Abrechnungsperiode eine Rückübertragung in den Aufwand
- text: 'Vorsteuer auf Belegen geltend gemacht, die nicht auf die Gesellschaft lauten oder die Rechnungsangaben nach Art. 26 Abs. 2 MWSTG (u.a. MWST-Nr. des Leistungserbringers, Empfänger,
    Steuersatz/-betrag) nicht enthalten (fehlende Einzelangabe = Formmangel: Hinweis, Beurteilung WP; fehlende Identifikation der Gesellschaft = möglicher Fehler).'
  pruefziele:
  - EX
  - BE
  - RI
  quelle: mwstg__art-26
  zitat: den Hinweis, dass er oder sie im Register der steuerpflichtigen Personen eingetragen ist, sowie die Nummer
- text: Falsche Qualifikation der Umsätze (steuerbar/befreit/ausgenommen) oder falscher Steuersatz; Steuerbefreiung (Export) ohne ausreichenden Nachweis.
  pruefziele:
  - BE
  - RI
  - VO
  quelle: ph-20-mwst-2016__c004-2
  zitat: Der Steuerpflichtige muss seine Mittelzuflüsse anhand der gesetzlichen Bestimmungen mehrwertsteuerlich korrekt qualifizieren (z.B. steuerbar oder ausgenommen).
- text: Nachforderungen aus ESTV-Kontrollen, Rückfragen oder hängigen Verfahren nicht zurückgestellt; mehrere noch nicht rechtskräftig festgesetzte Steuerperioden kumulieren das Risiko.
  pruefziele:
  - VO
  - BE
  - DO
  quelle: ph-20-mwst-2016__c006-2
  zitat: Bei der Beurteilung der Wesentlichkeit sind die noch nicht rechtskräftig festgesetzten Steuerforderungen und/oder -verbindlichkeiten der abgeschlossenen Steuerperioden heranzuziehen
- text: Steuerpflicht im Ausland (Direktlieferungen, Reihengeschäfte, Handel) nicht abgeklärt → ausländische MWST-Nachforderungen ohne Rückstellung.
  pruefziele:
  - VO
  - BE
  quelle: ph-20-mwst-2016__c011-3
  zitat: Werden im Ausland Direktlieferungen oder Reihengeschäfte ausgeführt?
- text: MWST als Umsatz ausgewiesen (Brutto- statt Nettoerlös) oder Umsatzsteuer und Vorsteuer unzulässig mit anderen Posten verrechnet.
  pruefziele:
  - DO
  - BE
  quelle: hwp-bur-2023__rz-0750-s317-t2
  zitat: Umsatzsteuern wie die Mehrwertsteuer sind nicht als Umsatz auszuweisen
- text: 'MWST-Gruppe: Solidarhaftung aus aktueller oder früherer Mitgliedschaft nicht im Anhang offengelegt.'
  pruefziele:
  - RV
  - DO
  quelle: ph-20-mwst-2016__c011-5
