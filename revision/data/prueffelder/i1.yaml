kurzbeschrieb: 'Immaterielle Werte (Software, Lizenzen, Patente, Marken, aktivierte Entwicklungen, derivativer Goodwill) inkl. Abschreibungen sowie nicht einbezahltes Grundkapital. Eingeschränkte
  Revision: Befragung zu Aktivierung, Bewertung und Stetigkeit, VJ-Vergleich, Abstimmung Anlagespiegel/Hauptbuch/Bilanz/ER, Verträge der Zugänge, Werthaltigkeit, Anhang, stille Reserven.
  Keine Bewertungsgutachten.'
gesetz:
- thema: 'Mindestgliederung: immaterielle Werte im Anlagevermögen (Art. 959a Abs. 1 Ziff. 2 lit. d OR)'
  quelle: or__art-959a-t1
  zitat: d. immaterielle Werte,
- thema: 'Mindestgliederung: nicht einbezahltes Grundkapital als eigene Position (Art. 959a Abs. 1 Ziff. 2 lit. e OR)'
  quelle: or__art-959a-t1
  zitat: e. nicht einbezahltes Grund-, Gesellschafter- oder Stiftungskapital.
- thema: Aktivierungsvoraussetzungen (Art. 959 Abs. 2 OR)
  quelle: or__art-959
  zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist
- thema: Aktivierungsverbot für andere Vermögenswerte (Art. 959 Abs. 2 OR)
  quelle: or__art-959
  zitat: Andere Vermögenswerte dürfen nicht bilanziert werden.
- thema: Zuordnung zum Anlagevermögen (Art. 959 Abs. 3 OR)
  quelle: or__art-959
  zitat: Als Anlagevermögen müssen alle übrigen Aktiven bilanziert werden.
- thema: Höchstwert bei Ersterfassung (Art. 960a Abs. 1 OR)
  quelle: or__art-960a
  zitat: Bei ihrer Ersterfassung müssen die Aktiven höchstens zu den Anschaffungs- oder Herstellungskosten bewertet werden.
- thema: Höchstwert in der Folgebewertung (Art. 960a Abs. 2 OR)
  quelle: or__art-960a
  zitat: In der Folgebewertung dürfen Aktiven nicht höher bewertet werden als zu den Anschaffungs- oder Herstellungskosten.
- thema: Abschreibungen und Wertberichtigungen, aktivseitig abzusetzen (Art. 960a Abs. 3 OR)
  quelle: or__art-960a
  zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen, anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden.
- thema: Zusätzliche Abschreibungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet, sofern sie wesentlich sind
- thema: Vorsichtige Bewertung (Art. 960 Abs. 2 OR)
  quelle: or__art-960
  zitat: Die Bewertung muss vorsichtig erfolgen, darf aber die zuverlässige Beurteilung der wirtschaftlichen Lage des Unternehmens nicht verhindern.
- thema: Überprüfung bei Anzeichen einer Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Stetigkeit in Darstellung und Bewertung (Art. 958c Abs. 1 Ziff. 6 OR)
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Bestandsnachweis durch Inventar (Art. 958c Abs. 2 OR)
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- thema: Periodenabgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erfolgsrechnung: Abschreibungen auf Anlagevermögen als Mindestposition (Art. 959b Abs. 2 Ziff. 6 OR)'
  quelle: or__art-959b-t1
  zitat: Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens
- thema: Gesonderter Ausweis wesentlicher weiterer Positionen, z.B. Gewinne/Verluste aus Abgängen (Art. 959b Abs. 5 OR)
  quelle: or__art-959b-t2
  zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
- thema: 'Anhang: angewandte Grundsätze (Art. 959c Abs. 1 Ziff. 1 OR)'
  quelle: or__art-959c-t1
  zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: verpfändete Aktiven / Aktiven unter Eigentumsvorbehalt (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: Erläuterung ausserordentlicher, einmaliger oder periodenfremder Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: 'Nicht voll liberierte Aktien: Einforderung durch VR-Beschluss (Art. 634b Abs. 1 OR)'
  quelle: or__art-634b
  zitat: Der Verwaltungsrat beschliesst die nachträgliche Leistung von Einlagen auf nicht voll liberierte Aktien.
- thema: Mindesteinlage bei Errichtung 20 % je Aktie (Art. 632 Abs. 1 OR)
  quelle: or__art-632
  zitat: Bei der Errichtung der Gesellschaft muss die Einlage für mindestens 20 Prozent des Nennwertes jeder Aktie geleistet sein.
risiken:
- text: Aktivierung nicht aktivierbarer Aufwendungen (Gründungs-, Kapitalerhöhungs-, Organisations-, Schulungs-, Forschungs- oder Restrukturierungskosten) als immaterieller Wert.
  pruefziele:
  - EX
  - BE
  quelle: hwp-bur-2023__rz-0411-s243
  zitat: Nicht aktivierbar sind Gründungs- und Kapitalerhöhungs- oder allgemeine Organisationskosten, Aus- und Weiterbildungskosten des Personals sowie Restrukturierungskosten.
- text: Laufende Lizenz- bzw. SaaS-Gebühren oder Implementierungskosten von Cloud-Lösungen aktiviert, obwohl nur ein Zugang zu einer Dienstleistung besteht.
  pruefziele:
  - EX
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0430-s246
  zitat: Laufende Lizenzzahlungen deuten auf eine Dienstleistung hin und sind im Zeitpunkt
- text: Selbst erarbeitete Werte (Software, Entwicklungen) aktiviert ohne Kostennachweis, ohne konkretes Ergebnis/Marktreife oder ohne gesicherte Finanzierung.
  pruefziele:
  - EX
  - BE
  quelle: hwp-bur-2023__rz-0413-s243
  zitat: Eine Aktivierung setzt voraus, dass entsprechende Fremdleistungen und/oder Eigenaufwendungen nachgewiesen werden
- text: 'Bilanzierte Rechte bestehen nicht (mehr): Lizenz gekündigt/abgelaufen, Patent oder Marke gelöscht, Recht lautet auf Dritte; fehlendes Inventar der Einzelkomponenten.'
  pruefziele:
  - EX
  - RV
  quelle: hwp-bur-2023__rz-0415-s244
  zitat: Für immaterielle Werte ist ein Inventar zu erstellen, woraus die einzelnen Komponenten der Bilanzposition ersichtlich sind.
- text: Überbewertung durch fehlende ausserplanmässige Wertberichtigung (Impairment), z.B. bei nicht mehr genutzter Software, abgebrochenen Projekten oder rückläufigen Erträgen.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0423-s245
  zitat: ist eine zusätzliche ausserplanmässige Wertberichtigung (Impairment) auf diesen Wert vorzunehmen
- text: Planmässige Abschreibungen unterlassen oder zu tief (zu lange bzw. rechtliche statt wirtschaftliche Nutzungsdauer, Verzicht mit Hinweis auf höheren Nutzwert).
  pruefziele:
  - BE
  - PA
  quelle: hwp-bur-2023__rz-0423-s245
  zitat: Gegen den Grundsatz der Vorsicht und damit unzulässig wäre es, auf planmässige Abschreibungen von immateriellen Werten
- text: Willkürlich wechselnde Abschreibungssätze oder Methodenwechsel ohne Begründung und ohne Berücksichtigung der Auswirkung auf die stillen Reserven.
  pruefziele:
  - BE
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0061-s070
  zitat: Die Anwendung willkürlicher, jährlich unterschiedlicher Abschreibungssätze, die sich nicht durch den Ermessensspielraum des Vorsichtsprinzips rechtfertigen lassen
- text: Anlagespiegel/Anlagenverzeichnis nicht abgestimmt mit Hauptbuch, Bilanz und Abschreibungsaufwand der Erfolgsrechnung (Rechen- oder Übertragungsfehler).
  pruefziele:
  - EX
  - VO
  - RI
  quelle: ser-2022__anh-d-s082-2
  zitat: Abstimmung der Inventarliste mit Angabe der Anschaffungs- bzw. Herstellungskosten und der kumulierten Abschreibungen der einzelnen Anlagen und immateriellen Werte mit der Jahresrechnung
- text: Abgänge (Verkauf, Ablauf, Ausserbetriebnahme) nicht oder unvollständig ausgebucht; Buchgewinne mit bestehenden Anlagen verrechnet statt in der Erfolgsrechnung erfasst (analog
