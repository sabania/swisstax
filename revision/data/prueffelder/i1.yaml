  bezug: 'Stammdaten (Aktienkapital, Zweck, Ansprechpersonen Finanzen/GF für Befragungen): I1-101 bis I1-104 (Adressaten), I1-322, I1-408'
- datei: 00_Allgemein/Belegverzeichnis.md
  bezug: 'Übersicht der vorhandenen Belege im Ordner G_Anlagevermoegen; Grundlage, welche Verträge/Registerauszüge zu immateriellen Werten fehlen und als PBC/Pendenz zu erfassen sind:
    I1-303, I1-401, I1-322'
schritte:
- id: I1-101
  vorgehen: 'Schriftliche Antwort der Leitung Finanzen zu den Grundsätzen für immaterielle Werte auswerten: Kategorien (Software, Lizenzen, Patente, Entwicklungen, Goodwill), Ersterfassung
    zu AK/HK, Abschreibungsmethode (linear/degressiv, direkt/indirekt), Nutzungsdauern bzw. Sätze, Werthaltigkeitsprüfung. Mit Anlagenverzeichnis und Anhang abgleichen und im Textfeld
    zusammenfassen; fehlt die Antwort, Frage als Pendenz erfassen.'
  nachweise:
  - Schriftliche Antwort Befragung Bewertungsgrundsätze
  - Abschreibungsrichtlinie/-plan
  - Anlagenverzeichnis immaterielle Werte (Nutzungsdauer)
  - Anhang Jahresrechnung (Grundsätze)
  rechnen: Implizite Nutzungsdauer je Objekt (linear) = Anschaffungswert / jährliche Abschreibung; Vergleich mit angegebener Nutzungsdauer
  feststellung_wenn: Keine nachvollziehbaren Grundsätze, Nutzungsdauer über der wirtschaftlichen Nutzungsdauer oder Angaben widersprechen Anlagenverzeichnis bzw. Anhang.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung über Grundlagen der Bewertung der Anlagen (z. B. von Maschinenpark, Immobilien, Patenten oder anderen immateriellen Werten)
  - quelle: hwp-bur-2023__rz-0419-s244
    zitat: Die Abschreibungen bemessen sich nach der Nutzungsdauer des immateriellen Werts.
  - quelle: ser-2022__6-1-1-t1
    zitat: Die wesentlichen Fragen und Antworten sind zu dokumentieren.
- id: I1-102
  vorgehen: 'Befragen, ob Abschreibungsmethode und -sätze bzw. Nutzungsdauern gegenüber dem Vorjahr unverändert sind. Änderungen unterscheiden: Methodenwechsel (Begründung, Anhangangabe)
    vs. sachlich begründete Schätzungsänderung der Nutzungsdauer. Antwort mit den effektiven Sätzen aus I1-201 abgleichen; schwankende Sätze als mögliche Bildung/Auflösung stiller Reserven
    an I1-321 weitergeben.'
  nachweise:
  - Schriftliche Antwort Befragung Stetigkeit
  - Anlagespiegel GJ und VJ
  - Anhang GJ und VJ
  rechnen: Effektiver Abschreibungssatz je Kategorie = Abschreibung GJ / Anschaffungswert (linear) bzw. / Buchwert 01.01. (degressiv); Vergleich GJ- mit VJ-Satz
  feststellung_wenn: Methodenwechsel ohne Begründung bzw. Anhangangabe oder jährlich wechselnde, nicht begründete Abschreibungssätze.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Abschreibungssätze und -methoden und deren stetige Anwendung
  - quelle: or__art-958c
    zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
  - quelle: hwp-bur-2023__rz-0337-s230
    zitat: Die gewählte Methode ist stetig anzuwenden.
  - quelle: hwp-bur-2023__rz-0061-s070
    zitat: Die Anwendung willkürlicher, jährlich unterschiedlicher Abschreibungssätze
- id: I1-103
  vorgehen: Liste der Zu- und Abgänge immaterieller Werte des Geschäftsjahres (Kauf, Eigenentwicklung, Verkauf, Ablauf, Kündigung, Ausbuchung) erfragen und mit den Spalten Zugänge/Abgänge
    des Anlagespiegels abgleichen. Bei Abgängen erfragen, wie Erlös, Restbuchwert und Buchgewinn/-verlust verbucht und ausgewiesen wurden. Abweichungen im Textfeld, fehlende Antwort
    als Pendenz.
  nachweise:
  - Schriftliche Antwort Befragung Zu-/Abgänge
  - Anlagespiegel (Zugänge/Abgänge)
  - Verkaufs-/Kündigungsbelege
  - Kontoblatt Gewinn/Verlust aus Anlageverkäufen
  rechnen: Buchgewinn/-verlust = Veräusserungserlös − (Anschaffungswert Abgang − kumulierte Abschreibungen Abgang)
  feststellung_wenn: Genannte Zu-/Abgänge fehlen im Anlagespiegel, Abgang nicht ausgebucht oder Buchgewinn mit bestehenden Anlagen verrechnet statt in der Erfolgsrechnung erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung über Anschaffung und Verkäufe von Anlagen und über die Erfassung realisierter Gewinne und Verluste aus Abgängen
  - quelle: hwp-bur-2023__rz-0329-s228-t1
    zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- id: I1-104
  vorgehen: 'Leitung schriftlich befragen, ob Anzeichen für eine dauerhafte Wertbeeinträchtigung bestehen: nicht mehr genutzte Software/Lizenzen, abgebrochene Projekte, abgelaufene oder
    bestrittene Schutzrechte, rückläufige Erträge, negative Unternehmensentwicklung. Bei Anzeichen Vergleichsrechnung Buchwert vs. erzielbarer Wert anfordern und nachvollziehen; sonst
    Antwort dokumentieren, fehlende Antwort als Pendenz.'
  nachweise:
  - Schriftliche Antwort Befragung Wertbeeinträchtigung
  - Werthaltigkeitsberechnung der Unternehmensleitung
  - Budget/Ertragsprognosen
  - VR-Protokolle
  rechnen: Erzielbarer Wert = max(Nutzwert, Netto-Marktwert); Wertberichtigungsbedarf = Buchwert − erzielbarer Wert (falls > 0)
  feststellung_wenn: Anzeichen einer Wertbeeinträchtigung ohne Vergleichsrechnung oder erzielbarer Wert unter Buchwert ohne entsprechende Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung, ob Sachanlagen oder immaterielle Werte eine wesentliche, dauerhafte Wertbeeinträchtigung aufweisen
  - quelle: hwp-bur-2023__rz-0420-s245
    zitat: Dabei wird der Buchwert mit dem erzielbaren Wert verglichen.
  - quelle: or__art-960
    zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen
- id: I1-201
  vorgehen: 'Anlagespiegel GJ und VJ sowie Saldoliste (Bestandes-, WB- und Abschreibungskonten) gegenüberstellen: Anschaffungswerte, Zugänge, Abgänge, Abschreibungen, Buchwerte und effektive
    Sätze je Kategorie. Erwartete Abschreibung aus AK und Nutzungsdauer schätzen und mit der gebuchten vergleichen. Wesentliche Abweichungen begründen lassen (Pendenz) und im Textfeld
    festhalten.'
  nachweise:
  - Anlagespiegel GJ und VJ
  - Saldoliste GJ/VJ
  - Jahresrechnung VJ
  rechnen: Veränderung je Konto = Saldo 31.12. GJ − Saldo 31.12. VJ; Satz = Abschreibung / AK; erwartete Abschreibung = Σ (AK / Nutzungsdauer) nicht voll abgeschriebener Objekte; Abweichung
    = gebucht − erwartet
  feststellung_wenn: Unerklärte wesentliche Veränderung von Bestand, Zu-/Abgängen oder Abschreibungssatz bzw. wesentliche Abweichung gebuchte zu erwarteter Abschreibung.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Vergleich der Bestände, der Anschaffungen, der Verkäufe sowie der Abschreibungssätze und des Abschreibungsaufwands mit dem Vorjahr
  - quelle: ser-2022__6-1-2-t1
    zitat: Erwartungen des Abschlussprüfers (z. B. Schätzung von Abschreibungen)
- id: I1-301
  vorgehen: Anlagespiegel/Anlagenverzeichnis immaterielle Werte nachrechnen und mit den Saldi Bestandes- und WB-Konto im Hauptbuch, der Bilanzposition «Immaterielle Werte» und dem Abschreibungsaufwand
    der Erfolgsrechnung abstimmen; Anfangsbestände mit dem VJ-Abschluss. Rechenmodul nutzen; jede Differenz mit Betrag im Textfeld.
  nachweise:
  - Anlagespiegel und Anlagenverzeichnis
  - Saldoliste
  - Kontoblätter Bestand/WB
  - Jahresrechnung (Bilanz, ER)
  rechnen: AW 01.01. + Zugänge − Abgänge = AW 31.12. = Saldo Bestandeskonto; WB 01.01. + Abschreibung − WB Abgänge = WB 31.12. = Saldo WB-Konto; AW − WB = Buchwert = Bilanzposition;
    Abschreibung Spiegel = Aufwand ER; Σ Objekte Verzeichnis = AW 31.12.
  feststellung_wenn: Differenz zwischen Anlagespiegel, Hauptbuch, Bilanz oder Abschreibungsaufwand ER bzw. Rechenfehler im Anlagespiegel (jede Differenz melden; Wesentlichkeit beurteilt
    der WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s082-2
    zitat: Abstimmung der Inventarliste mit Angabe der Anschaffungs- bzw. Herstellungskosten und der kumulierten Abschreibungen
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: ob die aus Hilfs- oder Nebenbuchhaltungen stammenden Werte korrekt in das Hauptbuch und schliesslich die Jahresrechnung übernommen worden sind
  - quelle: hwp-bur-2023__rz-0415-s244
    zitat: Für immaterielle Werte ist ein Inventar zu erstellen
- id: I1-302
  vorgehen: 'Kontoblätter der Bestandes-, WB- und Abschreibungskonten immaterielle Werte auf ungewöhnliche Posten durchsehen: manuelle Umbuchungen, Stornos/Gutschriften, runde Beträge,
    untypische Gegenkonten, Buchungen ohne Beleg, Abschreibungen ausserhalb der Abschlussbuchung. Auffällige Posten mit Beleg in M-Files prüfen (Inhalt, Kontierung, Datum). Weitergehender
    Schritt: nur auf Entscheid WP.'
  nachweise:
  - Kontoblätter Bestand, WB, Abschreibungsaufwand
  - Belege der auffälligen Posten
  rechnen: Saldo Kontoblatt = Eröffnungssaldo + Σ Soll − Σ Haben = Saldoliste
  feststellung_wenn: Ungewöhnlicher Posten ohne Beleg oder wirtschaftlich nicht nachvollziehbar, Fehlkontierung oder Abschreibungsbuchung nicht abstimmbar mit dem Anlagespiegel.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-2
    zitat: Durchsicht der Bestands- sowie der Abschreibungskonten im Hauptbuch auf ungewöhnliche Posten; Belegprüfung solcher Posten
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: wirtschaftlicher Grundsachverhalt (Zusammenhang mit der Leistungserstellung des Unternehmens)
- id: I1-303
  vorgehen: 'Für wesentliche Bestände und alle Zugänge die Kauf-, Lizenz-, Entwicklungs- oder Übernahmeverträge sowie Rechnungen/Zahlungsbelege in M-Files suchen. Prüfen: Vertragspartei
    ist die Gesellschaft, Gegenstand, Preis = aktivierter Betrag (inkl. direkter Nebenkosten), Laufzeit/Kündbarkeit, Belastungen. Fehlende Verträge als Pendenz/PBC erfassen. Weitergehender
    Schritt: nur auf Entscheid WP.'
  nachweise:
  - Kauf-/Lizenz-/Entwicklungsverträge
  - Rechnungen und Zahlungsbelege
  - Registerauszüge
  rechnen: Aktivierter Betrag = Vertragspreis netto (ohne rückforderbare Vorsteuer) + direkt zurechenbare Nebenkosten
  feststellung_wenn: Kein Vertrag bzw. Beleg für einen aktivierten Wert, Vertragspartei nicht die Gesellschaft, Betrag weicht ab oder Recht abgelaufen/gekündigt.
  fundstellen:
  - quelle: ser-2022__anh-d-s083-1
    zitat: Durchsicht von Einkaufsfakturen, Leasing- und anderen Verträgen sowie weiteren Dokumenten im Zusammenhang mit Anschaffung bzw. Veräusserung
  - quelle: hwp-bur-2023__rz-0416-s244
    zitat: Zur Feststellung des Bestands käuflich erworbener (derivativer) immaterieller Werte dienen die Verträge, Zahlungsbelege
  - quelle: hwp-bur-2023__rz-0418-s244
    zitat: Zu den Anschaffungs- oder Herstellungskosten gehören auch die diesbezüglichen Nebenkosten
- id: I1-320
  vorgehen: 'Anhang prüfen auf: angewandte Bewertungs-/Abschreibungsgrundsätze immaterieller Werte (soweit nicht gesetzlich vorgeschrieben), Methodenwechsel (I1-102), verpfändete/abgetretene
    Rechte, Erläuterung wesentlicher Abgangserfolge bzw. ausserordentlicher Wertberichtigungen, Nettoauflösung stiller Reserven (I1-321). Fehlende oder widersprüchliche Angaben im Textfeld.'
  nachweise:
  - Anhang Jahresrechnung
  - Ergebnisse I1-102/103/104/321
  rechnen: ''
  feststellung_wenn: Erforderliche Anhangangabe fehlt oder widerspricht den Prüfergebnissen (Grundsätze, Verpfändung, ausserordentliche Positionen, Nettoauflösung stiller Reserven).
  fundstellen:
  - quelle: or__art-959c-t1
    zitat: Angaben über die in der Jahresrechnung angewandten Grundsätze, soweit diese nicht vom Gesetz vorgeschrieben sind
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang Angaben über die Nettoauflösung von stillen Reserven
- id: I1-321
  vorgehen: Aufstellung stille Reserven des Kunden für immaterielle Werte übernehmen (betriebswirtschaftlicher Wert vs. Buchwert je Objekt/Kategorie, Stichtag und VJ) und mit Anlagespiegel
    bzw. Anlagenbuchhaltung zu betriebswirtschaftlichen Werten (I1-407) abstimmen. Veränderung (Bildung/Auflösung) berechnen, in die Gesamtaufstellung übertragen und Nettoauflösung für
    I1-320 vormerken; fehlt die Aufstellung, Pendenz.
  nachweise:
  - Detailnachweis stille Reserven
  - Anlagenbuchhaltung betriebswirtschaftlich
  - Anlagespiegel
  rechnen: Stille Reserve = betriebswirtschaftlicher Restwert (höchstens gesetzlicher Höchstwert) − Buchwert; Veränderung = Bestand 31.12. GJ − Bestand 31.12. VJ (negativ = Auflösung)
  feststellung_wenn: Nachweis fehlt oder ist nicht abstimmbar, oder wesentliche Nettoauflösung ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: hwp-bur-2023__rz-0425-s246
    zitat: Werden immaterielle Werte schneller als wirtschaftlich erforderlich abgeschrieben, so erfolgt eine Bildung stiller Reserven
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
- id: I1-322
  vorgehen: 'Dauerakte immaterielle Werte nachführen: Lizenz-, Kauf- und Entwicklungsverträge mit Laufzeiten, Registerauszüge Patente/Marken mit Ablaufdaten, Abschreibungsrichtlinie,
    Verpfändungs-/Abtretungsverträge, bei nicht einbezahltem Kapital Statuten/HR-Auszug. Neue oder geänderte Dokumente aus M-Files zur Ablage vorschlagen; Änderungen ggü. VJ im Textfeld.'
  nachweise:
  - Dauerakte
  - Verträge und Registerauszüge aus M-Files
  rechnen: ''
  feststellung_wenn: Wesentliche Verträge oder Registerauszüge fehlen in der Dauerakte oder sind abgelaufen, ohne dass dies in Bestand bzw. Bewertung berücksichtigt ist.
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen, die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben, wie beispielsweise wichtige Verträge
- id: I1-401
  vorgehen: 'Bestand der Patente, Lizenzen und Marken dokumentbasiert erheben: Registerauszüge, Lizenzverträge, Gebühren-/Erneuerungsnachweise per Stichtag. Mit dem Anlagenverzeichnis
    abgleichen (jedes bilanzierte Recht vorhanden, gültig, auf die Gesellschaft lautend); registrierte, nicht bilanzierte Rechte nur notieren. Physische Bestandsaufnahme ist nicht vorgesehen;
    Differenzliste im Textfeld.'
  nachweise:
  - Registerauszüge Patente/Marken
  - Lizenzverträge
  - Gebühren-/Erneuerungsrechnungen
  - Anlagenverzeichnis
  rechnen: Objekte Anlagenverzeichnis − Objekte mit gültigem Nachweis = Differenzliste (Objekt, Buchwert)
  feststellung_wenn: Bilanziertes Recht ohne gültigen Nachweis (abgelaufen, gelöscht, gekündigt oder auf Dritte lautend).
  fundstellen:
  - quelle: hwp-bur-2023__rz-0416-s244
    zitat: dienen die Verträge, Zahlungsbelege, Abrechnungen über Patentgebühren, Registereintragungen
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege
  - quelle: ser-2022__anh-d-s083-1
    zitat: Physische Bestandsaufnahme
- id: I1-402
  vorgehen: 'Jeden wesentlichen Zugang anhand Beleg/Vertrag beurteilen: Verfügungsmacht, wahrscheinlicher Mittelzufluss, verlässliche Bewertbarkeit; keine Gründungs-, Organisations-,
    Schulungs-, Forschungs- oder Restrukturierungskosten; laufende Lizenz-/SaaS-Gebühren und Wartung sind Aufwand. Bei Eigenentwicklungen Kostennachweis, konkretes Ergebnis/Marktreife
    und Finanzierung prüfen. Ergebnis je Zugang im Textfeld.'
  nachweise:
  - Belege/Verträge der Zugänge
  - Projektkostenrechnung
  - Projektbeschrieb/Businessplan
  rechnen: Aktivierbarer Betrag = Σ direkt zurechenbare Kosten (Fremdleistungen + Eigenaufwand) gemäss Nachweis − nicht aktivierbare Anteile
  feststellung_wenn: Aktivierung nicht aktivierbarer Kosten oder Eigenentwicklung ohne Nachweis von Kosten, Nutzen bzw. Marktreife.
  fundstellen:
  - quelle: or__art-959
    zitat: Andere Vermögenswerte dürfen nicht bilanziert werden.
  - quelle: hwp-bur-2023__rz-0411-s243
    zitat: Nicht aktivierbar sind Gründungs- und Kapitalerhöhungs- oder allgemeine Organisationskosten
  - quelle: hwp-bur-2023__rz-0413-s243
    zitat: dem entsprechenden immateriellen Anlagegut ein direkt zuorden- und feststellbarer
  - quelle: hwp-bur-2023__rz-0430-s246
    zitat: Laufende Lizenzzahlungen deuten auf eine Dienstleistung hin
- id: I1-403
  vorgehen: Abschreibungen je Objekt nachrechnen (AK, Nutzungsdauer, Methode, pro rata ab Zugang) und Total mit Abschreibungsaufwand ER und Zunahme WB-Konto abstimmen. Nutzungsdauer
    auf wirtschaftliche statt rechtliche Nutzung prüfen; bei unbestimmter Dauer i.d.R. 5, höchstens 20 Jahre. Kein Verzicht auf planmässige Abschreibung wegen höherem Nutzwert. Mehrabschreibungen
    an I1-321 melden.
  nachweise:
  - Anlagenverzeichnis
  - Abschreibungsplan
  - Kontoblätter Abschreibungsaufwand und WB
  rechnen: Abschreibung linear = AK / Nutzungsdauer × Monate im GJ / 12; Σ Objekte = Abschreibungsaufwand ER = Zunahme WB-Konto (ohne Abgänge); Mehr-/Minderabschreibung = gebucht − planmässig
  feststellung_wenn: Abschreibung rechnerisch falsch oder nicht abstimmbar mit ER, planmässige Abschreibung unterlassen bzw. zu tief oder Nutzungsdauer nicht begründbar.
  fundstellen:
  - quelle: or__art-960a
    zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen
  - quelle: hwp-bur-2023__rz-0419-s244
    zitat: auf die wirtschaftliche Nutzungsdauer und nicht auf rechtliche Kriterien wie beispielsweise die urheberrechtliche Schutzfrist abzustellen
  - quelle: hwp-bur-2023__rz-0423-s245
    zitat: auf planmässige Abschreibungen von immateriellen Werten mit der Begründung eines höheren Nutz- oder Veräusserungs- bzw. Verkehrswerts zu verzichten
  - quelle: hwp-or-2024__rz-0908-s354-t1
    zitat: Nachrechnen der Abschreibungen und Abgleich mit dem Abschreibungsaufwand
- id: I1-404
  vorgehen: Bewertungs- und Expertengutachten werden in der eingeschränkten Revision nicht eingeholt. Nur prüfen, ob der Kunde selbst ein Gutachten erstellen liess (z.B. Patent-/Markenbewertung,
    Kaufpreisallokation); dieses als Unterlage beiziehen und Stichtag, Methode und Wert mit dem Buchwert vergleichen. Sonst «nicht Bestandteil ER» dokumentieren; Entscheid über Weitergehendes
    beim WP.
  nachweise:
  - Vom Kunden vorhandenes Bewertungsgutachten (falls vorhanden)
  rechnen: Differenz = Buchwert − Gutachtenwert (per vergleichbarem Stichtag)
  feststellung_wenn: Vorhandenes Gutachten weist einen Wert unter dem Buchwert aus, ohne dass eine Wertberichtigung gebucht ist.
  fundstellen:
  - quelle: hwp-er-2026__rz-0304-s251
    zitat: Die Einholung von Expertengutachten wird im SER für Positionen, für welche sie bei der ordentlichen Revision denkbar wären, zudem explizit ausgeschlossen
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: Experten- und Bewertungsgutachten
  - quelle: ser-2022__anh-d-s083-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen
- id: I1-405
  vorgehen: Aufwandkonten mit möglichem Investitionscharakter (Software-/Lizenzkosten, IT-Projekte, Beratung, Entwicklung, Patent-/Markenkosten) auf grössere Einzelbeträge durchsehen;
    Belege prüfen, ob ein aktivierungsfähiger Wert (z.B. unbefristete Lizenz, Schutzrecht) oder Aufwand (laufende Lizenz, SaaS, Wartung, Schulung) vorliegt. Befunde als unvollständige
    Aktivierung bzw. stille Reserven (I1-321) im Textfeld.
  nachweise:
  - Kontoblätter Aufwand Software/Lizenzen/IT/Beratung
  - Belege grösserer Einzelbeträge
  rechnen: Σ über ER gebuchte aktivierungsfähige Beträge GJ − planmässige Abschreibung GJ darauf = stille Reserve aus Sofortabschreibung
  feststellung_wenn: Wesentliche aktivierungsfähige Investitionen direkt über die ER gebucht oder umgekehrt Aufwand aktiviert.
  fundstellen:
  - quelle: ser-2022__anh-d-s082-1
    zitat: Befragung, wie Unterhaltsaufwendungen von Investitionen (Wertvermehrung) unterschieden werden
  - quelle: hwp-bur-2023__rz-0739-s311-t1
    zitat: wertvermehrenden Unterhaltskosten
  - quelle: hwp-bur-2023__rz-0414-s244
    zitat: Dem Periodenergebnis belastete Aufwendungen für selbst erarbeitete immaterielle Werte können nicht nachträglich aktiviert werden.
- id: I1-406
  vorgehen: 'Restbuchwerte je Objekt kritisch würdigen: Objekt noch genutzt bzw. Recht gültig, Restnutzungsdauer mindestens so lang wie die verbleibende Abschreibungsdauer, Restbuchwert
    durch künftigen Nutzen gedeckt (Antwort I1-104, Prognosen). Objekte mit Restbuchwert trotz Nutzungsende markieren; bei Fortführungszweifeln besonders kritisch. Ergebnis im Textfeld.'
  nachweise:
  - Anlagenverzeichnis mit Restbuchwerten
  - Antwort I1-104
  - Ertrags-/Deckungsbeitragsprognosen
  rechnen: Restbuchwert = AK − kumulierte Abschreibungen; verbleibende Abschreibungsdauer = Restbuchwert / jährliche Abschreibung; Vergleich mit Restnutzungsdauer
  feststellung_wenn: Restbuchwert für nicht mehr genutzte oder abgelaufene Rechte, oder Restbuchwert nicht durch künftigen Nutzen gedeckt.
  fundstellen:
  - quelle: or__art-960
    zitat: so sind die Werte zu überprüfen und gegebenenfalls anzupassen
  - quelle: hwp-bur-2023__rz-0424-s245
    zitat: Die Überprüfung der Werthaltigkeit ist Bestandteil des Bewertungsvorgangs von immateriellen Werten
  - quelle: hwp-bur-2023__rz-0336-s230
    zitat: Die dem Abschreibungsplan eines Anlageguts zugrunde liegende Nutzungsdauer ist deshalb periodisch sowie bei konkreten Anzeichen auf Wertverminderung zu überprüfen
- id: I1-407
  vorgehen: Prüfen, ob neben den Bilanzwerten eine Anlagenbuchhaltung zu betriebswirtschaftlichen Werten (AK, wirtschaftliche Nutzungsdauer) geführt wird; Werte nachrechnen und Differenz
    zu den Buchwerten als stille Reserve mit I1-321 abstimmen. Fehlt sie, betriebswirtschaftliche Werte aus AK und Nutzungsdauer gemäss I1-101 näherungsweise herleiten (Rechenmodul)
    und dem WP vorlegen.
  nachweise:
  - Anlagenbuchhaltung betriebswirtschaftlich
  - Anlagenverzeichnis
  - Aufstellung stille Reserven
  rechnen: Betriebswirtschaftlicher Restwert = AK × (1 − abgelaufene Nutzungsjahre / wirtschaftliche Nutzungsdauer); stille Reserve = betriebswirtschaftlicher Restwert − Buchwert
  feststellung_wenn: Erkennbare Mehrabschreibungen ohne betriebswirtschaftliche Werte oder Differenz nicht mit der Aufstellung stille Reserven abstimmbar.
  fundstellen:
  - quelle: katalog-revio4__c003-36
    zitat: Prüfung der Anlagenbuchhaltung zu betriebswirtschaftlichen Werten
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
  - quelle: hwp-bur-2023__rz-0672-s297
    zitat: Wo das Rechnungswesen keine genauen Angaben zu liefern vermag
- id: I1-408
  vorgehen: 'Feststellen, ob nicht einbezahltes Grundkapital besteht (Statuten, HR-Auszug, Aktienbuch, Saldoliste); falls nein, «nicht anwendbar» dokumentieren. Falls ja: gesonderten
    Ausweis im Anlagevermögen, Betrag je Aktionär, VR-Beschlüsse zur Einforderung und Zahlungseingänge prüfen; Bonität der Aktionäre anhand verfügbarer Unterlagen bzw. schriftlicher
    Auskunft beurteilen und Wertberichtigungsbedarf dem WP melden.'
  nachweise:
  - Statuten/HR-Auszug
  - Aktienbuch
  - VR-Protokolle (Einforderung)
  - Bonitätsunterlagen der Aktionäre
  rechnen: Nicht einbezahltes Kapital = Nominalkapital − geleistete Einlagen = Σ offene Liberierung je Aktionär (Aktienbuch) = Saldo Aktivkonto
  feststellung_wenn: Nicht einbezahltes Kapital nicht gesondert ausgewiesen, nicht abstimmbar oder Schuldner mit zweifelhafter Bonität ohne Wertberichtigung.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0562-s273
    zitat: weil es jederzeit eingefordert werden kann, wie eine Forderung auf seine Werthaltigkeit hin zu beurteilen
  - quelle: hwp-bur-2023__rz-0563-s273
    zitat: Ein nicht einbezahlter Teil ist unter den Aktiven gesondert auszuweisen
  - quelle: ser-2022__anh-d-s081-1
    zitat: Beurteilung der Bonität der Darlehensnehmer anhand deren Jahresabschlüssen oder anderer Informationen
  - quelle: or__art-634b
    zitat: Der Verwaltungsrat beschliesst die nachträgliche Leistung von Einlagen auf nicht voll liberierte Aktien.
