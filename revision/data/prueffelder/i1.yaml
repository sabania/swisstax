  quelle: ser-2022__anh-d-s083-1
  zitat: Dokumenten im Zusammenhang mit Anschaffung bzw. Veräusserung von Sachanlagen und immateriellen Werten
- dokument: Kontoblätter Bestandes-, Wertberichtigungs- und Abschreibungskonten immaterielle Werte sowie Aufwandkonten Software/Lizenzen/IT/Beratung
  zweck: Durchsicht ungewöhnliche Posten, ER-gebuchte Investitionen (I1-302/405)
  quelle: ser-2022__anh-d-s082-2
  zitat: Durchsicht der Bestands- sowie der Abschreibungskonten im Hauptbuch auf ungewöhnliche Posten
- dokument: Detailnachweis stille Reserven bzw. Anlagenbuchhaltung zu betriebswirtschaftlichen Werten (GJ und VJ)
