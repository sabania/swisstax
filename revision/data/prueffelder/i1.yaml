  zitat: Befragung, wie Unterhaltsaufwendungen von Investitionen (Wertvermehrung) unterschieden werden
- text: Wesentliche Nettoauflösung stiller Reserven auf immateriellen Werten (z.B. Wegfall von Mehrabschreibungen) im Anhang nicht offengelegt.
  pruefziele:
  - DO
  - BE
