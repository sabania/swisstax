- text: 'Aktivierungsfähige Investitionen (z.B. Kauf unbefristeter Software-Lizenzen) direkt über die Erfolgsrechnung verbucht: unvollständiger Ausweis bzw. Bildung stiller Reserven.'
  pruefziele:
