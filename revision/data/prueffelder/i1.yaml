  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: VR- und GV-Protokolle (Investitionsentscheide, Projektabbrüche, Einforderung nicht einbezahlten Kapitals)
