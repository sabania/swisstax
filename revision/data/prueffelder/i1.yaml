unterlagen:
- dokument: 'Anlagespiegel und Anlagenverzeichnis immaterielle Werte per 31.12. (je Objekt: Anschaffungsdatum, AK/HK, Zu-/Abgänge, kumulierte Abschreibungen, Nutzungsdauer, Buchwert)
    inkl. Vorjahr'
  zweck: Bestandsnachweis, Abstimmung Hauptbuch/Bilanz/ER, VJ-Vergleich, Nachrechnen Abschreibungen (I1-201/301/401/403/406)
  quelle: hwp-bur-2023__rz-0415-s244
  zitat: Für immaterielle Werte ist ein Inventar zu erstellen
- dokument: Kauf-, Lizenz-, Entwicklungs- und Übernahmeverträge, Rechnungen und Zahlungsbelege zu Beständen und Zugängen
  zweck: Bestand, Rechte, Höhe der Anschaffungskosten, Laufzeiten (I1-303/402)
  quelle: hwp-bur-2023__rz-0416-s244
  zitat: dienen die Verträge, Zahlungsbelege, Abrechnungen über Patentgebühren
- dokument: Registerauszüge (Patente, Marken, Designs) und Gebühren-/Erneuerungsnachweise per Stichtag
  zweck: Dokumentbasierte Bestandesaufnahme der Schutzrechte, Gültigkeit und Inhaberschaft (I1-401)
  quelle: hwp-bur-2023__rz-0416-s244
  zitat: Registereintragungen in Verbindung mit Lizenz- und ähnlichen Erträgen
- dokument: 'Bei Eigenentwicklungen: Projektkostenrechnung/Stundenrapporte, Projektbeschrieb mit Ergebnis (Prototyp, Marktreife), Finanzierungsnachweis'
