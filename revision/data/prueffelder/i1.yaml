  quelle: ser-2022__anh-d-s091-1
  zitat: Abstimmung des Grundkapitals mit den gültigen Statuten oder dem Handelsregisterauszug
- dokument: Vom Kunden vorhandene Bewertungsgutachten (z.B. Patent-/Markenbewertung), falls bereits erstellt
  zweck: Beizug als Unterlage zur Werthaltigkeit; kein Einholen durch die Revisionsstelle (I1-404)
bewertung:
- regel: Aktivierungspflicht, wenn Verfügungsmacht, wahrscheinlicher Mittelzufluss und verlässliche Bewertbarkeit gegeben sind (Art. 959 Abs. 2 OR).
  quelle: hwp-bur-2023__rz-0413-s243
  zitat: Immaterielle Werte sind zu aktivieren, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist und ihr Wert verlässlich geschätzt
    werden kann
- regel: 'Umfang: Konzessionen, Patente, Lizenzen, Marken, Urheberrechte, IT-Programme/Nutzungsrechte, produktbezogene Entwicklungskosten, separat bezahlter Goodwill.'
  quelle: hwp-bur-2023__rz-0410-s243
  zitat: IT-Programme und -Nutzungsrechte sowie produktbezogene Entwicklungskosten
- regel: 'Nicht aktivierbar: Gründungs-, Kapitalerhöhungs-, Organisations-, Aus-/Weiterbildungs-, Restrukturierungs- und Forschungskosten.'
  quelle: hwp-bur-2023__rz-0411-s243
  zitat: Kosten für Forschungsaktivitäten, d.h. bei allgemeinen Aufwendungen zur Gewinnung neuer wissenschaftlicher Erkenntnisse
- regel: 'Selbst erarbeitete Werte: Aktivierung nur bei konkretem, marktreif zu machendem Ergebnis und gesicherter Finanzierung; genereller Verzicht auf Aktivierung vertretbar.'
  quelle: hwp-bur-2023__rz-0413-s243
  zitat: erscheint es in Anlehnung an FER 10/4 vertretbar, auf die Aktivierung selbst erarbeiteter immaterieller Werte generell zu verzichten
- regel: Bereits dem Periodenergebnis belastete Aufwendungen für Eigenentwicklungen dürfen nicht nachträglich aktiviert werden.
  quelle: hwp-bur-2023__rz-0414-s244
  zitat: Dem Periodenergebnis belastete Aufwendungen für selbst erarbeitete immaterielle Werte können nicht nachträglich aktiviert werden.
- regel: Ersterfassung zu AK (gekauft) bzw. HK (selbst geschaffen) inkl. direkt zurechenbarer Nebenkosten (Gebühren, Beratungshonorare).
  quelle: hwp-bur-2023__rz-0418-s244
  zitat: Für käuflich erworbene Güter gelten die Anschaffungs-, für selbst geschaffene die Herstellungskosten als Wertobergrenze.
- regel: Folgebewertung höchstens zu AK/HK abzüglich notwendiger Abschreibungen und Wertberichtigungen; Marktwertbewertung (Art. 960b OR) nur ausnahmsweise.
  quelle: hwp-bur-2023__rz-0419-s244
  zitat: In der Folgebewertung dürfen immaterielle Werte grundsätzlich nicht über den Anschaffungs- oder Herstellungskosten, abzüglich notwendiger Abschreibungen und Wertberichtigungen,
    bewertet werden
- regel: Abschreibung über die wirtschaftliche (nicht rechtliche) Nutzungsdauer; ist sie nicht bestimmbar, 5 Jahre, begründet höchstens 20 Jahre.
  quelle: hwp-bur-2023__rz-0419-s244
  zitat: wird eine Abschreibungsdauer von fünf Jahren, in begründeten Fällen eine solche von höchstens zwanzig Jahren empfohlen
- regel: Abschreibungsmethode (linear/degressiv/leistungsabhängig) frei wählbar, aber stetig anzuwenden; linear aus Stetigkeitsgründen bevorzugt.
  quelle: hwp-bur-2023__rz-0338-s230
  zitat: ist aus betriebswirtschaftlichen Gründen und insbesondere im Interesse der Stetigkeit die lineare Methode zu bevorzugen
- regel: Sachlich begründete Änderungen der Nutzungsdauer sind Schätzungsänderungen und keine Verletzung der Stetigkeit.
  quelle: hwp-bur-2023__rz-0061-s070
  zitat: sachlich begründete Änderungen in der Bemessung der Lebensdauer von Anlagen und damit des Abschreibungssatzes im Rahmen des Vorsichtsprinzips zulässig
- regel: 'Impairment: bei Anzeichen Vergleich Buchwert mit erzielbarem Wert (höherer von Nutzwert und Netto-Marktwert); Differenz als Wertberichtigung.'
  quelle: hwp-bur-2023__rz-0420-s245
  zitat: Der erzielbare Wert ist der höhere von Nutzwert (Value in use) und Netto-Marktwert.
- regel: Werthaltigkeit ist periodisch im Abschlussrhythmus zu überprüfen; die Nutzungsdauer periodisch und bei Anzeichen.
  quelle: hwp-bur-2023__rz-0424-s245
  zitat: Die Überprüfung der Werthaltigkeit ist Bestandteil des Bewertungsvorgangs von immateriellen Werten
- regel: Kein Verzicht auf planmässige Abschreibungen wegen höherem Nutz- oder Verkehrswert (ausser Auflösung vorgängig gebildeter stiller Reserven).
  quelle: hwp-bur-2023__rz-0423-s245
  zitat: ausser es wurden vorgängig höhere Abschreibungen im Sinne von stillen Reserven gebildet
- regel: Abschreibung schneller als wirtschaftlich erforderlich = Bildung stiller Reserven (Art. 960a Abs. 4 OR).
  quelle: hwp-bur-2023__rz-0425-s246
  zitat: Werden immaterielle Werte schneller als wirtschaftlich erforderlich abgeschrieben, so erfolgt eine Bildung stiller Reserven
- regel: 'Goodwill: originärer nicht aktivierbar; derivativer (Asset Deal) zum Anschaffungswert und planmässig abzuschreiben (personenbezogen höchstens 5 Jahre); kein Impairment-only.'
  quelle: hwp-bur-2023__rz-0429-s246
  zitat: Ein solcher Goodwill ist innert einer angemessenen Frist planmässig abzuschreiben.
- regel: Goodwill aus Share Deal ist Teil der Anschaffungskosten der Beteiligung und wird nicht unter immateriellen Werten ausgewiesen.
  quelle: hwp-bur-2023__rz-0428-s246
  zitat: bildet im Einzelabschluss Teil der Anschaffungskosten der Beteiligung
- regel: 'IT/SaaS: laufende Lizenzzahlungen sind Aufwand; Implementierungskosten von SaaS kritisch, abgrenzen oder direkt erfassen.'
  quelle: hwp-bur-2023__rz-0430-s246
  zitat: Die Aktivierbarkeit von Implementierungsaufwendungen von SaaS ist insbesondere dann kritisch zu beurteilen
- regel: 'Abgänge: AK und kumulierte Abschreibungen ausbuchen; Buchgewinn/-verlust in der Erfolgsrechnung erfassen, nicht mit bestehenden Anlagen verrechnen (analog Sachanlagen).'
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- regel: Bedeutende Gewinne/Verluste aus Veräusserungen von Anlagen einzeln in ER oder Anhang ausweisen und erläutern (analog Sachanlagen).
  quelle: hwp-bur-2023__rz-0380-s238
  zitat: Bedeutende Gewinne oder Verluste aus der Veräusserung von Sachanlagen sind in der Erfolgsrechnung oder im Anhang einzeln auszuweisen und zu erläutern
- regel: 'Nicht einbezahltes Grundkapital: zum Nennwert passivieren, offenen Teil gesondert aktivieren und wie eine Forderung auf Werthaltigkeit prüfen; nötigenfalls Wertberichtigung.'
  quelle: hwp-bur-2023__rz-0562-s273
  zitat: Nicht einbezahltes Aktien- und Partizipationskapital ist zu aktivieren
- regel: 'Steuerlich (ESTV-Merkblatt A 1995, gemäss Treuhand-Almanach 2026): Lizenzen, Patente, Goodwill 40 % vom Buchwert, vom Anschaffungswert die Hälfte; handelsrechtlich nicht massgebend
    (Mehrabschreibung = stille Reserve).'
  quelle: treuhand-almanach-2026__s061-1
  zitat: Lizenzen, Patente, Goodwill 40 %
fallstricke:
- text: 'I1-404 Bewertungsgutachten: Einholen von Bewertungs- und Expertengutachten ist nicht Bestandteil der eingeschränkten Revision. Nur vom Kunden bereits vorhandene Gutachten beiziehen;
    Weitergehendes entscheidet der WP.'
  quelle: hwp-er-2026__rz-0304-s251
  zitat: Die Einholung von Expertengutachten wird im SER für Positionen, für welche sie bei der ordentlichen Revision denkbar wären, zudem explizit ausgeschlossen
- text: 'I1-401 Bestandesaufnahme: Eine physische Bestandsaufnahme gehört zu den weitergehenden Prüfungshandlungen; bei immateriellen Werten erfolgt der Bestandsnachweis dokumentbasiert
    (Register, Verträge, Gebühren).'
  quelle: ser-2022__anh-d-s083-1
  zitat: Physische Bestandsaufnahme
- text: Befragungen (I1-101 bis I1-104) genügen für eine wesentliche Position nicht allein; immer mit Analytik (I1-201) und Detailprüfungen (I1-301/303) ergänzen und die Antworten schriftlich
    dokumentieren.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Schätzungsänderung der Nutzungsdauer nicht mit Methodenwechsel verwechseln: sachlich begründete Anpassung ist zulässig; willkürlich schwankende Sätze verletzen die Stetigkeit
    (Auswirkung auf stille Reserven beachten).'
  quelle: hwp-bur-2023__rz-0061-s070
  zitat: soweit damit kein Methodenwechsel oder eine Abweichung von der festgelegten Methode verbunden ist
- text: Steuerlich zulässige Abschreibungssätze sind kein Massstab für die wirtschaftliche Nutzungsdauer; Abschreibungen darüber hinaus sind stille Reserven (I1-321/I1-407), nicht Fehler,
    solange offengelegt wo nötig.
  quelle: hwp-bur-2023__rz-0209-s106
  zitat: Zu beachten ist, dass sich die steuerliche Anerkennung solcher Buchungen nach den anwendbaren Vorschriften richtet.
- text: Nutzwert-Schätzungen der Unternehmensleitung (Prognosen) haben grossen Ermessensspielraum; Annahmen kritisch würdigen und Unsicherheit dem WP melden.
  quelle: hwp-bur-2023__rz-0421-s245
  zitat: Da der Nutzwert weitgehend einer subjektiven Einschätzung und grossen Ermessensspielräumen unterliegt, ist die Überprüfung der Werthaltigkeit anspruchsvoll.
- text: Ein höherer Verkehrswert rechtfertigt keinen Verzicht auf planmässige Abschreibungen; umgekehrt muss bei gesunkenem Verkehrswert nicht zwingend wertberichtigt werden, solange
    der Nutzwert den Restbuchwert deckt.
  quelle: hwp-bur-2023__rz-0424-s245
  zitat: muss selbst bei nachhaltig gesunkenen Verkehrswerten nicht zwangsläufig eine zusätzliche Wertberichtigung vorgenommen werden
- text: Bei Fortführungszweifeln bzw. Zwischenabschluss zu Veräusserungswerten sind immaterielle Werte oft kaum realisierbar; Werthaltigkeit besonders kritisch beurteilen.
  quelle: hwp-bur-2023__rz-0980-s384
  zitat: kann die Bestimmung eines realistischen Veräusserungswerts in der Praxis schwierig sein
- text: Zur Veräusserung im ordentlichen Geschäftsverlauf bestimmte immaterielle Werte (z.B. Software zum Weiterverkauf) gehören zu den Vorräten, nicht zu I1.
  quelle: hwp-bur-2023__rz-0412-s243
  zitat: Sind immaterielle Werte zur Veräusserung im ordentlichen Geschäftsverlauf bestimmt, werden sie wie Vorräte behandelt.
- text: Nicht einbezahltes Grundkapital (I1-408) ist eine eigene Bilanzposition im Anlagevermögen und nicht mit dem Aktienkapital zu verrechnen; Abstimmung mit Statuten/HR im Prüffeld
    Eigenkapital koordinieren.
  quelle: hwp-bur-2023__rz-0563-s273
  zitat: Ein nicht einbezahlter Teil ist unter den Aktiven gesondert auszuweisen
- text: Schritte mit Kennzeichnung WP (I1-302, I1-303) und die Sonstigen 4xx-Schritte bereitet der Agent nur vor; Auswahl, Umfang und Beurteilung entscheidet der Wirtschaftsprüfer (kein
    Visum, keine Freigabe durch den Agenten).
fragen_kunde:
- frage: Welche Aktivierungs- und Bewertungsgrundsätze wenden Sie für immaterielle Werte an (Kategorien, Ersterfassung, Abschreibungsmethode linear/degressiv, direkt/indirekt, Nutzungsdauern
    bzw. Sätze je Kategorie)?
  zweck: 'I1-101: Bewertungsgrundlagen (BE, PA)'
- frage: 'Wurden Abschreibungsmethoden, -sätze oder Nutzungsdauern gegenüber dem Vorjahr geändert? Wenn ja: welche, weshalb und mit welcher Auswirkung?'
  zweck: 'I1-102: Stetigkeit, Abgrenzung Methodenwechsel vs. Schätzungsänderung (BE, PA)'
- frage: Welche immateriellen Werte wurden im Geschäftsjahr erworben, selbst entwickelt, verkauft, gekündigt oder ausgebucht, und wie wurden Erlöse sowie Buchgewinne/-verluste verbucht?
  zweck: 'I1-103: Zu- und Abgänge (EX, VO, BE, PA)'
- frage: Werden alle aktivierten Software-Lösungen, Lizenzen, Patente und Marken noch genutzt bzw. sind sie gültig? Gibt es Anzeichen für eine Wertbeeinträchtigung (Projektabbruch, technische
    Überalterung, Ablauf von Schutzrechten, rückläufige Erträge)?
  zweck: 'I1-104/I1-406: Werthaltigkeit und Restwerte (BE)'
- frage: Wie unterscheiden Sie aktivierungspflichtige Investitionen (z.B. Kauf unbefristeter Lizenzen) von Aufwand (laufende Lizenz-/SaaS-Gebühren, Wartung, Schulung)? Wurden im Geschäftsjahr
    Investitionen direkt über die Erfolgsrechnung verbucht?
  zweck: 'I1-402/I1-405: Aktivierungsfähigkeit und Vollständigkeit (VO, BE, PA)'
- frage: 'Bei aktivierten Eigenentwicklungen: Welche Kosten wurden aktiviert, wie sind sie nachgewiesen, und liegt ein marktreifes bzw. nutzbares Ergebnis mit gesicherter Finanzierung
    vor?'
  zweck: 'I1-402: Aktivierungsvoraussetzungen selbst erarbeiteter Werte (EX, BE)'
- frage: Sind immaterielle Rechte verpfändet, abgetreten oder mit Rechten Dritter belastet? Welche Registereinträge und Ablaufdaten bestehen?
  zweck: 'I1-401/I1-303/I1-320: Bestand, Rechte, Anhangangabe (EX, RV, DO)'
- frage: Werden auf immateriellen Werten stille Reserven geführt (Abschreibungen über das betriebswirtschaftlich notwendige Mass)? Bitte Aufstellung Bestand und Veränderung per Stichtag
    und Vorjahr.
  zweck: 'I1-321/I1-407: stille Reserven und Anhangangabe (BE, DO)'
- frage: 'Besteht nicht einbezahltes Aktienkapital? Wenn ja: Betrag je Aktionär, Einforderungsbeschluss des VR, Zahlungseingänge und Angaben zur finanziellen Lage der Aktionäre.'
  zweck: 'I1-408: Bestand und Werthaltigkeit nicht einbezahltes Kapital (RV, BE)'
