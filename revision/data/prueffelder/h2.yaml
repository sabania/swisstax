schritte:
- id: H2-101
  vorgehen: 'Zuerst schriftliche Antwort (10.11, Protokolle) suchen und auswerten: Nominalwert, Wertberichtigungen, Bonitätsüberwachung, niedrigere Werte, Fremdwährung, Zinsabgrenzung,
    Verpfändung/Abtretung, Änderungen ggü. Vorjahr; mit Anhang (Grundsätze, Verpfändungen) und Kontierung abgleichen; Ergebnis im Textfeld. Nur wenn sie fehlt: Fragen als Notiz «Pendenz»
    erfassen.'
  nachweise:
  - Schriftliche Antwort/Befragungsprotokoll GL
  - Anhang Jahresrechnung (Grundsätze)
  - Vorjahresakte
  rechnen: ''
  feststellung_wenn: Grundsätze fehlen oder widersprechen Art. 960/960a OR (z.B. keine Wertberichtigung trotz Anzeichen) oder Änderung ohne Offenlegung; Verpfändung/Abtretung nicht im
    Anhang.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung über die angewandten Bilanzierungs- und Bewertungsgrundsätze
  - quelle: ser-2022__anh-d-s081-1
    zitat: Besprechung mit der Unternehmensleitung betreffend allfällige niedrigere Marktwerte
  - quelle: ser-2022__anh-d-s077-1
    zitat: Befragung, ob Forderungen verpfändet, abgetreten oder zum Inkasso gegeben worden sind
  - quelle: ser-2022__anh-d-s072-1
    zitat: Befragung über allfällige Änderungen der Darstellung der Jahresrechnung oder der Bewertungsgrundsätze
  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: H2-102
  vorgehen: 'Fristigkeit je Darlehen aus schriftlicher Antwort (10.11) bzw. dem Vertrag ableiten: innert 12 Monaten nach Bilanzstichtag fällige Beträge/Amortisationen ins Umlaufvermögen
    (übrige kurzfristige Forderungen), übrige als Finanzanlagen. Agent erstellt Fälligkeitsübersicht, vergleicht mit der Bilanzgliederung und dokumentiert Abweichungen; offene Punkte
    als Notiz «Pendenz» (Frage an Kunde, H2-102).'
  nachweise:
  - Darlehensaufstellung mit Fälligkeiten
  - Darlehensverträge (Laufzeit, Amortisation)
  - Bilanz/Anhang
  - Antwort GL
  rechnen: Kurzfristiger Anteil = Σ Rückzahlungen/Amortisationen fällig innert 12 Monaten ab Bilanzstichtag; langfristiger Anteil = Darlehenssaldo − kurzfristiger Anteil
  feststellung_wenn: Langfristiges Darlehen im Umlaufvermögen, innert 12 Monaten fälliger Teil im Anlagevermögen oder Darlehen unter Forderungen aus Lieferungen und Leistungen ausgewiesen.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Finanzanlagen
  - quelle: or__art-959
    zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
  - quelle: or__art-959a-t1
    zitat: c. übrige kurzfristige Forderungen,
  - quelle: hwp-bur-2023__rz-0265-s216
    zitat: Die Abgrenzung zu den «übrigen kurzfristigen Forderungen» (Umlaufvermögen) liegt in der Fristigkeit.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst Frage als Pendenz'
- id: H2-201
  vorgehen: '1) Ausweis (Art. 959a Abs. 4 OR): Kreis der Nahestehenden bestimmen (Aktienbuch, HR-Auszug, VR/GL, Beteiligungen) und Darlehensaufstellung, OP-Listen Debitoren/übrige Forderungen
    sowie Hauptbuch nach diesen Namen durchsuchen. Treffer mit Betrag, Konto und Ausweisort (Bilanz/Anhang) im Textfeld dokumentieren; Vollständigkeitsbestätigung der GL als Frage/Pendenz
    erfassen. 2) Zinsvergleich ESTV (Steuerpraxis): Je Treffer Vertragszins erfassen und mit dem ESTV-Mindestsatz des GJ vergleichen (verzinsliches FK in der Saldoliste? → Selbstkosten
    + ½ %). 3) Art. 680 Abs. 2 OR: Summe der Aktionärsforderungen an P1-305 übergeben (Querverweis in revio). Anzeichen (Σ > freies EK = Total EK − einbezahltes Grundkapital, oder EK
    negativ): Notiz «Pendenz» an WP mit Beträgen und Verweis P1-305/H2-404; keine eigene Würdigung. 4) Covid-19-Kredit offen (Bankverbindlichkeiten L1/N1, Anhang)? Dann jedes während
    der Solidarbürgschaft gewährte oder erhöhte Darlehen an Beteiligte/Nahestehende als Notiz «Wesentliche Feststellungen» (Konto, Datum, Betrag) für den WP markieren. Frist und Information
    von GV/Bürgschaftsorganisation (Art. 23) entscheidet und veranlasst nur der WP (vgl. `aufgabe gvb-bericht`).'
  nachweise:
  - Aktienbuch
  - Handelsregisterauszug
  - Liste VR/GL und Beteiligungen
  - Debitoren-OP-Liste und Einzelnachweis übrige Forderungen
  - Hauptbuch
  - Darlehensverträge (Vertragszins)
  - Saldoliste (verzinsliches FK, Zinsaufwand, Eigenkapital)
  - Bankverbindlichkeiten/Anhang (Covid-19-Kredit)
  rechnen: (1) Σ Forderungen ggü. Beteiligten/Organen bzw. Beteiligungsgesellschaften (inkl. in Debitoren/übrigen Forderungen erfasster Posten) = gesondert ausgewiesener Betrag in Bilanz
    oder Anhang; (2) Mindestzins bei verzinslichem FK ≈ Zinsaufwand / Ø verzinsliches FK + 0,5 % (Näherung, Würdigung WP), mindestens ESTV-Satz 1.1 des GJ; Differenz = Mindestzins −
    Vertragszins; (3) Σ Forderungen mit Darlehenscharakter ggü. Aktionären (up-/cross-stream, ohne operative LuL mit üblichen Zahlungszielen) = Input für P1-305 (Art. 680 Abs. 2 OR)
  feststellung_wenn: Forderung/Darlehen gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften besteht, ist aber nicht gesondert in Bilanz oder Anhang ausgewiesen (Art. 959a
    Abs. 4 OR); Darlehen an Beteiligte/Nahestehende trotz offenem Covid-19-Kredit; Vertragszins unter ESTV-Mindestsatz → Notiz «Pendenz» Steuerrisiko an WP.
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Feststellung von Forderungen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
  - quelle: estv-zinsen-2026__s001-1
    zitat: Die Gewährung unverzinslicher oder ungenügend verzinster Vorschüsse oder Darlehen an Beteiligte oder an ihnen nahestehende Dritte stellt eine geldwerte Leistung dar.
