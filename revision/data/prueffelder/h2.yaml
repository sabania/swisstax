- id: H2-404
  vorgehen: 'Nur auf Anweisung des WP (4xx); ohne Anweisung offen lassen, Anzeichen (Aktionärsforderung > freies EK, negatives EK) als Pendenz an WP. Die vorbereitbare EP-Prüfung erfolgt
    in P1-305. Mit Anweisung: Aktionärsforderungen summieren (ohne Abzug von Schulden unter Rangrücktritt), freies und ausschüttbares EK rechnen, Kriterienraster nach Rz 175–177 mit
    Belegen und Liquidität im Auszahlungszeitpunkt zusammenstellen. Würdigung, Schluss und Bericht (Musterhinweis nur als Vorschlag) beim WP.'
  nachweise:
  - Darlehensaufstellung Aktionäre/Konzern (inkl. Cash-Pool-Bestände)
  - Eigenkapitalnachweis (einbezahltes Kapital, gesetzliche Reserven)
  - Aufstellung stille Reserven
  - Drittvergleichsanalyse/VR-Beschluss
  - Verträge und Rangrücktritte der Gegenforderungen
  - Antrag Verwendung Bilanzgewinn
  - Budget/Liquiditätsplanung
  rechnen: '(1) Freies EK = Total EK − einbezahltes Grundkapital (+ stille Reserven netto nach latenten Steuern); Test: Σ Aktionärsforderungen mit Darlehenscharakter (abzgl. nur verrechenbarer
    Verbindlichkeiten, nie solcher unter Rangrücktritt) ≤ freies EK. (2) Ausschüttbares EK = Total EK − einbezahltes Grundkapital − nicht einbezahltes Grundkapital − gesperrte gesetzliche
    Kapital-/Gewinnreserven − notwendige Zuweisung an die gesetzliche Gewinnreserve − Aktionärs-/Konzernforderungen ohne bestandenen Drittvergleich (nur offene Reserven, ohne stille
    Reserven); Test: beantragte Ausschüttung ≤ ausschüttbares EK. Rechnung im Rechenmodul (rechne).'
  feststellung_wenn: Aktionärsdarlehen > freies EK und Drittvergleich nicht bestanden oder nicht dokumentiert (gilt als nicht gegeben); Ausschüttung > ausschüttbares EK; Verrechnung
    mit Schuld unter Rangrücktritt.
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c012-1
