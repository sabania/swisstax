# Prüffeld H2 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: H2
bezeichnung: Aktivdarlehen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 16
    korrigiert: false
kurzbeschrieb: 'Gewährte Darlehen an Dritte, Beteiligte/Organe und Beteiligungs- bzw. Konzerngesellschaften (kurz- oder langfristig). In der eingeschränkten Revision: Befragung zu Bewertung
  und Fristigkeit, Feststellung nahestehender Darlehensnehmer, Abstimmung mit internen Nachweisen, Bonität/Wertberichtigung, Zinsabgrenzung, Ausweis (Art. 959a Abs. 4 OR) und Einlagenrückgewähr
  (Art. 680 Abs. 2 OR).'
gesetz:
- thema: 'Mindestgliederung: Finanzanlagen im Anlagevermögen (Art. 959a Abs. 1 Ziff. 2 lit. a OR)'
  quelle: or__art-959a-t1
  zitat: a. Finanzanlagen,
- thema: Klassierung Umlauf-/Anlagevermögen nach Fristigkeit (Art. 959 Abs. 3 OR)
  quelle: or__art-959
  zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
- thema: Gesonderter Ausweis von Forderungen gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Überprüfung bei Anzeichen einer Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Höchstbewertung und Wertberichtigungen (Art. 960a Abs. 2 und 3 OR)
  quelle: or__art-960a
  zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
- thema: Zusätzliche Wertberichtigungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Zeitliche Abgrenzung von Zinserträgen (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verzicht auf zeitliche Abgrenzung bei kleinen Finanzerträgen (Art. 958b Abs. 2 OR)
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- thema: 'Anhang: Aufschlüsselungen und Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 2 und 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: Verbot der Einlagenrückgewähr AG (Art. 680 Abs. 2 OR)
  quelle: or__art-680
  zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- thema: Verbot der Einlagenrückgewähr GmbH (Art. 793 Abs. 2 OR)
  quelle: or__art-793
  zitat: Die Einlagen dürfen nicht zurückerstattet werden.
- thema: Rückerstattung ungerechtfertigter Leistungen an Aktionäre/Organe/Nahestehende (Art. 678 OR)
  quelle: or__art-678
  zitat: sind zur Rückerstattung von Dividenden, Tantiemen, anderen Gewinnanteilen, Vergütungen, Bauzinsen, gesetzlichen Kapital- und Gewinnreserven oder anderen Leistungen verpflichtet
risiken:
- text: Darlehen besteht nicht (mehr) oder Saldo ist falsch (z.B. Rückzahlung nicht verbucht, Saldo nicht durch Vertrag/Saldomeldung gedeckt).
  pruefziele:
  - EX
  - VO
  quelle: hwp-bur-2023__rz-0269-s217
  zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
- text: 'Überbewertung: ungenügende Bonität des Darlehensnehmers oder unverwertbare Sicherheiten ohne angemessene Wertberichtigung.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0271-s217
  zitat: aufgrund der finanziellen Situation der Schuldnerin oder des Schuldners, unter Berücksichtigung erhaltener Sicherheiten
- text: Darlehen an Nahestehende (Aktionäre, Organe, Beteiligungsgesellschaften) nicht gesondert ausgewiesen, z.B. unter Debitoren oder übrigen Forderungen versteckt.
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0174-s195
  zitat: Die genannte Unterteilung ist aus Gründen der Transparenz pro Forderungs- und Verbindlichkeitsposition in der Bilanz vorzunehmen
- text: 'Falsche Fristigkeit: langfristige Darlehen im Umlaufvermögen bzw. innert 12 Monaten fällige Teile im Anlagevermögen.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0265-s216
  zitat: Die Abgrenzung zu den «übrigen kurzfristigen Forderungen» (Umlaufvermögen) liegt in der Fristigkeit.
- text: 'Verbotene Einlagenrückgewähr: Aktionärsdarlehen übersteigen das freie Eigenkapital und halten dem Drittvergleich nicht stand.'
  pruefziele:
  - RV
  - DO
  quelle: hwp-er-2026__rz-0167-s215
  zitat: ist das freie Eigenkapital mit dem Total der Forderungen gegenüber Aktionären zu vergleichen
- text: Verdeckte Gewinnausschüttung bzw. missbräuchliches Darlehen (unangemessen günstige Konditionen, Klumpenrisiko, simulierter Vertrag).
  pruefziele:
  - EN
  - RV
  - BE
  quelle: hwp-bur-2023__rz-0177-s197
  zitat: das Darlehen im Vergleich zu anderen Bilanzpositionen unverhältnismässig hoch ist und ein Klumpenrisiko darstellt
- text: Zinsen nicht periodengerecht abgegrenzt, nicht verbucht oder mit dem Darlehen kapitalisiert.
  pruefziele:
  - VO
  - PA
  quelle: hwp-er-2026__rz-0177-s217
  zitat: Werden die Zinsen vereinbarungsgemäss bezahlt und nicht mit dem Darlehen kapitalisiert?
- text: Steuerrisiken bei un- oder ungenügend verzinsten Darlehen an Beteiligte (geldwerte Leistung, Verrechnungssteuer) nicht berücksichtigt.
  pruefziele:
  - VO
  - BE
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: Erfüllen Darlehen und andere Forderungen an nahestehende Personen den Tatbestand steuerbarer geldwerter Leistungen, sind die allenfalls zu erwartenden Steuernachforderungen
    zu berücksichtigen
- text: Gewährte Darlehen mit Rangrücktritt nur isoliert statt anhand des Gesamtengagements beurteilt.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0272-s218
  zitat: Das gesamte Engagement gegenüber dem Schuldnerunternehmen ist in die Beurteilung einzubeziehen
- text: Tief- oder unverzinsliche langfristige Darlehen zum Nennwert statt zum Barwert bilanziert.
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0270-s217
  zitat: Falls bei tief- oder unverzinslichen langfristigen Forderungen eine erhebliche Differenz zwischen Nennwert und Barwert besteht, ist eine Wertberichtigung auf den Barwert vorzunehmen.
- text: 'Fremdwährungsdarlehen: unrealisierte Kursgewinne erfasst (Bewertung über Anschaffungskosten).'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0271-s217
  zitat: Dies gilt insbesondere im Zusammenhang mit unrealisierten Kursgewinnen bei Finanzanlagen in fremder Währung
unterlagen:
- dokument: Aufstellung der Aktivdarlehen per 31.12. (Darlehensnehmer, Betrag, Zins, Fälligkeit/Amortisation, Sicherheiten, Rangrücktritt)
  zweck: Abstimmung mit Hauptbuch und Jahresrechnung, Fristigkeit, Basis für alle Schritte
  quelle: ser-2022__anh-d-s081-1
  zitat: Abstimmung einer Aufstellung der Finanzanlagen per Bilanzstichtag mit der Jahresrechnung
- dokument: Darlehensverträge inkl. Nachträge/Konditionenänderungen
  zweck: Bestand, Rechte, Konditionen, Drittvergleich
  quelle: hwp-bur-2023__rz-0268-s217
  zitat: Insbesondere sollten bei allen längerfristigen Darlehensverhältnissen die wichtigsten Vertragspunkte im Interesse der Beweisbarkeit schriftlich festgehalten werden.
- dokument: Saldomeldungen/Saldobestätigungen der Darlehensnehmer bzw. Abstimmung Gegenbuchhaltung (Konzern), soweit beim Unternehmen vorhanden
  zweck: Bestandsnachweis (nicht durch die Revisionsstelle einholen)
  quelle: hwp-bur-2023__rz-0172-s195
  zitat: Die Bestandsermittlung erfolgt in der Regel durch Abstimmung mit Saldomeldungen oder Verträgen.
- dokument: Zinsabrechnungen/Zinsquittungen und Bankauszüge mit Zins- und Amortisationseingängen (inkl. neue Rechnung)
  zweck: Termintreue, Vollständigkeit Zinsertrag, Bonitätsindiz
  quelle: hwp-er-2026__rz-0177-s217
  zitat: Wurden Rückzahlungen vereinbarungsgemäss geleistet?
- dokument: Letzte Jahresrechnungen bzw. Bonitätsinformationen der Darlehensnehmer
  zweck: Bonitätsbeurteilung, Wertberichtigungsbedarf
  quelle: hwp-bur-2023__rz-0173-s195
  zitat: Zur Beurteilung der Bonität kann ggf. die Jahresrechnung des Schuldners oder der Schuldnerin herangezogen werden.
- dokument: Sicherheitenverträge (Pfand, Bürgschaft, Garantie) und Rangrücktrittsvereinbarungen
  zweck: Werthaltigkeit und Verwertbarkeit der Sicherheiten
  quelle: hwp-bur-2023__rz-0273-s218
  zitat: Bei der Beurteilung erhaltener Sicherheiten ist nicht nur deren Wert, sondern auch die rechtliche und wirtschaftliche Möglichkeit der Verwertung zu berücksichtigen.
- dokument: VR- und GV-Protokolle (Genehmigung der Darlehen)
  zweck: Genehmigung, Sachverhalte mit Auswirkung auf die Jahresrechnung
  quelle: ser-2022__anh-d-s073-1
  zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen
- dokument: Aktienbuch, Handelsregisterauszug, Liste der Beteiligungen
  zweck: Bestimmung nahestehender Personen/Gesellschaften (Vollständigkeit)
  quelle: hwp-er-2026__rz-0161-s212
  zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
- dokument: Drittvergleichsanalyse und Schlussfolgerung des VR zu Aktionärs-/Konzerndarlehen
  zweck: Beurteilung Art. 680 Abs. 2 OR
  quelle: hwp-er-2026__rz-0181-s218
  zitat: Es bedarf einer Schlussfolgerung durch den Verwaltungsrat, dass Drittbedingungen eingehalten sind.
- dokument: Detailnachweis der stillen Reserven (Bestand und Veränderung)
  zweck: Abstimmung stiller Reserven auf Darlehen, Nettoauflösung
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: Kontoblätter der Darlehens- und Zinskonten in neuer Rechnung
  zweck: Rückzahlungen/Ausbuchungen nach dem Stichtag, Vorhandensein
  quelle: ser-2022__anh-d-s077-2
  zitat: Durchsicht von Zahlungen in neuer Rechnung und von Verträgen zur Feststellung des Vorhandenseins der Forderungen
- dokument: Antrag des VR über die Verwendung des Bilanzgewinns
  zweck: Ausschüttungsfähigkeit bei Aktionärsdarlehen (Sperrung freien Eigenkapitals)
  quelle: hwp-er-2026__rz-0170-s216
  zitat: Bestehen Aktionärs- bzw. Konzerndarlehen, die einem Drittvergleich nicht standhalten, führt dies zu einer Sperrung von frei verfügbarem Eigenkapital im gesamten Umfang dieser
    Darlehen.
bewertung:
- regel: Ersterfassung zu Anschaffungskosten; Forderungen grundsätzlich zum Nominalwert.
  quelle: hwp-bur-2023__rz-0270-s217
  zitat: Die Ersterfassung von Finanzanlagen erfolgt zu Anschaffungskosten (Art. 960a Abs. 1 OR).
- regel: Folgebewertung höchstens zum Anschaffungswert abzüglich notwendiger Wertberichtigungen (Art. 960a Abs. 2 und 3 OR).
  quelle: hwp-bur-2023__rz-0271-s217
  zitat: In der Folgebewertung sind die Finanzanlagen zu ihrem Anschaffungswert abzüglich notwendiger Wertberichtigungen zu bilanzieren
- regel: Wertberichtigung im Einzelfall nach finanzieller Lage des Schuldners und unter Berücksichtigung erhaltener Sicherheiten.
  quelle: hwp-bur-2023__rz-0271-s217
  zitat: aufgrund der finanziellen Situation der Schuldnerin oder des Schuldners, unter Berücksichtigung erhaltener Sicherheiten
- regel: Sicherheiten nur mit rechtlicher und wirtschaftlicher Verwertbarkeit anrechnen.
  quelle: hwp-bur-2023__rz-0273-s218
  zitat: Bei der Beurteilung erhaltener Sicherheiten ist nicht nur deren Wert, sondern auch die rechtliche und wirtschaftliche Möglichkeit der Verwertung zu berücksichtigen.
- regel: 'Tief- oder unverzinsliche langfristige Darlehen: Wertberichtigung auf den Barwert bei erheblicher Differenz.'
  quelle: hwp-bur-2023__rz-0270-s217
  zitat: Falls bei tief- oder unverzinslichen langfristigen Forderungen eine erhebliche Differenz zwischen Nennwert und Barwert besteht, ist eine Wertberichtigung auf den Barwert vorzunehmen.
- regel: Darlehen an Nahestehende nach denselben Grundsätzen wie an Dritte bewerten; bei zweifelhafter Bonität angemessene Wertberichtigung.
  quelle: hwp-bur-2023__rz-0173-s195
  zitat: Im Fall zweifelhafter Bonität ist – wie bei anderen Guthaben – eine angemessene Wertberichtigung zu bilden.
- regel: Bei Begünstigung Nahestehender Steuerrisiken bilanziell berücksichtigen.
  quelle: hwp-bur-2023__rz-0173-s195
  zitat: Bei Begünstigung nahestehender Personen im Vergleich zu Dritten sind allfällige Steuerrisiken bei der Bilanzierung in geeigneter Form zu berücksichtigen
- regel: 'Darlehen mit Rangrücktritt: ganzheitliche Beurteilung des Gesamtengagements.'
  quelle: hwp-bur-2023__rz-0272-s218
  zitat: Besonders sorgfältige Bewertungsüberlegungen sind erforderlich, wenn gewährte Darlehen mit einem Rangrücktritt belastet sind
- regel: Langfristige Darlehen als Finanzanlagen bilanzieren; bei Nahestehenden gesonderter Ausweis.
  quelle: hwp-bur-2023__rz-0276-s218
  zitat: Langfristige Finanzanlagen bei nahestehenden Personen erfordern einen gesonderten Ausweis (Art. 959a Abs. 4 OR).
- regel: 'Konditionenänderungen: Beurteilung neues Darlehen vs. Fortführung (wirtschaftliche Betrachtung) beeinflusst Bewertung und Ausweis.'
  quelle: hwp-bur-2023__rz-0275-s218
  zitat: Dabei kann sich die Frage stellen, ob es sich um ein neues Darlehen oder die (angepasste) Fortführung des bestehenden Vertrags handelt.
- regel: Zinsen zeitraumbezogen abgrenzen.
  quelle: hwp-bur-2023__rz-0048-s066
  zitat: Der Grundsatz der zeitlichen Abgrenzung verlangt, dass Aufwand und Ertrag, die zeitraumbezogen anfallen (z.B. Zinsen, Miete), auch entsprechend abgegrenzt und erfasst werden.
- regel: Zinserträge aus Darlehen im Finanzertrag ausweisen.
  quelle: hwp-bur-2023__rz-0789-s328
  zitat: Erträge aus Finanzanlagen
- regel: Stille Reserven auf Finanzanlagen über die sachlich zugehörige Erfolgsposition bilden.
  quelle: hwp-bur-2023__rz-0669-s296
  zitat: So wäre es etwa nicht sachgerecht, stille Reserven auf Finanzanlagen über die Position Erlösminderungen zu bilden.
- regel: 'Steuerlich: un- oder ungenügend verzinste Darlehen an Beteiligte sind geldwerte Leistungen (ESTV-Rundschreiben 2026, gilt seit 1.1.2026; für 2025 Rundschreiben 2025 massgebend,
    im Wiki nicht vorhanden).'
  quelle: estv-zinsen-2026__s001-1
  zitat: Die Gewährung unverzinslicher oder ungenügend verzinster Vorschüsse oder Darlehen an Beteiligte oder an ihnen nahestehende Dritte stellt eine geldwerte Leistung dar.
fallstricke:
- text: 'Aktionärsdarlehen werden oft in der Debitoren-OP-Liste oder unter übrigen Forderungen geführt: Ausweis je Forderungsposition gesondert verlangen und Fristigkeit prüfen.'
  quelle: hwp-bur-2023__rz-0174-s195
  zitat: Die genannte Unterteilung ist aus Gründen der Transparenz pro Forderungs- und Verbindlichkeitsposition in der Bilanz vorzunehmen
- text: Saldobestätigungen nicht selbst bei Darlehensnehmern einholen – nicht Bestandteil der eingeschränkten Revision; nur beim Unternehmen vorhandene Nachweise verwenden.
  quelle: hwp-er-2026__rz-0134-s203
  zitat: das Einholen von Bestätigungen von Dritten (Bank-, Debitoren- oder Kreditorenbestätigungen
- text: Bei Art. 680 Abs. 2 OR Verbindlichkeiten gegenüber dem Aktionär nur abziehen, wenn Verrechnungsvoraussetzungen gegeben sind.
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Verbindlichkeiten gegenüber Aktionären dürfen nur dann von den Forderungen in Abzug gebracht werden
- text: Konzerninterne LuL-Forderungen mit üblichen Zahlungszielen gelten nicht als Aktionärsdarlehen; Forderungen mit Finanzierungscharakter hingegen schon (auch cross stream).
  quelle: hwp-er-2026__rz-0167-s215
  zitat: Konzerninterne Forderungen aus Lieferungen und Leistungen, die aus einem operativen Leistungsaustausch mit üblichen Zahlungszielen entstanden sind
- text: Stille Reserven dürfen für das freie Eigenkapital (Art. 680 Abs. 2 OR) berücksichtigt werden, für die Ausschüttungsfähigkeit zählen aber nur offene Reserven.
  quelle: hwp-er-2026__rz-0172-s216
  zitat: Wenn ohne (bzw. vor) Berücksichtigung von stillen Reserven ein Verstoss gegen Art. 680 Abs. 2 OR vorliegt, darf keine Ausschüttung erfolgen.
- text: Fehlender schriftlicher Vertrag, Zins, Rückzahlungsregelung oder Sicherheit ist ein Indiz gegen den Drittvergleich.
  quelle: hwp-er-2026__rz-0168-s215
  zitat: Das Fehlen eines schriftlichen Vertrags mit Zins und Rückzahlungskonditionen sowie allfällig notwendigen Sicherheiten kann ein Indiz dafür sein
- text: 'Bei Verdacht auf Einlagenrückgewähr kein Eventualhinweis: notwendige Prüfungshandlungen durchführen und dem WP vorlegen.'
  quelle: hwp-er-2026__rz-0180-s218
  zitat: Ein Eventualhinweis im Bericht der Revisionsstelle an die Generalversammlung ist nicht angemessen
- text: 'ESTV-Zinssätze sind jahresbezogen (safe haven): Im Wiki liegt nur das Rundschreiben 2026 vor (ab 1.1.2026); Sätze nicht auf das Geschäftsjahr 2025 übertragen.'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: Kapitalisierte statt bezahlte Zinsen sind ein Bonitäts- und Drittvergleichsindiz und keine Bestätigung der Werthaltigkeit.
  quelle: hwp-er-2026__rz-0177-s217
  zitat: Werden die Zinsen vereinbarungsgemäss bezahlt und nicht mit dem Darlehen kapitalisiert?
- text: Auch betragsmässig kleine Aktionärsdarlehen können wegen Wiederholungsgefahr für einen Hinweis wichtig sein.
  quelle: camponovo-2026-hinweispflichten__s057-1
  zitat: Aber er kann auch wichtig sein (in neuer Rechnung wieder Darlehen an Aktionär, aber jetzt 100’000)
- text: 'Abgrenzung zu benachbarten Prüffeldern beachten (H1 Finanzanlagen/Wertschriften, H3 Beteiligungen, Forderungen B/C): Darlehen nur einmal prüfen, Querverweis in revio setzen.'
fragen_kunde:
- frage: Nach welchen Grundsätzen werden Aktivdarlehen erfasst und bewertet (Nominalwert, Wertberichtigungen, Fremdwährung, Zinsabgrenzung) und gab es Änderungen gegenüber dem Vorjahr?
  zweck: H2-101 Bilanzierungs- und Bewertungsgrundsätze (BE, PA)
- frage: Welche Darlehen bzw. Amortisationen sind innert 12 Monaten nach dem Bilanzstichtag fällig?
  zweck: H2-102 Gliederung kurz-/langfristig (DO)
- frage: Bestehen Darlehen oder darlehensähnliche Forderungen gegenüber Aktionären, VR, GL, ihnen nahestehenden Personen oder Gesellschaften, an denen eine Beteiligung besteht – auch
    wenn sie unter Debitoren oder übrigen Forderungen gebucht sind?
  zweck: H2-201 Vollständigkeit nahestehende Darlehensnehmer (VO, DO)
- frage: Wie beurteilt die Geschäftsleitung die Bonität der Darlehensnehmer? Gibt es Zahlungsrückstände, Stundungen, Rangrücktritte oder Hinweise auf finanzielle Schwierigkeiten?
  zweck: H2-302 Wertberichtigungsbedarf (BE)
- frage: Wurden Darlehensforderungen verpfändet, abgetreten oder zum Inkasso gegeben?
  zweck: Rechte und Verpflichtungen, Anhangangaben (RV, DO)
- frage: Wurden nach dem Bilanzstichtag Darlehen zurückbezahlt, neu gewährt, verlängert oder Konditionen geändert?
  zweck: H2-303/H2-401 Zu-/Abgänge, Bestand, Konditionen (EX, PA)
- frage: Sind die Zinsen vereinbarungsgemäss bezahlt und per Bilanzstichtag abgegrenzt worden?
  zweck: H2-402/H2-403 Zinsabgrenzung und Vollständigkeit Zinsertrag (VO, PA)
- frage: Hat der Verwaltungsrat für Darlehen an Aktionäre bzw. Konzerngesellschaften den Drittvergleich bei Gewährung und per Abschluss beurteilt und dokumentiert? Bitte Analyse und
    VR-Beschluss zustellen.
  zweck: H2-404 Einlagenrückgewähr (RV, DO)
- frage: Bestehen auf Aktivdarlehen zusätzliche Wertberichtigungen (stille Reserven) und wurden solche im Geschäftsjahr gebildet oder aufgelöst?
  zweck: H2-321 Bestand und Veränderung stiller Reserven (BE)
testakte_2025:
- datei: B_Forderungen_aus_LuL/Darlehensvertrag_Gesellschaft_an_Aktionaer_A.md
  bezug: H2-401 Vertragseinsicht (Betrag, Zins, Rückzahlung, Sicherheit, VR-Beschluss); Grundlage für H2-302, H2-402 und H2-404 (Drittvergleich)
- datei: B_Forderungen_aus_LuL/Debitoren_OP_Liste_31.12.2025.md
