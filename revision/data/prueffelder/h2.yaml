- id: H2-321
  vorgehen: 'Detailnachweis der stillen Reserven in M-Files suchen; fehlt er → Notiz «Pendenz» «PBC-Vorschlag: Detailnachweis stille Reserven (H2-321)»; Anteil auf Aktivdarlehen (Wertberichtigungen
    über das notwendige Mass) mit Ergebnis H2-302 plausibilisieren. Bestand und Veränderung abstimmen und prüfen, ob eine wesentliche Nettoauflösung im Anhang offengelegt ist; Ergebnis
    im Textfeld festhalten.'
  nachweise:
  - Aufstellung stille Reserven (Vorjahr/Bestand/Veränderung)
  - Ergebnis H2-302
  - Anhang
  rechnen: Stille Reserven 31.12. = Vorjahr + Bildung − Auflösung; Nettoauflösung = Auflösung − Bildung (> 0 → Anhangangabe prüfen)
  feststellung_wenn: Aufstellung fehlt oder ist nicht abstimmbar, stille Reserve auf Darlehen nicht nachvollziehbar oder wesentliche Nettoauflösung ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
