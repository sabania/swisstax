gesetz:
- thema: 'Mindestgliederung: Finanzanlagen im Anlagevermögen (Art. 959a Abs. 1 Ziff. 2 lit. a OR)'
  quelle: or__art-959a-t1
  zitat: a. Finanzanlagen,
- thema: 'Mindestgliederung: übrige kurzfristige Forderungen im Umlaufvermögen (Art. 959a Abs. 1 Ziff. 1 lit. c OR) – innert 12 Monaten fällige Darlehen(-steile)'
  quelle: or__art-959a-t1
  zitat: c. übrige kurzfristige Forderungen,
- thema: Klassierung Umlauf-/Anlagevermögen nach Fristigkeit (Art. 959 Abs. 3 OR)
  quelle: or__art-959
  zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
- thema: Gesonderter Ausweis von Forderungen gegenüber Beteiligten, Organen und Beteiligungsgesellschaften (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- thema: Einzelbewertung (Art. 960 Abs. 1 OR)
  quelle: or__art-960
  zitat: Aktiven und Verbindlichkeiten werden in der Regel einzeln bewertet
- thema: Überprüfung bei Anzeichen einer Überbewertung (Art. 960 Abs. 3 OR)
  quelle: or__art-960
  zitat: Bestehen konkrete Anzeichen für eine Überbewertung von Aktiven oder für zu geringe Rückstellungen, so sind die Werte zu überprüfen und gegebenenfalls anzupassen.
- thema: Höchstbewertung und Wertberichtigungen (Art. 960a Abs. 2 und 3 OR)
  quelle: or__art-960a
  zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
- thema: Wertberichtigungen direkt oder indirekt bei den Aktiven, nicht unter den Passiven (Art. 960a Abs. 3 OR)
  quelle: or__art-960a
  zitat: Sie sind direkt oder indirekt bei den betreffenden Aktiven zulasten der Erfolgsrechnung abzusetzen und dürfen nicht unter den Passiven ausgewiesen werden.
- thema: Zusätzliche Wertberichtigungen / stille Reserven (Art. 960a Abs. 4 OR)
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- thema: Zeitliche Abgrenzung von Zinserträgen (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Verzicht auf zeitliche Abgrenzung bei kleinen Finanzerträgen (Art. 958b Abs. 2 OR)
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- thema: 'Anhang: Aufschlüsselungen und Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 2 und 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: Verbot der Einlagenrückgewähr AG (Art. 680 Abs. 2 OR)
  quelle: or__art-680
  zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- thema: Verbot der Einlagenrückgewähr GmbH (Art. 793 Abs. 2 OR)
  quelle: or__art-793
  zitat: Die Einlagen dürfen nicht zurückerstattet werden.
- thema: Rückerstattung ungerechtfertigter Leistungen an Aktionäre/Organe/Nahestehende (Art. 678 OR)
  quelle: or__art-678
  zitat: sind zur Rückerstattung von Dividenden, Tantiemen, anderen Gewinnanteilen, Vergütungen, Bauzinsen, gesetzlichen Kapital- und Gewinnreserven oder anderen Leistungen verpflichtet
- thema: 'Covid-19-Kredit: während der Solidarbürgschaft keine Darlehen an bzw. Rückzahlung von Darlehen von Gesellschaftern/Nahestehenden (Art. 2 Abs. 2 lit. b Covid-19-SBüG); Ausnahme:
    vorbestehende Verpflichtungen ggü. Gruppengesellschaft mit Sitz in der Schweiz'
  quelle: covid-sbueg__art-2-t1
  zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
- thema: 'Pflichten der Revisionsstelle bei Verletzung: Frist, dann GV, dann Bürgschaftsorganisation (Art. 23 Abs. 1 Covid-19-SBüG)'
  quelle: covid-sbueg__art-23
  zitat: Stellt die Revisionsstelle der Kreditnehmerin oder des Kreditnehmers im Rahmen der eingeschränkten oder ordentlichen Revision der Jahres- oder Konzernrechnung eine Verletzung
    einer Vorgabe nach Artikel 2 Absätze 2–4 fest, so setzt sie ihr oder ihm eine angemessene Frist zur Herstellung des ordnungsgemässen Zustandes.
risiken:
- text: Darlehen besteht nicht (mehr) oder Saldo ist falsch (z.B. Rückzahlung nicht verbucht, Saldo nicht durch Vertrag/Saldomeldung gedeckt).
  pruefziele:
  - EX
  - VO
  quelle: hwp-bur-2023__rz-0269-s217
  zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
- text: 'Überbewertung: ungenügende Bonität des Darlehensnehmers oder unverwertbare Sicherheiten ohne angemessene Wertberichtigung.'
  pruefziele:
  - BE
  quelle: hwp-bur-2023__rz-0271-s217
  zitat: aufgrund der finanziellen Situation der Schuldnerin oder des Schuldners, unter Berücksichtigung erhaltener Sicherheiten
- text: Darlehen an Nahestehende (Aktionäre, Organe, Beteiligungsgesellschaften) nicht gesondert ausgewiesen, z.B. unter Debitoren oder übrigen Forderungen versteckt.
  pruefziele:
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0174-s195
  zitat: sind jeweils gesondert in der Bilanz oder im Anhang auszuweisen (Art. 959a Abs. 4 OR)
- text: 'Falsche Fristigkeit: langfristige Darlehen im Umlaufvermögen bzw. innert 12 Monaten fällige Teile im Anlagevermögen.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0265-s216
  zitat: Die Abgrenzung zu den «übrigen kurzfristigen Forderungen» (Umlaufvermögen) liegt in der Fristigkeit.
- text: 'Verbotene Einlagenrückgewähr: Aktionärsdarlehen übersteigen das freie Eigenkapital und halten dem Drittvergleich nicht stand.'
  pruefziele:
  - RV
  - DO
  quelle: hwp-er-2026__rz-0167-s215
