- id: H2-302
  vorgehen: 'Weitergehend (WP) – nur auf ausdrückliche Anweisung des WP vorbereiten; Beurteilung beim WP. Nur bei angenommenen wesentlichen Fehlaussagen oder erhöhtem inhärentem Risiko.
    Ohne Anweisung: kein Textfeld; Auffälligkeiten aus H2-301 (Rückstand, kapitalisierte Zinsen) nur als Notiz «Pendenz» für den WP. Mit Anweisung je Darlehensnehmer Bonitätsindizien
    (Jahresrechnung, Termintreue, verwertbare Sicherheiten, Rangrücktritt) zusammenstellen; WB-Bedarf nur als Vorschlag.'
  nachweise:
  - Jahresrechnung Darlehensnehmer
  - Bankauszüge Zins-/Amortisationseingänge
  - Kontoblätter neue Rechnung
  - Sicherheitenverträge
  - Rangrücktrittsvereinbarungen
  rechnen: Wertberichtigungsbedarf = Buchwert Darlehen − voraussichtlich einbringlicher Betrag (inkl. verwertbarer Sicherheiten); Vergleich mit gebuchter Wertberichtigung
  feststellung_wenn: Indizien zweifelhafter Bonität (Verluste, negatives Eigenkapital, Zahlungsrückstände, kapitalisierte Zinsen, fehlende/unverwertbare Sicherheiten) ohne angemessene
    Wertberichtigung.
  fundstellen:
