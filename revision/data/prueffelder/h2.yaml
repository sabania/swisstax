kurzbeschrieb: 'Gewährte Darlehen an Dritte, Beteiligte/Organe und Konzerngesellschaften (kurz-/langfristig). Eingeschränkte Revision: Befragung zu Bewertung und Fristigkeit, Feststellung
  nahestehender Darlehensnehmer, Abstimmung mit internen Nachweisen, Ausweis (Art. 959a Abs. 4 OR); WP-Schritte (Bonität, Zu-/Abgänge) und 4xx inkl. Einlagenrückgewähr (Art. 680 Abs.
