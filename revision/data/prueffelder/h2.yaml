  bezug: 'H2-201: Beteiligung seit 30.09.2025 – Kreis der Beteiligungsgesellschaften für Darlehensfeststellung'
- datei: C_Uebrige_kurzfristige_Forderungen/Jahresrechnung_2025_Solarservice_Probe_GmbH.md
  bezug: 'H2-201/H2-302: Feststellung allfälliger Darlehen an die Tochter; Bonitätsunterlage (Jahresabschluss Darlehensnehmer)'
schritte:
- id: H2-101
  vorgehen: 'Befragung der Leiterin Finanzen/GL vorbereiten: Ersterfassung (Nominalwert), Folgebewertung und Wertberichtigungen, Bonitätsüberwachung, Fremdwährung, Zinsabgrenzung sowie
    Änderungen gegenüber Vorjahr. Agent erfasst die Fragen als Pendenz, wertet die schriftliche Antwort aus und gleicht sie mit Anhang (Grundsätze) und Kontierung ab; Ergebnis im Textfeld
    dokumentieren.'
  nachweise:
  - Schriftliche Antwort/Befragungsprotokoll GL
  - Anhang Jahresrechnung (Grundsätze)
  - Vorjahresakte
  rechnen: ''
  feststellung_wenn: Grundsätze fehlen oder widersprechen Art. 960/960a OR (z.B. keine Wertberichtigung trotz Anzeichen, Bewertung über Nominalwert) oder wurden gegenüber Vorjahr ohne
    Offenlegung geändert.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung über die angewandten Bilanzierungs- und Bewertungsgrundsätze
  - quelle: ser-2022__anh-d-s072-1
    zitat: Befragung über allfällige Änderungen der Darstellung der Jahresrechnung oder der Bewertungsgrundsätze
  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
- id: H2-102
  vorgehen: 'Fristigkeit je Darlehen erfragen bzw. aus dem Vertrag ableiten: innert 12 Monaten nach Bilanzstichtag fällige Beträge/Amortisationen ins Umlaufvermögen (übrige kurzfristige
    Forderungen), übrige als Finanzanlagen. Agent erstellt Fälligkeitsübersicht, vergleicht mit der Bilanzgliederung und dokumentiert Abweichungen; offene Punkte als Frage an GL.'
  nachweise:
  - Darlehensaufstellung mit Fälligkeiten
  - Darlehensverträge (Laufzeit, Amortisation)
  - Bilanz/Anhang
  - Antwort GL
  rechnen: Kurzfristiger Anteil = Σ Rückzahlungen/Amortisationen fällig bis 31.12. des Folgejahres; langfristiger Anteil = Darlehenssaldo − kurzfristiger Anteil
  feststellung_wenn: Langfristiges Darlehen im Umlaufvermögen, innert 12 Monaten fälliger Teil im Anlagevermögen oder Darlehen unter Forderungen aus Lieferungen und Leistungen ausgewiesen.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Finanzanlagen
  - quelle: or__art-959
    zitat: andere Aktiven, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zu flüssigen Mitteln werden
  - quelle: hwp-bur-2023__rz-0265-s216
    zitat: Die Abgrenzung zu den «übrigen kurzfristigen Forderungen» (Umlaufvermögen) liegt in der Fristigkeit.
- id: H2-201
  vorgehen: Kreis der Nahestehenden bestimmen (Aktienbuch, HR-Auszug, VR/GL, Beteiligungen) und Darlehensaufstellung, OP-Listen Debitoren/übrige Forderungen sowie Hauptbuch nach diesen
    Namen durchsuchen. Treffer mit Betrag, Konto und Ausweisort (Bilanz/Anhang) im Textfeld dokumentieren; Vollständigkeitsbestätigung der GL als Frage/Pendenz erfassen.
  nachweise:
  - Aktienbuch
  - Handelsregisterauszug
  - Liste VR/GL und Beteiligungen
  - Debitoren-OP-Liste und Einzelnachweis übrige Forderungen
  - Hauptbuch
  rechnen: Σ Forderungen ggü. Beteiligten/Organen bzw. Beteiligungsgesellschaften (inkl. in Debitoren/übrigen Forderungen erfasster Posten) = gesondert ausgewiesener Betrag in Bilanz
    oder Anhang
  feststellung_wenn: Forderung/Darlehen gegenüber Beteiligten, Organen oder Beteiligungsgesellschaften besteht, ist aber nicht gesondert in Bilanz oder Anhang ausgewiesen (Art. 959a
    Abs. 4 OR).
  fundstellen:
  - quelle: ser-2022__anh-d-s077-1
    zitat: Feststellung von Forderungen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: hwp-er-2026__rz-0161-s212
    zitat: Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle
- id: H2-301
  vorgehen: 'Darlehensaufstellung per 31.12. mit Hauptbuch und Bilanz abstimmen. Je Darlehen Saldo gegen beim Unternehmen vorhandene Nachweise prüfen: a) Saldomeldungen, b) Zinsquittungen/Bankbelege,
    c) Verträge, d) Gegenbuchhaltung (Konzern), e) Kontoauszüge u.a. Keine externen Bestätigungen einholen; fehlende Unterlagen als PBC-Pendenz erfassen und Ergebnis im Textfeld dokumentieren.'
  nachweise:
  - Darlehensaufstellung 31.12.
  - Kontoblatt Darlehenskonto
  - Darlehensverträge
  - Saldomeldungen (falls vorhanden)
  - Zinsabrechnungen/Bankauszüge
  - Abstimmung Gegenbuchhaltung (Konzern)
  rechnen: Σ Einzelnachweis Aktivdarlehen = Saldo Darlehenskonten Hauptbuch = Bilanzposition (Differenz 0); je Darlehen Saldo Buchhaltung = Saldo gemäss Vertrag/Saldomeldung
  feststellung_wenn: Nicht erklärbare Differenz zwischen Aufstellung, Hauptbuch und Bilanz, fehlender Vertrag/Nachweis oder Saldo weicht von Saldomeldung bzw. Gegenbuchhaltung ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Abstimmung einer Aufstellung der Finanzanlagen per Bilanzstichtag mit der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0269-s217
    zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
  - quelle: hwp-bur-2023__rz-0269-s217
    zitat: Bei Darlehen zwischen Konzerngesellschaften sind die Salden der Buchhaltungen gegenseitig abzustimmen.
  - quelle: hwp-er-2026__rz-0134-s203
    zitat: das Einholen von Bestätigungen von Dritten (Bank-, Debitoren- oder Kreditorenbestätigungen
- id: H2-302
  vorgehen: 'Je Darlehensnehmer Bonitätsindizien zusammenstellen: a) letzte Jahresrechnung (Eigenkapital, Ergebnis, Liquidität), b) Termintreue von Zins- und Amortisationszahlungen inkl.
    neue Rechnung, c) Sicherheiten und deren Verwertbarkeit, d) weitere Infos (Rangrücktritt, Betreibungen). Agent dokumentiert Indizien und allfälligen Wertberichtigungsbedarf als Vorschlag;
    die Beurteilung trifft der WP.'
  nachweise:
  - Jahresrechnung Darlehensnehmer
  - Bankauszüge Zins-/Amortisationseingänge
  - Kontoblätter neue Rechnung
  - Sicherheitenverträge
  - Rangrücktrittsvereinbarungen
  rechnen: Wertberichtigungsbedarf = Buchwert Darlehen − voraussichtlich einbringlicher Betrag (inkl. verwertbarer Sicherheiten); Vergleich mit gebuchter Wertberichtigung
  feststellung_wenn: Indizien zweifelhafter Bonität (Verluste, negatives Eigenkapital, Zahlungsrückstände, kapitalisierte Zinsen, fehlende/unverwertbare Sicherheiten) ohne angemessene
    Wertberichtigung.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Beurteilung der Bonität der Darlehensnehmer anhand deren Jahresabschlüssen oder anderer Informationen (sofern verfügbar)
  - quelle: hwp-bur-2023__rz-0173-s195
    zitat: Im Fall zweifelhafter Bonität ist – wie bei anderen Guthaben – eine angemessene Wertberichtigung zu bilden.
  - quelle: hwp-bur-2023__rz-0273-s218
    zitat: Bei der Beurteilung erhaltener Sicherheiten ist nicht nur deren Wert, sondern auch die rechtliche und wirtschaftliche Möglichkeit der Verwertung zu berücksichtigen.
  - quelle: hwp-er-2026__rz-0177-s217
    zitat: Wurde die Bonität der Gegenpartei bei Vertragsabschluss geprüft und wird sie seither regelmässig überwacht?
- id: H2-303
  vorgehen: Bewegungen der Darlehenskonten (Auszahlungen, Rückzahlungen, Amortisationen, Wertberichtigungen) anhand Verträgen, VR-Beschlüssen, Bankbelegen und Gegenbuchungen prüfen.
    Kontenbewegung Vorjahr bis 31.12. nachrechnen und Konten in neuer Rechnung auf Rückzahlungen oder Ausbuchungen durchsehen; ungewöhnliche Posten im Textfeld dokumentieren.
  nachweise:
  - Kontoblatt Darlehenskonto
  - Bankbelege Aus-/Rückzahlungen
  - Darlehensverträge
  - VR-Beschlüsse
  - Kontoblätter neue Rechnung
  rechnen: Saldo 01.01. + Zugänge (Auszahlungen) − Abgänge (Rückzahlungen/Amortisationen) − Wertberichtigungen = Saldo 31.12.
  feststellung_wenn: Zu- oder Abgang ohne Beleg, Vertrag oder Genehmigung, unplausible Gegenbuchung (z.B. Verrechnung ohne Grundlage) oder nicht abstimmbare Kontenbewegung.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Prüfung der im Hauptbuch gebuchten Geschäftsfälle und Wertänderungen anhand der Unterlagen und der Gegenbuchungen
  - quelle: ser-2022__anh-d-s077-2
    zitat: Durchsicht von Zahlungen in neuer Rechnung und von Verträgen zur Feststellung des Vorhandenseins der Forderungen
  - quelle: ser-2022__anh-d-s081-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- id: H2-304
  vorgehen: Erfolgskonten mit Bezug zu Darlehen (Finanzertrag/-aufwand, Verluste aus Forderungsverzicht oder Ausbuchung, Kursdifferenzen, Auflösung von Wertberichtigungen) durchsehen
    und mit Belegen abstimmen. Prüfen, dass keine unrealisierten Kursgewinne auf Fremdwährungsdarlehen gebucht und Verluste in der richtigen Periode erfasst sind.
  nachweise:
  - Kontoblätter Finanzertrag/-aufwand
  - Belege zu Ausbuchungen/Forderungsverzichten
  - Kursberechnung Fremdwährungsdarlehen
  rechnen: ''
  feststellung_wenn: Verlust aus Darlehen nicht oder in falscher Periode erfasst, unrealisierte Kursgewinne gebucht oder Erfolg ohne Beleg bzw. falsch klassiert.
  fundstellen:
  - quelle: ser-2022__anh-d-s081-1
    zitat: Durchsicht von Konten und Belegen, ob Gewinne, Verluste und Erträge ordnungsgemäss erfasst worden sind
  - quelle: hwp-bur-2023__rz-0271-s217
    zitat: Dies gilt insbesondere im Zusammenhang mit unrealisierten Kursgewinnen bei Finanzanlagen in fremder Währung
  - quelle: or__art-960a
    zitat: anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden
- id: H2-320
  vorgehen: 'Anhang auf Angaben zu Aktivdarlehen prüfen: gesonderter Ausweis der Forderungen gegenüber Beteiligten/Organen und Beteiligungsgesellschaften (falls nicht in der Bilanz),
    Grundsätze, Aufschlüsselungen, Nettoauflösung stiller Reserven. Beträge mit Darlehensaufstellung bzw. Ergebnis H2-201 abgleichen; fehlende oder falsche Angaben als Feststellung erfassen.'
  nachweise:
  - Anhang Jahresrechnung
  - Darlehensaufstellung
  - Ergebnis H2-201
  rechnen: Betrag im Anhang (Forderungen ggü. Beteiligten/Organen bzw. Beteiligungsgesellschaften) = Σ gemäss H2-201
  feststellung_wenn: Pflichtangabe fehlt (insb. Art. 959a Abs. 4 OR, wenn nicht in der Bilanz) oder Anhangbetrag weicht von der Darlehensaufstellung ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s098-2
    zitat: Durchsicht des Anhangs auf vollständige Offenlegung der aufgrund der Befragungen zutreffenden Positionen gemäss Art. 959c OR
  - quelle: or__art-959a-t2
    zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
  - quelle: or__art-959c-t1
    zitat: Angaben, Aufschlüsselungen und Erläuterungen zu Positionen der Bilanz und der Erfolgsrechnung
- id: H2-321
  vorgehen: Detailnachweis der stillen Reserven beim Kunden anfordern; Anteil auf Aktivdarlehen (Wertberichtigungen über das notwendige Mass) mit Ergebnis H2-302 plausibilisieren. Bestand
    und Veränderung abstimmen und prüfen, ob eine wesentliche Nettoauflösung im Anhang offengelegt ist; Ergebnis im Textfeld festhalten.
  nachweise:
  - Aufstellung stille Reserven (Vorjahr/Bestand/Veränderung)
  - Ergebnis H2-302
  - Anhang
  rechnen: Stille Reserven 31.12. = Vorjahr + Bildung − Auflösung; Nettoauflösung = Auflösung − Bildung (> 0 → Anhangangabe prüfen)
  feststellung_wenn: Aufstellung fehlt oder ist nicht abstimmbar, stille Reserve auf Darlehen nicht nachvollziehbar oder wesentliche Nettoauflösung ohne Anhangangabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: ser-2022__anh-d-s072-2
    zitat: Plausibilisierung von Bestand und Veränderungen der stillen Reserven auf Basis der Erkenntnisse aus den Prüfungsarbeiten bei den einzelnen Bilanzpositionen
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- id: H2-322
  vorgehen: Dauerakte mit neuen oder geänderten Darlehensverträgen, Nachträgen, Sicherheiten- und Rangrücktrittsvereinbarungen, VR-Beschlüssen und Drittvergleichsdokumentation aktualisieren;
    überholte Dokumente als ersetzt kennzeichnen. Agent legt in M-Files ab bzw. schlägt die Ablage vor.
  nachweise:
  - Darlehensverträge und Nachträge
  - Sicherheiten-/Rangrücktrittsvereinbarungen
  - VR-Beschlüsse
  - Drittvergleichsdokumentation
  rechnen: ''
  feststellung_wenn: Wesentlicher Vertrag (neues Darlehen, Konditionenänderung) fehlt in der Dauerakte und kann nicht beschafft werden → Pendenz.
  fundstellen:
  - quelle: ser-2022__7-3
    zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen, die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben
- id: H2-401
  vorgehen: 'Darlehensverträge einsehen und Eckdaten erfassen: Parteien (Gesellschaft selbst als Gläubigerin), Betrag, Zins, Fälligkeit, Kündigung, Amortisation, Sicherheiten, Rangrücktritt,
    Genehmigung. Mit Buchhaltung abgleichen; Konditionenänderungen (neues Darlehen vs. Fortführung) und fehlende Schriftform als Indiz für den Drittvergleich vermerken.'
  nachweise:
  - Darlehensverträge inkl. Nachträge
  - VR-Beschluss zur Gewährung
  - Kontoblatt Darlehenskonto
  rechnen: ''
  feststellung_wenn: Kein schriftlicher Vertrag, Vertrag nicht von der Gesellschaft abgeschlossen, Konditionen weichen von der Buchung ab oder Genehmigung fehlt.
  fundstellen:
  - quelle: hwp-er-2026__rz-0175-s217
    zitat: welcher die üblichen Darlehensbedingungen wie Zinssatz, Fälligkeit, Kündigungsmöglichkeiten, Rückzahlungen, Sicherheiten etc. enthält
  - quelle: hwp-bur-2023__rz-0268-s217
    zitat: Für Darlehen an nahestehende Personen und Konzerngesellschaften sind die gleichen Anforderungen an die Dokumentation zu stellen wie für Darlehen an Dritte.
  - quelle: hwp-bur-2023__rz-0275-s218
    zitat: Dabei kann sich die Frage stellen, ob es sich um ein neues Darlehen oder die (angepasste) Fortführung des bestehenden Vertrags handelt.
- id: H2-402
  vorgehen: Je verzinslichem Darlehen den Marchzins vom letzten Zinstermin bis 31.12. gemäss Vertrag berechnen und mit der gebuchten aktiven Rechnungsabgrenzung vergleichen; auf nicht
    bezahlte oder kapitalisierte Zinsen achten. Prüfen, ob der Verzicht nach Art. 958b Abs. 2 OR (Finanzerträge bis CHF 100'000) beansprucht wird; Berechnung im Textfeld dokumentieren.
  nachweise:
  - Darlehensverträge (Zinssatz, Zinstermine)
  - Kontoblatt aktive Rechnungsabgrenzung
  - Zinsabrechnungen
  rechnen: Marchzins = Darlehensbetrag × Zinssatz × Tage (letzter Zinstermin bis 31.12.) / Tagebasis gemäss Vertrag; Differenz = Marchzins − gebuchte Abgrenzung
  feststellung_wenn: Aufgelaufener Zins nicht oder falsch abgegrenzt (ausser zulässiger Verzicht nach Art. 958b Abs. 2 OR) oder Zinsen werden kapitalisiert statt bezahlt.
  fundstellen:
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0048-s066
    zitat: Der Grundsatz der zeitlichen Abgrenzung verlangt, dass Aufwand und Ertrag, die zeitraumbezogen anfallen (z.B. Zinsen, Miete), auch entsprechend abgegrenzt und erfasst werden.
  - quelle: or__art-958b
    zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten, kann auf die zeitliche Abgrenzung verzichtet
- id: H2-403
  vorgehen: Erwarteten Zinsertrag aus Darlehensbestand und Vertragszinsen herleiten und mit den Konten Zins-/Finanzertrag vergleichen; wesentliche Abweichungen mit GL klären. Zinseingänge
    mit Bankbelegen abstimmen und prüfen, dass Erträge aus Darlehen vollständig und unverrechnet im Finanzertrag erfasst sind.
  nachweise:
  - Darlehensaufstellung mit Zinssätzen
  - Kontoblätter Zins-/Finanzertrag
  - Bankbelege Zinseingänge
  rechnen: Erwarteter Zinsertrag = Σ (Darlehensbestand × Vertragszins × Laufzeitanteil im Geschäftsjahr); Differenz zu gebuchtem Zins-/Finanzertrag inkl. Abgrenzung
  feststellung_wenn: Vertraglich geschuldeter Zinsertrag nicht oder unvollständig verbucht, mit Aufwand verrechnet oder wesentliche ungeklärte Differenz zum erwarteten Ertrag.
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich des Finanzaufwands und -ertrags mit den erwarteten Werten aufgrund der verzinslichen Aktiven und Passiven
  - quelle: ser-2022__anh-d-s081-1
    zitat: Durchsicht von Konten und Belegen, ob Gewinne, Verluste und Erträge ordnungsgemäss erfasst worden sind
  - quelle: hwp-bur-2023__rz-0789-s328
    zitat: Erträge aus Finanzanlagen
- id: H2-404
  vorgehen: Forderungen mit Darlehenscharakter gegenüber Aktionären (direkt/indirekt) summieren und mit dem freien Eigenkapital vergleichen. Übersteigen sie dieses, Drittvergleichsanalyse
    und Schlussfolgerung des VR einsehen (Vertrag, Zins, Laufzeit, Rückzahlung, Sicherheiten, Bonität) und kritisch würdigen; Auswirkung auf Gewinnverwendungsantrag und Bericht als Vorschlag
    für den WP dokumentieren.
  nachweise:
  - Darlehensaufstellung Aktionäre/Konzern
  - Eigenkapitalnachweis (einbezahltes Kapital)
  - Aufstellung stille Reserven
  - Drittvergleichsanalyse/VR-Beschluss
  - Antrag Verwendung Bilanzgewinn
  rechnen: 'Freies EK = Total Eigenkapital − einbezahltes Grundkapital (+ stille Reserven netto nach latenten Steuern); Test: Σ Aktionärsforderungen mit Darlehenscharakter (abzgl. nur
    verrechenbarer Verbindlichkeiten) ≤ freies EK'
  feststellung_wenn: Aktionärsdarlehen übersteigen das freie Eigenkapital und der Drittvergleich ist nicht dokumentiert oder nicht bestanden (Art. 680 Abs. 2 OR), insbesondere bei beantragter
    Ausschüttung.
  fundstellen:
  - quelle: hwp-er-2026__rz-0167-s215
