- id: A1-307
  vorgehen: 'Jahresgewinn/-verlust in Erfolgsrechnung, Eigenkapital und im Antrag des VR über die Verwendung des Bilanzgewinns abstimmen; Bilanzgewinn/-verlust = Vortrag + Jahresergebnis
    nachrechnen. Gesetzeskonformität des Antrags (Reservenzuweisung, Ausschüttbarkeit; Art. 729a Abs. 1 Ziff. 2 OR) als Hinweis an den WP bzw. Prüffeld Eigenkapital. Covid-19-Kredit
    mit Solidarbürgschaft (Art. 3 oder 4 Covid-19-SBüV) per 31.12. oder bei Antragstellung nicht vollständig zurückbezahlt, und der Antrag enthält eine Dividende, Tantieme oder Kapitalrückzahlung:
    Antrag nicht gesetzeskonform (Art. 2 Abs. 2 lit. a Covid-19-SBüG) → Notiz «Wesentliche Feststellungen» und Rapport. Frist setzen und GV bzw. Bürgschaftsorganisation informieren (Art.
    23): Entscheid und Ausführung durch den WP. revio: `revio K17` (10.4 JR/VE, 10.1 Saldenbilanz, 10.2 Umbuchungen, 10.3 stille Reserven).'
  nachweise:
  - Jahresrechnung
  - Antrag VR Verwendung Bilanzgewinn
  - Saldoliste
  rechnen: Jahresergebnis ER = Position Jahresergebnis im EK = Jahresergebnis im Antrag; Bilanzgewinn/-verlust = Gewinn-/Verlustvortrag + Jahresergebnis
  feststellung_wenn: Jahresergebnis stimmt zwischen ER, Eigenkapital und Antrag nicht überein oder Antrag ist rechnerisch bzw. gesetzlich nicht konform, oder Ausschüttung beantragt,
    obwohl die Solidarbürgschaft noch läuft.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des ausgewiesenen Jahresgewinns (oder Jahresverlusts) im Eigenkapital und in der Erfolgsrechnung
  - quelle: hwp-er-2026__rz-0439-s284
    zitat: prüft die Revisionsstelle den Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinns
  - quelle: or__art-729a
    zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
  - quelle: covid-sbueg__art-2-t1
    zitat: Während der Dauer der Solidarbürgschaft ausgeschlossen sind
  - quelle: covid-sbueg__art-2-t1
    zitat: Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen
  - quelle: covid-sbueg__art-3
    zitat: Eine Solidarbürgschaft dauert höchstens acht Jahre
  - quelle: covid-sbueg__art-23
    zitat: Stellt die Revisionsstelle der Kreditnehmerin oder des Kreditnehmers im Rahmen der eingeschränkten oder ordentlichen Revision der Jahres- oder Konzernrechnung eine Verletzung
      einer Vorgabe nach Artikel 2 Absätze 2–4 fest
  - quelle: covid-sbueg__art-23
    zitat: Wird dieser nicht innerhalb der gesetzten Frist hergestellt, so muss die Revisionsstelle die Generalversammlung informieren.
