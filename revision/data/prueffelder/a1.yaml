  - quelle: hwp-er-2026__rz-0386-s270-t1
    zitat: Verstösse gegen diese Rechnungslegungsvorschriften mit wesentlichem Einfluss auf die Jahresrechnung führen zu einer modifizierten Prüfungsaussage.
- id: A1-205
  vorgehen: '1) revio 3.4 und 6.3 lesen (nur lesen). 2) Going Concern: Indikatoren (SER Anh. G) aus JR/Saldoliste auswerten, Einschätzung der Leitung für ≥ 12 Monate (Budget, Liquiditätsplan)
    und Anhangsangaben prüfen; fehlt sie: Pendenz. 3) Kapitalverlust und Überschuldung mit `kapitalverlust` rechnen (siehe rechnen). Kapitalverlust oder Überschuldung festgestellt →
    `aufgabe kapitalschutz` (WP sofort informieren). VR-Beschluss über Massnahmen (Art. 725a OR) in den Protokollen suchen; fehlt er → Notiz «Wesentliche Feststellungen». Den Hinweis
    im Bericht (SER 8.3.2.1) formuliert und entscheidet der WP. 4) Bei Überschuldung: Rangrücktritte mit Darlehensverträgen/Saldoliste abgleichen (Betrag inkl. Zinsen, Stundung, keine
    Tilgung/Reduktion, Bonität; `thema rangrücktritt`), Zwischenabschluss zu Veräusserungswerten suchen, sonst Pendenz. Ersetzter oder reduzierter Rangrücktritt: Bedingungen (a), (b)
    und (c) nach HWP ER Rz 425 einzeln mit Beleg (M-Files-ID) im Textfeld festhalten. Fehlt eine Bedingung → Notiz «Wesentliche Feststellungen», Entscheid WP. 5) Covid-19-Kredit mit
    Solidarbürgschaft: Wurden während der Solidarbürgschaft Darlehen an Aktionäre/Nahestehende gewährt oder deren Darlehen (auch rangrücktrittsbelastete) zurückbezahlt: Hinweis an den
    WP (Art. 2 Abs. 2 lit. b Covid-19-SBüG). Ausnahmen für vorbestehende Pflichten gegenüber Schweizer Gruppengesellschaften beurteilt der WP. Querverweis H2/N1. 6) Ergebnis als Notiz;
    Bericht/Anzeige entscheidet der WP.'
  nachweise:
  - Jahresrechnung inkl. Anhang
  - Saldoliste
  - Einschätzung Fortführungsfähigkeit (≥ 12 Monate), Budget/Liquiditätsplanung
  - Rangrücktrittserklärungen und Darlehensverträge
  - Kontoblätter Darlehen und Zinsen (Tilgungen, Verrechnungen)
  - Zwischenabschluss zu Veräusserungswerten (falls überschuldet)
  - Protokolle VR/GV (Sanierungsmassnahmen)
  - Vollständigkeitserklärung
  rechnen: 'Fremdkapital = Verbindlichkeiten + Rückstellungen + passive Rechnungsabgrenzungen (inkl. rangrücktrittsbelasteter Darlehen und Zinsen); Covid-19-Kredite nach Art. 3 SBüV
    und Härtefall-Darlehen (HFMV 20) gelten nicht als Fremdkapital. Kapitalverlust und Überschuldung nie von Hand rechnen, sondern: `kapitalverlust --aktienkapital … --aktiven … --verbindlichkeiten
    <Fremdkapital inkl. Rückstellungen und PRA> --kapitalreserve … --gewinnreserve … [--covid-kredit <Kredit nach Art. 3 Covid-19-SBüV bzw. Härtefall-Darlehen>] [--reserve-voll …] [--rangruecktritt
    …] [--holding]`. Gesetzliche Kapital- und Gewinnreserve zusammen höchstens 50 % (Holding 20 %) des Grundkapitals anrechenbar; gleiche Rechnung wie P1-313. Deckung = Σ Rangrücktritte
    (Kapital + aufgelaufene Zinsen) − Überschuldung ≥ 0; je Gläubiger: Darlehenssaldo + Zinsen ≤ Rangrücktrittsbetrag, Δ Darlehen/Rangrücktritt VJ→GJ (Tilgung/Reduktion); EK-Quote =
    Eigenkapital / Bilanzsumme'
  feststellung_wenn: Erhebliche Zweifel an der Fortführung ohne Anhangsangabe, Einschätzung fehlt/< 12 Monate, Kapitalverlust, Überschuldung ohne genügende Rangrücktritte inkl. Zinsen,
    Reduktion/Tilgung trotz Überschuldung.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-1
