# Prüffeld A1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: A1
bezeichnung: Allgemeine Prüfungshandlungen
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-11'
  nachpruefung:
    urteil: null
    befunde: 0
    korrigiert: false
kurzbeschrieb: 'Schlussarbeiten zur Jahresrechnung als Ganzes: Befragung zu Änderungen von Darstellung/Bewertung, Ereignisse nach dem Stichtag, Vollständigkeitserklärung, Gesamtanalytik
  (Going Concern, GoR, nicht korrigierte Fehler, stille Reserven) sowie formelle Abstimmungen (Unterzeichnung, Vorjahresvortrag, Hauptbuch↔JR, Mindestgliederung, Jahresergebnis↔Antrag,
  Protokolle, ggf. Geldflussrechnung).'
gesetz:
- thema: Zweck der Rechnungslegung (zuverlässiges Urteil Dritter)
  quelle: or__art-958
  zitat: Die Rechnungslegung soll die wirtschaftliche Lage des Unternehmens so darstellen, dass sich Dritte ein zuverlässiges Urteil bilden können.
- thema: Bestandteile der Jahresrechnung (Bilanz, Erfolgsrechnung, Anhang)
  quelle: or__art-958
  zitat: Dieser enthält die Jahresrechnung (Einzelabschluss), die sich aus der Bilanz, der Erfolgsrechnung und dem Anhang zusammensetzt.
- thema: Frist 6 Monate für Erstellung/Vorlage Geschäftsbericht
  quelle: or__art-958
  zitat: Der Geschäftsbericht muss innerhalb von sechs Monaten nach Ablauf des Geschäftsjahres erstellt und dem zuständigen Organ oder den zuständigen Personen zur Genehmigung vorgelegt
    werden.
- thema: Unterzeichnung durch VR-Präsident und Verantwortliche/n Rechnungslegung
  quelle: or__art-958
  zitat: Er ist vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person zu unterzeichnen.
- thema: Fortführungsannahme (Going Concern)
  quelle: or__art-958a
  zitat: Die Rechnungslegung beruht auf der Annahme, dass das Unternehmen auf absehbare Zeit fortgeführt wird.
- thema: Abweichung von der Fortführung im Anhang
  quelle: or__art-958a
  zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken; ihr Einfluss auf die wirtschaftliche Lage ist darzulegen.
- thema: Zeitliche und sachliche Abgrenzung
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Grundsätze ordnungsmässiger Rechnungslegung – Stetigkeit
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- thema: Verrechnungsverbot
  quelle: or__art-958c
  zitat: Aktiven und Passiven sowie Aufwand und Ertrag dürfen nicht miteinander verrechnet werden.
- thema: Anpassung an Besonderheiten Unternehmen/Branche
  quelle: or__art-958c
  zitat: Die Rechnungslegung ist unter Wahrung des gesetzlichen Mindestinhalts den Besonderheiten des Unternehmens und der Branche anzupassen.
- thema: Vorjahreszahlen
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- thema: Mindestgliederung Bilanz – Aktiven
  quelle: or__art-959a-t1
  zitat: Unter den Aktiven müssen ihrem Liquiditätsgrad entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: Mindestgliederung Bilanz – Passiven
  quelle: or__art-959a-t1
  zitat: Unter den Passiven müssen ihrer Fälligkeit entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: Zusätzliche Bilanzpositionen / Nahestehende gesondert
  quelle: or__art-959a-t2
  zitat: Weitere Positionen müssen in der Bilanz oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Vermögens- oder Finanzierungslage durch Dritte wesentlich
- thema: 'Erfolgsrechnung: Produktions- oder Absatzerfolgsrechnung'
  quelle: or__art-959b-t1
  zitat: Sie kann als Produktionserfolgsrechnung oder als Absatzerfolgsrechnung dargestellt werden.
- thema: Zusätzliche Positionen Erfolgsrechnung
  quelle: or__art-959b-t2
  zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR)'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- thema: 'Anhang: wesentliche Ereignisse nach dem Bilanzstichtag (Art. 959c Abs. 2 Ziff. 13 OR)'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- thema: 'Zwischenabschluss: Vereinfachungen/Verkürzungen'
  quelle: or__art-960f
  zitat: Vereinfachungen oder Verkürzungen sind zulässig, sofern keine Beeinträchtigung der Darstellung des Geschäftsgangs entsteht.
- thema: 'Zwischendividende: Prüfung Zwischenabschluss durch Revisionsstelle'
  quelle: or__art-675a
  zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
- thema: Geldflussrechnung nur für Unternehmen mit ordentlicher Revisionspflicht
  quelle: or__art-961
  zitat: als Teil der Jahresrechnung eine Geldflussrechnung erstellen
- thema: Mindestinhalt Geldflussrechnung
  quelle: or__art-961b
  zitat: Die Geldflussrechnung stellt die Veränderung der flüssigen Mittel aus der Geschäftstätigkeit, der Investitionstätigkeit und der Finanzierungstätigkeit je gesondert dar.
- thema: 'GV: Genehmigung Jahresrechnung und Verwendung Bilanzgewinn'
  quelle: or__art-698
  zitat: die Genehmigung der Jahresrechnung sowie die Beschlussfassung über die Verwendung des Bilanzgewinnes
- thema: 'GV: Wahl der Revisionsstelle'
  quelle: or__art-698
  zitat: die Wahl der Mitglieder des Verwaltungsrates und der Revisionsstelle
- thema: Ordentliche GV innert 6 Monaten
  quelle: or__art-699
  zitat: Die ordentliche Generalversammlung findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt.
- thema: Gegenstand der eingeschränkten Revision
  quelle: or__art-729a
  zitat: die Jahresrechnung nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: Prüfungshandlungen der eingeschränkten Revision
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Auskunftspflicht VR (Grundlage Vollständigkeitserklärung)
  quelle: or__art-730b
  zitat: erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt, auf Verlangen auch schriftlich
- thema: Kapitalverlust
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: Überschuldung
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
risiken:
- text: Jahresrechnung unvollständig oder Mindestgliederung (Art. 959a/959b OR) nicht eingehalten.
  pruefziele:
  - DO
  quelle: hwp-er-2026__rz-0377-s269
  zitat: die Bestimmungen über die Mindestgliederung nicht eingehalten sind (Art. 959a und 959b OR)
- text: Anhang enthält vorgeschriebene Angaben nicht vollständig/richtig (z.B. Grundsätze, Ereignisse nach Stichtag, Nettoauflösung stiller Reserven).
  pruefziele:
  - DO
  - VO
  quelle: hwp-er-2026__rz-0377-s269
  zitat: der Anhang die vorgeschriebenen Angaben nicht vollständig und nicht richtig enthält (Art. 959c OR)
- text: Fortführungsannahme nicht vertretbar oder Unsicherheiten/Abweichungen nicht im Anhang vermerkt.
  pruefziele:
  - BE
  - DO
  quelle: or__art-958a
  zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken; ihr Einfluss auf die wirtschaftliche Lage ist darzulegen.
- text: Änderung von Darstellung oder Bewertungsmethode (Stetigkeit) ohne Begründung im Anhang.
  pruefziele:
  - BE
  - DO
  quelle: hwp-bur-2023__rz-0059-s070
  zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden
- text: Wesentliche Nettoauflösung stiller Reserven schönt das Ergebnis und ist nicht offengelegt.
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: Wird das erwirtschaftete Ergebnis durch die Auflösung der stillen Reserven wesentlich günstiger dargestellt, ist der Nettobetrag aus Reservenauflösung im Anhang offenzulegen
- text: Eröffnungsbilanzwerte stimmen nicht mit der geprüften Vorjahresrechnung überein oder enthalten wesentliche Fehlaussagen.
  pruefziele:
  - VO
  - RI
  - DO
  quelle: hwp-er-2026__rz-0147-s208
  zitat: Diese Übereinstimmung von Schluss- und Eröffnungsbilanzwerten verifiziert der Abschlussprüfer.
- text: Nicht korrigierte Fehlaussagen sind einzeln oder kumuliert wesentlich.
  pruefziele:
  - RI
  quelle: hwp-er-2026__rz-0054-s189
  zitat: Werden keine Korrekturen vorgenommen, beurteilt der Abschlussprüfer, ob die Jahresrechnung dadurch wesentlich falsch dargestellt ist.
- text: Wesentliche Ereignisse nach dem Bilanzstichtag nicht gebucht (Ursache vor Stichtag) bzw. nicht im Anhang offengelegt.
  pruefziele:
  - PA
  - DO
  quelle: hwp-bur-2023__rz-0861-s353
  zitat: Tritt die auslösende Ursache erst nach dem Bilanzstichtag ein, wird das Ereignis grundsätzlich nicht in der Jahresrechnung erfasst, ist aber im Anhang ausweispflichtig.
- text: Jahresergebnis in ER, Eigenkapital und Gewinnverwendungsantrag nicht übereinstimmend oder Antrag nicht gesetzeskonform.
  pruefziele:
  - DO
  - RI
  quelle: hwp-er-2026__rz-0439-s284
  zitat: Insbesondere ist zu prüfen, ob die Zuweisungen an die gesetzliche Gewinnreserve richtig erfolgen
- text: 'Formelle Mängel: Jahresrechnung nicht unterzeichnet bzw. Geschäftsbericht nicht fristgerecht zur Genehmigung vorgelegt.'
  pruefziele:
  - DO
  quelle: hwp-er-2026__rz-0425-s280-t2
  zitat: Nichteinhaltung der gesetzlichen Vorlagepflicht des Geschäftsberichts zur Genehmigung durch das zuständige Organ
unterlagen:
- dokument: Jahresrechnung (Bilanz, Erfolgsrechnung, Anhang) rechtsgültig unterzeichnet
  zweck: A1-301, A1-305/306; Bestandteil der Jahresakten
  quelle: ser-2022__7-2
  zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- dokument: Vollständigkeitserklärung (an Revisionsstelle adressiert, datiert, unterzeichnet)
  zweck: A1-103; schriftliche Bestätigung der Unternehmensleitung
  quelle: ser-2022__anh-e-s102-1
  zitat: die Vollständigkeitserklärung zu datieren und zu unterzeichnen
- dokument: Geprüfte Jahresrechnung und Revisionsbericht des Vorjahres
  zweck: A1-302 Abstimmung Vortrag Vorjahresbestände
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres (geprüfte Jahresrechnung, falls vorhanden)
- dokument: Saldoliste / Hauptbuch per Bilanzstichtag (Bilanz und Erfolgsrechnung mit Vorjahr)
  zweck: A1-201, A1-303 Abstimmung Hauptbuch mit Jahresrechnung
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
- dokument: Protokolle GV und VR (Geschäftsjahr und bis Prüfungsdatum)
  zweck: A1-304; Sachverhalte mit Auswirkung auf die Jahresrechnung
  quelle: ser-2022__anh-d-s073-1
  zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen
- dokument: Antrag des VR über die Verwendung des Bilanzgewinns/-verlusts
  zweck: A1-305, A1-307
  quelle: hwp-er-2026__rz-0439-s284
  zitat: prüft die Revisionsstelle den Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinns
- dokument: Detailnachweis stille Reserven (Bestand je Position per 31.12. und Vorjahr)
  zweck: A1-207, A1-308
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- dokument: 'Einschätzung Fortführungsfähigkeit: Budget, Liquiditätsplanung, Finanzierungszusagen'
  zweck: A1-205 Going Concern
  quelle: ser-2022__anh-g-s140-2
  zitat: Analyse und Diskussion mit der Unternehmensleitung über geplante Cashflows, Gewinne und andere wichtige Kennzahlen
- dokument: Statuten, Handelsregisterauszug (Organe, Zeichnungsberechtigung, Revisionsstelle)
  zweck: A1-301, A1-304, A1-305 (statutarische Bestandteile)
  quelle: hwp-er-2026__rz-0365-s266
  zitat: Statuten oder anerkannte Standards zur Rechnungslegung (z.B. Kern-FER) können weitere Bestandteile der Jahresrechnung fordern
- dokument: Buchungen/Kontoblätter der Folgeperiode und Informationen zu Ereignissen nach dem Bilanzstichtag
  zweck: A1-102
  quelle: ser-2022__8-6
  zitat: Dies schliesst Prüfungshandlungen bezüglich Ereignissen ein, die bis zum Berichtsdatum eingetreten sind.
- dokument: Zwischenabschluss und Beschluss Zwischendividende (falls vorhanden)
  zweck: A1-208
  quelle: or__art-960f
  zitat: Es sind mindestens die Überschriften und Zwischensummen auszuweisen, die in der letzten Jahresrechnung enthalten sind.
- dokument: Geldflussrechnung inkl. Fondsnachweis und Anlagespiegel (nur falls erstellt/vorgeschrieben)
  zweck: A1-401, A1-402
  quelle: hwp-bur-2023__rz-0802-s333
  zitat: 'Bei grösseren Unternehmen besteht die Jahresrechnung somit aus vier Teilen: Bilanz, Erfolgsrechnung, Geldflussrechnung und Anhang.'
bewertung:
- regel: Grundsätze ordnungsmässiger Rechnungslegung gelten für alle Teile der Jahresrechnung; Stetigkeit in Darstellung und Bewertung.
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- regel: Methodenwechsel nur begründet, mit Darlegung im Anhang; Schätzungsänderungen sind davon zu unterscheiden.
  quelle: hwp-bur-2023__rz-0061-s070
  zitat: Von Änderungen der Bewertungsgrundsätze und -methoden zu unterscheiden sind Anpassungen aufgrund von Schätzungsänderungen.
- regel: 'Bei beabsichtigter oder nicht abwendbarer Einstellung innert 12 Monaten: Veräusserungswerte für betroffene Teile.'
  quelle: or__art-958a
  zitat: so sind der Rechnungslegung für die betreffenden Unternehmensteile Veräusserungswerte zugrunde zu legen
- regel: 'Stille Reserven: jährlich per Stichtag je Bilanzposition nach stetiger Methode ermitteln und mit Vorjahr vergleichen.'
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
- regel: Offenlegung nur des Nettobetrags der Auflösung stiller Reserven, als Gesamtbetrag, wenn das Ergebnis wesentlich günstiger dargestellt wird.
  quelle: hwp-bur-2023__rz-0817-s341-t1
  zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
- regel: 'Ereignisse nach dem Stichtag: Ursache vor Stichtag → buchen; Ursache nach Stichtag → Anhang (Art und Schätzung der Auswirkung).'
  quelle: hwp-bur-2023__rz-0860-s353
  zitat: Es sind die Art des Ereignisses und eine Schätzung der finanziellen Auswirkungen offenzulegen.
- regel: Vorjahreszahlen sind in Bilanz und Erfolgsrechnung anzugeben.
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- regel: 'Zwischenabschluss: mindestens Überschriften und Zwischensummen der letzten Jahresrechnung; keine Beeinträchtigung der Darstellung des Geschäftsgangs.'
  quelle: hwp-bur-2023__rz-0249-s121
  zitat: Insgesamt darf durch Vereinfachungen und Verkürzungen keine Beeinträchtigung der Darstellung des Geschäftsgangs entstehen.
- regel: 'Geldflussrechnung: Fonds sind die flüssigen Mittel; Fonds «Netto Flüssige Mittel» in der Praxis vertretbar bei Offenlegung der Bestandteile.'
  quelle: hwp-bur-2023__rz-0803-s333
  zitat: Die Bezugsgrösse der Geldflussrechnung (sog. Fonds) bilden die flüssigen Mittel
- regel: 'Geldfluss aus Geschäftstätigkeit nach indirekter Methode: Jahresergebnis um nicht liquiditätswirksame Vorgänge bereinigen.'
  quelle: hwp-bur-2023__rz-0805-s333
  zitat: Bei der indirekten Methode werden zum Jahresergebnis die nicht liquiditätswirksamen Geschäftsvorfälle hinzugefügt bzw. in Abzug gebracht.
fallstricke:
- text: Die Vollständigkeitserklärung ersetzt keine Prüfungsnachweise; wesentliche Positionen nicht allein darauf abstützen.
  quelle: hwp-er-2026__rz-0338-s259
  zitat: dass die Vollständigkeitserklärung kein Ersatz für Prüfungsnachweise ist
- text: Verweigert die Unternehmensleitung eine notwendige Erklärung, liegt eine Beschränkung des Prüfungsumfangs vor (Entscheid WP).
  quelle: hwp-er-2026__rz-0341-s260
  zitat: Eine Weigerung der Unternehmensleitung, eine nach Auffassung des Abschlussprüfers notwendige Erklärung abzugeben, führt zu einer Beschränkung des Prüfungsumfangs.
- text: Datum der Vollständigkeitserklärung = Datum Revisionsbericht; Bericht frühestens auf Datum der Unterzeichnung/Genehmigung der Jahresrechnung.
  quelle: ser-2022__anh-e-s102-1
  zitat: Das Datum der Vollständigkeitserklärung entspricht im Regelfall dem Datum der Unterzeichnung des Revisionsberichts.
- text: Ereignisse nach dem Bilanzstichtag sind bis zum Berichtsdatum zu berücksichtigen, nicht nur bis zum Abschluss der Feldarbeit.
  quelle: ser-2022__8-6
  zitat: Dies schliesst Prüfungshandlungen bezüglich Ereignissen ein, die bis zum Berichtsdatum eingetreten sind.
- text: 'Vorjahr nicht oder von anderem Prüfer geprüft (Erstprüfung/Opting-out): Vorjahreswerte besonders beachten und im Bericht anmerken.'
  quelle: ser-2022__6-2-7
  zitat: Der Tatbestand, dass die Vorjahresrechnung nicht oder von einem anderen Abschlussprüfer geprüft wurde, ist im Revisionsbericht anzumerken.
- text: Analytik in kleinen Verhältnissen ist durch Bildung/Auflösung stiller Reserven verzerrt; Zahlen vor Vergleich bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: dass in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- text: 'Wesentlichkeit der Nettoauflösung nicht nur relativ beurteilen: kippt das Ergebnis von Verlust zu Gewinn, ist sie regelmässig wesentlich.'
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: Die relative Höhe der Auflösung, z.B. im Verhältnis zum Jahresergebnis, ist insbesondere dann nicht allein ausschlaggebend
- text: Auch kleine Fehler können wesentlich sein, wenn sie Gewinn in Verlust verwandeln.
  quelle: hwp-er-2026__rz-0044-s186
  zitat: Selbst ein geringer Fehler, der den ausgewiesenen Gewinn zu einem Verlust werden lässt, kann wesentlich sein.
- text: Geldflussrechnung ist bei eingeschränkter Revision in der Regel kein Prüfungsgegenstand; nur gesetzlich/statutarisch/nach Standard verlangte Teile gehören in die geprüfte Jahresrechnung.
  quelle: hwp-er-2026__rz-0365-s266
  zitat: Statuten oder anerkannte Standards zur Rechnungslegung (z.B. Kern-FER) können weitere Bestandteile der Jahresrechnung fordern
- text: 'Negatives oder hälftig nicht mehr gedecktes Eigenkapital: Kapitalverlust/Überschuldung (Art. 725a/725b OR) mit Going Concern und Prüffeld Eigenkapital verknüpfen; Beurteilung
    durch WP.'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
- text: Protokolle nur auf Auswirkungen auf Jahresrechnung/Antrag lesen; die Geschäftsführung des VR ist nicht Prüfungsgegenstand.
  quelle: or__art-729a
  zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
- text: 'Befragungsschritte (1xx) kann der Agent nicht selbst führen: nur schriftliche Antworten auswerten, sonst Pendenz; VE nie selbst «unterzeichnen lassen», Visum bleibt beim WP.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: Gesamtbeurteilung, Wesentlichkeitsurteil und Auswirkung auf die Prüfungsaussage (A1-2xx) sind Ermessensentscheide des WP; der Agent liefert nur Analysen und Hinweise.
fragen_kunde:
- frage: 'Wurden gegenüber dem Vorjahr die Darstellung (Gliederung, Bezeichnungen, Kontenzuordnung) oder Bewertungsgrundsätze/-methoden (z.B. Abschreibungsmethode, Vorrats- oder Auftragsbewertung)
    geändert? Falls ja: warum, und wo im Anhang dargelegt?'
  zweck: A1-101 Stetigkeit; Pendenz bis schriftliche Antwort vorliegt
- frage: Welche wesentlichen positiven oder negativen Ereignisse sind seit dem Bilanzstichtag eingetreten (z.B. Verluste, Rechtsfälle, Finanzierung, Grossaufträge, Kapitalmassnahmen)
    und wie wurden sie gebucht bzw. im Anhang offengelegt?
  zweck: A1-102 Ereignisse nach dem Bilanzstichtag
- frage: Wer unterzeichnet Jahresrechnung und Vollständigkeitserklärung, an welchem Datum wird die Jahresrechnung durch den VR genehmigt, und sind mandatsspezifische Ergänzungen der
    Vollständigkeitserklärung nötig?
  zweck: A1-103, A1-301; Berichtsdatum
- frage: Wie beurteilt die Unternehmensleitung die Fortführungsfähigkeit für mindestens zwölf Monate ab Bilanzstichtag (Budget, Liquiditätsplanung, Kreditlimiten, Rangrücktritte, Massnahmen)?
  zweck: A1-205 Going Concern
- frage: Gab es im Geschäftsjahr wesentliche Veränderungen in Tätigkeit und Umfeld (Produkte, Kunden, Personalbestand, Standorte, Finanzierung), welche die Veränderungen in Bilanz und
    Erfolgsrechnung erklären?
  zweck: A1-201 Gesamtanalytik
- frage: Nach welcher Methode werden die stillen Reserven ermittelt (gleich wie Vorjahr?), wie hoch sind Bestand und Veränderung, und wurden netto stille Reserven aufgelöst?
  zweck: A1-207, A1-308
- frage: 'Ist die Unternehmensleitung bereit, die mitgeteilten Fehlaussagen (Zusammenstellung) zu korrigieren? Falls nein: Begründung.'
  zweck: A1-203 nicht korrigierte Fehler; Schlussbesprechung
- frage: Liegen alle Protokolle der GV und der VR-Sitzungen des Geschäftsjahres und bis heute vor (inkl. Zirkularbeschlüsse)?
  zweck: A1-304
- frage: Wurde im Geschäftsjahr ein Zwischenabschluss für eine Zwischendividende erstellt oder ist eine Zwischendividende geplant?
  zweck: A1-208
- frage: Wird eine Geldflussrechnung erstellt (gesetzlich, statutarisch, auf Verlangen von Kreditgebern oder freiwillig) und welcher Fonds wird verwendet?
  zweck: A1-305, A1-401, A1-402 Anwendbarkeit
