  - quelle: ser-2022__anh-g-s138-2
    zitat: negatives Nettoumlaufvermögen, drohende Zahlungsunfähigkeit, Kapitalverlust oder Überschuldung
  - quelle: ser-2022__anh-g-s138-1
    zitat: Die Unternehmensleitung hat die Einschätzung der Fortführungsfähigkeit für einen Zeitraum von mindestens zwölf Monaten ab dem Bilanzstichtag vorzunehmen
  - quelle: hwp-er-2026__rz-0187-s223
    zitat: Der Abschlussprüfer hat zu beurteilen, ob die Einschätzung der Unternehmensleitung mit der Prämisse der Fortführung der Unternehmenstätigkeit zu vereinbaren ist
  - quelle: ser-2022__anh-g-s140-1
    zitat: Liegt keine Einschätzung der Unternehmensleitung zur Fortführungsfähigkeit vor, bespricht der Abschlussprüfer mit der Unternehmensleitung die Gründe
  - quelle: ser-2022__anh-g-s140-1
    zitat: fordert er die Unternehmensleitung zu einer detaillierteren und schriftlich dokumentierten Einschätzung auf
  - quelle: or__art-725a
    zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
  - quelle: or__art-725b-t1
    zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
  - quelle: or__art-725b-t1
    zitat: Auf den Zwischenabschluss zu Veräusserungswerten kann verzichtet werden, wenn die Annahme der Fortführung gegeben ist und der Zwischenabschluss zu Fortführungswerten keine
      Überschuldung aufweist.
  - quelle: hwp-er-2026__rz-0420-s125
    zitat: Gemäss Art. 725b Abs. 4 OR hat der Rangrücktritt mindestens im Ausmass der Überschuldung zu erfolgen.
  - quelle: hwp-er-2026__rz-0405-s122
    zitat: Ein Rangrücktritt dispensiert lediglich von der Überschuldungsanzeige an das Gericht.
  - quelle: hwp-er-2026__rz-0434-s128
    zitat: dass dem Rangrücktritt unterstellte Forderungen trotz andauernder Überschuldung ganz oder teilweise ge
  - quelle: hwp-er-2026__rz-0432-s127
    zitat: Dies beinhaltet auch die Beurteilung der Bonität des Rangrücktrittgläubigers
  - quelle: ser-2022__9-t2
    zitat: Ergibt sich aus der eingeschränkten Revision eine Überschuldung, so wird diese im Revisionsbericht festgehalten; zusätzlich werden die Organe auf ihre gesetzlichen Pflichten
      aufmerksam gemacht.
  - quelle: or__art-729c
    zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
  - quelle: ser-2022__anh-g-s141-1
    zitat: In diesem Fall ist ein Zusatz im Revisionsbericht anzubringen, in dem die wesentlichen Unsicherheiten kurz beschrieben werden
  - quelle: ser-2022__anh-g-s141-2
    zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang der Jahresrechnung trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: 3.4 Going concern
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: 6.1 Nicht nachgebuchte Fehler, 6.2 Abschliessende analytische Prüfungen, 6.3 Ereignisse nach dem Bilanzstichtag und Going concern
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: Für die Berechnung sind Covid-19-Kredite nicht als Fremdkapital zu berücksichtigen
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: wenn die (ordnungsgemäss bewerteten) Aktiven geringer sind als das Fremdkapital, bestehend aus Verbindlichkeiten, Rückstellungen und passiven Rechnungsabgrenzungsposten
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: Dies gilt auch für Darlehen oder verbürgte/garantierte Kredite nach der Covid-19- Härtefallverordnung 2020 (Art. 21 HFMV 20).
  - quelle: covid-sbueg__art-24
    zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
  - quelle: hwp-bur-2023__rz-0889-s359
    zitat: Ein Kapitalverlust liegt also vor, wenn das bilanzielle Eigenkapital kleiner ist als die Hälfte des geschützten Kapitals.
  - quelle: hwp-bur-2023__rz-0889-s359
    zitat: im Betrag von zusammen maximal 50 % – resp. bei Holdinggesellschaften 20 % – des Grundkapitals
  - quelle: hwp-bur-2023__rz-0889-s359
    zitat: der volle Betrag der gesetzlichen Gewinnreserven für eigene Kapitalanteile im Konzern
  - quelle: or__art-725a
    zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve
      nicht mehr decken
  - quelle: or__art-725a
    zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
  - quelle: ser-2022__8-3-2-t1
    zitat: Hinweise auf Gesetzesverstösse ausserhalb des Prüfungsgegenstands im Zusammenhang mit der Untätigkeit des Verwaltungsrates bei Vorliegen eines hälftigen Kapitalverlusts (Art.
      725a OR) oder einer Überschuldung (Art. 725b OR) sind in jedem Fall im Revisionsbericht anzubringen
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: sich aus einem in Übereinstimmung mit den SA- CH geprüften (Zwischen-)Abschluss ergibt
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: und (c) durch die Reduktion keine anderen Rangrücktrittsgläubiger benachteiligt werden
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: Die Revisionsstelle prüft erneut sämtliche Anforderungen an einen gültigen Rangrücktritt.
  - quelle: hwp-er-2026__rz-0426-s126
    zitat: Sollen die Rangrücktritte auf Basis eines Zwischenabschlusses reduziert oder aufgehoben werden, bedarf es eines separaten Prüfungsberichts nach den SA- CH.
  - quelle: hwp-er-2026__rz-0426-s126
    zitat: Wird die Gesellschaft mittels einer ordentlichen Revision geprüft und werden die betraglichen Veränderungen der Rangrücktritte zum Jahresende vorgenommen, bedarf es keines
      separaten Prüfungsberichts.
  - quelle: covid-sbueg__art-2-t1
    zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
  - quelle: covid-sbueg__art-2-t1
    zitat: zulässig ist jedoch die Erfüllung von Verpflichtungen gegenüber einer mit der Kreditnehmerin oder dem Kreditnehmer direkt oder indirekt verbundenen Gruppengesellschaft mit
      Sitz in der Schweiz
- id: A1-206
  vorgehen: Saldoliste auf wesentliche Konten prüfen, die in Sammelpositionen aufgehen, und Bilanz/ER/Anhang auf gesondert auszuweisende Positionen (u.a. Forderungen/Verbindlichkeiten
    gegenüber Beteiligten und Organen, ausserordentliche/periodenfremde Posten, branchenübliche Positionen, Rangrücktritte). Fehlende Ausweise mit Konto und Betrag im Textfeld.
  nachweise:
  - Saldoliste
  - Jahresrechnung inkl. Anhang
  - Verträge mit Nahestehenden
  rechnen: Anteil Konto bzw. Sammelposition an Bilanzsumme oder Betriebsertrag als Wesentlichkeitsindiz
  feststellung_wenn: Wesentliche Position (z.B. Nahestehende, Darlehen mit Rangrücktritt, ausserordentliche Posten) weder in Bilanz/ER noch im Anhang gesondert ausgewiesen.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Werden die für die Beurteilung der Vermögens-, Finanz- und Ertragslage durch Dritte oder aufgrund der Tätigkeit des Unternehmens notwendigen zusätzlichen Positionen
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: or__art-959b-t2
    zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
  - quelle: hwp-er-2026__rz-0430-s127
    zitat: muss deshalb in der Jahresrechnung des Schuldners (in der Bilanz oder im Anhang) ausgewiesen und erläutert werden
- id: A1-207
  vorgehen: 'Aus den Prüffeldern Hinweise auf Bildung/Auflösung stiller Reserven sammeln (Wertberichtigungen, Abschreibungen über betriebswirtschaftlichem Mass, Rückstellungen) und Veränderung
    zum Vorjahr plausibilisieren. Bei Nettoauflösung mit bereinigtem Jahresergebnis vergleichen und Anhangsangabe prüfen. Methode unklar: Pendenz.'
  nachweise:
  - Ergebnisse Prüffelder (Vorräte, Anlagen, Rückstellungen, Delkredere)
  - Nachweis stille Reserven
  - Anhang
  rechnen: 'Nettoveränderung stille Reserven = Σ Bestand GJ − Σ Bestand VJ; bei Abnahme: Nettoauflösung / bereinigtes Jahresergebnis; Ergebnis vor Auflösung (Gewinn/Verlust) vs. nach
    Auflösung'
  feststellung_wenn: Wesentliche Nettoauflösung stiller Reserven ohne Offenlegung im Anhang oder Auflösung führt zu Gewinn statt Verlust ohne Angabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Plausibilisierung von Bestand und Veränderungen der stillen Reserven auf Basis der Erkenntnisse aus den Prüfungsarbeiten bei den einzelnen Bilanzpositionen
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
  - quelle: hwp-bur-2023__rz-0675-s298
    zitat: Wird das erwirtschaftete Ergebnis durch die Auflösung der stillen Reserven wesentlich günstiger dargestellt, ist der Nettobetrag aus Reservenauflösung im Anhang offenzulegen
- id: A1-208
  vorgehen: 'Nur relevant bei Zwischenabschluss für eine Zwischendividende (Protokolle, Antrag VR); sonst Status «nicht bearbeitet», Begründung «Vorschlag: nicht anwendbar (kein Zwischenabschluss)»,
    Entscheid WP. Falls vorhanden: Prüfpflicht bzw. Verzicht (Zustimmung aller Aktionäre belegen, sonst Pendenz), Bezeichnung, Überschriften/Zwischensummen der letzten JR, Anhangsangaben
    und Unterzeichnung prüfen.'
  nachweise:
  - Zwischenabschluss
  - GV-Beschluss Zwischendividende
  - Zustimmung sämtlicher Aktionäre (bei Verzicht auf Prüfung)
  - letzte genehmigte Jahresrechnung
  rechnen: ''
  feststellung_wenn: Zwischenabschluss ohne Mindestgliederung der letzten JR oder Anhangsangaben, Vereinfachungen beeinträchtigen den Geschäftsgang, oder Verzicht auf Prüfung ohne Zustimmung
    aller Aktionäre.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Feststellung, ob die Vereinfachungen und Verkürzungen bei der Erstellung eines Zwischenabschlusses nach Art. 960f OR für den Zweck einer Zwischendividende
  - quelle: or__art-960f
    zitat: Es sind mindestens die Überschriften und Zwischensummen auszuweisen, die in der letzten Jahresrechnung enthalten sind.
  - quelle: or__art-675a
    zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
  - quelle: or__art-675a
    zitat: Keine Prüfung ist erforderlich, wenn die Gesellschaft ihre Jahresrechnung nicht durch eine Revisionsstelle eingeschränkt prüfen lassen muss.
  - quelle: or__art-675a
    zitat: Auf die Prüfung kann verzichtet werden, wenn sämtliche Aktionäre der Ausrichtung der Zwischendividende zustimmen
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet)
- id: A1-301
  vorgehen: 'Unterzeichnete JR in M-Files suchen; prüfen, ob der Vorsitzende des VR und die für die Rechnungslegung zuständige Person (gemäss HR-Auszug/Unternehmensinfo) mit Datum unterzeichnet
    haben. Fehlt die Unterzeichnung: Pendenz. Unterzeichnungsdatum als frühestes Berichtsdatum im Textfeld festhalten. revio: `revio K17` (10.4 JR/VE, 10.1 Saldenbilanz, 10.2 Umbuchungen,
    10.3 stille Reserven).'
  nachweise:
  - unterzeichnete Jahresrechnung
  - Handelsregisterauszug / Organe
  rechnen: ''
  feststellung_wenn: Unterschrift fehlt oder nicht durch VR-Vorsitz und zuständige Person Rechnungslegung, oder Unterzeichnung erst nach dem vorgesehenen Berichtsdatum.
  fundstellen:
  - quelle: or__art-958
    zitat: Er ist vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person zu unterzeichnen.
  - quelle: ser-2022__8-6
    zitat: darf der Abschlussprüfer den Revisionsbericht frühestens auf den Zeitpunkt datieren, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen hat
  - quelle: hwp-er-2026__rz-0339-s259
    zitat: Die Jahresrechnung und die Vollständigkeitserklärung werden in der Regel von denselben Personen unterzeichnet.
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: 10.1 Saldenbilanz, 10.2 Umbuchungsliste, 10.3 Stille Reserven, 10.4 Jahresrechnung und Vollständigkeitserklärung
- id: A1-302
  vorgehen: 'Eröffnungssalden aller Bilanzkonten (Hauptbuch) und Vorjahresspalte der JR mit der geprüften Vorjahres-JR abgleichen; Differenzen je Konto auflisten. Verwendung des Vorjahresergebnisses
    gemäss GV-Beschluss im Eigenkapital nachvollziehen. Vorjahr ungeprüft (Opting-out) oder von anderem Prüfer geprüft: im Textfeld vermerken. Anderer Prüfer: Revisionsbericht des Vorjahres
    lesen (modifiziert? gleiche Rechnungslegungsgrundsätze?). Bei Opting-out oder Zweifeln am früheren Prüfer: wesentliche Vorjahreswerte (≥ Toleranzwesentlichkeit) analytisch prüfen,
    Fragen dazu als Pendenz. In beiden Fällen Hinweis «Anmerkung im Revisionsbericht» als Notiz «Schlussbesprechung» (Entscheid WP).'
  nachweise:
  - Hauptbuch (Eröffnungssalden)
  - Saldoliste (Spalte Vorjahr)
  - geprüfte Jahresrechnung Vorjahr und Revisionsbericht
  - GV-Protokoll Gewinnverwendung Vorjahr
  rechnen: 'Je Bilanzkonto: Eröffnungssaldo GJ − Schlusssaldo VJ (geprüfte JR) = 0; Vorjahresspalte JR GJ = JR VJ; Gewinn-/Verlustvortrag 01.01. = Vortrag VJ + Jahresergebnis VJ − Ausschüttungen/Zuweisungen
    gemäss GV'
  feststellung_wenn: Eröffnungssaldo oder Vorjahresspalte weicht von der geprüften Vorjahres-JR ab, ohne Erläuterung im Anhang. Jede Differenz ≠ 0 im Textfeld (Konto, Betrag); unter
    der Nichtaufgriffsgrenze (revio 3.3) nur protokollieren, ab NAG Notiz «Wesentliche Feststellungen» (wird in A1-203 kumuliert).
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres (geprüfte Jahresrechnung, falls vorhanden)
  - quelle: hwp-er-2026__rz-0147-s208
    zitat: Diese Übereinstimmung von Schluss- und Eröffnungsbilanzwerten verifiziert der Abschlussprüfer.
  - quelle: ser-2022__6-2-7
    zitat: Der Tatbestand, dass die Vorjahresrechnung nicht oder von einem anderen Abschlussprüfer geprüft wurde, ist im Revisionsbericht anzumerken.
  - quelle: ser-2022__6-2-7
    zitat: bei einem aufgrund eines früheren Opting-out erstmals geprüften Abschluss sind Befragungen und analytische Prüfungshandlungen zu den wesentlichen Vorjahreswerten vorzunehmen
  - quelle: ser-2022__6-2-7
    zitat: Sofern keine Zweifel an der fachlichen Kompetenz und Unabhängigkeit des früheren Abschlussprüfers bestehen, wird der Umfang der vorzunehmenden Prüfungshandlungen vergleichsweise
      gering sein.
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
- id: A1-303
  vorgehen: 'Schlusssalden aus Saldoliste/Hauptbuch je Konto den JR-Positionen zuordnen (Mapping Konto → Position) und Summen je Position, Total Aktiven/Passiven sowie Jahresergebnis
    abstimmen. Differenzen mit Konto und Betrag im Textfeld; Umgliederungen ausserhalb der Buchhaltung belegen lassen (Pendenz). revio: `revio K17` (10.4 JR/VE, 10.1 Saldenbilanz, 10.2
    Umbuchungen, 10.3 stille Reserven).'
  nachweise:
  - Saldoliste
  - Hauptbuch
  - Jahresrechnung
  rechnen: Σ Saldi der Konten je Position = Betrag Position JR; Total Aktiven = Total Passiven; Total Aktiven Saldoliste = Total Aktiven JR; Jahresergebnis Saldoliste ER = Jahresergebnis
    JR
  feststellung_wenn: Differenz zwischen Hauptbuch/Saldoliste und JR-Position oder Totale Aktiven/Passiven ungleich, ohne belegte Umgliederung. Jede Differenz ≠ 0 im Textfeld (Konto,
    Betrag); unter der Nichtaufgriffsgrenze (revio 3.3) nur protokollieren, ab NAG Notiz «Wesentliche Feststellungen» (wird in A1-203 kumuliert).
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Totale von Aktiven und Passiven
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: 10.1 Saldenbilanz, 10.2 Umbuchungsliste, 10.3 Stille Reserven, 10.4 Jahresrechnung und Vollständigkeitserklärung
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
- id: A1-304
  vorgehen: 'GV- und VR-Protokolle des Geschäftsjahres und bis zum Prüfungszeitpunkt in M-Files suchen und lesen; Sachverhalte mit JR-Wirkung (Kapitalmassnahmen, Darlehen, Rangrücktritte,
    Rechtsfälle, Investitionen, Ausschüttungen) mit Verweis auf das Prüffeld auflisten. Prüfen: Genehmigung letzte JR innert 6 Monaten, Wahl Revisionsstelle, Beschluss Verwendung Bilanzgewinn/-verlust,
    Unterzeichnung JR. Fehlende Protokolle: Pendenz.'
  nachweise:
  - GV-Protokolle (ordentlich/ausserordentlich)
  - VR-Protokolle und Zirkularbeschlüsse
  - Handelsregisterauszug
  - Statuten
  rechnen: Datum ordentliche GV − Bilanzstichtag Vorjahr ≤ 6 Monate
  feststellung_wenn: Protokollierter Sachverhalt mit JR-Wirkung nicht berücksichtigt, GV nicht innert 6 Monaten, Wahl der Revisionsstelle oder Gewinnverwendungsbeschluss fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen
  - quelle: ser-2022__anh-d-s073-2
    zitat: Genehmigung der letzten Jahresrechnung innerhalb von sechs Monaten
  - quelle: ser-2022__anh-d-s073-2
    zitat: Beschluss über die Verwendung des Bilanzgewinns (umfasst auch einen allfälligen Bilanzverlust)
  - quelle: or__art-699
    zitat: Die ordentliche Generalversammlung findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt.
- id: A1-305
  vorgehen: Prüfen, ob die JR Bilanz, Erfolgsrechnung und Anhang enthält; Geldflussrechnung nur bei ordentlicher Revisionspflicht bzw. statutarisch/nach Standard verlangt; Antrag über
    die Verwendung des Bilanzgewinns (gesetzlicher Prüfungsgegenstand, Art. 729a Abs. 1 Ziff. 2 OR) als separates Dokument. Fehlende Bestandteile mit Fundstelle im Textfeld; Anhang-Detail
    im Prüffeld Anhang.
  nachweise:
  - Jahresrechnung
  - Antrag VR Verwendung Bilanzgewinn
  - Statuten
  rechnen: ''
  feststellung_wenn: Gesetzlich oder statutarisch vorgeschriebener Bestandteil fehlt (Bilanz, ER, Anhang; ggf. Geldflussrechnung) oder kein Gewinnverwendungsantrag.
  fundstellen:
  - quelle: or__art-958
    zitat: Dieser enthält die Jahresrechnung (Einzelabschluss), die sich aus der Bilanz, der Erfolgsrechnung und dem Anhang zusammensetzt.
  - quelle: ser-2022__1-6-t1
    zitat: Zu prüfen sind einzig die Gesetzes- und Statutenkonformität der Jahresrechnung oder eines allfälligen Zwischenabschlusses (Bilanz, Erfolgsrechnung und Anhang)
  - quelle: or__art-961
    zitat: Unternehmen, die von Gesetzes wegen zu einer ordentlichen Revision verpflichtet sind
  - quelle: hwp-er-2026__rz-0365-s266
    zitat: Es ist darauf zu achten, dass nur jene Teile genannt werden, welche gesetzlich oder gemäss Statuten bzw. nach anerkanntem Rechnungslegungsstandard
  - quelle: or__art-729a
    zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- id: A1-306
  vorgehen: Gliederung der Bilanz mit Art. 959a Abs. 1/2 OR (Positionen, Reihenfolge nach Liquidität bzw. Fälligkeit, Umlauf-/Anlagevermögen, kurz-/langfristiges Fremdkapital, Eigenkapital)
    und der ER mit Art. 959b OR (Produktions- oder Absatzerfolgsrechnung) abgleichen; bei Absatzerfolgsrechnung Anhangsangaben prüfen. Abweichungen im Textfeld.
  nachweise:
  - Jahresrechnung
  - Saldoliste
  rechnen: ''
  feststellung_wenn: Mindestposition fehlt, Reihenfolge oder Zuordnung kurz-/langfristig falsch, oder ER folgt keinem der beiden gesetzlichen Schemata.
  fundstellen:
  - quelle: or__art-959a-t1
