  feststellung_wenn: Verstoss gegen Grundlage oder Grundsatz mit wesentlichem Einfluss (z.B. Verrechnung, fehlende Vorjahreszahlen, fehlende Abgrenzung, nicht stetige Darstellung, Besonderheiten
    der Branche nicht berücksichtigt).
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Sind die Grundsätze ordnungsmässiger Rechnungslegung gemäss Art. 958c OR eingehalten?
  - quelle: ser-2022__anh-d-s072-2
