- id: A1-204
  vorgehen: 'Checkliste Art. 958a–958d OR anhand JR, Anhang und Saldoliste: Fortführung, Abgrenzung, Klarheit, Vollständigkeit, Verlässlichkeit, Wesentlichkeit, Vorsicht, Stetigkeit,
    Verrechnungsverbot, Besonderheiten von Unternehmen und Branche (Art. 958c Abs. 3 OR, z.B. Auftragsbewertung), Vorjahreszahlen, Währung, Sprache. Je Grundsatz Ergebnis mit Fundstelle
    im Textfeld; Hinweise auf Verstösse mit Konto/Betrag.'
