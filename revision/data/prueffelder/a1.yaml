schritte:
- id: A1-101
  vorgehen: 'Agent befragt nicht selbst: Frage zu Änderungen von Darstellung und Bewertungsgrundsätzen als Pendenz an den Kunden. Vorab Gliederung, Positionsbezeichnungen und Anhang
    (Grundsätze, Bewertung) der aktuellen JR mit der Vorjahres-JR vergleichen und Abweichungen auflisten. Schriftliche Antwort und Vergleich im Textfeld dokumentieren; Status höchstens
    «teilweise bearbeitet».'
  nachweise:
  - Jahresrechnung inkl. Anhang laufendes Jahr
  - Jahresrechnung Vorjahr
  - schriftliche Antwort der Unternehmensleitung
  rechnen: ''
  feststellung_wenn: Darstellung oder Bewertungsmethode geändert, ohne Begründung/Darlegung im Anhang, oder Vorjahreszahlen dadurch nicht vergleichbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-1
    zitat: Befragung über allfällige Änderungen der Darstellung der Jahresrechnung oder der Bewertungsgrundsätze
  - quelle: hwp-bur-2023__rz-0059-s070
    zitat: Ein Methodenwechsel ist in begründeten Fällen zulässig, muss aber im Anhang begründet und dargelegt werden
- id: A1-102
  vorgehen: Schriftliche Antworten zu Ereignissen nach dem Bilanzstichtag (VE, Kundenbefragung), Kontoblätter der Folgeperiode und Protokolle nach Stichtag auswerten. Prüfen, ob Ereignisse
    mit Ursache vor dem Stichtag gebucht und übrige wesentliche Ereignisse im Anhang mit Art und geschätzter Auswirkung offengelegt sind. Fehlende Antwort als Pendenz.
  nachweise:
  - Anhang (Ereignisse nach dem Bilanzstichtag)
  - Kontoblätter/Journale Folgeperiode
  - Protokolle nach Stichtag
  - Vollständigkeitserklärung
  rechnen: ''
  feststellung_wenn: Wesentliches Ereignis nach dem Stichtag weder gebucht (Ursache vor Stichtag) noch im Anhang offengelegt bzw. ohne Angabe der finanziellen Auswirkung.
  fundstellen:
  - quelle: ser-2022__anh-d-s100-1
    zitat: Wurden die Ereignisse entsprechend in der Jahresrechnung oder im Anhang offengelegt?
  - quelle: or__art-959c-t2
    zitat: wesentliche Ereignisse nach dem Bilanzstichtag
  - quelle: hwp-bur-2023__rz-0861-s353
    zitat: Tritt die auslösende Ursache erst nach dem Bilanzstichtag ein, wird das Ereignis grundsätzlich nicht in der Jahresrechnung erfasst, ist aber im Anhang ausweispflichtig.
- id: A1-103
  vorgehen: 'VE-Entwurf nach SER Anhang E vorbereiten (an Revisionsstelle adressiert; mandatsspezifische Punkte z.B. Fortführung, Ereignisse nach Stichtag, Nahestehende) und als Pendenz
    zur Besprechung/Unterzeichnung erfassen. Unterzeichnete VE in M-Files suchen; prüfen: datiert auf Berichtsdatum, unterzeichnet von denselben Personen wie die JR. Besprechung führt
    der WP.'
  nachweise:
  - Vollständigkeitserklärung (unterzeichnet, datiert)
  - unterzeichnete Jahresrechnung
  rechnen: ''
  feststellung_wenn: VE fehlt, ist nicht unterzeichnet/datiert, Datum weicht vom Berichtsdatum ab oder die Unternehmensleitung verweigert eine notwendige Erklärung.
  fundstellen:
  - quelle: ser-2022__6-2-5
    zitat: Die Unternehmensleitung bestätigt dem Abschlussprüfer die Vollständigkeit der Jahresrechnung sowie die Richtigkeit und Vollständigkeit der erteilten Auskünfte
  - quelle: ser-2022__anh-e-s102-1
    zitat: Das Datum der Vollständigkeitserklärung entspricht im Regelfall dem Datum der Unterzeichnung des Revisionsberichts.
  - quelle: hwp-er-2026__rz-0341-s260
    zitat: Eine Weigerung der Unternehmensleitung, eine nach Auffassung des Abschlussprüfers notwendige Erklärung abzugeben, führt zu einer Beschränkung des Prüfungsumfangs.
  - quelle: or__art-730b
    zitat: erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt, auf Verlangen auch schriftlich
- id: A1-201
  vorgehen: Saldoliste Bilanz/ER mit Vorjahr vergleichen (absolute und relative Veränderungen, Kennzahlen wie Bruttomarge, Personalaufwand/Ertrag, Eigenkapitalquote, Liquidität) und
    mit den Kenntnissen zu Tätigkeit und Umfeld (Dauerakten, Planung) abgleichen. Unerklärte wesentliche Abweichungen im Textfeld auflisten und als Frage/Pendenz erfassen; Gesamturteil
    beim WP.
  nachweise:
  - Saldoliste Bilanz und ER (Geschäftsjahr/Vorjahr)
  - Jahresrechnung
  - Unternehmensinformationen/Dauerakten
  - Planungsunterlagen
  rechnen: Veränderung je Position = Saldo GJ − Saldo VJ; Veränderung % = Veränderung / |Saldo VJ|; Kennzahlen GJ vs. VJ (z.B. Personalaufwand / Betriebsertrag, Eigenkapital / Bilanzsumme)
  feststellung_wenn: Wesentliche Veränderung oder Kennzahl ist mit dem Verständnis von Tätigkeit und Umfeld nicht erklärbar und durch die Prüfung der Einzelpositionen nicht abgedeckt.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-1
    zitat: Entspricht die Jahresrechnung dem Verständnis des Abschlussprüfers von der Tätigkeit und dem Umfeld des Unternehmens?
  - quelle: ser-2022__6-2-4
    zitat: ob die Jahresrechnung als Ganzes seinen Kenntnissen über Tätigkeit und Umfeld des Unternehmens entspricht
- id: A1-202
  vorgehen: Ergebnisse, Wesentliche Feststellungen und Pendenzen aller Prüffelder zusammentragen und der Gesamtanalytik (A1-201) gegenüberstellen. Widersprüche (Position unauffällig
    geprüft, Gesamtbild auffällig) markieren; Hinweise auf bisher unerkannte Risiken als Pendenz für zusätzliche Prüfungshandlungen festhalten.
  nachweise:
  - Ergebnisse der Prüffelder in revio
  - Notizen (Pendenzen, Wesentliche Feststellungen)
  - Gesamtanalytik A1-201
  rechnen: ''
  feststellung_wenn: Abschliessende Analytik zeigt ein vorher unerkanntes Risiko einer wesentlichen Fehlaussage oder widerspricht Schlussfolgerungen einzelner Prüffelder.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-1
    zitat: Werden die zuvor aus der Prüfung einzelner Positionen gezogenen Schlüsse erhärtet?
  - quelle: ser-2022__6-2-4
    zitat: Die Schlussfolgerungen sollen jene Prüfungsfeststellungen erhärten, die zuvor aus der Prüfung einzelner Teile der Jahresrechnung gezogen wurden.
  - quelle: hwp-er-2026__rz-0269-s245
    zitat: Die analytischen Prüfungshandlungen können in der Phase der abschliessenden Durchsicht der Jahresrechnung ein vorher unerkanntes Risiko einer wesentlichen Fehlaussage aufzeigen.
- id: A1-203
  vorgehen: Alle Fehlaussagen über der Nichtaufgriffsgrenze aus den Prüffeldern (Wesentliche Feststellungen) in einer Zusammenstellung mit Wirkung auf Ergebnis, Eigenkapital und Bilanzsumme
    kumulieren und mit der Gesamtwesentlichkeit vergleichen. Korrekturvorschläge und Information der Unternehmensleitung als Schlussbesprechungs-Notiz vorbereiten; Auswirkung auf den
    Bericht beurteilt der WP.
  nachweise:
  - Zusammenstellung der Fehlaussagen
  - Wesentlichkeitsberechnung aus der Planung
  - Notizen Wesentliche Feststellungen
  rechnen: Summe nicht korrigierter Fehlaussagen (Ergebnis- und EK-Wirkung) einzeln und kumuliert; Vergleich mit Gesamtwesentlichkeit und Nichtaufgriffsgrenze; Prüfung Vorzeichenwechsel
    Gewinn/Verlust
  feststellung_wenn: Einzelne oder kumulierte nicht korrigierte Fehlaussagen erreichen die Wesentlichkeit oder verwandeln z.B. einen Gewinn in einen Verlust.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Beurteilung der Auswirkung nicht korrigierter Fehler – sowohl einzeln als auch zusammengenommen.
  - quelle: ser-2022__5-3
    zitat: Während der Prüfung festgestellte Fehlaussagen werden laufend in einer Zusammenstellung nachgeführt
  - quelle: hwp-er-2026__rz-0053-s189
    zitat: Die während der eingeschränkten Revision festgestellten Fehlaussagen, die über der Nichtaufgriffsgrenze liegen, werden kumuliert
  - quelle: hwp-er-2026__rz-0054-s189
    zitat: Werden keine Korrekturen vorgenommen, beurteilt der Abschlussprüfer, ob die Jahresrechnung dadurch wesentlich falsch dargestellt ist.
- id: A1-204
  vorgehen: 'Checkliste Art. 958a–958d OR anhand JR, Anhang und Saldoliste abarbeiten: Fortführung, zeitliche/sachliche Abgrenzung, Klarheit, Vollständigkeit, Verlässlichkeit, Wesentlichkeit,
    Vorsicht, Stetigkeit, Verrechnungsverbot, Vorjahreszahlen, Währung, Sprache. Je Grundsatz Ergebnis mit Fundstelle im Textfeld; Hinweise auf Verstösse mit Konto/Betrag.'
  nachweise:
  - Jahresrechnung inkl. Anhang
  - Saldoliste
  - Kontenplan
  rechnen: Konten mit Gegensaldo innerhalb einer Position auflisten (Aktivkonto mit Habensaldo, Passivkonto mit Sollsaldo) als Indiz für Verrechnung
  feststellung_wenn: Verstoss gegen Grundlage oder Grundsatz mit wesentlichem Einfluss (z.B. Verrechnung, fehlende Vorjahreszahlen, fehlende Abgrenzung, nicht stetige Darstellung).
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Sind die Grundsätze ordnungsmässiger Rechnungslegung gemäss Art. 958c OR eingehalten?
  - quelle: ser-2022__anh-d-s072-2
    zitat: Sind die Bestimmungen von Art. 958d OR eingehalten?
  - quelle: hwp-er-2026__rz-0386-s270-t1
    zitat: neben den Grundlagen der Rechnungslegung (Annahme der Fortführung, zeitliche und sachliche Abgrenzung)
  - quelle: hwp-er-2026__rz-0386-s270-t1
    zitat: Verstösse gegen diese Rechnungslegungsvorschriften mit wesentlichem Einfluss auf die Jahresrechnung führen zu einer modifizierten Prüfungsaussage.
- id: A1-205
  vorgehen: Indikatoren aus JR/Saldoliste auswerten (Jahresverlust, negatives oder hälftig ungedecktes EK, Liquidität, Fälligkeiten, Rangrücktritte). Einschätzung der Unternehmensleitung
    (Budget, Liquiditätsplan ≥ 12 Monate) in M-Files suchen, sonst Pendenz. Anhangsangaben zu Fortführung/Unsicherheiten prüfen. Kapitalverlust/Überschuldung als Wesentliche Feststellung
    an WP.
  nachweise:
  - Jahresrechnung inkl. Anhang
  - Saldoliste
  - Budget/Liquiditätsplanung
  - Rangrücktrittserklärungen
  - Protokolle VR/GV
  - Vollständigkeitserklärung
  rechnen: 'Kapitalverlust: (Aktiven − Verbindlichkeiten) < 50 % × (Aktienkapital + nicht rückzahlbare gesetzliche Kapitalreserve + gesetzliche Gewinnreserve); Überschuldungsindiz: Aktiven
    < Verbindlichkeiten; EK-Quote = Eigenkapital / Bilanzsumme'
  feststellung_wenn: Hinweise auf erhebliche Zweifel an der Fortführung, Kapitalverlust oder begründete Besorgnis einer Überschuldung, oder fehlende/ungenügende Anhangsangaben zu wesentlichen
    Unsicherheiten.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-1
    zitat: Beruht die Rechnungslegung auf der Annahme, dass das Unternehmen auf absehbare Zeit fortgeführt wird
  - quelle: hwp-er-2026__rz-0187-s223
    zitat: Der Abschlussprüfer hat zu beurteilen, ob die Einschätzung der Unternehmensleitung mit der Prämisse der Fortführung der Unternehmenstätigkeit zu vereinbaren ist
  - quelle: ser-2022__anh-g-s140-1
    zitat: Liegt keine Einschätzung der Unternehmensleitung zur Fortführungsfähigkeit vor, bespricht der Abschlussprüfer mit der Unternehmensleitung die Gründe
  - quelle: or__art-725a
    zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- id: A1-206
  vorgehen: Saldoliste auf wesentliche Konten prüfen, die in Sammelpositionen aufgehen, und Bilanz/ER/Anhang auf gesondert auszuweisende Positionen (u.a. Forderungen/Verbindlichkeiten
    gegenüber Beteiligten und Organen, ausserordentliche/periodenfremde Posten, branchenübliche Positionen). Fehlende Ausweise mit Konto und Betrag im Textfeld.
  nachweise:
  - Saldoliste
  - Jahresrechnung inkl. Anhang
  - Verträge mit Nahestehenden
  rechnen: Anteil Konto bzw. Sammelposition an Bilanzsumme oder Betriebsertrag als Wesentlichkeitsindiz
  feststellung_wenn: Wesentliche Position (z.B. Nahestehende, Darlehen, ausserordentliche Posten) weder in Bilanz/ER noch im Anhang gesondert ausgewiesen.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Werden die für die Beurteilung der Vermögens-, Finanz- und Ertragslage durch Dritte oder aufgrund der Tätigkeit des Unternehmens notwendigen zusätzlichen Positionen
  - quelle: or__art-959a-t2
    zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
  - quelle: or__art-959b-t2
    zitat: Weitere Positionen müssen in der Erfolgsrechnung oder im Anhang einzeln ausgewiesen werden, sofern dies für die Beurteilung der Ertragslage durch Dritte wesentlich
- id: A1-207
  vorgehen: 'Aus den Prüffeldern Hinweise auf Bildung/Auflösung stiller Reserven sammeln (Wertberichtigungen, Abschreibungen über betriebswirtschaftlichem Mass, Rückstellungen) und Veränderung
    zum Vorjahr plausibilisieren. Bei Nettoauflösung mit bereinigtem Jahresergebnis vergleichen und Anhangsangabe prüfen. Methode unklar: Pendenz.'
  nachweise:
  - Ergebnisse Prüffelder (Vorräte, Anlagen, Rückstellungen, Delkredere)
  - Nachweis stille Reserven
  - Anhang
  rechnen: 'Nettoveränderung stille Reserven = Σ Bestand GJ − Σ Bestand VJ; bei Abnahme: Nettoauflösung / bereinigtes Jahresergebnis; Ergebnis vor Auflösung (Gewinn/Verlust) vs. nach
    Auflösung'
  feststellung_wenn: Wesentliche Nettoauflösung stiller Reserven ohne Offenlegung im Anhang oder Auflösung führt zu Gewinn statt Verlust ohne Angabe.
  fundstellen:
  - quelle: ser-2022__anh-d-s072-2
    zitat: Plausibilisierung von Bestand und Veränderungen der stillen Reserven auf Basis der Erkenntnisse aus den Prüfungsarbeiten bei den einzelnen Bilanzpositionen
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach der Berechnungsmethode der stillen Reserven im Vergleich zum Vorjahr
  - quelle: hwp-bur-2023__rz-0675-s298
    zitat: Wird das erwirtschaftete Ergebnis durch die Auflösung der stillen Reserven wesentlich günstiger dargestellt, ist der Nettobetrag aus Reservenauflösung im Anhang offenzulegen
- id: A1-208
  vorgehen: 'Nur relevant bei Zwischenabschluss für eine Zwischendividende (Protokolle, Antrag VR prüfen); sonst «nicht anwendbar» mit Begründung. Falls vorhanden: Bezeichnung als Zwischenabschluss,
    Überschriften/Zwischensummen der letzten JR, Anhangsangaben (Zweck, Vereinfachungen, Abweichungen) und Unterzeichnung prüfen.'
  nachweise:
  - Zwischenabschluss
  - GV-Beschluss Zwischendividende
  - letzte genehmigte Jahresrechnung
  rechnen: ''
  feststellung_wenn: Zwischenabschluss ohne Mindestgliederung der letzten JR oder Anhangsangaben, oder Vereinfachungen beeinträchtigen die Darstellung des Geschäftsgangs.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Feststellung, ob die Vereinfachungen und Verkürzungen bei der Erstellung eines Zwischenabschlusses nach Art. 960f OR für den Zweck einer Zwischendividende
  - quelle: or__art-960f
    zitat: Es sind mindestens die Überschriften und Zwischensummen auszuweisen, die in der letzten Jahresrechnung enthalten sind.
  - quelle: or__art-675a
    zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
- id: A1-301
  vorgehen: 'Unterzeichnete JR in M-Files suchen; prüfen, ob der Vorsitzende des VR und die für die Rechnungslegung zuständige Person (gemäss HR-Auszug/Unternehmensinfo) mit Datum unterzeichnet
    haben. Fehlt die Unterzeichnung: Pendenz. Unterzeichnungsdatum als frühestes Berichtsdatum im Textfeld festhalten.'
  nachweise:
  - unterzeichnete Jahresrechnung
  - Handelsregisterauszug / Organe
  rechnen: ''
  feststellung_wenn: Unterschrift fehlt oder nicht durch VR-Vorsitz und zuständige Person Rechnungslegung, oder Unterzeichnung erst nach dem vorgesehenen Berichtsdatum.
  fundstellen:
  - quelle: or__art-958
    zitat: Er ist vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person zu unterzeichnen.
  - quelle: ser-2022__8-6
    zitat: darf der Abschlussprüfer den Revisionsbericht frühestens auf den Zeitpunkt datieren, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen hat
  - quelle: hwp-er-2026__rz-0339-s259
    zitat: Die Jahresrechnung und die Vollständigkeitserklärung werden in der Regel von denselben Personen unterzeichnet.
- id: A1-302
  vorgehen: 'Eröffnungssalden aller Bilanzkonten (Hauptbuch) und Vorjahresspalte der JR mit der geprüften Vorjahres-JR abgleichen; Differenzen je Konto auflisten. Verwendung des Vorjahresergebnisses
    gemäss GV-Beschluss im Eigenkapital nachvollziehen. Vorjahr ungeprüft/anderer Prüfer: im Textfeld vermerken, Vorjahreswerte besonders beachten.'
  nachweise:
  - Hauptbuch (Eröffnungssalden)
  - Saldoliste (Spalte Vorjahr)
  - geprüfte Jahresrechnung Vorjahr und Revisionsbericht
  - GV-Protokoll Gewinnverwendung Vorjahr
  rechnen: 'Je Bilanzkonto: Eröffnungssaldo GJ − Schlusssaldo VJ (geprüfte JR) = 0; Vorjahresspalte JR GJ = JR VJ; Gewinn-/Verlustvortrag 01.01. = Vortrag VJ + Jahresergebnis VJ − Ausschüttungen/Zuweisungen
    gemäss GV'
  feststellung_wenn: Eröffnungssaldo oder Vorjahresspalte weicht von der geprüften Vorjahres-JR ab, ohne Erläuterung im Anhang.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres (geprüfte Jahresrechnung, falls vorhanden)
  - quelle: hwp-er-2026__rz-0147-s208
    zitat: Diese Übereinstimmung von Schluss- und Eröffnungsbilanzwerten verifiziert der Abschlussprüfer.
  - quelle: ser-2022__6-2-7
    zitat: Der Tatbestand, dass die Vorjahresrechnung nicht oder von einem anderen Abschlussprüfer geprüft wurde, ist im Revisionsbericht anzumerken.
- id: A1-303
  vorgehen: Schlusssalden aus Saldoliste/Hauptbuch je Konto den JR-Positionen zuordnen (Mapping Konto → Position) und Summen je Position, Total Aktiven/Passiven sowie Jahresergebnis
    abstimmen. Differenzen mit Konto und Betrag im Textfeld; Umgliederungen ausserhalb der Buchhaltung belegen lassen (Pendenz).
  nachweise:
  - Saldoliste
  - Hauptbuch
  - Jahresrechnung
  rechnen: Σ Saldi der Konten je Position = Betrag Position JR; Total Aktiven = Total Passiven; Total Aktiven Saldoliste = Total Aktiven JR; Jahresergebnis Saldoliste ER = Jahresergebnis
    JR
  feststellung_wenn: Differenz zwischen Hauptbuch/Saldoliste und JR-Position oder Totale Aktiven/Passiven ungleich, ohne belegte Umgliederung.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Totale von Aktiven und Passiven
- id: A1-304
  vorgehen: 'GV- und VR-Protokolle des Geschäftsjahres und bis zum Prüfungszeitpunkt in M-Files suchen und lesen; Sachverhalte mit JR-Wirkung (Kapitalmassnahmen, Darlehen, Rechtsfälle,
    Investitionen, Ausschüttungen) mit Verweis auf das Prüffeld auflisten. Prüfen: Genehmigung letzte JR innert 6 Monaten, Wahl Revisionsstelle, Beschluss Verwendung Bilanzgewinn/-verlust,
    Unterzeichnung JR. Fehlende Protokolle: Pendenz.'
  nachweise:
  - GV-Protokolle (ordentlich/ausserordentlich)
  - VR-Protokolle und Zirkularbeschlüsse
  - Handelsregisterauszug
  - Statuten
  rechnen: Datum ordentliche GV − Bilanzstichtag Vorjahr ≤ 6 Monate
  feststellung_wenn: Protokollierter Sachverhalt mit JR-Wirkung nicht berücksichtigt, GV nicht innert 6 Monaten, Wahl der Revisionsstelle oder Gewinnverwendungsbeschluss fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen
  - quelle: ser-2022__anh-d-s073-2
    zitat: Genehmigung der letzten Jahresrechnung innerhalb von sechs Monaten
  - quelle: ser-2022__anh-d-s073-2
    zitat: Beschluss über die Verwendung des Bilanzgewinns (umfasst auch einen allfälligen Bilanzverlust)
  - quelle: or__art-699
    zitat: Die ordentliche Generalversammlung findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt.
- id: A1-305
  vorgehen: Prüfen, ob die JR Bilanz, Erfolgsrechnung und Anhang enthält; Geldflussrechnung nur bei ordentlicher Revisionspflicht bzw. statutarisch/nach Standard verlangt; Antrag über
    die Verwendung des Bilanzgewinns als separates Dokument. Fehlende Bestandteile mit Fundstelle im Textfeld; Anhang-Detail im Prüffeld Anhang.
  nachweise:
  - Jahresrechnung
  - Antrag VR Verwendung Bilanzgewinn
  - Statuten
  rechnen: ''
  feststellung_wenn: Gesetzlich oder statutarisch vorgeschriebener Bestandteil fehlt (Bilanz, ER, Anhang; ggf. Geldflussrechnung) oder kein Gewinnverwendungsantrag.
  fundstellen:
  - quelle: or__art-958
    zitat: Dieser enthält die Jahresrechnung (Einzelabschluss), die sich aus der Bilanz, der Erfolgsrechnung und dem Anhang zusammensetzt.
  - quelle: ser-2022__1-6-t1
    zitat: Zu prüfen sind einzig die Gesetzes- und Statutenkonformität der Jahresrechnung oder eines allfälligen Zwischenabschlusses (Bilanz, Erfolgsrechnung und Anhang)
  - quelle: or__art-961
    zitat: als Teil der Jahresrechnung eine Geldflussrechnung erstellen
- id: A1-306
  vorgehen: Gliederung der Bilanz mit Art. 959a Abs. 1/2 OR (Positionen, Reihenfolge nach Liquidität bzw. Fälligkeit, Umlauf-/Anlagevermögen, kurz-/langfristiges Fremdkapital, Eigenkapital)
    und der ER mit Art. 959b OR (Produktions- oder Absatzerfolgsrechnung) abgleichen; bei Absatzerfolgsrechnung Anhangsangaben prüfen. Abweichungen im Textfeld.
  nachweise:
  - Jahresrechnung
  - Saldoliste
  rechnen: ''
  feststellung_wenn: Mindestposition fehlt, Reihenfolge oder Zuordnung kurz-/langfristig falsch, oder ER folgt keinem der beiden gesetzlichen Schemata.
  fundstellen:
  - quelle: or__art-959a-t1
    zitat: Unter den Aktiven müssen ihrem Liquiditätsgrad entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
  - quelle: or__art-959a-t1
    zitat: Unter den Passiven müssen ihrer Fälligkeit entsprechend mindestens folgende Positionen einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
  - quelle: or__art-959b-t1
    zitat: Sie kann als Produktionserfolgsrechnung oder als Absatzerfolgsrechnung dargestellt werden.
  - quelle: hwp-er-2026__rz-0377-s269
    zitat: die Bestimmungen über die Mindestgliederung nicht eingehalten sind (Art. 959a und 959b OR)
- id: A1-307
  vorgehen: Jahresgewinn/-verlust in Erfolgsrechnung, Eigenkapital und im Antrag des VR über die Verwendung des Bilanzgewinns abstimmen; Bilanzgewinn/-verlust = Vortrag + Jahresergebnis
    nachrechnen. Gesetzeskonformität des Antrags (Reservenzuweisung, Ausschüttbarkeit) als Hinweis an den WP bzw. Prüffeld Eigenkapital.
  nachweise:
  - Jahresrechnung
  - Antrag VR Verwendung Bilanzgewinn
  - Saldoliste
  rechnen: Jahresergebnis ER = Position Jahresergebnis im EK = Jahresergebnis im Antrag; Bilanzgewinn/-verlust = Gewinn-/Verlustvortrag + Jahresergebnis
  feststellung_wenn: Jahresergebnis stimmt zwischen ER, Eigenkapital und Antrag nicht überein oder Antrag ist rechnerisch bzw. gesetzlich nicht konform.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des ausgewiesenen Jahresgewinns (oder Jahresverlusts) im Eigenkapital und in der Erfolgsrechnung
  - quelle: hwp-er-2026__rz-0439-s284
    zitat: prüft die Revisionsstelle den Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinns
- id: A1-308
  vorgehen: 'Detailnachweis stille Reserven (Bestand je Bilanzposition per Stichtag und Vorjahr) in M-Files suchen, rechnerisch nachvollziehen und mit den Prüffeld-Ergebnissen (Vorräte,
    Anlagen, Rückstellungen, Wertberichtigungen) abstimmen; Veränderung ermitteln. Bei wesentlicher Nettoauflösung Offenlegung im Anhang prüfen. Fehlender Nachweis: Pendenz.'
  nachweise:
  - Nachweis stille Reserven GJ und VJ
  - Anhang
  - Ergebnisse der betroffenen Prüffelder
  rechnen: 'Je Position: stille Reserve = gesetzlich zulässiger Höchstwert − Buchwert (Aktiven) bzw. Buchwert − erforderlicher Betrag (Rückstellungen); Σ GJ − Σ VJ = Veränderung; Nettoauflösung
    vs. Anhangsangabe'
  feststellung_wenn: Nachweis fehlt oder ist nicht nachvollziehbar, oder wesentliche Nettoauflösung ist nicht als Gesamtbetrag im Anhang offengelegt.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
  - quelle: hwp-bur-2023__rz-0671-s297
    zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
  - quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven
- id: A1-401
  vorgehen: Nur wenn eine Geldflussrechnung vorgeschrieben (Art. 961 OR, Statuten, Standard) oder Teil der geprüften JR ist; sonst «nicht anwendbar» mit Begründung. Prüfen, ob Geldfluss
    aus Geschäfts-, Investitions- und Finanzierungstätigkeit je gesondert dargestellt und auf die Fondsveränderung übergeleitet wird.
  nachweise:
  - Geldflussrechnung
  - Statuten / Revisionsart
  rechnen: ''
  feststellung_wenn: Vorgeschriebene Geldflussrechnung fehlt oder stellt die drei Bereiche nicht gesondert dar.
  fundstellen:
  - quelle: or__art-961b
    zitat: Die Geldflussrechnung stellt die Veränderung der flüssigen Mittel aus der Geschäftstätigkeit, der Investitionstätigkeit und der Finanzierungstätigkeit je gesondert dar.
  - quelle: hwp-bur-2023__rz-0802-s333
    zitat: 'Bei grösseren Unternehmen besteht die Jahresrechnung somit aus vier Teilen: Bilanz, Erfolgsrechnung, Geldflussrechnung und Anhang.'
  - quelle: hwp-er-2026__rz-0365-s266
    zitat: Statuten oder anerkannte Standards zur Rechnungslegung (z.B. Kern-FER) können weitere Bestandteile der Jahresrechnung fordern
- id: A1-402
  vorgehen: 'Geldflussrechnung rechnerisch nachvollziehen: Fonds Anfang/Ende mit Bilanz (Bestandteile bei netto flüssigen Mitteln offengelegt), Jahresergebnis und Abschreibungen mit
    ER, nicht liquiditätswirksame Posten vollständig, Investitionen/Desinvestitionen mit Anlagespiegel und Verkaufsbelegen, Dividenden mit GV-Beschluss, Zuordnung zu den drei Bereichen.
    Differenzen im Textfeld.'
  nachweise:
  - Geldflussrechnung
  - Bilanz und Erfolgsrechnung
  - Anlagespiegel
  - Verkaufsbelege Anlagen
  - GV-Beschluss Dividende
  - Rückstellungsspiegel
  rechnen: Fonds Ende − Fonds Anfang = CF Geschäftstätigkeit + CF Investitionstätigkeit + CF Finanzierungstätigkeit (± Kursdifferenzen Fonds); Jahresergebnis GFR = ER; Abschreibungen
    GFR = ER; Investitionen GFR = zahlungswirksame Zugänge Anlagespiegel
  feststellung_wenn: GFR geht nicht auf die Fondsveränderung auf, Jahresergebnis/Abschreibungen weichen von der ER ab oder wesentliche Fehlzuordnung zwischen den Bereichen.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0803-s333
    zitat: Die Bezugsgrösse der Geldflussrechnung (sog. Fonds) bilden die flüssigen Mittel
  - quelle: hwp-bur-2023__rz-0805-s333
    zitat: Bei der indirekten Methode werden zum Jahresergebnis die nicht liquiditätswirksamen Geschäftsvorfälle hinzugefügt bzw. in Abzug gebracht.
  - quelle: hwp-bur-2023__rz-0809-s335-t1
    zitat: Am Ende der Geldflussrechnung wird in der Regel vom Anfangsbestand des gewählten Fonds auf den Endbestand übergeleitet.
