  zitat: Dies schliesst Prüfungshandlungen bezüglich Ereignissen ein, die bis zum Berichtsdatum eingetreten sind.
- dokument: Zwischenabschluss und Beschluss Zwischendividende (falls vorhanden)
  zweck: A1-208
  quelle: or__art-960f
  zitat: Es sind mindestens die Überschriften und Zwischensummen auszuweisen, die in der letzten Jahresrechnung enthalten sind.
- dokument: Zustimmung sämtlicher Aktionäre zur Zwischendividende (nur bei Verzicht auf die Prüfung des Zwischenabschlusses)
  zweck: A1-208
  quelle: or__art-675a
  zitat: Auf die Prüfung kann verzichtet werden, wenn sämtliche Aktionäre der Ausrichtung der Zwischendividende zustimmen
- dokument: Geldflussrechnung inkl. Fondsnachweis und Anlagespiegel (nur falls erstellt/vorgeschrieben)
  zweck: A1-401, A1-402
  quelle: hwp-bur-2023__rz-0802-s333
  zitat: 'Bei grösseren Unternehmen besteht die Jahresrechnung somit aus vier Teilen: Bilanz, Erfolgsrechnung, Geldflussrechnung und Anhang.'
- dokument: Covid-19-Kreditvereinbarung bzw. Bürgschaftsvertrag und Saldo per 31.12. (falls vorhanden)
  zweck: A1-205, A1-307
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
bewertung:
- regel: Grundsätze ordnungsmässiger Rechnungslegung gelten für alle Teile der Jahresrechnung; Stetigkeit in Darstellung und Bewertung.
  quelle: or__art-958c
  zitat: Es sind bei der Darstellung und der Bewertung stets die gleichen Massstäbe zu verwenden.
- regel: Methodenwechsel nur begründet, mit Darlegung im Anhang; Schätzungsänderungen sind davon zu unterscheiden.
  quelle: hwp-bur-2023__rz-0061-s070
  zitat: Von Änderungen der Bewertungsgrundsätze und -methoden zu unterscheiden sind Anpassungen aufgrund von Schätzungsänderungen.
- regel: 'Bei beabsichtigter oder nicht abwendbarer Einstellung innert 12 Monaten: Veräusserungswerte für betroffene Teile.'
  quelle: or__art-958a
  zitat: so sind der Rechnungslegung für die betreffenden Unternehmensteile Veräusserungswerte zugrunde zu legen
- regel: 'Stille Reserven: jährlich per Stichtag je Bilanzposition nach stetiger Methode ermitteln und mit Vorjahr vergleichen.'
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
- regel: Offenlegung nur des Nettobetrags der Auflösung stiller Reserven, als Gesamtbetrag, wenn das Ergebnis wesentlich günstiger dargestellt wird.
  quelle: hwp-bur-2023__rz-0817-s341-t1
  zitat: Offenzulegen ist nur der Nettobetrag der aufgelösten stillen Reserven.
- regel: Ereignisse nach dem Stichtag mit Ursache vor dem Stichtag sind in der Jahresrechnung des abgelaufenen Geschäftsjahres zu buchen.
  quelle: hwp-bur-2023__rz-0861-s353
  zitat: Besteht die Ursache für ein Ereignis bereits am Bilanzstichtag, so ist das Ereignis in der Jahresrechnung des abgelaufenen Geschäftsjahres buchungspflichtig
- regel: 'Ereignisse mit Ursache nach dem Stichtag: nicht buchen, aber wesentliche im Anhang mit Art und geschätzter finanzieller Auswirkung offenlegen.'
  quelle: hwp-bur-2023__rz-0860-s353
  zitat: Es sind die Art des Ereignisses und eine Schätzung der finanziellen Auswirkungen offenzulegen.
- regel: 'Ausnahme: Hebt ein Ereignis nach dem Stichtag die Fortführungsfähigkeit auf, sind Fortführungswerte ausgeschlossen.'
  quelle: hwp-bur-2023__rz-0861-s353
  zitat: Eine Ausnahme dazu besteht, wenn das Ereignis nach dem Bilanzstichtag dazu führt, dass die Fortführungsfähigkeit des Unternehmens nicht mehr gegeben ist.
- regel: Vorjahreszahlen sind in Bilanz und Erfolgsrechnung anzugeben.
  quelle: or__art-958d
  zitat: In der Jahresrechnung sind neben den Zahlen für das Geschäftsjahr die entsprechenden Werte des Vorjahres anzugeben.
- regel: 'Zwischenabschluss: mindestens Überschriften und Zwischensummen der letzten Jahresrechnung; keine Beeinträchtigung der Darstellung des Geschäftsgangs.'
  quelle: hwp-bur-2023__rz-0249-s121
  zitat: Insgesamt darf durch Vereinfachungen und Verkürzungen keine Beeinträchtigung der Darstellung des Geschäftsgangs entstehen.
- regel: 'Geldflussrechnung: Fonds sind gemäss Gesetz die flüssigen Mittel.'
  quelle: hwp-bur-2023__rz-0803-s333
  zitat: Die Bezugsgrösse der Geldflussrechnung (sog. Fonds) bilden die flüssigen Mittel
- regel: Fonds «Netto Flüssige Mittel» (inkl. Kontokorrentkredite) ist entgegen dem Gesetzeswortlaut vertretbar, wenn die Bestandteile des Fonds offengelegt sind.
  quelle: hwp-bur-2023__rz-0803-s333
  zitat: Unter Offenlegung der Bestandteile des Fonds erscheint diese Praxis entgegen dem Gesetzes
- regel: 'Geldfluss aus Geschäftstätigkeit nach indirekter Methode: Jahresergebnis um nicht liquiditätswirksame Vorgänge bereinigen.'
  quelle: hwp-bur-2023__rz-0805-s333
  zitat: Bei der indirekten Methode werden zum Jahresergebnis die nicht liquiditätswirksamen Geschäftsvorfälle hinzugefügt bzw. in Abzug gebracht.
- regel: Einschätzung der Fortführungsfähigkeit durch die Unternehmensleitung für mindestens 12 Monate ab Bilanzstichtag.
  quelle: ser-2022__anh-g-s138-1
  zitat: Die Unternehmensleitung hat die Einschätzung der Fortführungsfähigkeit für einen Zeitraum von mindestens zwölf Monaten ab dem Bilanzstichtag vorzunehmen
- regel: 'Going Concern vertretbar, aber wesentliche Unsicherheit im Anhang hinreichend offengelegt: Zusatz im Revisionsbericht mit Verweis auf den Anhang (Vorschlag Agent, Entscheid
    WP).'
  quelle: ser-2022__anh-g-s141-1
  zitat: In diesem Fall ist ein Zusatz im Revisionsbericht anzubringen, in dem die wesentlichen Unsicherheiten kurz beschrieben werden
- regel: 'Unsicherheiten bestehen, Anhangsangaben fehlen oder genügen nicht: Modifizierung der Prüfungsaussage (Entscheid WP).'
  quelle: ser-2022__anh-g-s141-2
  zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang der Jahresrechnung trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
- regel: 'Unternehmensleitung verweigert die Einschätzung oder legt weniger als 12 Monate zugrunde: Modifizierung der Prüfungsaussage (Entscheid WP).'
  quelle: ser-2022__anh-g-s141-2
  zitat: es wird für den Einschätzungszeitraum eine geringere Zeitspanne zugrunde gelegt
- regel: Rangrücktritt genügt nur im Ausmass der Überschuldung, mit Stundung und unter Einschluss von Kapital und Zinsen während der Überschuldung.
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- regel: 'Höhe: mindestens im Ausmass der Überschuldung; ist die Fortführung nicht gefährdet, genügt die Ausrichtung auf die Deckungslücke zu Fortführungswerten.'
  quelle: hwp-er-2026__rz-0420-s125
  zitat: sollte ein Rangrücktritt, der «nur» auf die Deckungslücke zu Fortführungswerten ausgerichtet ist, genügen
- regel: Der Rangrücktritt beseitigt die Überschuldung nicht und ist keine Sanierungsmassnahme; er dispensiert nur von der Anzeige an das Gericht.
  quelle: hwp-er-2026__rz-0405-s122
  zitat: Er beseitigt weder die Überschuldung noch stellt er eine Sanierungsmassnahme im Sinne von Art. 725a Abs. 1 OR dar.
- regel: Rangrücktrittsbelastete Darlehen bleiben Verbindlichkeiten (kein Ausbuchen); der Rangrücktritt ist in Bilanz oder Anhang auszuweisen und zu erläutern.
  quelle: hwp-er-2026__rz-0430-s127
  zitat: muss deshalb in der Jahresrechnung des Schuldners (in der Bilanz oder im Anhang) ausgewiesen und erläutert werden
- regel: 'Rangrücktritt darf grundsätzlich nicht reduziert werden. Ausnahme nur, wenn ALLE drei Bedingungen erfüllt sind: (a) ein nach SA-CH geprüfter (Zwischen-)Abschluss zeigt eine
    mindestens entsprechend reduzierte Überschuldung (SA-CH = ordentliche Prüfung; die eingeschränkte Revision der JR genügt nicht, nötig ist ein separater Prüfungsbericht nach SA-CH;
    im Zweifel Frage an den WP), UND (b) der VR hat schriftlich und begründet dargelegt, dass in den nächsten 12 Monaten keine weiteren Verluste absehbar sind, UND (c) keine anderen
    Rangrücktrittsgläubiger werden benachteiligt (oder sie haben zugestimmt). Danach alle Anforderungen an den Rangrücktritt erneut prüfen.'
  quelle: hwp-er-2026__rz-0425-s126
  zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden. Ausgenommen sind Fälle, bei denen (a) sich aus einem in Übereinstimmung mit den SA- CH geprüften
    (Zwischen-)Abschluss ergibt, dass sich auch die Überschuldung mindestens im entsprechenden Umfang reduziert hat und (b) der Verwaltungsrat der Gesellschaft schriftlich und begründet
    dargelegt hat, dass während der nächsten zwölf Monate keine weiteren Verluste absehbar sind, und (c) durch die Reduktion keine anderen Rangrücktrittsgläubiger benachteiligt werden
- regel: 'Reduktion oder Aufhebung des Rangrücktritts auf Basis eines Zwischenabschlusses: separater Prüfungsbericht nach SA-CH nötig; ohne separaten Bericht genügt nur eine ordentlich
    geprüfte JR mit Veränderung zum Jahresende.'
  quelle: hwp-er-2026__rz-0426-s126
  zitat: Sollen die Rangrücktritte auf Basis eines Zwischenabschlusses reduziert oder aufgehoben werden, bedarf es eines separaten Prüfungsberichts nach den SA- CH.
- regel: Weist die JR zu Fortführungswerten eine Überschuldung aus, ist zusätzlich ein Abschluss zu Veräusserungswerten zu erstellen.
  quelle: hwp-er-2026__rz-0402-s120-t3
  zitat: In diesem Fall ist zusätzlich ein Abschluss zu Veräusserungswerten zu erstellen, wenn die Jahresrechnung zu Fortführungswerten eine Überschuldung ausweist
- regel: Ergibt die eingeschränkte Revision eine Überschuldung, wird sie im Revisionsbericht festgehalten und die Organe werden auf ihre Pflichten aufmerksam gemacht; die JR gilt als
    Zwischenabschluss zu Fortführungswerten (Entscheid WP).
  quelle: ser-2022__9-t2
  zitat: Ergibt sich aus der eingeschränkten Revision eine Überschuldung, so wird diese im Revisionsbericht festgehalten; zusätzlich werden die Organe auf ihre gesetzlichen Pflichten
    aufmerksam gemacht.
- regel: 'Berichtsbeispiel bei Überschuldung mit Rangrücktritt und eingehaltenen VR-Pflichten: nicht modifizierte Prüfungsaussage mit Zusatz (SER Anhang F, Beispiel 9).'
  quelle: ser-2022__anh-f-s126-2
  zitat: Wir machen darauf aufmerksam, dass die [2] im Sinne von Art. 725b OR überschuldet ist.
- regel: 'Bleibt der VR bei Kapitalverlust oder Überschuldung untätig: Hinweis im Revisionsbericht; bei Überschuldung zusätzlich Anzeigepflicht nach Art. 729c OR (Entscheid WP).'
  quelle: ser-2022__8-3-2-t1
  zitat: Bleibt der Verwaltungsrat untätig, beachtet die Revisionsstelle zusätzlich bei Vorliegen einer Überschuldung (Art. 725b OR) die Anzeigepflicht gemäss Art. 729c OR.
- regel: 'Offensichtliche Überschuldung (Art. 729c OR): auch bei optimistischer Betrachtung nicht zu leugnen, u.a. wenn keine oder keine genügenden Rangrücktritte vorhanden sind.'
  quelle: ser-2022__anh-h-s142-1
  zitat: keine oder keine genügenden Rangrücktritte vorhanden sind
fallstricke:
- text: Die Vollständigkeitserklärung ersetzt keine Prüfungsnachweise; wesentliche Positionen nicht allein darauf abstützen.
  quelle: hwp-er-2026__rz-0338-s259
  zitat: dass die Vollständigkeitserklärung kein Ersatz für Prüfungsnachweise ist
- text: Verweigert die Unternehmensleitung eine notwendige Erklärung, liegt eine Beschränkung des Prüfungsumfangs vor (Entscheid WP).
  quelle: hwp-er-2026__rz-0341-s260
  zitat: Eine Weigerung der Unternehmensleitung, eine nach Auffassung des Abschlussprüfers notwendige Erklärung abzugeben, führt zu einer Beschränkung des Prüfungsumfangs.
- text: Datum der Vollständigkeitserklärung = Datum Revisionsbericht; Bericht frühestens auf Datum der Unterzeichnung/Genehmigung der Jahresrechnung.
  quelle: ser-2022__anh-e-s102-1
  zitat: Das Datum der Vollständigkeitserklärung entspricht im Regelfall dem Datum der Unterzeichnung des Revisionsberichts.
- text: Ereignisse nach dem Bilanzstichtag sind bis zum Berichtsdatum zu berücksichtigen, nicht nur bis zum Abschluss der Feldarbeit.
  quelle: ser-2022__8-6
  zitat: Dies schliesst Prüfungshandlungen bezüglich Ereignissen ein, die bis zum Berichtsdatum eingetreten sind.
- text: Ereignisse nach dem Stichtag nicht nur auf Buchung/Offenlegung, sondern auch auf Risiken für die Fortführung beurteilen (A1-102 mit A1-205 verknüpfen).
  quelle: ser-2022__anh-g-s141-1
  zitat: Beurteilung der Ereignisse nach dem Bilanzstichtag, um Risiken zu identifizieren
- text: 'Vorjahr nicht oder von anderem Prüfer geprüft (Erstprüfung/Opting-out): Vorjahreswerte besonders beachten; Anmerkung im Bericht: Entscheid WP (Agent liefert nur den Hinweis).'
  quelle: ser-2022__6-2-7
  zitat: Der Tatbestand, dass die Vorjahresrechnung nicht oder von einem anderen Abschlussprüfer geprüft wurde, ist im Revisionsbericht anzumerken.
- text: Analytik in kleinen Verhältnissen ist durch Bildung/Auflösung stiller Reserven verzerrt; Zahlen vor Vergleich bereinigen.
  quelle: hwp-er-2026__rz-0110-s199
  zitat: dass in kleineren Verhältnissen die ausgewiesenen Beträge durch den Bestand und/oder die Veränderung stiller Reserven beeinflusst werden
- text: 'Wesentlichkeit der Nettoauflösung nicht nur relativ beurteilen: kippt das Ergebnis von Verlust zu Gewinn, ist sie regelmässig wesentlich.'
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: Die relative Höhe der Auflösung, z.B. im Verhältnis zum Jahresergebnis, ist insbesondere dann nicht allein ausschlaggebend
- text: Auch kleine Fehler können wesentlich sein, wenn sie Gewinn in Verlust verwandeln.
  quelle: hwp-er-2026__rz-0044-s186
  zitat: Selbst ein geringer Fehler, der den ausgewiesenen Gewinn zu einem Verlust werden lässt, kann wesentlich sein.
- text: Geldflussrechnung ist gesetzlich nur bei ordentlicher Revisionspflicht vorgeschrieben (Art. 961 OR); bei eingeschränkter Revision nur Prüfungsgegenstand, wenn Statuten oder ein
    anerkannter Standard sie verlangen. Nur vorgeschriebene Teile gehören in die geprüfte Jahresrechnung.
  quelle: hwp-er-2026__rz-0365-s266
  zitat: Es ist darauf zu achten, dass nur jene Teile genannt werden, welche gesetzlich oder gemäss Statuten bzw. nach anerkanntem Rechnungslegungsstandard
- text: 'Negatives oder hälftig nicht mehr gedecktes Eigenkapital: Kapitalverlust/Überschuldung (Art. 725a/725b OR) mit Going Concern (A1-205) und Prüffeld Eigenkapital/Darlehen verknüpfen;
    Beurteilung durch WP.'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
- text: Rangrücktritte ersetzen den Zwischenabschluss (Fortführungs- und Veräusserungswerte) nicht; ein Verzicht auf einen erneuten Zwischenabschluss ist nur nach individueller Risikobeurteilung
    im Einzelfall möglich (Entscheid WP).
  quelle: hwp-er-2026__rz-0423-s125-t2
  zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
- text: 'Formulierungen wie «Überschuldung durch Rangrücktritte behoben» sind fachlich unzutreffend: Der Rangrücktritt dispensiert nur von der Anzeige an das Gericht; Anhangstext entsprechend
    kritisch lesen.'
  quelle: hwp-er-2026__rz-0405-s122
  zitat: Ein Rangrücktritt dispensiert lediglich von der Überschuldungsanzeige an das Gericht.
- text: 'Tilgung oder Verrechnung rangrücktrittsbelasteter Forderungen (inkl. Zinsen) trotz andauernder Überschuldung: Hinweis nach Art. 729c OR erwägen, Auswirkung auf Prüfungsaussage
    und erneute Deckung prüfen (Entscheid WP).'
  quelle: hwp-er-2026__rz-0434-s128
  zitat: dass dem Rangrücktritt unterstellte Forderungen trotz andauernder Überschuldung ganz oder teilweise ge
- text: 'Rangrücktritt nicht nur formell prüfen: Bonität des Rangrücktrittsgläubigers beurteilen (Anfechtungsrisiko im Konkurs des Gläubigers).'
  quelle: hwp-er-2026__rz-0432-s127
  zitat: Dies beinhaltet auch die Beurteilung der Bonität des Rangrücktrittgläubigers
- text: Der Zusatz zur Überschuldung ist unabhängig von vorhandenen Rangrücktritten anzubringen (HWP ER zur Berichterstattung über Zwischenabschlüsse; die JR gilt als Zwischenabschluss
    zu Fortführungswerten, SER Ziff. 9) – Entscheid WP.
  quelle: hwp-er-2026__rz-0477-s292
  zitat: unabhängig von eventuell vorhandenen Rangrücktritten
- text: Protokolle nur auf Auswirkungen auf Jahresrechnung/Antrag lesen; die Geschäftsführung des VR ist nicht Prüfungsgegenstand.
  quelle: or__art-729a
  zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
- text: 'Befragungsschritte (1xx) kann der Agent nicht selbst führen: nur schriftliche Antworten auswerten, sonst Pendenz; Status höchstens «teilweise bearbeitet»; VE nie selbst «unterzeichnen
    lassen», Visum bleibt beim WP.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus'
- text: 'Der Agent fordert nichts direkt beim Kunden an: Fragen und fehlende Unterlagen als Pendenz bzw. PBC-Vorschlag erfassen, die Anforderung macht der Mensch.'
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Anforderung beim Kunden durch den Menschen
- text: Sonstige Schritte (4xx, hier Geldflussrechnung) nur auf Anweisung des WP bearbeiten.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: '«nicht anwendbar» ist kein Agentenstatus: Status «nicht bearbeitet» mit Begründung «Vorschlag: nicht anwendbar …», Entscheid WP.'
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet)
- text: Gesamtbeurteilung, Wesentlichkeitsurteil und Auswirkung auf die Prüfungsaussage (A1-2xx) sind Ermessensentscheide des WP; der Agent liefert nur Analysen und Hinweise.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Kein Visum, kein ✓, keine Abschliessende Beurteilung
- text: 'Verstoss gegen das Covid-19-SBüG: Der Agent meldet nur (Notiz, Rapport). Frist setzen sowie GV und Bürgschaftsorganisation informieren ist Sache des WP.'
  quelle: covid-sbueg__art-23
  zitat: Wird dieser nicht innerhalb der gesetzten Frist hergestellt, so muss die Revisionsstelle die Generalversammlung informieren.
fragen_kunde:
- frage: 'Wurden gegenüber dem Vorjahr die Darstellung (Gliederung, Bezeichnungen, Kontenzuordnung) oder Bewertungsgrundsätze/-methoden (z.B. Abschreibungsmethode, Vorrats- oder Auftragsbewertung)
    geändert? Falls ja: warum, und wo im Anhang dargelegt?'
  zweck: A1-101 Stetigkeit; Pendenz bis schriftliche Antwort vorliegt
- frage: Welche wesentlichen positiven oder negativen Ereignisse sind seit dem Bilanzstichtag eingetreten (z.B. Verluste, Rechtsfälle, Finanzierung, Grossaufträge, Kapitalmassnahmen)
    und wie wurden sie gebucht bzw. im Anhang offengelegt? Beeinträchtigt eines davon die Fortführung?
  zweck: A1-102 Ereignisse nach dem Bilanzstichtag; Verknüpfung A1-205
- frage: Wer unterzeichnet Jahresrechnung und Vollständigkeitserklärung, an welchem Datum wird die Jahresrechnung durch den VR genehmigt, und sind mandatsspezifische Ergänzungen der
    Vollständigkeitserklärung nötig?
  zweck: A1-103, A1-301; Berichtsdatum
- frage: Wie beurteilt die Unternehmensleitung die Fortführungsfähigkeit für mindestens zwölf Monate ab Bilanzstichtag (schriftliche Einschätzung, Budget, Liquiditätsplanung, Kreditlimiten,
    Rangrücktritte, Massnahmen)?
  zweck: A1-205 Going Concern
- frage: Liegen für alle nachrangigen Darlehen unterzeichnete, unbefristete Rangrücktrittserklärungen vor, die Kapital und Zinsen umfassen und eine Stundung enthalten? Wurden Rangrücktritte
    im Geschäftsjahr oder seither ersetzt, reduziert oder aufgehoben, oder rangrücktrittsbelastete Darlehen bzw. Zinsen getilgt oder verrechnet?
  zweck: A1-205 Deckung der Überschuldung
- frage: Wurde wegen der Überschuldung ein Zwischenabschluss zu Veräusserungswerten erstellt, und welche Massnahmen zur Beseitigung von Kapitalverlust bzw. Überschuldung hat der VR beschlossen?
  zweck: A1-205 Art. 725a/725b OR
- frage: Gab es im Geschäftsjahr wesentliche Veränderungen in Tätigkeit und Umfeld (Produkte, Kunden, Personalbestand, Standorte, Finanzierung), welche die Veränderungen in Bilanz und
    Erfolgsrechnung erklären?
  zweck: A1-201 Gesamtanalytik
- frage: Nach welcher Methode werden die stillen Reserven ermittelt (gleich wie Vorjahr?), wie hoch sind Bestand und Veränderung, und wurden netto stille Reserven aufgelöst?
  zweck: A1-207, A1-308
- frage: 'Ist die Unternehmensleitung bereit, die mitgeteilten Fehlaussagen (Zusammenstellung) zu korrigieren? Falls nein: Begründung.'
  zweck: A1-203 nicht korrigierte Fehler; Schlussbesprechung
- frage: Liegen alle Protokolle der GV und der VR-Sitzungen des Geschäftsjahres und bis heute vor (inkl. Zirkularbeschlüsse)?
  zweck: A1-304
- frage: 'Wurde im Geschäftsjahr ein Zwischenabschluss für eine Zwischendividende erstellt oder ist eine geplant? Falls ja: Wurde er geprüft oder haben sämtliche Aktionäre der Ausrichtung
    zugestimmt?'
  zweck: A1-208
- frage: Wird eine Geldflussrechnung erstellt (gesetzlich, statutarisch, auf Verlangen von Kreditgebern oder freiwillig) und welcher Fonds wird verwendet?
  zweck: A1-305, A1-401, A1-402 Anwendbarkeit
