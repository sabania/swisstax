# Prüffeld L1 – Detailwissen je Prüfschritt (Katalogtext: data/katalog.yaml). Jede Fundstelle: quelle = Chunk-Id, zitat = wörtlich.
code: L1
bezeichnung: Kurzfristige verzinsliche Verbindlichkeiten
status: agent-geprueft
erfasst:
  agent: workflow revision-prueffelder-wissen
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 19
    korrigiert: false
kurzbeschrieb: 'Kurzfristige verzinsliche Verbindlichkeiten (Art. 959a Abs. 2 Ziff. 1 lit. b OR): Bankkontokorrente, Festvorschüsse, kurzfristige Darlehen, innert 12 Monaten fällige
  Amortisationen, verzinsliche Darlehen Nahestehender. Eingeschränkte Revision: Bestand per Aufstellung/Auszug/Vertrag, Gliederung, Covenants, Zinsen und Abgrenzung, Sicherheiten, Nahestehende,
  Rangrücktritte, Anhang.'
gesetz:
- thema: 'Mindestgliederung: kurzfristige verzinsliche Verbindlichkeiten als eigene Position des kurzfristigen Fremdkapitals (Art. 959a Abs. 2 Ziff. 1 lit. b OR)'
  quelle: or__art-959a-t1
  zitat: b. kurzfristige verzinsliche Verbindlichkeiten
- thema: Abgrenzung kurzfristig/langfristig nach voraussichtlicher Fälligkeit innert eines Jahres (Art. 959 Abs. 6 OR)
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: Gesonderter Ausweis von Verbindlichkeiten gegenüber Beteiligten, Organen und Beteiligungsunternehmen (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
- thema: Bewertung von Verbindlichkeiten zum Nennwert (Art. 960e Abs. 1 OR)
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Periodenabgrenzung von Aufwand (Zinsen) (Art. 958b Abs. 1 OR); Erleichterung bis 100 000 Franken Nettoerlöse bzw. Finanzerträge (Abs. 2)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Anhang: Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: wesentliche Ereignisse nach dem Bilanzstichtag (z.B. Kündigung, Covenant-Verletzung) (Art. 959c Abs. 2 Ziff. 13 OR)'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- thema: Rechnungslegungswährung und Umrechnungskurse (Art. 958d Abs. 3 OR)
  quelle: or__art-958d
  zitat: Die verwendeten Umrechnungskurse sind im Anhang offenzulegen und gegebenenfalls zu erläutern.
- thema: Rangrücktritt bei Überschuldung muss geschuldeten Betrag und Zinsen umfassen (Art. 725b Abs. 4 Ziff. 1 OR)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
risiken:
- text: 'Unvollständigkeit: nicht gebuchte Bankkredite, Festvorschüsse oder Darlehen; Bilanzsaldo nicht durch Aufstellung, Auszug oder Vertrag per 31.12. belegt.'
  pruefziele:
  - EX
  - VO
  quelle: ser-2022__anh-d-s085-1
  zitat: Abstimmung einer Aufstellung der Verbindlichkeiten mit der Jahresrechnung
- text: 'Covenant-Verletzung ohne schriftlichen Waiver: Kredit sofort fällig, aber weiterhin langfristig ausgewiesen; Fortführungsrisiko nicht erkannt.'
  pruefziele:
  - RV
  - DO
  - BE
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: bei deren Verletzung die Verbindlichkeit sofort fällig gestellt werden kann
- text: 'Falsche Gliederung: innert 12 Monaten fällige Amortisationen oder kurzfristig kündbare Kredite unter langfristigem Fremdkapital; verzinsliche Darlehen unter übrigen (unverzinslichen)
    Verbindlichkeiten.'
  pruefziele:
  - DO
  quelle: hwp-bur-2023__rz-0875-s356
  zitat: sind grundsätzlich als kurzfristige verzinsliche Verbindlichkeiten zu bilanzieren
- text: Fehlende oder falsche Zinsabgrenzung (Marchzinsen per 31.12.), Zinsaufwand in falscher Periode oder auf falschem Konto.
  pruefziele:
  - PA
  - VO
  - RI
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
- text: Verbindlichkeiten gegenüber Aktionären, Organen oder Nahestehenden nicht gesondert ausgewiesen; übersetzte Zinsen an Beteiligte (geldwerte Leistung, Verrechnungssteuer).
  pruefziele:
  - DO
  - BE
  quelle: estv-zinsen-2026__s001-1
  zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
- text: Sicherheiten (Pfand, Globalzession, verpfändete Konten) zugunsten der Kreditgeber im Anhang nicht oder mit falschem Betrag offengelegt.
  pruefziele:
  - DO
  - RV
  quelle: hwp-bur-2023__rz-0843-s348
  zitat: Als Sicherung eigener Verbindlichkeiten gelten insbesondere Pfandbestellungen, Sicherungszessionen und Sicherungsübereignungen.
- text: Rangrücktritt formell oder betraglich ungenügend (nicht schriftlich, Zinsen nicht erfasst, befristet, reduziert) oder subordinierte Forderungen trotz Überschuldung getilgt/verrechnet.
  pruefziele:
  - DO
  - RV
  quelle: hwp-er-2026__rz-0432-s127
  zitat: Die Revisionsstelle hat sich davon zu überzeugen, dass der Rangrücktritt in qualitativer und quantitativer Hinsicht ausreichend ist.
- text: Fremdwährungskredite nicht zum Stichtagskurs umgerechnet bzw. unrealisierte Kursgewinne auf langfristigen Fremdwährungsverbindlichkeiten erfasst.
  pruefziele:
  - BE
  - RI
  quelle: ser-2022__anh-d-s074-1
  zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
- text: Unzulässige Verrechnung von Bankguthaben und Bankschulden verschiedener Banken (Bankschulden zu tief ausgewiesen).
  pruefziele:
  - DO
  - VO
  quelle: hwp-bur-2023__rz-0066-s071
  zitat: Dies ist beispielsweise der Fall bei der Verrechnung von Bankguthaben und -schulden verschiedener Banken
- text: Offene Devisentermingeschäfte mit negativem Marktwert ohne Absicherungszweck nicht als Verbindlichkeit/Rückstellung erfasst.
  pruefziele:
  - BE
  - VO
  - DO
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt werden
- text: 'Liquiditätsengpass: Kredite laufen aus oder werden gekündigt ohne Anschlussfinanzierung, Limiten ausgeschöpft (Fortführungsfähigkeit, Ausweis).'
  pruefziele:
  - RV
  - DO
  quelle: hwp-er-2026__rz-0191-s224
  zitat: Der Zeitpunkt der Fälligkeit von Verbindlichkeiten mit fester Laufzeit nähert sich
unterlagen:
- dokument: Aufstellung der kurzfristigen verzinslichen Verbindlichkeiten per 31.12. (Gläubiger, Konto, Saldo, Währung, Zinssatz, Fälligkeit/Amortisation, Sicherheiten, Nahestehende
    ja/nein)
  zweck: Bestand, Vollständigkeit, Gliederung, Abstimmung mit Hauptbuch (L1-301, L1-103, L1-104)
  quelle: ser-2022__anh-d-s085-1
  zitat: Abstimmung einer Aufstellung der Verbindlichkeiten mit der Jahresrechnung
- dokument: Bank-/Kreditkontoauszüge, Kredit- und Zinsausweise per 31.12. (alle Banken) sowie Auszüge Januar Folgejahr
  zweck: Bestandesnachweis, Zinsbelastungen, Stichtagsüberträge (L1-301, L1-403, L1-407, L1-410)
  quelle: hwp-bur-2023__rz-0485-s256
  zitat: Neben Verträgen dienen vor allem Saldobestätigungen, Depot- oder Kontoauszüge als Bestandsnachweis.
- dokument: Kredit-, Rahmenkredit-, Festvorschuss- und Darlehensverträge inkl. Allgemeiner Kreditbedingungen und Covenant-Klauseln; Pfand-, Zessions- und Sicherungsverträge
  zweck: Konditionen, Fälligkeiten, Covenants, Sicherheiten (L1-101, L1-102, L1-103, L1-303, L1-406)
  quelle: ser-2022__anh-d-s085-1
  zitat: Einsicht in Kredit- und Darlehensverträge
- dokument: Bankkorrespondenz Geschäftsjahr und bis Revisionsdatum (Kündigungen, Limitenänderungen, Covenant-Reporting, Waiver-Schreiben)
  zweck: Covenant-Einhaltung, Waiver vor Abschlusserstellung, Ereignisse nach Stichtag (L1-101, L1-303, L1-406)
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Die Umgliederung in die kurzfristigen verzinslichen Verbindlichkeiten kann allenfalls vermieden werden, wenn die kreditgebende Bank vor Erstellung des Abschlusses schriftlich
    bestätigt (sog. Waiver)
- dokument: Zinsabgrenzungsberechnung per 31.12. und Zinsabrechnungen der Kreditgeber
  zweck: Periodenabgrenzung und Verbuchung der Zinsen (L1-302, L1-410, L1-201)
  quelle: ser-2022__anh-d-s085-1
  zitat: Einsicht in die Zinsabgrenzungsberechnung
- dokument: Darlehensverträge mit Aktionären, Organen und Nahestehenden sowie Aktienbuch/Organliste
  zweck: Identifikation Nahestehender, gesonderter Ausweis, Zinssätze (L1-104)
  quelle: ser-2022__anh-d-s085-1
  zitat: Befragung zu Darlehen gegenüber direkt oder indirekt Beteiligten und Organen
- dokument: Unterzeichnete Rangrücktrittsvereinbarungen (aktuelle und ersetzte Fassungen) samt Begründung/Unterlagen zu Änderungen
  zweck: Gültigkeit, Höhe inkl. Zinsen, Änderungen (L1-105, L1-304, L1-320)
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
- dokument: Vom Unternehmen selbst eingeholte Bankbestätigungen/Bankauskünfte per 31.12., falls vorhanden (keine Anfrage durch die Revisionsstelle)
  zweck: Vollständigkeit Konten, Kredite, Sicherheiten, Garantien, Derivate (L1-401, L1-102, L1-411)
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
- dokument: Liquiditätsplanung/Finanzplan für mindestens zwölf Monate ab Bilanzstichtag
  zweck: Liquiditätsentwicklung, Kreditlimiten, Fortführung (L1-406)
  quelle: hwp-er-2026__rz-0194-s225
  zitat: fordert der Abschlussprüfer die Unternehmensleitung auf, den Zeitraum auf mindestens zwölf Monate auszudehnen
- dokument: Liste offener Devisentermingeschäfte/Derivate per 31.12. mit Bankbewertung (Wiederbeschaffungswerte) und Zweck (Absicherung)
  zweck: Bewertung offener Kontrakte (L1-411)
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist
- dokument: VR- und GV-Protokolle (Kreditaufnahmen, Sicherheiten, Rangrücktritte, Darlehen Nahestehender)
  zweck: Vollständigkeit, Genehmigung, Nahestehende (L1-303, L1-104, L1-404)
  quelle: ser-2022__anh-d-s073-1
  zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen
bewertung:
- regel: Verbindlichkeiten zum Nennwert; keine Bewertung zum tieferen Marktwert
  quelle: hwp-bur-2023__rz-0486-s256
  zitat: Das Nennwertprinzip für die Verbindlichkeiten schliesst eine Bewertung zum tieferen Marktwert aus.
- regel: Verzinsliche Verbindlichkeiten separat bilanzieren; innert zwölf Monaten fällige Beträge als kurzfristig
  quelle: hwp-bur-2023__rz-0489-s257
  zitat: Verbindlichkeiten und Teilbeträge von Verbindlichkeiten, die voraussichtlich innerhalb von zwölf Monaten nach Bilanzstichtag zur Zahlung fällig werden, sind in der Bilanz als
    kurzfristig auszuweisen
- regel: Kurzfristige verzinsliche Verbindlichkeiten umfassen z.B. Bankkontokorrente und kurzfristige Darlehen
  quelle: hwp-bur-2023__rz-0156-s192
  zitat: Für die kurzfristigen verzinslichen Verbindlichkeiten (beispielsweise Bankkontokorrente, kurzfristige Darlehen), welche separat auszuweisen sind
- regel: Innert eines Jahres fällige Amortisationsraten langfristiger Darlehen sind kurzfristig auszuweisen
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
- regel: 'Covenant-Verletzung: Umgliederung in kurzfristig, ausser schriftlicher Waiver der Bank vor Abschlusserstellung; Offenlegung als Ereignis nach Stichtag prüfen'
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: muss deshalb überprüft werden, ob die Covenants eingehalten sind
- regel: Hypotheken grundsätzlich langfristig; kurzfristig bei konkreter Kündigungsabsicht oder wahrscheinlicher Kündigung (z.B. Covenant-Verletzung)
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Ein Ausweis unter den kurzfristigen Verbindlichkeiten ist dann angezeigt, wenn eine konkrete kurzfristige Kündigungsabsicht durch den Schuldner oder die Schuldnerin besteht
- regel: Aufgelaufene Darlehens-/Hypothekarzinsen als antizipative Passiven abgrenzen
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: wie beispielsweise Darlehens- und Hypothekenzinsen
- regel: 'Fremdwährungsschulden: Bankschulden auf Sicht und übrige kurzfristige Verbindlichkeiten zum Stichtagskurs; Umgliederung kurzfristiger Anteil ist kein Realisationstatbestand'
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Die Umgliederung des kurzfristigen Anteils eines langfristigen Darlehens stellt jedoch keinen Realisationstatbestand dar.
- regel: 'Langfristige Fremdwährungsverpflichtungen: unrealisierte Kursverluste erfassen, unrealisierte Kursgewinne nicht'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- regel: Disagio (Auszahlung unter Rückzahlungsbetrag) als aktive Rechnungsabgrenzung über die Laufzeit auflösen
  quelle: hwp-bur-2023__rz-0487-s256
  zitat: unter den aktiven Rechnungsabgrenzungen zu erfassen und über die Laufzeit des Darlehens zulasten des Finanzaufwands aufzulösen
- regel: Passivdarlehen mit Rangrücktritt gesondert ausweisen, Nachrangigkeit erkennbar
  quelle: hwp-bur-2023__rz-0494-s257
  zitat: Passivdarlehen mit Rangrücktritt sind in der Jahresrechnung oder im Anhang gesondert auszuweisen
- regel: 'Bankschulden: kein gesetzlicher Separatausweis, aber verbreitete Praxis'
  quelle: hwp-bur-2023__rz-0492-s257
  zitat: es entspricht jedoch verbreiteter Schweizer Rechnungslegungspraxis, die Verbindlichkeiten gegenüber Banken gesondert auszuweisen
- regel: 'Verrechnungsverbot: keine Saldierung von Guthaben und Schulden bei verschiedenen Banken'
  quelle: hwp-bur-2023__rz-0066-s071
  zitat: Dies ist beispielsweise der Fall bei der Verrechnung von Bankguthaben und -schulden verschiedener Banken
- regel: 'Derivate ohne Absicherungszweck mit negativem Marktwert: Verbindlichkeit/Rückstellung'
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt werden
- regel: Gesamtbetrag der belasteten Aktiven im Anhang zu Buchwerten
  quelle: hwp-bur-2023__rz-0846-s349
  zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen Ansätzen wie in der Bilanz, also zu Buchwerten.
- regel: 'ESTV-Praxis: Darlehenszinsen von Beteiligten über steuerlich anerkannten Sätzen bzw. auf verdecktem Eigenkapital werden aufgerechnet (Steuerjahr beachten)'
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
fallstricke:
- text: 'Eingeschränkte Revision: Die Revisionsstelle holt keine Bankbestätigungen ein (L1-401 nur sinngemäss mit beim Unternehmen vorhandenen Unterlagen bzw. nur auf Anweisung des WP).'
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: Vom Unternehmen selbst eingeholte Bankbestätigungen dürfen als Prüfungsnachweis verwendet werden, auch wenn sie nicht direkt an die Revisionsstelle gingen.
  quelle: hwp-er-2026__rz-0137-s203
  zitat: kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise beiziehen, selbst wenn diese nicht direkt an ihn gesandt worden sind
- text: Befragung allein genügt bei wesentlichen Positionen nicht; Antworten mit analytischen Prüfungen oder Detailprüfungen (Verträge, Auszüge) erhärten.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Kurzfristiger Anteil langfristiger Darlehen (Amortisationen innert 12 Monaten) gehört in L1, nicht in die langfristigen verzinslichen Verbindlichkeiten.
  quelle: hwp-bur-2023__rz-0875-s356
  zitat: und demzufolge nicht mehr Bestandteil der langfristigen verzinslichen Verbindlichkeiten
- text: 'Darlehen mit unbestimmter Laufzeit und kurzer Kündigungsfrist: Ausweis nach voraussichtlicher Fälligkeit beurteilen (Kündigungsabsicht, Rangrücktritt/Stundung), nicht nach Kontobezeichnung.'
  quelle: or__art-959
  zitat: die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur Zahlung fällig werden
- text: Ein Rangrücktritt beseitigt die Überschuldung nicht, er dispensiert nur von der Benachrichtigung des Gerichts.
  quelle: hwp-er-2026__rz-0405-s122
  zitat: Ein Rangrücktritt dispensiert lediglich von der Überschuldungsanzeige an das Gericht.
- text: Zinsen müssen ausdrücklich vom Rangrücktritt erfasst sein; Tilgung oder Verrechnung subordinierter Forderungen (inkl. Zinsen) ist bis zur Beseitigung der Überschuldung unzulässig.
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
- text: Reduktion eines Rangrücktritts nur unter engen Voraussetzungen (geprüfter Zwischenabschluss SA-CH, schriftliche VR-Begründung, keine Benachteiligung anderer Rangrücktrittsgläubiger).
  quelle: hwp-er-2026__rz-0425-s126
  zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
- text: 'Tilgung subordinierter Forderungen trotz andauernder Überschuldung: Hinweis nach Art. 729c OR und Auswirkung auf Prüfungsaussage durch WP beurteilen.'
  quelle: hwp-er-2026__rz-0434-s128
  zitat: so sind ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen
- text: 'Steuerlich anerkannte Zinssätze gelten je Kalenderjahr: Für das Geschäftsjahr 2025 das ESTV-Rundschreiben 2025 verwenden (im Wiki nur 2026 vorhanden, Werte 2026 nicht auf 2025
    übertragen).'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: Waiver der Bank muss vor Erstellung des Abschlusses schriftlich vorliegen; ein später eingeholter Waiver verhindert die Umgliederung nicht.
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: wenn die kreditgebende Bank vor Erstellung des Abschlusses schriftlich bestätigt (sog. Waiver)
- text: 'Agentengrenze: Befragungen (1xx) kann der Agent nicht selbst führen (schriftliche Antwort auswerten oder Pendenz); Sonstige Prüfungshandlungen (4xx) nur auf Anweisung.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: 'WP-gekennzeichnete Schritte (L1-105, L1-304): ob der Agent sie vorbereitet, ist ein offener Entscheid; bis dahin nur Unterlagen zusammenstellen, keine Beurteilung.'
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
fragen_kunde:
- frage: 'Bestehen in Kredit- oder Darlehensverträgen Bestimmungen (Covenants wie Eigenfinanzierungsgrad, Verschuldungsfaktor, Informationspflichten), die per 31.12. oder seither nicht
    eingehalten sind? Falls ja: welche Massnahmen, liegt ein schriftlicher Waiver der Bank vor (Datum)?'
  zweck: L1-101 Covenants, Fälligkeit, Gliederung, Fortführung
- frage: Welche Sicherheiten haben Sie Kreditgebern bestellt (Grundpfand/Schuldbriefe, Verpfändung von Konten/Depots, Globalzession der Debitoren, Sicherungsübereignung, Eigentumsvorbehalt)
    und zu welchem Buchwert per 31.12.?
  zweck: L1-102 Sicherheiten, Anhang Art. 959c Abs. 2 Ziff. 9 OR
- frage: Welche verzinslichen Verbindlichkeiten oder Teilbeträge (Amortisationen, Festvorschüsse, gekündigte Kredite) werden innert zwölf Monaten nach dem 31.12. fällig, und welche sollen
    verlängert werden?
  zweck: L1-103 Gliederung kurz-/langfristig
- frage: Bestehen Darlehen oder Kontokorrente von Aktionären, Verwaltungsräten, Geschäftsleitung, diesen nahestehenden Personen oder Konzern-/Beteiligungsgesellschaften? Zu welchen Zinssätzen
    und Konditionen?
  zweck: L1-104 gesonderter Ausweis, Zinssätze (geldwerte Leistung)
- frage: Welche Rangrücktritte bestehen per 31.12. (Gläubiger, Betrag inkl. Zinsen, Datum)? Wurden im Geschäftsjahr oder seither Rangrücktritte neu erklärt, ersetzt, reduziert oder aufgehoben,
    oder subordinierte Forderungen bzw. Zinsen bezahlt oder verrechnet?
  zweck: L1-105 / L1-304 Rangrücktritte (WP-Schritte)
- frage: Gab es im Geschäftsjahr oder kurz nach dem Stichtag aussergewöhnliche Geldtransaktionen (grosse Bareinzahlungen, Zahlungen an/von Nahestehenden, kurzfristige Kreditrückführungen
    über den Stichtag, Überträge zwischen Banken)?
  zweck: L1-402 / L1-407 aussergewöhnliche Transaktionen, Stichtagsüberträge
- frage: Welche Kreditlimiten bestehen je Bank, wie stark sind sie beansprucht, gibt es Kündigungen oder Limitenreduktionen, und liegt eine Liquiditätsplanung für mindestens zwölf Monate
    vor?
  zweck: L1-406 Liquiditätsentwicklung, Kreditlimiten, Kündigungsfristen
- frage: Waren per 31.12. Devisentermingeschäfte, Währungs-/Zinsswaps oder Optionen offen? Zu welchem Zweck (Absicherung) und mit welcher Bankbewertung?
  zweck: L1-411 Bewertung offener Devisenkontrakte
