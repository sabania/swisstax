schritte:
- id: L1-101
  vorgehen: 'Agent befragt nicht selbst: schriftliche Antwort zu Covenants auswerten, sonst Pendenz. Covenant-Klauseln erheben, Kennzahlen nachrechnen. Waiver prüfen: schriftlich, vor
    Abschlusserstellung, Verzicht auf sofortige bzw. innert eines Jahres fällige Rückzahlung; Offenlegung als Ereignis nach Stichtag prüfen. Ob die Umgliederung entfällt, beurteilt der
    WP. Besprechung/Korrekturvorschlag als Pendenz an WP; keine Buchung; Visum offen.'
  nachweise:
  - Antwort Kundenbefragung
  - Kreditverträge mit Covenant-Klauseln
  - Covenant-Reporting an Bank
  - Waiver-Schreiben (Datum, Inhalt)
  - Jahresrechnung/Anhang
  rechnen: Covenant-Kennzahl gemäss Vertragsdefinition (z.B. Eigenfinanzierungsgrad = Eigenkapital / Bilanzsumme) vs. vertraglicher Schwellenwert
  feststellung_wenn: Covenant verletzt, Kredit langfristig ausgewiesen ohne schriftlichen Waiver vor Abschlusserstellung mit Rückzahlungsverzicht, Offenlegung fehlt, oder Kündigungsrisiko
    nicht in Fortführung einbezogen (an WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung, ob die Unternehmensleitung Bestimmungen von Darlehensverträgen (z. B. Kennzahlen in Kreditverträgen) nicht eingehalten hat
  - quelle: ser-2022__anh-d-s085-1
    zitat: wenn ja, Besprechung der Massnahmen der Unternehmensleitung und der allfällig erforderlichen Korrekturen in der Jahresrechnung
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: muss deshalb überprüft werden, ob die Covenants eingehalten sind
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: auf die sofortige bzw. innert eines Jahres fällige Rückzahlung verzichtet
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: Eine Offenlegung als Ereignis nach dem Bilanzstichtag ist zu prüfen.
  - quelle: or__art-959c-t2
    zitat: wesentliche Ereignisse nach dem Bilanzstichtag
  - quelle: ser-2022__anh-g-s139-1
    zitat: Verletzung von Kreditbedingungen (Covenants)
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: Unfähigkeit, die Bedingungen von Kreditvereinbarungen zu erfüllen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Visum offen lassen
- id: L1-102
  vorgehen: Schriftliche Antwort zu Sicherheiten zugunsten der Kreditgeber auswerten (Grundpfand, verpfändete Konten/Depots, Globalzession, Sicherungsübereignung), sonst Pendenz. Mit
    Kredit-, Pfand- und Zessionsverträgen sowie Bankunterlagen abgleichen; Buchwert der belasteten Aktiven per 31.12. ermitteln und mit dem Anhang vergleichen (L1-320).
  nachweise:
  - Antwort Kundenbefragung
  - Pfand-/Zessionsverträge
  - Kreditverträge
  - Bankunterlagen
  - Anhang
  rechnen: Gesamtbetrag belastete Aktiven = Summe Buchwerte der verpfändeten/abgetretenen Aktiven per 31.12. (z.B. Debitorenbestand bei Globalzession) vs. Anhangangabe
  feststellung_wenn: Sicherheit besteht per Stichtag, Gesamtbetrag der belasteten Aktiven fehlt im Anhang oder weicht wesentlich ab.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung über Sicherheiten zugunsten von Darlehensgebern
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: hwp-bur-2023__rz-0844-s348
    zitat: Entscheidend ist vielmehr, ob die vertraglich eingeräumten Pfand- oder Eigentumsrechte des Gläubigers oder der Gläubigerin an den Aktiven auf den Abschlussstichtag noch
  - quelle: hwp-bur-2023__rz-0846-s349
    zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen Ansätzen wie in der Bilanz, also zu Buchwerten.
- id: L1-103
  vorgehen: 'Schriftliche Antwort zu Fälligkeiten und Verlängerungsabsichten auswerten, sonst Pendenz. Je Kredit aus Verträgen/Bankunterlagen Fälligkeitsübersicht erstellen (Festvorschüsse,
    Amortisationen, Kündigungsfristen, Covenant-Folgen); innert 12 Monaten fällige Beträge mit Ausweis kurz-/langfristig und verzinslich/übrige vergleichen (Festhypotheken: Verlängerung
    beabsichtigt und wahrscheinlich?); Umgliederungsbedarf mit Konto und Betrag dokumentieren. Covid-19-Kredit: innert 12 Monaten fällige Amortisationen gemäss Amortisationsplan kurzfristig.'
  nachweise:
  - Antwort Kundenbefragung
  - Kredit-/Darlehensverträge
  - Bankunterlagen
  - Saldoliste
  - Bilanz
  - Amortisationsplan Covid-19-Kredit (falls vorhanden)
  rechnen: Kurzfristiger Anteil = Summe Fälligkeiten/Amortisationen 01.01.–31.12. Folgejahr je Kredit; Vergleich mit Ausweis kurzfristige vs. langfristige verzinsliche Verbindlichkeiten
  feststellung_wenn: Wesentliche innert 12 Monaten fällige Beträge langfristig ausgewiesen, oder verzinsliche Darlehen unter übrigen Verbindlichkeiten ohne Begründung.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zur Gliederung in langfristige und kurzfristige Darlehen
  - quelle: or__art-959
    zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
      Zahlung fällig werden.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
  - quelle: hwp-bur-2023__rz-0463-s253
    zitat: Im Folgejahr auslaufende Festhypotheken können weiterhin als langfristig bilanziert werden, soweit ihre Verlängerung beabsichtigt und wahrscheinlich ist.
  - quelle: hwp-bur-2023__rz-0489-s257
    zitat: Das Obligationenrecht verlangt eine separate Bilanzierung verzinslicher Verbindlichkeiten
  - quelle: covid-sbueg__art-3
    zitat: Die Kredite nach der Covid-19-SBüV sind innerhalb von acht Jahren vollständig zu amortisieren.
- id: L1-104
  vorgehen: 'Schriftliche Antwort zu Darlehen von Beteiligten, Organen und Nahestehenden auswerten, sonst Pendenz. Gläubiger mit Aktienbuch, Organen und Verträgen abgleichen; gesonderten
    Ausweis prüfen; Zinssätze der Darlehen von Beteiligten mit `wert estv_zins_2025_betriebskredit_bis_1mio` (zeigt auch ab 1 Mio.) bzw. bei Liegenschaftsfinanzierung `wert estv_zins_2025_liegenschaftskredit`
    vergleichen; für die Grenze CHF 1 Mio. die Kredite aller Beteiligten/Nahestehenden zusammenzählen; Sekundärquelle; Überschreitung nur als Hinweis an WP. Forderungen der Gesellschaft
    gegenüber Rangrücktrittsgläubigern (Verrechnungslage) als Hinweis an WP. Besteht ein Covid-19-Kredit: im Geschäftsjahr gewährte Darlehen an Aktionäre/Nahestehende bzw. zurückbezahlte
    Darlehen von Aktionären/Nahestehenden mit Datum und Betrag auflisten → Notiz an WP (Art. 2 Abs. 2 lit. b; Massnahmen nach Art. 23 nur durch den WP).'
  nachweise:
  - Antwort Kundenbefragung
  - Aktienbuch
  - Handelsregisterauszug/Organliste
  - Darlehensverträge Nahestehende
  - Verträge über Darlehen der Gesellschaft an Beteiligte/Organe
  - Anhang
  - '`wert estv_zins_2025` (Zinsen 2025)'
  - Covid-19-Kreditvereinbarung (falls vorhanden)
  rechnen: 'Zins je Darlehen = Saldo × Vertragszins × Tage/Zinsbasis; Vertragszins vs. steuerlich anerkannter Satz des Steuerjahres (2025: `wert estv_zins_2025_betriebskredit_bis_1mio`)'
  feststellung_wenn: Verbindlichkeiten ggü. Beteiligten/Organen/Nahestehenden nicht gesondert ausgewiesen, Zinssatz über steuerlich anerkanntem Satz, Gegenforderung ggü. Rangrücktrittsgläubiger,
    oder Darlehen an/von Aktionären/Nahestehenden während eines laufenden Covid-19-Kredits (Hinweis an WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zu Darlehen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
  - quelle: or__art-959a-t2
    zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
  - quelle: estv-zinsen-2026__s001-1
    zitat: Dasselbe gilt für übersetzte Zinsen, die auf Grund von Verpflichtungen gegenüber Beteiligten oder ihnen nahestehenden Dritten vergütet werden.
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
  - quelle: treuhand-almanach-2026__s065-1
    zitat: bis CHF 1 Mio. 3,50 %** 3,00 %**
  - quelle: covid-sbueg__art-2-t1
    zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
  - quelle: covid-sbueg__art-23
    zitat: eine Verletzung einer Vorgabe nach Artikel 2 Absätze 2–4 fest, so setzt sie ihr oder ihm eine angemessene Frist zur Herstellung des ordnungsgemässen Zustandes
- id: L1-105
  vorgehen: 'WP-Schritt, laut SER weiter gehend (bei Überschuldung angezeigt, Entscheid WP): Vorbereitung nur auf ausdrückliche Anweisung WP (offener Entscheid consis). Ohne Anweisung: kein
    Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt»; Hinweise (Überschuldung, Rangrücktritte gemäss Anhang) als Notiz «Schlussbesprechung»/«Pendenz». Nach Anweisung (Textfeld als
    «Vorbereitung für WP»): schriftliche Antwort zu bestehenden, neuen, ersetzten, reduzierten oder aufgehobenen Rangrücktritten auswerten, sonst Pendenz; Liste (Gläubiger, Konto, Betrag
    inkl. Zinsen, Datum) der Überschuldung gemäss Zwischenabschluss gegenüberstellen; Beurteilung WP. Die Deckungsrechnung Σ Rangrücktritte (je Gläubiger min(Betrag laut unterzeichneter
    Vereinbarung; bestehende Forderung inkl. aufgelaufener Zinsen laut Kontoblatt)) ↔ Überschuldung macht der Agent in P1-313 (`kapitalverlust … --rangruecktritt … [--covid-kredit …] [--rr-polster …]`); hier nur verweisen.'
  nachweise:
  - Antwort Kundenbefragung
  - Rangrücktrittsvereinbarungen
  - Saldoliste/Kontoblätter subordinierte Konten
  - Zwischenabschlüsse Art. 725b OR mit Prüfbericht
  - Jahresrechnung
  rechnen: Überschuldung gemäss (geprüftem) Zwischenabschluss zu Fortführungs- und ggf. Veräusserungswerten; Jahresrechnung 31.12. (Fremdkapital – Aktiven) nur als Indikator; Σ Rangrücktritte
    (Kapital + Zinsen) vs. Überschuldung; Bezugsgrösse bestimmt der WP; Überschuldung ohne Covid-19-Kredite nach Art. 3 Covid-19-SBüV herleiten (Art. 24; im Rechner Parameter
    `--covid-kredit <Betrag>`), Abzug offen ausweisen.
  feststellung_wenn: Kein schriftlicher Rangrücktritt trotz Überschuldung, Zinsen nicht erfasst, Σ Rangrücktritte unter Überschuldung, kein (geprüfter) Zwischenabschluss, oder Änderung/Tilgung
    im Jahr (an WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Befragung zu Rangrücktritten
  - quelle: ser-2022__anh-d-s085-1
    zitat: Weiter gehende Befragungen und analytische Prüfungshandlungen
  - quelle: or__art-725b-t1
    zitat: so erstellt der Verwaltungsrat unverzüglich je einen Zwischenabschluss zu Fortführungswerten und Veräusserungswerten
  - quelle: or__art-725b-t1
    zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
  - quelle: hwp-er-2026__rz-0420-s125
    zitat: Gemäss Art. 725b Abs. 4 OR hat der Rangrücktritt mindestens im Ausmass der Überschuldung zu erfolgen.
  - quelle: hwp-er-2026__rz-0423-s125-t2
    zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: covid-sbueg__art-24
    zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- id: L1-201
  vorgehen: Erwartungswert Zinsaufwand je Kredit aus Durchschnittssaldo (Anfangs-/Endsaldo bzw. Monatssalden) und Vertragszins ab Auszahlungsdatum berechnen; Summe mit Zinsaufwandkonten
    vergleichen; Abweichung über tolerierbarer Abweichung als Frage/Pendenz und Detailprüfung L1-302; L1-410 dem WP zur Anweisung vorschlagen. Berechnung im Rechenmodul, Ergebnis im
    Textfeld.
  nachweise:
  - Saldoliste/Kontoblätter Kredite
  - Kredit-/Darlehensverträge (Zinssätze)
  - Erfolgsrechnung Finanz-/Zinsaufwand
  - Bankzinsabrechnungen
  rechnen: 'Erwarteter Zins = Σ (Durchschnittssaldo × Zinssatz × Monate/12) je Kredit; Abweichung = gebuchter Zinsaufwand – Erwartungswert; Vergleich mit tolerierbarer Abweichung; Laufzeit
    nie im Kopf zählen, immer `rechne`. Frühere Grenze = Tag VOR Zinsbeginn bzw. letzter bezahlter Zinstermin, spätere Grenze = 31.12.: Auszahlung 01.02. → `rechne "saldo = 500000; satz =
    0.025; m = monate(31.12.2025, 31.01.2025); saldo * satz * m / 12"` (m = 11; falsch wäre monate(31.12.2025, 01.02.2025) = 10). monate() zählt nur ganze Monate: beginnt der Zinslauf nicht
    am Monatsersten, taggenau rechnen mit `tage(31.12.2025, <Tag vor Zinsbeginn>)` / 365 bzw. 30/360 `tage360(31.12.2025, <Tag vor Zinsbeginn>)` / 360 gemäss Vertrag; zählt der Vertrag den
    Auszahlungstag nicht mit, das Auszahlungsdatum selbst eingeben. Verwendete Zählweise im Textfeld nennen.'
  feststellung_wenn: Abweichung zwischen Erwartungswert und gebuchtem Zinsaufwand über der tolerierbaren Abweichung ohne plausible Erklärung.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Beurteilung, ob der Zinsaufwand im Verhältnis zu den Darlehenssalden plausibel erscheint
  - quelle: ser-2022__anh-d-s095-1
    zitat: Vergleich des Finanzaufwands und -ertrags mit den erwarteten Werten
  - quelle: hwp-er-2026__rz-0111-s199-t1
    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Gut automatisierbar über Kontenübersicht, Kennzahlen 1.2 und Rechenmodul
- id: L1-301
  vorgehen: Aufstellung der kurzfristigen verzinslichen Verbindlichkeiten (Gläubiger, Konto, Saldo) übernehmen oder aus Saldoliste erstellen; Summe mit Hauptbuch und Bilanz abstimmen;
    jeden Saldo mit Bank-/Kreditauszug bzw. Vertrag/Darlehensauszug per 31.12. abgleichen. Differenzen und fehlende Nachweise als Pendenz, Ergebnis im Textfeld.
  nachweise:
  - Aufstellung kurzfristige verzinsliche Verbindlichkeiten
  - Saldoliste
  - Hauptbuch-Kontoblätter
  - Bank-/Kreditauszüge 31.12.
  - Darlehensverträge
  rechnen: (1) `rechne "Diff = sum(<Salden aller Konten der Gruppe kurzfristige verzinsliche Verbindlichkeiten>) - <Bilanzposition>"`; (2) `rechne "Diff Aufstellung-HB = sum(<Beträge
    Aufstellung>) - sum(<Salden dieser Hauptbuchkonten>)"`; (3) je Konto `rechne "Diff <Konto> = <Saldo HB> - <Saldo Auszug 31.12.>"`. Eine Beschriftung mit Leerzeichen ist nur Text;
    Zwischenergebnisse mit Namen ohne Leerzeichen gelten in den folgenden Teilen desselben Aufrufs (`rechne "hb = sum(…); bilanz = …; hb - bilanz"`). 0 = abgestimmt; ≠ 0 → Pendenz; > NAG → Feststellung.
  feststellung_wenn: Differenz zwischen Aufstellung, Hauptbuch, Bilanz oder Auszug nicht geklärt, oder Bestandesnachweis fehlt.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Abstimmung einer Aufstellung der Verbindlichkeiten mit der Jahresrechnung
  - quelle: ser-2022__6-1-3
    zitat: Bestandsprüfungen sind möglich durch Abstimmung mit detaillierten Listen, Einsicht in Belege, Abstimmung mit Auszügen
  - quelle: hwp-er-2026__rz-0125-s202
    zitat: Unter dem Begriff Nachrechnen sind auch Abstimmungs- und Übertragungsprüfungen zu verstehen.
- id: L1-302
  vorgehen: 'Zinsabgrenzungsberechnung des Kunden einsehen (sonst Pendenz bzw. eigene Berechnung): aufgelaufener Zins vom letzten Zinstermin bis 31.12. je Kredit/Darlehen; mit gebuchter
    Abgrenzung bzw. Zinsverbindlichkeit vergleichen; Zinsbelastung im Folgejahr (Bankauszüge Januar) als Nachweis einsehen, fehlt sie: Pendenz. Bei Zinstermin 31.12. (Belastung per Stichtag)
    Nullabgrenzung begründen. Gegenbuchung der Zins-Abschlussbuchung im Kontoblatt Zinsaufwand nachsehen: aufgelaufener Zins gehört in die passive Rechnungsabgrenzung bzw. Zinsverbindlichkeit;
    wurde er dem Darlehenskonto gutgeschrieben (kapitalisiert), Vertrag prüfen (Kapitalisierung vereinbart?). Derselbe Betrag ergibt nur eine Feststellung (Ausweis), nicht zusätzlich
    «nicht abgegrenzt» (Praxis/intern).'
  nachweise:
  - Zinsabgrenzungsberechnung
  - Kredit-/Darlehensverträge (Zinssatz, Zinstermine)
  - Kontoblatt Abgrenzung/Zinsverbindlichkeit
  - Zinsbelastungen Folgejahr
  rechnen: Marchzins = Saldo × Zinssatz × Tage seit letztem Zinstermin / Zinsbasis (360 oder 365 gemäss Vertrag); Vergleich mit gebuchter Abgrenzung; Beispiel `rechne "saldo = 420000;
    satz = 0.0275; t = tage360(31.12.2025, 30.09.2025); saldo * satz * t / 360"`.
  feststellung_wenn: Aufgelaufene Zinsen nicht oder mit wesentlicher Differenz abgegrenzt.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in die Zinsabgrenzungsberechnung
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0257-s215
    zitat: 'Antizipative Passiven: Aufwand des alten Jahres, der erst im neuen Jahr bezahlt wird'
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.'
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: 'Qualitative Faktoren und besondere Umstände: Wenn erfasst, meldet der Agent auch kleinere Abweichungen.'
  notiz: 'Zins nicht erfasst (Marchzins fehlt) oder Differenz ≥ Nichtaufgriffsgrenze → «Wesentliche Feststellungen» mit Buchungsvorschlag Zinsaufwand an passive Rechnungsabgrenzung bzw.
    Zinsverbindlichkeit (ohne Verbuchung). Zins im Zinsaufwand erfasst, aber dem Darlehenskonto gutgeschrieben, ohne dass der Vertrag die Kapitalisierung vorsieht → nur «Wesentliche
    Feststellungen» mit Umgliederungsvorschlag Darlehen an passive Rechnungsabgrenzung bzw. Zinsverbindlichkeit (kein zusätzlicher Zinsaufwand; ab Nichtaufgriffsgrenze); Kapitalisierung
    vertraglich vereinbart → keine Feststellung. Differenz < Nichtaufgriffsgrenze → nur im Textfeld protokollieren (ausser qualitative Faktoren/besondere Umstände in 3.3 erfasst → Notiz auch
    darunter). Zinsabgrenzungsberechnung, Vertrag oder Zinsabrechnung nicht gefunden → «Pendenz» (Konto, Datum, Betrag, durchsuchte Ordner).'
- id: L1-303
  vorgehen: Kredit-, Rahmenkredit-, Festvorschuss-, Darlehens-, Pfand- und Zessionsverträge sowie Bankkorrespondenz (Geschäftsjahr und nach Stichtag) aus M-Files einsehen; Limiten, Zinssätze,
    Laufzeiten, Amortisationen, Kündigungen, Covenants, Sicherheiten und Waiver (Datum, Inhalt) in die Aufstellung übernehmen; mit Buchhaltung, Gliederung und Anhang abgleichen; nicht
    gebuchte Kredite identifizieren.
  nachweise:
  - Kredit- und Darlehensverträge
  - Pfand-/Zessionsverträge
  - Bankkorrespondenz
  - Aufstellung L1-301
  - Anhang
  rechnen: ''
  feststellung_wenn: Vertrag oder Korrespondenz zeigt Kredit, Sicherheit, Kündigung oder Covenant-Verletzung, die in Buchhaltung, Gliederung oder Anhang nicht berücksichtigt ist.
  fundstellen:
  - quelle: ser-2022__anh-d-s085-1
    zitat: Einsicht in Kredit- und Darlehensverträge
  - quelle: hwp-bur-2023__rz-0484-s256
    zitat: Insbesondere sollten bei allen längerfristigen Darlehensverhältnissen die wichtigsten Vertragspunkte im Interesse der Beweisbarkeit schriftlich festgehalten werden.
  - quelle: hwp-bur-2023__rz-0493-s257
    zitat: bei deren Verletzung die Verbindlichkeit sofort fällig gestellt werden kann
- id: L1-304
  vorgehen: 'WP-Schritt, laut SER weiter gehend: Vorbereitung nur auf ausdrückliche Anweisung WP (offener Entscheid consis); ohne Anweisung kein Eintrag im Textfeld, Status «nicht bearbeitet
    – WP-Schritt», Hinweise als Notiz. Nach Anweisung: Checkliste je Rangrücktritt: schriftlich, zweiseitig, Betrag inkl. Zinsen, Stundung, unbefristet, Aufhebung nur bei genügendem
    Ersatz oder SA-CH-geprüftem (Zwischen-)Abschluss, Tilgungs-/Verrechnungsverbot, keine Neuerung, Sicherheitspolster bei Fremdwährung, Bonität (Unterlagen). Saldo vs. Betrag, Ersatz/Reduktion,
    Soll-Buchungen, Gegenforderungen auflisten; Beurteilung durch WP.'
  nachweise:
  - Rangrücktrittsvereinbarungen (aktuell und ersetzt)
  - Kontoblätter subordinierte Darlehen/Zinsen
  - Zwischenabschlüsse Art. 725b OR mit Prüfbericht
  - Jahresrechnung/Anhang
  - VR-Unterlagen zu Änderungen (Begründung Reduktion)
  - Unterlagen zur Bonität der Gläubiger
  - Forderungen der Gesellschaft ggü. Rangrücktrittsgläubigern
  rechnen: Saldo je subordiniertes Konto (Kapital + Zinsen) vs. Rangrücktrittsbetrag; Σ Rangrücktritte vs. Überschuldung gemäss (geprüftem) Zwischenabschluss (Jahresrechnung nur Indikator,
    Bezugsgrösse bestimmt WP); Σ Soll-Buchungen (Tilgung/Verrechnung) im Jahr; Σ Forderungen der Gesellschaft ggü. Rangrücktrittsgläubigern; Überschuldung ohne Covid-19-Kredite nach
    Art. 3 Covid-19-SBüV herleiten (Art. 24; `kapitalverlust … --covid-kredit <Betrag>`), Abzug offen ausweisen.
  feststellung_wenn: Formmangel (Zinsen, Stundung, Befristung, Aufhebung ohne SA-CH-geprüften Abschluss), Reduktion ohne Voraussetzungen, Tilgung/Verrechnung, Gegenforderung ggü. Gläubiger,
    Deckungslücke (an WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s085-2
    zitat: Einsicht in Rangrücktrittsvereinbarungen
  - quelle: ser-2022__anh-d-s085-1
    zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
  - quelle: ser-2022__anh-h-s142-2
    zitat: ist ein zweiseitiges Rechtsgeschäft, das zwischen einem Gläubiger und einem Schuldner über eine bestehende Forderung abgeschlossen wird
  - quelle: or__art-725b-t1
    zitat: im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden
  - quelle: hwp-er-2026__rz-0412-s123
    zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
  - quelle: hwp-er-2026__rz-0415-s123-t1
    zitat: Der Rangrücktritt muss zeitlich unbefristet abgeschlossen werden
  - quelle: hwp-er-2026__rz-0415-s123-t1
    zitat: wenn er entweder durch einen anderen in Höhe und Ausgestaltung genügenden Rangrücktritt ersetzt wird
  - quelle: hwp-er-2026__rz-0415-s123-t1
    zitat: Schweizer Standards zur Abschlussprüfung (SA-CH) geprüften
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Ebenfalls auszuschliessen ist eine Neuerung des Darlehensvertrags
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: die Höhe des Rangrücktritts unter Berücksichtigung eines entsprechenden Sicherheitspolsters festzulegen
  - quelle: ser-2022__anh-h-s143-1
    zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
  - quelle: hwp-er-2026__rz-0420-s125
    zitat: Gemäss Art. 725b Abs. 4 OR hat der Rangrücktritt mindestens im Ausmass der Überschuldung zu erfolgen.
  - quelle: hwp-er-2026__rz-0423-s125-t2
    zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
  - quelle: hwp-er-2026__rz-0432-s127
    zitat: Die Revisionsstelle hat sich davon zu überzeugen, dass der Rangrücktritt in qualitativer und quantitativer Hinsicht ausreichend ist.
  - quelle: hwp-er-2026__rz-0432-s127
    zitat: Dies beinhaltet auch die Beurteilung der Bonität des Rangrücktrittgläubigers
  - quelle: hwp-er-2026__rz-0434-s128
    zitat: so sind ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
  - quelle: covid-sbueg__art-24
    zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- id: L1-320
  vorgehen: 'Anhang auf L1-bezogene Angaben prüfen: gesonderter Ausweis Nahestehende, Gesamtbetrag belastete Aktiven, Darlehen mit Rangrücktritt (gesondert, erkennbar), Ereignisse nach
    dem Stichtag (Kündigungen, Covenant-Verletzungen), Eventualverbindlichkeiten und Sicherheiten für Dritte gemäss Bankunterlagen (z.B. Garantien); Beträge mit L1-102, L1-104, L1-304
    abgleichen. Gesamtbeurteilung des Anhangs im Prüffeld Anhang (verweisen).'
  nachweise:
  - Anhang Jahresrechnung
  - Bankunterlagen (Garantien, Sicherheiten)
  - Prüfungsergebnisse L1-1xx bis L1-4xx
  rechnen: Anhangbeträge = Prüfungsergebnisse (belastete Aktiven, Verbindlichkeiten Nahestehende, Rangrücktrittsbeträge, Garantien/Eventualverbindlichkeiten)
  feststellung_wenn: Pflichtangabe nach Art. 959a Abs. 4 oder 959c OR fehlt (belastete Aktiven, Eventualverbindlichkeiten, Ereignisse nach Stichtag), Rangrücktrittsdarlehen nicht erkennbar
    oder Betrag weicht ab.
  fundstellen:
  - quelle: or__art-959c-t2
    zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: or__art-959c-t2
    zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
  - quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint
  - quelle: or__art-959c-t2
    zitat: wesentliche Ereignisse nach dem Bilanzstichtag
  - quelle: or__art-959a-t2
    zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
  - quelle: hwp-bur-2023__rz-0494-s257
    zitat: Passivdarlehen mit Rangrücktritt sind in der Jahresrechnung oder im Anhang gesondert auszuweisen
  - quelle: ser-2022__anh-d-s097-1
    zitat: Befragung über den Gesamtbetrag der zur Sicherung eigener Verpflichtungen verpfändeten oder abgetretenen Aktiven sowie der Aktiven unter Eigentumsvorbehalt
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung nach anderen wesentlichen positiven oder negativen Ereignissen nach dem Bilanzstichtag
- id: L1-322
  vorgehen: 'Dauerakte in M-Files mit mehrjährig gültigen Dokumenten ergänzen bzw. aktualisieren: Kredit-, Rahmenkredit- und Darlehensverträge, Pfand-/Zessionsverträge, Covenant-Bestimmungen,
    Rangrücktrittsvereinbarungen (aktuelle Fassung, ersetzte kennzeichnen). Fehlende Verträge als Pendenz; Änderungen im Textfeld vermerken.'
  nachweise:
  - Dauerakte M-Files
  - Verträge
  - Rangrücktrittsvereinbarungen
  rechnen: ''
  feststellung_wenn: Wesentlicher Kredit-, Sicherungs- oder Rangrücktrittsvertrag fehlt und ist beim Kunden nicht erhältlich (Pendenz).
  fundstellen:
  - quelle: hwp-er-2026__rz-0279-s247
    zitat: Neben den Jahresakten werden Dauerakten angelegt, die eine systematische Sammlung von Dokumenten umfassen, die über mehrere Jahre der Mandantenbeziehung Gültigkeit haben
  - quelle: hwp-bur-2023__rz-0484-s256
    zitat: Es ist zweckmässig, für jede langfristige Verbindlichkeit eine gesonderte Aufzeichnung mit den relevanten Eigenschaften und Bedingungen zu führen.
- id: L1-401
  vorgehen: 'Sonstige Prüfungshandlung, nur auf Anweisung. Keine Bankbestätigungen anfordern (laut SER nicht Bestandteil der eingeschränkten Revision). Vorhandene Bankbestätigungen:
    Konten, Kredite, Limiten, Sicherheiten, Garantien, Derivate mit Hauptbuch, Aufstellung und Anhang abgleichen; nicht gebuchte Positionen festhalten. Bei an die Revisionsstelle adressierten
    Bestätigungen Herkunft dokumentieren; über die Verwendung entscheidet der WP.'
  nachweise:
  - Beim Unternehmen vorhandene Bankbestätigungen 31.12. (Herkunft vermerkt)
  - Saldoliste/Hauptbuch
  - Aufstellung L1-301
  - Anhang
  rechnen: Saldo je Konto/Kredit gemäss Bestätigung = Hauptbuchsaldo 31.12. (Fremdwährung zum Bewertungskurs); Positionen in Bestätigung ohne Hauptbuchkonto = Vollständigkeitslücke
  feststellung_wenn: Bestätigung zeigt nicht gebuchtes Konto, Kredit, Sicherheit oder Verpflichtung, fehlt im Anhang, Saldodifferenz; Herkunft unklar oder Einholung durch Revisionsstelle
    geplant (an WP).
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen
  - quelle: ser-2022__anh-d-s074-2
    zitat: Einholen von Bestätigungen zu Salden und Wertschriftenbeständen von Banken oder anderen Dritten
  - quelle: ser-2022__1-5
    zitat: keine Inventurbeobachtung und Drittbestätigungsanfragen durchgeführt
  - quelle: hwp-er-2026__rz-0095-s196
    zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
  - quelle: hwp-er-2026__rz-0137-s203
    zitat: Es handelt sich um Dokumente, welche beim Prüfungskunden vorliegen und folglich der Abschlussprüfer für die eingeschränkte Revision verwenden kann.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: nur auf Anweisung, physische Tätigkeiten nie
- id: L1-402
  vorgehen: 'Sonstige Prüfungshandlung, nur auf Anweisung. Agent befragt nicht selbst: aus Geld- und Kreditkonten Kandidaten für aussergewöhnliche Transaktionen selektieren (hohe/runde
    Beträge, Nahestehende, Stichtagsnähe, ungewöhnliche Gegenkonten) und als schriftliche Frage/Pendenz stellen; Antworten auswerten und im Textfeld festhalten.'
  nachweise:
  - Kontoblätter Geld-/Kreditkonten
  - Bankauszüge
  - Antwort Kunde
  rechnen: 'Praxis ohne Fundstelle – Vorschlag gemäss offenem Entscheid; Vorgabe des WP pro Mandat geht vor: Buchungen ≥ Toleranzwesentlichkeit oder mit Merkmal ungewöhnlich (runde Beträge,
    Nahestehende, Stichtagsnähe gemäss WP-Vorgabe)'
  feststellung_wenn: Aussergewöhnliche Transaktion ohne plausible Erklärung oder mit Auswirkung auf Bestand/Vollständigkeit der Verbindlichkeiten.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Befragung zu aussergewöhnlichen Transaktionen
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: ungewöhnliche Posten (Vorzeichen, runde Beträge, Stichtagsnähe, nahestehende Personen)
  - quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: 'Zu bestätigen: Standardauswahl und wo der Wirtschaftsprüfer seine Vorgabe erfasst.'
- id: L1-403
  vorgehen: 'Sonstige Prüfungshandlung, nur auf Anweisung. Auswahl von Zu- und Abgängen auf Kreditkonten (Kreditaufnahmen, Rückzahlungen, Amortisationen, Zinsbelastungen; wesentlich,
    ungewöhnlich, stichtagsnah) mit Bankbeleg, Kreditanzeige bzw. Vertrag abgleichen: Betrag, Währung, Datum/Periode, Kontierung. Auswahl bewusst und begründet, keine repräsentative
    Stichprobe, keine Hochrechnung; Ergebnis im Textfeld.'
  nachweise:
  - Kontoblätter Kreditkonten
  - Bankauszüge/Kreditanzeigen
  - Verträge
  rechnen: Belegbetrag = Buchungsbetrag; Valuta-/Belegdatum innerhalb der Periode
  feststellung_wenn: Buchung ohne Beleg, Betrags- oder Periodendifferenz, falsche Kontierung (z.B. Amortisation als Zinsaufwand).
  fundstellen:
  - quelle: hwp-er-2026__rz-0115-s200
    zitat: Die Prüfung soll zeigen, ob die Grunderfassung dem Beleg entspricht
  - quelle: ser-2022__anh-d-s095-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und geeigneten Unterlagen
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- id: L1-404
  vorgehen: 'Sonstige Prüfungshandlung, nur auf Anweisung. Zu ausgewählten Zahlungen (Rückzahlungen, Zinsen, Gebühren, Zahlungen an Nahestehende) die Grundlage einsehen: Vertrag, Kündigung,
    Zinsabrechnung, VR-Beschluss; Grundsachverhalt und Periode beurteilen, Visierung nur für das Prüfungsziel Verpflichtungen (keine IKS-Prüfung). Zahlungen auf subordinierte Forderungen
    und Darlehen der Gesellschaft an Rangrücktrittsgläubiger kennzeichnen (an WP).'
  nachweise:
  - Zahlungsbelege
  - Verträge/Kündigungen
  - Zinsabrechnungen
  - VR-Protokolle
  - Rangrücktrittsvereinbarungen
  rechnen: ''
  feststellung_wenn: Zahlung ohne vertragliche Grundlage oder Genehmigung, falsche Periode, oder Tilgung/Zinszahlung auf subordinierte Forderung bzw. Darlehen an Rangrücktrittsgläubiger
    während Überschuldung (an WP) oder Zahlung an/von Nahestehenden während eines laufenden Covid-19-Kredits (an WP).
  fundstellen:
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: bei der eingeschränkten Revision sind keine IKS-Prüfungen durchzuführen
  - quelle: hwp-er-2026__rz-0116-s201
    zitat: Dennoch kann mit der Prüfung der Visierung ggf. das Prüfungsziel «Verpflichtungen» geprüft werden
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
  - quelle: covid-sbueg__art-2-t1
    zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
- id: L1-405
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Eröffnungssalden 01.01. mit Schlussbilanz Vorjahr (geprüfte Jahresrechnung) abstimmen; je Kredit Saldenentwicklung Anfang →
    Ende mit Zu-/Abgängen, Umbuchungen (z.B. Zinsverbindlichkeiten, Verrechnungen) und Kursdifferenzen herleiten; Schlusssaldo mit Bilanz abstimmen.
  nachweise:
  - Jahresrechnung Vorjahr
  - Saldoliste
  - Kontoblätter
  - Bank-/Kreditauszüge
  rechnen: Anfangssaldo + Zugänge – Abgänge ± Umbuchungen/Kursdifferenzen = Schlusssaldo je Konto; Anfangssaldo = Schlussbilanz Vorjahr
  feststellung_wenn: Eröffnungssaldo weicht von Vorjahresabschluss ab oder Saldenentwicklung nicht herleitbar.
  fundstellen:
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung des Vortrags der Vorjahresbestände auf neue Rechnung mit Unterlagen des Vorjahres
  - quelle: ser-2022__anh-d-s073-1
    zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
- id: L1-406
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Je Bank Limiten, Beanspruchung, Kündigungsfristen und Sicherheiten aus Verträgen/Auszügen tabellieren; Liquiditätsentwicklung
    aus Monatssalden, Liquiditätsplanung (mindestens 12 Monate) und Auszügen Folgejahr analysieren; Fälligkeiten ohne Anschlussfinanzierung, Covenant-Verletzungen, Limitenüberschreitungen
    und Cash Drain als Fortführungsindikatoren an WP melden; Sicherheiten mit Anhang abgleichen.
  nachweise:
  - Kredit-/Rahmenverträge
  - Bankauszüge inkl. Folgejahr
  - Liquiditätsplanung
  - Saldoliste
  - Anhang
  rechnen: Freie Limite = Kreditlimite – Beanspruchung je Bank; Liquiditätsgrad 2 = (flüssige Mittel + kurzfristige Forderungen) / kurzfristiges Fremdkapital; Monatsverlauf Nettoliquidität
  feststellung_wenn: Limite überschritten oder gekündigt, wesentliche Fälligkeit innert 12 Monaten ohne Anschlussfinanzierung, negative Liquiditätsentwicklung, oder Sicherheiten nicht
    im Anhang.
  fundstellen:
  - quelle: ser-2022__anh-g-s138-2
    zitat: naher Fälligkeitszeitpunkt für grössere Kredite bei noch ungelöster Folgefinanzierung
  - quelle: ser-2022__anh-g-s139-1
    zitat: Verletzung von Kreditbedingungen (Covenants)
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: Der Zeitpunkt der Fälligkeit von Verbindlichkeiten mit fester Laufzeit nähert sich
  - quelle: hwp-er-2026__rz-0191-s224
    zitat: Abfluss von Liquidität aus dem operativen Geschäft («Cash Drain»)
  - quelle: hwp-er-2026__rz-0031-s183
    zitat: Vergleiche wichtiger Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten im Umlaufvermögen, Eigenkapitalanteil etc.) sind in der Regel nützlich und effizient.
  - quelle: ser-2022__anh-d-s074-1
    zitat: Befragung über allfällige Verpfändungen und Verfügungsbeschränkungen
- id: L1-407
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Überträge zwischen Bank- und Kreditkonten rund um den 31.12. aus Kontoblättern und Auszügen (Dezember, Januar Folgejahr) listen;
    je Transfer prüfen, ob Belastung und Gutschrift in derselben Periode erfasst sind und ob eine Kreditrückführung über den Stichtag kurz danach wieder beansprucht wurde; Geld unterwegs
    klären.
  nachweise:
  - Kontoblätter Geld-/Kreditkonten
  - Bankauszüge Dezember und Januar Folgejahr
  rechnen: 'Je Transfer: Belastungsdatum Konto A und Gutschriftsdatum Konto B in gleicher Periode; Σ Transfers unterwegs = Abstimmdifferenz Bank/Buchhaltung'
  feststellung_wenn: Transfer nur einseitig im alten Jahr erfasst (Doppel- oder Nichterfassung) oder Kredit nur über den Stichtag zurückgeführt (Darstellung).
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Unterlagen im Bereich der flüssigen Mittel (Durchsicht der Geldkonten auf ungewöhnliche Buchungen)
  - quelle: hwp-bur-2023__rz-0004-s156
    zitat: Flüssige Mittel unterwegs (in Transit) sind in der Regel unter den flüssigen Mitteln zu erfassen.
- id: L1-408
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Kontoblätter der kurzfristigen verzinslichen Verbindlichkeiten, Zinsaufwand und Bankspesen kritisch durchsehen; grössere oder
    ungewöhnliche Buchungen (Sammelbuchungen, Umbuchungen, Gegenkonten ausserhalb Geld/Zins, Stichtagsbuchungen, Nahestehende) bewusst und begründet selektieren (keine repräsentative
    Stichprobe) und Hintergrund mit Belegen bzw. schriftlicher Antwort klären.
  nachweise:
  - Hauptbuch-Kontoblätter
  - Buchungsbelege
  - Antwort Kunde
  rechnen: 'Auswahl: Buchungen ≥ Toleranzwesentlichkeit oder ungewöhnlich; Abdeckungsgrad = Summe ausgewählter Buchungen / Kontobewegung (nur Dokumentation, keine Hochrechnung)'
  feststellung_wenn: Grössere oder ungewöhnliche Buchung ohne wirtschaftlich plausiblen Hintergrund oder mit falscher Kontierung/Periode.
  fundstellen:
  - quelle: hwp-er-2026__rz-0124-s202
    zitat: Hauptbuch und Buchungsjournale
  - quelle: ser-2022__anh-d-s074-1
    zitat: Durchsicht der Geldkonti auf ungewöhnliche Buchungen
  - quelle: ser-2022__6-1-3
    zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- id: L1-409
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Fremdwährungskredite/-konten identifizieren; angewandte Umrechnungskurse per 31.12. mit Jahresendkursen gemäss Bankauszug/Bankunterlagen
    vergleichen; Umrechnung nachrechnen; Erfassung der Kursdifferenzen (realisiert/unrealisiert nach Laufzeit bei Ersterfassung; Umgliederung kurzfristiger Anteil ohne Realisation) beurteilen.
  nachweise:
  - Bankauszüge/Bankunterlagen mit Kurs 31.12.
  - Saldoliste/Kontoblätter Fremdwährung
  rechnen: CHF-Wert = Fremdwährungssaldo × Stichtagskurs Bank; Differenz zum Buchwert
  feststellung_wenn: Wesentliche Abweichung von Kurs oder Umrechnung, oder unrealisierte Kursgewinne auf langfristigen Fremdwährungsverbindlichkeiten, auch auf dem kurzfristigen Anteil
    langfristiger Fremdwährungsdarlehen, erfasst.
  fundstellen:
  - quelle: ser-2022__anh-d-s074-1
    zitat: Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen gemäss Unterlagen von Banken usw.
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: Bankguthaben und -schulden auf Sicht und Aktiven mit Börsenkurs oder einem anderen beobachtbaren Marktpreis können uneingeschränkt zum Devisenkurs des Bilanzstichtags ausgewiesen
      werden
  - quelle: hwp-bur-2023__rz-0090-s077-t1
    zitat: Die Umgliederung des kurzfristigen Anteils eines langfristigen Darlehens stellt jedoch keinen Realisationstatbestand dar.
  - quelle: hwp-bur-2023__rz-0090-s077-t2
    zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- id: L1-410
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Zinsabrechnungen der Banken und Darlehensgeber mit den Buchungen abgleichen (Betrag, Periode, Konto Zinsaufwand statt Kapital/Bankspesen);
    Zinsen an Nahestehende und deren Verbuchung (Verbindlichkeit, Rangrücktritt) nachvollziehen; Zinsaufwand gesamt mit Abgrenzungen herleiten.
  nachweise:
  - Zinsabrechnungen/Bankauszüge
  - Kontoblätter Zinsaufwand und Zinsverbindlichkeiten
  - Zinsabgrenzung L1-302
  - Darlehensverträge
  rechnen: Σ Zinsabrechnungen der Periode + Abgrenzung Ende – Abgrenzung Anfang = Zinsaufwand gemäss Erfolgsrechnung
  feststellung_wenn: Zinsaufwand nicht aus Abrechnungen und Abgrenzungen herleitbar, falsche Periode oder Kontierung (z.B. Zins als Kapitalrückzahlung).
  fundstellen:
  - quelle: ser-2022__anh-d-s095-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen und geeigneten Unterlagen
  - quelle: or__art-958b
    zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
  - quelle: hwp-bur-2023__rz-0257-s215
    zitat: wie beispielsweise Darlehens- und Hypothekenzinsen
- id: L1-411
  vorgehen: Sonstige Prüfungshandlung, nur auf Anweisung. Aus schriftlicher Antwort und Bankunterlagen erheben, ob per 31.12. Devisentermingeschäfte/Swaps/Optionen offen sind; Kontraktliste
    (Nominal, Kurs, Fälligkeit, Absicherungszweck) und Bankbewertung per 31.12. einsehen; negativen Marktwert ohne Absicherungszweck mit gebuchter Verbindlichkeit/Rückstellung vergleichen;
    Anhangangaben prüfen.
  nachweise:
  - Kontraktliste/Bankbewertung Derivate 31.12.
  - Antwort Kunde
  - Kontoblätter
  - Anhang
  rechnen: Marktwert je Kontrakt gemäss Bankbewertung (bzw. Nominal × Differenz Terminkurs Stichtag – Kontraktkurs); Σ negative Marktwerte ohne Absicherungszweck vs. gebuchte Verbindlichkeit/Rückstellung
  feststellung_wenn: Offener Kontrakt mit wesentlichem negativem Marktwert ohne Absicherungszweck nicht erfasst, oder offene Kontrakte nicht bekannt/nicht offengelegt.
  fundstellen:
  - quelle: hwp-bur-2023__rz-0075-s176-t2
    zitat: Sofern der Marktwert eines derivativen Finanzinstruments ohne Absicherungszweck negativ ist, muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt
      werden.
  - quelle: hwp-bur-2023__rz-0064-s173
    zitat: Devisentermingeschäfte sind OTC-Geschäfte
  - quelle: ser-2022__anh-d-s097-2
    zitat: Befragung zu bedeutenden schwebenden Geschäften und anderen Ursachen, die vor dem Bilanzstichtag liegen und ein Verlust- oder Gewinnrisiko beinhalten
