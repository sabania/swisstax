  zitat: Verbindlichkeiten und Teilbeträge von Verbindlichkeiten, die voraussichtlich innerhalb von zwölf Monaten nach Bilanzstichtag zur Zahlung fällig werden, sind in der Bilanz als
    kurzfristig auszuweisen
- regel: Kurzfristige verzinsliche Verbindlichkeiten umfassen z.B. Bankkontokorrente und kurzfristige Darlehen
  quelle: hwp-bur-2023__rz-0156-s192
  zitat: Für die kurzfristigen verzinslichen Verbindlichkeiten (beispielsweise Bankkontokorrente, kurzfristige Darlehen), welche separat auszuweisen sind
- regel: Innert eines Jahres fällige Amortisationsraten langfristiger Darlehen sind kurzfristig auszuweisen
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Kurzfristige, innert eines Jahres fällige Amortisationsraten sind in den kurzfristigen Verbindlichkeiten auszuweisen.
- regel: Covid-19-Kredite innert acht Jahren amortisieren (Verlängerung höchstens auf zehn Jahre, Art. 3 Abs. 3); innert 12 Monaten fällige Raten gemäss Amortisationsplan kurzfristig
    ausweisen (hwp-bur-2023__rz-0463-s253, L1-103)
  quelle: covid-sbueg__art-3
  zitat: Die Kredite nach der Covid-19-SBüV sind innerhalb von acht Jahren vollständig zu amortisieren.
- regel: 'Covenant-Verletzung: Einhaltung bei Abschlusserstellung prüfen; sonst Umgliederung in kurzfristig'
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: muss deshalb überprüft werden, ob die Covenants eingehalten sind
- regel: 'Waiver: Umgliederung nur «allenfalls» vermeidbar, wenn die Bank vor Erstellung des Abschlusses schriftlich bestätigt; ob sie entfällt, beurteilt der WP'
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Die Umgliederung in die kurzfristigen verzinslichen Verbindlichkeiten kann allenfalls vermieden werden, wenn die kreditgebende Bank vor Erstellung des Abschlusses schriftlich
    bestätigt (sog. Waiver)
- regel: 'Inhalt des Waivers: Verzicht der Bank trotz Verletzung auf die sofortige bzw. innert eines Jahres fällige Rückzahlung'
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: auf die sofortige bzw. innert eines Jahres fällige Rückzahlung verzichtet
- regel: 'Covenant-Verletzung: Offenlegung als Ereignis nach dem Bilanzstichtag prüfen (Art. 959c Abs. 2 Ziff. 13 OR)'
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: Eine Offenlegung als Ereignis nach dem Bilanzstichtag ist zu prüfen.
- regel: Hypotheken grundsätzlich langfristig; kurzfristig bei konkreter Kündigungsabsicht oder wahrscheinlicher Kündigung (z.B. Covenant-Verletzung)
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Ein Ausweis unter den kurzfristigen Verbindlichkeiten ist dann angezeigt, wenn eine konkrete kurzfristige Kündigungsabsicht durch den Schuldner oder die Schuldnerin besteht
- regel: Im Folgejahr auslaufende Festhypotheken dürfen langfristig bleiben, soweit Verlängerung beabsichtigt und wahrscheinlich
  quelle: hwp-bur-2023__rz-0463-s253
  zitat: Im Folgejahr auslaufende Festhypotheken können weiterhin als langfristig bilanziert werden, soweit ihre Verlängerung beabsichtigt und wahrscheinlich ist.
- regel: Aufgelaufene Darlehens-/Hypothekarzinsen als antizipative Passiven abgrenzen
  quelle: hwp-bur-2023__rz-0257-s215
  zitat: wie beispielsweise Darlehens- und Hypothekenzinsen
- regel: 'Fremdwährungsschulden: Bankschulden auf Sicht und übrige kurzfristige Verbindlichkeiten zum Stichtagskurs; Umgliederung des kurzfristigen Anteils ist kein Realisationstatbestand'
  quelle: hwp-bur-2023__rz-0090-s077-t1
  zitat: Die Umgliederung des kurzfristigen Anteils eines langfristigen Darlehens stellt jedoch keinen Realisationstatbestand dar.
- regel: 'Langfristige Fremdwährungsverpflichtungen: unrealisierte Kursverluste erfassen, unrealisierte Kursgewinne nicht'
  quelle: hwp-bur-2023__rz-0090-s077-t2
  zitat: unrealisierte Kursgewinne dürfen in der Erfolgsrechnung nicht ausgewiesen werden
- regel: Disagio (Auszahlung unter Rückzahlungsbetrag) als aktive Rechnungsabgrenzung über die Laufzeit auflösen
  quelle: hwp-bur-2023__rz-0487-s256
  zitat: unter den aktiven Rechnungsabgrenzungen zu erfassen und über die Laufzeit des Darlehens zulasten des Finanzaufwands aufzulösen
- regel: Passivdarlehen mit Rangrücktritt gesondert ausweisen, Nachrangigkeit erkennbar
  quelle: hwp-bur-2023__rz-0494-s257
  zitat: Passivdarlehen mit Rangrücktritt sind in der Jahresrechnung oder im Anhang gesondert auszuweisen
- regel: Rangrücktritt mindestens im Ausmass der Überschuldung; bei Zwischenabschlüssen zu Fortführungs- und Veräusserungswerten ist die Bezugsgrösse zu beurteilen (WP)
  quelle: hwp-er-2026__rz-0420-s125
  zitat: Gemäss Art. 725b Abs. 4 OR hat der Rangrücktritt mindestens im Ausmass der Überschuldung zu erfolgen.
- regel: 'Bankschulden: kein gesetzlicher Separatausweis, aber verbreitete Praxis'
  quelle: hwp-bur-2023__rz-0492-s257
  zitat: es entspricht jedoch verbreiteter Schweizer Rechnungslegungspraxis, die Verbindlichkeiten gegenüber Banken gesondert auszuweisen
- regel: 'Verrechnungsverbot: keine Saldierung von Guthaben und Schulden bei verschiedenen Banken'
  quelle: hwp-bur-2023__rz-0066-s071
  zitat: Dies ist beispielsweise der Fall bei der Verrechnung von Bankguthaben und -schulden verschiedener Banken
- regel: 'Derivate ohne Absicherungszweck mit negativem Marktwert: Verbindlichkeit/Rückstellung'
  quelle: hwp-bur-2023__rz-0075-s176-t2
  zitat: muss eine Verbindlichkeit/Rückstellung in Höhe des negativen Marktwerts angesetzt werden
- regel: Gesamtbetrag der belasteten Aktiven im Anhang zu Buchwerten
  quelle: hwp-bur-2023__rz-0846-s349
  zitat: Die Angabe des Betrags der belasteten Aktiven im Anhang erfolgt zu den gleichen Ansätzen wie in der Bilanz, also zu Buchwerten.
fallstricke:
- text: 'Eingeschränkte Revision: Die Revisionsstelle holt keine Bankbestätigungen ein (L1-401 nur mit beim Unternehmen vorhandenen Unterlagen bzw. nur auf Anweisung des WP).'
  quelle: hwp-er-2026__rz-0095-s196
  zitat: Die Einholung von Bankbestätigungen wie auch weiteren externen Bestätigungen ist bei der eingeschränkten Revision nicht vorgesehen
- text: 'Bestätigungen Dritter (Bank, Lieferant): verwendbar sind Bestätigungen, die das Unternehmen von sich aus bei der Abschlusserstellung eingeholt hat. An die Revisionsstelle adressiert
    oder «auf Ersuchen des Kunden»: Herkunft (wer hat angefragt, wann, Adressat) festhalten (Textfeld bzw. bei 4xx ohne Anweisung Notiz), Pendenz an WP – Verwendung entscheidet WP. Nie
    selbst anfordern. Praxis/intern: Inhalt trotzdem lesen; Abweichungen zu Hauptbuch/Aufstellung/Anhang immer als Hinweis-Notiz an WP, auch ohne Anweisung für 4xx (neue Information
    für die Risikobeurteilung, hwp-er-2026__rz-0269-s245).'
  quelle: hwp-er-2026__rz-0137-s203
  zitat: Für den Fall, dass das Unternehmen von sich aus Bestätigungen von Dritten bei der Abschlusserstellung eingeholt hat
- text: Befragung allein genügt bei wesentlichen Positionen nicht; Antworten mit analytischen Prüfungen oder Detailprüfungen (Verträge, Auszüge) erhärten.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: 'Keine repräsentativen Stichproben und keine Hochrechnung: Auswahl in L1-403/L1-408 bewusst und begründet (Toleranzwesentlichkeit, Risiko, Vorgabe WP).'
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: Kurzfristiger Anteil langfristiger Darlehen (Amortisationen innert 12 Monaten) gehört in L1, nicht in die langfristigen verzinslichen Verbindlichkeiten.
  quelle: hwp-bur-2023__rz-0875-s356
  zitat: und demzufolge nicht mehr Bestandteil der langfristigen verzinslichen Verbindlichkeiten
- text: 'Darlehen mit unbestimmter Laufzeit und kurzer Kündigungsfrist: Ausweis nach voraussichtlicher Fälligkeit beurteilen (Kündigungsabsicht, Rangrücktritt/Stundung), nicht nach Kontobezeichnung.'
  quelle: or__art-959
  zitat: die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur Zahlung fällig werden
- text: 'Waiver vermeidet die Umgliederung nur «allenfalls»: Er muss schriftlich und vor Erstellung des Abschlusses vorliegen und den Verzicht der Bank auf die sofortige bzw. innert
    eines Jahres fällige Rückzahlung enthalten; ob die Umgliederung entfällt, beurteilt der WP.'
  quelle: hwp-bur-2023__rz-0493-s257
  zitat: auf die sofortige bzw. innert eines Jahres fällige Rückzahlung verzichtet
- text: Befragung zu Rangrücktritten und Einsicht in Rangrücktrittsvereinbarungen sind laut SER weiter gehende Prüfungshandlungen (bei vermuteten wesentlichen Fehlaussagen oder erhöhtem
    inhärentem Risiko); bei Überschuldung angezeigt, Entscheid WP.
  quelle: ser-2022__anh-d-s085-1
  zitat: erhöhtes inhärentes Risiko für eine Fehlaussage in einer Position der Jahresrechnung besteht
- text: Ein Rangrücktritt beseitigt die Überschuldung nicht, er dispensiert nur von der Benachrichtigung des Gerichts.
  quelle: hwp-er-2026__rz-0405-s122
  zitat: Ein Rangrücktritt dispensiert lediglich von der Überschuldungsanzeige an das Gericht.
- text: Rangrücktritte machen den Zwischenabschluss nach Art. 725b OR grundsätzlich nicht entbehrlich; ein Verzicht ist Einzelfallentscheid (WP).
  quelle: hwp-er-2026__rz-0423-s125-t2
  zitat: Art. 725 b OR sieht keine solche Erleichterung vor.
- text: 'Überschuldung nicht allein aus der Jahresrechnung (Fremdkapital – Aktiven) ableiten: massgebend sind die (geprüften) Zwischenabschlüsse; ob Fortführungs- oder Veräusserungswerte
    die Bezugsgrösse sind, beurteilt der WP.'
  quelle: hwp-er-2026__rz-0420-s125
  zitat: sollte ein Rangrücktritt, der «nur» auf die Deckungslücke zu Fortführungswerten ausgerichtet ist, genügen
- text: Zinsen müssen ausdrücklich vom Rangrücktritt erfasst sein; Tilgung oder Verrechnung subordinierter Forderungen (inkl. Zinsen) ist bis zur Beseitigung der Überschuldung unzulässig
    – auch Forderungen der Gesellschaft gegenüber dem Gläubiger (z.B. Darlehen an Aktionäre) beachten.
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
- text: Aufhebung nur bei Ersatz durch einen genügenden Rangrücktritt oder wenn ein nach SA-CH geprüfter (Zwischen-)Abschluss die Deckung aller Verbindlichkeiten zeigt; Klauseln wie
    «gemäss geprüfter Bilanz» ohne SA-CH-Bezug dem WP vorlegen.
  quelle: hwp-er-2026__rz-0415-s123-t1
  zitat: Schweizer Standards zur Abschlussprüfung (SA-CH) geprüften
- text: 'Keine Neuerung des Darlehensvertrags: mit der ursprünglichen Forderung gehen die Einreden, namentlich die Stundungseinrede, unter.'
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: Ebenfalls auszuschliessen ist eine Neuerung des Darlehensvertrags
- text: 'Rangrücktritt auf Fremdwährungsforderung: Kursrückgang kann tilgend wirken; Sicherheitspolster in der Höhe vorsehen.'
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: die Höhe des Rangrücktritts unter Berücksichtigung eines entsprechenden Sicherheitspolsters festzulegen
- text: 'Bonität des Gläubigers: Kann er einen Ausfall nicht verkraften, ist die Gültigkeit des Rangrücktritts zweifelhaft (Beurteilung WP).'
  quelle: ser-2022__anh-h-s143-1
  zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
- text: 'Reduktion eines Rangrücktritts grundsätzlich unzulässig; Ausnahme nur kumulativ: (a) SA-CH-geprüfter (Zwischen-)Abschluss zeigt, dass die Überschuldung mindestens im entsprechenden
    Umfang gesunken ist, (b) VR legt schriftlich und begründet dar, dass in den nächsten zwölf Monaten keine weiteren Verluste absehbar sind, (c) keine Benachteiligung anderer Rangrücktrittsgläubiger.'
  quelle: hwp-er-2026__rz-0425-s126
  zitat: dass sich auch die Überschuldung mindestens im entsprechenden Umfang reduziert hat
- text: Bei einer Reduktion ohne schriftliche, begründete VR-Darlegung zu den nächsten zwölf Monaten ist Voraussetzung (b) nicht belegt (an WP).
  quelle: hwp-er-2026__rz-0425-s126
  zitat: dass während der nächsten zwölf Monate keine weiteren Verluste absehbar sind
- text: 'Tilgung subordinierter Forderungen trotz andauernder Überschuldung: Hinweis nach Art. 729c OR und Auswirkung auf Prüfungsaussage durch WP beurteilen; deckt der reduzierte Rangrücktritt
    die Überschuldung nicht mehr, lebt die Anzeigepflicht wieder auf.'
  quelle: hwp-er-2026__rz-0434-s128
  zitat: so sind ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen
- text: 'Steuerlich anerkannte Zinssätze gelten je Kalenderjahr: für Zinsen 2025 `wert estv_zins_2025` (Sekundärquelle Treuhand-Almanach; ESTV-Rundschreiben 2025 nicht im Wiki, Status
    ☑️ nennen); Werte 2026 nicht übertragen; nur Hinweis an WP (Steuerpraxis, keine handelsrechtliche Regel).'
  quelle: estv-zinsen-2026__s001-2
  zitat: seit dem 1. Januar 2026 auf die folgenden Zinssätze ab
- text: 'Steuerlich, nicht handelsrechtlich: Schuldzinsen auf verdecktem Eigenkapital (z.B. Aktionärsdarlehen) gehören zum steuerbaren Gewinn (Art. 65 DBG; Aufrechnung/Ermittlung: KS
    6a, estv-ks-6a-2024__3-1) – keine Bewertungsregel der Jahresrechnung, nur Hinweis an WP.'
  quelle: dbg__art-65
  zitat: Zum steuerbaren Gewinn der Kapitalgesellschaften und Genossenschaften gehören auch die Schuldzinsen, die auf jenen Teil des Fremdkapitals entfallen, dem wirtschaftlich die Bedeutung
    von Eigenkapital zukommt.
- text: 'Agentengrenze: Befragungen (1xx) kann der Agent nicht selbst führen (schriftliche Antwort auswerten oder Pendenz, höchstens «teilweise bearbeitet»); Sonstige Prüfungshandlungen
    (4xx) nur auf Anweisung; keine Buchung, Visum offen.'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: nur auf Anweisung, physische Tätigkeiten nie
- text: 'WP-gekennzeichnete Schritte (L1-105, L1-304): ob der Agent sie vorbereitet, ist ein offener Entscheid; bis dahin nur auf ausdrückliche Anweisung des WP vorbereiten, sonst kein
    Eintrag im Textfeld, Status «nicht bearbeitet – WP-Schritt», Hinweise als Notiz; Beurteilung immer WP.'
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: 'Zinsen zeitanteilig: Monate bzw. Tage ab Auszahlung, Amortisation oder letztem Zinstermin immer mit `rechne` bestimmen (`monate(…)`, `tage(…)`, `tage360(…)`), nie im Kopf zählen;
    frühere Grenze = Tag vor Zinsbeginn bzw. letzter bezahlter Zinstermin (Auszahlung 01.02. → monate(31.12.2025, 31.01.2025) = 11, nicht monate(31.12.2025, 01.02.2025) = 10); monate() zählt
    nur ganze Monate – beginnt der Zinslauf im Laufe eines Monats, tage()/365 bzw. tage360()/360 gemäss Vertrag verwenden; Praxis/intern: Kontonummern (z.B. 4-stellig) in Saldoliste und
    Kontoblatt nie als Betrag lesen (L1-201, L1-302).'
  quelle: hwp-bur-2023__rz-0048-s066
  zitat: Der Grundsatz der zeitlichen Abgrenzung verlangt, dass Aufwand und Ertrag, die zeitraumbezogen anfallen (z.B. Zinsen, Miete), auch entsprechend abgegrenzt und erfasst werden.
fragen_kunde:
- frage: 'Bestehen in Kredit- oder Darlehensverträgen Bestimmungen (Covenants wie Eigenfinanzierungsgrad, Verschuldungsfaktor, Informationspflichten), die per 31.12. oder seither nicht
    eingehalten sind? Falls ja: welche Massnahmen, und liegt ein schriftlicher Waiver der Bank vor (Datum; Verzicht auf die sofortige bzw. innert eines Jahres fällige Rückzahlung)?'
  zweck: L1-101 Covenants, Fälligkeit, Gliederung, Fortführung
- frage: Welche Sicherheiten haben Sie Kreditgebern bestellt (Grundpfand/Schuldbriefe, Verpfändung von Konten/Depots, Globalzession der Debitoren, Sicherungsübereignung, Eigentumsvorbehalt)
    und zu welchem Buchwert per 31.12.? Bestehen Sicherheiten oder Garantien für Verbindlichkeiten Dritter?
  zweck: L1-102 Sicherheiten, L1-320 Anhang Art. 959c Abs. 2 Ziff. 8–10 OR
- frage: Welche verzinslichen Verbindlichkeiten oder Teilbeträge (Amortisationen, Festvorschüsse, Festhypotheken, gekündigte Kredite) werden innert zwölf Monaten nach dem 31.12. fällig,
    und welche sollen verlängert werden?
  zweck: L1-103 Gliederung kurz-/langfristig
- frage: Bestehen Darlehen oder Kontokorrente von Aktionären, Verwaltungsräten, Geschäftsleitung, diesen nahestehenden Personen oder Konzern-/Beteiligungsgesellschaften? Zu welchen Zinssätzen
    und Konditionen?
  zweck: L1-104 gesonderter Ausweis, Zinssätze (geldwerte Leistung)
- frage: Welche Rangrücktritte bestehen per 31.12. (Gläubiger, Betrag inkl. Zinsen, Datum)? Wurden im Geschäftsjahr oder seither Rangrücktritte neu erklärt, ersetzt, reduziert oder aufgehoben,
    oder subordinierte Forderungen bzw. Zinsen bezahlt oder verrechnet? Liegen Zwischenabschlüsse nach Art. 725b OR vor, und wurden sie geprüft?
  zweck: L1-105 / L1-304 Rangrücktritte, massgebende Überschuldung (WP-Schritte)
- frage: Bestehen Forderungen der Gesellschaft (Darlehen, Kontokorrente) gegenüber Gläubigern mit Rangrücktritt? Wurden solche Forderungen mit subordinierten Forderungen verrechnet oder
    ist eine Verrechnung vorgesehen?
  zweck: L1-104 / L1-304 / L1-404 Verrechnungslage, Tilgungsverbot (Hinweis an WP)
- frage: Wie ist die finanzielle Lage der Rangrücktrittsgläubiger (wäre ein Ausfall der Forderung für sie tragbar)? Welche Unterlagen liegen dazu vor?
  zweck: L1-304 Bonität der Rangrücktrittsgläubiger (Beurteilung WP)
- frage: Gab es im Geschäftsjahr oder kurz nach dem Stichtag aussergewöhnliche Geldtransaktionen (grosse Bareinzahlungen, Zahlungen an/von Nahestehenden, kurzfristige Kreditrückführungen
    über den Stichtag, Überträge zwischen Banken)?
  zweck: L1-402 / L1-407 aussergewöhnliche Transaktionen, Stichtagsüberträge
- frage: Welche Kreditlimiten bestehen je Bank, wie stark sind sie beansprucht, gibt es Kündigungen oder Limitenreduktionen, und liegt eine Liquiditätsplanung für mindestens zwölf Monate
    vor?
  zweck: L1-406 Liquiditätsentwicklung, Kreditlimiten, Kündigungsfristen
- frage: Waren per 31.12. Devisentermingeschäfte, Währungs-/Zinsswaps oder Optionen offen? Zu welchem Zweck (Absicherung) und mit welcher Bankbewertung?
  zweck: L1-411 Bewertung offener Devisenkontrakte
- frage: Besteht ein Covid-19-Kredit (Art. 3 oder Art. 4 Covid-19-SBüV; Saldo 31.12., Amortisationsplan, Zinssatz)? Wurden seit der Auszahlung Dividenden/Tantiemen ausgeschüttet, Kapitaleinlagen
    zurückerstattet, Darlehen an Aktionäre/Nahestehende gewährt, Darlehen von Aktionären/Nahestehenden zurückbezahlt oder bestehende Kredite mit Covid-Mitteln abgelöst?
  zweck: L1-103/L1-104/L1-404, Art. 2 Abs. 2/3 Covid-19-SBüG (Hinweis an WP)
