kurzbeschrieb: 'Kurzfristige verzinsliche Verbindlichkeiten (Art. 959a Abs. 2 Ziff. 1 lit. b OR): Bankkontokorrente, Festvorschüsse, kurzfristige Darlehen, fällige Amortisationen. ER:
  Bestand, Gliederung, Covenants, Zinsen/Abgrenzung, Sicherheiten, Nahestehende, Anhang; Rangrücktritte L1-105/L1-304 (WP).'
gesetz:
- thema: 'Mindestgliederung: kurzfristige verzinsliche Verbindlichkeiten als eigene Position des kurzfristigen Fremdkapitals (Art. 959a Abs. 2 Ziff. 1 lit. b OR)'
  quelle: or__art-959a-t1
  zitat: b. kurzfristige verzinsliche Verbindlichkeiten
- thema: Abgrenzung kurzfristig/langfristig nach voraussichtlicher Fälligkeit innert eines Jahres (Art. 959 Abs. 6 OR)
  quelle: or__art-959
  zitat: Als kurzfristig müssen die Verbindlichkeiten bilanziert werden, die voraussichtlich innerhalb eines Jahres ab Bilanzstichtag oder innerhalb des normalen Geschäftszyklus zur
    Zahlung fällig werden.
- thema: Gesonderter Ausweis von Verbindlichkeiten gegenüber Beteiligten, Organen und Beteiligungsunternehmen (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
- thema: Bewertung von Verbindlichkeiten zum Nennwert (Art. 960e Abs. 1 OR)
  quelle: or__art-960e
  zitat: Verbindlichkeiten müssen zum Nennwert eingesetzt werden.
- thema: Periodenabgrenzung von Aufwand, z.B. Zinsen (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: 'Erleichterung: Verzicht auf zeitliche Abgrenzung, wenn die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten (Art. 958b
    Abs. 2 OR)'
  quelle: or__art-958b
  zitat: Sofern die Nettoerlöse aus Lieferungen und Leistungen oder die Finanzerträge 100 000 Franken nicht überschreiten
- thema: 'Anhang: Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven (Art. 959c Abs. 2 Ziff. 9 OR)'
  quelle: or__art-959c-t2
  zitat: je der Gesamtbetrag der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven sowie der Aktiven unter Eigentumsvorbehalt
- thema: 'Anhang: Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten (Art. 959c Abs. 2 Ziff. 8 OR)'
  quelle: or__art-959c-t2
  zitat: der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten
- thema: 'Anhang: Eventualverbindlichkeiten (Art. 959c Abs. 2 Ziff. 10 OR); Einordnung von Bankgarantien im Auftrag des Unternehmens beurteilt der WP, Gesamtbeurteilung im Prüffeld Anhang'
  quelle: or__art-959c-t2
  zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint
- thema: 'Anhang: wesentliche Ereignisse nach dem Bilanzstichtag, z.B. Kündigung, Covenant-Verletzung (Art. 959c Abs. 2 Ziff. 13 OR)'
  quelle: or__art-959c-t2
  zitat: wesentliche Ereignisse nach dem Bilanzstichtag
- thema: 'Rechnungslegung in Fremdwährung (Art. 958d Abs. 3 OR): Werte zusätzlich in Landeswährung, Umrechnungskurse im Anhang – nur bei Rechnungslegung in einer Fremdwährung; für Fremdwährungskredite
    in einer CHF-Jahresrechnung nicht einschlägig (Bewertung dazu: hwp-bur-2023__rz-0090-s077-t1/-t2)'
  quelle: or__art-958d
  zitat: Wird nicht die Landeswährung verwendet, so müssen die Werte zusätzlich in der Landeswährung angegeben werden. Die verwendeten Umrechnungskurse sind im Anhang offenzulegen
- thema: 'Begründete Besorgnis der Überschuldung: Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten durch den VR, Prüfung durch die Revisionsstelle (Art. 725b Abs. 1 und 2
    OR)'
  quelle: or__art-725b-t1
  zitat: so erstellt der Verwaltungsrat unverzüglich je einen Zwischenabschluss zu Fortführungswerten und Veräusserungswerten
- thema: 'Rangrücktritt im Ausmass der Überschuldung: Rücktritt hinter alle anderen Gläubiger und Stundung (Art. 725b Abs. 4 Ziff. 1 OR)'
  quelle: or__art-725b-t1
  zitat: im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden
- thema: Rangrücktritt muss geschuldeten Betrag und Zinsen umfassen (Art. 725b Abs. 4 Ziff. 1 OR)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: Anzeige durch die Revisionsstelle bei offensichtlicher Überschuldung, wenn der VR sie unterlässt (Art. 729c OR) – nur Hinweis an WP, keine Handlung des Agenten
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: Covid-19-Kredite nach Art. 3 Covid-19-SBüV zählen bei Art. 725a Abs. 1 und Art. 725b Abs. 1 OR nicht als Fremdkapital (Art. 24 Covid-19-SBüG; gilt bis 31.12.2032, Art. 31).
    Nur Kredite nach Art. 3 SBüV (nicht Art. 4); Härtefall-Darlehen Art. 21 HFMV 20 gleich behandelt (hwp-er-2026__rz-0373-s113). Abzug offen ausweisen, Würdigung WP.
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
- thema: 'Während der Solidarbürgschaft ausgeschlossen: Dividenden/Tantiemen, Rückerstattung von Kapitaleinlagen (lit. a), Gewährung von Darlehen an bzw. Rückzahlung von Darlehen von
    Gesellschaftern/Nahestehenden (lit. b; Ausnahme: vorbestehende Verpflichtungen gegenüber CH-Gruppengesellschaften – Beurteilung WP); keine Umschuldung vorbestehender Kredite mit
    Covid-Mitteln (Abs. 3)'
  quelle: covid-sbueg__art-2-t1
  zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
- thema: 'Verstoss gegen Art. 2 Abs. 2–4 (gilt auch bei der eingeschränkten Revision): Revisionsstelle setzt Frist, informiert danach die GV, dann die Bürgschaftsorganisation (Art. 23
    Abs. 1). Agent: nur Notiz «Wesentliche Feststellungen» bzw. Pendenz an den WP; er setzt keine Frist und informiert niemanden.'
  quelle: covid-sbueg__art-23
  zitat: im Rahmen der eingeschränkten oder ordentlichen Revision der Jahres- oder Konzernrechnung eine Verletzung einer Vorgabe nach Artikel 2 Absätze 2–4 fest, so setzt sie ihr oder
    ihm eine angemessene Frist zur Herstellung des ordnungsgemässen Zustandes
