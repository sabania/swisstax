bewertung:
- regel: Personalaufwand umfasst Löhne, Boni, Gratifikationen, Provisionen sowie gesetzliche und freiwillige Sozialleistungen.
  quelle: hwp-bur-2023__rz-0760-s320
  zitat: gesetzliche und freiwillige Sozialleistungen (AHV, IV, EO, ALV, Beiträge an Vorsorgeeinrichtungen, Unfallversicherung etc.)
- regel: Ferien-/Überzeitguthaben und Boni/Gratifikationen sind eher passive Rechnungsabgrenzungen als Rückstellungen (inkl. Soziallasten).
  quelle: hwp-bur-2023__rz-0512-s261
  zitat: Ansprüche des Personals (beispielsweise Boni/Gratifikationen, diverse Soziallasten)
- regel: Erhaltene Leistungen von Sozialversicherungen werden in der Praxis oft als Minderung des Personalaufwands gezeigt; bei bedeutendem Umfang Erläuterung im Anhang.
  quelle: hwp-bur-2023__rz-0760-s320
  zitat: Die beiden letztgenannten Posten werden in der Buchführungspraxis vielfach als Minderung des Personalaufwands dargestellt.
- regel: Alle fälligen oder beschlossenen Beiträge an die Vorsorgeeinrichtung sind als Aufwand zu erfassen.
  quelle: hwp-bur-2023__rz-0536-s265
  zitat: sind alle fälligen oder bereits beschlossenen Beiträge an die Vorsorgeeinrichtung, gleichgültig ob reglementarische oder freiwillige, als Aufwand zu erfassen.
- regel: AGBR ohne Verwendungsverzicht sind zu aktivieren; nicht aktiviert stellen sie stille Reserven dar.
  quelle: hwp-bur-2023__rz-0536-s265
  zitat: Arbeitgeberbeitragsreserven ohne Verwendungsverzicht sind zu aktivieren; sie stellen bei Nichtaktivierung stille Reserven dar
- regel: AGBR mit Verwendungsverzicht sind keine stillen Reserven; in einer Bilanz zu Veräusserungswerten ist die AGBR mit null zu bewerten.
  quelle: hwp-bur-2023__rz-0666-s296
  zitat: Arbeitgeberbeitragsreserven mit Verwendungsverzicht stellen keine stillen Reserven dar.
- regel: Bei beschlossener oder wahrscheinlicher Sanierung einer Unterdeckung sind Rückstellungen zu bilden (Art. 960e Abs. 2 OR).
  quelle: hwp-bur-2023__rz-0538-s266
  zitat: sind zulasten der Erfolgsrechnung entsprechende Rückstellungen zu bilden
- regel: 'Faktische Verpflichtungen gegenüber der Vorsorgeeinrichtung: Aufwand und Rückstellung, sonst Prüfung einer Eventualverbindlichkeit.'
  quelle: hwp-bur-2023__rz-0542-s268
  zitat: Sind die Voraussetzungen für eine Rückstellungsbildung nicht gegeben, ist eine Offenlegung als Eventualverbindlichkeit (vgl. III.5.13) zu prüfen.
- regel: Pensionszusagen und nicht durch Vorsorgeleistungen gedeckte Abgangsentschädigungen sind während der Dienstzeit zurückzustellen.
  quelle: hwp-bur-2023__rz-0540-s267
  zitat: sind während der Dienstzeit der Mitarbeitenden entsprechende Rückstellungen zu bilden
- regel: 'Verbindlichkeiten gegenüber Vorsorgeeinrichtungen: Gesamtbetrag im Anhang genügt üblicherweise, unabhängig von der Vorsorgeform.'
  quelle: hwp-bur-2023__rz-0838-s346
  zitat: Der Ausweis eines Gesamtbetrags genügt üblicherweise.
- regel: 'Vollzeitstellen: Zurechnung nach Arbeitsvertrag; Jahresdurchschnitt aus Monats- oder Quartalsenden.'
  quelle: hwp-bur-2023__rz-0822-s344
  zitat: Für die Berechnung des Jahresdurchschnitts der Vollzeitstellen kann je nach Saisonalität vom Stand an den Monats- oder Quartalsenden ausgegangen werden.
- regel: Ausserordentlich/einmalig/periodenfremd eng auslegen; wesentliche Vorjahreskorrekturen sind periodenfremd.
  quelle: hwp-bur-2023__rz-0800-s330-t2
  zitat: In der Rechnungslegungspraxis sollten die Begriffe ausserordentlich, einmalig und periodenfremd eng ausgelegt werden.
- regel: Vergütungen an Beteiligte/Nahestehende müssen dem Drittvergleich (arm's length) standhalten; sonst verdeckte Gewinnausschüttung.
  quelle: hwp-er-2026__rz-0163-s212
  zitat: einem unbeteiligten Dritten unter gleichen Umständen aber nicht erbringen würde
- regel: Bestand stiller Reserven (u.a. AGBR) jährlich je Position ermitteln und mit Vorjahr vergleichen (Grundlage für Anhangangabe Nettoauflösung).
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
- regel: 'Vollzeitstellen: Teilzeitmitarbeitende anteilig; Auszubildende üblicherweise als Teilzeitangestellte.'
  quelle: hwp-bur-2023__rz-0823-s344
  zitat: werden Auszubildende üblicherweise nicht als Vollzeit-, sondern als Teilzeitangestellte betrachtet
- regel: 'Vollzeitstellen: Beauftragte und ausgeliehene Mitarbeitende zählen beim rechtlichen Arbeitgeber.'
  quelle: hwp-er-2026__rz-0307-s097
  zitat: Beauftragte und ausgeliehene Mitarbeitende sind demnach bei ihrem rechtlichen Arbeitgeber mitzuzählen.
fallstricke:
- text: Saldobestätigungen von AHV, SUVA, BVG/PK (R1-402) und Anwaltsbestätigungen (R1-401) sind nicht Bestandteil der eingeschränkten Revision; Agent holt sie nicht ein (nur auf ausdrückliche
    Anweisung WP), sondern nutzt beim Unternehmen vorhandene Unterlagen.
  quelle: hwp-er-2026__rz-0134-s203
  zitat: Saldobestätigungen von MWST, AHV, SUVA, BVG/PK und Steuerämtern
- text: Die Prüfung, ob arbeits- und verwaltungsrechtliche Vorgaben eingehalten sind (z.B. Lohnabzüge, Ferienrecht, Quellensteuerpflicht), gehört nicht zur ER; nur die Auswirkung auf
    die Jahresrechnung ist relevant.
  quelle: ser-2022__anh-d-s093-2
  zitat: Prüfen, ob arbeitsrechtliche und verwaltungsrechtliche Vorgaben eingehalten werden
- text: '4xx-Schritte (Sonstige) sind weitergehende Handlungen: nur auf Anweisung WP bzw. bei dokumentiertem Risiko; jedes 4xx-Vorgehen beginnt mit diesem Vorbehalt. Teile mit ER-Grundlage
    sind im Schritt ausdrücklich genannt (R1-405, R1-409).'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung, physische Tätigkeiten nie
- text: 'Personalaufwand ist meist wesentlich: Befragung allein genügt nicht, Ergänzung durch Analytik/Abstimmung zwingend.'
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Befragungen sind nur als Nachweis verwertbar, wenn Fragen und Antworten dokumentiert sind (schriftliche Antwort ablegen).
  quelle: hwp-er-2026__rz-0103-s197
  zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- text: Analytik (Quoten, Vorjahr) wird durch Bildung/Auflösung stiller Reserven (z.B. AGBR, pauschale Ferienabgrenzung) verzerrt – Zahlen bereinigen.
  quelle: ser-2022__6-1-2-t2
  zitat: Einfluss der Bildung oder Auflösung stiller Reserven auf die ausgewiesenen Werte in der Jahresrechnung.
- text: Personal- und Sozialleistungsquoten verzerrt, wenn erhaltene Leistungen von Sozialversicherungen oder Entschädigungen für ausgeliehenes Personal mit dem Personalaufwand verrechnet
    werden; für Vergleiche brutto rechnen.
  quelle: hwp-bur-2023__rz-0760-s320
  zitat: Die beiden letztgenannten Posten werden in der Buchführungspraxis vielfach als Minderung des Personalaufwands dargestellt.
- text: QSt-Bezugsprovisionen, die den Personalaufwand mindern, für Quoten separat zeigen (Praxis).
- text: AHV-Lohnsumme ist nicht gleich Bruttolohnaufwand (z.B. Familien- und Kinderzulagen nicht AHV-pflichtig, Bonus-/Austrittszeitpunkte); Differenzen erklären, nicht als Fehler werten.
  quelle: treuhand-almanach-2026__s083-1
  zitat: Bruttolohn ohne Familien- und Kinderzulagen
- text: 'Keine repräsentativen Stichproben: Auswahl bewusst (GL, Nahestehende, Ein-/Austritte, hohe Beträge).'
  quelle: ser-2022__6-1-3
  zitat: Auf die Anwendung repräsentativer Stichprobenverfahren ist zu verzichten.
- text: Transaktionen mit Nahestehenden (Saläre, Spesen der Aktionäre/GL) sind oft informell und schlecht dokumentiert.
  quelle: hwp-er-2026__rz-0157-s211
  zitat: Transaktionen zwischen nahestehenden Personen häufig informell abgewickelt werden oder nicht das gleiche Mass an Dokumentationen aufweisen
- text: Bei Überschuldungsprüfung (Veräusserungswerte) hat die AGBR keinen Wert.
  quelle: hwp-bur-2023__rz-0666-s296
  zitat: die Beitragsreserven daher in einer Bilanz zu Veräusserungswerten einen Wert von null aufweisen
- text: Lohnbezogene Posten werden gern als ausserordentlich/periodenfremd gezeigt; Klassierung und Anhangerläuterung kritisch prüfen.
  quelle: hwp-bur-2023__rz-0800-s330-t1
  zitat: Somit ist zwar im Einzelnen zu begründen, wenn ein Posten als ausserordentlich erfasst wurde
- text: Weiter gehende Detailprüfungen (R1-303 bis R1-306) nur bei erhöhtem inhärentem Risiko oder wenn die empfohlenen Handlungen Fehlaussagen vermuten lassen; sonst nicht ausführen.
  quelle: hwp-er-2026__rz-0133-s203
  zitat: Wenn kein erhöhtes inhärentes Risiko vorliegt und die empfohlenen Prüfungshandlungen ausreichende geeignete Prüfungsnachweise liefern, sind keine weitergehenden Prüfungshandlungen
    vorzunehmen.
- text: 'Befragung in der ER nur innerhalb des Unternehmens: keine Anfragen bei Ausgleichskasse, SUVA, Versicherern oder Vorsorgeeinrichtung/Sammelstiftung; nur beim Unternehmen vorhandene
    Unterlagen verwenden, fehlende als Pendenz.'
  quelle: hwp-er-2026__rz-0101-s197
  zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
- text: Differenzen (z.B. aus R1-101, R1-301, R1-302, R1-409) nur als Notiz «Wesentliche Feststellungen» mit begründetem Buchungsvorschlag; der Agent bucht nicht.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Hinweise auf mögliche Fehler und begründete Buchungsvorschläge (keine Verbuchung)
- text: 'Verdeckte Gewinnausschüttung: Mitteilung an den VR, Beurteilung der Rückerstattung (Art. 678 OR) und Hinweis im Bericht sind Sache der Revisionsstelle (WP); der Agent erfasst
    nur eine Notiz «Wesentliche Feststellungen» und nimmt keinen Kontakt mit dem VR auf.'
  quelle: hwp-er-2026__rz-0164-s212-t1
  zitat: Die Revisionsstelle teilt die verdeckte Gewinnausschüttung dem Verwaltungsrat der Gesellschaft schriftlich mit.
- text: 'Die Vollzeitstellen-Angabe betrifft die Revisionspflicht (10: Opting-out; 250: Kriterium ordentliche Revision); Kategorienwechsel oder Nähe zu einer Schwelle als Hinweis an
    WP (Prüffeld A1).'
  quelle: hwp-bur-2023__rz-0820-s343
  zitat: '10 Vollzeitstellen im Jahresdurchschnitt: Opting-out (Art. 727a Abs. 2 OR)'
- text: Die Summe der Pensen in einer Personalliste ist ein Stichtagswert, kein Jahresdurchschnitt; Ein-/Austritte pro rata über Monats- oder Quartalsenden berücksichtigen.
  quelle: hwp-bur-2023__rz-0822-s344
  zitat: Für die Berechnung des Jahresdurchschnitts der Vollzeitstellen kann je nach Saisonalität vom Stand an den Monats- oder Quartalsenden ausgegangen werden.
- text: 'Beitragssätze und Höchstbeträge nie aus dem Gedächtnis: AHV/IV/EO/ALV und UVG-Höchstbetrag 2025 nur aus Quellen mit Stand 2025 (BSV-Übersicht «ab 1.1.2025», Almanach Spalte
    1.1.2025); Tabellen «Stand 1. Januar 2026» (z.B. Almanach S. 80) nicht für 2025 verwenden; BVG/UVG/KTG/FAK-Sätze nur aus Unternehmensunterlagen.'
  quelle: bsv-beitraege-ueberblick__c005-1
  zitat: in % des Einkommens, ab 1.1.2025
fragen_kunde:
- frage: Wurden nach dem 31.12. Boni, Erfolgsprämien, Gratifikationen oder Provisionen für das Geschäftsjahr beschlossen oder zugesagt (Betrag, Datum, Organ)? Wie und in welchem Konto
    wurden sie per Stichtag erfasst bzw. abgegrenzt?
  zweck: R1-101, R1-409a; Pendenz bis schriftliche Antwort vorliegt
- frage: Welche Gründe haben die wesentlichen Veränderungen gegenüber Vorjahr/Budget bei Lohnaufwand, Boni, Sozialleistungen, Spesen und übrigem Personalaufwand (Personalbestand, Ein-/Austritte,
    Pensen, Lohnrunde, Reorganisation)?
  zweck: R1-102, R1-202, R1-203
- frage: Liegen die Schlussabrechnungen 2025 von Ausgleichskasse (AHV/FAK), Vorsorgeeinrichtung, UVG/UVGZ, KTG sowie die Quellensteuer-Jahresabrechnung vor, und wurden Nachzahlungen/Guthaben
    per 31.12. abgegrenzt?
  zweck: R1-302, R1-303, R1-410
- frage: Fanden in den letzten Jahren AHV-Arbeitgeberkontrollen, SUVA-Lohnbuchrevisionen oder andere Kontrollen statt? Gab es Nachbelastungen oder offene Feststellungen?
  zweck: R1-304
- frage: Bestehen arbeitsrechtliche Streitigkeiten, Lohnforderungen, Kündigungsanfechtungen, Sozialplan- oder Abgangsentschädigungsverpflichtungen? Liegt dazu eine Beurteilung eines
    Anwalts vor?
  zweck: R1-401; Rückstellung/Eventualverbindlichkeit
- frage: Welche Vergütungen (Lohn, Bonus, Spesen, Fahrzeug, Fringe Benefits, VR-Honorare) erhielten VR, GL, Aktionäre und ihnen nahestehende Personen im Geschäftsjahr und Vorjahr, und
    auf welcher Grundlage (Vertrag, Beschluss)?
  zweck: R1-403, R1-405
- frage: Bestehen Arbeitgeberbeitragsreserven (mit/ohne Verwendungsverzicht)? Wurden im Geschäftsjahr Einlagen getätigt oder Beiträge aus AGBR bezahlt? Wie hoch ist der Deckungsgrad
    der Vorsorgeeinrichtung per 31.12., und sind Sanierungsmassnahmen beschlossen? Bitte Kontoauszug AGBR und Mitteilung/Jahresbericht der Vorsorgeeinrichtung beilegen.
  zweck: R1-321, R1-406, R1-407
- frage: Wie wurde die Abgrenzung für Ferien- und Überzeitguthaben ermittelt (Saldi je Person, Lohnbasis, Zuschlag, Sozialleistungen)?
  zweck: R1-409b
- frage: Wurden Familienzulagen, EO-/Mutterschafts-/Vaterschaftsentschädigungen sowie Kranken- und Unfalltaggelder vollständig geltend gemacht und erfasst? Bestehen per 31.12. offene
    Ansprüche?
  zweck: R1-411
- frage: Wer legt Löhne und Lohnänderungen fest und genehmigt sie (Lohnrunde 2025)? Gab es Lohnzahlungen ausserhalb der Lohnbuchhaltung?
  zweck: R1-403, R1-301
- frage: Wie viele Vollzeitstellen beschäftigte das Unternehmen im Jahresdurchschnitt des Geschäftsjahres und des Vorjahres (Berechnungsbasis Monats-/Quartalsenden, Behandlung Lernende,
    Temporäre und ausgeliehene Mitarbeitende)?
  zweck: R1-320 Anhangangabe Vollzeitstellen; R1-202/R1-203b FTE Vorjahr
