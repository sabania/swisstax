    zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen;
  - quelle: ser-2022__anh-d-s098-2
    zitat: Enthält der Anhang bei Anwendung der Absatzerfolgsrechnung (Umsatzkostenverfahren) den Personalaufwand
