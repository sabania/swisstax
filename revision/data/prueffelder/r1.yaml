gesetz:
- thema: Personalaufwand als Mindestposition der Produktionserfolgsrechnung (Art. 959b Abs. 2 Ziff. 4 OR)
  quelle: or__art-959b-t1
  zitat: In der Produktionserfolgsrechnung (Gesamtkostenverfahren) müssen mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge ausgewiesen werden
- thema: 'Absatzerfolgsrechnung: Personalaufwand im Anhang (Art. 959b Abs. 4 OR)'
  quelle: or__art-959b-t2
  zitat: Bei der Absatzerfolgsrechnung müssen im Anhang zudem der Personalaufwand sowie in einer Position Abschreibungen und Wertberichtigungen auf Positionen des Anlagevermögens ausgewiesen
    werden.
- thema: Zeitliche und sachliche Abgrenzung (Art. 958b Abs. 1 OR)
  quelle: or__art-958b
  zitat: Aufwände und Erträge müssen voneinander in zeitlicher und sachlicher Hinsicht abgegrenzt werden.
- thema: Rückstellungspflicht bei erwartetem Mittelabfluss (Art. 960e Abs. 2 OR)
  quelle: or__art-960e
  zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
    gebildet werden.
- thema: Belegnachweis für Buchungen (Art. 957a Abs. 2 Ziff. 2 OR)
  quelle: or__art-957a
  zitat: der Belegnachweis für die einzelnen Buchungsvorgänge;
- thema: 'Anhang: Vollzeitstellen im Jahresdurchschnitt (Art. 959c Abs. 2 Ziff. 2 OR)'
  quelle: or__art-959c-t1
  zitat: eine Erklärung darüber, ob die Anzahl Vollzeitstellen im Jahresdurchschnitt nicht über 10, über 50 beziehungsweise über 250 liegt
- thema: 'Anhang: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen (Art. 959c Abs. 2 Ziff. 7 OR)'
  quelle: or__art-959c-t2
  zitat: Verbindlichkeiten gegenüber Vorsorgeeinrichtungen;
- thema: 'Anhang: Beteiligungsrechte/Optionen für Organe und Mitarbeitende (Art. 959c Abs. 2 Ziff. 11 OR)'
  quelle: or__art-959c-t2
  zitat: Anzahl und Wert von Beteiligungsrechten oder Optionen auf solche Rechte für alle Leitungs- und Verwaltungsorgane sowie für die Mitarbeitenden
- thema: 'Anhang: Erläuterung ausserordentlicher, einmaliger oder periodenfremder Positionen (Art. 959c Abs. 2 Ziff. 12 OR)'
  quelle: or__art-959c-t2
  zitat: Erläuterungen zu ausserordentlichen, einmaligen oder periodenfremden Positionen der Erfolgsrechnung
- thema: 'Anhang: Nettoauflösung stiller Reserven (Art. 959c Abs. 1 Ziff. 3 OR) – nur soweit Auflösung die Neubildung übersteigt und das Ergebnis wesentlich günstiger darstellt; u.a.
    nicht aktivierte AGBR'
  quelle: or__art-959c-t1
  zitat: soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven übersteigt, wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird
- thema: Gesonderter Ausweis Forderungen/Verbindlichkeiten gegenüber Beteiligten und Organen (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: Forderungen und Verbindlichkeiten gegenüber direkt oder indirekt Beteiligten und Organen
- thema: Arbeitgeberbeiträge Personalvorsorge, Finanzierung aus Beitragsreserven (Art. 331 Abs. 3 OR)
  quelle: or__art-331-t1
  zitat: er erbringt seine Beiträge aus eigenen Mitteln oder aus Beitragsreserven der Vorsorgeeinrichtung, die von ihm vorgängig hierfür geäufnet worden und gesondert ausgewiesen sind
- thema: Überweisungsfrist BVG-Beiträge (Art. 331 Abs. 3 OR)
  quelle: or__art-331-t1
  zitat: spätestens am Ende des ersten Monats nach dem Kalender- oder Versicherungsjahr, für das die Beiträge geschuldet sind, an die Vorsorgeeinrichtung überweisen
- thema: Lohnanspruch gemäss Vereinbarung (Art. 322 OR)
  quelle: or__art-322
  zitat: Der Arbeitgeber hat dem Arbeitnehmer den Lohn zu entrichten, der verabredet oder üblich oder durch Normalarbeitsvertrag oder Gesamtarbeitsvertrag bestimmt ist.
- thema: 'Erfolgsbeteiligung: massgebend ist das Ergebnis des Geschäftsjahres (Art. 322a OR)'
  quelle: or__art-322a
  zitat: so ist für die Berechnung des Anteils das Ergebnis des Geschäftsjahres massgebend
- thema: Gratifikation/Sondervergütung bei Abschluss des Geschäftsjahres (Art. 322d OR)
  quelle: or__art-322d
  zitat: Richtet der Arbeitgeber neben dem Lohn bei bestimmten Anlässen, wie Weihnachten oder Abschluss des Geschäftsjahres, eine Sondervergütung aus
- thema: Überstundenlohn mit Zuschlag (Art. 321c Abs. 3 OR) – Bewertung Überzeitabgrenzung
  quelle: or__art-321c
  zitat: so hat der Arbeitgeber für die Überstundenarbeit Lohn zu entrichten, der sich nach dem Normallohn samt einem Zuschlag von mindestens einem Viertel bemisst
- thema: Ferienlohn; keine Abgeltung während des Arbeitsverhältnisses (Art. 329d OR)
  quelle: or__art-329d
  zitat: Die Ferien dürfen während der Dauer des Arbeitsverhältnisses nicht durch Geldleistungen oder andere Vergünstigungen abgegolten werden.
- thema: Schriftliche Lohnabrechnung (Art. 323b Abs. 1 OR)
  quelle: or__art-323b
  zitat: dem Arbeitnehmer ist eine schriftliche Abrechnung zu übergeben
- thema: Auslagenersatz/Spesen (Art. 327a OR)
  quelle: or__art-327a
  zitat: Der Arbeitgeber hat dem Arbeitnehmer alle durch die Ausführung der Arbeit notwendig entstehenden Auslagen zu ersetzen
