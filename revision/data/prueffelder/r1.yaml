  - Personalliste mit Pensen und Ein-/Austritten (Stand Monats-/Quartalsenden)
  - Saldo BVG-Kontokorrent 31.12.
  rechnen: 'FTE-Durchschnitt = Σ Pensen an Monats- oder Quartalsenden / Anzahl Stichtage (pro rata Ein-/Austritte, Lernende als Teilzeit, ausgeliehene Mitarbeitende beim rechtlichen
    Arbeitgeber) → Prüfung der Schwellen 10/50/250 nach Art. 959c Abs. 2 Ziff. 2 OR (Wortlaut: nicht über 10, über 50 bzw. über 250)'
  feststellung_wenn: Pflichtangabe fehlt oder ist falsch (Vollzeitstellen, Verbindlichkeiten gegenüber VE, ao. Personalposten, Personalaufwand bei Absatzerfolgsrechnung); Kategorienwechsel
    oder Schwellennähe → Hinweis an WP.
