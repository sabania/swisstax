- id: R1-320
  vorgehen: 'Anhang durchsehen: Vollzeitstellen-Erklärung mit FTE-Jahresdurchschnitt plausibilisieren; Kategorienwechsel oder Nähe zur Schwelle 10/250 als Hinweis an WP (Revisionspflicht/Opting-out,
    Prüffeld A1). Ferner: Verbindlichkeiten gegenüber VE, Beteiligungsrechte/Optionen, ao./periodenfremde Personalposten, Nettoauflösung stiller Reserven (AGBR), bedeutende Leistungen
    von SV, bei Absatzerfolgsrechnung Personalaufwand. Ergebnis im Textfeld.'
