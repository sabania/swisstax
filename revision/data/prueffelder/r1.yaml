kurzbeschrieb: 'Löhne, Boni, Sozialleistungen, Spesen, Nebenkosten inkl. Abgrenzungen (Ferien/Überzeit, Boni, SV-Schlussabrechnungen), AGBR/Vorsorge, Anhangangaben. ER: Befragung, Analytik
  (VJ, Saläre/Sozialleistungen, pro FTE), Detailprüfung Abstimmung Lohnbuchhaltung–Hauptbuch (empfohlen); weiter gehende Detailprüfungen (R1-303 bis R1-306) und 4xx nur bei Risiko bzw.
