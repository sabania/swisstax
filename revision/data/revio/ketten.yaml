    zweck: Feldliste bzw. Werte eines DTO lesen – v. a. Enums ohne Werte in schemas.json (AccountItemsView, FinancialValuesOrigin, EntitySource, ContainerDocumentKind, PreviousPeriodAttachmentTransferMode).
    parameter: name = DTO-Name
    art: lesen
  - werkzeug: revio_call
    zweck: 'GESPERRT (OpenClaw deny), analog revio_create_client: der generische Aufruf umgeht jede Sperre je Werkzeug und wird auch von Menschen über den Agenten nicht gebraucht. Das
      Schema kennt keine Art «gesperrt», daher hier als nur_mensch geführt.'
    parameter: method, path, path_params_json, query_json, body_json – gesperrt
    art: nur_mensch
  menschliche_freigabe: 'Keine Schreibaktion. Für die OpenClaw-Konfiguration gilt eine einzige Liste (Werkzeug → allow / allow mit Freigabe / deny), die Zuordnung, Ketten und klass zusammenführt;
    ein Werkzeug hat genau eine Einstufung. «unklar» = deny in OpenClaw bis Entscheid Fachperson. Lesen: nur die Liste OpenClaw.werkzeuge_lesen der Zuordnung (104 rv_*-Werkzeuge) und
    die 7 revio_*-Lesewerkzeuge allow; übrige Lesewerkzeuge (alle Mandate, Archive, Firmen-QS, Personendaten, Konzern, Definitionen, Settings) deny. Methode GET heisst nicht «nur lesen»
    – z. B. rv_get_auditActivities_ClaudeImportAuditActivities, rv_get_auditActivities_GetOvertakePreviousPeriodAuditActivitiesResult, rv_get_workpapers_GetRemoveFromDocumentInboxAndAppendToDetachedItems,
    rv_get_workpapers_StoreAccountingEstimate und rv_get_workpapers_CommitIcsAreaAssessment schreiben; rv_get_containerDefinitions_GetContainerTaxonomyLock_by_containerId ist Kandidat
    «evtl. schreibend» (Sperre); rv_get_workpapers_LoadAreaState nur mit trackUser = false. Report-Jobs (Create*Report, CreateQuestionnairePDF) einheitlich «Kandidat, Report-Job – deny
    bis Entscheid consis»; GeneratePdfReport und MergePdfReport deny, je Auftrag befristet frei (K13). Feldregeln, die OpenClaw je Werkzeug nicht erzwingt (Prüfung im Agenten-Code vor
    jedem Schreibaufruf bzw. JWT-Rechte des Dienstbenutzers ^[konzept-ki-revisionsagent-2026__c009-3]): Cell.isVised/visaUserId/visaDate/visaText unverändert leer (UpdateDossierActivity);
    NoteDto.id nur leer oder eigene Notiz, isClosed = false, type ≠ Review (UpdateNote); DocumentationItemDto.state = false, currentStatus nicht setzen (AddFilesToDocumentation); ImportOptions.isDeleteMode
    = false (Import); RejectImport nur eigene importRequestId; PdfGenerationSettingsDto.isArchiveJob = false; trackUser = false. Werkzeuge, deren Felder nicht sicher begrenzbar sind,
    bleiben deny: PermanentFileDto.deletedAt (UpdatePermanentFile u. a.), ReApplyDetachedItems.deleteFinal, publishAfter (StorePbcWorkspace, StoreQuestionnaire), AttachementDto.clientId/dossierId
    (UpdateAttachementsMetadata).'
  offene_fragen:
  - 'GET mit Request-DTO (über 100 rv_get_*): Bindung der Felder als Query oder Body?'
  - 'Feldregeln, die OpenClaw je Werkzeug nicht erzwingen kann: Welche Rechte bietet revio je Register für den Dienstbenutzer (Schreiben ohne Visum, nur eigene Notizen)? Was davon setzt
    das JWT durch, was der Agenten-Code (Werkzeugschicht ^[konzept-ki-revisionsagent-2026__c009-1]); der MCP-Code bleibt ohne Fachlogik.'
