  menschliche_freigabe: Nur lesen (Bereich 3) ^[konzept-ki-revisionsagent-2026__c006-2]. Ergebnis fliesst in Umfang und Auswahl je Prüfschritt (K6) ^[konzept-ki-revisionsagent-2026__c012-1].
    Risiken, Strategie, Prüfungstiefe und Zuweisungen ändert nur der Mensch.
  offene_fragen:
  - Leserechte für 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2 sind noch zu entscheiden ^[konzept-ki-revisionsagent-2026__c017-1].
  - Bedeutung der Integer-Skalen (inherentRiskState, controlRiskState, depthOfTests, auditPriority).
  - Wird der Agent in 3.5 als eigener «zugewiesener Mitarbeiter» geführt ^[konzept-ki-revisionsagent-2026__c017-1]?
- id: K5
  aufgabe: Prüfschritte eines Prüffelds laden und einem Katalogschritt (z. B. C1-302) per Nummer und Text zuordnen
  wann: Je Prüffeld vor der Bearbeitung (K6); einmalig zur Erstellung der Spalte «revio-Zuordnung» bzw. der Vorlage zuordnung_pruefschritte.csv mit der echten Datenkopie
  prozess: '2'
  schritte:
  - werkzeug: rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId
    zweck: 'Prüfschritte des Prüffelds im Dossier laden. Zuordnung (lokal, ohne Aufruf): Nummer aus der Id-Zelle (isIdCell) = Katalog-Nr. (C1-302 → «302»), Gruppe = Typ (3xx Detail),
      Text normalisiert mit dem Katalogtext vergleichen («Beurteilung der Angemessenheit der Wertberichtigungen / Delkredere …»). Ergebnis je Schritt: activityId, Textzelle (cellId),
      Visumsstand; Abweichungen melden'
    parameter: 'path_params_json {"containerId": K1, "templateId": itemConfiguration.referenceId des Prüffeld-Knotens (K1, Kandidat)}. Ergebnis TemplatedRowGroup[] {groupId, groupName,
      items: TemplatedRow {id = activityId, rows[].cells[] {cellId, isIdCell, name, content, canEdit, isVised, visaUserId, visaDate}, isDisabled, isVised, isUserItem, isPreviousPeriodItem,
      attachements, referenceInfoText}}'
    art: lesen
  - werkzeug: rv_get_auditActivities_LoadAuditActivityTemplate
    zweck: 'Kandidat: Vorlage der Prüfschritte des Prüffelds lesen; dient auch zum Bestätigen der templateId'
    parameter: 'query_json {"containerId": K1, "navigationId": areaId des Prüffelds (K1), "templateId": Kandidat aus K1}'
    art: lesen
  - werkzeug: rv_get_checklists_LoadAuditActivityTemplate_by_templateId
    zweck: 'Kandidat: Vorlage unabhängig vom Dossier lesen (Nummern/Texte) – Vergleich Vorlage ↔ Dossier ↔ Katalog, Benutzerschritte erkennen'
    parameter: 'path_params_json {"templateId": wie Schritt 1}'
    art: lesen
  - werkzeug: rv_get_auditDefinitons_LoadAuditActivityDefinitions
    zweck: 'Kandidat: Definitionen/Gruppen der Prüfungshandlungen lesen (Zuordnung Gruppe → Typ 1xx–4xx)'
    parameter: keine Parameter
    art: lesen
  - werkzeug: rv_get_auditProcedureCatalog_LoadAuditProcedureCatalog_by_containerDefinitionId
    zweck: Katalog der Prüfungshandlungen der Akte lesen (Einträge mit zugeordneten Schrittnummern und activityIds)
    parameter: 'path_params_json {"containerDefinitionId": AnualFileDto.containerId (K1, Kandidat)}. Ergebnis AuditProcedureCatalogEntryDto {id, displayTitle, assignAuditNumbers, assignedAuditActivityIds}'
    art: lesen
  - werkzeug: rv_get_workpapers_LoadStrategicalPlanning
    zweck: Welche Schritte sind in 3.5 dem Prüffeld zugewiesen (Kandidat für «markiert» im Sinne des Pflichtenhefts)
    parameter: keine Parameter; assignedAuditProcedures[].assignedAuditActivityIds mit activityIds aus Schritt 1 abgleichen
    art: lesen
  - werkzeug: rv_post_auditActivities_SetAuditActivitySelectionState
    zweck: 'NICHT durch den Agenten: Schritt aktivieren/deaktivieren = Umfangsentscheid des WP; ebenso rv_post_auditActivities_InsertDossierAuditActivityItem (Prüfschritt ins Dossier
      einfügen) und rv_delete_auditActivities_DeleteDossierActivityItem – einheitlich nur_mensch, auch in der Zuordnung Bereich 4'
    parameter: body_json SetAuditActivitySelectionStateDto {containerId, activityId, isDisabled} – nur Mensch
    art: nur_mensch
  menschliche_freigabe: 'Keine Schreibaktion. Abweichungen der Zuordnung (Nummer fehlt, Text weicht ab, die 5 unlesbaren Kennzeichnungen im Katalog, Benutzerschritte isUserItem) bestätigt
    enco/WP; das Ergebnis kommt als Wissen in die Spalte «revio-Zuordnung» bzw. in zuordnung_pruefschritte.csv (IDEE Teil B: schritt_id;pruefffeld;typ;kennz;revio_bereich;revio_template_id;revio_activity_id;werkzeug_lesen;werkzeug_vorbereiten;art;bemerkung),
    nicht nach revio. Auswahl, Einfügen und Deaktivierung von Schritten entscheidet der WP.'
  offene_fragen:
  - Welche Zelle trägt Nummer, Text, Kennzeichnung EP/WP, Prüfziele und das Textfeld (isIdCell, canEdit, name)? – mit Datenkopie bestimmen.
  - Ist templateId = itemConfiguration.referenceId des Prüffeld-Knotens? Ist containerId in LoadAuditActivities die Containerdefinition oder eine Dossier-Instanz?
  - Bleiben activityIds über das Fortschreiben ins Folgejahr stabil (wichtig für die Zuordnung)?
  - 'Was heisst «markiert» im Pflichtenheft: Zuweisung in 3.5 (assignedAuditActivityIds) oder Auswahl durch den WP? ^[konzept-ki-revisionsagent-2026__c015-2]'
  - Vorlage zuordnung_pruefschritte.csv (538 Zeilen mit Platzhaltern, IDEE Teil B) ist noch nicht erstellt.
- id: K6
  aufgabe: Textfeld eines Prüfschritts vorbereiten (Entwurf), Beleg anhängen, Konto kommentieren und Kontendokumentation ergänzen
  wann: Je bearbeitetem Prüfschritt nach K3–K5 und der Prüfung (Nachweise aus M-Files, Rechnen im Rechenmodul); Beleg-Upload über K15
  prozess: '2'
  schritte:
  - werkzeug: rv_get_workpapers_LoadAreaState
    zweck: 'Zustand des Prüffelds prüfen: abgeschlossen, ✓ gesetzt, deaktiviert oder arbeitet gerade ein Mensch darin → nicht schreiben. Regel: immer trackUser = false (trackUser = true
      registriert Präsenz)'
    parameter: 'query_json {"areaId": areaId des Prüffelds (K1), "trackUser": false}. Ergebnis AreaStateDto {workpaperState, isDisabled, checklistItems, states, activeAreaUsers}'
    art: lesen
  - werkzeug: rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId
    zweck: Schritt unmittelbar vor dem Schreiben neu laden. Abbruch bei TemplatedRow.isVised, Zelle isVised, isDisabled oder bereits von einem Menschen befülltem Textfeld (dann Notiz
      K7 statt Überschreiben)
    parameter: 'path_params_json {"containerId": K1, "templateId": K5}; Zeile mit id = activityId (K5)'
    art: lesen
  - werkzeug: rv_put_auditActivities_UpdateDossierActivity
    zweck: 'Kandidat: Textfeld des Schritts mit dem Entwurf füllen. Inhalt: «Entwurf KI-Agent <Datum>» · Prüfziel(e) (z. B. BE) · Quellen (M-Files-ID + Version) · Auswahl und Umfang
      mit Begründung (Toleranzwesentlichkeit K3, Risiko K4) · Ergebnis · Feststellungen · Verweis auf Notiz · Status (vorbereitet / teilweise bearbeitet)'
    parameter: 'body_json UpdateAuditActivityDossierFielddDto {"containerId": K1, "activity": TemplatedRow aus Schritt 2 unverändert, "cell": Textzelle aus Schritt 2 (canEdit = true,
      nicht isIdCell) mit nur geändertem "content"}; Feldregel: isVised, visaUserId, visaDate, visaText bleiben unverändert leer. Alternative nur nach Test: rv_put_auditActivities_UpdateDossierActivityItemTemplateField
      body_json {"containerId", "navigationId": areaId, "activityItemId": activityId, "changedFields": [{"cellId", "content", "isIdField": false}]}'
    art: vorbereiten
  - werkzeug: rv_get_auditActivities_ClaudeImportAuditActivities
    zweck: Kandidat, Alternative zu Schritt 3 und 6 als Sammelimport mehrerer Schritte (schreibt trotz GET); Verhalten bei vorhandenem Text und visierten Schritten vor Einsatz klären
    parameter: 'body_json ClaudeImportAuditActivitiesRequest {"prueffelder": [{"navigationId": areaId (K1), "templateId": K5, "code": "C1", "eintraege": [{"nr": 302, "ergebnis": Text
      wie Schritt 3, "referenceText": Fundstellen, "attachments": [{"fileName", "attachmentId"}]}]}]}. Antwort {success, updatedCount, skippedCount, message}'
    art: kandidat
    bedingung: nur statt Schritten 3+6, nach Entscheid consis
  - werkzeug: rv_get_workpapers_LoadDetachedAttachements_by_areaId
    zweck: 'Nach Upload (K15): attachementId des Belegs in den losen Beilagen des Prüffelds bestimmen'
    parameter: 'path_params_json {"areaId": areaId des Prüffelds (K1)}'
    art: lesen
  - werkzeug: rv_post_auditActivities_AddAttachementsToAuditActivity
    zweck: Beleg an den Prüfschritt hängen. Name einer eigenen Beilage korrigieren nur über rv_post_auditActivities_RenameAuditActivityAttachment (mit Freigabe; vorher mit Schritt 7
      prüfen, dass es eine eigene Beilage ist), nie über rv_put_attachements_UpdateAttachementsMetadata (K15)
    parameter: 'body_json AppendAuditActivityAttachementsRequest {"containerId": K1, "activityId": K5, "attachementInfo": [{"attachementId": Schritt 5, "name": "<M-Files-ID>_v<Version>_<Titel>.pdf",
      "isTemporary": false}]}. Alternative (Kandidat): rv_post_workpapers_MoveDetachedAttachmentsToWorkingArea {"attachmentIds", "areaId", "entityId": activityId, "targetSource": EntitySource-Wert
      (K16)}'
    art: vorbereiten
  - werkzeug: rv_get_attachements_GetAttachementMetadata_by_attachementId
    zweck: 'Kontrolle der Beilage: Name, Grösse, Herkunft = Mandatskontext'
    parameter: 'path_params_json {"attachementId": Schritt 5}; prüfen source.clientId/source.dossierId bzw. clientId/dossierId = K1'
    art: lesen
  - werkzeug: rv_get_auditActivities_LoadCoverSheet_by_containerId
    zweck: 'Vor einem Kontenkommentar: bestehenden Kommentar und state des Kontos lesen; vorhandener menschlicher Kommentar → nicht überschreiben, sondern Notiz (K7)'
    parameter: 'path_params_json {"containerId": K1}; CoverPageBalanceItemDto {accountId, number, comment, state} des Kontos'
    art: lesen
  - werkzeug: rv_post_auditActivities_SetCoversheetBalanceItemComment
    zweck: 'Kandidat: Kurzkommentar zum Konto in der Kontenübersicht des Prüffelds (z. B. «Entwurf KI-Agent <Datum>: abgestimmt mit <Nachweis>, siehe C1-302»); nur leere Kommentare füllen'
    parameter: 'body_json SetCoversheetBalanceItemCommentDto {"accountId": Schritt 8, "comment": Text}; ersetzt vermutlich den ganzen Kommentar'
    art: vorbereiten
  - werkzeug: rv_get_workpapers_LoadDocumentationItems
    zweck: 'Kandidat: Kontendokumentation (Belege je Konto) lesen, Dubletten vermeiden, eigene Einträge erkennen'
    parameter: 'query_json {"areaId": Prüffeld (K1), "documentationId": Kandidat (Kontendokumentation je Konto; Herkunft offen, z. B. accountId aus Schritt 8)}. Ergebnis DocumentationItemDto
      {id, userId, attachementId, title, state, currentStatus, informationText}'
    art: lesen
  - werkzeug: rv_post_workpapers_AddFilesToDocumentation
    zweck: 'Kandidat: Beleg in die Kontendokumentation des Kontos aufnehmen'
    parameter: 'body_json AddFilesToDocumentationRequest {"areaId", "documentationId": Schritt 10, "items": [DocumentationItemDto {"attachementId": Schritt 5, "title": "<M-Files-ID>_v<Version>_<Titel>.pdf",
      "state": false}]}; Feldregel: items[].state = false, currentStatus nicht setzen; ✓ je Beleg nur Mensch'
    art: vorbereiten
  - werkzeug: rv_put_workpapers_UpdateDocumentationComment
    zweck: 'Kandidat: Kommentar zu einem eigenen Beleg der Kontendokumentation (Fundstelle, Bezug zum Prüfschritt)'
    parameter: 'body_json UpdateDocumentationCommentRequest {"areaId", "documentationId", "itemId": id des eigenen Eintrags (Schritt 10/11, userId = Dienstbenutzer), "comment"}'
    art: vorbereiten
  - werkzeug: rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId
    zweck: 'Kontrolle nach dem Schreiben: Text gespeichert, Beilage am Schritt, Visum weiterhin leer; Kommentar und Kontendokumentation (Schritte 8 und 10 erneut) vorhanden, state unverändert'
    parameter: wie Schritt 2
    art: lesen
  - werkzeug: rv_get_workpapers_LoadAreaHistory_by_areaId
    zweck: 'optional (Kandidat, deny): Kontrolle; den Protokolleintrag schreibt der Agenten-Code aus den eigenen Aufrufen und Antworten ^[konzept-ki-revisionsagent-2026__c009-3]. Inhalt
      (M-Files-Protokoll pro Mandat und Jahr, M-Files-Werkzeug ausserhalb des revio-MCP): Zeitstempel, Werkzeug, Prüfschritt, Quelle (M-Files-ID und Version), Ergebnis und Fehler.'
    parameter: 'path_params_json {"areaId": areaId des Prüffelds (K1)}'
    art: kandidat
  - werkzeug: rv_post_workpapers_StoreDynamicFormPanelVisaState
    zweck: 'NICHT durch den Agenten: Visum setzen (Kandidat für Formular-Panels, z. B. Abschliessende Beurteilung); das Visum je Prüfschritt setzt der WP in revio'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_checklists_StoreChecklistData
    zweck: 'NICHT durch den Agenten (OpenClaw deny): bereichsneutral (areaId im Body), Checklisten tragen Visum-Zellen (Cell.isVised, visaUserId, visaDate, visaText); Abschliessende
      Beurteilung, 2.x, 3.4, 6.x, 7.x und 9.0 sind vermutlich Checklisten oder Formulare. Ebenso rv_post_workpapers_StoreDynamicFormDataItem und rv_post_workpapers_StoreDynamicFormPanelAttachment.
      Erst wenn (a) die Komponente der Abschliessenden Beurteilung und die Register in 4/10 am Testmandat bestimmt sind und (b) das JWT des Dienstbenutzers Schreibrechte je Register
      und kein Visumsrecht hat, höchstens vorbereiten mit Auflage areaId ∈ {Bereich 4, Bereich 10} (bis dahin Kandidat = deny)'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_put_workpapers_UpdateCheckCardState
    zweck: 'NICHT durch den Agenten: Prüfkarten-/Häkchenstatus des Prüffelds (Kandidat für ✓ je Prüffeld)'
    parameter: body_json UpdateAreaCheckCardStateRequest {checkCardItemId, state} – nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_auditActivities_SetCoversheetBalanceItemState
    zweck: 'NICHT durch den Agenten: Status/✓ je Konto (Kandidat); ebenso rv_put_workpapers_UpdateDocumentationItems (DocumentationItemsDto.state = ✓), rv_put_workpapers_UpdateDocumentationAccountState,
      rv_put_workpapers_UpdateDocumentationAttachementSealedState'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_put_workpapers_UpdateAreaComments
    zweck: 'NICHT durch den Agenten: ersetzt die ganze Kommentarliste eines Bereichs (AreaStateCommentDto: comment, user, date; vermutlich Fusszeile/Review) und könnte Kommentare anderer
      löschen oder verfälschen. Kommentare des Agenten nur über Schritt 9 bzw. 12'
    parameter: body_json UpdateAreaCommentsRequest {areaId, comments} – nur Mensch
    art: nur_mensch
  menschliche_freigabe: 'Schritte 3, 6, 9, 11 und 12 schreiben → Freigabe (Testphase); Schritt 4 und Upload K15 Kandidat (deny). Visum (Kürzel/Datum) je Schritt, ✓ je Prüffeld, Konto
    oder Beleg, «Abgeschlossen»/«Review» und Abschliessende Beurteilung setzt nur der Mensch ^[konzept-ki-revisionsagent-2026__c008-1] ^[konzept-ki-revisionsagent-2026__c011-2]. Achtung:
    UpdateDossierActivity transportiert die Visumsfelder der Zelle (isVised, visaUserId, visaDate), AddFilesToDocumentation das Feld state – OpenClaw sperrt nur je Werkzeug; Visum und
    ✓ müssen serverseitig über das JWT des Dienstbenutzers (kein Visumsrecht) ^[konzept-ki-revisionsagent-2026__c009-3] und durch eine Feldprüfung im Agenten-Code vor dem Aufruf (Feldregeln
    K16) verhindert werden; der MCP-Code bleibt ohne Fachlogik. Jede Aktion schreibt der Agenten-Code ins M-Files-Protokoll ^[konzept-ki-revisionsagent-2026__c009-3] (Schritt 14 nur
    optionale Kontrolle, Kandidat).'
  offene_fragen:
  - 'Welcher Endpunkt schreibt das Textfeld eines Prüfschritts im Dossier: UpdateDossierActivity, UpdateDossierActivityItemTemplateField oder ClaudeImportAuditActivities? Überschreibt
    UpdateDossierActivity die ganze Zeile?'
  - Darf der Agent einen vorhandenen (menschlichen) Text ergänzen, oder nur leere Textfelder füllen?
  - 'Korrektur einer eigenen Fehlablage: rv_delete_auditActivities_RemoveAuditActivityAttachement ist löschend – gesperrt oder freigabepflichtig?'
  - Wo wird «Abschliessende Beurteilung» je Prüffeld gespeichert (Formular-Panel, Checkliste, Checkkarte, ICS-Assessment)? Welche Werkzeuge entsprechen ✓ und Visum genau?
  - Woher kommt documentationId (Kontendokumentation je Konto)? Bedeutung von CoverPageBalanceItemDto.state und DocumentationItemDto.state/currentStatus (✓ je Konto/Beleg?). Ersetzt
    SetCoversheetBalanceItemComment den Kommentar ganz?
  - Einstufung von rv_post_workpapers_MoveDetachedAttachmentsToDocumentation (mögliche Alternative zu AddFilesToDocumentation) offen.
  - 'Werte von EntitySource; ClaudeImportAuditActivities: GET mit Body zulässig, überspringt es visierte Schritte (skippedCount)?'
- id: K7
  aufgabe: Notiz erfassen (Pendenz / Wesentliche Feststellung / Buchungsvorschlag / PBC-Vorschlag) mit Beilage
  wann: Wann immer der Agent etwas nicht klären kann (Pendenz), einen möglichen Fehler findet (Wesentliche Feststellung, ggf. mit Buchungsvorschlag), eine fehlende Unterlage für die
    PBC-Liste vorschlägt (K8) oder einen Punkt für die Schlussbesprechung hat; in allen Prozessen
  prozess: '2'
  schritte:
  - werkzeug: rv_get_containerDefinitions_GetNoteTypes
    zweck: type-Id der Kategorie bestimmen (Pendenz, Wesentliche Feststellungen – Kandidat isDeterminationNote = true –, Schlussbesprechung); «Review» nie verwenden
    parameter: keine Parameter (oder aus dem Kontext von K1)
    art: lesen
  - werkzeug: rv_get_workpapers_LoadNotesForArea_by_areaId
    zweck: Bestehende Notizen des Bereichs lesen, Dubletten vermeiden (gleiche Pendenz bereits offen?)
    parameter: 'path_params_json {"areaId": Prüffeld (Bereich 4) bzw. 10.x (K1)}. Dossierweit: rv_get_workpapers_LoadDossierNotesByNoteType query_json {"noteType": Id, "onlyOpenNotes":
      true}'
    art: lesen
  - werkzeug: rv_put_workpapers_UpdateNote
    zweck: 'Kandidat (kein eigener Create-Endpunkt): neue Notiz anlegen. Text je Kategorie: Pendenz = Konto, Datum, Betrag, was fehlt/unklar, Verweis auf Prüfschritt; Wesentliche Feststellung
      = möglicher Fehler, Betrag, Vergleich mit Gesamtwesentlichkeit (K3), Fundstelle; Buchungsvorschlag (Kategorie Wesentliche Feststellungen) = Soll-Konto / Haben-Konto / Betrag /
      Buchungstext / Begründung, Vermerk «Vorschlag – nicht verbucht»; PBC-Vorschlag = Pendenz mit Titelpräfix «PBC-Vorschlag:» (K8)'
    parameter: 'body_json UpdateNoteRequest {"areaId": Bereich wie Schritt 2, "note": NoteDto {"id": leer (neu, Kandidat), "areaId", "title": "C1-302 · Pendenz: …", "text", "type": Id
      aus Schritt 1, "priority", "isClosed": false, "hasAppointment": false, "showOutsideDossier": false, "assignments": [], "feedbacks": []}}. Feldregeln: id nur leer (neu) oder Id
      einer eigenen Notiz (createdBy = Dienstbenutzer); fremde Notizen nie ändern; isClosed immer false; type nie Review; areaId und note.areaId nur Register in Bereich 4 oder 10 ^[konzept-ki-revisionsagent-2026__c006-1]'
    art: vorbereiten
  - werkzeug: rv_get_workpapers_LoadNotesForArea_by_areaId
    zweck: noteId der neuen Notiz bestimmen und Inhalt kontrollieren
    parameter: path_params_json {"areaId"}; Notiz über title/createdBy finden
    art: lesen
  - werkzeug: rv_get_workpapers_LoadDetachedAttachements_by_areaId
    zweck: 'Nach Upload (K15): attachementId des Nachweises bestimmen (nur wenn er nicht schon direkt am Prüfschritt liegt)'
    parameter: path_params_json {"areaId"}
    art: lesen
  - werkzeug: rv_post_workpapers_MoveAttachmentsToNote
    zweck: Nachweis als Beilage an die eigene Notiz hängen
    parameter: 'body_json MoveAttachmentsToNoteRequest {"noteId": Schritt 4, "attachements": [attachementId aus Schritt 5]}'
    art: vorbereiten
  - werkzeug: rv_get_workpapers_LoadAreaHistory_by_areaId
    zweck: 'optional (Kandidat, deny): Kontrolle; den Protokolleintrag schreibt der Agenten-Code aus den eigenen Aufrufen und Antworten ^[konzept-ki-revisionsagent-2026__c009-3]. Inhalt
      (M-Files-Protokoll pro Mandat und Jahr, M-Files-Werkzeug ausserhalb des revio-MCP): noteId, Kategorie, Bezug, Beilage, Zeitstempel, Fehler.'
    parameter: 'path_params_json {"areaId": Bereich wie Schritt 2}'
    art: kandidat
  - werkzeug: rv_post_financialStatement_AppendLedgerAdjustement
