# Werkzeugketten je Aufgabe (revio-MCP). INTERN.
status: agent-geprueft
erfasst: '2026-11-11'
ketten:
- id: K1
  aufgabe: Mandant und Dossier/Periode finden und öffnen, Mandatskontext und Ids der Akte fixieren
  wann: Zu Beginn jedes Auftrags (vor jedem anderen Aufruf) und nach jedem Kontextwechsel (z. B. Vorjahr K10)
  prozess: allgemein
  schritte:
  - werkzeug: revio_server_version
    zweck: Verbindung und Backend-Version prüfen (Werkzeugliste Stand revio 4.0.373); andere Version → Werkzeugliste/Klassifikation zuerst nachführen. Komfortwerkzeug; revio_* sind in
      data/revio/werkzeuge.csv eingestuft (revio_call, revio_create_client gesperrt; übrige lesen), die Roh-CSV raw/revio/revio-mcp-werkzeuge.csv hat nur die 840 rv_*
    parameter: keine Parameter
    art: lesen
  - werkzeug: revio_find_clients
    zweck: Kunde suchen (intern LoadClients); Treffer gegen den Auftrag des WP prüfen. 0 oder mehr als 1 Treffer → abbrechen, Rückfrage WP (nie Kunde anlegen). Die Liste aller Mandate
      nur zum Abgleich verwenden, nicht speichern oder weitergeben (Berufsgeheimnis).
    parameter: 'keine Parameter. Ergebnis ClientDto: clientId = id; Abgleich über number, name, uid, legalForm, canton'
    art: lesen
  - werkzeug: revio_list_dossiers
    zweck: Jahresakten des Kunden lesen und die Akte zum Stichtag des Auftrags wählen; versiegelte oder zur Siegelung beantragte Akte → nur lesen.
    parameter: 'client_id = clientId aus Schritt 2. Aus AnualFileDto: dossierId = id (balancingDate = Stichtag, isInterimFile = false), clientId, containerId, subContainerId, previousDossierId,
      openingDate, balancingDate, anualFileTitle, state, sealRequestedDate, lastSealActionDate. Gleichwertiger Endpunkt: rv_get_clientsManagement_LoadAnualFilesForClient_by_clientId
      mit path_params_json {"clientId": <Schritt 2>}'
    art: lesen
  - werkzeug: revio_open_dossier
    zweck: Dossier öffnen und Mandatskontext fixieren (Kunde, revio-Mandat, Geschäftsjahr, Stichtag; M-Files-Kunde ergänzt der Agent ausserhalb revio). Jeder spätere Aufruf wird dagegen
      geprüft; Schreibwerkzeuge gibt der Agenten-Code nur frei, solange der geöffnete Kontext dieser Akte entspricht (siehe K10).
    parameter: 'client_id = Schritt 2, dossier_id = Schritt 3. Kandidat: entspricht rv_get_clientsManagement_LoginDossier_by_clientId_by_dossierId mit path_params_json {"clientId": …,
      "dossierId": …}'
    art: lesen
  - werkzeug: rv_get_clientsManagement_LoadTeamMembersForAnnualFile_by_annualFileId
    zweck: Auftragsteam (3.6) lesen; prüfen, ob der Dienstbenutzer des Agenten der Akte zugewiesen ist
    parameter: 'path_params_json {"annualFileId": dossierId aus Schritt 3}'
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadFinancialYears
    zweck: Geschäftsjahre der Jahresrechnung lesen (aktuelles Jahr, Vorjahr) mit Siegelstatus; Perioden für Anhang, Kontenansichten und Import
    parameter: keine Parameter (Dossierkontext aus Schritt 4). Ergebnis FinancialYearDto {index, from, to, editFrom, editTo, isActualFiscalYear, isSealed, periods[PeriodDto]}; Perioden
      aus periods entnehmen, isSealed für K2 merken; from/to mit openingDate/balancingDate aus Schritt 3 abgleichen
    art: lesen
  - werkzeug: rv_get_containerDefinitions_LoadContainerSections_by_containerId_by_subContainerId
    zweck: Navigationsbaum der Akte lesen und die Tabelle Bereich/Prüffeld → areaId (= navigationId), templateId, Kontenklassen aufbauen (Grundlage für K2–K17)
    parameter: 'path_params_json {"containerId": AnualFileDto.containerId, "subContainerId": AnualFileDto.subContainerId} (Schritt 3). Ergebnis ContainerNavigationItemDto: id (= areaId/navigationId,
      Kandidat), title, navigationDetail.code/prefix (Kandidat: «C1», «3.3», «10.9»), itemConfiguration.navigationComponentId, itemConfiguration.referenceId (Kandidat: templateId der
      Prüfschritte), itemConfiguration.defaultClassifications (Kontenklassen des Prüffelds), detailNavigationItems. Variante mit Bearbeitungsstand: rv_get_containerDefinitions_LoadContainerSectionsWithRegisterState_by_containerId_by_subContainerId'
    art: lesen
  - werkzeug: rv_get_containerDefinitions_LoadComponentDefinitions
    zweck: Komponententypen lesen, um je Bereich zu erkennen, was dort liegt (Prüfungshandlungen, Notizen, Dokumentcontainer, Protokolle, PBC, Fragebogen, Wesentlichkeit)
    parameter: keine Parameter. Ergebnis NavigationComponentDto {id, name, viewType, containerType}; Verknüpfung über itemConfiguration.navigationComponentId aus Schritt 7
    art: lesen
  - werkzeug: rv_get_containerDefinitions_GetNoteTypes
    zweck: Notiz-Kategorien und ihre type-Ids lesen (Pendenz, Wesentliche Feststellungen, Schlussbesprechung, Review) und im Kontext ablegen (für K7, K8, K11)
    parameter: keine Parameter. Ergebnis NoteTypeDto {id (integer), name, iconGlyph, isDeterminationNote}
    art: lesen
  - werkzeug: rv_post_clientsManagement_RollForwardAnualFile
    zweck: 'NICHT durch den Agenten: Fehlt die Jahresakte, legt der Mensch sie an bzw. schreibt sie fort (ebenso rv_put_clientsManagement_CreateOrUpdateAnualFile). revio_create_client
      ist gesperrt (OpenClaw deny, auch nicht auf Wunsch über den Agenten)'
    parameter: body_json RollForwardAnnualFileRequest {dossierId, containerId, title, balanceSheetDate} – nur Mensch
    art: nur_mensch
  menschliche_freigabe: 'Keine Schreibaktion. Der WP gibt Kunde, Geschäftsjahr und Stichtag vor; bei mehrdeutigem Treffer, fehlender Akte oder versiegelter/zur Siegelung beantragter
    Akte arbeitet der Agent nur lesend und meldet es. Kontext-Schlüssel wird bei jedem Zugriff geprüft; bei Abweichung Abbruch und Pendenz ^[konzept-ki-revisionsagent-2026__c009-1].
    Solange der geöffnete Kontext nicht der Akte des Auftrags entspricht, sperrt der Agenten-Code alle Schreibwerkzeuge. Kunden/Akten anlegen oder fortschreiben: nur Mensch; revio_create_client
    gesperrt.'
  offene_fragen:
  - Setzt revio_open_dossier (bzw. LoginDossier) den Dossierkontext serverseitig für alle folgenden rv_*-Aufrufe ohne dossierId (Sitzung/JWT)? Sperrt das Öffnen die Akte für andere Benutzer?
    Prüft rv_get_clientsManagement_TryLoginDossier_by_clientId_by_dossierId nur oder meldet es ebenfalls an (wichtig für den Kontextcheck K10 Schritt 10)?
  - Ist AnualFileDto.containerId die Containerdefinition (Vorlage, = containerDefinitionId) oder eine Instanz je Dossier? Davon hängen containerId/containerDefinitionId in K2–K17 ab.
  - Enthält navigationDetail.code die Akte-Nummern («3.3», «10.9», «C1»)? Ist itemConfiguration.referenceId die templateId der Prüfschritte? – mit der Datenkopie bestätigen.
  - Wie sind AnualFileStateDto.state-Werte zu lesen (offen, Review, versiegelt, archiviert)?
- id: K2
  aufgabe: Jahresrechnung/Saldenbilanz lesen, Konten je Prüffeld bestimmen; Import der Jahresrechnung vorbereiten (Prozess 1, Entscheid consis offen)
  wann: Nach K1; Import einmal pro Revision nach Eingang der definitiven Jahresrechnung, Kontenlesen vor jedem Prüffeld und vor analytischen Schritten (2xx)
  prozess: '1'
  schritte:
  - werkzeug: rv_get_financialStatement_LoadFinancialStatementState
    zweck: Stand der Jahresrechnung im Dossier lesen (bereits importiert? welche Schritte erledigt?)
    parameter: 'query_json {"clientId": K1} (GET mit Request-DTO LoadFinancialStatementStateRequest – Bindung query/body mit revio_describe_endpoint klären, K16)'
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadFinancialYears
    zweck: 'Siegelstatus prüfen: FinancialYearDto.isSealed des aktuellen Geschäftsjahrs (isActualFiscalYear = true) und des Vorjahrs. Versiegelt → keinen Import vorbereiten, nur lesen'
    parameter: keine Parameter (Dossierkontext); Ergebnis aus K1 Schritt 6 wiederverwendbar. FinancialYearDto {index, from, to, isActualFiscalYear, isSealed, periods}
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadSealHistory
    zweck: 'Nur ergänzend: Verlauf der Siegelaktionen lesen, wenn isSealed (Schritt 2) unklar ist oder vom Zustand der Akte (K1 Schritt 3) abweicht'
    parameter: keine Parameter (Dossierkontext)
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadAccountViewForSmartPanelOfDossier
    zweck: Bilanz, Erfolgsrechnung bzw. Saldenbilanz mit Werten aktuelles Jahr und Vorjahr lesen
    parameter: 'query_json {"clientId": K1, "dossierId": K1, "view": AccountItemsView-Wert (Bilanz/ER/Saldenbilanz – Enum ohne Werte in schemas.json, revio_describe_schema), "financialValuesOrigin":
      Enum-Wert}. Ergebnis AccountDto {id, number, title, values[] {period, backingValue}, appendixReferences, isBalance, details.classifications}. Ohne Ids im Dossierkontext: rv_get_financialStatement_LoadAccountView
      {view, financialValuesOrigin}'
    art: lesen
  - werkzeug: rv_get_containerDefinitions_GetAccountClassifications
    zweck: Kontenklassen (Klassifikationen) mit Nummernbereichen lesen; mit itemConfiguration.defaultClassifications aus K1 ergibt sich die Zuordnung Konto → Prüffeld
    parameter: keine Parameter. Ergebnis AccountClassificationDto {id, displayValue, numberRanges, rangesDisplay, baseType}
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadBalanceAccountsForClassifications
    zweck: Konten eines Prüffelds lesen (Kontenübersicht für die Prüfschritte)
    parameter: 'query_json {"classifications": itemConfiguration.defaultClassifications des Prüffelds (K1 Schritt 7), "hideZeroValues": false}'
    art: lesen
  - werkzeug: rv_get_auditActivities_LoadCoverSheet_by_containerId
    zweck: Kontenübersicht der Prüffelder mit Vorjahr, Veränderung und Kennzeichen «unter Nichtaufgriffsgrenze» lesen
    parameter: 'path_params_json {"containerId": K1}. Ergebnis CoverSheetDto.sections[].accountClassificationItems[].balanceItems: CoverPageBalanceItemDto {accountId, number, title,
      workingValues.currentValue/previousValue/changeValue, isBelowPickupValue, state, comment}'
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadKeyFigureView
    zweck: Kennzahlen 1.2 lesen (Grundlage analytische Schritte 2xx; Rechnen im Rechenmodul, nicht im Sprachmodell)
    parameter: Request-DTO FinancialValuesOrigin (Enum-Wert, K16)
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadLedgerAdjustements
    zweck: 10.2 Umbuchungsliste lesen (gebuchte/ungebuchte Umbuchungen, Wirkung auf das Ergebnis); Ablage und Abgleich in K17
    parameter: keine Parameter. Ergebnis LedgerAdjustementDto {debitAccount, creditAccount, value, text, isActive, profitChangeState}
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadHiddenReserves
    zweck: 10.3 Stille Reserven lesen (Bestand/Veränderung je Periode); Ablage und Abgleich in K17
    parameter: keine Parameter. Ergebnis HiddenReservesDto.periodsSummaries
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadAccountSystems
    zweck: 'Import: Kontenrahmen des Mandats bestimmen'
    parameter: keine Parameter → accountSystemId
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadImportTemplates
    zweck: 'Import: vorhandene Importvorlage/Mapping bestimmen'
    parameter: keine Parameter → mappingId
    art: lesen
  - werkzeug: rv_get_financialStatement_GetImportSimulation
    zweck: 'Import simulieren (Kandidat: ohne Speichern): Zuordnung, Vorzeichen der Passiven, Bilanzgleichheit und Totale prüfen. Bis zum Entscheid consis zu Prozess 1 endet die Kette
      hier (Ergebnis und unklare Zuordnungen als Pendenz K7; den Protokolleintrag schreibt der Agenten-Code ^[konzept-ki-revisionsagent-2026__c009-3])'
    parameter: 'query_json/body_json SimulateImportRequest {"accountSystemId": Schritt 11, "financialStatementTemplateId": Kandidat aus rv_get_financialStatementTemplates_LoadAvailableFinancialStatementTemplatesByContainer_by_containerId,
      "balanceSheetDate": balancingDate (K1), "balances": [{"number", "title", "balance", "assignment"}] aus definitiver Bilanz/ER in M-Files (PDF vom Agenten ausserhalb revio gelesen,
      Totale im Rechenmodul geprüft), "options": ImportOptions {changeAssetSign, changeLiabilitySign, changeEarningSign, changeExpenseSign, isDeleteMode: false}}'
    art: lesen
  - werkzeug: rv_post_financialStatement_CreateAccountItemsFromImport
    zweck: 'Kandidat (Prozess 1, Entscheid consis): Import-Anfrage anlegen (noch nicht übernommen). Wirkt in Bereich 1.1 (revio_bereich 1.1, nicht 10.1) und damit ausserhalb der Schreibgrenze
      4/10 → OpenClaw deny bis zum Entscheid, danach allow mit Freigabe; sonst nach Schritt 13 aufhören und Pendenz erfassen'
    parameter: 'body_json CreateAccountItemsFromImportRequest {"importRequestId": neue Id (Kandidat; im Kontext als «eigene» Import-Anfrage merken), "numberField", "titleField", "balanceFields":
      [], "numberOptions": [{"field", "decimalSeparator", "period": PeriodDto aus K1 Schritt 6}], "importOptions": wie Schritt 13 (isDeleteMode false), "mappingId": Schritt 12, "data":
      Zeilen aus M-Files, "assignmentField"}'
    art: kandidat
  - werkzeug: rv_get_financialStatement_LoadImportPreview_by_importRequestId
    zweck: Vorschau der Import-Anfrage kontrollieren (Bilanzgleichheit, Totale, Vorzeichen Passiven, nicht zugeordnete Konten); Abweichungen und unklare Zuordnungen → Pendenz (K7)
    parameter: 'path_params_json {"importRequestId": Schritt 14}; Request-DTO AccountItemsView (Enum-Wert)'
    art: lesen
    optional: true
    bedingung: nur nach Schritt 14 (Import-Anfrage = Kandidat, erst nach Entscheid consis)
  - werkzeug: rv_post_financialStatement_RejectImport
    zweck: 'Kandidat (Prozess 1, Entscheid consis): die eigene, in Schritt 14 dieses Laufs angelegte Import-Anfrage verwerfen, wenn die Vorschau (Schritt 15) Fehler zeigt. Nur für diese
      importRequestId und nur, wenn consis Prozess 1 schreibend erlaubt; sonst nur_mensch (OpenClaw deny). Fremde Import-Anfragen nie'
    parameter: 'body_json RejectImportRequest {"importRequestId": Schritt 14} – Abgleich der Id im Agenten-Code vor dem Aufruf'
    art: kandidat
  - werkzeug: rv_get_workpapers_LoadAreaHistory_by_areaId
    zweck: 'optional (Kandidat, deny): Kontrolle; den Protokolleintrag schreibt der Agenten-Code aus den eigenen Aufrufen und Antworten ^[konzept-ki-revisionsagent-2026__c009-3]. Inhalt
      (M-Files-Protokoll pro Mandat und Jahr, M-Files-Werkzeug ausserhalb des revio-MCP): Zeitstempel, Werkzeug, importRequestId, Quelle (M-Files-ID und Version der Jahresrechnung),
      Simulations-/Vorschauergebnis, Fehler und Abbrüche. Nach Schritt 14/16 HALT zur Kontrolle (Testphase).'
    parameter: 'path_params_json {"areaId": areaId 1.1 (K1, Kandidat)}; ohne Verlauf nur M-Files-Protokoll'
    art: kandidat
  - werkzeug: rv_post_financialStatement_AcceptImport
    zweck: 'NICHT durch den Agenten: Übernahme der Import-Anfrage in 1.1 nach Kontrolle. Verwerfen fremder bzw. nicht vom Agenten angelegter Import-Anfragen ebenfalls nur Mensch (eigene
      Anfrage: Schritt 16)'
    parameter: body_json AcceptImportRequest {"importRequestId"} – nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_financialStatement_ApplyAccountItemToStructure
    zweck: 'NICHT durch den Agenten: Kontenzuordnung und Struktur in Bereich 1.1 ändern; ebenso rv_post_financialStatement_ApplyAccountItemStructureFromCsv, rv_post_financialStatement_MoveAccountItem,
      rv_post_financialStatement_MoveAccountItems, rv_post_financialStatement_DetachAccountItemFromStructure, rv_post_financialStatement_ChangeAccountNumber, rv_post_financialStatement_ChangeAccountTitle.
      Einheitlich nur_mensch in Zuordnung, Ketten und klass'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_financialStatement_ReApplyDetachedItems
    zweck: 'NICHT durch den Agenten, gesperrt (OpenClaw deny): wirkt mit deleteFinal löschend'
    parameter: body_json ReApplyDetachedItemsRequest {importRequestId, detachedItems, newParentAccountId, deleteFinal, invertValues} – nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_financialStatement_SetBalanceValueForAccountItem
    zweck: 'NICHT durch den Agenten: Werte der Jahresrechnung ändern; ebenso rv_post_financialStatement_InvertValuesForPeriod, rv_post_financialStatement_ClearValuesForPeriod, rv_put_financialStatement_UpdateTaxConfiguration,
      rv_put_financialStatement_UpdateLossOffsetValue'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_financialStatement_UndoLastAction
    zweck: 'NICHT durch den Agenten: macht auch Aktionen Dritter rückgängig; ebenso rv_post_financialStatement_StartUndoSession'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_financialStatement_SetPeriodSealedState
    zweck: 'NICHT durch den Agenten: Periode versiegeln; ebenso Abschlussschritte setzen (rv_put_workpapers_UpdateDossierState)'
    parameter: 'body_json SetPeriodSealedStateBatchRequest {items: [{from, to, isSealed}]} – nur Mensch'
    art: nur_mensch
  menschliche_freigabe: 'Lesen frei. Prozess 1 schreibt in Bereich 1.1 und liegt damit ausserhalb der Schreibgrenze (nur Bereiche 4 und 10) ^[konzept-ki-revisionsagent-2026__c006-1].
    Bis consis über Prozess 1 entscheidet, sind auch CreateAccountItemsFromImport und RejectImport in OpenClaw deny: der Agent simuliert nur (Schritt 13), erfasst Pendenzen und protokolliert.
    Nach positivem Entscheid höchstens Schritt 14 und Schritt 16 (nur eigene importRequestId) mit OpenClaw-Freigabe, danach Halt zur Kontrolle ^[konzept-ki-revisionsagent-2026__c009-3].
    Übernahme (AcceptImport), alle Struktur- und Wertewerkzeuge, Undo und Siegel nur Mensch – einheitlich in Zuordnung, Ketten und klass. Unklare Zuordnungen als Pendenz ^[konzept-ki-revisionsagent-2026__c011-2].
    Jede Aktion und jeder Fehler mit Zeitstempel ins M-Files-Protokoll ^[konzept-ki-revisionsagent-2026__c009-3].'
  offene_fragen:
  - 'Konzept Prozess 1 («per PDF-Import einlesen … Konten zuordnen») vs. Schreibgrenze Bereiche 4/10: Darf der Agent Import-Anfragen anlegen (CreateAccountItemsFromImport) und eigene
    verwerfen (RejectImport) oder nur simulieren und Pendenzen erfassen? Entscheid consis.'
  - Kein PDF-Import-Endpunkt in der Liste (nur Datenimport CreateAccountItemsFromImport, Abacus-Datei rv_post_financialStatement_CreateAccountItemsFromAbacusFile, XBRL-Instanz lesen)
    – das Auslesen der PDF-Jahresrechnung bleibt beim Agenten ausserhalb revio. Einstufung des Abacus-Imports (revio_bereich 1.1) offen.
  - Ist CreateAccountItemsFromImport zweistufig (Vorschau → AcceptImport/RejectImport) oder legt es Konten sofort an? Wer vergibt importRequestId? Lässt sich RejectImport technisch (JWT/Agenten-Code)
    auf die eigene importRequestId begrenzen?
  - Enum-Werte AccountItemsView und FinancialValuesOrigin (in schemas.json ohne Werte); Bedeutung von CoverPageBalanceItemDto.state.
  - Führt Bereich 1.1 einen Verlauf (LoadAreaHistory) für Import-Anfragen?
- id: K3
  aufgabe: Wesentlichkeit 3.3 lesen und anwenden (nie ändern)
  wann: Nach K1, vor der Bearbeitung der Prüffelder; erneut vor dem Rapport (K11), um Änderungen durch den WP zu erkennen
  prozess: '2'
  schritte:
  - werkzeug: rv_get_workpapers_LoadMaterialityOfDossier
    zweck: 'Wesentlichkeit lesen: Gesamtwesentlichkeit, Toleranzwesentlichkeit, Nichtaufgriffsgrenze, Bezugsgrösse, Begründung, besondere Umstände, Siegelstatus'
    parameter: 'query_json {"clientId": K1, "dossierId": K1} (LoadMaterialityForDossierRequest). Ergebnis MaterialityDto: selectedReferenceSize, referenceSizes, maximumValues (Gesamtwesentlichkeit),
      toleranceValues (Toleranzwesentlichkeit), pickUpValues (Nichtaufgriffsgrenze) je {value, previousValue, percentage, informationText}, justificationOfMaterialityDetermination, specialCircumstances,
      specificMaterialityItems, isSealed. Ohne Parameter im Dossierkontext: rv_get_workpapers_LoadMateriality'
    art: lesen
  - werkzeug: rv_get_workpapers_LoadAuditFieldStrategy
    zweck: Wesentlichkeit, Planung und Risiken kompakt je Prüffeld lesen (für Umfang/Stichprobe im Prüfschritt)
    parameter: 'query_json {"areaCode": z. B. "C1", "areaId": areaId des Prüffelds (K1)}. Ergebnis AuditFieldStrategyDto {planning, materiality, riskDetails}'
    art: lesen
  - werkzeug: rv_get_containerDefinitions_LoadContainerDefinitions
    zweck: Vorgaben der Akte für Bezugsgrössen lesen, um die Plausibilität von Bezugsgrösse, Prozentsatz und Begründung zu prüfen (Rechenmodul)
    parameter: 'keine Parameter. ContainerDefinitionDto mit id = containerId (K1): materialityDefaults[] {title, percentage, minPercentage, maxPercentage, guidance, defaultJustificationText}'
    art: lesen
  - werkzeug: rv_put_workpapers_UpdateNote
    zweck: 'Nur bei Unplausibilität: Pendenz erfassen (Ablauf K7), nicht in 3.3 schreiben'
    parameter: 'body_json {"areaId": areaId Prüffeld A1 (Bereich 4, Kandidat), "note": {"id": leer (neu), "type": Pendenz-Id (K1), "title": "3.3 Wesentlichkeit: Plausibilität", "text":
      Bezugsgrösse, Prozentsatz, Begründung, festgestellter Widerspruch, "isClosed": false}} – Feldregeln wie K7 Schritt 3'
    art: vorbereiten
  - werkzeug: rv_put_workpapers_UpdateMateriality
    zweck: 'NICHT durch den Agenten: Wesentlichkeit festlegen oder ändern'
    parameter: body_json MaterialityDto – nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_workpapers_SetMaterialitySealState
    zweck: 'NICHT durch den Agenten: Wesentlichkeit siegeln/entsiegeln'
    parameter: nur Mensch
    art: nur_mensch
  menschliche_freigabe: 'Der WP legt die Wesentlichkeit fest und siegelt sie; der Agent liest sie und ändert sie nie ^[konzept-ki-revisionsagent-2026__c014-1]. Anwendung: Toleranzwesentlichkeit
    steuert Umfang und Stichprobe, Differenzen unter der Nichtaufgriffsgrenze nur protokollieren, Gesamtwesentlichkeit als Massstab für Wesentliche Feststellungen; ändert der WP die
    Werte, werden betroffene Schritte neu beurteilt und im Rapport gekennzeichnet ^[konzept-ki-revisionsagent-2026__c014-1]. Pendenz-Notiz (Schritt 4) mit OpenClaw-Freigabe.'
  offene_fragen:
  - Darf der Agent mit nicht gesiegelter Wesentlichkeit (isSealed = false) arbeiten oder wartet er auf das Siegel?
  - Konzept nennt 75 % (Toleranz) und 5 % (Nichtaufgriff); massgebend im Dossier sind toleranceValues/pickUpValues – bei Abweichung Pendenz?
  - 'Wo hängt eine Pendenz zur Wesentlichkeit: Prüffeld A1 (Bereich 4) oder Bereich 3.3 (ausserhalb der Schreibgrenze)?'
  - 'GET mit Request-DTO (LoadMaterialityOfDossier, LoadAuditFieldStrategy): Felder als query_json oder body_json?'
- id: K4
  aufgabe: Risikobeurteilung 3.1 und Strategische Planung 3.5 lesen (Prüfungstiefe, Priorität, bedeutsame Risiken)
  wann: 'Nach K1/K3, vor jedem Prüffeld (Ablauf je Schritt: Risiko und Strategie aus 3.1/3.5 berücksichtigen)'
  prozess: '2'
  schritte:
  - werkzeug: rv_get_workpapers_LoadRiskAssessments
    zweck: Risikobeurteilung je Prüffeld lesen (inhärentes Risiko, Kontrollrisiko, Prüfziele)
    parameter: keine Parameter (Dossierkontext). Ergebnis RiskAssessmentItemDto {id, title, classifications, inherentRiskState, controlRiskState, probabilityIndex, severityIndex, notes,
      auditObjectives[] {code, isActive}, value, previousValue}
    art: lesen
  - werkzeug: rv_get_workpapers_LoadRisks
    zweck: Bedeutsame Risiken und geplante Reaktionen lesen
