  - werkzeug: rv_post_workpapers_StoreStrategicalPlanningItem
    zweck: 'NICHT durch den Agenten: Strategie, Prüfungstiefe, Priorität, Zuweisungen ändern (auch Agent als «zugewiesener Mitarbeiter» eintragen)'
    parameter: body_json StoreStrategicalPlanningItemRequest – nur Mensch
