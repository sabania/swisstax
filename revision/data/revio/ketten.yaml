  prozess: '3'
  schritte:
  - werkzeug: rv_get_workpapers_LoadContainerDocuments_by_areaId
    zweck: Bereits abgelegte Unterlagen je Bereich 10.1–10.4 lesen (Dubletten vermeiden)
    parameter: 'path_params_json {"areaId": areaId 10.1, 10.2, 10.3 bzw. 10.4 (K1)} – je Bereich einmal. Ergebnis ContainerDocumentDto {id, kind, fileName, attachmentId, uploadedBy,
      uploadedAt}'
    art: lesen
  - werkzeug: rv_get_workpapers_LoadDetachedAttachements_by_areaId
    zweck: Lose Beilagen je Bereich 10.1–10.4 lesen
    parameter: 'path_params_json {"areaId": 10.x (K1)}'
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadAccountViewForSmartPanelOfDossier
    zweck: '10.1 / A1-303: Saldenbilanz in revio mit Saldenbilanz bzw. Hauptbuch aus M-Files abstimmen (Konten, Saldi, Totale; Rechenmodul)'
    parameter: 'wie K2 Schritt 4, "view": Saldenbilanz (Enum-Wert, K16)'
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadLedgerAdjustements
    zweck: '10.2: gebuchte und ungebuchte Umbuchungen mit der Umbuchungsliste aus M-Files abgleichen; Ergebniswirkung für A1-307 (Jahresgewinn ER ↔ Eigenkapital ↔ Antrag über die Verwendung
      des Bilanzgewinns)'
    parameter: keine Parameter. Ergebnis LedgerAdjustementDto {debitAccount, creditAccount, value, text, isActive, profitChangeState}
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadHiddenReserves
    zweck: '10.3 / A1-308 (A1-207): Bestand und Veränderung der stillen Reserven mit der Kundenaufstellung abstimmen; wesentliche Nettoauflösung als Hinweis für T1 (K14)'
    parameter: keine Parameter. Ergebnis HiddenReservesDto.periodsSummaries
    art: lesen
  - werkzeug: rv_get_financialStatement_LoadReportPackagesForAnualFile
    zweck: 'Kandidat, 10.4: Jahresrechnung der Akte mit der unterzeichneten Fassung aus M-Files vergleichen (A1-301, A1-305); prüfen, ob die VE vorliegt, unterzeichnet und datiert ist
      (A1-103)'
    parameter: query_json {"clientId", "dossierId"} (K1)
    art: lesen
  - werkzeug: rv_post_workpapers_AddDetachedAttachement
    zweck: 'Kandidat: nach dem Upload (K15) Saldenbilanz, Umbuchungsliste, Kundenaufstellung stille Reserven, unterzeichnete Jahresrechnung bzw. VE als lose Beilage des Zielbereichs
      10.x registrieren; entfällt, wenn die Datei über K15 Schritt 4 schon dort liegt'
    parameter: 'body_json CreateDetachedAttachementRequest {"areaId": 10.x, "attachementId": aus dem Upload (K15), "fileName": "<M-Files-ID>_v<Version>_<Titel>.pdf", "size"}'
    art: vorbereiten
  - werkzeug: rv_get_attachements_GetAttachementMetadata_by_attachementId
    zweck: Herkunft der Beilage = Mandatskontext prüfen
    parameter: 'path_params_json {"attachementId": Schritt 2 bzw. 7}'
    art: lesen
  - werkzeug: rv_post_workpapers_MoveDetachedAttachmentsToWorkingArea
    zweck: 'Kandidat: Unterlage aus den losen Beilagen im Bereich 10.x ablegen (Weg wie K8)'
    parameter: 'body_json MoveDetachedAttachmentsToWorkingAreaRequest {"attachmentIds", "areaId": 10.x, "entityId": Kandidat (offen), "targetSource": EntitySource-Wert (K16)}. StoreContainerDocuments_by_areaId
      nur als Alternative nach revio_describe_endpoint, bis dahin deny'
    art: vorbereiten
  - werkzeug: rv_get_workpapers_LoadContainerDocuments_by_areaId
    zweck: 'Kontrolle der Ablage: neue Unterlage vorhanden, bestehende Dokumente unverändert'
    parameter: 'path_params_json {"areaId": 10.x}'
    art: lesen
  - werkzeug: rv_put_auditActivities_UpdateDossierActivity
    zweck: Ergebnis ins Textfeld von A1-303, A1-307, A1-308 (Ablauf K6); bei A1-103 nur festhalten, ob die VE vorliegt, unterzeichnet und datiert ist (M-Files-ID) – Besprechen und Unterzeichnenlassen
      macht der WP
    parameter: wie K6 Schritt 3
    art: vorbereiten
  - werkzeug: rv_put_workpapers_UpdateNote
    zweck: Differenzen als Pendenz bzw. Wesentliche Feststellung mit Buchungsvorschlag (Ablauf K7); fehlende Unterlagen (z. B. VE fehlt oder ist nicht unterzeichnet, Kundenaufstellung
      stille Reserven fehlt) als Pendenz «PBC-Vorschlag:» (K8)
    parameter: wie K7 Schritt 3, areaId = 10.x bzw. A1
    art: vorbereiten
  - werkzeug: rv_get_workpapers_LoadAreaHistory_by_areaId
    zweck: 'optional (Kandidat, deny): Kontrolle; den Protokolleintrag schreibt der Agenten-Code aus den eigenen Aufrufen und Antworten ^[konzept-ki-revisionsagent-2026__c009-3]. Inhalt
      (M-Files-Protokoll pro Mandat und Jahr): Ablage, Abgleich und Notizen mit Zeitstempel, Quelle (M-Files-ID und Version), Berechnung und Fehlern.'
    parameter: 'path_params_json {"areaId": 10.x bzw. A1}'
    art: kandidat
  - werkzeug: rv_post_financialStatement_ApplyHiddenReserveItem
    zweck: 'NICHT durch den Agenten bis Entscheid consis (unklar = deny): stille Reserven erfassen; wirkt vermutlich auf HB II bzw. die ER-Klassifikation in Bereich 1. Ebenso rv_post_financialStatement_ApplyIncomeClassificationItem,
      rv_post_financialStatement_ReorderHiddenReserveItems, rv_post_financialStatement_ApplyLegacyHiddenReserves, rv_delete_financialStatement_DeleteHiddenReserveItems. Bis dahin: abstimmen,
      Kundenaufstellung als Beilage, Differenzen als Pendenz'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_post_financialStatement_AppendLedgerAdjustement
    zweck: 'NICHT durch den Agenten: Umbuchungen erfassen oder verbuchen; ebenso rv_put_financialStatement_UpdateLedgerAdjustement, rv_put_financialStatement_UpdateLedgerAdjustementActiveState,
      rv_delete_financialStatement_RemoveLedgerAdjustements, rv_post_financialStatement_CreateNewLedgerAdjustementVersion, rv_get_financialStatement_ImportLedgerAdjustments (Kandidat:
      schreibt trotz GET)'
    parameter: nur Mensch
    art: nur_mensch
  - werkzeug: rv_delete_workpapers_DeleteContainerDocuments_by_areaId
    zweck: 'NICHT durch den Agenten: Dokumente in 10.x löschen; Status in Bereich 10 (rv_post_workpapers_ProcessAreaState) setzt ebenfalls nur der Mensch'
    parameter: nur Mensch
    art: nur_mensch
  menschliche_freigabe: Lesen frei; Ablage (Schritte 7 und 9), Textfeld (Schritt 11) und Notiz (Schritt 12) mit OpenClaw-Freigabe, nur in Bereich 10 und 4 ^[konzept-ki-revisionsagent-2026__c006-1].
    Stille Reserven erfasst bis zum Entscheid consis nur der Mensch (ApplyHiddenReserveItem u. a. unklar = deny). Umbuchungen erfasst und verbucht nur der Mensch ^[flussdiagramm-revisionsagent-2026__s001-5];
    Buchungsvorschläge nur als Notiz, ohne Verbuchung ^[konzept-ki-revisionsagent-2026__c015-1]. Status in Bereich 10 setzt der Mensch ^[konzept-ki-revisionsagent-2026__c008-1]. Die
    VE bespricht der WP mit dem Kunden und lässt sie unterzeichnen (A1-103); der Agent prüft nur das Vorliegen. Jede Aktion ins M-Files-Protokoll ^[konzept-ki-revisionsagent-2026__c009-3].
  offene_fragen:
  - Ist 10.1 Saldenbilanz eine eigene Ablage (Dokument) oder dieselbe Kontenansicht wie in Bereich 1?
  - Sind 10.1–10.4 Dokumentcontainer (ContainerDocumentKind) wie 10.9? Welche entityId und welcher targetSource gelten für MoveDetachedAttachmentsToWorkingArea?
  - Darf der Agent stille Reserven erfassen (ApplyHiddenReserveItem u. a.)? Entscheid consis; Umgang mit stillen Reserven ist bereits für C1 offen ^[konzept-ki-revisionsagent-2026__c015-2].
  - Liefert LoadReportPackagesForAnualFile die Jahresrechnung, und wo liegt die unterzeichnete Fassung (10.4 oder 10.5)?
  - Wirkt rv_get_financialStatement_ImportLedgerAdjustments schreibend (Import trotz GET)?
