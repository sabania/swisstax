  hinweise: 'Kategorien-Ids: rv_get_containerDefinitions_GetNoteTypes → NoteTypeDto {id, name, iconGlyph, isDeterminationNote}; Zuordnung Pendenz/Wesentliche Feststellungen/Schlussbesprechung/Review
    über name (isDeterminationNote vermutlich «Wesentliche Feststellungen», Kandidat). Lesen je Kategorie: LoadDossierNotesByTypeRequest {noteType, onlyOpenNotes}. Erfassen: UpdateNoteRequest
    {areaId (Prüffeld/Register), note: NoteDto {id, areaId, title, text, type (noteType-Id), priority, isClosed, hasAppointment, appointment, assignments[user, externUserText], attachements[attachementId,
    fileName, fileSize], showOutsideDossier, originNoteId, createdBy}}. Kein Create-Endpunkt → UpdateNote ist vermutlich Upsert (am Testmandat prüfen). Feldregeln: immer isClosed=false,
    showOutsideDossier=false; bestehende id nur bei eigenen Notizen (createdBy = Dienstbenutzer), fremde nie ändern. Inhalt: Pendenz = fehlende Unterlage/ungeklärter Sachverhalt/«Frage
    an Kunde» mit Konto, Datum, Betrag, Schritt-Id; PBC-Vorschläge (10.10) als Pendenz mit Titel-Präfix «PBC-Vorschlag»; Wesentliche Feststellungen = möglicher Fehler mit Betrag und
    begründetem Buchungsvorschlag (Soll/Haben/Betrag, keine Verbuchung); Schlussbesprechung = Punkte für das Gespräch WP–Kunde; Review = nur lesen (Rückmeldungen des WP, Konzept c007-1,
    vom Agenten im Rapport aufgreifen). Beilage an Notiz: Datei zuerst ins Register (AddDetachedAttachement), dann MoveAttachmentsToNote {noteId, attachements[ids]} – nur an eigene Notizen
    und nur, wenn der Nachweis nicht direkt am Prüfschritt liegt. Kandidat: rv_post_workpapers_CreateNotesReport (Notizenbericht für Rapport, «vorbereiten (Kandidat, Report-Job)»). Nie:
    Löschen jeder Art; NoteChanged (enthält isClosed = Erledigen); CreateNoteFeedback {noteId, feedback, updateIndex} (Review-Antwort; Kategorie Review ist dem WP vorbehalten – Kandidat
    erst nach Entscheid consis, nie als Erledigung); MoveNoteAttachments (MoveNoteAtttachmentsRequest {noteId, attachements, insertPosition}: Umordnen von Beilagen, auch fremder Notizen
    – nicht benötigt); MoveNotes (Reihenfolge – nicht benötigt); persönliche Aufgaben/Notizen ausserhalb des Dossiers. Da UpdateNote das Feld isClosed trägt, kann OpenClaw das Erledigen
    nicht je Werkzeug sperren → JWT-Rechte oder Prüfung im Agenten-Code.'
