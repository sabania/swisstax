  parameter: 'Kette (Ids existieren erst im echten Dossier): (1) clientId: rv_get_clientsManagement_LoadClients (liefert alle Kunden – sofort auf den beauftragten Kunden einschränken;
    Komfort: revio_find_clients, nur in .md). (2) dossierId und containerId: rv_get_clientsManagement_LoadAnualFilesForClient_by_clientId (Pfad clientId) → AnualFileDto: id (= dossierId),
    containerId, subContainerId, previousDossierId (Vorjahresakte), balancingDate, openingDate, state; Komfort revio_list_dossiers. (3) Kontext: rv_get_clientsManagement_TryLoginDossier_by_clientId_by_dossierId,
    dann rv_get_clientsManagement_LoginDossier_by_clientId_by_dossierId (Komfort revio_open_dossier); Workpapers-/FinancialStatement-Werkzeuge ohne dossierId wirken vermutlich auf dieses
    Dossier. (4) navigationId/areaId/templateId je Prüffeld: rv_get_containerDefinitions_LoadContainerSections_by_containerId_by_subContainerId → ContainerNavigationItemDto: id (Kandidat
    navigationId = areaId), title, navigationDetail.code/prefix (A1…T1, 10.9 …), itemConfiguration.referenceId (Kandidat templateId), navigationComponentId, defaultClassifications (Kontenklassen
    des Prüffelds), smartPanelDefinitionId, detailNavigationItems; alternativ rv_get_workpapers_LoadAnnualFileState (LoadSectionStateRequest: sections) → AreaItemStateDto: areaId, areaCode,
    areaTitle, referenceId, isCompleted. (5) containerDefinitionId (Katalog, Risikodefinition): Kandidat = AnualFileDto.containerId bzw. ContainerDefinitionDto.id aus rv_get_containerDefinitions_LoadContainerDefinitions.
    (6) activityId/activityItemId und cellId: aus rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId (Pfad containerId, templateId) → TemplatedRow: id, rows[Row:
    cells[Cell: cellId, cellType, isIdCell, canEdit, content, isVised, visaUserId, visaDate]], isDisabled, isVised, hasPreviousPeriodItem, attachements; Abgleich mit dem Katalog über
    Nummer (Id-Zelle) + Text. (7) Body-Felder: Textfeld rv_put_auditActivities_UpdateDossierActivity = UpdateAuditActivityDossierFielddDto {containerId, activity: TemplatedRow, cell:
    Cell}; alternativ rv_put_auditActivities_UpdateDossierActivityItemTemplateField = UpdateActivityItemTemplateFieldsRequest {containerId, navigationId, activityItemId, changedFields[ActivityTemplateCellContentDto:
    cellId, content, isIdField]}; Massenweg (Kandidat) rv_get_auditActivities_ClaudeImportAuditActivities = ClaudeImportAuditActivitiesRequest {prueffelder[navigationId, templateId,
    code, eintraege[nr, ergebnis, referenceText, attachments[fileName, attachmentId]]]}. Beilage rv_post_auditActivities_AddAttachementsToAuditActivity = AppendAuditActivityAttachementsRequest
    {containerId, activityId, attachementInfo[AttachementInfo: attachementId, name, isTemporary]}; Datei vorher ins Register: rv_post_workpapers_AddDetachedAttachement = CreateDetachedAttachementRequest
    {areaId, attachementId, fileName, size}. Prüfschritt-Vorlage rv_get_auditActivities_LoadAuditActivityTemplate = LoadAuditActivityTemplatesRequest {containerId, navigationId, templateId}.
    Kontenkommentar SetCoversheetBalanceItemCommentDto {accountId, comment}. Belegkommentar UpdateDocumentationCommentRequest {areaId, documentationId, itemId, comment}. Konten je Prüffeld:
    LoadBalanceAccountsForClassificationsRequest {classifications (aus defaultClassifications bzw. rv_get_containerDefinitions_GetAccountClassifications), hideZeroValues}; LoadAccountViewRequest
    {view: AccountItemsView, financialValuesOrigin}. Belege je Konto: LoadDocumentationItemsRequest {areaId, documentationId} (documentationId Kandidat = accountId); Ablage AddFilesToDocumentationRequest
    {areaId, documentationId, items[DocumentationItemDto: id, userId, updatedAt, state, type, currentStatus, attachementId, title, size, informationText]}. Notizen: UpdateNoteRequest
    {areaId, note: NoteDto}. Strategie: LoadAuditFieldStrategyRequest {areaCode, areaId}; Risiken LoadRisksRequest {areaId}; Wesentlichkeit LoadMaterialityForDossierRequest {clientId,
    dossierId}; Bereichsstatus LoadAreaStateRequest {areaId, trackUser=false}. (8) Perioden: kein financialPeriodId-Feld; rv_get_financialStatement_LoadFinancialYears liefert FinancialYearDto
    {index, from, to, editFrom, editTo, isActualFiscalYear, isSealed, periods[PeriodDto: from, to, displayName]}; die «ForFinancialPeriod»-Werkzeuge (Anhang) nehmen from/to; Versiegelung
    über FinancialYearDto.isSealed. (9) Vorjahr ohne Kontextwechsel: rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId (PreviousPeriodAuditActivitiesReviewDto:
    auditActivityGroups, hasPreviousPeriodItems), rv_get_auditActivities_GetActivityItemFromPreviousPeriod_by_containerId_by_templateId_by_activityId, Beilagen des Vorjahres rv_get_attachements_GetPreviousPeriodAttachementMetadata_by_attachementId,
    Vorjahreswesentlichkeit rv_get_workpapers_LoadMaterialityOfDossier mit dossierId = previousDossierId, Vorjahreswerte in CoverSheetBalanceItemValuesDto.previousValue und AccountDto.values
    je PeriodDto. Kontextwechsel auf previousDossierId nur als letzte Option und nur lesend: der Agenten-Code sperrt alle Schreibwerkzeuge, solange der Kontext nicht der aktuellen Akte
    entspricht; danach Kontext mit TryLoginDossier/AnualFileDto prüfen (Regel 6 in Bereich 0). Enum-Werte (AccountItemsView, FinancialValuesOrigin, CellTypes) fehlen in schemas.json
    → revio_describe_schema/Hersteller.'
  hinweise: 'Ablauf je Prüffeld: Kontext prüfen → Prüffeld-Ids (4) → Schritte laden (6) → je Schritt: Kennzeichnung/Typ aus Katalog, Risiko/Strategie (LoadRisks, LoadAuditFieldStrategy),
    Wesentlichkeit → Nachweise (M-Files, Register, Kontenübersicht) → Textfeld (Feststellung, Fundstelle mit M-Files-ID/Version, Auswahl und Umfang, abgedeckte Prüfziele, Status «vorbereitet/mit
    Feststellungen/teilweise/nicht bearbeitet») → Beilage → Notiz bei Pendenz/Feststellung → Visum offen lassen → Protokolleintrag (Audit Trail, Konzept c009-3: Aktion, Werkzeug, Ids,
    Quelle, Berechnung, Ergebnis oder Fehler mit Zeitstempel, pro Mandat und Jahr in M-Files). Vor jedem Schreiben frisch laden; nie in Schritte schreiben, die isVised=true oder isDisabled=true
    sind oder canEdit=false haben; Inhalt nur ergänzen, menschliche Einträge nicht überschreiben. FELDREGELN je erlaubtem Schreibwerkzeug (Prüfung im Agenten-Code; die eigentliche Sperre
    sind die JWT-Rechte des Dienstbenutzers): UpdateDossierActivity/UpdateDossierActivityItemTemplateField nur die Textzelle senden, nie Cell.isVised, visaUserId, visaDate, visaText;
    AddAttachementsToAuditActivity nur an Schritte mit canEdit=true, isVised=false, isDisabled=false; AddFilesToDocumentation items[].state=false, currentStatus nicht setzen – ✓ je Beleg
    nur Mensch; SetCoversheetBalanceItemComment und UpdateDocumentationComment ersetzen den bestehenden Kommentar → frisch lesen, bestehenden Text übernehmen und ergänzen; UpdateNote
    isClosed=false, showOutsideDossier=false, bestehende id nur bei eigenen Notizen (createdBy = Dienstbenutzer); LoadAreaState trackUser=false; AddDetachedAttachement/MoveDetachedAttachmentsToWorkingArea
    nur mit areaId eines Registers in Bereich 4 oder 10. Kontenübersicht: LoadCoverSheet_by_containerId (CoverSheetDto: sections, accountClassificationItems[accountclassification, balanceItems[CoverPageBalanceItemDto:
    accountId, number, title, workingValues{currentValue, previousValue, changeValue}, state, comment, isBelowPickupValue]], hiddenReservesClassificationItems) – Filter auf die Klassen
    des Prüffelds; state je Konto ist vermutlich das Häkchen → nur Mensch (SetCoversheetBalanceItemState), comment → Agent über SetCoversheetBalanceItemComment. Kommentarlisten eines
    Bereichs (UpdateAreaComments) ersetzen alle Kommentare, auch fremde → nur Mensch. Neue Prüfschritte einfügen (InsertDossierAuditActivityItem) oder abwählen/deaktivieren = Umfangsentscheid
    WP → nur Mensch. Grenze technisch: OpenClaw sperrt je Werkzeug; Visum (Cell.isVised), Abschluss und Freigabe sind teils Felder in erlaubten Bodies → serverseitige Rechte des Dienstbenutzers
    (JWT) sind die eigentliche Sperre. UpdateDossierActivity vs. UpdateDossierActivityItemTemplateField vs. ClaudeImportAuditActivities: welches Werkzeug das Textfeld eines Katalogschritts
    korrekt füllt, am Testmandat bestimmen; bis dahin UpdateDossierActivity als Hauptweg (Kandidat). Alle wiederkehrenden Schritte: x-320 Anhang, x-321 stille Reserven, x-322 Dauerakten
    siehe prueffeld_besonderheiten.'
