  hinweise: 'Ob 2.1/2.2/2.4 als Checkliste (LoadChecklistRequest: areaId, checklistId) oder dynamisches Formular (LoadDynamicFormsDataRequest: areaId) umgesetzt sind, zeigt die Komponente
