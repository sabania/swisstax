  hinweise: 'Alle Zuordnungen sind aus Werkzeugname, Pfad und Body-DTO (revio-schemas.json) abgeleitet; die Spalte «beschreibung» der CSV ist bei allen 840 rv_*-Werkzeugen leer. Vor
    jeder Schreibfreigabe in OpenClaw am Testmandat bestätigen. Die Komfortwerkzeuge revio_find_clients, revio_list_dossiers und revio_open_dossier entsprechen LoadClients, LoadAnualFilesForClient_by_clientId
    und LoginDossier_by_clientId_by_dossierId; sie stehen nur in revio-mcp-werkzeuge.md, nicht in der CSV (CSV = 840 rv_*-Zeilen, nicht 849). LoginDossier ist GET, setzt aber den Dossier-Kontext
    auf dem Server: die meisten Workpapers-/FinancialStatement-Werkzeuge haben keinen dossierId-Parameter und arbeiten vermutlich auf dem angemeldeten Dossier (Kandidat, testen). Vor
    jedem Schreibaufruf Kontext gegen AnualFileDto (clientId, id, balancingDate) prüfen; bei Abweichung abbrechen und Pendenz. revio_call (generischer Aufruf mit method/path) umgeht
    die Sperre je Werkzeug in OpenClaw und ist gesperrt (deny, auch nicht für Menschen über den Agenten); ebenso revio_create_client. LoadActiveAreaUsers_by_areaId vor dem Schreiben
    nutzen, um gleichzeitige Bearbeitung durch Menschen zu erkennen (Zweck Kandidat). ALLGEMEINE REGELN (gelten für alle Bereiche): (1) Eine Einstufung je Werkzeug: OpenClaw kennt je
    Werkzeug nur allow oder deny. Steht ein Werkzeug in mehreren Bereichen verschieden, gilt die strengste Einstufung (nur_mensch > Kandidat > vorbereiten > lesen); die harmonisierte
    Liste steht im Abschnitt «OpenClaw». (2) «Kandidat» bzw. «unklar» heisst bei schreibenden Werkzeugen: deny in OpenClaw bis Entscheid der Fachperson (consis) und Bestätigung am Testmandat;
    danach höchstens vorbereiten mit Auflagen. Bei reinen Lesewerkzeugen heisst «Kandidat» nur «Eignung unbestätigt». (3) Allow-Liste lesen = nur die Lesewerkzeuge dieser Zuordnung (Abschnitt
    «OpenClaw»); alle übrigen Lesewerkzeuge deny, weil sie über die Akte hinausreichen (alle Mandate und Archive, Firmen-QS, Personendaten, z.B. rv_get_clientsManagement_LoadAllAnualFiles,
    rv_get_clientsManagement_LoadArchiveForYear_by_year, rv_get_clientsManagement_LoadMandateRotationOverview, rv_get_clientsManagement_LoadFilesReadyForArchive_by_userId) oder trotz
    GET schreiben. (4) rv_get_workpapers_LoadAreaState nur mit trackUser=false aufrufen (LoadAreaStateRequest {areaId, trackUser}; trackUser=true registriert vermutlich Präsenz). rv_get_containerDefinitions_GetContainerTaxonomyLock_by_containerId
    könnte eine Sperre setzen → Kandidat «evtl. schreibend», deny. (5) rv_get_clientsManagement_LoadClients liefert alle Kunden: Ergebnis sofort auf den beauftragten Kunden einschränken,
    nichts davon speichern oder weitergeben. (6) Vorjahr ohne Kontextwechsel lesen: zuerst rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId,
    rv_get_auditActivities_GetActivityItemFromPreviousPeriod_by_containerId_by_templateId_by_activityId, rv_get_attachements_GetPreviousPeriodAttachementMetadata_by_attachementId, rv_get_workpapers_LoadMaterialityOfDossier
    mit dossierId = previousDossierId und die Vorjahreswerte in LoadAccountView/LoadCoverSheet. Ein Kontextwechsel (LoginDossier auf previousDossierId) nur als letzte Option: Solange
    der angemeldete Kontext nicht der aktuellen Akte entspricht, sperrt der Agenten-Code alle Schreibwerkzeuge; nach der Rückkehr den Kontext mit TryLoginDossier_by_clientId_by_dossierId
    bzw. AnualFileDto prüfen. Versiegelte oder archivierte Vorjahre nicht öffnen (Archivzugriff wird protokolliert; LogArchiveAccess ist gesperrt). (7) Protokoll (Audit Trail, Konzept
    c009-3): jeder Schreibaufruf und jeder Fehler mit Zeitstempel, Werkzeug, Ids (dossierId, areaId, activityId bzw. noteId), Quelle (M-Files-ID und Version) und Ergebnis, abgelegt pro
    Mandat und Jahr in M-Files. (8) Teil B der IDEE (Vorlage zuordnung_pruefschritte.csv, 538 Zeilen, Ids leer) ist nicht Teil dieser Zuordnung; Ableitung je Schritt: art aus Kennzeichnung
    und Typ gemäss schritt_typen (WP → nur_mensch, «?» → lesen wie WP, 4xx ohne Anweisung → lesen, übrige → vorbereiten), Werkzeuge aus prueffeld_standard plus prueffeld_besonderheiten
    (x-320/321/322 und Prüffeld).'
