  hinweise: 'Ableitung: strengste Einstufung über alle Abschnitte (nur_mensch > Kandidat > vorbereiten > lesen); StoreChecklistData und StoreDynamicFormDataItem sind in 4/10 Kandidat,
    in 2/3/6/7/9 nur Mensch → deny. Deny gilt zusätzlich für alle übrigen nur_mensch-Einträge der Bereiche, für die Komfortwerkzeuge revio_call und revio_create_client (gesperrt, umgehen
    die Sperre je Werkzeug bzw. legen Kunden an; nur in revio-mcp-werkzeuge.md) und für jedes nicht genannte rv_*-Werkzeug. revio_find_clients, revio_list_dossiers, revio_open_dossier,
    revio_describe_endpoint, revio_describe_schema, revio_search_endpoints und revio_server_version sind lesend und getrennt freizugeben (nicht in der CSV). Gesperrt (Systemfunktion
    bzw. löschend/mandatsfremd, auch nicht für Menschen über den Agenten): ReApplyDetachedItems (deleteFinal), UpdateAttachementsMetadata (dossierId/clientId), InitializeSnapshareTransfer_by_transferId,
    ProcessSnapshareDownloads, RegisterLastUserReportForChangeNotification, ReleaseReportWatcher_by_watcherId, LogArchiveAccess. Befristete Freigabe nur je Auftrag: GeneratePdfReport
    (Prozess 6, isArchiveJob=false); nach Entscheid consis evtl. CreateAccountItemsFromImport und RejectImport (Prozess 1, nur eigene importRequestId). Lese-Kandidaten (z.B. LoadContainerTemplateSections,
    LoadAreaHistory_by_areaId, LoadXbrlInstance) dürfen nach Bestätigung des Zwecks am Testmandat auf allow; GetContainerTaxonomyLock_by_containerId erst, wenn feststeht, dass es keine
    Sperre setzt. FELDREGELN je Schreibwerkzeug (für Agenten-Code bzw. JWT-Rechte; OpenClaw prüft keine Felder): UpdateDossierActivity/UpdateDossierActivityItemTemplateField – nur Textzelle,
    nie Cell.isVised, visaUserId, visaDate, visaText; nur Schritte mit canEdit=true, isVised=false, isDisabled=false. AddAttachementsToAuditActivity – gleiche Schrittbedingung. AddFilesToDocumentation
    – items[].state=false, currentStatus nicht setzen. SetCoversheetBalanceItemComment, UpdateDocumentationComment – bestehenden Kommentar übernehmen, nur ergänzen. UpdateNote – isClosed=false,
    showOutsideDossier=false, bestehende id nur bei eigenen Notizen (createdBy = Dienstbenutzer). MoveAttachmentsToNote – nur an eigene Notizen. AddDetachedAttachement, MoveDetachedAttachmentsToWorkingArea
    – areaId nur Register in Bereich 4 oder 10. LoadAreaState – trackUser=false. Nach Freigabe: GeneratePdfReport isArchiveJob=false; CreateAccountItemsFromImport ImportOptions.isDeleteMode=false;
    AppendPermanentFiles/UpdatePermanentFile PermanentFileDto.deletedAt nie setzen. In gesperrten Werkzeugen (zur Begründung): StorePbcWorkspace/StoreQuestionnaire publishAfter, validUsers,
    notificationRecipients; ReApplyDetachedItems deleteFinal; UpdateAttachementsMetadata clientId/dossierId; NoteChanged isClosed; StoreChecklistData Cell.isVised/visa*; UpdateDocumentationItems
    state. Ketten und klass sind auf diese Liste abzustimmen (offene Frage OpenClaw-Liste).'
