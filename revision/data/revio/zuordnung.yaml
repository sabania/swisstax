    Container-Fragebogen (LoadContainerQuestionnaire_by_containerId: dynamicFormId, isClosed, conditions[formFieldId, formFieldValue, deactivatedRegisters]) steuert, welche Register/Prüffelder
    aktiv sind – lesen ja, schliessen (SetContainerQuestionnaireClosedState) nie. Bereichsneutrale Schreibwerkzeuge rv_post_checklists_StoreChecklistData, rv_post_workpapers_StoreDynamicFormDataItem
    und rv_post_workpapers_StoreDynamicFormPanelAttachment: die areaId steht im Body, Checklisten-Zellen tragen Visumsfelder (Cell.isVised, visaUserId, visaDate, visaText). Einstufung
    in OpenClaw: deny, bis (a) die Komponente der Abschliessenden Beurteilung und der Register in 4/10 am Testmandat bestimmt ist und (b) das JWT des Dienstbenutzers Schreibrechte nur
    je Register in 4/10 und kein Visumsrecht hat. Danach höchstens vorbereiten (Kandidat) mit Auflage areaId ∈ {Register in Bereich 4 und 10}; in 2, 3, 6, 7 und 9 bleiben sie nur Mensch.
    LoadMandateRotationOverview (Übersicht über alle Mandate) wird nicht freigegeben. LoadShareRegister_by_asOf (Aktienbuch per Stichtag) wird auch für P1, D1, H1, H2, M1, N1 gelesen.
