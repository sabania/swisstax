  hinweise: 'Details und Parameter: siehe prueffeld_standard. Kandidaten sind deny bis Entscheid bzw. Test (Regel in Bereich 0). nur_mensch enthält auch Vorlagen-/Katalog-Werkzeuge (Template,
    AuditProcedureCatalog, auditDefinitons) – die ändern das Prüfprogramm aller Dossiers und sind für den Agenten nie freizugeben. InsertDossierAuditActivityItem fügt einen Prüfschritt
    ins Dossier ein = Umfangsentscheid des WP → nur Mensch. Gefahr im Body: UpdateDossierActivity schickt eine Cell; Cell enthält auch visaUserId, visaDate, visaText, isVised – ein Visum
    liesse sich technisch über dasselbe Werkzeug setzen. OpenClaw sperrt nur je Werkzeug, nicht je Feld → Visumsrecht muss serverseitig über den Dienstbenutzer/JWT fehlen. UpdateAreaComments
    (UpdateAreaCommentsRequest {areaId, comments[AreaStateCommentDto: comment, user, date]}) ersetzt die ganze Kommentarliste eines Bereichs, vermutlich Fusszeile bzw. Review (Konzept
    c008-1) → nur Mensch. Kommentare zu Konten nur über SetCoversheetBalanceItemComment (SetCoversheetBalanceItemCommentDto {accountId, comment}), zu Belegen nur über UpdateDocumentationComment
    (UpdateDocumentationCommentRequest {areaId, documentationId, itemId, comment}); beide ersetzen den bestehenden Kommentar → vorher frisch lesen, bestehenden Text übernehmen und nur
    ergänzen (Wirkung am Testmandat bestätigen). UpdateDocumentationItems (DocumentationItemsDto mit state und items[].state, vermutlich ✓ je Beleg) → nur Mensch. UpdateAttachementsMetadata
    (AttachementDto mit dossierId, clientId, source) kann eine Beilage einem anderen Mandat oder einer anderen Akte zuordnen → gesperrt; Umbenennen nur über RenameAuditActivityAttachment
    bzw. ChangeAttachmentTitle. AddFilesToDocumentation: Feldregel items[].state=false, currentStatus nicht setzen (✓ je Beleg nur Mensch). GetOvertakePreviousPeriodAuditActivitiesResult
    (GET!) übernimmt Vorjahresschritte samt Beilagen in das Dossier (Antwort: overtakenActivitiesCount, skippedVisedActivitiesCount) → Massenänderung, nur Mensch. ClaudeImportAuditActivities
    (GET mit Body: prueffelder[navigationId, templateId, code, eintraege[nr, ergebnis, referenceText, attachments[fileName, attachmentId]]]) passt genau auf den Katalog (Prüffeld-Code
    + Schrittnummer) und wäre der Massenweg für Textfelder und Beilagen – Kandidat, Zweck und Wirkung (Überschreiben? Visum?) beim Entwickler bestätigen. Abschliessende Beurteilung je
    Prüffeld: Komponente nicht eindeutig (Kandidat dynamisches Formular/ICS-Beurteilung, Hinweis MigrateLegacyFinalAssessment); StoreDynamicFormDataItem deshalb im Prüffeld nur Kandidat
    (deny bis (a) Komponente bestimmt und (b) JWT ohne Visumsrecht, danach Auflage areaId ∈ {Register in 4, 10}, siehe Bereich 2) und nie für die Abschliessende Beurteilung. Dauerakten
    (AppendPermanentFiles, UpdatePermanentFile): unklar, deny bis Entscheid, siehe x-322. Schätzungen (StoreAccountingEstimate, StoreAccountingEstimateAttachment): unklar, deny bis Entscheid
    «Delkredere». CreateAuditActivityReport und CreateAccountDocumentationReport: «vorbereiten (Kandidat, Report-Job)».'
