  hinweise: 'Bereich 1 liegt ausserhalb der Schreibzone (nur 4 und 10); Prozess 1 schreibt aber nach 1.1 – Entscheid consis offen (siehe offene Fragen). Einheitliche Einstufung bis dahin
    (gilt auch für 10.1, die Ketten und klass): Simulation und Vorschau lesen = lesen (GetImportSimulation ist ein Probelauf, LoadImportPreview_by_importRequestId liest die Vorschau).
    Vorschau anlegen (CreateAccountItemsFromImport) und verwerfen (RejectImport, nur für die vom Agenten selbst angelegte importRequestId) = Kandidat, also deny bis zum Entscheid zu
    Prozess 1, danach vorbereiten mit Freigabe je Aufruf. Alle Struktur- und Wertewerkzeuge (ApplyAccountItemToStructure, ApplyAccountItemStructureFromCsv, MoveAccountItem, MoveAccountItems,
    DetachAccountItemFromStructure, ChangeAccountNumber, ChangeAccountTitle, InvertValuesForPeriod, SetBalanceValueForAccountItem, ClearValuesForPeriod) sowie AcceptImport, UndoLastAction
    und StartUndoSession (machen auch Aktionen Dritter rückgängig) = nur Mensch. ReApplyDetachedItems (ReApplyDetachedItemsRequest mit deleteFinal, wirkt löschend) = gesperrt. CreateAccountItemsFromAbacusFile
    (importRequestId, importContent, importOptions, mappingId) ist ein alternativer Importweg: bis zum Entscheid nur Mensch, danach gleich einstufen wie CreateAccountItemsFromImport.
    AcceptImport = Halt zur Kontrolle (Testphase, Konzept c009-3: falsche Kontenzuordnung verfälscht alle Folgeprüfungen), danach Mensch oder ausdrückliche Freigabe. Für den PDF-Import
    der Oberfläche gibt es keinen eigenen Endpunkt: der Agent liest die definitive Bilanz/ER aus M-Files, extrahiert die Zeilen und übergibt sie an CreateAccountItemsFromImport (CreateAccountItemsFromImportRequest:
    importRequestId, numberField, titleField, balanceFields, numberOptions[field, decimalSeparator, period], importOptions, mappingId, data, assignmentField). Vorzeichen der Passiven:
    ImportOptions.changeLiabilitySign (auch changeAssetSign, changeEarningSign, changeExpenseSign); Feldregel: ImportOptions.isDeleteMode nie true. Probelauf: SimulateImportRequest (accountSystemId,
    financialStatementTemplateId, balanceSheetDate, balances[number, title, balance, assignment], options). Bilanzgleichheit/Totale im Rechenmodul, nicht in revio. Perioden: es gibt
    kein Feld financialPeriodId; LoadFinancialYears liefert FinancialYearDto (index, from, to, editFrom, editTo, isActualFiscalYear, isSealed, periods[PeriodDto: from, to, displayName]).
    Ob ein Geschäftsjahr versiegelt ist, steht in FinancialYearDto.isSealed; LoadSealHistory nur ergänzend. «ForFinancialPeriod»-Werkzeuge nehmen from/to. HB I/HB II: vermutlich Enum
    FinancialValuesOrigin (in schemas.json ohne Werte); Kennzahlen 1.2 = LoadKeyFigureView/LoadKeyFigureItems; 1.3 Spezialauswertungen Kandidat LoadSpecialAccountView/LoadCashflowDetail.
    Antrag VR (Gewinnverwendung) vermutlich benutzerdefinierte Einheit (LoadUserDefinedUnitForFinancialPeriod) – Kandidat. CreateSnapshot (unklar) wäre eine Sicherung vor einem Import
    – deny bis Entscheid; RestoreSnapshot und DeleteSnapshot nur Mensch. CreatePreviewReport und GenerateFinancialStatementReport = Report-Job, einheitlich «vorbereiten (Kandidat, Report-Job)»,
    bis geklärt ist, ob der Bericht in der Akte abgelegt wird.'
