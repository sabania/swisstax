  kurz: 'Das Delkredere ist eine aktivseitige Wertberichtigung auf Forderungen LuL: zuerst Einzelwertberichtigungen, dann eine Pauschalwertberichtigung nach Erfahrung und erwarteter
    Entwicklung (HWP BuR Rz 120). Ein zu tiefes Delkredere ist eine Überbewertung, ein Überhang eine zulässige stille Reserve (Art. 960a Abs. 4 OR). Die ESTV-Pauschale (5 %/10 %) ist
    nur steuerliche Praxis. SER Anhang D c)/revio C1-302: Angemessenheit nach Vorjahreserfahrung, Altersstruktur und Befragungen beurteilen.'
  aussagen:
  - text: 'Gesetzlicher Rahmen und Zielkonflikt: Die Bewertung muss vorsichtig sein, darf aber die zuverlässige Beurteilung der wirtschaftlichen Lage nicht verhindern (Art. 960 Abs.
      2 OR ^[or__art-960]). «Zwischen dieser Gesetzesbestimmung und der Zulässigkeit von stillen Reserven besteht ein Zielkonflikt.» ^[hwp-bur-2023__rz-0056-s069] Das Gesetz nimmt ihn
      in Kauf: Die Lage darf schlechter, aber nicht besser dargestellt werden (HWP BuR Rz 56). Für das Delkredere folgt daraus: Eine zu tiefe Wertberichtigung ist eine Überbewertung;
      bei konkreten Anzeichen sind die Werte «zu überprüfen und gegebenenfalls anzupassen» ^[or__art-960] (Art. 960 Abs. 3 OR). Eine überhöhte Wertberichtigung ist eine stille Reserve,
      die das Gesetz zulässt (Art. 960a Abs. 4 OR, siehe unten), und grundsätzlich keine Fehlaussage; zu beachten bleibt die Offenlegung einer wesentlichen Nettoauflösung.'
    quelle: hwp-bur-2023__rz-0056-s069
    zitat: Die wirtschaftliche Lage des Unternehmens darf aufgrund der Zulässigkeit der Bildung stiller Reserven jeweils schlechter, aber nicht besser dargestellt werden.
  - text: 'Begriff (HWP BuR Rz 113): Das Delkredere ist eine Wertberichtigung, keine Rückstellung. Es wird als Korrekturposten auf der Aktivseite geführt. Wertberichtigungen sind direkt
      oder indirekt bei den Aktiven abzusetzen und «dürfen nicht unter den Passiven ausgewiesen werden» ^[or__art-960a] (Art. 960a Abs. 3 OR).'
    quelle: hwp-bur-2023__rz-0113-s185
    zitat: Das Delkredere ist eine Wertberichtigung für Forderungen. Deshalb stellt es keine Rückstellung dar, sondern einen Korrekturposten auf der Aktivseite der Bilanz.
  - text: 'Vorgehen nach HWP BuR Rz 120: Zuerst werden Einzelwertberichtigungen (EWB) für gefährdete Forderungen ermittelt. Danach folgt eine Pauschalwertberichtigung (PWB) auf den restlichen
      Guthaben. Dafür dürfen Gruppen gebildet werden, z.B. alle Inlandforderungen. Vereinfachung bei vielen Kleinforderungen: «Bei einer Vielzahl geringer Forderungsbeträge kann auch
      direkt eine Methode der Pauschalwertberichtigung angewandt werden.» ^[hwp-bur-2023__rz-0120-s186]'
    quelle: hwp-bur-2023__rz-0120-s186
    zitat: Die Wertberichtigungen für gefährdete Forderungen sind zunächst einzeln zu ermitteln; danach sind Pauschalwertberichtigungen auf den restlichen Guthaben zu bilden.
  - text: 'Die Pauschalwertberichtigung wird betriebswirtschaftlich hergeleitet: aus Erfahrungen der Vergangenheit und unter Berücksichtigung der erwarteten Entwicklung (HWP BuR Rz 120).
      Naheliegende Erfahrungswerte sind die Debitorenverluste der Vorjahre (Agentenvorschlag; vgl. revio-Kennzahl C1-207 «Debitorenverluste in % vom Umsatz»).'
    quelle: hwp-bur-2023__rz-0120-s186
    zitat: Die pauschale Wertberichtigung ist aufgrund von Erfahrungen aus der Vergangenheit und unter Berücksichtigung der erwarteten Entwicklung zu quantifizieren.
  - text: 'ESTV-Pauschale, nur steuerliche Praxis: Gemäss HWP BuR Rz 437 lässt die ESTV für das allgemeine Kreditrisiko nach Abzug der Einzelwertberichtigungen 5 % auf inländischen und
      10 % auf ausländischen Guthaben zu. Ausgenommen sind Forderungen gegen öffentlich-rechtliche Körperschaften und voll gedeckte Forderungen. Eine ESTV-Primärquelle fehlt im Wiki;
      das HWP gibt die Praxis nur wieder.'
    quelle: hwp-bur-2023__rz-0437-s248
    zitat: auf inländischen Guthaben (ausgenommen Forderungen gegen öffentlich-rechtliche Körperschaften und Forderungen mit voller Deckung) eine pauschale Wertberichtigung von 5 % und
      auf ausländischen von 10 % zu
  - text: In der Praxis verwenden viele Unternehmen statt einer eigenen Herleitung die steuerlich akzeptierten Pauschalen. Bei Fakturierung in Fremdwährung liegt der Satz teils höher
      (EF 2026/08, Fachartikel, Sekundärquelle). Ob die Pauschale handelsrechtlich angemessen ist, muss trotzdem beurteilt werden.
    quelle: ef-2026-08-buchungslogik__s002-1
    zitat: Dies sind 5 % für Forderungen inländischer Kundschaft und 10 % für Forderungen ausländischer Kundschaft; zuweilen liegt dieser Satz höher, wenn die Forderungen in fremder
      Währung fakturiert werden
  - text: 'Stille Reserven im Delkredere: Der Teil der Wertberichtigung, der über den betriebswirtschaftlich nötigen Betrag hinausgeht, ist eine stille Reserve (HWP BuR Rz 669). Das
      betrifft z.B. eine Pauschale über dem tatsächlichen Ausfallrisiko.'
    quelle: hwp-bur-2023__rz-0669-s296
    zitat: Durch Abschreibungen, Rückstellungen und Wertberichtigungen, die über das betriebswirtschaftliche Mass hinaus vorgenommen werden, entstehen in den entsprechenden Bilanzpositionen
      stille Reserven.
  - text: 'Solche Reserven sind handelsrechtlich zulässig, und zwar zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens (Art. 960a Abs. 4 Satz 1
      OR). Zu den gleichen Zwecken müssen nicht mehr begründete Wertberichtigungen nicht aufgelöst werden: «Zu den gleichen Zwecken kann davon abgesehen werden, nicht mehr begründete
      Abschreibungen und Wertberichtigungen aufzulösen.» ^[or__art-960a] Ohne Wertaufholung entsteht eine stille Reserve: «Wird die Wertaufholung nicht gebucht, entsteht eine stille
      Reserve (Art. 960a Abs. 4 OR).» ^[hwp-bur-2023__rz-0440-s248]'
    quelle: or__art-960a
    zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
  - text: 'Die stillen Reserven im Delkredere werden jährlich per Bilanzstichtag nach stetiger Methode ermittelt und mit dem Vorjahr verglichen (HWP BuR Rz 671). Das ist die Grundlage
      für C1-303/C1-321 und für die Anhangangabe nach Art. 959c Abs. 1 Ziff. 3 OR (revio T1-305 «wesentliche Nettoauflösung»): Offenzulegen ist der Gesamtbetrag der aufgelösten stillen
      Reserven, «soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven übersteigt, wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird» ^[or__art-959c-t1].'
    quelle: hwp-bur-2023__rz-0671-s297
    zitat: Die Differenzen sind pro Bilanzposition nach stetig angewandten Methoden zu ermitteln und mit dem Vorjahresstand zu vergleichen.
  - text: 'Prüfungsumfang (SER 6.1.1, massgebend): Bei wesentlichen Jahresabschlussposten darf sich der Prüfer nicht ausschliesslich auf Befragungen stützen; die Antworten sind mit analytischen
      Prüfungshandlungen und/oder angemessenen Detailprüfungen zu ergänzen. «Wesentlich» bezieht sich hier auf die Toleranzwesentlichkeit: «Der Begriff der Wesentlichkeit bezieht sich
      in diesem Zusammenhang auf die sogenannte Toleranzwesentlichkeit» ^[hwp-er-2026__rz-0105-s198]; «Der Abschlussprüfer ergänzt in diesen Situationen die erhaltenen Antworten mittels
      analytischer und/oder angemessener Detailprüfungen.» ^[hwp-er-2026__rz-0105-s198] Die empfohlenen Prüfungshandlungen nach Anhang D sind «in der Regel und sofern anwendbar – für
      die wesentlichen Positionen der Jahresrechnung» durchzuführen ^[ser-2022__6-2-2].'
    quelle: ser-2022__6-1-1-t1
    zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
  - text: 'SER Anhang D c), empfohlene Befragungen: die Debitoren-OP-Liste durchsehen und nach Gründen für alte und ungewöhnlich hohe Ausstände sowie für Habensalden fragen (revio C1-101/C1-202).
      Ausserdem fragen, ob Forderungen verpfändet, abgetreten oder im Inkasso sind (revio C1-102): «Befragung, ob Forderungen verpfändet, abgetreten oder zum Inkasso gegeben worden sind»
      ^[ser-2022__anh-d-s075-1].'
    quelle: ser-2022__anh-d-s075-1
    zitat: Durchsicht der Debitoren-OP-Liste und Befragung über Gründe für alte, ungewöhnlich hohe Ausstände sowie Habensalden
  - text: 'SER Anhang D c), empfohlene analytische Prüfungshandlungen: die Altersstruktur der Forderungen beurteilen (revio C1-202, EP). Dazu gehören auch der «Vergleich des Bestands
      der Forderungen mit dem Vorjahr» ^[ser-2022__anh-d-s075-1] (C1-201), der «Vergleich der für die Fremdwährungsumrechnung angewandten Kurse mit den Jahresendkursen» ^[ser-2022__anh-d-s075-1]
      (C1-203) und die Feststellung von Forderungen gegenüber Beteiligten und Organen (C1-204).'
    quelle: ser-2022__anh-d-s075-1
    zitat: Beurteilung der Altersstruktur der Forderungen
  - text: 'SER (massgebend): Bei monetären Aktiven wie Forderungen kann «von einem Nominalwert, allenfalls abzüglich angemessener Wertberichtigungen (z. B. Delkredere) ausgegangen werden»
      ^[ser-2022__4-3-5]. Die Angemessenheit beurteilt die empfohlene Detailprüfung nach SER Anhang D c), revio C1-302 (EP, Prüfziel Bewertung), aus drei Grundlagen: Vorjahreserfahrung,
      Altersstruktur und Ergebnisse der Befragungen.'
    quelle: ser-2022__anh-d-s075-2
    zitat: Beurteilung der Angemessenheit der Wertberichtigungen aufgrund der Erfahrungen in den Vorjahren, der Altersstruktur und der Ergebnisse der Befragungen
  - text: Im Pflichtenheft ist «C1 Delkredere» mit Hauptschritt C1-302 (EP) als Beispiel festgelegt. Dazu gehören C1-101, 104, 202, 207, 208 (WP), 304 (WP), 309, 310 sowie 303/321 zu
      den stillen Reserven (Konzept, intern).
    quelle: konzept-ki-revisionsagent-2026__c013-1
    zitat: 101 OP-Liste (EP), 104 Wertberichtigungen, 202 Altersstruktur (EP), 207 Kennzahlen, 208 Verluste und Rabatte (WP), 304 Zahlungen nach Stichtag (WP)
  - text: 'Offener Entscheid bei consis: betriebswirtschaftliche Herleitung oder ESTV-Pauschale, Umgang mit stillen Reserven (C1-303, C1-321) und ab welchem Alter eine Forderung «alt»
      ist. Bis zum Entscheid legt der Agent keine eigene Regel fest.'
    quelle: konzept-ki-revisionsagent-2026__c015-2
    zitat: Betriebswirtschaftliche Herleitung oder steuerlich akzeptierte ESTV-Pauschale? Umgang mit stillen Reserven (C1-303, C1-321)? Ab welchem Alter gilt eine Forderung als «alt»?
  - text: Eine Debitoren-Altersgliederung des Kunden darf nicht unbesehen übernommen werden. Sie wird mit der Finanzbuchhaltung abgestimmt und nachgerechnet. Mit einer Stichprobe wird
      geprüft, ob die Rechnungen in der richtigen Überfälligkeitskategorie stehen (HWP ER Rz 266).
    quelle: hwp-er-2026__rz-0266-s244
    zitat: Zudem wird die sachliche Richtigkeit in der Regel aufgrund einer angemessenen Stichprobe nachgeprüft (z.B. ob Debitorenrechnungen in der richtigen Überfälligkeitskategorie
      angezeigt werden).
  - text: 'Nachweis für die Bewertung: Bei relativ geringer Schätzunsicherheit lassen sich ausreichende geeignete Prüfungsnachweise oft mit geringem Aufwand erlangen, z.B. durch die
      Durchsicht der im Prüfungszeitpunkt noch offenen Debitoren (HWP ER Rz 397; revio C1-309/C1-310). Im SER steht die «Durchsicht der OP-Liste im Prüfungszeitpunkt und/oder Zahlungen
      in neuer Rechnung» ^[ser-2022__anh-d-s076-1] unter den weiter gehenden Prüfungshandlungen (revio C1-304, WP).'
    quelle: hwp-er-2026__rz-0397-s273
    zitat: ausreichende geeignete Prüfungsnachweise bei entsprechender Risikolage mit vergleichbar geringem Aufwand erlangt werden können (z.B. Durchsicht noch offener Debitoren im Prüfungszeitpunkt)
  - text: 'Debitorenbestätigungen gehören nicht zur SER: Das SER führt das «Einholen von Debitorenbestätigungen» ^[ser-2022__anh-d-s076-1] unter den «Prüfungshandlungen, die nicht Bestandteil
      einer eingeschränkten Revision darstellen» ^[ser-2022__anh-d-s076-1]. Für das Vorhandensein dienen ersatzweise Versandpapiere und Zahlungseingänge im neuen Jahr (HWP ER Rz 139);
      im SER ist die «Durchsicht von Versandpapieren, Zahlungen in neuer Rechnung und Verträgen zur Feststellung des Vorhandenseins von Forderungen» ^[ser-2022__anh-d-s075-2] eine weiter
      gehende Prüfungshandlung (revio C1-307, WP). Fehlen beide Nachweise, schränkt der WP die Prüfungsaussage ein, oder es liegt die Unmöglichkeit einer Prüfungsaussage vor: «Aus diesem
      Grund schränkt er seine Prüfungsaussage ein oder es liegt gar die Unmöglichkeit einer Prüfungsaussage vor.» ^[hwp-er-2026__rz-0139-s204-t1]'
    quelle: hwp-er-2026__rz-0139-s204-t1
    zitat: Dem Prüfungsrisiko kann indessen mit anderen Prüfungshandlungen begegnet werden, namentlich mit der Durchsicht von Versandpapieren oder Nachweisen von Zahlungseingängen im
      neuen Jahr.
  - text: 'Ereignis nach dem Stichtag: Wird nach dem Abschlussstichtag ein Konkurs oder die Zahlungsunfähigkeit eines Schuldners bekannt, muss in der Jahresrechnung des abgelaufenen
      Jahres eine Wertberichtigung auf der Forderung gebildet werden (HWP BuR Rz 864).'
    quelle: hwp-bur-2023__rz-0864-s354
    zitat: Meldet ein Schuldner oder eine Schuldnerin nach dem Abschlussstichtag Konkurs an oder wird seine oder ihre Zahlungsunfähigkeit bekannt, muss für die Forderungen eine Wertberichtigung
      gebildet werden.
  - text: 'Folge für den Bericht: Nicht wertberichtigte, schwer einbringliche Guthaben sind eine Überbewertung; Ergebnis und Eigenkapital sind zu günstig ausgewiesen. Daraus kann eine
      eingeschränkte Prüfungsaussage folgen (SER Anhang F, Beispiel 2). Eine verneinende Prüfungsaussage kommt in Frage, wenn der WP nach seinem Ermessen das Gesamtbild der Jahresrechnung
      als grundlegend verändert beurteilt (HWP ER Rz 412, Beispiel mit stark gefährdeten Guthaben): «Es liegt im Ermessen des Abschlussprüfers, zu entscheiden, ob das Gesamtbild der
      Jahresrechnung grundlegend verändert wird oder nicht.» ^[hwp-er-2026__rz-0412-s277] Das entscheidet allein der WP.'
    quelle: ser-2022__anh-f-s119-2
    zitat: Unsere Revision hat ergeben, dass die Forderungen aus Lieferungen und Leistungen schwer einbringliche Guthaben enthalten, die nicht wertberichtigt worden sind.
  agent:
  - 'Zuerst den Mandatskontext fixieren (Kunde, Geschäftsjahr, Stichtag) ^[konzept-ki-revisionsagent-2026__c009-1]. Dann in M-Files beschaffen: Debitoren-OP-Liste per Stichtag mit Altersgliederung,
    OP-Liste Vorjahr, Delkredere-Berechnung bzw. Bewertungsregeln des Kunden, Konto Debitorenverluste (aktuelles Jahr und Vorjahre), Zahlungseingänge in neuer Rechnung, allfällige Kreditversicherungs-Police
    oder Sicherheiten, Detailnachweis stille Reserven. Was fehlt, als Pendenz erfassen, mit Konto, Datum und Betrag ^[konzept-ki-revisionsagent-2026__c007-1].'
  - 'Reihenfolge: Zuerst C1-301 (Total der Debitoren-OP-Liste mit dem Hauptbuch abstimmen ^[ser-2022__anh-d-s075-2]), dann C1-202 (Altersstruktur), dann C1-302. Die Altersgliederung
    des Kunden nicht unbesehen übernehmen: mit der FIBU abstimmen, nachrechnen und mit einer kleinen Stichprobe die Überfälligkeitskategorien prüfen ^[hwp-er-2026__rz-0266-s244]. Kein
    statistisches Sampling, das ist kein SER-Verfahren ^[hwp-er-2026__rz-0267-s086].'
  - 'Alle Berechnungen im Rechenmodul (`rechne`), nie im Kopf ^[konzept-ki-revisionsagent-2026__c009-2]. Dazu gehören: Altersstruktur nach Klassen, Einzelwertberichtigung (EWB) je gefährdetem
    Posten, Pauschalwertberichtigung (PWB) auf dem Rest getrennt nach Inland und Ausland, Vergleich mit dem Vorjahr, Debitorenverluste in % vom Umsatz (C1-207), Differenz zwischen gebuchtem
    Delkredere und Bedarf.'
  - 'Delkredere-Herleitung nachvollziehen: (1) EWB für gefährdete Posten prüfen. Kriterien sind ein Agentenvorschlag ohne Fundstelle: gemahnt oder betrieben, bestritten, Schuldner zahlungsunfähig
    oder in Konkurs (bei Bekanntwerden nach dem Stichtag: Wertberichtigung ^[hwp-bur-2023__rz-0864-s354]; uneinbringliche Forderungen sind auszubuchen ^[hwp-bur-2023__rz-0121-s187]).
    «Alt» als Kriterium erst nach Vorgabe des WP bzw. Entscheid consis verwenden ^[konzept-ki-revisionsagent-2026__c015-2]. (2) PWB auf dem Rest gegen die Erfahrungen der Vorjahre, die
    Altersstruktur und die Befragungsergebnisse plausibilisieren ^[ser-2022__anh-d-s075-2]; die PWB beruht auf Erfahrungen aus der Vergangenheit und der erwarteten Entwicklung ^[hwp-bur-2023__rz-0120-s186].
    Eignung und stetige Anwendung der Bewertungsmethode im Textfeld festhalten ^[hwp-er-2026__rz-0397-s273]. (3) Sicherheiten berücksichtigen; bei Kredit- oder Exportrisikoversicherung
    deckt das Delkredere nur den unversicherten Teil ^[hwp-bur-2023__rz-0438-s248].'
  - Die ESTV-Pauschale (5 % Inland, 10 % Ausland) immer als «steuerliche Praxis» bezeichnen. Fundstelle ist HWP BuR Rz 437 und sekundär EF 2026/08 (Fachartikel); ein ESTV-Merkblatt ist
    nicht im Wiki. HWP BuR 2023 erwähnt abweichende kantonale Sätze, z.B. ZH 10 %/20 % ^[hwp-bur-2023__rz-0437-s248]. Diese Sätze sind für das Geschäftsjahr nicht bestätigt und dürfen
    nicht als geltend verwendet werden. Höhere Sätze erkennt die Steuer laut EF 2026/08 nur mit konkretem Nachweis an ^[ef-2026-08-buchungslogik__s005-1].
  - 'Bis consis entschieden hat (Methode, stille Reserven, Altersgrenze «alt»), legt der Agent beide Werte offen: den betriebswirtschaftlich hergeleiteten Bedarf und das gebuchte Delkredere
    bzw. die ESTV-Pauschale ^[konzept-ki-revisionsagent-2026__c015-2]. Die Differenz mit `rechne` quantifizieren. Ist das Delkredere tiefer als der Bedarf, ist das eine mögliche Überbewertung:
    Liegt die Differenz unter der Nicht-Aufgriffsgrenze, nur protokollieren (ausser bei erfassten qualitativen Faktoren); sonst Notiz «Wesentliche Feststellungen» mit Betrag und begründetem
    Buchungsvorschlag, ohne Verbuchung ^[konzept-ki-revisionsagent-2026__c014-1] ^[konzept-ki-revisionsagent-2026__c007-1]. Massstab ist die Gesamtwesentlichkeit; die Summe der nicht
    korrigierten Fehler beurteilt der WP in 6.1 ^[konzept-ki-revisionsagent-2026__c014-1]. Ist das Delkredere höher, ist der Überhang eine stille Reserve und grundsätzlich keine Fehlaussage
    ^[hwp-bur-2023__rz-0056-s069]: Bestand und Veränderung in C1-303/C1-321 festhalten und an A1-207/A1-308 sowie T1-305 weitergeben (Nettoauflösung im Anhang). Eine Altersgrenze legt
    der Agent nicht selbst fest; er übernimmt die Vorgabe des WP oder erfasst eine Pendenz.'
  - 'Befragungen (C1-101, C1-102, C1-104, C1-202) kann der Agent nicht selbst führen. Er wertet schriftliche Antworten aus (revio 10.11) oder erfasst die Frage als Pendenz; der Status
    ist dann höchstens «teilweise bearbeitet» ^[konzept-ki-revisionsagent-2026__c012-1]. Ab wann ein Schritt «vorbereitet» statt «teilweise bearbeitet» gilt, ist bei consis noch offen
    ^[konzept-ki-revisionsagent-2026__c015-2]. Vorgeschlagene Fragen: Gründe für alte, ungewöhnlich hohe Ausstände und Habensalden (C1-101)? Wie werden säumige Zahler identifiziert und
    Wertberichtigungen festgelegt (C1-104)? Sind Forderungen verpfändet, abgetreten oder zum Inkasso gegeben (C1-102) ^[ser-2022__anh-d-s075-1]?'
  - 'Zahlungen nach dem Stichtag: C1-309 (seit dem Bilanzstichtag erfolgte Zahlungen festhalten) und C1-310 (am Revisionsstichtag überfällige Guthaben) vorbereiten; sie stützen Vorhandensein
    und Bewertung ^[hwp-er-2026__rz-0139-s204-t1] ^[hwp-er-2026__rz-0397-s273]. C1-304, C1-307 und C1-308 sind WP-Schritte (nur_mensch); im SER sind sie weiter gehende Prüfungshandlungen
    (C1-307 ^[ser-2022__anh-d-s075-2]; C1-304 und C1-308 ^[ser-2022__anh-d-s076-1]). Ob der Agent WP-Schritte vorbereitet, ist offen ^[konzept-ki-revisionsagent-2026__c012-1]; bis zum
    Entscheid nur auf ausdrückliche Anweisung des WP. Ist nach dem Stichtag ein Konkurs oder eine Zahlungsunfähigkeit eines Schuldners bekannt geworden, eine Notiz mit Buchungsvorschlag
    erfassen (Wertberichtigung im alten Jahr) ^[hwp-bur-2023__rz-0864-s354], ohne Verbuchung.'
  - Debitorenbestätigungen (C1-401) gehören nicht zur SER ^[ser-2022__anh-d-s076-1] ^[hwp-er-2026__rz-0262-s085]. Weitergehende Handlungen wie Bestätigungen führt der Agent nur auf ausdrückliche
    Anweisung des WP aus ^[konzept-ki-revisionsagent-2026__c012-1].
  - 'Ausweis prüfen: Das Delkredere wird direkt oder indirekt bei den Forderungen abgesetzt, nie unter den Passiven ^[or__art-960a]. Wesentliche Habensalden gehören in die übrigen kurzfristigen
    Verbindlichkeiten; eine Verrechnung ist grundsätzlich unzulässig ^[hwp-bur-2023__rz-0125-s187]. Verjährte oder konkursbedingt uneinbringliche Forderungen sind auszubuchen ^[hwp-bur-2023__rz-0121-s187].
    Forderungen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Beteiligungsunternehmen werden gesondert in der Bilanz oder im Anhang ausgewiesen ^[or__art-959a-t2]
    (Feststellung: C1-204 ^[ser-2022__anh-d-s075-1]).'
  - 'Fremdwährungsforderungen: Die angewandten Kurse mit den Jahresendkursen gemäss Bankunterlagen vergleichen (C1-203) ^[ser-2022__anh-d-s075-1]. Forderungen LuL in Fremdwährung werden
    zum Kurs am Bilanzstichtag bewertet ^[hwp-bur-2023__rz-0090-s077-t1]. Die Bewertung von Fremdwährungs- und Gross-Debitoren gehört in C1-311 (revio-Schritt, ohne eigene SER-Fundstelle).
    Umrechnung im Rechenmodul.'
  - 'Stichprobe (Vorschlag, bei consis noch offen ^[konzept-ki-revisionsagent-2026__c015-2]): alle Posten über der Toleranzwesentlichkeit aus revio 3.3 (Wert nur lesen, nie ändern ^[konzept-ki-revisionsagent-2026__c014-1]),
    dazu ungewöhnliche Posten wie Vorzeichen (Habensalden), runde Beträge, Stichtagsnähe und nahestehende Personen. Die Auswahl im Textfeld begründen.'
  - 'Grenze: Ob eine Überbewertung wesentlich ist und ob die Prüfungsaussage eingeschränkt oder verneint wird (SER Anhang F; HWP ER Rz 412), entscheidet allein der WP. Visum, ✓ und Abschliessende
    Beurteilung im Prüffeld C1 bleiben offen ^[konzept-ki-revisionsagent-2026__c011-2].'
