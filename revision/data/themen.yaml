  kurz: Die Revisionsstelle muss tatsächlich und dem Anschein nach unabhängig sein (OR 729 Abs. 1). Bei eingeschränkter Revision sind Mitwirken bei der Buchführung und andere Dienstleistungen
    mit Selbstprüfungsrisiko zulässig, wenn organisatorische und personelle Massnahmen eine verlässliche Prüfung sichern (nicht dieselbe Person/Personengruppe) und der Bericht dies offenlegt
    (OR 729b Abs. 1 Ziff. 3). Keine gesetzliche Rotationspflicht (nur ordentliche Revision, OR 730a Abs. 2). Beurteilung beim WP.
  aussagen:
  - text: 'OR 729 Abs. 1: Die Revisionsstelle muss unabhängig sein und sich ihr Prüfungsurteil objektiv bilden. Die Unabhängigkeit darf weder tatsächlich noch dem Anschein nach beeinträchtigt
      sein. Abs. 2: Das Mitwirken bei der Buchführung und andere Dienstleistungen für die geprüfte Gesellschaft sind zulässig. Entsteht dabei das Risiko, eigene Arbeiten zu überprüfen
      (Selbstprüfungsrisiko), müssen geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sicherstellen: «Sofern das Risiko der Überprüfung eigener Arbeiten
      entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.» ^[or__art-729]'
    quelle: or__art-729
    zitat: Die Unabhängigkeit darf weder tatsächlich noch dem Anschein nach beeinträchtigt sein.
  - text: 'SER Anhang B: Unabhängigkeit umfasst die innere oder tatsächliche Unabhängigkeit («independence of mind») und die äussere Unabhängigkeit dem Anschein nach («independence in
      appearance»). Können diese Anforderungen nicht erfüllt werden, darf das Mandat weder angenommen noch weitergeführt werden. Vor der Auftragsannahme bzw. vor Wahl oder Wiederwahl
      klärt der Abschlussprüfer deshalb die Voraussetzungen ab: Wählbarkeit, Zulassung und Unabhängigkeit sowie Voraussetzungen beim Unternehmen (z. B. Prüfungsrisiken, Integrität der
      Unternehmensleitung). «Sind diese Voraussetzungen nicht gegeben, ist der Auftrag abzulehnen.» ^[hwp-er-2026__rz-0002-s179]. Festzustellen ist, «ob der Prüfer über die notwendige
      Zulassung (Art. 727b und 727c OR) und die erforderliche Unabhängigkeit (Art. 728 und 729 OR) verfügt» ^[hwp-er-2026__rz-0150-s066].'
    quelle: ser-2022__anh-b-s048-1
    zitat: Können diese Anforderungen nicht erfüllt werden, ist die Annahme oder Weiterführung eines Revisionsmandats nicht möglich.
  - text: 'Art. 729 OR enthält keinen Katalog unvereinbarer Sachverhalte. Gemäss Botschaft gilt Art. 728 Abs. 2 OR (ordentliche Revision) aber als Leitlinie für die eingeschränkt prüfende
      Revisionsstelle, um den Anschein einer offensichtlichen Befangenheit zu vermeiden. Der SER konkretisiert dies in Anhang B mit einer Aufzählung unzulässiger Sachverhalte (siehe
      unten, Buchstaben b bis l). Zwischen ordentlicher und eingeschränkter Revision gilt: «weshalb bei den unvereinbaren Sachverhalten grundsätzlich kein Unterschied besteht» ^[hwp-er-2026__rz-0055-s162].
      Der wesentliche Unterschied liegt in der Zulässigkeit von Mitwirkung und anderen Dienstleistungen, «und dies stellt neben der fehlenden Rotationspflicht den wesentlichen Unterschied
      mit Bezug auf die Unabhängigkeit zwischen den beiden Revisionsarten dar» ^[hwp-er-2026__rz-0037-s158].'
    quelle: hwp-er-2026__rz-0036-s156-t1
    zitat: Die Vorgaben in Art. 728 Abs. 2 OR verstehen sich gemäss Botschaft jedoch auch als eine Leitlinie für die eingeschränkt prüfende Revisionsstelle
  - text: 'SER Anhang B (a) unterscheidet: (i) unterstützende Tätigkeiten im Rahmen der Abschlussprüfung, (ii) Nicht-Prüfungsdienstleistungen ohne Selbstprüfungsgefahr, (iii) das Mitwirken
      bei der Buchführung und (iv) Nicht-Prüfungsdienstleistungen mit Selbstprüfungsgefahr. Zu (i): Der Abschlussprüfer darf im Rahmen der Prüfung unterstützend (beratend) auf den Abschluss
      einwirken, solange die Entscheidung über die Handlungsalternativen beim Prüfungskunden verbleibt und dieser die Argumente fachlich mindestens in den Grundzügen nachvollziehen kann.
      Dazu gehören nach HWP ER Hilfe bei Kontoabstimmungsproblemen sowie «die Erarbeitung von Entwürfen in Offenlegungsfragen oder Vorschläge für die Berichtigung von Buchungen» ^[hwp-er-2026__rz-0048-s160].
      Solche Leistungen gelten nicht als Mitwirkung. Erbringt die Revisionsstelle sie, «muss sie jedenfalls sicherstellen, dass ihre Mitarbeiter keine Entscheidungen treffen, die in
      der alleinigen Verantwortung des Prüfungskunden liegen» ^[hwp-er-2026__rz-0049-s160].'
    quelle: ser-2022__anh-b-s049-1
    zitat: Solche Unterstützungsarbeiten bedürfen keiner personellen oder organisatorischen Massnahmen und auch keiner Offenlegung im Revisionsbericht.
  - text: 'Zu (ii): Nicht-Prüfungsdienstleistungen ohne Selbstprüfungsgefahr, insbesondere im Steuer-, Abgabe- und Sozialversicherungsrecht, sind normalerweise mit der Unabhängigkeit
      vereinbar. Sie sind zulässig, solange die Entscheidung über die Handlungsalternativen beim Prüfungskunden verbleibt und der Prüfungskunde die Argumente fachlich mindestens in den
      Grundzügen nachvollziehen kann. Dann brauchen sie keine besonderen personellen oder organisatorischen Massnahmen und keine Offenlegung im Revisionsbericht. Ebenso HWP ER: «Übrige
      Dienstleistungen, bei welchen keine Gefahr der Selbstprüfung besteht, sind bei der eingeschränkten Revision grundsätzlich zulässig und bedürfen keiner Offenlegung im Revisionsbericht.»
      ^[hwp-er-2026__rz-0051-s161]'
    quelle: ser-2022__anh-b-s049-2
    zitat: bedarf keiner besonderen personellen oder organisatorischen Massnahmen und auch keiner Offenlegung im Revisionsbericht
  - text: 'Zu (iii): Das Mitwirken bei der Buchführung birgt per se ein Selbstprüfungsrisiko, weil die Buchführung die Basis der Abschlussprüfung ist. Das Selbstprüfungsverbot wird deshalb
      auf eine interne Ebene des Revisionsunternehmens verlagert. Wer bei der Buchführung mitwirkt, darf die darauf basierende Jahresrechnung nicht eingeschränkt prüfen. Die prüfende
      Person darf auch nicht an Weisungen einer Person gebunden sein, die auf die buchführende Person Einfluss nimmt oder selbst mitwirkt. Offengelegt wird ausnahmslos: «Schliesslich
      muss die Revisionsstelle in allen Fällen der Mitwirkung bei der Buchführung diesen Sachverhalt im Revisionsbericht offenlegen» ^[hwp-er-2026__rz-0047-s160].'
    quelle: hwp-er-2026__rz-0044-s159
    zitat: Aufgrund der gesetzlichen Regelung wird das Selbstprüfungsverbot in diesen Fällen auf eine interne Ebene des Revisionsunternehmens verlagert.
  - text: 'Zu (iv): Nicht-Prüfungsdienstleistungen mit Selbstprüfungsgefahr («andere Dienstleistungen» nach OR 729 Abs. 2) sind bei der eingeschränkten Revision zulässig. Ein Beispiel
      sind Bewertungsgutachten des Revisionsunternehmens zu einzelnen Bilanzpositionen, die Angaben im Jahresabschluss tangieren. Sie verlangen geeignete organisatorische und personelle
      Massnahmen und müssen im Revisionsbericht offengelegt werden (OR 729b Abs. 1 Ziff. 3). Trennung und Offenlegung gelten bei anderen Dienstleistungen nur bei Selbstprüfungsgefahr:
      Erbringt die Revisionsstelle solche Dienstleistungen, «muss sie auch diesfalls, aber nur diesfalls, über eine personelle und organisatorische Trennung verfügen» ^[hwp-er-2026__rz-0051-s161].'
    quelle: ser-2022__anh-b-s050-1
    zitat: Dazu gehören beispielsweise durch das Revisionsunternehmen erstellte Bewertungsgutachten zu einzelnen Bilanzpositionen
  - text: 'Das Mitwirken und Dienstleistungen mit Selbstprüfungsrisiko verlangen kumulativ: «(a) Die Verantwortung für die Jahresrechnung bleibt in jedem Fall beim Prüfungskunden.» ^[ser-2022__anh-b-s050-1];
      (b) die Revisionsstelle übernimmt keine Aufgaben, die den Anschein erwecken, sie übernehme die Verantwortung des Managements; (c) die Risiken sind dem Kunden kommuniziert; (d)
      geeignete personelle und organisatorische Massnahmen sichern eine verlässliche Prüfung. Diese Massnahmen sind erfüllt, wenn nicht dieselbe Person oder Personengruppe in der Buchführung
      und in der eingeschränkten Revision desselben Kunden arbeitet. «Mandatsbezogene organisatorische Massnahmen sind zulässig, sofern eine verlässliche Prüfung sichergestellt wird.»
      ^[ser-2022__anh-b-s050-2]. Nach HWP ER ist die Mitwirkung dem Kunden eingehend zu erläutern, und «Die Verantwortung für die Jahresrechnung muss in jedem Fall nachweislich beim
      Kunden verbleiben.» ^[hwp-er-2026__rz-0043-s159]'
    quelle: ser-2022__anh-b-s050-2
    zitat: erfüllt, wenn nicht dieselbe Person oder Personengruppe Arbeiten in der Buchführung und in der eingeschränkten Revision des gleichen Kunden durchführt.
  - text: 'Bei der Mitwirkung bei der Buchführung und bei anderen Dienstleistungen mit Selbstprüfungsrisiko muss nicht das Revisionsunternehmen als Ganzes unabhängig sein. Die Anforderungen
      zielen hier auf die handelnden Personen: Das Revisionsunternehmen darf solche Leistungen bei personeller und organisatorischer Trennung erbringen, der an der eingeschränkten Revision
      beteiligte Prüfer aber keine Dienstleistungen mit persönlichem Selbstprüfungsrisiko. Unvereinbar ist auch «Die Mitunterzeichnung des Revisionsberichts durch eine Person, die in
      der Buchführung mitgewirkt» oder an anderen relevanten Dienstleistungen beteiligt war ^[hwp-er-2026__rz-0041-s159]. Abgrenzung: Die übrigen Unvereinbarkeiten wie Organfunktionen
      und finanzielle Beziehungen gelten für das Revisionsunternehmen und alle Mitarbeitenden: «Das Revisionsunternehmen und seine Mitarbeitenden (inkl. unmittelbarer Familienangehörige)
      übernehmen keine Führungs- oder Entscheidfunktionen beim Prüfungskunden.» ^[ser-2022__anh-b-s050-2]; unzulässige finanzielle Beteiligungen erfassen auf Seite der Revisionsstelle
      das Unternehmen, seine Leitungsorgane und Mitarbeitenden: «und dem Revisionsunternehmen und dessen Leitungsorganen und Mitarbeitenden inkl. unmittelbarer Familienangehörige andererseits»
      ^[ser-2022__anh-b-s051-1].'
    quelle: hwp-er-2026__rz-0041-s159
    zitat: die zu einer Überprüfung eigener Arbeiten führen können, ist es mithin nicht erforderlich, dass das Revisionsunternehmen als Ganzes unabhängig ist
  - text: 'Die Doppelmandatierung (eingeschränkte Revision und Mitwirkung bei der Buchführung) trägt dem Wunsch der KMU nach Dienstleistungen aus einer Hand Rechnung, erhöht aber das
      Risiko einer Verletzung der Unabhängigkeitsvorschriften und ist deshalb in jedem Fall kritisch zu prüfen. Revisionsunternehmen müssen sich bewusst sein, «dass Doppelmandaten a
      priori ein höheres Haftungsrisiko innewohnt» ^[hwp-er-2026__rz-0045-s159]. Grund ist die Wissenszurechnung (BGer 4A_166/2022): «das Wissen des Treuhänders / der Treuhandabteilung
      über die finanzielle (Schief-)Lage des Mandanten wird als der Revisionsstelle bekannt qualifiziert» ^[hwp-er-2026__rz-0388-s116]. Die Revisionsstelle richtet deshalb interne Informationsabläufe
      ein, damit Hinweise auf Kapitalverlust oder begründete Besorgnis einer Überschuldung zeitnah von der Treuhand- zur Revisionsabteilung gelangen.'
    quelle: hwp-er-2026__rz-0040-s158
    zitat: daher ist eine solche «Doppelmandatierung» in jedem Falle kritisch zu prüfen
  - text: '(b) Führungs- und Entscheidfunktionen: Das Revisionsunternehmen und seine Mitarbeitenden (inkl. unmittelbarer Familienangehöriger) üben während der Dauer des Prüfungsauftrags
      keine Führungs- oder Entscheidfunktionen beim Prüfungskunden aus. Das gilt für die Mitgliedschaft im Verwaltungsrat und für operative oder strategische Managementfunktionen.'
    quelle: ser-2022__anh-b-s050-2
    zitat: Die Unabhängigkeit des Revisionsunternehmens ist nur dann gegeben, wenn während der Dauer des Prüfungsauftrags keine solchen Funktionen ausgeübt werden.
  - text: '(c) Finanzielle Beziehungen: Direkte oder wesentliche indirekte finanzielle Beteiligungen am Prüfungskunden sind unzulässig. Das betrifft den Prüfungskunden, seine bedeutenden
      Kapitaleigner, Organe, leitenden Angestellten und nahestehenden Gesellschaften einerseits und das Revisionsunternehmen, seine Leitungsorgane und Mitarbeitenden (inkl. unmittelbarer
      Familienangehöriger) andererseits. HWP ER: «von dieser Bestimmung ausgenommen sind unwesentliche indirekte Beteiligungen über Anlagefonds und vergleichbare Anlageeinrichtungen»,
      sofern auf deren Anlagepolitik kein Einfluss genommen werden kann und sie nicht Prüfungskunden sind ^[hwp-er-2026__rz-0036-s156-t1]. Mit der Unabhängigkeit unvereinbar sind auch
      die Aufnahme und Gewährung von Darlehen oder Krediten und ähnliche Transaktionen (Garantien, Sicherheiten). (d) «Mit dem Prüfungsauftrag unvereinbar ist hingegen der Abschluss
      eines Vertrages, der nicht marktkonforme Bedingungen vorsieht» (z. B. ungewöhnliche Rabatte) ^[ser-2022__anh-b-s051-1]; Käufe zu marktkonformen Bedingungen gefährden die Unabhängigkeit
      grundsätzlich nicht.'
    quelle: ser-2022__anh-b-s051-1
    zitat: Die Aufnahme und Gewährung von Darlehen/Krediten und ähnliche Transaktionen (Garantien oder sonstige Sicherheiten) sind mit der Unabhängigkeit unvereinbar.
  - text: (e) «Gemeinsame wesentliche kommerzielle und/oder wesentliche finanzielle Interessen», die über die üblichen Dienstleistungen hinausgehen (z. B. gemeinsame Investitionen, Joint
      Ventures), sind unzulässig; ein Sponsoring oder eine gemeinsame Veranstaltung ist zulässig ^[ser-2022__anh-b-s051-2]. (f) Unvereinbar ist insbesondere eine enge persönliche Beziehung
      des leitenden Revisors zu einem VR-Mitglied, zu einer anderen Person mit Entscheidfunktion oder zu einem bedeutenden Aktionär. Darunter fallen Familienangehörige (vornehmlich Ehegatten,
      eingetragene Partner, Lebensabschnittspartner, Kinder, Eltern, Grosseltern, Geschwister) und enge Freundschaften. «Eine enge Freundschaft darf von einem Dritten nicht leichthin
      vermutet werden.» Übliche Sozialkontakte sind unbedenklich ^[ser-2022__anh-b-s051-2].
    quelle: ser-2022__anh-b-s051-2
    zitat: Mit der Unabhängigkeit nicht vereinbar ist insbesondere eine enge persönliche Beziehung des leitenden Revisors zu einem Mitglied des Verwaltungsrates
  - text: '(g) Längerfristige Tätigkeit: Bei der eingeschränkten Revision hat der leitende Revisor keine Rotationspflicht. Die Höchstdauer nach OR 730a Abs. 2 gilt nur für die ordentliche
      Revision: «Bei der ordentlichen Revision darf die Person, die die Revision leitet, das Mandat längstens während sieben Jahren ausführen.» ^[or__art-730a]. Das Revisionsunternehmen
      achtet aber darauf, dass die Vertrautheit zwischen Prüfungsteam und Kunde nicht den Anschein erweckt, Objektivität und Unabhängigkeit seien gefährdet. Eine zu enge Vertrautheit
      kann nach HWP ER «dazu führen, dass ein langjähriger leitender Revisor die Leitung eines Mandats intern an einen anderen Prüfer übergibt» ^[hwp-er-2026__rz-0167-s069].'
    quelle: ser-2022__anh-b-s052-1
    zitat: Für die eingeschränkte Revision besteht keine Rotationspflicht des leitenden Revisors.
  - text: '(h) Beschäftigungsverhältnisse: Treten leitende Mitarbeitende des Prüfungskunden oder Mitarbeitende mit bedeutendem Einfluss auf Buchführung oder Abschluss in das Revisionsunternehmen
      über, dürfen sie für den Zeitraum, auf den sich die Prüfungsbestätigung erstreckt, keine Prüfungsdienstleistungen für diesen Kunden erbringen. Geht ein in die Prüfung einbezogener
      Partner, leitender Mitarbeitender oder ein Mitglied des Prüfungsteams ein Arbeitsverhältnis mit dem Prüfungskunden ein oder beabsichtigt dies, darf diese Person keine Prüfungsdienstleistungen
      mehr für ihn erbringen. (i) «Mit der Unabhängigkeit unvereinbar ist auch die Übernahme eines Auftrags, der zu einer wirtschaftlichen Abhängigkeit führt.» ^[ser-2022__anh-b-s052-1].
      Ob sie vorliegt, ist im Einzelfall zu prüfen. Die gesetzliche 10%-Grenze des RAG für Revisionsstellen von Gesellschaften des öffentlichen Interesses «findet keine Anwendung bei
      der eingeschränkten Revision» ^[hwp-er-2026__rz-0036-s156-t3].'
    quelle: ser-2022__anh-b-s052-1
    zitat: ein Arbeitsverhältnis mit einem Prüfungskunden eingeht oder dies beabsichtigt, darf diese Person keine Prüfungsdienstleistungen mehr für diesen Kunden erbringen
  - text: '(j) Honorargestaltung: Revisionsunternehmen vermeiden eine tatsächliche oder scheinbare Beeinträchtigung ihrer Objektivität und Unabhängigkeit durch Höhe oder Art der Honorare.
      Erfolgshonorare für Prüfungsdienstleistungen sind unzulässig. «Das gilt auch für Erfolgshonorare für Nicht-Prüfungsdienstleistungen, wenn die Höhe der Honorare vom Ergebnis des
      Prüfungsauftrags abhängt.» ^[ser-2022__anh-b-s052-2]. Bei transaktionsbezogenen Nicht-Prüfungsdienstleistungen, die in den entsprechenden Märkten üblicherweise erfolgsbasiert honoriert
      werden, sind Erfolgshonorare zulässig, sofern sie nicht in einem offensichtlichen Missverhältnis zum Aufwand stehen.'
    quelle: ser-2022__anh-b-s052-2
    zitat: Erfolgshonorare für Prüfungsdienstleistungen sind mit dem Grundsatz der Unabhängigkeit nicht vereinbar.
  - text: 'Ausstehende Honorare: Bleiben Honorare des Prüfungskunden über längere Zeit unbezahlt, kann ein Risiko bei der Wahrnehmung eigener Interessen entstehen. Das gilt besonders,
      wenn vor dem Prüfungsbericht für das Folgejahr ein erheblicher Teil des Vorjahreshonorars aussteht. Die Revisionsstelle wirkt dann auf Bezahlung vor der Erstellung des Berichts
      hin. Das Revisionsunternehmen «sollte auch erwägen, ob es aufgrund der Bedeutung der überfälligen Honorare für das Revisionsunternehmen angebracht ist, eine Wiederwahl zu akzeptieren»
      ^[ser-2022__anh-b-s053-1]. (k) Geschenk- und Vorteilsannahme: Mitarbeitende des Revisionsunternehmens, ihre unmittelbaren Familienangehörigen und das Revisionsunternehmen selbst
      dürfen vom Prüfungskunden «keine Geschenke, die den üblichen Rahmen einer Aufmerksamkeit übersteigen» entgegennehmen oder sich zusichern lassen und keine Waren oder Leistungen
      unter marktüblichen Konditionen beziehen ^[ser-2022__anh-b-s053-1].'
    quelle: ser-2022__anh-b-s053-1
    zitat: In solchen Fällen wirkt die Revisionsstelle auf Bezahlung dieser Honorare vor der Erstellung des Prüfungsberichts hin.
  - text: '(l) Rechtliche Auseinandersetzungen: Wird zwischen Revisionsunternehmen und Prüfungskunden ein Rechtsstreit geführt oder zeichnet sich einer ab, können Zweifel an einem fairen
      und objektiven Prüfungsbericht entstehen. Zudem kann ein Verfahren die Bereitschaft der Geschäftsleitung schmälern, die nötigen Informationen zu geben. Ab wann das Mandat niederzulegen
      ist, lässt sich nicht genau festlegen. Sobald die Auseinandersetzung von der Öffentlichkeit als Gefährdung der Objektivität wahrgenommen werden könnte, sollte das Revisionsunternehmen
      seine Tätigkeit einstellen; das dürfte insbesondere bei einer Klage des Prüfungskunden wegen Pflichtverletzung zutreffen. HWP ER: «In solchen Fällen prüft das Revisionsunternehmen
      sorgfältig, ob es das Mandat niederlegen sollte.» ^[hwp-er-2026__rz-0036-s156-t4]'
    quelle: ser-2022__anh-b-s053-2
    zitat: Ein Revisionsunternehmen sollte jedoch seine Tätigkeit einstellen, sobald die Umstände der Auseinandersetzung von der Öffentlichkeit als Gefährdung seiner Objektivität wahrgenommen
      werden könnten
  - text: 'Bericht: Nach OR 729b Abs. 1 Ziff. 3 enthält der zusammenfassende Revisionsbericht «Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung und zu
      anderen Dienstleistungen, die für die zu prüfende Gesellschaft erbracht wurden» ^[or__art-729b]. SER 8.4: Hat die Revisionsstelle in der Berichtsperiode weder bei der Buchführung
      mitgewirkt noch andere Dienstleistungen mit Selbstprüfungsrisiko erbracht und hält sie die Unabhängigkeitsbestimmungen ein, weist der Bericht einzig darauf hin, dass die gesetzlichen
      Unabhängigkeitsanforderungen erfüllt sind. Dienstleistungen ohne Selbstprüfungsrisiko (z. B. Steuerberatung) werden nicht offengelegt ^[hwp-er-2026__rz-0051-s161]. Andernfalls
      ist der Sachverhalt offenzulegen, z. B. nach der Bestätigung von Zulassung und Unabhängigkeit mit dem Satz «Ein Mitarbeitender unserer Gesellschaft hat im Berichtsjahr bei der
      Buchführung mitgewirkt. An der eingeschränkten Revision war er nicht beteiligt.» ^[ser-2022__8-4]'
    quelle: ser-2022__8-4
    zitat: so weist der Revisionsbericht einzig darauf hin, dass die gesetzlichen Anforderungen der Unabhängigkeit erfüllt sind
  - text: Im Bericht bestätigt die Revisionsstelle, dass sie die Anforderungen an die Zulassung (RAG) und an die Unabhängigkeit (OR) erfüllt. Diese Unabhängigkeitsbestätigung ist eine
      Selbstdeklaration und wird in der Regel nicht durch Dritte überprüft. Bei Verdacht oder Hinweisen Dritter kann die RAB tätig werden. Intern holt das Revisionsunternehmen nach dem
      Leitfaden QM 2025 (Praxishilfe) mindestens einmal jährlich vom gesamten zur Unabhängigkeit verpflichteten Fachpersonal «eine dokumentierte Bestätigung der Einhaltung der Unabhängigkeitsanforderungen»
      ein. Stellt eine Fachperson einen Verstoss fest, meldet sie ihn umgehend den Verantwortlichen für das Qualitätsmanagement ^[leitfaden-qm-2025__9-2-2]. «Personen ohne Zulassung,
      die in der Revisionsgesellschaft eine Entscheidfunktion innehaben (Verwaltungsrat, Geschäftsleitung), unterzeichnen ebenfalls eine Bestätigung.» ^[leitfaden-qm-2025__4-1-t3]
    quelle: hwp-er-2026__rz-0373-s268
    zitat: Die Bestätigung der Unabhängigkeit ist eine Selbstdeklaration der Revisionsstelle, die in der Regel nicht durch Dritte überprüft wird.
  agent:
  - 'Rolle: revio 2.2 (Auftragsannahme und Weiterführung) und 2.4 (Auftragsvoraussetzungen und Unabhängigkeit) nur lesen. Der Agent beurteilt die Unabhängigkeit nicht, gibt keine Unabhängigkeitsbestätigung
    ab und setzt kein Visum. Entscheid und Unterschrift liegen beim WP bzw. leitenden Revisor (OR 729b Abs. 2) ^[konzept-ki-revisionsagent-2026__c006-2] ^[or__art-729b].'
  - 'Doppelmandat feststellen: In M-Files und in der Korrespondenz (10.6) nach einem Buchführungs- oder Abschlussauftrag der eigenen Firma für denselben Kunden suchen, z. B. einer Auftragsbestätigung
    nach SER Anhang C Beispiel 2 mit Feststellung der personellen und organisatorischen Trennung ^[ser-2022__anh-c-s059-1] ^[ser-2022__anh-c-s060-2]. Befund im Textfeld A1 festhalten;
    ein Doppelmandat ist in jedem Fall kritisch zu prüfen ^[hwp-er-2026__rz-0040-s158]. Bei Mitwirkung ist die Offenlegung im Bericht zwingend ^[hwp-er-2026__rz-0047-s160]. Den Offenlegungssatz
    im GVB-Entwurf setzt der Agent nur als Vorschlag ein ^[ser-2022__anh-f-s136-2]. Ob eine offenlegungspflichtige Mitwirkung oder Dienstleistung vorliegt und wie formuliert wird, entscheidet
    der WP.'
  - 'Personelle Trennung: Das Auftragsteam (revio 3.6, nur lesen) mit den Personen vergleichen, die die Buchhaltung oder Jahresrechnung erstellt haben (Ersteller in M-Files, Umbuchungsliste
    10.2). Bei Personenidentität oder Weisungsabhängigkeit eine Pendenz an den WP erfassen und nie selbst beurteilen ^[hwp-er-2026__rz-0044-s159]. Eine Person, die bei der Buchführung
    mitgewirkt hat, darf den Bericht nicht mitunterzeichnen ^[hwp-er-2026__rz-0041-s159].'
  - 'Abgrenzung: Korrekturvorschläge, Hilfe bei Kontoabstimmungen und Entwürfe zu Offenlegungsfragen im Prüfungsprozess gelten nicht als Mitwirkung. Sie brauchen weder Trennung noch
    Offenlegung, solange der Kunde entscheidet und die Argumente mindestens in den Grundzügen nachvollziehen kann ^[hwp-er-2026__rz-0048-s160] ^[hwp-er-2026__rz-0049-s160] ^[ser-2022__anh-b-s049-1].
    Grenze: Weder Mitarbeitende der Revisionsstelle noch der Agent treffen Entscheidungen, die in der alleinigen Verantwortung des Kunden liegen ^[hwp-er-2026__rz-0049-s160]. Buchungsvorschläge
    des Agenten deshalb nur als Notiz «Wesentliche Feststellungen», ohne Verbuchung.'
  - 'Dienstleistungen einordnen: Steuererklärung, Steuer-, MWST- und Sozialversicherungsberatung bergen normalerweise kein Selbstprüfungsrisiko, solange der Kunde entscheidet und die
    Argumente mindestens in den Grundzügen nachvollziehen kann ^[ser-2022__anh-b-s049-2] ^[hwp-er-2026__rz-0050-s160]. Dann braucht es keine Trennung und keine Offenlegung im Bericht
    ^[hwp-er-2026__rz-0051-s161]. Buchführung, Mithilfe bei den Buchführungs- und Abschlussarbeiten ^[ser-2022__anh-c-s060-2] und Bewertungsgutachten zu Bilanzpositionen ^[ser-2022__anh-b-s050-1]
    bergen ein Selbstprüfungsrisiko und verlangen Trennung und Offenlegung ^[hwp-er-2026__rz-0047-s160] ^[hwp-er-2026__rz-0051-s161]. Unterstützung im Prüfungsprozess ist keine Mitwirkung
    (siehe Abgrenzung) ^[ser-2022__anh-b-s049-1]. Unklare Fälle als Pendenz an den WP erfassen.'
  - 'Signale aus den Prüffeldern melden, nicht werten (I): K1/M1/M3 – offene Honorare der Revisionsstelle, besonders aus dem Vorjahr ^[ser-2022__anh-b-s053-1]. H2/L1/N1 – Darlehen, Garantien
    oder Sicherheiten zwischen dem Kunden und dem Revisionsunternehmen oder dessen Mitarbeitenden ^[ser-2022__anh-b-s051-1]. H3/P1 (Beteiligungen, Aktienbuch) – Beteiligungen des Revisionsunternehmens
    oder seiner Mitarbeitenden am Kunden ^[ser-2022__anh-b-s051-1]; gemeinsame Investitionen oder Joint Ventures mit dem Revisionsunternehmen ^[ser-2022__anh-b-s051-2]. Verträge zwischen
    Kunde und Revisionsunternehmen zu nicht marktkonformen Bedingungen ^[ser-2022__anh-b-s051-1]. Jeweils eine Notiz «Wesentliche Feststellungen» oder eine Pendenz an den WP erfassen.'
  - 'Signale melden, nicht werten (II): A1 (Protokolle, HR-Auszug) – VR- oder Geschäftsführungsfunktion von Mitarbeitenden der Revisionsstelle oder ihrer unmittelbaren Familienangehörigen
    ^[ser-2022__anh-b-s050-2]; erkennbare Familienbeziehungen zwischen dem leitenden Revisor und VR-Mitgliedern, Personen mit Entscheidfunktion oder bedeutenden Aktionären ^[ser-2022__anh-b-s051-2].
    Auftragsteam 3.6 mit früheren Zeichnungsberechtigten und Buchhaltungsverantwortlichen des Kunden abgleichen (Übertritte ins Revisionsunternehmen); Hinweise in der Korrespondenz 10.6
    auf einen Wechsel eines Teammitglieds zum Kunden ^[ser-2022__anh-b-s052-1]. O1/T1 und Korrespondenz 10.6 – Rechtsstreit oder drohendes Verfahren zwischen Kunde und Revisionsunternehmen
    ^[ser-2022__anh-b-s053-2]. Hinweise auf Geschenke über den üblichen Rahmen ^[ser-2022__anh-b-s053-1]. Eine wirtschaftliche Abhängigkeit kann der Agent mangels firmeninterner Honorardaten
    nicht beurteilen; sie ist im Einzelfall durch den WP zu prüfen ^[hwp-er-2026__rz-0036-s156-t3]. Nur melden: Pendenz an den WP.'
  - 'Doppelmandat und Kapitalverlust oder Überschuldung (P1, revio 3.4 Going concern): Das Wissen der Treuhandabteilung gilt als Wissen der Revisionsstelle. Hinweise deshalb sofort als
    Notiz an den WP ^[hwp-er-2026__rz-0388-s116]. Prüfung eines Zwischenabschlusses nach OR 725b Abs. 2 bei Doppelmandat: nach HWP ER und Art. 165 RzU vereinbar, die RAB ist anderer
    Auffassung. Der WP entscheidet ^[hwp-er-2026__rz-0053-s161] ^[hwp-er-2026__rz-0054-s162]. Andere gesetzliche Spezialprüfungen sind bei Doppelmandat nur zulässig, wenn eine Überprüfung
    eigener Arbeiten im konkreten Fall ausgeschlossen ist; gelten dafür die Unabhängigkeitsanforderungen der ordentlichen Revision, ist das Doppelmandat unzulässig ^[hwp-er-2026__rz-0053-s161].
    Pendenz an den WP.'
  - 'Konzern: Der Konzernabschlussprüfer wirkt bei der Buchführung einer nicht konsolidierungspflichtigen Tochter mit. Das HWP ER hält dies bei Trennung für zulässig, die RAB für unzulässig.
    Pendenz an den WP ^[hwp-er-2026__rz-0046-s160].'
  - 'Rotation: OR 730a Abs. 2 (höchstens 7 Jahre, dann 3 Jahre Unterbruch) gilt nur für die ordentliche Revision ^[or__art-730a]. Wechselt das Unternehmen in die ordentliche Revision,
    werden Jahre der eingeschränkten Revision regelmässig nicht mitgezählt ^[hwp-er-2026__rz-0059-s164-t1] ^[hwp-er-2026__rz-0059-s164-t2]. Eine langjährige Mandatsleitung höchstens
    als Hinweis zur Vertrautheit an den WP melden; mögliche Folge ist eine interne Übergabe der Mandatsleitung ^[hwp-er-2026__rz-0167-s069].'
  - 'Organisation: Zulässig ist z. B., dass der Inhaber den Treuhandbereich leitet und ein Mitarbeitender, der laut Organisationsreglement allein und unabhängig entscheidet, das Revisionsmandat
    leitet ^[hwp-er-2026__rz-0045-s159]. Einzelpraxis nach Leitfaden QM (Praxishilfe, im Rang unter SER/HWP ER): Mit weiterem Fachpersonal ohne Zulassung ist die Mitwirkung denkbar,
    wenn organisatorische und personelle Massnahmen eine verlässliche Prüfung sichern und die buchführende Person mandatsbezogen weisungsungebunden agieren kann; ohne weitere Fachmitarbeitende
    ist sie nicht möglich ^[leitfaden-qm-2025__4-2-t3]. Organisation nur feststellen, nicht beurteilen.'
  - 'Auftragsannahme: Vor der Mandatsübernahme abklären, ob Zulassung (OR 727b/727c) und Unabhängigkeit (OR 728/729) gegeben sind ^[hwp-er-2026__rz-0150-s066]. Der Leitfaden QM (Praxishilfe)
    fasst die Prüfung als «Kann ich? Darf ich? Will ich?»; «Darf ich?» betrifft Unabhängigkeitsrisiken ^[leitfaden-qm-2025__5-1-t1]. Fehlt die Unabhängigkeit, wird das Mandat abgelehnt
    oder nicht weitergeführt. Das entscheidet der WP ^[hwp-er-2026__rz-0002-s179] ^[ser-2022__anh-b-s048-1].'
  - 'Anhang (T1): Bei einem vorzeitigen Rücktritt oder einer Abberufung der Revisionsstelle müssen die Gründe im Anhang stehen (OR 959c Abs. 2 Ziff. 14) ^[or__art-959c-t2]. Quellenabweichung:
    Der Leitfaden QM 2025 (5.1) spricht von jederzeitiger Abberufung mit sofortiger Wirkung ^[leitfaden-qm-2025__5-1-t3]. Nach OR 730a Abs. 4 ist eine Abberufung nur aus wichtigen Gründen
    möglich ^[or__art-730a]. Das Gesetz geht vor.'
  - Die jährlichen Unabhängigkeitsbestätigungen der Mitarbeitenden (auch der Personen ohne Zulassung mit Entscheidfunktion) gehören zum QM-System der Firma, nicht zur revio-Akte des
    Mandats. Der Agent erstellt oder unterzeichnet keine solche Bestätigung ^[leitfaden-qm-2025__9-2-2] ^[leitfaden-qm-2025__4-1-t3].
