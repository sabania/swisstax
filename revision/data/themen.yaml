  kurz: Rückstellungen sind zu bilden, wenn vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten lassen (OR 960e Abs. 2); freiwillige und nicht mehr begründete
    Rückstellungen sind zulässig, bilden aber stille Reserven. Eventualverbindlichkeiten (OR 959c Abs. 2 Ziff. 10) und für Dritte bestellte Sicherheiten (Ziff. 8) sind getrennt im Anhang
    anzugeben. Anwaltsbestätigungen gehören nicht zur SER; über Beurteilung und Bericht entscheidet der WP.
  aussagen:
  - text: 'Gesetz (OR 960e): Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, müssen die voraussichtlich erforderlichen Rückstellungen zulasten
      der Erfolgsrechnung gebildet werden (Abs. 2). Zudem dürfen Rückstellungen insbesondere für regelmässig anfallende Aufwendungen aus Garantieverpflichtungen, Sanierungen von Sachanlagen,
      Restrukturierungen und die Sicherung des dauernden Gedeihens des Unternehmens gebildet werden (Abs. 3, freiwillige Rückstellungen); nicht mehr begründete Rückstellungen müssen
      nicht aufgelöst werden (Abs. 4).'
    quelle: or__art-960e
    zitat: Lassen vergangene Ereignisse einen Mittelabfluss in künftigen Geschäftsjahren erwarten, so müssen die voraussichtlich erforderlichen Rückstellungen zulasten der Erfolgsrechnung
      gebildet werden.
  - text: 'Die Bildungspflicht greift, wenn kumulativ vorliegen: vergangenes Ereignis, erwarteter Mittelabfluss in künftigen Geschäftsjahren und verlässlich schätzbare Höhe des Mittelabflusses
      (HWP BuR III.2.26.1, Rz 496).'
    quelle: hwp-bur-2023__rz-0496-s258
    zitat: müssen gebildet werden, wenn die folgenden Voraussetzungen kumulativ erfüllt sind
  - text: 'Vorsichtsprinzip: Auch bei einer Eintretenswahrscheinlichkeit unter 50 % darf nicht ohne Weiteres auf eine Rückstellung verzichtet werden; zumindest eine anteilige Rückstellung
      ist zu prüfen, wenn die übrigen Voraussetzungen erfüllt sind; innerhalb einer Bandbreite ist eher das obere Ende zu erfassen (HWP BuR Rz 515, mit Verweis auf OR 958c Abs. 1 Ziff.
      5).'
    quelle: hwp-bur-2023__rz-0515-s261
    zitat: dass ein Ereignis bei Eintretenswahrscheinlichkeit von unter 50 % nicht einfach als unwahrscheinlich qualifiziert und auf die Bildung einer Rückstellung verzichtet werden
      kann
  - text: Eine grosse Bandbreite möglicher Mittelabflüsse rechtfertigt keinen Verzicht auf die Rückstellung zugunsten einer blossen Anhangangabe als Eventualverbindlichkeit; die Höhe
      ist nach bestmöglicher Schätzung zu bemessen. Nur in Ausnahmefällen ist die Verpflichtungshöhe nicht zuverlässig bestimmbar; dann Ausweis als Eventualverbindlichkeit im Anhang
      (HWP BuR Rz 516).
    quelle: hwp-bur-2023__rz-0516-s261
    zitat: Eine grosse Bandbreite möglicher Mittelabflüsse ist kein Grund, auf die Bildung einer Rückstellung zu verzichten und stattdessen nur eine Eventualverbindlichkeit im Anhang
      der Jahresrechnung auszuweisen.
  - text: Handelsrechtlich notwendige Rückstellungen sind auch dann zu bilden, wenn sie steuerlich nicht anerkannt werden; bei bestehender Verpflichtung sofort und in vollem Umfang,
      nicht über mehrere Jahre aufbauend. Über die notwendigen Rückstellungen hinaus können weitere Rückstellungen sachgerecht sein, etwa aus steuerlichen Gründen (die Steuergesetze
      lassen eine Reihe pauschaler Rückstellungen zu); die notwendigen Rückstellungen sind davon unabhängig zu bilden (HWP BuR Rz 513).
    quelle: hwp-bur-2023__rz-0513-s261
    zitat: Handelsrechtlich notwendige Rückstellungen müssen auch dann gebildet werden, wenn sie steuerlich keine Anerkennung finden.
  - text: 'Abgrenzung zur passiven Rechnungsabgrenzung: Rückstellungen sind durch Unsicherheit über Zeitpunkt und/oder Höhe des Mittelabflusses gekennzeichnet; bei Rechnungsabgrenzungen
      ist die Unsicherheit deutlich geringer und die Zahlung erfolgt i.d.R. innert weniger Monate (HWP BuR Rz 501).'
    quelle: hwp-bur-2023__rz-0501-s258
    zitat: dass bei ihnen Unsicherheiten bezüglich des Zeitpunkts und/oder der Höhe des zukünftigen Mittelabflusses bestehen
  - text: 'Garantien: Der Rückstellungsbedarf für Gewährleistungen ist auch bei Garantien Dritter oder Rückbehalten des Kunden zu ermitteln; bei Serienprodukten z.B. aus Erfahrungszahlen
      unter Berücksichtigung der durchschnittlichen Garantiedauer, bei Einzelfertigung inkl. Kosten der im Preis eingeschlossenen Installation und Ingangsetzung (HWP BuR Rz 523).'
    quelle: hwp-bur-2023__rz-0523-s262
    zitat: bei Serienprodukten die Rückstellung aufgrund von Erfahrungszahlen unter Berücksichtigung der durchschnittlichen vertraglichen oder gesetzlichen Garantiedauer ermittelt werden
  - text: 'Rechtsfälle: Prozessrisiken sind trotz Beurteilungsschwierigkeiten abzuschätzen und angemessen zurückzustellen; ist die Höhe trotz pflichtgemässem Ermessen nicht abschätzbar
      und ein negativer Ausgang nicht ausgeschlossen, ist der Sachverhalt im Anhang als Eventualverbindlichkeit zu erläutern. Dem Unternehmen wird empfohlen, bei laufenden Prozessen
      Stellungnahmen der beauftragten Anwälte über den mutmasslichen Ausgang und allfällige Schadenersatzverpflichtungen (inkl. Prozesskosten) einzuholen. Analoges gilt für gewählte
      Steuerpositionen und das Risiko einer Aufrechnung durch die Steuerbehörden (HWP BuR Rz 526).'
    quelle: hwp-bur-2023__rz-0526-s263
    zitat: Besonders anspruchsvoll kann die Beurteilung von Prozessrisiken sein. Diese sind trotzdem abzuschätzen, und es ist dafür eine angemessene Rückstellung zu bilden.
  - text: 'Schwebende Geschäfte (beidseitig noch nicht oder erst teilweise erfüllt, z.B. Kauf- und Verkaufskontrakte, Liefer- oder Abnahmeverpflichtungen): Rückstellungsbedarf, sobald
      Verluste absehbar und schätzbar sind; Drohverlustrückstellungen aus Abnahmeverpflichtungen, wenn erwartete Erlöse bzw. erwarteter Nutzen tiefer liegen als die voraussichtlichen
      Einstandspreise. Die Entwicklung nach dem Stichtag wird bei der Bemessung berücksichtigt, soweit die Ursachen im vergangenen Geschäftsjahr liegen (HWP BuR Rz 525).'
    quelle: hwp-bur-2023__rz-0525-s263
    zitat: ergibt sich ein Rückstellungsbedarf, sobald Verluste absehbar und schätzbar sind
  - text: 'Restrukturierung: Die Rückstellung soll gebildet werden, wenn ein verpflichtender Beschluss des leitenden Organs vorliegt, und zwar in Höhe des realistisch geschätzten, zu
      erwartenden Aufwands, nicht bloss als grob ermittelte Pauschale (HWP BuR Rz 527).'
    quelle: hwp-bur-2023__rz-0527-s263
    zitat: Die Rückstellungen sollen dann gebildet werden, wenn ein verpflichtender Beschluss des leitenden Organs (das im Normalfall für solche Entscheide zuständig ist) vorliegt
  - text: Restrukturierungsrückstellungen, die über diese Anforderungen hinausgehen (Zeitpunkt vor dem verpflichtenden Beschluss oder Betrag über dem realistisch geschätzten Aufwand),
      sind möglich, gelten aber als stille Reserven und sind entsprechend zu behandeln (HWP BuR Rz 528). Gesetzliche Grundlage ist die Zulässigkeit freiwilliger Rückstellungen für Restrukturierungen
      (OR 960e Abs. 3 Ziff. 3, siehe oben).
    quelle: hwp-bur-2023__rz-0528-s264
    zitat: Darüber hinausgehende Rückstellungen sind möglich, gelten dann aber als stille Reserven und sind entsprechend zu behandeln.
  - text: 'Verpflichtungen zugunsten Dritter: Für Solidarbürgschaften und -schulden ist bei Gefährdung des Hauptschuldners häufig der ganze Betrag zurückzustellen (Wert der Ersatzforderung
      u.U. berücksichtigen); bei Sicherungsverpflichtungen zugunsten Nahestehender sind alle Engagements einzubeziehen; für nicht ausweispflichtige Patronatserklärungen (ohne Garantiecharakter)
      ist eine Rückstellung erforderlich, wenn sich das Unternehmen faktisch nicht anders verhalten kann und entsprechende Risiken aufgetreten sind (HWP BuR Rz 529).'
    quelle: hwp-bur-2023__rz-0529-s264
    zitat: Für Solidarbürgschaften und -schulden ist bei Gefährdung der Hauptschuldnerin bzw. des Hauptschuldners häufig der ganze Betrag zurückzustellen
  - text: 'Verwendung: Eine Inanspruchnahme durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig. Unzulässig sind die Saldierung unter artfremden Posten
      und die Umwidmung durch blosse Änderung der Bezeichnung; korrekt ist die erfolgswirksame Auflösung der nicht benötigten und die Neubildung der benötigten Rückstellung über die
      Erfolgsrechnung (HWP BuR Rz 508).'
    quelle: hwp-bur-2023__rz-0508-s260
    zitat: Eine Inanspruchnahme von Rückstellungen durch Direktbelastung auf dem Rückstellungskonto ist nur für artgleiche Posten zulässig.
  - text: 'Auflösung: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden (OR 960e Abs. 4); werden sie beibehalten, liegt eine Bildung stiller Reserven vor (HWP BuR Rz
      506).'
    quelle: hwp-bur-2023__rz-0506-s259
    zitat: müssen handelsrechtlich nicht aufgelöst werden (Art. 960e Abs. 4 OR). Werden sie beibehalten, handelt es sich um eine Bildung stiller Reserven
  - text: 'Ausweis: Rückstellungen sind gesondert im Fremdkapital auszuweisen (OR 959a Abs. 2 Ziff. 2 Bst. c) und je nach erwartetem Zeitpunkt des Mittelabflusses als kurz- oder langfristiges
      Fremdkapital zu bilanzieren (HWP BuR Rz 518).'
    quelle: hwp-bur-2023__rz-0518-s262
    zitat: Die Rückstellungen sind gesondert im Fremdkapital auszuweisen (Art. 959a Abs. 2 Ziff. 2c OR).
  - text: 'Dokumentation: Der Grundsatz der Ordnungsmässigkeit verlangt, die Zusammensetzung der Rückstellungen nach sachlichen Kriterien zu dokumentieren; das ist die Grundlage für
      die Detailaufstellung bzw. den Rückstellungsspiegel (HWP BuR Rz 505).'
    quelle: hwp-bur-2023__rz-0505-s259
    zitat: die Zusammensetzung der Rückstellungen nach sachlichen Kriterien zu dokumentieren
  - text: Eventualverbindlichkeiten sind rechtliche oder tatsächliche Verpflichtungen mit unwahrscheinlichem oder in der Höhe nicht verlässlich schätzbarem Mittelabfluss; sie werden
      nicht bilanziert, sondern im Anhang angegeben (OR 959c Abs. 2 Ziff. 10). Davon getrennt verlangt dieselbe Bestimmung den Gesamtbetrag der für Verbindlichkeiten Dritter bestellten
      Sicherheiten (Ziff. 8) und der zur Sicherung eigener Verbindlichkeiten verwendeten Aktiven (Ziff. 9).
    quelle: or__art-959c-t2
    zitat: rechtliche oder tatsächliche Verpflichtungen, bei denen ein Mittelabfluss entweder als unwahrscheinlich erscheint oder in der Höhe nicht verlässlich geschätzt werden kann
      (Eventualverbindlichkeit)
  - text: 'Inhalt der Anhangangabe zu Eventualverbindlichkeiten: Umschreibung und möglicher Umfang der Verpflichtung am Bilanzstichtag, Begründung, weshalb keine Rückstellung gebildet
      wurde, und Beurteilung der Eintretenswahrscheinlichkeit; eine gebildete Rückstellung ersetzt die Angabe einer deutlich höheren Eventualverbindlichkeit nicht; Regressansprüche mindern
      die Rückstellung, nicht aber den Ausweis der Eventualverbindlichkeit (HWP BuR Rz 854).'
    quelle: hwp-bur-2023__rz-0854-s350
    zitat: Weiter sollte ausgeführt werden, weshalb eine Verpflichtung nicht als Rückstellung erfasst wurde und wie die Eintretenswahrscheinlichkeit beurteilt wird.
  - text: 'Sicherheiten zugunsten Dritter (gesondert von den Eventualverbindlichkeiten): Der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten ist im Anhang anzugeben
      (OR 959c Abs. 2 Ziff. 8); dazu gehören insbesondere Bürgschaften, Garantieverpflichtungen, Pfandbestellungen, Sicherungszessionen und Sicherungsübereignungen. Nach dem Gesetzeswortlaut
      ist das Total der vollen Haftungssummen in einem Betrag anzugeben; eine Angabe je Art kann zweckmässig sein (HWP BuR Rz 839).'
    quelle: hwp-bur-2023__rz-0839-s346
    zitat: Der Gesamtbetrag der für Verbindlichkeiten Dritter bestellten Sicherheiten ist im Anhang anzugeben (Art. 959c Abs. 2 Ziff. 8 OR).
  - text: 'Patronatserklärung: Die verpflichtende Patronatserklärung ist im Anhang auszuweisen, nach dem Vorsichtsprinzip auch bei Zweifeln über ihre rechtliche Qualifikation oder Durchsetzbarkeit;
      als Höhe ist der Betrag zu nennen, mit dem sich die Muttergesellschaft vollumfänglich aus der Verpflichtung lösen kann (HWP BuR Rz 710, mit Verweis auf III.5.11 Sicherheiten für
      Dritte).'
    quelle: hwp-bur-2023__rz-0710-s303
    zitat: Die verpflichtende Patronatserklärung ist im Anhang auszuweisen.
  - text: 'Stille Reserven: Im Anhang anzugeben ist der Gesamtbetrag der Nettoauflösung von Wiederbeschaffungs- und darüber hinausgehenden stillen Reserven, wenn dadurch das erwirtschaftete
      Ergebnis wesentlich günstiger dargestellt wird (OR 959c Abs. 1 Ziff. 3). Für Rückstellungen relevant, weil beibehaltene nicht mehr begründete und über den Bedarf gebildete Rückstellungen
      stille Reserven sind (siehe Aussagen zu HWP BuR Rz 506 und Rz 528).'
    quelle: or__art-959c-t1
    zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
      übersteigt
  - text: 'Empfohlene Prüfungshandlungen SER (Anhang D m): Befragung über pendente Risiken, Besprechung der Einschätzung des finanziellen Ausmasses durch die Unternehmensleitung, Vorjahresvergleich
      sowie Abstimmung und kritische Durchsicht einer Detailaufstellung; weitergehend (bei angenommener wesentlicher Fehlaussage oder erhöhtem inhärentem Risiko) Abstimmung mit Verträgen,
      Klageschriften, Berechnungen und Kontendurchsicht in neuer Rechnung.'
    quelle: ser-2022__anh-d-s088-1
    zitat: Befragung über pendente Risiken (Rechtsfälle, angedrohte Schadenersatz- und andere Ansprüche usw.), die eine Rückstellung erfordern
  - text: Bei Rückstellungen sind Befragungen und analytische Prüfungshandlungen (z.B. bei Garantierückstellungen) taugliche Prüfungshandlungen (SER Ziff. 4.3.5).
    quelle: ser-2022__4-3-5
    zitat: Bei der Prüfung der Rückstellungen sind Befragungen und analytische Prüfungshandlungen (z. B. bei Garantierückstellungen) taugliche Prüfungshandlungen.
  - text: Anwaltsbestätigungen und Experten-Gutachten sind nicht Bestandteil der eingeschränkten Revision, da über sie hinausgehend (SER Anhang D m).
    quelle: ser-2022__anh-d-s088-1
    zitat: Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen (Da über die eingeschränkte Revision hinausgehend) • Einholen von Anwaltsbestätigungen
      und/oder Experten-Gutachten
  - text: Prüfungshandlungen, die nicht Bestandteil der eingeschränkten Revision sind (Anhang D), muss der Abschlussprüfer nicht durchführen und den Verzicht nicht begründen (SER Ziff.
      6.2.6).
    quelle: ser-2022__6-2-6
    zitat: Der Abschlussprüfer muss deshalb nicht begründen, weshalb er diese Prüfungshandlungen nicht durchführt.
  - text: Holt das Unternehmen bei der Erstellung der Jahresrechnung selbst eine Anwaltsbestätigung ein und liegt sie bei der Abschlusserstellung vor, gilt sie als Prüfungsnachweis,
      auch wenn sie nicht direkt an die Revisionsstelle gesandt wurde; damit lässt sich das Prüfungsrisiko in der Regel auf ein vertretbares Mass reduzieren (HWP ER Rz 139).
    quelle: hwp-er-2026__rz-0139-s204-t3
    zitat: Liegt eine Bestätigung im Zeitpunkt der Abschlusserstellung vor, wird der Abschlussprüfer diese als Prüfungsnachweis betrachten (selbst wenn diese nicht direkt an ihn gesandt
      worden ist).
  - text: 'Folge bei fehlendem Nachweis: Der Abschlussprüfer trifft in kritischer Würdigung von Befragungen, Belegen und Kontendurchsicht eine Annahme, ob eine Fehlaussage vorliegt,
      und ermisst den möglichen Fehlbetrag. Ist dieser wesentlich und korrigiert die Unternehmensleitung nicht, folgt eine eingeschränkte Prüfungsaussage; wird das Gesamtbild grundlegend
      verändert bzw. ist die Höhe der noch erforderlichen Rückstellung nicht abschätzbar bei möglicherweise grundlegender Auswirkung, ist keine Prüfungsaussage möglich (HWP ER Rz 139,
      Verweis auf SER Anhang F Beispiel 5).'
    quelle: hwp-er-2026__rz-0139-s204-t3
    zitat: Ist dieser wesentlich, gibt der Abschlussprüfer – sofern die Unternehmensleitung die Jahresrechnung nicht korrigiert – eine eingeschränkte Prüfungsaussage ab.
  - text: Wesentliche Unsicherheiten (z.B. Gerichtsentscheide, Haftungs- und Schadenfälle) erfordern eine angemessene Offenlegung im Anhang, sonst wird eine eingeschränkte oder verneinende
      Prüfungsaussage nötig. Sie beruhen stets auf der künftigen Entwicklung und sind klar abzugrenzen von Sachverhalten, die in der eingeschränkten Revision mangels ausreichender geeigneter
      Prüfungsnachweise nicht geprüft werden können (dann Annahme, vgl. HWP ER Rz 139), sowie von Beschränkungen des Prüfungsumfangs (SER Ziff. 8.3.2).
    quelle: ser-2022__8-3-2-t4
    zitat: ist eine angemessene Offenlegung im Anhang der Jahresrechnung erforderlich, da sonst eine eingeschränkte oder verneinende Prüfungsaussage erforderlich wird.
  - text: Bei einer wesentlichen Unsicherheit (z.B. künftiger Ausgang aussergewöhnlicher Rechtsstreitigkeiten) ist im Bericht anschliessend an die Prüfungsaussage ein Zusatz anzubringen,
      der die Unsicherheit zusammenfasst, auf die Angaben im Anhang verweist und festhält, dass keine Einschränkung vorliegt (HWP ER Rz 432; SER Ziff. 8.3.2.2 nennt als Voraussetzung,
      dass der Ausgang völlig offen ist).
    quelle: hwp-er-2026__rz-0432-s283
    zitat: ist im Bericht der Revisionsstelle – anschliessend an die Prüfungsaussage – ein Zusatz anzubringen
  - text: Ein Zusatz setzt die Darlegung der Unsicherheit im Anhang voraus; fehlt sie oder ist sie nicht angemessen, liegt eine Fehlaussage vor, die zur Einschränkung führt. Ein Zusatz
      kann eine Einschränkung nie ersetzen; nur echte Unsicherheiten, deren Ausgang unmöglich vorherzusehen ist, führen zu einem Zusatz (HWP ER Rz 433).
    quelle: hwp-er-2026__rz-0433-s283
    zitat: In keinem Fall kann ein Zusatz infolge einer wesentlichen Unsicherheit eine Einschränkung ersetzen.
  agent:
  - 'O1-101/102/103 (Befragung): Der Agent kann nicht selbst befragen. Er wertet schriftliche Antworten aus (revio 10.11 Kundenbefragung, Vollständigkeitserklärung mit Beilage Rechtsstreitigkeiten,
    ser-2022__anh-e-s104-2, und Eventualverbindlichkeiten, ser-2022__anh-e-s104-1). Sonst erfasst er eine Pendenz mit konkreten Fragen: pendente Klagen oder angedrohte Ansprüche, Garantiefälle,
    Restrukturierungsbeschlüsse, bedeutende schwebende Geschäfte mit Verlustrisiko (ser-2022__anh-d-s097-2). Sicherheiten zugunsten Dritter (Bürgschaften, Garantieverpflichtungen, Pfandbestellungen)
    gehören zu T1-105 (OR 959c Abs. 2 Ziff. 8), nicht zu den Eventualverbindlichkeiten (T1-107, Ziff. 10); Patronatserklärungen gesondert erfragen. Status höchstens «teilweise bearbeitet».'
  - 'PBC/Unterlagen aus M-Files: Rückstellungsspiegel (Bestand VJ, Bildung, Verwendung, Auflösung, Bestand) mit Begründung je Position (Dokumentation nach sachlichen Kriterien: hwp-bur-2023__rz-0505-s259;
    Rückstellungsspiegel im Anhang zweckmässig: hwp-bur-2023__rz-0519-s262), Klageschriften und Anwaltskorrespondenz, vom Unternehmen eingeholte Stellungnahmen der Prozessanwälte (hwp-bur-2023__rz-0526-s263;
    als Nachweis verwendbar: hwp-er-2026__rz-0139-s204-t3), Garantiestatistik bzw. Erfahrungszahlen, VR-Beschluss zur Restrukturierung, GV- und VR-Protokolle (ser-2022__anh-d-s073-1)
    für Restrukturierungsbeschlüsse und Rechtsfälle, Verträge zu Bürgschaften, Garantien, Pfandbestellungen und Patronatserklärungen mit Haftungsbetrag, Steuerkorrespondenz (ser-2022__anh-d-s089-2)
    sowie Rechnungen für Rechtsberatung in neuer Rechnung. Fehlt etwas: Pendenz mit Konto, Datum und Betrag. Anfragen an den Kunden nur als Entwurf oder an die fixe WP-Adresse.'
  - 'O1-201/M3-202 (analytisch): Vorjahresvergleich je Rückstellung mit dem Rechenmodul (`rechne`), nie im Kopf; analytische Handlungen sind z.B. bei Garantierückstellungen tauglich
    (ser-2022__4-3-5). Auffällige Auflösungen oder Erhöhungen begründen lassen. Auflösungen nur insoweit in die Übersicht der stillen Reserven übernehmen, als die Rückstellung bereits
    zuvor nicht mehr begründet oder über den Bedarf hinaus gebildet war (hwp-bur-2023__rz-0506-s259; hwp-bur-2023__rz-0528-s264); übrige Auflösungen sind erfolgswirksame Auflösungen
    nicht benötigter Rückstellungen mit Ausweis analog zur Bildung (hwp-bur-2023__rz-0509-s260).'
  - 'O1-301 (Detail): Detailaufstellung mit der Bilanz abstimmen (Rechenmodul). Je Position die drei Voraussetzungen nach den Angaben des Unternehmens festhalten: vergangenes Ereignis,
    erwarteter Mittelabfluss in künftigen Geschäftsjahren, verlässliche Schätzung (hwp-bur-2023__rz-0496-s258); unter 50 % Eintretenswahrscheinlichkeit nicht automatisch «unwahrscheinlich»
    (hwp-bur-2023__rz-0515-s261). Der Agent dokumentiert, die Beurteilung trifft der WP. Den Nachweis (M-Files-ID und Version) im Textfeld nennen. Prüfen, ob die Bildung zulasten der
    sachlich zugehörigen Erfolgsrechnungsposition erfolgte (hwp-bur-2023__rz-0504-s259), die Verwendung als Bestandsbuchung nur für artgleiche Posten (hwp-bur-2023__rz-0507-s259, hwp-bur-2023__rz-0508-s260)
    und der Ausweis gesondert im Fremdkapital, kurz- oder langfristig (hwp-bur-2023__rz-0518-s262). Der Abgleich mit Klageschriften und Verträgen ist O1-302 (WP-Schritt).'
  - 'Notiz «Wesentliche Feststellungen» (Hinweis auf möglichen Fehler, Buchungsvorschlag nur als Notiz, ohne Verbuchung) u.a. bei: bekanntem Prozess ohne Rückstellung und ohne Anhangangabe
    (vgl. ser-2022__anh-f-s120-2); Umwidmung oder Verrechnung zwischen artfremden Rückstellungen ohne Umweg über die Erfolgsrechnung (hwp-bur-2023__rz-0508-s260); Aufbau einer bestehenden
    Verpflichtung über mehrere Jahre (hwp-bur-2023__rz-0513-s261); Solidarbürgschaft bei gefährdetem Hauptschuldner ohne Rückstellung (hwp-bur-2023__rz-0529-s264); absehbaren und schätzbaren
    Verlusten aus schwebenden Geschäften ohne Rückstellung (hwp-bur-2023__rz-0525-s263). Keine Feststellung ist eine Restrukturierungsrückstellung ohne verpflichtenden Beschluss oder
    über den realistisch geschätzten Aufwand hinaus: Sie ist eine zulässige freiwillige Rückstellung (or__art-960e, Abs. 3 Ziff. 3) mit Charakter stiller Reserven (hwp-bur-2023__rz-0528-s264,
    hwp-bur-2023__rz-0669-s296) und gehört in die Übersicht der stillen Reserven (O1-321); eine allfällige steuerliche Folge nur als Steuerrecht gekennzeichnet nennen (hwp-bur-2023__rz-0212-s107).'
  - O1-302/O1-303 und M3-302/304/305 sind WP-Schritte (nur Mensch). Der Agent bereitet sie nur auf ausdrückliche Anweisung vor, z.B. eine Liste der Zahlungen zulasten Rückstellungen
    und des Rechtsaufwands in neuer Rechnung. Die Kontendurchsicht in neuer Rechnung, auf die sich die Annahme nach hwp-er-2026__rz-0139-s204-t3 stützt, ist O1-303 und damit WP-Schritt.
    Die Beurteilung bleibt beim WP.
  - 'O1-401 Anwaltsbestätigungen/Experten-Gutachten (ebenso R1-401): ohne Anweisung nicht bearbeiten (Status «nicht bearbeitet – nur auf Anweisung»), da nicht Bestandteil der SER (ser-2022__anh-d-s088-1,
    ser-2022__6-2-6, hwp-er-2026__rz-0262-s085). Auf ausdrückliche Anweisung des WP höchstens einen Anfrageentwurf vorbereiten; nie selbst an Anwälte oder Kunden versenden (E-Mail nur
    als Entwurf oder an die fixe WP-Adresse). Liegt eine vom Unternehmen eingeholte Bestätigung in M-Files, verwendet der Agent sie als Nachweis (hwp-er-2026__rz-0139-s204-t3). Ist das
    Risiko nur mit einer Bestätigung reduzierbar, erfasst er eine Notiz für den WP; die Annahme trifft der WP (hwp-er-2026__rz-0139-s204-t2).'
  - 'O1-320/M3-320/T1 (Anhang): Prüfen, ob Eventualverbindlichkeiten (OR 959c Abs. 2 Ziff. 10; T1-107) mit Umschreibung, möglichem Umfang, Begründung und Eintretenswahrscheinlichkeit
    angegeben sind (hwp-bur-2023__rz-0854-s350); bei Prozessen auch klagende Partei, Streitwert und Stand des Verfahrens (hwp-bur-2023__rz-0855-s351-t1). Gesondert davon den Gesamtbetrag
    der für Verbindlichkeiten Dritter bestellten Sicherheiten (Ziff. 8; T1-105) mit Bürgschaften, Garantieverpflichtungen und Pfandbestellungen (hwp-bur-2023__rz-0839-s346) sowie verpflichtende
    Patronatserklärungen (hwp-bur-2023__rz-0710-s303) prüfen. Ausserordentliche, einmalige oder periodenfremde Bildungen fallen unter Ziff. 12 (hwp-bur-2023__rz-0504-s259), Auflösungen
    ebenso analog zur Bildung (hwp-bur-2023__rz-0509-s260; T1-310). SER-Befragung zu Eventualverbindlichkeiten: ser-2022__anh-d-s097-2.'
  - 'O1-321/M3-321 (stille Reserven): Nicht mehr begründete, aber beibehaltene sowie über den Bedarf hinaus gebildete Rückstellungen (inkl. freiwilliger Restrukturierungsrückstellungen
    nach OR 960e Abs. 3) in der Übersicht der stillen Reserven führen und mit dem Vorjahr vergleichen (hwp-bur-2023__rz-0506-s259, hwp-bur-2023__rz-0528-s264, hwp-bur-2023__rz-0659-s294,
    hwp-bur-2023__rz-0669-s296, hwp-bur-2023__rz-0671-s297). Befragung nach der Berechnungsmethode im Vorjahresvergleich (ser-2022__anh-d-s097-2; T1-111). Bei einer Nettoauflösung prüfen,
    ob die Anhangangabe vorhanden ist (T1-305); ob sie wesentlich ist, entscheidet der WP.'
  - 'Abgrenzung M3/O1: Provisionen, laufende Steuern, Ferien- und Überzeitguthaben, Boni sowie Kundenbindungsprogramme fallen eher unter passive Rechnungsabgrenzungen (hwp-bur-2023__rz-0512-s261;
    Ferien/Überzeit: qa-or-rechnungslegung-2026__2-2-t1). Rückstellungen werden je nach erwartetem Zeitpunkt des Mittelabflusses kurz- oder langfristig ausgewiesen (hwp-bur-2023__rz-0518-s262).
    Fehlklassierungen meldet der Agent als Feststellung, nicht als Fehler im Ergebnis.'
  - 'Steuern (S1): Laufende Steuern sind eher passive Rechnungsabgrenzung (hwp-bur-2023__rz-0512-s261); Steuerrisiken aus gewählten Steuerpositionen werden analog zu Prozessrisiken beurteilt
    (hwp-bur-2023__rz-0526-s263). SER Anhang D n: Befragung zu Steuerrevisionen, Rückfragen, hängigen Einsprachen und Rekursen sowie Einblick in die Korrespondenz (ser-2022__anh-d-s089-2).
    S1-304 (Steuerrückstellungen auf dem laufenden Gewinn) bereitet der Agent vor; S1-102 bis S1-104 sind WP-Schritte (nur Mensch). Steuerliche Sicht immer als Steuerrecht bzw. Praxis
    kennzeichnen: Die steuerrechtliche Zulässigkeit kann von der handelsrechtlichen abweichen, und nicht mehr begründete Rückstellungen werden steuerlich zugerechnet (Art. 29/63 DBG;
    hwp-bur-2023__rz-0212-s107). Laut Fachliteratur sind pauschale Rückstellungen für Grossreparaturen steuerlich grundsätzlich nicht mehr zulässig (ef-2026-08-buchungslogik__s002-4).
    Steuerlich zulässige Pauschalen ersetzen die Ermittlung der handelsrechtlich notwendigen Rückstellung nicht; darüber hinausgehende Beträge sind weitere (nicht notwendige) Rückstellungen
    (hwp-bur-2023__rz-0513-s261).'
  - 'Ereignisse nach dem Bilanzstichtag: Liegt die Ursache vor dem Stichtag, ist der Verlust zurückzustellen; liegt sie danach, besteht i.d.R. keine Rückstellungspflicht (hwp-bur-2023__rz-0517-s262;
    schwebende Geschäfte: hwp-bur-2023__rz-0525-s263); wird trotzdem zurückgestellt, ist das als stille Reserve zulässig (hwp-bur-2023__rz-0531-s264). Entwicklungen bei Rückstellungen
    und Eventualverbindlichkeiten möglichst nahe am Berichtsdatum erfragen lassen (hwp-er-2026__rz-0321-s255-t1, -t2, ser-2022__anh-d-s100-1). Offene Antworten erfasst der Agent als
    Pendenz.'
  - 'Kapitalschutz (P6): Rückstellungen gehören zum Fremdkapital für die Überschuldungsprüfung (hwp-er-2026__rz-0381-s115). Ein vergrösserter Rückstellungsbedarf oder aktualisierte Eventualverbindlichkeiten
    können Anlass zu begründeter Besorgnis sein (hwp-er-2026__rz-0385-s115). Diese Hinweise meldet der Agent dem WP.'
  - 'Bericht (P5): Ob eine Einschränkung, eine verneinende Prüfungsaussage, keine Prüfungsaussage oder ein Zusatz wegen wesentlicher Unsicherheit nötig ist, entscheidet ausschliesslich
    der WP. Für die Notiz die Abgrenzung festhalten: wesentliche Unsicherheit mit offenem Ausgang und angemessener Anhangangabe → Zusatz (ser-2022__8-3-2-t3, hwp-er-2026__rz-0432-s283);
    fehlende oder ungenügende Anhangangabe → Fehlaussage (hwp-er-2026__rz-0433-s283; Beispiel ser-2022__anh-f-s120-2); in der SER nicht prüfbarer Sachverhalt → Annahme mit möglicher
    Einschränkung oder keiner Prüfungsaussage (ser-2022__8-3-2-t4, hwp-er-2026__rz-0139-s204-t3). Der Agent erfasst nur die Notiz «Schlussbesprechung» mit Sachverhalt, Fundstellen und
    Betragsschätzung. Er setzt kein Visum, keinen Abschluss und keine Berichtsentwürfe als final.'
