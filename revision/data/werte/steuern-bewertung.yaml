- key: estv_abschreibung_faktor_anschaffungswert
  bezeichnung: Umrechnung der ESTV-Abschreibungssätze bei Abschreibung vom Anschaffungswert
  wert: '0.5'
  einheit: Faktor auf Buchwert-Satz
  gilt: ESTV-Merkblatt A/1995 (Fassung gemäss ESTV-Liste 10.10.2023), direkte Bundessteuer
  kategorie: steuern_bewertung
  bemerkung: 'Steuerpraxis (DBG), keine handelsrechtliche Bewertungsregel. Handelsrechtlich: hwp-bur-2023__rz-0332-s229 «Verteilung der Anschaffungs- oder Herstellungskosten auf die
    voraussichtliche Nutzungsdauer»; mehr als nötig = stille Reserve (Art. 960a Abs. 4 OR). Steuerlich nur verbuchte Abschreibungen: dbg__art-62 «Geschäftsmässig begründete Abschreibungen
    von Aktiven sind zulässig, soweit sie buchmässig oder, bei vereinfachter Buchführung nach Artikel 957 Absatz 2 OR, in besonderen Abschreibungstabellen ausgewiesen sind.» Die Normalsätze
    gelten in Prozenten des Buchwerts (degressiv); vom Anschaffungswert (linear) gilt die Hälfte. Geltungsbereich: estv-mb-a-1995__s001-5 «Dieses Merkblatt gilt ausschliesslich für Abschreibungen
    gemäss Art. 960a Abs. 3 OR.» Nachholung unterlassener Abschreibungen nur mit Nachweis: estv-mb-a-1995__s001-4 «Wer Abschreibungen nachzuholen begehrt, ist verpflichtet, deren Begründetheit
    nachzuweisen.» Nachholung nur, wenn das Unternehmen estv-mb-a-1995__s001-4 «wegen schlechten Geschäftsganges keine genügenden Abschreibungen vornehmen konnte». Kantonale Sonderverfahren
    (z.B. Sofortabschreibung): estv-mb-a-1995__s001-4 «Besondere Abschreibungsverfahren dieser Art können auch für die direkte Bundessteuer angewendet werden, sofern sie über längere
    Zeit zum gleichen Ergebnis führen.» Aufgewertete Aktiven (Art. 725c OR): dbg__art-62 «Abschreibungen auf Aktiven, die zum Ausgleich von Verlusten höher bewertet wurden, können nur
    vorgenommen werden, wenn die Aufwertungen handelsrechtlich zulässig waren und die Verluste im Zeitpunkt der Abschreibung nach Artikel 67 Absatz 1 verrechenbar gewesen wären.» (gleichlautend
    MB A Ziff. 5, estv-mb-a-1995__s001-5) → dem WP melden.'
  pruefnotiz: 'Original: raw/estv-mb-a-1995.pdf S. 1 (Layout geprüft). Sekundär gleichlautend: Treuhand-Almanach 2026 Tab. 26 (treuhand-almanach-2026__s061-1).'
  quelle: estv-mb-a-1995__s001-5
  zitat: Für Abschreibungen auf dem Anschaffungswert sind die genannten Sätze um die Hälfte zu reduzieren.
  status: agent-geprueft
