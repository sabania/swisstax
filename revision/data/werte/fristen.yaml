- key: mwst_umsatzabstimmung_frist
  bezeichnung: Frist für die Umsatzabstimmung (Inhalt nach Art. 128 Abs. 2 MWSTV)
  wert: '180'
  einheit: Tage
  gilt: PH 20 (02-2016)
  kategorie: fristen
  bemerkung: 'PH 20 Anhang 2, B 1: Liegt für das Vorjahr eine plausible und nachvollziehbare Umsatzabstimmung vor? Abweichungen sind zu begründen. Inhalt: mwstv__art-128-t1 «Aus der
    Umsatzabstimmung muss ersichtlich sein, wie die Deklaration für die Steuerperiode» mit dem Jahresabschluss übereinstimmt; die ESTV kann sie einfordern (Art. 128 Abs. 1 Bst. d MWSTV).
    Die 180 Tage stehen nicht in Art. 128 MWSTV; vgl. Korrekturfrist Art. 72 Abs. 1 MWSTG (mwst_finalisierung_180_tage). Fehlt die Umsatzabstimmung: Pendenz erfassen und als Vorschlag
    für die PBC-Liste (revio 10.10) aufnehmen. Die Anforderung beim Kunden macht der Mensch (konzept-ki-revisionsagent-2026__c011-2 «fehlende Unterlagen als Vorschlag für die PBC-Liste
    (10.10)» und «Anforderung beim Kunden durch den Menschen»; konzept-ki-revisionsagent-2026__c009-3 «ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand»).'
  quelle: ph-20-mwst-2016__c011-5
  zitat: Die Umsatzabstimmung ist vom Unternehmen innert 180 Tagen zu erstellen
  status: agent-geprueft
