  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026; HRegV, Fassung Stand 01.10.2026 (Art. 62)
  kategorie: fristen
  bemerkung: 'Art. 727a Abs. 2 OR: Verzicht nur für künftige Geschäftsjahre. HRegV Art. 62: Erklärung (keine Pflicht zur ordentlichen Revision; höchstens 10 Vollzeitstellen; Verzicht
    aller Aktionäre) mit dem Datum des Geschäftsjahresbeginns, ab dem der Verzicht gilt, unterzeichnet von mindestens einem VR-Mitglied. Beilagen u.a. die genehmigte Jahresrechnung
    des letzten Geschäftsjahres und die Verzichtserklärungen bzw. das GV-Protokoll (Abs. 2, hregv__art-62-t1). Schon bei der Gründung möglich (Abs. 3). Fehlende Jahresrechnung bei
    der Steuerbehörde oder Anschein fehlender Voraussetzungen → HR-Amt fordert Erneuerung oder Revisionsstelle; sonst Überweisung ans Gericht (Abs. 5/6, hregv__art-62-t2). Agent:
    Verzichtserklärung bzw. HR-Eintrag mit dem zu prüfenden Geschäftsjahr abgleichen → Rapport; Entscheid WP.'
