  gilt: SER, Ausgabe 2022
  kategorie: fristen
  bemerkung: 'SER 8.6, gleicher Chunk: «darf der Abschlussprüfer den Revisionsbericht frühestens auf den Zeitpunkt datieren, an dem die Unternehmensleitung den Abschluss unterzeichnet
    oder formell gutgeheissen hat». Unternehmensleitung = VR: «Unternehmensleitung (z.B. Verwaltungsrat einer Aktiengesellschaft) den Abschluss unterzeichnet oder formell gutgeheissen
    hat» (HWP ER Rz 448, hwp-er-2026__rz-0448-s287 – nicht Rz 448 auf S. 131 zum Kapitalverlust); Vollständigkeitserklärung auf dieses Datum zusammen mit der Jahresrechnung unterzeichnen
    (ebenda). Die GV-Genehmigung folgt erst danach: der Revisionsbericht muss vorliegen, bevor die GV genehmigt (Art. 731 Abs. 1 OR, or__art-731). Der Agent datiert und unterzeichnet
    nie; Datum setzt der WP (Konzept consis).'
  quelle: ser-2022__8-6
  zitat: Der Revisionsbericht trägt das Datum, an dem die eingeschränkte Revision beendet wurde.
