- key: or727c_zugelassener_revisor
  bezeichnung: 'Revisionsstelle bei eingeschränkter Revision: Zulassung'
  wert: zugelassener Revisor nach RAG
  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: revisionspflicht
  bemerkung: 'Art. 727c OR. Zum Vergleich ordentliche Revision: «einen zugelassenen Revisionsexperten nach den Vorschriften des Revisionsaufsichtsgesetzes» (Art. 727b Abs. 2 OR, or__art-727b);
    Publikumsgesellschaften: staatlich beaufsichtigtes Revisionsunternehmen (Art. 727b Abs. 1 OR). Angaben zur leitenden Person und deren fachlicher Befähigung gehören in den Bericht
    (Art. 729b Abs. 1 Ziff. 4 OR). Revisionsunternehmen werden «für die Dauer von fünf Jahren zugelassen», natürliche Personen unbefristet (RAG 3 Abs. 2, rag__art-3). Alle Personen,
    die Revisionsdienstleistungen leiten, brauchen die Zulassung (RAG 6 Abs. 1 lit. c, rag__art-6). Das HR-Amt prüft die Zulassung durch Einsicht ins RAB-Register (HRegV 61 Abs. 2,
    hregv__art-61). Agent: Gültigkeit der Zulassung (Unternehmen und leitende Person) im RAB-Register als Pendenz festhalten; Entscheid WP.'
  quelle: or__art-727c
  zitat: müssen als Revisionsstelle einen zugelassenen Revisor nach den Vorschriften des Revisionsaufsichtsgesetzes
  status: agent-geprueft
