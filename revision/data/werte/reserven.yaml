    Gruppengesellschaften mit Sitz in der Schweiz). Bei Verstoss setzt die Revisionsstelle eine Frist, informiert sonst die GV und danach die Bürgschaftsorganisation (Art. 23 Abs. 1,
    covid-sbueg__art-23; gilt auch bei eingeschränkter Revision). Gesetz gilt bis 31.12.2032 (covid-sbueg__art-31). Agent: offenen Covid-Kredit beim Gewinnverwendungsantrag als Pendenz/Rapport
