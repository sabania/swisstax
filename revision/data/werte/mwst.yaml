  kategorie: mwst
  bemerkung: 'Bewilligter Satz massgebend: mwstg__art-37 «mit dem von der ESTV bewilligten Saldosteuersatz ermittelt». Nachschlagen: `suche "<Branche>" --quelle estv-vo-sss` → `zeige
    <Chunk-Id des Treffers>` (Anhang in 16 Teilen: estv-vo-sss__anhang-t1 bis estv-vo-sss__anhang-t16). Beispiel: estv-vo-sss__anhang-t2 «Architekturbüro, einschliesslich Bauleitung
    | 6,2 %». Herstellungssätze nur mit Material: estv-vo-sss__art-1 «Die für Herstellungsbranchen und -tätigkeiten geltenden SSS sind nur anwendbar, wenn im Preis für die Leistung auch
    das Material eingeschlossen ist.» In Kraft: estv-vo-sss__art-3 «Diese Verordnung tritt am 1. Januar 2025 in Kraft.» Für Perioden vor 2025 galt die aufgehobene VO: estv-vo-sss__art-2
    «Die Verordnung der ESTV vom 6. Dezember 2010 über die Höhe der Saldosteuersätze nach Branchen und Tätigkeiten wird aufgehoben.» Passt der bewilligte Satz nicht zur Branche: Pendenz
    an den WP (Prüffeld M2).'
