    Saldosteuersätze.» Für Perioden vor dem Stand der Wiki-Fassung die damalige MWSTV prüfen (früher höchstens zwei Sätze). Wegfall: mwstv__art-86 «so fällt die Bewilligung zur Anwendung
    des betreffenden Saldosteuersatzes auf den Beginn der vierten Steuerperiode dahin».'
