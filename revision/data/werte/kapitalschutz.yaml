    den Gesetzesverstoss ohne Wesentlichkeitsprüfung aufzunehmen: «sind in jedem Fall im Revisionsbericht anzubringen» (SER 8.3.2.1, ser-2022__8-3-2-t1). Agent erfasst Pendenz/Entwurf;
