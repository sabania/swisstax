- key: or725b_ueberschuldung
  bezeichnung: 'Überschuldung: Auslöser'
  wert: 'begründete Besorgnis: Verbindlichkeiten nicht mehr durch Aktiven gedeckt'
  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: kapitalschutz
  bemerkung: 'Art. 725b Abs. 1–3 OR: VR erstellt unverzüglich Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten, lässt sie durch die Revisionsstelle prüfen und benachrichtigt
    bei Überschuldung das Gericht (Ausnahmen Abs. 4: Rangrücktritt, Sanierung innert 90 Tagen). SER Kapitel 9 (ser-2022__9-t1). Bleibt der VR untätig: Hinweis im Revisionsbericht ohne
    Wesentlichkeitsprüfung («sind in jedem Fall im Revisionsbericht anzubringen», SER 8.3.2.1, ser-2022__8-3-2-t1) und zusätzlich Anzeigepflicht nach Art. 729c OR. Agent erfasst Pendenz/Entwurf;
    ob ein Hinweis erfolgt, wie er lautet und ob eine Anzeige nach Art. 729c OR erfolgt, entscheidet ausschliesslich der WP.'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
  status: agent-geprueft
- key: hwp_er_zwischenabschluss_immer
