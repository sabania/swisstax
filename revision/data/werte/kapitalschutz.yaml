# Werte Kategorie kapitalschutz – je Wert Fundstelle (quelle/zitat). Erfasst 2026-11-13.
werte:
- key: or725a_kapitalverlust_haelfte
  bezeichnung: 'Kapitalverlust: Schwelle'
  wert: '50'
  einheit: '% des geschützten Kapitals (Hälfte; Key hwp_er_geschuetztes_kapital)'
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: kapitalschutz
  bemerkung: 'Art. 725a Abs. 1 OR, massgebend ist die letzte Jahresrechnung: Aktiven − Verbindlichkeiten < Hälfte des geschützten Kapitals (Reserven zusammen höchstens 50 %, Holding
    20 %, des AK/PS; Key hwp_er_geschuetztes_kapital). Ohne Revisionsstelle eingeschränkte Revision durch zugelassenen Revisor (Abs. 2). Agent: rechnen, WP sofort informieren (gebotene
    Eile, Abs. 4) und für den Bericht markieren. Bleibt der VR untätig, ist der Hinweis zwingend, ohne Wesentlichkeitsprüfung («sind in jedem Fall im Revisionsbericht anzubringen», SER
    8.3.2.1, ser-2022__8-3-2-t1). Ob Untätigkeit vorliegt und wie der Hinweis lautet, bestimmt der WP. Nächster Aufruf: `kapitalverlust --aktienkapital … --eigenkapital … [--kapitalreserve
    … --gewinnreserve … --holding --reserve-voll … --covid-kredit …]`, dann `aufgabe kapitalschutz`. GmbH: Art. 820 OR.'
  quelle: or__art-725a
  zitat: die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve nicht mehr decken
  status: agent-geprueft
- key: hwp_er_kapitalverlust_feststellung
  bezeichnung: 'Kapitalverlust: Feststellung'
  wert: 0 ≤ bilanzielles Eigenkapital < Hälfte des geschützten Eigenkapitals
  einheit: Text
  gilt: HWP ER, Ausgabe 2026
  kategorie: kapitalschutz
  bemerkung: 'HWP ER Rz 371–372: Bezugsgrösse = Hälfte des geschützten Eigenkapitals; Vergleich mit dem bilanziellen Eigenkapital (Aktiven ./. Verbindlichkeiten) der letzten Jahresrechnung.
    Eigenkapital < 0 → Überschuldung prüfen (Art. 725b OR).'
  quelle: hwp-er-2026__rz-0372-s112
  zitat: Ist das bilanzielle Eigenkapital grösser oder gleich null, aber kleiner als die Bezugsgrösse des geschützten Eigenkapitals
  status: agent-geprueft
- key: hwp_er_geschuetztes_kapital
  bezeichnung: 'Kapitalverlust: geschütztes Kapital (Bezugsgrösse)'
  wert: AK/PS + gesetzliche Kapitalreserve und gesetzliche Gewinnreserve im engeren Sinn (Art. 672 Abs. 1 OR) zusammen höchstens 50 % (Holding 20 %) des im HR eingetragenen AK/PS + voller
    Betrag der Reserven für eigene Kapitalanteile im Konzern (Art. 659b Abs. 2) und der Aufwertungsreserve (Art. 725c Abs. 1)
  einheit: Text
  gilt: HWP ER, Ausgabe 2026
  kategorie: kapitalschutz
  bemerkung: 'HWP ER Rz 370. Schwelle = Hälfte davon, Vergleich mit dem bilanziellen Eigenkapital der letzten Jahresrechnung (Rz 371). Rechner: kapitalverlust --aktienkapital … --eigenkapital
    … --kapitalreserve … --gewinnreserve … [--holding] [--reserve-voll …].'
  quelle: hwp-er-2026__rz-0370-s112
  zitat: im Betrag von zusammen maximal 50 % – resp. bei Holdinggesellschaften 20 % –
  status: agent-geprueft
- key: qa_kv_eigene_anteile
  bezeichnung: 'Kapitalverlust: Einfluss eigener Kapitalanteile'
  wert: geschütztes Eigenkapital bleibt unverändert
  einheit: Text
  gilt: Q&A EXPERTsuisse 06-2023
  kategorie: kapitalschutz
  bemerkung: Eigene Kapitalanteile vermindern nur das frei verfügbare Eigenkapital (Q&A Frage 1).
  quelle: qa-kapitalverlust-2023__1-1-t1
  zitat: Das geschützte Eigenkapital und damit die Bezugsgrösse nach Art. 725a OR resp. PS-CH 290 bleiben unverändert.
  status: agent-geprueft
- key: covid_sbueg24_kein_fremdkapital
  bezeichnung: 'Kapitalverlust/Überschuldung: Kredite nach Art. 3 Covid-19-SBüV nicht als Fremdkapital'
  wert: nur Kredite nach Art. 3 Covid-19-SBüV (bis 31.12.2032)
  einheit: Text
  gilt: Covid-19-SBüG, Fassung Stand 31.03.2026; in Kraft 19.12.2020 bis 31.12.2032 (Art. 31 Abs. 2)
  kategorie: kapitalschutz
  bemerkung: 'Art. 24 Abs. 1 Covid-19-SBüG für OR 725a Abs. 1 und 725b Abs. 1. Abs. 2: gilt sinngemäss für alle Rechtsformen mit Anzeigepflicht nach OR 725a/725b (z.B. GmbH). Kredite
    nach Art. 4 Covid-19-SBüV (vgl. Art. 3 Abs. 1 Bst. b SBüG) nennt Art. 24 nicht. Im Rechner nur Kredite nach Art. 3 SBüV abziehen; bei Zweifeln Pendenz an den WP. Entfällt dadurch
    der Kapitalverlust, entfällt auch die Prüfpflicht nach Art. 725a Abs. 2 OR (Q&A Frage 2, qa-kapitalverlust-2023__1-1-t1). Nächster Aufruf: kapitalverlust … --covid-kredit <Betrag>.'
  quelle: covid-sbueg__art-24
  zitat: werden Kredite, die gestützt auf Artikel 3 Covid-19-SBüV verbürgt wurden, nicht als Fremdkapital berücksichtigt
  status: agent-geprueft
- key: covid_sbueg2_ausschuettungsverbot
  bezeichnung: 'Covid-19-Kredit offen: Ausschüttungs- und Darlehensverbot'
  wert: keine Dividenden, Tantiemen, Rückerstattung von Kapitaleinlagen; keine Darlehen an Gesellschafter oder Nahestehende und keine Rückzahlung ihrer Darlehen
  einheit: Text
  gilt: 'Covid-19-SBüG, Fassung Stand 31.03.2026; während der Solidarbürgschaft: höchstens 8 Jahre, bei verlängerter Amortisation (höchstens 10 Jahre) weiter (Art. 3); Gesetz gilt bis
    31.12.2032 (Art. 31)'
  kategorie: kapitalschutz
  bemerkung: 'Art. 2 Abs. 2 Bst. a–b Covid-19-SBüG; Ausnahmen für vorbestehende Pflichten gegenüber Gruppengesellschaften stehen im Wortlaut. Ebenso verboten: Rückführung von Gruppendarlehen
    mit Kreditmitteln, Übertragung an ausländische Gruppengesellschaften (Bst. c–d) und Umschuldung vorbestehender Kredite (Abs. 3). Prüfen beim Antrag über die Verwendung des Bilanzgewinns
    (OR 729a Abs. 1 Ziff. 2). Stellt die Revisionsstelle eine Verletzung von Art. 2 Abs. 2–4 fest, setzt sie eine Frist, informiert dann die GV und danach die Bürgschaftsorganisation
    (Art. 23 Abs. 1, gilt ausdrücklich auch bei der eingeschränkten Revision). Agent: nur Notiz «Wesentliche Feststellungen» und Meldung an den WP (regeln covid_ausschuettung; aufgabe
    gvb-bericht).'
  quelle: covid-sbueg__art-2-t1
  zitat: Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen
  status: agent-geprueft
