- key: or725b_ueberschuldung
  bezeichnung: 'Überschuldung: Auslöser'
  wert: 'begründete Besorgnis: Verbindlichkeiten nicht mehr durch Aktiven gedeckt'
  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: kapitalschutz
  bemerkung: 'Art. 725b Abs. 1–3 OR: VR erstellt unverzüglich Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten, lässt sie durch die Revisionsstelle prüfen und benachrichtigt
    bei Überschuldung das Gericht (Ausnahmen Abs. 4: Rangrücktritt, Sanierung innert 90 Tagen). SER Kapitel 9 (ser-2022__9-t1). Agent: WP sofort informieren und markieren. Bleibt der
    VR untätig: Hinweis zwingend (SER 8.3.2.1, ser-2022__8-3-2-t1) und zusätzlich Anzeigepflicht nach Art. 729c OR. Ob Untätigkeit vorliegt, wie der Hinweis lautet und ob angezeigt wird,
    entscheidet der WP. Nächster Aufruf: `aufgabe kapitalschutz`.'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
  status: agent-geprueft
- key: hwp_er_zwischenabschluss_immer
  bezeichnung: 'Überschuldung: Zwischenabschluss auch kurz nach Bilanzstichtag'
  wert: keine Erleichterung innert sechs Monaten ab Bilanzstichtag (eng begrenzte Ausnahmen)
  einheit: Text
  gilt: HWP ER, Ausgabe 2026
  kategorie: kapitalschutz
  bemerkung: 'HWP ER Rz 402 (ebenso Q&A Frage 10): Zwischenabschluss grundsätzlich in jedem Fall einverlangen; er startet die 90-Tage-Frist und dient der Bemessung des Rangrücktritts.
    «Einzig denkbare Ausnahmen» (gleicher Chunk): Konkursanmeldung bei massiver, offensichtlicher Überschuldung, wenn sehr rasches Handeln geboten ist; Stichtag der Jahresrechnung und
    des Zwischenabschlusses fallen zusammen – dann ggf. zusätzlich Abschluss zu Veräusserungswerten, und «Auch in diesem Fall sind jedoch zwei Berichte zu verfassen» (Jahresrechnung
    und PS-CH 290; hwp-er-2026__rz-0402-s120-t3). Ob eine Ausnahme vorliegt, entscheidet der WP.'
  quelle: hwp-er-2026__rz-0402-s120-t2
  zitat: Art. 725 b OR sieht eine solche Erleichterung nicht vor.
  status: agent-geprueft
- key: hwp_er_rangruecktritt_polster
  bezeichnung: 'Rangrücktritt: Sicherheitspolster für erwartete Verluste'
  wert: '12'
  einheit: Monate
  gilt: HWP ER, Ausgabe 2026
  kategorie: kapitalschutz
  bemerkung: 'HWP ER Rz 421: Sind weitere Verluste absehbar, Rangrücktritt nicht bloss in Höhe des Fremdkapitalüberhangs bei Gewährung, sondern inkl. Polster für die in den nächsten
