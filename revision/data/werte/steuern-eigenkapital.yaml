  zitat: Massgebend sind die Verkehrswerte am Ende der Steuerperiode.
  status: agent-geprueft
- key: ks6a_verdecktes_ek_ermittlung
  bezeichnung: 'Verdecktes Eigenkapital: Ermittlung (ausgewiesene Schulden über dem zulässigen Fremdkapital)'
  wert: Ausgewiesene Schulden (gesamtes Fremdkapital) − zulässiges Fremdkapital (Summe Verkehrswert × Belehnungssatz); verdeckt nur, soweit von Anteilsinhabern/Nahestehenden stammend
  einheit: Regel
  gilt: ab 10.10.2024 (KS ESTV Nr. 6a)
  kategorie: steuern_eigenkapital
  bemerkung: 'Verglichen wird das gesamte ausgewiesene Fremdkapital mit dem zulässigen Fremdkapital (Belehnungssätze ks6a_belehnung_*; Finanzgesellschaften ks6a_finanzgesellschaften_max_fremdkapital).
    Verdeckt ist davon nur der Teil, der von Beteiligten/Nahestehenden stammt: estv-ks-6a-2024__einleitung-t3 «nur derjenige Teil als verdeckt gilt, der direkt oder indirekt von Anteilsinhabern
    oder diesen nahestehenden Personen stammt». Fremdkapital unabhängiger Dritter ohne Sicherstellung durch Beteiligte zählt nicht (ks6a_kein_vek_drittfinanzierung). Drittvergleich bleibt
    vorbehalten. Folgen: Zinsaufrechnung (ks6a_zinsaufrechnung_gewinnsteuer), VSt (ks6a_vst_zinsen_vek), Kapitalsteuer (vek_kapitalsteuer). Der Agent rechnet nur vor (Werkzeug rechne);
    die Beurteilung macht der WP.'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen, ist verdecktes Eigenkapital anzunehmen.
  status: agent-geprueft
- key: ks6a_kein_vek_drittfinanzierung
  bezeichnung: Kein verdecktes Eigenkapital bei Fremdkapital unabhängiger Dritter ohne Sicherstellung durch Beteiligte/Nahestehende
  wert: kein verdecktes Eigenkapital
  einheit: Regel
  gilt: ab 10.10.2024 (KS ESTV Nr. 6a)
  kategorie: steuern_eigenkapital
  bemerkung: 'Umkehrschluss (direkt oder indirekt stammend): Von Beteiligten/Nahestehenden sichergestellte Drittkredite (z.B. Bankkredit mit Aktionärsbürgschaft) können zum verdeckten
    Eigenkapital zählen. Revision: Sicherheiten von Beteiligten (Bürgschaften, Verpfändungen) aus Kreditverträgen und Anhang erheben; die Einstufung beurteilt der WP. Gleichlautend Almanach:
    treuhand-almanach-2026__s063-1 «wenn die Fremdmittel von unabhängigen Dritten».'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Wird das Fremdkapital von unabhängigen Dritten – ohne Sicherstellung durch den Anteilsinhaber oder diesem nahestehenden Personen – zur Verfügung gestellt, liegt kein verdecktes
    Eigenkapital vor.
  status: agent-geprueft
- key: ks6a_zinsaufrechnung_gewinnsteuer
  bezeichnung: Aufrechnung der Schuldzinsen auf verdecktem Eigenkapital zum steuerbaren Gewinn (Art. 65 DBG)
  wert: Schuldzinsen auf verdecktem Eigenkapital aufrechnen; bei Beteiligtendarlehen unter Marktzins nur der Rest über dem auf das anerkannte Fremdkapital zulässigen Zins
  einheit: Regel
  gilt: ab 10.10.2024 (KS ESTV Nr. 6a, Ziff. 3.1)
  kategorie: steuern_eigenkapital
  bemerkung: 'Darlehen von Beteiligten/Nahestehenden unter dem marktüblichen Zins: Als Aufwand anerkannt bleibt der Zins, der gemäss ESTV-Zinsrundschreiben (CHF bzw. Fremdwährung) auf
    das anerkannte Fremdkapital zulässig wäre; estv-ks-6a-2024__3-1 «Nur der verbleibende Rest wird aufgerechnet.» Anwendung: Steueraufwand und Steuerrückstellung plausibilisieren; Steuerrisiko
    dem WP melden.'
  quelle: estv-ks-6a-2024__3-1
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen sind daher dem ausgewiesenen Reingewinn hinzuzurechnen
  status: agent-geprueft
- key: ks6a_vst_zinsen_vek
