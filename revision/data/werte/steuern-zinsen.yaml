- key: estv_zins_2026_fremdwaehrung
  bezeichnung: Zinssätze für Vorschüsse/Darlehen in Fremdwährung an bzw. von Beteiligten/Nahestehenden (Richtwerte je Währung)
  wert: Tabellensatz je Währung (RS S. 3); an Beteiligte mindestens der CHF-Satz
  einheit: Regel
  gilt: Kalenderjahr 2026 (ESTV-RS Nr. 2-219 vom 30.01.2026)
  kategorie: steuern_zinsen
  bemerkung: 'Für Fremdwährungen publiziert die ESTV eigene Sätze: treuhand-almanach-2026__s064-2 «Für Vorschüsse und Darlehen in Fremdwährungen gelten andere Zinssätze.» Gültigkeit:
    estv-rs-2-219-2026__s001-2 «seit dem 1. Januar 2026 auf die auf der letzten Seite dieses Rundschreibens publizierten Zinssätze (Richtwerte) ab». An Beteiligte, aus Fremdkapital finanziert:
    Selbstkosten plus Zuschlag, mindestens Tabellensatz (estv-rs-2-219-2026__s002-1 «zuzüglich eines Zuschlags von ½ %»). Von Beteiligten: Tabellensätze als safe haven; für Betriebskredite
    kann derselbe Spread wie in CHF berücksichtigt werden (estv-rs-2-219-2026__s002-2 «bis Gegenwert CHF 1 Mio. 2.75 % resp. 2.25 %; ab Gegenwert CHF 1 Mio. 0.75 % resp. 0.50 %»). Die
    Wahl der Fremdwährung ist geschäftsmässig zu begründen (estv-rs-2-219-2026__s002-2 «weshalb keine Verpflichtung in tiefer verzinsliche Schweizer Franken eingegangen wurde»). Verdecktes
    Eigenkapital beachten. Tabelle: estv-rs-2-219-2026__s003-1. Spalte 2026 = letzte Zahlenspalte. Die Werte stehen in der Reihenfolge der Spalte «Währung» (EUR, USD, AUD …). Werte:
    estv_zins_2026_fw_eur, estv_zins_2026_fw_usd. Höchstzins für Betriebskredite von Beteiligten in Fremdwährung (safe haven) = Tabellensatz + Spread. Spread bis Gegenwert CHF 1 Mio.:
    +2,75 % Handel/Fabrikation bzw. +2,25 % Holding/VV. Ab CHF 1 Mio.: +0,75 % bzw. +0,50 %. Beispiel EUR 2026, bis CHF 1 Mio., Handel: rechne "2.50 + 2.75" = 5,25 %. Herleitung: Der
    Spread ist der Abstand zum CHF-Mindestzins (CHF 2026: 3,5 % = 0,75 % + 2,75 %). Die Formulierung estv-rs-2-219-2026__s002-2 «der gleiche Spread» wird hier so ausgelegt; der WP bestätigt
    die Auslegung. Höhere Zinsen nur mit Drittvergleich: estv-rs-2-219-2026__s002-2 «Es ist jedoch möglich, höhere Zinsen aufgrund des Drittvergleichs geltend zu machen.»'
  quelle: estv-rs-2-219-2026__s002-1
  zitat: so ist mindestens der entsprechende Zinssatz für Schweizer Franken zu berücksichtigen
  status: agent-geprueft
