  einheit: '%'
  gilt: Kalenderjahr 2026, ab 01.01.2026 (ESTV-Rundschreiben vom 30.01.2026)
  kategorie: steuern_zinsen
  bemerkung: 'Für Fremdwährungen publiziert die ESTV eigene Sätze: treuhand-almanach-2026__s064-2 «Für Vorschüsse und Darlehen in Fremdwährungen gelten andere Zinssätze.» Gültigkeit:
    estv-rs-2-219-2026__s001-2 «seit dem 1. Januar 2026 auf die auf der letzten Seite dieses Rundschreibens publizierten Zinssätze (Richtwerte) ab». An Beteiligte, aus Fremdkapital finanziert:
    Selbstkosten plus Zuschlag, mindestens Tabellensatz (estv-rs-2-219-2026__s002-1 «zuzüglich eines Zuschlags von ½ %»). Von Beteiligten: Tabellensätze als safe haven; für Betriebskredite
    kann derselbe Spread wie in CHF berücksichtigt werden (estv-rs-2-219-2026__s002-2 «bis Gegenwert CHF 1 Mio. 2.75 % resp. 2.25 %; ab Gegenwert CHF 1 Mio. 0.75 % resp. 0.50 %»). Die
    Wahl der Fremdwährung ist geschäftsmässig zu begründen (estv-rs-2-219-2026__s002-2 «weshalb keine Verpflichtung in tiefer verzinsliche Schweizer Franken eingegangen wurde»). Verdecktes
    Eigenkapital beachten. Lücke: Die Tabelle S. 3 steht im Chunk estv-rs-2-219-2026__s003-1 nur bis Spalte 2025; die Spalte 2026 nur in sources/estv-rs-2-219-2026.md bzw. raw/estv-rs-2-219-2026.pdf
    S. 3 (dort ablesen; Chunking nachführen).'
