  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: uebrige
  bemerkung: Art. 729 Abs. 2 OR; Unabhängigkeit tatsächlich und dem Anschein nach (Abs. 1). Personen, die bei der Buchführung mitwirken, dürfen nicht an der Revision beteiligt sein (SER
    1.3.1, ser-2022__1-3-1). Keine Zahlenwerte; Beurteilung WP.
  quelle: or__art-729
  zitat: Das Mitwirken bei der Buchführung und das Erbringen anderer Dienstleistungen für die zu prüfende Gesellschaft sind zulässig.
