- key: or730b_unterlagen_auskuenfte
  bezeichnung: Vorlage- und Auskunftspflicht des VR gegenüber der Revisionsstelle
  wert: alle benötigten Unterlagen und Auskünfte, auf Verlangen schriftlich
  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: uebrige
  bemerkung: 'Art. 730b Abs. 1 OR: Grundlage für Unterlagen- und Fragenlisten. Abs. 2: «Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen», soweit keine gesetzliche Bekanntgabepflicht
