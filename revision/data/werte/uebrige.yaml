  kategorie: uebrige
  bemerkung: 'Art. 729b Abs. 1 OR: schriftlicher zusammenfassender Bericht an die GV mit (1) Hinweis auf die eingeschränkte Natur, (2) Stellungnahme zum Ergebnis der Prüfung, (3) Angaben
