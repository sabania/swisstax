- key: hwp_er_honorar_10_grenze
  bezeichnung: 'Unabhängigkeit: 10%-Honorargrenze RAG bei eingeschränkter Revision'
  wert: nicht anwendbar bei eingeschränkter Revision (10%-Grenze Art. 11 Abs. 1 Bst. a RAG nur für Gesellschaften des öffentlichen Interesses)
  einheit: Text
  gilt: HWP ER, Ausgabe 2026
  kategorie: uebrige
  bemerkung: 'HWP ER Rz 36: keine feste Honorarquote; wirtschaftliche Abhängigkeit im Einzelfall prüfen («Wann eine wirtschaftliche Abhängigkeit vorhanden ist, muss im Einzelfall geprüft
    werden.»); Erfolgshonorare unzulässig («Erfolgshonorare für Prüfungsdienstleistungen sind nicht vereinbar mit der Unabhängigkeit.»), beide gleicher Chunk. Beurteilung WP.'
  quelle: hwp-er-2026__rz-0036-s156-t3
  zitat: findet keine Anwendung bei der eingeschränkten Revision
  status: agent-geprueft
- key: or729a_pruefgegenstand
  bezeichnung: 'Eingeschränkte Revision: Prüfgegenstand'
  wert: Jahresrechnung und Antrag des VR über die Verwendung des Bilanzgewinns (Gesetz und Statuten)
  einheit: Text
  gilt: OR, Fassung Stand 01.10.2026
  kategorie: uebrige
  bemerkung: 'Art. 729a Abs. 1 OR (gesetzliche Grundlage des SER): Die Revisionsstelle prüft, ob Sachverhalte vorliegen, aus denen zu schliessen ist, dass die Jahresrechnung (Ziff. 1)
    oder der Antrag über die Verwendung des Bilanzgewinns (Ziff. 2) nicht Gesetz und Statuten entspricht. Für Ziff. 2 Art. 671–675 OR beiziehen. Abs. 3: «Die Geschäftsführung des Verwaltungsrats
    ist nicht Gegenstand der Prüfung durch die Revisionsstelle.»'
  quelle: or__art-729a
  zitat: über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
  status: agent-geprueft
