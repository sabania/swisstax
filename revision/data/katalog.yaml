  - DO
  text: 'Bei einem Zwischenabschluss: Feststellung, ob die Vereinfachungen und Verkürzungen bei der Erstellung eines Zwischenabschlusses nach Art. 960f OR für den Zweck einer Zwischendividende gemäss Art.
