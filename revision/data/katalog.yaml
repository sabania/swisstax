  prueffeld: A1
  nr: '302'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: Abstimmung des Vortrags der Vorjahresbestände auf die neue Rechnung mit Unterlagen des Vorjahres (geprüfte Jahresrechnung, falls vorhanden).
  beispiel_pflichtenheft: Abstimmung Vorjahresbestände
- id: A1-303
  prueffeld: A1
  nr: '303'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung.
  beispiel_pflichtenheft: ''
- id: A1-304
  prueffeld: A1
  nr: '304'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: 'GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen. Weitere mögliche Prüfungsgenstände: • Genehmigung der letzten
    Jahresrechnung innerhalb von sechs Monaten • Wahl der Revisionsstelle • Beschluss über die Verwendung des Bilanzgewinns (umfasst auch einen allfälligen Bilanzverlust) • Feststellen, ob die Jahresrechnung
    bzw. der Zwischenabschluss vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung bzw. den Zwischenabschluss zuständigen Person unterzeichnet
    oder formell gutgeheissen wurde.'
  beispiel_pflichtenheft: ''
- id: A1-305
  prueffeld: A1
  nr: '305'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: 'Prüfung, ob die Jahresrechnung vollständig ist: • Bilanz • Erfolgsrechnung • Geldflussrechnung (nur für grössere Unternehmen) • Anhang • Gewinnverwendung'
  beispiel_pflichtenheft: ''
- id: A1-306
  prueffeld: A1
  nr: '306'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: 'Prüfung, ob die Mindestgliederungsvorschriften eingehalten sind: • im Umlaufvermögen • im Anlagevermögen • im kurzfristigen Fremdkapital • im langfristigen Fremdkapital • im Eigenkapital • in der
    Erfolgsrechnung (Produktions- oder Absatzerfolgsrechnung)'
  beispiel_pflichtenheft: ''
- id: A1-307
  prueffeld: A1
  nr: '307'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: Abstimmung des ausgewiesenen Jahresgewinns (oder Jahresverlusts) im Eigenkapital, der Erfolgsrechnung sowie im Antrag über die Verwendung des Bilanzgewinns.
  beispiel_pflichtenheft: ''
- id: A1-308
  prueffeld: A1
  nr: '308'
  typ: Detail
  kennzeichnung: EP
  pruefziele:
  - DO
  text: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis; Offenlegung einer wesentlichen Nettoauflösung im Anhang. 53
  beispiel_pflichtenheft: ''
- id: A1-401
  prueffeld: A1
  nr: '401'
  typ: Sonstige
  kennzeichnung: EP
  pruefziele:
  - DO
  text: 'Prüfung, ob die Geldflussrechnung folgende Mindestgliederung hat: • Geldfluss aus Geschäftstätigkeit • Geldfluss aus Investitionstätigkeit • Geldfluss aus Finanzierungstätigkeit'
  beispiel_pflichtenheft: ''
- id: A1-402
  prueffeld: A1
  nr: '402'
  typ: Sonstige
  kennzeichnung: EP
  pruefziele:
  - DO
  text: 'Prüfung der Korrektheit der Geldflussrechnung: • korrekter Fonds (Flüssige Mittel oder Netto Flüssige Mittel) • Jahresergebnis stimmt mit Erfolgsrechnung überein • Abschreibungen stimmen mit der
    Erfolgsrechnung überein • Vollständigkeit der nicht-liquiditätswirksamen Aufwände und Erträge (z.B. Veränderung Rückstellungen, Erfolg aus Anlagenverkäufen, Veränderung Delkredere) • richtige Zuordnung
    zu Geldfluss aus Geschäftstätigkeit, Investitionstätigkeit oder Finanztätigkeit • richtige Behandlung der Investitionstätigkeit (Abstimmung mit Anlagespiegel) • richtige Behandlung der Desinvestitionen
    (Verkaufszahlen) • korrekte Berücksichtigung von Veränderungen von Arbeitgeberbeitragsreserven • korrekte Berücksichtigung von Dividendenausschüttungen • Geldflussrechnung stimmt mit Veränderung des
    Fonds überein'
  beispiel_pflichtenheft: ''
