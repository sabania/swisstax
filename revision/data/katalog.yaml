  kennzeichnung: ''
  pruefziele:
  - VO
  - DO
  text: 'Bei Verwendung der Produktionserfolgsrechnung (Gesamtkostenverfahren) müssen mindestens folgende Positionen je einzeln und in der vorgegebenen Reihenfolge aufgeführt sein: ▪ Nettoerlöse aus Lieferungen
    und Leistungen; ▪ Bestandesänderungen an unfertigen und fertigen Erzeugnissen sowie an nicht fakturierten Dienstleistungen; ▪ Materialaufwand; ▪ Personalaufwand; ▪ übriger betrieblicher Aufwand; ▪ Abschreibungen
    und Wertberichtigungen auf Positionen des Anlagevermögens; ▪ Finanzaufwand und Finanzertrag; ▪ betriebsfremder Aufwand und betriebsfremder Ertrag; ▪ ausserordentlicher, einmaliger oder periodenfremder
    Aufwand und Ertrag; ▪ direkte Steuern; ▪ Jahresgewinn oder Jahresverlust'
  beispiel_pflichtenheft: ''
