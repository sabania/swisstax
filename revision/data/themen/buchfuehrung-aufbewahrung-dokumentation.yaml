kurz: Buchführung und GoB (Art. 957–957a OR) sowie GoR (Art. 958c OR) verantwortet die Unternehmensleitung; Geschäftsbücher, Belege, Geschäfts- und Revisionsbericht sind 10 Jahre ab
  Ende des Geschäftsjahres aufzubewahren (Art. 958f OR). Die Revisionsstelle dokumentiert alle Revisionsdienstleistungen nachvollziehbar und bewahrt Arbeitspapiere mind. 10 Jahre auf
  (Art. 730c OR, SER 7, HWP ER III.2.9); internes QM-System und Revisionsgeheimnis (Art. 730b OR) sind Pflicht.
aussagen:
- text: 'Pflicht zur Buchführung und Rechnungslegung (Art. 957 Abs. 1 OR): juristische Personen sowie Einzelunternehmen und Personengesellschaften mit mindestens CHF 500 000 Umsatzerlös
    im letzten Geschäftsjahr. Darunter genügt eine Buchführung über Einnahmen, Ausgaben und Vermögenslage (Abs. 2), für die die GoB sinngemäss gelten (Abs. 3).'
  quelle: or__art-957
  zitat: Einzelunternehmen und Personengesellschaften, die einen Umsatzerlös von mindestens 500 000 Franken im letzten Geschäftsjahr erzielt haben
- text: 'Die Buchführung ist die Grundlage der Rechnungslegung und folgt den GoB (Art. 957a Abs. 2 OR): vollständige, wahrheitsgetreue und systematische Erfassung, Belegnachweis für
    jede Buchung, Klarheit, Zweckmässigkeit nach Art und Grösse des Unternehmens, Nachprüfbarkeit. Als Buchungsbeleg gilt jede Aufzeichnung auf Papier oder elektronisch, die zum Nachvollzug
    des Geschäftsvorfalls nötig ist (Abs. 3).'
  quelle: or__art-957a
  zitat: die vollständige, wahrheitsgetreue und systematische Erfassung der Geschäftsvorfälle und Sachverhalte
- text: Nachprüfbarkeit heisst nach HWP BuR, dass der Prüfpfad vom Buchungstatbestand über die Verarbeitung bis zur Darstellung in Bilanz, Erfolgsrechnung und Anhang nicht abreisst.
  quelle: hwp-bur-2023__rz-0034-s064
  zitat: die Spur von der Erfassung des Buchungstatbestands über die Verarbeitung bis zur letztendlichen Darstellung der Information
- text: Für die Buchführung und die Erstellung der Jahresrechnung ist die Unternehmensleitung verantwortlich (bei der AG der Verwaltungsrat, Art. 716a Abs. 1 OR). Der Abschlussprüfer
    gibt aufgrund seiner Prüfung nur eine Aussage über die Jahresrechnung ab (SER 1.2).
  quelle: ser-2022__1-2-t3
  zitat: Für die Erstellung, Bekanntgabe und Publikation der Jahresrechnung sowie die Buchführung ist die Unternehmensleitung verantwortlich
- text: 'Die GoR nach Art. 958c Abs. 1 OR sind nicht abschliessend aufgezählt («insbesondere»): klar und verständlich, vollständig, verlässlich, wesentlich, vorsichtig, gleiche Massstäbe
    in Darstellung und Bewertung (Stetigkeit) und Verrechnungsverbot. Die Rechnungslegung ist unter Wahrung des gesetzlichen Mindestinhalts den Besonderheiten von Unternehmen und Branche
    anzupassen (Abs. 3).'
  quelle: or__art-958c
  zitat: Für die Rechnungslegung sind insbesondere die folgenden Grundsätze massgebend
- text: 'Bestandsnachweis: Der Bestand jeder Position in Bilanz und Anhang ist durch ein Inventar oder auf andere Art nachzuweisen (Art. 958c Abs. 2 OR). Das ist die gesetzliche Grundlage
    für die Detailnachweise in den Prüffeldern.'
  quelle: or__art-958c
  zitat: Der Bestand der einzelnen Positionen in der Bilanz und im Anhang ist durch ein Inventar oder auf andere Art nachzuweisen.
- text: 'Aufbewahrung beim geprüften Unternehmen (Art. 958f OR): Geschäftsbücher, Buchungsbelege, Geschäftsbericht und Revisionsbericht 10 Jahre ab Ablauf des Geschäftsjahres. Geschäfts-
    und Revisionsbericht sind schriftlich und unterzeichnet aufzubewahren (Abs. 2). Bücher und Belege dürfen auf Papier oder elektronisch aufbewahrt werden, sofern die Übereinstimmung
    mit den Geschäftsvorfällen gewährleistet ist und sie jederzeit wieder lesbar gemacht werden können (Abs. 3).'
  quelle: or__art-958f
  zitat: Die Geschäftsbücher und die Buchungsbelege sowie der Geschäftsbericht und der Revisionsbericht sind während zehn Jahren aufzubewahren. Die Aufbewahrungsfrist beginnt mit dem
    Ablauf des Geschäftsjahres.
- text: 'Grundsätze der Aufbewahrung nach GeBüV (HWP BuR II.3.6.2.2): Integrität, das heisst keine Änderung ohne Feststellbarkeit. Je nach Art und Umfang braucht es Arbeitsanweisungen,
    eine geregelte Verantwortung für das Archiv, eine Archivsystematik, Schutz vor unbefugtem Zugriff und die Aufzeichnung von Zugriffen.'
  quelle: hwp-bur-2023__rz-0142-s093-t1
  zitat: Die Aufbewahrung muss so erfolgen, dass keine Änderungen vorgenommen werden können, ohne dass sich dies feststellen lässt
- text: 'Spezialgesetze können längere Fristen vorsehen. Nach MWST-Recht (steuerrechtliche Vorschrift, nicht OR) gelten laut HWP BuR 2023 für Belege zu Immobilien mindestens 20 Jahre,
    für übrige Belege mindestens 10 Jahre, jeweils bis zur Verjährung der Steuerforderung. Abweichung: PH 20 (2016) nennt 25 Jahre (siehe Agent-Hinweise).'
  quelle: hwp-bur-2023__rz-0143-s093
  zitat: Demnach beträgt die Aufbewahrungsfrist für Belege, welche Immobilien betreffen, mindestens 20 Jahre, für übrige Belege mindestens 10 Jahre.
- text: 'Dokumentationspflicht der Revisionsstelle (Art. 730c OR): Alle Revisionsdienstleistungen werden dokumentiert. Revisionsberichte und alle wesentlichen Unterlagen sind mindestens
    10 Jahre aufzubewahren, und elektronische Daten müssen so lange lesbar bleiben. Die Unterlagen müssen eine effiziente Prüfung erlauben, ob die gesetzlichen Vorschriften eingehalten
    wurden (Abs. 2).'
  quelle: or__art-730c
  zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren.
- text: 'SER 7.1: Dokumentiert werden wichtige Sachverhalte als Nachweis, dass die Prüfungsaussage gestützt ist und die eingeschränkte Revision SER-konform erfolgte, insbesondere Planung
    und Durchführung. Die wichtigsten Dokumente werden datiert und mit dem Vermerk des Autors bzw. des Mandatsleiters versehen.'
  quelle: ser-2022__7-1
  zitat: Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors oder derjenigen Person zu versehen, die das Revisionsmandat leitet.
- text: 'Inhalt der Jahresakten (SER 7.2): Unabhängigkeit, Verständnis des Unternehmens, Wesentlichkeit, analytische Ergebnisse der Planung, inhärentes Risiko und Prüfungsplan, Prüfungsprogramm,
    Fehlaussagen und ihre Behandlung, Prüfungsnachweise und deren Beurteilung. Ein Abschlussmemorandum wird empfohlen. Je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung
    gehören zwingend dazu.'
  quelle: ser-2022__7-2
  zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- text: 'Nachvollziehbarkeit (HWP ER III.2.9): Arbeitspapiere sind übersichtlich, einfach nachvollziehbar und zeitgerecht zu erstellen. Eine erfahrene Fachperson, die an der Revision
    nicht beteiligt war, muss Planung, Durchführung und Ergebnis daraus erkennen können.'
  quelle: hwp-er-2026__rz-0276-s246
  zitat: Sie sind so zu gestalten, dass sich an der eingeschränkten Revision nicht beteiligte, erfahrene Fachleute ein Bild von der Planung und der Durchführung sowie dem Ergebnis der
    Prüfungen machen können.
- text: Nach Fertigstellung der endgültigen Auftragsakten wird bis zum Ablauf der Aufbewahrungsfrist nichts mehr entfernt. Spätere Änderungen werden mit Person, Datum, Durchsicht, Grund
    und Auswirkung auf die Schlussfolgerungen festgehalten (HWP ER Rz 286).
  quelle: hwp-er-2026__rz-0286-s248
  zitat: sollte der Abschlussprüfer bis zum Ablauf der Aufbewahrungsfrist keine Dokumentationen mehr entfernen oder aussortieren
- text: Arbeitspapiere werden mindestens 10 Jahre aufbewahrt, regelmässig gerechnet ab Berichtsdatum. Elektronische Aufbewahrung ist zulässig, wenn nachträgliche Änderungen feststellbar
    sind und die Daten wieder lesbar gemacht werden können (HWP ER Rz 288 mit Art. 730c Abs. 1 OR).
  quelle: hwp-er-2026__rz-0288-s248
  zitat: Die Arbeitspapiere sind während mindestens zehn Jahren, regelmässig gerechnet ab Berichtsdatum, aufzubewahren.
- text: 'Qualitätssicherung: Gesetzliche Revisionsdienstleistungen darf nur erbringen, wer ein internes Qualitätssicherungssystem hat (Art. 6 Abs. 1 lit. d RAG i.V.m. Art. 9 Abs. 1 RAV).
    Die Ausgestaltung liegt beim Revisionsunternehmen und richtet sich nach Umfang und Komplexität der Mandate (skalierte Qualitätssicherung, SER 1.3.2).'
  quelle: ser-2022__1-3-2
  zitat: Gesetzliche Revisionsdienstleistungen darf nur erbringen, wer über ein internes Qualitätssicherungssystem verfügt
- text: 'Leitfaden QM (ISQM-CH 1 Tz. 31(f)): Die Prüfgesellschaft legt eine Frist für die endgültigen Auftragsakten fest, bei Abschlussprüfungen in der Regel höchstens 60 Tage nach dem
    Datum des Revisionsberichts. Die Auftragsdokumentation ist vertraulich. Kontrollen sollen festhalten, wer sie wann erstellt, geändert und durchgesehen hat, und ihre Integrität wahren.'
  quelle: leitfaden-qm-2025__6-1-11-t1
  zitat: die Feststellung ermöglichen, wann und von wem die Auftragsdokumentation erstellt, (zuletzt) geändert und durchgesehen wurde
- text: 'Auskunft und Geheimhaltung (Art. 730b OR): Der VR übergibt der Revisionsstelle alle Unterlagen und erteilt die nötigen Auskünfte, auf Verlangen schriftlich (Abs. 1). Die Revisionsstelle
    wahrt das Geheimnis über ihre Feststellungen, soweit keine gesetzliche Bekanntgabepflicht besteht. Bei Bericht, Anzeigen und Auskünften an die GV wahrt sie die Geschäftsgeheimnisse
    (Abs. 2).'
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen, soweit sie nicht von Gesetzes wegen zur Bekanntgabe verpflichtet ist.
- text: 'Berufsgeheimnis (HWP ER II.2.1): Die Verschwiegenheitspflicht umfasst alle bei der Tätigkeit bekannt gewordenen Sachverhalte. Gesetzliche Bekanntgabepflichten bestehen u.a.
    für den Revisionsbericht und Auskünfte an die GV, für Anzeigepflichten, gegenüber dem Sonderprüfer und der Aufsichtsbehörde (RAG) sowie als Zeugen- und Editionspflicht nach StPO.'
  quelle: hwp-er-2026__rz-0010-s150-t1
  zitat: Die Verschwiegenheitspflicht erstreckt sich auf alle in Ausübung ihrer Tätigkeit bekannt gewordenen Sachverhalte.
- text: 'Folge für den Bericht: Verstösse gegen die Grundlagen (Fortführung, zeitliche und sachliche Abgrenzung) und gegen die GoR (Art. 958a–958c OR) mit wesentlichem Einfluss auf die
    Jahresrechnung führen zu einer modifizierten Prüfungsaussage (HWP ER III.4.2.8.1). Darüber entscheidet der WP.'
  quelle: hwp-er-2026__rz-0386-s270-t1
  zitat: Verstösse gegen diese Rechnungslegungsvorschriften mit wesentlichem Einfluss auf die Jahresrechnung führen zu einer modifizierten Prüfungsaussage.
agent:
- 'A1-204 (GoR): die Checkliste aus SER Anhang D ^[ser-2022__anh-d-s072-2] Grundsatz für Grundsatz im Textfeld abarbeiten. Hinweise auf Verrechnung (Gegensaldi mit `rechne` auflisten),
  fehlende Vorjahreszahlen oder nicht stetige Darstellung mit Konto und Betrag als Notiz «Wesentliche Feststellungen» erfassen. Ob eine modifizierte Prüfungsaussage nötig ist (^[hwp-er-2026__rz-0386-s270-t1]),
  entscheidet der WP.'
- Die Buchführung verantwortet die Unternehmensleitung (^[ser-2022__1-2-t3]). Der Agent verbucht nie etwas; Buchungsvorschläge erfasst er nur als Notiz.
- 'Prüfpfad (^[hwp-bur-2023__rz-0034-s064]): Saldoliste, Hauptbuch und Jahresrechnung abstimmen (A1-303). Ausgewählte Posten bis zum Beleg verfolgen. Fehlt ein Beleg oder Nachweis, als
  Notiz «Pendenz» mit Konto, Datum und Betrag erfassen.'
- 'Bestandsnachweis (Art. 958c Abs. 2 OR): je Bilanzposition einen Detailnachweis aus M-Files verwenden (z.B. Bankauszug, OP-Liste, Inventarliste, Anlagespiegel, Darlehensvertrag) und
  im Textfeld mit M-Files-ID und Version angeben. Fehlt der Nachweis, eine Pendenz erfassen.'
- 'Aufbewahrung beim Kunden: Hinweise auf fehlende, unlesbare oder nicht revisionssicher abgelegte Bücher oder Belege (GeBüV-Integrität ^[hwp-bur-2023__rz-0142-s093-t1]) nur als Notiz
  «Schlussbesprechung» festhalten. Ob darin ein Verstoss liegt, beurteilt der WP.'
- 'MWST-Aufbewahrungsfrist für Immobilienbelege: Die Quellen widersprechen sich. HWP BuR 2023 nennt 20 Jahre ^[hwp-bur-2023__rz-0143-s093], PH 20 (2016) nennt 25 Jahre ^[ph-20-mwst-2016__c004-2].
  Die geltende MWSTG-Fassung liegt nicht im Wiki. Deshalb als «strittig» kennzeichnen, die jüngere Fundstelle nennen und vom WP bzw. einer Fachperson bestätigen lassen. Es ist eine steuerliche
  Vorschrift, keine Vorschrift des OR.'
- 'Dokumentation in revio: Je Prüfschritt das Textfeld nach Vorlage ausfüllen (Prüfziel, Quellen mit M-Files-ID und Version, Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen,
  Pendenzen, Status; ^[konzept-ki-revisionsagent-2026__c009-3]). Ziel ist, dass eine nicht beteiligte Fachperson die Arbeit nachvollziehen kann (^[hwp-er-2026__rz-0276-s246]). Bei vom
  Kunden gelieferten Aufstellungen festhalten, wer sie erstellt hat und wann sie eingegangen sind.'
- 'Datum und Ersteller: Der Agent arbeitet als eigener Dienstbenutzer, damit seine Einträge erkennbar sind. Kennzeichnungen für Visum, Review und Abschluss (^[hwp-er-2026__rz-0278-s246])
  sowie Bereich 9 Qualitätssicherung bleiben beim Menschen.'
- 'Dauerakten (Prüfschritte x-322) nachführen: Verträge, HR-Auszug, Statuten (^[ser-2022__7-3], ^[hwp-er-2026__rz-0279-s247]). Änderungen gegenüber dem Vorjahr im Textfeld nennen.'
- 'Jahresakten: Die unterzeichnete Jahresrechnung und die Vollständigkeitserklärung gehören in revio 10.4 (^[ser-2022__7-2]). Fehlt eine Unterschrift oder ein Dokument, eine Pendenz
  erfassen. Der Agent lässt nie selbst unterzeichnen.'
- 'Abgeschlossene Akte: Die interne Frist für den Aktenabschluss beträgt in der Regel höchstens 60 Tage nach Berichtsdatum (^[hwp-er-2026__rz-0334-s258]). Danach nichts entfernen oder
  ändern. Spätere Änderungen nur auf Anweisung des WP, festgehalten mit Person, Datum, Grund und Auswirkung (^[hwp-er-2026__rz-0286-s248]). Der Agent löscht nie.'
- 'Audit Trail: Jede Aktion, Quelle und Berechnung mit Zeitstempel je Mandat und Jahr in M-Files ablegen (^[konzept-ki-revisionsagent-2026__c009-3]). Wie lange die Agenten-Protokolle
  aufbewahrt werden, ist noch nicht entschieden (Governance ^[konzept-ki-revisionsagent-2026__c022-1]); bis zum Entscheid nichts löschen.'
- 'Revisions- und Berufsgeheimnis (Art. 730b Abs. 2 OR, Art. 321 StGB ^[hwp-er-2026__rz-0491-s140]): Mandatsdaten nur im festgelegten Mandatskontext verwenden und nie an Dritte weitergeben.
  E-Mails nur als Entwurf oder an die feste WP-Adresse. Verlangen Behörden, RAB oder Dritte Akten, sofort an den WP weiterleiten; die RAB sollte eine formelle Editionsverfügung erlassen
  (^[hwp-er-2026__rz-0244-s082]).'
- Gegenüber dem VR besteht eine uneingeschränkte Auskunftspflicht (^[hwp-er-2026__rz-0468-s290]). Die Kommunikation mit dem Kunden führt jedoch der WP; der Agent erfasst offene Fragen
  als Pendenz oder in revio 10.11.
- 'QM: Der Auftragsverantwortliche muss vor Abgabe des Revisionsberichts die Durchsicht der Arbeiten weniger erfahrener Teammitglieder sicherstellen (^[leitfaden-qm-2025__6-2-t3]). Die
  Vorarbeit des Agenten gilt dafür wie Teamarbeit, die der WP durchsieht. Der Agent meldet den Status im Rapport, gibt aber nichts frei.'
- 'Externe Nachschau oder auftragsbegleitende Qualitätssicherung: Akteneinsicht für Dritte erfordert eine Entbindung vom Revisionsgeheimnis und eine Vertraulichkeitserklärung (^[leitfaden-qm-2025__6-1-12-t1],
  ^[hwp-er-2026__rz-0124-s177]). Das regelt der WP, nicht der Agent.'
- 'Doppelmandat (Mitwirkung bei der Buchführung, Art. 729 Abs. 2 OR): prüfen, ob in revio 2.x eine separate Auftragsbestätigung vorliegt (^[ser-2022__1-7]). Fehlt sie, eine Pendenz für
  den WP erfassen.'
