kurz: 'Eigenkapital nach OR 959a Abs. 2 Ziff. 3 gliedern; Reserven, Verlustverrechnung und Ausschüttungsschranken folgen aus OR 659–675a. Die Revisionsstelle prüft auch den Antrag des
  VR über die Verwendung des Bilanzgewinns inkl. Kapitalrückführungen (OR 729a Abs. 1 Ziff. 2): Reservezuweisung, Verlustverrechnung, ausschüttbares Eigenkapital, Liquidität, Statuten.
  Berichtstext nach Textbausteinen und SER (Zusatz/Hinweis); Beurteilung und WP-Schritte P1-306/P1-307 beim WP. Covid-19-Kredit: keine Dividende (Covid-19-SBüG Art. 2).'
aussagen:
- text: 'Gliederung (OR 959a Abs. 2 Ziff. 3): Das Eigenkapital ist mindestens einzeln und in dieser Reihenfolge auszuweisen: a. Grund-, Gesellschafter- oder Stiftungskapital (gegebenenfalls
    gesondert nach Beteiligungskategorien), b. gesetzliche Kapitalreserve, c. gesetzliche Gewinnreserve, d. freiwillige Gewinnreserven, e. eigene Kapitalanteile als Minusposten, f. Gewinnvortrag
    oder Verlustvortrag als Minusposten, g. Jahresgewinn oder Jahresverlust als Minusposten. Nicht einbezahltes Grund-, Gesellschafter- oder Stiftungskapital erscheint auf der Aktivseite
    als letzte Position des Anlagevermögens (OR 959a Abs. 1 Ziff. 2 Bst. e).'
  quelle: or__art-959a-t1
  zitat: Gewinnvortrag oder Verlustvortrag als Minusposten
- text: 'Gesetzliche Reserven (OR 671 Abs. 1, OR 672): Der gesetzlichen Kapitalreserve sind das Agio (Erlös über Nennwert und Ausgabekosten), die zurückbehaltene Einzahlung auf ausgefallene
    Aktien und weitere Einlagen und Zuschüsse von Inhabern von Beteiligungspapieren zuzuweisen ^[or__art-671]. Der gesetzlichen Gewinnreserve sind 5 % des Jahresgewinns zuzuweisen; ein
    Verlustvortrag ist vorher zu beseitigen. Sie ist zu äufnen, bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte (Holdinggesellschaften: 20 %) des im Handelsregister eingetragenen
    Aktienkapitals erreicht. Für Ermittlung und Verwendung gilt Art. 671 Abs. 2–4 entsprechend (Art. 672 Abs. 3).'
  quelle: or__art-672
  zitat: Der gesetzlichen Gewinnreserve sind 5 Prozent des Jahresgewinns zuzuweisen. Liegt ein Verlustvortrag vor, so ist dieser vor der Zuweisung an die Reserve zu beseitigen.
- text: 'Freiwillige Gewinnreserven (OR 673): Die GV kann sie in den Statuten oder durch Beschluss vorsehen. Sie sind nur zulässig, wenn das dauernde Gedeihen des Unternehmens unter
    Berücksichtigung der Interessen aller Aktionäre dies rechtfertigt. Über ihre Verwendung beschliesst die GV, vorbehalten die Verlustverrechnung. Ausschüttungen aus anderen Gewinnreserven
    prüft die Revisionsstelle wie die ordentliche Gewinnausschüttung, aber ohne Reservezuweisung aus dem Jahresgewinn ^[hwp-er-2026__rz-0226-s236].'
  quelle: or__art-673
  zitat: Freiwillige Gewinnreserven dürfen nur gebildet werden, wenn das dauernde Gedeihen des Unternehmens unter Berücksichtigung der Interessen aller Aktionäre dies rechtfertigt.
- text: 'Verlustverrechnung (OR 674; HWP ER Rz 208, 224): Reihenfolge nach OR 674 Abs. 1: 1. Gewinnvortrag, 2. freiwillige Gewinnreserven, 3. gesetzliche Gewinnreserve, 4. gesetzliche
    Kapitalreserve. Statt der Verrechnung nach Ziff. 3 oder 4 dürfen verbleibende Verluste ganz oder teilweise auf die neue Jahresrechnung vorgetragen werden (Abs. 2) ^[or__art-674].
    Die HWP-Fälle a/b entsprechen Ziff. 1 und 2; die Fälle c–e entsprechen Ziff. 3, 4 und dem Vortrag. Die Verrechnung mit dem Gewinnvortrag und den freiwilligen Gewinnreserven (Fälle
    a/b) ist gesetzlich vorgeschrieben; es braucht keinen GV-Beschluss und keinen Antrag ^[hwp-er-2026__rz-0208-s230-t1]. Für die Verrechnung mit der gesetzlichen Gewinn- bzw. Kapitalreserve
    oder den Vortrag auf neue Rechnung (Fälle c–e) ist die GV zuständig; der VR muss dies beantragen, und die Revisionsstelle prüft diesen Antrag. Sie prüft insbesondere, ob ein Antrag
    zur Verlustverrechnung zu stellen ist und ob die Reihenfolge nach OR 674 eingehalten wird ^[hwp-er-2026__rz-0224-s236].'
  quelle: hwp-er-2026__rz-0208-s230-t2
  zitat: Der diesbezügliche Antrag des Verwaltungsrats an die Generalversammlung ist durch die Revisionsstelle gemäss Art. 729 a Abs. 1 Ziff. 2 OR zu prüfen.
- text: 'Dividenden (OR 675): Für das Aktienkapital dürfen keine Zinsen bezahlt werden. Dividenden dürfen nur aus dem Bilanzgewinn und aus hierfür gebildeten Reserven ausgerichtet werden,
    und erst nach den Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven. Auch bei einem Bilanzverlust ist eine Ausschüttung aus freiwilligen Gewinnreserven,
    aus der gesetzlichen Gewinnreserve oder eine Rückzahlung aus der gesetzlichen Kapitalreserve möglich; die Verlustverrechnung nach OR 674 ist zu beachten, und der Bilanzverlust mindert
    das ausschüttbare Eigenkapital ^[hwp-er-2026__rz-0225-s236].'
  quelle: or__art-675
  zitat: Dividenden dürfen erst festgesetzt werden, nachdem die Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven erfolgt sind.
- text: 'Covid-19-Kredite (Covid-19-SBüG Art. 2, 3, 23): Während der Dauer der Solidarbürgschaft sind Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen ausgeschlossen.
    Ebenso ausgeschlossen sind die Gewährung oder Rückzahlung von Darlehen von Gesellschaftern oder nahestehenden Personen; zulässig bleiben vorbestehende Verpflichtungen gegenüber Gruppengesellschaften
    mit Sitz in der Schweiz (Art. 2 Abs. 2 Bst. a und b). Die Solidarbürgschaft dauert höchstens acht Jahre, bei erheblicher Härte höchstens zehn Jahre ^[covid-sbueg__art-3]; das Gesetz
    gilt bis 31.12.2032 ^[covid-sbueg__art-31]. Stellt die Revisionsstelle im Rahmen der eingeschränkten Revision eine Verletzung fest, setzt sie eine angemessene Frist. Wird der ordnungsgemässe
    Zustand nicht hergestellt, informiert sie die GV und danach die Bürgschaftsorganisation ^[covid-sbueg__art-23].'
  quelle: covid-sbueg__art-2-t1
  zitat: Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen
- text: 'Rückzahlung der gesetzlichen Kapitalreserve (OR 671 Abs. 2–4; HWP ER Rz 250–255): Zulässig, wenn die gesetzlichen Kapital- und Gewinnreserven abzüglich allfälliger Verluste
    die Hälfte des eingetragenen Aktienkapitals übersteigen (Abs. 2). Holdinggesellschaften: wenn die gesetzlichen Kapital- und Gewinnreserven 20 % des eingetragenen Aktienkapitals überschreiten
    (Abs. 3; der Wortlaut nennt hier keinen Verlustabzug) ^[or__art-671]. Die gesetzliche Gewinnreserve für eigene Aktien im Konzern (Art. 659b) und die Aufwertungsreserve (Art. 725c)
    zählen nicht mit (Abs. 4). Ausschüttbar ist grundsätzlich nur der überschiessende Anteil. Der Prüfungsgegenstand nach OR 729a Abs. 1 Ziff. 2 umfasst alle Kapitalrückführungen ausserhalb
    der gesetzlichen Kapitalherabsetzungen ^[hwp-er-2026__rz-0250-s241]. Geprüft wird wie bei der ordentlichen Gewinnausschüttung, aber ohne Reservezuweisung ^[hwp-er-2026__rz-0253-s242];
    die GV beschliesst formell getrennt vom Dividendenbeschluss ^[hwp-er-2026__rz-0254-s242].'
  quelle: hwp-er-2026__rz-0251-s241
  zitat: ist eine Ausschüttung des überschiessenden Anteils grundsätzlich zulässig, sofern dem keine anderweitigen Bestimmungen oder Sachverhalte wie bspw. unzureichende flüssige Mittel
    entgegenstehen
- text: 'Ausserordentliche Dividende (HWP ER Rz 236–240): Ausschüttung aus dem Bilanzgewinn und freien Gewinnreserven (nicht gesperrte gesetzliche Gewinnreserve, freiwillige Gewinnreserven)
    auf der Basis der letzten von der ordentlichen GV genehmigten Jahresrechnung, beschlossen von einer ausserordentlichen GV. Eine Ausschüttung aus dem laufenden Jahresgewinn ist dagegen
    eine Zwischendividende (OR 675a). Geprüft wird wie bei der ordentlichen Ausschüttung, aber ohne Zuweisung an die gesetzliche Gewinnreserve; einziger Prüfungsgegenstand des Berichts
    ist der Antrag des VR ^[hwp-er-2026__rz-0237-s238]. Vermögens- und Liquiditätslage anhand aktueller Finanzinformationen beurteilen, ebenso, ob das ausschüttbare Eigenkapital seit
    dem Bilanzstichtag gesunken ist (z.B. Erwerb eigener Kapitalanteile, Konzerndarlehen mit Ausschüttungscharakter) ^[hwp-er-2026__rz-0238-s239]. Beschliesst die GV ohne Bericht der
    Revisionsstelle, stellt sich die Frage der Nichtigkeit (OR 731 Abs. 3), insbesondere ohne ausschüttbares Eigenkapital ^[hwp-er-2026__rz-0239-s239]; lag für die geprüfte letzte Jahresrechnung
    ein Revisionsbericht vor und waren die übrigen Voraussetzungen erfüllt, ist Nichtigkeit nur mit Zurückhaltung anzunehmen, im Einzelfall kann Rechtsrat angebracht sein ^[hwp-er-2026__rz-0240-s239].'
  quelle: hwp-er-2026__rz-0236-s238
  zitat: Eine ausserordentliche Dividende ist eine Ausschüttung aus dem Bilanzgewinn und freien Gewinnreserven
- text: 'Zwischendividende (OR 675a; HWP ER Rz 241–246): Die GV beschliesst sie gestützt auf einen Zwischenabschluss; erfasst sind ausschliesslich Ausschüttungen aus dem Gewinn des laufenden
    Geschäftsjahres nach Abzug eines allfälligen Verlustvortrags ^[hwp-er-2026__rz-0241-s239]. Die Revisionsstelle prüft den Zwischenabschluss vor dem GV-Beschluss; keine Prüfung bei
    Opting-out; Verzicht, wenn sämtliche Aktionäre zustimmen und die Gläubigerforderungen nicht gefährdet sind. Ein gültiger Verzicht gilt auch für den Antrag; geprüft wird nach dem
    Standard der letzten Jahresrechnung (SER oder SA-CH) ^[hwp-er-2026__rz-0243-s240]. Die genehmigte Vorjahresrechnung muss vorliegen ^[hwp-er-2026__rz-0245-s240]. Die Dividendenbestimmungen
    (u.a. Art. 671–674) gelten. In der Bilanz erscheint die Zwischendividende als Negativposition direkt unter dem Jahresgewinn ^[hwp-er-2026__rz-0246-s240]. Eine erst im Folgejahr beschlossene
    Zwischendividende ist ein wesentliches Ereignis nach dem Bilanzstichtag (Anhang, Gewinnverwendungsantrag); eine Verbindlichkeit im abgelaufenen Jahr ist nicht möglich ^[hwp-er-2026__rz-0242-s239].'
  quelle: or__art-675a
  zitat: Die Revisionsstelle muss den Zwischenabschluss vor dem Beschluss der Generalversammlung prüfen.
- text: 'Eigene Aktien (OR 659–659b): Erwerb nur, wenn frei verwendbares Eigenkapital in Höhe des Anschaffungswerts vorhanden ist; höchstens 10 % des eingetragenen Aktienkapitals (20
    % bei Übertragbarkeitsbeschränkung oder Auflösungsklage; Überschuss innert zwei Jahren veräussern oder durch Kapitalherabsetzung vernichten). In der Bilanz ist ein dem Anschaffungswert
    entsprechender Betrag als Minusposten des Eigenkapitals darzustellen (OR 659a Abs. 4) ^[or__art-659a]. Halten kontrollierte Unternehmen Aktien der Gesellschaft, weist diese einen
    dem Anschaffungswert entsprechenden Betrag gesondert als gesetzliche Gewinnreserve aus (OR 659b Abs. 2) ^[or__art-659b]. Handelsrechtlich besteht ein Wahlrecht, den Veräusserungserfolg
    erfolgsneutral oder erfolgswirksam zu erfassen ^[qa-or-rechnungslegung-2026__3-2-t1].'
  quelle: or__art-659
  zitat: Die Gesellschaft darf eigene Aktien nur dann erwerben, wenn frei verwendbares Eigenkapital in der Höhe des Anschaffungswerts vorhanden ist.
- text: 'Ordentliche Kapitalerhöhung (OR 650, 652e–652h): Der GV-Beschluss muss öffentlich beurkundet werden ^[or__art-650-t1] und innert sechs Monaten beim Handelsregisteramt zur Eintragung
    angemeldet werden, sonst fällt er dahin. Der VR legt in einem schriftlichen Kapitalerhöhungsbericht Rechenschaft ab, u.a. über Sacheinlagen, Verrechnung, umgewandeltes Eigenkapital
    und das Bezugsrecht ^[or__art-652e]. Ein zugelassener Revisor prüft den Bericht und bestätigt ihn; keine Prüfungsbestätigung bei Bareinlage ohne Sachübernahme und ohne Einschränkung
    oder Aufhebung des Bezugsrechts ^[or__art-652f]. Danach ändert der VR die Statuten und stellt u.a. fest, dass sämtliche Aktien gültig gezeichnet sind und die versprochenen Einlagen
    dem gesamten Ausgabebetrag entsprechen (öffentlich beurkundet) ^[or__art-652g]. Aktien, die vor der Eintragung ausgegeben werden, sind nichtig ^[or__art-652h].'
  quelle: or__art-650-t2
  zitat: Die Kapitalerhöhung muss innerhalb von sechs Monaten nach dem Beschluss der Generalversammlung beim Handelsregisteramt zur Eintragung angemeldet werden; sonst fällt der Beschluss
    dahin.
- text: 'Kapitalerhöhung in der Jahresrechnung (HWP BuR Rz 866): Bei Kapitalerhöhung und Kapitalherabsetzung wirkt die Eintragung im Handelsregister konstitutiv; massgebend ist grundsätzlich
    das Eintragungsdatum. Eine Erfassung in alter Rechnung ist ausnahmsweise vertretbar, wenn die GV im alten Geschäftsjahr beschlossen hat und der Eintrag in neuer Rechnung, aber vor
    Erstellung der Jahresrechnung erfolgt ist. Nicht einbezahltes Kapital ist als Aktivposten auszuweisen ^[or__art-959a-t1]. Die Prüfung des Kapitalerhöhungsberichts (OR 652f) ist ein
    eigener gesetzlicher Prüfungsfall neben der eingeschränkten Revision und keine Handlung der eingeschränkten Revision ^[hwp-er-2026__rz-0006-s027].'
  quelle: hwp-bur-2023__rz-0866-s354
  zitat: Analog hat bei einer Kapitalerhöhung oder eine Kapitalherabsetzung die Eintragung im Handelsregister konstitutive Wirkung.
- text: 'Prüfungsauftrag (OR 729a Abs. 1 Ziff. 2): Die Revisionsstelle prüft, ob Sachverhalte vorliegen, aus denen zu schliessen ist, dass der Antrag des VR über die Verwendung des Bilanzgewinns
    nicht Gesetz und Statuten entspricht. Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen (Abs. 2). Für die GmbH gilt dasselbe
    für den Antrag der Geschäftsführer (OR 818 Abs. 1) ^[hwp-er-2026__rz-0204-s228].'
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht.
- text: 'SER Anhang D o) Eigenkapital: Empfohlene Detailprüfungen sind: Grundkapital mit gültigen Statuten oder HR-Auszug abstimmen; Reserven und Bilanzgewinn/-verlust mit Vorjahres-Jahresrechnung
    und GV-Protokoll abstimmen; Antrag über die Verwendung des Bilanzgewinns beurteilen; gesetzliche Reservezuweisung prüfen; Verlustverrechnung nach OR 674 prüfen; Bestand an eigenen
    Kapitalanteilen feststellen. Weitergehende Prüfungshandlungen, vor allem bei angenommenen wesentlichen Fehlaussagen oder erhöhtem inhärentem Risiko: steuerliche Behandlung von Kapitalerhöhungen
    (Emissionsabgabe), Kapitalherabsetzungen und Gewinnausschüttungen (Verrechnungssteuer); Analyse von Käufen und Verkäufen eigener Anteile; kritische Durchsicht bei Änderungen im Grundkapital
    und Ausgabe von Optionen; Rückzahlungen von Einlagen im Hinblick auf OR 680 Abs. 2.'
  quelle: ser-2022__anh-d-s091-1
  zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen
- text: 'Prüfungshandlungen zum Antrag (HWP ER Rz 220), im Regelfall: Vorschlag nachrechnen; Beträge mit der Bilanz abstimmen; Kapitalschutz prüfen (u.a. OR 680 Abs. 2, Eigenkapital-Minusposten);
    Statuten durchsehen; Reservezuweisung auf Gesetzes- und Statutenkonformität prüfen; verfügbare flüssige Mittel beurteilen; Ereignisse nach dem Bilanzstichtag prüfen. Stellt die Gewinnverwendung
    offensichtlich einen erheblichen Liquiditätsentzug dar, beurteilt der Abschlussprüfer die Fortführungsfähigkeit ^[hwp-er-2026__rz-0222-s235]. Auch ein Vortrag des ganzen Bilanzgewinns
    auf neue Rechnung ist zu prüfen ^[hwp-er-2026__rz-0223-s235].'
  quelle: hwp-er-2026__rz-0220-s235
  zitat: Nachrechnen des Gewinnverwendungs- bzw. Verlustverrechnungsvorschlags
- text: 'Ausschüttbares Eigenkapital (HWP ER Rz 170): Ausgangspunkt ist das gesamte Eigenkapital. Abzuziehen sind einbezahltes und nicht einbezahltes Grundkapital, die gesperrten gesetzlichen
    Reserven (bis 50 % bzw. 20 % bei Holdinggesellschaften des Grundkapitals), die Aufwertungsreserve, die Reserve für eigene Kapitalanteile im Konzern, die notwendige Reservezuweisung
    sowie Aktionärs- und Konzernforderungen, die einem Drittvergleich nicht standhalten.'
  quelle: hwp-er-2026__rz-0170-s216
  zitat: Bestehen Aktionärs- bzw. Konzerndarlehen, die einem Drittvergleich nicht standhalten, führt dies zu einer Sperrung von frei verfügbarem Eigenkapital im gesamten Umfang dieser
    Darlehen.
- text: 'Berichtstext (Textbausteine Gewinnverwendung, EXPERTsuisse 2022): Die Bestätigung zum Antrag entfällt, wenn kein Bilanzgewinn vorliegt und der VR keine Verrechnung mit Verlusten,
    keine Ausschüttung aus anderen Reserven und keine Rückzahlung aus der gesetzlichen Kapitalreserve beantragt; der Text bezieht sich dann nur auf die Jahresrechnung. Nach HWP ER entfällt
    die Stellungnahme bei einem Bilanzverlust, wenn der VR keinen Antrag nach OR 674 stellen muss und keine Ausschüttungen aus anderen Reserven beantragt werden ^[hwp-er-2026__rz-0224-s236].
    Eigene Bausteine bestehen für Verlustverrechnung/-vortrag ^[textbausteine-gewinnverwendung-2022__s002-1], für die Rückzahlung aus der gesetzlichen Kapitalreserve und die Zwischendividende
    ^[textbausteine-gewinnverwendung-2022__s002-2] sowie für die ausserordentliche Dividende (separate Berichterstattung zum Antrag des VR) ^[textbausteine-gewinnverwendung-2022__s002-3],
    jeweils DE/FR/EN/IT.'
  quelle: textbausteine-gewinnverwendung-2022__s001-3
  zitat: Die Bestätigung zum Antrag über die Verwendung des Bilanzgewinns entfällt, wenn kein Bilanzgewinn vorliegt und der Verwaltungsrat der Generalversammlung keine Verrechnung mit
    Verlusten oder
- text: 'Folge eines gesetzeswidrigen Antrags (SER Anhang F, Beispiel 8): Sieht der Antrag keine Zuweisung an die gesetzliche Gewinnreserve vor, gibt die Revisionsstelle zum Antrag eine
    verneinende Prüfungsaussage ab, auch wenn die Jahresrechnung selbst Gesetz und Statuten entspricht.'
  quelle: ser-2022__anh-f-s125-2
  zitat: Da der Antrag über die Verwendung des Bilanzgewinns keine Zuweisung an die gesetzliche Gewinnreserve vorsieht, entspricht er nicht dem schweizerischen Gesetz und den Statuten.
- text: 'Hinweis auf Gesetzesverstösse (SER 8.3.2, massgebend): Als Beispiele für Gesetzesverstösse ausserhalb des Prüfungsgegenstands, bei denen der Abschlussprüfer einen Hinweis für
    notwendig halten kann, sofern sie wesentlich sind und aufgrund der durchgeführten Prüfungshandlungen festgestellt wurden, nennt der SER u.a.: Erwerb eigener Aktien trotz fehlender
    freier Reserven und Überschreiten der 10-%- bzw. 20-%-Grenze (OR 659); gesetzeswidrige oder ungerechtfertigte Leistungen an Aktionäre, VR-Mitglieder oder nahestehende Personen (OR
    678); gesetzeswidrige Aktionärsdarlehen oder unzulässige Rückzahlung des Aktienkapitals (OR 680); eine grundsätzlich gesetzes- und statutenkonforme Dividende, die zu einem erheblichen
    Liquiditätsentzug führt (Sorgfaltspflichtverletzung, OR 717).'
  quelle: ser-2022__8-3-2-t2
  zitat: die beantragte und grundsätzlich gesetzes- und statutenkonforme Dividende führt zu einem erheblichen Liquiditätsentzug (Sorgfaltspflichtverletzung, Art. 717 OR)
- text: 'Liquiditätsentzug durch Dividende (SER Anhang F, Beispiel 12; HWP ER Rz 256, 441): Ist die beantragte Dividende nur vertretbar, wenn die zur Betriebstätigkeit erforderliche
    Liquidität nach dem Dividendenabgang sichergestellt ist, enthält der Bericht einen Zusatz («Wir machen darauf aufmerksam, dass die beantragte Dividendenausschüttung … die Liquidität
    … ganz erheblich beeinflusst»). Verneint die Revisionsstelle die Vertretbarkeit, liegt ein Gesetzesverstoss vor, und es bedarf eines Hinweises. HWP ER bestätigt: Ist die Ausschüttung
    mit der Vermögens- und Liquiditätslage nicht vereinbar, verstösst der Antrag gegen die Sorgfalts- und Treuepflicht (OR 717 Abs. 1), und der Verstoss ist mit einem Hinweis anzuzeigen
    ^[hwp-er-2026__rz-0441-s285]; der Antrag des VR ist zur Ablehnung zu empfehlen ^[hwp-er-2026__rz-0256-s242].'
  quelle: ser-2022__anh-f-s130-2
  zitat: Verneint sie diese, liegt ein Gesetzesverstoss vor, und es bedarf eines Hinweises.
- text: 'Abweichende Fachmeinung (Camponovo 2026, Fachliteratur/Sekundärquelle, Rang unter SER und HWP ER): Die Revisionsstelle stoppe Dividenden bei Liquiditätsproblemen schon bei der
    Prüfung des Antrags, weil eine solche Dividende gesetzwidrig und nicht «gesetzes- und statutenkonform» sei; es komme gar nie zum Hinweis. Zudem gehöre OR 717 Abs. 1 nicht zum Prüfbereich
    der Revisionsstelle. Massgebend für die eingeschränkte Revision bleibt der SER; welcher Auffassung gefolgt wird, entscheidet der WP.'
  quelle: camponovo-2026-hinweispflichten__s069-1
  zitat: Erstens stoppt die Revisionsstelle Dividenden bei Liquiditätsproblemen und Ungleichheiten schon bei der Prüfung der Dividende
agent:
- 'Unterlagen anfordern (M-Files, sonst Pendenz mit Konto, Datum und Betrag): gültige Statuten, aktueller Handelsregisterauszug, GV-Protokoll des Vorjahres (Gewinnverwendungsbeschluss),
  VR- und GV-Protokolle des Geschäftsjahres inkl. ausserordentlicher GV (ausserordentliche Dividende, Zwischendividende mit Zwischenabschluss und Verzichtsdokumentation, Rückzahlung
  Kapitalreserve, Kapitalveränderungen, eigene Aktien), Antrag des VR über die Verwendung des Bilanzgewinns (aktuelles Jahr), Aktienbuch bei Namenaktien (OR 686), Belege zu Kapitalerhöhungen
  (öffentliche Urkunden, Kapitalerhöhungsbericht, ggf. Prüfungsbestätigung, Feststellungen des VR nach OR 652g), Budget/Forecast für die Liquiditätsbeurteilung, Abrechnungen Verrechnungssteuer
  und Emissionsabgabe.'
- 'P1-301 (Grundkapital): Grundkapital mit Statuten, Handelsregister und ggf. Aktienbuch abstimmen; Höhe und Zusammensetzung müssen übereinstimmen ^[hwp-bur-2023__rz-0561-s273] ^[ser-2022__anh-d-s091-1].
  Bei Abweichung: Notiz «Wesentliche Feststellungen».'
- 'P1-302/P1-312 (Reserven, Vollzug Vorjahresbeschluss): Eröffnungssalden der Reserven und des Gewinn-/Verlustvortrags mit Vorjahres-Jahresrechnung und GV-Protokoll abstimmen. Prüfen,
  ob Zuweisungen, Dividende und Verrechnung zum GV-Datum gebucht sind ^[hwp-bur-2023__rz-0572-s277-t1]. Die gesetzlich nötige Verlustverrechnung wird erst im Folgejahr gebucht ^[hwp-er-2026__rz-0208-s230-t1].
  Jede Differenz mit `rechne` ermitteln, nie im Kopf.'
- 'P1-303 (Antrag VR): Vorschlag mit `rechne` nachrechnen. Bemessungsbasis der 5 %-Zuweisung: Jahresgewinn abzüglich Verlustvortrag, ohne Gewinnvortrag; bleibt ein Bilanzverlust, entfällt
  die Zuweisung ^[hwp-bur-2023__rz-0585-s280]. Schwelle 50 % bzw. 20 % (Holding) des im HR eingetragenen Aktienkapitals ^[or__art-672]. Ausschüttbares Eigenkapital nach dem Schema HWP
  ER Rz 170 ermitteln ^[hwp-er-2026__rz-0170-s216]; ein Bilanzverlust ist dabei abzuziehen ^[hwp-er-2026__rz-0225-s236]. Statuten auf Mindestausschüttung oder Zusatzreserven durchsehen.
  Auch ein Vortrag des ganzen Bilanzgewinns ist zu prüfen ^[hwp-er-2026__rz-0223-s235]. Ausschüttungen aus anderen Reserven ohne Reservezuweisung aus dem Jahresgewinn rechnen ^[hwp-er-2026__rz-0226-s236].
  Ergebnis im Textfeld; die Beurteilung der Gesetzes- und Statutenkonformität trifft der WP.'
- 'Covid-19-Kredit (Teil von P1-303/P1-315, Bilanz L1/N1): Besteht ein Kredit nach Covid-19-SBüV, prüfen, ob der Antrag oder eine Zahlung im GJ eine Dividende, Tantieme oder Rückerstattung
  von Kapitaleinlagen vorsieht ^[covid-sbueg__art-2-t1]. Ebenso prüfen, ob im GJ Darlehen an Gesellschafter oder Nahestehende gewährt oder Darlehen von ihnen zurückbezahlt wurden (P1-305,
  H2) ^[covid-sbueg__art-2-t1]. Falls ja: Notiz «Wesentliche Feststellungen» an den WP mit Kreditbetrag, Datum der Kreditvereinbarung und Ausschüttungs- bzw. Darlehensbetrag. Fristsetzung
  und Information von GV und Bürgschaftsorganisation nach Art. 23 entscheidet und veranlasst allein der WP ^[covid-sbueg__art-23]; der Agent kontaktiert weder Kunde, GV noch Bürgschaftsorganisation.
  Weitere unzulässige Mittelverwendungen (Art. 2 Abs. 2 Bst. c/d) und Gesamtablauf: `thema gesetzesverstoesse`. Für P1-313 siehe `thema kapitalverlust` (Kredite nach Art. 3 Covid-19-SBüV
  nicht als Fremdkapital, ^[covid-sbueg__art-24]).'
- 'Rückzahlung aus der gesetzlichen Kapitalreserve (Teil von P1-303): Grenze nach OR 671 Abs. 2 (Hälfte, abzüglich Verluste) bzw. Abs. 3 (Holding, 20 %) mit `rechne` ermitteln, ohne
  Reserve nach OR 659b und ohne Aufwertungsreserve ^[or__art-671]; ausschüttbar ist nur der überschiessende Anteil, Liquidität mitbeurteilen ^[hwp-er-2026__rz-0251-s241]. Keine Reservezuweisung
  berücksichtigen ^[hwp-er-2026__rz-0253-s242]. Prüfen, ob ein separater Antrag für einen formell getrennten GV-Beschluss vorliegt ^[hwp-er-2026__rz-0254-s242]; fehlt er: Pendenz.'
- 'Sonderfälle der Ausschüttung: Sach- oder Verrechnungsdividende nur, wenn der Antrag dies ausdrücklich vorsieht; mögliche Verrechnungssteuerzahlungen in die Liquiditätsaufstellung
  (Punkt «Liquidität») aufnehmen, wenn das Meldeverfahren nicht zur Anwendung kommt ^[hwp-er-2026__rz-0234-s238]. Akontodividenden sind bis zum Ausschüttungsbeschluss Darlehen an Aktionäre:
  gegen OR 680 Abs. 2 prüfen (P1-305), und der spätere Beschluss setzt ausreichendes ausschüttbares Eigenkapital voraus ^[hwp-er-2026__rz-0235-s238]. Überträge zwischen Reservepositionen:
  grundsätzlich keine Prüfpflicht; ein Übertrag aus verfügbaren gesetzlichen in freiwillige Reserven, um statt einer ausserordentlichen Dividende ungeprüft eine Zwischendividende auszuschütten,
  als Notiz «Wesentliche Feststellungen» an den WP ^[hwp-er-2026__rz-0227-s236].'
- 'Liquidität (Prüffeld B1, vorbereiten): Mit `rechne` die flüssigen Mittel im Zeitpunkt der Berichtsabgabe bzw. Ausschüttung den laufenden Verpflichtungen (z.B. Lieferanten, Löhne,
  Sozialversicherungen, Miete, Investitionen) plus Dividende gegenüberstellen. Grundlage sind Budgets, Forecasts und schriftliche Kundenantworten ^[hwp-er-2026__rz-0256-s242]. Das Ergebnis
  als Zahlenaufstellung im Textfeld festhalten, ohne Urteil. Fehlt ein Budget oder Forecast: Pendenz. Ist die Differenz (flüssige Mittel minus Verpflichtungen und Dividende) negativ
  oder fehlen Angaben zu wesentlichen Verpflichtungen: Notiz «Wesentliche Feststellungen» und «Schlussbesprechung» mit der Aufstellung. Ob die Mittel ausreichen, ob ein erheblicher Liquiditätsentzug
  oder eine Sorgfaltspflichtverletzung (OR 717) vorliegt und ob ein Zusatz, ein Hinweis oder eine Empfehlung zur Ablehnung nötig ist, beurteilt der WP ^[hwp-er-2026__rz-0256-s242] ^[hwp-er-2026__rz-0222-s235]
  ^[ser-2022__8-3-2-t2].'
- 'Stellungnahme zum Antrag entfällt nur, wenn (1) ein Bilanzverlust vorliegt, (2) der VR keinen Antrag nach OR 674 stellen muss (nur Fälle a/b: Verrechnung mit Gewinnvortrag bzw. freiwilligen
  Gewinnreserven) und (3) keine Ausschüttung aus anderen Reserven und keine Rückzahlung aus der gesetzlichen Kapitalreserve beantragt wird ^[hwp-er-2026__rz-0224-s236] ^[hwp-er-2026__rz-0208-s230-t2]
  ^[textbausteine-gewinnverwendung-2022__s001-3]. Dann gekürzter Berichtstext ^[hwp-er-2026__rz-0442-s285]. Verbleibt nach der zwingenden Verrechnung ein Bilanzgewinn, ist ein Verwendungsantrag
  nötig und zu prüfen. Bei Verrechnung mit gesetzlichen Reserven oder Vortrag (Fälle c–e) muss ein VR-Antrag vorliegen; fehlt er: Pendenz.'
- 'P1-305 Einlagenrückgewähr (Prüffelder D1/H2): Freies Eigenkapital (gesamtes Eigenkapital abzüglich einbezahltes Aktienkapital) mit dem Total der Darlehensforderungen gegenüber Aktionären
  und Konzern vergleichen ^[hwp-er-2026__rz-0167-s215]. Forderungen ohne Drittvergleich sperren ausschüttbares Eigenkapital ^[hwp-er-2026__rz-0170-s216]. Feststellungen als Notiz «Wesentliche
  Feststellungen»; ob ein Gesetzesverstoss und ein Hinweis nach SER 8.3.2 vorliegen, beurteilt der WP ^[ser-2022__8-3-2-t2].'
- 'P1-304 eigene Anteile (vorbereiten): Bestand, Anschaffungswert, 10-%- bzw. 20-%-Grenze und frei verwendbares Eigenkapital beim Erwerb prüfen ^[or__art-659]. Ausweis als Minusposten
  zum Anschaffungswert ^[or__art-659a], ohne Folgebewertung ^[hwp-bur-2023__rz-0646-s293]; im Konzern gesetzliche Gewinnreserve nach OR 659b Abs. 2 ^[or__art-659b]. Anhang (Prüffeld
  T1): Anzahl, Erwerb und Veräusserung eigener Anteile ^[or__art-959c-t1]. Fehlt frei verwendbares Eigenkapital oder ist die Grenze überschritten: Notiz «Wesentliche Feststellungen»;
  ob ein Hinweis nach SER 8.3.2 nötig ist, entscheidet der WP ^[ser-2022__8-3-2-t2]. Das handelsrechtliche Wahlrecht für den Veräusserungserfolg (erfolgsneutral oder erfolgswirksam)
  bleibt bestehen ^[qa-or-rechnungslegung-2026__3-2-t1]; Prüffeld S1: Wird der Mehr- oder Mindererlös aus der Wiederbegebung erfolgswirksam gebucht, ist der ausgewiesene Gewinn oder
  Verlust «für Gewinnsteuerzwecke zu korrigieren» ^[estv-ks-51-2026__3-3-2-1] (Steuerabgrenzung ^[qa-or-rechnungslegung-2026__3-2-t2]). Verrechnungssteuer (für P1-308/S1 vorbereiten):
  Der Rückkauf eigener Beteiligungsrechte ist verrechnungssteuerlich grundsätzlich eine Teilliquidation ^[estv-ks-51-2026__3-1-1-t1]. Für den Bestand je Tranche Erwerbsdatum, Anzahl
  und Erwerbspreis aus Aktienbuch bzw. Vorjahresakten festhalten und je Tranche das Fristende (Erwerbsdatum plus sechs Jahre; Jahr mit `rechne`) mit dem Bilanzstichtag vergleichen. Die
  Analyse der Käufe und Verkäufe des GJ ist P1-306 und bleibt beim WP. Ein Erwerb im Hinblick auf eine Kapitalherabsetzung oder über den Rahmen von OR 659 hinaus löst die VSt auf der
  Differenz zwischen Erwerbspreis und einbezahltem Nennwert aus ^[vstg__art-4a-t1] ^[estv-ks-51-2026__3-1-2-3-t1]. Im Rahmen von OR 659 entsteht die Steuerforderung erst, wenn die Aktien
  «nicht innerhalb von sechs Jahren wieder veräussert» werden ^[vstg__art-4a-t1], und zwar mit Ablauf dieser Frist ^[vstg__art-12]. Die Frist läuft ab Erwerb, «first in, first out» ^[estv-ks-51-2026__3-1-2-3-t1]
  ^[estv-ks-51-2026__3-1-2-3-t2]. Notiz «Wesentliche Feststellungen» (mögliche VSt-Schuld, Abgrenzung prüfen), wenn: Fristende am oder vor dem Bilanzstichtag (Haltedauer über sechs Jahre),
  Bestand über 10 % des Aktienkapitals oder Rückkauf für eine Kapitalherabsetzung ohne VSt-Abrechnung. Die steuerliche Beurteilung trifft der WP.'
- 'P1-306 (Käufe/Verkäufe eigener Anteile) und P1-307 (Änderungen im Grundkapital, Optionen) sind WP-Schritte («nur_mensch»; nach SER Anhang D weitergehende Prüfungshandlungen ^[ser-2022__anh-d-s091-1]).
  Ohne ausdrückliche Anweisung nicht bearbeiten; Status «nicht bearbeitet – WP-Schritt» ^[konzept-ki-revisionsagent-2026__c012-1]. Hinweise an den WP sind erlaubt, z.B. «Kapitalerhöhung
  im GJ, Urkunden in M-Files Nr. …». Erst auf Anweisung: Belege zusammenstellen und prüfen: Frist OR 650 Abs. 3 ^[or__art-650-t2], HR-Eintrag ^[or__art-652h] und Erfassungszeitpunkt
  ^[hwp-bur-2023__rz-0866-s354], Prüfungsbestätigung OR 652f ^[or__art-652f], Statutenänderung und Feststellungen des VR (OR 652g) ^[or__art-652g]; bei eigenen Anteilen Käufe und Verkäufe
  auflisten. Der Bestand nach P1-304 bleibt beim Agenten.'
- 'P1-308 (steuerliche Behandlung von Kapitalerhöhungen/-herabsetzungen und Gewinnausschüttungen): Zuerst prüfen, ob im GJ eine Kapitalerhöhung, ein Zuschuss, eine Kapitalherabsetzung,
  eine Ausschüttung, eine Rückzahlung aus KER oder ein Rückkauf eigener Aktien stattfand. Nein: Status «nicht bearbeitet – kein Sachverhalt». Ja oder Anweisung des WP: ESTV-Abrechnungen
  (Emissionsabgabe, Verrechnungssteuer, Formular 170 nur bei Veränderung der KER) aus M-Files zusammenstellen und mit den Buchungen abstimmen (`rechne`); fehlt eine Abrechnung: Pendenz.
  Dem WP mit einer Notiz die Durchführung als weiter gehende Prüfungshandlung vorschlagen ^[ser-2022__anh-d-s091-1]; Visum offen. Die steuerliche Würdigung trifft der WP. Emissionsabgabe:
  1 % des Zuflusses; bei Gründung oder Kapitalerhöhung einmaliger Freibetrag von CHF 1 Mio.; Zuschüsse sind abgabepflichtig, aber ohne Freibetrag ^[treuhand-almanach-2026__s067-1]. Steuerliche
  Praxis aus einer Sekundärquelle (Treuhand-Almanach 2026): als solche kennzeichnen, bei Zweifel Pendenz zur Verifikation an der ESTV-Quelle.'
- 'P1-315 (Dividendenzahlungen/Verrechnungssteuer): Auszahlungen mit dem GV-Beschluss abstimmen. VSt: 35 Prozent der steuerbaren Leistung auf Kapitalerträgen ^[vstg__art-13]. Die Auszahlung
  ist um den Steuerbetrag zu kürzen ^[vstg__art-14]. Die Steuerforderung entsteht, wenn die Dividende fällig wird ^[vstg__art-12]; die Steuer ist 30 Tage danach fällig, danach ist ohne
  Mahnung Verzugszins geschuldet ^[vstg__art-16]. Beim Meldeverfahren ^[vstg__art-20] entfällt der Verzugszins, wenn dessen materielle Voraussetzungen erfüllt sind ^[vstg__art-16]. VSt-Betrag
  mit `rechne` nachrechnen und das Abrechnungs- bzw. Zahlungsdatum aus M-Files festhalten. Bei Sach- oder Verrechnungsdividenden ohne Meldeverfahren die Verrechnungssteuerzahlung in
  die Liquiditätsaufstellung (Punkt «Liquidität», B1) aufnehmen ^[hwp-er-2026__rz-0234-s238]. Fehlende Abrechnung: Pendenz.'
- 'P1-310 (Gliederung): Eigenkapitalpositionen gegen die Mindestgliederung OR 959a Abs. 2 Ziff. 3 prüfen (Reihenfolge, gesetzliche Kapital- und Gewinnreserve getrennt, eigene Kapitalanteile,
  Verlustvortrag und Jahresverlust als Minusposten) ^[or__art-959a-t1]. Für jede Reserveart ein separates Konto; eine Verlustverrechnung schon in der Vorperiode verletzt die Mindestgliederung
  ^[hwp-bur-2023__rz-0572-s277-t1]. Abweichung: Notiz «Wesentliche Feststellungen» mit Umgliederungsvorschlag (nie verbuchen).'
- 'P1-311 Aufwertungsreserve: Der revio-Katalog nennt OR 670 (altes Recht); massgebend ist OR 725c. Die Aufwertungsreserve darf nur durch Umwandlung in Aktien- oder PS-Kapital, durch
  Wertberichtigung oder durch Veräusserung der aufgewerteten Aktiven aufgelöst werden ^[or__art-725c]; jede andere Auflösung (z.B. Umbuchung in freie Reserven, Ausschüttung): Notiz «Wesentliche
  Feststellungen». Aufwertungsreserve gesondert unter der gesetzlichen Gewinnreserve ausweisen; schriftliche Bestätigung der Revisionsstelle bzw. eines zugelassenen Revisors nach OR
  725c Abs. 2 einsehen ^[or__art-725c]. P1-313: Kapitalverlust mit dem Werkzeug `kapitalverlust` (OR 725a) berechnen.'
- 'P1-314 (Statutenänderungen/SHAB): Statutenänderungen des Geschäftsjahres aus GV- und VR-Protokollen festhalten; der Beschluss ist öffentlich zu beurkunden und ins Handelsregister
  einzutragen ^[or__art-647]. HR-Einträge werden mit der Veröffentlichung im SHAB wirksam ^[or__art-936a]; bei Kapitalveränderungen Eintragungsdatum mit dem Buchungsdatum vergleichen
  ^[hwp-bur-2023__rz-0866-s354]. Fehlt der Nachweis: Pendenz.'
- 'P1-316 (Buchungen auf EK-Konti): Alle Buchungen auf Eigenkapitalkonten mit GV- bzw. VR-Beschlüssen und Belegen abstimmen; Bildung und Verwendung von Reserven sind aufgrund der GV-Beschlüsse
  unter deren Datum zu buchen ^[hwp-bur-2023__rz-0572-s277-t1]. Differenzen mit `rechne`; unbelegte Buchungen: Notiz «Wesentliche Feststellungen».'
- 'P1-317 (Aktienbuch): Bei Namenaktien das Aktienbuch einsehen (Eigentümer und Nutzniesser mit Name und Adresse, in der Schweiz jederzeit zugänglich) ^[or__art-686] und mit Grundkapital,
  Statuten und HR abstimmen ^[hwp-bur-2023__rz-0561-s273]. Fehlt es: Pendenz und Hinweis an den WP.'
- P1-401 (Eigenkapitalspiegel) nur auf Anweisung des WP; ohne Anweisung Status «nicht bearbeitet – nur auf Anweisung» ^[konzept-ki-revisionsagent-2026__c012-1].
- 'Kapitaleinlagereserven (KER; P1-303, P1-308, P1-315): Eine Rückzahlung aus KER wird verrechnungssteuerlich nur dann wie eine Rückzahlung von Grund- oder Stammkapital behandelt, wenn
  die KER «in der Handelsbilanz auf einem gesonderten Konto ausgewiesen werden» und jede Veränderung der ESTV gemeldet wird ^[vstg__art-5-t3] (KS 29c Ziff. 9.1 ^[estv-ks-29c-2022__7-2-5-t3]).
  Prüfen, ob ein gesondertes KER-Konto besteht. Nur wenn sich die KER im GJ verändert haben (Einlage oder Rückzahlung): Rückzahlungen sind «innert 30 Tagen nach der Generalversammlung
  oder spätestens 30 Tage nach der Rückzahlung mittels Formular 170 unaufgefordert zu melden» (KS 29c Ziff. 9.3 Bst. a ^[estv-ks-29c-2022__7-2-5-t5]); bei reinen Einlagen gilt für Formular
  170 die Frist der Jahresrechnung, «innert 30 Tagen nach Genehmigung der Jahresrechnung» ^[estv-ks-29c-2022__7-2-5-t4] ^[estv-ks-29c-2022__7-2-5-t5]. Formular 170 bzw. die ESTV-Bestätigung
  in M-Files suchen; fehlt der Nachweis: Pendenz. Ohne Veränderung entfällt Formular 170 ^[estv-ks-29c-2022__7-2-5-t5]. Beantragt der VR die Verrechnung von Verlusten mit der gesetzlichen
  Kapitalreserve, als Punkt für die Schlussbesprechung notieren: «Verluste, die solchen KER bzw. Ausland-KER belastet wurden, vermindern diese definitiv.» ^[estv-ks-29c-2022__7-2-5-t3].
  Sind ausgewiesene KER von der ESTV nicht genehmigt, ist im Anhang darauf hinzuweisen ^[hwp-bur-2023__rz-0565-s275-t2]; fehlt der Hinweis: Notiz «Wesentliche Feststellungen». Die Steuerfolgen
  beurteilt der WP.'
- 'Zwischendividende im Geschäftsjahr: GV-Protokolle durchsehen und die Dokumentation zum Prüfungsverzicht würdigen ^[hwp-er-2026__rz-0247-s241]: Liegt ein Zwischenabschluss vor und
  ist der Verzicht gültig (Zustimmung sämtlicher Aktionäre, keine Gläubigergefährdung) ^[hwp-er-2026__rz-0248-s241]? Ausweis als Negativposition unter dem Jahresgewinn prüfen ^[hwp-er-2026__rz-0246-s240].
  Den Zwischenabschluss nicht nachträglich prüfen ^[hwp-er-2026__rz-0249-s241]. Bei Zweifeln: Notiz «Wesentliche Feststellungen». Ob Rechtsrat einzuholen ist, entscheidet der WP.'
- 'Ausserordentliche Dividende im Geschäftsjahr: GV-Protokolle (auch ausserordentliche GV) auf Ausschüttungen durchsehen und einordnen: Basis letzte genehmigte Jahresrechnung = ausserordentliche
  Dividende, Ausschüttung aus dem laufenden Gewinn = Zwischendividende ^[hwp-er-2026__rz-0236-s238]. Prüfen, ob ein Bericht der Revisionsstelle zum Antrag vorlag; fehlt er: Notiz «Wesentliche
  Feststellungen» an den WP (Frage der Nichtigkeit nach OR 731 Abs. 3, besonders ohne ausschüttbares Eigenkapital) ^[hwp-er-2026__rz-0239-s239]. Ob Rechtsrat eingeholt und der VR auf
  die Rechtslage hingewiesen wird, entscheidet der WP ^[hwp-er-2026__rz-0240-s239]. Textbaustein bei beantragter ausserordentlicher Dividende: separate Berichterstattung zum Antrag ^[textbausteine-gewinnverwendung-2022__s002-3].'
- 'Bericht: Der Agent schlägt nur den passenden Textbaustein vor ^[textbausteine-gewinnverwendung-2022__s001-2] ^[ser-2022__anh-f-s137-1]. Wird auch eine Rückzahlung aus der Kapitalreserve
  beantragt, ist dieser Antrag separat aufzuführen ^[hwp-er-2026__rz-0255-s242]. Bei erheblichem Liquiditätsentzug die Varianten nennen: Zusatz, wenn die Ausschüttung nur bedingt vertretbar
  ist (SER Anhang F Bsp. 12) ^[ser-2022__anh-f-s130-2]; Hinweis, wenn die Vertretbarkeit verneint wird (SER 8.3.2, HWP ER Rz 441) ^[ser-2022__8-3-2-t2] ^[hwp-er-2026__rz-0441-s285];
  Beurteilung des Antrags als gesetzwidrig (Camponovo, Fachliteratur) ^[camponovo-2026-hinweispflichten__s069-1]. Der WP entscheidet. Keine Unterzeichnung, keine Datierung, keine Freigabe.'
- 'Weicht die GV vom Antrag ab oder ändert der VR den Antrag nach Berichtsabgabe: an den WP melden. Ein abweichender GV-Beschluss wird im Folgejahr geprüft ^[hwp-er-2026__rz-0446-s287].
  Einen geänderten Antrag mit höherer Ausschüttung beurteilt die Revisionsstelle separat ^[hwp-er-2026__rz-0228-s237].'
