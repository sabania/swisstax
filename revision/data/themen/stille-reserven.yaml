kurz: Stille Reserven entstehen durch zusätzliche Abschreibungen, Wertberichtigungen und Rückstellungen oder durch Verzicht auf die Auflösung nicht mehr begründeter Posten (OR 960a Abs.
  4, 960e); Zwangsreserven durch Wertzuwachs über die Höchstwerte. Eine wesentliche Nettoauflösung ist im Anhang offenzulegen (OR 959c Abs. 1 Ziff. 3). Die Revisionsstelle plausibilisiert
  Bestand und Veränderung anhand der Bilanzpositionen und stimmt sie mit dem Detailnachweis ab (revio A1-207/A1-308, 10.3). Steuerliche Sätze (ESTV MB A, Warendrittel, Pauschaldelkredere)
  sind Steuerpraxis, keine handelsrechtlichen Werte.
aussagen:
- text: 'Bildung (OR 960a Abs. 4): Zu Wiederbeschaffungszwecken und zur Sicherung des dauernden Gedeihens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
    Satz 2 erlaubt zu den gleichen Zwecken auch, nicht mehr begründete Posten stehen zu lassen: «Zu den gleichen Zwecken kann davon abgesehen werden, nicht mehr begründete Abschreibungen
    und Wertberichtigungen aufzulösen.» Wiederbeschaffungsreserven dürfen voraussetzungslos gebildet werden, ihr Umfang ist aber durch die Wiederbeschaffungszwecke begrenzt (hwp-bur-2023__rz-0662-s295).'
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- text: Rückstellungen dürfen auch zur Sicherung des dauernden Gedeihens gebildet werden (OR 960e Abs. 3 Ziff. 4). Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden
    (OR 960e Abs. 4).
  quelle: or__art-960e
  zitat: Nicht mehr begründete Rückstellungen müssen nicht aufgelöst werden.
- text: Steuerliche Vorgaben sind keine handelsrechtlichen Bewertungsregeln. ESTV-Normalsätze für Abschreibungen (Merkblatt A 1995 ^[estv-mb-a-1995__s001-1]) und das pauschale Delkredere
    sollen steuerlich einen Mindest-Reingewinn sichern; höhere Sätze anerkennt die Steuer nur mit konkretem Nachweis (EF 2026/08, Sekundärquelle). Das Warendrittel ist eine steuerlich
    begünstigte Pauschalwertberichtigung ^[hwp-bur-2023__rz-0759-s320]. Abschreibungen, Wertberichtigungen und Rückstellungen über dem betriebswirtschaftlichen Mass sind stille Reserven
    ^[hwp-bur-2023__rz-0669-s296] und gehören in die Aufstellung (revio 10.3). Nicht mehr begründete Rückstellungen werden steuerlich dem Gewinn zugerechnet (DBG Art. 63 Abs. 2 ^[dbg__art-63]),
    handelsrechtlich müssen sie nicht aufgelöst werden (OR 960e Abs. 4 ^[or__art-960e]).
  quelle: ef-2026-08-buchungslogik__s005-1
  zitat: Steuerlich wird durch entsprechende Vorgaben beabsichtigt, einen Mindest-Reingewinn zur Besteuerung zu bringen.
- text: 'Begriff: Stille Reserven im Sinne des OR (Gegenstand der Offenlegung bei Nettoauflösung) sind die Differenz zwischen den Buchwerten und den rechnungslegungsrechtlich zulässigen
    Höchstwerten (Aktiven) bzw. erforderlichen Beträgen (Verbindlichkeiten). Die Differenz zum tatsächlichen Wert (Verkehrswert) ist nicht gemeint; diese Lesart der Literatur gilt für
    die OR-Jahresrechnung nicht ^[hwp-bur-2023__rz-0817-s341-t2]. Die Differenz zwischen Verkehrswert und gesetzlichem Höchstwert ist Zwangsreserve ^[hwp-bur-2023__rz-0654-s294].'
  quelle: hwp-bur-2023__rz-0652-s293
  zitat: die Differenz zwischen den Buchwerten und den unter Obligationenrecht rechnungslegungsrechtlich zulässigen Höchstwerten (Vermögenswerte) bzw. erforderlichen Beträgen (Verbindlichkeiten)
    verstanden
- text: 'Kategorien (HWP BuR Abbildung 19): Zwangsreserven sind die Differenz zwischen den tatsächlichen Werten (Verkehrswerten) und den gesetzlichen Höchstwerten. Sie entstehen z.B.
    durch die Wertzunahme von Grundstücken. Willkürreserven sind die Differenz zwischen den gesetzlichen Höchstwerten und den tiefer angesetzten Buchwerten von Aktiven bzw. den höher
    angesetzten Buchwerten von Passiven. Für die Offenlegung der Nettoauflösung zählen die Willkürreserven, nicht die Zwangsreserven (vgl. hwp-bur-2023__rz-0652-s293, hwp-bur-2023__rz-0660-s295).'
  quelle: hwp-bur-2023__rz-0654-s294
  zitat: Willkürreserven ergeben sich demgegenüber als Differenz zwischen den gesetzlichen Höchstwerten und den tiefer angesetzten Buchwerten von Aktiven resp. den höher angesetzten
    Buchwerten von Passiven.
- text: Die Veränderung der Zwangsreserven zählt bei der Offenlegung der Nettoauflösung nicht. Werden Zwangsreserven über eine Aufwertung nach OR 725c buchmässig erfasst, ist der Aufwertungsbetrag
    in einer besonderen Aufwertungsreserve im Eigenkapital auszuweisen. Betrag und Gegenstand der Aufwertung sind im Anhang offenzulegen. Auch die Schwankungsreserven unterliegen der
    Ausweispflicht nicht, sie sind separat auszuweisen (hwp-bur-2023__rz-0817-s341-t2).
  quelle: hwp-bur-2023__rz-0660-s295
  zitat: Die Veränderung der Zwangsreserven ist bei der Offenlegung von Reservenauflösungen im Anhang (Art. 959c Abs. 1 Ziff. 3 OR) nicht zu berücksichtigen.
- text: Die Aufwertung nach OR 725c erfasst Zwangsreserven nur in engen Grenzen. Sie ist nur zur Behebung eines Kapitalverlusts (OR 725a) oder einer Überschuldung (OR 725b) zulässig,
    nur für Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs- oder Herstellungskosten gestiegen ist, und höchstens bis zu diesem Wert. Der Betrag ist unter
    der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen (Abs. 1). Zulässig ist die Aufwertung nur mit schriftlicher Bestätigung der Revisionsstelle bzw. eines
    zugelassenen Revisors (Abs. 2). Diese Bestätigung gibt der WP ab, nie der Agent.
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten
    sind.
- text: 'HB I / HB II: Die handelsrechtlichen stillen Reserven auf Aktiven sind die Differenz zwischen dem Buchwert HB II und dem Buchwert HB I. Nach einer Aufwertung entspricht der
    Bestand der Differenz zwischen Buchwert HB II und neuem Buchwert HB I abzüglich Aufwertungsreserve. Die Aufwertungsreserve selbst ist nicht Teil der stillen Reserven. Solange sie
    besteht, ist der Abschreibungsaufwand in der HB I kleiner als in der HB II, und dadurch werden stille Reserven aufgelöst.'
  quelle: hwp-bur-2023__rz-0905-s365
  zitat: Die handelsrechtlichen stillen Reserven auf Aktiven werden als Differenz zwischen dem Buchwert HB II und dem Buchwert HB I ermittelt
- text: 'Eine Auflösung entsteht auch ohne Auflösungsbuchung: Werden in Folgeperioden tiefere oder keine Abschreibungen erfasst oder frühere höhere Abschreibungen rückgängig gemacht,
    werden stille Reserven aufgelöst (vgl. hwp-bur-2023__rz-0341-s230). Der Buchwert darf dabei nicht über die fortgeschriebenen Anschaffungskosten gemäss Abschreibungsplan steigen.'
  quelle: hwp-bur-2023__rz-0796-s329
  zitat: Werden in Folgeperioden verminderte Abschreibungen erfasst oder wird ganz auf solche verzichtet, ergibt sich eine Auflösung von stillen Reserven.
- text: 'Verantwortung des Unternehmens und Bestandsermittlung: Das Unternehmen muss über Bestand und Veränderung der stillen Reserven ausserhalb der Buchhaltung eine Kontrolle führen,
    auf Basis der OR-Höchstbewertungsvorschriften (hwp-bur-2023__rz-0667-s296). Die Methode legt es in Bewertungsregeln fest, die zweckmässigerweise schriftlich festgehalten werden (hwp-bur-2023__rz-0668-s296).
    Eine laufende Kontrolle verlangt das Gesetz nicht. Wegen der Offenlegungspflicht ist aber jährlich per Bilanzstichtag der Bestand je Bilanzposition (Buchwert gegen gesetzlich zulässigen
    Höchstwert) nach stetigen Methoden zu ermitteln und mit dem Vorjahr zu vergleichen.'
  quelle: hwp-bur-2023__rz-0671-s297
  zitat: jährlich zum Bilanzstichtag der Bestand an stillen Reserven aufgrund der Differenz zwischen Buchwert und gesetzlich zulässigem Höchstwert zu ermitteln
- text: 'Offenlegung (OR 959c Abs. 1 Ziff. 3): Der Anhang enthält den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit
    er die Neubildung übersteigt (Nettoauflösung), wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird. Offenzulegen ist nur der Nettobetrag, als Gesamtbetrag
    über alle Bilanzpositionen. Die betroffenen Bilanz- oder Erfolgspositionen müssen nicht genannt werden, und die Unterscheidung zwischen Wiederbeschaffungsreserven und übrigen stillen
    Reserven spielt für die Ausweispflicht keine Rolle (hwp-bur-2023__rz-0817-s341-t1).'
  quelle: or__art-959c-t1
  zitat: den Gesamtbetrag der aufgelösten Wiederbeschaffungsreserven und der darüber hinausgehenden stillen Reserven, soweit dieser den Gesamtbetrag der neugebildeten derartigen Reserven
    übersteigt
- text: 'Wesentlichkeit der Auflösung: Eine Abnahme ist mit dem tatsächlichen (bereinigten) Jahresergebnis zu vergleichen und im Einzelfall zu beurteilen. Die relative Höhe genügt nicht,
    wenn die Auflösung einen Gewinn statt eines Verlusts bewirkt.'
  quelle: hwp-bur-2023__rz-0675-s298
  zitat: ist insbesondere dann nicht allein ausschlaggebend, wenn aufgrund der Auflösung von stillen Reserven ein Jahresgewinn anstelle eines Jahresverlusts entsteht
- text: 'Wesentlichkeit der Prüfung: Ist das Ergebnis durch Bildung oder Auflösung stiller Reserven gesteuert, geht die Bestimmung der Wesentlichkeit vom effektiven Ergebnis aus (HWP
    ER Rz 42: bereinigter Jahresgewinn vor Steuern, hwp-er-2026__rz-0042-s185-t1).'
  quelle: ser-2022__5-2-t1
  zitat: Sind die Ergebnisse gesteuert – z. B. durch Bildung oder Auflösung von stillen Reserven – ist vom effektiven Ergebnis auszugehen.
- text: 'SER, allgemeine Prüfungen (revio A1-207): Bestand und Veränderungen der stillen Reserven werden auf Basis der Erkenntnisse aus den einzelnen Bilanzpositionen plausibilisiert.
    Bei einer wesentlichen Nettoauflösung ist gegebenenfalls deren Offenlegung im Anhang zu verlangen.'
  quelle: ser-2022__anh-d-s072-2
  zitat: Plausibilisierung von Bestand und Veränderungen der stillen Reserven auf Basis der Erkenntnisse aus den Prüfungsarbeiten bei den einzelnen Bilanzpositionen; ggf. Offenlegung
    einer wesentlichen Nettoauflösung im Anhang
- text: 'SER, Detailprüfung (revio A1-308; je Prüffeld Schritt xx-321): Bestand und Veränderung der stillen Reserven werden mit dem Detailnachweis des Unternehmens abgestimmt.'
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmen von Bestand und Veränderung der stillen Reserven mit dem entsprechenden Detailnachweis
- text: 'SER, Anhang (revio T1-305): Zu prüfen ist, ob der Anhang die Nettoauflösung stiller Reserven enthält, wenn dadurch das Ergebnis wesentlich günstiger dargestellt wird. Ergänzend
    sieht der SER eine Befragung nach der Berechnungsmethode im Vergleich zum Vorjahr vor (T1-111, ser-2022__anh-d-s097-2).'
  quelle: ser-2022__anh-d-s098-2
  zitat: Enthält der Anhang Angaben über die Nettoauflösung von stillen Reserven (wenn dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird)?
- text: Die Muster-Vollständigkeitserklärung des SER enthält die Bestätigung, dass Bildung, Auflösung und Bestand der stillen Reserven im Einzelnen mitgeteilt wurden.
  quelle: ser-2022__anh-e-s104-1
  zitat: Bildung, Auflösung und Bestand stiller Reserven haben wir Ihnen im Einzelnen mitgeteilt (Art. 959c Abs. 1 Ziff. 3 OR).
- text: 'revio 4.0 (intern, Konzept KI-Revisionsagent): Die stillen Reserven sind eine eigene Unterlage 10.3 im Bereich 10 «Unterlagen zum Abschluss» (neben 10.1 Saldenbilanz, 10.2 Umbuchungsliste,
    10.4 Jahresrechnung/VE). In 10.3 nur lesen und abstimmen (Aufruf `revio 10.3`, Lesewerkzeug rv_get_financialStatement_LoadHiddenReserves), die Kundenaufstellung als Beilage ablegen
    und Differenzen als Pendenz erfassen. Stille Reserven in revio erfassen oder ändern: nein, bis zum Entscheid consis (revio-Zuordnung, offene Frage 10.3). HB I / HB II steht in Bereich
    1 (Jahresrechnung und Finanzcockpit), den der Agent nur importiert bzw. liest.'
  quelle: konzept-ki-revisionsagent-2026__c006-2
  zitat: 10.1 Saldenbilanz, 10.2 Umbuchungsliste, 10.3 Stille Reserven, 10.4 Jahresrechnung und Vollständigkeitserklärung
- text: 'Bericht: Ist eine wesentliche Nettoauflösung entgegen OR 959c Abs. 1 Ziff. 3 nicht offengelegt, sieht das Muster HWP ER eine eingeschränkte Prüfungsaussage aufgrund eines festgestellten
    Sachverhalts vor. Bei grundlegender Auswirkung gibt es ein Muster für die verneinende Prüfungsaussage (muster-hwp-er-2026__c036-2). Für den Entscheid zwischen eingeschränkter und
    verneinender Aussage berücksichtigt der Abschlussprüfer allenfalls auch Umfang oder Veränderung der stillen Reserven (hwp-er-2026__rz-0409-s276). Den Entscheid trifft der WP.'
  quelle: muster-hwp-er-2026__c025-2
  zitat: Obwohl dadurch das erwirtschaftete Ergebnis wesentlich günstiger dargestellt wird, ist diese Auflösung entgegen der Bestimmung von Art. 959c Abs. 1 Ziff. 3 OR im Anhang nicht
    offengelegt.
- text: 'Kapitalverlust (OR 725a Abs. 1): In der Vergleichsrechnung bleiben allfällige stille Reserven grundsätzlich unberücksichtigt. Massgebend ist das bilanzielle Eigenkapital der
    letzten Jahresrechnung (hwp-er-2026__rz-0371-s112). Ob ein Ausnahmefall vorliegt, beurteilt der WP.'
  quelle: hwp-er-2026__rz-0369-s112
  zitat: wobei allfällige stille Reserven bei der Berechnung grundsätzlich keine Berücksichtigung
- text: Zu den bilanziellen Sanierungsmassnahmen gegen einen Kapitalverlust gehört die Auflösung stiller Reserven, unter Beachtung der Offenlegungspflicht nach OR 959c Abs. 1 Ziff. 3.
    Daneben steht die Aufwertung nach OR 725c. Vor einer Aufwertung empfiehlt das HWP BuR, zuerst stille Reserven so weit wie möglich aufzulösen (hwp-bur-2023__rz-0891-s359-t1).
  quelle: hwp-er-2026__rz-0375-s113-t1
  zitat: Auﬂösung stiller Reserven unter Berücksichtigung der Oﬀenlegungspﬂichten von Art. 959c Abs. 1 Ziﬀ. 3 OR
agent:
- 'Detailnachweis beschaffen: Die Aufstellung «Bestand und Veränderung stiller Reserven» (je Bilanzposition, Stichtag und Vorjahr) in M-Files suchen und mit den Zahlen in revio 10.3
  abgleichen (Aufruf `revio 10.3`, Lesewerkzeug rv_get_financialStatement_LoadHiddenReserves; in 10.3 nichts erfassen oder ändern). Die Kontrolle führt das Unternehmen (hwp-bur-2023__rz-0667-s296
  «über den Bestand und die Veränderung stiller Reserven ausserhalb der Buchhaltung eine Kontrolle zu führen»). Zusätzlich die schriftlichen Bewertungsregeln des Unternehmens beschaffen
  (hwp-bur-2023__rz-0668-s296 «Dazu müssen Bewertungsregeln aufgestellt werden, die zweckmässigerweise schriftlich festgehalten werden.»). Sie dienen als Grundlage für T1-111 (Methode
  und Stetigkeit). Fehlt die Aufstellung, das Vorjahr oder die Bewertungsregeln: Notiz «Pendenz» und Vorschlag für die PBC-Liste (10.10). Gestützt auf ser-2022__anh-d-s073-1 und hwp-bur-2023__rz-0671-s297.'
- 'HB I / HB II: Führt das Mandat in revio Bereich 1 eine HB I / HB II (konzept-ki-revisionsagent-2026__c006-2 «1.1 Bilanz, Erfolgsrechnung, Anhang, Antrag VR; 1.2 Kennzahlen und Dashboard;
  1.3 Spezialauswertungen; HB I / HB II»), die Differenzen Buchwert HB II − Buchwert HB I je Aktivposition lesen und mit der Aufstellung 10.3 abgleichen (hwp-bur-2023__rz-0905-s365 «Die
  handelsrechtlichen stillen Reserven auf Aktiven werden als Differenz zwischen dem Buchwert HB II und dem Buchwert HB I ermittelt»). Rz 905 betrifft nur die Aktiven; Reserven auf Passiven
  (z.B. Rückstellungen) separat abgleichen. Bereich 1 nur lesen, schreibend arbeitet der Agent nur in den Bereichen 4 und 10 (konzept-ki-revisionsagent-2026__c006-1), in 10.3 aber nur
  lesen. Abweichungen: Notiz «Pendenz» mit Position und Betrag.'
- 'Prüffeld-Schritte xx-321 (C1, D1, F1, F2, G1, G2, H1, H2, H3, I1, K1, M1, M3, O1, R1, S1; bei E1 ist es E1-320): Das Prüffeld-Ergebnis mit der entsprechenden Zeile der Aufstellung
  abstimmen, also Buchwert gegen betriebswirtschaftlich notwendigen Wert bzw. OR-Höchstwert. Typische Positionen nach hwp-bur-2023__rz-0669-s296: Wertschriften («Betroffen sind vor allem
  die Wertschriften (mit Ausnahme der Schwankungsreserve»), Vorräte, Anlagevermögen (insbesondere Sachanlagen und Beteiligungen), offen ausgewiesene Wertberichtigungen und Rückstellungen.
  Die Arbeitgeberbeitragsreserven führt HWP BuR Abbildung 20 als eigene Zeile (hwp-bur-2023__rz-0671-s297), Voraussetzungen siehe unten (R1-321). Abweichungen im Textfeld festhalten.'
- 'Rechnen nur mit `rechne`: (1) Veränderung = Bestand GJ − Bestand VJ (ohne Zwangsreserven, Schwankungsreserve und Aufwertungsreserve). (2) Ist die Veränderung negativ, ist ihr Betrag
  ohne Vorzeichen die Nettoauflösung. (3) Bereinigtes Ergebnis = ausgewiesenes Jahresergebnis − Nettoauflösung (Agentenvorschlag; Rz 675 verlangt den Vergleich mit dem bereinigten Ergebnis,
  hwp-bur-2023__rz-0675-s298). (4) Ausgewiesenes Ergebnis > 0 und bereinigtes Ergebnis < 0 → Hinweis an den WP «Gewinn nur durch Auflösung». (5) Nach einer Aufwertung (OR 725c) zählt
  die Aufwertungsreserve selbst nicht; die tieferen Abschreibungen in der HB I sind aber eine Auflösung (hwp-bur-2023__rz-0905-s365).'
- 'Auflösungen ohne Auflösungsbuchung erkennen und als Hinweis erfassen: tiefere, weggelassene oder rückgängig gemachte Abschreibungen bei gleichem Anlagebestand (hwp-bur-2023__rz-0796-s329,
  hwp-bur-2023__rz-0341-s230) und die anteilige Reduktion des Warendrittels beim Lagerabbau, soweit es einer Reserve entspricht (hwp-bur-2023__rz-0759-s320). Bei Arbeitgeberbeitragsreserven
  gilt: Ohne Verwendungsverzicht sind sie nur dann stille Reserven, wenn die Einlagen dem Periodenergebnis belastet wurden (hwp-bur-2023__rz-0666-s296 «Werden Einlagen in Arbeitgeberbeitragsreserven
  ohne Verwendungsverzicht aus Gründen der Steuerplanung dem Periodenergebnis belastet, stellen sie stille Reserven dar»). Nur deren Auflösung ist einzurechnen. Arbeitgeberbeitragsreserven
  mit Verwendungsverzicht sind keine stillen Reserven («Arbeitgeberbeitragsreserven mit Verwendungsverzicht stellen keine stillen Reserven dar.», hwp-bur-2023__rz-0666-s296).'
- 'Steuerliche Praxis als solche kennzeichnen, sie ist keine handelsrechtliche Bewertungsregel: Warendrittel und Pauschaldelkredere sind steuerlich begünstigte Pauschalwertberichtigungen
  (Warendrittel: hwp-bur-2023__rz-0253-s214, hwp-bur-2023__rz-0759-s320, treuhand-almanach-2026__s029-1; Pauschaldelkredere 5 %/10 %: hwp-bur-2023__rz-0437-s248, hwp-bur-2023__rz-0189-s102-t2;
  steuerliche Grundlage dbg__art-63). Eine ESTV-Quelle zu diesen Sätzen ist nicht im Wiki. Handelsrechtlich sind solche Pauschalwertberichtigungen über die Reservenbildung legitimiert
  (hwp-bur-2023__rz-0196-s104 «Diese sind durch die ausdrücklich zugelassene Bildung stiller Reserven (Art. 960a Abs. 4 OR) legitimiert.»). Reservecharakter hat der steuerliche Abzug
  erst, wenn alle handelsrechtlich erforderlichen Wertkorrekturen vorgenommen sind (hwp-bur-2023__rz-0253-s214 «hat der auf dem Restwert gebildete steuerliche Bewertungsabzug nicht mehr
  Wertberichtigungs-, sondern Reservecharakter»). Nur der Teil über dem betriebswirtschaftlichen Bedarf gehört als stille Reserve in die Aufstellung (hwp-bur-2023__rz-0669-s296).'
- 'Delkredere C1 (C1-303, C1-321): Der Umgang mit stillen Reserven ist bei consis noch offen (konzept-ki-revisionsagent-2026__c015-2). Bis zum Entscheid consis gilt: In C1-303 Bestand
  GJ/VJ und Veränderung mit `rechne` ermitteln und dokumentieren. In C1-321 nur Fakten festhalten (Abstimmung mit dem Detailnachweis 10.3, Methode stetig zum VJ ja/nein, Nettoauflösung
  ja/nein mit Betrag) und an T1-305 weitergeben. Ob die Reserve zulässig oder die Auflösung wesentlich ist, beurteilt der WP.'
- 'Betrag für T1-305: Nettoauflösung VOR latenten Steuern, als ein Gesamtbetrag über alle Positionen (hwp-bur-2023__rz-0673-s297, hwp-bur-2023__rz-0817-s341-t1). Nicht um latente Steuern
  kürzen (hwp-bur-2023__rz-0817-s341-t2). ‹Netto› heisst Auflösungen minus Neubildungen, nicht ‹nach Steuern›. Aus revio 10.3 die Werte vor Steuern verwenden (hiddenReserveValue, previousHiddenReserveValue,
  deviationValue); netValues und taxValues nicht verwenden (Feldbedeutung nur vermutet; im Zweifel Pendenz). Ein nicht aktiviertes latentes Steuerguthaben auf versteuerten stillen Reserven
  gehört nicht in die Aufstellung, wenn das Unternehmen latente Steuern im OR-Einzelabschluss wie üblich nicht erfasst (hwp-bur-2023__rz-0673-s297).'
- 'T1-305 (Anhang): Bei einer rechnerischen Nettoauflösung prüfen, ob der Anhang einen Gesamtbetrag nennt (hwp-bur-2023__rz-0817-s341-t1 «Offenzulegen ist nur der Nettobetrag der aufgelösten
  stillen Reserven.»). Fehlt die Angabe oder ist sie falsch: Notiz «Wesentliche Feststellungen» mit Betrag sowie Notiz «Schlussbesprechung». Ob die Auflösung wesentlich ist und welche
  Prüfungsaussage folgt (eingeschränkt: muster-hwp-er-2026__c025-2; verneinend: muster-hwp-er-2026__c036-2), entscheidet der WP. Er berücksichtigt dabei allenfalls auch die stillen Reserven
  (hwp-er-2026__rz-0409-s276 «Er wird dabei allenfalls auch Umfang oder Veränderung der stillen Reserven berücksichtigen.»). Der Agent liefert Bestand und Veränderung dazu nur als Information.'
- 'T1-111 (Befragung zur Berechnungsmethode im Vergleich zum Vorjahr, ser-2022__anh-d-s097-2): Der Agent befragt nicht selbst. Er wertet die schriftliche Antwort aus 10.11 und die Bewertungsregeln
  (hwp-bur-2023__rz-0668-s296) aus, sonst erfasst er die Frage als Pendenz. Status höchstens «teilweise bearbeitet». Ein Methodenwechsel ohne Begründung gehört in die Notiz «Schlussbesprechung».'
- 'Vollständigkeitserklärung (10.4): Prüfen, ob die unterzeichnete Vollständigkeitserklärung den Satz zu Bildung, Auflösung und Bestand der stillen Reserven enthält (ser-2022__anh-e-s104-1).
  Fehlt er: Pendenz.'
- 'Planung/Analytik: Die Wesentlichkeit wird aus revio 3.3 nur gelesen, nie geändert. Wurde die Bezugsgrösse nicht um die Veränderung stiller Reserven bereinigt (ser-2022__5-2-t1, hwp-er-2026__rz-0042-s185-t1):
  Pendenz. Für Vorjahresvergleiche (1.2) die Zahlen um die Veränderung stiller Reserven bereinigen. Massgebend ist der SER: ser-2022__6-1-2-t2 «Einfluss der Bildung oder Auflösung stiller
  Reserven auf die ausgewiesenen Werte in der Jahresrechnung», ergänzend hwp-er-2026__rz-0110-s199 «bereinigt die Zahlen entsprechend».'
- 'Kapitalschutz (P1-313, OR 725a): Den Kapitalverlust grundsätzlich auf dem bilanziellen Eigenkapital ohne stille Reserven rechnen (hwp-er-2026__rz-0369-s112 «grundsätzlich keine Berücksichtigung»,
  hwp-er-2026__rz-0371-s112). Abweichungen davon beurteilt der WP. Den Bestand an stillen Reserven nur als Information für den WP angeben, als mögliche Sanierungsmassnahme mit Offenlegungspflicht
  (hwp-er-2026__rz-0375-s113-t1). Vor einer Aufwertung zuerst stille Reserven auflösen (hwp-bur-2023__rz-0891-s359-t1 «ist es daher empfehlenswert und im Sinne der gesetzlichen Regelung,
  zuerst stille Reserven so weit wie möglich aufzulösen.»). Bei Überschuldung (OR 725b) steht es der Gesellschaft «frei, Bewertungsreserven aufzulösen bzw. Aufwertungen im Sinne von
  Art. 725c OR vorzunehmen, um die ausgewiesene Überschuldung zu eliminieren». Und weiter: «Sieht die Gesellschaft von einer solchen Bewertungsanpassung ab, obwohl die Möglichkeit dazu
  bestehen würde, ist eine entsprechende Offenlegung im Anhang zu erwägen» (qa-kapitalverlust-2023__2-2-2-t4). Der Agent liefert dazu nur den Hinweis an den WP.'
- 'Aufwertung (P1-311, OR 725c): Liegt eine Aufwertung vor, vorbereiten: Ist die Aufwertungsreserve gesondert ausgewiesen (or__art-725c «Der Aufwertungsbetrag ist unter der gesetzlichen
  Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.»)? Betrifft sie nur Grundstücke oder Beteiligungen und höchstens den wirklichen Wert (or__art-725c «dürfen Grundstücke und
  Beteiligungen, deren wirklicher Wert über die Anschaffungs- oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden»)? Sind Betrag und Gegenstand im
  Anhang offengelegt (hwp-bur-2023__rz-0660-s295)? Liegen die schriftliche Bestätigung nach Abs. 2, der Bewertungsnachweis und das VR-Protokoll in M-Files? Fehlt etwas: Pendenz. Die
  Bestätigung gibt der WP ab, nie der Agent; der Agent bereitet nur vor. Der Katalogtext P1-311 verweist noch auf OR 670. Dieser Artikel ist seit 1.1.2023 aufgehoben (or__art-670), massgebend
  ist OR 725c.'
- 'Einlagerückgewähr (P1-305), zwei getrennte Fragen: (a) Liegt eine verbotene Einlagenrückgewähr vor (Forderungen mit Darlehenscharakter gegenüber Aktionären vs. freies Eigenkapital)?
  Stille Reserven dürfen netto nach latenten Steuern mitgezählt werden (hwp-er-2026__rz-0167-s215). (b) Darf ausgeschüttet werden? Massgeblich sind nur die offenen Reserven; liegt ohne
  stille Reserven ein Verstoss vor, darf keine Ausschüttung erfolgen (hwp-er-2026__rz-0172-s216). Beide Varianten mit `rechne` ausweisen; die Beurteilung trifft der WP.'
