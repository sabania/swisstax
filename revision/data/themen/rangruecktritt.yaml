kurz: Ein Rangrücktritt erlaubt dem VR bei Überschuldung, auf die Benachrichtigung des Gerichts zu verzichten, wenn Gläubiger im Ausmass der Überschuldung im Rang zurücktreten und Betrag
  und Zinsen während der Dauer der Überschuldung stunden (Art. 725b Abs. 4 Ziff. 1 OR). Nach HWP ER muss er schriftlich, unbedingt, unwiderruflich und unbefristet sein. Er ist keine
  Sanierungsmassnahme, beseitigt weder Überschuldung noch Kapitalverlust; die Verbindlichkeit bleibt Fremdkapital und ist offenzulegen. Gültigkeit und Ausmass beurteilt der WP; der Agent
  rechnet, legt Unterlagen bei und erfasst Notizen (WP-Schritte N1-105/L1-105/L1-304 und N1-401 nur auf Anweisung).
aussagen:
- text: 'Gesetzliche Grundlage (Art. 725b Abs. 4 Ziff. 1 OR): Bei Überschuldung kann die Benachrichtigung des Gerichts unterbleiben, wenn Gesellschaftsgläubiger im Ausmass der Überschuldung
    im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden. Der Rangrücktritt muss den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung
    umfassen. Weitere Merkmale (schriftlich, unbedingt, unwiderruflich, unbefristet) verlangt nicht das Gesetz, sondern die Berufsauffassung (HWP ER, siehe unten).'
  quelle: or__art-725b-t1
  zitat: wenn Gesellschaftsgläubiger im Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden, sofern der Rangrücktritt den geschuldeten
    Betrag und die Zinsforderungen
- text: 'SER (massgebend, Anhang H): Der Rangrücktritt ist ein zweiseitiges Rechtsgeschäft zwischen Gläubiger und Schuldner über eine bestehende Forderung. Vereinbart werden die Stundung
    von Betrag und Zinsforderungen während der Dauer der Überschuldung sowie der Rücktritt hinter alle anderen Gesellschaftsgläubiger im Konkurs oder in der Nachlassliquidation.'
  quelle: ser-2022__anh-h-s142-2
  zitat: ist ein zweiseitiges Rechtsgeschäft, das zwischen einem Gläubiger und einem Schuldner über eine bestehende Forderung abgeschlossen wird
- text: 'Anerkannte Anforderungen (HWP ER): Das Gesetz definiert den Rangrücktritt nicht näher. Allgemein anerkannt ist, dass nur ein Rangrücktritt genügt, mit dem der Gläubiger unbedingt
    und unwiderruflich zwei Dinge erklärt: den Rücktritt im Rang für den Insolvenz- oder Liquidationsfall und die Stundung von Kapitalforderung und Zinsen. Das gilt mindestens so lange,
    wie ungedeckte Gläubigerforderungen bestehen. Rechtlich handelt es sich um einen Vertrag zugunsten Dritter (Art. 112 OR).'
  quelle: hwp-er-2026__rz-0403-s121
  zitat: und zwar mindestens solange, als ungedeckte Forderungen der Gläubiger bestehen. Es handelt sich um einen Vertrag zugunsten Dritter
- text: 'Grundsatz zur Wirkung: Der Rangrücktritt dispensiert lediglich von der Überschuldungsanzeige an das Gericht. Er beseitigt die Überschuldung nicht und ist keine Sanierungsmassnahme
    nach Art. 725a Abs. 1 OR; ebenso Q&A Kapitalverlust, Antwort 5a (qa-kapitalverlust-2023__1-2-t3: «Ein Rangrücktritt an sich beseitigt den Kapitalverlust nicht und stellt auch keine
    Sanierungsmassnahme nach Art. 725a OR dar.»); für die Überschuldung gleichlautend Q&A Antwort 14a (qa-kapitalverlust-2023__2-2-2-t5: «Ein Rangrücktritt an sich beseitigt die Überschuldung
    nicht und stellt auch keine Sanierungsmassnahme nach Art. 725a OR dar.»; ebenso PS-CH 290 A21, sa-ch-2026__ps-ch-290-s0385-1). Nach Antwort 14c macht die Revisionsstelle im Bericht
    auf die Überschuldung aufmerksam und bringt je nach Beurteilung (14b) einen Hinweis an. Die übrigen Pflichten des VR nach Art. 725a und 725b OR bleiben grundsätzlich bestehen (hwp-er-2026__rz-0422-s125),
    jene nach Art. 725a OR, solange ein Kapitalverlust vorliegt (hwp-er-2026__rz-0437-s128). Ausnahme (Q&A Antwort 5b bzw. 14b): Im Einzelfall kann die Erlangung von Rangrücktritten
    eine hinreichende Massnahme darstellen; das beurteilt die Revisionsstelle, also der WP.'
  quelle: hwp-er-2026__rz-0405-s122
  zitat: Er beseitigt weder die Überschuldung noch stellt er eine Sanierungsmassnahme im Sinne von Art. 725a Abs. 1 OR dar.
- text: 'Abgrenzung zum Forderungsverzicht: Beim Forderungsverzicht geht die Forderung unter und lebt nicht wieder auf. Anders als der Rangrücktritt bewirkt er eine echte Sanierung der
    Bilanz, nicht aber unbedingt des Unternehmens. Gestattet sind der Verzicht auf eine im Rang zurückgestellte Forderung und ihre Umwandlung in Eigenkapital (Kapitalerhöhung mit Liberierung
    durch Verrechnung bzw. Zuschuss in die Kapitalreserve); beides lässt die Rangrücktrittsvereinbarung dahinfallen (hwp-er-2026__rz-0416-s124).'
  quelle: hwp-er-2026__rz-0408-s123
  zitat: Im Gegensatz zum Rangrücktritt bewirkt der Forderungsverzicht eine echte Sanierung der Bilanz, hingegen nicht unbedingt die Sanierung des Unternehmens.
- text: 'Form (HWP ER): Der Rangrücktritt ist zweiseitig auszugestalten, denn auch die Gesellschaft verpflichtet sich, die Forderung nicht zu tilgen. Obwohl das Gesetz keine Form vorschreibt,
    ist er aus Beweisgründen schriftlich abzufassen. Die Revisionsstelle kann nur einen schriftlichen Rangrücktritt beurteilen.'
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
- text: 'Umfang Zinsen: Die Zinsen müssen zwingend dem Rangrücktritt unterliegen, und dies muss ausdrücklich vereinbart sein. Das Textbeispiel «Rangrücktrittsvereinbarung» von EXPERTsuisse
    ist entsprechend formuliert.'
  quelle: hwp-er-2026__rz-0412-s123
  zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
- text: 'Unwiderruflichkeit und Dauer (HWP ER): Der Rangrücktritt ist als Vertrag zugunsten Dritter unwiderruflich auszugestalten. Er darf an keine Bedingung geknüpft sein, die einer
    Befristung oder einer Kündigung vor nachhaltiger Beseitigung der Überschuldung gleichkommt, und muss zeitlich unbefristet abgeschlossen werden (hwp-er-2026__rz-0415-s123-t1). Empfehlung
    («sollte», rz-0415-t1): eine ausdrückliche Aufhebungsklausel. Danach darf der Rangrücktritt erst aufgehoben werden, wenn er durch einen anderen, in Höhe und Ausgestaltung genügenden
    Rangrücktritt ersetzt wird oder ein nach SA-CH geprüfter (Zwischen-)Abschluss zeigt, dass unter Berücksichtigung aller im Rang zurückgestellten Forderungen sämtliche Verbindlichkeiten
    durch Aktiven gedeckt sind.'
  quelle: hwp-er-2026__rz-0414-s123
  zitat: Er darf an keine Bedingungen geknüpft sein, die einer zeitlichen Beschränkung oder einer Kündigung vor einer nachhaltigen Beseitigung der Überschuldung gleichzusetzen sind.
- text: 'Stundung und Tilgungsverbot: Bis zur Aufhebung ist keine Tilgung der Forderung inklusive Zinsen gestattet, auch nicht durch Verrechnung. Einzige Ausnahme ist die Verrechnung
    zugunsten der Gesellschaft im Konkurs des Rangrücktrittsgläubigers. Eine Neuerung des Darlehensvertrags ist auszuschliessen. Bei Fremdwährungsforderungen empfiehlt sich ein Sicherheitspolster
    für das Kursrisiko; die Überwachung obliegt dem VR.'
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
- text: 'Ausmass: Der Rangrücktritt muss mindestens das Ausmass der Überschuldung abdecken. Ist die Fortführung nicht gefährdet und bestehen gute Voraussetzungen, die Überschuldung zu
    überwinden, sollte ein Rangrücktritt genügen, der auf die Deckungslücke zu Fortführungswerten ausgerichtet ist. Ähnlich HWP BuR Rz 719 (hwp-bur-2023__rz-0719-s307), das aber «oder»
    statt «und» sowie «genügt» statt «sollte … genügen» formuliert. Massgebend ist das ranghöhere HWP ER: Fortführung nicht gefährdet UND gute Voraussetzungen. Steht die Fortführungsfähigkeit
    und -willigkeit infrage, ist ein höherer Betrag angezeigt; bei konkreter Gefahr der Fortführungsunfähigkeit muss er die Deckungslücke zu Liquidationswerten abdecken (hwp-bur-2023__rz-0720-s307).
    Ist die Gesellschaft nur zu Fortführungswerten, nicht aber zu Veräusserungswerten überschuldet, ist kein Rangrücktritt nötig, um die Benachrichtigung des Gerichts zu vermeiden; die
    Sanierungspflicht des VR bleibt (hwp-er-2026__rz-0406-s122, Abb. 11).'
  quelle: hwp-er-2026__rz-0420-s125
  zitat: Gemäss Art. 725b Abs. 4 OR hat der Rangrücktritt mindestens im Ausmass der Überschuldung zu erfolgen.
- text: 'Sicherheitspolster: Sind weitere Verluste absehbar, ist ein angemessenes Polster für die erwarteten Verluste einzurechnen. Es deckt die nächsten 12 Monate nach Unterzeichnung,
    mindestens aber die Zeit bis zum nächsten Prüfungszeitpunkt. Die Höhe hängt vom erwarteten Geschäftsgang ab und ist im Einzelfall zu beurteilen.'
  quelle: hwp-er-2026__rz-0421-s125
  zitat: Es ist ein angemessenes Sicherheitspolster zur Deckung der in den nächsten 12 Monaten nach Unterzeichnung des Rangrücktritts, mindestens aber bis zum nächsten Prüfungszeitpunkt
    noch zu erwartenden Verluste
- text: 'Prüfung der Zwischenabschlüsse (Art. 725b Abs. 2 OR): Sie ist eine besondere gesetzlich verlangte Prüfung, weder ordentliche noch eingeschränkte Revision (hwp-er-2026__rz-0400-s119).
    Massstab sind die SA-CH, insbesondere PS-CH 290, mit hinreichender Sicherheit, auch wenn die Revisionsstelle die Jahresrechnung eingeschränkt prüft. Das Ablaufschema in SER Anhang
    H verweist ebenfalls darauf: «Prüfung durch Revisionsstelle nach separaten Berufsregeln (PS-CH 290)» (ser-2022__anh-h-s145-1). Dabei sind die qualitativen Anforderungen nach PS-CH
    290 A22 an den Rangrücktritt zu beachten, u.a. eine betraglich bestimmte Forderung («kein flexibler Rangrücktritt») und dass er für den Gläubiger nicht offensichtlich finanziell
    untragbar ist (sa-ch-2026__ps-ch-290-s0385-1).'
  quelle: hwp-er-2026__rz-0401-s119
  zitat: Massstab für die Prüfung der Zwischenabschlüsse bilden die SA- CH , insbesondere PS - CH 290.
- text: 'Prüfungshandlungen (SER Anhang D j, verzinsliche Verbindlichkeiten): Die Befragung zu Rangrücktritten gehört zu den weiter gehenden Prüfungshandlungen, ebenso als Detailprüfung
    die Einsicht in Rangrücktrittsvereinbarungen (ser-2022__anh-d-s085-2). Diese Handlungen kommen vor allem bei angenommenen wesentlichen Fehlaussagen oder erhöhtem inhärentem Risiko
    zum Zug.'
  quelle: ser-2022__anh-d-s085-1
  zitat: Weiter gehende Befragungen und analytische Prüfungshandlungen • Befragung zu Rangrücktritten
- text: 'Prüfungsziel und Bonität: Nach SER Anhang H können Zweifel an der Gültigkeit des Rangrücktritts bestehen, wenn der Darlehensgeber einen allfälligen Ausfall finanziell nicht
    verkraften kann. Nach HWP ER muss sich die Revisionsstelle überzeugen, dass der Rangrücktritt qualitativ und quantitativ ausreicht, einschliesslich der Bonität des Gläubigers, damit
    der Rangrücktritt in dessen Konkurs nicht paulianisch angefochten wird (hwp-er-2026__rz-0432-s127). Der Gläubiger muss den Verlust der gesamten Forderung ohne Risiko der eigenen
    Überschuldung tragen können (hwp-er-2026__rz-0404-s122).'
  quelle: ser-2022__anh-h-s143-1
  zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
- text: 'Folge eines ungültigen oder ungenügenden Rangrücktritts: Fehlen andere unmittelbar bilanzwirksame Sanierungsmassnahmen, lässt sich die Benachrichtigung des Gerichts nicht vermeiden.
    Unterlässt der VR sie, mahnt ihn die Revisionsstelle mit Fristansetzung und Hinweis auf ihre subsidiäre Anzeigepflicht. Bei offensichtlicher Überschuldung benachrichtigt sie das
    Gericht ersatzweise selbst (Art. 729c OR). Gleicher Ablauf im Schema SER Anhang H: «Bestehen ausreichende und den formellen und materiellen Erfordernissen entsprechende Rangrücktritte?»
    (ser-2022__anh-h-s145-1).'
  quelle: hwp-er-2026__rz-0433-s127
  zitat: Ergibt die Prüfung, dass der Rangrücktritt ungültig ist oder in ungenügendem Ausmass erklärt worden ist und keine anderen unmittelbar bilanzwirksame Sanierungsmassnahmen ergriffen
    wurden
- text: 'Folgejahre: Stellt die Revisionsstelle fest, dass rangrücktrittsbelastete Forderungen trotz andauernder Überschuldung ganz oder teilweise getilgt wurden (z.B. durch Verrechnung),
    ist ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen. Ausserdem ist die Auswirkung auf die Prüfungsaussage zu beurteilen. Deckt der reduzierte Rangrücktritt die Überschuldung
    nicht mehr, lebt die Anzeigepflicht von VR und subsidiär Revisionsstelle wieder auf. Kein Verstoss sind Verzicht und Umwandlung in Eigenkapital (hwp-er-2026__rz-0416-s124).'
  quelle: hwp-er-2026__rz-0434-s128
  zitat: dass dem Rangrücktritt unterstellte Forderungen trotz andauernder Überschuldung ganz oder teilweise getilgt wurden (beispielweise durch Verrechnung), so sind ein Hinweis im
    Sinne von Art. 729c OR in Erwägung zu ziehen
- text: 'Ersatz und Reduktion: Ein Rangrücktritt kann ersetzt, seine Höhe aber grundsätzlich nicht reduziert werden. Eine Reduktion ist nur möglich, wenn alle drei Bedingungen erfüllt
    sind: (a) Ein nach SA-CH geprüfter (Zwischen-)Abschluss zeigt eine mindestens entsprechende Reduktion der Überschuldung. (b) Der VR legt schriftlich und begründet dar, dass in den
    nächsten zwölf Monaten keine weiteren Verluste absehbar sind. (c) Andere Rangrücktrittsgläubiger werden nicht benachteiligt, es sei denn, sie hätten der Reduktion zugestimmt. Die
    Revisionsstelle prüft dann erneut sämtliche Anforderungen an einen gültigen Rangrücktritt.'
  quelle: hwp-er-2026__rz-0425-s126
  zitat: Ein Rangrücktritt kann demnach ersetzt werden. Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
- text: 'Darstellung: Der Rangrücktritt erlaubt beim Schuldner kein Ausbuchen der Verbindlichkeit; er wandelt kein Fremd- in Eigenkapital um, die Forderung bleibt bestehen, ist aber
    gestundet und damit einredebelastet (hwp-er-2026__rz-0423-s125-t1). Er ist für die Beurteilung durch Dritte wesentlich und deshalb in der Jahresrechnung auszuweisen und zu erläutern,
    in der Bilanz oder im Anhang (Art. 959a Abs. 3 bzw. Art. 959c Abs. 1 Ziff. 2 OR). Nach HWP BuR ist das Passivdarlehen mit Rangrücktritt gesondert auszuweisen und die Nachrangigkeit
    durch die Bezeichnung erkennbar zu machen; solche Darlehen entsprechen wirtschaftlichem Eigenkapital (hwp-bur-2023__rz-0494-s257), bilanziell bleiben sie aber Fremdkapital (kein
    Ausbuchen, keine Umwandlung). Beim Gläubiger ist die Forderung angemessen wertzuberichtigen.'
  quelle: hwp-er-2026__rz-0430-s127
  zitat: muss deshalb in der Jahresrechnung des Schuldners (in der Bilanz oder im Anhang) ausgewiesen und erläutert werden
- text: 'Kapitalverlust und Opting-out: Bei Opting-out bleibt die Pflicht zur eingeschränkten Revision durch einen zugelassenen Revisor bestehen (Art. 725a Abs. 2 OR), auch wenn ausreichende
    Rangrücktritte vorliegen, die den Kapitalverlust decken. Sie gilt, solange ein Kapitalverlust vorliegt; Ausnahme ist ein Gesuch um Nachlassstundung.'
  quelle: hwp-er-2026__rz-0454-s133
  zitat: Diese Revisionspflicht gilt auch, wenn ausreichende Rangrücktritte vorliegen, die den Kapitalverlust decken.
- text: 'Berichterstattung: SER 8.3.2.2 nennt das Bestehen einer Rangrücktrittsvereinbarung bei Überschuldung als Beispiel für einen Zusatz mit weiteren Informationen; Zusätze müssen
    wesentlich sein und dürfen keine Geheimhaltungspflichten verletzen. Nach HWP ER sind Kapitalverlust und Überschuldung als solche keine Gesetzesverletzungen (erst die Untätigkeit
    des VR), das Bestehen einer Rangrücktrittsvereinbarung ist aber als Zusatz in den Bericht aufzunehmen (hwp-er-2026__rz-0447-s130). Musterformulierung SER Anhang F Beispiel 9 «Zusatz
    wegen Überschuldung bei Vorliegen einer Rangrücktrittsvereinbarung» (ser-2022__anh-f-s126-1): «Da Gläubiger der Gesellschaft der [2] im Betrag von … CHF Rangrücktritt erklärt haben,
    hat der Verwaltungsrat von der Benachrichtigung des Richters abgesehen.» (ser-2022__anh-f-s126-2). Geltender Wortlaut mit «Gericht»: HWP ER Abb. 52 (hwp-er-2026__rz-0430-s282-t1).
    Ob und wie ein Zusatz angebracht wird, entscheidet der WP.'
  quelle: ser-2022__8-3-2-t3
  zitat: Beispiele für Fälle, in denen der Abschlussprüfer einen Zusatz mit weiteren Informationen für notwendig halten kann
agent:
- 'Grenze: Die Rangrücktritt-Schritte im revio-Katalog sind WP-Schritte (nur_mensch): N1-105 (Befragung zu Rangrücktritten; Beurteilung der Bonität des Rangrücktrittgebers), L1-105 und
  L1-304 (katalog-revio4__c003-48, katalog-revio4__c003-40). N1-401 (Einsicht in Rangrücktrittsvereinbarungen) nur auf Anweisung. Ob der Agent WP-Schritte überhaupt vorbereitet, ist
  bei consis offen (konzept-ki-revisionsagent-2026__c012-1, c015-2). Ohne Anweisung: Schritt nicht bearbeiten, im Rapport Status «nicht bearbeitet – WP-Schritt» bzw. «nicht bearbeitet
  – nur auf Anweisung»; Unterlagen als Beilage zur Notiz bereitstellen (Vereinbarung aus M-Files mit ID/Version, Kontoblatt, Zwischenabschluss, Berechnung) und Hinweise für den WP notieren.
  Ob der Rangrücktritt gültig und ausreichend ist, beurteilt immer der WP.'
- 'Checkliste Vereinbarung – nur auf ausdrückliche Anweisung des WP (L1-304 / N1-401 bzw. N1-105). Ohne Anweisung: Vereinbarung mit M-Files-ID und Version beilegen, Status «nicht bearbeitet
  – WP-Schritt», Hinweise für den WP notieren. Punkte bei Anweisung: schriftlich und von Gläubiger und Gesellschaft unterzeichnet (zweiseitig, hwp-er-2026__rz-0410-s123); Betrag bestimmt
  (PS-CH 290 A22, sa-ch-2026__ps-ch-290-s0385-1); Zinsen ausdrücklich eingeschlossen (rz-0412); unwiderruflich und unbefristet, ohne Befristungs- oder Kündigungsbedingung (rz-0414, rz-0415-t1),
  Aufhebungsklausel empfohlen (rz-0415-t1); Tilgungs- und Verrechnungsverbot, keine Neuerung (rz-0415-t2); Vorabbefriedigungsrecht während der Dauer ausgeschlossen, keine nachträgliche
  Sicherstellung (rz-0418); bei mehreren Rangrücktritten Rangfolge (ohne Vereinbarung gleichgestellt, rz-0417); bei Abtretung geht der Rangrücktritt mit über (rz-0413); bei ausländischem
  Gläubiger Rechtswahl CH empfohlen (rz-0419); Währung (rz-0415-t2). Keine Vereinbarung in M-Files → Notiz «Pendenz». Abweichende Klauseln → Hinweis an den WP (Notiz «Wesentliche Feststellungen»);
  ob der Rangrücktritt gültig ist, beurteilt der WP.'
- 'Altverträge und Zinsklausel: Die Übergangsfrist für die Anpassung lief bis 31.12.2024 (qa-kapitalverlust-2023__5-t1). Danach ist das neue Recht auf alle Verträge anwendbar (qa-kapitalverlust-2023__5-t2),
  für Abschlüsse nach dem 31.12.2024 somit auch auf ältere Rangrücktritte. Zinsen müssen ausdrücklich eingeschlossen sein (hwp-er-2026__rz-0412-s123). Ob Altverträge ohne Zinsklausel
  genügen, ist nicht gefestigt («gibt es derzeit keine gefestigte Meinung», 5-t2). Datum und Zinsklausel feststellen; fehlt die Klausel → Notiz «Wesentliche Feststellungen» (möglicherweise
  ungenügender Rangrücktritt, Folge siehe rz-0433) und «Schlussbesprechung»; Beurteilung durch den WP. Die Q&A-Empfehlung, bestehende Rangrücktritte «zeitnah» zu ergänzen, ist Stand
  2023 (historisch).'
- 'Ausmass rechnen, nie im Kopf: Rangrücktrittsbetrag gegen die Überschuldung gemäss geprüftem Zwischenabschluss (ZA) mit `kapitalverlust --aktienkapital … --aktiven … --verbindlichkeiten
  … --rangruecktritt …` rechnen: Variante 1 mit Werten aus dem ZA zu Fortführungswerten, Variante 2 aus dem ZA zu Veräusserungswerten. Sicherheitspolster separat mit `rechne`. Stufen:
  Fortführung nicht gefährdet und gute Voraussetzungen zur Überwindung → Deckungslücke zu Fortführungswerten (hwp-er-2026__rz-0420-s125); Fortführungsfähigkeit und -willigkeit infrage
  → Betrag über diese Lücke hinaus; konkrete Gefahr der Fortführungsunfähigkeit → Deckungslücke zu Liquidationswerten (hwp-bur-2023__rz-0720-s307). Sicherheitspolster für 12 Monate,
  mindestens bis zum nächsten Prüfungszeitpunkt (rz-0421). Nur zu Fortführungswerten, nicht zu Veräusserungswerten überschuldet → kein Rangrücktritt nötig, um die Benachrichtigung des
  Gerichts zu vermeiden (hwp-er-2026__rz-0406-s122, Abb. 11). Welches Ausmass massgebend ist, wählt der WP; Varianten nur rechnen und zeigen. Unterdeckung → «Wesentliche Feststellungen».'
- 'Saldo-Kontrolle: Kontoblatt der rangrücktrittsbelasteten Verbindlichkeit vom Vorjahr bis zum Stichtag auf Abgänge prüfen (Rückzahlung, Verrechnung, Zinszahlung). Abgänge durch Forderungsverzicht
  oder Umwandlung in Eigenkapital (Kapitalerhöhung durch Verrechnung, Zuschuss in die Kapitalreserve) sind zulässig (hwp-er-2026__rz-0416-s124): Beleg prüfen und nicht als Tilgung werten.
  Übrige Abgänge trotz Überschuldung → Notizen «Wesentliche Feststellungen» und «Schlussbesprechung» (rz-0434). Begründet der VR eine Rückzahlung mit reduzierter Überschuldung, Unterlagen
  (geprüfter Zwischenabschluss, Spezialbericht) für den WP beilegen; nach Camponovo kann der Hinweis dann ev. entfallen (camponovo-2026-hinweispflichten__s124-1, Seminarunterlage). Ob
  ein Hinweis angebracht wird, entscheidet der WP. Camponovo-Formulierungsvorschlag nur als Seminarvorschlag nennen: «Dadurch könnte Art. 725b Abs. 4 OR verletzt worden sein.» (s124-1).
  Besteht ein Covid-19-Kredit, ist die Rückzahlung von Darlehen von Gesellschaftern oder Nahestehenden während der Solidarbürgschaft zusätzlich verboten (covid-sbueg__art-2-t1; Ausnahme
  lit. b für vorbestehende Pflichten gegenüber CH-Gruppengesellschaften nur kennzeichnen) → Notiz «Wesentliche Feststellungen» mit Verweis covid-sbueg__art-23.'
- 'Keine Ersatzinstrumente: Garantien, «Deckungsgarantien» und Patronatserklärungen ersetzen keinen Rangrücktritt (hwp-er-2026__rz-0406-s122). Camponovo schildert einen Gerichtsfall,
  in dem die Revisionsstelle haftete, weil die «Rangrücktritte» nur Garantien waren (camponovo-2026-hinweispflichten__s130-1). Liegt ein solches Dokument statt eines Rangrücktritts vor
  → «Wesentliche Feststellungen».'
- 'Darlehen nach dem Bilanzstichtag unter Rangrücktritt: zulässig nur mit tatsächlichem Zahlungsfluss, im Anhang unter Ereignissen nach dem Bilanzstichtag auszuweisen. Eine rückwirkende
  Einbuchung ist unzulässig (hwp-bur-2023__rz-0721-s307). Buchungsvorschläge nur als Notiz, ohne Verbuchung.'
- 'Darstellung prüfen (N1-320/L1-320/T1): gesonderter Ausweis in Bilanz oder Anhang mit erkennbarer Nachrangigkeit vorhanden (hwp-bur-2023__rz-0494-s257)? Keine Umgliederung ins Eigenkapital
  vorschlagen. Fehlt → «Wesentliche Feststellungen».'
- 'Kapitalverlust (P1-313, A1): Die Verbindlichkeit mit Rangrücktritt bleibt in der Berechnung nach Art. 725a/725b OR Fremdkapital. Nicht als Fremdkapital gelten Kredite, die gestützt
  auf Art. 3 Covid-19-SBüV verbürgt wurden (covid-sbueg__art-24; gilt bis 31.12.2032, covid-sbueg__art-31), sowie Darlehen und Kredite nach Art. 21 HFMV 20 (hwp-er-2026__rz-0373-s113;
  gültig bis 31.12.2031). Kredite nach Art. 4 Covid-19-SBüV nennt Art. 24 nicht (das Gesetz unterscheidet sie in covid-sbueg__art-3); sie gelten nach dem Wortlaut als Fremdkapital. Die
  Einordnung aus dem Kreditvertrag dem WP vorlegen. Rechnen: Kredit nach Art. 3 Covid-19-SBüV mit `kapitalverlust … --covid-kredit <Betrag>` (übrige Eingaben wie bilanziert); HFMV-Darlehen
  vor dem Aufruf aus --verbindlichkeiten herausnehmen; Herleitung im Textfeld zeigen. Die Pflichten des VR nach Art. 725a OR bleiben bestehen, solange ein Kapitalverlust vorliegt (hwp-er-2026__rz-0437-s128).
  Ob Rangrücktritte im Einzelfall ausnahmsweise eine hinreichende Massnahme sind (Q&A Antwort 5b, qa-kapitalverlust-2023__1-2-t3), beurteilt der WP. Fehlen weitere Sanierungsmassnahmen
  → Notiz «Schlussbesprechung».'
- 'Zwischenabschluss: Ein Rangrücktritt befreit nicht von der Erstellung und Prüfung eines Zwischenabschlusses (hwp-er-2026__rz-0423-s125-t2, qa-kapitalverlust-2023__2-2-2-t3). Ein Verzicht
  in Folgejahren ist nur nach individueller Risikobeurteilung möglich (hwp-er-2026__rz-0389-s117); darüber entscheidet der WP. Fehlt der Zwischenabschluss: Notiz «Pendenz» (Unterlage
  anfordern). Liegt keine vom WP bestätigte Begründung für einen Verzicht in einem Folgejahr vor, zusätzlich Notiz «Wesentliche Feststellungen»: möglicher zwingender Hinweis wegen Untätigkeit
  des VR («Zwischenabschlüsse nicht erstellt», HWP ER Abb. 49, hwp-er-2026__rz-0423-s280); Vorschlag SER Anhang F Bsp. 13 = Muster 41 (ser-2022__anh-f-s131-2). Bei offensichtlicher Überschuldung
  den WP sofort informieren (gebotene Eile, or__art-725b-t2).'
- 'Prüfung der Zwischenabschlüsse (Art. 725b Abs. 2 OR; Massstab PS-CH 290, siehe Fachaussage «Prüfung der Zwischenabschlüsse»): Für die Prüfung der Jahresrechnung nach SER gelten SER
  Anhang H und HWP ER. Die Prüfung des Zwischenabschlusses ist ein WP-Auftrag; der Agent arbeitet nur auf Anweisung zu und unterzeichnet nie. Widerspruch «flexibler Rangrücktritt» (PS-CH
  290 A22 vs. camponovo-2026-hinweispflichten__s158-1) dem WP vorlegen.'
- 'Aufhebung/Reduktion: Der Bericht zur eingeschränkten Revision genügt nicht. Nötig ist ein separater Prüfungsbericht nach SA-CH (hwp-er-2026__rz-0426-s126, hwp-bur-2023__rz-0716-s305,
  hwp-bur-2023__rz-0717-s305-t1). Die Aufhebung muss schriftlich erfolgen (hwp-er-2026__rz-0427-s127). Bei einer Reduktion alle drei Bedingungen (a)–(c) nach hwp-er-2026__rz-0425-s126
  als Unterlagen bereitstellen (inkl. Zustimmung anderer Rangrücktrittsgläubiger). Der Agent bereitet einen solchen Bericht nur auf Anweisung vor und unterzeichnet nie.'
- 'Grenze bei ungenügendem Rangrücktritt: Mahnung und Anzeige (Fachaussage «Folge eines ungültigen oder ungenügenden Rangrücktritts», hwp-er-2026__rz-0433-s127) sind WP-Handlungen. Der
  Agent erfasst nur Notizen («Wesentliche Feststellungen», «Schlussbesprechung»), entwirft keine Mahnung ohne Anweisung und meldet nie an das Gericht; E-Mails nur als Entwurf bzw. an
  die WP-Adresse (konzept-ki-revisionsagent-2026__c009-2). Bei der Prüfung nach Art. 725a Abs. 2 OR (Opting-out) hat der zugelassene Revisor keine Pflicht zur Benachrichtigung des Gerichts
  (hwp-er-2026__rz-0458-s134).'
- 'Berichtswortlaut (Zusatz bei Rangrücktritt): Entwurf nach HWP ER Abb. 52 (hwp-er-2026__rz-0430-s282-t1; geltender Wortlaut «Gericht», Art. 725b Abs. 3 OR, or__art-725b-t1). Abb. 52
  beginnt mit «Ferner» (folgt auf einen anderen Zusatz); steht der Zusatz allein, Satzanfang wie SER Bsp. 9 «Wir machen darauf aufmerksam». SER Bsp. 9 = Muster 35 (ser-2022__anh-f-s126-2)
  enthält noch «des Richters» und «Art. 725b OR» → Abweichung für den WP markieren, Notiz «Schlussbesprechung». Muster 35 setzt voraus, dass der VR seine Pflichten nach Art. 725b eingehalten
  hat (muster-hwp-er-2026__c044-1); ohne Zwischenabschluss Bsp. 13/Muster 41. Den Wortlaut wählt der WP. Der Bericht an den VR beim Zwischenabschluss erwähnt die Überschuldung unabhängig
  von Rangrücktritten (hwp-er-2026__rz-0477-s292). Bei der Prüfung nach Art. 725a Abs. 2 OR (Opting-out) lautet der Zusatz des zugelassenen Revisors «Überschuldung (unabhängig, ob Rangrücktritte
  vorhanden)» (hwp-er-2026__rz-0459-s134). Nach SER 8.3.2.2 muss ein Zusatz wesentlich sein (ser-2022__8-3-2-t3). Das Vorgehen bei Zusatz bzw. Rangrücktritt im GVB-Bericht ist bei consis
  noch offen (konzept-ki-revisionsagent-2026__c015-2).'
- 'Musterformulierungen: Die EXPERTsuisse-Muster für Rangrücktrittsvereinbarung, Reduktion und Aufhebung sind nur als Verweis im Wiki (muster-hwp-er-2026__c068-1, c069-1, c070-1); ihr
  Volltext fehlt. Bekannt aus HWP ER: Im Muster verzichtet der Gläubiger im Insolvenzfall, nicht aber im freiwilligen Liquidationsfall, auf seine im Wert verminderte oder wertlose Forderung
  (hwp-er-2026__rz-0409-s123). Hintergrund ist die Rechtsprechung des Bundesgerichts; die Problematik ist durch Art. 757 Abs. 4 OR entschärft (rz-0411). Zinsen sind ausdrücklich eingeschlossen
  (rz-0412), das Vorabbefriedigungsrecht ist ausgeschlossen (rz-0418). Das Muster eignet sich für ordentliche und eingeschränkte Revision sowie ohne Revisionsstelle (rz-0428). Klauseln
  nicht aus dem Gedächtnis ergänzen; bei Bedarf Pendenz «Muster beschaffen».'
- 'Gläubigerseite (H2/H3): Forderungen mit Rangrücktritt sind beim Gläubiger angemessen wertzuberichtigen, mit ganzheitlicher Betrachtung des Engagements (hwp-bur-2023__rz-0729-s309,
  hwp-bur-2023__rz-0272-s218). Steuerliche Praxis (ESTV, KS 32a): Wird ein Verlustvortrag lediglich durch bilanzielle Massnahmen wie einen Rangrücktritt beseitigt oder reduziert, liegt
  keine steuerlich relevante Sanierung vor (estv-ks-32a-2025__27-t1: «Keine steuerlich relevante Sanierung liegt vor, wenn ein Verlustvortrag lediglich durch bilanzielle Massnahmen»).
  Weitere ESTV-Praxis zum Rangrücktritt ist in den Wiki-Quellen nicht vorhanden; verdecktes Eigenkapital (KS 6a) separat in N1-304.'
