agent:
- 'Grenze: Der Agent entscheidet nie über Art der Prüfungsaussage, Hinweise oder Zusätze, setzt kein Berichtsdatum und unterzeichnet nicht (OR 729b Abs. 2; SER Ziff. 8.5; konzept-ki-revisionsagent-2026__c011-2).
  Er liefert Sachverhalt, Betrag (Rechenmodul `rechne`), Fundstelle (M-Files-ID) und einen Formulierungsvorschlag aus SER Anhang F bzw. Muster HWP ER als Notiz «Wesentliche Feststellungen»
  oder «Schlussbesprechung»; Entscheid beim WP.'
- 'GVB-Entwurf (Prozess 5): Vorjahres-Deckblatt und -Berichtstext in M-Files kopieren, Jahreszahlen, Stichtage und Jahresergebnis aktualisieren und gegen revio 7.1 Berichtsstrategie
  und 7.5 Berichtskritik prüfen (konzept-ki-revisionsagent-2026__c011-2: «Vorjahres-Deckblatt und -Berichtstext kopieren, Jahreszahlen, Stichtage und Jahresergebnis aktualisieren, gegen
  7.1 Berichtsstrategie und 7.5 Berichtskritik prüfen»); Vorjahresoriginale bleiben unverändert. Entwurf gegen die Pflichtelemente nach SER Ziff. 8.1 abgleichen (ser-2022__8-1: «Der
  Revisionsbericht muss folgende Elemente enthalten»): Umfangsabschnitt mit Abgrenzung zur ordentlichen Revision (8.2), Prüfungsaussage, Zulassungs- und Unabhängigkeitsbestätigung inkl.
  allfälligem Mitwirken (8.4), Name, Vorname und Zulassungsart des leitenden Revisors (8.5); Unterschrift und Datum leer lassen. Weicht die Lage vom Vorjahr ab (neuer oder weggefallener
  Kapitalverlust, Überschuldung, Rangrücktritt, Fortführungsunsicherheit, Modifizierung, Mitwirken bei der Buchführung), Vorjahrestext nicht unverändert übernehmen, sondern Pendenz bzw.
  Notiz «Schlussbesprechung» erfassen. Signaturblock aus dem Vorjahr nicht ungeprüft übernehmen: genau ein leitender Revisor mit Name, Vorname, Zulassungsart und Bezeichnung «Leitender
  Revisor» (hwp-er-2026__rz-0452-s288); zweite Unterschriftszeile nur bei Kollektivunterschrift zu zweien (rab-faq-revisionsunternehmen__c002-2). Wechsel des leitenden Revisors oder
  unklare Zeichnungsberechtigung → Pendenz an den WP. Unterschriften und Datum bleiben leer.'
- 'Vorlage je Situation (Vorschlag als Notiz «Schlussbesprechung», Entscheid WP; Wortlaut mit `zeige <chunk-id>` öffnen): keine Feststellung → SER Anhang F Bsp. 1 (ser-2022__anh-f-s118-2)
  · Mitwirken bei der Buchführung → Bsp. 15 = Muster 44 (muster-hwp-er-2026__c055-1) · Kapitalverlust, VR hatte vom Zeitablauf her noch keine Gelegenheit → Zusatz nach HWP ER Abb. 53,
  1. Absatz (hwp-er-2026__rz-0430-s282-t2), nicht Bsp. 11/Muster 37 (alter Wortlaut) · Kapitalverlust und VR untätig → Muster 40 (muster-hwp-er-2026__c050-2) · buchmässige Überschuldung,
  ZA zu Veräusserungswerten gedeckt → Muster 38 (muster-hwp-er-2026__c047-2) · Überschuldung mit genügendem Rangrücktritt → Zusatz nach HWP ER Abb. 52 (Eintrag «Rangrücktritt» unten
  bzw. `thema rangrücktritt`); SER Bsp. 9 = Muster 35 (muster-hwp-er-2026__c044-1) hat noch den alten Wortlaut · Überschuldung, Hauptaktionär sagt Sanierung innert 90 Tagen zu → Muster
