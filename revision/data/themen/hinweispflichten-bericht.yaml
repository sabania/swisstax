- 'Rangrücktritt: Er beseitigt die Überschuldung nicht und ist keine Sanierungsmassnahme nach OR 725a (qa-kapitalverlust-2023__2-2-2-t5: «Ein Rangrücktritt an sich beseitigt die Überschuldung
  nicht und stellt auch keine Sanierungsmassnahme nach Art. 725a OR dar.»). Ob er im Einzelfall als hinreichende Massnahme genügt, beurteilt der WP. Zusatz: Entwurf nach HWP ER Abb.
