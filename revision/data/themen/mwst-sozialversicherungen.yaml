kurz: 'MWST und Personalaufwand stützen sich in der SER auf SER Anhang D n) und q). Empfohlen: MWST-Forderungen/-Verbindlichkeiten mit den Abrechnungen abstimmen, Vorhandensein der Umsatzabstimmung
  (Art. 128 MWSTV), Lohnbuchhaltung gegen Hauptbuch, Relation Saläre/Sozialleistungen. Weiter gehend (meist WP): Nachvollzug der Umsatzabstimmung, Befragungen zu Sonderfällen und Steuerrevisionen,
  AHV-/BVG-Abstimmung. PH 20 ist eine nicht verpflichtende Arbeitshilfe; Drittbestätigungen gehören nicht zur SER.'
aussagen:
- text: 'Grundlage MWST-Risiko (PH 20 Tz 1): Die MWST betrifft praktisch alle Unternehmen. Je nach Art und Umfang der Tätigkeit kann sie den Abschluss erheblich beeinflussen. Das Risiko
    wesentlicher falscher Darstellungen betrifft den Ausweis der Steuerforderungen/-verbindlichkeiten und die Rückstellungen für MWST-Risiken.'
  quelle: ph-20-mwst-2016__c002-1
  zitat: kann die Auswirkung der MWST auf den Abschluss erheblich sein, womit ein Risiko wesentlicher falscher Darstellungen im Abschluss besteht
- text: 'Selbstveranlagung (PH 20 Tz 7): Wegen des Selbstveranlagungsprinzips (Art. 71 und 72 MWSTG) trägt allein das steuerpflichtige Unternehmen die Verantwortung für die korrekte
    Umsetzung, spätestens im Zeitpunkt der Finalisierung; bei den direkten Steuern veranlagt dagegen die Behörde. Die Frist endet laut PH 20 mit der Deklarationsfrist der Abrechnungsperiode,
    in die der 180. Tag nach dem Geschäftsabschluss fällt ^[ph-20-mwst-2016__c003-1] «Die Frist endet mit der ordentlichen Deklarationsfrist der Abrechnungsperiode, in welche der 180.
    Tag nach dem letzten Geschäftsabschluss fällt.»; ebenso das geltende Gesetz ^[mwstg__art-72] «spätestens in der Abrechnung über jene Abrechnungsperiode korrigieren, in die der 180.
    Tag seit Ende des betreffenden Geschäftsjahres fällt». Für die Verhinderung von MWST-Verstössen ist der Abschlussprüfer nicht verantwortlich (PH 20 Tz 22) ^[ph-20-mwst-2016__c005-2]
    «Der Abschlussprüfer ist nicht dafür verantwortlich, dass in einem Unternehmen Verstösse gegen das MWSTG».'
  quelle: ph-20-mwst-2016__c003-1
  zitat: liegt die volle und alleinige Verantwortung für die korrekte Umsetzung der relevanten Rechtsvorschriften beim steuerpflichtigen Unternehmen selbst
- text: 'Umsatz- und Vorsteuerabstimmung (HWP BuR Rz 365): Jede mehrwertsteuerpflichtige Person nimmt mindestens einmal jährlich eine Umsatz- und Vorsteuerabstimmung (Art. 128 MWSTV)
    und fristgerecht die Finalisierung (Art. 72 Abs. 1 MWSTG) vor; das Rechnungswesen ist darauf auszurichten. Nach dem Verordnungstext kann die ESTV beide Abstimmungen verlangen ^[mwstv__art-128-t1]
    «Die ESTV kann von der steuerpflichtigen Person die Einreichung namentlich folgender Unterlagen verlangen». Die Umsatzabstimmung zeigt, ^[mwstv__art-128-t1] «wie die Deklaration
    für die Steuerperiode unter Berücksichtigung der verschiedenen Steuersätze beziehungsweise der Saldo- oder Pauschalsteuersätze mit dem Jahresabschluss in Übereinstimmung gebracht
    wird»; die Vorsteuerabstimmung zeigt die Übereinstimmung der Vorsteuerkonti mit den deklarierten Vorsteuern (Art. 128 Abs. 3 MWSTV, ^[mwstv__art-128-t2]). Die Vorsteuerabstimmung
    gibt es nur bei der effektiven Methode (Art. 128 Abs. 1 Bst. e MWSTV) ^[mwstv__art-128-t1] «bei steuerpflichtigen Personen, die nach der effektiven Methode abrechnen, eine Vorsteuerabstimmung
    nach Absatz 3». Bei Saldosteuersatz-Abrechnern nur die Umsatzabstimmung beschaffen bzw. als Pendenz erfassen (Abs. 2 nennt die Saldosteuersätze ausdrücklich).'
  quelle: hwp-bur-2023__rz-0365-s150
  zitat: mindestens einmal jährlich eine Umsatz- und Vorsteuerabstimmung (Art. 128 MWSTV) und eine Finalisierung innert der vorgesehenen Frist (Art. 72 Abs. 1 MWSTG) vorzunehmen
- text: 'Bilanzausweis (HWP BuR Rz 163): Gegenüber der ESTV besteht aus der MWST-Pflicht eine Forderung oder Verbindlichkeit in Höhe des Saldos der geschuldeten Umsatzsteuern abzüglich
    der Vorsteuern. Weil nur über diesen Saldo abgerechnet wird, ist die Verrechnung hier geboten (Ausnahme vom Saldierungsverbot).'
  quelle: hwp-bur-2023__rz-0163-s193
  zitat: eine Forderung oder Verbindlichkeit, die dem Saldo geschuldeter Umsatzsteuern abzüglich erbrachter Vorsteuern entspricht
- text: 'Buchungslogik Vorsteuer (HWP BuR Rz 358, effektive Methode): Nicht oder nur teilweise abzugsberechtigte Vorsteuern (Vorsteuerkorrekturen, Vorsteuerkürzung) werden am Ende der
    Abrechnungsperiode in den Aufwand oder, bei Investitionen, auf ein Anlagekonto zurückübertragen. Bezugsteuer auf Dienstleistungen aus dem Ausland (Rz 363): Ohne fortlaufende Erfassung
    ist die Steuerschuld per Ende der Abrechnungsperiode zu buchen ^[hwp-bur-2023__rz-0363-s150] «muss jeweils per Ende der Abrechnungsperiode die buchhalterische Erfassung der sich
    aus den Bezügen der Periode ergebenden Steuerschuld erfolgen».'
  quelle: hwp-bur-2023__rz-0358-s148
  zitat: Bei nicht oder nur teilweise abzugsberechtigten Vorsteuern (Vorsteuerkorrekturen und Vorsteuerkürzung) ist am Ende der Abrechnungsperiode eine Rückübertragung in den Aufwand
- text: 'Saldosteuersatzmethode (Art. 37 MWSTG): zulässig bis 5''024''000 Fr. steuerbaren Umsatz und 108''000 Fr. Steuer pro Jahr (Abs. 1). Steuer = Total der Entgelte inkl. Steuer ×
    von der ESTV bewilligter SSS (Abs. 2) ^[mwstg__art-37] «einschliesslich Steuer, mit dem von der ESTV bewilligten Saldosteuersatz ermittelt». Satztabelle im Anhang der VO ESTV über
    die Saldosteuersätze ^[estv-vo-sss__art-1], in Kraft seit 1.1.2025 ^[estv-vo-sss__art-3]. Ertragsarten mit unterschiedlichen SSS gehören auf separate Ertragskonten (HWP BuR Rz 361)
    ^[hwp-bur-2023__rz-0361-s149] «auf jeweils separaten Ertragskonten zu erfassen». Zahlen: `wert saldosteuersatz` · Steuersätze effektive Methode: `wert mwst satz`.'
  quelle: mwstg__art-37
  zitat: Wer als steuerpflichtige Person jährlich nicht mehr als 5 024 000 Franken Umsatz aus steuerbaren Leistungen erzielt und im gleichen Zeitraum nicht mehr als 108 000 Franken Steuern
- text: 'Risikobeurteilung (PH 20 Tz 24/25): In der Planungsphase beurteilt der Abschlussprüfer die inhärenten MWST-Risiken nach Branche, Tätigkeit, Komplexität und allfälliger MWST-Gruppenzugehörigkeit;
    für Organisationsfragen kann Anhang 2 Teil A als Hilfsmittel dienen ^[ph-20-mwst-2016__c006-1] «Hierbei kann Anhang 2, Teil A des vorliegenden Prüfungshinweises als Hilfsmittel dienen.».
    Im revio-Katalog entspricht dem M2-305 (Beurteilung der allgemeinen MWST-Risiken anhand der Spezialitätenliste a)–h), Rolle Agent «vorbereiten»).'
  quelle: ph-20-mwst-2016__c006-1
  zitat: beurteilt der Abschlussprüfer die inhärenten MWST-Risiken unter Berücksichtigung von Branche, Tätigkeit und Komplexität des Unternehmens
- text: 'SER Anhang D n), empfohlene Detailprüfungen: Die MWST-Forderungen und -Verbindlichkeiten werden mit den Abrechnungen abgestimmt (revio M2-301, EP). Zudem wird festgestellt,
    ob eine MWST-Umsatzabstimmung vorhanden ist ^[ser-2022__anh-d-s089-1] «Vorhandensein der MWST-Umsatzabstimmung» (dazu die Befragung M2-101, EP). Zum empfohlenen Umfang gehört nur
    das Vorhandensein, der inhaltliche Nachvollzug ist weiter gehend. Die Beispiele sind den Umständen des Mandats anzupassen ^[ser-2022__anh-d-s089-1] «Den konkreten Umständen des Mandats
    anzupassen».'
  quelle: ser-2022__anh-d-s089-1
  zitat: Abstimmung der MWST-Forderungen und -Verbindlichkeiten mit den Abrechnungen
- text: 'PH 20 Anhang 2 Teil B (Arbeitshilfe, nicht verpflichtend): B 1 fragt, ob für das der Prüfungsperiode vorangegangene Geschäftsjahr eine plausible Umsatzabstimmung nach Art. 128
    Abs. 2 MWSTV vorliegt; das Unternehmen erstellt sie innert 180 Tagen und begründet Abweichungen. B 2 schlägt für die Analytik der Deklarationen den Vorjahresvergleich, die Umsatzaufteilung
    und bei wesentlichen ausgenommenen Umsätzen die Vorsteuerkorrektur vor ^[ph-20-mwst-2016__c011-5] «Umsatzaufteilung (steuerbar / steuerbefreit / ausgenommen / Nichtentgelte / Steuersätze)
    / Vorsteuerkorrektur bei wesentlichen ausgenommenen Umsätzen».'
  quelle: ph-20-mwst-2016__c011-5
  zitat: Die Umsatzabstimmung ist vom Unternehmen innert 180 Tagen zu erstellen, und allfällige Abweichungen sind zu begründen.
- text: 'SER Anhang D n), weiter gehende Detailprüfungen (vor allem bei angenommener wesentlicher Fehlaussage oder erhöhtem inhärentem Risiko): Die MWST-Umsatzabstimmung wird nachvollzogen
    ^[ser-2022__anh-d-s089-1] «Nachvollzug der MWST-Umsatzabstimmung», und die Abrechnungen werden mit den Konten und/oder der Umsatzabstimmung abgestimmt (revio M2-302/M2-303, WP, «nur_mensch»).'
  quelle: ser-2022__anh-d-s089-1
  zitat: Abstimmung der MWST-Abrechnungen mit den Konti und/oder der Umsatzabstimmung
- text: 'SER Anhang D n), weiter gehende Befragungen: Erfragt werden die Abrechnungsart (vereinnahmtes oder vereinbartes Entgelt) und Sonderfälle wie ausgenommene Umsätze oder Saldosätze,
    ob Privatanteile und Dienstleistungsbezüge aus dem Ausland mit MWST abgerechnet sind sowie branchenspezifische Eigenheiten und Vereinbarungen mit der Steuerverwaltung (revio M2-102
    bis M2-104, WP, «nur_mensch»).'
  quelle: ser-2022__anh-d-s090-1
  zitat: Befragung der Unternehmensleitung, ob der Privatanteil von Geschäftsaufwendungen und Dienstleistungsbezug aus dem Ausland mit MWST abgerechnet ist
- text: 'Kontrolle durch die Steuerbehörde (SER Anhang D n), weiter gehende Befragung, gilt für MWST und direkte Steuern): Erfragt wird, ob eine Steuerrevision, Nachforschungen oder
    Rückfragen stattgefunden haben oder Rechtsmittel hängig sind; danach folgt der Einblick in die Korrespondenz ^[ser-2022__anh-d-s089-2] «Einblick in entsprechende Korrespondenz zur
    Feststellung allfälliger Nachforderungen und Risiken, für welche Rückstellungen zu bilden sind». In revio sind das die WP-Schritte S1-102/S1-104. PH 20 Anhang 2 A 9/A 9c fragt nach
    MWST-Revisionen der letzten drei Jahre und hängigen Verfahren ^[ph-20-mwst-2016__c011-4] «Ist die Gesellschaft in ein hängiges MWST-Verfahren involviert?».'
  quelle: ser-2022__anh-d-s089-2
  zitat: Befragung, ob eine Steuerrevision, andere Nachforschungen oder Rückfragen seitens der Steuerbehörden stattgefunden haben oder Einsprachen und Rekurse hängig sind.
- text: 'Ausweis (PH 20 Anhang 2 B 3): Geprüft wird, ob die MWST in der Jahresrechnung korrekt und vollständig ausgewiesen ist: Steuerforderungen/-verbindlichkeiten, Rückstellungen für
    MWST-Risiken und Offenlegung einer aktuellen oder früheren MWST-Gruppenzugehörigkeit im Anhang. Den Nachweis erbringt das Unternehmen. MWST-Gruppen brauchen zudem ein Vorsteuerclearing
    ^[hwp-bur-2023__rz-0371-s151] «MWST-Gruppen erfordern daher ein Vorsteuerclearing, ansonsten drohen verdeckte Gewinnausschüttungen oder Kapitaleinlagen.».'
  quelle: ph-20-mwst-2016__c011-5
  zitat: Offenlegung allfällige aktuelle oder frühere Zugehörigkeit / zu einer MWST-Gruppe im Anhang
- text: 'SER Anhang D q) Personalaufwand, empfohlene Befragungen: ob nach dem Bilanzstichtag Leistungs- oder Erfolgsprämien für das vergangene Jahr beschlossen und korrekt erfasst wurden
    (revio R1-101, EP) sowie Besprechung wesentlicher Abweichungen ^[ser-2022__anh-d-s093-1] «Besprechung wesentlicher Abweichungen einzelner Kontensalden gegenüber früheren Perioden
    oder gegenüber den Erwartungen» (R1-102, EP).'
  quelle: ser-2022__anh-d-s093-1
  zitat: Befragung, ob nach dem Bilanzstichtag Leistungs- oder Erfolgsprämien für das vergangene Jahr beschlossen wurden
- text: 'SER Anhang D q), empfohlene Analytik und Detailprüfung: Die Relation zwischen Salären und Sozialleistungen wird mit dem Vorjahr verglichen (revio R1-201, EP; vertieft R1-203),
    und die Totale der Lohnbuchhaltung werden mit dem Hauptbuch abgestimmt ^[ser-2022__anh-d-s093-1] «Abstimmen der Totale der Lohnbuchhaltung mit den Hauptbuchkonten» (R1-301, EP).
    HWP ER Rz 109 nennt den Erwartungsvergleich als gut anwendbar für Sozialversicherungsbeiträge im Verhältnis zur Lohnsumme ^[hwp-er-2026__rz-0109-s199] «Vergleich mit den Erwartungen
    des Abschlussprüfers → in bestimmten Prüfungsgebieten gut anwendbar (z.B. Sozialversicherungsbeiträge im Verhältnis zur Lohnsumme».'
  quelle: ser-2022__anh-d-s093-1
  zitat: Vergleich der Relation zwischen Salären und Sozialleistungen mit dem Vorjahr
- text: 'Beitragssätze Sozialversicherungen (BSV, amtlich, Tabelle «in % des Einkommens, ab 1.1.2025»): AHV/IV/EO je 5,3 % für Arbeitnehmende und Arbeitgeber; der Arbeitgeber übernimmt
    die Hälfte ^[bsv-beitraege-ueberblick__c004-1] «wobei er die Hälfte übernimmt». ALV je 1,1 %, nur Angestellte, Grundlage AHV-Lohn, maximal versicherter Verdienst 148''200 Fr. pro
    Jahr ^[bsv-beitraege-ueberblick__c005-1] «| ALV1,2 | 1,1% | 1,1% |» «Maximal versicherter Verdienst = 148 200 Franken pro Jahr»; die ALV-Lohnsumme kann deshalb kleiner sein als die
    AHV-Lohnsumme (Ableitung). BV: Der Arbeitgeber zahlt mindestens die Hälfte; die Sätze hängen von der Vorsorgeeinrichtung ab ^[bsv-beitraege-ueberblick__c004-1] «Der Arbeitgeber muss
    mindestens die Hälfte des Beitrags seiner Arbeitnehmenden bezahlen.». BV, FamZ, BUV und NBUV: Das BSV nennt nur Statistikwerte der Vorjahre, keine Sätze für das laufende Jahr ^[bsv-beitraege-ueberblick__c004-2]
    «es werden lediglich statistische Angaben der Vorjahre verwendet». GJ 2026: unverändert laut Treuhand-Almanach (Sekundärquelle) ^[treuhand-almanach-2026__s075-1] «Die Beitragssätze
    sind gegenüber dem Vorjahr unverändert.». BVG-Grenzbeträge: `wert bvg`.'
  quelle: bsv-beitraege-ueberblick__c005-1
  zitat: '| Total AHV/IV/EO | 5,3% | 5,3% |'
- text: 'SER Anhang D q), weiter gehende Detailprüfungen: Abstimmung des Aufwands mit Jahresaufstellungen und -abrechnungen wie AHV und BVG (revio R1-303, WP; als Sonstige-Schritt R1-410,
    nur auf Anweisung), Einsicht in Berichte anderer Prüfer wie AHV, SUVA oder MWST (R1-304), Durchsicht auf ungewöhnliche Posten mit Personalbezug (R1-305) und Durchsicht der Aufwandskonten
    in neuer Rechnung ^[ser-2022__anh-d-s093-2] «Durchsicht der Aufwandskonten in neuer Rechnung auf auffällige Beträge mit Personalbezug, die das Vorjahr betreffen» (R1-306, WP).'
  quelle: ser-2022__anh-d-s093-1
  zitat: Abstimmen des ausgewiesenen Aufwands mit geeigneten Jahresaufstellungen und -abrechnungen (AHV-, BVG-Abrechnungen usw.)
- text: 'Massgebender AHV-Lohn (Sekundärquelle Treuhand-Almanach 2026, S. 83): Für AHV/IV/EO gilt der Bruttolohn ohne Familien- und Kinderzulagen. Bei einer (weiter gehenden, R1-303/R1-410)
    Abstimmung des Lohnaufwands mit der AHV-Abrechnung sind die Zulagen deshalb eine mögliche Differenz.'
  quelle: treuhand-almanach-2026__s083-1
  zitat: Bruttolohn ohne Familien- und Kinderzulagen
- text: 'Quellensteuer (steuerliches Verfahren, Sekundärquelle Treuhand-Almanach 2026, S. 50): Die Quellensteuer liefert nicht die steuerpflichtige Person ab, sondern der Schuldner der
    steuerbaren Leistung, oft der Arbeitgeber. Der revio-Katalog nennt die QSt bei den Schlussabrechnungen (R1-302, WP). Lücke: In SER und HWP ER gibt es im Wiki keine Fundstelle zur
    Quellensteuer; HWP BuR erwähnt sie nur auf ausländischen Erträgen ^[hwp-bur-2023__rz-0801-s331] «nicht rückforderbare Quellensteuern auf ausländischen Erträgen».'
  quelle: treuhand-almanach-2026__s050-1
  zitat: Die Quellensteuern werden nicht vom Steuerpflichtigen selbst abgeliefert, sondern vom Schuldner der steuerbaren Leistung (oft der Arbeitgeber).
- text: 'Ferien- und Überzeitguthaben (Q&A Rechnungslegungsrecht 2.2, gestützt auf Art. 959 Abs. 5 OR): Am Bilanzstichtag nicht bezogene Ansprüche sind handelsrechtlich abzugrenzen,
    bemessen je Mitarbeiter (Stunden mal Stundensatz inkl. Sozialleistungen); Pauschalbeträge sind nicht angemessen. Ausgewiesen wird die Abgrenzung als passive Rechnungsabgrenzung (Art.
    958b OR); ^[qa-or-rechnungslegung-2026__2-2-t2] «In der Praxis ist auch ein Ausweis unter den Rückstellungen anzutreffen», ohne Einfluss auf das Periodenergebnis. Ob die Steuerbehörden
    sie anerkennen (BGer 9C_192/2024), ist eine steuerliche Frage. SER-Anker: Anhang D l), empfohlen ^[ser-2022__anh-d-s087-1] «Abstimmung einer Detailaufstellung mit der Jahresrechnung»
    (revio M3-301, EP).'
  quelle: qa-or-rechnungslegung-2026__2-2-t1
  zitat: Am Bilanzstichtag noch nicht bezogene Ferien- oder Überzeitansprüche sind handelsrechtlich also zwingend abzugrenzen.
- text: 'Grenze der SER (SER Anhang D q)): Das Prüfen arbeits- und verwaltungsrechtlicher Vorgaben, Anwaltsbestätigungen und Drittbestätigungen von AHV, SUVA, BVG/PK gehören nicht zur
    eingeschränkten Revision. HWP ER Rz 134 schliesst ausdrücklich auch MWST- und Steueramts-Saldobestätigungen aus ^[hwp-er-2026__rz-0134-s203] «Saldobestätigungen von MWST, AHV, SUVA
    , BVG/PK und Steuerämtern». Im revio-Katalog betrifft R1-402 (nur auf Anweisung) nur die Sozialversicherungen (AHV, UVG, KTG, BVG); für eine MWST-Saldobestätigung gibt es keinen
    Katalogschritt.'
  quelle: ser-2022__anh-d-s093-2
  zitat: Einholen von Drittbestätigungen wie AHV, SUVA, BVG/PK usw.
- text: 'Gesetzesverstösse und Bericht (SER 1.6, 8.3.2.1): Die SER sucht nicht nach Gesetzesverstössen (Mustertext Auftragsbestätigung, SER Anhang C ^[ser-2022__anh-c-s057-1] «(z. B.
    betreffend direkte Steuern, Mehrwertsteuer, Sozialversicherungen, Umweltschutz)»). Wird ein Verstoss mit direktem Bezug zur Jahresrechnung festgestellt, ^[ser-2022__1-6-t2] «so ist
    ein Hinweis im Revisionsbericht in Erwägung zu ziehen». Angebracht wird er, wenn der Verstoss wesentlich ist, direkt mit der Jahresrechnung zusammenhängt und ^[ser-2022__8-3-2-t1]
    «aufgrund der durchgeführten Prüfungshandlungen (z. B. aus der Befragung) festgestellt wurden». Solche Hinweise ^[ser-2022__8-3-2-t1] «haben keinen Einfluss auf die Prüfungsaussage
    im Revisionsbericht».'
  quelle: ser-2022__8-3-2-t1
  zitat: sind in der eingeschränkten Revision im Revisionsbericht ggf. dann anzubringen, wenn sie wesentlich sind, einen direkten Bezug zur Jahresrechnung aufweisen
agent:
- 'Rangfolge und Auswahl: In der SER sind SER Anhang D n) (MWST/direkte Steuern) und q) (Personalaufwand) der Ausgangspunkt. Es sind Beispiele, die den Umständen des Mandats anzupassen
  sind (ser-2022__anh-d-s089-1 «Den konkreten Umständen des Mandats anzupassen»), und es sind nicht zwingend alle durchzuführen (hwp-er-2026__rz-0130-s203 «Dabei sind nicht zwingend
  alle im SER empfohlenen Prüfungshandlungen durchzuführen»). Die Auswahl trifft der WP. PH 20 ist für die Abschlussprüfung mit hinreichender Sicherheit geschrieben (Tz 3, ph-20-mwst-2016__c002-1;
  Stand 2016, gilt für Zeiträume ab 15.12.2013, ph-20-mwst-2016__c001-1). Sein Anhang 2 ist eine nicht verpflichtende Arbeitshilfe, ausdrücklich keine Checkliste (ph-20-mwst-2016__c011-1
  «Die nachstehende Arbeitshilfe ist nicht als Programm oder Checkliste für den Abschlussprüfer gedacht.»). Er dient nur als ergänzende Orientierung zu Risiko- und Organisationsfragen.'
- 'M2 ohne Anweisung: M2-301 (EP) und M2-305 vorbereiten (die einzigen M2-Schritte mit Rolle «vorbereiten»), M2-101 (EP) höchstens «teilweise» (Befragung). Unterlagen aus M-Files: MWST-Abrechnungen
  der Periode, Umsatz- und Vorsteuerabstimmung (Art. 128 MWSTV) des Vorjahres und, falls vorhanden, des Prüfjahrs, Kontoauszüge Umsatzsteuer/Vorsteuer/Abrechnungskonto, ESTV-Korrespondenz.
  M2-301 (Bilanzsaldo = Umsatzsteuer abzüglich Vorsteuer, hwp-bur-2023__rz-0163-s193), nie im Kopf rechnen: 1. Abrechnungsperiode aus den MWST-Abrechnungen bzw. der ESTV-Korrespondenz
  (M-Files) feststellen (Art. 35 MWSTG ^[mwstg__art-35]): vierteljährlich; mit Saldosteuersatz halbjährlich; auf Antrag monatlich oder, bei Umsatz bis 5''005''000 Fr., jährlich. 2. Soll-Saldo
  per Stichtag bestimmen. Das ist die Steuer der noch nicht bezahlten Periode(n), denn Abrechnung und Zahlung erfolgen innert 60 Tagen nach Periodenende (Art. 71 und 86 MWSTG ^[mwstg__art-71]
  ^[mwstg__art-86-t1]). Bei jährlicher Abrechnung: Jahressteuer gemäss Abrechnung minus bezahlte Raten (Art. 86a Abs. 7 MWSTG ^[mwstg__art-86a]). 3. Soll-Saldo und Bilanzsaldo mit `rechne`
  vergleichen. Differenz über der Nichtaufgriffsgrenze: Notiz «Wesentliche Feststellungen»; darunter nur protokollieren.'
- 'Umsatzabstimmung: In der SER genügt die Feststellung, dass sie vorhanden ist (ser-2022__anh-d-s089-1). Fehlt sie oder sind Abweichungen nicht begründet: Notiz «Pendenz» mit Konto,
  Periode und Betrag. Liegt die Abstimmung des Prüfjahrs noch nicht vor, ist das innerhalb der 180-Tage-Frist kein Fehler, aber zu dokumentieren (PH 20 B 1, ph-20-mwst-2016__c011-5;
  Art. 72 Abs. 1 MWSTG, mwstg__art-72). Differenzen über der Nichtaufgriffsgrenze als Notiz «Wesentliche Feststellungen» mit begründetem Buchungsvorschlag, ohne Verbuchung; darunter
  nur protokollieren (konzept-ki-revisionsagent-2026__c014-1 «Nicht-Aufgriffsgrenze (5 %): Differenzen darunter werden nur protokolliert.»).'
- 'Katalogschritt M2-302 verweist auf «RZ 958 MWStG». Dieser Verweis ist im Wiki nicht belegt. Für die Umsatzabstimmung gilt Art. 128 MWSTV (mwstv__art-128-t1/-t2; PH 20 B 1; HWP BuR
  Rz 365). M2-302 (Nachvollzug) und M2-303 (Konti/Quartale; Katalog: Quartal, bei anderer Abrechnungsperiode sinngemäss je Periodenende) sind WP-Schritte: ohne Anweisung Status «nicht
  bearbeitet – WP-Schritt», Hinweise an den WP sind zulässig.'
- 'Befragungsschritte getrennt behandeln: (a) M2-101, R1-101 und R1-102 (EP, Rolle «teilweise»): schriftliche Antworten aus revio 10.11 auswerten, sonst die Frage als Pendenz erfassen;
  Status höchstens «teilweise bearbeitet» (konzept-ki-revisionsagent-2026__c012-1 «Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung), sonst
  Frage als Pendenz»). (b) M2-102 bis M2-104 (WP, «nur_mensch»; in der SER weiter gehende Befragungen, ser-2022__anh-d-s090-1): ohne ausdrückliche Anweisung nicht bearbeiten, Status
  «nicht bearbeitet – WP-Schritt»; Hinweise an den WP sind zulässig (konzept-ki-revisionsagent-2026__c012-1 «Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt»).'
- 'M2-305 (Rolle «vorbereiten», ohne EP/WP-Kennzeichnung): die Spezialitätenliste a)–h) (Umsätze nicht zum Normalsatz, Export/steuerbefreite Umsätze, Verrechnungsgeschäfte und Umsätze
  mit Nahestehenden, ausgenommene Umsätze, Import von Dienstleistungen, Meldeverfahren, Immobilien) anhand der vorhandenen Unterlagen durchgehen und im Textfeld dokumentieren. Massstab
  ist PH 20 Tz 24 (ph-20-mwst-2016__c006-1). Hinweise auf erhöhtes Risiko als Notiz an den WP. Ob weiter gehende Prüfungshandlungen nötig sind, entscheidet der WP.'
- 'Kontrolle ESTV und Risiken: Die Befragung zu Steuerrevision, Nachforschungen und hängigen Verfahren ist in der SER weiter gehend (ser-2022__anh-d-s089-2) und in revio der WP-Schritt
  S1-102/S1-104. Ohne Anweisung sichtet der Agent nur vorhandene Dokumente (Einschätzungsmitteilungen, Kontrollberichte, Korrespondenz; PH 20 A 9/A 9c, ph-20-mwst-2016__c011-4) und erfasst
  eine Notiz an den WP. Den Rückstellungsbedarf beurteilt der WP. HWP BuR Rz 547 (hwp-bur-2023__rz-0547-s269) gilt nur für direkte Steuern juristischer Personen (hwp-bur-2023__rz-0544-s268)
  und ist für MWST-Nachbelastungen nur eine Analogie. Für die Wesentlichkeit zählen auch noch nicht rechtskräftig festgesetzte Perioden (PH 20 Tz 28, Stand 2016, ph-20-mwst-2016__c006-2).
  Die Festsetzungsverjährung beträgt nach geltendem MWSTG fünf Jahre nach Ablauf der Steuerperiode, absolut zehn Jahre (Art. 42 Abs. 1 und 6 MWSTG, mwstg__art-42).'
- 'MWST-Gruppe (aktuell oder früher) für T1 (Anhang) festhalten (PH 20 B 3, ph-20-mwst-2016__c011-5). Fehlt bei Gruppenmitgliedern ein Vorsteuerclearing, Notiz an den WP (hwp-bur-2023__rz-0371-s151).
  Bei Saldosteuersatz-Abrechnern enthalten die Ertragskonten neben dem Nettoertrag den im Saldosteuersatz berücksichtigten Vorsteueranspruch (HWP BuR Rz 361, hwp-bur-2023__rz-0361-s149);
  eine Erfassung als Aufwandminderung ist alternativ denkbar. Das bei der Analytik berücksichtigen. Bei SSS (M2-305): den bewilligten Satz aus der ESTV-Bewilligung (M-Files) festhalten,
  nie selbst aus der VO-Tabelle wählen. Fehlt die Bewilligung: Pendenz. Übersteigen Umsatz oder Steuer die Grenze nach Art. 37 Abs. 1 MWSTG (`wert saldosteuersatz`): Notiz an den WP.
  Die Steuer je Ertragskonto nur auf Anweisung nachrechnen (Nachvollzug, M2-302). Basis ist das Entgelt inkl. Steuer ^[mwstg__art-37], nicht der gebuchte Ertrag (Rz 361 ^[hwp-bur-2023__rz-0361-s149]).'
- 'Vorsteuer im Detail nur auf Anweisung: M2-401 bis M2-407 (Vorsteuerplausibilisierung, Formerfordernisse, Stichprobe Vorsteuern, MWST-Codes, Import von Dienstleistungen, Einfuhrsteuer,
  ausgenommene Umsätze/Vorsteuerkürzung) und M2-408 haben die Rolle «auf_anweisung»; ohne Anweisung Status «nicht bearbeitet – nur auf Anweisung». M2-304 (Eigenverbrauch) ist ein WP-Schritt.
  Fällt bei M2-301/M2-305 eine fehlende Bezugsteuer- oder Vorsteuerkorrekturbuchung auf (HWP BuR Rz 358/363), Notiz an den WP.'
- 'R1 ohne Anweisung: Die Quote Sozialleistungen/Saläre mit dem Vorjahr vergleichen (R1-201/R1-203; ser-2022__anh-d-s093-1 «Vergleich der Relation zwischen Salären und Sozialleistungen
  mit dem Vorjahr») und das Jahrestotal des Lohnjournals mit den Hauptbuchkonten abstimmen (R1-301), beides im Rechenmodul. Zeigt R1-201 eine auffällige Abweichung: Notiz an den WP.
  Die Abstimmung der AHV-Jahresabrechnung (Lohnsumme) mit dem Lohnaufwand ist in der SER weiter gehend (ser-2022__anh-d-s093-1) und nur auf Anweisung des WP vorzubereiten (R1-303 WP,
  R1-410 «auf_anweisung»). Erwarteten AG-Anteil AHV/IV/EO und ALV mit `rechne` aus den BSV-Sätzen bilden (5,3 %; ALV 1,1 % bis 148''200 Fr. je Person; ^[bsv-beitraege-ueberblick__c005-1]).
  Das ergibt eine Untergrenze. FAK (FamZ), BV, UVG und KTG nur aus Unternehmensunterlagen, nie aus der BSV-Statistik (7,9 %/10,5 % sind Durchschnitte). Weicht die Quote auffällig ab:
  Notiz an den WP.'
- 'Schlussabrechnungen der Sozialversicherungen (AHV, UVG, KTG, BVG, QSt) und ihre Abgrenzung (R1-302, M1-302 b) sind WP-Schritte: ohne Anweisung nicht vorbereiten, Status «nicht bearbeitet
  – WP-Schritt». Den Bilanzbestand der Kontokorrente Sozialversicherungen/QSt stimmt der Agent nur im EP-Schritt M1-301 («Abstimmen Bilanzbestand mit Einzelnachweisen», Rolle «vorbereiten»)
  ab, den MWST-Bestand in M2-301. Ob abgegrenzt werden muss, beurteilt der WP; Hinweise erfasst der Agent als Notiz.'
- 'Quellensteuer: Im Wiki gibt es keine Fundstelle in SER oder HWP ER, nur den Treuhand-Almanach (steuerliches Verfahren, Sekundärquelle) und den revio-Katalog R1-302 (WP). Das als Lücke
  offenlegen. Im Rahmen von M1-301 das QSt-Verbindlichkeitskonto mit den vorhandenen QSt-Abrechnungen abstimmen; Fehlendes als Pendenz erfassen.'
- 'Ferien-/Überzeitguthaben: Standard ist M3-301 (EP, «vorbereiten») gestützt auf SER Anhang D l) (ser-2022__anh-d-s087-1 «Abstimmung einer Detailaufstellung mit der Jahresrechnung»).
  Eine Liste je Mitarbeiter verlangen (Stunden mal Stundensatz inkl. Sozialleistungen) und mit dem Bilanzposten abstimmen; Pauschalen sind nicht angemessen (qa-or-rechnungslegung-2026__2-2-t1).
  R1-409 nur auf Anweisung. Fehlt die Abgrenzung oder ist sie pauschal bemessen: über der Nichtaufgriffsgrenze Notiz «Wesentliche Feststellungen» mit Buchungsvorschlag, darunter nur
  protokollieren. Eine steuerliche Aufrechnung ist in der Steuerabgrenzung zu berücksichtigen (qa-or-rechnungslegung-2026__2-2-t2). BGer 9C_192/2024 als steuerliche Praxis bezeichnen.
  Über den Ausweis (passive RA oder Rückstellung) entscheidet der WP.'
- Verbindlichkeiten gegenüber Vorsorgeeinrichtungen sind im Anhang offenzulegen (Art. 959c Abs. 2 Ziff. 7 OR, or__art-959c-t2) und für T1 festzuhalten. Die Einhaltung der Bestimmungen
  zu Arbeitgeberschulden bei PVE (M1-408) nur auf Anweisung prüfen.
- 'Fortführung: Kann das Unternehmen Löhne und Sozialversicherungsbeiträge nicht begleichen, ist das ein Indikator gegen die Fortführung (HWP ER Rz 191, hwp-er-2026__rz-0191-s224). Notiz
  «Schlussbesprechung» bzw. «Wesentliche Feststellungen» an den WP erfassen, nicht selbst beurteilen.'
- 'Saldobestätigungen: Die SER schliesst sie aus (HWP ER Rz 134, hwp-er-2026__rz-0134-s203, inkl. MWST). R1-402 (nur Sozialversicherungen) nur auf ausdrückliche Anweisung des WP und
  dann als «über die SER hinausgehend» kennzeichnen. Für die MWST gibt es keinen revio-Schritt. Bestätigungen fordert der Agent nie selbst bei Dritten an (revio-Zuordnung: Bestätigungen
  einholen ist eine externe Handlung; E-Mail nie an Kunden, konzept-ki-revisionsagent-2026__c009-2); eingegangene Bestätigungen darf er als Beleg lesen.'
- 'Vollständigkeitserklärung und Bericht: Die SER-Vorlage enthält die Einhaltung der Vorschriften zu MWST und Sozialversicherungen (ser-2022__anh-e-s103-2); SER Anhang E [13] bietet
  zusätzlich einen optionalen MWST-Zusatz (ser-2022__anh-e-s113-1 «Ggf. Ergänzung der Vollständigkeitserklärung im Zusammenhang mit der MWST»), ebenso PH 20 Anhang 1. Ob er aufgenommen
  wird, entscheidet der WP. Erkennt der Agent einen möglichen Gesetzesverstoss, meldet er ihn mit den SER-Kriterien (wesentlich, direkter Bezug zur Jahresrechnung, aus den Prüfungshandlungen
  festgestellt; ser-2022__8-3-2-t1) als Notiz. Über einen Hinweis im Bericht entscheidet der WP; kein Visum, kein Abschluss.'
