kurz: 'Bei der eingeschränkten Revision gibt es nach OR nur eine direkte Anzeigepflicht: Benachrichtigung des Gerichts bei offensichtlicher Überschuldung, wenn der VR untätig bleibt
  (Art. 729c OR); Art. 728c OR gilt für die ordentliche Revision. Spezialgesetz: Stellt die Revisionsstelle bei einem Covid-19-Kredit mit Solidarbürgschaft eine verbotene Mittelverwendung
  fest (Art. 2 Abs. 2–4 Covid-19-SBüG), setzt sie eine Frist; wird der Zustand nicht hergestellt, informiert sie die GV und, wenn der VR auch dann nicht unverzüglich handelt, die Bürgschaftsorganisation
  (Art. 23 Covid-19-SBüG) – nur der WP. Hinweise im Bericht sind zwingend bei Untätigkeit des VR nach Art. 725a/725b OR, sonst nur bei wesentlichen, festgestellten Verstössen mit direktem
  Bezug zur Jahresrechnung (z.B. Art. 680, 678, 699, 717 OR). Im Übrigen gilt die Schweigepflicht (Art. 730b OR).'
aussagen:
- text: 'Art. 728c OR (Anzeigepflichten): Stellt die Revisionsstelle Verstösse gegen Gesetz, Statuten oder Organisationsreglement fest, meldet sie dies schriftlich dem VR (Abs. 1); die
    GV informiert sie bei wesentlichen Verstössen oder wenn der VR auf die schriftliche Meldung keine angemessenen Massnahmen ergreift (Abs. 2); Abs. 3 regelt die Gerichtsbenachrichtigung
    bei offensichtlicher Überschuldung. Diese Melde- und Informationspflichten nach Abs. 1 und 2 gelten nur bei der ordentlichen Revision (siehe nächste Aussage).'
  quelle: or__art-728c
  zitat: Stellt die Revisionsstelle Verstösse gegen das Gesetz, die Statuten oder das Organisationsreglement fest, so meldet sie dies schriftlich dem Verwaltungsrat.
- text: 'Eingeschränkte Revision: Nach OR hat die Revisionsstelle nur eine einzige direkte gesetzliche Anzeigepflicht – Benachrichtigung des Gerichts, wenn die Gesellschaft offensichtlich
    überschuldet ist und der VR die Anzeige unterlässt (Art. 725b i.V.m. Art. 729c OR). Ohne Revisionsstelle trifft diese Pflicht den vom VR für die Prüfung der Zwischenabschlüsse ernannten
    zugelassenen Revisor (Art. 725b Abs. 5 OR). Weitere Anzeigepflichten, z.B. bei Verstössen gegen Gesetz, Statuten oder Organisationsreglement, bestehen bei der SER nicht. Vorbehalt
    Spezialgesetz: Art. 23 Covid-19-SBüG verpflichtet ausdrücklich auch die eingeschränkt prüfende Revisionsstelle (Frist, Information der GV, dann der Bürgschaftsorganisation; siehe
    Aussage «Covid-19-Kredite mit Solidarbürgschaft»).'
  quelle: hwp-er-2026__rz-0422-s279-t1
  zitat: bei der eingeschränkten Revision die Revisionsstelle lediglich eine einzige direkte gesetzliche Anzeigepflicht
- text: 'Covid-19-Kredite mit Solidarbürgschaft (Spezialgesetz, geht vor): Während der Dauer der Solidarbürgschaft sind u. a. ausgeschlossen: Dividenden und Tantiemen sowie die Rückerstattung
    von Kapitaleinlagen; die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschaftern oder Nahestehenden (zulässig bleiben vorbestehende Verpflichtungen gegenüber
    einer Gruppengesellschaft mit Sitz in der Schweiz) (Art. 2 Abs. 2 Bst. a/b, covid-sbueg__art-2-t1); ausserdem Art. 2 Abs. 2 Bst. c/d: Rückführung von Gruppendarlehen mit Kreditmitteln
    und Übertragung von Kreditmitteln an Gruppengesellschaften ohne Sitz in der Schweiz. Die Kreditmittel dürfen nicht zur Umschuldung vorbestehender Kredite verwendet werden (Art. 2
    Abs. 3, covid-sbueg__art-2-t2). Stellt die Revisionsstelle im Rahmen der eingeschränkten oder ordentlichen Revision eine Verletzung von Art. 2 Abs. 2–4 fest, setzt sie eine angemessene
    Frist zur Herstellung des ordnungsgemässen Zustandes; wird er nicht innert Frist hergestellt, muss sie die GV informieren; stellt der VR ihn auch dann nicht unverzüglich her, informiert
    sie die zuständige Bürgschaftsorganisation (Art. 23 Abs. 1 Covid-19-SBüG). Das Gesetz gilt bis 31.12.2032 (Art. 31 Abs. 2, covid-sbueg__art-31). Die Bürgschaft dauert höchstens acht
    Jahre ab Unterzeichnung der Kreditvereinbarung bzw. des Bürgschaftsvertrags; bei Härte kann die Frist auf höchstens zehn Jahre verlängert werden, und die Bürgschaft gilt dann weiter
    (Art. 3 Abs. 1 und 3, covid-sbueg__art-3). Die Pflichten entfallen nach Ablauf der Bürgschaft oder früher bei vollständiger Rückzahlung (Q&A Rechnungslegung Frage 10, qa-or-rechnungslegung-2026__10-t4).'
  quelle: covid-sbueg__art-23
  zitat: im Rahmen der eingeschränkten oder ordentlichen Revision der Jahres- oder Konzernrechnung eine Verletzung einer Vorgabe nach Artikel 2 Absätze 2–4 fest
- text: Erhält die Revisionsstelle klare und stichhaltige Informationen von kompetenter Stelle (VR, Geschäftsleitung) über eine offensichtliche Überschuldung oder stellt sie diese bei
    der Revision fest, muss sie den VR an seine Pflichten erinnern (namentlich Zwischenabschluss zu Fortführungs- und Veräusserungswerten erstellen und zur Prüfung vorlegen). Die Anzeigepflicht
    beschränkt sich auf die Benachrichtigung des Richters, wenn der VR dies trotz offensichtlicher Überschuldung unterlässt (SER Ziff. 9, Details Anhang H).
  quelle: ser-2022__9-t3
  zitat: Die diesbezügliche Anzeigepflicht beschränkt sich auf die Benachrichtigung des Richters, wenn dies der Verwaltungsrat trotz offensichtlicher Überschuldung unterlässt.
- text: 'Keine Suchpflicht: Der Abschlussprüfer muss das Risiko deliktischer Handlungen bei der eingeschränkten Revision nicht in seine Risikobeurteilung einbeziehen, und auch das Gesetz
    verlangt nicht, aktiv nach weiteren Gesetzesverstössen zu suchen. Anders als bei der ordentlichen Revision (Art. 728c OR) besteht keine gesetzliche Anzeigepflicht bei Verstössen
    gegen Gesetz, Statuten oder Organisationsreglement und mangels Prüfungsauftrag auch keine Berichterstattungspflicht für sonstige Gesetzesverstösse. Ausnahme Spezialgesetz: Bei Covid-19-Krediten
    mit Solidarbürgschaft können weitere Prüfpflichten bestehen (HWP ER Rz 221, hwp-er-2026__rz-0221-s235); stellt die Revisionsstelle eine Verletzung von Art. 2 Abs. 2–4 Covid-19-SBüG
    fest, gilt Art. 23 Covid-19-SBüG (siehe Aussage «Covid-19-Kredite mit Solidarbürgschaft»).'
  quelle: hwp-er-2026__rz-0268-s086
  zitat: Auch im Gesetz findet sich keine Verpflichtung, wonach im Rahmen der eingeschränkten Revision aktiv auf allfällige weitere Gesetzesverstösse zu achten oder nach diesen zu suchen
    wäre.
- text: 'Beschränkte Hinweispflicht (SER Ziff. 1.6): Für Verstösse gegen Gesetz, Statuten oder Organisationsreglement ohne direkten Zusammenhang mit der Rechnungslegung besteht keine
    gesetzliche Hinweispflicht. Werden bei der Durchführung der eingeschränkten Revision Verstösse gegen Gesetz oder Statuten festgestellt und besteht ein direkter Bezug zur Jahresrechnung,
    ist ein Hinweis im Revisionsbericht in Erwägung zu ziehen (Berichterstattung: SER Ziff. 8; Überschuldung: SER Ziff. 9).'
  quelle: ser-2022__1-6-t2
  zitat: besteht ein direkter Bezug zur Jahresrechnung, so ist ein Hinweis im Revisionsbericht in Erwägung zu ziehen
- text: 'Statuten und Organisationsreglement: Auf Statutenverstösse ist nur hinzuweisen, wenn sie im Zusammenhang mit dem Prüfungsgegenstand stehen; für Verstösse gegen das Organisationsreglement
    besteht keine Hinweispflicht. HWP ER Rz 422 ist enger (Statuten- und Organisationsreglementsverstösse sind weder Prüfungsgegenstand noch hinweispflichtig); massgebend ist SER Ziff.
    8.3.2.1. Stellt die Revisionsstelle solche Verstösse fest, kann unter Umständen ein Hinweis im Bericht an die GV bzw. das oberste Organ oder zumindest gegenüber den für die Jahresrechnung
    Verantwortlichen angezeigt sein (Rz 422, hwp-er-2026__rz-0422-s279-t2). Agent: Notiz «Schlussbesprechung», Entscheid WP.'
  quelle: ser-2022__8-3-2-t2
  zitat: Für Verstösse gegen die Statuten besteht eine Hinweispflicht nur dann, wenn diese im Zusammenhang mit dem Prüfungsgegenstand stehen.
- text: 'Zwingende Hinweise (SER Ziff. 8.3.2.1): Hinweise auf Gesetzesverstösse ausserhalb des Prüfungsgegenstands im Zusammenhang mit der Untätigkeit des VR bei hälftigem Kapitalverlust
    (Art. 725a OR) oder Überschuldung (Art. 725b OR) sind in jedem Fall im Revisionsbericht anzubringen; bleibt der VR bei Überschuldung untätig, ist zusätzlich die Anzeigepflicht nach
    Art. 729c OR zu beachten. Übrige Hinweise nur, wenn wesentlich, mit direktem Bezug zur Jahresrechnung und aufgrund der durchgeführten Prüfungshandlungen (z.B. Befragung) festgestellt.
    Hinweise beeinflussen die Prüfungsaussage nicht und stehen im Berichtstext nach der Prüfungsaussage bzw. nach einem Zusatz. Zwingend ist der Hinweis auch, wenn die Liquidatoren die
    Überschuldungsanzeige unterlassen (Hinweis auf Art. 743 Abs. 2 OR; SER Ziff. 8.3.2.1 Fussnote 3).'
  quelle: ser-2022__8-3-2-t1
  zitat: oder einer Überschuldung (Art. 725b OR) sind in jedem Fall im Revisionsbericht anzubringen
- text: 'HWP ER Abbildung 49 (Hinweis zwingend notwendig): Kapitalverlust (Art. 725a OR) und Überschuldung (Art. 725b OR) – Pflichtverletzungen des VR, wenn er die notwendigen Massnahmen
    nicht ergreift: keine Sanierungsmassnahmen, Zwischenabschlüsse nicht erstellt, Anzeigepflicht nicht erfüllt.'
  quelle: hwp-er-2026__rz-0423-s280
  zitat: Massnahmen nicht ergreift (keine Sanierungsmassnahmen; Zwischenabschlüsse nicht erstellt; Anzeigepflicht nicht erfüllt)
- text: 'Ein Hinweis im Zusammenhang mit Art. 725a Abs. 1 OR ist angebracht, wenn der VR keine oder offensichtlich unzureichende Sanierungsmassnahmen ergreift und die Aktionäre nicht
    informiert sind und davon auszugehen ist, dass eine Information durch die Revisionsstelle den Sanierungswillen der Aktionäre beeinflussen würde. Verhältnis zum SER: Massgebend ist
    SER Ziff. 8.3.2.1 (ser-2022__8-3-2-t1: Hinweis bei Untätigkeit des VR «in jedem Fall»). Rz 424 hilft nur bei der Würdigung, ob Untätigkeit vorliegt; es ist keine Ausnahme von der
    zwingenden Pflicht. Entscheid WP.'
  quelle: hwp-er-2026__rz-0424-s280
  zitat: der Verwaltungsrat keine oder offensichtlich unzureichende Sanierungsmassnahmen ergreift
- text: 'Verspätete/fehlende Massnahmen bei Kapitalverlust – Musterbericht (nicht modifizierte Prüfungsaussage): Zusatz «Wir machen darauf aufmerksam, dass die Hälfte … nicht mehr gedeckt
    ist (Art. 725a Abs. 1 OR)», dann Hinweis «Ferner weisen wir darauf hin, dass es der Verwaltungsrat unterlassen hat, Massnahmen zur Beseitigung des Kapitalverlusts zu ergreifen, …».
    Das Muster setzt voraus, dass der VR vom Zeitablauf her bereits Gelegenheit hatte, seinen Pflichten nachzukommen (z.B. grösserer Zeitabstand zwischen Abschlusserstellung und Berichtsabgabe).'
  quelle: muster-hwp-er-2026__c050-2
  zitat: Annahme ist, dass der Verwaltungsrat vom Zeitablauf her bereits Gelegenheit hatte, seinen Pflichten nach Art. 725a Abs. 1 OR nachzukommen, und deshalb ein Gesetzesverstoss vorliegt
- text: 'Empfohlene Hinweise (HWP ER Abbildung 50), sofern für die Meinungsbildung der Berichtsempfänger von Bedeutung: Erwerb eigener Aktien trotz fehlender freier Reserven bzw. Überschreitung
    der 10 %-Grenze (20 % bei Vinkulierung); Ungleichbehandlung der Aktionäre bei Verteilung von Bilanzgewinn/Liquidationsergebnis; gesetzeswidrige oder ungerechtfertigte Leistungen
    an Aktionäre, VR oder Nahestehende; gesetzeswidriges Aktionärsdarlehen oder unzulässige Rückzahlung des Aktienkapitals; Nichteinhaltung der GV-Einberufungsfrist; Dividende mit erheblichem
    Liquiditätsentzug; Vorlagepflicht Geschäftsbericht bzw. Genehmigung Zwischenabschluss nicht eingehalten. (SER Ziff. 8.3.2.1 nennt als Beispiele Art. 659, 660, 678, 680, 699, 717,
    958 Abs. 3 bzw. 960f Abs. 3 OR.) Unterlassen die Liquidatoren die Überschuldungsanzeige, ist der Hinweis nach SER zwingend (Fussnote 3, Hinweis auf Art. 743 Abs. 2 OR); HWP ER Abb.
    50 führt ihn nur als empfohlen; massgebend ist SER.'
  quelle: hwp-er-2026__rz-0425-s280-t1
  zitat: wird ein Hinweis im zusammenfassenden Bericht zur eingeschränkten Revision empfohlen, sofern die Gesetzesverstösse für die Meinungsbildung des Berichtsempfängers von Bedeutung
    sind
- text: 'GV-Frist: Die ordentliche GV findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt (Art. 699 Abs. 2 OR); die Einberufung erfolgt durch den VR,
    nötigenfalls durch die Revisionsstelle (Abs. 1). Die Nichteinhaltung der gesetzlichen Einberufungsfrist ist ein Beispiel für einen Hinweis (SER Ziff. 8.3.2.1).'
  quelle: or__art-699
  zitat: Die ordentliche Generalversammlung findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt.
- text: 'Praxis bei Fristverletzung über mehrere Jahre (Sekundärquelle, Seminar Camponovo 2026): Fokus auf das Berichtsjahr – wird die Frist (30.6.) im Folgejahr eingehalten, entfällt
    der Hinweis; bei erneuter Verspätung wird wieder hingewiesen, ohne die Vorjahresverletzung zu erwähnen. Camponovo vertritt zudem die (vom SER abweichende) Ansicht, Art. 699 OR sei
    nur ein Zusatz – Entscheid beim WP.'
  quelle: camponovo-2026-hinweispflichten__s090-1
  zitat: In der Praxis macht man im Fall 1a im GJ 2 keinen Hinweis, weil die Frist eingehalten wurde
- text: 'Gewinnverwendung: Die Revisionsstelle prüft den Antrag des VR über die Verwendung des Bilanzgewinns auf Gesetzes- und Statutenkonformität (Art. 729a Abs. 1 Ziff. 2 OR), insbesondere
    die richtige Zuweisung an die gesetzliche Gewinnreserve. Da der Antrag Prüfungsgegenstand ist, führt ein Verstoss zu einer Aussage zum Antrag im Bericht (z.B. verneinende Prüfungsaussage
    bei fehlender Reservezuweisung, SER Anhang F Beispiel 8), nicht zu einem Hinweis ausserhalb des Prüfungsgegenstands.'
  quelle: hwp-er-2026__rz-0439-s284
  zitat: Insbesondere ist zu prüfen, ob die Zuweisungen an die gesetzliche Gewinnreserve richtig erfolgen
- text: 'Dividende und Liquidität: Beeinflusst die beantragte Dividende die Liquidität ganz erheblich, ist sie nur vertretbar, wenn die betriebsnotwendige Liquidität auch nach dem Dividendenabgang
    zur Verfügung steht; andernfalls verstösst der Antrag gegen die Sorgfaltspflicht (Art. 717 Abs. 1 OR). Bejaht die Revisionsstelle die Vertretbarkeit, genügt ein Zusatz (SER Anhang
    F Beispiel 12); verneint sie sie, liegt ein Gesetzesverstoss vor und es bedarf eines Hinweises.'
  quelle: ser-2022__anh-f-s130-2
  zitat: Verneint sie diese, liegt ein Gesetzesverstoss vor, und es bedarf eines Hinweises.
- text: 'Darlehen an Aktionäre / Einlagenrückgewähr (Art. 680 Abs. 2 OR; GmbH Art. 793 Abs. 2 OR): Das freie Eigenkapital (gesamtes Eigenkapital abzüglich einbezahltes Aktienkapital;
    stille Reserven netto nach latenten Steuern anrechenbar) ist mit dem Total der Forderungen mit Darlehenscharakter gegenüber Aktionären (up stream und cross stream) zu vergleichen.
    Operative konzerninterne LuL-Forderungen mit üblichen Zahlungszielen zählen nicht; Verbindlichkeiten dürfen nur bei Verrechenbarkeit (Art. 120 OR) oder vertraglicher Vereinbarung
    abgezogen werden. Übersteigen die Forderungen das freie Eigenkapital, entscheidet der Drittvergleich (HWP ER Rz 168).'
  quelle: hwp-er-2026__rz-0167-s215
  zitat: ist das freie Eigenkapital mit dem Total der Forderungen gegenüber Aktionären zu vergleichen
- text: 'Hinweis bei verbotener Einlagenrückgewähr (SER Anhang F Beispiel 14, nach der nicht modifizierten Prüfungsaussage): «Wir weisen darauf hin, dass das Darlehen an Aktionäre von
    … CHF mangels frei verwendbarer Reserven eine nach Art. 680 Abs. 2 OR verbotene Kapitalrückzahlung darstellt.» Ist zugleich eine dadurch nicht gedeckte Dividende beantragt, kommt
    eine verneinende Prüfungsaussage zum Antrag hinzu (HWP ER Abbildung 32).'
  quelle: ser-2022__anh-f-s132-2
  zitat: mangels frei verwendbarer Reserven eine nach Art. 680 Abs. 2 OR verbotene Kapitalrückzahlung darstellt
- text: 'Abgrenzung Hinweis – Modifizierung: Eine Modifizierung der Prüfungsaussage betrifft stets einen (angenommenen) Verstoss gegen Rechnungslegungsvorschriften oder eine Beschränkung
    des Prüfungsumfangs; mit Hinweisen werden festgestellte Verstösse gegen gesetzliche Bestimmungen ausserhalb der Rechnungslegungsvorschriften angezeigt. Hinweise haben keinen Einfluss
    auf die Prüfungsaussage (HWP ER Rz 427).'
  quelle: hwp-er-2026__rz-0426-s282
  zitat: Mittels Hinweisen werden bei der eingeschränkten Revision festgestellte Verstösse gegen gesetzliche Bestimmungen ausserhalb der Rechnungslegungsvorschriften zur Jahresrechnung
    angezeigt.
- text: 'Schweigepflicht: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen, soweit sie nicht von Gesetzes wegen zur Bekanntgabe verpflichtet ist, und wahrt bei Berichterstattung,
    Anzeigen und Auskünften an die GV die Geschäftsgeheimnisse der Gesellschaft (Art. 730b Abs. 2 OR). Gesetzliche Bekanntgabepflichten sind u.a. der Inhalt des Revisionsberichts und
    die gesetzlichen Anzeigepflichten (HWP ER Rz 10).'
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen, soweit sie nicht von Gesetzes wegen zur Bekanntgabe verpflichtet ist.
- text: 'Strafbarkeit (Art. 321 StGB): Nach OR zur Verschwiegenheit verpflichtete Revisoren und ihre Hilfspersonen, die ein Berufsgeheimnis offenbaren, werden auf Antrag mit Freiheitsstrafe
    bis zu drei Jahren oder Geldstrafe bestraft. Straflos nur mit Einwilligung des Berechtigten oder mit schriftlicher Bewilligung der vorgesetzten Behörde oder Aufsichtsbehörde. Vorbehalten
    bleiben Bestimmungen über Melde- und Mitwirkungsrechte, Zeugnispflicht und Auskunftspflicht gegenüber einer Behörde (Ziff. 3).'
  quelle: stgb__art-321
  zitat: nach Obligationenrecht zur Verschwiegenheit verpflichtete Revisoren
- text: 'Keine Anzeige an Behörden: Gegenüber der RAB besteht keine Meldepflicht für Verstösse der geprüften Unternehmen gegen Gesetz, Statuten oder Organisationsreglement; die Verschwiegenheitspflicht
    schliesst eine Anzeige an Strafverfolgungsbehörden aus. Der Auftraggeber kann die Revisionsstelle vom Revisionsgeheimnis entbinden (schriftlich festhalten; bei geschützten Geheimbereichen
    Dritter auch deren Zustimmung).'
  quelle: hwp-er-2026__rz-0010-s150-t2
  zitat: dass die Verschwiegenheitspflicht der Revisionsstelle eine Anzeige an Strafverfolgungsbehörden ausschliesst
agent:
- 'Grenze: Der Agent erstattet nie selbst eine Anzeige (Gericht, Behörden), setzt dem VR keine Frist und mahnt nicht. Ob ein Hinweis, ein Zusatz oder eine Modifizierung in den Bericht
  kommt und wie er lautet, entscheidet der WP. Den GVB-Bericht nie unterzeichnen oder datieren. Wie bei Hinweisen im Bericht vorzugehen ist, ist bei consis noch offen (konzept-ki-revisionsagent-2026__c015-2).'
- 'Covid-19-Kredit (P1, H2, L1, N1): Klären, ob ein Covid-19-Kredit mit Solidarbürgschaft besteht und die Bürgschaft im Geschäftsjahr noch lief (Kreditvereinbarung bzw. Bürgschaftsvertrag,
  Amortisationsplan, allfällige Verlängerung aus M-Files). Falls ja: Dividenden, Tantiemen, Rückerstattungen von Kapitaleinlagen, Darlehen an Gesellschafter oder Nahestehende, Rückzahlungen
  ihrer Darlehen und Mittelübertragungen an Gruppengesellschaften im Ausland auflisten (covid-sbueg__art-2-t1, covid-sbueg__art-2-t2). Hinweis auf eine Verletzung: Notiz «Wesentliche
  Feststellungen» und Pendenz an den WP. Fristansetzung, Information der GV und der Bürgschaftsorganisation (Art. 23 Covid-19-SBüG) entscheidet und vollzieht nur der WP; der Agent setzt
  keine Frist und informiert niemanden. Für den Bericht: `aufgabe gvb-bericht` (Checklistenpunkt Covid).'
- 'Offensichtliche Überschuldung: Den Begriff nach SER Anhang H prüfen (ser-2022__anh-h-s142-1: «jeder verständige Bilanzleser … sofort sieht»; Rangrücktritte und Aussicht auf Sanierung
  innert 90 Tagen berücksichtigen). Bei Verdacht sofort eine Notiz «Wesentliche Feststellungen» und eine Pendenz an den WP erfassen: Es gilt die gebotene Eile. Eine Frist der Revisionsstelle
  an den VR beträgt nach HWP ER Rz 439 (hwp-er-2026__rz-0439-s129) nur wenige Tage.'
- 'Kapitalverlust (P1-313): Die Prüfung nach Art. 725a Abs. 1 OR mit `rechne` durchführen. Datum der Abschlusserstellung, Berichtsdatum sowie VR- und GV-Protokolle auf beschlossene Sanierungsmassnahmen
  sichten. «Gebotene Eile» heisst: so rasch wie unter den Umständen möglich (hwp-er-2026__rz-0378-s114). Fehlen Massnahmen: Notiz «Wesentliche Feststellungen» mit dem Entwurf von Zusatz
  und Hinweis nach dem Muster HWP ER (muster-hwp-er-2026__c050-2), zusätzlich eine Notiz «Schlussbesprechung».'
- 'GV-Frist und Formalien (A1-304, A1-301): Die GV- und VR-Protokolle lesen. Datum der GV festhalten (spätestens 6 Monate nach dem Stichtag, Art. 699 Abs. 2 OR), ebenso die Genehmigung
  der letzten Jahresrechnung, die Wahl der Revisionsstelle und den Gewinnverwendungsbeschluss (ser-2022__anh-d-s073-2). Prüfen, ob die Jahresrechnung unterzeichnet ist (Art. 958 Abs.
  3 OR). Fehlt die Unterzeichnung, wertet Camponovo (Sekundärquelle) das als Beschränkung des Prüfungsumfangs, nicht als Hinweis; der WP entscheidet.'
- 'Gewinnverwendung (P1-303, A1-307, P1-312): Den Antrag mit `rechne` nachrechnen. Zuweisung an die gesetzliche Gewinnreserve: 5 % des Jahresgewinns, nach Beseitigung eines Verlustvortrags.
  Äufnen, bis die Reserve zusammen mit der gesetzlichen Kapitalreserve 50 % des eingetragenen Aktienkapitals erreicht, bei Holdinggesellschaften 20 % (or__art-672). Dividenden erst nach
  den Reservezuweisungen (or__art-675). Die Statuten aus den Dauerakten beiziehen. Bei einem Verstoss eine Notiz «Wesentliche Feststellungen» erfassen, mit Vorschlag einer verneinenden
  Prüfungsaussage zum Antrag (ser-2022__anh-f-s125-2).'
- 'Dividende und Liquidität: Die flüssigen Mittel zum Zeitpunkt der Berichtsabgabe bzw. der geplanten Ausschüttung mit der beantragten Dividende vergleichen (hwp-er-2026__rz-0216-s233).
  Ob die Ausschüttung vertretbar ist, beurteilt der WP. Der Agent liefert nur die Zahlen und einen Formulierungsentwurf (muster-hwp-er-2026__c053-2).'
- 'Aktionärsdarlehen (P1-305, H2-201, H2-404, D1): Alle Forderungen gegenüber Aktionären und Nahestehenden mit Darlehenscharakter auflisten (up stream und cross stream). Das freie Eigenkapital
  mit `rechne` ermitteln. Unterlagen zum Drittvergleich aus M-Files beschaffen: Vertrag, Zins, Rückzahlung, Sicherheiten, Bonität (hwp-er-2026__rz-0168-s215, hwp-er-2026__rz-0176-s217).
  Fehlen sie, eine Pendenz erfassen. Die Fallmatrix für den Bericht steht in HWP ER Abbildung 32 (hwp-er-2026__rz-0184-s219-t1/-t2).'
- 'Zins auf Aktionärsdarlehen: Den steuerlichen Safe-Haven-Satz als steuerliche Praxis kennzeichnen. Nur das Rundschreiben des betreffenden Kalenderjahres verwenden (bei abweichendem
  Geschäftsjahr je Zeitabschnitt). CHF ab 1.1.2026: mindestens ¾ % bei Finanzierung aus Eigenkapital (ESTV-Rundschreiben 2026, estv-zinsen-2026__s002-1, estv-zinsen-2026__s001-2). Fremdwährungen
  2026: eigenes ESTV-Rundschreiben (estv-rs-2-219-2026__s001-1). Für Zeitabschnitte 2025: Pendenz «ESTV-Rundschreiben 2025 anfordern» (nicht im Wiki; Treuhand-Almanach-Tabelle nicht
  verwenden). Ein zu tiefer Zins ist eine geldwerte Leistung, für die Verrechnungssteuer gilt (estv-zinsen-2026__s001-1). Handelsrechtlich ist auch ein steuerlich akzeptierter Satz am
  Drittvergleich zu messen (hwp-er-2026__rz-0176-s217).'
- 'Verdeckte Gewinnausschüttungen (R1, SCH, S1): Leistungen ohne angemessene Gegenleistung an Aktionäre oder Nahestehende als Notiz festhalten. Will der VR nicht zurückfordern, folgt
  ein Hinweis nach Art. 678 Abs. 1 OR. Fehlten ausschüttbare Mittel, ist zusätzlich ein Hinweis nach Art. 680 Abs. 2 OR möglich (Entscheidungsbaum hwp-er-2026__rz-0164-s212-t1/-t2, hwp-er-2026__rz-0165-s213-t1).
  Mögliche Folgen für die Verrechnungssteuer in einer Pendenz an den WP melden.'
- 'Rangrücktritt (N1): Eine vorzeitige Rückzahlung von Darlehen mit Rangrücktritt trotz andauernder Überschuldung kann ein Hinweisfall sein (Sekundärquelle camponovo-2026-hinweispflichten__s124-1).
  Rückzahlungen auf solchen Darlehen deshalb im Textfeld festhalten.'
- 'Eigene Anteile (T1-102, P1-304): Bestand und Erwerb festhalten. Den Erwerb ohne frei verwendbares Eigenkapital und die 10-%-Grenze (20 % bei Vinkulierung) als mögliche Hinweisfälle
  in einer Notiz melden (ser-2022__8-3-2-t2).'
