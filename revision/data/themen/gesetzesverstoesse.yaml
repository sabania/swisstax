- 'Vorjahr: Den GVB-Bericht des Vorjahres auf frühere Hinweise lesen und im Textfeld festhalten, ob der Verstoss im Berichtsjahr noch besteht. In der Praxis bezieht sich der Hinweis
  auf das Berichtsjahr (Sekundärquelle camponovo-2026-hinweispflichten__s090-1). Die Vorjahresoriginale bleiben unverändert.'
- 'Divergenzen offenlegen: Camponovo (Sekundärquelle) hält die Hinweise nach Art. 699 und 958 Abs. 3 OR nur für einen Zusatz (camponovo-2026-hinweispflichten__s067-1, __s071-1). Er kritisiert
  auch, dass Statuten- und Gesetzesverletzungen unterschiedlich behandelt werden (__s078-1). Massgebend sind SER und HWP ER. Im Zweifel eine Notiz «Schlussbesprechung» an den WP erfassen.'
- 'Schweigepflicht im Agentenablauf: Keine Informationen an Dritte oder Behörden; gesetzliche Anzeigen und Informationen (Gericht nach Art. 729c OR, GV und Bürgschaftsorganisation nach
