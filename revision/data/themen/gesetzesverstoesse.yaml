  in HWP ER Rz 10 (hwp-er-2026__rz-0010-s150-t1). Die Verletzung des Berufsgeheimnisses ist strafbar (Art. 321 StGB, stgb__art-321); im Zweifel nichts weitergeben und den WP fragen.'
