kurz: 'Steuerliche Praxis der ESTV (KS Nr. 6a vom 10.10.2024, Art. 65 DBG), keine handelsrechtliche Regel: zulässiges Fremdkapital = Verkehrswert (sonst Buch-/Gewinnsteuerwert) der Aktiven
  per Ende Steuerperiode × Belehnungssatz. Schulden darüber gelten als verdecktes EK, soweit von Beteiligten/Nahestehenden; Zinsen darauf werden aufgerechnet und unterliegen der VSt.
  Das ist nicht automatisch eine handelsrechtliche vGA. Revision: N1-304, Steuerrückstellung S1/O1; WP entscheidet.'
aussagen:
- text: 'Grundlage (steuerliche Praxis der ESTV, KS Nr. 6a zu Art. 65 DBG): Die Regeln zum verdeckten Eigenkapital grenzen steuerlich Fremd- von Eigenkapital ab. Darlehenszinsen an Anteilsinhaber
    gelten bei der Gesellschaft grundsätzlich als geschäftsmässig begründeter Aufwand, Dividenden als nicht abzugsfähige Gewinnverwendung. Massgebende Fassung: KS Nr. 6a vom 10.10.2024;
    es «tritt mit seiner Publikation in Kraft und ersetzt das Kreisschreiben Nr. 6 vom 6. Juni 1997» ^[estv-ks-6a-2024__4]. Das HWP OR (nur ergänzend, ordentliche Revision) verweist
    noch auf das KS Nr. 6 ^[hwp-or-2024__rz-0937-s364].'
  quelle: estv-ks-6a-2024__einleitung-t1
  zitat: Die Regeln über das verdeckte Eigenkapital dienen somit der steuerlichen Abgrenzung von Fremd- und Eigenkapital.
- text: 'Bemessungsgrundlage: Grundsätzlich gilt der Verkehrswert der Aktiven. Ohne Nachweis höherer Verkehrswerte nimmt die Veranlagungsbehörde die Buch- bzw. Gewinnsteuerwerte. Stichtag
    ist das Ende der Steuerperiode; grossen Wert- oder Bestandesveränderungen innerhalb der Periode kann angemessen Rechnung getragen werden. Ermittelt wird in Funktionalwährung.'
  quelle: estv-ks-6a-2024__einleitung-t2
  zitat: Sofern keine höheren Verkehrswerte nachgewiesen sind, geht die Veranlagungsbehörde von den Buchwerten, bzw. Gewinnsteuerwerten aus. Massgebend sind die Verkehrswerte am Ende
    der Steuerperiode.
- text: 'Belehnungssätze Umlaufvermögen: «Vom Verkehrswert sind in der Regel die folgenden Ansätze als Höchstbetrag der von der Gesellschaft aus eigener Kraft erhältlichen fremden Mittel
    zu betrachten» ^[estv-ks-6a-2024__einleitung-t3]: Flüssige Mittel 100 %, Forderungen aus Lieferungen und Leistungen 85 %, übrige kurzfristige Forderungen 85 %, Vorräte und nicht
    fakturierte Dienstleistungen 85 %, aktive Rechnungsabgrenzungen 85 %. Layout-Hinweis: Im Chunk stehen Positionen und Prozentsätze getrennt; die Zuordnung aller 16 Sätze ist am Original
    raw/estv-ks-6a-2024.pdf S. 2 geprüft.'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Flüssige Mittel Forderungen aus Lieferungen und Leistungen Übrige kurzfristige Forderungen Vorräte und nicht fakturierte Dienstleistungen Aktive Rechnungsabgrenzungen
- text: 'Belehnungssätze Wertschriften und Finanzanlagen: in- und ausländische Obligationen in CHF 90 %, ausländische Obligationen in Fremdwährung 80 %, kotierte in- und ausländische
    Aktien 60 %, übrige Aktien und GmbH-Anteile 50 %, Darlehen 85 %, Beteiligungen 70 %. Die Zuordnung ist am Original raw/estv-ks-6a-2024.pdf S. 2 geprüft.'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: In- und ausländische Obligationen in Schweizer Franken Ausländische Obligationen in Fremdwährung Kotierte in- und ausländische Aktien Übrige Aktien und GmbH-Anteile Darlehen
    Beteiligungen
- text: 'Belehnungssätze Sach- und immaterielle Anlagen: mobile Sachanlagen 50 %, Fabrikliegenschaften 70 %, Villen, Eigentumswohnungen, Ferienhäuser und Bauland 70 %, übrige Liegenschaften
    80 %, andere immaterielle Anlagen 70 %. Die Zuordnung ist am Original S. 2 geprüft. Der Treuhand-Almanach (Fachliteratur, Tab. 29 ^[treuhand-almanach-2026__s063-1]) hat dieselben
    Sätze mit teils anderen Bezeichnungen und eine zusätzliche Zeile 0 % (Gründungs-/Organisationskosten). Diese steht nicht im KS 6a: nicht verwenden.'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Mobile Sachanlagen Fabrikliegenschaften Villen, Eigentumswohnungen, Ferienhäuser und Bauland Übrige Liegenschaften Andere immaterielle Anlagen
- text: 'Sonderregel Finanzgesellschaften: Das maximal zulässige Fremdkapital beträgt in der Regel 6/7 der Bilanzsumme (statt der Sätze je Aktivum).'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Für Finanzgesellschaften beträgt das maximal zulässige Fremdkapital in der Regel 6/7 der Bilanzsumme.
- text: 'Berechnung: Verdecktes Eigenkapital ist anzunehmen, soweit die ausgewiesenen Schulden das zulässige Fremdkapital übersteigen. Als verdeckt gilt aber nur der Teil, der direkt
    oder indirekt von Anteilsinhabern oder ihnen nahestehenden Personen stammt. Fremdkapital unabhängiger Dritter ohne Sicherstellung durch Anteilsinhaber oder Nahestehende ist kein
    verdecktes Eigenkapital; im Umkehrschluss können Drittkredite mit einer solchen Sicherstellung erfasst sein (Ableitung, Beurteilung WP/Steuerexperte). Die Ansätze gelten nur «in
    der Regel»: «Der Nachweis, dass die konkrete Finanzierung dem Drittvergleich standhält, bleibt vorbehalten.» ^[estv-ks-6a-2024__einleitung-t3]'
  quelle: estv-ks-6a-2024__einleitung-t3
  zitat: Wesentlich ist, dass nur derjenige Teil als verdeckt gilt, der direkt oder indirekt von Anteilsinhabern oder diesen nahestehenden Personen stammt.
- text: 'Folge Gewinnsteuer (Bund). Gesetz (Art. 65 DBG): Zum steuerbaren Gewinn gehören auch die Schuldzinsen auf dem Teil des Fremdkapitals, dem wirtschaftlich die Bedeutung von Eigenkapital
    zukommt. Praxis (KS 6a Ziff. 3.1): Diese Zinsen werden dem ausgewiesenen Reingewinn hinzugerechnet und nach Art. 57 ff. DBG besteuert ^[estv-ks-6a-2024__3-1].'
  quelle: dbg__art-65
  zitat: Zum steuerbaren Gewinn der Kapitalgesellschaften und Genossenschaften gehören auch die Schuldzinsen, die auf jenen Teil des Fremdkapitals entfallen, dem wirtschaftlich die Bedeutung
    von Eigenkapital zukommt.
- text: 'Darlehen unter dem marktüblichen Zinsniveau: Stellen Beteiligte oder Nahestehende ein solches Darlehen zur Verfügung, wird vom gesamten Darlehenszins so viel als Aufwand anerkannt,
    wie nach dem ESTV-Rundschreiben zu den Zinssätzen auf dem anerkannten Fremdkapital zulässig wäre. «Nur der verbleibende Rest wird aufgerechnet.» ^[estv-ks-6a-2024__3-1]'
  quelle: estv-ks-6a-2024__3-1
  zitat: der unter dem marktüblichen Zinsniveau liegt, wird vom gesamten Darlehenszins soviel als abzugsfähiger Aufwand anerkannt
- text: 'Folge Verrechnungssteuer (KS 6a Ziff. 3.2): Die Zinsen auf verdecktes Eigenkapital unterliegen als geldwerte Leistung nach Art. 4 Abs. 1 lit. b VStG i.V.m. Art. 20 Abs. 1 VStV
    der Verrechnungssteuer. Gesetz (VStG/VStV, Fassung 1.1.2025): Steuerbar ist jede geldwerte Leistung an Beteiligte oder Nahestehende (Art. 20 Abs. 1 VStV) ^[vstv__art-20]. Satz 35
    % (Art. 13 Abs. 1 Bst. a VStG) ^[vstg__art-13]. Fällig 30 Tage nach Entstehung der Steuerforderung (Art. 16 Abs. 1 Bst. c VStG) ^[vstg__art-16]. Unaufgefordert abrechnen und zahlen
    (Art. 38 Abs. 2 VStG) ^[vstg__art-38]. ESTV-Praxis: Deklaration mit Formular 102 ^[estv-zinsen-2026__s001-1].'
  quelle: estv-ks-6a-2024__3-2
  zitat: Die auf das verdeckte Eigenkapital entfallenden Schuldzinsen gemäss Ziffer 3.1 oben unterliegen als geldwerte Leistung
- text: Die Rückzahlung von Fremdkapital, das steuerlich als verdecktes Eigenkapital gilt, ist keine geldwerte Leistung. Sie unterliegt weder der Verrechnungssteuer noch der Einkommenssteuer
    (Privatvermögen).
  quelle: estv-ks-6a-2024__3-3
  zitat: stellt keine geldwerte Leistung der Kapitalgesellschaft oder Genossenschaft an ihren Anteilsinhaber oder diesen nahestehenden Personen dar
- text: 'Gesetz (Covid-19-SBüG): Solange die Solidarbürgschaft besteht, sind Gewährung und Rückzahlung von Darlehen von Gesellschaftern oder Nahestehenden ausgeschlossen (Art. 2 Abs.
    2 Bst. b). Zulässig bleibt die Erfüllung vorbestehender Verpflichtungen gegenüber verbundenen Gruppengesellschaften mit Sitz in der Schweiz, namentlich ordentlicher Zins- und Amortisationspflichten.
    Stellt die Revisionsstelle eine Verletzung fest: (1) Sie setzt eine angemessene Frist zur Herstellung des ordnungsgemässen Zustands. (2) Wird dieser nicht hergestellt, informiert
    sie die GV. (3) Stellt der VR ihn auch dann nicht unverzüglich her, informiert sie die Bürgschaftsorganisation (Art. 23 Abs. 1) ^[covid-sbueg__art-23].'
  quelle: covid-sbueg__art-2-t1
  zitat: die Gewährung von Darlehen oder die Rückzahlung von Darlehen von Gesellschafterinnen und Gesellschaftern oder von nahestehenden Personen
- text: 'Folge Kapitalsteuer: Das KS 6a enthält keine Ausführungen zur Kapitalsteuer mehr; sie wurden wegen der Unternehmenssteuerreform 1997 entfernt ^[estv-ks-6a-2024__einleitung-t2].
    Laut Treuhand-Almanach (Fachliteratur) unterliegt verdecktes Eigenkapital der Kapitalsteuer (Art. 29a StHG). StHG und kantonale Steuergesetze sind nicht im Wiki, daher im Einzelfall
    klären.'
  quelle: treuhand-almanach-2026__s063-1
  zitat: ist «verdecktes Eigenkapital» anzunehmen, welches der Kapitalsteuer unterliegt (Art. 29a StHG)
- text: 'ESTV-Rundschreiben «Steuerlich anerkannte Zinssätze 2026» (steuerliche Praxis, Bern, 29.1.2026): Bei den steuerlich höchstzulässigen Zinsen auf Vorschüssen von Beteiligten ist
    ein allfälliges verdecktes Eigenkapital zu beachten; das KS 6a ist danach auch für Verrechnungssteuer und Stempelabgaben massgebend. «Für die Berechnung der Limiten sind die Kredite
    sämtlicher Beteiligten und nahestehender Personen zusammen zu zählen.» ^[estv-zinsen-2026__s002-1] Die dort genannten Höchstsätze für die Fremdfinanzierung von Liegenschaften (70
    % bzw. 80 % vom Verkehrswert) stimmen mit dem KS 6a überein; die Zinssätze gelten als «safe haven». Zeitbezug: Im Wiki liegt nur das Rundschreiben 2026; für ein Geschäftsjahr 2025
    fehlt das massgebende Rundschreiben (Pendenz). Die Zinstabelle ist im Chunk layoutbedingt verschoben, Zinssätze daher am Original raw/estv-zinsen-2026.pdf S. 2 ablesen.'
  quelle: estv-zinsen-2026__s002-2
  zitat: Bei der Berechnung der steuerlich höchstzulässigen Zinsen ist auch ein allfällig bestehendes verdecktes Eigenkapital zu beachten.
- text: 'Prüfung (SER Anhang D j, massgebend): empfohlene Prüfungshandlungen, «Den konkreten Umständen des Mandats anzupassen» ^[ser-2022__anh-d-s085-1]: Befragung zu Darlehen gegenüber
    Beteiligten, Organen und Konzerngesellschaften (revio N1-104); analytisch beurteilen, ob der Zinsaufwand im Verhältnis zu den Darlehenssalden plausibel ist (N1-201); Einsicht in
    Kredit- und Darlehensverträge (N1-302) ^[katalog-revio4__c003-48]. Der Agent befragt nicht selbst: «Kann nicht selbst befragen: wertet schriftliche Antworten aus» ^[konzept-ki-revisionsagent-2026__c012-1],
    sonst Pendenz.'
  quelle: ser-2022__anh-d-s085-1
  zitat: Befragung zu Darlehen gegenüber direkt oder indirekt Beteiligten und Organen sowie gegenüber Unternehmen, an denen direkt oder indirekt eine Beteiligung besteht
- text: 'Nahestehende Personen (HWP ER, Rang vor HWP BuR): Zu Beginn der eingeschränkten Revision klärt der Abschlussprüfer durch Befragung der Unternehmensleitung, wer Eigentümer und
    Nahestehende sind (vgl. SER Ziff. 3.1). Mögliche Prüfungshandlungen: «Bestimmung von nahestehenden Personen mittels Befragung der Unternehmensleitung und Einsicht in Aktienbuch,
    Handelsregisterauszug, GV- und allenfalls VR-Protokolle» sowie «Beurteilung der (Transfer-)Preise der jeweiligen Geschäftsvorfälle mittels Drittvergleichs» ^[hwp-er-2026__rz-0161-s212].
    Für N1-304 ergibt das den Kreis der Darlehensgeber, deren Fremdkapital als verdeckt gelten kann (Ableitung).'
  quelle: hwp-er-2026__rz-0159-s211
  zitat: erkundigt sich der Abschlussprüfer mittels Befragung der Unternehmensleitung, wer die Eigentümer und sonstigen nahestehenden Personen des Unternehmens sind
- text: 'revio-Prüfschritt N1-304 (Detail, EP, Prüfziele PA RI; intern, Katalog revio 4.0): Beurteilung, ob verdecktes Eigenkapital und daraus verdeckte Gewinnausschüttungen bestehen.
    Der Agent bereitet vor; das Visum bleibt offen.'
  quelle: katalog-revio4__c003-49
  zitat: Beurteilung des Bestehens von verdecktem Eigenkapital und daraus resultierender verdeckter Gewinnausschüttungen
- text: 'Folge in der Jahresrechnung, Steuerrückstellung: Nachbelastungen aus Steuerrevisionen oder hängigen Rechtsmitteln (z.B. wegen verdeckter Gewinnausschüttungen) sind nach ihrer
    Wahrscheinlichkeit am Tag der Bilanzerstellung als Rückstellung zu schätzen. Für eine drohende Aufrechnung von Zinsen auf verdecktes Eigenkapital gilt dies sinngemäss (Ableitung,
    Beurteilung WP; Prüfschritte S1-304, O1).'
  quelle: hwp-bur-2023__rz-0547-s269
  zitat: Je nach Wahrscheinlichkeit einer Steuernachforderung ist am Tag der Bilanzerstellung die Höhe der erforderlichen Rückstellung zu schätzen.
- text: 'Bemessung der Steuerrückstellung, Verrechnungssteuer (HWP BuR Rz 183 zu Forderungen an Nahestehende; hier nur sinngemäss angewendet, Ableitung, Beurteilung WP): «Erfüllen Darlehen
    und andere Forderungen an nahestehende Personen den Tatbestand steuerbarer geldwerter Leistungen, sind die allenfalls zu erwartenden Steuernachforderungen zu berücksichtigen». Gewinnsteuern
    belasten die Gesellschaft; die VSt ist auf die Begünstigten zu überwälzen (Art. 14 VStG: Kürzungspflicht; widersprechende Vereinbarungen sind nichtig) ^[vstg__art-14]. «Unterbleibt
    die Überwälzung, so führt dies bei einem Verrechnungssteuersatz von 35 % zu einer Belastung der Gesellschaft von 53,8 %» (Aufrechnung ins Hundert) ^[hwp-bur-2023__rz-0183-s199-t1].
    53,8 % ist der Höchstwert bei unterbliebener Überwälzung. Wird die Leistung erst bei einer amtlichen Kontrolle für ein Vorjahr aufgerechnet, kann die ESTV auf Gesuch das Meldeverfahren
    gestatten. Voraussetzung: Die Empfänger sind rückerstattungsberechtigt und es sind höchstens 20 (Art. 24 Abs. 1 Bst. a und Abs. 2 VStV) ^[vstv__art-24]. Dann ist kein Verzugszins
    geschuldet (Art. 16 Abs. 2bis VStG) ^[vstg__art-16].'
  quelle: hwp-bur-2023__rz-0183-s199-t1
  zitat: Während Erstere die Gesellschaft belasten, ist die Verrechnungssteuer eine Belastung der Begünstigten
- text: 'Abgrenzung (AGENTS.md Regel 7): Steuerlich aufgerechnete Zinsen auf verdecktem Eigenkapital (geldwerte Leistung nach KS 6a Ziff. 3.2) sind nicht ohne Weiteres eine handelsrechtliche
    verdeckte Gewinnausschüttung. Handelsrechtlich gilt: «Eine verdeckte Gewinnausschüttung liegt dann vor, wenn eine Gesellschaft Leistungen erbringt, ohne dafür eine (angemessene)
    Gegenleistung zu erhalten» («Arm’s-length»-Prinzip); dabei besteht ein erheblicher Ermessensspielraum.'
  quelle: hwp-er-2026__rz-0163-s212
  zitat: Bei der Beurteilung, ob eine Leistung der Gegenleistung entspricht, besteht in der Praxis ein erheblicher Ermessensspielraum.
- text: 'Folge Bericht (HWP ER III.2.4.2.2): Das Vorgehen gilt, wenn der Abschlussprüfer eine offensichtliche und wesentliche vGA feststellt (u.a. schriftliche Mitteilung an den VR,
    Beurteilung der Rückerstattung nach Art. 678 OR, bei fehlendem Willen des VR Hinweis im Bericht an die GV). «Hierbei stehen Verrechnungssteueraspekte im Vordergrund, welche erheblich
    sein können» ^[hwp-er-2026__rz-0164-s212-t3]. Das HWP BuR nennt als Beispiel einer vGA «nicht marktgerechte Zinssätze (zu niedrig verzinste Darlehen der Gesellschaft oder überhöht
    verzinste Gesellschafterdarlehen)» ^[hwp-bur-2023__rz-0680-s299]; das betrifft den Zinssatz, nicht die Fremdkapitalquote nach KS 6a. Ob die Schwelle erreicht ist, entscheidet ausschliesslich
    der WP; der Agent nennt nur Sachverhalt und Zahlen.'
  quelle: hwp-er-2026__rz-0164-s212-t1
  zitat: Wenn der Abschlussprüfer eine offensichtliche und wesentliche verdeckte Gewinnausschüttung feststellt, kann er wie folgt vorgehen
agent:
- 'Einordnung: Das KS 6a ist steuerliche Praxis der ESTV (Rang ESTV-Praxis, unter OR/SER/HWP ER) und keine handelsrechtliche Bewertungs- oder Ausweisregel (AGENTS.md Regel 7). Die Regeln
  dienen der steuerlichen Abgrenzung ^[estv-ks-6a-2024__einleitung-t1]. Daraus weder eine Umgliederung in der Jahresrechnung noch eine handelsrechtliche vGA ableiten: Ob eine vGA vorliegt,
  ist eine Arm''s-length-Beurteilung mit erheblichem Ermessensspielraum ^[hwp-er-2026__rz-0163-s212]; das beurteilt der WP.'
- 'Planung (p2): Kreis der Beteiligten und Nahestehenden zu Beginn klären ^[hwp-er-2026__rz-0159-s211]. Aktienbuch, Handelsregisterauszug, GV- und allenfalls VR-Protokolle aus M-Files
  auswerten ^[hwp-er-2026__rz-0161-s212]. Der Agent befragt nicht selbst: schriftliche Antworten (z.B. revio 10.11 Kundenbefragung) auswerten, sonst Frage als Pendenz; Status höchstens
  «teilweise bearbeitet» ^[konzept-ki-revisionsagent-2026__c012-1].'
- 'Auslöser für N1-304: Darlehen, Kontokorrente oder Vorschüsse von Aktionären, Organen oder Nahestehenden in L1, M1 oder N1. Diese sind gesondert in Bilanz oder Anhang auszuweisen (Art.
  959a Abs. 4 OR ^[or__art-959a-t2]). Auslöser sind auch Bankkredite mit Sicherstellung durch den Aktionär (Bürgschaft, Pfand); vgl. die Formulierung «ohne Sicherstellung durch den Anteilsinhaber»
  ^[estv-ks-6a-2024__einleitung-t3]. Besteht ein Covid-19-Kredit (Kreditvertrag in M-Files oder Konto in L1/N1): die Zu- und Abgänge der Darlehen von Aktionären und Nahestehenden im
  Geschäftsjahr aus den Kontoblättern auflisten; Summen mit `rechne`. Jede Rückzahlung oder Neugewährung als Notiz «Wesentliche Feststellungen» erfassen mit dem Vermerk «möglicher Verstoss
  Art. 2 Abs. 2 Bst. b Covid-19-SBüG» ^[covid-sbueg__art-2-t1]. Fristsetzung sowie Information der GV bzw. der Bürgschaftsorganisation entscheidet nur der WP (vgl. `aufgabe gvb-bericht`).'
- 'revio-Schritte (SER Anhang D j ^[ser-2022__anh-d-s085-1], Katalog ^[katalog-revio4__c003-48]): N1-104 Befragung zu Darlehen Beteiligter (nur schriftliche Antworten, sonst Pendenz),
  N1-201 Zinsaufwand im Verhältnis zu den Darlehenssalden (Rechenmodul), N1-302 Einsicht in Kredit- und Darlehensverträge, N1-304 Beurteilung verdecktes EK (vorbereiten, Visum offen).
  Steuerfolge in S1-304 «Prüfung der Steuerrückstellungen». S1-401 «Festhalten geldwerte Leistungen» ^[katalog-revio4__c003-57] ist ein Sonstiger Schritt (4xx): nur auf Anweisung des
  WP («nur auf Anweisung, physische Tätigkeiten nie» ^[konzept-ki-revisionsagent-2026__c012-1]); ohne Anweisung im Rapport als «nicht bearbeitet – nur auf Anweisung» führen (Vorgehen
  gemäss `pruefschritt S1-401`).'
- 'Unterlagen (Pendenz, falls nicht in M-Files): Bilanz bzw. Saldoliste per Stichtag; Darlehensverträge mit Beteiligten und Nahestehenden (Zinssatz, Laufzeit, Sicherheiten); Zinsabrechnungen;
  Sicherheiten des Aktionärs für Bankkredite; Aktienbuch, Handelsregisterauszug, GV-/VR-Protokolle ^[hwp-er-2026__rz-0161-s212]; Nachweise höherer Verkehrswerte (Liegenschaftsschätzung,
  Kurswerte), falls die Gesellschaft sich darauf beruft; Steuererklärung, Veranlagung und Korrespondenz mit den Steuerbehörden ^[ser-2022__anh-d-s089-2]; ESTV-Zinssatz-Rundschreiben
  des Geschäftsjahrs, falls nicht im Wiki.'
- 'Berechnung immer im Rechenmodul (`rechne`), nie im Kopf: (1) Wert je Aktivum × Satz nach KS 6a (Buch- bzw. Gewinnsteuerwerte, wenn keine höheren Verkehrswerte nachgewiesen sind).
  (2) Summe = zulässiges Fremdkapital; bei Finanzgesellschaften 6/7 der Bilanzsumme. (3) Überschuss = ausgewiesene Schulden minus zulässiges Fremdkapital. (4) Als verdeckt gilt höchstens
  der Teil von Anteilsinhabern oder Nahestehenden. (5) Aufzurechnen sind die darauf entfallenden Schuldzinsen ^[estv-ks-6a-2024__3-1]. (5b) Bei Darlehen von Beteiligten/Nahestehenden
  unter dem marktüblichen Zinsniveau: zulässigen Zins auf dem anerkannten Fremdkapital nach dem Rundschreiben des Geschäftsjahrs berechnen; nur der Rest wird aufgerechnet ^[estv-ks-6a-2024__3-1].
  Für den Grundfall (Zuordnung der Zinsen auf den verdeckten Teil) nennt das KS 6a im Wiki keinen Verteilschlüssel: Annahme im Textfeld offenlegen, Entscheid beim WP.'
- 'Layout: Belehnungssätze nur aus dem KS 6a (Zuordnung am Original raw/estv-ks-6a-2024.pdf S. 2 geprüft); die Almanach-Zeile «Gründungs-, Kapitalerhöhungs- und Organisationskosten 0
  %» ^[treuhand-almanach-2026__s063-1] steht nicht im KS 6a: nicht verwenden.'
- 'Zinssätze (ESTV-Praxis): Das Rundschreiben ist jahresbezogen («Steuerlich anerkannte Zinssätze 2026 für Vorschüsse oder Darlehen» ^[estv-zinsen-2026__s001-1]). Im Wiki liegt nur das
  Rundschreiben 2026 (estv-zinsen-2026, «safe haven» ^[estv-zinsen-2026__s002-1]). Für ein Geschäftsjahr 2025 (typische SER im Jahr 2026) Pendenz «ESTV-Rundschreiben Zinssätze 2025 beschaffen»;
  Werte 2026 nie auf andere Jahre übertragen. Die Zinstabelle 2026 ist im Chunk verschoben, deshalb die Werte am Original raw/estv-zinsen-2026.pdf S. 2 ablesen. Treuhand-Almanach Tab.
  30 (2023–2026) höchstens als Fachliteratur nennen; die Tabelle ist im Chunk zerrissen ^[treuhand-almanach-2026__s064-1], daher am Original raw/treuhand-almanach-2026.pdf prüfen. Fremdwährungsdarlehen
  von Beteiligten/Nahestehenden: ESTV-Rundschreiben Nr. 219 vom 30.1.2026 ^[estv-rs-2-219-2026__s001-1], gilt nur für 2026. Tabelle S. 3 am Original raw/estv-rs-2-219-2026.pdf ablesen;
  Überblick `wert fremdwährung`. Die Sätze gelten als safe haven auch für verzinsliche Verpflichtungen in Fremdwährung ^[estv-rs-2-219-2026__s002-2]. Das Unternehmen muss nachweisen,
  weshalb keine tiefer verzinsliche CHF-Verpflichtung eingegangen wurde; fehlt der Nachweis: Pendenz. Das KS 6a gilt auch hier. GJ 2025: Rundschreiben 2025 fehlt im Wiki → Pendenz, Werte
  2026 nicht übertragen.'
- 'Steuerfolgen in der Jahresrechnung (S1-304, O1): Bei Überschreitung droht eine Aufrechnung bei der Gewinnsteuer ^[estv-ks-6a-2024__3-1] und die Verrechnungssteuer auf den aufgerechneten
  Zinsen ^[estv-ks-6a-2024__3-2] (35 % Art. 13 VStG ^[vstg__art-13], fällig nach 30 Tagen Art. 16 VStG ^[vstg__art-16]; Formular 102 ist ESTV-Praxis ^[estv-zinsen-2026__s001-1]). Für
  schwebende Steuerrisiken sind Rückstellungen zu bilden oder ein Ausweis als Eventualverbindlichkeit in Betracht zu ziehen ^[hwp-bur-2023__rz-0801-s331]. Sinngemäss nach HWP BuR Rz
  183 (Ableitung, Beurteilung WP): Erfüllen Darlehen an Nahestehende den Tatbestand geldwerter Leistungen, sind zu erwartende Steuernachforderungen zu berücksichtigen. Gewinnsteuern
  belasten die Gesellschaft; die VSt belastet die Begünstigten und ist zu überwälzen; unterbleibt die Überwälzung, belastet sie die Gesellschaft mit 53,8 % ^[hwp-bur-2023__rz-0183-s199-t1].
  53,8 % ist der Höchstwert: Kommt das Meldeverfahren in Frage (Aufrechnung erst bei amtlicher Kontrolle für ein Vorjahr, höchstens 20 rückerstattungsberechtigte Empfänger, Art. 24 VStV
  ^[vstv__art-24]), beurteilt das der WP; dafür eine Pendenz erfassen und im Vorschlag beide Beträge (mit und ohne Meldeverfahren) mit `rechne` ausweisen. Zeitbezug der Rundschreiben:
  siehe «Zinssätze». Ob überwälzt wurde oder noch überwälzt werden kann: schriftliche Antwort (z.B. revio 10.11) auswerten, sonst Frage als Notiz «Pendenz» erfassen; nie selbst an den
  Kunden senden ^[konzept-ki-revisionsagent-2026__c012-1] ^[konzept-ki-revisionsagent-2026__c009-2]. Höhe, Wahrscheinlichkeit und Rückstellung beurteilt der WP.'
- 'Notizen: «Pendenz» für fehlende Verträge, Sicherheiten, Verkehrswertnachweise, das Zinssatz-Rundschreiben des Geschäftsjahrs oder Angaben zur VSt-Überwälzung (mit Konto, Datum, Betrag).
  Mögliche Steuerfolge (fehlende Steuerrückstellung) mit `rechne` beziffern. Über der Nichtaufgriffsgrenze: Notiz «Wesentliche Feststellungen» mit Berechnung als Beilage und begründetem
  Vorschlag zur Steuerrückstellung, ohne Verbuchung; die Summe der Feststellungen beurteilt der WP (6.1) ^[hwp-er-2026__rz-0053-s189] ^[konzept-ki-revisionsagent-2026__c014-1]. Darunter:
  nur protokollieren. Zusätzlich Notiz «Schlussbesprechung» zu Finanzierungsstruktur, Zinssätzen der Aktionärsdarlehen und Drittvergleich.'
- 'Kapitalsteuer: im KS 6a nicht geregelt ^[estv-ks-6a-2024__einleitung-t2], Art. 29a StHG nur aus dem Almanach; kantonale Praxis als Pendenz an WP/Steuerexperte, nichts aus dem Gedächtnis.'
- 'WP entscheidet: ob eine verdeckte Gewinnausschüttung vorliegt und ob sie offensichtlich und wesentlich ist (Vorgehen nach HWP ER III.2.4.2.2 ^[hwp-er-2026__rz-0164-s212-t1]), über
  Wesentlichkeit und Rückstellungshöhe sowie über die Folgen für den Bericht. Geldwerte Leistungen können sowohl steuerliche Fragen aufwerfen als auch handelsrechtliche Konsequenzen
  für Gewinnausweis und Gewinnverwendung haben ^[hwp-er-2026__rz-0158-s211]. Der Agent nennt nur Sachverhalt und Zahlen, lässt das Visum offen und schreibt nichts in den Bericht.'
