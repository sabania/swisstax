- 'Hinweis (Agent-Einschätzung, kein Korrigendum vorhanden): HWP ER I.5.3.2 Rz 374, S. 113 nennt für die Sanierungspflicht beim Kapitalverlust Art. 725 Abs. 1 OR (hwp-er-2026__rz-0374-s113:
