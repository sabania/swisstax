kurz: Die Rechnungslegung beruht auf der Fortführungsannahme (OR 958a Abs. 1); die Unternehmensleitung schätzt die Fortführungsfähigkeit für mindestens zwölf Monate ab Bilanzstichtag
  ein. Die Revisionsstelle beurteilt in Planung und Abschluss, ob die Annahme vertretbar ist (SER Anhang G, HWP ER III.2.4.3). Ist die Fortführung nicht gegeben, gelten Veräusserungswerte;
  wesentliche Unsicherheiten gehören in den Anhang und führen zu Zusatz, Einschränkung, verneinender Aussage oder Unmöglichkeit.
aussagen:
- text: 'Grundsatz (Art. 958a Abs. 1 OR): Die Rechnungslegung beruht auf der Annahme, dass das Unternehmen auf absehbare Zeit fortgeführt wird (Going Concern).'
  quelle: or__art-958a
  zitat: Die Rechnungslegung beruht auf der Annahme, dass das Unternehmen auf absehbare Zeit fortgeführt wird.
- text: 'Art. 958a Abs. 2 OR: Ist die Einstellung der Tätigkeit oder von Teilen davon in den nächsten zwölf Monaten ab Bilanzstichtag beabsichtigt oder voraussichtlich nicht abwendbar,
    gelten für die betreffenden Unternehmensteile Veräusserungswerte. Für die mit der Einstellung verbundenen Aufwendungen sind Rückstellungen zu bilden.'
  quelle: or__art-958a
  zitat: so sind der Rechnungslegung für die betreffenden Unternehmensteile Veräusserungswerte zugrunde zu legen
- text: 'Art. 958a Abs. 3 OR: Abweichungen von der Fortführungsannahme sind im Anhang zu vermerken, und ihr Einfluss auf die wirtschaftliche Lage ist darzulegen (revio T1-318).'
  quelle: or__art-958a
  zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken; ihr Einfluss auf die wirtschaftliche Lage ist darzulegen.
- text: 'Verantwortung der Unternehmensleitung (SER Anhang G Ziff. 1): Sie muss die Fortführungsfähigkeit einschätzen, und zwar für mindestens zwölf Monate ab dem Bilanzstichtag. Ist
    die Fortführung gegeben, wird zu Fortführungswerten bilanziert und bewertet.'
  quelle: ser-2022__anh-g-s138-1
  zitat: Die Unternehmensleitung hat die Einschätzung der Fortführungsfähigkeit für einen Zeitraum von mindestens zwölf Monaten ab dem Bilanzstichtag vorzunehmen
- text: 'Finanzwirtschaftliche Indikatoren für Zweifel (SER Anhang G): negatives Nettoumlaufvermögen, drohende Zahlungsunfähigkeit, Kapitalverlust oder Überschuldung; grössere Kredite
    werden bald fällig, ohne dass die Folgefinanzierung gelöst ist; Lieferanten oder Gläubiger verlangen Sicherheiten; ungünstige Kennzahlen; wesentliche Betriebsverluste oder Wertbeeinträchtigungen;
    die Dividende wird ausgesetzt; Kreditorenfristen sind überzogen. Die Liste ist nicht abschliessend. Ein einzelnes Anzeichen bedeutet nicht zwangsläufig eine wesentliche Unsicherheit.'
  quelle: ser-2022__anh-g-s138-2
  zitat: negatives Nettoumlaufvermögen, drohende Zahlungsunfähigkeit, Kapitalverlust oder Überschuldung
- text: 'Weitere Indikatoren (SER Anhang G):

    - Finanziell: Lieferanten ändern ihre Zahlungsbedingungen; Covenants werden verletzt.

    - Betrieblich: Schlüsselpersonen gehen ohne adäquaten Ersatz; ein Absatzmarkt, ein wichtiger Abnehmer oder ein Lizenznehmer geht verloren; Rohstoffengpässe.

    - Allgemein: Verstösse gegen Eigenkapitalvorschriften; hängige Verfahren mit möglicherweise nicht erfüllbaren Ansprüchen; nachteilige Änderungen des rechtlichen Umfelds.'
  quelle: ser-2022__anh-g-s139-1
  zitat: Verstösse gegen Eigenkapitalvorschriften (z. B. Art. 725 OR) oder andere gesetzliche Regelungen
- text: 'Zeitpunkt der Beurteilung: Der Abschlussprüfer prüft bei der Planung und am Ende der Revision (Jahresrechnung als Ganzes), ob Ereignisse oder Bedingungen die Fortführungsfähigkeit
    beeinträchtigen. Setzt sich die Unternehmensleitung nicht oder ungenügend mit der Fortführung auseinander, verlangt er eine sachgerechte und ausreichende Einschätzung.'
  quelle: ser-2022__anh-g-s139-2
  zitat: Der Abschlussprüfer muss sich im Rahmen der Prüfungsplanung sowie am Ende der Revision (Beurteilung der Jahresrechnung als Ganzen) überlegen
- text: 'Beurteilungszeitraum (HWP ER Rz 194): Der Prüfer legt denselben Zeitraum zugrunde wie die Unternehmensleitung. Ist er kürzer als zwölf Monate ab Bilanzstichtag, verlangt der
    Prüfer eine Ausdehnung. Für Ereignisse nach diesem Zeitraum ist nur eine Befragung der Unternehmensleitung vorgesehen.'
  quelle: hwp-er-2026__rz-0194-s225
  zitat: fordert der Abschlussprüfer die Unternehmensleitung auf, den Zeitraum auf mindestens zwölf Monate auszudehnen
- text: 'Nachweis (SER Anhang G Ziff. 2): Fehlt eine Einschätzung, bespricht der Prüfer mit der Unternehmensleitung die Gründe für die Fortführungsannahme. Ohne Zweifel genügt die Erklärung
    in der Vollständigkeitserklärung als Nachweis. Stellt der Prüfer Ereignisse oder Sachverhalte fest, welche die Annahme infrage stellen, verlangt er eine detailliertere, schriftlich
    dokumentierte Einschätzung.'
  quelle: ser-2022__anh-g-s140-1
  zitat: Ergeben sich keine Zweifel an der Fortführungsfähigkeit, genügt die Erklärung der Unternehmensleitung in der Vollständigkeitserklärung als Nachweis der erfolgten Einschätzung
    und der Beurteilung.
- text: 'Kritische Beurteilung (SER Anhang G): Der Prüfer würdigt die Einschätzung mit kritischer Grundhaltung (Vorgehen, Annahmen, Pläne). War das Unternehmen bisher rentabel und hat
    es raschen Zugang zu Mitteln, genügt normalerweise eine Beurteilung ohne detaillierte Prüfungshandlungen. Bei festgestellten erheblichen Zweifeln führt er besondere Prüfungshandlungen
    durch.'
  quelle: ser-2022__anh-g-s140-2
  zitat: Wurden jedoch Ereignisse oder Bedingungen festgestellt, die erhebliche Zweifel an der Fortführungsfähigkeit des Unternehmens aufwerfen können, führt der Abschlussprüfer besondere
    Prüfungshandlungen durch.
- text: 'Mögliche besondere Prüfungshandlungen (HWP ER Rz 196, mit Verweis auf SER Anhang G):

    - geplante Cashflows, Gewinne und Kennzahlen analysieren und mit der Unternehmensleitung diskutieren

    - den jüngsten Zwischenabschluss analysieren

    - die Bedingungen der Finanzverbindlichkeiten auf Verstösse durchsehen

    - die Protokolle von GV und Leitungsorganen durchsehen

    - Existenz, Gültigkeit und Durchsetzbarkeit finanzieller Unterstützung durch Nahestehende oder Dritte bestätigen

    - Pläne für nicht mehr ausführbare Kundenaufträge beurteilen

    - Ereignisse nach dem Bilanzstichtag beurteilen'
  quelle: hwp-er-2026__rz-0196-s225
  zitat: Analyse und Diskussion mit der Unternehmensleitung über geplante Cashflows, Gewinne und andere wichtige Kennzahlen
- text: 'Grenzen der eingeschränkten Revision (HWP ER Rz 197): Die Prüfungssicherheit ist nur begrenzt. Indizien einer gefährdeten Fortführung werden deshalb weniger wahrscheinlich entdeckt.
    Ein Beispiel ist die Verschlechterung der Zahlungsfristen: Sie wird erfragt, aber gegebenenfalls nicht durch eine Detailprüfung erhärtet.'
  quelle: hwp-er-2026__rz-0197-s226
  zitat: die Auskunft wird er ggf. aber nicht durch eine Detailprüfung erhärten
- text: 'Bewertung (HWP BuR Rz 44): Zu Fortführungswerten darf nur bilanziert werden, wenn weder Absicht noch Notwendigkeit besteht, das Unternehmen zu liquidieren oder die Geschäftstätigkeit
    wesentlich einzuschränken. Gefährdet wird die Fortführung durch eine beabsichtigte (Teil-)Liquidation, durch Illiquidität oder durch externe Gründe.'
  quelle: hwp-bur-2023__rz-0044-s066
  zitat: Zu Fortführungswerten darf also nur dann bilanziert werden, wenn weder die Absicht noch die Notwendigkeit besteht, das Unternehmen zu liquidieren oder dessen Geschäftstätigkeit
    wesentlich einzuschränken.
- text: 'Veräusserungswerte (HWP BuR Rz 975): Gemeint ist der Erlös, der beim Verkauf der Vermögenswerte einzeln oder in Gruppen zu erwarten ist (Netto-Marktwerte). Massgebend sind die
    Preise am Veräusserungsmarkt, nicht mehr die Fortführungswerte. Der Wert kann stark vom bisherigen Buchwert abweichen.'
  quelle: hwp-bur-2023__rz-0975-s383
  zitat: Dieser Veräusserungswert kann stark vom bisherigen Buchwert abweichen.
- text: 'Zahlungsunfähigkeit (HWP ER Rz 364): Bei Zahlungsunfähigkeit ist die Fortführungsfähigkeit nach Art. 958a OR nicht mehr gegeben. Die Umstellung von Fortführungs- auf Veräusserungswerte
    begründet dann oft eine Besorgnis der Überschuldung oder führt zu einer ausgewiesenen Überschuldung (Schnittstelle zu Art. 725–725b OR).'
  quelle: hwp-er-2026__rz-0364-s111
  zitat: Die Zahlungsunfähigkeit führt dazu, dass die Fortführungsfähigkeit nach Art. 958a OR nicht mehr gegeben ist
- text: 'Offenlegung (HWP ER Rz 199): Bestehen erhebliche Zweifel an der Fortführungsfähigkeit, müssen sie in der Jahresrechnung klar offengelegt werden. Das geschieht in aller Regel
    im Anhang und liegt in der Verantwortung der Unternehmensleitung.'
  quelle: hwp-er-2026__rz-0199-s226
  zitat: Eine solche Offenlegung erfolgt in aller Regel im Anhang der Jahresrechnung und liegt in der Verantwortung der Unternehmensleitung.
- text: 'Bericht, Fall «Annahme vertretbar, Unsicherheit ausreichend offengelegt» (SER Anhang G Ziff. 3): Die Prüfungsaussage bleibt nicht modifiziert. Im Revisionsbericht steht ein
    Zusatz, der die wesentlichen Unsicherheiten kurz beschreibt und auf den Anhang verweist (SER Anhang F Beispiel 10). Bestehen keine Unsicherheiten, gibt es keinen Zusatz, und die
    Anhangangabe kann unterbleiben.'
  quelle: ser-2022__anh-g-s141-1
  zitat: In diesem Fall ist ein Zusatz im Revisionsbericht anzubringen, in dem die wesentlichen Unsicherheiten kurz beschrieben werden und auf den Anhang der Jahresrechnung verwiesen
    wird
- text: 'Bericht, Fall «Anhangangabe unzureichend oder fehlend trotz Unsicherheit» (SER Anhang G Ziff. 3): Die Prüfungsaussage wird modifiziert, entweder eingeschränkt oder verneinend.'
  quelle: ser-2022__anh-g-s141-2
  zitat: Unzureichende oder fehlende Angaben zur Fortführungsproblematik im Anhang der Jahresrechnung trotz bestehenden Unsicherheiten erfordern eine Modifizierung der Prüfungsaussage
- text: 'Bericht, Fall «Unternehmensleitung verweigert die Einschätzung oder wählt einen Zeitraum unter Art. 958a Abs. 2 OR» (SER Anhang G Ziff. 3): Die Prüfungsaussage wird eingeschränkt,
    oder eine Prüfungsaussage ist unmöglich (SER Anhang F Beispiel 7: Fortführung kann wegen fehlender Unterlagen nicht beurteilt werden).'
  quelle: ser-2022__anh-g-s141-2
  zitat: In diesem Fall modifiziert der Abschlussprüfer die Prüfungsaussage (eingeschränkte oder Unmöglichkeit der Prüfungsaussage).
- text: 'Bericht, Fall «Fortführung zu verneinen, Jahresrechnung aber zu Fortführungswerten erstellt»: Eine verneinende Prüfungsaussage ist vor allem dann angebracht, wenn die Behebung
    des Mangels unmittelbare Rechtsfolgen hätte. HWP ER Rz 409 nennt dafür ausdrücklich die Umstellung der Wertbasis bei Gefährdung der Fortführungsfähigkeit. Die Formulierung zeigt
    Muster HWP ER «Fortführung und Wertbasis» (muster-hwp-er-2026__c032-2). Gegebenenfalls kommt ein Eventualzusatz zu Art. 725b OR hinzu (SER Anhang F).'
  quelle: hwp-er-2026__rz-0409-s276
  zitat: Umstellung der Wertbasis bei Gefährdung der Fortführungsfähigkeit
agent:
- 'revio 3.4 «Going concern» (Planung) und 6.3 «Ereignisse nach dem Bilanzstichtag und Going concern» (Beendigung) nur lesen (konzept-ki-revisionsagent-2026__c006-2). Die Arbeit dokumentiert
  der Agent in A1-205 (Going Concern, analytisch, vorbereiten) und für die Anhangangabe nach OR 958a Abs. 3 in T1-318. Zusammenhängend: A1-102 (Ereignisse nach dem Stichtag), A1-103
  (Vollständigkeitserklärung), A1-304 (Protokolle), P1-313 (Eigenkapital/OR 725).'
- 'Diese Unterlagen in M-Files suchen, sonst als Pendenz bzw. PBC-Vorschlag erfassen: Einschätzung des VR zur Fortführung (mindestens zwölf Monate ab Bilanzstichtag), Budget und Liquiditätsplan
  des Folgejahres, je nach Lage Zwischenabschluss oder Mehrjahresfinanzplanung, Kreditverträge mit Covenants, Bankzusagen, Finanzierungs- und Unterstützungszusagen, Rangrücktritte, GV-
  und VR-Protokolle, Buchungen der Folgeperiode, Vollständigkeitserklärung mit der Going-Concern-Klausel (hwp-bur-2023__rz-0045-s066; ser-2022__anh-e-s104-1).'
- 'Kennzahlen immer im Rechenmodul (rechne) ermitteln, nie im Kopf: Nettoumlaufvermögen, Jahres- und Vorjahresverlust, Eigenkapital, Kapitalverlust-Test nach OR 725a, Deckung der Verbindlichkeiten
  durch die Aktiven zu Fortführungswerten. Das Ergebnis mit der Indikatorenliste aus SER Anhang G bzw. HWP ER Rz 191–193 abgleichen (Cash Drain, Rückstände bei Löhnen, Sozialversicherungen
  oder Lieferanten: hwp-er-2026__rz-0191-s224). Die Liste ist nicht abschliessend, und ein Anzeichen allein ist keine wesentliche Unsicherheit (ser-2022__anh-g-s138-2).'
- Die Befragung der Unternehmensleitung (Einschätzung, Pläne, Finanzierung, Ereignisse nach den zwölf Monaten) führt der Agent nicht selbst. Er erfasst die Fragen als Pendenz bzw. in
  10.11 und wertet nur schriftliche Antworten aus (konzept-ki-revisionsagent-2026__c012-1). Der Status ist dann höchstens «teilweise bearbeitet».
- 'Ist die Einschätzung kürzer als zwölf Monate ab Bilanzstichtag oder fehlt sie trotz Indikatoren: Pendenz erfassen mit der Bitte um eine erweiterte bzw. detaillierte, schriftlich dokumentierte
  Einschätzung (hwp-er-2026__rz-0194-s225; ser-2022__anh-g-s140-1).'
- Ereignisse nach dem Bilanzstichtag bis zum Berichtszeitpunkt einbeziehen, denn die Fortführung wird auch auf den Berichtszeitpunkt hin beurteilt (hwp-er-2026__rz-0185-s223).
- 'Bewertung bei Umstellung auf Veräusserungswerte: Ausser bei der Überschuldungsbeurteilung nach OR 725b und bei der Liquidation des ganzen Unternehmens gelten die gesetzlichen Höchstbewertungsvorschriften
  weiter (hwp-bur-2023__rz-0045-s066). Rückstellungen für Einstellungsaufwand prüfen (O1/M3; hwp-er-2026__rz-0188-s223).'
- 'Schnittstelle Kapitalschutz: Ist die Fortführung nicht gegeben, genügt ein Zwischenabschluss zu Veräusserungswerten (OR 725b Abs. 1; or__art-725b-t1). Die Zwischenabschlüsse prüft
  die Revisionsstelle (OR 725b Abs. 2). Dazu die Themen Kapitalverlust und Überschuldung beiziehen; ein Hinweis bei Untätigkeit des VR ist zwingend (ser-2022__8-3-2-t1).'
- Fehlt die Anhangangabe zur Unsicherheit oder ist sie ungenügend, erfasst der Agent eine Notiz «Wesentliche Feststellungen». Zweifel an der Fortführung kommen in die Notiz «Schlussbesprechung»,
  weil sie gegenüber dem VR zu kommunizieren sind (hwp-er-2026__rz-0298-s250).
- 'Die Berichtsfolge entscheidet ausschliesslich der WP: nicht modifiziert, Zusatz, eingeschränkte oder verneinende Prüfungsaussage, Unmöglichkeit, Eventualzusatz zu OR 725b. Der Agent
  bereitet höchstens einen Textvorschlag als Notiz vor, gestützt auf SER Anhang F Beispiele 7 und 10 sowie Muster HWP ER (muster-hwp-er-2026__c026-2, __c032-2, __c033-2). Kein Visum,
  keine Unterzeichnung oder Datierung des Berichts.'
- Der Zusatz steht nach der Prüfungsaussage, verweist auf den Anhang und hält fest, dass die Prüfungsaussage nicht eingeschränkt ist (hwp-er-2026__rz-0432-s283; ser-2022__8-3-2-t3).
- 'Erscheint der Fortführungswille zweifelhaft, etwa durch Verkauf wesentlicher Betriebsteile ohne Liquidationsbeschluss, kann eine stille Liquidation bzw. Statutenverletzung vorliegen.
  Quelle ist eine Sekundärquelle (camponovo-2026-hinweispflichten__s080-1): Notiz an den WP, kein eigener Schluss.'
- 'Nur begrenzte Prüfungssicherheit: Dass der Bericht keine Unsicherheit erwähnt, garantiert die Fortführung nicht (ser-2022__anh-g-s139-1). ISA-CH 570 (SA-CH) und HWP OR nur ergänzend
  heranziehen; massgebend sind SER Anhang G und HWP ER III.2.4.3.'
