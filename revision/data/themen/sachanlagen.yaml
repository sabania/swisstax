kurz: 'Sachanlagen und immaterielle Werte: aktivieren nach OR 959 Abs. 2, höchstens zu Anschaffungs- oder Herstellungskosten bewerten, planmässig abschreiben, bei Werteinbussen wertberichtigen
  (OR 960a); zusätzliche Abschreibungen sind als stille Reserven zulässig. Aufwerten dürfen nur Grundstücke und Beteiligungen (OR 725c). ESTV-Sätze sind steuerliche Praxis. SER: Befragungen,
  Vorjahresvergleich, Abstimmung der Inventarliste (SER Anhang D h) bzw. des Anlagespiegels (G1/G2/I1-301; HWP ER Rz 266).'
aussagen:
- text: 'Aktivierungsfähigkeit (OR 959 Abs. 2): Ein Vermögenswert muss aktiviert werden, wenn das Unternehmen aufgrund vergangener Ereignisse darüber verfügen kann, ein Mittelzufluss
    wahrscheinlich ist und sein Wert verlässlich geschätzt werden kann. Andere Vermögenswerte dürfen nicht bilanziert werden.'
  quelle: or__art-959
  zitat: Als Aktiven müssen Vermögenswerte bilanziert werden, wenn aufgrund vergangener Ereignisse über sie verfügt werden kann, ein Mittelzufluss wahrscheinlich ist und ihr Wert verlässlich
    geschätzt werden kann.
- text: 'Unterhalt oder Investition: Unterhalt und Reparaturen gehen in der Regel in die Erfolgsrechnung. Wertvermehrende Investitionen, die den Nutzwert bzw. Netto-Marktwert nachhaltig
    erhöhen oder die Lebensdauer wesentlich verlängern, können aktiviert werden. Zu den Anschaffungskosten gehören auch Bezugs-, Einrichtungs-, Prüf- und Abnahmekosten. Rabatte werden
    abgezogen, handelsüblicher Skonto nicht (HWP BuR Rz 370).'
  quelle: hwp-bur-2023__rz-0370-s236
  zitat: Wertvermehrende Investitionen in bestehende Sachanlagen, die den Nutzwert bzw. Netto-Marktwert nachhaltig erhöhen oder die Lebensdauer wesentlich verlängern, können aktiviert
    werden.
- text: 'Immaterielle Werte, die nicht aktiviert werden dürfen: Gründungs-, Kapitalerhöhungs- und allgemeine Organisationskosten, Aus- und Weiterbildungskosten des Personals, Restrukturierungskosten
    sowie Forschungskosten (allgemeine Erkenntnisgewinnung, unspezifische Produktentwicklung) (HWP BuR Rz 411).'
  quelle: hwp-bur-2023__rz-0411-s243
  zitat: Nicht aktivierbar sind Gründungs- und Kapitalerhöhungs- oder allgemeine Organisationskosten, Aus- und Weiterbildungskosten des Personals sowie Restrukturierungskosten.
- text: 'Bewertung nach OR 960a: Die Ersterfassung erfolgt höchstens zu Anschaffungs- oder Herstellungskosten (Abs. 1), die Folgebewertung nicht darüber (Abs. 2). Der nutzungs- und altersbedingte
    Wertverlust wird durch Abschreibungen erfasst, andere Wertverluste durch Wertberichtigungen. Beides erfolgt nach den allgemein anerkannten kaufmännischen Grundsätzen, wird direkt
    oder indirekt bei den betreffenden Aktiven zulasten der Erfolgsrechnung abgesetzt und darf nicht unter den Passiven ausgewiesen werden (Abs. 3).'
  quelle: or__art-960a
  zitat: Der nutzungs- und altersbedingte Wertverlust muss durch Abschreibungen, anderweitige Wertverluste müssen durch Wertberichtigungen berücksichtigt werden.
- text: 'Stille Reserven (OR 960a Abs. 4): Zu Wiederbeschaffungszwecken und zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen
    vorgenommen werden. Zu den gleichen Zwecken kann davon abgesehen werden, nicht mehr begründete Abschreibungen und Wertberichtigungen aufzulösen.'
  quelle: or__art-960a
  zitat: Zu Wiederbeschaffungszwecken sowie zur Sicherung des dauernden Gedeihens des Unternehmens dürfen zusätzliche Abschreibungen und Wertberichtigungen vorgenommen werden.
- text: 'Aufwertung (OR 725c): Zur Behebung eines Kapitalverlusts (OR 725a) oder einer Überschuldung (OR 725b) dürfen Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs-
    oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden. Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve
    auszuweisen (Abs. 1). Die Aufwertung ist nur zulässig, wenn die Revisionsstelle schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten sind (Abs. 2).'
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten
    sind.
- text: 'Abschreibungsmethode: Zwischen den Abschreibungsarten (direkt oder indirekt; linear, degressiv oder leistungsabhängig) besteht in der schweizerischen Praxis ein Wahlrecht. Die
    gewählte Methode ist aber stetig anzuwenden (HWP BuR Rz 337). Einen Methodenwechsel erfasst der Agent deshalb als Befragungspunkt zur Stetigkeit.'
  quelle: hwp-bur-2023__rz-0337-s230
  zitat: Innerhalb der genannten Abschreibungsarten besteht in der schweizerischen Rechnungslegungspraxis ein Wahlrecht. Die gewählte Methode ist stetig anzuwenden.
- text: 'Nutzungsdauer immaterieller Werte: Die Abschreibungen bemessen sich nach der Nutzungsdauer. Abzustellen ist auf die wirtschaftliche Nutzungsdauer und nicht auf rechtliche Kriterien
    wie die urheberrechtliche Schutzfrist, wenn die rechtliche Frist länger als die wirtschaftliche Nutzungsdauer ist. Ist die Nutzungsdauer nicht genau bestimmbar, werden 5 Jahre empfohlen,
    in begründeten Fällen höchstens 20 Jahre. Lässt sich die Nutzungsdauer eindeutig bestimmen, darf sie 20 Jahre übersteigen (HWP BuR Rz 419).'
  quelle: hwp-bur-2023__rz-0419-s244
  zitat: Ist die Nutzungsdauer immaterieller Werte nicht genau bestimmbar, wird eine Abschreibungsdauer von fünf Jahren, in begründeten Fällen eine solche von höchstens zwanzig Jahren
    empfohlen.
- text: 'Wertbeeinträchtigung (Impairment): Gibt es Anzeichen für Werteinbussen, sind zusätzliche Wertberichtigungen zu bilden (OR 960a Abs. 3). Eine Vergleichsrechnung stellt den Buchwert
    dem erzielbaren Wert gegenüber. Der erzielbare Wert ist der höhere von Nutzwert und Netto-Marktwert (HWP BuR Rz 342).'
  quelle: hwp-bur-2023__rz-0342-s231
  zitat: Inwieweit solche Werteinbussen vorliegen, ist mit einer Vergleichsrechnung festzustellen. Dabei wird der Buchwert mit dem erzielbaren Wert verglichen. Der erzielbare Wert ist
    der höhere von Nutzwert und Netto-Marktwert.
- text: 'Abgänge und Veräusserungsgewinne: Zu- und Abgänge sind einzeln zu erfassen. Beim Abgang wird bei direkter Abschreibung der Restbuchwert ausgebucht, bei indirekter Abschreibung
    die Anschaffungskosten samt kumulierten Abschreibungen. Buchgewinne und -verluste gehören in die Erfolgsrechnung. Realisierte Buchgewinne dürfen nicht direkt mit bestehenden Sachanlagen
    verrechnet werden (HWP BuR Rz 329).'
  quelle: hwp-bur-2023__rz-0329-s228-t1
  zitat: Buchgewinne oder -verluste aus der Veräusserung von Anlagevermögen sind in der Erfolgsrechnung zu erfassen.
- text: 'Steuerliche Praxis der ESTV, nicht Handelsrecht: Abschreibungssätze für geschäftliche Betriebe nach ESTV-Merkblatt A 1995 (Stand 10.10.2023), wiedergegeben im Treuhand-Almanach
    2026. Das ist eine Sekundärquelle; das Original ist nicht im Wiki, für verbindliche steuerliche Aussagen ist es zu prüfen. Sätze auf dem Buchwert für mobile Sachanlagen: Geschäftsmobiliar
    und Einrichtungen 25 %, Apparate und Maschinen zur Produktion 30 %, Motorfahrzeuge aller Art 40 %, Büromaschinen 40 %, Datenverarbeitungsanlagen 40 %. Bei Abschreibung auf dem Anschaffungswert
    sind die Sätze zu halbieren.'
  quelle: treuhand-almanach-2026__s061-1
  zitat: Geschäftsmobiliar und Einrichtungen Apparate und Maschinen zur Produktion Motorfahrzeuge aller Art Büromaschinen Datenverarbeitungsanlagen 25 % 30 % 40 % 40 % 40 %
- text: 'ESTV-Sätze auf dem Buchwert (steuerliche Praxis, Merkblatt A 1995, gleiche Sekundärquelle) für Gebäude, jeweils ohne/mit Anteil Boden: Wohnhäuser 2 %/1,5 %, Geschäftshäuser
    4 %/3 %, Gastwirtschaft und Hotellerie 6 %/4 %, Fabrikgebäude und Lager 8 %/7 %. Mit Anteil Boden ist die Abschreibung nur bis zum Wert des Landes erlaubt.'
  quelle: treuhand-almanach-2026__s061-1
  zitat: Fabrikgebäude und Lager • Gebäude ohne Anteil Boden • Gebäude mit Anteil Boden* 8% 7% * Abschreibung nur bis zum Wert des Landes erlaubt.
- text: 'Leasing beim Leasingnehmer: Die Behandlung von Leasingverträgen verlangt vom bilanzierenden Unternehmen einen Ermessensentscheid. Zulässig sind die formaljuristische Auslegung
    (keine Bilanzierung) und die wirtschaftliche Auslegung (Nutzungsrecht und Leasingverbindlichkeit bilanzieren, vgl. HWP BuR Rz 396 und 399). Der Entscheid fällt je Gruppe gleichartiger
    Verträge, eine Anlehnung an FER 13 oder IFRS 16 ist zulässig. Die gewählte Bilanzierungspraxis ist im Anhang zu erläutern (HWP BuR Rz 397).'
  quelle: hwp-bur-2023__rz-0397-s241
  zitat: Beide oben ausgeführten Auslegungsvarianten (formaljuristisch oder wirtschaftlich) sind dabei zulässig.
- text: 'Anhangangabe zum Leasing (OR 959c Abs. 2 Ziff. 6): Offenzulegen ist der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen,
    die nicht innert zwölf Monaten ab Bilanzstichtag auslaufen oder gekündigt werden können. Massgebend sind also Restlaufzeit und Kündbarkeit.'
  quelle: or__art-959c-t2
  zitat: der Restbetrag der Verbindlichkeiten aus kaufvertragsähnlichen Leasinggeschäften und anderen Leasingverpflichtungen, sofern diese nicht innert zwölf Monaten ab Bilanzstichtag
    auslaufen oder gekündigt werden können
- text: 'SER Anhang D h), empfohlene Befragungen: Bewertungsgrundlagen, Abschreibungssätze und -methoden sowie deren stetige Anwendung; Abgrenzung von Unterhalt und Investition; Anschaffungen,
    Verkäufe und Erfassung realisierter Gewinne und Verluste; wesentliche, dauerhafte Wertbeeinträchtigungen; Eigentumsbeschränkungen. Analytisch wird mit dem Vorjahr verglichen: Bestände,
    Anschaffungen, Verkäufe, Abschreibungssätze und Abschreibungsaufwand.'
  quelle: ser-2022__anh-d-s082-1
  zitat: Vergleich der Bestände, der Anschaffungen, der Verkäufe sowie der Abschreibungssätze und des Abschreibungsaufwands mit dem Vorjahr
- text: 'SER Anhang D h), empfohlene Detailprüfung: Die Inventarliste (Anschaffungs- bzw. Herstellungskosten und kumulierte Abschreibungen je Anlage bzw. immateriellem Wert) wird mit
    der Jahresrechnung abgestimmt.'
  quelle: ser-2022__anh-d-s082-2
  zitat: Abstimmung der Inventarliste mit Angabe der Anschaffungs- bzw. Herstellungskosten und der kumulierten Abschreibungen der einzelnen Anlagen und immateriellen Werte mit der Jahresrechnung
- text: 'SER Anhang D h), weiter gehende Prüfungshandlungen: Sie kommen vor allem zum Einsatz, wenn aufgrund der empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden
    müssen oder ein erhöhtes inhärentes Risiko für eine Fehlaussage besteht. Als Detailprüfungen nennt die SER die Durchsicht der Bestands- und Abschreibungskonten im Hauptbuch auf ungewöhnliche
    Posten mit Belegprüfung sowie die Durchsicht der Bestands- und Unterhaltskonten in neuer Rechnung auf auffällige Beträge, die das Vorjahr betreffen.'
  quelle: ser-2022__anh-d-s082-2
  zitat: Vor allem, wenn aufgrund der durchgeführten empfohlenen Prüfungshandlungen wesentliche Fehlaussagen angenommen werden müssen oder ein erhöhtes inhärentes Risiko für eine Fehlaussage
- text: 'SER Anhang D h), weiter gehende Prüfungshandlungen (Fortsetzung): Durchsicht von Einkaufsfakturen, Leasing- und anderen Verträgen sowie weiteren Dokumenten zur Anschaffung oder
    Veräusserung (Vorhandensein der bilanzierten Werte) und die physische Bestandsaufnahme. Bewertungsgutachten sind nicht Bestandteil der eingeschränkten Revision, weil sie über diese
    hinausgehen.'
  quelle: ser-2022__anh-d-s083-1
  zitat: Physische Bestandsaufnahme Prüfungshandlungen, die nicht Bestandteil einer eingeschränkten Revision darstellen (Da über die eingeschränkte Revision hinausgehend) • Bewertungsgutachten
- text: Auswertungen des Kunden (Anlagenspiegel, Inventarlisten) übernimmt der Abschlussprüfer nicht unbesehen. Er stimmt sie mit der Finanzbuchhaltung oder den Nebenbüchern ab, prüft
    sie rechnerisch und prüft die sachliche Richtigkeit in der Regel anhand einer angemessenen Stichprobe nach (HWP ER Rz 266).
  quelle: hwp-er-2026__rz-0266-s244
  zitat: Der Abschlussprüfer geht nicht unbesehen von der Vollständigkeit und Richtigkeit solcher Auswertungen aus
- text: 'Folgen für den Bericht: Eine nicht modifizierte Prüfungsaussage ist nur möglich, wenn der Abschlussprüfer auf keine Sachverhalte stösst, aus denen er schliessen müsste, dass
    die Bewertung nicht OR 960–960e entspricht oder der Anhang die vorgeschriebenen Angaben nach OR 959c nicht vollständig und richtig enthält (HWP ER Rz 377). Diese Beurteilung trifft
    der WP.'
  quelle: hwp-er-2026__rz-0377-s269
  zitat: die Bewertung nicht den gesetzlichen Vorschriften entspricht (Art. 960 bis 960e OR).
agent:
- 'Mandatskontext fixieren, dann die Unterlagen aus M-Files holen: Anlagespiegel bzw. Anlagebuchhaltung (laufendes Jahr und Vorjahr), Inventarliste, Abschreibungsplan, Kaufverträge und
  Einkaufsfakturen der Zugänge, Leasingverträge, bei G2 Grundbuchauszüge und Versicherungsnachweise, bei I1 Verträge und Registerauszüge zu Patenten, Lizenzen und Marken. Fehlt eine
  Unterlage, die Notiz «Pendenz» mit Konto, Datum und Betrag erfassen.'
- 'G1-301/-302, G2-301/-302 und I1-301 vorbereiten (Abstimmung Anlagespiegel bzw. Inventarliste mit dem Hauptbuch): Anfangsbestand + Zugänge – Abgänge – Abschreibungen/Wertberichtigungen
  = Endbestand. Rechnen nur im Rechenmodul (rechne). Auswertungen des Kunden nicht unbesehen übernehmen, sondern mit Finanzbuchhaltung oder Nebenbüchern abstimmen, rechnerisch prüfen
  und in der Regel mit einer angemessenen Stichprobe nachprüfen (hwp-er-2026__rz-0266-s244). Sachanlagen und Abschreibungen zusammen prüfen (hwp-er-2026__rz-0058-s189). I1 hat keinen
  eigenen Schritt zur Abstimmung der Inventarliste; I1-302 ist ein WP-Schritt (siehe Grenzen).'
- 'G1/G2/I1-201 vorbereiten: Bestände, Zugänge, Abgänge, Abschreibungsaufwand und implizite Abschreibungssätze mit dem Vorjahr vergleichen. Satzsprünge oder einen Methodenwechsel als
  Befragungspunkt zur Stetigkeit erfassen (G1-107, G2-102, I1-102); die Antwort des Kunden auswerten, nicht selbst befragen.'
- ESTV-Sätze nur als Vergleichsgrösse nennen und immer als «steuerliche Praxis ESTV» bezeichnen. Fundstelle ist die Wiedergabe von Merkblatt A 1995 im Treuhand-Almanach (treuhand-almanach-2026__s061-1),
  also eine Sekundärquelle; das Original ist nicht im Wiki und für verbindliche steuerliche Aussagen zu prüfen. Die Sätze gelten auf dem Buchwert («Für Abschreibungen auf dem Anschaffungswert
  sind die genannten Sätze um die Hälfte zu reduzieren.»). Für immaterielle Werte nennt die Tabelle «Immaterielle Werte Lizenzen, Patente, Goodwill 40 %». Handelsrechtlich massgebend
  ist OR 960a. Höhere Abschreibungen sind als stille Reserven zulässig (OR 960a Abs. 4) und gehören in die Aufstellung der stillen Reserven (G1-321, G2-321, I1-321). KMU wenden oft den
  maximal möglichen steuerlichen Satz und degressive Methoden an (ef-2026-08-buchungslogik__s002-3). Steuerliche Folgen beurteilt der Agent nicht, er notiert sie höchstens als Punkt
  für die Schlussbesprechung.
- 'Weniger oder keine Abschreibungen gegenüber dem Vorjahr: Werden Abschreibungen wegen höherer Abschreibungen in Vorperioden unterlassen, ist das eine Auflösung stiller Reserven (hwp-bur-2023__rz-0341-s230).
  Planmässige Abschreibungen mit Verweis auf einen höheren Nutz- oder Verkehrswert zu unterlassen, ist unzulässig, «ausser es wurden vorgängig höhere Abschreibungen im Sinne der Bildung
  von stillen Reserven erfasst» (hwp-bur-2023__rz-0345-s231). In diesem Fall keine Feststellung, sondern Abgleich mit der Aufstellung der stillen Reserven (G1-321, G2-321, I1-321) und
  Vorbereitung von T1-305 (wesentliche Nettoauflösung im Anhang nach OR 959c Abs. 1 Ziff. 3). Nur wenn keine stillen Reserven nachgewiesen sind: Notiz «Wesentliche Feststellungen» mit
  begründetem Buchungsvorschlag, ohne zu verbuchen.'
- 'Hinweise auf Wertbeeinträchtigung (Impairment) aus Erfolgsrechnung und Kennzahlen ableiten: Verluste, stillgelegte Anlagen (hwp-bur-2023__rz-0373-s237), Liegenschaften, deren Nutzung
  die Vollkosten nicht nachhaltig deckt, schlechter Unterhalt (hwp-bur-2023__rz-0363-s235). Daraus Fragen für G1-105, G2-105 und I1-104 formulieren. Den erzielbaren Wert beurteilt der
  WP. Bewertungsgutachten (G1-401, G2-402, I1-404) nur auf Anweisung einholen, sie sind nicht Bestandteil der SER.'
- 'Unbebaute Grundstücke (G2): «Unbebaute Grundstücke unterliegen im Allgemeinen keinem nutzungsbedingten Wertverzehr, weshalb Abschreibungen normalerweise nicht erforderlich sind.»
  Wertberichtigungen können aber bei dauernden Werteinbussen nötig werden, z.B. durch Umzonung (hwp-bur-2023__rz-0361-s235). Fehlende planmässige Abschreibungen auf unbebautem Land sind
  deshalb für sich allein keine Feststellung; Hinweise auf Umzonung oder gesunkene Landpreise als Frage für G2-105 erfassen.'
- 'Abgrenzung Unterhalt/Investition: Ohne Anweisung die Befragung G1-103/G2-103 (Unterhalt vs. Wertvermehrung) vorbereiten und offensichtliche Auffälligkeiten aus der Kontenübersicht
  nur als Hinweis für den WP im Textfeld festhalten. Die Durchsicht der Konten (G1-303/304, G2-303/304, I1-302) und das Ermitteln wertvermehrender Beträge (G1-406, G2-409, I1-405) erst
  auf ausdrückliche Anweisung; ebenso die Beurteilung der Aktivierungsfähigkeit der Zugänge (G1-403, G2-403, I1-402). Grundlage: weitergehende Handlungen «nur auf Anweisung, physische
  Tätigkeiten nie» (konzept-ki-revisionsagent-2026__c012-1).'
- 'Abgänge: Veräusserungserfolg (Erlös – Restbuchwert) im Rechenmodul nachrechnen. Prüfen, dass Gewinne und Verluste nicht verrechnet sind (hwp-bur-2023__rz-0382-s238) und dass bedeutende
  Gewinne oder Verluste einzeln in der Erfolgsrechnung oder im Anhang erscheinen (hwp-bur-2023__rz-0380-s238). Schnittstelle zu SCH5 und T1.'
- 'Leasing: Leasingverträge aus M-Files zusammenstellen und für G1-320/G2-320 und T1-103 eine Liste vorbereiten (Vertrag, Restlaufzeit, Kündbarkeit, Restverpflichtung, Einstufung als
  Finanzierungs- oder operatives Leasing nach FER 13/3 nur als Vorschlag, hwp-bur-2023__rz-0387-s239). Ob bilanziert wird, entscheidet das Unternehmen nach Ermessen (hwp-bur-2023__rz-0397-s241).
  Prüfen, ob die Praxis erläutert ist («Die gewählte Bilanzierungspraxis ist im Anhang zu erläutern», hwp-bur-2023__rz-0397-s241) und ob der Restbetrag der Verpflichtungen angegeben
  ist, die «nicht innert zwölf Monaten ab Bilanzstichtag auslaufen oder gekündigt werden können» (or__art-959c-t2). Bilanzierte Leasingverbindlichkeiten nach Fristigkeit zuordnen (N1,
  hwp-bur-2023__rz-0406-s242). Beim Finanzierungsleasing ist das Recht am Aktivum ein Nutzungsrecht (ser-2022__4-3-2). Die Belegprüfung (G1-305, G2-305, I1-303) bleibt beim WP.'
- 'Eigentumsbeschränkungen (verpfändete Aktiven, Eigentumsvorbehalt, Grundpfand): Antworten zu G1-106/G2-106 mit der Anhangangabe nach OR 959c Abs. 2 Ziff. 9 abgleichen (T1-106; SER
  Anhang D u, ser-2022__anh-d-s097-1). G2-401 (Grundpfand gegenüber Hypothekarschulden) nur auf Anweisung.'
- 'Aufwertung (OR 725c): Eine Aufwertungsreserve unter der gesetzlichen Gewinnreserve oder einen Hinweis im Anhang erkennen und als Pendenz oder Punkt für die Schlussbesprechung melden.
  Aufwerten dürfen nur Grundstücke und Beteiligungen: «Nicht möglich ist eine Aufwertung damit z.B. bei Vorräten, mobilen Sachanlagen oder immateriellen Werten.» (hwp-bur-2023__rz-0886-s359).
  Angaben über Gegenstand und Betrag im Anhang in T1-319 vorbereiten (ser-2022__anh-d-s098-3), den Ausweis der Aufwertungsreserve in P1-311. Die schriftliche Bestätigung nach OR 725c
  Abs. 2 erteilt allein der WP.'
- 'Immaterielle Werte: Prüfen, ob sie im Anlagevermögen gesondert ausgewiesen sind (hwp-bur-2023__rz-0432-s247-t1). Die Aktivierung selbst erarbeiteter Werte als Befragungspunkt erfassen
  (I1-101, I1-103); ein Verzicht auf die Aktivierung ist vertretbar (hwp-bur-2023__rz-0413-s243). Die Beurteilung der Aktivierungsfähigkeit (I1-402) nur auf Anweisung. Originärer Goodwill
  ist nicht bilanzierungsfähig (hwp-bur-2023__rz-0427-s246). Prüfen, ob derivativer Goodwill aus einem Asset Deal planmässig abgeschrieben wird: «Ein solcher Goodwill ist innert einer
  angemessenen Frist planmässig abzuschreiben.» Impairment-only ist unzulässig, personenbezogener Goodwill höchstens 5 Jahre (hwp-bur-2023__rz-0429-s246). Goodwill aus einem Share Deal
  ist Teil der Beteiligung (H3, hwp-bur-2023__rz-0428-s246). Für die Nutzungsdauer gilt die wirtschaftliche statt der rechtlichen Dauer (z.B. Schutzfrist), «wenn Letztere länger als
  die wirtschaftliche Nutzungsdauer ist» (hwp-bur-2023__rz-0419-s244). Bei SaaS als Frage festhalten, ob eine Dienstleistung oder ein immaterieller Wert vorliegt (hwp-bur-2023__rz-0430-s246).
  Abweichungen als Notiz «Wesentliche Feststellungen» mit Buchungsvorschlag, ohne Verbuchung.'
- 'Anhang (G1-320, G2-320, I1-320, T1): Ein Anlagespiegel im Anhang ist freiwillig («kann im Anhang ein Anlagespiegel aufgeführt werden», hwp-bur-2023__rz-0379-s238). Prüfen, ob die
  beschriebenen Bewertungs- und Abschreibungsgrundsätze den Sachverhalt richtig wiedergeben (T1-302).'
- 'Grenzen: Beim Menschen bleiben die WP-Schritte (Katalog «nur Mensch»): G1-303 bis G1-306, G2-303 bis G2-306, I1-302 und I1-303, also die Durchsicht der Bestandes-, Abschreibungs-
  und Unterhaltskonten, die Belegprüfung von Einkaufsfakturen, Leasing- und Aktivierungsverträgen sowie die physische Bestandesaufnahme. Vorbereiten nur auf ausdrückliche Anweisung (offener
  Entscheid consis, konzept-ki-revisionsagent-2026__c012-1); die physische Bestandesaufnahme nimmt der Agent nie selbst vor. Kein Visum, kein ✓, keine abschliessende Beurteilung. Befragungsschritte
  höchstens «teilweise bearbeitet». SA-CH und HWP OR nur ergänzend heranziehen. Prüfungsaussage und Beurteilung der Wesentlichkeit liegen beim WP.'
