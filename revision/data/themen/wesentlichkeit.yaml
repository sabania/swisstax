kurz: 'Wesentlich ist jede Angabe, deren Weglassen oder Falschdarstellung Entscheide der Berichtsempfänger beeinflussen kann (SER 5.1). Der WP legt in der Planung quantitativ und qualitativ
  Gesamt-, Toleranzwesentlichkeit und Nichtaufgriffsgrenze fest (Richtwerte HWP ER: z.B. 3–10 % des bereinigten Gewinns vor Steuern, TW i.d.R. 50–75 %, NAG bis 5 %). Der Agent liest
  die Werte aus revio 3.3, ändert sie nie; nicht korrigierte Fehler und die Folgen für die Prüfungsaussage (SER 8.3.1) beurteilt der WP.'
aussagen:
- text: 'Begriff: Wesentlich ist jede Angabe in der Jahresrechnung, deren Weglassen oder Falschdarstellung die Entscheidungen der Berichtsempfänger beeinflussen kann. Professionelles
    Ermessen prägt sowohl die Festlegung der Wesentlichkeit als auch die Beurteilung von Fehlaussagen (SER Ziff. 5.1).'
  quelle: ser-2022__5-1
  zitat: Wesentlich ist jede Angabe in der Jahresrechnung, die, sofern sie weggelassen oder falsch dargestellt wird, den Berichtsempfänger der Jahresrechnung in seinen Entscheidungen
    beeinflussen kann.
- text: 'Festlegung in der Planung nach quantitativen und qualitativen Kriterien (SER Ziff. 5.2). Oft wird die quantitative Wesentlichkeit in Bezug auf den Gewinn vor Steuern bestimmt.
    Ist das Ergebnis gesteuert, z.B. durch Bildung oder Auflösung stiller Reserven, ist vom effektiven Ergebnis auszugehen: «Sind die Ergebnisse gesteuert – z. B. durch Bildung oder
    Auflösung von stillen Reserven – ist vom effektiven Ergebnis auszugehen.» ^[ser-2022__5-2-t1]. Andere Bezugsgrössen wie Eigenkapital, Umsatz oder Aufwendungen kommen z.B. in Verlustsituationen
    in Frage.'
  quelle: ser-2022__5-2-t1
  zitat: Oft wird die quantitative Wesentlichkeit in Bezug auf den Gewinn vor Steuern als eine Bezugsgrösse der wirtschaftlichen Tätigkeit
- text: 'Qualitative Wesentlichkeit (SER Ziff. 5.2): Bei drohender Illiquidität oder Überschuldung kann eine tiefere Wesentlichkeit angezeigt sein. Schon ein geringer Fehler, der einen
    Gewinn in einen Verlust kippt, kann wesentlich sein; massgebend ist, ob die Korrektur zu einer grundsätzlich anderen Gesamtaussage führt. HWP ER Rz 44 nennt zusätzlich Aktionärsbindungsverträge,
    Finanzierungsvereinbarungen und geplante Ausschüttungen: «Zu beachten sind ferner Bestimmungen in Aktionärsbindungsverträgen, Finanzierungsvereinbarungen oder eine geplante Ausschüttung»
    ^[hwp-er-2026__rz-0044-s186]. In diesen Fällen wird die Wesentlichkeit in der Regel tiefer angesetzt, häufig mit dem Eigenkapital als Bezugsgrösse: «Als Bezugsgrösse für die Bestimmung
    der Wesentlichkeit wird hierbei häufig das Eigenkapital herangezogen.» ^[hwp-er-2026__rz-0044-s186]'
  quelle: ser-2022__5-2-t1
  zitat: So kann beispielsweise in Situationen drohender Illiquidität oder Überschuldung eine tiefere Wesentlichkeit angezeigt sein.
- text: 'Richtwert HWP ER (Abb. 20) – gewinnorientiertes, profitables Unternehmen mit stabilen Umsätzen und Jahresergebnissen: Gesamtwesentlichkeit 3–10 % des Jahresgewinns vor Steuern
    nach Berücksichtigung allfälliger stiller Reserven (auch Durchschnittswerte möglich).'
  quelle: hwp-er-2026__rz-0042-s185-t1
  zitat: 3 % – 10 % des bereinigten Jahresgewinns vor Steuern
- text: 'Richtwert HWP ER (Abb. 20) – gewinnorientiertes Unternehmen in Verlustsituation: Gesamtwesentlichkeit 3–5 % des Eigenkapitals.'
  quelle: hwp-er-2026__rz-0042-s185-t1
  zitat: Bestimmung der Gesamtwesentlichkeit aufgrund eines angemessenen Prozentsatzes des Eigenkapitals 3 % – 5 % des Eigenkapitals
- text: 'Richtwert HWP ER (Abb. 20) – gewinnorientiertes, anlageintensives Unternehmen (z.B. Holding mit überwiegend Beteiligungen und Finanzanlagen), das in Vorperioden u.a. auch Jahresverluste
    verzeichnet hat: Gesamtwesentlichkeit 1–3 % der Bilanzsumme.'
  quelle: hwp-er-2026__rz-0042-s185-t1
  zitat: aufgrund eines angemessenen Prozentsatzes der Bilanzsumme 1 % – 3 % der Bilanzsumme
- text: 'Richtwert HWP ER (Abb. 20) – gewinnorientiertes Unternehmen mit volatilen Jahresergebnissen: Gesamtwesentlichkeit 1–3 % der Nettoerlöse aus Lieferungen und Leistungen (Umsätze);
    Durchschnittswerte können unter Umständen angemessen sein: «Durchschnittswerte können unter U mständen angemessen sein» ^[hwp-er-2026__rz-0042-s185-t1] (Wortzerlegung «U mständen»
    aus dem PDF-Layout).'
  quelle: hwp-er-2026__rz-0042-s185-t1
  zitat: 1 % – 3 % der Nettoerlöse aus Lieferungen und Leistungen (Umsätze)
- text: 'Richtwerte HWP ER (Abb. 20) – nicht gewinnorientiertes Unternehmen: Gesamtwesentlichkeit 1–3 % der Gesamtaufwendungen (die Zeilenbeschriftung steht wegen Seitenumbruchs am Ende
    von …-t1). Neu gegründetes Unternehmen (Start-up) mit geringen oder keinen Umsätzen und in erster Linie Entwicklungskosten: 2–5 % der operativen Aufwendungen: «2 % – 5 % der operativen
    Aufwendungen» ^[hwp-er-2026__rz-0042-s185-t2].'
  quelle: hwp-er-2026__rz-0042-s185-t2
  zitat: Bestimmung der Gesamtwesentlichkeit aufgrund eines angemessenen Prozentsatzes der Gesamtaufwendungen 1 % – 3 % der Gesamt aufwendungen
- text: Die Prozentsätze sind Richtwerte, die Bezugsgrössen nur Orientierungshilfen; Abweichungen sind zulässig. Eher am oberen Ende der Bandbreite bei wenigen, langfristig orientierten
    Eigentümern, geringer Fremdverschuldung oder stabilen Ertragsverhältnissen.
  quelle: hwp-er-2026__rz-0043-s186
  zitat: Der Abschlussprüfer wird den angemessenen Prozentsatz eher am oberen Ende der jeweiligen Bandbreite festlegen
- text: 'Gesamtwesentlichkeit, spezifische Wesentlichkeitsgrenzen und Toleranzwesentlichkeit (SER Ziff. 5.2): Die Wesentlichkeit wird für die Jahresrechnung als Ganzes und für einzelne
    Positionen berücksichtigt. Weil einzeln unter der Gesamtwesentlichkeit liegende Fehlaussagen zusammen mit anderen unentdeckten oder nicht korrigierten Fehlaussagen wesentlich sein
    können (Aggregationsrisiko), legt der Prüfer eine tiefere Toleranzwesentlichkeit fest: «Um diesem sogenannten Aggregationsrisiko Rechnung zu tragen, legt der Abschlussprüfer eine
    entsprechend tiefere Toleranzwesentlichkeit fest.» ^[ser-2022__5-2-t2]. Können Fehlaussagen in bestimmten Geschäftsvorfällen, Kontensalden oder Abschlussangaben die Entscheide der
    Berichtsempfänger beeinflussen, werden tiefere spezifische Wesentlichkeitsgrenzen festgelegt.'
  quelle: ser-2022__5-2-t2
  zitat: Der Abschlussprüfer berücksichtigt die Wesentlichkeit sowohl bei der Jahresrechnung als Ganzem (Gesamtwesentlichkeit) als auch bei einzelnen Positionen
- text: Die Toleranzwesentlichkeit beträgt in der Regel 50–75 % der Gesamtwesentlichkeit, je nach Risikobeurteilung, Kenntnis der Gesellschaft, Fehlaussagen aus Vorjahren und Schätzunsicherheiten
    (Richtwert HWP ER). Sie dient der Risikobeurteilung auf Aussagenebene und der Festlegung von Art, Zeitpunkt und Umfang der Prüfungshandlungen; bei Bedarf werden spezifische Toleranzwesentlichkeiten
    festgelegt.
  quelle: hwp-er-2026__rz-0050-s187
  zitat: beträgt die Toleranzwesentlichkeit in der Regel zwischen 50 % und 75 % der Gesamtwesentlichkeit
- text: '«Wesentliche» Jahresabschlussposten, die nicht nur mit Befragungen geprüft werden dürfen (SER Ziff. 6.1.1), sind Posten über der Toleranzwesentlichkeit. Beispiel HWP ER: GW
    500 000, TW 75 % = 375 000; Forderungen LuL 400 000 > TW → Befragung mit analytischen und/oder Detailprüfungen ergänzen; liegt der Posten unter der TW und bestehen keine sonstigen
    Risiken, kann sich der Prüfer auf Befragungen abstützen.'
  quelle: hwp-er-2026__rz-0105-s198
  zitat: Der Begriff der Wesentlichkeit bezieht sich in diesem Zusammenhang auf die sogenannte Toleranzwesentlichkeit
- text: 'Positionen mit vernachlässigbarem Risiko unterhalb der Toleranzwesentlichkeit bleiben üblicherweise ungeprüft – qualitative Überlegungen vorbehalten (HWP ER Rz 60). Auch eine
    betragsmässig geringe Position kann eine wesentliche Fehlaussage bewirken (z.B. Vollständigkeit einer im Betrag unbedeutenden Rückstellung). Ebenso SER Ziff. 4.2: «Auch eine betragsmässig
    kleine Position in der Jahresrechnung kann eine wesentliche Fehlaussage beinhalten.» ^[ser-2022__4-2]'
  quelle: hwp-er-2026__rz-0060-s190
  zitat: auch eine im Betrag geringe Position der Jahresrechnung eine wesentliche Fehlaussage bewirken kann
- text: 'Nichtaufgriffsgrenze (NAG) nach SER Ziff. 5.3: Fehlaussagen, die so gering sind, dass auch ihre Summe voraussichtlich unwesentlich ist, werden nicht in die Zusammenstellung
    der Fehlaussagen aufgenommen. HWP ER Rz 51: Die NAG liegt deutlich unter der Gesamtwesentlichkeit; Richtwert HWP ER (kein SER-Wert) bis zu 5 % der Gesamtwesentlichkeit: «Sie kann
    bis zu 5 % der Gesamtwesentlichkeit betragen.» ^[hwp-er-2026__rz-0051-s187]'
  quelle: ser-2022__5-3
  zitat: mit Ausnahme jener, die derart gering sind, dass auch ihre Summe voraussichtlich unwesentlich sein wird (Nichtaufgriffsgrenze)
- text: 'Illustratives Beispiel HWP ER (Abb. 21, Beträge in 1000 CHF, im Einzelfall anzupassen): bereinigter Gewinn vor Steuern als Bezugsgrösse, wegen Hochrechnung mit Sicherheitsabschlag
    5 % → Basis 950; GW 7 % = 67 (Herleitung in …-t1: «Gesamtwesentlichkeit hier bei 7 % des e rwarteten Jahresgewinns vor Steuern» ^[hwp-er-2026__rz-0052-s188-t1]); TW 60 % = 40; NAG
    5 % = 3; Fehlaussagen über CHF 3000 werden festgehalten. Layout: «6 7» und «4 0» sind im Chunk zerlegte Zahlen, einzelne Tabellenbeträge fehlen – Beträge im Original raw/hwp-er-2026.pdf,
    S. 188–189 prüfen.'
  quelle: hwp-er-2026__rz-0052-s188-t2
  zitat: Die Toleranzwesentlichkeit wird auf 60 % der Gesamtwesentlichkeit festgelegt.
- text: 'Während der Prüfung: Liegt die Summe der einzelnen Fehler über oder nahe bei der Gesamt- bzw. Toleranzwesentlichkeit, führt der Prüfer in der Regel weitergehende Prüfungshandlungen
    durch und fordert das Management zur Korrektur auf (HWP ER, im Beispiel Abb. 21). Ergeben sich neue Erkenntnisse, wird die Wesentlichkeit erneut auf ihre Angemessenheit beurteilt
    und bei Bedarf angepasst: «Gelangt der Abschlussprüfer im Laufe der eingeschränkten Revision zu neuen Erkenntnissen, wird er die Wesentlichkeit erneut auf ihre Angemessenheit hin
    beurteilen» ^[hwp-er-2026__rz-0047-s186].'
  quelle: hwp-er-2026__rz-0052-s188-t2
  zitat: Liegt die Summe der einzelnen Fehler über oder nahe bei den im ersten und zweiten Schritt festgelegten Grössen
- text: 'Beurteilung festgestellter Fehlaussagen (SER Ziff. 5.3): Fehlaussagen über der NAG werden laufend in einer Zusammenstellung nachgeführt und der Unternehmensleitung in der Regel
    zur Korrektur vorgeschlagen. Wird die Korrektur verweigert, beurteilt der Prüfer, ob die Jahresrechnung dadurch eine wesentliche Fehlaussage vermittelt; falls ja, modifiziert er
    die Prüfungsaussage. Ob eine Feststellung wesentlich ist, liegt im professionellen Ermessen des Prüfers: «Die Beurteilung, ob eine Feststellung wesentlich ist, liegt im professionellen
    Ermessen des Abschlussprüfers.» ^[hwp-er-2026__rz-0053-s189]'
  quelle: ser-2022__5-3
  zitat: Wird diese Korrektur verweigert, so muss der Abschlussprüfer beurteilen, ob die Jahresrechnung dadurch eine wesentliche Fehlaussage vermittelt.
- text: 'Beurteilungsmassstab für nicht korrigierte Fehlaussagen (HWP ER Rz 56, Abb. 22, auf Basis des Beispiels Abb. 21): Fehlaussagen unter der NAG (3000 CHF) können – qualitative
    Faktoren vorbehalten – ignoriert werden; Fehlaussagen über der NAG werden in der Zusammenstellung erfasst. Liegen sie aggregiert unter der Gesamtwesentlichkeit (67 000 CHF), führt
    dies in der Regel nicht zu einer Modifizierung der Prüfungsaussage. Eine Fehlaussage in einer einzelnen Position wird an der Toleranzwesentlichkeit gemessen; ist sie materiell, wird
    die Prüfungsaussage in der Regel in Bezug auf diese Position – unter Angabe der Ursache – modifiziert: «Ist die Fehlaussage (in Bezug auf die Toleranzwesentlichkeit) materiell» ^[hwp-er-2026__rz-0056-s189].
    Ebenso Rz 55: «ist die Prüfungsaussage in Bezug auf diese Positionen in der Regel einzuschränken» ^[hwp-er-2026__rz-0055-s189].'
  quelle: hwp-er-2026__rz-0056-s189
  zitat: Sofern sie aggregiert unter 67 000 CHF liegen und nicht korrigiert werden
- text: 'Folgen für den Bericht (SER Ziff. 8.3.1 Bst. b): Ist der Prüfer auf Sachverhalte gestossen, nach denen die Jahresrechnung nicht frei von wesentlichen Fehlaussagen ist (festgestellter
    Sachverhalt), oder muss er solche annehmen, weil er mit den im SER vorgesehenen Prüfungshandlungen keine ausreichenden Nachweise erlangen kann (angenommener Sachverhalt), sind sie
    im Revisionsbericht darzulegen, sofern der Kunde die Fehlaussagen nicht korrigiert; die (mögliche) Auswirkung ist – sofern praktikabel – zu quantifizieren. Folge ist (i) eine eingeschränkte
    oder (ii) eine verneinende Prüfungsaussage (Gesamtbild grundlegend verändert oder Antrag über die Verwendung des Bilanzgewinns in wesentlichem Ausmass nicht gesetzes- bzw. statutenkonform).
    (iii) Gar keine Prüfungsaussage ist nur bei einem angenommenen Sachverhalt vorgesehen: «gar keine Prüfungsaussage zu machen, falls die mögliche Auswirkung des angenommenen Sachverhalts»
    ^[ser-2022__8-3-1-t3]. HWP ER Rz 390: angenommener Sachverhalt und Beschränkung des Prüfungsumfangs wirken gleich auf den Bericht: «Sowohl der angenommene Sachverhalt wie auch die
    Beschränkung des Prüfungsumfangs haben die gleichen Auswirkungen auf den Revisionsbericht» ^[hwp-er-2026__rz-0390-s272].'
  quelle: ser-2022__8-3-1-t2
  zitat: die (mögliche) Auswirkung auf die Jahresrechnung und/oder den Antrag über die Verwendung des Bilanzgewinns zu quantifizieren
- text: 'Agent (intern): revio 4.0 berechnet die Wesentlichkeit unter 3.3 aus Bezugsgrösse, Prozentsatz und Begründung; der Agent liest sie und ändert sie nie. Toleranzwesentlichkeit
    (Konzept: 75 %) steuert Prüfumfang und Stichprobe, Differenzen unter der NAG (Konzept: 5 %) werden nur protokolliert, die Gesamtwesentlichkeit ist Massstab für «Wesentliche Feststellungen»;
    die Summe nicht korrigierter Fehler beurteilt der Mensch in 6.1.'
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: Der Agent liest die Wesentlichkeit aus 3.3 und ändert sie nie
agent:
- 'Zu Beginn (Mandatskontext) aus revio 3.3 lesen: Bezugsgrösse und deren Betrag, Prozentsatz, Begründung, Gesamtwesentlichkeit, Toleranzwesentlichkeit, NAG sowie erfasste qualitative
  Faktoren und besondere Umstände. Nie ändern, nie selbst neu festlegen; in jedem Prüfschritt-Textfeld die verwendeten Werte nennen. ^[konzept-ki-revisionsagent-2026__c014-1]'
- 'Festlegung plausibilisieren (nur Hinweis, kein Entscheid): Passt die Bezugsgrösse zum Unternehmensmerkmal gemäss HWP ER Abb. 20 (profitabel → bereinigter Gewinn vor Steuern; Verlust
  → Eigenkapital; Holding/anlageintensiv → Bilanzsumme; volatil → Umsatz; nicht gewinnorientiert → Gesamtaufwand; Start-up → operativer Aufwand)? Liegt der Prozentsatz in der Bandbreite
  oder ist die Abweichung begründet? Ist der Gewinn um Bildung/Auflösung stiller Reserven bereinigt (Abgleich mit 10.3 Stille Reserven)? Passen Bezugsgrösse, Prozentsatz und Begründung
  nicht zusammen → Pendenz an den WP. ^[hwp-er-2026__rz-0042-s185-t1] ^[hwp-er-2026__rz-0042-s185-t2] ^[ser-2022__5-2-t1] ^[konzept-ki-revisionsagent-2026__c014-1]'
- Bezugsgrösse aus 3.3 im Rechenmodul (`rechne`) mit der importierten Jahresrechnung (1.1) abgleichen, nie im Kopf rechnen. Weicht der definitive Wert deutlich von der Planungsgrösse
  ab (z.B. Hochrechnung) oder gibt es neue Erkenntnisse (Verlust statt Gewinn, Kapitalverlust), Pendenz «Wesentlichkeit überprüfen» mit Berechnung erfassen; die Anpassung entscheidet
  der WP. Nach einer Änderung in 3.3 betroffene Prüfschritte neu beurteilen und im Rapport kennzeichnen. ^[hwp-er-2026__rz-0047-s186] ^[konzept-ki-revisionsagent-2026__c014-1]
- 'Qualitative Faktoren aktiv suchen: drohende Illiquidität oder Überschuldung (SER 5.2, HWP ER Rz 44), Ergebnis nahe null (Kippen Gewinn/Verlust), Finanzierungsvereinbarungen/Covenants,
  Aktionärsbindungsvertrag, geplante Ausschüttung. Zusätzlich im Rechenmodul prüfen: Kapitalverlust nach OR 725a Abs. 1 («die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe
  aus Aktienkapital» ^[or__art-725a]) und begründete Besorgnis einer Überschuldung nach OR 725b Abs. 1 («Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht
  mehr durch die Aktiven gedeckt sind» ^[or__art-725b-t1]). Der Kapitalverlust als Wesentlichkeitsfaktor ist eine Ableitung des Agenten (SER 5.2 und HWP ER Rz 44 nennen nur Illiquidität
  und Überschuldung) und so zu kennzeichnen. Sind die Faktoren in 3.3 erfasst, auch kleinere Abweichungen melden; sind sie erkennbar, in 3.3 aber nicht berücksichtigt → Pendenz bzw.
  Notiz «Schlussbesprechung» an den WP. ^[ser-2022__5-2-t1] ^[hwp-er-2026__rz-0044-s186] ^[konzept-ki-revisionsagent-2026__c014-1]'
- 'Prüfumfang je Prüffeld: Saldo im Rechenmodul mit der Toleranzwesentlichkeit vergleichen. Über TW: nie nur Befragung und in der Regel nicht nur Analytik – mit angemessenen Detailprüfungen
  ergänzen. Unter TW mit vernachlässigbarem Risiko ist ein reduzierter Umfang vertretbar, inhärente Risiken trotzdem beachten (z.B. Vollständigkeit Rückstellungen M3/O1). Ob Prüfschritte
  entfallen, entscheidet der WP (3.1/3.5). Begründung im Textfeld. ^[hwp-er-2026__rz-0105-s198] ^[hwp-er-2026__rz-0111-s199-t1] ^[hwp-er-2026__rz-0060-s190] ^[ser-2022__4-2]'
- 'Auswahl bei Detailprüfungen: Repräsentative Stichprobenverfahren sind ausgeschlossen (SER 6.1.3), also weder statistische noch nicht statistische Stichprobenverfahren mit Schluss
  auf die Grundgesamtheit: «Statistische und nicht statistische Stichprobenverfahren, welche eine Schlussfolgerung über die Grundgesamtheit zu verschaffen vermögen» ^[hwp-er-2026__rz-0264-s243].
  Stattdessen bewusste Auswahl bestimmter Elemente (hoher Wert, Schlüsselelemente) oder Auswahl aller Elemente bei einer kleinen Anzahl Elemente mit hohem Wert bzw. bedeutsamem Risiko.
  Die Standardauswahl des Agenten (alle Posten über TW, ungewöhnliche Posten, risikobasiert aus 3.1) ist ein offener Entscheid von consis – bis dahin als Vorschlag kennzeichnen und Vorgaben
  des WP je Mandat/Prüffeld übernehmen. ^[ser-2022__6-1-3] ^[hwp-er-2026__rz-0261-s243] ^[hwp-er-2026__rz-0260-s243] ^[konzept-ki-revisionsagent-2026__c015-2]'
- 'Analytische Prüfungshandlungen: Die tolerierbare Abweichung zwischen Erwartungswert und Ausweis legt in HWP ER der Abschlussprüfer fest, gestützt auf Toleranzwesentlichkeit und Erfahrung:
  «aufgrund der an anderer Stelle definierten Toleranzwesentlichkeit und aufgrund der Erfahrung des Abschlussprüfers» ^[hwp-er-2026__rz-0111-s199-t1] (Beispiel Zinserträge: 10 000 CHF).
  Leitet der Agent sie aus der TW ab, ist der Wert als Vorschlag zu kennzeichnen; eine Vorgabe des WP je Mandat oder Prüffeld geht vor. Wert im Textfeld angeben; grössere Abweichungen
  als Befragung (Pendenz) klären oder mit Detailprüfung ergänzen.'
- 'Differenzen: unter der NAG nur im Textfeld protokollieren, unter Berücksichtigung allfälliger qualitativer Faktoren: «unter Berücksichtigung allfälliger qualitativer Faktoren – ignoriert
  werden» ^[hwp-er-2026__rz-0056-s189]. Über der NAG kumulieren und laufend beurteilen (HWP ER Rz 53), im Rechenmodul aufsummieren. Dass jede Differenz über der NAG als Notiz «Wesentliche
  Feststellungen» (Konto, Datum, Betrag, begründeter Buchungsvorschlag, keine Verbuchung) erfasst wird, ist eine Auslegung des Agenten – das Konzept nennt die Gesamtwesentlichkeit nur
  als «Massstab für Wesentliche Feststellungen»; im Rapport so kennzeichnen und bei consis als offenen Punkt bestätigen lassen. ^[hwp-er-2026__rz-0053-s189] ^[konzept-ki-revisionsagent-2026__c014-1]'
- 'Warnschwelle: Die kumulierten Feststellungen über der NAG laufend im Rechenmodul mit TW und GW vergleichen. Liegt die Summe über oder nahe bei TW bzw. GW, sofort Pendenz an den WP
  (weitergehende Prüfungshandlungen und Korrekturaufforderung an das Management entscheidet der WP): «Liegt die Summe der einzelnen Fehler über oder nahe bei den im ersten und zweiten
  Schritt festgelegten Grössen» ^[hwp-er-2026__rz-0052-s188-t2]. Was «nahe» heisst, nennt die Quelle nicht in Zahlen; Schwelle beim WP erfragen.'
- 'A1-203 (Auswirkung nicht korrigierter Fehler) nur vorbereiten: Liste der Feststellungen über der NAG mit Summen je Position und gesamt; im Rechenmodul die Summe mit der GW und die
  einzelne Position mit der TW vergleichen (Massstab HWP ER Rz 56, Abb. 22); die (mögliche) Auswirkung auf Jahresrechnung und Antrag über die Verwendung des Bilanzgewinns quantifizieren
  (SER 8.3.1 Bst. b: «die (mögliche) Auswirkung auf die Jahresrechnung und/oder den Antrag über die Verwendung des Bilanzgewinns zu quantifizieren» ^[ser-2022__8-3-1-t2]); Hinweise auf
  qualitative Aspekte und auf unkorrigierte systematische Fehler aus Vorjahren (HWP ER Rz 57). Bereich 6.1 «Nicht nachgebuchte Fehler» nur lesen. Ob die nicht korrigierten Fehler wesentlich
  sind und ob die Prüfungsaussage eingeschränkt oder verneinend ausfällt, entscheidet der WP (SER 8.3.1 Bst. b i/ii). Keine Prüfungsaussage gibt es nur bei einem angenommenen Sachverhalt
  bzw. einer Beschränkung des Prüfungsumfangs: «gar keine Prüfungsaussage zu machen, falls die mögliche Auswirkung des angenommenen Sachverhalts» ^[ser-2022__8-3-1-t3]. ^[hwp-er-2026__rz-0056-s189]
  ^[hwp-er-2026__rz-0057-s189] ^[hwp-er-2026__rz-0390-s272] ^[hwp-er-2026__rz-0408-s276] ^[konzept-ki-revisionsagent-2026__c006-2]'
- Die Konzept-Standardwerte (TW 75 %, NAG 5 %) liegen am oberen Ende der HWP-ER-Bandbreiten (TW i.d.R. 50–75 %, NAG bis 5 %). Bei erhöhtem Risiko (3.1), Fehlern in Vorjahren oder hohen
  Schätzunsicherheiten nicht selbst anpassen, sondern den WP mit Verweis auf HWP ER Rz 50 fragen (Pendenz). ^[hwp-er-2026__rz-0050-s187] ^[hwp-er-2026__rz-0051-s187]
- 'Abgrenzung: Der Rechnungslegungsgrundsatz «Sie muss das Wesentliche enthalten» (OR 958c Abs. 1 Ziff. 4) und Offenlegungsschwellen (z.B. Nettoauflösung stiller Reserven «wesentlich
  günstiger»; kippt das Ergebnis von Verlust zu Gewinn, ist die relative Höhe nicht allein ausschlaggebend) sind nicht dasselbe wie die Prüfungswesentlichkeit aus 3.3. ^[or__art-958c]
  ^[hwp-bur-2023__rz-0675-s298]'
- 'Dokumentation: Wesentlichkeitsüberlegungen sowie Fehlaussagen und ihre Behandlung gehören in die Jahresakten. Der Agent dokumentiert die Anwendung je Prüfschritt (Werte, Vergleich,
  Auswahl, Ergebnis); die Festlegung bleibt Sache des WP. ^[ser-2022__7-2]'
- 'Kommunikation: Korrekturvorschläge und Fehlaussagen über der NAG teilt der WP der Unternehmensleitung bzw. dem VR mit. Der Agent sammelt die Punkte in der Notiz «Schlussbesprechung»
  und schickt keine E-Mail an Kunden. ^[hwp-er-2026__rz-0298-s250] ^[hwp-er-2026__rz-0056-s189]'
- SA-CH (ISA-CH 320/450) und HWP OR nur ergänzend heranziehen (z.B. NAG als Trivialitätsmass; Gesamtwesentlichkeit vor der Beurteilung nicht korrigierter Fehler überprüfen) und als «ordentliche
  Revision, ergänzend» kennzeichnen; massgebend sind SER und HWP ER. ^[hwp-or-2024__rz-0141-s176] ^[hwp-or-2024__rz-0150-s179]
- 'Layout: Die Beispieltabelle HWP ER Abb. 21 (hwp-er-2026__rz-0052-s188-t1/-t2) hat im Chunk fehlende Beträge und zerlegte Zahlen («6 7», «4 0»). Vor einem Zitat der Beispielwerte das
  Original raw/hwp-er-2026.pdf, S. 188–189 prüfen.'
