    zitat: Der Abschlussprüfer formuliert zuerst seine Erwartung.
  - quelle: hwp-er-2026__rz-0110-s199
    zitat: die Höhe der Differenzen zwischen den ausgewiesenen Beträgen und den erwarteten Werten, die für den Abschlussprüfer als noch vertretbar gelten können
  - quelle: hwp-er-2026__rz-0110-s199
