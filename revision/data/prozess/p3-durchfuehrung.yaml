- was: 'Kapitalverlust/Überschuldung: P1-313 immer bearbeiten (Werkzeug `revision.py kapitalverlust`); Massnahmen des VR aus Protokollen und schriftlichen Antworten feststellen (Sanierungsmassnahmen,
    Zwischenabschlüsse, Benachrichtigung des Gerichts); Untätigkeit oder Überschuldung sofort als Notiz «Wesentliche Feststellungen» und «Schlussbesprechung» erfassen. Hinweis bei Untätigkeit
    des VR ist zwingend, bei Überschuldung zusätzlich Anzeigepflicht nach Art. 729c OR – Entscheid und Vollzug beim WP. Übrige Gesetzesverstösse nicht aktiv suchen; festgestellte, wesentliche
    Verstösse mit direktem Bezug zur Jahresrechnung mit Fundstelle festhalten, z. B. eigene Aktien (Art. 659), Ungleichbehandlung (Art. 660), ungerechtfertigte Leistungen (Art. 678),
    Aktionärsdarlehen/Kapitalrückzahlung (Art. 680), Einberufungsfrist (Art. 699), Dividende mit erheblichem Liquiditätsentzug (Art. 717), Nichteinhaltung der Vorlagepflicht des Geschäftsberichts
    (Art. 958 Abs. 3). Statutenverstösse nur, wenn im Zusammenhang mit dem Prüfungsgegenstand; Organisationsreglement: keine Hinweispflicht.'
