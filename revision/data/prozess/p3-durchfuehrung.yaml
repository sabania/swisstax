  revio: A1-103; 10.4 Jahresrechnung und Vollständigkeitserklärung (Ablage nach Eingang)
  mfiles: Vorjahres-Vollständigkeitserklärung als Vorlage; Entwurf ablegen
  fundstellen:
  - quelle: katalog-revio4__c003-2
    zitat: Vollständigkeitserklärung besprechen und unterzeichnen lassen.
  - quelle: ser-2022__6-2-5
    zitat: Die Unternehmensleitung bestätigt dem Abschlussprüfer die Vollständigkeit der Jahresrechnung
  - quelle: ser-2022__anh-e-s103-1
    zitat: Der Abschlussprüfer beurteilt im Einzelfall, welche Ergänzungen oder Streichungen angebracht bzw. notwendig sind
- was: 'Je Prüfschritt im Textfeld dokumentieren: Prüfziele, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis und eigene Schlussfolgerung, Feststellungen,
    Pendenzen, Status; Nachweise beim Schritt oder an der Notiz anhängen; Mandatskontext vor jeder Ablage prüfen; Visum, ✓ und Abschliessende Beurteilung offen lassen; jede Aktion im
    Protokoll.'
  wer: Agent
  revio: 'Prüfschritt-Textfeld (CSV: rv_put_auditActivities_UpdateDossierActivity – Zuordnung zu bestätigen); Beilagen (rv_post_auditActivities_AddAttachementsToAuditActivity)'
  mfiles: Agenten-Protokoll (Audit Trail) je Mandat und Jahr ablegen
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status
  - quelle: hwp-er-2026__rz-0278-s246
    zitat: Für die Prüfungshandlungen hält der Abschlussprüfer eigene Schlussfolgerungen fest.
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Kein Visum, kein ✓, keine Abschliessende Beurteilung
  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: Jeder Zugriff und jede Ablage wird dagegen geprüft; bei Abweichung bricht der Agent ab und erfasst eine Pendenz.
entscheidungen_wp:
- text: Ob der Agent WP-Schritte vorbereitet, welche Schritte als «markiert»/im Umfang gelten und ob weitergehende 4xx-Handlungen durchgeführt werden (offener Entscheid consis).
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: Standardauswahl der Elemente bestätigen bzw. Vorgabe je Mandat/Prüffeld erfassen.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: 'Zu bestätigen: Standardauswahl und wo der Wirtschaftsprüfer seine Vorgabe erfasst.'
- text: Ob ausreichende geeignete Prüfungsnachweise vorliegen.
  quelle: hwp-er-2026__rz-0085-s195
  zitat: liegt im professionellen Ermessen des Abschlussprüfers
- text: Wesentlichkeit einzelner und kumulierter Feststellungen; Beurteilung nicht korrigierter Fehler (6.1, A1-203).
  quelle: hwp-er-2026__rz-0053-s189
  zitat: Die Beurteilung, ob eine Feststellung wesentlich ist, liegt im professionellen Ermessen des Abschlussprüfers.
- text: Welche Auskünfte Kernaussagen sind und schriftlich bestätigt werden müssen.
  quelle: hwp-er-2026__rz-0104-s198
  zitat: Wann es sich um eine Kernaussage handelt, beurteilt der Abschlussprüfer in der jeweiligen Situation nach seinem professionellen Ermessen.
- text: Korrekturvorschläge an die Unternehmensleitung richten und bei Verweigerung über die Modifizierung der Prüfungsaussage entscheiden.
  quelle: ser-2022__5-3
  zitat: In der Regel macht der Abschlussprüfer der Unternehmensleitung den Vorschlag, die in seiner Zusammenstellung festgehaltenen Fehlaussagen zu korrigieren.
- text: Laufende Information der Organe über Feststellungen (Zeitpunkt, Form, Adressat).
  quelle: hwp-er-2026__rz-0292-s249
  zitat: In der Prüfungsphase wird der Abschlussprüfer die jeweiligen Organe des zu prüfenden Unternehmens fortlaufend über die Prüfungsfeststellungen informieren.
- text: Annahme bei nicht prüfbarem Sachverhalt und Folgen (Einschränkung, Unmöglichkeit der Prüfungsaussage).
  quelle: hwp-er-2026__rz-0138-s204
  zitat: In solchen Situationen muss der Abschlussprüfer eine Annahme treffen
- text: Ob ein festgestellter Gesetzesverstoss im Bericht als Hinweis erscheint.
  quelle: hwp-er-2026__rz-0422-s279-t1
  zitat: Demnach weist die Revisionsstelle nur auf diejenigen Gesetzesverstösse hin, die einen direkten Bezug zur Jahresrechnung aufweisen
- text: Vorgehen bei verdeckter Gewinnausschüttung (schriftliche Mitteilung an VR, Rückforderung, Hinweis, Modifizierung).
  quelle: hwp-er-2026__rz-0164-s212-t1
  zitat: Die Revisionsstelle teilt die verdeckte Gewinnausschüttung dem Verwaltungsrat der Gesellschaft schriftlich mit.
- text: Abgrenzung Status «vorbereitet» vs. «teilweise bearbeitet», v. a. bei Befragungen (offener Entscheid consis).
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Ab wann ist ein Schritt «vorbereitet» statt «teilweise bearbeitet», insbesondere bei Befragungen?
- text: Bei beeinträchtigtem Vertrauensverhältnis Mandatsniederlegung prüfen.
  quelle: hwp-er-2026__rz-0102-s197
  zitat: Ist das Vertrauensverhältnis beeinträchtigt, ist allenfalls eine Mandatsniederlegung in Betracht zu ziehen
- text: Visum je Schritt, ✓ je Prüffeld, Abschliessende Beurteilung, Abschluss und Review.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: alles bleibt beim Menschen
unterlagen:
- dokument: Saldenbilanz/Hauptbuch und geprüfte Vorjahresrechnung (revio 10.1)
  zweck: Abstimmung Vortrag und Saldi (A1-302, A1-303)
  quelle: ser-2022__anh-d-s073-1
  zitat: Abstimmung der Saldi der Hauptbuchkonten mit der geprüften Jahresrechnung
- dokument: 'Nebenbuch-Auswertungen: Debitoren-Altersgliederung/OP-Listen, Anlagenspiegel, Inventarlisten'
  zweck: Bestand, Bewertung, Grundgesamtheit für die Auswahl
  quelle: hwp-er-2026__rz-0266-s244
  zitat: (Debitoren-Altersgliederungen, Anlagenspiegel, Inventarlisten etc.)
- dokument: Kassenbücher, Bank- und PC-Auszüge, Wertschriftenverzeichnisse per Stichtag
  zweck: Bestandsprüfung flüssige Mittel (B1)
  quelle: ser-2022__anh-d-s074-1
