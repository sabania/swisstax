  - quelle: ser-2022__6-1-2-t3
    zitat: die im Rahmen der Abweichungsanalyse erhaltenen Aussagen zu plausibilisieren
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: 'Rechenmodul: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.'
- was: 'Angemessene Detailprüfungen (3xx), v. a. Bestand und Bewertung: Saldo mit Detailnachweis/Nebenbuch abstimmen (Nachrechnen, Übertragung), Belege und Verträge einsehen (Grunderfassung
