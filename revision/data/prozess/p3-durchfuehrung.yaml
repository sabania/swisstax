- was: 'Analytische Prüfungshandlungen (2xx): zuerst Erwartung bilden (Vorjahr, Budget, Kennzahlen, Relationen zu nicht-finanziellen Daten), tolerierbare Abweichung aus der Toleranzwesentlichkeit
