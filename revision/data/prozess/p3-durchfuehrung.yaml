  - quelle: hwp-er-2026__rz-0101-s197
    zitat: Bei der eingeschränkten Revision beschränkt sich diese Prüfungshandlung auf die Befragung von Personen innerhalb des Unternehmens.
- was: 'Analytische Prüfungshandlungen (2xx): zuerst Erwartung bilden (Vorjahr, Budget, Kennzahlen, Relationen zu nicht-finanziellen Daten), tolerierbare Abweichung aus der Toleranzwesentlichkeit
    ableiten, Zahlen um Bildung/Auflösung stiller Reserven bereinigen, Abweichungen im Rechenmodul berechnen und Erklärungen plausibilisieren; nicht plausible Entwicklungen mit Detailprüfung
    oder Frage nachverfolgen.'
  wer: Agent
  revio: Kontenübersicht des Prüffelds (rv_get_financialStatement_LoadAccountView), 1.2 Kennzahlen (rv_get_financialStatement_LoadKeyFigureView), 10.3 Stille Reserven lesen; Ergebnis
    im Textfeld 2xx
  mfiles: Budget/Prognosen, Vorjahresabschluss, nicht-finanzielle Daten (z. B. Mitarbeitende, Mengen)
  fundstellen:
