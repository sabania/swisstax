# Prozessphase p3-durchfuehrung – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p3-durchfuehrung
titel: 'Durchführung: Befragungen, analytische Prüfungshandlungen, angemessene Detailprüfungen'
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: true
ziel: Je Prüffeld ausreichende und geeignete Prüfungsnachweise mit der gesetzlich beschränkten Kombination aus Befragungen, Analytik und angemessenen Detailprüfungen (v. a. Bestand/Bewertung)
  erlangen, Feststellungen und Fehlaussagen erfassen und alles im revio-Prüfschritt nachvollziehbar dokumentieren; Beurteilung und Visum beim WP.
wann: Nach Prozess 1 (Import; in der Testphase erst nach Kontrolle durch den WP) und gelesener Planung (3.1 Risiken, 3.3 Wesentlichkeit, 3.5 Strategie); laufend je markiertem Prüfschritt
  im Umfang bis vor Beendigung (Bereich 6) und Schlussbesprechung; bei Erstprüfung zuerst Eröffnungswerte; erneut, wenn sich Risikolage, Wesentlichkeit oder Umfang (Anweisung WP) ändert.
gesetz:
- thema: Prüfungshandlungen der eingeschränkten Revision (Art. 729a Abs. 2 OR)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: 'Prüfungsgegenstand: Gesetzes- und Statutenkonformität der Jahresrechnung (Art. 729a Abs. 1 Ziff. 1 OR)'
  quelle: or__art-729a
  zitat: die Jahresrechnung nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: 'Prüfungsgegenstand: Antrag über die Verwendung des Bilanzgewinns (Art. 729a Abs. 1 Ziff. 2 OR) – relevant für Einlagenrückgewähr und Gewinnverwendung'
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: Geschäftsführung nicht Prüfungsgegenstand (Art. 729a Abs. 3 OR)
  quelle: or__art-729a
  zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
- thema: Vorlage- und Auskunftspflicht des Verwaltungsrats (Art. 730b Abs. 1 OR)
  quelle: or__art-730b
  zitat: Der Verwaltungsrat übergibt der Revisionsstelle alle Unterlagen und erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt, auf Verlangen auch schriftlich.
- thema: Dokumentations- und Aufbewahrungspflicht, mindestens zehn Jahre (Art. 730c Abs. 1 OR)
  quelle: or__art-730c
  zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- thema: Prüfbarkeit der Arbeitspapiere (Art. 730c Abs. 2 OR)
  quelle: or__art-730c
  zitat: Die Unterlagen müssen es ermöglichen, die Einhaltung der gesetzlichen Vorschriften in effizienter Weise zu prüfen.
- thema: Gesonderter Ausweis von Forderungen/Verbindlichkeiten gegenüber Beteiligten und Organen (Art. 959a Abs. 4 OR)
  quelle: or__art-959a-t2
  zitat: müssen jeweils gesondert in der Bilanz oder im Anhang ausgewiesen werden
- thema: Rückerstattung ungerechtfertigter Leistungen an Aktionäre, Organe, Nahestehende (Art. 678 Abs. 1 OR)
  quelle: or__art-678
  zitat: sind zur Rückerstattung von Dividenden, Tantiemen, anderen Gewinnanteilen, Vergütungen
- thema: Offensichtliches Missverhältnis bei Rechtsgeschäften mit Nahestehenden (Art. 678 Abs. 2 OR)
  quelle: or__art-678
  zitat: soweit ein offensichtliches Missverhältnis zwischen Leistung und Gegenleistung besteht
- thema: Verbot der Einlagenrückgewähr (Art. 680 Abs. 2 OR) – Aktionärsdarlehen
  quelle: or__art-680
  zitat: Ein Recht, den eingezahlten Betrag zurückzufordern, steht dem Aktionär nicht zu.
- thema: 'Hälftiger Kapitalverlust: Massnahmen des Verwaltungsrats (Art. 725a Abs. 1 OR)'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Überschuldung: Zwischenabschlüsse und Benachrichtigung des Gerichts durch den VR (Art. 725b OR)'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
- thema: Mitwirkung bei der Buchführung zulässig, Selbstprüfung organisatorisch ausschliessen (Art. 729 Abs. 2 OR)
  quelle: or__art-729
  zitat: Das Mitwirken bei der Buchführung und das Erbringen anderer Dienstleistungen für die zu prüfende Gesellschaft sind zulässig.
- thema: Offenlegung der Mitwirkung im Revisionsbericht (Art. 729b Abs. 1 Ziff. 3 OR)
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung
- thema: Anzeigepflicht der Revisionsstelle bei offensichtlicher Überschuldung (Art. 729c OR)
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
schritte:
- was: 'Arbeitsrahmen je Prüffeld laden: Wesentlichkeit aus 3.3 (Gesamt-, Toleranzwesentlichkeit, Nichtaufgriffsgrenze) nur lesen, Risiko aus 3.1 und Strategie aus 3.5 berücksichtigen,
    markierte Prüfschritte mit Ziel und Prüfzielen laden, Vorjahresschritt zur Orientierung lesen. Unplausible Wesentlichkeitsfestlegung als Pendenz.'
  wer: Agent
  revio: '3.3 Wesentlichkeit (rv_get_workpapers_LoadMaterialityOfDossier), 3.1/3.5 lesen; Bereich 4 Prüffeld (rv_get_auditActivities_LoadAuditActivities_by_containerId_by_templateId;
    Vorjahr: rv_get_auditActivities_GetActivityItemFromPreviousPeriod_by_containerId_by_templateId_by_activityId)'
  mfiles: ''
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: Der Agent liest die Wesentlichkeit aus 3.3 und ändert sie nie
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Ziel und Prüfziele lesen → Risiko und Strategie aus 3.1 und 3.5 berücksichtigen → Nachweise in M-Files beschaffen
  - quelle: hwp-er-2026__rz-0105-s198
    zitat: Der Begriff der Wesentlichkeit bezieht sich in diesem Zusammenhang auf die sogenannte Toleranzwesentlichkeit
- was: 'Je markiertem Prüfschritt zuerst klären, ob er im Umfang ist (markiert bzw. Vorgabe des WP; 4xx nur auf Anweisung; Regel für WP-Schritte offen). Nein → Status «nicht bearbeitet»
    mit Grund für den Rapport, weiter mit dem nächsten Schritt. Ja → Nachweise beschaffen, prüfen, dokumentieren. Status je Schritt für den Rapport: vorbereitet, mit Feststellungen,
    teilweise, nicht bearbeitet.'
  wer: Agent
  revio: 'Bereich 4 Prüffeld (markierte Schritte nur lesen); Auswahlstatus nicht setzen (CSV: rv_post_auditActivities_SetAuditActivitySelectionState, Bedeutung zu bestätigen); Status
    und Grund im Revisionsrapport (Prozess 4)'
  mfiles: ''
  fundstellen:
  - quelle: flussdiagramm-revisionsagent-2026__s001-3
    zitat: Grund für den Rapport, weiter mit nächstem Schritt
  - quelle: flussdiagramm-revisionsagent-2026__s001-5
    zitat: 'Offen: Regel für WP-Schritte (Wirtschaftsprüfer) entscheidet über «Schritt im Umfang?»'
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet)
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: Weitergehende Handlungen (Bestätigungen, Inventur, Gutachten, Journal Entry Testing); nur auf Anweisung
- was: 'Kombination der Prüfungshandlungen je Position vorschlagen: für wesentliche Positionen die empfohlenen Handlungen nach SER 6.2.2/Anhang D, soweit im konkreten Fall geeignet (nicht
    alle). Über der Toleranzwesentlichkeit nie nur Befragung; in vielen Fällen Kombination von ≥ 2 Arten; bei Unsicherheiten und wesentlichen Bilanzpositionen gewisse angemessene Detailprüfungen.
    Unter der Toleranzwesentlichkeit und ohne sonstige Risiken kann die Befragung allein genügen. Weiter gehende Prüfungshandlungen nach SER 6.2.3 (angenommene wesentliche Fehlaussagen,
    erhöhtes inhärentes Risiko) können Schritte vom Typ 1xx–4xx sein: Agent schlägt vor, WP entscheidet. revio-Typ 4xx «Sonstige» ist nicht gleich «weiter gehend»: er enthält auch nicht
    vorgesehene Handlungen (z. B. B1-401 Bankbestätigungen) und EP-Schritte (A1-401/402 Geldflussrechnung).'
  wer: Agent bereitet vor, WP entscheidet
  revio: 'Bereich 4, Prüfschritte nach Typ 1xx/2xx/3xx/4xx (Typ ≠ SER-Kategorie); Auswahlstatus eines Schritts (CSV: rv_post_auditActivities_SetAuditActivitySelectionState, Bedeutung
    zu bestätigen) setzt nicht der Agent'
  mfiles: ''
  fundstellen:
  - quelle: ser-2022__6-2-2
    zitat: Die empfohlenen Prüfungshandlungen sind – in der Regel und sofern anwendbar – für die wesentlichen Positionen der Jahresrechnung
  - quelle: ser-2022__6-1-1-t1
    zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
  - quelle: ser-2022__6-2-1
    zitat: In vielen Fällen wird nur eine effiziente Kombination von mindestens zwei Arten von Prüfungshandlungen
  - quelle: ser-2022__6-2-1
    zitat: Gerade im Fall von Unsicherheiten oder bei wesentlichen Bilanzpositionen
  - quelle: hwp-er-2026__rz-0105-s198
    zitat: könnte sich der Abschlussprüfer zum Erlangen von Prüfungsnachweisen allein auf die Befragungen konzentrieren
  - quelle: hwp-er-2026__rz-0130-s203
    zitat: sondern jene, welche in der konkreten Situation geeignet sind, das vorhandene Prüfungsrisiko zu reduzieren
  - quelle: ser-2022__6-2-3
    zitat: Weiter gehende Prüfungshandlungen werden in der Regel nur dann durchgeführt
  - quelle: ser-2022__anh-d-s099-1
    zitat: Abstimmung der ausgewiesenen Posten mit Belegen oder anderen geeigneten Unterlagen
  - quelle: katalog-revio4__c003-9
    zitat: Prüfung der Banken anhand von Bankenbestätigungen
  - quelle: katalog-revio4__c003-6
    zitat: Prüfung, ob die Geldflussrechnung folgende Mindestgliederung hat
- was: 'Befragungen (1xx) vorbereiten: je Frage festhalten, welche Aussage/welches Prüfziel geprüft wird und wer an der Quelle der Information sitzt (auch ausserhalb Rechnungswesen).
    Der Agent befragt nicht selbst: schriftliche Antworten (10.11, Korrespondenz) auswerten, kritisch würdigen (Widersprüche zu Belegen und Unternehmensverständnis), wesentliche Fragen
    und Antworten dokumentieren, offene Fragen als Pendenz bzw. Schlussbesprechungspunkt; Status höchstens «teilweise bearbeitet».'
