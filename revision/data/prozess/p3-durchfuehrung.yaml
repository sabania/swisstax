  quelle: hwp-er-2026__rz-0137-s203
  zitat: kann der Abschlussprüfer diese Bestätigungen als Prüfungsnachweise beiziehen, selbst wenn diese nicht direkt an ihn ge
- dokument: Arbeitspapiere und Feststellungen des Vorjahres (revio Vorjahr)
  zweck: Erwartungen, systematische Fehler, frühere Abschlusskorrekturen
  quelle: ser-2022__6-1-2-t2
  zitat: Kenntnisse aus früheren Prüfungen – insbesondere der Umstände, die in Vorperioden zu Abschlusskorrekturen geführt haben
- dokument: Vollständigkeitserklärung (Entwurf, Unterzeichnung durch Kunde, revio 10.4)
  zweck: Schriftliche Bestätigung der Auskünfte
  quelle: ser-2022__anh-c-s057-1
  zitat: Als Teil der eingeschränkten Revision werden wir bei den Verantwortlichen eine schriftliche Bestätigung der uns bei der eingeschränkten Revision gegebenen Auskünfte einholen
dokumentation:
- text: 'Einheitliches Ergebnis je Prüfschritt im Textfeld: Prüfziel, Quellen, Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen, Status.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status
- text: Im Textfeld angeben, welche Prüfziele (EX, VO, EN, RV, BE, PA, DO) der Nachweis abdeckt.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: der Agent hält im Textfeld fest, welche Prüfziele sein Nachweis abdeckt
- text: Wesentliche Fragen und Antworten festhalten; ohne Dokumentation taugt die Befragung nicht als Nachweis.
  quelle: hwp-er-2026__rz-0103-s197
  zitat: Ansonsten ist die Befragung als Prüfungsnachweis ungeeignet.
- text: Eigene Schlussfolgerung je Handlung; Arbeitspapier datieren und Ersteller kennzeichnen (Agent als Ersteller erkennbar).
  quelle: hwp-er-2026__rz-0278-s246
  zitat: Die Arbeitspapiere sind zu datieren und vom Ersteller zu kennzeichnen.
- text: Für eine nicht beteiligte erfahrene Fachperson nachvollziehbar dokumentieren.
  quelle: hwp-er-2026__rz-0276-s246
  zitat: Sie sind so zu gestalten, dass sich an der eingeschränkten Revision nicht beteiligte, erfahrene Fachleute ein Bild von der Planung und der Durchführung sowie dem Ergebnis der
    Prüfungen machen können.
- text: Fehlaussagen (festgestellt/angenommen) und ihre Behandlung sowie erlangte Nachweise mit Beurteilung gehören in die Jahresakten.
  quelle: ser-2022__7-2
  zitat: Fehlaussagen infolge festgestellter und/oder angenommener Sachverhalte und ihre
- text: Notiz «Pendenz» für fehlende Unterlagen/Belege mit Konto, Datum und Betrag; Notizen nie löschen oder erledigen.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Fehlende Unterlagen, ungeklärte Sachverhalte, nicht verfügbare Belege mit Konto, Datum und Betrag
- text: Notiz «Schlussbesprechung» für Punkte, die der WP mit dem Kunden klären soll.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Punkte, die der Wirtschaftsprüfer mit dem Kunden besprechen sollte
- text: Verwendete Nachweise beim Prüfschritt oder als Beilage der Notiz anhängen.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: der Agent hängt dort die verwendeten Nachweise an, wenn sie nicht direkt beim Prüfschritt liegen
- text: Korrespondenz mit Nachweischarakter beim betroffenen Arbeitspapier ablegen.
  quelle: hwp-er-2026__rz-0280-s247
  zitat: an entsprechender Stelle in den Arbeitspapieren abgelegt sind
- text: Mündlich kommunizierte wesentliche Sachverhalte (z. B. Telefon des WP) in den Arbeitspapieren festhalten.
  quelle: hwp-er-2026__rz-0302-s250
  zitat: Werden wesentliche Sachverhalte mündlich kommuniziert, dokumentiert der Abschlussprüfer dies in den Arbeitspapieren.
- text: 'Widersprüchliche Feststellungen: festhalten, wie der Widerspruch aufgelöst wurde.'
  quelle: hwp-er-2026__rz-0290-s248
  zitat: wie er die Inkonsistenz oder den Widerspruch aufgelöst hat
- text: Arbeitspapiere referenzieren (Prüfschritt-ID, Notiz, M-Files-ID) für Querverweise.
  quelle: hwp-er-2026__rz-0282-s247
  zitat: Unter Referenzierung versteht man die systematische Bezeichnung jedes Schriftstücks.
- text: Wiederkehrende Schritte 320 Anhang, 321 stille Reserven, 322 Dauerakten je Prüffeld mitführen.
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: 320 Anhang, 321 stille Reserven und 322 Dauerakten wiederholen sich
- text: 'Audit Trail: jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel in M-Files.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
- text: Dokumentation aller Revisionsdienstleistungen und Aufbewahrung mindestens zehn Jahre.
  quelle: or__art-730c
  zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren
fallstricke:
- text: Wesentliche Posten (über Toleranzwesentlichkeit) nie nur mit Befragung abdecken.
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Bei wesentlichen Bilanzpositionen Analytik in der Regel um Detailprüfungen ergänzen.
  quelle: ser-2022__6-1-2-t3
  zitat: Bei wesentlichen Bilanzpositionen sind die analytischen Prüfungshandlungen in der Regel um angemessene Detailprüfungen zu ergänzen
- text: Sich kompensierende Fehler bleiben in der Analytik unsichtbar.
  quelle: ser-2022__6-1-2-t3
  zitat: Zudem besteht das Risiko, dass sich zwei oder mehrere Fehlaussagen teilweise kompensieren können
- text: Keine statistischen/repräsentativen Stichproben mit Hochrechnung auf die Grundgesamtheit.
  quelle: hwp-er-2026__rz-0264-s243
  zitat: entsprechen nicht dem Charakter der eingeschränkten Revision und sind nicht vorgesehen
- text: Mehr Nachweise gleichen schlechte Qualität nicht aus.
  quelle: hwp-er-2026__rz-0082-s194
  zitat: Das Einholen von mehr Prüfungsnachweisen ist nicht notwendigerweise ein Ausgleich für deren schlechte Qualität.
- text: Kundenauswertungen (Listen, Bildschirmausgaben) nicht ungeprüft übernehmen.
  quelle: hwp-er-2026__rz-0266-s244
  zitat: Der Abschlussprüfer geht nicht unbesehen von der Vollständigkeit und Richtigkeit solcher Auswertungen aus
- text: Keine Inventurteilnahme und keine aktiv eingeholten Bestätigungen (auch keine Debitorenbestätigungen).
  quelle: hwp-er-2026__rz-0134-s203
  zitat: die Teilnahme an der Inventur (Beobachtung)
- text: Vollständige Datenanalysen (z. B. Journal Entry Testing) sieht der SER nicht vor; nur auf Anweisung.
  quelle: hwp-er-2026__rz-0142-s207
  zitat: Der Einsatz von TDA in der eingeschränkten Revision ist vom SER nicht vorgesehen.
- text: Eine Feststellung nicht als Einzelfall abhaken, verwandte Posten mitprüfen.
  quelle: hwp-er-2026__rz-0270-s245
  zitat: Der Abschlussprüfer geht im Regelfall nicht davon aus, dass eine konkrete Prüfungsfeststellung ein isoliertes Ereignis darstellt.
- text: Systematische Fehler aus dem Vorjahr erneut beurteilen.
  quelle: hwp-er-2026__rz-0057-s189
  zitat: Wurden im Vorjahr Fehlaussagen aufgrund systematischer Fehler entdeckt
- text: Fehlende Information oder Weigerung des Kunden ist selbst ein Prüfungsnachweis und als Pendenz zu melden.
  quelle: hwp-er-2026__rz-0079-s193
  zitat: In manchen Fällen wird zudem das Fehlen von Informationen
- text: Geschäfte mit Nahestehenden sind oft informell und schlecht dokumentiert.
  quelle: hwp-er-2026__rz-0157-s211
  zitat: Transaktionen zwischen nahestehenden Personen häufig informell abgewickelt werden
- text: 'Einlagenrückgewähr: kein «Eventualhinweis», sondern Nachweise erlangen.'
  quelle: hwp-er-2026__rz-0180-s218
  zitat: Ein Eventualhinweis im Bericht der Revisionsstelle an die Generalversammlung ist nicht angemessen
- text: Die Revisionsstelle korrigiert den Abschluss nicht; der Agent bucht nie und trifft keine Entscheide des Kunden.
  quelle: hwp-er-2026__rz-0411-s277
  zitat: Der Abschlussprüfer ist nicht zur Korrektur des Abschlusses berechtigt
- text: Korrekturvorschläge sind Teil der Prüfung, aber keine Kundenentscheide übernehmen.
  quelle: hwp-er-2026__rz-0049-s160
  zitat: dass ihre Mitarbeiter keine Entscheidungen treffen, die in der alleinigen Verantwortung des Prüfungskunden liegen
- text: 'Doppelmandat: wer bei der Buchführung mitgewirkt hat, prüft nicht.'
  quelle: hwp-er-2026__rz-0044-s159
  zitat: nicht dieselbe Person bei der Buchführung mitwirken darf, die anschliessend die darauf basierende Jahresrechnung eingeschränkt prüft
- text: Keine aktive Suche nach deliktischen Handlungen oder weiteren Gesetzesverstössen.
  quelle: ser-2022__1-5
  zitat: keine Prüfungen zur Aufdeckung von deliktischen Handlungen und keine Prüfungen zur Aufdeckung von weiteren Gesetzesverstössen
- text: Treu und Glauben gilt nur mangels gegenteiliger Hinweise; kritische Grundhaltung bleibt.
  quelle: ser-2022__1-2-t2
  zitat: Er kann mangels gegenteiliger Hinweise von der Richtigkeit erhaltener Auskünfte und Unterlagen ausgehen
- text: Prüfzielkürzel RI ist nicht bestätigt; im Textfeld nicht eigenmächtig deuten.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: RI vermutlich Richtigkeit/Genauigkeit (zu bestätigen)
- text: SCH1–SCH5 sind in revio 4.0 Erfolgsrechnungs-Prüffelder (Betrieblicher Ertrag bis ausserordentlich), nicht Schlussarbeiten.
  quelle: katalog-revio4__c004-3
  zitat: SCH1 | Betrieblicher Ertrag
- text: Schreibend nur in Bereich 4 und 10; Umbuchungsliste, 6.1 und Planung nur lesen.
  quelle: konzept-ki-revisionsagent-2026__c006-1
  zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
fragen_kunde:
- frage: Wer sind die Eigentümer und sonstigen nahestehenden Personen (Aktionäre, Organe, Familienangehörige, Konzern-/Schwestergesellschaften), und welche Geschäfte, Darlehen, Vergütungen
    und Leistungen gab es mit ihnen im Geschäftsjahr (Konditionen, Verträge)?
  zweck: Vollständigkeit und Vorhandensein Nahestehender, Drittvergleich, Ausweis nach Art. 959a Abs. 4 OR, Hinweise auf verdeckte Gewinnausschüttung
- frage: Bestehen für Darlehen an Aktionäre/Nahestehende schriftliche Verträge mit Zins, Rückzahlung und Sicherheiten, und hat der VR den Drittvergleich beurteilt und dokumentiert?
  zweck: Beurteilung Einlagenrückgewähr (Art. 680 Abs. 2 OR), Werthaltigkeit, D1-404
- frage: Wurden Darstellung der Jahresrechnung oder Bewertungsgrundsätze gegenüber dem Vorjahr geändert?
  zweck: A1-101, Stetigkeit, Vergleichbarkeit der Analytik
- frage: Worauf sind die wesentlichen Abweichungen gegenüber Vorjahr und Budget in den einzelnen Positionen zurückzuführen?
  zweck: Erklärung der Analytik; Abweichungen plausibilisieren oder Detailprüfung auslösen
- frage: Wurden stille Reserven gebildet oder aufgelöst (je Position, Betrag)?
  zweck: Bereinigung der Analytik, Abstimmung 10.3, Offenlegung Nettoauflösung
- frage: Sind Forderungen oder andere Aktiven verpfändet, abgetreten oder mit Verfügungsbeschränkungen belastet?
  zweck: Rechte und Verpflichtungen, Anhangangaben
- frage: Bestehen Rechtsstreitigkeiten, Garantie- oder Eventualverpflichtungen oder schwebende Geschäfte mit Verlustrisiko, und hat das Unternehmen dazu selbst Bestätigungen (z. B. Anwalt,
    Bank) eingeholt?
  zweck: Vollständigkeit Rückstellungen/Offenlegung; Verwendung vom Kunden eingeholter Bestätigungen
- frage: Liegen sämtliche GV- und VR-Protokolle des Geschäftsjahres und bis heute vor, inklusive Beschlüsse zu Gewinnverwendung, Darlehen und Vergütungen?
  zweck: A1-304, Feststellung von Sachverhalten mit Auswirkung auf die Jahresrechnung und von Gesetzesverstössen
- frage: Gab es Ereignisse nach dem Bilanzstichtag mit Auswirkung auf die Jahresrechnung?
  zweck: Vollständigkeit und Offenlegung; Durchsicht neue Rechnung
- frage: Wurden für die Vorjahresfeststellungen und -korrekturen Massnahmen getroffen?
  zweck: Systematische Fehler aus Vorperioden erkennen
- frage: Welche Auswertungen (OP-Listen, Anlagespiegel, Inventarlisten) stammen aus welchem System, und wer hat sie erstellt?
