- was: 'Kapitalverlust und Überschuldung prüfen (P1-313): (1) Kapitalverlust mit `kapitalverlust` berechnen: Aktiven abzüglich Verbindlichkeiten < Hälfte von AK + nicht zurückzahlbarer
    gesetzlicher Kapitalreserve + gesetzlicher Gewinnreserve (OR 725a Abs. 1); festhalten, ob und welche Massnahmen der VR ergriffen hat. Ein Rangrücktritt beseitigt den Kapitalverlust
    nicht und ist keine Sanierungsmassnahme nach 725a. (2) Bei begründeter Besorgnis einer Überschuldung: vorhandene Zwischenabschlüsse (Fortführungs-/Veräusserungswerte), Rangrücktritte
    (Umfang, Stundung) und Sanierungsaussicht samt 90-Tage-Frist festhalten. Die Prüfung der Zwischenabschlüsse nach OR 725b Abs. 2 ist ein eigener Auftrag (weder eingeschränkte noch
    ordentliche Revision) – nicht in der SER-Akte vorbereiten, nur dem WP melden. Ergebnis als Notiz «Wesentliche Feststellungen»; Zusatz, Hinweis und Anzeige entscheidet der WP.'
