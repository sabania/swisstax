- dokument: 'Bedingt (bei Zweifeln an der Fortführung): jüngster Zwischenabschluss'
  zweck: Entwicklung nach Stichtag, Fortführung
  quelle: ser-2022__anh-g-s140-2
  zitat: Analyse des jüngsten Zwischenabschlusses
- dokument: Kreditverträge und Covenant-Nachweise (vertieft nur bei Indikatoren)
  zweck: Fortführung; Erklärung zu Kreditvereinbarungen in der VE
  quelle: ser-2022__anh-e-s104-2
