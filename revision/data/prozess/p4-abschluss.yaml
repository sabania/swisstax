- was: 'Fortführungsfähigkeit beurteilen (A1-205, T1-318): Indikatoren aus Kennzahlen und Abschluss erheben (negatives Nettoumlaufvermögen, Verluste, Kapitalverlust/Überschuldung, Fälligkeiten
    von Krediten, Covenants, Zahlungsverzug); prüfen, ob die Unternehmensleitung die Fortführung für mindestens 12 Monate ab Stichtag eingeschätzt hat und ob der Anhang Abweichungen
    von der Fortführung offenlegt. Ohne Zweifel genügt die Erklärung in der VE als Nachweis – dann keine PBC-Vorschläge für Budget/Liquiditätsplanung; bei Indikatoren Meldung an den
    WP.'
  wer: Agent bereitet vor, WP entscheidet
