# Prozessphase p4-abschluss – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p4-abschluss
titel: 'Beendigung: Ereignisse nach Bilanzstichtag, Fortführung, Vollständigkeitserklärung, Schlussbesprechung'
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 13
    korrigiert: true
ziel: 'Vor dem Berichtsdatum alles zusammentragen, was der WP für die Gesamtbeurteilung braucht: Ereignisse nach Stichtag, Fortführung, Kapitalverlust/Überschuldung, nicht korrigierte
  Fehler, Antrag über die Verwendung des Bilanzgewinns, VE-Entwurf und Punkte für die Schlussbesprechung – vorbereitet in revio 4/10, entschieden vom WP.'
wann: 'Nach Bearbeitung der Prüffelder (Prozess 2), möglichst nahe am Datum des Revisionsberichts. Bericht frühestens datierbar, wenn der VR die Jahresrechnung unterzeichnet bzw. formell
  gutgeheissen hat; rückwärts planen ab GV-Datum: Revisionsbericht muss den Aktionären mindestens 20 Tage vor der GV zugänglich sein (OR 699a). Vor Revisionsrapport (Prozess 4) und GVB-Entwurf
  (Prozess 5). Neue Tatsachen nach dem Berichtsdatum sofort an den WP. Danach: Abschluss der Auftragsakte innert interner Frist (in der Regel höchstens 60 Tage nach Berichtsdatum), PDF-Akte
  (Prozess 6) nur auf Anweisung des WP.'
gesetz:
- thema: 'Prüfungsgegenstand: Jahresrechnung und Antrag über die Verwendung des Bilanzgewinns (OR 729a Abs. 1)'
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: Prüfungsumfang der eingeschränkten Revision (OR 729a Abs. 2)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Fortführungsannahme (OR 958a Abs. 1)
  quelle: or__art-958a
  zitat: Die Rechnungslegung beruht auf der Annahme, dass das Unternehmen auf absehbare Zeit fortgeführt wird.
- thema: 'Einstellung innert 12 Monaten: Veräusserungswerte (OR 958a Abs. 2)'
  quelle: or__art-958a
  zitat: in den nächsten zwölf Monaten ab Bilanzstichtag beabsichtigt oder voraussichtlich nicht abwendbar
- thema: Abweichung von der Fortführung im Anhang (OR 958a Abs. 3)
  quelle: or__art-958a
  zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken
- thema: 'Anhang: wesentliche Ereignisse nach dem Bilanzstichtag (OR 959c Abs. 2 Ziff. 13)'
  quelle: or__art-959c-t2
  zitat: 13. wesentliche Ereignisse nach dem Bilanzstichtag
- thema: Unterzeichnung der Jahresrechnung (OR 958 Abs. 3)
  quelle: or__art-958
  zitat: Er ist vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person zu unterzeichnen.
- thema: Auskunftspflicht des VR, auf Verlangen schriftlich – Grundlage der Vollständigkeitserklärung (OR 730b Abs. 1)
  quelle: or__art-730b
  zitat: erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt, auf Verlangen auch schriftlich
- thema: 'Reservezuweisung: 5 % des Jahresgewinns an die gesetzliche Gewinnreserve (OR 672 Abs. 1 Satz 1)'
  quelle: or__art-672
  zitat: Der gesetzlichen Gewinnreserve sind 5 Prozent des Jahresgewinns zuzuweisen.
- thema: Verlustvortrag vor der Zuweisung beseitigen (OR 672 Abs. 1 Satz 2)
  quelle: or__art-672
  zitat: Liegt ein Verlustvortrag vor, so ist dieser vor der Zuweisung an die Reserve zu beseitigen.
- thema: 'Obergrenze: gesetzliche Gewinnreserve + gesetzliche Kapitalreserve = 50 % des eingetragenen Aktienkapitals (OR 672 Abs. 2 Satz 1)'
  quelle: or__art-672
  zitat: bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte des im Handelsregister eingetragenen Aktienkapitals erreicht
- thema: 'Obergrenze Holdinggesellschaften: 20 % des eingetragenen Aktienkapitals (OR 672 Abs. 2 Satz 2)'
  quelle: or__art-672
  zitat: Holdinggesellschaften müssen die gesetzliche Gewinnreserve äufnen, bis diese zusammen mit der gesetzlichen Kapitalreserve 20 Prozent
- thema: Dividenden nur aus Bilanzgewinn und hierfür gebildeten Reserven (OR 675 Abs. 2)
  quelle: or__art-675
  zitat: Dividenden dürfen nur aus dem Bilanzgewinn und aus hierfür gebildeten Reserven ausgerichtet werden.
- thema: Dividenden erst nach Reservezuweisung (OR 675 Abs. 3)
  quelle: or__art-675
  zitat: Dividenden dürfen erst festgesetzt werden, nachdem die Zuweisungen an die gesetzliche Gewinnreserve und an die freiwilligen Gewinnreserven erfolgt sind.
- thema: Reihenfolge der Verlustverrechnung (OR 674 Abs. 1)
  quelle: or__art-674
  zitat: Verluste müssen in folgender Reihenfolge verrechnet werden mit
- thema: 'Wahlrecht: Vortrag statt Verrechnung mit gesetzlicher Gewinn- oder Kapitalreserve (OR 674 Abs. 2)'
  quelle: or__art-674
  zitat: dürfen verbleibende Verluste auch teilweise oder ganz auf die neue Jahresrechnung vorgetragen werden
- thema: Revisionsbericht muss vor GV-Beschluss vorliegen, sonst Nichtigkeit (OR 731)
  quelle: or__art-731
  zitat: Liegt der erforderliche Revisionsbericht nicht vor, so sind die Beschlüsse zur Genehmigung der Jahresrechnung
- thema: Revisionsbericht mindestens 20 Tage vor der GV zugänglich (OR 699a Abs. 1)
  quelle: or__art-699a
  zitat: Mindestens 20 Tage vor der Generalversammlung sind den Aktionären der Geschäftsbericht und die Revisionsberichte zugänglich zu machen.
- thema: Bericht unterzeichnet die leitende Person (OR 729b Abs. 2)
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- thema: Zahlungsfähigkeit überwacht der VR (OR 725 Abs. 1)
  quelle: or__art-725
  zitat: Der Verwaltungsrat überwacht die Zahlungsfähigkeit der Gesellschaft.
- thema: 'Schwelle Kapitalverlust: Aktiven abzüglich Verbindlichkeiten decken die Hälfte von AK + nicht zurückzahlbarer gesetzlicher Kapitalreserve + gesetzlicher Gewinnreserve nicht
    mehr (OR 725a Abs. 1)'
  quelle: or__art-725a
  zitat: die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve nicht mehr decken
- thema: 'Kapitalverlust: Massnahmen des VR (OR 725a Abs. 1)'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Kapitalverlust ohne Revisionsstelle (Opting-out): eingeschränkte Revision durch zugelassenen Revisor (OR 725a Abs. 2) – Sonderfall, nicht bei bestehender Revisionsstelle'
  quelle: or__art-725a
  zitat: Hat die Gesellschaft keine Revisionsstelle, so muss die letzte Jahresrechnung vor ihrer Genehmigung durch die Generalversammlung überdies einer eingeschränkten Revision
- thema: Gebotene Eile für VR und Revisionsstelle (OR 725a Abs. 4)
  quelle: or__art-725a
  zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
- thema: 'Überschuldung: Zwischenabschlüsse bei begründeter Besorgnis (OR 725b Abs. 1)'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
- thema: Prüfung der Zwischenabschlüsse durch die Revisionsstelle (OR 725b Abs. 2)
  quelle: or__art-725b-t1
  zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen
- thema: 'Ausnahme von der Benachrichtigung des Gerichts: Rangrücktritt (OR 725b Abs. 4 Ziff. 1)'
  quelle: or__art-725b-t1
  zitat: wenn Gesellschaftsgläubiger im Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten
- thema: 'Ausnahme: begründete Aussicht auf Behebung, spätestens 90 Tage (OR 725b Abs. 4 Ziff. 2)'
  quelle: or__art-725b-t1
  zitat: spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse
- thema: Anzeigepflicht der eingeschränkt prüfenden Revisionsstelle (OR 729c)
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
schritte:
- was: 'Stand der Prüfung erheben (Pendenzenkontrolle): Status aller Prüfschritte in Bereich 4 und offene Notizen «Pendenz» zusammenstellen; prüfen, ob alle Prüfprogramme bearbeitet
    und Ergebnisse dokumentiert sind; offene Punkte für den WP auflisten.'
  wer: Agent
  revio: 'Bereich 4 (Status, Textfelder) und Notizen lesen: rv_get_workpapers_LoadAreaStates, rv_get_workpapers_LoadDossierNotesByNoteType; Visum/✓/Abschliessende Beurteilung bleiben
    leer'
