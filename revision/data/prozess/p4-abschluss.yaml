- dokument: 'Bedingt (nur bei Indikatoren oder auf Anweisung des WP): Einschätzung der Fortführungsfähigkeit (mind. 12 Monate), Budget, Liquiditätsplanung – ohne Zweifel genügt die Erklärung
    in der VE'
  zweck: Going Concern (A1-205)
  quelle: ser-2022__anh-g-s140-1
