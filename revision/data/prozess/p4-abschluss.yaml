- dokument: 'Bedingt (bei Fortführungszweifeln, Kapitalverlust oder Überschuldung): Rangrücktritts- und Finanzierungszusagen (Aktionäre, Nahestehende, Dritte)'
  zweck: Fortführung, Überschuldung (OR 725b Abs. 4 Ziff. 1)
  quelle: ser-2022__anh-g-s141-1
  zitat: Bestätigung der Existenz, Gültigkeit und Durchsetzbarkeit von Vereinbarungen mit nahestehenden Personen sowie Dritten
- dokument: 'Bedingt (bei begründeter Besorgnis einer Überschuldung): Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten und Bericht über deren Prüfung'
  zweck: P1-313; Pflichten des VR nach OR 725b (Prüfung selbst ist eigener Auftrag)
  quelle: or__art-725b-t1
