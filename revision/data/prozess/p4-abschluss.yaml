entscheidungen_wp:
- text: Ob ein Ereignis nach dem Bilanzstichtag den Abschluss (Anpassung/Offenlegung), den Bericht oder erst die Folgeperiode betrifft.
  quelle: hwp-er-2026__rz-0317-s254
  zitat: Der Abschlussprüfer beurteilt, ob sich Ereignisse nach dem Bilanzstichtag allenfalls auf den Abschluss sowie auf den Revisionsbericht auswirken oder erst auf die folgende Periode.
- text: Ob die der Jahresrechnung zugrunde gelegte Fortführungsannahme vertretbar ist.
  quelle: ser-2022__anh-g-s139-1
  zitat: ob die der Jahresrechnung zugrunde gelegte Annahme der Fortführungsfähigkeit vertretbar ist
- text: 'Fortführung vertretbar, erhebliche Unsicherheit im Anhang offengelegt: Zusatz im Bericht (Muster c043-1, SER F Bsp. 10).'
  quelle: ser-2022__anh-g-s141-1
  zitat: In diesem Fall ist ein Zusatz im Revisionsbericht anzubringen
- text: 'Unsicherheit nicht oder unzureichend offengelegt: eingeschränkte oder verneinende Prüfungsaussage (Muster c026-1, c033-1; Fortführungs- statt Veräusserungswerte: c032-1).'
  quelle: ser-2022__anh-g-s141-2
  zitat: erfordern eine Modifizierung der Prüfungsaussage (eingeschränkte oder verneinende Prüfungsaussage)
- text: 'Unternehmensleitung verweigert die Einschätzung oder wählt einen kürzeren Zeitraum: eingeschränkte Prüfungsaussage oder Unmöglichkeit einer Prüfungsaussage (Muster c041-1, SER
    F Bsp. 7).'
  quelle: ser-2022__anh-g-s141-2
  zitat: In diesem Fall modifiziert der Abschlussprüfer die Prüfungsaussage (eingeschränkte oder Unmöglichkeit der Prüfungsaussage).
- text: Ob von der Unternehmensleitung eine detailliertere, schriftlich dokumentierte Einschätzung der Fortführung bzw. eine Ausdehnung auf 12 Monate verlangt wird.
  quelle: ser-2022__anh-g-s140-1
  zitat: fordert er die Unternehmensleitung zu einer detaillierteren und schriftlich dokumentierten Einschätzung auf
- text: Korrekturvorschläge an die Unternehmensleitung; bei Verweigerung Beurteilung, ob die Jahresrechnung wesentlich falsch ist und die Prüfungsaussage modifiziert wird (Summe in 6.1).
  quelle: ser-2022__5-3
  zitat: Wird diese Korrektur verweigert, so muss der Abschlussprüfer beurteilen, ob die Jahresrechnung dadurch eine wesentliche Fehlaussage vermittelt.
- text: Ob der Antrag über die Verwendung des Bilanzgewinns gesetzes- und statutenkonform ist; bei erheblichem Liquiditätsentzug Beurteilung der Fortführung und eines Hinweises (OR 717).
  quelle: hwp-er-2026__rz-0222-s235
  zitat: Stellt die beantragte Gewinnverwendung offensichtlich einen erheblichen Liquiditätsentzug dar, beurteilt der Abschlussprüfer die Fortführungsfähigkeit des Unternehmens
- text: Ob eine verbotene Einlagenrückgewähr (Art. 680 Abs. 2 OR) vorliegt und ein Hinweis anzubringen ist (Muster c052-1, SER F Bsp. 14).
  quelle: muster-hwp-er-2026__c052-1
  zitat: Hinweis auf verbotene Einlagenrückgewähr Art. 680 Abs. 2 OR
- text: 'Kapitalverlust: ob eine Pflichtwidrigkeit des VR (auch bei blossem Rangrücktritt) und damit ein Hinweis auf Gesetzesverstoss vorliegt oder nur ein Zusatz (Muster c046-1 bzw.
    SER F Bsp. 11; Hinweis auf Untätigkeit c050-1).'
  quelle: qa-kapitalverlust-2023__1-2-t3
  zitat: obliegt der Beurteilung der Revisionsstelle bzw. des zugelassenen Revisors
- text: 'Überschuldung: Zusatz und Hinweise im Bericht (Muster c044-1 Rangrücktritt, c045-1 Sanierung, c047-1 Zwischenabschluss, c051-1 Untätigkeit VR) sowie Anzeige an das Gericht nach
    OR 729c.'
  quelle: ser-2022__8-3-2-t1
  zitat: Bleibt der Verwaltungsrat untätig, beachtet die Revisionsstelle zusätzlich bei Vorliegen einer Überschuldung (Art. 725b OR) die Anzeigepflicht gemäss Art. 729c OR.
- text: Annahme und Durchführung der Prüfung der Zwischenabschlüsse nach OR 725b Abs. 2 als eigener Auftrag (keine SER-Prüfung).
  quelle: ser-2022__9-t2
  zitat: Ausser in den Fällen eines Opting-out ist die gesetzliche Revisionsstelle für die Prüfung des Zwischenabschlusses nach Art. 725b OR zuständig.
- text: Inhalt der Vollständigkeitserklärung (Ergänzungen [12]–[15]/Streichungen) und Vorgehen bei Weigerung der Unternehmensleitung (Beschränkung des Prüfungsumfangs, Muster c029-1).
  quelle: ser-2022__anh-e-s102-2
  zitat: Weigert sich die Unternehmensleitung, eine Erklärung abzugeben, die nach Auffassung des Abschlussprüfers erforderlich ist, liegt eine Beschränkung des Prüfungsumfangs vor.
- text: 'Vorgehen, wenn die unterzeichnete VE bei der vorgesehenen Berichtsabgabe nicht vorliegt (SER: «in der Regel» vorher).'
  quelle: ser-2022__anh-e-s102-1
  zitat: sollte sich zudem in der Regel vor Abgabe des Revisionsberichtes in den Händen der Revisionsstelle befinden
- text: Abschliessende Gesamtbeurteilung und Formulierung der Prüfungsaussage.
  quelle: ser-2022__6-2-4
  zitat: Daraus ist eine Prüfungsaussage über die Angemessenheit der Jahresrechnung zu formulieren.
- text: Mit wem welche Punkte besprochen werden (eine oder mehrere Schlussbesprechungen).
  quelle: hwp-er-2026__rz-0456-s289
  zitat: Er wird sich überlegen, mit wem die einzelnen Sachverhalte zu besprechen sind
- text: Ob eine ergänzende schriftliche Berichterstattung (Management Letter) erfolgt – bei der eingeschränkten Revision grundsätzlich nicht vorgesehen.
  quelle: hwp-er-2026__rz-0460-s289
  zitat: Eine ergänzende schriftliche Berichterstattung ist bei der eingeschränkten Revision grundsätzlich nicht vorgesehen.
- text: Modifizierung der Prüfungsaussage, wenn die Unternehmensleitung den Abschluss nach dem Berichtsdatum trotz notwendiger Änderung nicht ändert.
  quelle: hwp-er-2026__rz-0326-s256
  zitat: modifiziert der Abschlussprüfer seine Prüfungsaussage (sofern dem Unternehmen noch nicht zugestellt)
- text: Berichtsdatum und Unterzeichnung des Berichts (der Agent datiert und unterzeichnet nie).
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Keine Unterzeichnung, keine Datierung
- text: Visum je Schritt, ✓ je Prüffeld, Abschliessende Beurteilung und Status in Bereich 10.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: 'Visum (Kürzel und Datum) pro Schritt, ✓ pro Prüffeld, «Abgeschlossen» und «Review» in der Fusszeile, Status in Bereich 10: alles bleibt beim Menschen.'
- text: 'Abschluss der Auftragsakte und PDF-Akte (Prozess 6): nur auf Anweisung des WP.'
  quelle: konzept-ki-revisionsagent-2026__c010-1
  zitat: Die PDF-Akte (Prozess 6) entsteht nur auf seine Anweisung.
- text: Ob der Agent WP-gekennzeichnete Schritte überhaupt vorbereitet (offener Entscheid consis).
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: Ob der Agent auch WP-Schritte (Wirtschaftsprüfer) vorbereitet oder auslässt, ist der wichtigste offene Entscheid.
unterlagen:
- dokument: Vom VR genehmigte und unterzeichnete Jahresrechnung (Bilanz, Erfolgsrechnung, Anhang)
  zweck: Formelle Prüfung (A1-301/305), frühestes Berichtsdatum, Jahresakten
  quelle: ser-2022__anh-e-s101-1
  zitat: ein unterzeichnetes Exemplar der Jahresrechnung (Bilanz, Erfolgsrechnung, Anhang)
- dokument: Antrag des VR über die Verwendung des Bilanzgewinns (separates Dokument, nicht Teil der JR)
  zweck: Prüfung nach OR 729a Abs. 1 Ziff. 2 (P1-303, A1-307)
  quelle: hwp-er-2026__rz-0213-s232
  zitat: Der Antrag des Verwaltungsrats zur Verwendung des Bilanzgewinns hat die Eigenkapitalsituation per Bilanzstichtag wiederzugeben.
- dokument: Vollständigkeitserklärung (Entwurf und unterzeichnetes Original)
  zweck: Schriftliche Erklärungen der Unternehmensleitung (A1-103), Jahresakten
  quelle: ser-2022__6-2-5
