  zitat: Beurteilung der Höhe der verfügbaren flüssigen Mittel
- dokument: Aufstellung Forderungen/Darlehen gegenüber Aktionären, Beteiligten und Nahestehenden
  zweck: Einlagenrückgewähr Art. 680 Abs. 2 OR (P1-305)
  quelle: katalog-revio4__c003-51
