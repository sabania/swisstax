- dokument: Schriftliche Antworten der Kundenbefragung (10.11)
  zweck: Auswertung der Befragungsschritte durch den Agenten
  quelle: konzept-ki-revisionsagent-2026__c006-2
  zitat: 10.11 Kundenbefragung
dokumentation:
- text: 'Je Prüfschritt (A1-102, A1-103, A1-203, A1-205, A1-304, P1-303, P1-305, P1-313, T1-109, T1-318 …) im Textfeld: Prüfziel, Quellen (M-Files-ID und Version), Umfang mit Begründung,
    Ergebnis, Feststellungen, Pendenzen, Status; Visum offen.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status.
- text: Rechenweg der Reservezuweisung (Verlustvortrag, 5 %, Obergrenze) und des Kapitalverlusts nachvollziehbar im Textfeld P1-303 bzw. P1-313 festhalten (Audit Trail).
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel
- text: Fehlaussagen und ihre Behandlung (korrigiert/nicht korrigiert) dokumentieren.
  quelle: ser-2022__7-2
  zitat: Fehlaussagen infolge festgestellter und/oder angenommener Sachverhalte und ihre Behandlung
- text: Je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung gehören in die Jahresakten (revio 10.4, M-Files).
  quelle: ser-2022__7-2
  zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- text: Mündlich kommunizierte wesentliche Sachverhalte (z. B. aus der Schlussbesprechung) in den Arbeitspapieren festhalten.
  quelle: hwp-er-2026__rz-0302-s250
  zitat: Werden wesentliche Sachverhalte mündlich kommuniziert, dokumentiert der Abschlussprüfer dies in den Arbeitspapieren.
- text: Kurzprotokoll der Schlussbesprechung (Entwurf Agent, Fassung WP).
  quelle: hwp-er-2026__rz-0459-s289
  zitat: Es empfiehlt sich, über die Schlussbesprechung ein (Kurz-)Protokoll zu erstellen.
- text: Memorandum zur abschliessenden Durchsicht durch den leitenden Prüfer ist empfohlen (erstellt der WP; Agent liefert Rapport als Grundlage).
  quelle: ser-2022__7-2
  zitat: Ein Memorandum, das die abschliessende Durchsicht der Prüfungsdokumentation durch den leitenden Abschlussprüfer und die Prüfungsergebnisse
- text: 'Notizen: Pendenz (fehlende Unterlagen/Antworten), Wesentliche Feststellungen (Fehler, Buchungsvorschläge ohne Verbuchung), Schlussbesprechung (Punkte für den WP); Notizen nie
    löschen oder erledigen.'
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Notizen löscht oder erledigt er nie.
- text: Zeitpunkt festhalten, bis zu dem Ereignisse nach dem Bilanzstichtag erhoben wurden (Grundlage für das Berichtsdatum).
  quelle: hwp-er-2026__rz-0322-s256
  zitat: So wird festgelegt, bis zu welchem Zeitpunkt der Abschlussprüfer die Berücksichtigung von Ereignissen nach dem Bilanzstichtag geprüft hat.
- text: Endgültige Auftragsakte innert der intern festgelegten Frist abschliessen (in der Regel höchstens 60 Tage nach Berichtsdatum; Anweisung durch den WP).
  quelle: hwp-er-2026__rz-0334-s258
  zitat: höchstens 60 Tage nach dem Datum des Revisionsberichts
- text: Jede Aktion, Quelle und Berechnung protokollieren (Audit Trail in M-Files).
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel
fallstricke:
- text: 'Keine Rückdatierung: Bericht frühestens auf die Genehmigung der Jahresrechnung datieren; bei zeitlichem Abstand gilt das Datum der Berichtsabgabe. Der Agent datiert ohnehin
    nie.'
  quelle: hwp-er-2026__rz-0450-s288
  zitat: trägt der Bericht das Datum der Berichtsabgabe (keine Rückdatierung)
- text: VE-Datum entspricht in der Regel dem Berichtsdatum.
  quelle: ser-2022__anh-e-s102-1
  zitat: Das Datum der Vollständigkeitserklärung entspricht im Regelfall dem Datum der Unterzeichnung des Revisionsberichts.
- text: Die unterzeichnete VE sollte in der Regel vor Berichtsabgabe vorliegen – nicht früh einholen und vergessen; fehlt sie, als Pendenz melden, das Vorgehen entscheidet der WP.
  quelle: ser-2022__anh-e-s102-1
  zitat: sollte sich zudem in der Regel vor Abgabe des Revisionsberichtes in den Händen der Revisionsstelle befinden
- text: Die VE ersetzt keine Prüfungsnachweise; wesentliche Positionen nicht nur auf Erklärungen stützen.
  quelle: hwp-er-2026__rz-0338-s259
  zitat: Zu beachten ist, dass die Vollständigkeitserklärung kein Ersatz für Prüfungsnachweise ist
- text: 'VE-Ergänzungen nicht mit dem Grundtext verwechseln: Ereignisse nach Stichtag, Kreditvereinbarungen, Rechtsstreitigkeiten usw. stehen schon in Beispiel 1; mandatsspezifisch sind
    die Platzhalter [12]–[15].'
  quelle: ser-2022__anh-e-s104-1
  zitat: Sämtliche wesentlichen Ereignisse nach dem Bilanzstichtag sind in der Jahresrechnung erfasst bzw. offengelegt.
- text: 'Ohne Zweifel an der Fortführung keine pauschalen PBC-Vorschläge für Budget/Liquiditätsplanung: die Erklärung in der VE genügt.'
  quelle: ser-2022__anh-g-s140-1
  zitat: genügt die Erklärung der Unternehmensleitung in der Vollständigkeitserklärung als Nachweis der erfolgten Einschätzung und der Beurteilung
- text: Einzeln unwesentliche Fehler können in der Summe wesentlich sein – immer kumulieren.
  quelle: hwp-er-2026__rz-0329-s257
  zitat: Es ist zu beachten, dass einzelne unwesentliche Befunde in der Summe wesentlich sein können.
- text: 'Reservezuweisung: Verlustvortrag zuerst beseitigen; ist die Obergrenze (mit gesetzlicher Kapitalreserve 50 % des AK, Holding 20 %) erreicht, besteht keine Zuweisungspflicht
    – keine «fehlende Zuweisung» melden.'
  quelle: or__art-672
  zitat: bis sie zusammen mit der gesetzlichen Kapitalreserve die Hälfte des im Handelsregister eingetragenen Aktienkapitals erreicht
- text: Gewinnvortrag nicht in die Basis der 5 %-Zuweisung einrechnen; bleibt nach Abzug des Verlustvortrags ein Bilanzverlust, entfällt die Zuweisung.
  quelle: hwp-bur-2023__rz-0585-s280
  zitat: Ist der Verlustvortrag aus dem Vorjahr grösser als der Jahresgewinn, d.h., verbleibt weiterhin ein Bilanzverlust, ist keine Zuweisung vorzunehmen.
- text: Für Dividende und Kapitalschutz (OR 680 Abs. 2) sind wesentliche negative Entwicklungen nach dem Stichtag einzubeziehen.
  quelle: hwp-er-2026__rz-0185-s223
  zitat: Dies betrifft namentlich negative Entwicklungen, die eine per Bilanzstichtag denkbare Dividende ggf. verunmöglichen können.
- text: Gesetzes- und statutenkonforme Dividende kann trotzdem einen Hinweis auslösen, wenn sie die Liquidität erheblich entzieht.
  quelle: ser-2022__8-3-2-t2
  zitat: die beantragte und grundsätzlich gesetzes- und statutenkonforme Dividende führt zu einem erheblichen Liquiditätsentzug
- text: Ohne Bilanzgewinn und ohne Antrag (Verrechnung, Ausschüttung, Rückzahlung) entfällt die Bestätigung zum Antrag im Bericht – Textbaustein anpassen.
  quelle: textbausteine-gewinnverwendung-2022__s001-3
  zitat: Die Bestätigung zum Antrag über die Verwendung des Bilanzgewinns entfällt, wenn kein Bilanzgewinn vorliegt
- text: Freiwillige Gewinnreserven müssen mit Verlusten verrechnet werden; Vortrag auf neue Rechnung ist nur anstelle der Verrechnung mit gesetzlichen Reserven zulässig.
  quelle: hwp-er-2026__rz-0208-s230-t1
  zitat: Hingegen erfolgt zwingend eine Verlustverrechnung bei Vorliegen von freiwilligen Gewinnreserven
- text: Der Antrag über die Verwendung des Bilanzgewinns ist nicht Bestandteil der Jahresrechnung, auch wenn die revio-Liste A1-305 die Gewinnverwendung mitaufführt.
  quelle: hwp-er-2026__rz-0213-s232
  zitat: Der Antrag ist nicht Bestandteil der Jahresrechnung.
- text: Rangrücktritt beseitigt den Kapitalverlust nicht und ist keine Massnahme nach OR 725a; er befreit nur von der Benachrichtigung des Gerichts bei Überschuldung.
  quelle: qa-kapitalverlust-2023__1-2-t3
  zitat: Ein Rangrücktritt an sich beseitigt den Kapitalverlust nicht
- text: Die Prüfung der Zwischenabschlüsse nach OR 725b ist weder eingeschränkte noch ordentliche Revision – nicht in der SER-Akte vorbereiten, dem WP melden.
  quelle: ser-2022__9-t2
  zitat: handelt es sich weder um eine eingeschränkte noch um eine ordentliche Revision
- text: VE gegenüber dem zugelassenen Revisor (Muster c013-1) gilt nur bei Opting-out ohne Revisionsstelle (OR 725a Abs. 2), nicht bei bestehender Revisionsstelle.
  quelle: or__art-725a
  zitat: Hat die Gesellschaft keine Revisionsstelle, so muss die letzte Jahresrechnung vor ihrer Genehmigung durch die Generalversammlung überdies einer eingeschränkten Revision
- text: Fortführungszeitraum der Unternehmensleitung kürzer als 12 Monate ab Stichtag → Ausdehnung verlangen (WP).
  quelle: hwp-er-2026__rz-0194-s225
  zitat: fordert der Abschlussprüfer die Unternehmensleitung auf, den Zeitraum auf mindestens zwölf Monate auszudehnen
- text: Sachverhalte, die eine Modifizierung erfordern, dürfen nicht nur in einer ergänzenden schriftlichen Mitteilung stehen, sondern müssen in den Bericht.
  quelle: hwp-er-2026__rz-0461-s289
  zitat: nur in der ergänzenden schriftlichen Berichterstattung dargestellt werden, nicht aber im Bericht der Revisionsstelle
- text: 'Schreibgrenze: Der Agent schreibt nur in Bereich 4 (Prüffelder) und Bereich 10 (Unterlagen zum Abschluss); Bereich 6 (6.1 nicht nachgebuchte Fehler, 6.3 Ereignisse/Going concern)
    nur lesen.'
  quelle: konzept-ki-revisionsagent-2026__c006-1
  zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
- text: Leserecht für 3.4 Going concern und 6.2 ist noch offen (Entscheid consis); 6.2 nur als Leitfaden für die Plausibilisierung.
  quelle: konzept-ki-revisionsagent-2026__c017-1
  zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
- text: 'Befragungsschritte (A1-102, A1-103, T1-109) kann der Agent nicht abschliessen: nur schriftliche Antworten auswerten, sonst Pendenz; Status höchstens «teilweise bearbeitet».'
  quelle: konzept-ki-revisionsagent-2026__c012-1
  zitat: höchstens «teilweise bearbeitet»
- text: 'Kein Kundenversand: VE-Entwurf, Fragen und PBC-Einladungen nie selbst an den Kunden senden (z. B. kein rv_post_workpapers_SendPbcInviteMail); E-Mail nur an die WP-Adresse.'
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: nie an Kunden
- text: Buchungsvorschläge nur als Notiz, nie verbuchen – auch nicht bei offensichtlichen Fehlern in der Schlussphase.
  quelle: konzept-ki-revisionsagent-2026__c015-1
  zitat: 'Buchungsvorschläge sind bereits geregelt: als Notiz, ohne Verbuchung'
- text: In revio heissen SCH1–SCH5 nicht «Schlussarbeiten», sondern Prüffelder der Erfolgsrechnung (SCH1 Betrieblicher Ertrag …); die Beendigungsschritte liegen vor allem in A1, P1 und
    T1. SCH3 ist hier nur wegen der Durchsicht in neuer Rechnung (SCH3-302) relevant.
  quelle: katalog-revio4__c003-58
  zitat: SCH1 | Betrieblicher Ertrag
- text: Weicht die GV vom Antrag ab, kann die Revisionsstelle den Beschluss erst im Folgejahr prüfen (P1-312 im Folgejahr).
  quelle: hwp-er-2026__rz-0446-s287
  zitat: Die Revisionsstelle wird den Gewinnverwendungsbeschluss erst im Folgejahr prüfen können.
- text: 'Wird nach Berichtsabgabe eine Änderung nötig und der Bericht ist bereits ausgeliefert: Abschluss darf nicht an Dritte gehen, bevor er geändert ist – sofort WP informieren.'
  quelle: hwp-er-2026__rz-0327-s257
  zitat: dass der Abschluss nicht an Dritte herausgegeben werden darf, bevor nicht die notwendigen Änderungen vorgenommen wurden
- text: 'GVB-Entwurf: Ob der Agent bei Zusatz, Hinweis oder Einschränkung vom Normalwortlaut abweicht, ist offen – bis zum Entscheid nur markieren, Musterwahl beim WP.'
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Nur Normalwortlaut gemäss 7.1? Vorgehen bei Einschränkung, Zusatz (z. B. Überschuldung, Rangrücktritt) oder Hinweis.
fragen_kunde:
- frage: Sind seit dem Bilanzstichtag wesentliche Ereignisse eingetreten (z. B. Verlust eines Grosskunden, Forderungsausfall, Schadenfall, Rechtsstreit, Betriebsunterbruch, aber auch
    positive Ereignisse)? Mit welchen Beträgen?
  zweck: Ereignisse nach dem Bilanzstichtag (A1-102, T1-109); Anpassung oder Offenlegung im Anhang (Art und Schätzung der Auswirkung)
- frage: Bestehen bedeutende schwebende Geschäfte oder andere Sachverhalte aus der Zeit vor dem Bilanzstichtag mit Verlustrisiko?
  zweck: T1-109; berücksichtigungspflichtige Ereignisse, Rückstellungen (O1/M3)
- frage: Wurden seit dem Stichtag neue Kredite, Garantien, Bürgschaften oder andere Verpflichtungen eingegangen, Vermögenswerte gekauft oder verkauft?
  zweck: Ereignisse nach Stichtag; Eventualverbindlichkeiten im Anhang
- frage: Sind Kapitalerhöhungen, Fusionen, Umstrukturierungen oder eine Auflösung beschlossen oder geplant?
  zweck: Ereignisse nach Stichtag; Fortführung
- frage: Haben sich Schätzungen seit dem Stichtag verändert (Rückstellungen, Wertberichtigungen, Werthaltigkeit von Debitoren, Vorräten, Beteiligungen)?
  zweck: Bewertung per Stichtag mit Erkenntnissen bis Berichtsdatum
- frage: Wie schätzt die Unternehmensleitung die Fortführungsfähigkeit für mindestens 12 Monate ab Stichtag ein, und gibt es Pläne, die Tätigkeit ganz oder teilweise einzustellen? (Budget/Liquiditätsplanung
    nur bei Indikatoren oder auf Anweisung des WP anfordern.)
  zweck: Going Concern (A1-205, T1-318); OR 958a; ohne Zweifel genügt die Erklärung in der VE
- frage: Werden alle Kreditbedingungen (Covenants) eingehalten? Laufen Finanzierungen in den nächsten 12 Monaten aus und ist die Anschlussfinanzierung gesichert?
  zweck: Fortführung (L1/N1); Angaben in der Vollständigkeitserklärung zu Kreditvereinbarungen
- frage: Hat der VR wegen eines Kapitalverlusts oder einer möglichen Überschuldung Massnahmen beschlossen (Sanierung, Rangrücktritte, Zwischenabschlüsse)? Welche und wann?
  zweck: P1-313; Pflichten nach OR 725a/725b; Zusatz oder Hinweis im Bericht (WP)
- frage: Bestehen Forderungen oder Darlehen gegenüber Aktionären oder Nahestehenden? Zu welchen Bedingungen (Zins, Sicherheiten, Rückzahlung)?
  zweck: Einlagenrückgewähr Art. 680 Abs. 2 OR (P1-305)
- frage: Wann und in welcher Höhe soll die beantragte Dividende ausbezahlt werden, und sind die flüssigen Mittel danach ausreichend?
  zweck: Prüfung Antrag Gewinnverwendung (P1-303); Liquiditätsentzug
- frage: Wurden die Statuten seit der letzten GV geändert (z. B. Bestimmungen zu Reserven oder Ausschüttungen)? Ist die Gesellschaft eine Holdinggesellschaft?
  zweck: Statutenkonformität des Antrags; Obergrenze der gesetzlichen Gewinnreserve (50 % bzw. 20 % bei Holding, OR 672 Abs. 2)
- frage: 'Werden die vorgeschlagenen Korrekturbuchungen vorgenommen? Falls nein: aus welchen Gründen?'
  zweck: Beurteilung nicht korrigierter Fehler (A1-203)
- frage: Bestehen laufende oder drohende Rechtsstreitigkeiten oder behördliche Verfahren?
  zweck: Beilage zur Vollständigkeitserklärung; Rückstellungen/Eventualverbindlichkeiten
- frage: An welchem Datum genehmigt der VR die Jahresrechnung, und wer unterzeichnet Jahresrechnung und Vollständigkeitserklärung?
  zweck: Frühestes Berichtsdatum; Unterzeichnung nach OR 958 Abs. 3
- frage: An welchem Datum findet die ordentliche GV statt?
  zweck: 'Terminplanung: Revisionsbericht mindestens 20 Tage vor der GV zugänglich (OR 699a)'
- frage: Wann und mit wem (VR-Präsident, GL, Verantwortliche Rechnungswesen) kann die Schlussbesprechung stattfinden?
