- was: 'Ereignisse nach dem Bilanzstichtag erheben (A1-102, T1-109; Durchsicht neue Rechnung z. B. SCH3-302): Hinweise aus Unterlagen nach dem Stichtag sammeln (Protokolle aus A1-304,
