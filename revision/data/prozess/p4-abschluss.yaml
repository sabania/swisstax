  - quelle: konzept-ki-revisionsagent-2026__c010-1
    zitat: Alles, was der Agent nicht klären kann, erfasst er als Pendenz und meldet es im Rapport.
- was: 'GV- und VR-Protokolle lesen (A1-304): Protokolle des Geschäftsjahres und nach dem Bilanzstichtag bis möglichst nahe ans Berichtsdatum durchsehen; wichtige Sachverhalte mit möglicher
    Auswirkung auf die Jahresrechnung festhalten (Ereignisse nach Stichtag, Finanzierung, Sanierung, Rechtsfälle, Dividenden). Zusätzlich feststellen: Genehmigung der letzten JR innert
    sechs Monaten, Wahl der Revisionsstelle, Gewinnverwendungsbeschluss Vorjahr, Unterzeichnung bzw. formelle Gutheissung der JR. Fehlen Protokolle nach dem Stichtag: Pendenz bzw. PBC-Vorschlag.'
  wer: Agent
