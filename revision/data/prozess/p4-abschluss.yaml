- was: 'Gefundene Ereignisse einordnen und mit Jahresrechnung/Anhang abgleichen: Vorschlag «berücksichtigungspflichtig» (Umstand lag am Stichtag vor → Anpassung) oder «nicht zu berücksichtigen»
    (neuer Umstand → ggf. Offenlegung im Anhang). Für die Offenlegung prüfen, ob Art des Ereignisses und Schätzung der finanziellen Auswirkungen angegeben sind (ist keine Schätzung möglich,
    muss dies stehen); Betrag im Rechenmodul (`rechne`) schätzen; wesentliche Fälle als Notiz «Wesentliche Feststellungen».'
