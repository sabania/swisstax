- was: 'Bei Zweifeln an der Fortführung (nur auf Anweisung des WP): besondere Handlungen vorbereiten – Plan-Cashflows analysieren, jüngsten Zwischenabschluss auswerten, Kreditbedingungen
    auf Verstösse durchsehen, Protokolle auf finanzielle Schwierigkeiten lesen, Finanzierungszusagen/Rangrücktritte beschaffen; schriftliche Erklärung zu den Plänen über den WP einfordern
    lassen.'
  wer: Agent bereitet vor, WP entscheidet
