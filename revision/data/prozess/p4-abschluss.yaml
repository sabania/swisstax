- was: 'Antrag über die Verwendung des Bilanzgewinns prüfen (P1-303, A1-307, P1-302, P1-312, P1-305): mit `rechne` in fester Reihenfolge nachrechnen – (1) Verlustvortrag vom Jahresgewinn
    abziehen (Gewinnvortrag nicht einbeziehen; bleibt ein Bilanzverlust, keine Zuweisung); (2) 5 % an die gesetzliche Gewinnreserve; (3) Obergrenze prüfen: gesetzliche Gewinnreserve
    + gesetzliche Kapitalreserve ≥ 50 % des eingetragenen AK (Holding 20 %) → keine Pflichtzuweisung mehr, keine Feststellung «fehlende Zuweisung»; (4) Dividende nur aus Bilanzgewinn
    und hierfür gebildeten Reserven, erst nach den Zuweisungen; (5) bei Verlust: Reihenfolge OR 674 Abs. 1, Vortrag statt Verrechnung mit gesetzlichen Reserven zulässig. Danach mit Bilanz/ER
    abstimmen, Vortrag mit Vorjahres-JR und GV-Protokoll abgleichen, Statuten durchsehen, Einlagenrückgewähr (P1-305, Art. 680 Abs. 2 OR) bei Forderungen gegenüber Beteiligten, verfügbare
    Liquidität und Ereignisse nach Stichtag beurteilen. Auszahlung und Verrechnungssteuer der beantragten Dividende: P1-315 im Folgejahr.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 'Bereich 4: P1-303, A1-307, P1-302, P1-312, P1-305 (Textfeld mit Rechenweg); Forderungen ggü. Beteiligten aus D1/H2 lesen; 1.1 Antrag VR lesen; Dividenden nur lesen (rv_get_workpapers_LoadDividends)'
