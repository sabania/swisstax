- was: 'Ausweis und Bestand des Rangrücktritts prüfen: Verbindlichkeit bleibt bilanziert, Rangrücktritt in Bilanz oder Anhang offengelegt; in Folgejahren Bewegungen (Tilgung, Verrechnung)
    auf rangrücktrittsbelasteten Forderungen analysieren – Tilgung trotz andauernder Überschuldung als «Wesentliche Feststellungen» an den WP (Hinweis, Prüfungsaussage, Anzeige entscheidet
    der WP). Reduktion nur ausnahmsweise und kumulativ: (a) geprüfter (Zwischen-)Abschluss zeigt eine mindestens entsprechend tiefere Überschuldung, (b) schriftliche, begründete VR-Darlegung,
    dass in den nächsten zwölf Monaten keine weiteren Verluste absehbar sind, (c) keine Benachteiligung anderer Rangrücktrittsgläubiger (ausser mit deren Zustimmung); danach alle Anforderungen
