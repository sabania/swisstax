# Prozessphase p6-kapitalschutz – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p6-kapitalschutz
titel: Kapitalverlust, Überschuldung, Rangrücktritt, Zahlungsunfähigkeit (OR 725–725c, 729c)
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: false
ziel: Kapitalschutz-Tatbestände (drohende Zahlungsunfähigkeit, hälftiger Kapitalverlust, begründete Besorgnis bzw. Überschuldung) aus Jahresrechnung/Zwischenabschluss erkennen, rechnen
  und belegen; Rangrücktritte und Sanierungsmassnahmen prüfen; Zusatz/Hinweis im Bericht und Anzeigepflicht OR 729c für den WP vorbereiten.
wann: Bei jedem Mandat nach dem Import der Jahresrechnung (Prozess 1) als Schwellen-Check; vertieft, sobald JR oder Zwischenabschluss Kapitalverlust/Überschuldung zeigt, Indikatoren
  (Verluste, Cash Drain, Liquiditätsprobleme) vorliegen oder VR/GL bzw. die eigene Treuhandabteilung (Doppelmandat) eine Schieflage meldet; spätestens vor dem GVB-Entwurf (Prozess 5).
  Fristen laufen ab Kenntnis («gebotene Eile»).
gesetz:
- thema: VR überwacht Zahlungsfähigkeit (drohende Zahlungsunfähigkeit)
  quelle: or__art-725
  zitat: Der Verwaltungsrat überwacht die Zahlungsfähigkeit der Gesellschaft.
- thema: Massnahmen bei drohender Zahlungsunfähigkeit, Nachlassstundung
  quelle: or__art-725
  zitat: Er reicht nötigenfalls ein Gesuch um Nachlassstundung ein.
- thema: 'Kapitalverlust: Schwelle (hälftige Deckung)'
  quelle: or__art-725a
  zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve
    nicht mehr decken
- thema: 'Kapitalverlust: Massnahmenpflicht des VR'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Kapitalverlust bei Opting-out: eingeschränkte Revision durch zugelassenen Revisor'
  quelle: or__art-725a
  zitat: so muss die letzte Jahresrechnung vor ihrer Genehmigung durch die Generalversammlung überdies einer eingeschränkten Revision durch einen zugelassenen Revisor unterzogen werden
- thema: Wegfall Revisionspflicht 725a Abs. 2 bei Nachlassstundung
  quelle: or__art-725a
  zitat: Die Revisionspflicht nach Absatz 2 entfällt, wenn der Verwaltungsrat ein Gesuch um Nachlassstundung einreicht.
- thema: Gebotene Eile (VR und Revisionsstelle)
  quelle: or__art-725a
  zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
- thema: 'Überschuldung: Zwischenabschlüsse bei begründeter Besorgnis'
  quelle: or__art-725b-t1
  zitat: so erstellt der Verwaltungsrat unverzüglich je einen Zwischenabschluss zu Fortführungswerten und Veräusserungswerten
- thema: Verzicht auf Zwischenabschluss zu Veräusserungswerten
  quelle: or__art-725b-t1
  zitat: Auf den Zwischenabschluss zu Veräusserungswerten kann verzichtet werden, wenn die Annahme der Fortführung gegeben ist
- thema: Prüfung der Zwischenabschlüsse durch die Revisionsstelle
  quelle: or__art-725b-t1
  zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen
- thema: Benachrichtigung des Gerichts durch den VR
  quelle: or__art-725b-t1
  zitat: Ist die Gesellschaft gemäss den beiden Zwischenabschlüssen überschuldet, so benachrichtigt der Verwaltungsrat das Gericht.
- thema: 'Ausnahme 1: Rangrücktritt inkl. Zinsen'
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: 'Ausnahme 2: Sanierung innert höchstens 90 Tagen'
  quelle: or__art-725b-t1
  zitat: spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse, behoben werden kann
- thema: Anzeigepflichten des zugelassenen Revisors (ohne Revisionsstelle)
  quelle: or__art-725b-t2
  zitat: Verfügt die Gesellschaft über keine Revisionsstelle, so obliegen dem zugelassenen Revisor die Anzeigepflichten der eingeschränkt prüfenden Revisionsstelle.
- thema: Aufwertung Grundstücke/Beteiligungen zur Behebung
  quelle: or__art-725c
  zitat: dürfen Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs- oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden
- thema: Ausweis Aufwertungsreserve
  quelle: or__art-725c
  zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
- thema: Schriftliche Bestätigung der Revisionsstelle zur Aufwertung
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt
- thema: Anzeigepflicht der Revisionsstelle bei offensichtlicher Überschuldung
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: Geltung für GmbH/Genossenschaft (SER-Fussnote)
  quelle: ser-2022__9-t2
  zitat: 'GmbH: Art. 820 OR; Genossenschaft: Art. 903 OR'
schritte:
- was: 'Schwellen-Check aus der importierten Jahresrechnung: geschütztes Eigenkapital ermitteln (Aktien-/PS-Kapital + gesetzliche Kapital- und Gewinnreserve bis max. 50 % bzw. 20 % bei
    Holdings + volle Reserven für eigene Anteile im Konzern und Aufwertungsreserve), Hälfte als Bezugsgrösse mit Aktiven − Verbindlichkeiten vergleichen; Überschuldung (Aktiven < Fremdkapital
    inkl. Rückstellungen und PRA) feststellen. Stille Reserven nicht einrechnen, Covid-19-Kredite/Härtefall-Darlehen nicht als Fremdkapital, eigene Kapitalanteile ändern die Bezugsgrösse
    nicht, Rangrücktritte beseitigen nichts; massgebend ist der Einzelabschluss. Rechnen im Rechenmodul (`revision.py kapitalverlust …`), nicht im Sprachmodell.'
  wer: Agent
  revio: Bereich 1.1/1.2 lesen (rv_get_financialStatement_LoadBalanceAccounts, rv_get_financialStatement_LoadKeyFigureItems); Ergebnis im Textfeld P1-313 «Beurteilung Eigenkapital in
    Bezug auf OR 725» (rv_put_auditActivities_UpdateDossierActivity), Querverweis A1-205
  mfiles: Definitive Bilanz/ER/Anhang, HR-Auszug bzw. Statuten (Aktienkapital), GV-Protokoll Vorjahr (Reserven), Aufstellung Covid-/Härtefallkredite
  fundstellen:
  - quelle: hwp-er-2026__rz-0369-s112
    zitat: wobei allfällige stille Reserven bei der Berechnung grundsätzlich keine Berücksichtigung
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: resp. bei Holdinggesellschaften 20 %
  - quelle: hwp-er-2026__rz-0372-s112
    zitat: Ist das bilanzielle Eigenkapital grösser oder gleich null, aber kleiner als die Bezugsgrösse des geschützten Eigenkapitals, dann liegt ein Kapitalverlust im Sinne von Art.
      725a Abs. 1 OR vor.
  - quelle: qa-kapitalverlust-2023__1-1-t1
    zitat: Das geschützte Eigenkapital und damit die Bezugsgrösse nach Art. 725a OR resp. PS-CH 290 bleiben unverändert.
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: wenn die (ordnungsgemäss bewerteten) Aktiven geringer sind als das Fremdkapital, bestehend aus Verbindlichkeiten, Rückstellungen und passiven Rechnungsabgrenzungsposten
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: Für die Berechnung sind Covid-19-Kredite nicht als Fremdkapital zu berücksichtigen
  - quelle: hwp-er-2026__rz-0373-s113
    zitat: Ein Rangrücktritt beseitigt den Kapitalverlust nicht
  - quelle: hwp-er-2026__rz-0358-s110
    zitat: Der Konzernrechnung kommt diesbezüglich keine Bedeutung zu.
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.
- was: Indikatoren für drohende Zahlungsunfähigkeit und begründete Besorgnis einer Überschuldung sammeln (Verluste, Cash Drain, Liquidität, Fälligkeiten, Verletzung von Kreditbedingungen,
    Rückstellungs-/Wertberichtigungsbedarf) und die Fortführungseinschätzung des VR (mindestens 12 Monate ab Stichtag) beschaffen; Befragung der Unternehmensleitung vorbereiten. Für
    die Revisionsstelle bestehen bei (drohender) Zahlungsunfähigkeit keine direkten Handlungspflichten, ein Verstoss des VR gegen OR 725 wäre aber im Bericht anzuzeigen.
  wer: Agent bereitet vor, WP entscheidet
  revio: 3.4 Going concern und 6.3 Ereignisse nach dem Bilanzstichtag/Going concern nur lesen; Textfeld A1-205 (Going Concern), T1-318 (Abweichung Fortführung im Anhang), T1-109
  mfiles: Liquiditätsplanung/Budget ≥ 12 Monate, Kredit- und Darlehensverträge, jüngster Zwischenabschluss, VR-Protokolle
  fundstellen:
  - quelle: hwp-er-2026__rz-0385-s115
    zitat: wenn sich aus der Jahresrechnung oder einem Zwischenabschluss zu Fortführungswerten eine Überschuldung ergibt
  - quelle: hwp-er-2026__rz-0385-s115
    zitat: wie z.B. Nachhaltigkeit und Ausmass eingetretener Verluste, Cash Drain
  - quelle: hwp-er-2026__rz-0364-s111
    zitat: eine drohende Zahlungsunfähigkeit einen möglichen Indikator für das Vorliegen eines Kapitalverlusts oder aber einer begründeten Besorgnis einer Überschuldung darstellen kann
  - quelle: ser-2022__anh-g-s138-1
    zitat: Art. 725 OR sieht für die Revisionsstelle weder bei der drohenden noch bei der tatsächlichen Zahlungsunfähigkeit direkte Handlungspflichten vor.
  - quelle: hwp-er-2026__rz-0364-s111
    zitat: müsste jedoch zuhanden der nächsten ordentlichen Generalversammlung im Bericht der Revisionsstelle angezeigt werden
  - quelle: hwp-er-2026__rz-0194-s225
    zitat: fordert der Abschlussprüfer die Unternehmensleitung auf, den Zeitraum auf mindestens zwölf Monate auszudehnen
  - quelle: hwp-er-2026__rz-0193-s225
    zitat: Verstösse gegen gesetzliche Eigenkapitalvorschriften (z.B. Art. 725 OR)
- was: 'Informationsfluss sicherstellen: Hinweise aus dem eigenen Buchführungsmandat (Doppelmandat) und klare Informationen von VR/GL über eine offensichtliche Überschuldung sofort an
    den WP melden, auch unter dem Jahr. Keine laufende Überwachungspflicht der Revisionsstelle; Pflichten entstehen erst bei klarer Information von kompetenter Stelle bzw. Feststellung
    im Rahmen der Prüfung.'
  wer: Agent
  revio: Notiz «Wesentliche Feststellung» im Prüffeld P1 (rv_put_workpapers_UpdateNote); Rapport an WP (Prozess 4) zuoberst
  mfiles: Buchhaltungsdossier/Korrespondenz der Treuhandabteilung (nur Mandatskontext), Mitteilungen VR/GL
  fundstellen:
  - quelle: hwp-er-2026__rz-0388-s116
    zitat: das Wissen des Treuhänders / der Treuhandabteilung über die finanzielle (Schief-)Lage des Mandanten wird als der Revisionsstelle bekannt qualifiziert
  - quelle: hwp-er-2026__rz-0387-s116
    zitat: Einzig wenn die Revisionsstelle klare und stichhaltige Informationen von kompetenter Stelle aus dem Unternehmen
  - quelle: hwp-er-2026__rz-0386-s116
    zitat: ist gemäss Art. 729c OR grundsätzlich erst zum Handeln aufgerufen
  - quelle: ser-2022__9-t3
    zitat: muss sie den Verwaltungsrat an seine Pflichten – namentlich die Erstellung und Vorlage zur Prüfung eines Zwischenabschlusses zu Fortführungs- und Veräusserungswerten – erinnern
- was: 'Bei Kapitalverlust: vom VR ergriffene bzw. der GV beantragte Massnahmen erheben (Ursachenanalyse, Sanierungskonzept, Forderungsverzicht, À-fonds-perdu, Auflösung stiller Reserven,
    Aufwertung 725c, Kapitalschnitt, Kapitalerhöhung) und den Zeitablauf seit Abschlusserstellung festhalten. Ob die Massnahmen genügen und ob eine Pflichtwidrigkeit vorliegt, beurteilt
    die Revisionsstelle (WP), nicht der Agent; welche Massnahmen nötig sind, entscheidet der VR.'
  wer: Agent bereitet vor, WP entscheidet
  revio: Textfeld P1-313; Befragungsprotokoll A1; Notiz «Wesentliche Feststellung»
  mfiles: VR-Protokolle, GV-Einladung/Traktanden, Sanierungskonzept, Verzichts-/Zuschussvereinbarungen, Kapitalerhöhungsunterlagen
  fundstellen:
  - quelle: hwp-er-2026__rz-0378-s114
    zitat: indem er im Wesentlichen die Ursachen des Kapitalverlusts, die Sanierungsfähigkeit der Gesellschaft, den erforderlichen Sanierungsbedarf und die möglichen Sanierungsmassnahmen
      analysiert
  - quelle: hwp-er-2026__rz-0375-s113-t1
    zitat: (b) Aufwertung von Grundstücken und Beteiligungen gemäss Art. 725c OR
  - quelle: hwp-er-2026__rz-0376-s114
    zitat: Die Revisionsstelle kann jedoch ihre Berichterstattung mit Blick auf konkrete, an der Generalversammlung ordentlich traktandierte Sanierungsbeschlüsse ergänzen.
  - quelle: hwp-er-2026__rz-0379-s114
    zitat: Es ist nicht an der Revisionsstelle, zu beurteilen, ob und ggf. welche Sanierungsmassnahmen
  - quelle: qa-kapitalverlust-2023__1-2-t3
    zitat: obliegt der Beurteilung der Revisionsstelle bzw. des zugelassenen Revisors
  - quelle: hwp-er-2026__rz-0380-s115
    zitat: ob sich der Verwaltungsrat der Überschuldungsgefahr bewusst ist und die allenfalls erforderlichen Massnahmen ergreift
- was: 'Bei begründeter Besorgnis bzw. buchmässiger Überschuldung: Zwischenabschlüsse zu Fortführungs- und (falls nötig) Veräusserungswerten einverlangen bzw. Vorliegen, Stichtag, VR-Genehmigung
    und Bewertungsbasis (Veräusserungswerte inkl. Stilllegungskosten) festhalten; fehlt er, Pendenz und PBC-Vorschlag. Die Prüfung des Zwischenabschlusses ist ein separater Auftrag nach
    SA-CH/PS-CH 290 (weder eingeschränkte noch ordentliche Revision); fallen Stichtage zusammen, braucht es zwei Berichte. Ergibt die eingeschränkte Revision eine Überschuldung, entspricht
    die JR dem Zwischenabschluss zu Fortführungswerten.'
  wer: Agent bereitet vor, WP entscheidet
  revio: Textfeld P1-313; Notiz «Pendenz»; Vorschlag PBC-Liste 10.10; Ablage Unterlagen Bereich 10
  mfiles: Zwischenabschlüsse (Fortführungs-/Veräusserungswerte) mit VR-Beschluss, Fortführungseinschätzung VR
  fundstellen:
  - quelle: ser-2022__9-t2
    zitat: handelt es sich weder um eine eingeschränkte noch um eine ordentliche Revision
  - quelle: ser-2022__9-t2
    zitat: Die Jahresrechnung entspricht in diesem Fall dem Zwischenabschluss zu Fortführungswerten und ist zu prüfen (Art. 725b OR).
  - quelle: qa-kapitalverlust-2023__2-2-2-t1
    zitat: Der Zwischenabschluss sollte deshalb in jedem Fall einverlangt werden
  - quelle: qa-kapitalverlust-2023__2-2-2-t2
    zitat: Auch in diesem Fall sind jedoch zwei Berichte zu verfassen (Bericht zur eingeschränkten Revision und Bericht gemäss PS-CH 290).
  - quelle: hwp-er-2026__rz-0401-s119
    zitat: Die Prüfung ist auf eine hinreichende Sicherheit ausgelegt
  - quelle: hwp-er-2026__rz-0392-s117
    zitat: Zudem müssen alle mit der Einstellung der Tätigkeit verbundenen Aufwendungen
  - quelle: hwp-er-2026__rz-0397-s119
    zitat: Es ist zu beachten, dass der Verwaltungsrat für seine Behauptung, die Gesellschaft sei nicht überschuldet
- was: 'Andauernde Überschuldung in Folgejahren: festhalten, ob erneut Zwischenabschlüsse vorliegen; ein Verzicht ist nur in übersichtlichen Verhältnissen nach individueller Risikobeurteilung
    (Geschäftstätigkeit, Volatilität, Ertragslage, Höhe Rangrücktritte) möglich – Entscheid beim WP.'
  wer: Agent bereitet vor, WP entscheidet
  revio: Textfeld P1-313; Vorjahresakte (rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId) lesen
  mfiles: Vorjahres-Revisionsbericht, Vorjahres-Zwischenabschlüsse und -Rangrücktritte
  fundstellen:
  - quelle: hwp-er-2026__rz-0389-s117
    zitat: Insoweit kann in übersichtlichen Verhältnissen ggf. auf die erneute (jährliche) Erstellung und Prüfung eines Zwischenabschlusses verzichtet werden
  - quelle: qa-kapitalverlust-2023__2-2-2-t3
    zitat: jedoch ist dies gemäss individueller Risikobeurteilung
- was: 'Rangrücktritt auf formelle und materielle Anforderungen prüfen (Checkliste vorbereiten): schriftlich, zweiseitig, unbedingt, zeitlich unbefristet, Rang hinter alle Gläubiger
    und Stundung von Kapital UND Zinsen, Betrag mindestens Überschuldung plus Sicherheitspolster für erwartete Verluste der nächsten 12 Monate (Fremdwährung!), keine Tilgung/Verrechnung,
    Sicherheiten nicht geltend machbar, Schweizer Recht massgebend; Bonität des Gläubigers. Garantien/Patronatserklärungen genügen nicht. L1-105/L1-304/N1-105 sind WP-Schritte: Agent
    nur auf Anweisung vorbereiten.'
  wer: Agent bereitet vor, WP entscheidet
  revio: L1-105, L1-304, N1-105 (WP-Schritte; Textfeld nur auf Anweisung), Beilage Vereinbarung (rv_post_auditActivities_AddAttachementsToAuditActivity); Querverweis P1-313
  mfiles: Rangrücktrittsvereinbarung(en) unterzeichnet, Darlehensverträge, Saldo inkl. Zinsen, Jahresrechnung/Bonitätsnachweis des Gläubigers
  fundstellen:
  - quelle: ser-2022__anh-h-s142-2
    zitat: Der «Rangrücktritt» im Sinne von Art. 725b Abs. 4 Ziff. 1 OR ist ein zweiseitiges Rechtsgeschäft
  - quelle: hwp-er-2026__rz-0410-s123
    zitat: muss der Rangrücktritt aus Beweisgründen schriftlich abgefasst sein
  - quelle: hwp-er-2026__rz-0412-s123
    zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
  - quelle: hwp-er-2026__rz-0415-s123-t1
    zitat: Der Rangrücktritt muss zeitlich unbefristet abgeschlossen werden
  - quelle: hwp-er-2026__rz-0415-s123-t2
    zitat: Bis zu diesem Zeitpunkt ist keine Tilgung der mit Rangrücktritt ausgestatteten Forderungen (inkl. Zinsen) gestattet, auch nicht eine solche durch Verrechnung.
  - quelle: hwp-er-2026__rz-0421-s125
    zitat: angemessenes Sicherheitspolster zur Deckung der in den nächsten 12 Monaten nach Unterzeichnung des Rangrücktritts
  - quelle: hwp-er-2026__rz-0418-s124
    zitat: Eine nachträgliche Sicherstellung der Forderung ist abzulehnen.
  - quelle: hwp-er-2026__rz-0419-s124
    zitat: Ob ein Rangrücktritt zugunsten einer schweizerischen Gesellschaft genügend ist, beurteilt sich jedoch allein nach Art. 725b Abs. 4 OR
  - quelle: hwp-er-2026__rz-0406-s122
    zitat: Keinen Ersatz für einen Rangrücktritt bilden «Deckungsgarantien» bzw. Garantien und Patronatserklärungen.
  - quelle: hwp-er-2026__rz-0432-s127
    zitat: Die Revisionsstelle hat sich davon zu überzeugen, dass der Rangrücktritt in qualitativer und quantitativer Hinsicht ausreichend ist.
  - quelle: hwp-er-2026__rz-0432-s127
    zitat: Dies beinhaltet auch die Beurteilung der Bonität des Rangrücktrittgläubigers
  - quelle: ser-2022__anh-d-s085-2
    zitat: Einsicht in Rangrücktrittsvereinbarungen
- was: 'Ausweis und Bestand des Rangrücktritts prüfen: Verbindlichkeit bleibt bilanziert, Rangrücktritt in Bilanz oder Anhang offengelegt; in Folgejahren Bewegungen (Tilgung, Verrechnung)
    auf rangrücktrittsbelasteten Forderungen analysieren. Reduktion/Aufhebung nur mit geprüftem (Zwischen-)Abschluss, schriftlicher VR-Begründung und schriftlicher Vereinbarung; bei
    Zwischenabschluss separater SA-CH-Prüfungsbericht.'
  wer: Agent bereitet vor, WP entscheidet
  revio: T1 Anhang (Textfeld), L1/N1 Kontenübersicht und Textfeld; Notiz «Wesentliche Feststellung» bei Tilgung trotz Überschuldung
  mfiles: Anhang JR, Kontoblatt Darlehen mit Rangrücktritt, Aufhebungs-/Reduktionsvereinbarung, VR-Begründung
  fundstellen:
  - quelle: hwp-er-2026__rz-0430-s127
    zitat: muss deshalb in der Jahresrechnung des Schuldners (in der Bilanz oder im Anhang) ausgewiesen und erläutert werden
  - quelle: hwp-er-2026__rz-0434-s128
    zitat: dass dem Rangrücktritt unterstellte Forderungen trotz andauernder Überschuldung ganz oder teilweise getilgt wurden
  - quelle: hwp-er-2026__rz-0425-s126
    zitat: Die Höhe des Rangrücktritts darf dabei jedoch grundsätzlich nicht reduziert werden.
  - quelle: hwp-er-2026__rz-0427-s127
    zitat: Im Interesse der rechtlichen Sicherheit für die Beteiligten ist eine schriftliche Aufhebung unerlässlich.
  - quelle: hwp-er-2026__rz-0426-s126
    zitat: Sollen die Rangrücktritte auf Basis eines Zwischenabschlusses reduziert oder aufgehoben werden, bedarf es eines separaten Prüfungsberichts
- was: 'Sanierung statt Gerichtsanzeige (OR 725b Abs. 4 Ziff. 2) bzw. Nachlassstundung: Datum der geprüften Zwischenabschlüsse (Fristbeginn) und 90-Tage-Frist festhalten, Zusagen und
    Vollzug bilanzwirksamer Massnahmen belegen; erhöht sich die Überschuldung oder reicht die Frist nicht, entfällt die Ausnahme. Erfolgsaussichten von Sanierungsplänen für die Nachlassstundung
    beurteilt das Gericht. Auch nach Beseitigung der Überschuldung bleiben die Pflichten aus Kapitalverlust bestehen.'
  wer: Agent bereitet vor, WP entscheidet
  revio: Textfeld P1-313; Notiz «Pendenz» mit Fristdatum; Rapport (Prozess 4)
  mfiles: Sanierungszusagen, Zahlungsbelege Kapitaleinschuss/Zuschuss, Verzichtserklärungen, Gesuch Nachlassstundung
  fundstellen:
