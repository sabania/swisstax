- was: 'Aufwertung nach OR 725c: nur zur Behebung eines Kapitalverlusts oder einer Überschuldung, nur Grundstücke und Beteiligungen, höchstens bis zum wirklichen Wert, Aufwertungsreserve
    gesondert unter der gesetzlichen Gewinnreserve; schriftliche Bestätigung der Revisionsstelle (separater Bericht an den VR) muss vorliegen; Offenlegung im Anhang. In Folgejahren:
    Auflösung der Aufwertungsreserve nur durch Umwandlung in AK/PS-Kapital, Wertberichtigung oder Veräusserung der aufgewerteten Aktiven. Der revio-Katalogtext zu P1-311 verweist noch
    auf OR 670 (aufgehoben seit 1.1.2023); massgebend ist OR 725c. Bewertungsnachweise beschaffen; Bestätigung erteilt nur der WP.'
