- was: 'Rangrücktritt auf formelle und materielle Anforderungen prüfen (Checkliste vorbereiten): schriftlich, zweiseitig, unbedingt, zeitlich unbefristet, Rang hinter alle Gläubiger
    und Stundung von Kapital UND Zinsen (Zinsen ausdrücklich vereinbart; Rangrücktritt ohne Zinsklausel → Notiz «Wesentliche Feststellungen», Ergänzung als «Pendenz»), Betrag mindestens
    im Ausmass der Überschuldung plus Sicherheitspolster für erwartete Verluste der nächsten 12 Monate (Fremdwährung!), keine Tilgung/Verrechnung, keine nachträgliche Sicherstellung;
    Bonität des Gläubigers. Ob die Deckungslücke zu Fortführungs- oder zu Veräusserungswerten massgebend ist, entscheidet der WP. Anwendbares Recht: Der Rangrücktritt untersteht grundsätzlich
    dem Recht des Gläubigers (IPRG), ob er genügt, bestimmt allein OR 725b Abs. 4; bei ausländischen Gläubigern ist die Unterstellung unter Schweizer Recht nur empfohlen, strengere ausländische
    Formvorschriften bleiben zu beachten. Garantien/Patronatserklärungen genügen nicht. L1-105/L1-304/N1-105 sind WP-Schritte (offener Entscheid consis): dort weder Eintrag noch Beilage,
    ausser auf ausdrückliche Anweisung.'
