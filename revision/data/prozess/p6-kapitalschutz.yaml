- was: 'Sanierung statt Gerichtsanzeige (OR 725b Abs. 4 Ziff. 2) bzw. Nachlassstundung: Datum der geprüften Zwischenabschlüsse (Fristbeginn) und 90-Tage-Frist festhalten, Zusagen und
    Vollzug bilanzwirksamer Massnahmen belegen; kumulativ dürfen die Gläubigerforderungen nicht zusätzlich gefährdet werden. Erhöht sich die Überschuldung oder reicht die Frist nicht,
    entfällt die Ausnahme. Realistische kurzfristige Sanierung ist kein Grund, Prüfungen aufzuschieben. Erfolgsaussichten von Sanierungsplänen für die Nachlassstundung beurteilt das
    Gericht. Auch nach Beseitigung der Überschuldung bleiben die Pflichten aus Kapitalverlust bestehen.'
