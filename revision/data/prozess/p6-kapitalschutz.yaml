    zitat: Für eine Aufwertung kommen ausschliesslich Beteiligungen oder Grundstücke in Frage.
  - quelle: or__art-725c
    zitat: Die Aufwertungsreserve kann nur durch Umwandlung in Aktien- oder Partizipationskapital sowie durch Wertberichtigung oder Veräusserung der aufgewerteten Aktiven aufgelöst werden.
  - quelle: or__art-670
    zitat: Aufgehoben durch Ziff. I des BG vom 19. Juni 2020 (Aktienrecht), mit Wirkung seit 1. Jan. 2023
  - quelle: hwp-bur-2023__rz-0895-s362
    zitat: Der Prüfungsbericht der Revisionsstelle resp. des zugelassenen Revisors ist an den Verwaltungsrat gerichtet
  - quelle: hwp-bur-2023__rz-0895-s362
    zitat: in der Regel mittels entsprechender Anhangsangabe in der Jahresrechnung
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: aus Aufwertungen (Art. 725c Abs. 1 OR)
- was: 'Rapport an den WP: Berechnung mit Herleitung, Indikatoren, Stand Zwischenabschlüsse/Rangrücktritte/Massnahmen, Fristen und offene Entscheide als wesentliche Punkte zuoberst;
    Mandat als Risiko-Mandat kennzeichnen. Visum, Abschliessende Beurteilung und Freigabe bleiben beim WP.'
  wer: Agent
  revio: Rapport per E-Mail nur an WP-Adresse (Prozess 4); Prüfschritt-Status «mit Feststellungen» (Befragungsschritte höchstens «teilweise bearbeitet»); Visum offen
  mfiles: Protokoll (Audit Trail) je Mandat und Jahr
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c011-2
    zitat: Status aller Schritte (vorbereitet, mit Feststellungen, teilweise, nicht bearbeitet), offene und wesentliche Punkte zuerst
  - quelle: hwp-er-2026__rz-0452-s132
    zitat: sind regelmässig Risiko-Mandate, welche auch in der Dokumentation der Überlegungen und Schritte besonderer Sorgfalt und Konsequenz bedürfen
entscheidungen_wp:
- text: Ob die Massnahmen des VR zur Beseitigung des Kapitalverlusts genügen (z.B. Rangrücktritte als hinreichende Massnahme) und ob ein Hinweis auf Gesetzesverstoss nötig ist.
  quelle: qa-kapitalverlust-2023__1-2-t3
  zitat: In der Praxis sind Fälle denkbar, in denen z.B. aufgrund der Art und beabsichtigten Entwicklung der Geschäftstätigkeit die Erlangung von Rangrücktritten eine hinreichende Massnahme
    darstellen kann.
- text: 'Hinweis nach OR 725a Abs. 1 bei Untätigkeit des VR auch dann, wenn die Aktionäre informiert sind: SER 8.3.2.1 (höherer Rang) und HWP Rz 423 verlangen ihn «in jedem Fall» bzw.
    «zwingend», HWP Rz 424 knüpft ihn kumulativ an fehlende Information der Aktionäre – Auslegung beim WP.'
  quelle: ser-2022__8-3-2-t1
  zitat: sind in jedem Fall im Revisionsbericht anzubringen
- text: Ob eine begründete Besorgnis einer Überschuldung besteht (Einzelfallbeurteilung).
  quelle: hwp-er-2026__rz-0385-s115
  zitat: lässt sich nicht in allgemein gültiger Weise sagen
- text: Verzicht auf das Einverlangen des Zwischenabschlusses zugunsten sofortiger Konkursanmeldung bei massiver, offensichtlicher Überschuldung.
  quelle: qa-kapitalverlust-2023__2-2-2-t1
  zitat: Für die Konkursanmeldung, wenn bei massiver, offensichtlicher Überschuldung ein sehr
- text: Vereinfachte Prüfung der Zwischenabschlüsse bei offensichtlicher, erheblicher Überschuldung ohne mögliche/beabsichtigte Sanierung (mit Hinweis im Bericht; Muster PH 10 Bsp. 18).
  quelle: hwp-er-2026__rz-0401-s119
  zitat: Vereinfachungen bei Prüfung und Bewertung sind dann vertretbar
- text: Gültigkeit und Genügen des Rangrücktritts inkl. Bonität des Gläubigers (WP-Schritte L1-105, L1-304, N1-105).
  quelle: ser-2022__anh-h-s143-1
  zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
- text: 'Höhe des Rangrücktritts: Ausrichtung auf die Deckungslücke zu Fortführungswerten oder zu Veräusserungswerten.'
  quelle: hwp-er-2026__rz-0420-s125
  zitat: sollte ein Rangrücktritt, der «nur» auf die Deckungslücke zu Fortführungswerten ausgerichtet ist, genügen
- text: 'Tilgung/Verrechnung rangrücktrittsbelasteter Forderungen trotz Überschuldung: Hinweis nach OR 729c, Auswirkung auf die Prüfungsaussage, erneute Anzeigepflicht.'
  quelle: hwp-er-2026__rz-0434-s128
  zitat: so sind ein Hinweis im Sinne von Art. 729c OR in Erwägung zu ziehen
- text: Verzicht auf erneute Zwischenabschlüsse bei andauernder Überschuldung.
  quelle: hwp-er-2026__rz-0389-s117
  zitat: gemäss individueller Risikobeurteilung
- text: 'Nur bei Opting-out (keine Revisionsstelle) bzw. als zugelassener Revisor nach OR 725a Abs. 2: Annahme eines zusätzlichen Auftrags zur Prüfung der Zwischenabschlüsse nach OR
    725b Abs. 2 (keine Übernahmepflicht; Unabhängigkeit bei Doppelmandat). Für die gesetzliche Revisionsstelle stellt sich diese Frage nicht – sie ist zuständig.'
  quelle: qa-kapitalverlust-2023__2-2-3-t6
  zitat: Die Annahme solcher Mandate ist von der Prüferin oder dem Prüfer daher in Eigenverantwortung und unter angemessener Dokumentation zu entscheiden.
- text: 'Zugelassener Revisor (OR 725a Abs. 2): Benachrichtigung des Gerichts bei Untätigkeit des VR – HWP Rz 458 verneint, Q&A Antwort 16 bejaht.'
  quelle: qa-kapitalverlust-2023__2-2-2-t8
  zitat: Entsprechend muss der zugelassene Revisor das Gericht benachrichtigen, wenn der Verwaltungsrat die Anzeige unterlässt (Art. 729c OR).
- text: Mahnung des VR mit Fristansetzung und Länge der Frist.
  quelle: hwp-er-2026__rz-0433-s127
  zitat: hat ihn die Revisionsstelle unter Ansetzung einer Frist
- text: Offensichtlichkeit der Überschuldung und Benachrichtigung des Gerichts nach OR 729c, auch im Zweifelsfall bzw. wenn der VR trotz Fristansetzung keine Zwischenabschlüsse vorlegt
    (Beweislast für das behauptete Eigenkapital liegt beim VR).
  quelle: hwp-er-2026__rz-0444-s129
  zitat: Es liegt beim Verwaltungsrat, gegenüber der Revisionsstelle und ggf. gegenüber dem Gericht das eﬀektive Vorhandensein des von ihm behaupteten Eigenkapitals zu belegen.
- text: 'Berichtswortlaut: Zusatz, Hinweis, Eventualzusatz, Einschränkung; Wahl des Berichtsbeispiels und der Formulierung (SER Bsp. 11 alt vs. OR 725a Abs. 1) (offener Entscheid consis).'
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Vorgehen bei Einschränkung, Zusatz (z. B. Überschuldung, Rangrücktritt) oder Hinweis.
- text: Beizug einer Zweitmeinung bzw. rechtlichen Rats.
  quelle: hwp-er-2026__rz-0452-s132
  zitat: Es kann daher angezeigt sein, eine Zweitmeinung einzuholen
- text: Allfälliger Rücktritt vom Mandat (entbindet nicht von der Anzeigepflicht).
  quelle: hwp-er-2026__rz-0446-s130
  zitat: Ein Rücktritt der Revisionsstelle in einem derart heiklen Moment wäre zwar rechtswirksam
- text: Schriftliche Bestätigung zur Aufwertung nach OR 725c Abs. 2.
  quelle: or__art-725c
  zitat: schriftlich bestätigt, dass die gesetzlichen Bestimmungen eingehalten sind
unterlagen:
- dokument: Definitive Jahresrechnung (Bilanz, ER, Anhang) und Saldoliste
  zweck: Ausgangspunkt für die Berechnung Kapitalverlust/Überschuldung
  quelle: hwp-er-2026__rz-0368-s112
  zitat: Ausgangspunkt für die Feststellung eines Kapitalverlusts bildet die «letzte Jahresrechnung» zu Fortführungswerten
- dokument: Handelsregisterauszug bzw. Statuten, GV-Protokoll Vorjahr
  zweck: Aktien-/PS-Kapital (Basis der 50 %/20 %) und Reserven für das geschützte Eigenkapital abstimmen
  quelle: ser-2022__anh-d-s091-1
  zitat: Abstimmung des Grundkapitals mit den gültigen Statuten oder dem Handelsregisterauszug
- dokument: Aufstellung Covid-19-Kredite und HFMV-20-Darlehen per Stichtag
  zweck: Bereinigung des Fremdkapitals für Kapitalverlust und Überschuldung
  quelle: hwp-er-2026__rz-0373-s113
  zitat: Dies gilt auch für Darlehen oder verbürgte/garantierte Kredite nach der Covid-19-Härtefallverordnung
- dokument: Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten (mit VR-Genehmigung, ggf. Prüfbericht)
  zweck: Massgebende Grundlage für die Beurteilung der Überschuldung
  quelle: qa-kapitalverlust-2023__2-2-2-t1
  zitat: Massgebend für die Beurteilung, ob eine Überschuldung vorliegt, ist der aktuelle Zwischenabschluss.
- dokument: Rangrücktrittsvereinbarung(en), unterzeichnet
  zweck: Formelle/materielle Prüfung des Rangrücktritts
  quelle: hwp-er-2026__rz-0410-s123
  zitat: Die Revisionsstelle vermag nur einen schriftlichen Rangrücktritt zu beurteilen.
- dokument: Bonitätsnachweis des Rangrücktrittsgläubigers (z.B. dessen Jahresrechnung)
  zweck: Bonität beurteilen, Anfechtungsrisiko
  quelle: hwp-er-2026__rz-0432-s127
  zitat: Dies beinhaltet auch die Beurteilung der Bonität des Rangrücktrittgläubigers
- dokument: VR-/GV-Protokolle, Sanierungskonzept
  zweck: Massnahmen und finanzielle Schwierigkeiten erkennen
  quelle: hwp-er-2026__rz-0196-s225
  zitat: kritische Durchsicht von Sitzungsprotokollen der Unternehmensorgane
- dokument: Liquiditätsplanung/Budget (mindestens 12 Monate)
  zweck: Fortführungseinschätzung der Unternehmensleitung
  quelle: ser-2022__anh-g-s138-1
  zitat: für einen Zeitraum von mindestens zwölf Monaten ab dem Bilanzstichtag vorzunehmen
- dokument: Kredit- und Darlehensverträge (inkl. Covid-19-Kredite)
  zweck: Fälligkeiten, Covenants, Rangrücktritte, Fremdkapitalqualifikation
  quelle: ser-2022__anh-d-s085-1
  zitat: Einsicht in Kredit- und Darlehensverträge
- dokument: Belege zu Sanierungsmassnahmen (Forderungsverzicht, Zuschuss, Kapitalerhöhung)
  zweck: Wirkung auf den Bilanzstichtag und Vollzug belegen
  quelle: hwp-er-2026__rz-0408-s123
  zitat: Im Gegensatz zum Rangrücktritt bewirkt der Forderungsverzicht eine echte Sanierung der Bilanz
- dokument: Verkehrswertnachweise und Bestätigung nach OR 725c Abs. 2
  zweck: Zulässigkeit der Aufwertung
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt
- dokument: Vollständigkeitserklärung mit Going-concern-Bestätigung
  zweck: Schriftliche Bestätigung des VR zur Fortführung
  quelle: ser-2022__anh-e-s104-1
  zitat: erhebliche Zweifel an der Fähigkeit der [1] zur Fortführung ihrer Tätigkeit
- dokument: Schriftliche Erklärung der Unternehmensleitung über Pläne (z.B. in der Vollständigkeitserklärung)
  zweck: Nachweis zu Plänen bei Zweifeln an der Fortführung
  quelle: hwp-er-2026__rz-0195-s225
  zitat: eine schriftliche Erklärung der Unternehmensleitung über die Pläne für zukünftige Aktivitäten einfordern
- dokument: Schriftliche, begründete VR-Darlegung bei Reduktion eines Rangrücktritts; ggf. Zustimmung anderer Rangrücktrittsgläubiger
  zweck: Voraussetzungen für Reduktion des Rangrücktritts
  quelle: hwp-er-2026__rz-0425-s126
  zitat: der Verwaltungsrat der Gesellschaft schriftlich und begründet dargelegt hat, dass während der nächsten zwölf Monate keine weiteren Verluste absehbar sind
- dokument: 'Opting-out: Auftragsbestätigung und Vollständigkeitserklärung für die eingeschränkte Revision nach OR 725a Abs. 2'
  zweck: Auftragsart (keine Organstellung) und Erklärungen der Unternehmensleitung belegen
  quelle: ser-2022__anh-c-s067-1
  zitat: Feststellung, dass es sich um einen Auftrag handelt und keine Organstellung vorhanden ist
dokumentation:
- text: 'Textfeld P1-313 je Schritt einheitlich: Prüfziel, Quellen (M-Files-ID und Version), Berechnung (Bezugsgrösse, Eigenkapital, Deckungsgrad, Überschuldungsbetrag), Ergebnis, Feststellungen,
    Pendenzen, Status.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status.
- text: 'Herleitung des geschützten Eigenkapitals offen ausweisen: Aktien-/PS-Kapital, Kappung der gesetzlichen Kapital- und Gewinnreserve (50 %/20 %), Reserven nach OR 659b Abs. 2,
    Aufwertungsreserve, Abzug Covid-/HFMV-Kredite; Werkzeugaufruf mit Eingabewerten.'
  quelle: hwp-er-2026__rz-0370-s112
  zitat: Zuerst muss das geschützte Eigenkapital berechnet werden
- text: Kapitalschutz-Fälle als Risiko-Mandat besonders sorgfältig dokumentieren; nur Fakten, keine Hoffnungen auf Sanierung.
  quelle: hwp-er-2026__rz-0452-s132
  zitat: Was zählt, sind einzig Fakten und deren vorsichtige Abwägung bzw. Bewertung.
- text: Befragungen (VR/GL) mit wesentlichen Fragen und erhaltenen Antworten festhalten.
  quelle: hwp-er-2026__rz-0103-s197
  zitat: Das Festhalten der wesentlichen Fragen und der erhaltenen Antworten gehört zu den zwingenden Inhalten der Dokumentation
- text: 'Fristen dokumentieren: Datum Vorliegen der geprüften Zwischenabschlüsse (Start 90 Tage), Mahnungen und gesetzte Fristen.'
  quelle: qa-kapitalverlust-2023__2-2-2-t1
  zitat: Beginn der gesetzlichen 90-Tage-Frist
- text: Bei vereinfachter Prüfung der Zwischenabschlüsse die Vereinfachung im Bericht offenlegen (Entwurf für den WP).
  quelle: hwp-er-2026__rz-0401-s119
  zitat: wobei in der Berichterstattung auf diese «Vereinfachung» hinzuweisen ist
- text: Jede Aktion, Quelle und Berechnung im Audit Trail protokollieren.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
- text: Kopie der Rangrücktrittsvereinbarung als Beilage zu P1-313 bzw. zur Notiz ablegen (in den WP-Schritten L1-105/L1-304/N1-105 nur auf Anweisung) und in den Dauerakten führen.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: der Agent hängt dort die verwendeten Nachweise an, wenn sie nicht direkt beim Prüfschritt liegen
fallstricke:
- text: Rangrücktritt beseitigt weder Kapitalverlust noch Überschuldung und ist keine Sanierungsmassnahme; er dispensiert nur von der Gerichtsanzeige.
  quelle: hwp-er-2026__rz-0405-s122
  zitat: Er beseitigt weder die Überschuldung noch stellt er eine Sanierungsmassnahme im Sinne von Art. 725a Abs. 1 OR dar.
- text: Kein Verzicht auf Zwischenabschluss, nur weil eine geprüfte JR jünger als 6 Monate ist oder Rangrücktritte die Überschuldung decken.
  quelle: qa-kapitalverlust-2023__2-2-2-t3
  zitat: Art. 725b OR sieht keine solche Erleichterung vor.
- text: 'Verzicht auf den ZA zu Veräusserungswerten nicht schon bei gegebener Fortführung: kumulativ darf der ZA zu Fortführungswerten keine Überschuldung zeigen.'
  quelle: or__art-725b-t1
  zitat: Auf den Zwischenabschluss zu Veräusserungswerten kann verzichtet werden, wenn die Annahme der Fortführung gegeben ist und der Zwischenabschluss zu Fortführungswerten keine Überschuldung
    aufweist.
- text: Kapitalverlust/Überschuldung an sich ist ein Zusatz, kein Hinweis; Hinweis erst bei Untätigkeit des VR.
  quelle: hwp-er-2026__rz-0447-s130
  zitat: Eine Verletzung des Gesetzes liegt erst dann vor, wenn der Verwaltungsrat seine entsprechenden Handlungs- und Anzeigepflichten
- text: Unterbilanz ist nicht gleich Kapitalverlust im Sinne von OR 725a.
  quelle: hwp-er-2026__rz-0367-s112
  zitat: Vom Kapitalverlust im Sinne des Aktienrechts zu unterscheiden ist die «Unterbilanz».
- text: 'Rechenmodul: Reserven nach OR 659b und Aufwertungsreserve zählen voll und dürfen nicht in --gewinnreserve eingegeben werden (das Werkzeug würde sie mitkappen); Covid-/HFMV-Kredite
    vor der Eingabe aus den Verbindlichkeiten nehmen.'
  quelle: hwp-er-2026__rz-0370-s112
  zitat: der volle Betrag der gesetzlichen Reserven für eigene Kapitalanteile im Konzern
- text: 'Konzerngesellschaften: Beurteilung nur auf Ebene Einzelabschluss, solide Gruppe relativiert nichts.'
  quelle: hwp-er-2026__rz-0452-s132
  zitat: Kapitalverlust und Überschuldung sind Betrachtungen auf Ebene Einzelabschluss
- text: 'Doppelmandat: Wissen der Treuhandabteilung gilt als Wissen der Revisionsstelle – Zeitpunkt der Kenntnis verschiebt sich nach vorne.'
  quelle: hwp-er-2026__rz-0388-s116
  zitat: Die Treuhandabteilung wird somit faktisch gleichgesetzt mit der sog. kompetenten Stelle aus dem Mandantenunternehmen.
- text: Garantien, Patronatserklärungen oder Deckungsgarantien ersetzen keinen Rangrücktritt.
  quelle: hwp-er-2026__rz-0406-s122
  zitat: Keinen Ersatz für einen Rangrücktritt bilden «Deckungsgarantien» bzw. Garantien und Patronatserklärungen.
- text: Fremdwährungs-Rangrücktritt kann sich durch Kursrückgang vermindern (Sicherheitspolster).
  quelle: hwp-er-2026__rz-0415-s123-t2
  zitat: dass die mit Rangrücktritt belastete Forderung auf eine fremde Währung lautet und sich durch einen Kursrückgang vermindert
- text: 'Alte Rangrücktritte ohne Zinsen: Die Übergangsfrist ist am 31.12.2024 abgelaufen; für die Geschäftsjahre 2025/2026 gilt neues Recht für alle Verträge.'
  quelle: qa-kapitalverlust-2023__5-t2
  zitat: Nach Ablauf dieser Frist sind die Vorschriften des neuen Rechts auf alle Verträge anwendbar.
- text: 'Zinsen müssen ausdrücklich vereinbart sein: Rangrücktritt ohne Zinsklausel → Notiz «Wesentliche Feststellungen» an den WP, Ergänzung als «Pendenz». Ob Zinsen ex lege erfasst
    sind, ist nicht gefestigt (Q&A) – nur als Unsicherheit erwähnen, nicht als Entlastung.'
  quelle: hwp-er-2026__rz-0412-s123
  zitat: Gemäss Gesetz müssen die Zinsen zwingend dem Rangrücktritt unterliegen, was ausdrücklich vereinbart werden muss.
- text: 'Rangrücktritt mit ausländischem Gläubiger: untersteht grundsätzlich dessen Recht; «Schweizer Recht» ist nur Empfehlung, ausländische Formvorschriften beachten.'
  quelle: hwp-er-2026__rz-0419-s124
  zitat: untersteht der Rangrücktritt dem Recht des Gesellschaftsgläubigers
- text: Covid-19-Kredite nur befristet nicht als Fremdkapital (SBüG bis 31.12.2032, HFMV 20 bis 31.12.2031) – Stichtag beachten.
  quelle: hwp-er-2026__rz-0373-s113
  zitat: Die diesbezüglichen Bestimmungen des Covid-19-SBüG gelten vom 19. Dezember 2020 bis zum 31. Dezember 2032 (Art. 31).
- text: Realistische kurzfristige Sanierung ist kein Grund, die Prüfungen aufzuschieben.
  quelle: hwp-er-2026__rz-0452-s132
  zitat: ist dies kein Grund, die notwendigen Prüfungen aufzuschieben
- text: Erstellt der VR trotz Aufforderung keine Zwischenabschlüsse, ist eine offensichtliche Überschuldung anzunehmen – kein Abwarten.
  quelle: hwp-er-2026__rz-0386-s116
  zitat: diesfalls ist eine oﬀensichtliche Überschuldung anzunehmen
- text: Mandatsniederlegung oder Abwahl entbindet nicht von der Anzeigepflicht nach OR 729c.
  quelle: hwp-er-2026__rz-0445-s130
  zitat: kann diese Pflicht nicht durch Mandatsbeendigung ausgehebelt werden
- text: Revisionsstelle erstellt den Zwischenabschluss nicht selbst; bei Weigerung des VR Glaubhaftmachung über eine an die letzte Bilanz anknüpfende Darstellung.
  quelle: hwp-er-2026__rz-0395-s118
  zitat: z.B. durch eine an die letzte Jahresrechnung anknüpfende Darstellung
- text: Keine Sanierungsberatung durch die Revisionsstelle bzw. den Agenten.
  quelle: hwp-er-2026__rz-0431-s127
  zitat: Es ist nicht Aufgabe der Revisionsstelle, einer notleidenden Gesellschaft Wege zum Fortbestand und zur Sanierung aufzuzeigen.
- text: 'Strittig – zugelassener Revisor (OR 725a Abs. 2, Opting-out) und Gerichtsanzeige: HWP ER verneint eine Anzeigepflicht …'
  quelle: hwp-er-2026__rz-0458-s134
  zitat: vor allem keine Pflicht zur Benachrichtigung des Gerichts
- text: … Q&A Antwort 16 bejaht sie unter Verweis auf OR 725b Abs. 5 – Widerspruch dem WP vorlegen.
  quelle: qa-kapitalverlust-2023__2-2-2-t8
  zitat: Entsprechend muss der zugelassene Revisor das Gericht benachrichtigen, wenn der Verwaltungsrat die Anzeige unterlässt (Art. 729c OR).
- text: 'Bei Missachtung der Prüfpflicht nach OR 725a Abs. 2 sind GV-Beschlüsse nichtig – spätere Prüfer: rechtlichen Rat einholen.'
  quelle: hwp-er-2026__rz-0455-s133
  zitat: sind die Beschlüsse der Generalversammlung zur Genehmigung der Jahresrechnung sowie zur Verrechnung des Bilanzverlusts oder anderweitiger Verwendung von Reserven nichtig
- text: 'Rechtsform: Genossenschaft ohne Anteilscheine – Kapitalverlust-Regeln nicht anwendbar (Überschuldung schon).'
  quelle: or__art-903
  zitat: Bei Genossenschaften mit Anteilscheinen sind überdies die Bestimmungen des Aktienrechts über den Kapitalverlust entsprechend anwendbar.
- text: Stiftungen erstellen keinen Zwischenabschluss nach OR 725b; Rechtsform beachten.
  quelle: ser-2022__9-t2
  zitat: Stiftungen haben gemäss Art. 84a ZGB keinen Zwischenabschluss zu erstellen.
- text: SER Anhang F Bsp. 11 verwendet die alte Formulierung («Hälfte des Aktienkapitals und der gesetzlichen Reserven»); für den Zusatz den Wortlaut nach OR 725a Abs. 1 vorschlagen,
    Wahl beim WP.
  quelle: ser-2022__anh-f-s129-2
  zitat: dass die Hälfte des Aktienkapitals und der gesetzlichen Reserven nicht mehr gedeckt ist
- text: Fachliteratur (Camponovo, Seminar) hält den Hinweis zur 2. Satzhälfte von OR 725a für unzulässig – nachrangige Quelle, SER/HWP ER massgebend, WP entscheidet.
  quelle: camponovo-2026-hinweispflichten__s119-1
  zitat: Bezüglich Teil 2 ist ein Hinweis m.E. nicht erlaubt
fragen_kunde:
- frage: Liegt eine Liquiditätsplanung bzw. ein Budget für mindestens 12 Monate ab Bilanzstichtag vor? Bestehen Zahlungsrückstände (Löhne, Sozialversicherungen, MWST, Lieferanten) oder
    verletzte Kreditbedingungen?
  zweck: Drohende Zahlungsunfähigkeit und Fortführungsfähigkeit beurteilen (OR 725, A1-205).
- frage: Welche Massnahmen hat der VR seit Feststellung des Kapitalverlusts ergriffen oder der GV beantragt (mit Datum und Protokoll)? Wurden die Aktionäre über den Kapitalverlust informiert?
  zweck: Pflichten nach OR 725a Abs. 1 belegen; Grundlage für Zusatz bzw. Hinweis (SER 8.3.2.1, HWP Rz 424).
- frage: Wurden Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten erstellt? Per welchem Stichtag, genehmigt wann, geprüft von wem? Ist die Fortführung gegeben?
  zweck: Pflichten nach OR 725b Abs. 1/2, erforderliche ZA und Fristbeginn der 90 Tage feststellen.
- frage: Bestehen Rangrücktritte? Gläubiger (Sitz, anwendbares Recht), Betrag, Zinsen ausdrücklich eingeschlossen, Datum, Original unterzeichnet? Wurden im Geschäftsjahr Zahlungen oder
    Verrechnungen auf diese Forderungen vorgenommen?
  zweck: Formelle und materielle Gültigkeit sowie Einhaltung des Rangrücktritts prüfen (OR 725b Abs. 4 Ziff. 1, HWP Rz 412/419).
- frage: Kann der Rangrücktrittsgläubiger einen Ausfall der Forderung finanziell tragen (z.B. Jahresrechnung des Gläubigers)?
  zweck: Bonität des Gläubigers beurteilen (Anfechtungsrisiko).
- frage: Bestehen Covid-19-Kredite oder Härtefall-Darlehen und in welcher Höhe per Stichtag? Bestehen Reserven für eigene Kapitalanteile im Konzern oder eine Aufwertungsreserve; ist
    die Gesellschaft eine Holding; besteht PS-Kapital?
  zweck: Korrekte Herleitung des geschützten Eigenkapitals und Berechnung von Kapitalverlust und Überschuldung.
- frage: Sind Sanierungsmassnahmen zugesagt oder vollzogen (Kapitalerhöhung, Forderungsverzicht, À-fonds-perdu-Zuschuss, Aufwertung nach OR 725c) – mit Datum und Belegen?
  zweck: Behebung innert 90 Tagen bzw. Sanierungswirkung belegen.
- frage: Wurde ein Gesuch um Nachlassstundung eingereicht oder das Gericht benachrichtigt? Befindet sich die Gesellschaft in Liquidation?
  zweck: Wegfall der Prüfpflicht (OR 725a Abs. 3) bzw. Erfüllung OR 725b Abs. 3 / OR 743 Abs. 2 feststellen.
- frage: Sind nach dem Bilanzstichtag weitere Verluste, Kreditkündigungen oder Liquiditätsengpässe eingetreten?
  zweck: Ereignisse nach dem Stichtag und Aktualität der Beurteilung (Sicherheitspolster Rangrücktritt).
