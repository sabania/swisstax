- was: 'Sonderfall Opting-out mit Kapitalverlust (OR 725a Abs. 2, Mandat als zugelassener Revisor): Auftragsart aus der Auftragsbestätigung erkennen (SER Anhang C Bsp. 4) und Vollständigkeitserklärung
