# Prozessphase p6-kapitalschutz – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p6-kapitalschutz
titel: Kapitalverlust, Überschuldung, Rangrücktritt, Zahlungsunfähigkeit (OR 725–725c, 729c)
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: true
ziel: Kapitalschutz-Tatbestände (drohende Zahlungsunfähigkeit, hälftiger Kapitalverlust, begründete Besorgnis bzw. Überschuldung) aus Jahresrechnung/Zwischenabschluss erkennen, rechnen
  und belegen; Rangrücktritte und Sanierungsmassnahmen prüfen; Zusatz/Hinweis im Bericht und Anzeigepflicht OR 729c für den WP vorbereiten.
wann: Bei jedem Mandat nach dem Import der Jahresrechnung (Prozess 1) als Schwellen-Check; vertieft, sobald JR oder Zwischenabschluss Kapitalverlust/Überschuldung zeigt, Indikatoren
  (Verluste, Cash Drain, Liquiditätsprobleme) vorliegen oder VR/GL bzw. die eigene Treuhandabteilung (Doppelmandat) eine Schieflage meldet; spätestens vor dem GVB-Entwurf (Prozess 5).
  Fristen laufen ab Kenntnis («gebotene Eile»).
gesetz:
- thema: VR überwacht Zahlungsfähigkeit (drohende Zahlungsunfähigkeit)
  quelle: or__art-725
  zitat: Der Verwaltungsrat überwacht die Zahlungsfähigkeit der Gesellschaft.
- thema: Massnahmen bei drohender Zahlungsunfähigkeit (OR 725 Abs. 2)
  quelle: or__art-725
  zitat: Droht die Gesellschaft zahlungsunfähig zu werden, so ergreift der Verwaltungsrat Massnahmen zur Sicherstellung der Zahlungsfähigkeit.
- thema: Nachlassstundung als Massnahme (OR 725 Abs. 2)
  quelle: or__art-725
  zitat: Er reicht nötigenfalls ein Gesuch um Nachlassstundung ein.
- thema: 'Kapitalverlust: Schwelle (hälftige Deckung)'
  quelle: or__art-725a
  zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve
    nicht mehr decken
- thema: 'Kapitalverlust: Massnahmenpflicht des VR'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Kapitalverlust bei Opting-out: eingeschränkte Revision durch zugelassenen Revisor'
  quelle: or__art-725a
  zitat: so muss die letzte Jahresrechnung vor ihrer Genehmigung durch die Generalversammlung überdies einer eingeschränkten Revision durch einen zugelassenen Revisor unterzogen werden
- thema: Wegfall Revisionspflicht 725a Abs. 2 bei Nachlassstundung
  quelle: or__art-725a
  zitat: Die Revisionspflicht nach Absatz 2 entfällt, wenn der Verwaltungsrat ein Gesuch um Nachlassstundung einreicht.
- thema: Gebotene Eile bei Kapitalverlust (OR 725a Abs. 4)
  quelle: or__art-725a
  zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
- thema: 'Überschuldung: Zwischenabschlüsse bei begründeter Besorgnis'
  quelle: or__art-725b-t1
  zitat: so erstellt der Verwaltungsrat unverzüglich je einen Zwischenabschluss zu Fortführungswerten und Veräusserungswerten
- thema: 'Verzicht auf Zwischenabschluss zu Veräusserungswerten – nur kumulativ: Fortführung gegeben UND keine Überschuldung zu Fortführungswerten'
  quelle: or__art-725b-t1
  zitat: Auf den Zwischenabschluss zu Veräusserungswerten kann verzichtet werden, wenn die Annahme der Fortführung gegeben ist und der Zwischenabschluss zu Fortführungswerten keine Überschuldung
    aufweist.
- thema: 'Fortführung nicht gegeben: Zwischenabschluss zu Veräusserungswerten genügt'
  quelle: or__art-725b-t1
  zitat: Ist die Annahme der Fortführung nicht gegeben, so genügt ein Zwischenabschluss zu Veräusserungswerten.
- thema: Prüfung der Zwischenabschlüsse durch die Revisionsstelle
  quelle: or__art-725b-t1
  zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen
- thema: Benachrichtigung des Gerichts durch den VR
  quelle: or__art-725b-t1
  zitat: Ist die Gesellschaft gemäss den beiden Zwischenabschlüssen überschuldet, so benachrichtigt der Verwaltungsrat das Gericht.
- thema: 'Ausnahme 1: Rangrücktritt hinter alle Gläubiger im Ausmass der Überschuldung und Stundung'
  quelle: or__art-725b-t1
  zitat: wenn Gesellschaftsgläubiger im Ausmass der Überschuldung im Rang hinter alle anderen Gläubiger zurücktreten und ihre Forderungen stunden
- thema: 'Ausnahme 1: Rangrücktritt umfasst Betrag und Zinsen'
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: 'Ausnahme 2: Behebung innert angemessener Frist, höchstens 90 Tage'
  quelle: or__art-725b-t1
  zitat: spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse, behoben werden kann
- thema: 'Ausnahme 2: kumulativ keine zusätzliche Gefährdung der Gläubiger'
  quelle: or__art-725b-t1
  zitat: und dass die Forderungen der Gläubiger nicht zusätzlich gefährdet werden
- thema: Anzeigepflichten des zugelassenen Revisors (ohne Revisionsstelle)
  quelle: or__art-725b-t2
  zitat: Verfügt die Gesellschaft über keine Revisionsstelle, so obliegen dem zugelassenen Revisor die Anzeigepflichten der eingeschränkt prüfenden Revisionsstelle.
- thema: Gebotene Eile bei Überschuldung (OR 725b Abs. 6)
  quelle: or__art-725b-t2
  zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
- thema: 'Aufwertung: Zweckbindung (nur zur Behebung von Kapitalverlust/Überschuldung)'
  quelle: or__art-725c
  zitat: Zur Behebung eines Kapitalverlusts nach Artikel 725a oder einer Überschuldung nach Artikel 725b
- thema: Aufwertung Grundstücke/Beteiligungen bis höchstens zum wirklichen Wert
  quelle: or__art-725c
  zitat: dürfen Grundstücke und Beteiligungen, deren wirklicher Wert über die Anschaffungs- oder Herstellungskosten gestiegen ist, bis höchstens zu diesem Wert aufgewertet werden
- thema: Ausweis Aufwertungsreserve
  quelle: or__art-725c
  zitat: Der Aufwertungsbetrag ist unter der gesetzlichen Gewinnreserve gesondert als Aufwertungsreserve auszuweisen.
- thema: Schriftliche Bestätigung der Revisionsstelle zur Aufwertung
  quelle: or__art-725c
  zitat: Die Aufwertung ist nur zulässig, wenn die Revisionsstelle oder, wenn eine solche fehlt, ein zugelassener Revisor schriftlich bestätigt
- thema: Auflösung der Aufwertungsreserve (OR 725c Abs. 3; Folgejahre)
  quelle: or__art-725c
  zitat: Die Aufwertungsreserve kann nur durch Umwandlung in Aktien- oder Partizipationskapital sowie durch Wertberichtigung oder Veräusserung der aufgewerteten Aktiven aufgelöst werden.
- thema: Anzeigepflicht der Revisionsstelle bei offensichtlicher Überschuldung
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: 'Gesellschaft in Liquidation: Überschuldungsanzeige durch die Liquidatoren (OR 743 Abs. 2)'
  quelle: or__art-743
  zitat: Sie haben, sobald sie eine Überschuldung feststellen, das Gericht zu benachrichtigen
- thema: 'Fortführung nicht gegeben: Veräusserungswerte (OR 958a Abs. 2)'
  quelle: or__art-958a
  zitat: so sind der Rechnungslegung für die betreffenden Unternehmensteile Veräusserungswerte zugrunde zu legen
- thema: Abweichung von der Fortführung im Anhang (OR 958a Abs. 3)
  quelle: or__art-958a
  zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken
- thema: 'GmbH: Aktienrecht zu Zahlungsunfähigkeit, Kapitalverlust, Überschuldung, Aufwertung sinngemäss (OR 820)'
  quelle: or__art-820
  zitat: Die Bestimmungen des Aktienrechts zur drohenden Zahlungsunfähigkeit, zum Kapitalverlust, zur Überschuldung sowie zur Aufwertung von Grundstücken und Beteiligungen sind entsprechend
    anwendbar.
- thema: 'Genossenschaft: Zahlungsunfähigkeit, Überschuldung, Aufwertung sinngemäss (OR 903 Abs. 1)'
  quelle: or__art-903
  zitat: Die Bestimmungen des Aktienrechts zur drohenden Zahlungsunfähigkeit, zur Überschuldung sowie zur Aufwertung von Grundstücken und Beteiligungen sind entsprechend anwendbar.
- thema: 'Genossenschaft: Kapitalverlust nur bei Anteilscheinen (OR 903 Abs. 2)'
  quelle: or__art-903
  zitat: Bei Genossenschaften mit Anteilscheinen sind überdies die Bestimmungen des Aktienrechts über den Kapitalverlust entsprechend anwendbar.
schritte:
- was: 'Schwellen-Check aus der importierten Jahresrechnung (Einzelabschluss): geschütztes Eigenkapital herleiten = nominelles Aktien- und PS-Kapital + gesetzliche Kapitalreserve (OR
    671 Abs. 1) und gesetzliche Gewinnreserve i.e.S. (OR 672 Abs. 1) zusammen höchstens 50 % (Holding 20 %) des im HR eingetragenen Aktien- und PS-Kapitals + voller Betrag der Reserven
    für eigene Kapitalanteile im Konzern (OR 659b Abs. 2) und der Aufwertungsreserve (OR 725c). Kapitalverlust, wenn 0 ≤ bilanzielles EK < Hälfte davon; Überschuldung, wenn Aktiven <
    Fremdkapital (Verbindlichkeiten, Rückstellungen, PRA). Stille Reserven nicht einrechnen; Covid-19-Kredite und HFMV-20-Darlehen nicht als Fremdkapital (befristet, Stichtag beachten);
    direkt gehaltene eigene Anteile ändern die Bezugsgrösse nicht; Rangrücktritte beseitigen nichts; Konzernrechnung unerheblich. Rechtsform beachten: GmbH sinngemäss (OR 820), Genossenschaft
    Kapitalverlust nur mit Anteilscheinen (OR 903 Abs. 2). Herleitung (Kappung, 659b-Reserve, Aufwertungsreserve, Abzug Covid-/HFMV-Kredite) offen im Textfeld P1-313 ausweisen. Rechnen
    nur im Code: `revision.py kapitalverlust` kappt gesetzliche Kapital- und Gewinnreserve bei 50 %/20 % von --aktienkapital (PS-Kapital dort einrechnen, --holding setzen), kennt aber
    weder 659b- noch Aufwertungsreserve noch Covid-Kredite: diese Reserven nicht in --gewinnreserve eingeben (würden mitgekappt), sondern das geschützte EK mit `rechne` herleiten; --verbindlichkeiten
    bzw. --eigenkapital um Covid-/HFMV-Kredite bereinigen.'
  wer: Agent
  revio: 'Bereich 1.1/1.2 lesen (rv_get_financialStatement_LoadBalanceAccounts, rv_get_financialStatement_LoadKeyFigureItems); Ergebnis mit Herleitung im Textfeld P1-313 «Beurteilung
    Eigenkapital in Bezug auf OR 725» (rv_put_auditActivities_UpdateDossierActivity), Querverweis A1-205; Rechnen: `revision.py kapitalverlust` bzw. `rechne`'
  mfiles: Definitive Bilanz/ER/Anhang, HR-Auszug bzw. Statuten (Aktien-/PS-Kapital), GV-Protokoll Vorjahr (Reserven), Nachweis Reserven nach OR 659b bzw. Aufwertungsreserve, Aufstellung
    Covid-/Härtefallkredite
  fundstellen:
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: des im Handelsregister eingetragenen Aktienund Partizipationskapitals
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: resp. bei Holdinggesellschaften 20 %
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: der volle Betrag der gesetzlichen Reserven für eigene Kapitalanteile im Konzern
  - quelle: hwp-er-2026__rz-0370-s112
    zitat: aus Aufwertungen (Art. 725c Abs. 1 OR)
  - quelle: hwp-er-2026__rz-0369-s112
    zitat: wobei allfällige stille Reserven bei der Berechnung grundsätzlich keine Berücksichtigung
  - quelle: hwp-er-2026__rz-0372-s112
    zitat: Ist das bilanzielle Eigenkapital grösser oder gleich null, aber kleiner als die Bezugsgrösse des geschützten Eigenkapitals, dann liegt ein Kapitalverlust im Sinne von Art.
      725a Abs. 1 OR vor.
  - quelle: qa-kapitalverlust-2023__1-1-t1
    zitat: Das geschützte Eigenkapital und damit die Bezugsgrösse nach Art. 725a OR resp. PS-CH 290 bleiben unverändert.
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: wenn die (ordnungsgemäss bewerteten) Aktiven geringer sind als das Fremdkapital, bestehend aus Verbindlichkeiten, Rückstellungen und passiven Rechnungsabgrenzungsposten
  - quelle: hwp-er-2026__rz-0381-s115
    zitat: Für die Berechnung sind Covid-19-Kredite nicht als Fremdkapital zu berücksichtigen
  - quelle: hwp-er-2026__rz-0373-s113
    zitat: Dies gilt auch für Darlehen oder verbürgte/garantierte Kredite nach der Covid-19-Härtefallverordnung
  - quelle: hwp-er-2026__rz-0373-s113
    zitat: Ein Rangrücktritt beseitigt den Kapitalverlust nicht
  - quelle: hwp-er-2026__rz-0358-s110
    zitat: Der Konzernrechnung kommt diesbezüglich keine Bedeutung zu.
  - quelle: or__art-903
    zitat: Bei Genossenschaften mit Anteilscheinen sind überdies die Bestimmungen des Aktienrechts über den Kapitalverlust entsprechend anwendbar.
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.
- was: 'Indikatoren für drohende Zahlungsunfähigkeit und begründete Besorgnis einer Überschuldung sammeln (Verluste, Cash Drain, Liquidität, Fälligkeiten, Verletzung von Kreditbedingungen,
    Rückstellungs-/Wertberichtigungsbedarf) und die Fortführungseinschätzung des VR (mindestens 12 Monate ab Stichtag) beschaffen; Befragung der Unternehmensleitung vorbereiten (der
    Agent befragt nicht selbst, er wertet nur schriftliche Antworten aus). Ist die Fortführung nicht gegeben: Veräusserungswerte und Anhangangabe nach OR 958a prüfen (T1-318). Für die
    Revisionsstelle bestehen bei (drohender) Zahlungsunfähigkeit keine direkten Handlungspflichten, ein Verstoss des VR gegen OR 725 wäre aber im Bericht anzuzeigen.'
  wer: Agent bereitet vor, WP entscheidet
  revio: '3.4 Going concern und 6.3 Ereignisse nach dem Bilanzstichtag/Going concern nur lesen; Textfeld A1-205 (Going Concern), T1-318 (Abweichung Fortführung im Anhang); T1-109 ist
    Befragungsschritt: nur schriftliche Antworten (z.B. 10.11 Kundenbefragung) auswerten, sonst Frage als Notiz «Pendenz», Status höchstens «teilweise bearbeitet»'
  mfiles: Liquiditätsplanung/Budget ≥ 12 Monate, Kredit- und Darlehensverträge, jüngster Zwischenabschluss, VR-Protokolle, Vollständigkeitserklärung (Going-concern-Bestätigung)
  fundstellen:
  - quelle: hwp-er-2026__rz-0385-s115
    zitat: wenn sich aus der Jahresrechnung oder einem Zwischenabschluss zu Fortführungswerten eine Überschuldung ergibt
  - quelle: hwp-er-2026__rz-0385-s115
    zitat: wie z.B. Nachhaltigkeit und Ausmass eingetretener Verluste, Cash Drain
  - quelle: hwp-er-2026__rz-0364-s111
    zitat: eine drohende Zahlungsunfähigkeit einen möglichen Indikator für das Vorliegen eines Kapitalverlusts oder aber einer begründeten Besorgnis einer Überschuldung darstellen kann
  - quelle: ser-2022__anh-g-s138-1
    zitat: Art. 725 OR sieht für die Revisionsstelle weder bei der drohenden noch bei der tatsächlichen Zahlungsunfähigkeit direkte Handlungspflichten vor.
  - quelle: hwp-er-2026__rz-0364-s111
    zitat: müsste jedoch zuhanden der nächsten ordentlichen Generalversammlung im Bericht der Revisionsstelle angezeigt werden
  - quelle: hwp-er-2026__rz-0194-s225
    zitat: fordert der Abschlussprüfer die Unternehmensleitung auf, den Zeitraum auf mindestens zwölf Monate auszudehnen
  - quelle: hwp-er-2026__rz-0193-s225
    zitat: Verstösse gegen gesetzliche Eigenkapitalvorschriften (z.B. Art. 725 OR)
  - quelle: or__art-958a
    zitat: Abweichungen von der Annahme der Fortführung sind im Anhang zu vermerken
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: höchstens «teilweise bearbeitet»
- was: 'Informationsfluss sicherstellen: Hinweise aus dem eigenen Buchführungsmandat (Doppelmandat) und klare Informationen von VR/GL über eine offensichtliche Überschuldung sofort an
    den WP melden, auch unter dem Jahr. Keine laufende Überwachungspflicht der Revisionsstelle; Pflichten entstehen erst bei klarer Information von kompetenter Stelle bzw. Feststellung
    im Rahmen der Prüfung.'
  wer: Agent
  revio: Notiz «Wesentliche Feststellungen» im Prüffeld P1 (rv_put_workpapers_UpdateNote); Rapport an WP (Prozess 4) zuoberst
  mfiles: Buchhaltungsdossier/Korrespondenz der Treuhandabteilung (nur Mandatskontext), Mitteilungen VR/GL
  fundstellen:
  - quelle: hwp-er-2026__rz-0388-s116
    zitat: das Wissen des Treuhänders / der Treuhandabteilung über die finanzielle (Schief-)Lage des Mandanten wird als der Revisionsstelle bekannt qualifiziert
  - quelle: hwp-er-2026__rz-0387-s116
    zitat: Einzig wenn die Revisionsstelle klare und stichhaltige Informationen von kompetenter Stelle aus dem Unternehmen
  - quelle: hwp-er-2026__rz-0386-s116
    zitat: ist gemäss Art. 729c OR grundsätzlich erst zum Handeln aufgerufen
  - quelle: ser-2022__9-t3
    zitat: muss sie den Verwaltungsrat an seine Pflichten – namentlich die Erstellung und Vorlage zur Prüfung eines Zwischenabschlusses zu Fortführungs- und Veräusserungswerten – erinnern
- was: 'Bei Kapitalverlust: vom VR ergriffene bzw. der GV beantragte Massnahmen erheben (Ursachenanalyse, Sanierungskonzept, Forderungsverzicht, À-fonds-perdu, Auflösung stiller Reserven,
    Aufwertung 725c, Kapitalschnitt, Kapitalerhöhung) und den Zeitablauf seit Abschlusserstellung festhalten. Ob die Massnahmen genügen und ob eine Pflichtwidrigkeit vorliegt, beurteilt
    die Revisionsstelle (WP), nicht der Agent; welche Massnahmen nötig sind, entscheidet der VR.'
  wer: Agent bereitet vor, WP entscheidet
  revio: Textfeld P1-313; Befragungsprotokoll A1 (nur schriftliche Antworten auswerten); Notiz «Wesentliche Feststellungen»
  mfiles: VR-Protokolle, GV-Einladung/Traktanden, Sanierungskonzept, Verzichts-/Zuschussvereinbarungen, Kapitalerhöhungsunterlagen
  fundstellen:
  - quelle: hwp-er-2026__rz-0378-s114
    zitat: indem er im Wesentlichen die Ursachen des Kapitalverlusts, die Sanierungsfähigkeit der Gesellschaft, den erforderlichen Sanierungsbedarf und die möglichen Sanierungsmassnahmen
      analysiert
  - quelle: hwp-er-2026__rz-0375-s113-t1
    zitat: (b) Aufwertung von Grundstücken und Beteiligungen gemäss Art. 725c OR
  - quelle: hwp-er-2026__rz-0376-s114
    zitat: Die Revisionsstelle kann jedoch ihre Berichterstattung mit Blick auf konkrete, an der Generalversammlung ordentlich traktandierte Sanierungsbeschlüsse ergänzen.
  - quelle: hwp-er-2026__rz-0379-s114
    zitat: Es ist nicht an der Revisionsstelle, zu beurteilen, ob und ggf. welche Sanierungsmassnahmen
  - quelle: qa-kapitalverlust-2023__1-2-t3
    zitat: obliegt der Beurteilung der Revisionsstelle bzw. des zugelassenen Revisors
  - quelle: hwp-er-2026__rz-0380-s115
    zitat: ob sich der Verwaltungsrat der Überschuldungsgefahr bewusst ist und die allenfalls erforderlichen Massnahmen ergreift
- was: 'Bei begründeter Besorgnis bzw. buchmässiger Überschuldung: Zwischenabschlüsse einverlangen bzw. Vorliegen, Stichtag, VR-Genehmigung und Bewertungsbasis festhalten. Erforderliche
    ZA nach OR 725b Abs. 1: (a) Fortführung gegeben und ZA zu Fortführungswerten ohne Überschuldung → ZA zu Veräusserungswerten entbehrlich; (b) Fortführung gegeben, ZA zu Fortführungswerten
    zeigt Überschuldung → beide ZA; (c) Fortführung nicht gegeben → ZA zu Veräusserungswerten genügt (inkl. Stilllegungsaufwand). Der ZA ist grundsätzlich in jedem Fall einzuverlangen;
    einzige Ausnahme gemäss Q&A: sofortige Konkursanmeldung bei massiver, offensichtlicher Überschuldung (Entscheid WP). Fehlt er: Notiz «Pendenz» mit Titelpräfix «PBC-Vorschlag» (Eintrag
    in PBC-Liste 10.10 erst nach Entscheid consis; Anforderung beim Kunden durch den Menschen). Prüfung des ZA: separater Prüfungsfall nach PS-CH 290 (weder eingeschränkte noch ordentliche
    Revision); ausser bei Opting-out ist die gesetzliche Revisionsstelle zuständig (kein Annahmeentscheid); fallen Stichtage zusammen, zwei Berichte. Prüfung auf hinreichende Sicherheit;
    Vereinfachung nur bei offensichtlicher, erheblicher Überschuldung ohne mögliche/beabsichtigte Sanierung (Entscheid WP, Hinweis im Bericht). Ergibt die eingeschränkte Revision eine
    Überschuldung, entspricht die JR dem ZA zu Fortführungswerten. Ablauf: SER Anhang H (Übersicht Vorgehen bei Überschuldung).'
  wer: Agent bereitet vor, WP entscheidet
  revio: Textfeld P1-313; Notiz «Pendenz» mit Titelpräfix «PBC-Vorschlag» (rv_put_workpapers_UpdateNote; PBC-Liste 10.10 erst nach Entscheid consis); erhaltene Unterlagen in Bereich
    10 ablegen
  mfiles: Zwischenabschlüsse (Fortführungs-/Veräusserungswerte) mit VR-Beschluss, Fortführungseinschätzung VR
  fundstellen:
  - quelle: or__art-725b-t1
    zitat: Auf den Zwischenabschluss zu Veräusserungswerten kann verzichtet werden, wenn die Annahme der Fortführung gegeben ist und der Zwischenabschluss zu Fortführungswerten keine
      Überschuldung aufweist.
  - quelle: or__art-725b-t1
    zitat: Ist die Annahme der Fortführung nicht gegeben, so genügt ein Zwischenabschluss zu Veräusserungswerten.
  - quelle: qa-kapitalverlust-2023__2-2-2-t1
