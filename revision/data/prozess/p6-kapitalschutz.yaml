    Hinweis auf Gesetzesverstoss bei Untätigkeit des VR nach OR 725a/725b danach – nach SER 8.3.2.1 «in jedem Fall», nach HWP Rz 423 «zwingend»; HWP Rz 424 knüpft den Hinweis zu OR 725a
    Abs. 1 zusätzlich kumulativ an (1) keine/offensichtlich unzureichende Sanierungsmassnahmen UND (2) nicht informierte Aktionäre mit Auswirkung auf deren Sanierungswillen (Spannung
    dem WP vorlegen, SER hat Vorrang). Gesellschaft in Liquidation: unterlassen die Liquidatoren die Überschuldungsanzeige, Hinweis auf OR 743 Abs. 2. Passendes Berichtsbeispiel vorschlagen
    (SER Anhang F Bsp. 9/10/11/13, Muster HWP ER; bei fehlender Fortführung Muster mit verneinender/eingeschränkter Prüfungsaussage); für den Zusatz Kapitalverlust die Formulierung nach
    OR 725a Abs. 1 (HWP Rz 430, Abb. 53) statt der alten Formulierung in SER Bsp. 11 vorschlagen. Bei Jahresverlust ohne Bilanzgewinn entfällt der Verwendungsantrag. Wortlaut, Zusatz
