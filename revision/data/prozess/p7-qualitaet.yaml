  - quelle: katalog-revio4__c002-3
    zitat: 10.4 Jahresrechnung und Vollständigkeitserklärung, 10.5 Berichtsablage, 10.6 Korrespondenz und Diverses
- was: 'Dauerakten aktualisieren (Schritte xx-322 bzw. P1-321 «Aktualisieren Dauerakten»): prüfen, ob Statuten, Registerauszug und wesentliche mehrjährige Verträge aktuell vorliegen;
