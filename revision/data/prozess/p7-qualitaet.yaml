# Prozessphase p7-qualitaet – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p7-qualitaet
titel: Qualitätsmanagement, Dokumentation, Archivierung, Berufsgeheimnis, KI/Datenschutz
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 14
    korrigiert: true
ziel: Revisionsakte so vorbereiten, dass sie OR 730c und SER 7 genügt (nachvollziehbar, datiert, referenziert, Quellen mit M-Files-ID), Revisions- und Berufsgeheimnis sowie Datenschutz
  auch beim KI-Einsatz wahrt und diesen lückenlos protokolliert; Durchsicht, Visum, Abschluss, Archivierung und Kundenkontakt bleiben beim WP.
wann: 'Vor dem ersten Test mit Echtdaten und vor jedem weiteren Einsatz: KI-, Datenschutz- und Berufsgeheimnis-Voraussetzungen (Anbieterbedingungen neu prüfen); je Mandat vor der Bearbeitung:
  Grundlage für den KI-Einsatz vorhanden; durchgehend ab Auftragserteilung: Mandatskontext, Protokoll, Dokumentation je Prüfschritt; verdichtet vor Rapport und Berichtsabgabe: Vollständigkeit
  der Akte, Review durch den WP; nach dem Berichtsdatum: Abschluss der endgültigen Auftragsakte innerhalb der internen Frist, Archivierung, 10 Jahre Aufbewahrung.'
gesetz:
- thema: Dokumentationspflicht und Aufbewahrung mind. 10 Jahre (OR 730c Abs. 1)
  quelle: or__art-730c
  zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren.
- thema: Elektronische Daten wieder lesbar (OR 730c Abs. 1 Satz 2)
  quelle: or__art-730c
  zitat: Elektronische Daten müssen während der gleichen Zeitperiode wieder lesbar gemacht werden können.
- thema: Effiziente Prüfbarkeit der Unterlagen (OR 730c Abs. 2)
  quelle: or__art-730c
  zitat: Die Unterlagen müssen es ermöglichen, die Einhaltung der gesetzlichen Vorschriften in effizienter Weise zu prüfen.
- thema: Revisionsgeheimnis (OR 730b Abs. 2 Satz 1)
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen, soweit sie nicht von Gesetzes wegen zur Bekanntgabe verpflichtet ist.
- thema: Geschäftsgeheimnisse bei Bericht, Anzeige, GV-Auskunft (OR 730b Abs. 2 Satz 2)
  quelle: or__art-730b
  zitat: Sie wahrt bei der Berichterstattung, bei der Erstattung von Anzeigen und bei der Auskunftserteilung an die Generalversammlung die Geschäftsgeheimnisse der Gesellschaft.
- thema: Herausgabe- und Auskunftspflicht des VR, auf Verlangen schriftlich (OR 730b Abs. 1) – Grundlage Vollständigkeitserklärung
  quelle: or__art-730b
  zitat: Der Verwaltungsrat übergibt der Revisionsstelle alle Unterlagen und erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt, auf Verlangen auch schriftlich.
- thema: Anzeigepflicht der Revisionsstelle bei offensichtlicher Überschuldung (OR 729c) – gesetzliche Offenbarungspflicht; Agent meldet nur dem WP
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: Strafrechtliches Berufsgeheimnis der Revisoren (Art. 321 Ziff. 1 StGB)
  quelle: stgb__art-321
  zitat: nach Obligationenrecht zur Verschwiegenheit verpflichtete Revisoren
- thema: Berufsgeheimnis erfasst auch Hilfspersonen (Art. 321 Ziff. 1 StGB) – Grundlage für KI-Anbieter als Hilfsperson
  quelle: stgb__art-321
  zitat: sowie ihre Hilfspersonen, die ein Geheimnis offenbaren, das ihnen infolge ihres Berufes anvertraut worden ist
- thema: 'Strafe auf Antrag: Freiheitsstrafe bis 3 Jahre oder Geldstrafe (Art. 321 Ziff. 1 StGB)'
  quelle: stgb__art-321
  zitat: werden, auf Antrag, mit Freiheitsstrafe bis zu drei Jahren oder Geldstrafe bestraft
- thema: Straflos mit Einwilligung des Berechtigten (Art. 321 Ziff. 2 StGB) – Grundlage der schriftlichen Entbindung durch den Mandanten
  quelle: stgb__art-321
  zitat: Der Täter ist nicht strafbar, wenn er das Geheimnis auf Grund einer Einwilligung des Berechtigten
- thema: Auftragsbearbeitung (z.B. KI-Anbieter) nur, wenn keine Geheimhaltungspflicht die Übertragung verbietet (Art. 9 Abs. 1 lit. b DSG)
  quelle: dsg__art-9
  zitat: keine gesetzliche oder vertragliche Geheimhaltungspflicht die Übertragung verbietet
- thema: Verantwortlicher muss sich der Datensicherheit des Auftragsbearbeiters vergewissern (Art. 9 Abs. 2 DSG)
  quelle: dsg__art-9
  zitat: Der Verantwortliche muss sich insbesondere vergewissern, dass der Auftragsbearbeiter in der Lage ist, die Datensicherheit zu gewährleisten.
- thema: Datensicherheit durch technische und organisatorische Massnahmen (Art. 8 DSG)
  quelle: dsg__art-8
  zitat: Der Verantwortliche und der Auftragsbearbeiter gewährleisten durch geeignete technische und organisatorische Massnahmen eine dem Risiko angemessene Datensicherheit.
- thema: Bekanntgabe ins Ausland nur bei angemessenem bzw. geeignetem Schutz (Art. 16 DSG) – Datenstandort des KI-Anbieters
  quelle: dsg__art-16
  zitat: Personendaten dürfen ins Ausland bekanntgegeben werden, wenn der Bundesrat festgestellt hat
- thema: Busse bis CHF 250'000, auf Antrag, bei vorsätzlicher Bekanntgabe ins Ausland entgegen Art. 16, Übergabe an Auftragsbearbeiter ohne die Voraussetzungen von Art. 9 Abs. 1/2 oder
    Missachtung der Mindestanforderungen an die Datensicherheit (Art. 61 lit. a–c DSG)
  quelle: dsg__art-61
  zitat: Mit Busse bis zu 250 000 Franken werden private Personen auf Antrag bestraft, die vorsätzlich
  weitere_fundstellen:
  - quelle: dsg__art-61
    zitat: die Mindestanforderungen an die Datensicherheit, die der Bundesrat nach Artikel 8 Absatz 3 erlassen hat, nicht einhalten.
- thema: 'Zweck der Dokumentation: Prüfungsaussage gestützt, SER eingehalten (SER 7.1)'
  quelle: ser-2022__7-1
  zitat: Der Abschlussprüfer muss wichtige Sachverhalte dokumentieren als Nachweis dafür
- thema: Datierung und Autorvermerk der wichtigsten Dokumente (SER 7.1)
  quelle: ser-2022__7-1
  zitat: Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors oder derjenigen Person zu versehen, die das Revisionsmandat leitet.
- thema: 'Jahresakten: Pflichtinhalte (SER 7.2)'
  quelle: ser-2022__7-2
  zitat: Art und Umfang der Arbeitspapiere des Abschlussprüfers (Jahresakten) richten sich nach den konkreten Umständen.
- thema: Unterzeichnete Jahresrechnung und Vollständigkeitserklärung in den Jahresakten (SER 7.2)
  quelle: ser-2022__7-2
  zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- thema: Dauerakten (SER 7.3)
  quelle: ser-2022__7-3
  zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
- thema: QS-/QM-System Pflicht für Revisionsunternehmen mit eingeschränkten Revisionen (Art. 6 Abs. 1 lit. d RAG; Art. 9 Abs. 1, Art. 49 Abs. 2 RAV)
  quelle: rav__art-49
  zitat: Revisionsunternehmen, die eingeschränkte Revisionen durchführen, müssen ab dem 1. Oktober 2017 über ein internes Qualitätssicherungssystem verfügen und dessen Angemessenheit
    und Wirksamkeit überwachen
  weitere_fundstellen:
  - quelle: rav__art-9
    zitat: ein internes Qualitätssicherungssystem aufweist
  - quelle: rag__art-6
    zitat: die Führungsstruktur gewährleistet, dass die einzelnen Mandate genügend überwacht werden.
  - quelle: rab-qualitaetssicherung__c002-1
    zitat: Unabhängig von Grösse und Rechtsform ist jedes Revisionsunternehmen verpflichtet, über ein internes System zur Qualitätssicherung bzw. zum Qualitätsmanagement zu verfügen
      sowie dessen Angemessenheit und Wirksamkeit laufend zu überwachen
  - quelle: ser-2022__1-3-2
    zitat: Gesetzliche Revisionsdienstleistungen darf nur erbringen, wer über ein internes Qualitätssicherungssystem verfügt
- thema: Skalierte Qualitätssicherung in Eigenverantwortung (SER 1.3.2)
  quelle: ser-2022__1-3-2
  zitat: Die konkrete Ausgestaltung des Qualitätssicherungssystems liegt in der Eigenverantwortung der Revisionsunternehmen.
- thema: 'Mindeststandard eingeschränkte Revision: Anleitung TREUHAND|SUISSE (RAB RS 1/2014 Rz 3, Fassung bis 14.12.2026); ab 15.12.2026 Qualitätsmanagement nach AQM; EXPERTsuisse-Mitglieder
    ISQM-CH 1 und 2'
  quelle: rab-rs-1-2014__s002-1
  zitat: Die interne Qualitätssicherung in Bezug auf die Prüfung der Jahresrechnung muss mindestens die Vorgaben der Anleitung von TREUHAND|SUISSE zur Qualitätssicherung bei kleinen
    und mittelgrossen Revisionsunternehmen in der aktuellen Fassung erfüllen.
  weitere_fundstellen:
  - quelle: rab-rs-1-2014-aenderung-2026__s002-1
    zitat: bei kleinen und mittelgrossen Revisionsunternehmen (AQM) in der aktuellen Fassung erfüllen.
  - quelle: leitfaden-qm-2025__15-t2
    zitat: Prüfgesellschaften mit Mitgliedschaft bei EXPERTsuisse sind verpflichtet, ein Qualitätsmanagement nach ISQM-CH 1 und 2 zu betreiben.
- thema: Jährliche Nachschau mit Firm- und File-Review (RAB)
  quelle: rab-qualitaetssicherung__c002-2
  zitat: Die Nachschau ist jährlich durchzuführen. Sie umfasst sowohl eine Firm- als auch eine File-Review.
- thema: Zugang externer Berufsangehöriger zu Auftragsakten für QS vereinbaren (SER 1.7)
  quelle: ser-2022__1-7
  zitat: den Beizug von externen Berufsangehörigen zum Zweck der Qualitätssicherung und den damit einhergehenden Zugang zu den Auftragsakten
- thema: Verschwiegenheitspflicht (HWP ER II.2.1 Rz 10)
  quelle: hwp-er-2026__rz-0010-s150-t1
  zitat: Die Verschwiegenheitspflicht erstreckt sich auf alle in Ausübung ihrer Tätigkeit bekannt gewordenen Sachverhalte.
- thema: 'Gesetzliche Offenbarungspflichten als Ausnahme vom Revisionsgeheimnis: Inhalt des Revisionsberichts und GV-Auskünfte, gesetzliche Anzeigepflichten, Sonderprüfer, Art. 13 und
    15a RAG (HWP ER Rz 10)'
  quelle: hwp-er-2026__rz-0010-s150-t1
  zitat: Eine solche Verpflichtung besteht u.a. mit Bezug auf
- thema: Zeugen- und Editionspflicht nach StPO (HWP ER Rz 10)
  quelle: hwp-er-2026__rz-0010-s150-t1
  zitat: die Zeugen- und Editionspflicht gemäss Strafprozessordnung
- thema: Melde-, Zeugnis- und Auskunftspflichten gegenüber Behörden bleiben vorbehalten (Art. 321 Ziff. 3 StGB) – Entscheid WP
  quelle: stgb__art-321
  zitat: Vorbehalten bleiben die eidgenössischen und kantonalen Bestimmungen über die Melde- und Mitwirkungsrechte, über die Zeugnispflicht und über die Auskunftspflicht gegenüber einer
    Behörde.
- thema: 'Geheimbereich Dritter: auch deren Zustimmung einholen (HWP ER Rz 10)'
  quelle: hwp-er-2026__rz-0010-s150-t2
  zitat: Soweit (ausnahmsweise) Sachverhalte betroffen sind, die den rechtlich geschützten Geheimbereich Dritter betreffen, ist auch deren Zustimmung einzuholen.
- thema: 'Externe Nachschau: Vertraulichkeit, Revisions- und Berufsgeheimnis; Zugang in den Auftragsbedingungen vereinbaren (HWP ER Rz 124)'
  quelle: hwp-er-2026__rz-0124-s177
  zitat: Es besteht die Möglichkeit, mit den Mandanten in den Auftragsbedingungen zu vereinbaren, dass für Zwecke der Qualitätssicherung externen Berufsangehörigen Zugang zu den Auftragsakten
    gewährt wird.
- thema: Aufbewahrung ab Berichtsdatum (HWP ER III.2.9 Rz 288)
  quelle: hwp-er-2026__rz-0288-s248
  zitat: Die Arbeitspapiere sind während mindestens zehn Jahren, regelmässig gerechnet ab Berichtsdatum, aufzubewahren.
- thema: 'Elektronische Aufbewahrung: Änderungen feststellbar, Daten lesbar (HWP ER Rz 288)'
  quelle: hwp-er-2026__rz-0288-s248
  zitat: für die Dauer der gesetzlichen Aufbewahrungspflicht nachträgliche Änderungen festgestellt und die Daten wieder lesbar gemacht werden können
- thema: 'Änderungen nach dem Berichtsdatum: zusätzlich GeBüV beachten (HWP ER Rz 287)'
  quelle: hwp-er-2026__rz-0287-s248
  zitat: Zudem sind die Bestimmungen der Geschäftsbücherverordnung
- thema: 'GeBüV sinngemäss für die elektronische Revisionsakte (Auslegung; direkt anwendbar auf Geschäftsbücher, für die Akte HWP ER Rz 287 und OR 730c Abs. 1/HWP Rz 288): Änderungen
    feststellbar (Art. 3); veränderbare Träger nur mit Integritätsverfahren, unverfälschbarem Zeitstempel und aufbewahrten Protokollen/Log files (Art. 9 Abs. 1 lit. b Ziff. 1–4); regelmässig
    auf Integrität und Lesbarkeit prüfen, Migration protokollieren (Art. 10); Archiv getrennt bzw. erkennbar kennzeichnen (Art. 7)'
  quelle: gebuev__art-3
  zitat: dass sie nicht geändert werden können, ohne dass sich dies feststellen lässt.
  weitere_fundstellen:
  - quelle: gebuev__art-9
    zitat: der Zeitpunkt der Speicherung der Informationen unverfälschbar nachweisbar ist
  - quelle: gebuev__art-9
    zitat: die entsprechenden Hilfsinformationen (wie Protokolle und Log files) ebenfalls aufbewahrt werden
  - quelle: gebuev__art-10
    zitat: Die Informationsträger sind regelmässig auf ihre Integrität und Lesbarkeit zu prüfen.
  - quelle: gebuev__art-10
    zitat: Die Übertragung von Daten von einem Informationsträger auf einen anderen ist zu protokollieren.
  - quelle: gebuev__art-7
    zitat: Archivierte Informationen sind von aktuellen Informationen zu trennen bzw. so zu kennzeichnen, dass eine Unterscheidung möglich ist.
  - quelle: hwp-er-2026__rz-0287-s248
    zitat: Zudem sind die Bestimmungen der Geschäftsbücherverordnung
- thema: Aufbewahrung auch nach Mandatsende (HWP ER Rz 186)
  quelle: hwp-er-2026__rz-0186-s072
  zitat: Die Pflicht zur Aufbewahrung gilt auch über eine allfällige Beendigung des Mandats hinaus.
- thema: Verantwortung für die Durchsicht (HWP ER II.4.4.1 Rz 119)
  quelle: hwp-er-2026__rz-0119-s175-t1
  zitat: Der Auftragsverantwortliche trägt aber die Verantwortung dafür, dass eine angemessene Durchsicht erfolgt.
- thema: Durchsicht nur durch Personen mit mindestens gleichwertiger Qualifikation wie die Erstellenden (HWP ER Rz 119) – der Agent ist nie Reviewer
  quelle: hwp-er-2026__rz-0119-s175-t1
  zitat: welche über eine mindestens gleichwertige Qualifikation verfügen wie die Erstellenden der Prüfungsakten
- thema: Durchsichtspflicht entsteht mit der Delegation von Prüfungshandlungen (Leitfaden QM 6.2) – also auch bei Vorbereitung durch den Agenten (Auslegung)
  quelle: leitfaden-qm-2025__6-2-t6
  zitat: ein Prüfungsteam einsetzt und die Durchführung von Prüfungshandlungen delegiert
- thema: Interne Frist zur Zusammenstellung der endgültigen Auftragsakte (HWP ER Rz 334; ISQM-CH 1 Tz. A83)
  quelle: hwp-er-2026__rz-0334-s258
  zitat: Das Revisionsunternehmen legt intern Fristen fest, innerhalb deren die Zusammenstellung der endgültigen Auftragsakte abzuschliessen ist.
- thema: 'Beispiel, keine Regelfrist der eingeschränkten Revision: bei Abschlussprüfungen in der Regel höchstens 60 Tage nach Berichtsdatum (HWP ER Rz 334)'
  quelle: hwp-er-2026__rz-0334-s258
  zitat: Bei Abschlussprüfungen beispielsweise beträgt diese Frist in der Regel höchstens 60 Tage nach dem Datum des Revisionsberichts
- thema: Datenschutz im Qualitätsmanagement (HWP ER II.4.2.7 Rz 103)
  quelle: hwp-er-2026__rz-0103-s173
  zitat: jedoch sind immer die Vorgaben bezüglich Datenschutz zu beachten
- thema: Vertraulichkeit der Auftragsdokumentation (Leitfaden QM 6.1.11, ISQM-CH 1 Tz. 31(f))
  quelle: leitfaden-qm-2025__6-1-11-t1
  zitat: Die Auftragsdokumentation ist vertraulich.
- thema: Zugriff auf die Auftragsdokumentation nur für autorisierte Personen (Leitfaden QM 6.1.11 b)
  quelle: leitfaden-qm-2025__6-1-11-t2
  zitat: nur autorisierten Personen Zugriff auf die Auftragsdokumentation gewähren
- thema: Beizug Dritter berührt Revisions- und Berufsgeheimnis (Leitfaden QM 6.1.12)
  quelle: leitfaden-qm-2025__6-1-12-t1
  zitat: es stellt sich damit die Frage des Revisionsgeheimnisses (Art. 730b Abs. 2 OR) wie auch des Berufsgeheimnisses (Art. 321 StGB)
- thema: 'KI: Berufsgeheimnis geht weiter als Datenschutz – DPA/AVV allein genügt nicht (Seminar KI 11/2026, Fachliteratur Rang 4)'
  quelle: seminar-ki-datenschutz-2026__s003-1
  zitat: Ein DPA/AVV allein genügt nicht
- thema: KI-Anbieter als Hilfsperson nur bei vertraglicher Bindung ans Berufsgeheimnis und Arbeit auf Weisung, sonst schriftliche Entbindung (Seminar KI; Rechtslage ungeklärt)
  quelle: seminar-ki-datenschutz-2026__s003-1
  zitat: möglich, wenn er vertraglich ans Berufsgeheimnis gebunden ist und nur auf Weisung arbeitet
schritte:
- was: 'Mandatskontext als Geheimnisschutz: vor jedem Zugriff und jeder Ablage (revio, M-Files, E-Mail) prüfen, ob Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr und Stichtag dem
    fixierten Kontext-Schlüssel entsprechen; bei Abweichung abbrechen und Pendenz erfassen. Nichts mandatsfremd lesen oder ablegen; Zugriff nur über den eigenen, mandatsbezogen berechtigten
    Dienstbenutzer.'
  wer: Agent
  revio: Dossier-Anmeldung lesend (rv_get_clientsManagement_TryLoginDossier_by_clientId_by_dossierId); bei Abweichung Notiz «Pendenz»; mandats- oder aktenübergreifende Werkzeuge nie
  mfiles: Suche nur über Metadaten (Kunde, Geschäftsjahr, Klasse) des fixierten Mandats, nicht Volltext
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: Jeder Zugriff und jede Ablage wird dagegen geprüft; bei Abweichung bricht der Agent ab und erfasst eine Pendenz.
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: 'M-Files: REST-API, Suche über Metadaten (Kunde, Geschäftsjahr, Klasse) statt Volltext.'
  - quelle: or__art-730b
    zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen, soweit sie nicht von Gesetzes wegen zur Bekanntgabe verpflichtet ist.
  - quelle: leitfaden-qm-2025__6-1-11-t2
    zitat: nur autorisierten Personen Zugriff auf die Auftragsdokumentation gewähren
- was: 'Agenten-Protokoll (Audit Trail) laufend führen: jede Aktion, Quelle (M-Files-ID/Version), Berechnung und jeder Fehler mit Zeitstempel, damit feststellbar bleibt, wer (Dienstbenutzer
    des Agenten) was wann erstellt oder geändert hat. Rechnen nur im Rechenmodul (Code), nie im Sprachmodell.'
  wer: Agent
  revio: Arbeit unter eigenem Dienstbenutzer; optional als «zugewiesener Mitarbeiter» in 3.5 (Entscheid offen)
  mfiles: 'Protokoll pro Mandat und Geschäftsjahr ablegen (Klasse/Kategorie gemäss Metadatenkonzept consis/enco, noch offen); Agenten-Protokoll änderungsnachweisbar mit Zeitstempel ablegen;
    Aufbewahrungsdauer offener Governance-Entscheid (Vorschlag: wie die Akte, mind. 10 Jahre)'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
  - quelle: hwp-er-2026__rz-0283-s247
    zitat: festzuhalten und ggf. nachzuweisen, wer die entsprechenden Prüfungshandlungen an welchem Datum vorgenommen hat
  - quelle: leitfaden-qm-2025__6-1-11-t1
    zitat: die Feststellung ermöglichen, wann und von wem die Auftragsdokumentation erstellt, (zuletzt) geändert und durchgesehen wurde
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: 'Rechenmodul: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.'
  - quelle: gebuev__art-3
    zitat: dass sie nicht geändert werden können, ohne dass sich dies feststellen lässt.
  - quelle: gebuev__art-9
    zitat: die entsprechenden Hilfsinformationen (wie Protokolle und Log files) ebenfalls aufbewahrt werden
  - quelle: konzept-ki-revisionsagent-2026__c022-1
    zitat: Aufbewahrung der Agenten-Protokolle
- was: 'Je Prüfschritt im Textfeld einheitlich dokumentieren: Prüfziel(e) und welche davon der Nachweis abdeckt, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung,
    Ergebnis, eigene Schlussfolgerung, Feststellungen, Pendenzen, Status – so, dass ein nicht beteiligter, erfahrener Prüfer Planung, Durchführung und Ergebnis nachvollziehen kann. Den
    Text mit «Entwurf KI-Agent <Datum>» beginnen (Datum und Autorvermerk, SER 7.1). Nur nicht visierte Schritte bearbeiten; Visum offen lassen.'
  wer: Agent
  revio: 'Bereich 4, Textfeld des Prüfschritts gemäss Kette K6 (rv_put_auditActivities_UpdateDossierActivity; Alternative rv_put_auditActivities_UpdateDossierActivityItemTemplateField
    nur nach Test). Der Text beginnt mit «Entwurf KI-Agent <Datum>». Feldregel: isVised, visaDate, visaText und visaUserId nie setzen (Praxis/intern, revio-Klassierung). Vor dem Schreiben
    den Schritt neu laden (K6 Schritt 2); kein Visum, kein ✓'
  mfiles: Nachweise mit M-Files-ID und Version referenzieren
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status.
  - quelle: konzept-ki-revisionsagent-2026__c008-1
    zitat: der Agent hält im Textfeld fest, welche Prüfziele sein Nachweis abdeckt
  - quelle: konzept-ki-revisionsagent-2026__c011-2
