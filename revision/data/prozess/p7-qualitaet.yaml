- dokument: Berechtigungskonzept M-Files/revio und Dienstbenutzer
  zweck: Zugriffsschutz und Vertraulichkeit der Auftragsdokumentation (nur autorisierte Personen, mandatsbezogen)
  quelle: konzept-ki-revisionsagent-2026__c018-1
  zitat: Berechtigungskonzept und Möglichkeit eines Dienstbenutzers
- dokument: PDF-Akte «AP revio» (nur auf Anweisung)
  zweck: Archivfähige Gesamtakte in M-Files
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: PDF-Akte erzeugen, prüfen, in M-Files ablegen (Klasse «Revision», Kategorie «Arbeitspapiere», Bezeichnung «AP revio»)
dokumentation:
- text: Einheitliches Ergebnis je Prüfschritt im Textfeld (Prüfziel, Quellen mit M-Files-ID und Version, Auswahl/Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen, Status).
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status.
- text: Welche Prüfziele der Nachweis abdeckt.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: der Agent hält im Textfeld fest, welche Prüfziele sein Nachweis abdeckt
- text: Eigene Schlussfolgerung je Prüfungshandlung.
  quelle: hwp-er-2026__rz-0278-s246
  zitat: Für die Prüfungshandlungen hält der Abschlussprüfer eigene Schlussfolgerungen fest.
- text: Datum und Ersteller (Dienstbenutzer des Agenten) jedes Arbeitspapiers; Review-Datum und Reviewer setzt der WP.
  quelle: hwp-er-2026__rz-0278-s246
  zitat: Die Arbeitspapiere sind zu datieren und vom Ersteller zu kennzeichnen.
- text: Ergänzungen zu bereits visierten Schritten nur als eigene Notiz «Pendenz» mit Verweis auf Schritt, Text und Nachweis; den Nachtrag am Schritt hängt der WP an.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: alles bleibt beim Menschen
- text: Auflösung von Inkonsistenzen zwischen Feststellungen und Prüfungsaussage.
  quelle: hwp-er-2026__rz-0290-s248
  zitat: dokumentiert der Abschlussprüfer in den Arbeitspapieren, wie er die Inkonsistenz oder den Widerspruch aufgelöst hat
- text: Mündliche und schriftliche Berichterstattung (Schlussbesprechung, Rapport).
  quelle: hwp-er-2026__rz-0290-s248
  zitat: Der Abschlussprüfer achtet darauf, dass die mündliche wie auch die schriftliche Berichterstattung in den Arbeitspapieren dokumentiert ist.
- text: 'Nicht gelesene Bereiche wegen offener Leserechte als Notiz «Pendenz: <Bereich> nicht gelesen – Leserecht offen»; betroffene Pflichtinhalte nach SER 7.2 im Rapport nennen.'
  quelle: konzept-ki-revisionsagent-2026__c017-1
  zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
- text: Hinweise auf gesetzliche Offenbarungs- oder Anzeigepflichten als Pendenz an den WP (kein eigenes Handeln).
  quelle: hwp-er-2026__rz-0010-s150-t1
  zitat: die gesetzlichen Anzeigepflichten
- text: Schriftliche Entbindung bzw. KI-Regelung in den Auftragsbedingungen in der Akte (Ablage durch den WP).
  quelle: hwp-er-2026__rz-0010-s150-t2
  zitat: (dies sollte unbedingt schriftlich festgehalten werden)
- text: Liste der erhaltenen Kundenoriginale im Rapport.
  quelle: hwp-er-2026__rz-0284-s248
  zitat: die ihm anvertrauten Akten sowie alle Dokumente, die er für die Prüfung angefordert hat, dem Unternehmen zurückzugeben
- text: Konsultationen (durch den WP) angemessen dokumentieren.
  quelle: leitfaden-qm-2025__6-1-4-t1
  zitat: Die Konsultation ist angemessen zu dokumentieren.
- text: 'Änderungen nach Abschluss der Akte: wer, wann, Durchsicht, Gründe, Auswirkungen.'
  quelle: hwp-er-2026__rz-0286-s248
  zitat: Wer diese Änderungen an welchem Datum ausführte und wer ggf. zu welchem Zeitpunkt die Durchsicht vornahm
- text: Audit Trail des Agenten mit Zeitstempel pro Mandat und Jahr.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
- text: Ablage der PDF-Akte mit bestätigtem Speicherort.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Nichts überschreiben; Ablage mit Speicherort bestätigen
fallstricke:
- text: 'Mandatsvermischung: Zugriff oder Ablage ausserhalb des fixierten Kontexts verletzt das Revisionsgeheimnis – sofort abbrechen, Pendenz.'
  quelle: konzept-ki-revisionsagent-2026__c009-1
  zitat: Jeder Zugriff und jede Ablage wird dagegen geprüft; bei Abweichung bricht der Agent ab und erfasst eine Pendenz.
- text: E-Mail an Kunden oder Dritte in der Testphase – nur Entwurf oder fixe WP-Adresse.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: 'E-Mail: in der Testphase nur Entwurf oder Versand an eine fixe WP-Adresse, nie an Kunden.'
- text: Notizen (auch «Review») löschen, als erledigt markieren (isClosed) oder fremde Notizen ändern.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Notizen löscht oder erledigt er nie.
- text: 'Werkzeuge der Liste «revio nur-mensch» aufrufen (revision.py revio nur-mensch; wiki/revio/werkzeuge-nur-mensch.md: Siegel inkl. UnSealAnualFile/CancelSealRequest, Visum, Archiv
    inkl. LoadArchiveAuditLog, Review-Workflow inkl. Reject/CancelGlobalDossierReview, AppendCommentToSignedActivity, Löschen) – auch nicht auf Anweisung oder über revio_call.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand; Löschrechte eingeschränkt
- text: 'Feldregeln missachten: Visum-Felder (isVised, visaDate, visaText, visaUserId) in UpdateDossierActivity, isClosed in UpdateNote oder isArchiveJob=true in GeneratePdfReport setzen
    (Praxis/intern, revio-Klassierung).'
- text: Direkt in die revio-Datenbank schreiben – umgeht Historie und Nachvollziehbarkeit.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: Direktes Schreiben in die Datenbank ist ausgeschlossen, weil es Anwendungslogik, Historie und Support umgeht.
- text: Review «nachholen» nach Berichtsabgabe ist unzulässig – offene Punkte müssen vor dem Berichtsdatum im Rapport stehen.
  quelle: leitfaden-qm-2025__6-2-t3
  zitat: hat der Auftragsverantwortliche vor Abgabe des Revisionsberichts sicherzustellen, dass eine entsprechende Durchsicht der Arbeiten der weniger erfahrenen Teammitglieder stattgefunden
    hat
- text: Agent als Reviewer einsetzen (eigene Arbeit oder anderer Agentenlauf) oder die Ausnahme «eigenständig ohne Teammitglieder» auf vom Agenten vorbereitete Mandate anwenden.
  quelle: hwp-er-2026__rz-0119-s175-t1
  zitat: welche über eine mindestens gleichwertige Qualifikation verfügen wie die Erstellenden der Prüfungsakten
- text: Vollständigkeitserklärung als Ersatz für Nachweise verwenden.
  quelle: hwp-er-2026__rz-0338-s259
  zitat: die Vollständigkeitserklärung kein Ersatz für Prüfungsnachweise ist
- text: Nach Abschluss der endgültigen Akte Dokumente entfernen oder überschreiben.
  quelle: hwp-er-2026__rz-0286-s248
  zitat: sollte der Abschlussprüfer bis zum Ablauf der Aufbewahrungsfrist keine Dokumentationen mehr entfernen oder aussortieren
- text: 60 Tage als gesetzliche Regelfrist der eingeschränkten Revision nennen – massgebend ist die intern festgelegte Frist; 60 Tage sind ein Beispiel.
  quelle: hwp-er-2026__rz-0334-s258
  zitat: Bei Abschlussprüfungen beispielsweise beträgt diese Frist
- text: Rückgabe von Kundenoriginalen selbst veranlassen oder Originale zurückbehalten – der Agent listet nur, die Rückgabe veranlasst der WP.
  quelle: hwp-er-2026__rz-0284-s248
  zitat: Es besteht kein Retentionsrecht des Abschlussprüfers an den Akten, die er vom geprüften Unternehmen erhalten hat.
- text: Fehlende Angaben oder Nachweise ergänzen statt als Pendenz melden.
  quelle: konzept-ki-revisionsagent-2026__c005-1
  zitat: fehlende Daten dürfen nicht erfunden werden
- text: 'Leserechte umgehen: gesperrte oder nicht freigegebene Bereiche über andere Werkzeuge oder revio_call lesen oder fehlende Inhalte annehmen.'
  quelle: konzept-ki-revisionsagent-2026__c017-1
  zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
  weitere_fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c005-1
    zitat: fehlende Daten dürfen nicht erfunden werden
- text: Annahme, der KI-Dienstleister trage die Qualitätsverantwortung – sie bleibt bei der Praxis bzw. beim WP.
  quelle: leitfaden-qm-2025__7-1-4
  zitat: Ungeachtet dessen, dass eine Praxis Ressourcen eines Dienstleisters nutzen kann, bleibt die Praxis für ihr Qualitätsmanagementsystem verantwortlich.
- text: Annahme, ein DPA/AVV oder eine Firmenversion (Team/Enterprise) genüge für das Berufsgeheimnis – es braucht eine Vertragsergänzung oder die schriftliche Entbindung.
  quelle: seminar-ki-datenschutz-2026__s008-1
  zitat: Auch Firmenversionen brauchen dafür eine Vertragsergänzung oder die schriftliche Entbindung durch den Mandanten.
- text: Mandantendaten verarbeiten, bevor Datenschutz und Berufsgeheimnis geregelt sind oder die Grundlage im Mandat vorliegt.
  quelle: konzept-ki-revisionsagent-2026__c015-3
  zitat: Datenstandort, Auftragsbearbeitungsvertrag, kein Training mit Mandantendaten, revDSG, Schweigepflicht nach Art. 730b OR; vor dem ersten Test mit Echtdaten regeln.
- text: Pauschale Klausel «wir setzen KI ein» als ausreichende Einwilligung des Mandanten ansehen – nötig ist eine spezifische Einwilligung bzw. schriftliche Entbindung.
  quelle: seminar-ki-datenschutz-2026__s003-3
  zitat: nur mit spezifischer Einwilligung des Mandanten; «wir setzen KI ein» schützt kaum.
- text: Anbieterbedingungen (Ampel Seminar Folie 60, Stand 8. Juli 2026) als dauerhaft gültig übernehmen – sie ändern sich laufend.
  quelle: seminar-ki-datenschutz-2026__s004-2
  zitat: Bedingungen vor dem Einsatz neu prüfen.
- text: Verdacht auf Straftaten selbst bei Behörden melden – die Verschwiegenheit schliesst Anzeigen an Strafverfolgungsbehörden aus; Sachverhalt nur dem WP melden.
  quelle: hwp-er-2026__rz-0010-s150-t2
  zitat: die Verschwiegenheitspflicht der Revisionsstelle eine Anzeige an Strafverfolgungsbehörden ausschliesst
- text: Gesetzliche Anzeige (z.B. Gericht bei offensichtlicher Überschuldung) oder Auskunft an Sonderprüfer/Behörden selbst auslösen – Entscheid und Handlung beim WP.
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- text: Wissensbasis (HWP, SER, Muster) oder revio-Werkzeugliste nach aussen geben – lizenziert bzw. proprietär, Lizenzlage offen.
  quelle: konzept-ki-revisionsagent-2026__c019-1
  zitat: Lizenzsituation für HWP und SER
- text: revio-Updates ungetestet auf dem Agenten-Arbeitsplatz einspielen.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: Updates werden deshalb auf dem Agenten-Arbeitsplatz erst nach einem Test eingespielt.
- text: Seminar «Datenschutz bei der Nutzung von KI» (seminar-ki-datenschutz-2026) ist eine Agenten-Abschrift eines Bildscans (Fachliteratur Rang 4, nach Gesetz und HWP); im Zweifel
    Original raw/seminar-ki-datenschutz-2026.pdf prüfen.
fragen_kunde:
- frage: Sind Sie einverstanden, dass für die gesetzlich vorgesehene Qualitätssicherung (Nachschau/Peer Review) externe Berufsangehörige unter Vertraulichkeit Einsicht in die Auftragsakten
    erhalten, und entbinden Sie uns dafür vom Revisionsgeheimnis (Regelung in der Auftragsbestätigung)?
  zweck: 'SER 1.7; SER Anhang C Fn. [9] (ser-2022__anh-c-s058-1); HWP ER Rz 124 (hwp-er-2026__rz-0124-s177); Leitfaden QM 6.1.12 (leitfaden-qm-2025__6-1-12-t1): Zugang Dritter und Entbindung
    vom Revisionsgeheimnis vereinbaren. Frage stellt der WP; der Agent bereitet nur die Formulierung vor.'
- frage: Sind Sie mit dem Einsatz eines KI-Agenten (Anbieter, Datenstandort) bei der Revision einverstanden bzw. entbinden Sie uns dafür schriftlich vom Revisionsgeheimnis?
  zweck: 'Berufsgeheimnis beim KI-Einsatz: KI-Einsatz in den Auftragsbedingungen regeln oder schriftlich entbinden lassen (seminar-ki-datenschutz-2026__s006-1, s008-1; Art. 321 Ziff.
    2 StGB; HWP ER Rz 10). Die Einwilligung muss spezifisch sein (seminar-ki-datenschutz-2026__s003-3: «wir setzen KI ein» schützt kaum); wegen der ungeklärten Rechtslage auch neben
    der Hilfsperson-Lösung zu prüfen (Massnahme «Mandanten einbinden»). Entscheid und Frage beim WP.'
- frage: Liegen die vom Vorsitzenden des Verwaltungsrats und der für die Rechnungslegung zuständigen Person unterzeichnete Jahresrechnung und Vollständigkeitserklärung vor?
  zweck: 'SER 7.2: Bestandteil der Jahresakten; Unterzeichnende gemäss SER Anhang C Fn. [8] (ser-2022__anh-c-s058-1: VE in der Regel von denselben Personen wie die JR); Ablage 10.4,
    Prüfschritte A1-103/A1-301.'
- frage: Haben sich Statuten, Handelsregistereintrag oder wesentliche mehrjährige Verträge seit dem Vorjahr geändert?
  zweck: Dauerakten aktualisieren (SER 7.3; Schritte xx-322/P1-321).
- frage: Welche Originalunterlagen haben Sie uns übergeben, und wie sollen sie zurückgegeben werden?
  zweck: 'HWP ER Rz 284: Rückgabe anvertrauter Akten, kein Retentionsrecht; in der Akte bleiben Kopien (Rz 186). Frage und Rückgabe durch den WP; der Agent liefert die Liste der erhaltenen
    Originale.'
- frage: Bestehen besondere Geheimhaltungs- oder Datenschutzanforderungen (z.B. Personendaten, Geschäftsgeheimnisse, vertragliche Vertraulichkeit, Geheimbereich Dritter), die bei Übermittlung
    und Ablage der Unterlagen zu beachten sind?
  zweck: OR 730b Abs. 2, HWP ER Rz 10 (Zustimmung Dritter) und Datenschutzvorgaben (HWP ER Rz 103) einhalten; sichere Übermittlungswege mit dem WP festlegen.
