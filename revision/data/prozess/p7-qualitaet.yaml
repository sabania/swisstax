- text: Seminarunterlagen «Datenschutz bei der Nutzung von KI» (seminar-ki-datenschutz-2026, Folien 53–68) sind ein Bildscan ohne Textlayer und nicht gechunkt – daraus nichts zitieren;
    Original raw/seminar-ki-datenschutz-2026.pdf vom WP lesen lassen.
fragen_kunde:
- frage: Sind Sie einverstanden, dass für die gesetzlich vorgesehene Qualitätssicherung (Nachschau/Peer Review) externe Berufsangehörige unter Vertraulichkeit Einsicht in die Auftragsakten
    erhalten (Regelung in der Auftragsbestätigung)?
  zweck: 'SER 1.7, SER Anhang C Fn. [9], Leitfaden QM 6.1.12: Zugang Dritter und Entbindung vom Revisionsgeheimnis vereinbaren; Frage stellt der WP, der Agent bereitet nur die Formulierung
    vor.'
- frage: Liegen die vom Vorsitzenden des Verwaltungsrats und der für die Rechnungslegung zuständigen Person unterzeichnete Jahresrechnung und Vollständigkeitserklärung vor?
  zweck: 'SER 7.2: Bestandteil der Jahresakten; Ablage 10.4, Prüfschritte A1-103/A1-301.'
- frage: Haben sich Statuten, Handelsregistereintrag oder wesentliche mehrjährige Verträge seit dem Vorjahr geändert?
  zweck: Dauerakten aktualisieren (SER 7.3; Schritte xx-322/P1-321).
- frage: Welche Originalunterlagen haben Sie uns übergeben, und wie sollen sie zurückgegeben werden?
  zweck: 'HWP ER Rz 284: Rückgabe anvertrauter Akten, kein Retentionsrecht; in der Akte bleiben Kopien (Rz 186).'
- frage: Bestehen besondere Geheimhaltungs- oder Datenschutzanforderungen (z.B. Personendaten, Geschäftsgeheimnisse, vertragliche Vertraulichkeit), die bei Übermittlung und Ablage der
    Unterlagen zu beachten sind?
  zweck: OR 730b Abs. 2 und Datenschutzvorgaben (HWP ER Rz 103) einhalten; sichere Übermittlungswege mit dem WP festlegen.
