  - quelle: katalog-revio4__c003-55
    zitat: Aktualisieren Dauerakten
- was: 'Widersprüche und offene Punkte führen: Inkonsistenzen zwischen Feststellungen und Prüfungsaussage offenlegen; alles Ungeklärte als Pendenz (Konto, Datum, Betrag); im Revisionsrapport
