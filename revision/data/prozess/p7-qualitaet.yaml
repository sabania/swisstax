  fundstellen:
  - quelle: ser-2022__7-2
    zitat: erlangte Prüfungsnachweise und ihre Beurteilung durch den Abschlussprüfer
  - quelle: ser-2022__7-2
    zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
  - quelle: katalog-revio4__c003-2
    zitat: Vollständigkeitserklärung besprechen und unterzeichnen lassen.
  - quelle: katalog-revio4__c003-3
