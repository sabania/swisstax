- was: 'Voraussetzungen für den KI-Einsatz vor dem ersten Test mit Echtdaten klären (consis mit enco und AI-Partner; der Agent liefert nur die Checkliste): (0) Betriebsmodell festlegen:
    lokales Modell auf eigener Infrastruktur (Daten verlassen den Server nie) oder Cloud/Hyperscaler. DPA/AVV und Berufsgeheimnis-Ergänzung gelten für jeden Dritten mit Zugriff auf Mandatsdaten
    (KI- oder Cloud-Anbieter, AI-Partner im Testbetrieb, Fernwartung). Art. 16 DSG gilt, soweit Daten ins Ausland gehen (Auslegung); (1) Datenschutz: DPA/AVV und Datensicherheit (Art.
    8/9 DSG), Datenstandort bzw. Bekanntgabe ins Ausland (Art. 16 DSG), revDSG; prüfen, ob der Anbieter nur auf dokumentierte Weisung bearbeitet (keine eigenen Zwecke) und bei Vertragsende
    löscht oder zurückgibt; Unterauftragsbearbeiter und Länder offengelegt, Übertragung nur mit vorgängiger Genehmigung (Art. 9 Abs. 3 DSG); nur nötige Personendaten an das Modell (Art.
    7 Abs. 3 DSG); prüfen, ob eine Datenschutz-Folgenabschätzung nötig ist (EDÖB); (2) Berufsgeheimnis: DPA/AVV allein genügt nicht – Vertragsergänzung zum Berufsgeheimnis, damit der
    Anbieter als Hilfsperson gilt (vertraglich gebunden, nur auf Weisung), sonst schriftliche Entbindung durch den Mandanten; Rechtslage ungeklärt, Verlautbarung der EXPERTsuisse-Rechtskommission
    verfolgen; (3) Anbieterbedingungen: Enterprise-Variante mit No-Training- und No-Monitoring-Commitment (Abuse Monitoring), Websuche aus, nur Firmenkonten, Zugriffe berechtigen; Bedingungen
    vor dem Einsatz und jährlich neu prüfen; (4) QM: KI-Weisung, KI-Nutzung als Risiko in der Risiko-Kontroll-Matrix, Schulung, KI-Einsatz und vom Agenten vorbereitete Akten in die jährliche
    Nachschau (Firm- und File-Review) aufnehmen, KI-Einsatz in den Auftragsbedingungen regeln; (5) Berechtigungskonzept und Dienstbenutzer, Lizenz HWP/SER, Aufbewahrung der Agenten-Protokolle,
    Abnahmekriterien. Der Agent ist eine Ressource eines Dienstleisters – die Verantwortung für das QM bleibt bei der Praxis.'
