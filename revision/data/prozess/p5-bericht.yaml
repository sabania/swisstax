- was: 'Bei wesentlicher Unsicherheit (Fortführung, Rechtsfall, Finanzierung, Konzession usw.) prüfen, ob der Anhang sie angemessen offenlegt. Wenn ja: Zusatz mit Verweis auf die Anhangsangabe
    (Bsp. 10), allenfalls mit Eventualzusatz zu OR 725a/725b. Wenn nein: Modifizierung vorschlagen, z.B. eingeschränkt bei ungenügender Offenlegung (Muster c026) oder verneinend bei
    fehlender Offenlegung (Muster c033); die Art entscheidet der WP. Rechtsfälle und Risiken aus O1-101/O1-102 einbeziehen. Unsicherheiten von einer Beschränkung des Prüfungsumfangs
    abgrenzen.'
