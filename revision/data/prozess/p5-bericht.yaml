    zitat: Es liegt im Ermessen des Abschlussprüfers, zu entscheiden, ob das Gesamtbild der Jahresrechnung grundlegend verändert wird oder nicht.
- was: 'Eigenkapital nach OR 725a/725b beurteilen (`aufgabe kapitalschutz`; Rechner `kapitalverlust` mit --reserve-voll/--covid-kredit). Ein hälftiger Kapitalverlust führt zu einem
    Zusatz (SER Bsp. 11). Entwurfsregel: Hat der VR bei hälftigem Kapitalverlust trotz Zeitablauf keine oder offensichtlich unzureichende Massnahmen ergriffen, Hinweis vorschlagen
    (SER 8.3.2.1 «in jedem Fall», Rang vor HWP ER; Muster c050). Sind die Aktionäre informiert (HWP Rz 424), zusätzlich die Variante «nur Zusatz» für den WP markieren. Bei Überschuldung
    und Untätigkeit: Hinweis und Anzeigepflicht OR 729c (nur WP). Vorschlag nur in der Notiz «Schlussbesprechung»; Text im GVB-Entwurf nur auf Anweisung (Schritt «Texte, die vom
    Normalwortlaut abweichen»). Entscheid WP. Bei buchmässiger Überschuldung Zwischenabschlüsse
    und Rangrücktritte (Betrag inkl. Zinsen, Stundung, Bonität) prüfen. Daraus folgt ein Zusatz mit Rangrücktritt (Text HWP ER Abb. 52, Struktur SER Bsp. 9), ein Zusatz bei Deckung zu Veräusserungswerten im Zwischenabschluss
    (Muster c047), ein Zusatz bei begründeter Sanierungsaussicht innert längstens 90 Tagen nach Vorliegen der geprüften Zwischenabschlüsse (OR 725b Abs. 4 Ziff. 2, Muster c045) oder
    ein Zusatz mit Hinweis auf Untätigkeit (Bsp. 13). Die Prüfung der Zwischenabschlüsse (OR 725b Abs. 2) ergibt einen eigenen Bericht nach PS-CH 290 (Muster c059/c060); der GVB ersetzt
    ihn nicht. Gesellschaft in Liquidation: Unterlassen die Liquidatoren die Überschuldungsanzeige, Hinweis auf OR 743 Abs. 2 vorschlagen. Deutet etwas auf eine offensichtliche Überschuldung
    ohne Anzeige des VR hin, sofort Pendenz und Meldung an den WP (gebotene Eile, OR 725a Abs. 4/725b Abs. 6). Ermahnung und Anzeige nach OR 729c nur durch den WP.'
  wer: Agent bereitet vor, WP entscheidet
