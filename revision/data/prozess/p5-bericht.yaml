# Prozessphase p5-bericht – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p5-bericht
titel: 'Bericht: zusammenfassender Revisionsbericht, Modifikationen, Hinweise'
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 11
    korrigiert: false
ziel: Den zusammenfassenden Bericht an die GV (OR 729b) als GVB-Entwurf vorbereiten. Aus den Feststellungen wird der Normalwortlaut oder ein Vorschlag für Einschränkung, Verneinung,
  Unmöglichkeit, Zusatz oder Hinweis abgeleitet, belegt und gegen 7.1/7.5 und die Mustervorlagen abgeglichen. Prüfungsaussage, Datum, Unterschrift, Freigabe und Versand bleiben beim
  WP.
wann: Nach Abschluss der Prüffelder, der Beendigungsarbeiten (revio 6.1–6.3) und des Revisionsrapports (Prozess 4), sobald der WP die Feststellungen gesichtet hat. Das Berichtsdatum
  liegt frühestens bei der Unterzeichnung oder Genehmigung der JR durch den VR. Der Bericht muss vor der GV vorliegen und 20 Tage vorher zugänglich sein. Nach der Abgabe nur noch bei
  neuen Tatsachen tätig werden.
gesetz:
- thema: Zusammenfassender Bericht an die GV, schriftlich (OR 729b Abs. 1)
  quelle: or__art-729b
  zitat: Die Revisionsstelle erstattet der Generalversammlung schriftlich einen zusammenfassenden Bericht über das Ergebnis der Revision.
- thema: 'Pflichtinhalt: Unabhängigkeit, Mitwirkung bei der Buchführung (OR 729b Abs. 1 Ziff. 3)'
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung
- thema: Unterzeichnung durch die leitende Person (OR 729b Abs. 2), nie durch den Agenten
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- thema: 'Prüfungsgegenstand: JR und Antrag über die Verwendung des Bilanzgewinns (OR 729a Abs. 1)'
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: Geschäftsführung des VR ist kein Prüfungsgegenstand (OR 729a Abs. 3)
  quelle: or__art-729a
  zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
- thema: Bericht muss vor dem GV-Beschluss vorliegen (OR 731 Abs. 1)
  quelle: or__art-731
  zitat: muss der Revisionsbericht vorliegen, bevor die Generalversammlung die Jahresrechnung und die Konzernrechnung genehmigt und über die Verwendung des Bilanzgewinns beschliesst
- thema: Ohne Bericht sind die Beschlüsse nichtig (OR 731 Abs. 3)
  quelle: or__art-731
  zitat: Liegt der erforderliche Revisionsbericht nicht vor, so sind die Beschlüsse zur Genehmigung der Jahresrechnung und der Konzernrechnung sowie zur Verwendung des Bilanzgewinnes
    nichtig.
- thema: Anwesenheitspflicht an der GV nur bei ordentlicher Revision (OR 731 Abs. 2)
  quelle: or__art-731
  zitat: Wird eine ordentliche Revision durchgeführt, so muss die Revisionsstelle an der Generalversammlung anwesend sein.
- thema: Zugänglichmachen 20 Tage vor der GV (OR 699a)
  quelle: or__art-699a
  zitat: Mindestens 20 Tage vor der Generalversammlung sind den Aktionären der Geschäftsbericht und die Revisionsberichte zugänglich zu machen.
- thema: Unterzeichnung der Jahresrechnung durch VR-Präsident und Rechnungslegungsverantwortliche (OR 958 Abs. 3)
  quelle: or__art-958
  zitat: Er ist vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person zu unterzeichnen.
- thema: 'Kapitalverlust: Massnahmenpflicht des VR (OR 725a Abs. 1)'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Überschuldung: Prüfung der Zwischenabschlüsse durch die Revisionsstelle (OR 725b Abs. 2)'
  quelle: or__art-725b-t1
  zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen
- thema: Rangrücktritt als Ausnahme von der Benachrichtigung des Gerichts (OR 725b Abs. 4 Ziff. 1)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: Anzeigepflicht der eingeschränkt prüfenden Revisionsstelle (OR 729c)
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: Geheimhaltung der Feststellungen (OR 730b Abs. 2)
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen
- thema: Aufbewahrung der Berichte 10 Jahre (OR 730c)
  quelle: or__art-730c
  zitat: Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- thema: 'SER 8.1: Pflichtelemente des Revisionsberichts'
  quelle: ser-2022__8-1
  zitat: Der Revisionsbericht muss folgende Elemente enthalten
- thema: 'SER 8.3.1: Prüfungsaussage als negative Zusicherung'
  quelle: ser-2022__8-3-1-t1
  zitat: Bei der eingeschränkten Revision macht der Abschlussprüfer diese Prüfungsaussage in Form einer negativen Zusicherung.
- thema: 'SER 8.3.2.1: Hinweis bei Untätigkeit des VR (OR 725a/725b) zwingend'
  quelle: ser-2022__8-3-2-t1
  zitat: sind in jedem Fall im Revisionsbericht anzubringen
- thema: 'SER 8.5: Unterschrift der leitenden Person'
  quelle: ser-2022__8-5
  zitat: Zudem muss der Revisionsbericht die Unterschrift derjenigen Person tragen, welche die eingeschränkte Revision geleitet hat
- thema: 'SER 8.6: Berichtsdatum frühestens bei Unterzeichnung oder Genehmigung der JR'
  quelle: ser-2022__8-6
  zitat: darf der Abschlussprüfer den Revisionsbericht frühestens auf den Zeitpunkt datieren, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen hat
schritte:
- was: Ausgangslage für den Bericht zusammentragen (nur lesen). Dazu gehören die Ergebnisse und Notizen aller Prüffelder (Wesentliche Feststellungen, Pendenzen, Schlussbesprechung),
    die nicht nachgebuchten Fehler (6.1), Ereignisse nach dem Stichtag und Going concern (6.3, 3.4), die Wesentlichkeit (3.3), die Berichtsstrategie (7.1) und die Berichtskritik (7.5).
    Ist ein Prüffeld oder eine Pendenz noch offen, im Entwurf markieren und im Rapport melden.
  wer: Agent
  revio: 6.1, 6.3, 3.3, 3.4, 7.1, 7.5 (nur lesen); Notizen Bereich 4; rv_get_workpapers_LoadDossierNotesByNoteType, rv_get_workpapers_LoadMaterialityOfDossier, rv_get_financialStatement_LoadLedgerAdjustements
    (10.2)
  mfiles: ''
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: nur lesen; Vorgabe für den GVB-Entwurf
  - quelle: konzept-ki-revisionsagent-2026__c014-1
    zitat: die Summe der nicht korrigierten Fehler beurteilt der Mensch in 6.1
  - quelle: hwp-er-2026__rz-0456-s289
    zitat: Bis zum Abschluss seiner Arbeiten hat der Abschlussprüfer seine Feststellungen und Bemerkungen zusammengestellt.
- was: 'Jede berichtsrelevante Feststellung mit Betrag (Rechenmodul `rechne`) und Fundstelle einordnen: (a) korrigiert: keine Berichtsfolge; (b) nicht korrigierte wesentliche Fehlaussage,
    festgestellt oder angenommen: Modifizierung; (c) keine ausreichenden Prüfungsnachweise, z.B. eine verweigerte Erklärung in der VE (Beschränkung des Prüfungsumfangs): Modifizierung;
    (d) wesentliche Unsicherheit mit angemessener Anhangsangabe, Kapitalverlust, Überschuldung mit Rangrücktritt: Zusatz; (e) Gesetzesverstoss ausserhalb der Rechnungslegung: Hinweis.
    Ergebnis nur als Vorschlag bei A1-202/A1-203 erfassen.'
  wer: Agent bereitet vor, WP entscheidet
