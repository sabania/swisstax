- was: 'Weitere Hinweise auf Gesetzesverstösse nur vorschlagen, wenn der Verstoss wesentlich ist, einen direkten Bezug zur JR hat und aus den Prüfungshandlungen festgestellt wurde. Beispiele:
    Aktionärsdarlehen oder Kapitalrückzahlung ohne freie Reserven (OR 680), eigene Aktien (OR 659), Ungleichbehandlung (OR 660), Leistungen an Nahestehende (OR 678), Einberufungsfrist
    (OR 699), Dividende mit erheblichem Liquiditätsentzug (OR 717), Vorlagepflicht (OR 958 Abs. 3). Statutenverstösse nur mit Bezug zum Prüfungsgegenstand, das Organisationsreglement
    nie.'
