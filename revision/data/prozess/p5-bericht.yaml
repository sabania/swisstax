  fundstellen:
  - quelle: hwp-er-2026__rz-0383-s270
    zitat: Der Abschlussprüfer nimmt eine Modifizierung der Prüfungsaussage vor, wenn er
  - quelle: ser-2022__8-3-1-t2
    zitat: so sind diese Sachverhalte im Revisionsbericht darzulegen, sofern der Prüfungskunde die Fehlaussagen nicht korrigiert
  - quelle: hwp-er-2026__rz-0426-s282
    zitat: Mittels Hinweisen werden bei der eingeschränkten Revision festgestellte Verstösse gegen gesetzliche Bestimmungen ausserhalb der Rechnungslegungsvorschriften zur Jahresrechnung
      angezeigt.
  - quelle: ser-2022__anh-e-s101-2
    zitat: liegt eine Beschränkung des Prüfungsumfangs vor. In diesem Fall modifiziert der Abschlussprüfer die Prüfungsaussage.
- was: 'Art der Prüfungsaussage nach der Übersicht in SER Anhang F vorschlagen. Ohne negative Sachverhalte: nicht modifiziert (Bsp. 1). Bei einem festgestellten Sachverhalt: eingeschränkt
    (Bsp. 2) oder, wenn das Gesamtbild grundlegend verändert wird, verneinend (Bsp. 3, zum Antrag Bsp. 8). Bei einem angenommenen Sachverhalt oder einer Beschränkung: eingeschränkt (Bsp.
    4/6) oder Unmöglichkeit (Bsp. 5/7). Argumente für «grundlegend» sammeln, z.B. wenn die Korrektur eine Überschuldung zeigen oder die Ausschüttung verunmöglichen würde. Das Urteil
    bleibt offen.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 7.1 Berichtsstrategie (lesen); Vorschlag in Notiz «Schlussbesprechung» (A1)
  mfiles: ''
