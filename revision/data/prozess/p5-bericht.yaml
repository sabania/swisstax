- was: Eigenkapital nach OR 725a/725b beurteilen (Werkzeug `kapitalverlust`). Ein hälftiger Kapitalverlust führt zu einem Zusatz (SER Bsp. 11). Hat der VR trotz Zeitablauf keine oder
    offensichtlich unzureichende Massnahmen ergriffen, kommt zusätzlich ein Hinweis dazu (Muster «Untätigkeit 725a»). Bei buchmässiger Überschuldung Zwischenabschlüsse und Rangrücktritte
    (Betrag inkl. Zinsen, Stundung, Bonität) prüfen. Daraus folgt ein Zusatz (Bsp. 9, Muster c045/c047) oder ein Zusatz mit Hinweis auf Untätigkeit (Bsp. 13). Deutet etwas auf eine offensichtliche
    Überschuldung ohne Anzeige des VR hin, sofort Pendenz und Meldung an den WP (OR 729c).
  wer: Agent bereitet vor, WP entscheidet
