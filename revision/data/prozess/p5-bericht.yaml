# Prozessphase p5-bericht – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p5-bericht
titel: 'Bericht: zusammenfassender Revisionsbericht, Modifikationen, Hinweise'
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 11
    korrigiert: true
ziel: 'Den zusammenfassenden Bericht an die GV (OR 729b) als GVB-Entwurf vorbereiten: aus den Feststellungen Normalwortlaut oder Vorschlag für Einschränkung, Verneinung, Unmöglichkeit,
  Zusatz oder Hinweis ableiten, belegen und gegen 7.1/7.5 und die Mustervorlagen abgleichen. Prüfungsaussage, Datum, Unterschrift, Freigabe und Versand bleiben beim WP.'
wann: 'Nach Abschluss der Prüffelder und der Beendigungsarbeiten (revio 6.1–6.3): direkt nach dem Versand des Revisionsrapports (Prozess 4), ohne auf das Visum zu warten; der WP prüft
  und visiert den Rapport und gibt danach den Bericht (Entwurf) frei (Flussdiagramm). Das Berichtsdatum
  liegt frühestens bei der Unterzeichnung oder Genehmigung der JR durch den VR und soll dem tatsächlichen Prüfungsende entsprechen; liegt die Abgabe später, trägt der Bericht das Abgabedatum
  (keine Rückdatierung). Der Bericht muss vor der GV vorliegen und 20 Tage vorher zugänglich sein. Nach der Abgabe nur noch bei neuen Tatsachen tätig werden. Hinweise auf Kapitalverlust
  oder Überschuldung warten nicht auf den Bericht: sofort an den WP melden.'
gesetz:
- thema: Zusammenfassender Bericht an die GV, schriftlich (OR 729b Abs. 1)
  quelle: or__art-729b
  zitat: Die Revisionsstelle erstattet der Generalversammlung schriftlich einen zusammenfassenden Bericht über das Ergebnis der Revision.
- thema: 'Pflichtinhalt Ziff. 1: Hinweis auf die eingeschränkte Natur der Revision (OR 729b Abs. 1 Ziff. 1)'
  quelle: or__art-729b
  zitat: einen Hinweis auf die eingeschränkte Natur der Revision
- thema: 'Pflichtinhalt Ziff. 2: Stellungnahme zum Ergebnis der Prüfung (OR 729b Abs. 1 Ziff. 2)'
  quelle: or__art-729b
  zitat: eine Stellungnahme zum Ergebnis der Prüfung
- thema: 'Pflichtinhalt Ziff. 3: Unabhängigkeit, Mitwirkung bei der Buchführung, andere Dienstleistungen (OR 729b Abs. 1 Ziff. 3)'
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung und zu anderen Dienstleistungen, die für die zu prüfende Gesellschaft erbracht wurden
- thema: 'Pflichtinhalt Ziff. 4: leitende Person und deren fachliche Befähigung (OR 729b Abs. 1 Ziff. 4)'
  quelle: or__art-729b
  zitat: Angaben zur Person, welche die Revision geleitet hat, und zu deren fachlicher Befähigung
- thema: Unterzeichnung durch die leitende Person (OR 729b Abs. 2), nie durch den Agenten
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- thema: Prüfungsgegenstand Jahresrechnung (OR 729a Abs. 1 Ziff. 1)
  quelle: or__art-729a
  zitat: die Jahresrechnung nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: Prüfungsgegenstand Antrag über die Verwendung des Bilanzgewinns (OR 729a Abs. 1 Ziff. 2)
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: Geschäftsführung des VR ist kein Prüfungsgegenstand (OR 729a Abs. 3)
  quelle: or__art-729a
  zitat: Die Geschäftsführung des Verwaltungsrats ist nicht Gegenstand der Prüfung durch die Revisionsstelle.
- thema: Bericht muss vor dem GV-Beschluss vorliegen (OR 731 Abs. 1)
  quelle: or__art-731
  zitat: muss der Revisionsbericht vorliegen, bevor die Generalversammlung die Jahresrechnung und die Konzernrechnung genehmigt und über die Verwendung des Bilanzgewinns beschliesst
- thema: Ohne Bericht sind die Beschlüsse nichtig (OR 731 Abs. 3)
  quelle: or__art-731
  zitat: Liegt der erforderliche Revisionsbericht nicht vor, so sind die Beschlüsse zur Genehmigung der Jahresrechnung und der Konzernrechnung sowie zur Verwendung des Bilanzgewinnes
    nichtig.
- thema: Anwesenheitspflicht an der GV nur bei ordentlicher Revision (OR 731 Abs. 2)
  quelle: or__art-731
  zitat: Wird eine ordentliche Revision durchgeführt, so muss die Revisionsstelle an der Generalversammlung anwesend sein.
- thema: Zugänglichmachen 20 Tage vor der GV (OR 699a)
  quelle: or__art-699a
  zitat: Mindestens 20 Tage vor der Generalversammlung sind den Aktionären der Geschäftsbericht und die Revisionsberichte zugänglich zu machen.
- thema: Unterzeichnung der Jahresrechnung durch VR-Präsident und Rechnungslegungsverantwortliche (OR 958 Abs. 3)
  quelle: or__art-958
  zitat: Er ist vom Vorsitzenden des obersten Leitungs- oder Verwaltungsorgans und der innerhalb des Unternehmens für die Rechnungslegung zuständigen Person zu unterzeichnen.
- thema: 'Covid-19-Kredit: Ausschüttungs- und Darlehensverbot während der Solidarbürgschaft (Covid-19-SBüG Art. 2 Abs. 2)'
  quelle: covid-sbueg__art-2-t1
  zitat: Dividenden und Tantiemen sowie die Rückerstattung von Kapitaleinlagen
- thema: 'Pflicht der Revisionsstelle bei Verstoss: Frist, GV, Bürgschaftsorganisation (Covid-19-SBüG Art. 23 Abs. 1)'
  quelle: covid-sbueg__art-23
  zitat: Wird dieser nicht innerhalb der gesetzten Frist hergestellt, so muss die Revisionsstelle die Generalversammlung informieren.
- thema: 'Kapitalverlust: Massnahmenpflicht des VR (OR 725a Abs. 1)'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Kapitalverlust: VR und Revisionsstelle handeln mit der gebotenen Eile (OR 725a Abs. 4)'
  quelle: or__art-725a
  zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
- thema: 'Überschuldung: Prüfung der Zwischenabschlüsse durch die Revisionsstelle (OR 725b Abs. 2)'
  quelle: or__art-725b-t1
  zitat: Der Verwaltungsrat lässt die Zwischenabschlüsse durch die Revisionsstelle oder, wenn eine solche fehlt, durch einen zugelassenen Revisor prüfen
- thema: Rangrücktritt als Ausnahme von der Benachrichtigung des Gerichts (OR 725b Abs. 4 Ziff. 1)
  quelle: or__art-725b-t1
  zitat: sofern der Rangrücktritt den geschuldeten Betrag und die Zinsforderungen während der Dauer der Überschuldung umfasst
- thema: Sanierungsaussicht als Ausnahme von der Benachrichtigung des Gerichts, längstens 90 Tage (OR 725b Abs. 4 Ziff. 2)
  quelle: or__art-725b-t1
  zitat: spätestens aber 90 Tage nach Vorliegen der geprüften Zwischenabschlüsse
- thema: 'Überschuldung: VR und Revisionsstelle handeln mit der gebotenen Eile (OR 725b Abs. 6)'
  quelle: or__art-725b-t2
  zitat: Der Verwaltungsrat und die Revisionsstelle oder der zugelassene Revisor handeln mit der gebotenen Eile.
- thema: Anzeigepflicht der eingeschränkt prüfenden Revisionsstelle (OR 729c)
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: 'Liquidation: Überschuldungsanzeige durch die Liquidatoren (OR 743 Abs. 2)'
  quelle: or__art-743
  zitat: sobald sie eine Überschuldung feststellen, das Gericht zu benachrichtigen
- thema: Geheimhaltung der Feststellungen (OR 730b Abs. 2)
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen
- thema: Aufbewahrung der Berichte 10 Jahre (OR 730c)
  quelle: or__art-730c
  zitat: Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- thema: 'SER 5.3: Korrekturvorschlag; bei Verweigerung Wesentlichkeit beurteilen, ggf. Modifizierung'
  quelle: ser-2022__5-3
  zitat: Wird diese Korrektur verweigert, so muss der Abschlussprüfer beurteilen, ob die Jahresrechnung dadurch eine wesentliche Fehlaussage vermittelt.
- thema: 'SER 8.1: Pflichtelemente des Revisionsberichts – u.a. Offenlegung von Mitwirkung bei der Buchführung und anderen Dienstleistungen mit Selbstprüfungsrisiko'
  quelle: ser-2022__8-1
  zitat: hat das Revisionsunternehmen beim Prüfungskunden bei der Buchführung mitgewirkt oder andere Dienstleistungen, bei denen das Risiko der Selbstprüfung besteht, erbracht, so ist
    dies im Revisionsbericht offenzulegen
- thema: 'SER 8.3.1: Prüfungsaussage als negative Zusicherung'
  quelle: ser-2022__8-3-1-t1
  zitat: Bei der eingeschränkten Revision macht der Abschlussprüfer diese Prüfungsaussage in Form einer negativen Zusicherung.
- thema: 'SER 8.3.2.1: Hinweis bei Untätigkeit des VR (OR 725a/725b) zwingend'
  quelle: ser-2022__8-3-2-t1
  zitat: sind in jedem Fall im Revisionsbericht anzubringen
- thema: 'SER 8.3.2.1 Fn. 3: Hinweis bei unterlassener Überschuldungsanzeige der Liquidatoren (OR 743 Abs. 2)'
  quelle: ser-2022__8-3-2-t1
  zitat: Bei Unterlassung der Überschuldungsanzeige durch die Liquidatoren erfolgt ein Hinweis auf Art. 743 Abs. 2 OR.
- thema: 'HWP ER Rz 424: Hinweis zu OR 725a Abs. 1 nur kumulativ bei unzureichenden Massnahmen und fehlender Information der Aktionäre'
  quelle: hwp-er-2026__rz-0424-s280
  zitat: die Aktionäre nicht informiert sind und davon ausgegangen werden muss
- thema: 'SER 8.5: Unterschrift der leitenden Person'
  quelle: ser-2022__8-5
  zitat: Zudem muss der Revisionsbericht die Unterschrift derjenigen Person tragen, welche die eingeschränkte Revision geleitet hat
- thema: 'SER 8.6: Berichtsdatum frühestens bei Unterzeichnung oder Genehmigung der JR'
  quelle: ser-2022__8-6
  zitat: darf der Abschlussprüfer den Revisionsbericht frühestens auf den Zeitpunkt datieren, an dem die Unternehmensleitung den Abschluss unterzeichnet oder formell gutgeheissen hat
- thema: 'HWP ER Rz 450: Berichtsdatum = tatsächliches Prüfungsende, keine Rückdatierung'
  quelle: hwp-er-2026__rz-0450-s288
  zitat: Die Datierung des Berichts der Revisionsstelle sollte mit dem tatsächlichen Prüfungsende übereinstimmen.
schritte:
- was: Ausgangslage für den Bericht zusammentragen (nur lesen). Dazu gehören die Ergebnisse und Notizen aller Prüffelder (Wesentliche Feststellungen, Pendenzen, Schlussbesprechung),
    die nicht nachgebuchten Fehler (6.1), Ereignisse nach dem Stichtag und Going concern (6.3, 3.4), die Wesentlichkeit (3.3), die Berichtsstrategie (7.1) und die Berichtskritik (7.5).
    Ist ein Prüffeld oder eine Pendenz noch offen, im Entwurf markieren und im Rapport melden.
