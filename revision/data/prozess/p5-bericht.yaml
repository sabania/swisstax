- was: 'Weitere Hinweise auf Gesetzesverstösse nur vorschlagen, wenn der Verstoss wesentlich ist, einen direkten Bezug zur JR hat und aus den Prüfungshandlungen festgestellt wurde. Beispiele:
    Aktionärsdarlehen oder Kapitalrückzahlung ohne freie Reserven (OR 680), eigene Aktien (OR 659), Ungleichbehandlung (OR 660), Leistungen an Nahestehende (OR 678), Einberufungsfrist
    (OR 699), Dividende mit nicht vertretbarem Liquiditätsentzug (OR 717), Vorlagepflicht (OR 958 Abs. 3), Untätigkeit des VR bei drohender Zahlungsunfähigkeit (OR 725 Abs. 2), Ausschüttung
    oder Gesellschafterdarlehen trotz offenem Covid-19-Kredit (Covid-19-SBüG Art. 2 Abs. 2, Pflichten Art. 23). Statutenverstösse nur mit Bezug zum Prüfungsgegenstand, das Organisationsreglement
    nie.'
  wer: Agent bereitet vor, WP entscheidet
