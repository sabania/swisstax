- was: 'Antrag des VR zur Gewinnverwendung prüfen und die passende Formulierung wählen. Bilanzgewinn: «… sowie der Antrag über die Verwendung des Bilanzgewinns …». Kein Bilanzgewinn
    und kein Antrag: gekürzte Aussage nur zur JR. Verlustverrechnung oder -vortrag (HWP Abb. 56), Rückzahlung aus der gesetzlichen Kapitalreserve oder mehrere Anträge (HWP Abb. 57–59,
    einzeln oder summarisch): Textbausteine EXPERTsuisse 2022. Zuweisung an die gesetzliche Gewinnreserve und Liquidität nach der Ausschüttung prüfen. Covid-19-Kredit mit Solidarbürgschaft
    noch offen? Dann sind Dividenden, Tantiemen, Rückerstattung von Kapitaleinlagen sowie die Gewährung von Darlehen an bzw. die Rückzahlung von Darlehen von Gesellschaftern/Nahestehenden
    ausgeschlossen (Covid-19-SBüG Art. 2 Abs. 2; Ausnahmen für vorbestehende Verpflichtungen gegenüber Gruppengesellschaften mit Sitz in der Schweiz beurteilt der WP). Verstoss →
    Notiz «Wesentliche Feststellungen» an den WP. Fristansetzung, Information der GV und der Bürgschaftsorganisation (Art. 23 Abs. 1) entscheidet und erledigt nur der WP. OR 717:
    Beeinflusst die Dividende die Liquidität erheblich, ist sie aber vertretbar, weil die betriebsnotwendige Liquidität sichergestellt ist → Zusatz (SER Bsp. 12, Muster c048). Wird
    die Vertretbarkeit verneint → Gesetzesverstoss, Hinweis (HWP Abb. 55, Muster c053). Verstösst der Antrag sonst gegen Gesetz oder Statuten → verneinende Aussage zum Antrag (Bsp.
    8) vorschlagen. Sanierungsleistungen der Anteilsinhaber im Geschäftsjahr: beantragt der VR die Verrechnung mit den Verlusten? Sonst Hinweis an den WP (Emissionsabgabe, KS 32a
    Ziff. 3.3.2; ESTV-Praxis, keine handelsrechtliche Regel).'
