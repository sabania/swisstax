entscheidungen_wp:
- text: Art der Prüfungsaussage (nicht modifiziert, eingeschränkt, verneinend, Unmöglichkeit) und ob das Gesamtbild grundlegend verändert wird.
  quelle: hwp-er-2026__rz-0412-s277
  zitat: Es liegt im Ermessen des Abschlussprüfers, zu entscheiden, ob das Gesamtbild der Jahresrechnung grundlegend verändert wird oder nicht.
- text: Wesentlichkeit der nicht korrigierten Fehler (einzeln und kumuliert) in revio 6.1.
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: die Summe der nicht korrigierten Fehler beurteilt der Mensch in 6.1
- text: Ob bei einem Kapitalverlust die Massnahmen des VR genügen, also nur ein Zusatz oder zusätzlich ein Hinweis auf einen Gesetzesverstoss.
  quelle: qa-kapitalverlust-2023__1-2-t3
  zitat: obliegt der Beurteilung der Revisionsstelle bzw. des zugelassenen Revisors
- text: Ermahnung des VR mit Fristansetzung und Anzeige ans Gericht bei offensichtlicher Überschuldung (OR 729c). Der Agent meldet nur.
  quelle: ser-2022__anh-h-s145-1
  zitat: Revisionsstelle muss VR mit Fristansetzung ermahnen
- text: Anzeigepflicht beschränkt auf die Benachrichtigung des Gerichts bei Untätigkeit des VR. Der Entscheid und die Ausführung liegen allein beim WP.
  quelle: ser-2022__9-t3
  zitat: Die diesbezügliche Anzeigepflicht beschränkt sich auf die Benachrichtigung des Richters, wenn dies der Verwaltungsrat trotz offensichtlicher Überschuldung unterlässt.
- text: Ob weitere Gesetzes- oder Statutenverstösse mit direktem Bezug zur JR einen Hinweis im Bericht erhalten.
  quelle: ser-2022__1-6-t2
  zitat: so ist ein Hinweis im Revisionsbericht in Erwägung zu ziehen
- text: Mitteilung an die Unternehmensleitung vor einer modifizierten Aussage und Durchführung der Schlussbesprechung.
  quelle: hwp-er-2026__rz-0404-s274
  zitat: sollte er die Umstände, welche zur erwarteten Abweichung führen, den für die Erstellung der Jahresrechnung Verantwortlichen mitteilen
- text: Niederlegung des Mandats, wenn eine Aussage wegen einer Beschränkung durch die Unternehmensleitung unmöglich ist.
  quelle: hwp-er-2026__rz-0416-s278
  zitat: erwägt er, das Mandat als Revisionsstelle niederzulegen
- text: Offenlegung von Mitwirkung bei der Buchführung bzw. Selbstprüfungsrisiken im Bericht.
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung
- text: Berichtsdatum, Unterzeichnung durch den leitenden Revisor mit Zulassungsart, Freigabe und Versand. Der Agent unterzeichnet und datiert nie.
  quelle: ser-2022__8-5
  zitat: Art der Zulassung des leitenden Revisors
- text: Ob der Agent über den Normalwortlaut hinaus Modifizierungen, Zusätze oder Hinweise entwirft (offener Entscheid consis). Bis dahin nur auf Anweisung.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Nur Normalwortlaut gemäss 7.1? Vorgehen bei Einschränkung, Zusatz (z. B. Überschuldung, Rangrücktritt) oder Hinweis.
- text: Teilnahme an der GV (bei eingeschränkter Revision freiwillig) und Auskünfte an der GV.
  quelle: hwp-er-2026__rz-0464-s290
  zitat: Falls die Revisionsstelle an eine solche Versammlung eingeladen ist, wird sie in aller Regel die Einladung annehmen und daran teilnehmen.
- text: Vorgehen bei Tatsachen, die nach der Herausgabe bekannt werden (neuer Bericht, Information der Organe).
  quelle: hwp-er-2026__rz-0328-s257-t1
  zitat: Stösst der Abschlussprüfer nach Herausgabe des Abschlusses auf Tatsachen, die – wären sie ihm vor dem Berichtsdatum bekannt gewesen – zu einer Modifizierung der Prüfungsaussage
    geführt hätten
unterlagen:
- dokument: Rechtsgültig unterzeichnete Jahresrechnung (Bilanz, Erfolgsrechnung, Anhang)
  zweck: Frühestes Berichtsdatum, Beilage zum Bericht, Bestandteil der Jahresakten
  quelle: ser-2022__7-2
  zitat: Zudem sind je eine unterzeichnete Jahresrechnung und Vollständigkeitserklärung Bestandteil der Jahresakten.
- dokument: Vollständigkeitserklärung (an die Revisionsstelle adressiert, datiert, unterzeichnet)
  zweck: Liegt vor Abgabe vor, Datum wie Revisionsbericht
  quelle: ser-2022__anh-e-s102-1
  zitat: Die rechtsgültig unterzeichnete Vollständigkeitserklärung sollte sich zudem in der Regel vor Abgabe des Revisionsberichtes in den Händen der Revisionsstelle befinden.
- dokument: Antrag des VR über die Verwendung des Bilanzgewinns (bzw. Verlustverrechnung, Rückzahlung Kapitalreserve)
  zweck: Prüfungsgegenstand und Beilage, Wahl der Formulierung
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- dokument: GVB-Deckblatt und Berichtstext des Vorjahres (M-Files-Vorlagen)
  zweck: Ausgangspunkt für den GVB-Entwurf (Prozess 5)
  quelle: konzept-ki-revisionsagent-2026__c019-1
  zitat: 'GVB-Deckblatt und Berichtstext: Vorlagen vorhanden, werden für den produktiven Agenten bereitgestellt'
- dokument: Revisionsbericht des Vorjahres bzw. der Vorgänger-Revisionsstelle
  zweck: Prüfungsaussage des Vorgängers wiedergeben; eine Modifizierung im Vorjahr auf Relevanz prüfen
  quelle: hwp-er-2026__rz-0367-s267
  zitat: Ferner wird die Art der abgegebenen Prüfungaussage des Vorgängers wiedergegeben
- dokument: Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten (OR 725b)
  zweck: Überschuldung beurteilen, Zusatz/Hinweis ableiten
  quelle: ser-2022__anh-h-s142-2
  zitat: je einen Zwischenabschluss nach Art. 960f OR zu Fortführungswerten und zu Veräusserungswerten zu erstellen
- dokument: Rangrücktrittsvereinbarungen (inkl. Angaben zur Bonität des Gläubigers)
  zweck: Gültigkeit und Umfang für den Zusatz bei Überschuldung
  quelle: ser-2022__anh-h-s143-1
  zitat: Wenn der Darlehensgeber nicht in der Lage ist, einen allfälligen Ausfall finanziell zu verkraften, können an der Gültigkeit des Rangrücktritts Zweifel bestehen.
- dokument: VR- und GV-Protokolle (Sanierungsmassnahmen, Genehmigung JR, Einladung GV)
  zweck: Massnahmen bei Kapitalverlust, GV-Termin, mögliche Gesetzesverstösse
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- dokument: Liquiditätsplanung/Budget
  zweck: Vertretbarkeit der Dividende (OR 717) und Fortführungsfähigkeit
  quelle: hwp-er-2026__rz-0441-s285
  zitat: Ist die Ausschüttung von Dividenden und Tantiemen mit der Vermögens- und Liquiditätslage der Gesellschaft nicht zu vereinbaren
- dokument: revio 6.1 Nicht nachgebuchte Fehler, 6.3 Ereignisse nach dem Bilanzstichtag und Going concern
  zweck: Grundlage für den Vorschlag zur Prüfungsaussage (nur lesen)
  quelle: katalog-revio4__c002-3
  zitat: 6.1 Nicht nachgebuchte Fehler, 6.2 Abschliessende analytische Prüfungen, 6.3 Ereignisse nach dem Bilanzstichtag und Going concern
- dokument: revio 7.1 Berichtsstrategie und 7.5 Berichtskritik
  zweck: Vorgabe und Kontrolle für den GVB-Entwurf (nur lesen)
  quelle: konzept-ki-revisionsagent-2026__c006-2
  zitat: 7.1 Berichtsstrategie, 7.4 Versandfiche, 7.5 Berichtskritik
- dokument: Mustervorlagensammlung HWP ER 2026, SER Anhang F, Textbausteine Gewinnverwendung EXPERTsuisse 2022
  zweck: Verbindlicher Normalwortlaut und Formulierungen für Modifizierungen, Zusätze und Hinweise
  quelle: hwp-er-2026__rz-0361-s263
  zitat: Für die Berichterstattung an das oberste Organ sind die Normalwortlaute gemäss der Mustervorlagensammlung von EXPERTsuisse verbindlich.
- dokument: Handelsregisterauszug und Statuten
  zweck: Firma, Sitz, Rechtsform, damit Adressat und verantwortliches Organ
  quelle: hwp-er-2026__rz-0364-s266
  zitat: Bei den unterschiedlichen Rechtsformen sind die Revisionsberichte an folgende Organe zu richten
- dokument: Angaben zum leitenden Revisor und seiner Zulassung (intern)
  zweck: Platzhalter für Name, Zulassungsart und «Leitender Revisor»; Eintrag durch den WP
  quelle: hwp-er-2026__rz-0452-s288
  zitat: ist die Bezeichnung «Leitender Revisor» im Bericht der Revisionsstelle anzugeben
dokumentation:
- text: 'Wichtige Sachverhalte so dokumentieren, dass die Prüfungsaussage nachvollziehbar gestützt ist: Herleitung des Vorschlags (Feststellung, Betrag, Fundstelle, Einordnung als Modifizierung,
    Zusatz oder Hinweis).'
  quelle: ser-2022__7-1
  zitat: Der Abschlussprüfer muss wichtige Sachverhalte dokumentieren als Nachweis dafür
- text: 'Fehlaussagen (festgestellt/angenommen) und ihre Behandlung festhalten: korrigiert, nicht korrigiert, Auswirkung auf den Bericht.'
  quelle: ser-2022__7-2
  zitat: Fehlaussagen infolge festgestellter und/oder angenommener Sachverhalte und ihre Behandlung
- text: Ergebnis des Agenten einheitlich dokumentieren, für den GVB-Entwurf mit M-Files-ID und Version der Vorjahresvorlage und der Kopie.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status.
- text: Eigene Arbeitspapiere mit Bearbeitungsdatum und Autorvermerk «Entwurf KI-Agent» versehen. Das ist nie das Berichtsdatum und keine Unterschrift.
  quelle: ser-2022__7-1
  zitat: Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors oder derjenigen Person zu versehen, die das Revisionsmandat leitet.
- text: Ein Memorandum zur abschliessenden Durchsicht durch den leitenden Prüfer wird empfohlen. Der Agent liefert die Grundlage (Rapport), das Memorandum erstellt der WP.
  quelle: ser-2022__7-2
  zitat: Ein Memorandum, das die abschliessende Durchsicht der Prüfungsdokumentation durch den leitenden Abschlussprüfer und die Prüfungsergebnisse
- text: Über die Schlussbesprechung ein Kurzprotokoll erstellen. Der Agent bereitet die Punkte in der Notiz «Schlussbesprechung» vor.
  quelle: hwp-er-2026__rz-0459-s289
  zitat: Es empfiehlt sich, über die Schlussbesprechung ein (Kurz-)Protokoll zu erstellen.
- text: Liegen Prüfungsende und Berichtsabgabe zeitlich auseinander, das Datum der Beendigung im Bericht gesondert nennen. Im Entwurf als Hinweis an den WP vermerken.
  quelle: ser-2022__anh-f-s136-2
  zitat: soll das Datum der Beendigung der eingeschränkten Revision im Revisionsbericht gesondert bezeichnet werden
- text: Notizen (Pendenz, Wesentliche Feststellungen, Schlussbesprechung) nie löschen oder erledigen. Rückmeldungen erfasst der WP unter «Review».
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Notizen löscht oder erledigt er nie.
- text: Bericht und alle wesentlichen Unterlagen mindestens zehn Jahre aufbewahren (Ablage 10.5 bzw. M-Files nur auf Anweisung).
  quelle: or__art-730c
  zitat: Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- text: 'Geheimhaltung: Entwürfe, Feststellungen und Rapport nur intern und an die WP-Adresse, keine Mandantendaten ins Wiki.'
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen
fallstricke:
- text: Ein Zusatz wegen wesentlicher Unsicherheit ersetzt nie eine Einschränkung. Fehlt die Anhangsangabe oder ist sie ungenügend, braucht es eine Modifizierung.
  quelle: hwp-er-2026__rz-0433-s283
  zitat: In keinem Fall kann ein Zusatz infolge einer wesentlichen Unsicherheit eine Einschränkung ersetzen.
- text: Ein Kapitalverlust allein führt zu einem Zusatz, nicht zu einem Hinweis. SER Bsp. 11 setzt voraus, dass der VR noch keine Gelegenheit zum Handeln hatte. Hatte er Zeit und blieb
    untätig, kommt der Hinweis dazu (Muster c050).
  quelle: ser-2022__anh-f-s129-2
  zitat: Annahme ist, dass der Verwaltungsrat vom Zeitablauf her noch keine Gelegenheit hatte, seinen Pflichten nach Art. 725a OR nachzukommen
- text: 'Fachliteratur (Camponovo) bestätigt: Der Zustand Kapitalverlust ist kein Gesetzesverstoss, seine Erwähnung ist ein Zusatz.'
  quelle: camponovo-2026-hinweispflichten__s117-1
  zitat: Will die Revisionsstelle 725a erwähnen, ist das ein Zusatz, kein Hinweis
- text: Ein Rangrücktritt beseitigt weder den Kapitalverlust, noch ist er eine Sanierungsmassnahme. Er befreit nur von der Benachrichtigung des Gerichts.
  quelle: qa-kapitalverlust-2023__1-2-t3
  zitat: Ein Rangrücktritt an sich beseitigt den Kapitalverlust nicht und stellt auch keine Sanierungsmassnahme nach Art. 725a OR dar.
- text: Bei Überschuldung entspricht die JR dem Zwischenabschluss zu Fortführungswerten. Die Fachliteratur hält einen Bericht zu Fortführungswerten bei Überschuldung und untätigem VR
    für problematisch (abweichend vom SER). Das ist immer ein WP-Entscheid.
  quelle: camponovo-2026-hinweispflichten__s120-1
  zitat: Welche Revisionsstelle würde im worst case (Überschuldung und Untätigkeit VR) einen Revisionsbericht zu einer Jahresrechnung zu Fortführungswerten abgeben?
- text: Keine Rückdatierung. Wird die JR nach dem Bericht geändert, braucht es einen neuen Bericht, frühestens auf das Datum der geänderten Fassung.
  quelle: hwp-er-2026__rz-0325-s256
  zitat: es darf keine Rückdatierung auf das Datum der ersten Berichtsversion (vor Korrektur) erfolgen
- text: 'Vorjahrestext nicht ungeprüft übernehmen: Ohne Bilanzgewinn und ohne Antrag entfällt die Bestätigung zum Antrag. Bei einer Rückzahlung aus der Kapitalreserve den Wortlaut anpassen.'
  quelle: muster-hwp-er-2026__c017-2
  zitat: Die Bestätigung zum Antrag über die Verwendung des Bilanzgewinns entfällt, wenn kein Bilanzgewinn vorliegt
- text: Ein Sachverhalt, der eine Modifizierung erfordert, darf nicht nur in einem Management Letter oder einer Aktennotiz stehen.
  quelle: hwp-er-2026__rz-0461-s289
  zitat: Insbesondere muss unbedingt vermieden werden, dass Sachverhalte, die eine Modifizierung der Prüfungsaussage erfordern, nur in der ergänzenden schriftlichen Berichterstattung
    dargestellt werden
- text: Statutenverstösse nur mit Bezug zum Prüfungsgegenstand, Organisationsreglement nie. Die Prüfung ist keine allgemeine Gesetzmässigkeitsprüfung.
  quelle: ser-2022__8-3-2-t2
  zitat: Für Verstösse gegen die Statuten besteht eine Hinweispflicht nur dann, wenn diese im Zusammenhang mit dem Prüfungsgegenstand stehen.
- text: Zusätze müssen wesentlich sein und dürfen keine Geheimhaltungspflichten verletzen. Kein «Sicherheitszusatz» ohne Grund.
  quelle: ser-2022__8-3-2-t3
  zitat: Sie müssen wesentlich sein und dürfen keine Geheimhaltungspflichten verletzen.
- text: Ein bedeutender Hinweis (z.B. Überschuldung) kann nicht bis zum Bericht warten. Sofort Pendenz und Meldung an den WP (Fachliteratur).
  quelle: camponovo-2026-hinweispflichten__s040-1
  zitat: Die Hinweispflicht und die Erstattung des Revisionsberichtes hängen nicht zwingend zusammen
- text: 'Bericht nach OR 725a Abs. 2 (Opting-out): Prüfer handelt als zugelassener Revisor, nicht als Revisionsstelle, Adressat ist der VR. Die Aussage zum Gewinnverwendungsantrag entfällt.'
  quelle: hwp-er-2026__rz-0474-s291
  zitat: Der zugelassene Revisor führt diese Prüfung im Rahmen eines spezifischen Auftrags durch, nicht in seiner Funktion als Revisionsstelle.
- text: Überschrift mit «Revisionsstelle», auch wenn die Statuten «Kontrollstelle» nennen.
  quelle: hwp-er-2026__rz-0363-s266
  zitat: Andere Bezeichnungen wie «Kontrollstelle» sind nach Möglichkeit nicht zu verwenden
- text: Der Abschlussprüfer korrigiert die JR nicht selbst. Der Agent bucht nicht und ändert keine Jahresrechnung, er schlägt nur vor (Notiz).
  quelle: hwp-er-2026__rz-0411-s277
  zitat: Der Abschlussprüfer ist nicht zur Korrektur des Abschlusses berechtigt; ihm stehen weder Weisungsbefugnisse noch Vetorechte zu.
- text: 'revio-Zuordnung: Die Schlussarbeiten zur Jahresrechnung als Ganzes liegen in A1. SCH1–SCH5 sind Erfolgsrechnungs-Prüffelder (z.B. SCH1 Betrieblicher Ertrag), nicht Schlussarbeiten.'
  quelle: katalog-revio4__c003-58
  zitat: Betrieblicher Ertrag | 101 | SCH1-101
fragen_kunde:
- frage: An welchem Datum genehmigt oder unterzeichnet der Verwaltungsrat die Jahresrechnung, und wer unterzeichnet (Präsident VR, für die Rechnungslegung zuständige Person)?
  zweck: Frühestes Berichtsdatum und Datum der VE bestimmen (SER 8.6, Anhang E). Frage als Pendenz bzw. über 10.11, der Agent fragt nie selbst.
- frage: Wann findet die Generalversammlung statt, und wird die Revisionsstelle eingeladen?
  zweck: Bericht muss vor der GV vorliegen und 20 Tage vorher zugänglich sein (OR 731, 699a). Über die Teilnahme entscheidet der WP.
- frage: Wie lautet der definitive Antrag des Verwaltungsrats (Dividende, Zuweisung an Reserven, Verlustverrechnung oder -vortrag, Rückzahlung aus der gesetzlichen Kapitalreserve)?
  zweck: Prüfung des Antrags und Wahl des passenden Textbausteins bzw. der Kurzform ohne Antrag.
- frage: Ist die für den Betrieb nötige Liquidität auch nach der beantragten Ausschüttung gesichert (Liquiditätsplanung)?
  zweck: Beurteilung, ob ein Zusatz oder Hinweis wegen der Sorgfaltspflicht nötig ist (OR 717, SER Bsp. 12).
- frage: Welche Massnahmen hat der Verwaltungsrat beim Kapitalverlust ergriffen oder der GV beantragt, und sind die Aktionäre informiert?
  zweck: Abgrenzung Zusatz (Kapitalverlust) gegenüber Hinweis (Untätigkeit VR, OR 725a).
- frage: Wurden bei Besorgnis einer Überschuldung Zwischenabschlüsse zu Fortführungs- und Veräusserungswerten erstellt? Bestehen Rangrücktritte (Betrag inkl. Zinsen, Stundung, Unterzeichnung,
    Bonität des Gläubigers)?
  zweck: Zusatz Überschuldung/Rangrücktritt oder Hinweis auf Untätigkeit. Allfällige Anzeigepflicht klärt der WP.
- frage: Ist die Unternehmensleitung bereit, die mitgeteilten Fehlaussagen zu korrigieren bzw. fehlende Anhangsangaben (z.B. wesentliche Unsicherheit) zu ergänzen?
  zweck: Eine Modifizierung entfällt, wenn korrigiert wird. Bei Unsicherheiten ist die Offenlegung Voraussetzung für einen blossen Zusatz.
- frage: Können für Positionen, die sich nicht beurteilen lassen (z.B. Bewertung von Darlehen, Vorräten oder Rechtsfällen), geeignete Unterlagen wie Gutachten beigebracht werden?
  zweck: Einen angenommenen Sachverhalt oder eine Beschränkung des Prüfungsumfangs vermeiden (HWP ER Rz 390).
- frage: Welche wesentlichen Ereignisse sind seit dem Bilanzstichtag bis heute eingetreten?
  zweck: Ereignisse bis zum Berichtsdatum berücksichtigen (SER 8.6).
- frage: Bestehen Darlehen oder sonstige Leistungen an Aktionäre, VR oder Nahestehende, Erwerb eigener Aktien oder Abweichungen bei der Einberufung der GV?
  zweck: Mögliche Hinweise auf Gesetzesverstösse prüfen (OR 659, 660, 678, 680, 699).
- frage: Wurde die Vorjahresrechnung von einer anderen Revisionsstelle oder gar nicht geprüft (Opting-out), und mit welcher Prüfungsaussage?
  zweck: Pflichtangabe in der Einleitung des Berichts (SER 6.2.7, Anhang F [9]/[10]).
