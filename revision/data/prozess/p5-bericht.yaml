    und kein Antrag: gekürzte Aussage nur zur JR. Verlustverrechnung oder -vortrag, Rückzahlung aus der gesetzlichen Kapitalreserve oder mehrere Anträge: Textbausteine EXPERTsuisse 2022
    bzw. HWP Abb. 56–59 (einzeln oder summarisch). Zuweisung an die gesetzliche Gewinnreserve und Liquidität nach der Ausschüttung prüfen. Bei Verstössen eine verneinende Aussage zum
