- was: 'Mandatsspezifische Pflichtangaben bestimmen. Dazu gehören Adressat und verantwortliches Organ nach Rechtsform (AG, GmbH mit Art. 818 OR, Genossenschaft, Verein, Stiftung) und
    ein Geschäftsjahr, das nicht zwölf Monate umfasst. Wurde das Vorjahr von einem anderen Prüfer geprüft, dessen Prüfungsaussage wiedergeben. Wurde es nicht geprüft, folgt der Satz
    «Vergleichszahlen nicht geprüft» (Textbausteine Vorjahresangaben, Muster c073). Weiter: Mitwirkung bei der Buchführung (Einschub Bsp. 15), Kern-FER-Bestätigung, Zweck nach OR 725a
    Abs. 2 (zugelassener Revisor, Adressat VR, VE gegenüber dem zugelassenen Revisor nach Muster c013, Zusatz bei Kapitalverlust, begründeter Besorgnis einer Überschuldung oder Überschuldung
    zwingend, keine Aussage zum Gewinnverwendungsantrag). Ob bei der Buchführung mitgewirkt wurde, bestätigt der WP. Pflichtelemente abhaken (SER 8.1): Hinweis eingeschränkte Revision
    · Stellungnahme · Unabhängigkeit – bei Mitwirkung an der Buchführung ODER anderen Dienstleistungen mit Selbstprüfungsrisiko offenlegen (SER 8.4), sonst nur Hinweis, dass die Anforderungen
    an die Unabhängigkeit erfüllt sind · Zulassungsbestätigung «Wir bestätigen, dass wir die gesetzlichen Anforderungen hinsichtlich Zulassung (und Unabhängigkeit) erfüllen.» · Name
    und Zulassungsart des leitenden Revisors, Unterschrift, Berichtsdatum = leere Platzhalter (WP).'
