entscheidungen_wp:
- text: Annahme, Ablehnung oder Fortführung des Mandats und Annahme der (Wieder-)Wahl – nur durch zugelassene Personen, nie durch den Agenten.
  quelle: ser-2022__anh-b-s054-1
  zitat: Entscheide über die Annahme bzw. Niederlegung eines Prüfungsauftrags
- text: Revisionsart festlegen; bei Pflicht zur ordentlichen Revision die eingeschränkte Revision ablehnen. Eine ordentliche Revision nur, wenn das Revisionsunternehmen dazu befähigt
    ist (zugelassener Revisionsexperte; bei Publikumsgesellschaften staatlich beaufsichtigt) und sich mit dem VR geeinigt hat – sonst GV schriftlich informieren und zurücktreten.
  quelle: ser-2022__1-4-1
  zitat: sofern er dazu befähigt ist und sich mit der Unternehmensleitung (bei einer AG dem Verwaltungsrat) geeinigt hat
- text: 'Werden die Kriterien nach Art. 727 OR während des Mandats erreicht: Auftrag neu definieren.'
  quelle: ser-2022__anh-c-s057-1
  zitat: Sollten die Kriterien gemäss Art. 727 OR für eine ordentliche Revision erreicht werden,
- text: 'Neugründung mit absehbarem Überschreiten der Schwellenwerte: Nach SER 1.1 ist von Beginn weg ordentlich zu revidieren → eingeschränkte Revision ablehnen; eine ordentliche Revision
    nur, wenn das Revisionsunternehmen zugelassener Revisionsexperte ist. Sieht der VR trotzdem davon ab: Mandatsannahme sorgfältig abwägen (HWP ER Rz 342, zweite Fundstelle).'
  quelle: ser-2022__1-1-t2
  zitat: so ist von Beginn weg eine ordentliche Revision durchzuführen
- text: Leitenden Revisor bestimmen (eine Person mit Zulassung).
