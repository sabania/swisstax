- was: 'Revisionsart (3/3) – Opting-out/-in und Spezialfälle: (a) besondere Prüfungen (Kapitalerhöhung/-herabsetzung, Fusion, Zwischenabschluss nach Art. 725b OR) weder als eingeschränkte
    Revision noch über Opting-out; (b) Opting-out – nur AG, GmbH, Genossenschaft, nicht Verein oder Stiftung: max. 10 Vollzeitstellen im betreffenden Jahr, Zustimmung sämtlicher Aktionäre
    bzw. Gesellschafter (ggf. schriftliches Verfahren mit Frist von mindestens 20 Tagen), HR-Anmeldung vor GJ-Beginn (Erklärung und Beilagen nach Art. 62 HRegV prüfen); (c) Opting-in-Begehren
    (jeder Aktionär spätestens zehn Tage vor der GV); (d) Spezialfall Art. 725a Abs. 2 OR (Opting-out-Gesellschaft mit Kapitalverlust: eingeschränkte Revision der letzten Jahresrechnung
