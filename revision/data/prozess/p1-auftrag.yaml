- was: 'Doppelmandat – Leistungen klassieren: alle Leistungen des Revisionsunternehmens (inkl. Konzern- und Schwestergesellschaften) für den Kunden klassieren. (i) Unterstützung im Prüfungsprozess
    und (ii) Nicht-Prüfungsdienstleistungen ohne Selbstprüfung (Steuern, Abgaben, Sozialversicherungen – nur solange keine Selbstprüfungsgefahr besteht): zulässig, solange die Entscheidung
    über die Handlungsalternativen beim Kunden bleibt und er die Argumente mindestens in den Grundzügen nachvollziehen kann; keine Trennung und keine Offenlegung nötig. Nach RAB besteht
    bei Steuer-, Abgabe- und SV-Dienstleistungen Selbstprüfungsgefahr, sobald sie über die reine Deklaration ohne Ermessensausübung hinausgehen → dann wie (iv): personelle und organisatorische
    Trennung und Offenlegung im Bericht. Abweichung SER ↔ RAB dem WP vorlegen. (iii) Mitwirkung bei der Buchführung und (iv) andere Dienstleistungen mit Selbstprüfung (z. B. Bewertungsgutachten):
    kumulative Bedingungen (a)–(d) nach SER Anhang B, personelle und organisatorische Trennung (nicht dieselbe Person/Personengruppe, keine Weisungsbindung), Risiken dem Kunden kommuniziert,
    Offenlegung im Revisionsbericht (Vorgabe für Prozess 5). Bei (iii) und (iv) separate schriftliche Auftragsbestätigung (SER 1.7: bei Mitwirkung empfohlen; RAB: für Mitwirkung und
    andere relevante Dienstleistungen verlangt). Der Agent entwirft sie als Entwurf (SER Anhang C, Beispiel 2, u. a. mit Feststellung der personellen und organisatorischen Trennung;
    bei (iv) sinngemäss), Entscheid WP. Erstellen Mitarbeitende des Revisionsunternehmens die Jahresrechnung ganz oder in wesentlichen Teilen (auch ausserhalb des Revisionsteams), wird
    es nach RAB faktisch Urheber → sofort Pendenz an den WP.'
