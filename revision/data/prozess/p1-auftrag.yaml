    zitat: Spätestens ab 20% dürfte die wirtschaftliche Unabhängigkeit nicht mehr gegeben sein.
- text: Doppelmandat zulassen oder nicht; Trennung (Personen, Weisungslinien) und Offenlegung im Bericht festlegen.
  quelle: hwp-er-2026__rz-0040-s158
  zitat: in jedem Falle kritisch zu prüfen
- text: 'Abweichungen SER/HWP ↔ RAB-Praxis entscheiden: Steuer-, Abgabe- und SV-Dienstleistungen mit Ermessen, separate Auftragsbestätigung, Urheberschaft der Jahresrechnung.'
  quelle: rab-unabhaengigkeit__c004-5
  zitat: Dienstleistungen im Steuer-, Abgabe- und Sozialversicherungsrecht, zumindest wenn dies über die reine Deklaration ohne Ermessensausübung hinausgeht
  weitere_fundstellen:
  - quelle: rab-unabhaengigkeit__c004-4
    zitat: Die Mitwirkung und andere relevante Dienstleistungen brauchen zudem eine separate Auftragsbestätigung.
  - quelle: ser-2022__1-7
    zitat: empfehlenswert, die Art und den Umfang dieser Unterstützungsleistungen in einer separaten schriftlichen Auftragsbestätigung
  - quelle: rab-unabhaengigkeit__c004-4
    zitat: Wird die Jahresrechnung vollständig oder in wesentlichen Teilen durch Mitarbeitende der Revisionsstelle erstellt (auch wenn diese nicht an der Revision beteiligt sind), wird
      die Revisionsstelle faktisch zum Urheber und übernimmt damit in der Wirkung die Verantwortung.
- text: Risikoklasse des Mandats festlegen und entscheiden, ob eine auftragsbegleitende Qualitätssicherung (EQR) nötig ist.
  quelle: hwp-er-2026__rz-0121-s176-t1
  zitat: Die auftragsbegleitende Qualitätssicherung erfasst jene Mandate, bei denen das Revisionsunternehmen aufgrund der konkreten Risiko- und Mandatssituation dies für sachgerecht
    oder notwendig erachtet.
- text: 'Bei langjährigem Mandat: interne Übergabe der Mandatsleitung trotz fehlender Rotationspflicht.'
  quelle: hwp-er-2026__rz-0167-s069
  zitat: dass ein langjähriger leitender Revisor die Leitung eines Mandats intern an einen anderen Prüfer übergibt
- text: Wiederwahl bei überfälligen Honoraren akzeptieren oder nicht; vor dem Bericht auf Bezahlung hinwirken (Mahnung und Kundenkontakt nur durch den Menschen).
  quelle: ser-2022__anh-b-s053-1
  zitat: ob es aufgrund der Bedeutung der überfälligen Honorare für das Revisionsunternehmen angebracht ist, eine Wiederwahl zu akzeptieren
- text: Honorar/Budget festlegen, Auftragsbestätigung unterzeichnen, versenden und gegengezeichnetes Doppel einfordern sowie entscheiden, ob der KI-Einsatz in den Auftragsbedingungen
    geregelt oder eine Entbindung eingeholt wird.
