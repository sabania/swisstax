    mit Beilagen: genehmigte Jahresrechnung des letzten GJ, Genehmigungsprotokoll bzw. Auszug, ggf. Revisionsbericht, Verzichtserklärungen bzw. GV-Protokoll'
  zweck: Gültigkeit eines Opting-out
  quelle: hregv__art-62-t1
  zitat: Die Erklärung muss das Datum des Beginns des Geschäftsjahres enthalten, ab welchem der Verzicht gilt und von mindestens einem Mitglied des Verwaltungsrats unterzeichnet sein.
  weitere_fundstellen:
  - quelle: hregv__art-62-t1
    zitat: die von der Generalversammlung genehmigte Jahresrechnung des letzten abgelaufenen Geschäftsjahres;
  - quelle: hregv__art-62-t1
    zitat: das Protokoll betreffend die Genehmigung der Jahresrechnung oder ein Auszug davon;
  - quelle: hregv__art-62-t1
    zitat: gegebenenfalls der Revisionsbericht betreffend das letzte abgelaufene Geschäftsjahr; und
  - quelle: hregv__art-62-t1
    zitat: die Verzichtserklärungen der Aktionärinnen und Aktionäre oder das massgebliche Protokoll der Generalversammlung.
  - quelle: or__art-727a
    zitat: Der Anmeldung des Verzichts im Handelsregister muss die Jahresrechnung des zuletzt abgelaufenen Geschäftsjahres beigelegt werden.
- dokument: Aktienbuch bzw. Gesellschafter-/Genossenschafterverzeichnis per Zustimmungsdatum; Zustimmungsschreiben samt Fristansetzung (revio LoadShareRegister nur lesend)
  zweck: Nachweis der Zustimmung sämtlicher Aktionäre bzw. Gesellschafter zum Opting-out; schriftliches Verfahren
  quelle: or__art-727a
  zitat: Der Verwaltungsrat kann die Aktionäre schriftlich um Zustimmung ersuchen.
- dokument: Begehren auf ordentliche Revision, Opting-in oder Abschluss nach anerkanntem Standard; Beschlüsse/Pläne zu Kapitalerhöhung, Kapitalherabsetzung, Fusion, Zwischenabschluss
  zweck: Ordentliche Revision bzw. besondere Prüfungen ausserhalb der eingeschränkten Revision
  quelle: ser-2022__1-1-t2
  zitat: Wo das Gesetz eine andere Prüfung oder eine andere Bestätigung verlangt
- dokument: Revisionsbericht Vorjahr (ggf. anderer Abschlussprüfer)
  zweck: 'Erstprüfung: Einschätzung des früheren Abschlussprüfers'
  quelle: hwp-er-2026__rz-0150-s209
  zitat: versucht der Abschlussprüfer dessen fachliche Kompetenz und Unabhängigkeit einzuschätzen
- dokument: Rücktrittsschreiben der Vorgängerin bzw. Anhang der Jahresrechnung mit den Rücktrittsgründen
  zweck: Grund des Wechsels der Revisionsstelle
  quelle: hwp-er-2026__rz-0149-s066
  zitat: im Fall eines vorzeitigen Rücktritts der bisherigen Revisionsstelle müssen im Anhang
- dokument: Übersicht der Leistungen des Revisionsunternehmens für den Kunden, Auftragsbestätigung Buchführung
  zweck: Doppelmandat; Verantwortung für die Jahresrechnung beim Kunden
  quelle: hwp-er-2026__rz-0043-s159
  zitat: Die Verantwortung für die Jahresrechnung muss in jedem Fall nachweislich beim Kunden verbleiben.
- dokument: Organisationsreglement und HR-Auszug des Revisionsunternehmens (Weisungsunabhängigkeit, Zeichnungsrechte der Abteilungsleitungen)
  zweck: Nachweis der organisatorischen Trennung Treuhand/Revision; Weisungsunabhängigkeit verbindlich festgelegt, Zeichnungsrechte ohne gegenteiligen Anschein
  quelle: rab-unabhaengigkeit__c004-6
  zitat: Diese Weisungsunabhängigkeit muss verbindlich festgelegt und dokumentiert sein (z. B. in einem Reglement).
  weitere_fundstellen:
  - quelle: rab-unabhaengigkeit__c004-6
    zitat: Auch die im Handelsregister eingetragenen Funktionen sowie Einzel- oder Kollektivzeichnungsberechtigungen dürfen nicht den Anschein von Weisungsbefugnissen schaffen, die den
      internen Vorgaben widersprechen.
  - quelle: hwp-er-2026__rz-0045-s159
    zitat: und dies im Organisationsreglement so vorgesehen ist
- dokument: Jährliche Unabhängigkeitsbestätigungen des Fachpersonals
  zweck: Unabhängigkeit Team
  quelle: leitfaden-qm-2025__9-2-2
  zitat: eine dokumentierte Bestätigung der Einhaltung der Unabhängigkeitsanforderungen einholen
- dokument: RAB-Registerauszug (Revisionsunternehmen, leitender Revisor)
  zweck: Zulassungsart und -dauer
  quelle: hwp-er-2026__rz-0159-s068
  zitat: Durch Einsichtnahme in das Register der Eidg. Revisionsaufsichtsbehörde kann aber festgestellt werden, welche Art der Zulassung vorliegt
- dokument: Interne Kriterien zur Risikoklassierung und zur auftragsbegleitenden Qualitätssicherung (QM-Handbuch)
  zweck: Vorschlag Risikoklasse/EQR für den WP
  quelle: leitfaden-qm-2025__6-1-5-t1
  zitat: Für alle sonstigen Prüfungen und Reviews muss die Prüfgesellschaft Kriterien festlegen, bei deren Vorliegen eine auftragsbegleitende Qualitätssicherung durchzuführen ist.
- dokument: Auftragsbestätigung Vorjahr (gegengezeichnet)
  zweck: Weitergeltung oder Erneuerung
  quelle: ser-2022__anh-c-s056-1
  zitat: Diese Auftragsbestätigung gilt auch für die Revision in den nachfolgenden Jahren, sofern das Revisionsmandat verlängert und keine neue Auftragsbestätigung vereinbart wird.
- dokument: Offene Honorarrechnungen gegenüber dem Kunden
  zweck: Eigeninteresse, Wiederwahl
  quelle: ser-2022__anh-b-s053-1
  zitat: wenn Honorare, die von einem Prüfungskunden geschuldet sind, über einen längeren Zeitraum hinweg unbezahlt bleiben
- dokument: 'Bei Erstprüfung: Grundbuchauszüge, Verträge, geprüfte Vorjahresrechnung'
  zweck: Eröffnungsbilanzwerte, Dauerakte
  quelle: hwp-er-2026__rz-0009-s180
  zitat: namentlich Grundbuchauszüge, Verträge etc., zu identifizieren und einzufordern
dokumentation:
- text: Überlegungen zur Unabhängigkeit gehören in die Jahresakten.
  quelle: ser-2022__7-2
  zitat: Überlegungen zur Unabhängigkeit;
- text: Wichtigste Dokumente datieren und mit Vermerk des Autors bzw. der Mandatsleitung versehen.
  quelle: ser-2022__7-1
  zitat: Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors oder derjenigen Person zu versehen, die das Revisionsmandat leitet.
- text: Dauerakten mit mehrjährig gültigen Dokumenten führen (Ablage durch den Menschen; der Agent dokumentiert den Abgleich in P1-321 bzw. im <Prüffeld>-322 der betroffenen Position).
  quelle: ser-2022__7-3
  zitat: Diese enthalten insbesondere über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
- text: Aufbewahrung mindestens zehn Jahre ab Berichtsdatum; elektronische Ablage nur mit Änderungsnachweis und Lesbarkeit.
  quelle: hwp-er-2026__rz-0288-s248
  zitat: Die Arbeitspapiere sind während mindestens zehn Jahren, regelmässig gerechnet ab Berichtsdatum, aufzubewahren.
- text: 'Bei Mitwirkung bei der Buchführung: Offenlegung im Revisionsbericht (Vorgabe für Prozess 5, GVB-Entwurf).'
  quelle: ser-2022__8-4
  zitat: Ein Mitarbeitender unserer Gesellschaft hat im Berichtsjahr bei der Buchführung mitgewirkt. An der eingeschränkten Revision war er nicht beteiligt.
- text: Wechsel der Revisionsart im Revisionsbericht mitteilen (Vorgabe für Prozess 5).
  quelle: hwp-er-2026__rz-0354-s109
  zitat: es empfehlenswert, den Wechsel der Revisionsart im Revisionsbericht mitzuteilen
- text: Erstprüfung (Vorjahr nicht oder anders geprüft) im Revisionsbericht anmerken.
  quelle: ser-2022__6-2-7
  zitat: Der Tatbestand, dass die Vorjahresrechnung nicht oder von einem anderen Abschlussprüfer geprüft wurde, ist im Revisionsbericht anzumerken.
- text: 'Bei EQR: Revisionsbericht nicht vor Abschluss der auftragsbegleitenden Qualitätssicherung datieren (Vorgabe für Prozess 5).'
  quelle: leitfaden-qm-2025__6-1-5-t1
  zitat: Der Revisionsbericht zum Auftrag wird nicht vor dem Abschluss der auftragsbegleitenden Qualitätssicherung datiert.
- text: 'Agent: offene Punkte als Notiz «Pendenz» mit konkretem Inhalt; Notizen nie löschen oder erledigen.'
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Notizen löscht oder erledigt er nie.
- text: 'Agent: jede Aktion, Quelle und Berechnung im Protokoll pro Mandat und Jahr in M-Files.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
- text: 'Agent-Leseweise für revio Bereich 2: nur lesen (Empfehlung); die Leserechte für 2.1, 2.4 und 3.5 sind noch nicht entschieden – bis dahin Fakten aus M-Files, fehlenden Zugriff
    als Pendenz.'
  quelle: konzept-ki-revisionsagent-2026__c017-1
  zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
fallstricke:
- text: Wiederwahl nicht als Automatismus behandeln; Anzeigepflichten aus dem laufenden Mandat bleiben.
  quelle: hwp-er-2026__rz-0153-s067
  zitat: dass die gesetzlichen Anzeigepflichten (Art. 728c und 729c OR), die vor Ablauf des Mandats entstanden sind, noch erfüllt werden müssen
- text: 'Schwellenwerte: Im Berichts- und Vorjahr müssen nicht dieselben zwei Grössen überschritten sein.'
  quelle: hwp-er-2026__rz-0309-s098
  zitat: nicht erforderlich, dass im Berichts- und im Vorjahr die gleichen beiden Referenzgrössen die massgeblichen Schwellenwerte überschreiten
- text: 'Erstmaliges Überschreiten löst die ordentliche Revision erst im zweiten Jahr aus – ausser bei Neugründung mit absehbarem Überschreiten (SER 1.1: von Beginn weg ordentlich).'
  quelle: hwp-er-2026__rz-0310-s098
  zitat: Gesellschaften, welche die Schwellenwerte erstmals in einem Geschäftsjahr überschreiten, müssen die entsprechende Jahresrechnung noch nicht ordentlich revidieren lassen.
- text: 'Tochter einer kotierten oder anleihensemittierenden Gruppe mit mindestens 20 % Beitrag zur Konzernrechnung ist Publikumsgesellschaft: ordentliche Revision durch ein staatlich
    beaufsichtigtes Revisionsunternehmen, unabhängig von den Schwellenwerten – und zwar sofort für dieses Geschäftsjahr (keine Zweijahresregel). Kotierung auch an einer ausländischen
    Börse oder im Freiverkehr prüfen (RAB entscheidet im Einzelfall); unklar → Pendenz an den WP.'
  quelle: or__art-727
  zitat: mindestens 20 Prozent der Aktiven oder des Umsatzes zur Konzernrechnung einer Gesellschaft nach Buchstabe a oder b beitragen
  weitere_fundstellen:
  - quelle: hwp-er-2026__rz-0322-s100
    zitat: muss sie ihre Jahresrechnung unmittelbar für dieses Geschäftsjahr ordentlich revidieren lassen.
  - quelle: rab-faq-revisionsunternehmen__c002-13
    zitat: Bei ausländischen Einrichtungen entscheidet die RAB einzelfallweise darüber, ob diese als Börse gilt oder nicht.
  - quelle: rab-faq-revisionsunternehmen__c002-14
    zitat: Auch hier muss im Einzelfall geklärt werden, ob eine Kotierung vorliegt.
  - quelle: rab-faq-revisionsunternehmen__c002-14
    zitat: Bei ungenügender Abklärung durch die Revisionsstelle besteht das Risiko, dass die Revisionsstelle eine Publikumsgesellschaft (eingeschränkt) prüft, ohne über die erforderliche
      Zulassung als staatlich beaufsichtigtes Revisionsunternehmen zu verfügen.
- text: 'Abschluss nach anerkanntem Standard: ordentliche Revision durch einen Revisionsexperten, auch wenn die Schwellenwerte nicht überschritten sind. Gilt nicht bei freiwilligem Abschluss
    nach anerkanntem Standard (z. B. Swiss GAAP FER 21 für ZEWO).'
  quelle: hwp-er-2026__rz-0320-s099
  zitat: unabhängig vom Überschreiten der Schwellenwerte in Art. 727 OR
  weitere_fundstellen:
  - quelle: hwp-er-2026__rz-0321-s100
    zitat: besteht hingegen keine Pflicht zur ordentlichen Revision, wenn der Abschluss nach anerkanntem Standard auf freiwilliger Basis
  - quelle: hwp-er-2026__rz-0321-s100
    zitat: Swiss GAAP FER 21
- text: Opting-out seit 1.1.2025 nur noch für künftige Geschäftsjahre.
  quelle: hwp-er-2026__rz-0061-s051
  zitat: ist ein Opting-out nur für künftige Geschäftsjahre möglich
- text: 'Besondere Prüfungen (Kapitalerhöhung, Kapitalherabsetzung, Fusion, Zwischenabschluss nach Art. 725b Abs. 2 OR): weder eingeschränkte Revision noch Opting-out zulässig; sie folgen
    eigenen Prüfungsstandards.'
  quelle: ser-2022__1-1-t2
  zitat: ist weder eine eingeschränkte Revision noch ein Opting-out zulässig
- text: Opting-out erfasst keine besonderen Prüfungen (Beispiel Kapitalherabsetzung).
  quelle: hwp-er-2026__rz-0052-s049
  zitat: So muss bspw. auch dann zwingend eine Kapitalherabsetzungsprüfung vorgenommen werden, wenn eine Gesellschaft ein Opting-out vorgenommen hat
- text: Prüfung nach Art. 725a Abs. 2 OR erfolgt im Auftrag ohne Organstellung und ohne HR-Eintrag.
  quelle: hwp-er-2026__rz-0065-s052
  zitat: Die diesfalls beauftragte Revisionsgesellschaft erlangt hier jedoch keine Organstellung und wird nicht als Revisionsstelle im Handelsregister eingetragen.
- text: Opting-up/-in-Begehren kurz vor der GV erzwingt meist eine Verschiebung der GV.
  quelle: hwp-er-2026__rz-0057-s050
  zitat: Vielmehr wird durch ein entsprechendes Begehren in der Regel eine Verschiebung der Generalversammlung nötig.
- text: Beratende Unterstützung im Prüfungsprozess ist keine Mitwirkung (keine Trennung, keine Offenlegung) – Entscheidungen bleiben aber beim Kunden.
  quelle: hwp-er-2026__rz-0049-s160
  zitat: Erbringt eine Revisionsstelle solche Leistungen, muss sie jedenfalls sicherstellen, dass ihre Mitarbeiter keine Entscheidungen treffen, die in der alleinigen Verantwortung des
    Prüfungskunden liegen.
- text: Buchführende Person darf den Revisionsbericht nicht mitunterzeichnen.
  quelle: hwp-er-2026__rz-0041-s159
  zitat: Die Mitunterzeichnung des Revisionsberichts durch eine Person, die in der Buchführung mitgewirkt
- text: 'Doppelmandat: Wissen der Treuhandabteilung wird der Revisionsstelle trotz Trennung zugerechnet (höheres Haftungsrisiko).'
  quelle: hwp-er-2026__rz-0045-s159
  zitat: das Wissen der Treuhandabteilung trotz organisatorischer und personeller Trennung der Revisionsstelle zugerechnet wird
- text: 'Die gesetzliche 10 %-Grenze (Art. 11 Abs. 1 lit. a RAG) gilt nur für staatlich beaufsichtigte Revisionsunternehmen bei Gesellschaften des öffentlichen Interesses, nicht für
    die eingeschränkte Revision. Die RAB nennt aber als Beispiel einer problematischen Abhängigkeit einen Honoraranteil des Kunden (inkl. aller konsolidierten Unternehmen) von über 10
    % der durchschnittlichen Honorareinnahmen der letzten fünf Jahre; spätestens ab 20 % dürfte die Unabhängigkeit fehlen → Anteil mit `rechne` berechnen und dem WP melden (Einzelfallbeurteilung:
    WP).'
  quelle: rab-unabhaengigkeit__c004-7
  zitat: Ein Beispiel für eine problematische Abhängigkeit ist, wenn der Honoraranteil eines geprüften Unternehmens (inkl. aller konsolidierten Unternehmen) gemessen an den gesamten
    durchschnittlichen Honorareinnahmen des Revisionsunternehmens der letzten fünf Jahre über 10% liegt.
  weitere_fundstellen:
  - quelle: rab-unabhaengigkeit__c004-7
    zitat: Spätestens ab 20% dürfte die wirtschaftliche Unabhängigkeit nicht mehr gegeben sein.
  - quelle: rag__art-11
    zitat: müssen staatlich beaufsichtigte Revisionsunternehmen bei der Erbringung von Revisionsdienstleistungen für Gesellschaften des öffentlichen Interesses folgende Grundsätze einhalten
  - quelle: hwp-er-2026__rz-0036-s156-t3
    zitat: findet keine Anwendung bei der eingeschränkten Revision
- text: 'Mandat ohne nötige Zulassung: Haftung aus Übernahmeverschulden und aufsichtsrechtliche Folgen.'
  quelle: hwp-er-2026__rz-0142-s064
  zitat: Für eine Revisionsstelle, die ein Mandat ohne die dafür notwendige Zulassung übernimmt, kann sich aus Übernahmeverschulden eine Haftung ergeben.
- text: Handelsregister zeigt weder Revisionsart noch Zulassungsart.
  quelle: hwp-er-2026__rz-0159-s068
  zitat: Nicht eingetragen werden die Art der Revision und die Art der Zulassung der Revisionsstelle.
- text: Neue Revisionsstelle muss vor Genehmigung der Jahresrechnung gewählt sein (erstes Traktandum).
  quelle: hwp-er-2026__rz-0131-s062
  zitat: unter einem ersten Traktandum vorerst die Wahl der Revisionsstelle vorzunehmen
- text: Stille Wahl der Revisionsstelle ist nicht zulässig.
  quelle: hwp-er-2026__rz-0129-s062
  zitat: Eine stille Wahl der Revisionsstelle ist nicht zulässig.
- text: 'Leitfaden QM gibt die frühere Rechtslage wieder (Abberufung «jederzeit mit sofortiger Wirkung»); massgebend ist Art. 730a Abs. 4 OR: Abberufung nur aus wichtigen Gründen (Gesetz
    vor Leitfaden).'
  quelle: leitfaden-qm-2025__5-1-t3
  zitat: Die Generalversammlung kann die Revisionsstelle jedoch jederzeit mit sofortiger Wirkung abberufen.
- text: Rücktritt zur Unzeit (unmittelbar vor/während der GV) kann ersatzpflichtig machen.
  quelle: hwp-er-2026__rz-0169-s069
  zitat: wenn sie ohne triftige Gründe unmittelbar vor oder während der Generalversammlung zurücktritt
- text: 'Auffassung der RAB: Konzernprüfer darf bei Tochtergesellschaften nicht bei der Buchführung mitwirken – abweichend vom HWP.'
  quelle: hwp-er-2026__rz-0046-s160
  zitat: das Mandat als Konzernabschlussprüfer allfällige weitere Auftragsverhältnisse mit Tochtergesellschaften
  weitere_fundstellen:
  - quelle: rab-faq-revisionsunternehmen__c002-4
    zitat: Unzulässig ist somit auch die Mitwirkung der Revisionsstelle an der Buchführung einer Tochtergesellschaft einer von ihr ordentlich geprüften Konzernmuttergesellschaft
- text: 'Agent schreibt nur in Bereich 4 und 10: Bereich 2 und die revio-Dauerakten nur lesen; keine Kundenkontakte, kein Versand.'
  quelle: konzept-ki-revisionsagent-2026__c006-1
  zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
fragen_kunde:
- frage: 'Welche Rechtsform hat die Gesellschaft? Wie hoch waren Bilanzsumme, Umsatzerlös (alle Erträge) und Vollzeitstellen im Jahresdurchschnitt im Berichts- und im Vorjahr, und in
    welcher Währung legt sie Rechnung? Bei Stiftungen: Befreiungsverfügung oder Anordnung der Aufsichtsbehörde? Bei Vereinen: Haben Mitglieder mit persönlicher Haftung oder Nachschusspflicht
    eine Revision verlangt, und was sehen die Statuten vor?'
  zweck: Revisionsart nach Art. 727 Abs. 1 Ziff. 2 und Abs. 1bis OR (bei Vereinen Art. 69b ZGB, bei Stiftungen Art. 83b ZGB), Opting-out-Grenze von zehn Vollzeitstellen
- frage: Besteht eine Pflicht zur Konzernrechnung, sind Beteiligungspapiere kotiert oder Anleihen ausstehend, oder trägt die Gesellschaft mindestens 20 % der Aktiven oder des Umsatzes
    zur Konzernrechnung einer kotierten oder anleihensemittierenden Gesellschaft bei?
  zweck: Publikumsgesellschaft und Konzernrechnungspflicht (Art. 727 Abs. 1 Ziff. 1 und 3 OR); staatlich beaufsichtigtes Revisionsunternehmen
- frage: Besteht eine Pflicht oder ein Begehren für einen Abschluss nach anerkanntem Standard (Art. 962 OR)? Sind Kapitalerhöhungen, Kapitalherabsetzungen, Fusionen oder Zwischenabschlüsse
    geplant?
  zweck: Ordentliche Revision nach Art. 962a Abs. 3 OR; besondere Prüfungen ausserhalb der eingeschränkten Revision und des Opting-out
- frage: Liegen Begehren auf ordentliche Revision vor – von Aktionären mit mindestens 10 % des Aktienkapitals, von nachschusspflichtigen oder ausgeschiedenen, noch nicht vollständig
    abgefundenen GmbH-Gesellschaftern bzw. von Genossenschaftern (10 % der Köpfe oder des Anteilscheinkapitals, haftende/nachschusspflichtige) –, eine Statutenbestimmung, ein GV-Beschluss
    oder ein Opting-in-Begehren?
  zweck: Opting-up/-in je Rechtsform und Fristen
- frage: Wurde ein Opting-out beschlossen? Haben sämtliche Aktionäre bzw. Gesellschafter zugestimmt (ggf. schriftliches Verfahren mit Fristansetzung), und wann wurde der Verzicht im
    Handelsregister angemeldet?
  zweck: Gültigkeit des Opting-out (Art. 727a Abs. 2–3 OR)
- frage: 'Bei Neugründung: Ist absehbar, dass die Schwellenwerte überschritten werden (Businessplan, Budget)?'
  zweck: Von Beginn weg ordentliche Revision (SER 1.1)
- frage: Wann und für welche Amtsdauer wurde die Revisionsstelle gewählt (GV-Protokoll), und ist sie im Handelsregister eingetragen?
  zweck: Gültige Wahl, Amtsdauer, HR-Eintrag
- frage: Weshalb wird die bisherige Revisionsstelle ersetzt, und entbindet der VR sie vom Berufsgeheimnis?
  zweck: Mandatsrisiko, Kontakt zur Vorgängerin
- frage: Welche Leistungen bezieht die Gesellschaft sonst vom Revisionsunternehmen (Buchführung, Abschlusserstellung, Löhne, MWST, Steuern, Bewertungen)?
  zweck: Doppelmandat, Trennung, Offenlegung
- frage: Bestehen Beteiligungen, Darlehen, Garantien, Arbeitsverhältnisse, Verwandtschaft oder Rechtsstreitigkeiten zwischen Gesellschaft, VR, Hauptaktionären und Revisionsunternehmen
    bzw. Prüfungsteam?
  zweck: Unabhängigkeit nach SER Anhang B
- frage: Welches Organ ist für die Jahresrechnung verantwortlich und wer unterzeichnet sie bzw. die Vollständigkeitserklärung?
  zweck: Platzhalter [7]/[8] der Auftragsbestätigung
- frage: Gibt es Hinweise auf Kapitalverlust, Überschuldung oder Rangrücktritte? Bestehen Auslandsbezüge oder ein grosser Adressatenkreis für den Revisionsbericht?
  zweck: Mandatsrisiko, Risikoklasse/EQR-Kriterien, Art. 725a OR, Prüfungsplanung
- frage: Welche Änderungen gab es seit dem Vorjahr bei Statuten, VR, Aktionariat, Geschäftstätigkeit und wichtigen Verträgen?
  zweck: Aktualisierungsbedarf Dauerakte, Fortführung beurteilen
- frage: Wer sind die Ansprechpartner, welcher Prüfungstermin passt und welche Unterlagen und Infrastruktur stehen zur Verfügung?
  zweck: Prüfungsvorbereitung und PBC-Liste
muster:
- vorlage: Auftragsbestätigung eingeschränkte Revision – Pflichtinhalte (SER Anhang C, Beispiel 1)
