- was: 'Zulassung belegen: Revisionsunternehmen mindestens als Revisor zugelassen (eingeschränkte Revision); bei Pflicht zur ordentlichen Revision zugelassener Revisionsexperte, bei
    Publikumsgesellschaften staatlich beaufsichtigtes Revisionsunternehmen; alle Personen, die die Revision leiten, mit der entsprechenden Zulassung (RAB-Register; Zulassung des Revisionsunternehmens
    befristet auf fünf Jahre, Ablaufdatum prüfen); internes Qualitätssicherungssystem vorhanden; Wohnsitz/Sitz in der Schweiz. Genau eine Person leitet die Revision (keine Co-Leitung).
    Bei der eingeschränkten Revision genügt für sie die Zulassung als Revisor, auch in einem Revisionsexperten-Unternehmen. Das RAB-Register ist öffentlich (Internet). Das HR-Amt klärt
    nur ab, ob die Revisionsstelle zugelassen ist (RAB-Register), und trägt bei Anschein der Abhängigkeit nicht ein. Art der Revision und Art der Zulassung stehen nicht im HR → Zulassungsart
    selbst im RAB-Register prüfen. Der HR-Eintrag ersetzt weder diese Prüfung noch die Prüfung der Unabhängigkeit.'
