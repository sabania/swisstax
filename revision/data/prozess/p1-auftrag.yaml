# Prozessphase p1-auftrag – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p1-auftrag
titel: 'Auftrag: Annahme/Fortführung, Unabhängigkeit, Revisionsart'
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 15
    korrigiert: true
ziel: 'Vor Wahl/Wiederwahl bzw. Prüfungsbeginn Fakten aufbereiten, damit der WP entscheidet, ob das SER-Mandat angenommen bzw. fortgeführt werden darf, kann und soll: Revisionsart (OR
  727/727a, Rechtsform, Opting), Zulassung, Unabhängigkeit inkl. Doppelmandat, Mandatsrisiko/EQR, Honorar; Entwurf Auftragsbestätigung, Abgleich Dauerakten.'
wann: 'Vor Annahme der Wahl bzw. Wiederwahl durch die GV und vor Prüfungsbeginn jedes Geschäftsjahres (vor Prozess 1); nach dem Import (Prozess 1) Schwellenwerte erneut abgleichen; erneut
  bei neuen Fakten: Schwellenwerte überschritten, Opting-up/-in-Begehren, Begehren auf Abschluss nach anerkanntem Standard, geplante Kapitalveränderung/Fusion/Zwischenabschluss, neue
  Dienstleistungen (Doppelmandat), Honorarausstände, Rechtsstreit, Wechsel im Team.'
gesetz:
- thema: Wahl der Revisionsstelle ist unübertragbare Befugnis der GV
  quelle: or__art-698
  zitat: die Wahl der Mitglieder des Verwaltungsrates und der Revisionsstelle;
- thema: Wahl durch die GV (Art. 730 Abs. 1 OR)
  quelle: or__art-730
  zitat: Die Generalversammlung wählt die Revisionsstelle.
- thema: 'Wählbar: natürliche oder juristische Personen, Personengesellschaften (Art. 730 Abs. 2 OR)'
  quelle: or__art-730
  zitat: Als Revisionsstelle können eine oder mehrere natürliche oder juristische Personen oder Personengesellschaften gewählt werden.
- thema: Mindestens ein Mitglied mit Wohnsitz/Sitz/Zweigniederlassung in der Schweiz
  quelle: or__art-730
  zitat: Wenigstens ein Mitglied der Revisionsstelle muss seinen Wohnsitz, seinen Sitz oder eine eingetragene Zweigniederlassung in der Schweiz haben.
- thema: Amtsdauer 1–3 Geschäftsjahre, Ende mit Abnahme der letzten Jahresrechnung, Wiederwahl möglich
  quelle: or__art-730a
  zitat: Die Revisionsstelle wird für ein bis drei Geschäftsjahre gewählt. Ihr Amt endet mit der Abnahme der letzten Jahresrechnung. Eine Wiederwahl ist möglich.
- thema: Rotation (7 Jahre) nur bei ordentlicher Revision
  quelle: or__art-730a
  zitat: Bei der ordentlichen Revision darf die Person, die die Revision leitet, das Mandat längstens während sieben Jahren ausführen.
- thema: 'Rücktritt: Gründe an den VR, der sie der nächsten GV mitteilt (Art. 730a Abs. 3 OR)'
  quelle: or__art-730a
  zitat: Tritt eine Revisionsstelle zurück, so hat sie den Verwaltungsrat über die Gründe zu informieren
- thema: Abberufung durch die GV nur aus wichtigen Gründen (Art. 730a Abs. 4 OR)
  quelle: or__art-730a
  zitat: Die Generalversammlung kann die Revisionsstelle nur aus wichtigen Gründen abberufen.
- thema: 'Zulassung bei eingeschränkter Revision: mindestens zugelassener Revisor (RAG)'
  quelle: or__art-727c
  zitat: müssen als Revisionsstelle einen zugelassenen Revisor nach den Vorschriften des Revisionsaufsichtsgesetzes vom 16. Dezember 2005 bezeichnen
- thema: 'Ordentliche Revision (übrige Gesellschaften): zugelassener Revisionsexperte (Art. 727b Abs. 2 OR)'
  quelle: or__art-727b
  zitat: müssen als Revisionsstelle einen zugelassenen Revisionsexperten nach den Vorschriften des Revisionsaufsichtsgesetzes
- thema: 'Publikumsgesellschaften: staatlich beaufsichtigtes Revisionsunternehmen (Art. 727b Abs. 1 OR)'
  quelle: or__art-727b
  zitat: Publikumsgesellschaften müssen als Revisionsstelle ein staatlich beaufsichtigtes Revisionsunternehmen
- thema: Publikumsgesellschaft auch bei Beitrag von mindestens 20 % zur Konzernrechnung einer kotierten oder anleihensemittierenden Gesellschaft (Art. 727 Abs. 1 Ziff. 1 lit. c OR)
  quelle: or__art-727
  zitat: mindestens 20 Prozent der Aktiven oder des Umsatzes zur Konzernrechnung einer Gesellschaft nach Buchstabe a oder b beitragen
- thema: Ordentliche Revision bei Überschreiten von zwei der drei Grössen in zwei aufeinander folgenden Geschäftsjahren
  quelle: or__art-727
  zitat: Gesellschaften, die zwei der nachstehenden Grössen in zwei aufeinander folgenden Geschäftsjahren überschreiten
- thema: Schwellenwert Bilanzsumme (Art. 727 Abs. 1 Ziff. 2 lit. a OR)
  quelle: or__art-727
  zitat: Bilanzsumme von 20 Millionen Franken
- thema: Schwellenwert Umsatzerlös (lit. b)
  quelle: or__art-727
  zitat: Umsatzerlös von 40 Millionen Franken
- thema: Schwellenwert Vollzeitstellen (lit. c)
  quelle: or__art-727
  zitat: 250 Vollzeitstellen im Jahresdurchschnitt
- thema: 'Rechnungslegung in Fremdwährung: Bilanzsumme zum Stichtagskurs, Umsatzerlös zum Jahresdurchschnittskurs (Art. 727 Abs. 1bis OR)'
  quelle: or__art-727
  zitat: für die Bilanzsumme der Umrechnungskurs zum Bilanzstichtag und für den Umsatzerlös der Jahresdurchschnittskurs massgebend
- thema: Ordentliche Revision zwingend für Gesellschaften mit Konzernrechnungspflicht
  quelle: or__art-727
  zitat: Gesellschaften, die zur Erstellung einer Konzernrechnung verpflichtet sind.
- thema: Opting-up durch Aktionäre mit mindestens 10 % des Aktienkapitals
  quelle: or__art-727
  zitat: wenn Aktionäre, die zusammen mindestens 10 Prozent des Aktienkapitals vertreten, dies verlangen
- thema: Opting-up durch Statuten oder GV-Beschluss
  quelle: or__art-727
  zitat: so können die Statuten vorsehen oder kann die Generalversammlung beschliessen, dass die Jahresrechnung ordentlich geprüft wird
- thema: 'Abschluss nach anerkanntem Standard: ordentliche Revision durch zugelassenen Revisionsexperten (Art. 962a Abs. 3 OR)'
  quelle: or__art-962a
  zitat: Die Einhaltung des anerkannten Standards muss durch einen zugelassenen Revisionsexperten geprüft werden. Es ist eine ordentliche Revision des Abschlusses durchzuführen.
- thema: Begehren auf Abschluss nach anerkanntem Standard, u. a. durch Gesellschafter mit 20 % des Grundkapitals (Art. 962 Abs. 2 OR)
  quelle: or__art-962
  zitat: Gesellschafter, die mindestens 20 Prozent des Grundkapitals vertreten;
- thema: 'GmbH: aktienrechtliche Vorschriften zur Revisionsstelle anwendbar (Art. 818 Abs. 1 OR; gleich für Genossenschaft Art. 906 Abs. 1 OR)'
  quelle: or__art-818
  zitat: Für die Revisionsstelle sind die Vorschriften des Aktienrechts entsprechend anwendbar.
- thema: 'GmbH: nachschusspflichtiger Gesellschafter kann ordentliche Revision verlangen (Art. 818 Abs. 2 OR)'
  quelle: or__art-818
  zitat: Ein Gesellschafter, der einer Nachschusspflicht unterliegt, kann eine ordentliche Revision der Jahresrechnung verlangen.
- thema: 'GmbH: ausgeschiedener Gesellschafter bis zur vollständigen Abfindung (Art. 825a Abs. 4 OR)'
  quelle: or__art-825a
  zitat: kann der ausgeschiedene Gesellschafter verlangen, dass die Gesellschaft eine Revisionsstelle bezeichnet und die Jahresrechnung ordentlich revidieren lässt.
- thema: 'Genossenschaft: Begehren durch 10 % der Genossenschafter (Art. 906 Abs. 2 Ziff. 1 OR)'
  quelle: or__art-906
  zitat: 10 Prozent der Genossenschafter;
- thema: 'Genossenschaft: Begehren durch Genossenschafter mit 10 % des Anteilscheinkapitals (Ziff. 2)'
  quelle: or__art-906
  zitat: Genossenschafter, die zusammen mindestens 10 Prozent des Anteilscheinkapitals vertreten;
- thema: 'Genossenschaft: Begehren durch haftende oder nachschusspflichtige Genossenschafter (Ziff. 3)'
  quelle: or__art-906
  zitat: Genossenschafter, die einer persönlichen Haftung oder einer Nachschusspflicht unterliegen.
- thema: Eingeschränkte Revision, wenn Voraussetzungen der ordentlichen Revision fehlen
  quelle: or__art-727a
  zitat: Sind die Voraussetzungen für eine ordentliche Revision nicht gegeben, so muss die Gesellschaft ihre Jahresrechnung durch eine Revisionsstelle eingeschränkt prüfen lassen.
- thema: 'Opting-out: Zustimmung sämtlicher Aktionäre, max. 10 Vollzeitstellen'
  quelle: or__art-727a
  zitat: Mit der Zustimmung sämtlicher Aktionäre kann auf die eingeschränkte Revision verzichtet werden, wenn die Gesellschaft nicht mehr als zehn Vollzeitstellen im Jahresdurchschnitt
    hat.
- thema: Opting-out nur für künftige Geschäftsjahre, Anmeldung vor Beginn des Geschäftsjahres
  quelle: or__art-727a
  zitat: Der Verzicht gilt nur für künftige Geschäftsjahre und muss vor Beginn des Geschäftsjahres beim Handelsregisteramt angemeldet werden.
- thema: 'Opting-out: schriftliches Zustimmungsverfahren, Frist mindestens 20 Tage, Schweigen gilt als Zustimmung (Art. 727a Abs. 3 OR)'
  quelle: or__art-727a
  zitat: Er kann für die Beantwortung eine Frist von mindestens 20 Tagen ansetzen und darauf hinweisen, dass das Ausbleiben einer Antwort als Zustimmung gilt.
- thema: 'Opting-in: jeder Aktionär bis 10 Tage vor der GV'
  quelle: or__art-727a
  zitat: Jeder Aktionär hat jedoch das Recht, spätestens zehn Tage vor der Generalversammlung eine eingeschränkte Revision zu verlangen.
- thema: 'Opting-out (AG): Erklärung an das HR-Amt (Voraussetzungen a–c), Datum des GJ-Beginns, Unterschrift mindestens eines VR-Mitglieds, Beilagen a–d (Art. 62 Abs. 1–2 HRegV)'
  quelle: hregv__art-62-t1
  zitat: Die Erklärung muss das Datum des Beginns des Geschäftsjahres enthalten, ab welchem der Verzicht gilt und von mindestens einem Mitglied des Verwaltungsrats unterzeichnet sein.
- thema: 'Eintragung der Revisionsstelle: nur bei ordentlicher oder eingeschränkter Revision; HR-Amt klärt im RAB-Register nur ab, ob sie zugelassen ist; kein Eintrag bei Anschein der
    Abhängigkeit (Art. 61 Abs. 1–3 HRegV)'
  quelle: hregv__art-61
  zitat: Das Handelsregisteramt klärt durch Einsichtnahme in das Register der Eidgenössischen Revisionsaufsichtsbehörde ab, ob die Revisionsstelle zugelassen ist.
- thema: 'Opting-out-Gesellschaft mit Kapitalverlust: eingeschränkte Revision der letzten Jahresrechnung durch zugelassenen Revisor'
  quelle: or__art-725a
  zitat: so muss die letzte Jahresrechnung vor ihrer Genehmigung durch die Generalversammlung überdies einer eingeschränkten Revision durch einen zugelassenen Revisor unterzogen werden
- thema: Bei Art. 725a Abs. 2 OR ernennt der VR den zugelassenen Revisor
  quelle: or__art-725a
  zitat: Der Verwaltungsrat ernennt den zugelassenen Revisor.
- thema: Unabhängigkeit tatsächlich und dem Anschein nach
  quelle: or__art-729
  zitat: Die Revisionsstelle muss unabhängig sein und sich ihr Prüfungsurteil objektiv bilden. Die Unabhängigkeit darf weder tatsächlich noch dem Anschein nach beeinträchtigt sein.
- thema: Mitwirken bei der Buchführung/andere Dienstleistungen zulässig, aber mit organisatorischen und personellen Massnahmen
  quelle: or__art-729
  zitat: Sofern das Risiko der Überprüfung eigener Arbeiten entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.
- thema: Bericht enthält Angaben zur Unabhängigkeit und zum Mitwirken bei der Buchführung
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung und zu anderen Dienstleistungen, die für die zu prüfende Gesellschaft erbracht wurden
- thema: Prüfungsumfang der eingeschränkten Revision (für Auftragsbestätigung)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Auskunfts- und Vorlagepflicht des VR
  quelle: or__art-730b
  zitat: Der Verwaltungsrat übergibt der Revisionsstelle alle Unterlagen und erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt
- thema: Geheimhaltungspflicht der Revisionsstelle
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen, soweit sie nicht von Gesetzes wegen zur Bekanntgabe verpflichtet ist.
- thema: Dokumentation und 10 Jahre Aufbewahrung
  quelle: or__art-730c
  zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren und Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren.
- thema: Keine Aufgaben, die die Unabhängigkeit beeinträchtigen
  quelle: or__art-731a
  zitat: Der Revisionsstelle dürfen weder Aufgaben des Verwaltungsrates, noch Aufgaben, die ihre Unabhängigkeit beeinträchtigen, zugeteilt werden.
- thema: Revisionsbericht muss vor Genehmigung der Jahresrechnung vorliegen (sonst nichtig)
  quelle: or__art-731
  zitat: Liegt der erforderliche Revisionsbericht nicht vor, so sind die Beschlüsse zur Genehmigung der Jahresrechnung
- thema: 'Anhang: Gründe bei vorzeitigem Rücktritt/Abberufung der Revisionsstelle'
  quelle: or__art-959c-t2
  zitat: 'bei einem vorzeitigen Rücktritt oder einer Abberufung der Revisionsstelle: die Gründe, die dazu geführt haben'
schritte:
- was: 'Mandatskontext fixieren und Ausgangslage lesen: Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag; Rechtsform und HR-Eintrag der Revisionsstelle (aus dem HR-Auszug
    in M-Files), gültige Wahl (GV-Protokoll), Wahlannahme, laufende Amtsdauer, Vorjahresbericht. Abweichungen oder Unklarheiten als Pendenz, nichts ergänzen. Gibt es noch keine Jahresakte
    (Neumandat): keine Akte anlegen (nur Mensch); Ergebnis nur im Agenten-Protokoll und als Entwurf an den WP.'
  wer: Agent
  revio: 2.2 Auftragsannahme und Weiterführung nur lesen über rv_get_checklists_LoadChecklist bzw. rv_get_workpapers_LoadDynamicFormsData (Komponente am Testmandat bestimmen); rv_get_clientsManagement_LoadAnualFilesForClient_by_clientId,
    rv_get_clientsManagement_LoadClientHistory_by_clientId (nur lesend). Rechtsform und eingetragene Revisionsstelle aus dem HR-Auszug in M-Files.
  mfiles: 'Suche nach Metadaten Kunde/Geschäftsjahr: HR-Auszug, Statuten, GV-Protokoll mit Wahl der Revisionsstelle, Annahmeerklärung, Revisionsbericht Vorjahr'
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: 'Zu Beginn wird ein Kontext-Schlüssel fixiert: Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr und Stichtag.'
  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: bei Abweichung bricht der Agent ab und erfasst eine Pendenz
  - quelle: hwp-er-2026__rz-0143-s064
    zitat: Das Mandatsverhältnis kommt mit der Wahl durch die Generalversammlung und der Erklärung der Wahlannahme durch die Revisionsstelle zustande.
  - quelle: katalog-revio4__c003-4
    zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen.
  - quelle: hwp-er-2026__rz-0158-s067
    zitat: Die Revisionsstelle darf nur dann eingetragen werden, wenn sie zumindest eine eingeschränkte Revision durchführt
  - quelle: konzept-ki-revisionsagent-2026__c006-1
    zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
- was: 'Revisionsart (1/3) – Pflicht zur ordentlichen Revision prüfen (Vorlage für WP): (a) Publikumsgesellschaft (kotiert, Anleihen ausstehend oder Beitrag von mindestens 20 % der Aktiven
    oder des Umsatzes zur Konzernrechnung einer solchen Gesellschaft) → sofort für dieses Geschäftsjahr ordentliche Revision durch staatlich beaufsichtigtes Revisionsunternehmen; (b)
    Konzernrechnungspflicht; (c) Schwellenwerte 20/40/250 im Berichts- und Vorjahr (Umsatzerlös = grundsätzlich alle Erträge; Vollzeitstellen inkl. Teilzeit/Lernende anteilig; ausgeliehene/temporäre
    Mitarbeitende beim rechtlichen Arbeitgeber (überwiegende Lehre; Grenzfälle mit vielen Temporären → Pendenz); bei Fremdwährung Bilanzsumme zum Stichtagskurs, Umsatz zum Jahresdurchschnittskurs);
    (d) Pflicht oder Begehren für einen Abschluss nach anerkanntem Standard (Art. 962/962a Abs. 3 OR) → ordentliche Revision unabhängig von den Schwellenwerten (nicht bei freiwilligem
    Abschluss); (e) Neugründung mit absehbarem Überschreiten → von Beginn weg ordentliche Revision. Berechnung im Rechenmodul, nicht im Sprachmodell: `revisionspflicht --bilanzsumme
    <CHF> --umsatz <CHF> --vollzeitstellen <n> --vj-bilanzsumme <CHF> --vj-umsatz <CHF> --vj-vollzeitstellen <n>` (aktienrechtliche Schwellen in CHF; Verein und Fremdwährung gesondert
    bzw. vorher umrechnen). Fehlende Zahlen und Abweichungen nach dem Import als Pendenz.'
  wer: Agent bereitet vor, WP entscheidet
  revio: '1.1 Jahresrechnung und 1.2 Kennzahlen: Vorjahr lesen; Berichtsjahr vor Prozess 1 aus der definitiven Jahresrechnung in M-Files, nach dem Import (Prozess 1) abgleichen; Berechnung
    mit `revisionspflicht` (volle Syntax im Text). 2.4 Auftragsvoraussetzungen und Unabhängigkeit nur lesen, Eintrag durch WP – Leserecht 2.4 laut Konzept noch nicht entschieden: bis
    dahin Fakten aus M-Files, fehlenden Zugriff als Pendenz.'
  mfiles: Definitive Jahresrechnungen Berichts- und Vorjahr, Personalbestände (Monats-/Quartalsstände, Temporäre und ausgeliehene Mitarbeitende), Konzernrechnung bzw. Angaben zu Kotierung/Anleihen
    der Gruppe, Pflicht oder Begehren zu einem Abschluss nach anerkanntem Standard, bei Neugründung Businessplan
  fundstellen:
  - quelle: ser-2022__1-4-1
    zitat: Der Abschlussprüfer vergewissert sich bei Mandatsannahme bzw. vor Prüfungsbeginn, dass die zu prüfende Gesellschaft nicht die Voraussetzungen für eine ordentliche Revision
      erfüllt.
  - quelle: or__art-727
    zitat: mindestens 20 Prozent der Aktiven oder des Umsatzes zur Konzernrechnung einer Gesellschaft nach Buchstabe a oder b beitragen
  - quelle: hwp-er-2026__rz-0134-s063
    zitat: Bei Publikumsgesellschaften (Art. 727 Abs. 1 Ziff. 1 OR) ist ein staatlich beaufsichtigtes Revisionsunternehmen als Revisionsstelle zu wählen.
  - quelle: hwp-er-2026__rz-0322-s100
    zitat: muss sie ihre Jahresrechnung unmittelbar für dieses Geschäftsjahr ordentlich revidieren lassen.
  - quelle: hwp-er-2026__rz-0304-s097
    zitat: sind das jeweilige Berichts- und das Vorjahr beizuziehen
  - quelle: hwp-er-2026__rz-0306-s097
    zitat: wonach grundsätzlich alle Erträge der Erfolgsrechnung zu berücksichtigen sind
  - quelle: hwp-er-2026__rz-0308-s097
    zitat: Lernende und Teilzeitbeschäftigte sind in die Ermittlung der Vollzeitstellen einzubeziehen.
  - quelle: hwp-er-2026__rz-0307-s097
    zitat: Beauftragte und ausgeliehene Mitarbeitende sind demnach bei ihrem rechtlichen Arbeitgeber mitzuzählen.
  - quelle: rab-faq-revisionsunternehmen__c002-2
    zitat: Temporärarbeitskräfte werden dem Personalverleiher und nicht dem Einsatzbetrieb zugerechnet.
  - quelle: rab-faq-revisionsunternehmen__c002-2
    zitat: Temporärangestellte werden dort gezählt, wo sie tatsächlich tätig sind.
  - quelle: or__art-727
    zitat: für die Bilanzsumme der Umrechnungskurs zum Bilanzstichtag und für den Umsatzerlös der Jahresdurchschnittskurs massgebend
  - quelle: ser-2022__1-1-t2
    zitat: Es ist diesfalls eine ordentliche Revision durchzuführen (Art. 962a Abs. 3 OR).
  - quelle: hwp-er-2026__rz-0320-s099
    zitat: unabhängig vom Überschreiten der Schwellenwerte in Art. 727 OR
  - quelle: hwp-er-2026__rz-0321-s100
    zitat: keine Pflicht zur ordentlichen Revision, wenn der Abschluss nach anerkanntem Standard auf freiwilliger Basis
  - quelle: ser-2022__1-1-t2
    zitat: so ist von Beginn weg eine ordentliche Revision durchzuführen
  - quelle: hwp-er-2026__rz-0342-s105
    zitat: empfiehlt es sich für den Abschlussprüfer, die Mandatsannahme sorgfältig abzuwägen
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: 'Rechenmodul: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.'
  - quelle: konzept-ki-revisionsagent-2026__c006-2
    zitat: Import (Prozess 1); Kennzahlen für die Analytik
  - quelle: konzept-ki-revisionsagent-2026__c017-1
    zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
  - quelle: konzept-ki-revisionsagent-2026__c007-1
    zitat: Fehlende Unterlagen, ungeklärte Sachverhalte
- was: 'Revisionsart (2/3) – Begehren und Sonderregeln je Rechtsform: AG: Aktionäre mit 10 % des Aktienkapitals, Statuten oder GV-Beschluss (Opting-up); GmbH: nachschusspflichtige oder
    ausgeschiedene, nicht vollständig abgefundene Gesellschafter; Genossenschaft: 10 % der Genossenschafter, 10 % des Anteilscheinkapitals oder haftende/nachschusspflichtige Genossenschafter;
    Verein: ordentlich bei Überschreiten von zwei der Grössen 10 Mio./20 Mio./50 Vollzeitstellen in zwei aufeinander folgenden Geschäftsjahren (Art. 69b Abs. 1 ZGB); eingeschränkt nur
    auf Verlangen eines Mitglieds mit persönlicher Haftung oder Nachschusspflicht (Abs. 2); sonst Revision nach Statuten (Abs. 4, keine gesetzliche Revision → Pendenz an WP); Stiftung:
    aktienrechtliche Schwellen, aber Befreiung nur durch die Aufsichtsbehörde (Art. 83b Abs. 2 ZGB, kein Opting-out nach Art. 727a OR); die Aufsicht kann eine ordentliche Revision verlangen
    (Abs. 4); übrige Rechtsformen: aktienrechtliche Schwellen. Begehren, Statuten und Verfügungen aus M-Files; fehlt etwas → Pendenz.'
  wer: Agent bereitet vor, WP entscheidet
  revio: rv_get_clientsManagement_LoadShareRegister_by_asOf (Aktionariat, nur lesen); 2.4 nur lesen (Leserecht laut Konzept offen – bis dahin Fakten aus M-Files, fehlenden Zugriff als
    Pendenz)
  mfiles: Statuten, Aktienbuch bzw. Gesellschafter-/Genossenschafter-/Mitgliederverzeichnis, Begehren auf ordentliche bzw. eingeschränkte Revision, bei Stiftungen Befreiungsverfügung
    oder Anordnung der Aufsichtsbehörde
  fundstellen:
