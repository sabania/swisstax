- text: Unabhängigkeit abschliessend beurteilen, inkl. wirtschaftliche Abhängigkeit im Einzelfall (RAB-Richtwerte 10 %/20 %).
  quelle: hwp-er-2026__rz-0036-s156-t3
  zitat: Wann eine wirtschaftliche Abhängigkeit vorhanden ist, muss im Einzelfall geprüft werden.
  weitere_fundstellen:
