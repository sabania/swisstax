- text: Kontakt zur bisherigen Revisionsstelle; Vorgehen, wenn der VR die Entbindung vom Berufsgeheimnis verweigert.
  quelle: hwp-er-2026__rz-0152-s066
  zitat: Verweigert der Verwaltungsrat diese Zustimmung, ist bei der Annahme eines Mandats besondere Vorsicht geboten.
- text: 'Rücktritt: Entscheid und Wirkungszeitpunkt (Unzeit vermeiden).'
  quelle: hwp-er-2026__rz-0174-s070
  zitat: Die Revisionsstelle sollte in ihrem Rücktrittsschreiben klarstellen, ab welchem Zeitpunkt der Rücktritt gelten soll.
- text: 'Strittig RAB vs. EXPERTsuisse: Prüfung des Zwischenabschlusses nach Art. 725b Abs. 2 OR bei Doppelmandat; Mitwirkung Buchführung bei Tochtergesellschaften als Konzernprüfer.
    RAB: Bei Mitwirkung keine Überschuldungsprüfung durch die Revisionsstelle; Unvereinbarkeit dem VR mitteilen, der VR beauftragt einen Drittprüfer (Rechtsfrage nicht abschliessend
    geklärt; nach HWP ER Rz 53 mit Verweis auf Art. 165 RzU ist die Prüfung mit der Unabhängigkeit vereinbar).'
  quelle: hwp-er-2026__rz-0054-s162
  zitat: vertritt die RAB eine andere Auffassung
  weitere_fundstellen:
  - quelle: rab-unabhaengigkeit__c005-8
    zitat: kann sie bei begründeter Besorgnis einer Überschuldung die Überschuldungsprüfung nicht durchführen
  - quelle: rab-unabhaengigkeit__c005-8
    zitat: Die Revisionsstelle hat die Unvereinbarkeit dem Verwaltungsrat mitzuteilen, der daraufhin einen Drittprüfer beauftragt.
  - quelle: rab-unabhaengigkeit__c005-8
    zitat: Eine abschliessende Klärung der Rechtsfrage durch Gesetzgeber oder Gericht steht allerdings derzeit aus.
  - quelle: hwp-er-2026__rz-0053-s161
    zitat: so ist auch die Prüfung des Zwischenabschlusses gemäss Art. 725b Abs. 2 OR mit der Unabhängigkeit vereinbar
  - quelle: hwp-er-2026__rz-0054-s162
    zitat: Mit dem vorerwähnten Art. 165 RzU hat E
