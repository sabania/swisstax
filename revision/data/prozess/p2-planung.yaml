# Prozessphase p2-planung – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p2-planung
titel: 'Planung: Verständnis, Risiken, Wesentlichkeit, Prüfprogramm'
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 17
    korrigiert: true
ziel: 'Planung vorbereiten, damit der WP in revio 2.x/3.x rasch entscheidet: Revisionspflicht, Unabhängigkeit (Mitwirkung), Verständnis, Abschlussanalyse, Fortführung und Kapital aufbereiten;
  Vorschläge zu Risiko, Wesentlichkeit, Plan und Programm nur auf Anweisung. Vor Prozess 2 prüfen, ob 3.1, 3.3, 3.5 erfasst sind. Nichts festlegen, nichts visieren.'
wann: Nach Wahl bzw. Auftragsbestätigung und nach dem Import der Jahresrechnung (Prozess 1, revio 1.1); in der Testphase erst nach der Importkontrolle durch den WP. Endet mit dem Tor
  vor Prozess 2 (3.1, 3.3 und 3.5 durch den WP erfasst). Bei neuen Erkenntnissen während der Prüfung laufend nachführen.
gesetz:
- thema: Umfang der eingeschränkten Revision (Rahmen für Plan und Programm)
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Pflicht des VR, Unterlagen und Auskünfte zu liefern (Grundlage für die PBC-Liste)
  quelle: or__art-730b
  zitat: Der Verwaltungsrat übergibt der Revisionsstelle alle Unterlagen und erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt
- thema: Dokumentation und Aufbewahrung der Revisionsarbeiten (10 Jahre)
  quelle: or__art-730c
  zitat: Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- thema: 'Revisionspflicht Abs. 1 Ziff. 1: Publikumsgesellschaften (ordentliche Revision)'
  quelle: or__art-727
  zitat: Publikumsgesellschaften
- thema: 'Revisionspflicht Abs. 1 Ziff. 2: Schwellenwerte in zwei aufeinander folgenden Geschäftsjahren'
  quelle: or__art-727
  zitat: Gesellschaften, die zwei der nachstehenden Grössen in zwei aufeinander folgenden Geschäftsjahren überschreiten
- thema: 'Revisionspflicht Abs. 1 Ziff. 3: Konzernrechnungspflicht'
  quelle: or__art-727
  zitat: Gesellschaften, die zur Erstellung einer Konzernrechnung verpflichtet sind.
- thema: 'Revisionspflicht Abs. 2: Begehren von Aktionären mit mindestens 10 %'
  quelle: or__art-727
  zitat: wenn Aktionäre, die zusammen mindestens 10 Prozent des Aktienkapitals vertreten, dies verlangen
- thema: 'GmbH: Aktienrecht für die Revisionsstelle entsprechend anwendbar'
  quelle: or__art-818
  zitat: Für die Revisionsstelle sind die Vorschriften des Aktienrechts entsprechend anwendbar.
- thema: 'GmbH: Gesellschafter mit Nachschusspflicht kann ordentliche Revision verlangen'
  quelle: or__art-818
  zitat: Ein Gesellschafter, der einer Nachschusspflicht unterliegt, kann eine ordentliche Revision der Jahresrechnung verlangen.
- thema: 'Unabhängigkeit: Mitwirkung bei der Buchführung zulässig, aber organisatorische und personelle Massnahmen nötig'
  quelle: or__art-729
  zitat: Sofern das Risiko der Überprüfung eigener Arbeiten entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.
- thema: 'Revisionsbericht: Angaben zur Unabhängigkeit und zur Mitwirkung bei der Buchführung'
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung
- thema: Kapitalverlust als Risikoindikator (qualitative Wesentlichkeit, Going concern)
  quelle: or__art-725a
  zitat: die Aktiven abzüglich der Verbindlichkeiten die Hälfte der Summe aus Aktienkapital, nicht an die Aktionäre zurückzahlbarer gesetzlicher Kapitalreserve und gesetzlicher Gewinnreserve
    nicht mehr decken
- thema: 'Überschuldung: begründete Besorgnis, Zwischenabschlüsse durch den VR'
  quelle: or__art-725b-t1
  zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
- thema: Anzeigepflicht der eingeschränkt prüfenden Revisionsstelle bei offensichtlicher Überschuldung
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: 'Zeitplan AG: ordentliche GV innert sechs Monaten'
  quelle: or__art-699
  zitat: Die ordentliche Generalversammlung findet jährlich innerhalb von sechs Monaten nach Abschluss des Geschäftsjahres statt.
- thema: 'Zeitplan GmbH: ordentliche Gesellschafterversammlung innert sechs Monaten'
  quelle: or__art-805
  zitat: Die ordentliche Versammlung findet alljährlich innerhalb von sechs Monaten nach Schluss des Geschäftsjahres statt.
- thema: 'Zeitplan: Revisionsbericht muss vor dem GV-Beschluss vorliegen'
  quelle: or__art-731
  zitat: muss der Revisionsbericht vorliegen, bevor die Generalversammlung die Jahresrechnung und die Konzernrechnung genehmigt
- thema: 'Folge eines fehlenden Revisionsberichts: Genehmigungs- und Gewinnverwendungsbeschlüsse nichtig'
  quelle: or__art-731
  zitat: so sind die Beschlüsse zur Genehmigung der Jahresrechnung und der Konzernrechnung sowie zur Verwendung des Bilanzgewinnes nichtig
- thema: 'Zeitplan: Geschäftsbericht innert sechs Monaten erstellen'
  quelle: or__art-958
  zitat: Der Geschäftsbericht muss innerhalb von sechs Monaten nach Ablauf des Geschäftsjahres erstellt
schritte:
- was: 'Planungsgrundlagen sichern. Mandatskontext fixieren und prüfen (Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag); bei Abweichung abbrechen und Pendenz erfassen. Bestätigen,
    dass Wahl, Annahmeerklärung und unterzeichnete Auftragsbestätigung vorliegen. Revisionspflicht nach Art. 727 OR vollständig prüfen: Ziff. 1 Publikumsgesellschaft, Ziff. 2 Schwellenwerte
    in zwei aufeinander folgenden Jahren (Rechner `revisionspflicht`; Vollzeitstellen beim Kunden erfragen), Ziff. 3 Konzernrechnungspflicht, Abs. 2 Begehren von Aktionären mit mindestens
    10 % (GmbH: Art. 818 OR, auch Gesellschafter mit Nachschusspflicht). Ferner: gesetzliche Pflicht zu einem anerkannten Standard (Art. 962 OR) führt zur ordentlichen Revision. Trifft
    ein Kriterium zu: Pendenz an den WP (Neudefinition des Auftrags).'
  wer: Agent bereitet vor, WP entscheidet
  revio: revio_open_dossier (Mandatskontext); 2.2 Auftragsannahme und Weiterführung (nur lesen); 1.1 Jahresrechnung (Bilanzsumme und Umsatz GJ und VJ)
  mfiles: Auftragsbestätigung (unterzeichnet), Annahmeerklärung, GV-Protokoll zur Wahl der Revisionsstelle, Handelsregisterauszug, Vorjahresrechnung (Werte VJ)
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: 'Zu Beginn wird ein Kontext-Schlüssel fixiert: Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr und Stichtag.'
  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: bei Abweichung bricht der Agent ab und erfasst eine Pendenz
  - quelle: ser-2022__1-4-1
    zitat: Der Abschlussprüfer vergewissert sich bei Mandatsannahme bzw. vor Prüfungsbeginn, dass die zu prüfende Gesellschaft nicht die Voraussetzungen für eine ordentliche Revision
      erfüllt.
  - quelle: or__art-727
    zitat: Gesellschaften, die zur Erstellung einer Konzernrechnung verpflichtet sind.
  - quelle: or__art-727
    zitat: wenn Aktionäre, die zusammen mindestens 10 Prozent des Aktienkapitals vertreten, dies verlangen
  - quelle: ser-2022__1-6-t1
    zitat: Es ist in diesem Fall eine ordentliche Revision durchzuführen (Art. 962a Abs. 3 OR).
  - quelle: ser-2022__anh-c-s057-1
    zitat: Sollten die Kriterien gemäss Art. 727 OR für eine ordentliche Revision erreicht werden, so muss der Auftrag neu definiert werden.
- was: 'Unabhängigkeit und Mitwirkung bei der Buchführung vorbereiten. Feststellen, ob das Revisionsunternehmen (consis) beim Kunden bei der Buchführung mitwirkt oder andere Dienstleistungen
    mit Selbstprüfungsrisiko erbringt und welche Personen daran beteiligt sind. Mit dem Auftragsteam (3.6) abgleichen: Wer bei der Buchführung mitwirkt, darf nicht an der Revision beteiligt
    sein. Bei Mitwirkung vormerken: Auftragsbestätigung nach SER Anhang C Beispiel 2 und Offenlegung im Revisionsbericht. Ergebnis als Pendenz an den WP; die Beurteilung der Unabhängigkeit
    und ihre Dokumentation (2.4) liegen beim WP.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 2.4 Auftragsvoraussetzungen und Unabhängigkeit (nur lesen; Leserecht offen, Entscheid consis); 3.6 Auftragsteam (rv_get_clientsManagement_LoadTeamMembersForAnnualFile_by_annualFileId
    lesen); Notiz «Pendenz»
  mfiles: Auftragsbestätigungen bzw. Verträge für Buchführung, Steuern und Beratung beim selben Kunden; Auftragsbestätigung Revision
  fundstellen:
  - quelle: or__art-729
    zitat: Sofern das Risiko der Überprüfung eigener Arbeiten entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.
  - quelle: ser-2022__1-3-1
    zitat: Die Person oder Personengruppe, die bei der Buchführung oder anderen Dienstleistungen, bei denen die Gefahr der Selbstprüfung besteht, mitwirkt, darf nicht an der Revision
      beteiligt sein.
  - quelle: ser-2022__anh-c-s059-1
    zitat: Feststellung, dass die Mitwirkung bei der Buchführung personell und organisatorisch getrennt von der Prüfung erfolgt
  - quelle: hwp-er-2026__rz-0047-s160
    zitat: in allen Fällen der Mitwirkung bei der Buchführung diesen Sachverhalt im Revisionsbericht offenlegen
  - quelle: ser-2022__7-2
    zitat: Überlegungen zur Unabhängigkeit;
  - quelle: konzept-ki-revisionsagent-2026__c017-1
    zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
- was: 'Vorjahr und offene Punkte auswerten. Dazu gehören: Prüfungsaussage und Wortlaut des Vorjahresberichts, nicht korrigierte Fehler (6.1 Vorjahr), offene Notizen (Pendenz, Schlussbesprechung,
    Wesentliche Feststellungen) und Empfehlungen. Prüfen, ob systematische Fehler weiter bestehen. Eine Erstprüfung oder ein Opting-out im Vorjahr erkennen und dem WP melden (Eröffnungsbilanzwerte).
    Die Ergebnisse fliessen in die Risikobeurteilung und die Toleranzwesentlichkeit ein.'
  wer: Agent
  revio: rv_get_workpapers_LoadDossierNotesByNoteType; rv_get_auditActivities_LoadPreviousPeriodAuditActivitiesReview_by_containerId_by_templateId; 6.1 Nicht nachgebuchte Fehler im Vorjahresdossier
    (lesen)
  mfiles: Revisionsbericht und Revisionsrapport Vorjahr, PDF-Akte «AP revio» Vorjahr, genehmigte Vorjahresrechnung und GV-Protokoll
  fundstellen:
  - quelle: ser-2022__4-4
    zitat: Er richtet sich dabei in erster Linie nach seinen Kenntnissen aus Prüfungen von Abschlüssen früherer Perioden
  - quelle: hwp-er-2026__rz-0057-s189
    zitat: Wurden im Vorjahr Fehlaussagen aufgrund systematischer Fehler entdeckt, die auch im Berichtsjahr nicht behoben worden sind
  - quelle: ser-2022__6-2-7
    zitat: so hat der neue Abschlussprüfer den Vorjahresangaben eine besondere Aufmerksamkeit zu schenken
  - quelle: hwp-er-2026__rz-0148-s209
    zitat: der Wortlaut des Revisionsberichts der Vorperiode
- was: 'Verständnis von Unternehmen und Umfeld aktualisieren. Zu klären sind: Organisation, Geschäftsmodell, Rechnungswesen, Standorte, Eigentümer und nahestehende Personen, die Arten
    von Vermögenswerten, Verbindlichkeiten, Erträgen und Aufwendungen sowie der anzuwendende Rechnungslegungsrahmen (OR; allenfalls zusätzlich Kern-FER mit negativer Zusicherung; gesetzliche
    Pflicht zu einem anerkannten Standard → ordentliche Revision, siehe Schritt 1). Dazu VR- und GV-Protokolle, Vorjahres- und Zwischenabschlüsse sowie Website und Presse durchsehen.
    Änderungen gegenüber dem Vorjahr und offene Fragen zusammenstellen und den Fragebogen 10.11 als Entwurf vorbereiten; Versand an den Kunden, mündliche Befragung und Betriebsbesichtigung
    nur durch den Menschen. Die Dauerakten auf Aktualität prüfen.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 2.1 Tätigkeit und Umfeld (nur lesen, Eintrag durch WP; Leserecht offen, Entscheid consis); Prüfschritt A1-304; 10.9 Protokolle; 10.11 Kundenbefragung (rv_get_workpapers_LoadLocalQuestionnaire,
    Vorlagen rv_get_workpapers_LoadQuestionnaireTemplates nur lesen)
  mfiles: VR- und GV-Protokolle, Zwischenabschlüsse, Statuten, Handelsregisterauszug, wichtige Verträge (Dauerakten)
  fundstellen:
  - quelle: ser-2022__3-1
    zitat: Diese Kenntnisse umfassen beispielsweise die Organisation, die wichtigsten Elemente des Geschäftsmodells, das Rechnungswesen, die Standorte, die Eigentümer und sonstige nahestehende
      Personen
  - quelle: ser-2022__1-6-t1
    zitat: Falls die obligationenrechtliche Jahresrechnung zugleich den Anforderungen eines anerkannten Standards zur Rechnungslegung (z. B. Kern-FER) entspricht
  - quelle: hwp-er-2026__rz-0148-s209
    zitat: Die anzuwendenden Rechnungslegungsgrundsätze
  - quelle: hwp-er-2026__rz-0026-s182
    zitat: Durchsicht von Vorjahres- und Zwischenabschlüssen sowie Verwaltungsrats- und Generalversammlungsprotokollen
  - quelle: katalog-revio4__c003-4
    zitat: GV- und VR-Protokolle lesen und wichtige Sachverhalte mit möglicher Auswirkung auf die Jahresrechnung im Prüfungsplan berücksichtigen.
  - quelle: ser-2022__7-3
    zitat: über mehrere Jahre gültige wichtige Verträge, Registerauszüge, Statuten usw.
  - quelle: konzept-ki-revisionsagent-2026__c012-1
    zitat: 'Kann nicht selbst befragen: wertet schriftliche Antworten aus (z. B. 10.11 Kundenbefragung)'
  - quelle: konzept-ki-revisionsagent-2026__c009-3
    zitat: ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand
- was: 'Abschlussanalyse für die Planung. Bilanz und Erfolgsrechnung mit dem Vorjahr und, wenn vorhanden, mit dem Budget vergleichen. Kennzahlen rechnen: Margen, Liquiditätsgrade, Umschlagshäufigkeiten,
    EK-Anteil. Nicht-finanzielle Grössen wie Mengen und Personalbestand einbeziehen und Erwartungswerte bilden. Ungewöhnliche oder unerwartete Abweichungen je Prüffeld als mögliche Risikobereiche
    auflisten. Gerechnet wird nur im Rechenmodul.'
  wer: Agent
  revio: 1.2 Kennzahlen und Dashboard (rv_get_financialStatement_LoadKeyFigureView, rv_get_financialStatement_LoadKeyFigureItems); 3.2 Abschlussanalyse (rv_get_workpapers_LoadAnalyticalAuditProcedure,
    Kandidat; Würdigung durch WP)
  mfiles: Bilanz und ER (provisorisch oder definitiv), Saldenbilanz, Budget, Vorjahresrechnung
  fundstellen:
  - quelle: ser-2022__3-2
    zitat: Der Abschlussprüfer muss in der Planungsphase der Prüfung analytische Prüfungshandlungen durchführen
  - quelle: hwp-er-2026__rz-0031-s183
    zitat: Vergleiche wichtiger Kennzahlen (Margen, Liquiditätsgrade, Umschlagshäufigkeiten im Umlaufvermögen, Eigenkapitalanteil etc.) sind in der Regel nützlich und effizient.
  - quelle: hwp-er-2026__rz-0029-s183
    zitat: Erwartungswerte können etwa abgeleitet werden aus Branchenkennzahlen
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: 'Rechenmodul: Bilanzgleichheit, Totale, Vorjahresdifferenzen, OP-Altersstruktur, Delkredere und Kennzahlen laufen in Code, nicht im Sprachmodell.'
- was: 'Hinweise zu Fortführung und Kapital früh erkennen. Kapitalverlust (Art. 725a OR) und Überschuldung (Art. 725b OR) mit dem Rechner `kapitalverlust` nachrechnen; Rangrücktritte
    gesondert zeigen. Liquidität und Ereignisse nach SER Anhang G sichten. Den Befund mit Zahlen als Notiz «Pendenz» an den WP melden (Planungshinweis für 3.4; wirkt auf qualitative
    Wesentlichkeit und Gesamtrisiko). Bei Hinweisen auf eine offensichtliche Überschuldung sofort melden: Die Erinnerung des VR an seine Pflichten und eine allfällige Anzeige ans Gericht
    (Art. 729c OR) beurteilt der WP.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 3.4 Going concern (nur lesen; Leserecht offen, Entscheid consis); 1.1 Jahresrechnung; Prüfschritt A1-205; Notiz «Pendenz»
  mfiles: Liquiditätsplanung oder Budget, Rangrücktrittsvereinbarungen, Finanzierungsverträge, Zwischenabschlüsse
  fundstellen:
  - quelle: ser-2022__3-3
    zitat: Gewisse Risiken, z. B. die Fortführungsfähigkeit (Anhang G), beziehen sich nicht auf einzelne Bilanzpositionen
  - quelle: ser-2022__anh-g-s138-1
    zitat: Die Unternehmensleitung hat die Einschätzung der Fortführungsfähigkeit für einen Zeitraum von mindestens zwölf Monaten ab dem Bilanzstichtag vorzunehmen
  - quelle: hwp-er-2026__rz-0036-s184
    zitat: das Fehlen eines ausreichenden Betriebskapitals für die Fortführung der Geschäftstätigkeit
  - quelle: or__art-725b-t1
    zitat: Besteht begründete Besorgnis, dass die Verbindlichkeiten der Gesellschaft nicht mehr durch die Aktiven gedeckt sind
  - quelle: ser-2022__9-t3
    zitat: muss sie den Verwaltungsrat an seine Pflichten
  - quelle: ser-2022__9-t3
    zitat: Die diesbezügliche Anzeigepflicht beschränkt sich auf die Benachrichtigung des Richters, wenn dies der Verwaltungsrat trotz offensichtlicher Überschuldung unterlässt.
  - quelle: or__art-729c
    zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- was: 'Nur auf Anweisung des WP (Praxis/intern; im Konzept liest der Agent 3.1 nur): Risikobeurteilung je Prüffeld und Aussage vorschlagen, vernachlässigbar, normal oder erhöht, jeweils
    mit Begründung. Massgebend sind: Abhängigkeit von zukünftigen Ereignissen und Entscheiden, Komplexität, Anfälligkeit auf Wertschwankungen, Ermessensspielräume, einmalige oder aussergewöhnliche
    Ereignisse, die Ergebnisse der vorherigen Schritte und bekannte Schwächen (z. B. Funktionentrennung). Kein Urteil zu IKS oder Kontrollrisiko, keine Deliktsrisiken. Bei erhöhtem Risiko
    mögliche weitergehende Prüfungshandlungen kennzeichnen.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 3.1 Risikobeurteilung pro Prüffeld (rv_get_workpapers_LoadRiskAssessments lesen; Leserecht offen; rv_put_workpapers_UpdateRiskAssessmentArea nur WP)
  mfiles: ''
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c006-1
    zitat: Alle anderen Bereiche liest er höchstens
  - quelle: ser-2022__3-3
    zitat: welche Aussagen im Abschluss vernachlässigbare, normale oder erhöhte inhärente Risiken einer wesentlichen Fehlaussage
  - quelle: ser-2022__3-3
    zitat: Abhängigkeit von zukünftigen Ereignissen und Entscheiden
  - quelle: ser-2022__3-3
    zitat: Komplexität der zugrunde liegenden Geschäftsvorfälle
  - quelle: ser-2022__3-3
    zitat: Anfälligkeit auf Wertschwankungen durch externe Einflüsse
  - quelle: ser-2022__3-3
    zitat: Ausmass von Ermessensspielräumen
  - quelle: hwp-er-2026__rz-0036-s184
    zitat: Gewisse inhärente Risiken aus einmaligen oder aussergewöhnlichen Ereignissen
  - quelle: hwp-er-2026__rz-0019-s181
    zitat: Folglich entspricht bei der eingeschränkten Revision das Fehlerrisiko allein dem inhärenten Risiko.
  - quelle: hwp-er-2026__rz-0032-s183
    zitat: mangelnde Funktionentrennung oder eine mit ungeeigneten Mitteln geführte Buchhaltung das Risiko wesentlicher Fehlaussagen erhöhen
  - quelle: ser-2022__3-3
    zitat: Einem erhöhten inhärenten Risiko ist mit weiter gehenden Prüfungshandlungen Rechnung zu tragen.
- was: 'Nur auf Anweisung des WP (Praxis/intern; im Konzept und Flussdiagramm liest der Agent 3.3 nur): Wesentlichkeitsvorschlag vorbereiten (Rechner `wesentlichkeit`). Bezugsgrösse
    nach dem Unternehmensmerkmal wählen und den Richtwert nach HWP ER Abb. 20 zeigen: profitabel mit stabilen Umsätzen und Ergebnissen → 3–10 % des Jahresgewinns vor Steuern nach Berücksichtigung
    stiller Reserven; Verlustsituation → 3–5 % des Eigenkapitals; anlageintensiv (z. B. Holding), auch mit Verlusten in Vorperioden → 1–3 % der Bilanzsumme; volatile Ergebnisse → 1–3
    % der Umsätze; nicht gewinnorientiert → 1–3 % der Gesamtaufwendungen; Start-up → 2–5 % der operativen Aufwendungen. Qualitative Faktoren nennen, die eher eine tiefere Wesentlichkeit
    verlangen: drohende Illiquidität oder Überschuldung, kleiner Fehler kippt Gewinn in Verlust, Aktionärsbindungsvertrag, Finanzierungsvereinbarungen, geplante Ausschüttung. Faktoren
    für das obere Ende nennen: wenige, langfristig orientierte Eigentümer, geringe Fremdverschuldung, stabile Erträge. Wo nötig spezifische Wesentlichkeiten, TW und NAG vorschlagen.
    Nach der Festlegung durch den WP: 3.3 nur lesen und prüfen, ob Bezugsgrösse, Prozentsatz und Begründung zusammenpassen; ein Widerspruch wird als Pendenz erfasst.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 3.3 Wesentlichkeit (rv_get_workpapers_LoadMateriality, rv_get_workpapers_LoadMaterialityOfDossier lesen; rv_put_workpapers_UpdateMateriality und rv_post_workpapers_SetMaterialitySealState
    nur WP); 10.3 Stille Reserven
  mfiles: Nachweis der stillen Reserven; Hochrechnung oder Budget bei provisorischer Jahresrechnung
  fundstellen:
  - quelle: flussdiagramm-revisionsagent-2026__s001-2
    zitat: Wesentlichkeit aus 3.3 lesen
  - quelle: hwp-er-2026__rz-0042-s185-t1
    zitat: 3 % – 10 % des bereinigten Jahresgewinns vor Steuern
  - quelle: hwp-er-2026__rz-0042-s185-t1
    zitat: nach Berücksichtigung allfälliger stiller Reserven
  - quelle: hwp-er-2026__rz-0042-s185-t1
    zitat: Gewinnorientiertes Unter nehmen in Verlustsituation
