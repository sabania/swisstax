- text: Revisionspflicht nach Art. 727 OR (Ziff. 1–3, Abs. 2; GmbH Art. 818 OR) beurteilen; sind die Kriterien erfüllt, eingeschränkte Revision ablehnen bzw. Auftrag neu definieren.
