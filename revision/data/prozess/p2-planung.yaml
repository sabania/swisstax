- was: 'Zeitplan und Organisation vorbereiten. Vom GV-Termin rückwärts planen: Die ordentliche GV (AG) bzw. Gesellschafterversammlung (GmbH) findet spätestens sechs Monate nach dem Bilanzstichtag
    statt; der Geschäftsbericht ist innert derselben Frist zu erstellen. Der Revisionsbericht muss vor dem Genehmigungsbeschluss vorliegen, sonst sind die Beschlüsse zur Genehmigung
    und zur Gewinnverwendung nichtig. Daraus Termine für Unterlagen, Feldarbeit, Schlussbesprechung und Bericht ableiten. Ansprechpartner, Verfügbarkeit, Team und Infrastruktur als Fragen
