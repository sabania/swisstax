dokumentation:
- text: 'Zu dokumentieren sind gemäss SER 7.2: Überlegungen zur Unabhängigkeit, Verständnis vom Unternehmen, Überlegungen zur Wesentlichkeit, Ergebnisse der Planungsanalytik, inhärentes
    Risiko mit dem darauf gestützten Prüfungsplan, Prüfprogramm.'
  quelle: ser-2022__7-2
  zitat: das inhärente Risiko sowie der darauf basierende Prüfungsplan;
- text: Überlegungen zur Unabhängigkeit festhalten, einschliesslich Mitwirkung bei der Buchführung und personeller Trennung (Vorbereitung durch den Agenten, Beurteilung durch den WP).
  quelle: ser-2022__7-2
  zitat: Überlegungen zur Unabhängigkeit;
- text: Prüfung der Revisionspflicht (Art. 727 OR) mit den Zahlen GJ und VJ in der Planungsnotiz festhalten.
  quelle: ser-2022__1-4-1
  zitat: Der Abschlussprüfer vergewissert sich bei Mandatsannahme bzw. vor Prüfungsbeginn, dass die zu prüfende Gesellschaft nicht die Voraussetzungen für eine ordentliche Revision erfüllt.
- text: Planung und Durchführung dokumentieren; die wichtigsten Dokumente datieren und mit dem Vermerk des Autors versehen.
  quelle: ser-2022__7-1
  zitat: Die wichtigsten Dokumente sind zu datieren und mit einem Vermerk des Autors
- text: Die Wesentlichkeit wird in revio 3.3 mit Bezugsgrösse, Prozentsatz und Begründung erfasst (durch den WP). Der Agent verweist nur darauf.
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: revio 4.0 berechnet sie aus einer gewählten Bezugsgrösse, einem Prozentsatz und einer Begründung.
- text: Offene Punkte als Notiz «Pendenz» erfassen, mit Konto, Datum und Betrag. Notizen löscht oder erledigt der Agent nie.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Fehlende Unterlagen, ungeklärte Sachverhalte, nicht verfügbare Belege mit Konto, Datum und Betrag
- text: Hinweise auf Schwächen im Ablauf als Notiz «Schlussbesprechung» für den WP festhalten.
  quelle: hwp-er-2026__rz-0033-s183
  zitat: anlässlich der Schlussbesprechung an die Unternehmensleitung weitergegeben werden können
- text: Agenten-Protokoll (Audit Trail) mit Quellen, Berechnungen und dem Ergebnis der Torprüfung vor Prozess 2 pro Mandat und Jahr in M-Files ablegen.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Jede Aktion, Quelle, Berechnung und jeder Fehler mit Zeitstempel, abgelegt pro Mandat und Jahr in M-Files.
- text: Aufbewahrung der wesentlichen Unterlagen während mindestens zehn Jahren.
  quelle: or__art-730c
  zitat: Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
fallstricke:
- text: 'Revisionspflicht nicht auf die Schwellenwerte verkürzen: Auch Publikumsgesellschaft, Konzernrechnungspflicht und das Begehren von Aktionären mit mindestens 10 % führen zur ordentlichen
    Revision.'
  quelle: or__art-727
  zitat: wenn Aktionäre, die zusammen mindestens 10 Prozent des Aktienkapitals vertreten, dies verlangen
- text: 'Mitwirkung bei der Buchführung durch das eigene Treuhandunternehmen nicht übersehen: Wer bei der Buchführung mitwirkt, darf nicht an der Revision beteiligt sein.'
  quelle: ser-2022__1-3-1
  zitat: Die Person oder Personengruppe, die bei der Buchführung oder anderen Dienstleistungen, bei denen die Gefahr der Selbstprüfung besteht, mitwirkt, darf nicht an der Revision beteiligt
    sein.
- text: Ist das Ergebnis über stille Reserven gesteuert, die Wesentlichkeit nicht auf dem ausgewiesenen Gewinn rechnen, sondern auf dem effektiven Ergebnis.
  quelle: ser-2022__5-2-t1
  zitat: Sind die Ergebnisse gesteuert – z. B. durch Bildung oder Auflösung von stillen Reserven – ist vom effektiven Ergebnis auszugehen.
- text: In Verlustsituationen, bei Holdings oder Start-ups passt der Gewinn als Bezugsgrösse nicht; EK, Bilanzsumme, Umsatz oder Aufwand prüfen.
  quelle: ser-2022__5-2-t1
  zitat: herangezogen werden (z. B. in Verlustsituationen)
- text: 'Bandbreiten nur mit dem passenden Unternehmensmerkmal verwenden: 3–5 % des Eigenkapitals gilt für ein gewinnorientiertes Unternehmen in Verlustsituation, nicht allgemein.'
  quelle: hwp-er-2026__rz-0042-s185-t1
  zitat: Gewinnorientiertes Unter nehmen in Verlustsituation
- text: Bei einer Hochrechnung kann ein Sicherheitsabschlag angezeigt sein (illustratives Beispiel HWP ER Abb. 21, kein fester Satz); die Festlegung trifft der WP. Sobald die definitive
    Jahresrechnung vorliegt, neu beurteilen lassen.
  quelle: hwp-er-2026__rz-0052-s188-t1
  zitat: Illustratives Beispiel für die Festlegung der einzelnen Grössen
- text: Die consis/revio-Vorgabe für die TW (75 %) liegt am oberen Ende der HWP-Bandbreite. Bei Fehlern im Vorjahr oder hoher Schätzunsicherheit dem WP einen tieferen Wert zur Prüfung
    vorlegen, nicht selbst ändern.
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: 'Toleranzwesentlichkeit (75 %): steuert Prüfumfang und Stichprobe.'
- text: Ein kleiner Betrag beweist keine Vollständigkeit; das gilt besonders bei Rückstellungen. Kleine Positionen deshalb nicht pauschal aus dem Plan streichen.
  quelle: hwp-er-2026__rz-0060-s190
  zitat: So ist beispielsweise eine im Betrag unbedeutende Rückstellung kein verlässliches Indiz dafür
- text: 'Keine IKS- oder IT-Prüfung und keine Deliktsrisiken einplanen: Beides gehört nicht zur eingeschränkten Revision.'
  quelle: hwp-er-2026__rz-0012-s180
  zitat: Bei der eingeschränkten Revision wird das Risiko deliktischer Handlungen nicht berücksichtigt
- text: Die Bereiche 2 und 3 liest der Agent höchstens (Leserechte für 2.1, 2.4, 3.1, 3.4 und 3.5 noch offen). Wesentlichkeit, Risiko und Strategie trägt er nie selbst ein; Planungsvorschläge
    nur auf Anweisung des WP.
  quelle: konzept-ki-revisionsagent-2026__c006-1
  zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10). Alle anderen Bereiche liest er höchstens
- text: 'Prozess 2 nicht beginnen, solange 3.1, 3.3 und 3.5 nicht erfasst sind oder in der Testphase die Importkontrolle aussteht: Eine falsche Kontenzuordnung verfälscht alle Folgeprüfungen.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: In der Testphase ein Halt nach dem Import, weil eine falsche Kontenzuordnung alle Folgeprüfungen verfälscht.
- text: Keine PBC-Einladung, kein Fragebogen und keine E-Mail an den Kunden; Mails gehen nur als Entwurf oder an die freigegebene WP-Adresse.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: 'E-Mail: in der Testphase nur Entwurf oder Versand an eine fixe WP-Adresse, nie an Kunden.'
- text: 'Erstprüfung oder Opting-out im Vorjahr früh erkennen: Das hat Folgen für Umfang und Bericht.'
  quelle: ser-2022__6-2-7
  zitat: ist im Revisionsbericht anzumerken
- text: Fehlende Unterlagen früh anfordern lassen. Bleiben sie aus, droht eine modifizierte Prüfungsaussage.
  quelle: hwp-er-2026__rz-0066-s191
  zitat: wird dies in der Berichterstattung zu einer Modifizierung der Prüfungsaussage führen
- text: 'Prüffeld-Bezeichnungen aus dem Katalog verwenden: SCH1–SCH5 sind Prüffelder der Erfolgsrechnung (z. B. SCH1 Betrieblicher Ertrag), nicht «Schlussarbeiten».'
  quelle: katalog-revio4__c004-3
  zitat: Betrieblicher Ertrag
- text: Das Prüfzielkürzel RI ist nicht bestätigt; in Begründungen nicht als gesichert verwenden.
  quelle: katalog-revio4__c002-2
  zitat: vermutlich Richtigkeit / Genauigkeit – zu bestätigen
- text: 'Kritische Grundhaltung schon in der Planung: Auskünfte und Unterlagen dürfen nur mangels gegenteiliger Hinweise als richtig gelten; Widersprüche als Pendenz melden.'
  quelle: ser-2022__1-2-t2
  zitat: Er kann mangels gegenteiliger Hinweise von der Richtigkeit erhaltener Auskünfte und Unterlagen ausgehen
fragen_kunde:
- frage: Wie viele Vollzeitstellen im Jahresdurchschnitt hatte die Gesellschaft im Geschäftsjahr und im Vorjahr? Besteht eine Konzernrechnungspflicht? Sind Beteiligungspapiere kotiert
    oder Anleihen ausstehend? Hat ein Aktionär (bzw. GmbH-Gesellschafter mit Nachschusspflicht) eine ordentliche Revision verlangt?
  zweck: Revisionspflicht nach Art. 727 OR vollständig prüfen (SER 1.4.1)
- frage: Nach welchem Regelwerk wird die Jahresrechnung erstellt (OR, zusätzlich Kern-FER oder Swiss GAAP FER)? Besteht eine gesetzliche Pflicht zu einem anerkannten Standard?
  zweck: Rechnungslegungsrahmen und Prüfungsgegenstand bestimmen (SER 1.6; HWP ER Rz 148)
- frage: Gab es im Geschäftsjahr wesentliche Änderungen bei Geschäftsmodell, Organisation, Standorten, Eigentümern oder nahestehenden Personen?
  zweck: Verständnis aktualisieren, Risiken und Nahestehende erkennen (SER 3.1)
- frage: Gab es einmalige oder aussergewöhnliche Ereignisse, z. B. Stilllegungen, Sanierungen, Akquisitionen oder neue Geschäftsfelder?
  zweck: Inhärente Risiken auf mehrere Aussagen oder auf den Abschluss als Ganzes erkennen
- frage: Wurden Darstellung oder Bewertungsgrundsätze der Jahresrechnung geändert?
  zweck: Stetigkeit; Prüfschritt A1-101; Vergleichbarkeit mit dem Vorjahr
- frage: Wurden stille Reserven gebildet oder aufgelöst (Betrag, Positionen)?
  zweck: Bereinigten Gewinn vor Steuern als Bezugsgrösse der Wesentlichkeit bestimmen
- frage: Gibt es eine Liquiditätsplanung für mindestens zwölf Monate? Bestehen Rangrücktritte, Finanzierungsauflagen, Aktionärsbindungsverträge oder geplante Ausschüttungen?
  zweck: Going concern, Kapitalverlust und Überschuldung, qualitative Wesentlichkeit, spezifische Wesentlichkeitsgrenzen
- frage: Stützt sich die Jahresrechnung auf Gutachten oder Expertenberichte (z. B. Liegenschaftsbewertung, Rechtsgutachten)?
  zweck: Verwendung von Arbeiten Dritter bzw. Experten planen (SER 4.1)
- frage: Wurden die Feststellungen, Korrekturvorschläge und Empfehlungen aus der Vorjahresrevision umgesetzt?
  zweck: Vorjahr und Pendenzen; systematische Fehler erkennen
- frage: Wer sind die Ansprechpartner und wann sind sie verfügbar? Bis wann liegt die definitive Jahresrechnung vor, und wann findet die GV bzw. Gesellschafterversammlung statt?
  zweck: Zeitplan und Organisation der Revision
- frage: Welche Unterlagen und Dateien können bis wann bereitgestellt werden, z. B. Saldenbilanz, OP-Listen, Anlagespiegel, Bank- und Depotauszüge, MWST-Abrechnungen, Protokolle?
  zweck: PBC-Liste und Termine
- frage: Sind Rechtsfälle, Einsprachen oder Rekurse (auch in Steuersachen) hängig?
  zweck: Risiken für Rückstellungen und Steuern (Prüfschritt S1-104)
- frage: Gibt es Budget, Branchenkennzahlen und nicht-finanzielle Daten wie Mengen oder Personalbestand?
  zweck: Erwartungswerte für die analytischen Prüfungshandlungen in der Planung
- frage: Wer führt die Buchhaltung und mit welchem System? Wie ist die Funktionentrennung geregelt?
  zweck: Bekannte Schwächen in die Risikobeurteilung einbeziehen (ohne IKS-Prüfung); Mitwirkung bei der Buchführung erkennen
