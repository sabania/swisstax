- was: 'Nur auf Anweisung des WP (Praxis/intern): Prüfprogramm vorschlagen. Die Planung betrifft alle Prüffelder A1–T1; je Prüffeld aus dem revio-Katalog die Schritte wählen, die zu
    Risiko und Wesentlichkeit passen (Typ 1xx Befragung, 2xx Analytik, 3xx Detailprüfung, 4xx Sonstige; Prüfziele; EP/WP): empfohlene Handlungen für wesentliche Positionen, weitergehende
    bei erhöhtem Risiko, wirksame und effiziente Nachweise (z. B. Depotauszug). 4xx-Schritte (Bestätigungen, Inventur, Gutachten) nur auf Anweisung, physische Tätigkeiten nie. Stützt
    sich die Jahresrechnung auf Arbeiten Dritter oder Experten (z. B. Gutachten), dies dem WP melden; er beurteilt deren Eignung. Jede Auswahl begründen. Welche Schritte im Umfang sind
    und wie WP-Schritte behandelt werden, entscheidet der WP; er nimmt auch die summarische Schlussbeurteilung des Programms vor. Verknüpft sind die Prüffelder mit direktem Planungsbezug
    (A1 Allgemeines, P1 Eigenkapital/Kapitalverlust, S1 Steuern, T1 Anhang) und die Beispiele dieses Eintrags (C1, G1, H1, M2, M3, O1).'
