- text: Import und Kontenzuordnung kontrollieren und «weiter» geben (Halt, nur Testphase).
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: In der Testphase ein Halt nach dem Import, weil eine falsche Kontenzuordnung alle Folgeprüfungen verfälscht.
- text: Ob WP-Schritte vorbereitet werden und welche Schritte als «markiert» gelten (Entscheid consis). Das steuert «Schritt im Umfang?».
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Darf der Agent WP-Schritte (Wirtschaftsprüfer) vorbereiten, oder lässt er sie aus?
- text: Vorgaben zur Stichprobe pro Mandat oder Prüffeld (pflichtgemässes Ermessen). Der Agent übernimmt sie und begründet seine Standardauswahl.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: begründet die Auswahl im Textfeld und übernimmt Vorgaben des Wirtschaftsprüfers pro Mandat oder Prüffeld
- text: 'Weitergehende Handlungen (4xx: Bestätigungen, Inventur, Gutachten, JET) nur auf Anweisung.'
