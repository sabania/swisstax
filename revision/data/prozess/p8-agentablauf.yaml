fallstricke:
- text: Eine falsche Kontenzuordnung im Import verfälscht alle Folgeprüfungen. Deshalb gilt in der Testphase ein Halt, und Abstimmungen laufen im Rechenmodul.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: In der Testphase ein Halt nach dem Import, weil eine falsche Kontenzuordnung alle Folgeprüfungen verfälscht.
- text: 'Import ausserhalb der Schreibgrenze: Prozess 1 wirkt in 1.1, der Agent schreibt aber nur in 4 und 10. Bis zum Entscheid consis nur simulieren; AcceptImport und Werteänderungen
    (InvertValuesForPeriod) nie.'
  quelle: konzept-ki-revisionsagent-2026__c006-1
  zitat: Der Agent arbeitet schreibend nur in den Prüffeldern (Bereich 4) und in den Unterlagen zum Abschluss (Bereich 10).
- text: 'Mandats- oder Jahresverwechslung: jeden Zugriff und jede Ablage gegen den Kontext-Schlüssel prüfen; bei Abweichung abbrechen.'
  quelle: konzept-ki-revisionsagent-2026__c009-1
  zitat: bei Abweichung bricht der Agent ab und erfasst eine Pendenz
- text: Fehlende Daten nie erfinden; stattdessen eine Pendenz erfassen.
  quelle: konzept-ki-revisionsagent-2026__c005-1
  zitat: fehlende Daten dürfen nicht erfunden werden
- text: Unscharfe Vorgaben («risikoorientiert», «unter Berücksichtigung der Wesentlichkeit») führen ohne feste Regeln zu je nach Lauf verschiedenen Ergebnissen.
  quelle: konzept-ki-revisionsagent-2026__c005-1
  zitat: in prüfbare Regeln übersetzt werden, sonst fällt das Ergebnis je nach Lauf anders aus
- text: Sind qualitative Faktoren oder besondere Umstände erfasst, auch kleinere Abweichungen melden. Nicht nur die Gesamtwesentlichkeit zählt.
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: 'Qualitative Faktoren und besondere Umstände: Wenn erfasst, meldet der Agent auch kleinere Abweichungen.'
- text: Gesperrte revio-Werkzeuge mit verlockenden Namen nie aufrufen (vollständige Liste wiki/revio/werkzeuge-nur-mensch.md), z. B. SealAnualFile, RequestSeal, ArchiveDossier, ApproveGlobalDossierReview,
    DeleteNote, SendPbcInviteMail, StorePbcWorkspace, UpdateMateriality, SetMaterialitySealState, *VisaState, AcceptImport, InvertValuesForPeriod, SetAuditActivitySelectionState, ProcessAreaState,
    UpdateDossierState, NoteChanged, MoveNotes, CreateNoteFeedback, SetPeriodSealedState, StoreProtocolContent – und nie revio_call (generischer Aufruf umgeht alle Sperren). Der Dienstbenutzer
    hat diese Rechte nicht.
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Eigener Dienstbenutzer in revio 4.0 und M-Files ohne Recht für Visum, Abschlussstatus, Freigabe und Kundenversand; Löschrechte eingeschränkt.
- text: 'Erlaubte Schreibwerkzeuge tragen gefährliche Felder: UpdateDossierActivity (isVised, visaDate, visaText, visaUserId → nie setzen), UpdateNote (isClosed immer false, nur eigene
    Notizen, Kategorie Review nie), GeneratePdfReport (isArchiveJob=false; standardmässig gesperrt, nur je Auftrag befristet). OpenClaw sperrt nur je Werkzeug; die Feldregeln prüft der
    Agenten-Code vor dem Aufruf (Praxis/intern, data/revio/werkzeuge.csv).'
- text: Die revio-MCP-Werkzeugliste (raw/revio) enthält keine Beschreibungen; massgebend ist die interne Klassifikation (lesen, vorbereiten, nur Mensch, unklar, gesperrt). «Unklar» heisst
    nicht verwenden (z. B. StoreContainerDocuments_by_areaId). Offene Semantik (z. B. ob UpdateNote mit leerer id eine Notiz anlegt, ob MoveDetachedAttachmentsToWorkingArea in 10.9 ablegt)
    im Machbarkeitstest einzeln bestätigen. Nie direkt in die Datenbank schreiben.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: PDF-Import, Kontenzuordnung, Textfeld pro Schritt, Notizen, Belegablage, Bereich 10 und PDF-Akte sind einzeln auf Machbarkeit zu testen.
- text: revio-Updates auf dem Agenten-Arbeitsplatz erst nach einem Test einspielen, weil die Oberflächenautomation bei Updates bricht.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: Updates werden deshalb auf dem Agenten-Arbeitsplatz erst nach einem Test eingespielt.
- text: Befragung allein reicht für wesentliche Posten nicht. Befragungsschritte ohne schriftliche Antwort bleiben höchstens «teilweise bearbeitet».
  quelle: ser-2022__6-1-1-t1
  zitat: Der Abschlussprüfer darf sich bei der Prüfung wesentlicher Jahresabschlussposten nicht ausschliesslich auf Befragungen stützen.
- text: Die Statusdefinitionen («vorbereitet» oder «teilweise bearbeitet») sind noch offen. Bis zum Entscheid im Zweifel den tieferen Status wählen und das begründen.
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Ab wann ist ein Schritt «vorbereitet» statt «teilweise bearbeitet», insbesondere bei Befragungen?
- text: Das Prüfziel-Kürzel RI ist unbestätigt. Nicht als gesichert verwenden.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: RI vermutlich Richtigkeit/Genauigkeit (zu bestätigen)
- text: 'Vorjahreskopie des GVB kann überholten Text enthalten: Der Normalwortlaut wurde sprachlich angepasst (SER 2022 «Danach …», Muster HWP ER 2026 «Demnach …»). Wortlaut, Adressat
    je Rechtsform und Pflichtangaben prüfen und Abweichungen markieren.'
  quelle: muster-hwp-er-2026__c001-1
  zitat: Wir weisen darauf hin, dass im Normalwortlaut eine sprachliche Anpassung vorgenommen wurde
- text: Kapitalverlust oder Überschuldung sind als solche keine Gesetzesverletzung, auf die hingewiesen werden muss; sie gehören als Zusatz in den Bericht. Ein Hinweis folgt erst, wenn
    der VR seine Pflichten verletzt (Entscheid WP).
  quelle: hwp-er-2026__rz-0447-s130
  zitat: sind als solche keine Gesetzesverletzungen
- text: GVB-Vorjahresoriginal und frühere PDF-Akten nie überschreiben; immer Kopie bzw. neue Ablage mit bestätigtem Speicherort.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Keine Unterzeichnung, keine Datierung; Vorjahresoriginale unverändert
- text: Nach Fertigstellung der endgültigen Akte nichts mehr entfernen. Spätere Änderungen nur mit Angabe von Wer, Wann und Grund.
  quelle: hwp-er-2026__rz-0286-s248
  zitat: sollte der Abschlussprüfer bis zum Ablauf der Aufbewahrungsfrist keine Dokumentationen mehr entfernen oder aussortieren
- text: E-Mail nie an Kunden, nur als Entwurf oder an die fixe WP-Adresse. Datenschutz und Berufsgeheimnis vor dem ersten Test mit Echtdaten regeln.
  quelle: konzept-ki-revisionsagent-2026__c009-2
  zitat: 'E-Mail: in der Testphase nur Entwurf oder Versand an eine fixe WP-Adresse, nie an Kunden.'
- text: 'Abgleich Flussdiagramm und Konzept (Praxis/intern): Beide stimmen überein (6 Prozesse, 5 WP-Entscheide, Halt nach Import nur in der Testphase), mit drei Nuancen. (1) Das Diagramm
    prüft beim Import auch die «Perioden» und zeigt «Pendenz erfassen – Halt bis Klärung»; das Konzept nennt nur Pendenz bei unklarer Zuordnung und Halt zur Kontrolle (Testphase). (2)
    Bei unklarem Kontext zeigt das Diagramm «Abbruch und Meldung – Klärung durch WP», das Konzept Abbruch plus Pendenz. (3) Prozess 6 läuft im Diagramm über das «revio-Dashboard». Bei
    Abweichungen die strengere Variante anwenden (z. B. Halt bis Klärung) und den WP entscheiden lassen. Massgebend ist das Pflichtenheft, das bei Widersprüchen auch dem Konzept vorgeht.'
  quelle: konzept-ki-revisionsagent-2026__c003-1
  zitat: bei Widersprüchen gilt das Pflichtenheft
fragen_kunde:
- frage: Welche Version der Jahresrechnung (Bilanz, Erfolgsrechnung, Anhang, Antrag über die Verwendung des Bilanzgewinns) ist definitiv, und ist sie vom VR unterzeichnet und in M-Files
    abgelegt?
  zweck: Prozess 1 (Import nur der definitiven Fassung); Antrag Gewinnverwendung (Art. 729a OR); unterzeichnete Jahresrechnung für 10.4; frühestes Berichtsdatum. Die Frage geht über
    den WP, der Agent hat keinen Kundenkontakt.
- frage: Liegen das GV-Protokoll des Vorjahres (Genehmigung Jahresrechnung, Gewinnverwendung, Wahl der Revisionsstelle) und die VR-Protokolle des Geschäftsjahres und seit dem Bilanzstichtag
    vor?
  zweck: Prozess 3 (Ablage 10.9); Abstimmung der Reserven und des Bilanzgewinns mit dem GV-Protokoll (P1, A1); Ereignisse nach dem Bilanzstichtag.
- frage: Gab es Änderungen in der Darstellung der Jahresrechnung oder in den Bewertungsgrundsätzen gegenüber dem Vorjahr?
  zweck: Befragungsschritt A1 (SER Anhang D a); Stetigkeit. Schriftlich über 10.11, sonst Pendenz.
- frage: Sind nach dem Bilanzstichtag bis heute wesentliche Ereignisse eingetreten, oder bestehen bedeutende schwebende Geschäfte mit Verlustrisiko (z. B. Prozesse, Garantien)?
  zweck: Ereignisse bis zum Berichtsdatum (SER 8.6, Anhang D v); schriftlich über 10.11 bzw. über den WP, sonst Pendenz.
- frage: Wie schätzt die Unternehmensleitung die Fortführungsfähigkeit ein (Liquidität, Finanzierung, Rangrücktritte), und gibt es dazu Unterlagen?
  zweck: Fortführungsfähigkeit am Ende der Revision (SER Anhang G); Beurteilung durch den WP.
- frage: 'Falls ein Kapitalverlust oder eine Überschuldung besteht: Welche Massnahmen hat der VR ergriffen (Sanierung, Zwischenabschluss, Rangrücktritt)?'
  zweck: Art. 725a/725b OR; Zusatz im Bericht und Erinnerung des VR an seine Pflichten (Entscheid WP).
- frage: Können die in den Pendenzen aufgeführten Belege und Nachweise (Konto, Datum, Betrag) nachgereicht werden?
  zweck: PBC-Vorschläge für 10.10. Die Anforderung beim Kunden macht der Mensch.
- frage: Wird die Vollständigkeitserklärung unterzeichnet zurückgegeben?
  zweck: 10.4 Jahresrechnung und Vollständigkeitserklärung; Bestandteil der Jahresakten; Bestätigung der Ereignisse nach dem Bilanzstichtag.
- frage: Kann die Kundenbefragung (revio 10.11) schriftlich beantwortet werden?
  zweck: Auswertung der Befragungsschritte (1xx) durch den Agenten, der nicht selbst befragen kann.
