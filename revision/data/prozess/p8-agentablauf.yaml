- was: 'Prozess 1 – Import der Jahresrechnung vorbereiten: Siegelstatus des Geschäftsjahrs prüfen (versiegelt → kein Import). Definitive Bilanz und ER (keine Entwürfe) in M-Files suchen
    und ausserhalb revio auslesen. In der Importsimulation Kontenzuordnung, Vorzeichen der Passiven (ImportOptions) und Perioden (Geschäftsjahr, Vorjahr) prüfen. Bilanzgleichheit, Totale,
    Jahresergebnis (Eigenkapital, ER, Antrag über die Gewinnverwendung) und Vorjahresvortrag im Rechenmodul abstimmen, nie im Sprachmodell. Unklare Zuordnungen und Vorzeichenabweichungen
    als Pendenz mit Konto und Betrag. Stimmen Bilanzgleichheit, Totale oder Perioden nicht: Pendenz (Notiz «Pendenz») und Halt bis Klärung durch den WP, keine Prüffelder bearbeiten –
    auch ausserhalb der Testphase (Flussdiagramm, Praxis/intern). Offener Widerspruch: Das Konzept weist den Import in 1.1 dem Agenten zu, die Schreibgrenze erlaubt nur die Bereiche
    4 und 10. Bis zum Entscheid consis nur lesen und simulieren.'
  wer: Agent
  revio: 'Lesen/Simulieren (Kette K2): rv_get_financialStatement_LoadFinancialYears (isSealed prüfen; versiegelt → kein Import), rv_get_financialStatement_LoadFinancialStatementState,
