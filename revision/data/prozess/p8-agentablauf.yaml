    prüfen. Ist der Kontext nicht eindeutig: abbrechen, Pendenz erfassen und dem WP melden (Flussdiagramm: «Abbruch und Meldung – Klärung durch WP»).'
  wer: Agent
  revio: 'Mandat/Jahresakte öffnen (nur lesen): rv_get_clientsManagement_LoadClients, rv_get_clientsManagement_LoadAnualFilesForClient_by_clientId, rv_get_clientsManagement_TryLoginDossier_by_clientId_by_dossierId
