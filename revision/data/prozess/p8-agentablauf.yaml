  zitat: erlangte Prüfungsnachweise und ihre Beurteilung durch den Abschlussprüfer
- text: Die Arbeitspapiere so gestalten, dass eine nicht beteiligte, erfahrene Fachperson Planung, Durchführung und Ergebnis nachvollziehen kann (Verweis auf Schritt-ID, Notiz, M-Files-ID).
  quelle: hwp-er-2026__rz-0276-s246
