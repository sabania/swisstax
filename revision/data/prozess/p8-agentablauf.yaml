- text: Planung und Durchführung dokumentieren. Wichtige Dokumente mit Datum und Autorvermerk versehen; der Agent ist als Ersteller erkennbar (optional als «zugewiesener Mitarbeiter»
    in 3.5, offener Entscheid).
  quelle: ser-2022__7-1
