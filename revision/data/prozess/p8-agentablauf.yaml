- text: Visum je Schritt, ✓ je Prüffeld, Abschliessende Beurteilung, «Abgeschlossen», «Review» und Status in Bereich 10 setzen.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: 'Visum (Kürzel und Datum) pro Schritt, ✓ pro Prüffeld, «Abgeschlossen» und «Review» in der Fusszeile, Status in Bereich 10: alles bleibt beim Menschen.'
- text: Nicht korrigierte Fehler (einzeln und kumuliert) in 6.1 beurteilen und über die Modifizierung der Prüfungsaussage entscheiden.
