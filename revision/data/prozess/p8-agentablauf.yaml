# Prozessphase p8-agentablauf – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p8-agentablauf
titel: Arbeitsablauf des KI-Revisionsagenten (Prozesse 1–6, revio 4.0, M-Files)
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-12'
  nachpruefung:
    urteil: korrigieren
    befunde: 16
    korrigiert: false
ziel: 'Übersicht, wie der KI-Revisionsagent eine eingeschränkte Revision in revio 4.0 und M-Files über die Prozesse 1–6 vorbereitet (Import, Prüfschritte, Unterlagen 10.9/PBC, Rapport,
  GVB-Entwurf, PDF-Akte): was nötig ist, wo es hingehört, welche Notizen er erfasst und welche Entscheide beim WP bleiben. Nie Visum, Abschluss oder Freigabe.'
wann: Durchgehend ab dem Auftrag des WP (Mandat, Geschäftsjahr) bis zur bestätigten Ablage der PDF-Akte. Prozesse 1–5 grundsätzlich der Reihe nach, Prozess 6 nur auf Anweisung. In Testphase
  1 gilt ein Halt nach dem Import.
gesetz:
- thema: 'Prüfungsumfang der eingeschränkten Revision: Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen. Das ist der Rahmen der Schritttypen 1xx/2xx/3xx.'
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Den Bericht an die GV unterzeichnet die leitende Person, nie der Agent (Prozess 5 nur Entwurf).
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- thema: Auskunfts- und Vorlagepflicht des VR. Das ist die Grundlage für PBC-Liste, Kundenbefragung und Vollständigkeitserklärung.
  quelle: or__art-730b
  zitat: Der Verwaltungsrat übergibt der Revisionsstelle alle Unterlagen und erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt
- thema: 'Geheimhaltung: kein Kundenversand durch den Agenten, keine Mandantendaten ausserhalb der freigegebenen Systeme.'
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen
- thema: Alle Revisionsdienstleistungen sind zu dokumentieren und mindestens 10 Jahre aufzubewahren. Gilt für Textfelder, Notizen, Protokoll und PDF-Akte.
  quelle: or__art-730c
  zitat: Die Revisionsstelle muss sämtliche Revisionsdienstleistungen dokumentieren
- thema: Elektronische Akten (revio, M-Files) müssen während der Aufbewahrungsfrist lesbar bleiben.
  quelle: or__art-730c
  zitat: Elektronische Daten müssen während der gleichen Zeitperiode wieder lesbar gemacht werden können.
- thema: Die Unterlagen müssen die effiziente Prüfung der Einhaltung der Vorschriften erlauben. Deshalb braucht es eine einheitliche Ergebnisstruktur je Schritt.
  quelle: or__art-730c
  zitat: Die Unterlagen müssen es ermöglichen, die Einhaltung der gesetzlichen Vorschriften in effizienter Weise zu prüfen.
