  - quelle: konzept-ki-revisionsagent-2026__c009-1
    zitat: bei Abweichung bricht der Agent ab und erfasst eine Pendenz
  - quelle: konzept-ki-revisionsagent-2026__c009-2
    zitat: 'M-Files: REST-API, Suche über Metadaten (Kunde, Geschäftsjahr, Klasse) statt Volltext.'
- was: 'Vorbedingungen lesen: Auftragsannahme und Weiterführung (2.2) sowie Auftragsvoraussetzungen und Unabhängigkeit (2.4). Prüfen, ob sie dokumentiert sind, und ob die Revisionsstelle
    bei der Buchführung mitgewirkt hat (Selbstprüfungsrisiko, Angabe im Bericht). Fehlt etwas: Pendenz an den WP. Die Beurteilung macht der WP; das Leserecht für 2.4 ist ein offener
    Entscheid consis.'
  wer: Agent bereitet vor, WP entscheidet
  revio: 'Bereich 2 nur lesen (Lesewerkzeug im Machbarkeitstest bestimmen, Kandidat rv_get_workpapers_LoadDynamicFormsData bzw. rv_get_checklists_LoadChecklist). Nie: rv_post_clientsManagement_SetRotationAnchor
    (2.4, nur Mensch)'
