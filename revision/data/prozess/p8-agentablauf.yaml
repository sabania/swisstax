- text: 'Kapitalverlust/Überschuldung: Zusatz im Bericht, Erinnerung des VR an seine Pflichten und Anzeige an das Gericht, wenn der VR sie bei offensichtlicher Überschuldung unterlässt
    – nur WP.'
  quelle: or__art-729c
