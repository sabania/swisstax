  - quelle: ser-2022__7-2
    zitat: Überlegungen zur Unabhängigkeit
  - quelle: konzept-ki-revisionsagent-2026__c017-1
    zitat: 'Entscheid Leserechte: zusätzlich 2.1, 2.4, 3.1, 3.4, 3.5 und 6.2'
- was: 'Planung nur lesen: Wesentlichkeit 3.3 (Gesamt, Toleranzwesentlichkeit 75 % für Umfang und Stichprobe, Nicht-Aufgriffsgrenze 5 %), Risikobeurteilung 3.1, strategische Planung
    3.5 (Prüfungstiefe, Priorität, markierte Prüffelder), Berichtsstrategie 7.1. Die Plausibilität der Wesentlichkeit prüfen (Bezugsgrösse, Prozentsatz, Begründung); passt sie nicht,
    eine Pendenz erfassen. Planung und Wesentlichkeit nie ändern. Die zusätzlichen Leserechte (2.1, 2.4, 3.1, 3.4, 3.5, 6.2) sind ein offener Entscheid consis; fehlt ein Leserecht, Pendenz
    statt Annahme.'
