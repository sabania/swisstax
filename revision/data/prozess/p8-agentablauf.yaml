dokumentation:
- text: 'Einheitliches Ergebnis je Prüfschritt im revio-Textfeld: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen,
    Status. Daraus entsteht der Rapport.'
  quelle: konzept-ki-revisionsagent-2026__c009-3
  zitat: Prüfziel, Quellen (M-Files-ID und Version), Auswahl und Umfang mit Begründung, Ergebnis, Feststellungen, Pendenzen und Status. Daraus entsteht der Revisionsrapport automatisch.
- text: Im Textfeld festhalten, welche Prüfziele (EX, VO, EN, RV, BE, PA, DO) der Nachweis abdeckt.
  quelle: konzept-ki-revisionsagent-2026__c008-1
  zitat: der Agent hält im Textfeld fest, welche Prüfziele sein Nachweis abdeckt
- text: 'Die Stichprobenauswahl im Textfeld begründen (Standard: Posten über der Toleranzwesentlichkeit, ungewöhnliche Posten, nach Risiko).'
  quelle: konzept-ki-revisionsagent-2026__c015-2
  zitat: Der Agent wählt standardmässig alle Posten über der Toleranzwesentlichkeit
- text: Überlegungen zur Unabhängigkeit gehören in die Jahresakten. Der Agent prüft nur, ob sie in 2.4 dokumentiert sind, und meldet Lücken.
