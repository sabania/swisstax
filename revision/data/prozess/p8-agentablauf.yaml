# Prozessphase p8-agentablauf – was nötig ist (kein starrer Ablauf), mit Fundstellen.
id: p8-agentablauf
titel: Arbeitsablauf des KI-Revisionsagenten (Prozesse 1–6, revio 4.0, M-Files)
status: agent-geprueft
erfasst:
  agent: workflow revision-prozess-werte
  datum: '2026-11-13'
  nachpruefung:
    urteil: korrigieren
    befunde: 16
    korrigiert: true
ziel: 'Übersicht, wie der KI-Revisionsagent eine eingeschränkte Revision in revio 4.0 und M-Files über die Prozesse 1–6 vorbereitet (Import, Prüfschritte, Unterlagen 10.9, PBC-Vorschläge,
  Beendigung, Rapport, GVB-Entwurf, PDF-Akte): was nötig ist, wo es hingehört, welche Notizen er erfasst, was der WP entscheidet. Nie Visum, Abschluss, Freigabe.'
wann: 'Durchgehend ab dem Auftrag des WP (Mandat, Geschäftsjahr) bis zur bestätigten Ablage der PDF-Akte. Prozesse 1–5 grundsätzlich der Reihe nach, Prozess 6 nur auf Anweisung. Stimmen
  Bilanz, Totale oder Perioden nicht: Halt bis Klärung (immer); in Testphase 1 zusätzlich Halt nach dem Import.'
gesetz:
- thema: 'Prüfungsumfang der eingeschränkten Revision: Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen. Das ist der Rahmen der Schritttypen 1xx/2xx/3xx.'
  quelle: or__art-729a
  zitat: Die Prüfung beschränkt sich auf Befragungen, analytische Prüfungshandlungen und angemessene Detailprüfungen.
- thema: Prüfungsgegenstand ist neben der Jahresrechnung auch der Antrag des VR über die Verwendung des Bilanzgewinns. Er ist Teil der Prüfungsaussage im GVB; der Agent bereitet vor,
    der WP beurteilt.
  quelle: or__art-729a
  zitat: der Antrag des Verwaltungsrats an die Generalversammlung über die Verwendung des Bilanzgewinnes nicht den gesetzlichen Vorschriften und den Statuten entspricht
- thema: 'Unabhängigkeit und Selbstprüfungsrisiko bei Mitwirkung an der Buchführung: Vorbedingung, die der WP vor dem Start beurteilt (2.2/2.4). Der Agent liest nur.'
  quelle: or__art-729
  zitat: Sofern das Risiko der Überprüfung eigener Arbeiten entsteht, muss durch geeignete organisatorische und personelle Massnahmen eine verlässliche Prüfung sichergestellt werden.
- thema: Den Bericht an die GV unterzeichnet die leitende Person, nie der Agent (Prozess 5 nur Entwurf).
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- thema: Pflichtangaben im Bericht (eingeschränkte Natur, Unabhängigkeit, Mitwirken bei der Buchführung, leitende Person). Im GVB-Entwurf prüfen und Abweichungen markieren.
  quelle: or__art-729b
  zitat: Angaben zur Unabhängigkeit und gegebenenfalls zum Mitwirken bei der Buchführung
- thema: 'Kapitalverlust: Handlungspflicht des VR. Grundlage für die Berechnung durch den Agenten und den Zusatz im Bericht (Entscheid WP).'
  quelle: or__art-725a
  zitat: so ergreift der Verwaltungsrat Massnahmen zur Beseitigung des Kapitalverlusts
- thema: 'Offensichtliche Überschuldung: Die Anzeige an das Gericht macht nur die Revisionsstelle (WP), wenn der VR sie unterlässt. Der Agent rechnet und meldet.'
  quelle: or__art-729c
  zitat: Ist die Gesellschaft offensichtlich überschuldet und unterlässt der Verwaltungsrat die Anzeige, so benachrichtigt die Revisionsstelle das Gericht.
- thema: Auskunfts- und Vorlagepflicht des VR. Das ist die Grundlage für PBC-Liste, Kundenbefragung und Vollständigkeitserklärung.
  quelle: or__art-730b
  zitat: Der Verwaltungsrat übergibt der Revisionsstelle alle Unterlagen und erteilt ihr die Auskünfte, die sie für die Erfüllung ihrer Aufgaben benötigt
- thema: 'Schweigepflicht: keine Mandantendaten ausserhalb der freigegebenen Systeme; Datenschutz vor dem ersten Test mit Echtdaten regeln (Konzept c015-3 «Schweigepflicht nach Art.
    730b OR»). Das Verbot des Kundenversands ist eine interne Regel (c009-2), keine Folge von Art. 730b OR.'
  quelle: or__art-730b
  zitat: Die Revisionsstelle wahrt das Geheimnis über ihre Feststellungen
- thema: Alle Revisionsdienstleistungen dokumentieren; Berichte und wesentliche Unterlagen mindestens zehn Jahre aufbewahren. Gilt für Textfelder, Notizen, Protokoll und PDF-Akte.
  quelle: or__art-730c
  zitat: muss sämtliche Revisionsdienstleistungen dokumentieren und Revisionsberichte sowie alle wesentlichen Unterlagen mindestens während zehn Jahren aufbewahren
- thema: Elektronische Akten (revio, M-Files) müssen während der Aufbewahrungsfrist lesbar bleiben.
  quelle: or__art-730c
  zitat: Elektronische Daten müssen während der gleichen Zeitperiode wieder lesbar gemacht werden können.
- thema: Die Unterlagen müssen die effiziente Prüfung der Einhaltung der Vorschriften erlauben. Deshalb braucht es eine einheitliche Ergebnisstruktur je Schritt.
  quelle: or__art-730c
  zitat: Die Unterlagen müssen es ermöglichen, die Einhaltung der gesetzlichen Vorschriften in effizienter Weise zu prüfen.
schritte:
- was: 'Start nur auf Auftrag des WP. Den Kontext-Schlüssel fixieren (Kunde, revio-Mandat, M-Files-Kunde, Geschäftsjahr, Stichtag) und jeden späteren Zugriff und jede Ablage dagegen
    prüfen. Ist der Kontext nicht eindeutig: abbrechen, Pendenz erfassen und dem WP melden (Flussdiagramm: «Abbruch und Meldung – Klärung durch WP»).'
  wer: Agent
  revio: 'Mandat/Jahresakte öffnen (nur lesen, Kette K1): rv_get_clientsManagement_LoadClients, rv_get_clientsManagement_LoadAnualFilesForClient_by_clientId, rv_get_clientsManagement_TryLoginDossier_by_clientId_by_dossierId
    → rv_get_clientsManagement_LoginDossier_by_clientId_by_dossierId; Geschäftsjahr und Siegelstatus: rv_get_financialStatement_LoadFinancialYears (isSealed). Versiegelte oder zur Siegelung
    beantragte Akte → nur lesen'
  mfiles: M-Files-Kunde und Geschäftsjahr über die Metadaten (Kunde, Geschäftsjahr, Klasse) bestimmen, keine Volltextsuche
  fundstellen:
  - quelle: konzept-ki-revisionsagent-2026__c010-1
    zitat: der Wirtschaftsprüfer erteilt den Auftrag, kontrolliert und entscheidet
  - quelle: konzept-ki-revisionsagent-2026__c009-1
