  zitat: Ist dies der Fall, wird der Abschlussprüfer seine Prüfungsaussage modifizieren.
- text: Wesentlichkeit festlegen oder ändern (3.3). Ändert sie, beurteilt der Agent die betroffenen Schritte neu und kennzeichnet sie im Rapport.
  quelle: konzept-ki-revisionsagent-2026__c014-1
  zitat: 'Änderung der Werte: Betroffene Prüfschritte werden neu beurteilt und im Rapport gekennzeichnet.'
- text: Unterlagen beim Kunden anfordern (PBC-Versand) und Status der Unterlagen in Bereich 10 setzen.
  quelle: konzept-ki-revisionsagent-2026__c011-2
  zitat: Status bleibt offen; Anforderung beim Kunden durch den Menschen
- text: Notizen und Pendenzen erledigen bzw. schliessen. Der Agent tut das nie.
  quelle: konzept-ki-revisionsagent-2026__c007-1
  zitat: Notizen löscht oder erledigt er nie.
- text: 'Schlussbesprechung: was mit wem besprochen wird.'
  quelle: hwp-er-2026__rz-0456-s289
  zitat: je nach deren Wichtigkeit verschiedene Schlussbesprechungen veranlassen
- text: Durchsicht der Arbeiten des Agenten vor Abgabe des Revisionsberichts.
  quelle: leitfaden-qm-2025__6-2-t6
  zitat: Die Durchsicht erfolgt vor Abgabe des Revisionsberichts.
- text: Berichtswortlaut (Normalwortlaut, Einschränkung, Hinweis, Zusatz), Freigabe, Unterzeichnung und Datierung des Berichts.
  quelle: or__art-729b
  zitat: Der Bericht muss von der Person unterzeichnet werden, die die Revision geleitet hat.
- text: 'E-Mail-Rapport: wer freigibt, welche Empfängeradresse, welche Anhänge (offen, consis/enco).'
