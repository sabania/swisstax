blindtest:
  erstellt: "2026-11-09, unabhängig aus Primärquellen (chunks/, sources/)"
  fragen:
    - id: b01
      typ: zahl
      frage: "Ehepaar in rechtlich und tatsächlich ungetrennter Ehe, weder Beiträge an die 2. Säule noch an die Säule 3a, Kanton ZH, Steuerjahr 2025: Wie hoch ist der maximale Abzug für Versicherungsprämien und Zinsen von Sparkapitalien bei der Staatssteuer und bei der direkten Bundessteuer?"
      soll: "ZH 2025: Staatssteuer höchstens CHF 8'700 (Grundabzug CHF 5'800, ohne Beiträge an 2. Säule/3a um die Hälfte erhöht). Direkte Bundessteuer 2025: höchstens CHF 5'550 (Grundabzug CHF 3'700, um die Hälfte erhöht)."
      fundstellen: [zh-wl-2025__c0086]
      zitat: "Steuerpflichtige höchstens CHF 8’700."
    - id: b02
      typ: zahl
      frage: "Wie hoch ist im Steuerjahr 2026 der Maximalabzug für Fahrkosten zwischen Wohn- und Arbeitsort im Kanton St.Gallen (Kantons- und Gemeindesteuern) und bei der direkten Bundessteuer?"
      soll: "SG 2026: Kantons- und Gemeindesteuern max. Fr. 8'000; direkte Bundessteuer max. Fr. 3'300. Es ist ein Maximalabzug, keine Pauschale (bei Teilzeit/unterjährig nicht gekürzt)."
      fundstellen: [sg-stb-39-3__c0011]
      zitat: "2026   Fr. 8'000.--   Fr. 3'300.--"
    - id: b03
      typ: zahl
      frage: "Kanton Appenzell Ausserrhoden, Steuerjahr 2025: Welchen Kinderabzug können Eltern für ein 3-jähriges, ein 10-jähriges und ein 16-jähriges (noch minderjähriges) Kind geltend machen?"
      soll: "AR (Kantonssteuer) 2025: 3-jähriges Kind (bis Vollendung des 4. Altersjahrs) Fr. 5'000; 10-jähriges Kind (nach Vollendung des 4. bis Vollendung des 15. Altersjahrs) Fr. 7'000; 16-jähriges Kind (nach Vollendung des 15. Altersjahrs bis Volljährigkeit) Fr. 11'000. Gleiche Beträge gelten für volljährige Kinder in Ausbildung bis zum 26. Altersjahr."
      fundstellen: [ar-mb-02__c0002]
      zitat: "Fr. 7'000   für jedes Kind unter der elterlichen Sorge oder Obhut der steuerpflichtigen Person nach"
    - id: b04
      typ: zahl
      frage: "Alleinstehende Person ohne Kinder mit Beiträgen an die 2. Säule, Kanton Thurgau, Steuerjahr 2025: Wie hoch ist der maximale Abzug für Versicherungsprämien und Sparzinsen bei den Staats-/Gemeindesteuern und bei der Bundessteuer?"
      soll: "TG 2025: Staat max. Fr. 3'500, Bund max. Fr. 1'800 (ohne Beiträge an Säule 2/3a würde beim Bund Fr. 2'700 gelten). Betrag vor Abzug Prämienverbilligungen Krankenkassen."
      fundstellen: [tg-form-05-2-2025__c0002]
      zitat: "2. für alleinstehende Personen   3500   1800"
    - id: b05
      typ: zahl
      frage: "Kanton St.Gallen, Steuerjahr 2025: Wie hoch ist der Kinderabzug für ein noch nicht schulpflichtiges Kind und für ein Kind in Schule oder Ausbildung bei den Kantons-/Gemeindesteuern?"
      soll: "SG 2025: noch nicht schulpflichtiges Kind Fr. 7'600 (Ziff. 23.1); Kind in Schule oder Ausbildung (auch volljährig) Fr. 10'800 (Ziff. 23.2)."
      fundstellen: [sg-form-1-2025__c0011, sg-wl-2025__c0104]
      zitat: "23.2 Kinderabzug für jedes Kind in Schule oder Ausbildung   Fr. 10’800"
    - id: b06
      typ: zuordnung
      frage: "Bis wann ist die Steuererklärung 2025 einer natürlichen Person im Kanton Zürich einzureichen, und wie ist vorzugehen, wenn die Frist nicht eingehalten werden kann?"
      soll: "ZH, Steuerperiode 2025: Einreichung bis 31. März 2026 (online oder an das Scan-Center). Gesuch um Fristerstreckung ist vor Ablauf der Frist beim Gemeindesteueramt zu stellen. Mahnfristen sind nicht erstreckbar."
      fundstellen: [zh-wl-2025__c0017, zh-zstb-132-1-bis-2025__c0019]
      zitat: "Die Steuererklärung ist bis am 31. März 2026 einzureichen."
    - id: b07
      typ: zuordnung
      frage: "Wir sind eine Treuhandfirma und brauchen für Mandanten im Kanton Thurgau (Steuerperiode 2025, natürliche Personen) eine Fristerstreckung. Bei welcher Stelle ist das Gesuch einzureichen und bis wann kann die Frist längstens erstreckt werden?"
      soll: "TG: Gesuch beim Gemeindesteueramt, das darüber entscheidet. Erstmals eingereichte Gesuche werden grundsätzlich bis längstens 30. September des Deklarationsjahres (2026) gutgeheissen; zusätzliche Gesuche in begründeten Fällen bis 30. November. Treuhänder/Steuerberater, die gewerbsmässig Steuererklärungen ausfüllen, können für ihre Mandanten ein Gesuch längstens bis 31. Dezember des Deklarationsjahres beantragen. Arbeitsüberlastung ist kein Grund."
      fundstellen: [tg-stp-155-2__c0001, tg-stp-155-2__c0002]
      zitat: "Fristerstreckungsgesuch längstens bis zum 31. Dezember des Deklarationsjahres"
    - id: b08
      typ: zuordnung
      frage: "Kanton Appenzell Ausserrhoden, Steuerjahr 2025: Auf welchem Formular wird der Abzug für Versicherungsprämien und Sparzinsen berechnet und in welche Ziffer der Steuererklärung wird das Ergebnis übertragen?"
      soll: "AR 2025: Berechnung auf Formular 6 (A: bezahlte Prämien/Zinsen, B: Maximalabzug, C: Abzug = niedrigerer Betrag von A und B). Der Betrag C wird auf Seite 3 der Steuererklärung in Ziffer 14 übertragen."
      fundstellen: [ar-form-06-2025__c0002, ar-wl-2025__c0085]
      zitat: "zu übertragen in die Steuererklärung   Seite 3 Ziffer 14"
    - id: b09
      typ: zuordnung
      frage: "Kanton St.Gallen, Steuerjahr 2025: Wo und wie ist ein Gesuch um Fristverlängerung für die Steuererklärung einer natürlichen Person zu stellen und bis wann?"
      soll: "SG 2025: Das Gesuch ist vor Ablauf der Einreichefrist (Datum auf Seite 1 der Steuererklärung) zu stellen, vorzugsweise elektronisch unter www.steuern.sg.ch (mit Registernummer und Geburtsdatum); sonst schriftlich an das Gemeindesteueramt. Es kann eine angemessene Fristverlängerung gewährt werden."
      fundstellen: [sg-wl-2025__c0018]
      zitat: "an das Gemeindesteueramt zu stellen."
    - id: b10
      typ: fall
      frage: "Ehepaar im Kanton St.Gallen, Steuerjahr 2025, zwei Kinder mit Kinderabzug, keine Beiträge an die 2. Säule oder Säule 3a bei beiden Partnern. Wie hoch ist der maximale Abzug für Versicherungsprämien und Sparzinsen bei den Kantons-/Gemeindesteuern und bei der direkten Bundessteuer?"
      soll: "SG 2025 Kanton: Fr. 6'800 + zusätzlich ohne 2. Säule/3a bis Fr. 1'100 + 2 x bis Fr. 1'100 für die Kinder = Fr. 10'100. Bund: Fr. 3'700 + zusätzlich bis Fr. 1'850 (= Fr. 5'550) + 2 x Fr. 700 = Fr. 6'950. (Voraussetzung für den Zusatzabzug muss bei beiden Partnern erfüllt sein.)"
      fundstellen: [sg-form-32-2025__c0003, sg-wl-2025__c0088, bund-form-2-2025__c0009]
      zitat: "- Für jedes Kind (und bei der direkten Bundessteuer für jede un-"
    - id: b11
      typ: fall
      frage: "Arbeitnehmer im Kanton Thurgau, Steuerjahr 2026, Arbeitsweg mit ÖV-Jahresabonnement, effektive Kosten Fr. 6'400. Welcher Fahrkostenabzug ist bei den Staats-/Gemeindesteuern und welcher bei der direkten Bundessteuer zulässig?"
      soll: "TG 2026: Kanton gesamthaft max. Fr. 6'000, deshalb Abzug Fr. 6'000 (effektive Kosten Fr. 6'400 werden gekürzt). Bund max. Fr. 3'300, deshalb Abzug Fr. 3'300."
      fundstellen: [tg-wl-2026__c0176, tg-wl-2026__c0182]
      zitat: "beim Bund von gesamthaft maximal Fr. 3'300 abgezogen werden."
    - id: b12
      typ: fall
      frage: "Ehepaar im Kanton Zürich, Steuerjahr 2026, nachgewiesene Kinderdrittbetreuungskosten: Kind A (5 Jahre) Fr. 30'000, Kind B (8 Jahre) Fr. 12'000. Wie hoch ist der Abzug bei der Staatssteuer und bei der direkten Bundessteuer?"
      soll: "ZH 2026: Maximum pro Kind Staat Fr. 25'300, Bund Fr. 25'800 (Kinder unter 14). Staat: 25'300 + 12'000 = Fr. 37'300. Bund: 25'800 + 12'000 = Fr. 37'800. (Zum Vergleich 2025: Staat max. Fr. 25'000.)"
      fundstellen: [zh-wl-2026-uj__c0105]
      zitat: "Kinderdrittbetreuungskosten: Der Abzug beträgt höchstens CHF 25’300 (Staatssteuer) bzw."
    - id: b13
      typ: falle
      frage: "Ein Mitglied der Milizfeuerwehr erhält für die Erfüllung von Kernaufgaben (Übungen, Pikettdienst, Ernstfalleinsätze) Sold. Bis zu welchem Betrag ist der Feuerwehrsold bei der direkten Bundessteuer steuerfrei, im Steuerjahr 2025 und im Steuerjahr 2026?"
      soll: "Bund: 2025 steuerfrei bis maximal Fr. 5'300; 2026 steuerfrei bis maximal Fr. 5'400 (Wert hat sich geändert, nicht übertragen). Der gesamte Sold ist auf dem Lohnausweis zu deklarieren; der steuerfreie Betrag wird auf Formular 9 Berufskosten Ziffer 8 abgezogen."
      fundstellen: [bund-wl-2a-2025__c0047, bund-wl-2a-2026__c0047]
      zitat: "bis zum maximalen Betrag von 5400 Fr. steuerfrei."
    - id: b14
      typ: falle
      frage: "Ein Mandant wohnt am 31.12.2026 im Kanton Luzern und pendelt mit dem Auto zur Arbeit. Welcher Fahrkostenabzug gilt für die Luzerner Staats- und Gemeindesteuern 2026 und für die direkte Bundessteuer?"
      soll: "Luzern ist im Wiki nicht abgedeckt (nur Bund, AR, SG, TG, ZH): kein Wert für die Luzerner Staats-/Gemeindesteuer nennen, auf kantonale Wegleitung verweisen. Für die direkte Bundessteuer 2026 gilt max. Fr. 3'300 (Wegleitung Bund 2026)."
      fundstellen: [bund-wl-2a-2026__c0043]
      zitat: "3300 Franken jährlich:"
