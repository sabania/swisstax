# Werkzeugtest (deterministisch): Eingaben, mit denen Agenten in echten OpenClaw-Läufen nichts gefunden haben
# (aus den Protokollen H0–H4, 09.11.2026), mit dem erwarteten Treffer. Auswertung: python3 eval/werkzeug_test.py
# erwartet: Schlüssel (wert) bzw. Ziffer (position), von denen einer unter den ersten 3 Treffern stehen muss;
# enthaelt: Text, der in der Ausgabe stehen muss (für Eingaben ohne eigenen Eckwert → Rückfall auf Positionen/Volltext).
faelle:
- {befehl: wert, jur: zh, jahr: "2025", eingabe: kinderdrittbetreuung, erwartet: [drittbetreuung.max]}
