# bereich: kern = Relevanz/M-Files-Kategorie/Ausfüllen (Schwerpunkt) · prozess = Gesamtprozess (sekundär, nur Nachschlagewissen)
# Prozesstest Steuerprozess NP (consis): Schritt 1 (Eingang, Triage, M-Files) und Schritt 2 (Erfassung, DrTax-Positionen),
# Prozessregeln (Status, Grenzen der KI), Schritte 5/6. Fiktive Muster-Mandanten (keine echten Daten).
# Referenzen (soll) aus firma/quellen (Prozessbeschrieb 27.10.2026, M-Files-Liste 05.11.2026) und dem Steuer-Wiki.
fragen:
- id: k01
  bereich: kern
  frage: "Im Info-Postfach kommt ein E-Mail mit dem Anhang «Lohnausweis 2025» der Muster AG für Hans Muster (Kanton Zürich). Ist das steuerrelevant? Welches Steuerjahr, welche M-Files-Klasse, Kategorie und Beschreibung, und was passiert danach im Prozessobjekt?"
  soll: "Steuerrelevant ja. Steuerjahr 2025 (Bescheinigungsjahr). Klasse StE, Kategorie «Belege eingereicht» (Zuordnungsliste Nr. 4, wird eingereicht), Adresse «Muster Hans», Beschreibung z.B. «Lohnausweis Muster AG» bzw. «Lohnausweis Arbeitgeber». Danach: Prozessobjekt im Status Offen → Status «Unterlagen erhalten» und Feld «Unterlagen erhalten» = Eingangsdatum (nie überschreiben); bei späterer Lieferung Kundenpendenzen abgleichen. Protokolleintrag. Formularposition ZH 2025 Ziff. 1.1 (Nettolohn Lohnausweis Ziff. 11)."
- id: k02
  bereich: kern
  frage: "Ein Kunde lädt eine Migros-Kassenquittung und eine Swisscom-Handyrechnung ins Kundenportal hoch. Was macht die KI damit?"
  soll: "Nicht steuerrelevant (private Alltagsrechnungen). Nicht als StE-Beleg ablegen. Der Prozessbeschrieb regelt «nicht relevant → unberührt lassen» nur für E-Mail-Anhänge (K1/K2); für Portal-Uploads (K3) gibt es keinen eigenen Zweig → Prüfkorb mit Grund «nicht steuerrelevant» und Vorschlag (bzw. Rückfrage SB/FE). Protokollieren."
- id: k03
  bereich: prozess
  frage: "Per Post kommt ein Brief des Kantonalen Steueramts Zürich: «Einschätzungsentscheid Staats- und Gemeindesteuern, Steuerperiode 2024» für Hans und Anna Muster. Wie wird er abgelegt und wie geht es weiter?"
  soll: "Physischen Eingang markieren (Post, K5). Klasse «Veranlagung + def. Steuerrechnung» (Bereich ST, nicht StE-Kategorie), Steuerjahr 2024 (Steuerperiode der Veranlagung), Adresse «Muster Hans und Anna» bzw. Mandant Ehepaar. Weiter in Schritt 5: eingereichte Deklaration und Veranlagung laden, je Position Kanton/Gemeinde und Bund vergleichen (steuerbar, satzbestimmend; Einkommen, Vermögen, Abzüge, Schulden), Vergleichstabelle ablegen; jede Abweichung (auch CHF 1) per E-Mail an die zuständige SB (Tabelle, Begründung, Links, Frist, Vorschlag); SB entscheidet; Einsprache nur ML (Frist i.d.R. 30 Tage). Veranlagung immer an den Kunden (Kanal gemäss SB). ZH: Steuerrechnung im Testlauf weggelassen."
- id: k04
  bereich: kern
  frage: "Ein Kunde schickt per E-Mail ein 12-seitiges Sammel-PDF mit Lohnausweis 2025, Bescheinigung Säule 3a 2025, Prämienübersicht Krankenkasse 2025 und Kita-Rechnungen 2025 (Kanton St. Gallen). Wie verarbeitet die KI das in Schritt 1?"
  soll: "Sammel-PDF trennen: ein Beleg = eine Datei (Online-Übermittlung DrTax). Dubletten prüfen. Jeden Beleg einzeln einordnen, Steuerjahr 2025, Klasse StE: Lohnausweis → Belege eingereicht (Nr. 4); Säule 3a → Belege eingereicht (Nr. 5); Krankenkassenprämien → Belege Sonstiges (Nr. 20, sofern nicht einzureichen); Kita-Rechnungen → Belege Sonstiges (Nr. 19, sofern nicht einzureichen). Beschreibung je Beleg. Prozessobjekt nachführen, Protokoll je Datei."
- id: k05
  bereich: prozess
  frage: "Ein Anhang ist passwortgeschützt und lässt sich nicht öffnen. Was macht die KI?"
  soll: "Prüfkorb (Schritt 1.4–1.5): Grund (Passwortschutz/nicht lesbar), Vorschlag der KI, Dokument-Link, gebündelt an FE. Nicht ablegen, protokollieren."
- id: k06
  bereich: prozess
  frage: "Auf einem Steuerauszug steht nur der Nachname «Muster»; in M-Files gibt es die Mandanten «Muster Hans» (alleinstehend) und «Muster Hans und Anna». Der Absender der E-Mail ist nicht eindeutig. Was tut die KI?"
  soll: "Mandant bestimmen: 1. Name auf dem Dokument, 2. Absender der Lieferung. Mehrdeutig → Prüfkorb (Grund, Vorschlag, Link). Keine Ablage auf Verdacht, keine Mandantennummern."
- id: k07
  bereich: prozess
  frage: "Darf die KI den Status «zur Fertigstellung / Versand» setzen oder die Steuererklärung über DrTax online einreichen?"
  soll: "Nein. «zur Fertigstellung / Versand» setzt nur ML (nach Prüfung und Besprechung). Einreichung nur ML/SB (online aus DrTax oder Post); die KI hat technisch keine Übermittlungsrechte. Auch «In Excel-Fristenliste austragen» nur ML/SB; Antworten/Einsprachen ans Steueramt nur ML/SB."
- id: k08
  bereich: prozess
  frage: "Bei der Erfassung in DrTax ist ein Betrag auf einem schlecht gescannten Beleg nicht sicher lesbar. Was tut die KI?"
  soll: "Nie schätzen: Pendenz an die SB «Wert prüfen» (Schritt 2.5). Erfassung der übrigen Belege läuft weiter; fehlende/unsichere Belege blockieren nicht."
- id: k09
  bereich: prozess
  frage: "Ab welcher Veränderung gegenüber dem Vorjahr gilt eine Abweichung im Steuerprozess als wesentlich, und was passiert dann?"
  soll: "Wesentlich ab ± CHF 20'000 beim Einkommen bzw. ± CHF 50'000 beim Vermögen. Dann Feld «Wesentliche Veränderungen zum Vorjahr» abfüllen (Schritt 2.7/3.5) und im Besprechungsprotokoll mit Begründung oder Frage an den Kunden aufführen."
- id: k10
  bereich: prozess
  frage: "Die Veranlagung SG für die Steuerperiode 2024 weicht beim steuerbaren Einkommen um CHF 1 von der eingereichten Deklaration ab. Was macht die KI?"
  soll: "Jede Abweichung (auch CHF 1) wird gemeldet: E-Mail an die zuständige SB gemäss M-Files, Betreff «Veranlagung 2024 <Mandant> – Abweichung CHF 1», mit Kanton/Bund, Vergleichstabelle, Begründung Steueramt, Links auf beide Dokumente, Frist als Datum, Vorschlag KI; aktuell zusätzlich an FE. SB entscheidet (selbst klären oder ML beiziehen); Einsprache nur ML. Veranlagung wird trotzdem an den Kunden weitergegeben. SG: Schlussrechnung liegt mit der Veranlagung vor → Steuerrechnung prüfen."
- id: k11
  bereich: prozess
  frage: "Zu Jahresbeginn kommt die provisorische Steuerrechnung 2026. Einkommen weicht um CHF 12'000 und Vermögen um CHF 30'000 von der zuletzt eingereichten Steuererklärung ab. Was tut die KI?"
  soll: "Ablage Klasse «Prov. Steuerrechnung». Abweichungen innerhalb ± 20'000 (Einkommen) und ± 50'000 (Vermögen) → Entwurf Schreiben «gutgeheissen» aus M-Files-Vorlage (ohne Daten anderer Mandanten), Anfrage an SB ob Brief oder E-Mail; SB entscheidet Kanal, prüft und versendet. Protokoll."
- id: k12
  bereich: kern
  frage: "In welche M-Files-Kategorie gehören (a) ein Fristerstreckungsgesuch für eine natürliche Person und (b) die Antwort eines Kunden per E-Mail auf eine offene Pendenz?"
  soll: "(a) Fristenliste NP (Zuordnungsliste Nr. 2; nur Fristenkontrolle, keine Belegablage). (b) Unterlagen Kunde (Nr. 29). Beide werden nicht eingereicht."
- id: k13
  bereich: kern
  frage: "Kanton Zürich, Steuerjahr 2025: Kita-Rechnungen von CHF 14'000 für ein 5-jähriges Kind, beide Eltern erwerbstätig. In welche Position (Ziffer/Code) gehört das, welcher Höchstbetrag gilt beim Kanton und beim Bund, und welche M-Files-Kategorie erhalten die Rechnungen?"
  soll: "ZH 2025 Ziff. 16.6 «Abzug für fremdbetreute Kinder» (Code 376): je Kind unter 14 Jahren nachgewiesene Kosten, höchstens Kanton CHF 25'000 / Bund CHF 25'800 → hier CHF 14'000 in beiden Spalten (Verpflegungsanteil nicht abziehbar). M-Files: Klasse StE, Kategorie «Belege Sonstiges» (Zuordnungsliste Nr. 19 «sofern nicht einzureichen»; ZH 2025: Kinderdrittbetreuungskosten auf Verlangen nachzuweisen, zh-zstb-34-1-bis-2025__c0023; die Wegleitung verlangt eine Aufstellung der Kosten, die Rechnungen selbst nur auf Verlangen)."
- id: k14
  bereich: kern
  frage: "Kanton Thurgau, Steuerjahr 2025: Es liegt ein Steuerauszug der Bank vor. Welche Formularpositionen füllt er, und wird er eingereicht (M-Files-Kategorie)?"
  soll: "TG 2025: Formular 2 (Wertschriftenverzeichnis) → Ziff. 4 Wertschriften- und Zinserträge (Code 150), Ziff. 30.1 Wertschriften und Guthaben (Code 410), Verrechnungssteueranspruch 35 % von Total A; ggf. Teilbesteuerung Beteiligungen. M-Files: Zuordnungsliste Nr. 9 «je nach Kanton»; TG 2025 bedingt: einzureichen, wenn die Titel nicht einzeln im Formular 2 aufgeführt, sondern mit dem Steuerauszug deklariert werden (tg-wl-2025__c0168) → dann «Belege eingereicht», sonst «Belege Sonstiges»."
- id: k15
  bereich: kern
  frage: "Kanton Appenzell Ausserrhoden, Steuerjahr 2025: Hypothekarzinsbescheinigung der Bank. Welche Ziffern betrifft sie und in welche M-Files-Kategorie gehört sie?"
  soll: "AR 2025: Formular 5 Teil A (private Schulden 31.12.2025 und Schuldzinsen 2025) → Ziff. 11 Schuldzinsen privat und Ziff. 34.1 Privatschulden (Code 504). M-Files: Zuordnungsliste Nr. 10 «je nach Kanton»; AR 2025: Belege zum Schuldenverzeichnis (Formular 5) nur auf Verlangen (ar-form-05-2025__c0001) → «Belege Sonstiges»."
- id: k16
  bereich: prozess
  frage: "Ein Neukunde, der noch nicht in M-Files erfasst ist, schickt per E-Mail seinen Lohnausweis 2025 und bittet um die Steuererklärung. Was tut die KI?"
  soll: "Schritt 1.9a: Die KI legt den Mandanten in M-Files an (Name, Adresse gemäss Dokument) und meldet dies an die Zuteilungsverantwortlichen (gemäss Prozessbeschrieb Mariana Holanda und Florian Eisenlohr); diese teilen ML und SB zu – nie die KI. Danach Ablage (Lohnausweis → StE, Belege eingereicht, Steuerjahr 2025) und normaler Ablauf; Nachlieferungen in derselben Meldung ergänzen."
- id: k17
  bereich: prozess
  frage: "Wie ist das Besprechungsprotokoll aufgebaut, das die KI für den Mandatsleiter vorbereitet?"
  soll: "Kopf (Mandant, Steuerjahr, Datum, ML, SB) · 1 Einkünfte (Vergleich Vorjahr je Einkunftsart, wesentliche Abweichungen) · 2 Vermögen (Vergleich, Ergebnis Vermögensvergleich, nicht erklärte Differenz) · 3 Abzüge (neu, weggefallen, verändert) · 4 Schulden (Hypotheken, übrige Schulden, Schuldzinsen) · 5 Weitere Punkte (Abweichungen zur Einschätzung Vorjahr, offene Kundenpendenzen, Steuerausscheidung, Quellensteuer-Rückforderung) · 6 Steuerplanung (als Vorschlag gekennzeichnet, Entscheid ML). Wesentlich ab ± 20'000 / ± 50'000; nie Daten anderer Mandanten; Ablage «Besprechungsprotokoll Entwurf TT.MM.JJJJ»."
- id: k18
  bereich: kern
  frage: "Es kommt ein Kontoauszug des Steueramts St. Gallen zum Steuerkonto (Zahlungen und Saldo der Staats- und Gemeindesteuern). Wie wird er abgelegt?"
  soll: "Kein Bankbeleg und keine StE-Kategorie: Klasse «Kontoauszug» im Bereich ST; Verarbeitung in Schritt 5 (Zahlung nur als Indiz über den Kontoauszug). Nicht mit Bank-Kontoauszug/Zinsausweis verwechseln."
