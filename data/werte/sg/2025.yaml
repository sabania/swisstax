- key: berufskosten.homeoffice
  wert: null
  einheit: Text
  text: 'Arbeitszimmer in der Privatwohnung: gilt grundsätzlich mit der Pauschale übrige Berufskosten abgegolten; keine Kumulation von Pauschale und Arbeitszimmer-Kosten. Effektive Kosten nur bei beruflicher
    Notwendigkeit (kumulativ: wesentlicher Teil der Arbeit, ca. 40 % der Arbeitszeit, zu Hause mangels Arbeitgeber-Arbeitsplatz; spezifisch eingerichteter, ausgeschiedener Raum), dann sind sämtliche Berufsauslagen
    nachzuweisen. Berechnung: Gesamtkosten dividiert durch (Anzahl Zimmer + 2). Homeoffice-Tage: keine Fahrkosten und keine auswärtige Verpflegung.'
  gilt_fuer: kanton
  rechtsgrundlage: Art. 39 Abs. 1 lit. c StG SG; StB 39 Nr. 1
  quellen:
  - chunk: sg-stb-39-1__c0005
    zitat: die Gesamtkosten durch die Anzahl Zimmer plus zwei geteilt werden
  status: extrahiert
  bemerkung: Steuerbuch-Weisung (Version 1.1.2021). Kein Pauschalbetrag für Homeoffice.
