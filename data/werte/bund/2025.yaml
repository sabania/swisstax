- key: saeule3a.einkauf
  wert: null
  einheit: Text
  text: 'Steuerjahr 2025: Lücken, die vor dem 01.01.2025 entstanden sind, können nicht eingekauft werden (Übergangsbestimmung BVV 3) – ein Einkauf über den ordentlichen Höchstbetrag
    hinaus kommt erst für Lücken ab Beitragsjahr 2025 in Frage. Regel: Nachzahlung zusätzlich zum ordentlichen Beitrag, sofern in den 10 vorangehenden Jahren nicht alle zulässigen Beiträge einbezahlt
    wurden und im Einkaufsjahr der volle ordentliche Beitrag geleistet wird; pro Einkaufsjahr höchstens 8 % des oberen BVG-Grenzbetrags (CHF 7''258); je Jahresbeitragslücke nur ein Einkauf'
  gilt_fuer: bund
  rechtsgrundlage: Art. 7a, 7b BVV 3; Übergangsbestimmung Änderung 6.11.2024
  quellen:
  - chunk: bund-bvv3__art-7a-t1
    zitat: in den zehn dem Einkauf vorangehenden Jahren nicht alle für sie maximal zulässigen Beiträge einbezahlt haben
  - chunk: bund-bvv3__uebergang-disp-u3
    zitat: die vor Inkrafttreten der Änderung vom 6. November 2024 entstanden sind, können nicht mit einem Einkauf ausgeglichen werden
  - chunk: bund-bvv3__art-7a-t1
    zitat: auf keinen Fall jedoch höher als 8 Prozent des oberen Grenzbetrags nach Artikel 8 Absatz 1 BVG
  - chunk: bund-bvv3__uebergang-disp-u3
    zitat: können nicht mit einem Einkauf ausgeglichen werden
  - chunk: bund-mm-saeule3a-einkauf__c0001
    zitat: Diese treten per 1. Januar 2025 in Kraft
  - chunk: bund-bvv3__art-7a-t2
    zitat: ist nicht mehr als ein Einkauf zulässig
  - chunk: bund-bvv3__art-7b
    zitat: für die Jahre, für die eine Beitragslücke ausgeglichen werden soll, noch keinen Einkauf vorgenommen hat
  - chunk: bund-bsv-masszahlen-2025-2026__c0003
    zitat: Oberer Grenzbetrag bei Unterstellung unter 2. Säule 7'258 7'258
  status: agent-geprueft
  bemerkung: BVV 3 Art. 7a/7b seit 01.01.2025 in Kraft. Betrag CHF 7'258 = oberer Grenzbetrag (BSV-Masszahlen 2025/2026, zitiert); «nur ein Einkauf je Jahresbeitragslücke» = Art. 7a Abs. 3 BVV 3. Das ESTV-KS
    18a (ab 01.01.2026) gilt nicht für 2025 und wurde nicht herangezogen. Praktisch erster Einkauf frühestens 2026 (Lücken erst ab Beitragsjahr 2025) – laut Seed, nicht aus Quelle bestätigt.
