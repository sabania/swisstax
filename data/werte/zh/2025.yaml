  - chunk: bund-bsv-masszahlen-2025-2026__c0003
    zitat: Oberer Grenzbetrag bei Unterstellung unter 2. Säule 7'258 7'258
  - chunk: bund-mm-saeule3a-einkauf__c0001
    zitat: Diese treten per 1. Januar 2025 in Kraft
  status: agent-geprueft
  bemerkung: 'Verweis auf Bundesrecht (BVV 3, Wert aus data/werte/bund/2025.yaml). Kantonale Norm § 31 Abs. 1 lit. e verweist «im Sinn und im Umfang von Art. 82 BVG». Taxonomie führt Beleg-Schlüssel «ab
    Steuerjahr 2026»; praktisch erster Einkauf frühestens 2026 (Lücken ab Beitragsjahr 2025). ZH-spezifische Vollzugspraxis (ZStB 31.1) hierzu nicht gefunden. Ergänzt (Zweitprüfung): CHF 7''258 = oberer
    Grenzbetrag (BSV-Masszahlen 2025/2026, bund-bsv-masszahlen-2025-2026__c0003); «nur ein Einkauf je Jahresbeitragslücke» Art. 7b Abs. 2 lit. c bzw. Art. 7a Abs. 3 BVV 3; Inkrafttreten 1.1.2025 gemäss
    Bundesrat-Mitteilung vom 6.11.2024 (Bundesquellen, gelten über den Verweis von § 31 Abs. 1 lit. e StG ZH).'
  einheit: Text
  text: 'Nachträglicher Einkauf (Nachzahlung) in die Säule 3a: zusätzlich zum ordentlichen Beitrag, sofern in den 10 vorangehenden Jahren (ab Beitragsjahr 2025) nicht alle zulässigen Beiträge einbezahlt
    wurden; im Einkaufsjahr muss der volle ordentliche Beitrag geleistet sein; pro Einkaufsjahr höchstens 8 % des oberen BVG-Grenzbetrags (CHF 7''258); je Jahresbeitragslücke nur ein Einkauf; Lücken vor
    Inkrafttreten (1.1.2025) nicht einkaufbar.'
  rechtsgrundlage: § 31 Abs. 1 lit. e StG ZH (Verweis auf Art. 82 BVG); Art. 7a, 7b BVV 3
