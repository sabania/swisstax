belege:
- id: kapitalleistung-vorsorge
  name: Bescheinigung über Kapitalleistung aus Vorsorge (Pensionskasse, Freizügigkeit, Säule 3a, Todesfall-/Invaliditätskapital)
  erkennen:
  - 'Absender: Pensionskasse/Vorsorgestiftung, Freizügigkeitsstiftung, Bank-/Versicherungs-3a-Stiftung, ggf. Ausgleichskasse oder Haftpflicht-/Unfallversicherer'
  - Titel «Auszahlungsabrechnung», «Abrechnung Kapitalauszahlung/Kapitalabfindung», «Austrittsabrechnung», «Auszahlung Säule 3a»
  - 'Begriffe: Kapitalleistung, Auszahlungsdatum, Bruttobetrag, Verrechnungssteuer-Hinweis, Vorbezug (WEF), Pensionierung, Todesfallkapital'
  - Wohneigentumsförderung (WEF-Vorbezug) und Scheidungs-/Barauszahlungen sind ebenfalls Kapitalleistungen
  relevanz: ja
  zweck:
  - einkommen
  positionen:
  - einkommen.kapitalleistung_vorsorge
  - einkommen.kapitalabfindung_wiederkehrend
  extrahieren:
  - Auszahlungsdatum (massgebend ist das Steuerjahr des Zuflusses)
  - 'Bruttobetrag der Kapitalleistung (ohne Rappen), je Quelle getrennt: AHV/IV, 2. Säule, Freizügigkeit, Säule 3a, Tod/bleibende Nachteile'
  - 'Bei mehreren Auszahlungen: Aufstellung mit Datum und Betrag je Leistung'
  - Hinweis auf Einkauf/Wiedereinlage innert Jahresfrist (Stellenwechsel-Kapital steuerfrei) und auf WEF-Rückzahlungen
  hinweise:
  - 'Bund: Kapitalleistungen werden gesondert besteuert, stets volle Jahressteuer, zu einem Fünftel der Tarife nach Art. 36 DBG; Sozialabzüge werden nicht gewährt (Art. 38 DBG). Die Steuer fällt im Jahr
    des Zuflusses an.'
  - Kapitalleistungen gehören nicht in die Einkünfte-Ziffern des Hauptformulars, sondern in den separaten Block «Kapitalleistungen aus Vorsorge» (Seite 4, Ziff. 40 bzw. Formularfeld unten).
  - Nur Kapitalzahlungen bei Stellenwechsel, die innert Jahresfrist in die berufliche Vorsorge eingekauft oder in eine Freizügigkeitspolice eingebracht werden, sind steuerfrei (Art. 24 lit. c DBG); Beleg
    der Wiederanlage verlangen.
  - Genugtuungssummen sind steuerfrei und von der Kapitalleistung zu trennen (Art. 24 lit. g DBG).
  kantone:
    TG: 'Alle im Jahr erhaltenen Kapitalleistungen auf Seite 4 unten deklarieren und die Quelle ankreuzen; sie sind immer zu 100% steuerbar. Kanton: einheitlicher Satz auf der einfachen Steuer (Alleinstehende
      2,4%, gemeinsam besteuerte Personen 2%), Bund: 1/5 des ordentlichen Tarifs, kein Elterntarif (WL TG 2025 S. 28).'
    ZH: 'Kapitalleistungen aus Vorsorge werden gesondert zu dem Satz berechnet, der sich bei einer jährlichen Leistung von einem ZWANZIGSTEL der Kapitalleistung ergäbe; einfache Staatssteuer mindestens
      2% (§ 37 Abs. 1 StG ZH; WL ZH 2025 S. 22–23). Bund: ein Fünftel der Tarife. Eintrag auf Seite 4, Ziffer 40 (Aufstellung bei mehreren Leistungen).'
    SG: Ziff. 40.1 (Säule 3a), 40.2 (2. Säule), 40.3 (übrige) sind nur Information (ergänzende Angaben); Gesamtbetrag bei mehreren Leistungen zusammenrechnen. Die separate Besteuerung erfolgt trotzdem.
    AR: 'Ziff. 40.1–40.3 (Kapitalleistungen aus Vorsorge) auf Seite 4 der Steuererklärung; Bescheinigung beilegen. Tarifdetails AR in diesem Wiki nicht verifiziert (Quelle: WL AR 2025 S. 19, layoutbedingt
      schwer lesbar – Original prüfen).'
  quellen:
  - chunk: bund-dbg-2025__art-38
    zitat: Sie unterliegen stets einer vollen Jahressteuer.
  - chunk: bund-dbg-2025__art-38
    zitat: Die Sozialabzüge werden nicht gewährt.
  - chunk: bund-dbg-2025__art-38
    zitat: Sie wird zu einem Fünftel der Tarife nach Artikel 36 Absätze 1, 2 und 2bis erster Satz berechnet.
  - chunk: tg-wl-2025__c0131
    zitat: Sie sind immer zu 100% steuerbar.
  - chunk: tg-wl-2025__c0131
    zitat: Bei Alleinstehenden beträgt der einheitliche Satz für die einfache Steuer 2,4%.
  - chunk: sg-wl-2025__c0119
    zitat: Kapitalleistungen werden gesondert vom übrigen Einkommen besteuert.
  - chunk: bund-dbg-2025__art-24-t1
    zitat: wenn sie der Empfänger innert Jahresfrist zum Einkauf in eine Einrichtung der beruflichen Vorsorge
  - chunk: zh-stg-2025__par-37
    zitat: eine jährliche Leistung von einem Zwanzigstel der Kapitalleistung ausgerichtet würde
  - chunk: zh-wl-2025__c0145
    zitat: ausgerichtet würde; die einfache Staatssteuer beträgt jedoch mindestens 2%.
  - chunk: tg-wl-2025__c0132
    zitat: findet bei Kapitalleistungen aus Vorsorge keine An
  status: agent-geprueft
  bemerkung: 'korrigiert durch Prüfung: ZH-Satz Zehntel (ZStB 173.1 Rz 55) -> Zwanzigstel (§ 37 StG ZH 2025 und WL ZH 2025); ZStB 173.1 widerspricht dem Gesetz. Unbelegte Aussage zur provisorischen Rechnung
    entfernt. AR-Tarif nicht verifiziert.'
- id: erbschaft-schenkung
  name: Erbschaft/Schenkung (Erbteilungsvertrag, Nachlassinventar, Schenkungsvertrag, Erbbescheinigung)
  erkennen:
  - Titel «Erbteilungsvertrag», «Erbbescheinigung», «Inventar», «Nachlassinventar», «Erbenverzeichnis», «Schenkungsvertrag», «Erbvorbezug»
  - 'Absender: Notariat, Bezirks-/Erbschaftsamt, Willensvollstrecker/Erbenvertreter, Bank (Todestag-Saldo/-Depotbestätigung)'
  - 'Begriffe: Erblasser, Todestag, Erbquote, Vermächtnis, Teilung, Vorbezug, unverteilte Erbschaft, Erbengemeinschaft'
  - Steuerauszug/Vermögensausweis per Todestag
  relevanz: bedingt
  bedingung: Der Vermögensanfall selbst ist als Einkommen steuerfrei; relevant sind (a) die ab Anfall erzielten Erträge (Zinsen, Dividenden, Mieten), (b) das Vermögen per 31.12. (Steuerwert der geerbten/geschenkten
    Werte), (c) Angaben zu Schenkung/Erbschaft im Formular und bei ZH ggf. Schenkungs-/Erbschaftssteuer-Erklärung. Nur ohne Anfall im Steuerjahr irrelevant.
  zweck:
  - vermoegen
  - info
  positionen:
  - info.schenkungen_erbschaften
  - einkommen.erbschaften_unverteilt
  - vermoegen.erbschaften_beteiligungen
  - vermoegen.wertschriften_guthaben
  - vermoegen.liegenschaften
  extrahieren:
  - Todestag bzw. Schenkungsdatum; Erbquote/Anteil
  - Steuerwerte der übernommenen Vermögenswerte per 31.12. (Wertschriften, Konti, Liegenschaften), getrennt nach Titeln mit Code E (Erbschaft) bzw. S (Schenkung)
  - 'Bei unverteilter Erbschaft: Anteil an den Erträgen seit Todestag (Einkommen, Ziff. 6.2) und Anteil am Nachlassvermögen (Vermögen, Ziff. 30.5)'
  - Schulden und Vermächtnisse, die das Vermögen mindern
  hinweise:
  - 'Bund: Vermögensanfall infolge Erbschaft, Vermächtnis, Schenkung oder güterrechtlicher Auseinandersetzung ist steuerfrei (Art. 24 lit. a DBG); Gleiches in TG (§ 26 Abs. 1 Ziff. 1 StG). Die Erträge aus
    den geerbten Werten sind jedoch normal steuerbar.'
  - Bei Wertschriften aus Erbschaft/Schenkung sind die seit Erwerb tatsächlich zugeflossenen Erträge massgebend (Rückerstattung Verrechnungssteuer/ausländische Quellensteuern) – Titel mit E bzw. S kennzeichnen.
  - Fälligkeiten zwischen Todestag und Erbteilung sind anteilmässig als Ertrag aus unverteilter Erbschaft zu deklarieren.
  - 'Erbschafts-/Schenkungssteuern sind kantonal (nicht DBG) geregelt: Zuständigkeit und Steuerpflicht je Kanton prüfen; hier nur die Einkommens-/Vermögenssteuer-Seite abgedeckt.'
  kantone:
    ZH: 'Alle Anfälle 2025 in Ziff. 50 angeben. Die Steuererklärung für die Schenkungssteuer entfällt nur bei Schenkungen an Ehegatte/eingetragene Partner, an Nachkommen und bei Gelegenheitsgeschenken bis
      je CHF 5''000. Vermögenssteuer bei Erbanfall: Erblasser bis Erbgang, Erbe ab Erbgang; bei Schenkung/Erbvorbezug beim Beschenkten für das ganze Jahr.'
    SG: Titel mit Code E/S im Wertschriftenverzeichnis (Formular 2); quotale Erträge unverteilter Erbschaft in Ziff. 6.2, Vermögensanteil in Ziff. 30.5.
    AR: Wie SG (Ziff. 6.2 / 30.5, Codes E/S). Bei unverteilter Erbschaft Kopie von Inventar und Erbenverzeichnis, bei verteilter Erbschaft zwingend die Erbteilung beilegen (WL AR 2025, Beilagen).
    TG: Vermögensanfälle aus Erbschaft/Schenkung steuerfrei (§ 26 Abs. 1 Ziff. 1 StG TG); Vermögen und Erträge aus den Werten sind regulär zu deklarieren.
  quellen:
  - chunk: bund-dbg-2025__art-24-t1
    zitat: der Vermögensanfall infolge Erbschaft, Vermächtnis, Schenkung oder güterrechtlicher Auseinandersetzung
  - chunk: tg-stg__par-26-t1
    zitat: Vermögensanfälle infolge Erbschaft, Vermächtnis, Schenkung oder güterrechtlicher Auseinandersetzung
  - chunk: zh-wl-2025__c0148
    zitat: bei Gelegenheitsgeschenken, die den Wert von je CHF 5’000 nicht übersteigen.
  - chunk: zh-wl-2025__c0016
    zitat: Bei Schenkung oder Erbvorbezug wird die Vermögenssteuer für das ganze Jahr beim
  - chunk: sg-wl-2025__c0142
    zitat: Spalte 1 mit «E» bzw. «S» zu
  - chunk: ar-wl-2025__c0130
    zitat: Bei einer verteilten Erbschaft ist uns zwingend eine Kopie
  status: agent-geprueft
