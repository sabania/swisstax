    AR: 'Mietzinsreduktion als Entgelt (z.B. Hauswart): Differenz als Einkommen deklarieren; Mehrkosten bei auswärtigem Wochenaufenthalt Ziff. 10.4 (Formular 4 Ziff. 4) (WL AR 2025).'
