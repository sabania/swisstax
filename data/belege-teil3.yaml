  - 'Begriffe: Kartenlimite, Saldovortrag, Teilzahlung, Sollzinsen, Jahresgebühr, Umsätze nach Händler'
  - Positionen mit Händlernamen und Fremdwährungsumsätzen
  relevanz: bedingt
  bedingung: Die Abrechnung selbst ist kein steuerlicher Beleg. Nur relevant als Nachweisquelle für einzelne abziehbare Zahlungen (z.B. Spenden, Arzt-/Zahnarztkosten, Weiterbildung, Berufsauslagen, wenn
    die Originalrechnung fehlt) und für Sollzinsen bei Saldovortrag (private Schuldzinsen). Kartengebühren und Alltagsumsätze sind nicht abziehbar.
  zweck:
  - info
  - abzug
