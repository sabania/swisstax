# Steuerprozess natürliche Personen (consis) – strukturiert aus dem Prozessbeschrieb.
# Quelle: firma/quellen/steuerprozess-np-2026-10-27.pdf (Stand 27.10.2026, Version 9). Seitenangaben = PDF-Seite.
# Nur Prozesswissen der Firma (kein Steuerrecht). Steuerrechtliche Regeln: Wiki (quick/, wiki/, chunks/).
titel: Steuerprozess Natürliche Personen (consis)
stand: '2026-10-27'
version: 9
quelle: steuerprozess-np-2026-10-27
status: entwurf – aus dem Prozessbeschrieb übernommen, Abnahme durch FE ausstehend

grundsaetze:
- titel: M-Files ist zentral und Master
  text: Jeder Schritt führt Status, Felder, Flags und QK-Checkboxen im Prozessobjekt «Steuererklärung NAT» nach. M-Files ist Master für Kundenstammdaten (Name, Adresse) und für die Zuständigkeit (ML = Feld «Prüfer», SB = Feld «Sachbearbeiter»). Die KI liest diese Angaben, ändert sie aber nie.
  seite: 1
- titel: Grenze der KI
  text: Einreichung, Antworten und Einsprachen an das Steueramt sowie der Status «In Excel-Fristenliste austragen» nur durch ML (in der Regel) oder SB.
  seite: 1
- titel: KI handelt selbst
  text: In M-Files setzt die KI Status, Felder, Flags, QK-Checkboxen und Metadaten selbst (Entscheid 02.10.2026). Jede Aktion wird zwingend protokolliert.
  seite: 1
- titel: Keine echten Kundendaten
  text: Entwicklung und Tests nur mit «Muster Hans» (alleinstehend) und «Hans und Anna Muster» (verheiratet).
  seite: 1
- titel: Nie schätzen
  text: Unsichere Werte nie schätzen → Pendenz an SB; fehlende Belege blockieren die Erfassung nicht.
  seite: 13

rollen:
  ML: Mandatsleiter/in = Feld «Prüfer» im Prozessobjekt (prüft, bespricht, setzt Status «zur Fertigstellung / Versand»)
  SB: Sachbearbeiter/in = Feld «Sachbearbeiter» (Freigaben, Versand, Kundenkontakt, Entscheid bei Abweichungen)
  SEK: Sekretariat (Scan, Rücksendung physischer Unterlagen)
  FE: Prozessverantwortung, Prüfkorb (gebündelt), Kill-Switch, Tagesbericht
  KI: Agenten A1–A10

gesamtablauf: Am 1.1. erzeugt M-Files für jedes Mandat (alleinstehend oder Ehepaar) ein Prozessobjekt «Steuererklärung NAT» für das Vorjahr. Schritte 0–4 laufen im Workflow «Steuererklärung nat» (ID 122); Schritt 5 (Veranlagung) und 6 (provisorische Rechnung) ohne Workflow-Status, Dokumente werden trotzdem abgelegt und jede Aktion protokolliert. Mengengerüst ca. 400 Mandate, im Schnitt 15 Belege, rund 6'000 Belege pro Jahr, Spitze zu Jahresbeginn. Nachlieferungen jederzeit über Schritt 1.
gesamtablauf_seite: 2

status:   # Workflow «Steuererklärung nat» (ID 122); Testphase: Kopie wflow.SteuererklrungNatTest (ID 152). Kein Rückweg von «zur Kontrolle» nach «in Arbeit (St)»; zurück nach «Offen» nur über «Reset Workflow».
- name: Offen
  bedingung: Prozessobjekt erstellt (1.1., ein Objekt pro Mandat und Vorjahr)
  setzt: M-Files
- name: Offen (Steuerkunde)
  bedingung: automatischer Übergang mit Bedingung (bestehender Steuerkunde)
  setzt: M-Files
- name: Offen (Laufkundschaft)
  bedingung: automatischer Übergang mit Bedingung (Laufkundschaft)
  setzt: M-Files
- name: Reset Workflow
  bedingung: Neustart eines Prozesses, führt zurück auf «Offen»
  setzt: nur Mensch
  pflicht: KI erkennt den Neustart und protokolliert ihn
- name: Unterlagen erhalten
  bedingung: sofort, sobald Unterlagen eingegangen und abgelegt sind (erster Beleg abgelegt)
  setzt: KI
  pflicht: Feld «Unterlagen erhalten» = Eingangsdatum (nie überschreiben); direkt danach Vorjahresabgleich, Vollständigkeit, Kundenpendenzen
- name: in Arbeit (St)
  bedingung: direkt nach der Pendenzenermittlung, mit Beginn der Erfassung in DrTax
  setzt: KI
  pflicht: Erfassung DrTax, QK, Plausibilisierung Vermögensentwicklung, Entwurf
- name: zur Kontrolle
  bedingung: Entwurf-PDF in Kategorie «Deklaration» und Flag «Steuerberechnung erstellt»
  setzt: KI / SB
  pflicht: «Zugewiesen an» = Prüfer (ML); M-Files mailt an Prüfer; Protokoll-Agent starten
- name: zur Fertigstellung / Versand
  bedingung: Prüfung und Besprechung abgeschlossen
  setzt: nur ML
  pflicht: Kundenpendenzen nachführen
- name: In Excel-Fristenliste austragen
  bedingung: Einreichung erfolgt (online oder Post)
  setzt: nur ML / SB
  pflicht: Fristenliste und Kopie an Kunde auslösen
- name: Physische ULA zurückschicken
  bedingung: Datum «erledigt» eingetragen
  setzt: KI
  pflicht: prüfen, ob physischer Eingang markiert (ULA = Unterlagen)
- name: Abgeschlossen
  bedingung: Rücksendung bestätigt oder nur digitaler Eingang
  setzt: SEK / SB, KI bei rein digital
status_seite: 5

schritte:
- nr: '1'
  titel: Eingang Steuerunterlagen
  status: Offen → Unterlagen erhalten
  ausloeser: neues E-Mail mit Anhang, Upload Kundenportal, neues DeepBox-Dokument, neue Scan-Datei
  agent: A1 Eingang und Klassifizierung, A2 Prozessobjekt
  output: Beleg mit Metadaten in M-Files, Status und Datum gesetzt, Protokoll; sonst Prüfkorb
  kanaele:
    K1: Info-Postfach info@ (Microsoft Graph, Service-Konto)
    K2: Postfach SB / ML (freigegebener Ordner)
    K3: M-Files-Kundenportal (Upload liegt schon in M-Files)
    K4: DeepBox (technischer Zugang, kein persönliches 2FA)
    K5: Post (Sekretariat scannt, Scanner Innenzone/West, Ziel vermutlich M-Files Scaneingang)
    K6: Sekretariat (persönlich abgegeben, Scan)
  seiten: [7, 8, 9, 10]
  teilschritte:
  - {nr: "1.1", taetigkeit: "Anhang als steuerrelevant erkennen", wer: "KI", system: "M365", regel: "Lohnausweis, Bank- und Wertschriftenausweise, 3a, Versicherungen, Liegenschaft, Krankheitskosten, Spenden, Jahresrechnung Einzelfirma, Hauptformular, Veranlagung, Steuerrechnung, provisorische Rechnung. Gilt für K1/K2: nicht relevant → E-Mail unberührt lassen."}
  - {nr: "1.2", taetigkeit: "Physischen Eingang markieren", wer: "KI", system: "M-Files", regel: "bei K5 und K6; Grundlage für Status «Physische ULA zurückschicken»"}
  - {nr: "1.3", taetigkeit: "Datei holen, Ereignis-ID vergeben", wer: "KI", system: "alle", regel: "Ereignis-ID macht Verarbeitung wiederholbar ohne Doppelablage"}
  - {nr: "1.4–1.5", taetigkeit: "Lesbarkeit prüfen, OCR", wer: "KI", regel: "Passwortschutz oder defekte Datei → Prüfkorb"}
  - {nr: "1.6", taetigkeit: "Sammel-PDF trennen", wer: "KI", regel: "ein Beleg = eine Datei (Online-Übermittlung DrTax)"}
  - {nr: "1.7", taetigkeit: "Dublettenprüfung", wer: "KI", system: "M-Files", regel: "gleicher Inhalt → nicht ablegen, nur protokollieren"}
  - {nr: "1.8–1.9", taetigkeit: "Mandant bestimmen", wer: "KI", system: "M-Files", regel: "1. Name auf dem Dokument, 2. Absender der Lieferung; mehrdeutig → Prüfkorb; keine Mandantennummern. Mandant = «Nachname Vorname» (z.B. Muster Hans); Ehepaar = ein Mandant."}
  - {nr: "1.9a", taetigkeit: "Neue Steuererklärung ohne Kunde in M-Files", wer: "KI", system: "M-Files, M365", regel: "Entscheide 22. und 27.10.2026: KI legt den Mandanten in M-Files an (Name, Adresse gemäss Dokument) und meldet an die Zuteilungsverantwortlichen (siehe firma/konfiguration.yaml); diese teilen ML und SB zu, die KI nie. Danach Ablage und normaler Ablauf. Nachlieferungen in derselben Meldung ergänzen."}
  - {nr: "1.10", taetigkeit: "Sonderfälle ausschliessen", wer: "KI", regel: "Juristische Personen → Prüfkorb (nicht Teil dieses Prozesses)"}
  - {nr: "1.11–1.12", taetigkeit: "Jahr, Dokumentart, Kategorie", wer: "KI", system: "M-Files", regel: "Steuerjahr = Bescheinigungsjahr des Belegs. Zuerst Klasse im Bereich ST – Steuern (StE, Veranlagung + def. Steuerrechnung, Prov. Steuerrechnung, Kontoauszug, Auflage/Buchprüfung, Einsprache/Rekurs …), dann Kategorie. Grundlage: Zuordnungsliste Anhang F (data/firma/mfiles.yaml); sonst Ablagemuster ähnlicher Dokumente übernehmen; nur Werte aus der aktuellen M-Files-Werteliste, über IDs."}
  - {nr: "1.13", taetigkeit: "Sicherheit prüfen", wer: "KI", regel: "Mandant, Jahr und Kategorie sicher über Schwellwert? Schwellwert in der Testphase festlegen; darunter Prüfkorb statt Ablage"}
  - {nr: "1.14", taetigkeit: "Ablage", wer: "KI", system: "M-Files", regel: "Klasse (z.B. StE), Adresse «Nachname Vorname», Jahr, Kategorie, Beschreibung (z.B. «Lohnausweis Arbeitgeber», «Hauptformular»). Grundstückgewinn-, Erbschafts- und Schenkungssteuer: eigene Klassen, Meldung an ML."}
  - {nr: "1.15", taetigkeit: "Weiterleiten nach Typ", wer: "KI", regel: "Veranlagung, Rechnung, Nachfrage → Schritt 5; provisorische Rechnung → Schritt 6; Steuerbeleg/Hauptformular → 1.16"}
  - {nr: "1.16–1.17", taetigkeit: "Prozessobjekt nachführen", wer: "KI", system: "M-Files", regel: "bei «Offen»: Status «Unterlagen erhalten» und Feld Unterlagen erhalten = Eingangsdatum; sonst (Nachlieferung) mit Kundenpendenzen-Details abgleichen, erledigte Positionen streichen, alle erledigt → Flag zurücksetzen; Status bleibt"}
  - {nr: "1.18", taetigkeit: "Protokoll", wer: "KI", system: "M-Files", regel: "Kanal, Datei, Mandant, Jahr, Kategorie, Sicherheit, Aktion, Ergebnis"}
  pruefkorb: 'Prüfkorb = Grund, Vorschlag KI, Dokument-Link, gebündelt an FE. Anlässe: Datei nicht lesbar/Passwort, Mandant mehrdeutig, juristische Person, Sicherheit unter Schwellwert.'
- nr: '2'
  titel: Verarbeitung der Unterlagen – sofort nach Eingang
  status: Unterlagen erhalten → in Arbeit (St) → zur Kontrolle
  ausloeser: Status «Unterlagen erhalten» – sofort, ohne Wartezeit und ohne Mindestbestand an Belegen (Entscheid 26.10.2026)
  agent: A3 Vollständigkeit, A4 Erfassung DrTax, A5 QK und Vermögensvergleich, A6 Entwurf
  output: Kundenpendenzen direkt nach Erhalt, Erfassung DrTax, Vermögensplausibilisierung, Entwurf-PDF in M-Files, Status «zur Kontrolle»
  seiten: [11, 12, 13]
  teilschritte:
  - {nr: "2.1", taetigkeit: "Status «Unterlagen erhalten»", wann: "sofort bei Eingang", wer: "KI", system: "M-Files", regel: "Feld «Unterlagen erhalten» = Eingangsdatum (nie überschreiben); aus «Offen», «Offen (Steuerkunde)» oder «Offen (Laufkundschaft)»"}
  - {nr: "2.2", taetigkeit: "Vorjahresabgleich, Soll-Belegliste", wann: "direkt nach Erhalt", wer: "KI", system: "M-Files", regel: "Vorjahresdeklaration (PDF, bis StE 2024 aus kantonaler Software), Vorjahresbelege (StE: Belege eingereicht, WSVZ, Liegenschaften), Einschätzung Vorjahr (Veranlagung + def. Steuerrechnung) → Soll-Belegliste"}
  - {nr: "2.3", taetigkeit: "Vollständigkeit, Kundenpendenzen ermitteln", wann: "direkt nach 2.2", wer: "KI", system: "M-Files", regel: "Flag «Kundenpendenzen offen» + Details (Liste); QK «StE mit Vorjahr / mit Einschätzung Vorjahr überprüft»; bei Nachlieferungen neu prüfen, Erledigtes streichen, Flag zurücksetzen wenn alles da"}
  - {nr: "2.4", taetigkeit: "Einforderung fehlender Unterlagen", wann: "direkt nach 2.3", wer: "KI", system: "M365", regel: "E-Mail nur als Entwurf an die SB gemäss M-Files; Versand nach Freigabe SB (bis Entscheid Fragen 24 / 31)"}
  - {nr: "2.5", taetigkeit: "Direkt in DrTax abfüllen, Status «in Arbeit (St)»", wann: "direkt nach 2.3, parallel zu 2.4", wer: "KI", system: "DrTax, M-Files", regel: "Mandant über Namen suchen (eindeutig → weiter; nicht vorhanden → anlegen mit Stammdaten aus M-Files (Master); mehrdeutig → Prüfkorb). Beleg für Beleg mit Beleg-Referenz je Position; unsichere Werte nie schätzen → Pendenz an SB; fehlende Belege blockieren nicht"}
  - {nr: "2.6", taetigkeit: "Prüfpunkte", wann: "während der Erfassung", wer: "KI", system: "DrTax, M-Files", regel: "ausländische Quellensteuer, Steuerausscheidung (Kategorie Steuerausscheidung), Steuerfaktoren → Checkboxen"}
  - {nr: "2.7", taetigkeit: "Plausibilisierung Vermögensentwicklung", wann: "nach der Erfassung", wer: "KI", system: "DrTax, M-Files", regel: "Vermögensvergleich (zentral) → Checkbox; ungeklärte Differenz in Notiz; wesentliche Veränderungen ab ± CHF 20'000 Einkommen / ± CHF 50'000 Vermögen → Feld «Wesentliche Veränderungen zum Vorjahr» abfüllen"}
  - {nr: "2.8", taetigkeit: "Steuerberechnung, Entwurf ablegen, «zur Kontrolle»", wann: "nach 2.7", wer: "KI", system: "DrTax, M-Files", regel: "Flag «Steuerberechnung erstellt»; Entwurf als PDF: Klasse StE, Kategorie Deklaration, Beschreibung «Entwurf TT.MM.JJJJ»; «Zugewiesen an» = Prüfer; offene Pendenzen bleiben im Flag"}
  hinweis: 'Schnittstelle DrTax noch offen (Ringler Informatik AG): Variante A Datenimport über Hersteller-Schnittstelle, Variante B strukturierte Erfassungsliste für SB. Die Online-Übermittlung darf für das KI-Konto nie verfügbar sein.'
- nr: '3'
  titel: Prüfung durch ML und Besprechung mit dem Kunden
  status: zur Kontrolle → zur Fertigstellung / Versand
  ausloeser: Status «zur Kontrolle»
  agent: A7 Protokoll (Besprechung)
  output: Besprechungsprotokoll, Feld «Wesentliche Veränderungen», Pendenzen, Status durch ML
  seiten: [14, 15, 16]
  teilschritte:
  - {nr: "3.1", taetigkeit: "M-Files sendet E-Mail an Prüfer ML", wer: "M-Files"}
  - {nr: "3.2", taetigkeit: "Daten sammeln", wer: "KI", regel: "Entwurf, Vorjahr, Einschätzung Vorjahr, QK-Felder, Kundenpendenzen"}
  - {nr: "3.3", taetigkeit: "Besprechungsprotokoll-Entwurf", wer: "KI", regel: "1 Einkünfte · 2 Vermögen · 3 Abzüge · 4 Schulden · 5 Weitere Punkte · 6 Steuerplanung als Vorschlag"}
  - {nr: "3.4", taetigkeit: "Protokoll ablegen", wer: "KI", regel: "Beschreibung «Besprechungsprotokoll Entwurf TT.MM.JJJJ»"}
  - {nr: "3.5", taetigkeit: "Feld Wesentliche Veränderungen zum Vorjahr nachführen", wer: "KI"}
  - {nr: "3.6–3.7", taetigkeit: "ML prüft Entwurf und Protokoll; Risikobeurteilung Ja/Nein (bei Ja separater Prozess ML)", wer: "ML"}
  - {nr: "3.8", taetigkeit: "Korrekturen nötig?", wer: "ML", regel: "ja → Korrekturauftrag an SB/KI, Status bleibt «zur Kontrolle» (kein Rückweg im Workflow), zurück zu Schritt 2 ab 2.8"}
  - {nr: "3.9–3.10", taetigkeit: "Besprechung mit dem Kunden (persönlich, Telefon, Sitzung; ML oder SB); ML ergänzt Protokoll mit Entscheiden des Kunden", wer: "ML/SB"}
  - {nr: "3.11", taetigkeit: "Neue Pendenzen aus Besprechung?", wer: "KI", regel: "ja → Flag Kundenpendenzen und Details, KI trägt nach Angabe ML ein"}
  - {nr: "3.12", taetigkeit: "ML setzt Status «zur Fertigstellung / Versand», Zuweisung an SB", wer: "nur ML"}
  protokoll:
    Kopf: Mandant (z.B. Hans und Anna Muster), Steuerjahr, Datum, ML, SB – Quelle Prozessobjekt
    1 Einkünfte: Vergleich Vorjahr je Einkunftsart, wesentliche Abweichungen mit Begründung oder Frage an den Kunden – DrTax aktuell und Vorjahr
    2 Vermögen: Vergleich Vorjahr, Ergebnis Vermögensvergleich, nicht erklärte Differenz – DrTax, QK
    3 Abzüge: neue, weggefallene oder veränderte Abzüge – DrTax
    4 Schulden: Veränderungen Hypotheken und übrige Schulden, Schuldzinsen – DrTax
    5 Weitere Punkte: Abweichungen zur Einschätzung Vorjahr, offene Kundenpendenzen, Steuerausscheidung, Quellensteuer-Rückforderung – Prozessobjekt, QK
    6 Steuerplanung: Hinweise als Vorschlag gekennzeichnet; Entscheid ML – KI-Vorschlag
    regel: Wesentlich ist eine Abweichung ab ± CHF 20'000 beim Einkommen bzw. ± CHF 50'000 beim Vermögen. Das Protokoll enthält nie Daten anderer Mandanten.
- nr: '4'
  titel: Fertigstellung, Einreichung, Fristenliste und Abschluss
  status: zur Fertigstellung / Versand → Abgeschlossen
  ausloeser: Status «zur Fertigstellung / Versand»; danach Status «In Excel-Fristenliste austragen» durch ML / SB
  agent: A1 Nachlieferungen, A3 Pendenzen, A4 Ergänzung DrTax, A8 Fristen und Abschluss
  output: finale StE, Fristenliste nachgeführt, Kopie beim Kunden, Rücksendung, Status «Abgeschlossen»
  seiten: [17, 18, 19]
  teilschritte:
  - {nr: "4.1–4.5", taetigkeit: "Pendenzen erledigen", wer: "KI", system: "M-Files, DrTax", regel: "Flag Kundenpendenzen offen? ja → auf Nachlieferung warten (alle Kanäle aus Schritt 1); nach 14 Tagen Erinnerung an Kunde als E-Mail-Entwurf, Freigabe SB; fehlt weiterhin → Erinnerung an SB/ML; Nachlieferung zuordnen, mit Details abgleichen, Erledigtes streichen; Werte in DrTax ergänzen, Steuerberechnung neu. Erinnerungsintervall offen (Frage 23); Flag zurücksetzen, wenn alle Positionen erledigt"}
  - {nr: "4.6", taetigkeit: "Finale StE ablegen", wer: "KI / SB", system: "M-Files", regel: "Kategorie «Deklaration», Beschreibung «Steuererklärung final»; Freigabequittung vom Kunden unterzeichnet? nein → Meldung an SB, keine Einreichung"}
  - {nr: "4.7", taetigkeit: "Einreichung", wer: "nur ML / SB", system: "DrTax / Post", regel: "primär online aus DrTax, sonst Post. Die KI hat technisch keine Übermittlungsrechte"}
  - {nr: "4.8", taetigkeit: "Übermittlungsbestätigung", wer: "KI", system: "M-Files", regel: "Kategorie «Übermittlungsbestätigung»"}
  - {nr: "4.9", taetigkeit: "Status «In Excel-Fristenliste austragen»", wer: "nur ML / SB", system: "M-Files", regel: "bestätigt die Einreichung; für das KI-Konto gesperrt. Fristen: Steuerperiode 2025 Excel in M-Files, ab 01.01.2027 in DrTax"}
  - {nr: "4.10", taetigkeit: "Fristenliste nachführen", wer: "KI", system: "Excel in M-Files", regel: "«Fristenliste Natürliche Personen»; nur Spalte «erledigt» (= Datum) schreiben, nur wenn Zeile des Mandanten eindeutig, sonst Prüfkorb; M-Files-Versionierung nutzen"}
  - {nr: "4.11", taetigkeit: "Kopie an Kunde", wer: "KI", system: "Kundenportal, M365, DeepBox", regel: "Kanal gemäss SB: Kundenportal → Flag Kundenportal auf finaler StE setzen (Name der Eigenschaft offen, T11); E-Mail → E-Mail-Entwurf mit Kopie, Freigabe SB"}
  - {nr: "4.12–4.14", taetigkeit: "Rücksendung und Abschluss", wer: "SEK / SB, KI", system: "M-Files", regel: "Status «Physische ULA zurückschicken»; physischer Eingang markiert? ja → Aufgabe an Sekretariat, Unterlagen per Post zurück, Rücksendung bestätigt → «Abgeschlossen»; nein (nur digital) → KI setzt «Abgeschlossen»"}
- nr: '5'
  titel: Kontrolle Veranlagung und Steuerrechnung
  status: ohne Workflow-Status
  ausloeser: Eingang Veranlagung, Steuerrechnung, Nachfrage oder Auflage (meist per Post an consis)
  agent: A9 Veranlagung
  output: Ablage, Kontrolle gegen eingereichte Deklaration, E-Mail an SB bei Abweichung, Veranlagung immer an den Kunden
  seiten: [20, 21, 22, 23]
  teilschritte:
  - {nr: "5.1", taetigkeit: "Dokumenttyp", wer: "KI", regel: "Veranlagung → 5.2; Nachfrage/Auflage → 5.4 E-Mail an SB mit Frist und Dokument-Link; Steuerrechnung allein (z.B. TG) → mit geprüfter Veranlagung verknüpfen → 5.3"}
  - {nr: "5.2", taetigkeit: "Kontrolle je Position", wer: "KI", regel: "eingereichte Deklaration und Veranlagung laden; Kontrolle je Position Kanton/Gemeinde und Bund, steuerbar und satzbestimmend, Einkommen, Vermögen, Abzüge, Schulden; Vergleichstabelle ablegen (Position, deklariert, veranlagt, Differenz)"}
  - {nr: "5.4", taetigkeit: "Abweichung melden", wer: "KI", regel: "Jede Abweichung (auch CHF 1) und jede Nachfrage → E-Mail an zuständige SB gemäss M-Files (Entscheid 27.10.2026, T12). Betreff «Veranlagung [Jahr] Hans und Anna Muster – Abweichung CHF [Betrag]»; Inhalt: Kanton/Bund, Vergleichstabelle, Begründung Steueramt, Links auf beide Dokumente, Frist als Datum, Vorschlag KI. Aktuell zusätzlich an FE."}
  - {nr: "5.5–5.7", taetigkeit: "Entscheid SB", wer: "SB / ML", regel: "SB entscheidet: selbst intervenieren (klärt mit Kunde oder Steueramt) oder ML beiziehen; Einsprache nur ML / Steuerexperte, Frist gemäss Rechtsmittelbelehrung (in der Regel 30 Tage)"}
  - {nr: "5.3", taetigkeit: "Steuerrechnung prüfen", wer: "KI", regel: "SG: Schlussrechnung liegt mit Veranlagung vor; TG: Rechnung folgt später, Veranlagung vorab weiterleiten; ZH, AR: für den Testlauf weggelassen (Rechnung einzeln prüfen nach dem Testlauf)"}
  - {nr: "5.8–5.9", taetigkeit: "Veranlagung an den Kunden", wer: "KI / SB", regel: "immer, auch bei Übereinstimmung (Frage 27); Kanal gemäss SB: E-Mail-Entwurf mit Freigabe SB oder Flag Kundenportal; Fall erledigt, Protokoll; Zahlung: nur Indiz über Kontoauszug"}
  ablage: 'Klasse «Veranlagung + def. Steuerrechnung» (Bund, Kanton/Gemeinde, Kapitalleistung), Nachfragen «Auflage/Buchprüfung», Einsprachen «Einsprache/Rekurs», Kontoauszüge «Kontoauszug». Antworten an das Steueramt nur SB oder ML.'
- nr: '6'
  titel: Provisorische Steuerrechnung
  status: ohne Workflow-Status
  ausloeser: Eingang provisorische Rechnung, Jahresbeginn, meist per Post an consis als Vertreterin
  agent: A10 Provisorische Rechnung
