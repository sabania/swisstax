ergaenzungen_prozessbeschrieb:
- thema: Klassen im Bereich ST ausserhalb StE
  inhalt: 'Zuerst Klasse im Bereich ST – Steuern: StE, Veranlagung + def. Steuerrechnung, Prov. Steuerrechnung, Kontoauszug, Auflage/Buchprüfung, Einsprache/Rekurs; dann Kategorie (nur Klasse StE).'
  quelle: steuerprozess-np-2026-10-27 S. 10, Schritt 1.11–1.12
- thema: Kategorien laut Prozessbeschrieb, die in der Kategorienliste 05.11.2026 fehlen
  inhalt: Belege WSVZ, Belege Liegenschaften, Scan 1. Seite (Prozessbeschrieb S. 10 und S. 11, Schritt 2.2). Die Excel-Liste (neuer) kennt diese Kategorien nicht → mit FE klären; bis dahin Excel-Kategorien
    verwenden.
  quelle: steuerprozess-np-2026-10-27 S. 10–11
  status: offen
- thema: Veranlagung, Steuerrechnung, Nachfrage
  inhalt: 'Klasse «Veranlagung + def. Steuerrechnung» (Bund, Kanton/Gemeinde, Kapitalleistung); Nachfragen «Auflage/Buchprüfung»; Einsprachen «Einsprache/Rekurs»; Kontoauszüge (des Steueramts) «Kontoauszug»
    → weiter in Schritt 5. Provisorische Rechnung: Klasse «Prov. Steuerrechnung» → Schritt 6.'
  quelle: steuerprozess-np-2026-10-27 S. 9, S. 23, S. 24
- thema: Andere Klassen
  inhalt: 'Grundstückgewinn-, Erbschafts- und Schenkungssteuer: eigene Klassen, Meldung an ML.'
  quelle: steuerprozess-np-2026-10-27 S. 10, Schritt 1.14
- thema: Beschreibung
  inhalt: 'Beschreibung z.B. «Lohnausweis Arbeitgeber», «Hauptformular»; Entwurf: «Entwurf TT.MM.JJJJ»; final: «Steuererklärung final»; Protokoll: «Besprechungsprotokoll Entwurf TT.MM.JJJJ».'
  quelle: steuerprozess-np-2026-10-27 S. 10, S. 12, S. 14, S. 17
offene_punkte:
- 'Alle Zuordnungen: Spalte «Bestätigt» im Excel leer → Vorschlag, nicht bestätigt.'
- 'Nr. 26 Freigabequittung: «Offen: Deklaration oder Unterlagen Kunde?» (Excel).'
- 'Nr. 7 und 8: Quelle «Anhang F (02.11.2026), prüfen».'
- 'Belegtypen ohne Excel-Zeile (Zuordnung durch Wiki als Vorschlag unter Nr. 15 «Andere Nachweise»): Taggeld, Kapitalleistung, Mitarbeiterbeteiligung, Alimente, Liegenschaftsunterlagen u.a. – bestätigen.'
- Kategorien Belege WSVZ / Belege Liegenschaften / Scan 1. Seite (Prozessbeschrieb) fehlen in der Kategorienliste.
- 'Nicht steuerrelevante Dokumente aus Kundenportal/DeepBox/Scan (K3–K6): Prozessbeschrieb hat keinen eigenen Zweig (nur K1/K2: E-Mail unberührt lassen) → Vorschlag: Prüfkorb mit Grund «nicht steuerrelevant».'
