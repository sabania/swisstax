kanton: zh
jahr: 2026
formular: 'Steuererklärung 2026 Kanton Zürich, Hauptformular Form. 300 – gemäss Formular/Wegleitung 2026 für unterjährige Steuerpflicht (zh-form-300-2026-uj, zh-wl-2026-uj; reguläres Formular 2026 noch
  nicht publiziert, Ziffern/Codes gelten voraussichtlich unverändert, am regulären Formular prüfen). Hilfsblätter: Berufsauslagen (Form. 360), Versicherungsprämien (Form. 365), Berufsorientierte Aus- und
  Weiterbildungskosten (Form. 367) mit Aufstellung behinderungsbedingte Kosten, Aufstellung Krankheits- und Unfallkosten (Form. 370), Wertschriften- und Guthabenverzeichnis (Form. 340), Liegenschaftenverzeichnis
  (Form. 350), Schuldenverzeichnis (Form. 355). Neu 2026: Ziff. 14.3 Einkauf Säule 3a.'
