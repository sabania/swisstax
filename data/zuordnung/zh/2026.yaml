- ziffer: '16.1'
  abschnitt: Abzüge
  bezeichnung: Beiträge an die AHV, IV und 2. Säule, sofern nicht unter Ziff. 1 und 2 abgezogen (Code 280)
  key: abzug.vorsorge.saeule2_einkauf
  belege:
  - bescheinigung-pk-einkauf
  - lohnausweis
  feld: Bescheinigung der Vorsorgeeinrichtung (Formular 21 EDP) für selbst einbezahlte Einkäufe; NICHT Lohnausweis Ziff. 10.2
  regel: Nur Beiträge/Einkäufe eintragen, die nicht schon im Lohnausweis vom Lohn abgezogen sind. Lohnausweis Ziff. 10.2 (Einkauf, im Bruttolohn abgezogen) ist im Nettolohn Ziff. 11 bereits berücksichtigt
    – nicht nochmals abziehen. Selbst entrichtete (nicht vom Lohn abgezogene) Einkäufe bescheinigt die Vorsorgeeinrichtung separat mit Formular 21 EDP; Bescheinigung beilegen. Einkäufe sind nicht abziehbar,
