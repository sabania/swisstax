  - chunk: bund-dbg-2025__art-22-t2
    zitat: Leibrentenversicherungen sowie Leibrenten- und Verpfründungsverträge sind im Umfang ihres Ertragsanteils steuerbar.
  - chunk: zh-wl-2025__c0052
    zitat: 'Berechnungsformel: Erhaltene Leibrente / Verpfründung x Berechnungssatz (in %)'
  - chunk: zh-wl-2025__c0052
    zitat: bescheinigung ist zusammen mit der Steuererklärung einzureichen.
  - chunk: bund-dbg-2025__art-22-t3
    zitat: Bei Leistungen aus ausländischen Leibrentenversicherungen, aus Leibrenten- und aus Verpfründungsverträgen
  status: strittig
  bemerkung: 'Widerspruch Gesetz vs. Wegleitung: StG ZH § 22 Abs. 3 (zh-stg-2025, Nachtrag 127) = 40 Prozent; WL ZH 2025 (c0025, c0052) = flexibler Ertragsanteil seit 1.1.2025 (bisher pauschal 40 %). Rangfolge
    Gesetz > Wegleitung, aber StG-Fassung im Wiki möglicherweise nicht auf Stand. Praxis der Wegleitung (Bescheinigung des Versicherers) anwenden und Fachperson informieren. Gegenprobe Prüfung: StHG Art.
    7 Abs. 2 (Fassung 2025) kennt den flexiblen Ertragsanteil; nach Art. 72 Abs. 2 StHG gilt Bundesrecht direkt, wenn das kantonale Recht widerspricht – das spricht für die Wegleitung (Versichererbescheinigung/ESTV-Satz).
    Endentscheid bleibt bei der Fachperson (status strittig).'
  rein:
  - Steuerbescheinigung des Versicherers (Leibrentenversicherung) → steuerbarer Ertragsanteil
  - 'Private/ausländische Leibrente, Verpfründung: Leibrentenvertrag (Kopie) + ESTV-Berechnungssatz der Steuerperiode'
  - Zahlungsnachweis erhaltene Rente 2025 → Gesamtbetrag (Vorkolonne «Betrag»)
  berechnung: 'Vorkolonne = Gesamtrente; Hauptkolonne = Ertragsanteil lt. Versicherer bzw. Rente × Berechnungssatz / 100; «Prozente» leer. Bund: Art. 22 Abs. 3 DBG'
  beachten:
  - 'STRITTIG: StG § 22 Abs. 3 = 40 %, WL 2025 = flexibler Ertragsanteil (StHG Art. 72 → WL); Fachperson entscheidet.'
  - 'Bund lit. b: Überschussleistungen 70 %; lit. c (ausländ. LRV, Leibrenten-/Verpfründungsvertrag): Rendite zehnj. BO + 0,5 Pp.'
  - Bescheinigung bzw. Vertragskopie zwingend mit der Steuererklärung einreichen.
