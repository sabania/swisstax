bund_spalte:
  text: 'Keine Bundesspalte: Abweichungen für die direkte Bundessteuer nimmt die Steuerverwaltung automatisch vor.'
  quelle: ar-wl-2025__c0179
  zitat: Anpassungen durch die Steuerverwaltung automatisch vorgenommen
hinweis: 'Das AR-Formular hat keine separate Bundesspalte: Die Steuererklärung dient zugleich für die direkte Bundessteuer; Abweichungen (z.B. Zweiverdiener-, Versicherungs-, Kinderabzug Bund) werden von
  der Steuerverwaltung automatisch vorgenommen (WL AR 2025 S. 33, ar-wl-2025__c0179: «Anpassungen durch die Steuerverwaltung automatisch vorgenommen»).'
