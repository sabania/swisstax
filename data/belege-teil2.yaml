  - Verpflegung und anderer Unterhalt des Kindes sind Lebenshaltungskosten und nicht abziehbar; wenn sie nicht separat ausgewiesen sind, ist der Rechnungsbetrag zu kürzen (SG pauschal Fr. 8 pro Tag ausserhalb
    des Haushalts; TG anerkennt ohne Gegenbeweis nur 75 %).
  - Fahrkosten zur Betreuungsstätte zählen in AR zu den Betreuungskosten.
  - Bei Ehepaaren müssen beide Ehegatten gleichzeitig erwerbstätig/in Ausbildung/erwerbsunfähig sein; bei getrennt besteuerten Eltern hat der Elternteil im Haushalt des Kindes Anspruch (bei alternierender
