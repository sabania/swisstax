    TG: Kantonal pro Kind in der Regel 75 % der nachgewiesenen Kosten, maximal Fr. 10'100 (§ 11c StV TG); betreuende Person muss das 16. Altersjahr vollendet haben; Bund Fr. 25'800 (WL TG 2025 Ziff. 15.3).
  quellen:
