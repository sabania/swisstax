    AR: Maximal Fr. 25'000 je Kind (Staat), Formular 10; Belege (Rechnungen, Quittungen, Lohnabrechnungen) auf Verlangen; Empfänger muss ersichtlich sein; erhaltene Beiträge nach Kinderbetreuungsgesetz
