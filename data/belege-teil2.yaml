  bedingung: Nur für Kinder unter 14 Jahren, die im gleichen Haushalt leben wie die steuerpflichtige Person, die für den Unterhalt sorgt, und nur wenn die Kosten in direktem kausalem Zusammenhang mit Erwerbstätigkeit,
    Ausbildung oder Erwerbsunfähigkeit stehen; Verpflegungs-/Lebenshaltungskosten sind nicht abziehbar; Betreuung durch die Eltern selbst nicht abziehbar.
  zweck:
