belege:
- id: hypothekarbestaetigung
  name: Hypothekarbestätigung / Zinsbescheinigung der Bank (Hypothekar- und Baukreditzinsen)
  erkennen:
  - 'Absender: Bank, Pensionskasse oder Versicherung als Hypothekargläubigerin; Titel «Hypothekarbestätigung», «Zins- und Saldobestätigung» oder «Schuldenausweis per 31.12.»'
  - 'Typische Begriffe: Hypothekarschuld/Kapital per 31.12., Zinssatz, Festhypothek/SARON-Hypothek, bezahlte Zinsen, Amortisation'
  - Grundpfandobjekt (Adresse, Parzelle) und Laufzeit/Tranchen aufgeführt
  - Jahresabschluss- oder Kontoauszug des Hypothekarkontos mit Zins- und Amortisationsbuchungen
  relevanz: ja
  zweck:
  - abzug
  - vermoegen
  positionen:
  - abzug.schuldzinsen
  - schulden.privat
  extrahieren:
  - Schuldsaldo per 31.12. (je Tranche) für das Schuldenverzeichnis
  - Im Steuerjahr bezahlte Hypothekarzinsen (ohne Amortisationen) – Abzug Schuldzinsen
  - Gläubigerin mit Adresse, Zinssatz, Objekt (Pflichtangaben im Schuldenverzeichnis)
  - Baukreditzinsen separat ausweisen lassen (Anlagekosten vs. abziehbar je nach Kanton)
  hinweise:
  - Nur Zinsen sind abziehbar, nicht Amortisationen (Schuldrückzahlungen); Amortisation vom Zinsbetrag trennen.
  - 'Private Schuldzinsen sind begrenzt auf die steuerbaren Vermögenserträge (Wertschriften, Liegenschaften) plus Fr. 50''000 (Art. 33 Abs. 1 lit. a DBG und kantonal gleich); Rechner: Zinsabzug = min(bezahlte
    Zinsen; Vermögenserträge + 50''000).'
  - 'Zinsen und Saldo gehören zusammen: Schuld per 31.12. (Vermögen) und Zinsen des Jahres (Einkommen) aus demselben Beleg; Schuldenverzeichnis ist der Steuererklärung beizulegen.'
  - Baurechtszinsen selbstgenutzter Eigenheime sind im Eigenmietwert berücksichtigt und nicht als Schuldzins abziehbar (SG, AR); bei Fremdvermietung abziehbar (TG).
  - Bei Solidarschulden (Ehepaar/Miteigentum) Anteil der steuerpflichtigen Person beachten.
  kantone:
    ZH: Mehrere Positionen sind in einer separaten Aufstellung oder im Schuldenverzeichnis aufzuführen und der Steuererklärung beizulegen; Amortisationen und Leasingraten nicht abzugsberechtigt (WL ZH 2025
      Ziff. 12).
    SG: Zinsen auf Formular 5 Teil A; Baukreditzinsen gelten als Anlagekosten und sind nicht abziehbar (WL SG 2025 Ziff. 11).
    AR: Zinsen auf Formular 5 Teil A; Baukreditzinsen sind – anders als in SG – abzugsfähig (WL AR 2025 Ziff. 11).
    TG: Formular 4.1 (Schuldenverzeichnis), Gläubiger mit genauer Adresse und Zinssatz sind unerlässlich; Bau- und Landkreditzinsen während der Bauphase gelten als Anlagekosten (WL TG 2025).
  quellen:
  - chunk: bund-dbg-2025__art-33-t1
    zitat: die privaten Schuldzinsen im Umfang der nach den Artikeln 20, 20a und 21 steuerbaren Vermögenserträge und weiterer 50 000 Franken
  - chunk: zh-wl-2025__c0073
    zitat: abzugsberechtigt sind Amortisationen (Schuldrückzahlungen) sowie Leasingraten
  - chunk: sg-wl-2025__c0083
    zitat: Private Schuldzinsen sind nur im Umfang der Einkünfte aus Wertschriften und
  - chunk: ar-wl-2025__c0081
    zitat: Schuldzinsen, die als Anlagekosten gelten (ausser Baukreditzinsen; diese sind
  - chunk: tg-wl-2025__c0171
    zitat: Unerlässlich ist insbesondere die Angabe der Gläubigerin bzw. des Gläubigers
  status: extrahiert
- id: kredit-darlehen-schuldzinsen
  name: Kredit-/Darlehensvertrag, Privatkredit, Lombard-, Konsum- oder Familiendarlehen (Zinsbescheinigung)
  erkennen:
  - Titel «Kreditvertrag», «Darlehensvertrag», «Privatkredit», «Lombardkredit», «Kreditkarten-/Kontokorrentabrechnung mit Sollzinsen»
  - 'Absender: Bank, Kreditinstitut, Leasing-/Kreditgesellschaft oder Privatperson (Familiendarlehen)'
  - 'Typische Begriffe: Kreditsumme, Sollzins, Effektivzins, Restschuld per 31.12., bezahlte Zinsen, Gläubiger'
  - Jahreszinsbescheinigung oder Kontoauszug mit Zinsbelastung
  relevanz: ja
  zweck:
  - abzug
  - vermoegen
  positionen:
  - abzug.schuldzinsen
  - schulden.privat
  extrahieren:
  - Restschuld per 31.12. – ins Schuldenverzeichnis
  - Im Steuerjahr bezahlte Zinsen (ohne Kapitalrückzahlung, ohne Gebühren/Leasingraten)
  - Gläubiger mit Name und Adresse, Zinssatz, Zweck/Datum der Aufnahme
  - 'Bei Darlehen unter Nahestehenden: schriftlicher Vertrag, marktübliche Bedingungen'
  hinweise:
  - Die Schuld muss steuerlich anerkannt sein (Kapitalforderung als Schuld anerkannt); bei Privatdarlehen Gläubiger und Zinssatz belegen.
  - Private Schuldzinsen sind auf Vermögenserträge plus Fr. 50'000 begrenzt (Art. 33 Abs. 1 lit. a DBG, kantonal analog).
  - 'Kredit-Zahlungen sind meist Annuitäten: Zins- und Tilgungsanteil trennen; nur der Zinsanteil ist abziehbar. Schuldzinsen auf Geschäftsschulden gehören in die Geschäftsrechnung, nicht in Ziff. Schuldzinsen
    privat.'
  - Darlehensforderungen, die der Mandant selber gewährt hat, gehören als Guthaben ins Wertschriften-/Guthabenverzeichnis (Vermögen), Zinsertrag ist steuerbares Einkommen.
  kantone:
    SG: Private Schulden/Zinsen auf Formular 5 Teil A; geschäftliche Schuldzinsen sind in der Jahresrechnung enthalten und nicht auf Formular 5 aufzuführen (WL SG 2025 Ziff. 11).
    AR: Formular 5 Teil A; Total in Ziffer 11 der Steuererklärung (WL AR 2025 Ziff. 11).
    TG: Formular 4.1 A/B; Total der Schuldzinsen in Ziff. 11, Schulden in Ziff. 34 (WL TG 2025).
    ZH: Schuldenverzeichnis beilegen; Ziff. 12 (WL ZH 2025).
  quellen:
  - chunk: sg-wl-2025__c0083
    zitat: Schuldzinsen sind abzugsfähig, sofern die Kapitalforderung selbst steuerrechtlich
  - chunk: ar-wl-2025__c0081
    zitat: Zinsen für private Schul-
  - chunk: tg-wl-2025__c0173
    zitat: und unbeweglichem Vermögen und weiterer Fr. 50 000 in Abzug bringen
  - chunk: bund-dbg-2025__art-33-t1
    zitat: die privaten Schuldzinsen im Umfang der nach den Artikeln 20, 20a und 21 steuerbaren Vermögenserträge und weiterer 50 000 Franken
  status: extrahiert
- id: leasingvertrag
  name: Leasingvertrag Fahrzeug / Leasingraten-Abrechnung
  erkennen:
  - 'Titel «Leasingvertrag», «Leasingantrag», «Leasing-Abrechnung»; Absender: Leasinggesellschaft (z.B. Bank- oder Hersteller-Leasing)'
  - 'Typische Begriffe: Leasingobjekt (Marke, Typ, Chassisnummer), monatliche Leasingrate, Laufzeit, Restwert, Kilometerleistung, Sonderzahlung'
  - Rate teils mit Zins- und Amortisationsanteil ausgewiesen
  - 'Bei Geschäftsfahrzeug: Arbeitgeber als Leasingnehmer, Mandant nur Nutzer (Lohnausweis Kästchen F bzw. Ziff. 2.2 Privatanteil)'
  relevanz: nein
  bedingung: 'Privat geleaste Fahrzeuge: Leasingraten und die darin enthaltenen Zinsanteile sind nicht abziehbar (Lebenshaltungskosten, Art. 34 DBG); das geleaste Fahrzeug ist nicht als Vermögen zu deklarieren.
    Nur relevant (bedingt) bei geschäftlicher Nutzung durch Selbständige (Aufwand in der Jahresrechnung) oder als Information für den Fahrkostenabzug (Auto als Arbeitsweg, begründeter Fall).'
  zweck:
  - info
  positionen:
  - abzug.schuldzinsen
  - vermoegen.fahrzeuge
  - abzug.berufskosten.fahrkosten
  extrahieren:
  - 'Nur zur Abklärung: Leasingnehmer (Mandant oder Arbeitgeber/Geschäft), Vertragsbeginn/-ende'
  - 'Falls Selbständigerwerbender: Leasingaufwand für die Jahresrechnung (Geschäftsanteil)'
  - Jährliche Kilometerleistung nur, wenn Autokosten für Arbeitsweg geltend gemacht werden
  hinweise:
  - Leasingraten (mit darin enthaltenen Zinsanteilen) sind keine Schuldzinsen und nicht abziehbar; Rate nicht in Schuldenverzeichnis oder Ziff. Schuldzinsen übernehmen.
  - Geleaste Fahrzeuge sind im Vermögen nicht zu deklarieren (anders als eigene Fahrzeuge im Eigentum, siehe fahrzeugausweis-arbeitsweg).
  - Der Fahrkostenabzug bei Privatauto ist unabhängig vom Leasing nur in begründeten Fällen mit Kilometerpauschale möglich; die Leasingkosten selbst sind mit der Pauschale abgegolten.
  - 'Bei Geschäftsfahrzeug des Arbeitgebers: keine Fahrkosten abziehbar (ZH WL 2025 Ziff. 11).'
  kantone:
    ZH: Leasingraten (mit Zinsanteilen) nicht abzugsberechtigt (WL ZH 2025 Ziff. 12); geleaste Fahrzeuge müssen im Vermögen nicht deklariert werden (WL ZH 2025 Ziff. 30.4).
    SG: Leasinggebühren persönlicher Gebrauchsgegenstände und privater Fahrzeuge sind nicht abzugsfähig (WL SG 2025 Ziff. 11).
    AR: Leasingraten persönlicher Gebrauchsgegenstände und privater Fahrzeuge nicht abziehbar (WL AR 2025 Ziff. 11).
    TG: Leasingzinsen sind grundsätzlich nicht abzugsfähig (WL TG 2025 Ziff. 11).
  quellen:
  - chunk: zh-wl-2025__c0073
    zitat: abzugsberechtigt sind Amortisationen (Schuldrückzahlungen) sowie Leasingraten
  - chunk: sg-wl-2025__c0083
    zitat: Leasinggebühren persönlicher Gebrauchsgegenstände und privater
  - chunk: ar-wl-2025__c0081
    zitat: Leasingraten persönlicher Gebrauchsgegenstände und privater Fahrzeuge.
  - chunk: tg-wl-2025__c0173
    zitat: Leasingzinsen sind grundsätzlich nicht abzugsfähig.
  - chunk: zh-wl-2025__c0140
    zitat: Nicht deklariert werden müssen geleaste Fahrzeuge.
  status: extrahiert
- id: liegenschaft-unterhaltsrechnungen
  name: Handwerker- und Unterhaltsrechnungen Liegenschaft (Reparaturen, Renovationen, Energiespar-/Umweltschutzmassnahmen)
  erkennen:
  - Rechnungen/Quittungen von Handwerkern, Gewerbe, Architekten, Haustechnik, Gärtner, Hauswartung für das Eigenheim oder die Mietliegenschaft
  - 'Typische Begriffe: Sanitär, Maler, Dach, Heizung/Wärmepumpe, Fenster, Küche, Umbau, Sanierung, Reparatur, Service, Wartung'
  - Offerten oder Schlussabrechnungen von Sanierungen; Rechnungsdatum und Zahlungsdatum
  - 'Stockwerkeigentum: Erneuerungsfonds-Einlagen und Verwalter-Abrechnung der Stockwerkeigentümergemeinschaft'
  relevanz: bedingt
  bedingung: Nur bei Wahl der tatsächlichen Kosten (statt Pauschalabzug) und nur für abziehbare Unterhaltskosten; wertvermehrende Aufwendungen (Anbau, Luxusausbau) sind nicht abziehbar. Bei Pauschalabzug
    werden Rechnungen nicht benötigt, aber zur Prüfung der günstigeren Variante auswerten.
  zweck:
  - abzug
  positionen:
  - abzug.liegenschaft.unterhalt
  - abzug.liegenschaft.energie_umwelt
  extrahieren:
  - Rechnungsdatum bzw. Zahlungsdatum, Rechnungssteller, Art der Arbeit, Betrag brutto (Aufstellung nach Datum, Art der Leistung, Empfänger, Betrag)
  - Aufteilung Unterhalt (abziehbar) / wertvermehrend (nicht abziehbar) / Energiespar- und Umweltschutzinvestitionen
  - Abzug von Versicherungsleistungen und Förderbeiträgen (Gebäudeprogramm) von den Kosten
  - Jahr der Bezahlung/Rechnungsstellung (Periodenzuordnung)
  hinweise:
  - Wahlrecht Pauschale oder tatsächliche Kosten gilt je Liegenschaft und je Steuerperiode (Bund und alle vier Kantone); bei Geschäftsliegenschaften nur tatsächliche Kosten.
  - Wertvermehrende Aufwendungen und Anschaffungs-/Herstellkosten sind nicht abziehbar (Abgrenzung nach ZStB 30.3 / KS 22a).
  - 'Ersatzneubau: Rückbau- und Investitionskosten dürfen auf die zwei folgenden Perioden vorgetragen werden, wenn sie in der laufenden Periode nicht voll berücksichtigt werden können (Art. 32 Abs. 2bis
    DBG).'
  - Belege werden in der Regel nicht mit der Steuererklärung eingereicht, sondern auf Verlangen im Einschätzungsverfahren; trotzdem vollständig aufbewahren (mindestens bis zur Rechtskraft der Veranlagung).
  - Förderbeiträge und Versicherungsleistungen sind von den Kosten abzuziehen; Subventionen sind nie zusätzlich steuerbar, aber nur die Nettokosten sind abziehbar.
  kantone:
    ZH: Belege zu Liegenschaftskosten erst auf Verlangen im Einschätzungsverfahren (WL ZH 2025 Beilagen); bei effektiven Kosten ist eine detaillierte Aufstellung (Datum, Art der Leistung, Empfänger, Beträge)
      beizulegen (Formular 350). Pauschale 20 % des Bruttomietertrags (abzüglich Heizung/Warmwasser/Treppenhausreinigung).
    SG: Pauschale 20 % des steuerlich massgebenden Mietertrags/Eigenmietwerts nur für ganz oder vorwiegend zu Wohnzwecken dienende Liegenschaften; massgebend ist das Rechnungsdatum der im Kalenderjahr selbst
      bezahlten Kosten (WL SG 2025 Formular 7 C).
    AR: Pauschalabzug nur, wenn der jährliche Bruttomietertrag des gesamten Liegenschaftsbesitzes Fr. 100 000.– nicht übersteigt (Art. 25 StV AR); Wahlrecht je Gebäude.
    TG: Pauschale 10 % (Gebäude bis 10 Jahre) bzw. 20 % (älter als 10 Jahre); Pauschale schliesst auch Energiespar-, Umweltschutz- und Rückbaukosten sowie Liegenschaftssteuer ein (§ 9 StV TG).
  quellen:
  - chunk: bund-dbg-2025__art-32-t2
    zitat: anstelle der tatsächlichen Kosten und Prämien einen Pauschalabzug geltend machen
  - chunk: zh-wl-2025__c0184
    zitat: Pauschale oder der tatsächlichen Aufwendungen geltend gemacht werden
  - chunk: zh-wl-2025__c0207
    zitat: Belege zu den Liegenschaftskosten und gemeinnützigen Zuwendungen
  - chunk: sg-wl-2025__c0161
    zitat: von 20% des steuerlich massgebenden Mietertrages
  - chunk: ar-stv__art-25
    zitat: nicht übersteigt
  - chunk: tg-stv__par-9
    zitat: für mehr als zehn Jahre alte Gebäude 20 Prozent des Bruttomietertrages
  status: extrahiert
- id: liegenschaft-schaetzung-eigenmietwert
  name: Schätzungsprotokoll / Steuerwert- und Eigenmietwert-Verfügung Liegenschaft (amtliche Schätzung, Liegenschaftssteuerrechnung)
  erkennen:
  - 'Absender: kantonale Steuerverwaltung, Gemeindesteueramt, Schätzungskommission; Titel «Schätzungsprotokoll», «Verfügung Steuerwert / Eigenmietwert», «Liegenschaftssteuerrechnung»'
  - 'Typische Begriffe: Verkehrswert, Steuerwert, Ertragswert (Landwirtschaft), Eigenmietwert/Mietwert, Schätzungsjahr, Grundstücknummer, Katasterwert'
  - 'Eröffnung mit Einsprachehinweis; ZH: Mitteilung Neubewertung, Fragebogen hedonische Methode'
  - 'Bei ausserkantonalen/ausländischen Liegenschaften: Steuerwertmitteilung des Belegenheitskantons bzw. Verkehrswertschätzung'
  relevanz: ja
  zweck:
  - einkommen
  - vermoegen
  positionen:
  - einkommen.liegenschaften.eigenmietwert
  - vermoegen.liegenschaften
  - sozialabzug.eigenmietwert
  extrahieren:
  - Steuerwert (Vermögen) per 31.12. des Steuerjahres, Schätzungsjahr
  - Eigenmietwert/Mietwert (Einkommen) laut rechtskräftiger Schätzung
  - Datum der Eröffnung / Rechtskraft; Einsprachefrist
  - 'Bei Neu-/Umbauten: Baukosten und Fertigstellungsdatum für den Zuschlag zum Steuerwert'
  hinweise:
  - Massgebend ist grundsätzlich der am Ende der Steuerperiode rechtskräftig eröffnete Wert; die Schätzung nicht selbst berechnen, ausser Neu-/Anbauten ohne neue Schätzung (kantonale Zuschläge).
  - 'Der Eigenmietwert ist Einkommen (Art. 21 Abs. 1 lit. b DBG); Steuerwert ist Vermögen (Kanton, nicht Bund). Eigenmietwert bei dauernd selbstbewohntem Eigenheim: Kantone unterschiedlich (AR 20 % Abzug;
    ZH Weisung).'
  - 'Aussen-/Auslandsliegenschaften: Steuerwert des Belegenheitskantons, Veranlagungsbehörde nimmt Repartitionswert vor (TG).'
  - 'Reform Eigenmietwert: Abschaffung des Eigenmietwerts durch den Bundesrat auf den 1.1.2029 angekündigt – für Steuerjahre 2025/2026 gilt der Eigenmietwert unverändert (Quelle: Medienmitteilung); ZH hat
    ab 2026 eine neue Bewertungsweisung (Weisung 2026) – Einzelheiten und Übergangsregelung in data/werte prüfen (nicht in diesem Beleg bestätigt).'
  kantone:
    ZH: 'Weisung 2009 (bis Steuerjahr 2025): schematische Ermittlung; liegt der Wert über 70 % oder unter 60 % der Marktmiete, ist eine individuelle Schätzung vorzunehmen (Weisung 2009 ZH Ziff. 83).'
    SG: Der massgebliche Steuerwert wird vom Gemeindesteueramt eröffnet; bei Neu-/Anbauten ohne Schätzung Zuschlag von 80 % der Neu-/Anbaukosten zum Verkehrswert (WL SG 2025 Formular 7 A).
    AR: Eigenmietwert = Mietwert der letzten amtlichen Schätzung abzüglich 20 %; bei Zweit-/Ferienwohnungen und Landwirtschaft entfällt der Abzug; wertvermehrende Investitionen 2.8 % Zuschlag (WL AR 2025
      Formular 7 B).
    TG: Massgebend ist der am Ende der Steuerperiode rechtskräftig eröffnete Mietwert (StP 23 Nr. 1 Ziff. 3.3); Steuerwert = rechtskräftiger amtlicher Verkehrswert (WL TG 2025 Formular 7).
  quellen:
  - chunk: bund-dbg-2025__art-21
    zitat: der Mietwert von Liegenschaften oder Liegenschaftsteilen, die dem Steuerpflichtigen aufgrund von Eigentum
  - chunk: zh-weisung-liegenschaften-2009__c0033
    zitat: der über 70% der Marktmiete oder unter 60% derselben liegt
  - chunk: sg-wl-2025__c0155
    zitat: Der massgebliche Steuerwert wird vom Gemeindesteueramt eröffnet.
  - chunk: ar-wl-2025__c0166
    zitat: Mietwert abzüglich 20 Prozent
  - chunk: tg-stp-23-1__c0004
    zitat: Massgebend für die Bewertung ist in der Regel der am Ende der zu bemessenden Steuerperiode rechtskräftige
  status: extrahiert
- id: liegenschaft-mietertraege
  name: Mietverträge / Mietzinsabrechnung / Mietzinsaufstellung (vermietete Liegenschaft, Garage, Ferienwohnung)
  erkennen:
  - Mietvertrag(e) und Mietzinsabrechnung der Verwaltung (Liegenschaftsverwaltung, Immobilientreuhand) für das Steuerjahr
  - 'Typische Begriffe: Nettomietzins, Bruttomietzins, Akontozahlungen Nebenkosten, Heiz- und Warmwasserkosten, Hauswart, Leerstand, Mietzinsausfall'
  - Jahresabrechnung der Verwaltung (Einnahmen-/Ausgabenrechnung, Nebenkostenabrechnung)
  - Einnahmen aus Garagen, Abstellplätzen, Gewerberäumen, Reklame, Photovoltaik-Einspeisevergütung
  relevanz: bedingt
  bedingung: Nur bei vermieteten oder verpachteten Liegenschaften, Zimmern, Garagen oder Parkplätzen sowie bei Untervermietung; bei reiner Selbstnutzung irrelevant (dort nur Eigenmietwert, siehe liegenschaft-schaetzung-eigenmietwert).
  zweck:
  - einkommen
  positionen:
  - einkommen.liegenschaften.mietertrag
  - abzug.liegenschaft.unterhalt
  extrahieren:
  - Bruttomietertrag des Steuerjahres (sämtliche Miet-/Pachtzinsen inkl. Garagen, Gewerbe, Reklame)
  - 'Von Mietern bezahlte Nebenkosten (Heizung, Warmwasser, Treppenhausreinigung): nur steuerfrei soweit sie die tatsächlichen Aufwendungen nicht übersteigen'
  - Mietzinsreduktion für Hauswart/Verwalter als Arbeitsentgelt (hinzurechnen)
  - Leerstand/Mietzinsausfall und Vermietungsdauer bei Ferienwohnungen
  hinweise:
  - Steuerbar sind sämtliche Miet- und Pachtzinseinnahmen, auch Garagen, Abstellplätze, gewerblich genutzte Räume; Nebenkostenakonti sind nur in Höhe der tatsächlichen Heiz-/Warmwasser-/Treppenhausreinigungskosten
    steuerfrei.
  - Sind Heiz- und Nebenkosten im Mietzins inbegriffen, dürfen die tatsächlichen Auslagen hierfür vorweg vom Bruttomietertrag abgezogen werden; alle übrigen Nebenkostenvergütungen sind zu deklarieren.
  - Einspeisevergütungen für Photovoltaikanlagen sind steuerbar (TG WL 2025); bei möblierten Ferienwohnungen gelten reduzierte Ansätze der Bruttoeinnahmen (WL 2a 2025).
  - Der Pauschalabzug für Unterhalt/Verwaltung wird als Prozentsatz vom (um Mieter-Nebenkosten bereinigten) Bruttomietertrag berechnet – Mietabrechnung vollständig einholen.
  kantone:
    ZH: 'Liegenschaftsverzeichnis (Formular 350): Mieteinnahmen, Eigenmietwert und Unterhaltskosten pro Liegenschaft; Nettoertrag in Ziff. 6 der Steuererklärung (WL ZH 2025).'
    SG: Formular 7 B.b Mietertrag und Leistungen Dritter.
    AR: 'Formular 7 Teil B: Eigenmietwert (Abzug 20 %), Mietertrag, Photovoltaik; Verbrauchskosten (Strom, Wasser, Heizung) bei Eigengebrauch nicht abziehbar (WL AR 2025).'
    TG: Zahlungen der Mieter für Heizung, Warmwasser und Reinigung sind nicht steuerbar, soweit sie die tatsächlichen Aufwendungen nicht übersteigen (WL TG 2025 / StP 23 Nr. 1).
  quellen:
  - chunk: zh-wl-2025__c0175
    zitat: Steuerbar sind sämtliche Miet- und Pachtzinseinnahmen
  - chunk: tg-wl-2025__c0223
    zitat: Zahlungen der mietenden Personen für Heizung, Warmwasser und Reinigung von Treppenhaus
  - chunk: tg-stp-23-1__c0002
    zitat: Steuerbar sind sämtliche Miet- und Pachtzinseinnahmen, die der Steuerpflichtige aus Grundeigentum
  - chunk: ar-wl-2025__c0170
    zitat: Kosten gelten als nicht abzugsfähige Lebenshaltungskosten.
  status: extrahiert
- id: liegenschaft-nebenkosten-gebaeudeversicherung
  name: Nebenkosten-, Versicherungs- und Verwaltungsabrechnungen Liegenschaft (Gebäudeversicherung, Grundstücksteuern, Hauswart, Verwalter)
  erkennen:
  - Rechnung/Police der Gebäudeversicherung (kantonale Gebäudeversicherung, Brand-, Wasserschaden-, Glas-, Gebäudehaftpflichtversicherung)
  - Abrechnung Liegenschaftssteuer / Grundsteuer, Perimeter/Unterhaltsperimeter, Gebühren Abwasser/Kehricht
  - Verwaltungshonorar der Liegenschaftsverwaltung oder Stockwerkeigentümergemeinschaft (Jahresabrechnung)
  - Nebenkostenabrechnung (Heizöl, Strom, Wasser, Kehricht, Hauswart)
  relevanz: bedingt
  bedingung: Nur bei Abzug der tatsächlichen Kosten (nicht bei Pauschalabzug, der Versicherungsprämien und Verwaltungskosten bereits einschliesst); abziehbar sind Versicherungsprämien, Verwaltungskosten
    Dritter und bei Vermietung die nicht auf die Mieter überwälzten Betriebskosten; Verbrauchskosten (Heizung, Strom, Wasser, Kehricht) sind bei Eigennutzung nicht abziehbar (Lebenshaltungskosten).
  zweck:
  - abzug
  positionen:
  - abzug.liegenschaft.unterhalt
  extrahieren:
  - Jahresprämie der Gebäudeversicherung (Sach- und Haftpflicht für die Liegenschaft) mit Rechnungsdatum
  - Liegenschaftssteuer / Grundsteuern, Unterhaltsperimeter (nutzungsunabhängige Kosten)
  - Verwaltungshonorar Dritter (nicht Entschädigung für eigene Arbeit)
  - Nicht überwälzte Betriebskosten bei Vermietung (Nebenkostenabrechnung)
  hinweise:
  - Bei Pauschalabzug sind Versicherungsprämien, Verwaltung durch Dritte und Liegenschaftssteuer in der Pauschale enthalten (TG § 9 Abs. 3 StV); keine Doppelberücksichtigung.
  - Bei Eigennutzung abziehbar nur nutzungsunabhängige Betriebskosten (Wartung, Prämien, Perimeter); Verbrauchskosten für Wasser, Gas, Strom, Heizung, Abwasser- und Kehrichtgebühren sind nicht abziehbar.
  - 'Bei Vermietung: Betriebskosten, die auf die Mieter überwälzt werden, sind nicht zusätzlich abziehbar (Nebenkosten-Akonti dort bereits ausserhalb des steuerbaren Ertrags gelassen, wenn sie die Aufwendungen
    nicht übersteigen).'
  - Entschädigung für eigene Arbeit des Eigentümers ist nicht abziehbar (SG Art. 28 StV Abs. 3).
  kantone:
    SG: Abziehbar sind Prämien für Sach- und Haftpflichtversicherung für die Liegenschaft; bei Eigengebrauch Betriebskosten nur, soweit nicht unmittelbar durch die Nutzung bedingt (Art. 28 StV SG).
    AR: 'Abziehbar: Unterhaltsperimeter, Wartungsarbeiten (z.B. Heizung), Prämien für Brand-, Wasserschaden-, Glas- und Gebäudehaftpflichtversicherung; nicht abziehbar: Verbrauch Wasser/Gas/Strom, Heizung,
      Abwasser- und Kehrichtgebühren (WL AR 2025).'
    TG: Pauschale schliesst Versicherungsprämien, Verwaltung durch Dritte und die Liegenschaftensteuer ein (§ 9 Abs. 3 StV TG).
    ZH: Versicherungsprämien und Verwaltungskosten Dritter sind Teil der Unterhalts- und Verwaltungskosten (Pauschale oder effektiv, WL ZH 2025).
  quellen:
  - chunk: bund-dbg-2025__art-32-t2
    zitat: anstelle der tatsächlichen Kosten und Prämien einen Pauschalabzug geltend machen
  - chunk: sg-stv__art-28
    zitat: Zu den abziehbaren Versicherungsprämien gehören die Prämien für Sach- und Haftpflichtversicherung für die Liegenschaft.
  - chunk: ar-wl-2025__c0170
    zitat: Kosten gelten als nicht abzugsfähige Lebenshaltungskosten.
  - chunk: tg-stv__par-9
    zitat: die Versicherungsprämien, die Denkmalpflege sowie die Liegenschaftensteuer inbegriffen
