  bedingung: 'Nur Zuwendungen in Geld oder Vermögenswerten an steuerbefreite juristische Personen mit Sitz in der Schweiz (öffentliche/gemeinnützige Zwecke); Total muss die Mindestschwelle erreichen (Bund/ZH/SG/AR:
    Fr. 100; TG kantonal: über Fr. 200) und ist auf 20 % des Nettoeinkommens begrenzt. Nicht abziehbar: Freiwilligenarbeit, Spenden an Geselligkeitsvereine (Musik-/Turnvereine), Parteibeiträge (separater
    Beleg parteispende), Spenden an Private/Ausland ohne Steuerbefreiung.'
