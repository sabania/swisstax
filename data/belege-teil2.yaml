    SG: Formular 5 Teil A (Ziff. 21.3); Belege sind bereitzuhalten und erst auf Verlangen einzureichen (WL SG 2025).
    AR: Formular 5 Teil A (Code 550, Ziff. 21.3); abzugsfähig ist der gesamte Betrag bei mind. Fr. 100, max. 20 % des Nettoeinkommens; Verzeichnis der steuerbefreiten Institutionen mit Sitz in AR im Internet
      (WL AR 2025 Ziff. 21).
    TG: Kantonal nur, wenn die Zuwendungen gesamthaft Fr. 200 übersteigen (bei Nettoeinkommen bis Fr. 40'000 max. Fr. 8'000, sonst max. 20 %); Bund ab Fr. 100. Belege erst ab Fr. 1'000 pro Zuwendung einreichen,
      darunter auf Verlangen (WL TG 2025 Ziff. 22).
