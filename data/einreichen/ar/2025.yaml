- beleg_id: erbschaft-schenkung
  einreichen: ja
  bedingung: 'bei Erbschaft/Vermächtnis im Jahr: Kopie Erbteilung; unverteilte Erbschaft: Kopie Inventar und Erbenverzeichnis; Schenkung/Erbvorbezug erhalten oder gemacht: Aufstellung der Zusammensetzung
    (Formular 2 Seite 1)'
  chunk: ar-wl-2025__c0130
  zitat: Bei einer unverteilten Erbschaft ist eine Kopie des Inventars und des Erbenver- zeichnisses beizulegen. Bei einer verteilten Erbschaft ist uns zwingend eine Kopie der Erbteilung beizulegen.
  urteil: bestätigt
