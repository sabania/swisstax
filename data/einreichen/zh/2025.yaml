kanton: zh
jahr: 2025
beschreibung: Einreichepflicht der Belege laut amtlichen Quellen ZH 2025 (Wegleitung, Formulare, Gesetz). Erstellt durch Agent (Extraktion + unabhängige Prüfung, 09.11.2026); Status agent-geprueft. Grundlage
  für die Spalte «Eingereicht?» der Kategorienliste (KATEGORIEN.md).
status: agent-geprueft
allgemein:
- regel: 'Grundsatz: Belege zu Aufstellungen und Formularen nur einreichen, wenn ausdrücklich verlangt (sonst erst auf Verlangen im Einschätzungsverfahren)'
  chunk: zh-wl-2025__c0207
  zitat: Die Belege zu den Aufstellungen und Formularen sind nur dann zusammen mit der Steuererklärung einzureichen, wenn dies ausdrücklich verlangt ist.
- regel: 'Ausdrücklich nur auf Verlangen: Belege zu Liegenschaftskosten und gemeinnützigen Zuwendungen'
  chunk: zh-wl-2025__c0207
  zitat: Insbesondere sind demnach die Belege zu den Liegenschaftskosten und gemeinnützigen Zuwendungen erst im Einschät- zungsverfahren auf Verlangen nachzureichen.
- regel: Belegkopien im Format A4; Unterlagen werden nicht zurückgegeben
  chunk: zh-wl-2025__c0207
  zitat: Belegkopien sind im Format A4 einzureichen. Die Unterlagen werden nicht retourniert.
- regel: 'Papier-Einreichung: Beilagen in Papierform, keine elektronischen Datenträger (CD/DVD)'
  chunk: zh-wl-2025__c0201
  zitat: Beilagen zur Steuererklärung sind in Papierform einzureichen. Elektronische Datenträger wie CD, DVD usw. können aus Sicherheitsgründen nicht angenommen werden
- regel: 'Online-Einreichung: erforderliche Beilagen zusammen mit der Steuererklärung elektronisch einreichen (§ 8 Abs. 4 V elektr. Einreichung)'
  chunk: zh-v-einreichung__par-8
  zitat: Die erforderlichen Beilagen sind zusammen mit der Steuererklärung elektronisch einzureichen.
- regel: 'Online-Einreichung: Die Steuererklärung gilt als eingereicht, wenn sie elektronisch übermittelt und dabei elektronisch als «wahrheitsgemäss und vollständig» bestätigt wurde (§ 8 Abs. 1 V elektr. Einreichung).
    Eine separate Papier-Freigabequittung sehen die ZH-Quellen 2025 nicht vor. Ehegatten und eingetragene Partner bestätigen gemeinsam (Abs. 2).'
  chunk: zh-v-einreichung__par-8
  zitat: Die Steuererklärung gilt als elektronisch eingereicht, wenn die steuerpflichtige Person die auf der Applikation erfasste Steuererklärung elektronisch an den Server übermittelt und dabei elektronisch
    bestätigt hat, dass die Steuererklärung wahrheitsgemäss und vollständig ausgefüllt ist.
- regel: 'Online-Einreichung: Gemeinsam Steuerpflichtige (Ehegatten, eingetragene Partner) geben die elektronische Bestätigung gemeinsam ab (§ 8 Abs. 2 V elektr. Einreichung)'
  chunk: zh-v-einreichung__par-8
  zitat: Gemeinsam steuerpflichtige Ehegatten und eingetragene Partnerinnen und Partner geben die elektronische Bestätigung gemeinsam ab.
- regel: 'Gesetz: Bei elektronischer Einreichung ersetzt die elektronische Bestätigung die Unterzeichnung (§ 109c Abs. 1 StG)'
  chunk: zh-stg-2025__par-109c-t1
  zitat: In diesem Fall ersetzt eine elektronische Bestätigung der Angaben die Unterzeichnung.
- regel: Einreichung der SE 2025 bis Ende März 2026 an das Scancenter (Papier)
  chunk: zh-wl-2025__c0202
  zitat: Die Steuererklärung ist bis Ende März 2026 dem Scancenter einzureichen.
- regel: 'Verfahren (ZStB 132.1, Fassung ab 1.1.2026, massgebend für die Einreichung der SE 2025): Steuererklärung samt Wertschriftenverzeichnis bis 31. März online oder ans Scan-Center'
  chunk: zh-zstb-132-1__c0022
  zitat: Die Steuererklärung ist zusammen mit dem Wertschriftenverzeichnis bis 31. März des der Steuerperiode folgenden Kalenderjahres online oder dem Scan-Center einzureichen.
- regel: 'Verfahren SE 2025 (ZStB 133.1 Aufforderung zur Einreichung 2026): Steuererklärung zusammen mit den erforderlichen Beilagen gemäss § 134 StG bis 31. März 2026 online oder ans Scan-Center [Prüfer:
    Eintrag ergänzt]'
  chunk: zh-zstb-133-1-aufforderung-2026__c0004
  zitat: Die Steuererklärungen sind, zusammen mit den erforderlichen Beilagen gemäss § 134 StG, bis 31. März 2026 online (www.zh.ch/steuererklaerung) oder dem Scan-Center einzureichen.
- regel: 'Gesetz: Formular vollständig ausfüllen, unterzeichnen und samt vorgeschriebenen Beilagen fristgemäss einreichen (§ 133 Abs. 2 StG)'
  chunk: zh-stg-2025__par-133
  zitat: Die steuerpflichtige Person muss das amtliche Formular für die Steuererklärung wahrheitsgemäss und vollständig ausfüllen, persönlich unterzeichnen und samt den vorgeschriebenen Beilagen fristgemäss
    der zuständigen Behörde einreichen.
- regel: 'Gesetzliche Pflichtbeilagen natürlicher Personen (§ 134 Abs. 1 StG): Lohnausweise, Ausweise über VR-/Organbezüge, Verzeichnisse über Wertschriften, Forderungen und Schulden, Bescheinigungen 2.
    Säule/3a (sofern nicht im Lohnausweis)'
  chunk: zh-stg-2025__par-134
  zitat: 'Natürliche Personen müssen der Steuererklärung insbesondere beilegen:'
- regel: Verzeichnisse über sämtliche Wertschriften, Forderungen und Schulden sind Pflichtbeilage (§ 134 Abs. 1 lit. c StG)
  chunk: zh-stg-2025__par-134
  zitat: c. Verzeichnisse über sämtliche Wertschriften, Forderungen und Schulden,
- regel: Auf Verlangen der Steuerbehörde Belege und Bescheinigungen vorlegen (§ 135 Abs. 2 StG)
  chunk: zh-stg-2025__par-135
  zitat: Er muss auf Verlangen der Steuerbehörde insbesondere mündlich oder schriftlich Auskunft erteilen und Geschäftsbücher, Belege und weitere Bescheinigungen sowie Urkunden über den Geschäftsverkehr
    vorlegen.
- regel: 'Selbständigerwerbende: Urkunden und Belege 10 Jahre aufbewahren (§ 135 Abs. 3 StG)'
  chunk: zh-stg-2025__par-135
  zitat: Natürliche Personen mit Einkommen aus selbstständiger Erwerbstätigkeit und juristische Personen müssen Urkunden und sonstige Belege, die mit ihrer Tätigkeit in Zusammenhang stehen, während zehn
    Jahren aufbewahren.
- regel: 'Fehlende Bescheinigungen trotz Mahnung: Steuerbehörde kann sie beim Dritten einfordern (§ 136 Abs. 2 StG)'
  chunk: zh-stg-2025__par-136
  zitat: Reicht der Steuerpflichtige trotz Mahnung die nötigen Bescheinigungen nicht ein, kann sie die Steuerbehörde vom Dritten einfordern.
- regel: 'Beilagen Unselbständigerwerbende: Lohnausweis(e) inkl. Beilagen, Bescheinigungen Mitarbeiterbeteiligungen, Formular Berufsauslagen/Versicherungsprämien'
  chunk: zh-wl-2025__c0203
  zitat: Formular Berufsauslagen/Versicherungsprämien.
- regel: 'Beilagen Liegenschaftenbesitzer: Liegenschaftenverzeichnis mit allfälligen Beiblättern (weitere Gruppen: VR-Entschädigungen, ALV-Taggelder, Erbengemeinschaften, Geschäftsanteile)'
  chunk: zh-wl-2025__c0205
  zitat: Liegenschaftenverzeichnis mit allfälligen Beiblättern.
- regel: Weitere Beilagen nur, wenn entsprechende Abzüge geltend gemacht werden (u.a. Aufstellungen Liegenschaftsunterhalt effektiv, Berufsauslagen effektiv, gemeinnützige Zuwendungen, Unterstützungsleistungen,
    Fremdbetreuung; Bescheinigungen 3a, AHV/IV/PK; Formulare Schuldenverzeichnis, Weiterbildung, Krankheits-/Behinderungskosten, Qualifizierte Beteiligungen, Hilfsblatt STAF)
  chunk: zh-wl-2025__c0206
  zitat: 'Wenn Sie entsprechende Abzüge geltend machen, haben Sie der Steuererklärung ausserdem nachstehende Aufstellungen, Bescheinigungen und Formulare beizulegen:'
- regel: 'Effektive Berufsauslagen statt Pauschale: Aufstellung beilegen'
  chunk: zh-wl-2025__c0206
  zitat: Aufstellung über die übrigen Berufsauslagen, falls der Abzug der tatsächlichen Aufwendun- gen beansprucht wird;
- regel: 'Schulden: vollständiges Schuldenverzeichnis (Gläubiger mit Adresse, Zinssatz) einreichen'
  chunk: zh-wl-2025__c0141
  zitat: Werden Schulden deklariert, ist ein vollständiges Schuldenverzeichnis mit der Steuererklärung einzureichen.
- regel: 'Checkliste Wertschriftenverzeichnis: Gutschriftsanzeigen beilegen für Festgeld (Kolonne A), nicht kotierte Beteiligungstitel, Lotteriegewinne, qualifizierte Beteiligungen'
  chunk: zh-wl-2025__c0172
  zitat: 'Sind die Gutschriftsanzeigen vollständig beigelegt für:'
- regel: 'Nicht kotierte inländische Titel: Bescheinigung über die Ausschüttungen stets beilegen'
  chunk: zh-wl-2025__c0163
  zitat: Bei nicht kotierten Titeln ist stets die Bescheinigung über die Ausschüttungen beizulegen.
- regel: 'Unterstützungsabzug: Bestätigung der unterstützten Person einreichen; Zahlungsbelege auf Verlangen'
  chunk: zh-wl-2025__c0134
  zitat: haben Sie mit der Steuererklärung eine Bestätigung der unterstützten Person über Art, Zeitpunkt und Höhe der erfolgten Unterstützungen einzureichen.
- regel: 'Bezahlte Leibrenten/Verpfründungen (Ziff. 13.3): beweiskräftige Belege (Vertrag, Überweisungsbelege) einreichen'
  chunk: zh-wl-2025__c0080
  zitat: Mit der Steuererklärung 2025 sind beweiskräftige Belege über die bezahlten
- regel: 'Ausserkantonale mit Liegenschaft/Betriebsstätte in ZH: Kopie der Wohnsitzkanton-Steuererklärung genügt, persönlich unterzeichnet, mit leerer vorbeschrifteter ZH-Steuererklärung'
  chunk: zh-wl-2025__c0008
  zitat: Diese Kopie ist jedoch persönlich zu unterzeichnen; zudem ist ihr die leere vorbeschriftete Steuererklärung des Kantons Zürich beizulegen.
belege:
- beleg_id: lohnausweis
  einreichen: ja
  bedingung: immer, für jeden Arbeitgeber inkl. Nebenerwerb; Lohnausweis inkl. Beilagen (§ 134 Abs. 1 lit. a StG; WL S. 31)
  chunk: zh-wl-2025__c0032
  zitat: Bitte vergessen Sie nicht, Ihre Lohnausweise der Steuererklärung beizulegen.
  urteil: bestätigt
- beleg_id: rentenbescheinigung-ahv-iv
  einreichen: auf_verlangen
  bedingung: 'keine ausdrückliche Beilagepflicht: Ziff. 3.1 ohne Beilagevermerk im Formular, nicht in der Beilagenliste WL S. 31 (WL S. 32 nennt Rentenbescheinigungen nur als bereitzuhaltende Unterlage)
    -> Vorlage auf Verlangen (§ 135 Abs. 2 StG)'
  chunk: zh-stg-2025__par-135
  zitat: Er muss auf Verlangen der Steuerbehörde insbesondere mündlich oder schriftlich Auskunft erteilen und Geschäftsbücher, Belege und weitere Bescheinigungen sowie Urkunden über den Geschäftsverkehr
    vorlegen.
  urteil: bestätigt
- beleg_id: rentenbescheinigung-vorsorge
  einreichen: bedingt
  bedingung: 'Leibrentenversicherungen: Steuerbescheinigung des Versicherers einreichen; private/ausländische Leibrenten: Leibrentenvertrag (Kopie) einreichen (Formular Ziff. 3.2); für PK-/3a-Renten keine
    ausdrückliche Beilagepflicht (nur auf Verlangen)'
  chunk: zh-wl-2025__c0052
  zitat: Die Steuer- bescheinigung ist zusammen mit der Steuererklärung einzureichen.
  urteil: bestätigt
- beleg_id: taggeldbescheinigung
  einreichen: ja
  bedingung: 'sofern Taggelder/EO/Familienzulagen direkt von Versicherung bzw. Ausgleichs-/Arbeitslosenkasse ausbezahlt (nicht im Lohnausweis); ALV: Bescheinigung der Arbeitslosenkasse (WL Ziff. 3.3/3.4,
    Beilagenliste S. 31)'
  chunk: zh-wl-2025__c0055
  zitat: eine Bescheinigung über diese Einkünfte und reichen Sie diese mit der Steuererklärung ein.
  urteil: bestätigt
- beleg_id: bescheinigung-saeule3a
  einreichen: ja
  bedingung: bei Abzug Säule 3a (Ziff. 14)
  chunk: zh-wl-2025__c0081
  zitat: Der Steuererklärung sind die Bescheinigungen der Versicherung oder Bankstiftung beizulegen.
  urteil: bestätigt
- beleg_id: bescheinigung-pk-einkauf
  einreichen: ja
  bedingung: bei Abzug von Beiträgen/Einkäufen 2. Säule unter Ziff. 16.1 (soweit nicht im Lohnausweis enthalten)
  chunk: zh-wl-2025__c0092
  zitat: Die abziehbaren Einkaufsbeiträge sind der von der Vorsorgeeinrichtung ausgestellten Bescheinigung zu entnehmen, die mit der Steuererklärung einzureichen ist.
  urteil: bestätigt
- beleg_id: steuerauszug-bank
  einreichen: bedingt
  bedingung: beizulegen, wenn im Wertschriften- und Guthabenverzeichnis auf das Steuerverzeichnis der Bank verwiesen wird (statt Einzelauflistung); eSteuerauszug kann online importiert werden (WL c0153);
    Wertschriftenverzeichnis selbst ist Pflichtbeilage
  chunk: zh-wl-2025__c0173
  zitat: Liegen die detaillierten Steuerverzeichnisse bzw. Steuerbewertungen bei, auf welche im Wertschriften- und Guthabenverzeichnis verwiesen wird?
  urteil: bestätigt
- beleg_id: kontoauszug-zinsausweis
  einreichen: bedingt
  bedingung: nur Festgeldanlagen (Abrechnungsbelege des Schuldners) und Kassenobligationen mit Zeichnung/Rückzahlung/Umtausch im Jahr (Bankabrechnungen); gewöhnliche Konti nur im Wertschriftenverzeichnis
    aufführen
  chunk: zh-wl-2025__c0162
  zitat: Die Abrechnungsbelege des Schuldners sind beizulegen.
  urteil: bestätigt
- beleg_id: depotauszug
  einreichen: bedingt
  bedingung: wenn im Wertschriftenverzeichnis darauf verwiesen wird; zudem Kauf-/Verkaufsabrechnungen bei Obligationen mit Einmalverzinsung, Optionen, Derivaten (WL c0169/c0173) und Ausschüttungsbescheinigungen
    nicht kotierter Titel (c0163)
  chunk: zh-wl-2025__c0173
  zitat: Liegen die detaillierten Steuerverzeichnisse bzw. Steuerbewertungen bei, auf welche im Wertschriften- und Guthabenverzeichnis verwiesen wird?
  urteil: bestätigt
- beleg_id: krypto-auszug
  einreichen: ja
  bedingung: 'bei Kryptowährungen im Vermögen: Nachweis zwingend per Wallet-/Kontoauszug, Stand Ende Steuerperiode (WL S. 25); die WL sagt nicht ausdrücklich «beilegen/mit der Steuererklärung einreichen»
    (vgl. Grundsatz c0207) – «ja» ist die vorsichtige Lesart, Fachperson entscheidet'
  chunk: zh-wl-2025__c0159
  zitat: Der Nachweis hat mittels Kontoauszug der digitalen Brieftasche (Wallet), Stand per Ende der Steuerperiode, zu erfolgen.
  urteil: unklar
