- beleg_id: unterhaltszahlungen-alimente
  einreichen: bedingt
  bedingung: 'Strittig (reports/entscheidungsvorlage-strittig.md Nr. 11) – bis zum Entscheid der Fachperson Zahlungsnachweise
    zu 13.1/13.2 beilegen: Formular 300 Block 13 «sämtliche Zahlungsnachweise» (zh-form-300-2025__c0007) vs. WL-Grundsatz
    «nur auf Verlangen» (zh-wl-2025__c0207; WL S. 15 bezieht den Hinweis auf Leibrenten, zh-wl-2025__c0080). Empfänger
    (Ziff. 5.1/5.2): keine Beilagepflicht, nur Name/Adresse Zahler/in.'
  chunk: zh-wl-2025__c0207
  zitat: Die Belege zu den Aufstellungen und Formularen sind nur dann zusammen mit der Steuererklärung einzureichen, wenn dies ausdrücklich verlangt ist.
  urteil: 'strittig: auf_verlangen (WL) vs. ja (Formularhinweis Block 13) – als «bedingt: im Zweifel beilegen» geführt, bis die
    Fachperson entscheidet (Entscheidungsvorlage Nr. 11)'
