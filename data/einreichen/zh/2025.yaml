- beleg_id: erbschaft-schenkung
  einreichen: bedingt
  bedingung: 'unverteilte Erbschaft: Aufstellung (Erblasser, Erben/Quoten, Vermögen, Erträge, Schulden) und entsprechende Belege beilegen (WL S. 23); Schenkung/Erbvorbezug: Angaben in Ziff. 50, Verträge
    zur separaten Schenkungssteuererklärung an das kant. Steueramt (Nachlass), nicht zur Steuererklärung'
  chunk: zh-wl-2025__c0150
  zitat: Das Vermögen aus unverteilten Erbschaften ist mit dem per 31.12. gültigen Steuerwert an- teilmässig unter Beilage der entsprechenden Belege zu deklarieren.
  urteil: bestätigt
