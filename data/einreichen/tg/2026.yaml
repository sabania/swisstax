kanton: tg
jahr: 2026
beschreibung: Einreichepflicht der Belege laut amtlichen Quellen TG 2026 (Wegleitung, Formulare, Gesetz). Erstellt durch Agent (Extraktion + unabhängige Prüfung, 09.11.2026); Status agent-geprueft. Grundlage
  für die Spalte «Eingereicht?» der Kategorienliste (KATEGORIEN.md).
status: agent-geprueft
allgemein:
- regel: Steuererklärung samt vorgeschriebenen Beilagen fristgemäss einreichen (§ 155 Abs. 2 StG TG, gilt 2025–2027).
  chunk: tg-stg__par-155
  zitat: persönlich zu unterzeichnen und samt den vorgeschriebenen Beilagen fristgemäss der zuständigen Behörde einzureichen
- regel: 'Gesetzliche Pflichtbeilagen natürlicher Personen: Lohnausweise über alle unselbständigen Einkünfte, Ausweise über Bezüge als Organ (VR) einer juristischen Person, Verzeichnisse über Wertschriften,
    Forderungen und Schulden (§ 156 Abs. 1 StG TG).'
  chunk: tg-stg__par-156
  zitat: 'Natürliche Personen müssen der Steuererklärung insbesondere beilegen:'
- regel: Weitere Belege, Bescheinigungen und Urkunden sind auf Verlangen der Veranlagungsbehörde vorzulegen (§ 157 Abs. 1 StG TG).
  chunk: tg-stg__par-157
  zitat: Der Steuerpflichtige hat auf Verlangen der Veranlagungsbehörde mündlich oder schriftlich Auskunft zu erteilen. Er hat Geschäftsbücher, Belege und weitere Bescheinigungen sowie Urkunden über den
    Geschäftsverkehr vorzulegen.
- regel: 'Aufbewahrungspflicht nur für Selbständigerwerbende: Urkunden und Belege 10 Jahre (bei hängigen Verfahren weitere 5 Jahre) aufbewahren (§ 157 Abs. 2 StG TG; WL TG 2026 Ziff. 2).'
  chunk: tg-wl-2026__c0054
  zitat: Kassastreifen usw.), während zehn Jahren, bei hängigen Verfahren während weiterer fünf Jahre, aufzubewahren (Aufbewahrungspflicht).
- regel: Bringt die steuerpflichtige Person nötige Bescheinigungen trotz Mahnung nicht bei, kann die Behörde sie bei Dritten einfordern (§ 158 Abs. 2 StG TG).
  chunk: tg-stg__par-158
  zitat: Bringt der Steuerpflichtige trotz Mahnung die nötigen Bescheinigungen nicht bei, kann sie die Veranlagungsbehörde von Dritten einfordern.
- regel: 'Mitwirkungspflicht: Steuererklärung samt erforderlichen Beilagen fristgerecht einreichen; zusätzliche Unterlagen/Beweismittel auf Aufforderung der Steuerbehörde.'
  chunk: tg-wl-2026__c0022
  zitat: die Einreichung von zusätzlichen Unterlagen und Beweismitteln aufgrund einer entsprechenden Aufforderung der Steuerbehörden.
- regel: 'Werden verlangte Beilagen trotz Mahnung nicht eingereicht: Ermessensveranlagung und Busse.'
  chunk: tg-wl-2026__c0024
  zitat: Wer trotz Mahnung die Steuererklärung oder verlangten Beilagen innert angesetzter Frist nicht ein-
- regel: 'Online-Einreichung (eFisc2026 bzw. zertifizierte Drittsoftware): auch sämtliche beizulegenden Belege können elektronisch erfasst und übermittelt werden.'
  chunk: tg-wl-2026__c0032
  zitat: auch die Möglichkeit, sämtliche der Steuererklärung beizulegenden Belege elektronisch zu
- regel: 'Bei elektronischer Übermittlung: Belege wahlweise mit der unterzeichneten Quittung per Post oder elektronisch einreichen; immer einzureichen sind z.B. sämtliche Lohnausweise, Unterlagen Selbständigerwerb,
    Bank-Steuerauszüge (wenn Titel nur als Total deklariert), Liegenschaftsunterhaltsrechnungen ab Fr. 1''000, Zuwendungsbestätigungen ab Fr. 1''000, 3a-Bescheinigungen.'
  chunk: tg-wl-2026__c0034
  zitat: 'Die Belege können wahlweise zusammen mit der Quittung gesandt oder elektronisch eingereicht werden. Immer einzureichen, ob elektronisch oder via Postversand, sind z.B:'
- regel: Bei elektronischer Übermittlung gilt die Steuererklärung erst mit Eingang der unterzeichneten Quittung als eingereicht; die elektronisch übermittelten Formulare nicht ausdrucken/einreichen.
  chunk: tg-wl-2026__c0035
  zitat: Bei elektronischer Datenübermittlung gilt die Steuererklärung erst als einge- reicht, wenn die unterzeichnete Quittung beim Gemeindesteueramt eingetroffen ist.
- regel: Eingereichte Unterlagen werden inkl. Beilagen gescannt und elektronisch archiviert; keine Rücksendung, Originalbelege werden vernichtet.
  chunk: tg-wl-2026__c0039
  zitat: Die von Ihnen eingereichte Steuererklärung wird, inklusive der Beilagen, vollständig gescannt sowie
- regel: Originalbelege, die noch benötigt werden, nur als gut lesbare Kopien beilegen; keine leeren Formulare (ausser Original-Hauptformular).
  chunk: tg-wl-2026__c0040
  zitat: Sofern Sie die Original-Belege noch benötigen, legen Sie bitte gut lesbare Belegkopien bei.
- regel: 'Sortierung: Belege in der Reihenfolge der Angaben auf dem jeweiligen Formular einreichen.'
  chunk: tg-wl-2026__c0040
  zitat: Bitte reichen Sie die Belege in der Reihenfolge Ihrer Angaben auf dem jeweiligen Formular ein.
- regel: 'Zustellung: unterzeichnete Steuererklärung/Hilfsblätter bzw. Quittung samt allen notwendigen Belegen fristgerecht an das Gemeindesteueramt.'
  chunk: tg-wl-2026__c0041
  zitat: zeichnete Quittung (bei elektronischer Datenübermittlung), sowie alle notwendigen Belege im bei-
- regel: Alle Formulare und Beilagen mit Name und Registernummer (AHVN13) versehen, sofern nicht vorgedruckt.
  chunk: tg-wl-2026__c0029
  zitat: Sofern nicht bereits vorgedruckt, versehen Sie alle Formulare und Beilagen mit Ihrem Namen und
- regel: Checkliste 'Benötigte Unterlagen' (Lohnausweise, Rentenausweise, Zins-/Kapitalbescheinigungen, Wertschriftenverzeichnisse, Schulden-/Schuldzinsbelege, Liegenschaftsrechnungen, Vorsorgebescheinigungen,
    Krankheits-/Weiterbildungsbelege, Jahresrechnung, Lebensversicherungs-Steuerwerte) – als benötigte Unterlagen formuliert, nicht ausdrücklich als Beilagepflicht.
  chunk: tg-wl-2026__c0026
  zitat: 'Dabei kann es sich insbesondere um folgende Unterlagen handeln:'
- regel: 'Schwelle Fr. 1''000 bei freiwilligen Zuwendungen und Parteibeiträgen (Formular 6): unter Fr. 1''000 keine Belege einreichen, die Steuerverwaltung kann sie bei Bedarf nachträglich einverlangen
    (= auf Verlangen); ab Fr. 1''000 pro Zuwendung Quittung/Bescheinigung einreichen. [urteil: korrigiert: c0217 betrifft nur Zuwendungen/Parteibeiträge, nicht den Liegenschaftsunterhalt (dieser jetzt eigener
    Eintrag mit c0231); Zitat um den Vorbehalt der Nachforderung erweitert]'
  chunk: tg-wl-2026__c0217
  zitat: Für Zuwendungen unter Fr. 1'000 sind keine Belege einzureichen. Ab Fr. 1'000 pro Zuwendung reichen Sie bitte die entsprechende Quittung oder Bescheinigung mit Ihrer Steuererklärung ein. Die Steuerverwaltung
    behält sich vor, im Veranlagungsverfahren bei Bedarf auch Quittungen oder Be- scheinigungen für Zuwendungen unter dem Betrag von Fr. 1 000 nachträglich einzuverlangen.
- regel: 'Liegenschaftsunterhalt mit effektiven Kosten (Formular 8): Rechnungskopien für Einzelbeträge ab Fr. 1''000 beilegen; Belege für Einzelbeträge darunter kann die Steuerverwaltung bei Bedarf nachträglich
    einverlangen (= auf Verlangen). Anders als bei den Zuwendungen steht hier kein ausdrückliches «keine Belege einreichen». [urteil: korrigiert: neuer Eintrag, aus dem Eintrag zur Schwelle Fr. 1''000 abgespalten;
    Fundstelle WL c0231, gleichlautend Formular 8 c0001]'
  chunk: tg-wl-2026__c0231
  zitat: Die Steuerverwaltung behält sich vor, bei Bedarf auch Belege für Einzelbeträge unter dem Betrag von Fr. 1'000 nachträglich einzuverlangen.
- regel: 'Aufbewahren: Belege zu Handänderungssteuer und Notariatskosten beim Liegenschaftskauf aufbewahren (nicht abziehbar, aber bei späterer Veräusserung für Grundstückgewinnsteuer).'
  chunk: tg-info-faq__c0047
  zitat: Bewahren Sie die entsprechenden Belege trotzdem auf.
belege:
- beleg_id: lohnausweis
  einreichen: ja
  bedingung: Immer einreichen (auch Nebenerwerb); § 156 Abs. 1 StG zusätzlich Ausweise über Bezüge als VR-/Organmitglied
  chunk: tg-wl-2026__c0034
  zitat: 'Immer einzureichen, ob elektronisch oder via Postversand, sind z.B: – sämtliche Lohnausweise;'
  urteil: bestätigt
- beleg_id: rentenbescheinigung-ahv-iv
  einreichen: unklar
  bedingung: 'Nur in der Liste ''Benötigte Unterlagen'' genannt; keine ausdrückliche Beilagepflicht für AHV/IV-Rentenbescheinigungen (allg.: alle notwendigen Belege zustellen, c0041)'
  chunk: tg-wl-2026__c0026
