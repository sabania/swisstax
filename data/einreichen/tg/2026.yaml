  urteil: bestätigt
- beleg_id: rentenbescheinigung-vorsorge
  einreichen: bedingt
  bedingung: 'Leibrenten/Versicherungsrenten: jährliche Bescheinigung beilegen; bei mehr als zwei Renten zusätzlich Aufstellung mit Versicherungsbescheinigungen; für PK-/3a-Renten keine ausdrückliche Beilageregel
    (nur ''benötigte Unterlagen'', c0026)'
  chunk: tg-wl-2026__c0075
  zitat: Bitte legen Sie diese Bescheinigung der Steuererklärung bei. Beziehen Sie mehr als zwei verschiedene Renten, legen Sie der Steuererklärung bitte eine separate Aufstellung über die Renten und die
    entsprechenden Versicherungsbescheinigungen bei.
  urteil: bestätigt
