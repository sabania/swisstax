  urteil: bestätigt
- regel: 'Fehlende Bescheinigungen: Bringt die steuerpflichtige Person sie trotz Mahnung nicht bei, kann die Behörde sie bei Dritten einfordern (§ 158 Abs. 2 StG TG).'
