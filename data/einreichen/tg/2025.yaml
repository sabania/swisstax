  urteil: bestätigt
- regel: 'Selbständigerwerbende (§ 156 Abs. 2 StG TG): unterzeichnete Jahresrechnungen bzw. bei vereinfachter Buchführung Aufstellungen über Einnahmen/Ausgaben, Vermögenslage, Privatentnahmen/-einlagen
    beilegen.'
  chunk: tg-stg__par-156
