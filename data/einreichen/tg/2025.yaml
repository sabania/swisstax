  zitat: Der Steuerpflichtige hat auf Verlangen der Veranlagungsbehörde mündlich oder schriftlich Auskunft zu erteilen. Er hat Geschäftsbücher, Belege und weitere Bescheinigungen sowie Urkunden über den
    Geschäftsverkehr vorzulegen.
  urteil: bestätigt
- regel: 'Aufbewahrungspflicht Selbständigerwerbende: Geschäftsbelege 10 Jahre, bei hängigen Verfahren weitere 5 Jahre (§ 157 Abs. 2 StG TG; ebenso WL TG 2025 S. 14).'
