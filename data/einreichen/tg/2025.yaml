  urteil: bestätigt
- regel: 'Übrige Belege nur auf Verlangen: Auf Verlangen der Veranlagungsbehörde sind Auskünfte zu erteilen und Belege/Bescheinigungen vorzulegen (§ 157 Abs. 1 StG TG).'
