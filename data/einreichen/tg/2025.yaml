  urteil: bestätigt
- regel: 'Pflichtbeilagen natürliche Personen (§ 156 Abs. 1 StG TG): Lohnausweise über alle unselbständigen Einkünfte, Ausweise über VR-/Organbezüge, Verzeichnisse über sämtliche Wertschriften, Forderungen
    und Schulden.'
