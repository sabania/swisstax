kanton: sg
jahr: 2025
beschreibung: Einreichepflicht der Belege laut amtlichen Quellen SG 2025 (Wegleitung, Formulare, Gesetz). Erstellt durch Agent (Extraktion + unabhängige Prüfung, 09.11.2026); Status agent-geprueft. Grundlage
  für die Spalte «Eingereicht?» der Kategorienliste (KATEGORIEN.md).
status: agent-geprueft
allgemein:
- regel: Mit Formular 1 und 2 sind nur die im Einzelfall benötigten Formulare sowie Bescheinigungen, Aufstellungen und Belege einzureichen, soweit dies bei der jeweiligen Position ausdrücklich verlangt
    ist.
  chunk: sg-wl-2025__c0012
  zitat: die Bescheinigungen und Aufstellungen für jene Positionen, bei denen dies ausdrücklich verlangt ist; – die Belege, soweit dies bei einzelnen Positionen ausdrücklich verlangt wird.
- regel: Nur tatsächlich benötigte Unterlagen einreichen; weitere Belege und Rechnungen bereithalten, die Steuerbehörde verlangt sie bei Bedarf ein (Aufbewahrung mindestens bis zur rechtskräftigen Veranlagung,
    v.a. bei Abzügen und Schulden).
  chunk: sg-wl-2025__c0013
  zitat: Belege und Rechnungen sind bereitzuhalten und werden von der Steuerbehörde
- regel: Unaufgefordert beigelegte Unterlagen nur in Kopie einreichen (keine Rücksendung, Vernichtung nach Veranlagung).
  chunk: sg-wl-2025__c0013
  zitat: Der Steuererklärung unaufgefordert beigelegte Unter lagen dürfen nur in Kopie eingereicht werden, da diese nicht zurückgesandt und nach erfolgter Veranlagung vernichtet werden.
- regel: 'Belege zu den Abzügen: Grundsatz bereithalten und erst auf Verlangen einreichen; Ausnahmen sind in der Wegleitung bei der jeweiligen Ziffer vermerkt. Die Formulare 5, 6 und 7 tragen zudem den
    Randvermerk «Die Belege sind auf Verlangen einzureichen» (zweispaltiges Layout, im Chunk nicht zusammenhängend zitierbar; Fragmente in sg-form-5-2025__c0001/__c0003, sg-form-6-2025__c0001/__c0003, sg-form-7-2025__c0001;
    vgl. raw/sg/2025 Formulare 5/6/7, S. 1). Formular 4 trägt keinen solchen Vermerk.'
  chunk: sg-wl-2025__c0073
  zitat: reitzuhalten und erst auf Verlangen einzureichen sind.
- regel: Wird bei einem Abzug eine Bescheinigung oder Bestätigung verlangt, ist diese der Steuererklärung beizulegen.
  chunk: sg-wl-2025__c0073
  zitat: Soweit bei einzelnen Abzügen eine Bescheinigung oder Bestätigung ver- langt wird, ist diese der Steuererklärung beizulegen.
- regel: 'Gesetzliche Beilagen natürlicher Personen (StG SG Art. 169 Abs. 1): Lohnausweise, Ausweise über VR-/Organbezüge, Verzeichnisse über Wertschriften, Forderungen und Schulden.'
  chunk: sg-stg-2025__art-169
  zitat: 'Natürliche Personen müssen der Steuererklärung für die Einkommens- und Vermögenssteuern insbesondere beilegen:'
- regel: Auf Verlangen der Veranlagungsbehörde sind Belege, Bescheinigungen und Urkunden vorzulegen (Mitwirkungspflicht, StG SG Art. 170 Abs. 2).
  chunk: sg-stg-2025__art-170
  zitat: Er muss auf Verlangen der Veranlagungsbehörde insbesondere mündlich oder schriftlich Auskunft erteilen, Geschäftsbücher, Belege und weitere Bescheinigungen sowie Urkunden über den Geschäftsverkehr
    vorlegen.
- regel: 'Selbständigerwerbende: Urkunden und Belege zur Tätigkeit 10 Jahre aufbewahren (StG SG Art. 171).'
  chunk: sg-stg-2025__art-171
  zitat: Natürliche Personen mit Einkommen aus selbständiger Erwerbstätigkeit und juristische Personen müssen Urkunden und sonstige Belege, die mit ihrer Tätigkeit in Zusammenhang stehen, während zehn Jahren
    aufbewahren.
- regel: Wird eine Drittbescheinigung trotz Mahnung nicht eingereicht, kann die Veranlagungsbehörde sie direkt beim Dritten einfordern (StG SG Art. 172 Abs. 2).
  chunk: sg-stg-2025__art-172-t2
  zitat: Reicht der Steuerpflichtige die Bescheinigung trotz Mahnung nicht ein, kann die Veranlagungsbehörde diese vom Dritten einfordern.
- regel: Das Wertschriften- und Guthabenverzeichnis (Formular 2) ist Bestandteil der Steuererklärung und immer einzureichen.
  chunk: sg-wl-2025__c0120
  zitat: Das Wertschriften- und Guthabenverzeichnis ist Bestandteil der Steuerer- klärung und damit ebenfalls immer einzureichen.
- regel: 'Online-Einreichung (NEU ab Steuerperiode 2025): E-Tax SG kann online ausgefüllt und inklusive aller Belege vollständig digital eingereicht werden.'
  chunk: sg-wl-2025__c0008
  zitat: die Steuererklärung ab der Steuerperiode 2025 bequem online ausgefüllt und inklusive aller Belege vollständig digital über eine geschützte Internetver- bindung eingereicht werden.
- regel: 'E-Tax SG ohne Hochladen der Belege: nur Werte werden elektronisch übermittelt, die notwendigen Belege sind auf Papier mit der unterzeichneten Freigabequittung beim Gemeindesteueramt einzureichen.'
  chunk: sg-wl-2025__c0023
  zitat: In diesem Fall müssen die notwendigen Belege auf Papier eingereicht werden. Die Einreichung muss zusammen mit der von E-Tax SG erstellten Freigabequittung
- regel: Mit E-Tax SG erstellte Steuererklärungen können nur elektronisch übermittelt werden (kein Ausdruck/Postversand der Erklärung).
  chunk: sg-wl-2025__c0023
  zitat: Steuererklärungen, die mit E-Tax SG erstellt werden, können ausschliesslich elektronisch übermittelt werden; ein Ausdrucken und postalisches Einreichen ist nicht möglich.
- regel: 'Steuererklärung und erforderliche Beilagen sind bis zum Einreichetermin (Seite 1 der Steuererklärung) beim Gemeindesteueramt einzureichen; Fristverlängerung auf Gesuch (Verfahren: massgebend ist
    der Zeitpunkt der Handlung, d.h. 2026).'
  chunk: sg-wl-2025__c0018
  zitat: Die Steuererklärung sowie die erforderlichen Beilagen sind bis zum Einreiche
- regel: Alle Formulare und Beilagen mit Name und Register-Nummer versehen.
  chunk: sg-wl-2025__c0019
  zitat: Versehen Sie alle Formulare und Beilagen mit Ihrem Namen und Ihrer Register- Nummer.
- regel: Selbst erstellte Wertschriftenverzeichnisse sind zusammen mit Formular 2 einzureichen (Totale ins Formular 2 übertragen).
  chunk: sg-wl-2025__c0122
  zitat: Das eigene Verzeichnis ist zusammen mit dem Formular 2 einzureichen.
- regel: 'Beschränkte Steuerpflicht (Liegenschaft/Betriebsstätte in SG, Wohnsitz in anderem Kanton): Kopie der Steuererklärung des Wohnsitzkantons genügt.'
  chunk: sg-wl-2025__c0007
  zitat: In einem solchen Fall genügt das Einreichen einer Kopie der Steuererklärung des Wohnsitzkantons (siehe Merkblatt 27).
- regel: 'Wohnsitz im Ausland mit Nebensteuerdomizil SG: empfohlen, Hilfsformulare (u.a. Schuldenverzeichnis) und die Veranlagung des Wohnsitzstaates (Finanzbescheid) beizulegen.'
  chunk: sg-form-27-2025__c0005
  zitat: der Steuererklärung nebst den notwendigen Hilfsformularen (u.a. Schuldenverzeichnis) auch die vom Wohnsitzstaat getroffene Veranlagung (Finanzbescheid) beizulegen.
- regel: 'Übrige Berufskosten (Formular 4 Ziff. 3.2, tatsächliche Kosten statt Pauschale): gegen Nachweis abziehbar; Kosten auf einem Beiblatt aufführen, das zusammen mit Formular 4 einzureichen ist.'
  chunk: sg-wl-2025__c0080
  zitat: Die Kosten sind auf einem Beiblatt aufzuführen, welches zusammen mit dem Formular 4 einzureichen ist.
- regel: 'Unterstützungsabzug Ziff. 23.4 (nur direkte Bundessteuer): Betrag, Name/Adresse der unterstützten Person und eine Bescheinigung über deren Bedürftigkeit angeben bzw. beilegen.'
  chunk: sg-wl-2025__c0106
  zitat: zusammen mit einer Bescheinigung, woraus ersichtlich ist, dass diese Per- son ihren Lebensunterhalt nicht aus eigenen Mitteln bestreiten kann.
- regel: 'Vereinfacht abgerechnete Erwerbseinkünfte (Ziff. 8.1, BGSA): Bestätigung der Ausgleichskasse über den Quellensteuerabzug beilegen, ersatzweise die Lohnabrechnungen.'
  chunk: sg-wl-2025__c0071
  zitat: Die Bestätigung der Ausgleichskasse über den Quellensteuerabzug ist beizulegen. Fehlt diese, sind die Lohnabrechnungen beizulegen.
- regel: 'Direkt von Ausgleichskassen ausbezahlte Familienzulagen (Ziff. 3.5), die im Reingewinn aus selbständiger Erwerbstätigkeit enthalten sind: Buchungsnachweis beilegen.'
  chunk: sg-wl-2025__c0061
  zitat: Der Buchungs- nachweis ist beizulegen.
- regel: 'Unternutzungsabzug beim Eigenmietwert (Formular 7 B.a): entsprechenden Nachweis der Steuererklärung beilegen.'
  chunk: sg-wl-2025__c0157
  zitat: Bei Deklaration eines Unternutzungsabzuges ist der entsprechen- de Nachweis der Steuererklärung beizulegen.
- regel: 'Globalverzinsliche Obligationen, Discount-/Zero-Bonds und derivative Finanzinstrumente mit überwiegender Einmalverzinsung: Erwerbs- und Verkaufs- bzw. Rückzahlungsbelege beilegen (zweispaltiges
    Layout, Zitat nur ab «und Verkaufs-» zusammenhängend).'
  chunk: sg-wl-2025__c0132
  zitat: und Verkaufs- bzw. Rückzahlungsbelege sind beizulegen.
belege:
- beleg_id: lohnausweis
  einreichen: ja
  bedingung: immer; pro Arbeitgeber ein Lohnausweis (auch Nebenerwerb); Formular 1 Ziff. 1.1/1.2 «Lohnausweis»
  chunk: sg-stg-2025__art-169
  zitat: 'Natürliche Personen müssen der Steuererklärung für die Einkommens- und Vermögenssteuern insbesondere beilegen: - a) Lohnausweise über alle Einkünfte aus unselbständiger Erwerbstätigkeit'
  urteil: 'bestätigt – StG SG Art. 169 Abs. 1 Bst. a (Fassung 2025); WL S. 14 Randtext «Pro Arbeitgeber ist grundsätzlich ein Lohnausweis einzureichen» (c0039, zweispaltig, nicht zusammenhängend zitierbar);
    Formular 1 Beilagenliste «Lohnausweis(e)» (sg-form-1-2025__c0014). VR-Honorare/Sitzungsgelder: Ausweis nach Bst. b.'
- beleg_id: rentenbescheinigung-ahv-iv
  einreichen: ja
  bedingung: bei Bezug von AHV-/IV-Renten; Formular 1 Ziff. 3.1 verlangt «Bescheinigung»
  chunk: sg-form-1-2025__c0005
  zitat: 3.1 AHV/IV-Renten (zu 100%) Person 1 Bescheinigung 126
  urteil: 'bestätigt (abgeleitet) – Formularvermerk «Bescheinigung» bei Ziff. 3.1 i.V.m. WL S. 7 (c0012: Bescheinigungen einreichen, wo ausdrücklich verlangt); WL-Text Ziff. 3.1 (c0056) nennt keine eigene
    Beilagepflicht.'
- beleg_id: rentenbescheinigung-vorsorge
  einreichen: ja
  bedingung: bei Renten/Pensionen 2. Säule, 3a, Leibrenten (Ziff. 3.2); bei mehreren Renten zusätzlich separate Aufstellung
  chunk: sg-form-1-2025__c0005
  zitat: 3.2 Renten/Pensionen Bescheinigung / Aufstellung Bei mehreren Renten separate Aufstellung beilegen.
  urteil: 'bestätigt – Formular 1 Ziff. 3.2 «Bescheinigung / Aufstellung» mit Randtext «Bei mehreren Renten separate Aufstellung beilegen.»; Leibrentenversicherungen VVG: Ertragsanteil bescheinigt der Versicherer
    (WL c0059).'
- beleg_id: taggeldbescheinigung
  einreichen: ja
  bedingung: 'soweit Taggelder/Erwerbsausfallentschädigungen nicht im Lohnausweis enthalten (Ziff. 3.3/3.4); Militärversicherung: Verfügung/Abrechnung beilegen'
  chunk: sg-wl-2025__c0060
  zitat: Über nicht im Lohnausweis aufgeführte Bezüge ist eine Bescheinigung beizulegen, die bei der Arbeitslosenkasse bezogen werden kann.
  urteil: bestätigt – ALV-Taggelder (Ziff. 3.4) ausdrücklich (c0060); Ziff. 3.3 Formularvermerk «Bescheinigung» (sg-form-1-2025__c0005); Militärversicherung «unter Beilage der entsprechenden Verfügung bzw.
    Abrechnung» (c0059).
- beleg_id: bescheinigung-saeule3a
  einreichen: ja
  bedingung: immer bei Abzug Säule 3a (Ziff. 13.1); Bescheinigung der Bankstiftung/Versicherung (Form. 21 EDP)
  chunk: sg-form-1-2025__c0008
  zitat: 13.1 Säule 3a Person 1 Bescheinigung 208
  urteil: bestätigt – Formular 1 Ziff. 13.1 «Bescheinigung»; WL S. 26 Randtext «Der Steuererklärung sind in jedem Fall die Bescheinigungen der Versicherung oder der Bankstiftung (Form. 21 EDP dfi) beizulegen»
    (c0085, zweispaltig – im Chunk tatsächlich nicht zusammenhängend zitierbar; Original raw/sg/2025/sg-wl-2025.pdf S. 26); WL c0022 nennt «Bescheinigung Säule 3a» als notwendigen Beleg.
- beleg_id: bescheinigung-pk-einkauf
  einreichen: ja
  bedingung: immer bei Abzug Einkauf 2. Säule (Ziff. 13.2), zusammen mit der Einkaufsberechnung
  chunk: sg-wl-2025__c0086
  zitat: ist in jedem Fall die Bescheinigung der Vorsorgeträgerin beizu- legen, zusammen mit der entsprechenden Einkaufsberechnung.
  urteil: bestätigt – WL Ziff. 13.2 «in jedem Fall» beizulegen (c0086); Formular 1 Ziff. 13.2 «Bescheinigung» (sg-form-1-2025__c0008).
- beleg_id: steuerauszug-bank
  einreichen: ja
  bedingung: bei Papiereinreichung bzw. Einreichung mit Freigabequittung immer komplett zu Formular 2; bei vollständig digitaler Einreichung (eFiling) automatische elektronische Übermittlung
  chunk: sg-wl-2025__c0122
  zitat: Steuerauszüge sind bei Einreichung der Steuererklärung auf Papier immer komplett dem Formular 2 beizulegen.
  urteil: 'bestätigt – WL c0122: auf Papier/mit Freigabequittung immer komplett zu Formular 2; bei vollständigem eFiling elektronische Übermittlung (also ebenfalls eingereicht).'
- beleg_id: kontoauszug-zinsausweis
  einreichen: bedingt
  bedingung: Bankbeleg mit Verrechnungssteuernachweis beilegen, wenn VST abgezogen wurde (Bruttozins > Fr. 200, Abschnitt A); bei Festgeld-/Treuhandanlagen Bescheinigung des Finanzinstituts beilegen (c0123);
    sonst bereithalten
  chunk: sg-wl-2025__c0130
  zitat: mit dem Verrechnungssteuernachweis muss in diesem Fall beigelegt werden.
  urteil: 'bestätigt – WL c0130 Bst. a (VST-Abzug → Abschnitt A, Bankbeleg mit VST-Nachweis beilegen); Festgeld-/Treuhandanlagen, Geldmarktbuchforderungen: Bescheinigung der Finanzinstitute (c0123).'
- beleg_id: depotauszug
  einreichen: bedingt
  bedingung: 'bei Bestandesänderungen (Erwerb, Veräusserung, Rückzahlung, Konversion) Bankbelege beilegen; selbst erstelltes Verzeichnis mit Formular 2 einreichen; nichtkotierte Titel: Kauf-/Verkaufsverträge
    beilegen'
  chunk: sg-wl-2025__c0121
  zitat: sind in die entsprechenden Spalten das Datum des Zu- oder Abganges anzugeben und die Bankbelege beizulegen.
  urteil: 'bestätigt – WL c0121 (Bestandesänderungen: Datum angeben und Bankbelege beilegen), c0122 (eigenes Verzeichnis mit Formular 2), c0123 (nichtkotierte Titel: Kauf-/Verkaufsverträge); ergänzend c0132:
    bei globalverzinslichen Obligationen/derivativen Produkten Erwerbs- und Verkaufs- bzw. Rückzahlungsbelege beilegen.'
- beleg_id: krypto-auszug
  einreichen: auf_verlangen
  bedingung: Bestand per 31.12. im Formular 2 deklarieren (Kryptowährungen ausdrücklich genannt, c0121); keine besondere Beilagepflicht – Auszüge bereithalten
  chunk: sg-wl-2025__c0013
  zitat: Belege und Rechnungen sind bereitzuhalten und werden von der Steuerbehörde
  urteil: unklar – Krypto ist für 2025 in SG nur in WL c0121 erwähnt (Deklarationspflicht im Formular 2); keine ausdrückliche Beilageregel. Die Bestandesänderungs-Regel derselben Stelle («Titel und Forderungen
    … Bankbelege beizulegen») könnte analog auf Krypto-Käufe/-Verkäufe angewendet werden; grep über chunks/sg findet sonst nur StB 44 Nr. 1 (Beispiel, Jahre 2026/2027). Einstufung «auf Verlangen» ist plausibel,
    aber nur aus dem allgemeinen Grundsatz abgeleitet – Fachperson.
- beleg_id: dividenden-ausland-quellensteuer
  einreichen: ja
  bedingung: 'ausländische Wertschriftenerträge: Bankabrechnungen/Auszahlungsbordereaux unaufgefordert mit Formular 2; Formular DA-1 mit der Steuererklärung einreichen (c0145); ausländische nichtkotierte
    Titel: Bescheinigungen beilegen (c0123)'
  chunk: sg-wl-2025__c0143
  zitat: Belege wie Bankabrechnungen, Auszahlungsbordereau usw. sind unauf gefordert mit dem Wertschriften- und Guthabenverzeichnis einzureichen.
  urteil: 'bestätigt – WL c0143 (Abschnitt «Ausländische Wertschriften»: Belege wie Bankabrechnungen, Auszahlungsbordereau unaufgefordert mit Formular 2); Hinweis: «Die entsprechenden Belege» folgt unmittelbar
    auf den Satz zu nichtkotierten Titeln (Werte aus Bankabrechnungen) – Reichweite für kotierte Titel mit Steuerauszug nicht eindeutig. DA-1 mit der Steuererklärung einreichen (c0145), nur bei Anrechnung
    ausländischer Quellensteuern.'
- beleg_id: versicherung-rueckkaufswert
  einreichen: ja
  bedingung: bei Lebens-/Rentenversicherungen mit Rückkaufswert (Ziff. 30.3); bei Vorsorge-Kapitalversicherung mit Einmalprämie zusätzlich Versicherungsvertrag in Kopie (c0133)
  chunk: sg-wl-2025__c0110
  zitat: Die entsprechende Berechnung bzw. Bescheinigung der Versi- cherungsgesellschaft ist der Steuererklärung beizulegen.
  urteil: 'bestätigt – WL Ziff. 30.3 (c0110) ausdrücklich beizulegen; Vorsorge-Kapitalversicherung mit Einmalprämie: Vertrag in Kopie (c0133).'
- beleg_id: krankenkasse-praemien
  einreichen: auf_verlangen
  bedingung: Prämien im Formular 6 Teil A deklarieren (Prämienverbilligung abziehen); Formular 6 Randvermerk «Die Belege sind auf Verlangen einzureichen»
  chunk: sg-wl-2025__c0073
  zitat: reitzuhalten und erst auf Verlangen einzureichen sind.
  urteil: 'bestätigt – WL c0073 (Grundsatz Belege zu Abzügen; Ziff. 14 Formular 6 in der Tabelle); Formular-Randvermerk «Die Belege sind auf Verlangen einzureichen.» vorhanden (sg-form-6-2025__c0001), aber
    im Chunk nicht zusammenhängend zitierbar (zwischen «Die Belege sind auf» und «Verlangen einzureichen.» steht «Person 1: Reg.-Nr.»).'
- beleg_id: krankenkasse-leistungen
  einreichen: bedingt
  bedingung: zwingend einzureichen, wenn im Formular 6 auf einen Krankenkassenauszug bzw. das Total gemäss Zusammenzug verwiesen wird (detaillierte Aufstellung inkl. Leistungsübersicht); sonst auf Verlangen
  chunk: sg-form-6-2025__c0003
  zitat: Wird auf einen Auszug der Krankenkasse verwiesen, so ist zwingend die Aufstellung mit allen Details (inkl. Leistungsübersicht) mit der Deklaration einzureichen.
  urteil: bestätigt – Formular 6 Rückseite Hinweis (sg-form-6-2025__c0003) und WL S. 29 Randtext «Bei Deklaration des Totals gemäss Zusammenzug der Krankenkasse ist die detaillierte Kostenzusammenstellung
    zwingend miteinzureichen» (c0098, zweispaltig).
- beleg_id: arzt-zahnarzt-rechnungen
  einreichen: auf_verlangen
  bedingung: 'Einzelrechnungen im Formular 6 aufführen, Belege auf Verlangen; Ausnahmen beilegen: ärztliches Zeugnis bei Medikamenten/Heilmitteln, ärztliche Bescheinigung bei erstmaliger Diätpauschale (c0098),
    Verfügung Hilflosenentschädigung bzw. Arztfragebogen bei Behindertenpauschalen (c0100, c0101)'
  chunk: sg-wl-2025__c0073
  zitat: reitzuhalten und erst auf Verlangen einzureichen sind.
  urteil: 'korrigiert: Fundstelle präzisiert auf WL c0073 (Belege zu Abzügen «erst auf Verlangen einzureichen»); das bisherige Zitat aus c0013 bricht vor «bei Bedarf einverlangt» ab und belegt «auf Verlangen»
    nicht wörtlich. Einstufung bestätigt. Abzug Ziff. 21.1 steht in der Tabelle von c0073. Formular-Randvermerk «Die Belege sind auf Verlangen einzureichen.» vorhanden (sg-form-6-2025__c0003), aber im Chunk
    nicht zusammenhängend zitierbar (zwischen «Die Belege sind auf» und «Verlangen einzureichen.» steht «Person 1: Reg.-Nr.»). Ausnahmen bestätigt: ärztliches Zeugnis bei Medikamenten/Heilmitteln und ärztliche
    Bescheinigung bei erstmaliger Diätpauschale (c0098), Verfügung Hilflosenentschädigung (c0100), ärztlicher Fragebogen Gehörlose/Dialyse bei erstmaliger Geltendmachung (c0101).'
- beleg_id: hypothekarbestaetigung
  einreichen: auf_verlangen
  bedingung: Schulden und Schuldzinsen im Formular 5 (Schuldenverzeichnis, gehört zur Steuererklärung) aufführen; Bankbestätigungen auf Verlangen (Formular 5 Randvermerk)
  chunk: sg-wl-2025__c0073
  zitat: reitzuhalten und erst auf Verlangen einzureichen sind.
  urteil: 'bestätigt – Schuldenverzeichnis ist gesetzliche Beilage (StG Art. 169 Abs. 1 Bst. c), die Zinsbescheinigung der Bank nur auf Verlangen (WL c0073); Formular-Randvermerk «Die Belege sind auf Verlangen
    einzureichen.» vorhanden (sg-form-5-2025__c0001), aber im Chunk nicht zusammenhängend zitierbar (zwischen «Die Belege sind auf» und «Verlangen einzureichen.» steht «Person 1: Reg.-Nr.»).'
- beleg_id: kredit-darlehen-schuldzinsen
  einreichen: auf_verlangen
  bedingung: private Schulden mit Gläubiger, Schuld 31.12. und Zinsen im Formular 5 Teil A deklarieren; Verträge/Zinsbescheinigungen auf Verlangen
  chunk: sg-wl-2025__c0073
  zitat: reitzuhalten und erst auf Verlangen einzureichen sind.
  urteil: 'bestätigt – WL c0073 und c0083 (Deklaration Teil A Formular 5); Formular-Randvermerk «Die Belege sind auf Verlangen einzureichen.» vorhanden (sg-form-5-2025__c0001), aber im Chunk nicht zusammenhängend
    zitierbar (zwischen «Die Belege sind auf» und «Verlangen einzureichen.» steht «Person 1: Reg.-Nr.»).'
- beleg_id: leasingvertrag
  einreichen: nein
  bedingung: Leasinggebühren privater Fahrzeuge nicht abzugsfähig
  chunk: sg-wl-2025__c0083
  zitat: Leasinggebühren persönlicher Gebrauchsgegenstände und privater Fahr zeuge.
  urteil: 'bestätigt – WL Ziff. 11 (c0083): Leasinggebühren privater Fahrzeuge nicht als Schuldzinsen abziehbar; geschäftliches Leasing ist in der Jahresrechnung erfasst (nicht Formular 5).'
- beleg_id: liegenschaft-unterhaltsrechnungen
  einreichen: auf_verlangen
  bedingung: 'nur bei tatsächlichen Kosten statt Pauschale (Formular 7 Rückseite, Randvermerk Belege auf Verlangen); Ausnahmen beilegen: separate Liegenschaftenrechnung bei Gesamtbetrag in C2 (c0169), aufgegliederte
