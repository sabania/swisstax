# Ablagegruppen – firmenunabhängig. Jedes eingegangene Dokument fällt in genau eine Gruppe.
# Firmen übersetzen die Gruppen in ihre eigene Ablage (DMS-Klassen/Kategorien) mit einem Adapter: firmen/<firma>/ablage.yaml.
# Belege (Steuerbelege mit Wert in der Steuererklärung) werden über die Einreichepflicht des Kantons/Jahres
# (data/einreichen/<kt>/<jahr>.yaml, mit Zitat aus der Wegleitung) in «einzureichen» bzw. «nicht einzureichen» eingeteilt.
gruppen:
- id: beleg-einzureichen
  name: Steuerbeleg – einzureichen
  regel: Beleg mit Wert in der Steuererklärung, den der Kanton (Wegleitung/Gesetz des Steuerjahres) mit der Steuererklärung verlangt.
- id: beleg-aufbewahren
  name: Steuerbeleg – nicht einzureichen (aufbewahren, auf Verlangen)
  regel: Beleg mit Wert in der Steuererklärung, der nicht eingereicht werden muss (nur auf Verlangen der Steuerbehörde oder Pflicht nicht belegt).
- id: deklaration
  name: Steuererklärung (Formular, Entwurf, finale Version, Freigabe-/Unterschriftsquittung)
  regel: Die Steuererklärung selbst und ihre Bestandteile/Quittungen der Steuerpflichtigen.
- id: deklaration-unterjaehrig
  name: Steuererklärung bei unterjähriger Steuerpflicht
  regel: Keine volle Steuerperiode (Zuzug/Wegzug Ausland, Tod).
- id: steuerausscheidung
  name: Steuerausscheidung
  regel: Mehrere Steuerdomizile (interkantonal/international).
- id: uebermittlung
  name: Übermittlungs-/Eingangsquittung
  regel: Bestätigung, dass die Steuererklärung eingereicht ist (z.B. Online-Übermittlung).
- id: frist
  name: Frist / Fristerstreckung
  regel: Gesuch oder Bestätigung einer Fristerstreckung.
- id: veranlagung
  name: Veranlagung / Einschätzungsentscheid / definitive Steuerrechnung
  regel: Entscheid der Steuerbehörde zur Steuerperiode; Steuerjahr = veranlagte Periode. Mit der eingereichten Erklärung vergleichen; Rechtsmittelfrist gemäss Rechtsmittelbelehrung.
- id: provisorische-rechnung
  name: Provisorische Steuerrechnung
  regel: Vorläufige Rechnung für die laufende Steuerperiode.
- id: steuerkonto
  name: Kontoauszug des Steueramts (Steuerkonto)
  regel: Zahlungen, Saldo, Zinsen des Steuerkontos – nicht Bank-Kontoauszug.
- id: auflage
  name: Auflage / Nachfrage der Steuerbehörde
  regel: Aufforderung, Unterlagen oder Auskünfte nachzureichen (mit Frist).
- id: rechtsmittel
  name: Einsprache / Rekurs / Beschwerde
  regel: Rechtsmittel gegen Veranlagung und Entscheide darüber.
- id: korrespondenz-mandant
  name: Korrespondenz Mandant (Antworten, Checklisten, Bestätigungen)
  regel: Angaben des Mandanten ohne eigentlichen Beleg (z.B. Antworten auf Rückfragen).
- id: andere-steuerart
  name: Andere Steuerart (Grundstückgewinn-, Erbschafts-, Schenkungssteuer)
  regel: Nicht Einkommens-/Vermögenssteuer der natürlichen Person.
- id: juristische-person
  name: Unterlagen einer juristischen Person
  regel: Nicht natürliche Person (AG, GmbH, Verein, Stiftung) – separat behandeln.
- id: nicht-relevant
  name: Nicht steuerrelevant
  regel: Kein Wert in der Steuererklärung (z.B. Alltagsrechnungen, Hausrat-/Motorfahrzeugversicherung) – nicht als Steuerbeleg ablegen.
