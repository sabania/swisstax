belege:
- id: lohnausweis
  name: Lohnausweis (Formular 11, auch für Nebenerwerb/VR-Honorare)
  erkennen:
  - Titel «Lohnausweis – Rentenbescheinigung» (Formular 11 SSK/ESTV) bzw. eLohnausweis mit Datamatrix-Code
  - 'Absender: Arbeitgeber; Felder A–H, Ziffern 1–15'
  - 'Typische Begriffe: Bruttolohn total (Ziff. 8), Nettolohn/Rente (Ziff. 11), Spesenvergütungen (Ziff. 13), Bemerkungen (Ziff. 15)'
  - Kästchen F (unentgeltliche Beförderung) und G (Kantinenverpflegung/Lunch-Checks)
  relevanz: ja
  zweck:
  - einkommen
  positionen:
  - einkommen.unselbstaendig.haupterwerb
  - einkommen.unselbstaendig.nebenerwerb
  - einkommen.unselbstaendig.vr_honorare
  - abzug.berufskosten.fahrkosten
  - abzug.berufskosten.verpflegung
  - abzug.vorsorge.saeule2_einkauf
  extrahieren:
  - Ziff. 11 Nettolohn (= Bruttolohn Ziff. 8 minus Abzüge Ziff. 9 und 10) – Übertrag in die Steuererklärung
  - Ziff. 6 Verwaltungsratsentschädigungen und Ziff. 5 Beteiligungsrechte (separat ausgewiesen, siehe Beiblatt)
  - Ziff. 10.2 Einkaufsbeiträge 2. Säule (nur wenn vom Lohn abgezogen)
  - Ziff. 12 Quellensteuerabzug (nur Information bei Quellensteuerpflicht)
  - 'Ziff. 13 Spesen: Kreuz bei 13.1.1 = genehmigtes Spesenreglement; effektive Spesen 13.1.1/13.1.2 (z.B. «Spesen für externen Arbeitsplatz»), Pauschalspesen 13.2, Weiterbildung 13.3'
  - Kästchen F (Arbeitsweg gratis → Fahrkostenabzug fällt weg), Kästchen G (Kantine/Lunch-Checks → reduzierte Verpflegungspauschale), Feld Ziff. 15 Bemerkungen
  hinweise:
  - Pro Arbeitgeber ein Lohnausweis, auch bei Nebenbeschäftigungen; bei mehreren Lohnausweisen für dasselbe Jahr steht in Ziff. 15 «Einer von … Lohnausweisen», ein ersetzter Lohnausweis trägt den Vermerk
    «Dieser Lohnausweis ersetzt den Lohnausweis vom …».
  - Erwerbslücken (Arbeitslosigkeit, Krankheit, Mutterschaft) müssen in der Steuererklärung bezeichnet und mit Bescheinigung belegt werden, sonst Rückfragen.
  - Einkäufe, die der Arbeitnehmer selber bezahlt hat (nicht vom Lohn abgezogen), stehen nicht im Lohnausweis, sondern auf der Bescheinigung der Vorsorgeeinrichtung (Formular 21 EDP) -> siehe bescheinigung-pk-einkauf.
  - Taggelder/EO, die der Arbeitgeber ausbezahlt hat, stehen im Lohnausweis (Ziff. 7 bzw. Ziff. 1 mit Bemerkung Ziff. 15); nur direkt von der Versicherung ausbezahlte Beträge sind separat zu deklarieren.
  - Die hinterlegte ESTV-Wegleitung zum Lohnausweis ist die Fassung 2026 (Formular 11); für 2025 ist die Fassung mit gleichem Aufbau massgebend – Ziffernbezeichnungen gelten gemäss der jeweiligen Wegleitung
    des Steuerjahres.
  kantone:
    TG: In der Steuererklärung ist der in Ziffer 11 des Lohnausweises aufgeführte Nettolohn einzusetzen; Trinkgelder sind auch ohne Ausweis im Lohnausweis steuerbar (WL TG 2025 Ziff. 1.1).
    AR: Nettolohn gemäss Lohnausweis in Ziff. 1.1; nicht im Lohnausweis abgerechnete NBUV-/2.-Säule-Beiträge werden unter Ziff. 16.6 abgezogen (WL AR 2025 Ziff. 1.1).
    ZH: Lohnausweise sind der Steuererklärung beizulegen; Nebenerwerb über Hilfsblatt (Ziff. 1.2) (WL ZH 2025 Ziff. 1.1).
  quellen:
  - chunk: bund-wl-lohnausweis-2026__c0038
    zitat: In diesem Feld ist der für die Steuererklärung massgebende Nettolohn anzugeben.
  - chunk: zh-wl-2025__c0032
    zitat: Bitte vergessen Sie nicht, Ihre Lohnausweise der Steuererklärung beizulegen.
  - chunk: tg-wl-2025__c0049
    zitat: In die Steuererklärung ist der in Ziffer 11 des Lohnausweises aufgeführte Nettolohn einzusetzen.
  - chunk: tg-stg__par-156
    zitat: Lohnausweise über alle Einkünfte aus unselbständiger Erwerbstätigkeit
  - chunk: bund-wl-lohnausweis-2026__c0054
    zitat: Wurden vom Arbeitgeber für dasselbe Jahr ausnahmsweise
  status: extrahiert
- id: rentenbescheinigung-ahv-iv
  name: Rentenbescheinigung AHV/IV (Ausgleichskasse, Jahresbescheinigung der Renten)
  erkennen:
  - 'Absender: kantonale/eidgenössische Ausgleichskasse (SVA, AHV-Zweigstelle, SAK, Pensionsversicherung des Bundes)'
  - Titel «Rentenbescheinigung» bzw. «Bescheinigung der Renten» für das Steuerjahr
  - 'Begriffe: AHV-Altersrente, IV-Rente, Hinterlassenenrente, Kinder-/Zusatzrente, Hilflosenentschädigung'
  - 'Alternativ: Postabschnitte/Rentenverfügung (nur Monatsbetrag, nicht Jahresbescheinigung)'
  relevanz: ja
  zweck:
  - einkommen
  positionen:
  - einkommen.sozialversicherung.ahv_iv
  - info.steuerfreie_leistungen
  extrahieren:
  - Jahresbruttobetrag der AHV-/IV-Renten (inkl. Kinder- und Zusatzrenten), getrennt je Person
  - Rentenart (AHV oder IV) und Dauer, falls nicht ganzes Jahr
  - Hilflosenentschädigung und Ergänzungsleistungen separat ausweisen (nicht steuerbar, nur Angabe)
  hinweise:
  - AHV-/IV-Renten sind zu 100 % steuerbar (Bund und Kantone); Ergänzungsleistungen zur AHV/IV, Sozialhilfe und Genugtuungszahlungen sind steuerfrei und nicht zu deklarieren (-> ergaenzungsleistungen).
  - Bei Ehepaaren je Person eine Bescheinigung; Rentenbezüge nur zum Teil des Jahres (Eintritt Rentenalter) – Bruttobetrag des Kalenderjahres massgebend, nicht der Monatsbetrag mal 12.
  - Gleiches Formular 11 (Rentenbescheinigung) kann auch von Pensionskassen verwendet werden -> rentenbescheinigung-vorsorge.
  kantone:
    TG: AHV-/IV-Rentenausweise bzw. Postabschnitte gelten als Unterlage; steuerfrei sind u.a. Ergänzungsleistungen (WL TG 2025 Ziff. 3).
    ZH: Ziff. 3.1 (AHV getrennt von IV) – Rentenbescheinigung gemäss Formular 11 beilegen (WL ZH 2025 Ziff. 1.1/3.1).
  quellen:
  - chunk: ar-wl-2025__c0049
    zitat: Die ordentlichen und ausserordentlichen AHV- und IV-Renten sind in vollem Um-
  - chunk: tg-wl-2025__c0076
    zitat: Ergänzungsleistungen der AHV und IV;
  - chunk: bund-dbg-2025__art-22-t1
    zitat: Steuerbar sind alle Einkünfte aus der Alters-, Hinterlassenen- und Invalidenversicherung
  - chunk: tg-wl-2025__c0026
    zitat: AHV- und PK-Rentenausweise oder Postabschnitte über Renten;
  status: extrahiert
- id: rentenbescheinigung-vorsorge
  name: Rentenbescheinigung Pensionskasse / Versicherung (2. Säule, 3a, Leibrente)
  erkennen:
  - 'Absender: Pensionskasse, Sammelstiftung, Freizügigkeitsstiftung, Versicherungsgesellschaft, Bankstiftung'
  - Titel «Rentenbescheinigung», «Bescheinigung über Renten/Leistungen», Formular 11 oder Versicherungsbescheinigung
  - 'Begriffe: Altersrente, Invalidenrente, Pensionierten-/Ehegattenrente, steuerbarer Ertragsanteil, Überschussleistungen'
  - 'Bei Kapitalbezug: «Auszahlungsbescheinigung», «Kapitalleistung» (separate Besteuerung)'
  relevanz: ja
  zweck:
  - einkommen
  positionen:
  - einkommen.vorsorge.renten
  - einkommen.vorsorge.uebrige_renten
  - einkommen.kapitalleistung_vorsorge
  extrahieren:
  - Jahresbruttorente je Rentenart (Alters-/Invalidenrente, Hinterlassenenrente)
  - Steuerbarer Anteil bzw. Ertragsanteil und Überschussleistungen (bei Leibrenten aus Versicherungsverträgen)
  - Rentenbeginn (für die Quote 100 % / 80 % relevant) und ob mindestens 20 % der Beiträge selbst erbracht wurden
  - Datum und Betrag einer Kapitalleistung (separat von Rente erfassen)
  hinweise:
  - Renten der 2. Säule und aus gebundener Selbstvorsorge sind grundsätzlich zu 100 % steuerbar; 80 % nur bei Rentenbeginn vor 1.1.1987 (bzw. 31.12.2001 mit Vorsorgeverhältnis vor 31.12.1985/86) und mindestens
    20 % Eigenbeiträgen (Altfälle).
  - Leibrenten/Rentenversicherungen sind nur im Ertragsanteil steuerbar (Art. 22 Abs. 3 DBG); Bescheinigung des Versicherers mit dem steuerbaren Anteil ist beizulegen.
  - Kapitalleistungen aus Vorsorge werden separat und zu einem reduzierten Satz besteuert – dafür die Auszahlungsbescheinigung aufbewahren; sie gehört nicht in die Rentenposition.
  kantone:
    TG: 'Leibrenten: Bescheinigung der Versicherung mit Ertragsanteil beilegen; Überschussleistungen pauschal zu 70 % steuerbar; bei mehr als zwei Renten separate Aufstellung (WL TG 2025 Ziff. 3.2).'
    ZH: Quoten 80 % / 100 % gemäss WL ZH 2025 Ziff. 3.2 (Altfälle vor 1987).
  quellen:
  - chunk: zh-wl-2025__c0050
    zitat: Renten von Einrichtungen der beruflichen Vorsorge (2. Säule), d.h. Renten von
  - chunk: bund-dbg-2025__art-22-t1
    zitat: aus Einrichtungen der beruflichen Vorsorge und aus anerkannten Formen der gebundenen Selbstvorsorge
  - chunk: tg-wl-2025__c0078
    zitat: Bitte legen Sie diese Bescheinigung der Steuererklärung bei.
  - chunk: tg-wl-2025__c0078
    zitat: Überschussleistungen sind pauschal zu 70% steuerbar.
  status: extrahiert
- id: taggeldbescheinigung
  name: Taggeldbescheinigung (ALV, Kranken-/Unfall-/IV-/Militärversicherung, EO/Mutterschaft)
  erkennen:
  - 'Absender: Arbeitslosenkasse (RAV/ALK), Krankentaggeldversicherer, Unfallversicherer (Suva u.a.), IV-Stelle, Ausgleichskasse (EO/Mutterschaft)'
  - Titel «Bescheinigung über Taggelder/Leistungen», «Taggeldabrechnung», «Jahresbescheinigung»
  - 'Begriffe: Taggeld, Erwerbsersatz, Mutterschaftsentschädigung, Anzahl Taggelder, Bruttoleistung'
  relevanz: ja
  zweck:
  - einkommen
  positionen:
  - einkommen.ersatz.taggelder
  - einkommen.ersatz.familienzulagen
  - abzug.krankheitskosten
  extrahieren:
  - Bruttobetrag der im Steuerjahr ausbezahlten Taggelder/Entschädigungen je Versicherer
  - Zeitraum bzw. Anzahl Taggeldtage
  - Prüfen, ob der Betrag bereits im Lohnausweis des Arbeitgebers enthalten ist (Ziff. 7 oder Bemerkung Ziff. 15)
  hinweise:
  - Nur direkt von der Versicherung/Kasse ausbezahlte Taggelder separat deklarieren; vom Arbeitgeber ausbezahlte stehen im Lohnausweis (Doppeldeklaration vermeiden).
  - IV-Taggelder sind Ersatz für Erwerbseinkommen und steuerbar; Taggelder KV/UV/IV sind vollumfänglich zu deklarieren. Zusammenhängende, selbst getragene Krankheitskosten sind separat als Abzug geltend
    zu machen (-> arzt-zahnarzt-rechnungen).
  - Bei Arbeitslosigkeit Bescheinigung der Arbeitslosenkasse beilegen; Erwerbslücken in der Steuererklärung ausdrücklich bezeichnen.
  kantone:
    ZH: 'Ziff. 3.3 (ALV, direkt ausbezahlte EO) und Ziff. 3.4 (KV/UV/IV/MV-Taggelder, Familienzulagen, Mutterschaft): Bescheinigungen sind beizulegen (WL ZH 2025 Ziff. 3.3/3.4).'
    SG: 'Ziff. 3.3 (IV/KV/UV) und 3.4 (ALV): Bescheinigung der Arbeitslosenkasse beilegen, soweit nicht im Lohnausweis (WL SG 2025 Ziff. 3.3-3.4).'
    AR: 'Gleiche Gliederung wie SG: Ziff. 3.3 / 3.4 (WL AR 2025 Ziff. 3.3-3.5).'
    TG: Taggelder aus Kranken-, Unfall- und Invalidenversicherung werden als Erwerbsausfallentschädigungen unter Ziff. 3.3 deklariert (WL TG 2025 Ziff. 3.3).
  quellen:
  - chunk: zh-wl-2025__c0054
    zitat: Die entsprechenden Bescheinigungen sind beizulegen.
  - chunk: sg-wl-2025__c0060
    zitat: Über nicht im Lohnausweis aufgeführte Bezüge ist eine
  - chunk: ar-wl-2025__c0053
    zitat: IV-Taggelder gehören zum steuerbaren Einkommen
  - chunk: bund-wl-lohnausweis-2026__c0052
    zitat: Anzahl der Tage mit Erwerbsausfallentschädigungen
  status: extrahiert
- id: bescheinigung-saeule3a
  name: Bescheinigung Säule 3a (Formular 21 EDP, Bank-/Versicherungsstiftung)
  erkennen:
  - Titel «Bescheinigung über Beiträge an anerkannte Formen der gebundenen Selbstvorsorge (Säule 3a)», Formular 21 EDP
  - 'Absender: Bankstiftung (z.B. Vorsorgekonto 3a) oder Versicherungsgesellschaft (3a-Police)'
  - 'Felder: Feld q «Total Beiträge an die Säule 3a», Datum der Einzahlungen, Ziffer 2 (Beiträge), Ziffer 3 (Einkäufe)'
  relevanz: ja
  zweck:
  - abzug
  positionen:
  - abzug.vorsorge.saeule3a
  - abzug.vorsorge.saeule3a_einkauf
  extrahieren:
  - Total der im Steuerjahr tatsächlich einbezahlten Beiträge (Feld q) je Vorsorgenehmer und je Vorsorgeträger
  - Einzahlungsdatum (massgebend ist das Jahr der effektiven Zahlung, nicht das Jahr der Gutschrift im Folgejahr)
  - Einkäufe in die Säule 3a (Ziffer 3, Feld x) separat vom ordentlichen Beitrag, mit Steuerperiode (Feld t)
  hinweise:
  - Bescheinigt wird das Total der Beiträge – nicht nur der steuerlich abziehbare Teil; die Begrenzung (Max.-Beträge mit/ohne 2. Säule) wendet der Bearbeiter an. Werte siehe Werte-Dateien (saeule3a.max_*).
  - Abzug nur für tatsächlich im Steuerjahr bezahlte Beiträge und nur bei AHV-pflichtiger Erwerbstätigkeit; bei Ehepaaren je Person mit eigenem Vertrag; Bescheinigung muss auf die erwerbstätige Person lauten.
  - 'Einkäufe in die Säule 3a (BVV 3 Art. 7a/7b): im Einkaufsjahr zusätzlich zum vollen ordentlichen Beitrag und nur separat bescheinigt (Ziffer 3); Abzug für Einkäufe erst ab Steuerperiode 2026 – Details
    in den Werte-Dateien (saeule3a.einkauf).'
  - 'Selbständigerwerbende: 3a-Beiträge sind Privatentnahmen, nie als Geschäftsaufwand in der Erfolgsrechnung zu verbuchen.'
  kantone:
    SG: Bescheinigung der Versicherung oder Bankstiftung (Form. 21 EDP) ist in jedem Fall beizulegen (WL SG 2025 Ziff. 13.1).
    AR: Bescheinigung (Form. 21 EDP) in jedem Fall beilegen (WL AR 2025 Ziff. 13.1).
    ZH: Bescheinigungen der Versicherung/Bankstiftung beilegen (WL ZH 2025 Ziff. 14).
    TG: Bescheinigung über Beiträge/Einkäufe 2. Säule und 3a ist Pflichtunterlage; Abzug setzt AHV/IV-pflichtige Erwerbstätigkeit voraus (WL TG 2025 Ziff. 13).
  quellen:
  - chunk: zh-wl-2025__c0081
    zitat: Der Steuererklärung sind die Bescheinigungen der Versicherung oder
  - chunk: bund-mb-21edp__c0013
    zitat: Total der Beiträge für anerkannte Formen der gebundenen Selbstvorsorge (Säule 3a)
  - chunk: sg-wl-2025__c0085
    zitat: Es dürfen nur die im Jahre
  - chunk: bund-mb-21edp__c0016
    zitat: Im Jahr, in dem der Einkauf erfolgt (Einkaufsjahr) kann maximal der kleine Säule 3a-Ab
  status: extrahiert
- id: bescheinigung-pk-einkauf
  name: Bescheinigung Einkauf Pensionskasse (2. Säule, Formular 21 EDP)
  erkennen:
  - 'Absender: Pensionskasse, Vorsorgestiftung, Sammelstiftung'
  - Titel «Bescheinigung Einkäufe in die berufliche Vorsorge», Formular 21 EDP (Einkauf von Beitragsjahren)
  - 'Begriffe: Einkaufssumme, Einkauf Beitragsjahre, freiwillige Einlage, Einkaufsberechnung/Einkaufsmöglichkeit'
  - Zahlungsdatum der Einzahlung
  relevanz: ja
  zweck:
  - abzug
  positionen:
  - abzug.vorsorge.saeule2_einkauf
  extrahieren:
  - Total der im Steuerjahr geleisteten Einkaufsbeiträge (jede Einzahlung mit genauem Datum)
  - Ordentliche Beiträge, soweit nicht bereits im Lohnausweis (Ziff. 10) abgezogen
  - Ggf. Einkaufsberechnung/Einkaufspotenzial; Hinweis auf frühere WEF-Vorbezüge
  hinweise:
  - Massgebend für die Zuordnung zum Steuerjahr ist das Jahr, in dem die Beiträge effektiv entrichtet wurden (nicht das Jahr der Verbuchung).
  - '3-Jahres-Sperrfrist: Einkäufe sind steuerlich nicht abziehbar, soweit innerhalb von drei Jahren ein Kapitalbezug erfolgt; Einkauf erst nach Rückzahlung früherer WEF-Vorbezüge zulässig (Art. 79b Abs.
    3 BVG).'
  - Rückzahlungen von WEF-Vorbezügen sind keine abziehbaren Einkäufe (separates WEF-Formular, nicht Formular 21 EDP).
  - Vom Lohn abgezogene Einkäufe sind im Lohnausweis (Ziff. 10.2) bescheinigt; selbst überwiesene nur mit Formular 21 EDP der Vorsorgeeinrichtung – nicht doppelt abziehen.
  kantone:
    AR: Bescheinigung der Vorsorgeträgerin ist in jedem Fall zusammen mit der Einkaufsberechnung beizulegen; Selbständigerwerbende deklarieren immer 100 % der Einkaufsbeiträge (WL AR 2025 Ziff. 13.2).
    ZH: Abziehbare Einkaufsbeiträge sind der Bescheinigung der Vorsorgeeinrichtung zu entnehmen (Ziff. 16.1); Sperrfrist 3 Jahre (WL ZH 2025 Ziff. 16.1).
    TG: 'Kapitalbezug innerhalb von 3 Jahren nach Einkauf und WEF-Vorbezug: siehe TG FAQ Vorsorge 2. und 3. Säule.'
  quellen:
  - chunk: zh-wl-2025__c0092
    zitat: Die abziehbaren Einkaufsbeiträge sind der von der Vorsorgeeinrichtung ausgestellten
  - chunk: zh-wl-2025__c0092
    zitat: Einkäufe steuerlich nicht zum Abzug zugelassen
  - chunk: ar-wl-2025__c0084
    zitat: Der Steuererklärung ist in jedem Fall die Bescheinigung der Vorsorgeträgerin bei
  - chunk: bund-mb-21edp__c0009
    zitat: Massgebend für die Zuordnung bei Einkäufen von Beitragsjahren ist das Jahr
  - chunk: tg-info-faq__c0028
    zitat: Gemäss Artikel 79b Absatz 3 Satz 2 BVG darf ein Einkauf von Beitragsjahren erst vorgenommen werden
  status: extrahiert
- id: steuerauszug-bank
  name: Steuerauszug der Bank / Post (inkl. eSteuerauszug)
  erkennen:
  - Titel «Steuerauszug», «Steuerverzeichnis», «eSteuerauszug» (Barcode am Ende des Dokuments)
  - 'Absender: Bank, Post/PostFinance, Vermögensverwalter, Neobroker'
  - 'Spalten: Valor/ISIN, Steuerwert 31.12., Bruttoertrag mit/ohne Verrechnungssteuer (A/B), Kontosaldo, Zinsen'
  - Gesamtübersicht aller Konti und Depots der Bank per 31.12.
  relevanz: ja
  zweck:
  - einkommen
  - vermoegen
  positionen:
  - einkommen.wertschriften
  - vermoegen.wertschriften_guthaben
  - verrechnungssteuer.rueckerstattung
  - abzug.verwaltungskosten_wertschriften
  extrahieren:
  - Steuerwert per 31.12. je Konto/Titel und Total (Vermögen)
  - Bruttoertrag Kolonne A (mit Verrechnungssteuer, 35 %) und Kolonne B (ohne Verrechnungssteuer)
  - Abgezogene Verrechnungssteuer, ausländische Quellensteuern (-> dividenden-ausland-quellensteuer)
  - Depotgebühren / Verwaltungskosten, soweit ausgewiesen
  hinweise:
  - Der Steuerauszug ersetzt Einzelauszüge der Bank für Konti und Depots; bei Papiereinreichung ist er vollständig beizulegen (nicht nur die Zusammenfassung).
  - Der eSteuerauszug kann in die Online-Steuererklärung importiert werden; die Werte werden danach mit der aktuellen Kursliste geprüft; fehlende Positionen (andere Banken, Kryptowerte, Darlehen) sind zu
    ergänzen.
  - 'Bei Veräusserung/Erwerb von Titeln im Jahr: Datum angeben und Bankbelege beilegen; Bruttoerträge verkaufter/rückbezahlter Titel sind ebenfalls zu deklarieren.'
  - Vermögen und Ertrag von minderjährigen Kindern (Jahrgang 2008 und jünger bei ZH) gehören in die Steuererklärung der Eltern; Ansprüche an 2. Säule/3a sind bis zur Fälligkeit steuerfrei und nicht aufzuführen.
  kantone:
    SG: Steuerauszüge sind bei Papiereinreichung immer komplett dem Formular 2 beizulegen, auch wenn in E-Tax SG importiert; bei vollständigem eFiling erfolgt die Übermittlung automatisch (WL SG 2025 Formular
      2 Beilagen).
    AR: Werden die Gesamtbeträge der Steuerauszüge in Formular 2 übertragen, sind die Auszüge vollständig beizulegen (WL AR 2025 Formular 2 Beilagen).
    ZH: eSteuerauszug (Barcode) kann in die Online-Steuererklärung importiert werden (WL ZH 2025 Wertschriftenverzeichnis).
  quellen:
