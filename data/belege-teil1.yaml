  - chunk: ar-wl-2025__c0129
    zitat: sind die Auszüge für Steuerzwecke
  - chunk: zh-wl-2025__c0153
    zitat: Sie können diesen eSteuerauszug in die Online-
  - chunk: zh-wl-2025__c0156
    zitat: Für steuerliche Zwecke eignen sich die von den Banken – auf Wunsch des Kunden – erstellten
  - chunk: zh-wl-2025__c0155
    zitat: entweder in der Kolonne A oder Kolonne B einzutragen
  status: extrahiert
- id: kontoauszug-zinsausweis
