# Kontrolliertes Vokabular des Steuer-Wikis (Schlüssel bleiben über Jahre/Kantone stabil).
# Neue Schlüssel nur ergänzen, nie umbenennen (Zitate/Chunks verweisen darauf).

jurisdiktionen:
  bund: Bund (DBG, StHG, VStG, ESTV-Praxis)
  ar: Appenzell Ausserrhoden
  sg: St. Gallen
  tg: Thurgau
  zh: Zürich

dokumenttypen: [gesetz, verordnung, weisung, kreisschreiben, rundschreiben, merkblatt, wegleitung, formular, praxis, steuerfuss, tarif, mitteilung, info, portal, tool]

# Status eines Werts/einer Zuordnung (Vertrauensstufen)
status:
  offen: noch nicht erfasst
  extrahiert: vom Agenten aus der Quelle übernommen (mit wörtlichem Zitat)
  agent-geprueft: von unabhängigem Prüf-Agenten gegen die Quelle bestätigt
  verifiziert: von einer Fachperson bestätigt – nur Menschen setzen diesen Status
  strittig: Quellen widersprechen sich – Entscheid durch Fachperson nötig
  na: für diese Jurisdiktion/dieses Jahr nicht anwendbar

