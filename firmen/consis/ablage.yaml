  gruppen:
  - beleg-einzureichen
  aktiv: true
  bemerkung: 'Prozess: NP / JP'
- nr: 5
  name: Belege Sonstiges
  klasse: StE
  erklaerung: Grundsätzlich alle relevanten Belege, die in der Steuerdeklaration einen Wert bzw. Eintrag haben, aber nicht eingereicht werden müssen. Z. B. Wertschriftenverzeichnis, Nachweise zu Edelmetallen/Gold
    und Bitcoins, Liegenschaftsrechnungen und Nachweise zu Weiterbildungskosten (soweit nicht einzureichen).
  eingereicht: nein
