- nr: 4
  name: Belege eingereicht
  klasse: StE
  erklaerung: Sämtliche Belege, die per Online-Übermittlung über Dr. Tax an das Steueramt gehen. Welche Belege eingereicht werden müssen, zeigen die Wegleitungen der Kantone bzw. Gemeinden. Sobald ein Beleg
    eingereicht werden muss oder eingereicht wurde, wird er hier abgelegt.
