- nr: 1
  kategorie: Übermittlungsbestätigung
  inhalt: Quittung, dass die Steuerdeklaration eingereicht ist. Wird aktuell von Dr. Tax generiert, wenn consis digital über Dr. Tax einreicht.
  prozess: NP / JP
  eingereicht: nein
  anzahl_dokumentarten: 1
- nr: 2
  kategorie: Fristenliste NP
  inhalt: Nur für die Fristenkontrolle, Bearbeitung und Verlängerung (Fristerstreckung) der Steuererklärungen natürlicher Personen. Keine Ablage von Belegen im Steuerprozess.
  prozess: NP (nur Fristen)
  eingereicht: nein
  anzahl_dokumentarten: 2
- nr: 3
  kategorie: Fristenliste JP
  inhalt: Betrifft nur juristische Personen. Im Prozess StE NP nicht verwenden.
  prozess: nur JP
  eingereicht: –
  anzahl_dokumentarten: 0
- nr: 4
  kategorie: Belege eingereicht
  inhalt: Sämtliche Belege, die per Online-Übermittlung über Dr. Tax an das Steueramt gehen. Welche Belege eingereicht werden müssen, zeigen die Wegleitungen der Kantone bzw. Gemeinden. Sobald ein Beleg
    eingereicht werden muss oder eingereicht wurde, wird er hier abgelegt.
  prozess: NP / JP
  eingereicht: ja
  anzahl_dokumentarten: 8
- nr: 5
  kategorie: Belege Sonstiges
  inhalt: Grundsätzlich alle relevanten Belege, die in der Steuerdeklaration einen Wert bzw. Eintrag haben, aber nicht eingereicht werden müssen. Z. B. Wertschriftenverzeichnis, Nachweise zu Edelmetallen/Gold
    und Bitcoins, Liegenschaftsrechnungen und Nachweise zu Weiterbildungskosten (soweit nicht einzureichen).
  prozess: NP / JP
  eingereicht: nein
  anzahl_dokumentarten: 10
- nr: 6
  kategorie: Verlustverrechnung
  inhalt: Nur bei juristischen Personen, nicht bei natürlichen Personen.
  prozess: nur JP
  eingereicht: –
  anzahl_dokumentarten: 0
- nr: 7
  kategorie: Steuerausscheidung
  inhalt: Der Teil der Steuerausscheidung, der aus der Steuerdeklaration hervorgeht.
  prozess: NP / JP
  eingereicht: ja
  anzahl_dokumentarten: 1
- nr: 8
  kategorie: Deklaration
  inhalt: 'Steuererklärung: Deklarationsentwürfe und finale Versionen.'
  prozess: NP / JP
  eingereicht: finale Version ja
  anzahl_dokumentarten: 4
- nr: 9
  kategorie: Deklaration unterjährig
  inhalt: Nur wenn keine volle Steuerperiode (01.01.–31.12.) besteht, z. B. Tod, Wegzug ins Ausland oder Zuzug aus dem Ausland.
  prozess: NP
  eingereicht: ja
  anzahl_dokumentarten: 1
- nr: 10
  kategorie: Unterlagen Kunde
  inhalt: 'Vor allem Informationen des Kunden, z. B. per E-Mail: zusätzliche Angaben, Antworten auf Fragen oder Pendenzen, die dokumentiert werden sollen.'
