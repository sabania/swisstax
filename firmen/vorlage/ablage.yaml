# Vorlage Firmen-Adapter: am einfachsten in Excel pflegen (tools/firma_kategorien.py vorlage/import).
firma: <firmenname>
system: <Ablagesystem, z.B. M-Files, SharePoint, Ordner>
stand: <datum>
status: Vorlage
beschreibung: 'Je Kategorie: Name, Klasse/Ablageort, was hinein gehört, ob eingereicht, und welche Ablagegruppen des Wikis hierher gehören.'
kategorien:
- nr: 1
  name: <Kategorie>
  klasse: <Klasse/Ordner>
  erklaerung: <was hinein gehört>
  eingereicht: <ja/nein>
  gruppen:
  - beleg-einzureichen
  aktiv: true
dokumentarten:
- nr: 1
  dokumentart: <Dokumentart>
  beispiele: <Beispiele>
  kategorie: <Kategorie>
  typen:
  - lohnausweis
  fest: false
